 PDL:0 "Podillia"
 PDL_ADJ:0 "Podilian"
 PDL_confessional_equilibrium_desc:0 "Orthodox, Catholic, and Protestant communities must find balance and coexist peacefully."
 PDL_confessional_equilibrium_title:0 "Confessional Equilibrium"
 PDL_conquer_red_ruthenia_desc:0 "Red Ruthenia, with its prosperous cities, should be incorporated into our growing realm."
 PDL_conquer_red_ruthenia_title:0 "Conquer Red Ruthenia"
 PDL_cultural_renaissance_desc:0 "Through the patronage of learning, art, and architecture, Podillia shall flourish as a beacon of civilization."
 PDL_cultural_renaissance_title:0 "Cultural Renaissance"
 PDL_declare_independence_desc:0 "We must sever our ties with foreign overlords and establish Podillia as a sovereign power in the region."
 PDL_declare_independence_title:0 "Declare Independence"
 PDL_expand_eastward_desc:0 "The lands east of the Dnieper offer opportunity for expansion and dominion."
 PDL_expand_eastward_title:0 "Expand Eastward"
 PDL_fortify_podillia_desc:0 "Control of the key fortresses of Podillia is essential to our security. Let us ensure our strongholds are well-defended and garrisoned."
 PDL_fortify_podillia_title:0 "Fortify Podillia"
 PDL_galician_compact_desc:0 "An alliance with Galicia would bring mutual benefit and strengthen both our realms against common threats."
 PDL_galician_compact_title:0 "Galician Compact"
 PDL_grand_podillia_desc:0 "From fortress to frontier, from trade to conquest—Podillia shall stand as a great power."
 PDL_grand_podillia_title:0 "Grand Podillia"
 PDL_host_assembly_desc:0 "The Cossack assembly gathers. Let us leverage their strength and organizational prowess for our benefit."
 PDL_host_assembly_title:0 "Assemble the Host"
 PDL_ideas:0 "Podilian Ideas"
 PDL_ideas_bonus:0 "Podilian Ambitions"
 PDL_ideas_start:0 "Podilian Traditions"
 PDL_jewish_communities_desc:0 "Jewish merchants and craftsmen bring prosperity and learning. We shall ensure their safety and success in our realm."
 PDL_jewish_communities_title:0 "Support Jewish Communities"
 PDL_kamianets_capital_desc:0 "Kamianets-Podilskyi shall be the jewel of our realm. Let us develop it into a mighty center of trade and culture."
 PDL_kamianets_capital_title:0 "Develop Kamianets"
 PDL_kamianets_development_desc:0 "Through economic development and construction, Kamianets-Podilskyi shall become the greatest city in the region."
 PDL_kamianets_development_title:0 "Develop Kamianets"
 PDL_khotyn_fortress_desc:0 "Khotyn stands as the gateway to Podillia from the south. A fortress of the highest caliber would serve as an impenetrable bulwark against Ottoman advances."
 PDL_khotyn_fortress_title:0 "Fortify Khotyn"
 PDL_khotyn_siege_desc:0 "Our fortress at Khotyn stands strong. Let us prove its worth by defeating an Ottoman assault and proving our military prowess."
 PDL_khotyn_siege_title:0 "The Khotyn Siege"
 PDL_magnate_authority_desc:0 "The magnates form the backbone of our realm. We must establish their influence and secure their loyalty."
 PDL_magnate_authority_title:0 "Establish Magnate Authority"
 PDL_magnate_sejm_desc:0 "The magnates gather in assembly. Through this noble body, we shall govern Podillia with wisdom and strength."
 PDL_magnate_sejm_title:0 "Convene Magnate Sejm"
 PDL_merchant_networks_desc:0 "Podillian merchants shall dominate the trade routes and bring prosperity to our realm."
 PDL_merchant_networks_title:0 "Establish Merchant Networks"
 PDL_podillian_granaries_desc:0 "The fertile lands of Podillia can feed not only ourselves but also generate wealth through the grain trade."
 PDL_podillian_granaries_title:0 "Build Granaries"
 PDL_recruit_cossacks_desc:0 "The Cossacks of the steppes are formidable warriors. Let us recruit their cavalry to strengthen our forces."
 PDL_recruit_cossacks_title:0 "Recruit Cossacks"
 PDL_religious_tolerance_desc:0 "Podillia has always been a land of diverse faiths. Let us formally establish tolerance and protect all communities."
 PDL_religious_tolerance_title:0 "Religious Tolerance"
 PDL_secure_crimea_raids_desc:0 "Our Cossack cavalry can raid Crimea and strike fear into the hearts of our enemies."
 PDL_secure_crimea_raids_title:0 "Secure Crimea Raids"
 PDL_steppe_mastery_desc:0 "Podillia's power extends beyond its settled lands. We must dominate the steppe regions and ensure our cavalry supremacy."
 PDL_steppe_mastery_title:0 "Master the Steppes"
 PDL_trade_corridor_desc:0 "With Galicia as our ally, we can establish a prosperous trade corridor linking our realms."
 PDL_trade_corridor_title:0 "Trade Corridor"
 PDL_unite_podillia_desc:0 "All Podillian lands must be brought under our control to establish a strong unified state."
 PDL_unite_podillia_title:0 "Unite Podillia"
 PDL_withstand_ottoman_threat_desc:0 "The Ottomans test our resolve. We must prove that Podillia can stand against the mightiest power of the age."
 PDL_withstand_ottoman_threat_title:0 "Withstand Ottoman Threat"
 PEOPLES_COMMISSAR:0 "Citizen-Voivode"
 PEOPLES_REPUBLIC:0 "Citizens' Republic"
