 rip_church_recognize_rite_button:0 "Guarantee community rights"
 rip_church_recognize_rite_button_tt:0 "Gameplay abstraction: guarantee the rights represented for this province's Orthodox or Catholic community. This province-level marker is a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The province keeps its religion; it is not converted and does not enter the Union. Costs 1 ADM per development and lasts at least ten years. Unrest falls by 2, plus 0.5 from the protected local tradition; local tax falls by 15% and manpower by 20%. The tax and manpower reductions are a game-design interpretation of the administrative compromise of protecting local arrangements and autonomy, not a penalty for another faith and not a documented historical formula. After the ecumenical settlement: unrest -3, tax -10%, manpower -15%."
 rip_church_reconcile_button:0 "Negotiate reconciliation"
 rip_church_reconcile_button_tt:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
 rip_church_reconcile_desc:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
 rip_church_reconcile_title:0 "Reconcile with the eastern patriarchates"
 rip_church_reconciliation_unrest:0 "Opposition to reconciliation"
 rip_church_request_recognition_desc:0 "Seek recognition within the wider Orthodox communion from 1589. Delay leaves the question open; rejection is a deliberate alternative schism. Constantinople need not be an independent state."
 rip_church_request_recognition_title:0 "Seek recognition of our patriarchate"
 rip_church_revoke_rite_button:0 "Revoke community rights"
 rip_church_revoke_rite_button_tt:0 "After at least ten years, revoke the guarantee. No refund. The province gains +3 unrest for ten years. Revoking counts as forced integration, which invites Orthodox backlash and bars the ecumenical settlement for ten years."
 rip_church_rite:0 "Guaranteed community rights"
 rip_church_rite_affordable_tt:0 "We hold 1 ADM for every point of development in this province."
 rip_church_rite_ecumenical:0 "Ecumenical accommodation"
 rip_church_rite_favoured:0 "Protected local tradition"
 rip_church_rite_heading:0 "COMMUNITY RIGHTS"
 rip_church_rite_heading_tt:0 "COMMUNITY RIGHTS"
 rip_church_rite_help:0 "Gameplay abstraction: not an exact parish or canonical status, or proof of voluntary Union acceptance. The province keeps its faith; no conversion is implied. Costs §Y1 ADM per development§!; lasts at least 10 years. Unrest -2 (-0.5 from protected tradition); tax -15%, manpower -20%; no religious-unity penalty. Game-design interpretation: tax and manpower reductions model the administrative compromise of protecting local arrangements and autonomy—not a penalty for another faith and not a documented historical formula. After ecumenical settlement: unrest -3, tax -10%, manpower -15%. Revoke: +3 unrest for 10 years."
 rip_church_rite_help_tt:0 "This province-level marker is a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The province keeps its religion; it is not converted and does not enter the Union. While the guarantee stands, Union backlash events and Muscovite missionary networks skip the province. The ecumenical settlement deepens it to unrest -3, tax -10% and levies -15%. It lapses if the owner leaves the Union or the province changes faith. Orthodox and Muscovite Orthodox provinces count as Eastern in the country panel, Catholic provinces as Latin. Only a Greek Catholic owner can guarantee rights. Eastern and Latin are gameplay groupings, not historical diocesan boundaries. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 rip_church_rite_recognized:0 "Gameplay abstraction: community rights are guaranteed in this province. This is not an exact canonical status or evidence of voluntary Union acceptance; the province keeps its faith."
 rip_church_rite_revoked:0 "Revoked community rights"
