 crimean_slave_raids_suffered:0 "Suffered Crimean Slave Raids"
 crimean_yasyr_market:0 "Kaffa Slave Market"
 crossroads_of_rus:0 "Crossroads of Rus'"
 crossroads_of_rus_desc:0 "Minsk occupies the geographic center of Belarus, where trade routes from Vilnius, Smolensk, Polotsk, and Kyiv intersect. This strategic position brings commercial prosperity."
 crusade_contributor_bronze:0 "Crusade Contributor (Bronze)"
 crusade_contributor_bronze_desc:0 "Our deeds in the crusade have earned modest renown."
 crusade_contributor_gold:0 "Crusade Contributor (Gold)"
 crusade_contributor_gold_desc:0 "Our outstanding service in the crusade is legendary."
 crusade_contributor_silver:0 "Crusade Contributor (Silver)"
 crusade_contributor_silver_desc:0 "Our efforts in the crusade are widely celebrated."
 crusade_religious_fervor:0 "Crusade Religious Fervor"
 crusade_religious_fervor_desc:0 "The crusade has inspired intense religious devotion among the people."
 cultural_integration_program:0 "Cultural Integration Program"
