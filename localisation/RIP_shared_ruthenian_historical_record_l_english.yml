l_english:
 rip_record_baturyn_title:0 "Baturyn Burned"
 rip_record_baturyn_desc:0 "In 1708 troops under Aleksandr Menshikov destroyed Baturyn after Hetman Ivan Mazepa broke with Peter I. Civilians as well as defenders were killed. The loss of households, workshops and records outlasted the fighting."
 rip_historical_record.1.t:0 "The Households of Baturyn"
 rip_historical_record.1.d:0 "Families from the Siverian towns ask for a guarantee that a commander's accusation of treason will not strip an entire household of its home. Who will hear their claims?"
 rip_historical_record.1.a:0 "Place survivors' housing claims before a civilian court."
 rip_historical_record.1.b:0 "Uphold collective forfeiture."
 rip_record_chortomlyk_title:0 "Chortomlyk"
 rip_record_chortomlyk_desc:0 "In 1709 Russian troops destroyed the Chortomlyk Sich after its leadership sided with Mazepa. Defenders who surrendered on a promise of safety were killed. Survivors established another Sich at Kamianka."
 rip_historical_record.2.t:0 "The Chortomlyk Sich"
 rip_historical_record.2.d:0 "The Host asks whether people returning to the lower Dnieper may rebuild their settlements and assemble under their own elders."
 rip_historical_record.2.a:0 "Recognise the returning households and their elders."
 rip_historical_record.2.b:0 "Prohibit the assembly."
 rip_record_presses_title:0 "Silenced Presses"
 rip_record_presses_desc:0 "Peter I's decree of 1720 restricted the presses of Kyiv and Chernihiv. Even permitted reprints were required to conform to Russian editions. The order reached into the spelling and wording a local printer could put on a page."
 rip_historical_record.3.t:0 "The Decree on the Presses"
 rip_historical_record.3.d:0 "The printers have a devotional book ready. Must they wait for the approved edition, or may they publish in the words their readers know?"
 rip_historical_record.3.a:0 "Grant the presses their own editorial charter."
 rip_historical_record.3.b:0 "Require conformity with the authorised text."
 rip_record_ladoga_title:0 "Canal Levies"
 rip_record_ladoga_desc:0 "In the 1720s Peter I requisitioned Ukrainian Cossacks for forced labour on the Ladoga Canal. Men taken from their households faced exhausting work far from home."
 rip_historical_record.4.t:0 "The Ladoga Work Rolls"
 rip_historical_record.4.d:0 "The works office wants the regiments to fill another labour quota. Their communities ask for the right to decline and for wages for those who agree to go."
 rip_historical_record.4.a:0 "Replace compulsory service with paid contracts."
 rip_historical_record.4.b:0 "Enforce the labour quota."
 rip_record_polubotok_title:0 "Jailed Envoys"
 rip_record_polubotok_desc:0 "Peter I imprisoned acting hetman Pavlo Polubotok and fellow officers in 1723 amid a dispute over the government of the Hetmanate. Polubotok died in custody in 1724."
 rip_historical_record.5.t:0 "A Petition behind Bars"
 rip_historical_record.5.d:0 "A delegation asks the court to hear its grievances and let its members return home. The chancellery wants the power to detain petitioners while it examines their complaints."
 rip_historical_record.5.a:0 "Issue safe conducts and hear the delegation."
 rip_historical_record.5.b:0 "Allow detention without a hearing."
 rip_record_new_sich_title:0 "The Last Sich"
 rip_record_new_sich_desc:0 "In 1775 Catherine II's army under Petro Tekeli surrounded and dismantled the New Sich. The imperial manifesto abolished the Zaporozhian Host as an institution. Its members lost their collective political rights."
 rip_historical_record.6.t:0 "A Host Struck from the Rolls"
 rip_historical_record.6.d:0 "The imperial council is considering what should become of the Host's common lands. The winter settlements ask that their rights survive the transfer of authority."
 rip_historical_record.6.a:0 "Confirm the settlements' common land rights."
 rip_historical_record.6.b:0 "Dispose of the common lands as crown property."
 rip_record_solovki_title:0 "Solovki Exile"
 rip_record_solovki_desc:0 "After the destruction of the New Sich, its last kish otaman, Petro Kalnyshevsky, was sent to the Solovetsky monastery in 1776. Exile removed him from his community for decades."
 rip_historical_record.7.t:0 "The Prisoner on Solovki"
 rip_historical_record.7.d:0 "The council proposes indefinite confinement for former leaders of the Host. Their families ask for a public hearing and a limit on the term of detention."
 rip_historical_record.7.a:0 "Review the sentences and permit the prisoners' return."
 rip_historical_record.7.b:0 "Uphold indefinite exile."
 rip_record_serfdom_title:0 "Bound to Land"
 rip_record_serfdom_desc:0 "Catherine II's decree of 1783 entrenched serfdom on the Ukrainian Left Bank by forbidding peasants to leave the estates where they were registered. A register of taxpayers became a barrier to movement."
 rip_historical_record.8.t:0 "Households Bound to the Estate"
 rip_historical_record.8.d:0 "Landowners ask the authorities to turn back families who have moved since the last census. The village delegates want their right to move written into the district register."
 rip_historical_record.8.a:0 "Guarantee freedom of movement."
 rip_historical_record.8.b:0 "Bind peasant households to the register."
 rip_record_solonytsia_title:0 "Solonytsia"
 rip_record_solonytsia_desc:0 "In 1596 the Crown army besieged Severyn Nalyvaiko's rebels near Lubny. During surrender negotiations Crown soldiers killed Cossacks in the camp. Nalyvaiko was taken to Warsaw and executed the following year."
 rip_historical_record.9.t:0 "The Camp at Solonytsia"
 rip_historical_record.9.d:0 "The Crown must decide whose word binds its soldiers when a camp agrees to surrender. Families ask for safe conduct and a hearing for claims against the army."
 rip_historical_record.9.a:0 "Guarantee safe conduct and hear claims for restitution."
 rip_historical_record.9.b:0 "Let the commanders dismiss the complaints."
 rip_record_kodnia_title:0 "Kodnia Trials"
 rip_record_kodnia_desc:0 "After the Koliivshchyna uprising of 1768, the Commonwealth's military court at Kodnia imposed death sentences in the reprisals. Its surviving books also contain ordinary criminal cases. A place in the register alone does not establish what a prisoner did."
 rip_historical_record.10.t:0 "The Military Court at Kodnia"
 rip_historical_record.10.d:0 "The district brings cases arising from the suppression of a revolt. Families ask to see the accusations and to appeal before sentences are carried out."
 rip_historical_record.10.a:0 "Provide individual hearings and a right of appeal."
 rip_historical_record.10.b:0 "Let the military sentences stand without review."
 rip_record_kyiv_captives_title:0 "Kyiv Captives"
 rip_record_kyiv_captives_desc:0 "In 1482 the army of Khan Mengli Giray sacked Kyiv and carried inhabitants into captivity. Objects looted from the city were sent to Moscow. For the families taken south, the raid continued long after the army left Kyiv."
 rip_historical_record.11.t:0 "The Families Taken from Kyiv"
 rip_historical_record.11.d:0 "Relatives have traced captives to the khanate. They ask for release and passage home. The treasury can meet the claims, or the court can recognise the holders' demands for ransom."
 rip_historical_record.11.a:0 "Pay for release and the journey home."
 rip_historical_record.11.b:0 "Uphold the ransom claims."
 rip_record_ladyzhyn_title:0 "Ladyzhyn"
 rip_record_ladyzhyn_desc:0 "During the Ottoman advance into Podilia in 1674, Ladyzhyn fell and was burned. Captivity as well as the loss of homes marked the experience of those caught in the campaign."
 rip_historical_record.12.t:0 "The Burning of Ladyzhyn"
 rip_historical_record.12.d:0 "Petitions from the Bratslav district ask for the right to return to burned homesteads. The provincial treasury must decide whether households will owe taxes while they rebuild."
 rip_historical_record.12.a:0 "Remit the arrears and fund the return."
 rip_historical_record.12.b:0 "Demand the tax arrears in full."
 rip_record_volhynian_expulsion_title:0 "Exiled Families"
 rip_record_volhynian_expulsion_desc:0 "In 1495 Grand Duke Alexander expelled the Jews from Lithuania, including Jewish communities in its Ruthenian lands. Permission to return followed in 1503. A return decree still left families facing the question of who held their homes."
 rip_historical_record.13.t:0 "Expulsion from the Grand Duchy"
 rip_historical_record.13.d:0 "Jewish households in Volhynia ask for security of residence and a court where they can prove title to their property. The grand duke's answer will determine whether they can remain."
 rip_historical_record.13.a:0 "Guarantee residence and hear the property claims."
 rip_historical_record.13.b:0 "Uphold the order of expulsion."
 rip_record_unredressed:0 "Grievances Left Unheard"
 desc_rip_record_unredressed:0 "Local families have been denied a hearing. Resentment of the authorities persists."
