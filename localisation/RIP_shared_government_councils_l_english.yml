 # --- the Palace of the Grand Dukes

 vilnius_palace:0 "Palace of the Grand Dukes"
 vilnius_palace_desc:0 "The lower castle at Vilnius, rebuilt in the Italian manner for a court that had been ruling from horseback and tents. The council sits here, the chancery writes here, the Statute was printed under this roof, and every envoy who wants the Grand Duchy rather than the Crown is lodged here on purpose."
 vilnius_palace_seat_tt:0 "The owner rules the Grand Duchy"
 vilnius_palace_upgrade_tt:0 "We are at peace"

 lit_palace.1.t:0 "The Italians at Vilnius"
 lit_palace.1.d:0 "The masons have finished, and the building does not look like anything else between here and Krakow: arcades on the courtyard, glass in the upper windows, and a hall long enough to seat the council with room to argue. The Grand Duchy has stopped being ruled out of a saddlebag. What moves in with the court is the question."
 lit_palace.1.a:0 "Move the chancery in"
 lit_palace.1.b:0 "Keep the court on the road"

 lit_palace.2.t:0 "The Palace Is Stripped"
 lit_palace.2.d:0 "The city is taken and the palace has been emptied room by room: the tapestries, the plate, the library, the roof lead. The walls stand and nothing inside them does. An inventory is being drawn up, in another country, of things that used to be here."
 lit_palace.2.a:0 "Rebuild what can be rebuilt"
 lit_palace.2.b:0 "Let it stand empty"

 rip_palace_seat_of_the_chancery:0 "Seat of the Chancery"
 rip_palace_stripped:0 "The Palace Stripped"

 # --- diplomatic actions

 rip_offer_hadiach_terms:0 "Offer the Hadiach Terms"
 rip_offer_hadiach_terms_desc:0 "Offer a Grand Duchy of Ruthenia standing beside Poland and Lithuania: its own chancery, its own courts, its own army and its own seat at the diet. The offer was made once and ratified thin, and the war resumed. It can be made properly."
 rip_grant_the_princely_charter:0 "Grant the Princely Charter"
 rip_grant_the_princely_charter_desc:0 "Write down what the princedom keeps - its courts, its levy, its own name in its own charters - and seal it. A subject that has been given something in writing argues about smaller things afterwards."

 rip_hadiach_compact:0 "The Hadiach Compact"
 rip_princely_charter:0 "The Princely Charter"
 desc_rip_princely_charter:0 "The overlord has confirmed our princely rights by charter. This settlement strengthens the prince's legitimacy, eases unrest and reduces our desire for independence."

 # --- Hadiach: the offer, the ratification, and what came back

 hadiach.1.t:0 "The Articles Go to the Sejm"
 hadiach.1.d:0 "What was agreed is now a draft, and a draft has to pass a house that was not at the table. The article that will decide it is the one giving the Duchy an army of its own; the benches have already begun calling that number impossible. Everything else can be argued about afterwards, and will be."
 hadiach.1.a:0 "Put the full articles before the Sejm"
 hadiach.1.b:0 "Let the Sejm thin it"
 hadiach.1.c:0 "Withdraw the articles"

 hadiach.2.t:0 "What Came Back From the Sejm"
 hadiach.2.d:0 "The text that was ratified is not the text that was signed. The seat at the diet is there, the chancery is there, and the army has been cut to a number that would not hold a single palatinate. The men who negotiated at Hadiach are being asked, in public, what exactly they brought home."
 hadiach.2.a:0 "Take what was ratified"
 hadiach.2.b:0 "Repudiate it"

 hadiach.3.t:0 "The Grand Duchy of Ruthenia"
 hadiach.3.d:0 "It passed whole: a third member with its own chancery, its own courts, its own treasury, its own army and its own seat at the diet, sworn by a king who spent his own credit to get it through. Nobody involved expects it to be easy. Everybody involved understands that it has never been done before."
 hadiach.3.a:0 "Seal it in all three chanceries"

 rip_hadiach_thinned:0 "The Thinned Articles"

 # --- the udil

 rip_grant_the_udil:0 "Grant an Udil"
 rip_grant_the_udil_desc:0 "Hand the subject over as a kinsman's portion rather than a governor's district: it may not be annexed, may not be integrated, will never rank above a duchy, and pays half. It is how this realm is held together, and it is also how it comes apart."
 rip_held_as_an_udil:0 "Held as an Udil"
 desc_rip_held_as_an_udil:0 "Our land is held as a prince's udil. Recognition of this dynastic grant strengthens legitimacy, eases unrest and supports the local levy."
 hadiach.4.t:0 "The Diet Sits on the Articles"
 hadiach.4.d:0 "The articles are read out in full and the chamber does not sit quietly through them."
 hadiach.4.a:0 "Wait for the vote."
 hadiach.5.t:0 "The Diet Carries the Articles"
 hadiach.5.d:0 "It passed as it was signed. The Duchy has its chancery, its courts, its treasury and its own hetman answering to the diet rather than to the crown, and the lords whose estates lie east of the Dnieper voted for it with their hands and against it with their faces. The third seat exists. Everything that follows will be an argument about what sits in it."
 hadiach.5.a:0 "Enter it in the constitutions."
 hadiach.6.t:0 "The Diet Carries Something Else"
 hadiach.6.d:0 "What came out of the chamber has the same title and not the same text. The Duchy's army is a token, the Union stands where it stood, and the nobilitations are a hundred once rather than a hundred a year. The men who signed at Hadiach will read this and know exactly what was done to them, because it is what is always done. The lords are pleased. They will be less pleased when the register answers."
 hadiach.6.a:0 "Send it east and hope."
 rip_revoke_the_udil:0 "Revoke the Udil"
 rip_revoke_the_udil_desc:0 "The portion was given to a kinsman and a kinsman does not give it back. Taking it is done by the same hand that gave it, in front of everyone who was given one, and each of them will spend tonight counting how many swords he could raise. Rome takes back a legateship; a senior prince takes back a birthright."
 rip_ask_to_expand_the_register:0 "Ask to Expand the Register"
 rip_ask_to_expand_the_register_desc:0 "The register is the list of Cossacks the crown pays and therefore admits to exist. Enlarging it puts men on the roll before a campaign, and every man on the roll is one the starosta can no longer treat as a runaway. It has been enlarged before a war and quietly cut after it often enough that the Host counts the promise, not the parchment."
 rip_petition_to_confirm_the_register:0 "Petition to Confirm the Register"
 rip_petition_to_confirm_the_register_desc:0 "Not a larger register - the register we have, set down in a charter that outlives the campaign it was raised for. The Host has asked at Kurukove, at Pereiaslav and at Boryspil, and has been enlarged for a war and cut after it every time. Asking again costs nothing. Being refused again costs a great deal."
 rip_hadiach_offer_refused:0 "The Articles Were Refused"
 desc_rip_hadiach_offer_refused:0 "The offer was made and turned down. It will not be made again while the men who refused it are still at the table."
 rip_the_udil_revoked:0 "An Udil Was Taken Back"
 desc_rip_the_udil_revoked:0 "The senior prince took back what he had given. Every other kinsman holding a portion heard about it within the month, and none of them has stopped thinking about it since."
 rip_register_asked_recently:0 "The Register Was Lately Argued"
 desc_rip_register_asked_recently:0 "The roll has been argued over once this decade already, and neither court wants to open it again so soon."
 rip_register_confirmed:0 "The Register Confirmed"
 desc_rip_register_confirmed:0 "The roll is written into a charter rather than agreed before a campaign and forgotten after it. A Cossack on a confirmed register knows what he is, which is the whole of what was ever being asked for."
 EST_VAL_RIP_PRINCELY_CHARTER:0 "Granted a princely charter"
 rip_the_rota_1:0 "The Rota: One Portion"
 desc_rip_the_rota_1:0 "One kinsman holds land of his own, and one claim stands in the line of seniority behind yours."
 rip_the_rota_2:0 "The Rota: Two Portions"
 desc_rip_the_rota_2:0 "Two kinsmen hold land of their own. They have not yet worked out that they outnumber you, and they will."
 rip_the_rota_3:0 "The Rota: Three Portions"
 desc_rip_the_rota_3:0 "Three kinsmen hold land of their own. The seniority that decides who follows you is now an argument with three sides and no arbiter."
 rip_the_rota_4:0 "The Rota: Four Portions"
 desc_rip_the_rota_4:0 "Four kinsmen hold land of their own. The realm is held together by the same thing that is pulling it apart, and everyone at court can name it."
 rip_the_rota_5:0 "The Rota: Five Portions"
 desc_rip_the_rota_5:0 "Five kinsmen hold land of their own. This is the arrangement that ended the Kyivan realm, and it ended it exactly here - not in a war, but in a succession nobody could settle."
 rip_offer_hadiach_terms_title:0 "Offer the Hadiach Terms"
 rip_offer_hadiach_terms_tooltip:0 "Offer a Ruthenian court the articles agreed at Hadiach: a third seat beside Poland and Lithuania, if the diet will carry it."
 rip_offer_hadiach_terms_dialog:0 "[This.GetName] offers us the articles of Hadiach: a Grand Duchy standing beside the Crown and the Grand Duchy, with our own chancery, our own courts and our own hetman. It is everything the Host has asked for since Zboriv. It is also a text that has to pass their diet, and we have watched what their diet does to texts."
 rip_offer_hadiach_terms_alert_tooltip:0 "The Hadiach articles have been offered to us"
 rip_grant_the_princely_charter_title:0 "Grant the Princely Charter"
 rip_grant_the_princely_charter_tooltip:0 "Write down what the princedom may keep. It argues about smaller things afterwards, and the nobility that witnessed it will hold you to it."
 rip_grant_the_udil_title:0 "Grant an Udil"
 rip_grant_the_udil_tooltip:0 "Hand a kinsman a portion of the realm. Each one held is another claim in the line of seniority, and the cost rises with the count."
 rip_revoke_the_udil_title:0 "Revoke the Udil"
 rip_revoke_the_udil_tooltip:0 "Take the portion back. He keeps his throne as an ordinary vassal, gains a claim on you, and every other kinsman holding a portion will hear of it."
 rip_ask_to_expand_the_register_title:0 "Ask to Expand the Register"
 rip_ask_to_expand_the_register_tooltip:0 "Ask the Host to put more men on the roll before the campaign. Men on the roll are men the starosta can no longer call runaways."
 rip_ask_to_expand_the_register_dialog:0 "[This.GetName] asks us to enlarge the register before the campaign. More of ours on the roll is more of ours the lords cannot touch - and the roll has been enlarged before a war and cut after it often enough that the Host counts the promise, not the parchment."
 rip_ask_to_expand_the_register_alert_tooltip:0 "We are asked to enlarge the register"
 rip_petition_to_confirm_the_register_title:0 "Petition to Confirm the Register"
 rip_petition_to_confirm_the_register_tooltip:0 "Ask the overlord for the roll in a charter that outlives the campaign it was raised for."
 rip_petition_to_confirm_the_register_dialog:0 "[This.GetName] asks us to set the register down in a charter rather than agree it before each campaign. Granting it costs nothing today and costs everything the day we want the roll cut. Refusing it costs nothing today either, and they will remember which we chose."
 rip_petition_to_confirm_the_register_alert_tooltip:0 "We are asked to confirm the register in writing"
