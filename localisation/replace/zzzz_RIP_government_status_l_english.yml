 rip_gov_hlc_title:0 "§YGalicia: Ordinances & Council§!"
 rip_gov_hlc_title_tt:0 "Ordinance Slots:\nThe crown chancery keeps at most two of its three ordinances in force simultaneously (hlc_ordinance_slot_free).\nEnacting an ordinance costs 50 DIP or ADM power and starts a 5-year cooldown token.\nRescinding an ordinance is completely free of monarch power, frees one of the two slots, and starts a 5-year cooldown on that ordinance."
 rip_gov_hlc_slots:0 "Ordinance Slots: [Root.RipGovHlcSlots]"
 rip_gov_hlc_slots_tt:0 "Ordinance Slots:\nThe crown chancery keeps at most two of its three ordinances in force simultaneously (hlc_ordinance_slot_free).\nEnacting an ordinance costs 50 DIP or ADM power and starts a 5-year cooldown token.\nRescinding an ordinance is completely free of monarch power, frees one of the two slots, and starts a 5-year cooldown on that ordinance."
 rip_gov_hlc_active:0 "Ordinances: [Root.RipGovHlcOrdinances]"
 rip_gov_hlc_active_tt:0 "Active Chancery Ordinances:\n- Chancery: +1 Diplomatic Reputation, +10% Improve Relations, +10% Advisor Costs (50 DIP)\n- Settlement: -10% Culture Conversion Cost, annual noble steadying, +1 National Unrest (50 ADM)\n- Cadastre: +5% National Tax, -5% Nobility Loyalty Equilibrium (50 ADM)"
 rip_gov_hlc_council:0 "Council Course: [Root.RipGovHlcCouncil]"
 rip_gov_hlc_council_tt:0 "Active Boyar Council course:\n- Co-option (Confirm in Office): +10 Noble Loyalty for 10 years (available below 60% loyalty)\n- Dynastic Defense (Counter Claimant): +3 Legitimacy for 10 years (available below 60% legitimacy)\n- Repression (Make an Example): +3 Army Tradition, -5 Noble Loyalty for 7 years (at peace, loyalty < 40%)"
 rip_gov_hlc_session:0 "Council Session: [Root.RipGovHlcSession]"
 rip_gov_hlc_session_tt:0 "Shared 10-year session lockout:\nThe Boyar Council courses share a single 10-year cooldown token (hlc_boyar_council_session).\nChoosing any course convenes the council and locks all other courses for 10 years because co-option, dynastic defence, and repression compete rather than stack as independent tools."
 rip_gov_hlc_reviews:0 "Active Resolution: [Root.RipGovActiveReview]"
 rip_gov_hlc_reviews_tt:0 "Active Institutional Resolution:\n- Municipal Charters: +5% Production Efficiency, +5% Burghers Loyalty, -5 Max Absolutism (50 DIP)\n- Municipal Accounts: +5% National Tax, -0.025 Yearly Corruption, -5% Burghers Loyalty (50 ADM)\n- Chancery Service: -5% State Maintenance, -0.025 Yearly Corruption, -5% Nobility Loyalty (50 ADM)\n- Chancery Rights: -10% Culture Acceptance Cost, -0.5 Unrest, -5% National Tax (50 DIP)\n- Cossack Muster: +5% Manpower Recovery, +5% Land Maintenance (50 MIL)\n- Cossack Settlement: -0.5 Unrest, -5% National Manpower (50 DIP)"
 rip_gov_hlc_lockout:0 "Shared Lockout: [Root.RipGovReviewLockout]"
 rip_gov_hlc_lockout_tt:0 "Why choosing one institution temporarily locks out the others:\nMunicipal, Chancery, and Cossack Register reviews form a single shared institutional system.\nEnacting any resolution sets the 10-year shared flag (rip_gov_review_recent), committing the administration to that course for 3650 days.\nDuring this term, all decisions to review other institutions are locked.\nSwitching or losing a reform clears the modifier but DOES NOT reset the 10-year lockout."
 rip_gov_hlc_note:0 "Review Term: 10 Years | 50 Ducats + 50 Power"
 rip_gov_hlc_note_tt:0 "Review Requirements:\n- At peace (is_at_war = no)\n- Stability >= 0\n- At least 50 ducats in the treasury\n- At least 50 monarch power (ADM, DIP, or MIL depending on choice)\n- 10-year shared cooldown expired"
 rip_gov_hlc_footer:0 "One resolution binds all institutions."
 rip_gov_hlc_footer_tt:0 "The crown cannot balance competing administrative, municipal, and military reorganizations at the same time.\nOnly one institutional resolution can be active at a time across the entire realm."
