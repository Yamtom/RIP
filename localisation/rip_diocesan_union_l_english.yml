l_english:
 rip_du_negotiate_title:0 "Negotiate a Diocesan Union"
 rip_du_negotiate_desc:0 "Approach one Orthodox core diocese under our control. Requires peace, stability +1, an existing Greek Catholic parish, 50 DIP and a quarter of a year's income. Negotiations may be opened once every five years, even if we withdraw. A paid offer has a 60% chance of acceptance; refusal leaves the faith unchanged and prevents another offer for ten years. No missionary or centre spreads this union."
 rip_diocesan_union.1.t:0 "Articles for [Root.GetName]"
 rip_diocesan_union.1.d:0 "The bishop and local clergy will consider communion with Rome if the crown guarantees their Eastern liturgy, books and clerical customs. They ask for a written settlement, not a Latin mission.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic."
 rip_diocesan_union.1.a:0 "Fund the agreement and guarantee the rite."
 rip_diocesan_union.1.b:0 "Withdraw the offer; let the diocese remain as it is."
 rip_diocesan_union.2.t:0 "The Diocese Accepts Communion"
 rip_diocesan_union.2.d:0 "The clergy of [Root.GetName] have signed the articles. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.a:0 "Seal the local guarantees."
 rip_diocesan_union.3.t:0 "The Diocese Refuses"
 rip_diocesan_union.3.d:0 "The clergy and brotherhoods of [Root.GetName] will not sign. The negotiations have spent their funds, but the diocese retains its faith. We must wait ten years before approaching it again."
 rip_diocesan_union.3.a:0 "Respect the refusal."
 rip_du_rite_guarantee:0 "Guaranteed Eastern Rite"
 desc_rip_du_rite_guarantee:0 "A local union agreement protects the Eastern rite from missionary conversion for twenty years. It does not spread to neighbouring provinces."
 rip_diocesan_union.1.d_lutsk:0 "Bishop Cyril Terletsky of Lutsk and Ostrih was among the bishops who signed the articles of Brest in 1596. The clergy of the Volhynian see will accept the crown's guarantees of the Eastern liturgy and books, but the brotherhoods and the great families of the province are watching.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.1.d_kholm:0 "Bishop Dionysius Zbirujski of Kholm was among the bishops who joined the union of 1596. The clergy of the see beside the Uherka ask that the crown record its Eastern rite and clerical customs in writing.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.1.d_brest:0 "Bishop Hypatius Potii of Volodymyr and Brest was one of the architects of the union of 1596, and the council sat in this very town. The clergy will sign if the crown guarantees the Eastern rite and the see's property.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.1.d_pinsk:0 "Bishop Leontius Pelchytsky of Pinsk and Turov signed the articles of Brest in 1596. The clergy ask that their liturgy, books and the see's lands be secured in writing.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.1.d_peremyshl:0 "On 23 June 1691 Bishop Innocent Vynnytsky publicly accepted communion with Rome for himself and his eparchy, after a century in which the see of Peremyshl had stood apart from the union of 1596. The clergy ask the crown to secure their rite, books and clerical customs.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.1.d_lviv:0 "In 1700 Bishop Joseph Shumlyansky restored communion with Rome for the eparchy of Lviv, Halych and Kamianets, the last of the great Galician sees to do so. The clergy ask the crown to secure their rite, books and clerical customs.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic. The province stands for the see; it does not fix the see's real bounds."
 rip_diocesan_union.2.d_lutsk:0 "The clergy of the Lutsk see have signed. The Volhynian diocese enters communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.d_kholm:0 "The clergy of the Kholm see have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.d_brest:0 "The clergy of Volodymyr and Brest have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.d_pinsk:0 "The clergy of Pinsk and Turov have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.d_peremyshl:0 "The clergy of Peremyshl have signed, as their bishop did in 1691. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
 rip_diocesan_union.2.d_lviv:0 "The clergy of Lviv have signed, as Bishop Shumlyansky did in 1700. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this diocese alone."
