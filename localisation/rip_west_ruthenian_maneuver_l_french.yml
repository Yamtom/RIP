 wr_west_ruthenian_distinctiveness:0 "Registres chanceliers et paroissiaux distincts"
 desc_wr_west_ruthenian_distinctiveness:0 "Tribunaux locaux, villes de Magdebourg et scriptoria conservent actes municipaux, testaments et homélies vernaculaires à l'écart de l'usage des prikazy moscovites."
 wr_chancery_prosta_mova_tradition:0 "Chancellerie vernaculaire à charte"
 desc_wr_chancery_prosta_mova_tradition:0 "Dans la tradition de la prosta mova grand-ducale, du tournant vernaculaire de Peresopnytsia et des homélies carpatiques, les scribes protègent un registre juridique et littéraire propre."
 wr_west_ruthenian_commonwealth:0 "Sphère culturelle ruthène séparée"
 desc_wr_west_ruthenian_commonwealth:0 "Imprimeries, statuts juridiques et académies de confréries ancrent Biélorusses (bielaruski), Ruthènes (ruskyi) et Rusnaks (rusnacky) dans un groupe ruthène distinct hors de l'orbite moscovite."
 wr_west_ruthenian_statute_autonomy:0 "Autonomie statutaire et stauropégique"
 desc_wr_west_ruthenian_statute_autonomy:0 "Inspirés par les Statuts grand-ducaux, les garanties provinciales de 1569 pour l'écriture ruthène à Kyiv, en Volhynie et en Bratslav, et le ius Valachicum carpatique, les ordres défendent leur espace juridique."
 wr_west_slavic_cultural_affinity:0 "Orbite civique slave occidentale partagée"
 desc_wr_west_slavic_cultural_affinity:0 "Magistratures bilingues, congrégations universitaires à Kraków et Prague et chartes urbaines rapprochent les ordres des voisins polonais, tchèques et slovaques."
 wr_west_slavic_shared_script_space:0 "Réseau bilingue d'imprimerie et de droit"
 desc_wr_west_slavic_shared_script_space:0 "Libraires, séminaires et diétines nobiliaires diffusent gloses latines, actes en lacinka et éditions de Kraków et Trnava au-delà des frontières paroissiales."
 wr_west_slavic_synthesis:0 "Synthèse civique slave occidentale"
 desc_wr_west_slavic_synthesis:0 "À l'image des marches linguistiques de Lusace, de Silésie et de Slovaquie orientale, les institutions achèvent un rare passage vers la famille slave occidentale."
 wr_traditionalist_backlash:0 "Protestation monastique et boyarde"
 desc_wr_traditionalist_backlash:0 "Confréries orthodoxes, anciens des skites et grands seigneurs conservateurs contestent les réformes chancelières qui s'écartent du slavon d'Église."
 wr_collective_concord:0 "Concorde des trois cercles"
 desc_wr_collective_concord:0 "Des chartes coordonnées entre souverains de culture principale, cours l'ayant acceptée et provinces frontalières assurent l'appui diplomatique du congrès."
 wr_cultural_ferment:0 "Ferment provincial non résolu"
 desc_wr_cultural_ferment:0 "Les cours voisines ont ratifié les nouvelles chartes tandis que les autorités locales s'y refusaient, divisant marchands et ordres."
 opinion_wr_west_slavic_kinship:0 "Parenté civique slave occidentale"
 opinion_wr_west_ruthenian_separation:0 "Séparation des prétentions moscovites"
 opinion_wr_collective_accord:0 "Accord du congrès culturel"
 opinion_wr_collective_discord:0 "Discorde du congrès culturel"
 wr_tt_byelorussian_s2_index:0 "Indice mondial d'adoption §Ybielaruski§! d'au moins §Y60%§! (actuellement §Y[Root.wr_byelorussian_s1_pct.GetValue]%§! : §Y[Root.wr_byelorussian_s1_cnt.GetValue]§! sur §Y[Root.wr_byelorussian_total.GetValue]§! provinces)."
