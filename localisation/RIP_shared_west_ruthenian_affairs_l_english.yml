l_english:
 RUTHENIAN_sigis_NAME:0 "Svydrygaylo's White Peace [Alt.]"
 RUTHENIAN_sigis_DESC:0 "In this alternate 1444, Svydrygaylo secures a white peace with Krakow and Vilnius. Early Ruthenian self-rule shapes the map before you. Later missions draw on documented history, including the Union of Brest and the Treaty of Hadiach."
 west_shields:0 "Western Frontier Bastions"
 west_shields_desc:0 "Fortified border towns and well-supplied garrisons guard our western river crossings and supply lines against invasion."

 # Decisions
 svydrigaylo_establish_starshyna_council:0 "Establish Starshyna Council"
 svydrigaylo_establish_starshyna_council_desc:0 "The Ruthenian nobility and cossack officers have organized themselves into a formal council. This is the first step toward independence from Lithuania. The council will coordinate military and diplomatic affairs, laying the groundwork for eventual sovereignty."
 svydrigaylo_establish_starshyna_council_tooltip:0 "Establishes the Starshyna Council. Requires at least §Y40 Republican Tradition§! or §Y40 Legitimacy§!, and §Y2 Generals§!."

 svydrigaylo_prepare_independence:0 "Prepare for Independence"
 svydrigaylo_prepare_independence_desc:0 "The starshyna council has decided: we shall prepare for independence from Lithuania. Diplomatic missions are dispatched to potential allies, the army is mobilized, and defenses are strengthened. The overlord's war exhaustion provides an opportunity for Ruthenian liberation."
 svydrigaylo_prepare_independence_tooltip:0 "Begins preparations for sovereignty. Requires at least §Y55 Republican Tradition§! or §Y55 Legitimacy§!, and an overlord suffering §Y2 War Exhaustion§!."

 svydrigaylo_declare_independence:0 "Declare Ruthenian Independence"
 svydrigaylo_declare_independence_desc:0 "The moment of liberation has arrived. The Ruthenian confederation formally declares independence from Lithuanian and Polish overlordship. The starshyna, the Cossack officers, the churches, and the people stand unified. We are no longer vassals—we are a sovereign state."
 svydrigaylo_declare_independence_tooltip:0 "Severs vassal bonds cleanly. Requires at least §Y60 Republican Tradition§! or §Y60 Legitimacy§!, and an overlord suffering §Y3 War Exhaustion§!."

 svydrigaylo_form_confederation:0 "Form Kyivan Confederation"
 svydrigaylo_form_confederation_desc:0 "The hour has come to gather the Ruthenian lands under one banner. Zaporozhia, the Hetmanate, Chernihiv, and Kyiv join in the Kyivan Confederation—a league of free estates pledged to common defense as rightful heirs of ancient Rus'."
 svydrigaylo_form_confederation_tooltip:0 "Reforms the realm into the §YKyivan Confederation§! under Ruthenian law. Requires independence and at least §Y3 provinces§!."

 svydrigaylo_invite_confederation_members:0 "Rally Confederation Members"
 svydrigaylo_invite_confederation_members_desc:0 "The Kyivan Confederation dispatches envoys to neighbouring Ruthenian realms, inviting their assemblies and princes to enter the common compact."
 svydrigaylo_invite_confederation_members_tooltip:0 "Dispatches invitations to Zaporozhia, the Hetmanate, Chernihiv, and Kyiv. Requires the §YKyivan Confederation§! and at least §Y60 Legitimacy§!."

 svydrigaylo_ruthenian_independence_war:0 "Declare Ruthenian Independence War"
 svydrigaylo_ruthenian_independence_war_tooltip:0 "Opens a war of independence against our overlord. Requires at least §Y55 Legitimacy§! and an army reaching §Y70% of Force Limit§!."


 # Modifiers
 svydrigaylo_starshyna_council:0 "Starshyna Council"
 desc_svydrigaylo_starshyna_council:0 "A formal council of Cossack officers and nobility coordinates Ruthenian governance, laying the foundation for confederation."

 svydrigaylo_preparing_independence:0 "Preparing for Independence"
 desc_svydrigaylo_preparing_independence:0 "Diplomatic missions and military preparations advance the cause of Ruthenian liberation."

 svydrigaylo_independent_ruthenian_state:0 "Independent Ruthenian State"
 desc_svydrigaylo_independent_ruthenian_state:0 "We have declared independence. The Ruthenian confederation now stands as a sovereign power, free from foreign overlordship."

 svydrigaylo.001.t:0 "Ruthenian Independence Declared"
 svydrigaylo.001.d:0 "The starshyna council has formally declared the independence of the Ruthenian confederation. This announcement echoes across the lands—from the Dnieper to the Carpathians, from the Baltic frontier to the Black Sea coast. The question now is how the overlords of Lithuania and Poland will respond."
 svydrigaylo.001.a:0 "Accept their independence (we have more pressing concerns)"
 svydrigaylo.001.b:0 "This is rebellion! We will reclaim our lands."

 svydrigaylo.100.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.100.d:0 "Zaporozhia has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a common league uniting Kyiv, the Hetmanate, Chernihiv, and Zaporozhia under one banner, preserving our elective military liberties while uniting our arms."
 svydrigaylo.100.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.100.b:0 "Decline; we thrive as an independent republic"

 svydrigaylo.101.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.101.d:0 "The Hetmanate has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a federal state uniting Kyiv, the Hetmanate, Chernihiv, and Zaporozhia under a single banner. Our military tradition would be honored within the confederation structure."
 svydrigaylo.101.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.101.b:0 "Decline; we remain independent"

 svydrigaylo.102.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.102.d:0 "Chernihiv has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a federal state uniting Kyiv, the Hetmanate, Chernihiv, and Zaporozhia under a single banner. Our Orthodox ecclesiastical traditions would be preserved as a pillar of the confederation."
 svydrigaylo.102.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.102.b:0 "Decline; we chart our own course"

 svydrigaylo.103.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.103.d:0 "Kyiv has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer to elevate Kyiv to the status of joint capital, where the Orthodox metropolitan would serve as a spiritual leader of the confederation. A true confederation of free peoples."
 svydrigaylo.103.a:0 "Accept and lead the Kyivan Confederation"
 svydrigaylo.103.b:0 "Decline; Kyiv remains independent"

 svydrigaylo.200.t:0 "Zaporozhia Joins the Confederation"
 svydrigaylo.200.d:0 "The Zaporozhian assembly has voted unanimously to join the Kyivan Confederation. The elective Cossack republic will now operate as the military frontier of the confederation, protecting the settled lands from steppe incursions."
 svydrigaylo.200.a:0 "Welcome our brothers-in-arms"

 svydrigaylo.201.t:0 "The Hetmanate Joins the Confederation"
 svydrigaylo.201.d:0 "The Hetmanate council has voted to join the Kyivan Confederation. The hetman will serve as military commander of the confederal forces, while the starshyna will retain their administrative autonomy in hetman succession matters."
 svydrigaylo.201.a:0 "Welcome our military brothers"

 svydrigaylo.202.t:0 "Chernihiv Joins the Confederation"
 svydrigaylo.202.d:0 "Chernihiv has voted to join the Kyivan Confederation. The city, long a center of Orthodox ecclesiastical authority, now lends its spiritual weight to the confederation's legitimacy."
 svydrigaylo.202.a:0 "Welcome our spiritual brothers"

 svydrigaylo.203.t:0 "Kyiv Accepts Leadership of the Confederation"
 svydrigaylo.203.d:0 "Kyiv has accepted the invitation to join the Kyivan Confederation as joint capital. The city's metropolitan now serves as a spiritual authority for all confederation members, uniting Orthodox Christianity with political federation."
 svydrigaylo.203.a:0 "A new golden age for Ruthenia"
 dvina_commerce:0 "Dvina Commerce"
 dvina_commerce_desc:0 "The Western Dvina connects Polotsk to Riga and the Baltic trade networks. We control a vital commercial artery linking the Baltic to the Black Sea."
 dvina_fortress_line:0 "Dvina Fortress Line"
 dvina_fortress_line_desc:0 "Strategic fortifications at Polotsk, Vitebsk, and Disna control all major river crossings, providing defensive depth against any invasion."
 dvina_gateway:0 "Dvina Gateway"
 dvina_gateway_desc:0 "Vitebsk controls the Dvina trade route between Riga and Smolensk. This strategic position brings commercial prosperity and cultural influence."
 dvina_fortifications:0 "Dvina Fortifications"
 dvina_fortifications_desc:0 "Vitebsk fortress commands the strategic Dvina river crossing. Our defensive position makes us a key border stronghold."
 dvina_trade_hub:0 "Dvina Trade Hub"
 desc_dvina_trade_hub:0 "This province is a hub on the Dvina trade route."

 # Recognition of the Kyivan Confederation (svydrigaylo.300-306)
 svydrigaylo_restored_legitimacy:0 "Svydrygailo's Line Restored"

 svydrigaylo.300.t:0 "The Palatinates Answer to Kyiv"
 svydrigaylo.300.d:0 "The Grand Duchy has lost the Ruthenian palatinates in fact, whatever the charters say. The Council of Lords is divided: the Samogitian and Vilnius lords would rather keep what remains than spend a generation reconquering the Dnieper, while the Orthodox magnates of the east have already sent envoys to the new confederation. A recognition costs Vilnius its standing among the Christian courts. Refusing it costs an army."
 svydrigaylo.300.a:0 "Recognise the confederation and keep what is still ours."
 svydrigaylo.300.b:0 "The palatinates are ours by charter and by oath."
 svydrigaylo.301.t:0 "The Sejm Debates Ruthenia"
 svydrigaylo.301.d:0 "A confederation of Ruthenian states now sits astride the grain roads and the Black Sea trade. The Sejm has argued for a season without a resolution. The eastern starosts want the campaign that will bankrupt the treasury; the Crown's own commissioners report that the palatinates have already sworn to Kyiv, and that a war of reconquest would be fought against the very Cossacks who have defended the frontier."
 svydrigaylo.301.a:0 "Let the Sejm recognise what it cannot undo."
 svydrigaylo.301.b:0 "The Crown does not surrender its lands."
 svydrigaylo.302.t:0 "Two Claims to the Rus"
 svydrigaylo.302.d:0 "The metropolitan writes from Kyiv that the confederation gathers the lands of the Rus under their ancient seat. That is our claim, and Kyiv is making it first. The boyars are of two minds: some see an Orthodox state to be supported against the Latin powers, others a rival dynasty that will draw the western lands away from us for good."
 svydrigaylo.302.a:0 "Kyiv is a rival claim, not a brother."
 svydrigaylo.302.b:0 "Orthodoxy comes before the succession."
 svydrigaylo.303.t:0 "A Wedge on the Northern Frontier"
 svydrigaylo.303.d:0 "The Divan has read the reports from Kaffa. A Ruthenian confederation standing between the Commonwealth and Muscovy would keep both occupied, and its Cossacks would be answerable to a court that can be negotiated with, rather than to nobody at all. Against that, those same Cossacks burn our coastal towns, and recognising their state makes their raids a matter of policy rather than banditry."
 svydrigaylo.303.a:0 "A wedge between Krakow and Moscow serves the Porte."
 svydrigaylo.303.b:0 "We have raiders enough on that frontier."
 svydrigaylo.304.t:0 "The Khan Weighs the Confederation"
 svydrigaylo.304.d:0 "For as long as anyone remembers, the lands above the rapids have belonged to whoever could hold them for a season. Now they have a court, a treasury, and envoys. The Khan's advisers point out that a neighbour who can sign a treaty is a neighbour who can pay for one, and that the road to the Polish crownlands runs through their territory either way."
 svydrigaylo.304.a:0 "Recognise them, and keep the road north open."
 svydrigaylo.304.b:0 "Swear a firm peace on the steppe frontier."
 svydrigaylo.305.t:0 "Moldavia Looks North"
 svydrigaylo.305.d:0 "The hospodar has received the confederation's envoys at Suceava. An Orthodox state on the Dnieper changes what Moldavia can hope for: a neighbour of the same faith, caught between the same two powers, and useful in the same way we are useful to them. The boyar council is cautious. The Porte reads our correspondence."
 svydrigaylo.305.a:0 "Another Orthodox principality between us and the powers."
 svydrigaylo.305.b:0 "Moldavia keeps its own counsel."
 svydrigaylo.306.t:0 "Wallachia and the Ruthenian Cause"
 svydrigaylo.306.d:0 "At Targoviste the news from Kyiv is read twice: once for what it means for the faith, and once for what it means for the tribute. A Ruthenian state that holds against Poland is a precedent, and precedents travel down the Danube. Whether the voivode may say so aloud is another question."
 svydrigaylo.306.a:0 "The Danube watches the Dnieper with sympathy."
 svydrigaylo.306.b:0 "We have the Porte to answer to."
 svydrigaylo_legacy:0 "Svydrigaylo's Legacy"




















# MODIFIERS

 west_ukr_polish_influence_desc:0 "Polish culture, language, and customs increasingly influence our nobility."

 west_ukr_cultural_resistance_desc:0 "We resist foreign cultural influences and preserve our traditions."

 west_ukr_ruthenian_pride_desc:0 "Pride in our Ruthenian heritage strengthens who we are."

 west_ukr_church_union_desc:0 "The Uniate Church maintains Eastern rites while accepting papal authority."

 west_ukr_converted_uniate_desc:0 "This province has recently converted to the Uniate Church, causing unrest."

 west_ukr_orthodox_faithful_desc:0 "We remain true to Orthodox Christianity."

 west_ukr_forced_conversion_desc:0 "Religious conversion has been enforced by force, causing resentment."

 west_ukr_orthodox_protection_desc:0 "The Orthodox faithful enjoy protection from forced conversion."

 west_ukr_religious_peace_desc:0 "Orthodox and Uniate communities coexist peacefully."

 west_ukr_cossack_unrest_desc:0 "Cossacks resist attempts to curtail their freedoms."

 west_ukr_cossack_privileges_desc:0 "The Cossacks enjoy special privileges and autonomy."

 west_ukr_cossack_discipline_desc:0 "We maintain strict discipline over the Cossacks."

 west_ukr_border_fortifications_desc:0 "Strong fortifications protect against Tatar raids."

 west_ukr_tatar_raid_damage_desc:0 "A Tatar raid has devastated this province, carrying off many into slavery."

 west_ukr_lviv_trade_fair_desc:0 "The great Lviv trade fair attracts merchants from across Europe and Asia."

 west_ukr_magdeburg_law_desc:0 "This city enjoys self-government under Magdeburg Law."

 west_ukr_chumak_trade_desc:0 "The Chumak salt caravans bring prosperity to this region."

 west_ukr_sarmatism_desc:0 "Our nobility embraces the Sarmatian creed with its martial culture."

 west_ukr_ruthenian_nobility:0 "Ruthenian Noble Traditions"
 west_ukr_ruthenian_nobility_desc:0 "Our nobility maintains distinct Ruthenian traditions and custom."
 desc_west_ukr_ruthenian_nobility:0 "Our nobility maintains distinct Ruthenian traditions and custom."

 west_ukr_golden_liberty_support_desc:0 "We uphold the traditional freedoms and privileges of the nobility."



 west_ukraine_history.1.t:0 "The Customs of the Ruthenian Lands"
 west_ukraine_history.1.d:0 "Noble houses send their sons to study in Poland, and they return with Polish books and manners. The local gentry are divided over which customs should prevail at our court."
 west_ukraine_history.1.a:0 "Accept Polish influence."
 west_ukraine_history.1.b:0 "Resist cultural pressure."
 west_ukr_polish_influence:0 "Polish Influence"
 desc_west_ukr_polish_influence:0 "Polish cultural influence grows."
 west_ukr_cultural_resistance:0 "Cultural Resistance"
 desc_west_ukr_cultural_resistance:0 "Local traditions resist assimilation."
 west_ukr_cultural_defiance:0 "Cultural Defiance"
 desc_west_ukr_cultural_defiance:0 "Defiant cultural movements spread."
 west_ukraine_history.2.t:0 "The Oath of Allegiance"
 west_ukraine_history.2.d:0 "Our lord expects the oath of service to be renewed. Some councillors would give it freely. Others ask why we should still seek leave to govern our own lands."
 west_ukraine_history.2.a:0 "Remain loyal."
 west_ukraine_history.2.b:0 "Assert independence."
 west_ukr_loyal_vassal:0 "Loyal Vassal"
 desc_west_ukr_loyal_vassal:0 "Loyalty brings stability and favor."
 west_ukr_ruthenian_pride:0 "Ruthenian Pride"
 desc_west_ukr_ruthenian_pride:0 "Local custom strengthens resolve."
 west_ukraine_history.3.t:0 "Religious Division"
 west_ukraine_history.3.d:0 "At Brest, the Ruthenian hierarchy accepts communion with Rome while retaining its Byzantine rite. If the crown follows, its state faith becomes Greek Catholic; its capital see may follow, but the other Orthodox parishes do not change with it."
 west_ukraine_history.3.a:0 "Accept communion with Rome"
 west_ukraine_history.3.b:0 "Keep the Orthodox faith"
 west_ukr_church_union:0 "Church Union"
 desc_west_ukr_church_union:0 "A church union reshapes religious life."
 west_ukr_converted_uniate:0 "Converted Uniate"
 desc_west_ukr_converted_uniate:0 "Union faith spreads among elites."
 west_ukr_church_loyalty:0 "Church Loyalty"
 desc_west_ukr_church_loyalty:0 "Clerical loyalty strengthens state authority."
 west_ukr_orthodox_faithful:0 "Orthodox Faithful"
 desc_west_ukr_orthodox_faithful:0 "Orthodox communities resist change."
 west_ukr_religious_defiance:0 "Religious Defiance"
 desc_west_ukr_religious_defiance:0 "Defiance fuels religious unrest."
 west_ukraine_history.4.t:0 "Religious Settlement"
 west_ukraine_history.4.d:0 "The new hierarchy meets resistance in parishes that keep the Orthodox rite. The crown may press for conformity, grant protection, or leave local practice undisturbed; no parish changes faith merely by this decision."
 west_ukraine_history.4.a:0 "Press for conformity"
 west_ukraine_history.4.b:0 "Protect the Orthodox rite"
 west_ukraine_history.4.c:0 "Seek peace."
 west_ukr_religious_peace:0 "Religious Peace"
 desc_west_ukr_religious_peace:0 "A lasting religious settlement holds."
 west_ukr_forced_conversion:0 "Forced Conversion"
 desc_west_ukr_forced_conversion:0 "Conversions imposed by force."
 west_ukr_orthodox_protection:0 "Orthodox Protection"
 desc_west_ukr_orthodox_protection:0 "Orthodox communities receive protection."
 west_ukraine_history.5.t:0 "Cossack Unrest"
 west_ukraine_history.5.d:0 "Cossacks have come to the local officers with a list of grievances. They demand written guarantees of their liberties. The garrison awaits orders."
 west_ukraine_history.5.a:0 "Suppress unrest."
 west_ukraine_history.5.b:0 "Grant privileges."
 west_ukr_cossack_unrest:0 "Cossack Unrest"
 desc_west_ukr_cossack_unrest:0 "Unrest among Cossack communities."
 west_ukr_cossack_privileges:0 "Cossack Privileges"
 desc_west_ukr_cossack_privileges:0 "Privileges granted to Cossacks."
 west_ukr_soft_on_cossacks:0 "Soft on Cossacks"
 desc_west_ukr_soft_on_cossacks:0 "A conciliatory stance toward Cossacks."
 west_ukraine_history.6.t:0 "Cossack Raids"
 west_ukraine_history.6.d:0 "A raiding party has crossed the frontier without leave. The neighbours demand redress, and the Cossack officers insist that they can discipline their own men."
 west_ukraine_history.6.a:0 "Crack down."
 west_ukraine_history.6.b:0 "Impose discipline."
 west_ukr_cossack_raid:0 "Cossack Raid"
 desc_west_ukr_cossack_raid:0 "Raids strain regional security."
 west_ukr_cossack_discipline:0 "Cossack Discipline"
 desc_west_ukr_cossack_discipline:0 "Discipline improves frontier control."
 west_ukraine_history.7.t:0 "Border Fortifications"
 west_ukraine_history.7.d:0 "The wardens have sent their estimates for timber, earthworks and wages. A stronger line of forts will cost the treasury dearly before the next campaigning season."
 west_ukraine_history.7.a:0 "Strengthen forts."
 west_ukraine_history.7.b:0 "Cut costs."
 west_ukr_border_fortifications:0 "Border Fortifications"
 desc_west_ukr_border_fortifications:0 "Fortifications strengthen border defense."
 west_ukr_tatar_raid_damage:0 "Tatar Raid Damage"
 desc_west_ukr_tatar_raid_damage:0 "Raids cause damage and disruption."
 west_ukraine_history.8.t:0 "Tatar Pressure"
 west_ukraine_history.8.d:0 "The watch has sighted Tatar horsemen on the southern roads. Some lords would buy peace with tribute. Others have already called their retainers to the crossings."
 west_ukraine_history.8.a:0 "Pay tribute."
 west_ukraine_history.8.b:0 "Resist raids."
 west_ukraine_history.9.t:0 "Lviv Trade Fair"
 west_ukraine_history.9.d:0 "The streets of Lviv are crowded for the fair. The magistrates ask us to keep the tolls low enough to bring the merchants back next year. Our treasurer sees a rare chance to fill the coffers."
 west_ukraine_history.9.a:0 "Encourage trade."
 west_ukraine_history.9.b:0 "Tax the fairs."
 west_ukr_lviv_trade_fair:0 "Lviv Trade Fair"
 desc_west_ukr_lviv_trade_fair:0 "Trade fairs attract merchants and wealth."
 west_ukraine_history.10.t:0 "Magdeburg Law"
 west_ukraine_history.10.d:0 "The burghers petition for a charter under Magdeburg law. They wish to choose their magistrates and plead their disputes before a town court. Our officers are reluctant to surrender either right."
 west_ukraine_history.10.a:0 "Grant privileges."
 west_ukraine_history.10.b:0 "Restrict privileges."
 west_ukr_magdeburg_law:0 "Magdeburg Law"
 desc_west_ukr_magdeburg_law:0 "Urban autonomy strengthens local governance."
 west_ukraine_history.11.t:0 "Chumak Trade"
 west_ukraine_history.11.d:0 "The chumaks are taking their ox carts farther afield in search of salt and fish. They ask for safe passage through our toll stations and protection on the open roads."
 west_ukraine_history.11.a:0 "Support caravans."
 west_ukraine_history.11.b:0 "Limit caravans."
 west_ukr_chumak_trade:0 "Chumak Trade"
 desc_west_ukr_chumak_trade:0 "Caravan trade boosts the economy."
 west_ukraine_history.12.t:0 "Sarmatism"
 west_ukraine_history.12.d:0 "At their gatherings the nobles speak of descent from the ancient Sarmatians. Their coats, feasts and speeches proclaim a distinction they would have the court itself honour."
 west_ukraine_history.12.a:0 "Embrace sarmatism."
 west_ukraine_history.12.b:0 "Resist sarmatism."
 west_ukr_sarmatism:0 "Sarmatism"
 desc_west_ukr_sarmatism:0 "Sarmatist ideas shape elite culture."
 west_ukraine_history.13.t:0 "Golden Liberty"
 west_ukraine_history.13.d:0 "The szlachta have brought their charters to the assembly. No new levy, they insist, may be raised without their consent. They ask the crown to confirm this liberty under seal."
 west_ukraine_history.13.a:0 "Support the nobles."
 west_ukraine_history.13.b:0 "Limit their power."
 west_ukr_golden_liberty_support:0 "Golden Liberty Support"
 desc_west_ukr_golden_liberty_support:0 "Noble liberties are strengthened."
