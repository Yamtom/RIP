l_english:
 appanage_principalities.1.t:0 "The Patrimony and the Grand Prince"
 appanage_principalities.1.d:0 "Our patrimony is held by the old right: the land is the family's, divided among sons, and no one above us has ever needed to say otherwise. Moscow now says otherwise. The Grand Prince's clerks write of gathering the lands of Rus' and mean ours among them, and his troops have been counted on the road more than once this season. Vilnius offers a charter and a garrison to any prince who asks, which is protection of a kind, and puts a Catholic king between us and our own metropolitan. The boyars are divided, as boyars are."
 appanage_principalities.1.a:0 "Take the Grand Prince's hand"
 appanage_principalities.1.b:0 "Look west to Vilnius"
 appanage_principalities.1.c:0 "Hold the patrimony alone"

 appanage_principalities.2.t:0 "An Appanage Prince Submits"
 appanage_principalities.2.d:0 "[From.GetName] has sent envoys to acknowledge our seniority. They ask to keep their own court, their own boyars and their own seal, and offer service in the field and a place below us at table. It is not annexation and they are careful to say so. It is, however, the shape submission takes before it is called by that name."
 appanage_principalities.2.a:0 "Seat him below us"

 appanage_principalities.3.t:0 "An Eastern Prince Asks for a Charter"
 appanage_principalities.3.d:0 "[From.GetName] has asked for our protection against Moscow. The price they name is modest - a charter confirming their patrimony, and a garrison they will feed themselves. The price we will actually pay is a quarrel with the Grand Prince on ground we cannot easily reinforce, and the metropolitan's opinion of a Catholic king who shelters Orthodox princes."
 appanage_principalities.3.a:0 "A charter and a garrison"

 appanage_moscow_leaning:0 "Leaning to Moscow"
 desc_appanage_moscow_leaning:0 "Our court keeps the Grand Prince's peace, and our levies answer his musters. The patrimony is quieter for it."
 appanage_vilnius_leaning:0 "Leaning to Vilnius"
 desc_appanage_vilnius_leaning:0 "A charter from Vilnius confirms our patrimony, and a western garrison holds the walls. The parishes have opinions about who now protects them."
 appanage_independent_course:0 "The Patrimony Alone"
 desc_appanage_independent_course:0 "We answer to neither capital. The boyars approve, the treasury does not, and both neighbours have taken note."
 appanage_eastern_clients:0 "Eastern Clients"
 desc_appanage_eastern_clients:0 "Orthodox princes hold their patrimonies under our charter, and pay for the privilege."
