 desc_rip_church_ro_schism:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 greek_catholic_religion_desc:0 "A broad game category covering several distinct Ruthenian and Carpathian Eastern Catholic union traditions and jurisdictions in communion with Rome, not one church institution and not the modern Ukrainian Greek Catholic Church in its narrow sense. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution. Availability from 6 July 1439 uses the Florentine union as a precedent for an alternative historical path, not as the founding of the UGCC or an established separate confession. The Union of Brest in 1596 is a distinct later milestone. Their hierarchies retain internal authority, represented by Hierarchical Capacity. The Curia panel records diplomatic relations only. Hierarchical Capacity (HC) represents the local hierarchy and synod capacity to organize clergy, sustain institutions and fund devotional initiatives. It is a gameplay abstraction using the native Patriarch Authority (PA) bar, not a historical measurement of universal UGCC authority or standing with Rome. Papal relations are tracked separately. The Greek Catholic state religion provides a base +7.5 HC per year (0.625 per month). Two icons and one synod cost 60 HC per ten years; one parish visit adds 5 HC, leaving 10 HC before other costs. No extra resource is granted on loading a save."
 rip_church.2.a:0 "Cultivate the Third Rome ideal"
 rip_church.2.b:0 "Emphasize our place among the Orthodox churches"
 rip_church.2.d:0 "Writers at the Muscovite court describe Moscow as a guardian of the Orthodox inheritance. This sixteenth-century political theology does not itself create a new creed or end communion with the eastern patriarchates. Universal jurisdiction would require a separate, deliberate claim."
 rip_church.2.t:0 "Moscow and the Third Rome"
 rip_church.3.d:0 "The ecclesiastical settlement recognizes our patriarchate within the wider Orthodox communion. Moscow accepts its place after the four ancient eastern patriarchates. Our centralized church remains a distinct political institution; recognition does not abolish its internal responsibilities."
 rip_church.3.t:0 "A Recognized Patriarchate"
 rip_church.5.d:0 "Our negotiated settlement draws on the Florentine union of 1439 as a precedent; historically, it did not gain lasting general acceptance. This campaign-created alternative does not represent the founding of the UGCC in 1439 or an unbroken institutional line to Brest in 1596: the Byzantine rite and its bishops remain, while communion with Rome is accepted. Integration is represented province by province; that game abstraction does not establish a canonical parish status or local voluntary consent."
 rip_church.5.t:0 "The Florentine Legacy Reaffirmed"
 rip_church.6.d:0 "The Eastern hierarchy may organize church infrastructure or conclude a compact of coexistence, which needs community rights guaranteed in at least one province. Both are local synodal institutions, spend Hierarchical Capacity and ducats, and share one ten-year synod slot."
 rip_church.6.t:0 "The Local Synod"
 rip_church_active:0 "ACTIVE"
