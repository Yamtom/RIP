 rip_diocesan_union.1.a:0 "Fund the agreement and guarantee the rite."
 rip_diocesan_union.1.b:0 "Withdraw the offer; let the eparchy remain as it is."
 rip_diocesan_union.1.d:0 "Commissioners have laid the articles of union before the clergy of this eparchy.\n\nThe bishop and local clergy will consider communion with Rome if the crown guarantees their Eastern liturgy, books and clerical customs. They ask for a written settlement, not a Latin mission.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and takes +3 unrest and +15% autonomy for ten years, and this eparchy cannot be approached again in that time. Other eparchies are not affected. The crown remains Catholic."
 rip_diocesan_union.1.d_brest:0 "Bishop Hypatius Potii of Volodymyr and Brest was one of the architects of the union of 1596, and the council sat in this very town. The clergy will sign if the crown guarantees the Eastern rite and the see's property.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.d_kholm:0 "Bishop Dionysius Zbirujski of Kholm was among the bishops who joined the union of 1596. The clergy of the see beside the Uherka ask that the crown record its Eastern rite and clerical customs in writing.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.d_lutsk:0 "Bishop Cyril Terletsky of Lutsk and Ostrih was among the bishops who signed the articles of Brest in 1596. The clergy of the Volhynian see will accept the crown's guarantees of the Eastern liturgy and books, but the brotherhoods and the great families of the province are watching.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.d_lviv:0 "In 1700 Bishop Joseph Shumlyansky restored communion with Rome for the eparchy of Lviv, Halych and Kamianets, the last of the great Galician sees to do so. The clergy ask the crown to secure their rite, books and clerical customs.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.d_peremyshl:0 "On 23 June 1691 Bishop Innocent Vynnytsky publicly accepted communion with Rome for himself and his eparchy, after a century in which the see of Peremyshl had stood apart from the union of 1596. The clergy ask the crown to secure their rite, books and clerical customs.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.d_pinsk:0 "Bishop Leontius Pelchytsky of Pinsk and Turov signed the articles of Brest in 1596. The clergy ask that their liturgy, books and the see's lands be secured in writing.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and resists further offers for ten years. The crown remains Catholic, though the eparchy's wider parishes extend beyond any single town."
 rip_diocesan_union.1.t:0 "Articles for [Root.GetName]"
 rip_diocesan_union.2.a:0 "Seal the local guarantees."
 rip_diocesan_union.2.d:0 "The clergy of [Root.GetName] have signed the articles. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_brest:0 "The clergy of Volodymyr and Brest have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_kholm:0 "The clergy of the Kholm see have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_lutsk:0 "The clergy of the Lutsk see have signed. The Volhynian eparchy enters communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_lviv:0 "The clergy of Lviv have signed, as Bishop Shumlyansky did in 1700. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_peremyshl:0 "The clergy of Peremyshl have signed, as their bishop did in 1691. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.d_pinsk:0 "The clergy of Pinsk and Turov have signed. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.t:0 "The Eparchy Accepts Communion"
 rip_diocesan_union.3.a:0 "Respect the refusal."
 rip_diocesan_union.3.d:0 "The clergy and brotherhoods of [Root.GetName] will not sign. The negotiations have spent their funds, and the province carries +3 unrest and +15% autonomy for ten years. We may not approach this eparchy again for that long; the other eparchies stay open."
 rip_diocesan_union.3.t:0 "The Eparchy Refuses"
 rip_du_negotiate_desc:0 "Send royal commissioners to an Orthodox core eparchy across the realm to propose communion with Rome while keeping the Byzantine rite intact. Requires peace, stability +1, an existing Greek Catholic parish, 50 DIP and a quarter of a year's income. Talks may be opened once every five years, even if we withdraw. A paid offer is accepted 60% of the time. A refusal leaves the faith unchanged and puts +3 unrest and +15% autonomy on the province for ten years; that eparchy cannot be approached again in that time, but the others can. No missionary or centre spreads this union."
 rip_du_negotiate_title:0 "Negotiate an Eparchial Union"
 rip_du_rite_guarantee:0 "Eastern Rite Protected"
 rip_privilege_basilian_schools:0 "Basilian Schools"
 rip_privilege_basilian_schools_desc:0 "The Basilian Order of St Josaphat, reformed from 1617, keeps the schools and monasteries of the Union, and the Barbareum in Vienna trained Greek Catholic clergy from 1774. The crown pays the teachers; the order supplies them."
 rip_privilege_brotherhood_charters:0 "Brotherhood Charters"
 rip_privilege_brotherhood_charters_desc:0 "Lay brotherhoods hold the Orthodox parishes and schools by charter, as the Dormition Brotherhood of Lviv did after its stauropegial privilege of 1586, and answer the Union parishes with books and preaching. The crown defends their rights against bishops who accepted Rome."
 rip_privilege_eastern_ecumene:0 "Eastern Ecumene"
 rip_privilege_eastern_ecumene_desc:0 "The Union keeps its door open to Orthodox who share its liturgy: priests move between parishes and the bishops speak of reunion rather than victory. Rome watches the experiment with doubt."
 rip_privilege_eastern_rite_eparchies:0 "Eastern-Rite Eparchies"
 rip_privilege_eastern_rite_eparchies_desc:0 "The crown keeps the Byzantine-rite bishops and their parishes as they are, under Rome but outside the jurisdiction of the Latin diocesans. This is what the Union of Brest promised its hierarchy and what Latin bishops did not always grant."
 rip_privilege_latin_rite_primacy:0 "Latin-Rite Primacy"
 rip_privilege_latin_rite_primacy_desc:0 "Latin diocesans oversee the Eastern parishes and press them toward Latin custom. The Synod of Zamosc in 1720 took this road. It gives the Latin hierarchy order and costs the crown the goodwill of the parishes."
 rip_privilege_parish_concord:0 "Concord with the Union Parishes"
 rip_privilege_parish_concord_desc:0 "The crown lets Orthodox and Union parishes stand side by side and judges each dispute on its merits. Few rulers did so willingly; most were pushed to it by war or by neighbours."
 rip_privilege_roman_concordat:0 "Roman Concordat"
 rip_privilege_roman_concordat_desc:0 "The Union bishops hold their rite and offices by agreement with Rome, as the articles of Brest promised. The senate seats promised to them were never granted in full, so the crown has to press the point itself, and Rome repays it with a friendly hand."
 rip_privilege_synodal_courts:0 "Synodal Courts"
 rip_privilege_synodal_courts_desc:0 "Marriage, tithe and clerical disputes go to the eparchial synod instead of the royal courts. Order improves and the treasury loses fees."
 rip_ucr_church_of_the_palace:0 "Church of the Palace"
 rip_ucr_crown_names_the_bishops:0 "The Crown Names the Bishops"
 rip_ucr_crown_preachers:0 "Crown Preachers"
 rip_ucr_legate_judged_between_us:0 "A Roman Legate Judged Between Us"
 rip_ucr_metropolitan_in_exile:0 "The Metropolitan in Exile"
 rip_ucr_needs_a_catholic_broker_tt:0 "A Catholic great power we are not at war with can carry the letter"
 rip_ucr_needs_a_strong_crown_tt:0 "The crown is strong enough to answer for its own church"
 rip_ucr_opinion_took_the_church:0 "Took the Church by Decree"
 rip_ucr_palace_church_settled:0 "The Settlement Holds"
 rip_ucr_parish_disquiet:0 "Disquiet in the Parishes"
 rip_ucr_recognition_of_rome:0 "Recognition of Rome"
 rip_ucr_synod_by_decree:0 "Synod by Decree"
 rip_ucr_synod_not_consulted_tt:0 "§RThe metropolitan is not told.§!"
 rip_ucr_synod_restored:0 "The Synod Restored"
 rip_ucr_treat_with_rome_desc:0 "The chancery has named what the crown wants and cannot get from Constantinople. An embassy can be sent to put the question to Rome directly - not through our bishops, and not with their knowledge."
 rip_ucr_treat_with_rome_title:0 "Treat with Rome"
 seek_orthodox_reconciliation_decision_desc:0 "We can pursue dialogue with Orthodox neighbors, seeking mutual understanding despite our different paths."
 seek_orthodox_reconciliation_decision_title:0 "Seek Orthodox Reconciliation"
 strengthen_papal_ties_decision_desc:0 "We can strengthen our relationship with Rome, seeking papal protection and support."
 strengthen_papal_ties_decision_title:0 "Strengthen Papal Ties"
 uniate:0 "Uniate Church"
 uniate_basilian_schools:0 "Basilian Educational Centers"
 uniate_catholic_tensions:0 "Uniate-Catholic Tensions"
 uniate_church.1.a:0 "Let the bishops negotiate communion with Rome"
 uniate_church.1.b:0 "Keep the Orthodox hierarchy"
 uniate_church.1.c:0 "Negotiate limited communion"
 uniate_church.1.d:0 "In 1595–96, Metropolitan Michael Rahoza alongside Bishops Hypatius Potii and Cyril Terlecki sought communion with Rome. Pope Clement VIII confirmed the articles in 1596, promising to keep the Byzantine rite, married parish clergy, and church hierarchy under papal primacy. Yet Gedeon Balaban and Michael Kopystensky opposed the union, leaving the bishops divided. The agreement proclaimed at Brest in 1596 bound the accepting sees without converting every parish at once. Refusing communion preserves our independent Orthodox hierarchy, though it weakens our diplomatic standing for fifteen years.\n\nShould our crown itself stand free of any Catholic overlord, the sovereign may enter the realm directly into the Union."
 uniate_church.1.t:0 "Negotiations with Rome"
 uniate_church.10.a:0 "Receive the diocesan mission"
 uniate_church.10.b:0 "Resist this religious change"
 uniate_church.10.d:0 "Missionaries from neighboring Greek Catholic parishes have arrived to explain their local union with Rome while retaining the Byzantine rite. Their work concerns this community and its bishops; it does not reunite the churches of Rome and Constantinople. Some local believers are willing to hear them."
 uniate_church.10.t:0 "The Parish Mission in [Root.GetName]"
 uniate_church.11.a:0 "Launch the missionary campaign"
 uniate_church.11.b:0 "Focus on internal consolidation"
 uniate_church.11.d:0 "Our bishops propose supporting local missions among neighboring Orthodox and Catholic communities. The work would extend the reach of our own church and its Byzantine rite, not establish a general communion between Rome and Constantinople."
 uniate_church.11.t:0 "Greek Catholic Missionary Campaign"
 uniate_church.12.a:0 "Establish the Metropolitan See"
 uniate_church.12.b:0 "Delay this decision"
 uniate_church.12.d:0 "The metropolitan asks for a recognised seat. Endowing the foundation costs 100 ducats and 50 administrative power. Its local privileges last twenty years."
 uniate_church.12.t:0 "Establish Metropolitan See"
 uniate_church.13.a:0 "Patronize this renaissance"
 uniate_church.13.b:0 "Focus on religious matters"
 uniate_church.13.d:0 "Our local Eastern Catholic church has become a patron of Ruthenian literature, art, and music. Writers and artists draw on the learning and worship of their own communities. Their work earns recognition beyond our borders."
 uniate_church.13.t:0 "Ruthenian Cultural Renaissance"
 uniate_church.14.a:0 "Strengthen practical ties with Rome"
 uniate_church.14.b:0 "Give precedence to the Byzantine rite"
 uniate_church.14.c:0 "Balance local customs and cooperation"
 uniate_church.14.d:0 "Our bishops and Catholic advisers debate how the local church should order its relations with Rome and maintain its Eastern customs. They can seek closer practical cooperation, give precedence to the Byzantine rite, or balance the two in church administration. These are policies of our hierarchy, not a new universal doctrine."
 uniate_church.14.t:0 "A Debate over Local Church Practice"
 uniate_church.15.a:0 "Open talks with Orthodox neighbors"
 uniate_church.15.b:0 "State our church's position"
 uniate_church.15.c:0 "Maintain diplomatic neutrality"
 uniate_church.15.d:0 "Orthodox churchmen from neighboring lands approach us. Some hope for practical agreements between nearby parishes and bishops; others distrust our ties to Rome. No local discussion can restore communion between Rome and Constantinople as a whole. How should we respond?"
 uniate_church.15.t:0 "Orthodox-Greek Catholic Dialogue"
 uniate_church.16.a:0 "Establish the printing press"
 uniate_church.16.b:0 "Focus resources elsewhere"
 uniate_church.16.d:0 "Basilian monks propose establishing a printing press to publish liturgical books, theological works, and educational materials in Church Slavonic and Latin. This would spread learning and strengthen our church's intellectual foundation."
 uniate_church.16.t:0 "Greek Catholic Printing Press"
 uniate_church.17.a:0 "Proclaim our protection of these churches"
 uniate_church.17.b:0 "Remain modest in our claims"
 uniate_church.17.d:0 "Our realm has become a major patron of the Eastern Catholic communities within its reach. Some propose that our ruler protect their bishops and parishes. Such a claim would concern our regional churches, not every community called Greek Catholic or the whole Christian world."
 uniate_church.17.t:0 "Regional Church Patronage"
 uniate_church.18.a:0 "Stand firm against persecution"
 uniate_church.18.b:0 "Seek papal protection"
 uniate_church.18.d:0 "Reports have reached our bishops from a Greek Catholic parish under enemy occupation. Clergy and faithful have been attacked for refusing to abandon their communion; survivors name those who were killed and ask for protection. The chancery records their testimony. This incident, rather than the existence of a hostile neighbour, is evidence of persecution."
 uniate_church.18.t:0 "Persecution in an Occupied Parish"
 uniate_church.19.a:0 "Reform administration and educate clergy"
 uniate_church.19.b:0 "Seek papal support for our church"
 uniate_church.19.c:0 "Defend the Eastern rite and local governance"
 uniate_church.19.d:0 "Our bishops have called a metropolitan synod to consider diocesan administration, the education of clergy, and relations with Rome. Its decisions govern the discipline and practice of our local church; they neither define a new universal doctrine nor restore communion between Rome and Constantinople."
 uniate_church.19.t:0 "A Metropolitan Synod"
 uniate_church.2.a:0 "Impose the union by royal decree"
 uniate_church.2.b:0 "Honor the Eastern rite and allow a negotiated transition"
 uniate_church.2.c:0 "Seek Rome's backing"
 uniate_church.2.d:0 "In 1596, the bishops who accepted communion with Rome and those who rejected it met in separate assemblies at Brest. Metropolitan Rahoza and the union's supporters affirmed communion with the Pope while retaining their Eastern hierarchy and Byzantine rite. Local unions were associated with Lutsk and Cyril Terlecki, Berestia and Hypatius Potii, Pinsk and Pelchynskyi, and Kholm and Zbyruiskyi. Clement VIII's recognition promised preservation of that church order, though not every safeguard was beyond dispute. Gedeon Balaban and Michael Kopystensky stood with the opposing synod. The decree did not bring every Ruthenian parish with it: acceptance was uneven, and Orthodox clergy and brotherhoods resisted. The bishops' agreement concerned communion and hierarchy; it did not itself demand Latinization or compel every parish to convert. The crown must now choose whether to honor the Eastern rite or impose the union as state policy. No province changes faith by this act alone."
 uniate_church.2.t:0 "The Union at Brest"
 uniate_church.20.b:0 "Commemorate the victims locally."
 uniate_church.20.d:0 "The church has preserved testimony of persecution against Greek Catholic clergy and faithful. We may honour the victims locally or fund the collection of testimony for a beatification cause. Supporting a cause costs 50 ducats and 25 diplomatic power and requires peaceful relations with an existing Papal State. It opens no automatic path to sainthood: ecclesiastical investigation and judgement remain separate from the ruler's decision."
 uniate_church.20.t:0 "Remembering the Victims of Persecution"
 uniate_church.3.a:0 "Suppress the brotherhoods"
 uniate_church.3.b:0 "Negotiate coexistence"
 uniate_church.3.c:0 "Grant brotherhoods local autonomy"
 uniate_church.3.d:0 "The council at Brest ended not in one accord but in separate synods: unionist bishops accepted communion with Rome, while Orthodox opponents upheld their own hierarchy. Brotherhoods and clergy resisted in some towns, but their reach was local and uneven; not every province or Orthodox community joined them. The dispute over church authority and rite did not amount to a unanimous rising."
 uniate_church.3.t:0 "The Rival Synod"
 uniate_church.4.a:0 "Grant Cossacks Orthodox autonomy"
 uniate_church.4.b:0 "Suppress Cossack resistance"
 uniate_church.4.c:0 "Negotiate compromise"
 uniate_church.4.d:0 "The Cossacks have declared themselves defenders of Orthodox faith against the Uniate Church. For the Zaporozhian Host, the old rite is inseparable from Cossack freedom. They threaten rebellion if we force the Union upon them."
 uniate_church.4.t:0 "Cossacks Defend Orthodoxy"
 uniate_church.5.a:0 "Adopt Latinizing liturgical changes"
 uniate_church.5.b:0 "Reform dioceses and educate clergy"
 uniate_church.5.d:0 "The Zamosc Synod addressed more than liturgical change: it also sought to regularize diocesan administration, improve the education of priests, and reform monastic life. Its Latinizing measures affected books and worship, but local churches still had to decide how to apply them. Which work should our bishops put first?"
 uniate_church.5.t:0 "Synod of Zamosc"
 uniate_church.6.a:0 "Endow the first schools."
 uniate_church.6.b:0 "Defer the foundation."
 uniate_church.6.d:0 "A Greek Catholic parish with a church can host the first classes for clergy and readers. The bishops ask for books, teachers and a small endowment, not a university. In peacetime, pay 50 administrative power and 75 ducats to support a school network for twenty years. Deferring leaves the foundation decision available later."
 uniate_church.6.t:0 "The First Seminary Schools"
 uniate_church.7.a:0 "A golden age of culture"
 uniate_church.7.b:0 "Maintain status quo"
 uniate_church.7.d:0 "Our Eastern Catholic bishops and Basilian monasteries patronize local arts and scholarship. They preserve manuscripts, commission icons in the Byzantine style, and support printing in Church Slavonic. This work serves our own communities; it does not make them one institution with every church using the Greek Catholic name."
 uniate_church.7.t:0 "Uniate Cultural Flowering"
 uniate_church.8.a:0 "Defend the Union"
 uniate_church.8.b:0 "Distance ourselves from Rome"
 uniate_church.8.d:0 "The Muscovite Patriarch has unleashed a storm of polemical letters and sermons against the Uniate Church, branding it a snare of Rome. Moscow postures as champion of eastern Orthodoxy to undermine our settlement."
 uniate_church.8.t:0 "Moscow's Anti-Union Campaign"
 uniate_church.9.a:0 "Fund the readers and missionaries in Lviv."
 uniate_church.9.b:0 "Wait for a better time"
 uniate_church.9.d:0 "The bishops ask for a mission in Lviv. The city keeps its present confession while readers and missionaries work there. Funding costs 100 ducats and 25 administrative power; no development is created."
 uniate_church.9.t:0 "Establishment of Greek Catholic Center"
 uniate_church_consolidation:0 "Uniate Church Consolidation"
 uniate_church_suppressed:0 "Uniate Church Suppressed"
 uniate_crown.1.a:0 "We want the word kingdom, written by a hand the west reads."
 uniate_crown.1.b:0 "We want a dispensation, and a succession that holds."
 uniate_crown.1.c:0 "Name nothing. The church is not the crown's to sell."
 uniate_crown.1.d:0 "The secretaries have set out what the crown needs and cannot obtain. Constantinople is under the Turk and can grant nothing that the western courts will read; the Patriarch's letters carry weight in our own churches and nowhere else.\n\nRome can grant those things. Rome has always been able to grant them. What Rome has never been offered is the obedience of a metropolitanate that keeps its own rite, its own liturgy and its own married clergy, and asks only that the commemoration change.\n\nThe metropolitan is not in this room."
 uniate_crown.1.t:0 "The Chancery Reads Its List"
 uniate_crown.2.a:0 "Sign the articles as they stand."
 uniate_crown.2.b:0 "Sign, but ask for a legate to stand behind us."
 uniate_crown.2.c:0 "Burn them. This is further than the crown may go."
 uniate_crown.2.d:0 "The articles have returned from the Curia, engrossed and sealed, and they are shorter than the embassy expected. The rite is untouched: the liturgy, the calendar, the married priests, the Slavonic books, the communion in both kinds. Nothing that a parish would notice on a Sunday.\n\nWhat is asked is the chain of command. The metropolitanate passes under Rome, the metropolitan is confirmed from Rome, and the commemoration at the anaphora changes from the Patriarch to the Pope.\n\nThe secretaries note, without being asked to, that our own synod has not seen these articles and is not named in them."
 uniate_crown.2.t:0 "The Terms Come Back Written"
 uniate_crown.3.a:0 "Keep him. Let the see be seen to continue."
 uniate_crown.3.b:0 "Replace him with a man who signed."
 uniate_crown.3.c:0 "Let him go where he likes. He will not go far."
 uniate_crown.3.d:0 "He learns of it from a chancery clerk, on an ordinary morning, from a copy made for the archive. Not from Rome, not from the crown, and not before it was done.\n\nHe is an old man and he does not raise his voice. He asks one question - whether the liturgy is to change - and when he is told that it is not, he sits down and says nothing for some time. Then he asks who signed for the church.\n\nThere is no good answer to that, and the clerk does not attempt one."
 uniate_crown.3.t:0 "The Metropolitan Learns of It"
 uniate_crown.4.a:0 "Every see subscribes, and every see is paid for it."
 uniate_crown.4.b:0 "The sees that will subscribe are enough."
 uniate_crown.4.c:0 "There will be no more synods. The crown will name the bishops."
 uniate_crown.4.d:0 "The bishops are summoned to a hall the crown pays for, and the articles are read to them by a royal secretary rather than by one of their own. They are not asked whether the union is to be made. They are asked to subscribe to a union that has been made.\n\nThe older sees understand at once what has happened to them and what will happen if they refuse. The younger men, who owe their mitres to the palace, look at the older men and wait.\n\nWhat is being decided in this hall is not doctrine. It is whether a Ruthenian synod is a council or a chancery."
 uniate_crown.4.t:0 "The Synod Is Told"
 uniate_crown.5.a:0 "Send commissioners. Buy the brotherhoods off."
 uniate_crown.5.b:0 "Send soldiers. The keys will be handed over."
 uniate_crown.5.c:0 "Leave them. A locked church opens by itself in winter."
 uniate_crown.5.d:0 "It reaches the villages the way everything reaches them: from the reader's desk, in the announcement that the commemoration has changed. One name is said where another was said before.\n\nIn most places nothing follows. The priest is the same man, the icons are in the same corners, the fast is kept on the same days. In some places the congregation walks out. In a few, the brotherhood locks the church and keeps the key, and the priest holds the liturgy on the porch.\n\nThe crown had reckoned on the bishops. It had not reckoned on the brotherhoods."
 uniate_crown.5.t:0 "The Parishes Hear It Last"
 uniate_crown.6.a:0 "Let it be proclaimed in every town we hold."
 uniate_crown.6.b:0 "Let it be filed. The succession is what mattered."
 uniate_crown.6.d:0 "The bull has come, and with it the thing the chancery named at the beginning.\n\nThe western courts read it the way they read such documents - carefully, and with an eye to what it costs them to acknowledge. But they do read it, and that is the whole difference. What a Patriarch under the Turk could not confer, a Pope has conferred in a single line.\n\nThe price is already paid. It was paid in the hall where the synod subscribed, and in the parishes where the key was handed over."
 uniate_crown.6.d.legate:0 "The legate has arrived, his commission broad and his faculties sealed in Rome.\n\nThe western courts read it the way they read such documents - carefully, and with an eye to what it costs them to acknowledge. But they do read it, and an apostolic judge now sits between the crown and the sees. What a Patriarch under the Turk could not confer, a Pope has conferred in a single line.\n\nThe price is already paid. It was paid in the hall where the synod subscribed, and in the parishes where the key was handed over."
 uniate_crown.6.d.marriage:0 "The dispensation has come, sealed in lead and written in the Latin of the Curia.\n\nThe western courts read it the way they read such documents - carefully, and with an eye to what it costs them to acknowledge. But they do read it, and the succession that was in doubt is now beyond challenge. What a Patriarch under the Turk could not confer, a Pope has conferred in a single line.\n\nThe price is already paid. It was paid in the hall where the synod subscribed, and in the parishes where the key was handed over."
 uniate_crown.6.d.title:0 "The bull has come, and with it the thing the chancery named at the beginning: the word kingdom, written by a hand the west reads.\n\nThe western courts read it the way they read such documents - carefully, and with an eye to what it costs them to acknowledge. But they do read it, and that is the whole difference. What a Patriarch under the Turk could not confer, a Pope has conferred in a single line.\n\nThe price is already paid. It was paid in the hall where the synod subscribed, and in the parishes where the key was handed over."
 uniate_crown.6.t:0 "What Was Bought"
 uniate_crown.7.a:0 "Endow the sees properly. A paid bishop complains less."
 uniate_crown.7.b:0 "Let the memorials be answered, point by point."
 uniate_crown.7.c:0 "They will be useful or they will be replaced."
 uniate_crown.7.d:0 "A generation has passed and the clergy have worked out what the settlement means for them. It means that a see is a crown appointment, that a complaint travels to the palace before it travels to Rome, and that a bishop who is inconvenient is a bishop who is replaced.\n\nThe better sort of them say so plainly, in memorials that are respectful and impossible to answer. The worse sort have simply learned to be useful.\n\nThe crown has a church that does what it is told. Whether it has a church anyone believes is a different account."
 uniate_crown.7.t:0 "The Standing Bill"
 uniate_crown.8.a:0 "Let it stand as it is. It works."
 uniate_crown.8.b:0 "Give the synod back its voice, now that it is safe to."
 uniate_crown.8.d:0 "Nobody now alive remembers the hall where the synod subscribed. The liturgy is what it always was; the commemoration is what the crown made it; and the men in the sees have never known any other arrangement.\n\nWhat the settlement produced is a church that is genuinely of this country and genuinely in communion with Rome, and which answers, in every practical matter, to the palace. Whether that is a Ruthenian church that found a protector or a royal department that says the liturgy is a question the century has stopped asking."
 uniate_crown.8.t:0 "Two Generations On"
