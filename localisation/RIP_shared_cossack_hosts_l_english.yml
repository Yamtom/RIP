 sloboda_imperial_integration:0 "Frontier-Imperial Accord"
 desc_sloboda_imperial_integration:0 "A blended model preserves frontier strengths while embedding them into imperial governance."
 sloboda_settlement_compacts:0 "Settlement Compacts"
