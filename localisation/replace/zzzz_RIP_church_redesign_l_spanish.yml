 rip_church_oppose_union_title:0 "Change our policy toward the Union"
 rip_church_recognition_refuse:0 "Claim an independent universal church — alternative history"
 rip_church_recognize_rite_button:0 "Recognize the local rite"
 rip_church_recognize_rite_button_tt:0 "Pay 1 ADM per current development; recognize the rite for at least ten years. The centre may not convert this parish."
 rip_church_reconcile_button:0 "Negotiate reconciliation"
 rip_church_reconcile_button_tt:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
 rip_church_reconcile_desc:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
