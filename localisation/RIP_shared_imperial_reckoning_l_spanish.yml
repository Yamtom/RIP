l_spanish:
 rip_tur_ruina_scorched_earth:0 "Tierra quemada en la Orilla Derecha"
 rip_tur_ruina_scorched_earth_title:0 "Tierra quemada en la Orilla Derecha"
 rip_tur_ruina_scorched_earth_desc:0 "Los asedios, las partidas tártaras y los incendios punitivos han vaciado las villas de Podolia y la Orilla Derecha, dejando las comarcas asoladas."
 desc_rip_tur_ruina_scorched_earth:0 "Las campañas punitivas y las tropas tártaras dejan villas arrasadas, guarniciones sin paga y campos yermos entre el Dniéster y el Dniéper."
 rip_tur_captive_galley_revolt:0 "Motines de los remeros cautivos"
 rip_tur_captive_galley_revolt_title:0 "Motines de los remeros cautivos"
 rip_tur_captive_galley_revolt_desc:0 "Cautivos encadenados de las incursiones del norte y los Balcanes llenan los bancos de boga imperiales hasta estallar en motines e incendios de atarazanas."
 desc_rip_tur_captive_galley_revolt:0 "El reclutamiento forzoso de remeros cautivos socava la moral naval y expone los arsenales a fugas organizadas."
 rip_plc_bloody_pacification:0 "La Pacificación sangrienta"
 rip_plc_bloody_pacification_title:0 "La Pacificación sangrienta"
 rip_plc_bloody_pacification_desc:0 "Las columnas privadas de los magnates, los alojamientos abusivos y las ejecuciones sumarias en aldeas rutenas encienden sublevaciones en los palatinados orientales."
 desc_rip_plc_bloody_pacification:0 "La pacificación coercitiva de los palatinados orientales quiebra la autoridad real y empuja a comarcas enteras a alzarse en armas."
 rip_rus_abolition_of_hetmanate:0 "Liquidación del Hetmanato y la Sich"
 rip_rus_abolition_of_hetmanate_title:0 "Liquidación del Hetmanato y la Sich"
 rip_rus_abolition_of_hetmanate_desc:0 "La supresión de los tribunales regimentales, el acantonamiento de dragones y las levas para canales del norte borran los antiguos fueros rutenos."
 desc_rip_rus_abolition_of_hetmanate:0 "La centralización imperial en la Orilla Izquierda y Zaporozhia provoca fuga fiscal, quema de registros y agitación fronteriza."
 rip_cri_yasyr_depopulation_crisis:0 "La Estepa vacía y la crisis del yasyr"
 rip_cri_yasyr_depopulation_crisis_title:0 "La Estepa vacía y la crisis del yasyr"
 rip_cri_yasyr_depopulation_crisis_desc:0 "Años de incursiones incesantes han despoblado los valles vecinos, hundiendo los peajes mientras los corrales de cautivos en Crimea incuban peste y represalias."
 desc_rip_cri_yasyr_depopulation_crisis:0 "La dependencia excesiva de los mercados de cautivos arruina las aduanas ordinarias y atrae represalias por tierra y mar."
 rip_tur_yasyr_port_tithe_title:0 "Recaudar el quinto portuario del yasyr"
 rip_tur_yasyr_port_tithe_desc:0 "Apostar comisarios del pencik en Kaffa y Ochákiv para reclamar el quinto del sultán sobre los cautivos rutenos para el tesoro y los remos de la flota."
 rip_tur_podillian_church_seizures_title:0 "Convertir las iglesias de piedra de Podolia"
 rip_tur_podillian_church_seizures_desc:0 "Confiscar iglesias fortificadas y rentas monásticas en Podolia para dotar mezquitas de guarnición, o confirmar las cartas de dhimma locales."
 rip_tur_devshirme_northern_levy_title:0 "Extender la leva severa del devshirme"
 rip_tur_devshirme_northern_levy_desc:0 "Ordenar a los comisarios jenízaros endurecer las levas de jóvenes en distritos cristianos y eyalatos del norte, o conmutarlas en dinero."
 rip_tur_surgun_forced_resettlement_title:0 "Dictar edictos de traslado forzoso sürgün"
 rip_tur_surgun_forced_resettlement_desc:0 "Obligar a gremios, familias y artesanos de provincias conquistadas a reasentarse en torno a Constantinopla y plazas fuertes, o usar fueros voluntarios."
 rip_tur_celali_anatolian_reprisals_title:0 "Ordenar la pacificación férrea en Anatolia"
 rip_tur_celali_anatolian_reprisals_desc:0 "Enviar columnas punitivas para aplastar las comarcas alzadas de Anatolia durante la agitación celalí, o proclamar una amnistía negociada."
 rip_tur_balkan_tribute_exactions_title:0 "Duplicar las exacciones del Danubio y la estepa"
 rip_tur_balkan_tribute_exactions_desc:0 "Exigir entregas extraordinarias de grano, ganado y plata a Moldavia, Valaquia y Yedisán para sostener los ejércitos en campaña."
 rip_plc_second_serfdom_corvee_title:0 "Imponer la corvea señorial ilimitada"
 rip_plc_second_serfdom_corvee_desc:0 "Respaldar a los magnates al exigir cinco jornadas semanales de prestación personal en las haciendas rutenas, o fijar un tope legal."
 rip_plc_ordinance_of_1638_title:0 "Promulgar la ordenanza real sobre los cosacos"
 rip_plc_ordinance_of_1638_desc:0 "Suprimir los mandos cosacos electos, imponer comisarios nobles sobre un registro reducido y someter a los excluidos al régimen señorial."
 rip_plc_parish_sequestrations_title:0 "Secuestrar las parroquias ortodoxas renuentes"
 rip_plc_parish_sequestrations_desc:0 "Clausurar templos y rentas monásticas en las ciudades rutenas que rechacen los decretos episcopales, o confirmar la paz confesional urbana."
 rip_rus_kyiv_press_censorship_title:0 "Someter las imprentas de Kiev y Cherníhiv"
 rip_rus_kyiv_press_censorship_desc:0 "Subordinar las imprentas rutenas, textos académicos y usos cancillerescos a la censura sinodal, o respetar las cartas de imprenta locales."
 rip_cri_kaffa_captive_markets_title:0 "Ampliar los mercados de cautivos de Kaffa y Perekop"
 rip_cri_kaffa_captive_markets_desc:0 "Conceder rebajas fiscales a mirzas y capitanes para canalizar el yasyr ruteno hacia Kaffa, o limitar las incursiones bajo aranceles tamga fijos."
 rip_tur_seized_parishes:0 "Bienes parroquiales confiscados"
 desc_rip_tur_seized_parishes:0 "La confiscación de iglesias y rentas parroquiales indigna al vecindario cristiano y retrae la recaudación."
 rip_tur_uprooted_quarters:0 "Barrios artesanos desarraigados"
 desc_rip_tur_uprooted_quarters:0 "Las deportaciones forzosas del sürgün han dejado talleres cerrados y puestos medio vacíos."
 rip_tur_great_flight:0 "Huida campesina de la turbulencia"
 desc_rip_tur_great_flight:0 "Los incendios punitivos y multas colectivas han empujado a los aldeanos hacia las montañas y ciudades lejanas."
 rip_plc_folwark_exhaustion:0 "Haciendas agotadas por la corvea"
 desc_rip_plc_folwark_exhaustion:0 "Cinco días semanales de corvea aumentan el grano exportado a costa de deserciones campesinas y sordo descontento."
 rip_plc_closed_parishes:0 "Iglesias ortodoxas clausuradas"
 desc_rip_plc_closed_parishes:0 "Los templos sellados o arrendados convierten cada festividad en foco de alborotos."
 rip_rus_silenced_presses:0 "Imprentas kievitas intervenidas"
 desc_rip_rus_silenced_presses:0 "Las cajas tipográficas selladas por el Sínodo asfixian el intercambio erudito y la edición local."
 rip_tur_pencik_notoriety:0 "Quinto del pencik en el mar Negro"
 desc_rip_tur_pencik_notoriety:0 "Las subastas sistemáticas de cautivos en puertos imperiales enriquecen las aduanas mientras alarman a los reinos cristianos."
 rip_tur_ransom_brokerage:0 "Corretaje regulado de rescates"
 desc_rip_tur_ransom_brokerage:0 "Priorizar el canje mediante rescate sobre los remos forzados reduce las tensiones fronterizas a costa de menores ingresos."
 rip_tur_coercive_eyalet_rule:0 "Administración coercitiva de eyalato"
 desc_rip_tur_coercive_eyalet_rule:0 "Convertir grandes iglesias urbanas en mezquitas acelera la conformidad religiosa pero enajena a las comunidades locales."
 rip_tur_podillian_dhimma_charter:0 "Carta dhimma en Podolia"
 desc_rip_tur_podillian_dhimma_charter:0 "Garantizar los templos bajo el fuero dhimma calma las ciudades fronterizas cediendo margen a los notables locales."
 rip_tur_harsh_devshirme:0 "Leva rigurosa de devshirme"
 desc_rip_tur_harsh_devshirme:0 "Las cuotas ampliadas nutren los regimientos imperiales a costa de honda hostilidad en los distritos cristianos."
 rip_tur_devshirme_commutation:0 "Listas de leva conmutadas"
 desc_rip_tur_devshirme_commutation:0 "Aceptar pagos en metálico en lugar de reclutas alivia a las familias aunque frena la reposición de tropas."
 rip_tur_surgun_edicts:0 "Decretos imperiales de sürgün"
 desc_rip_tur_surgun_edicts:0 "Los traslados forzosos remodelan las ciudades conquistadas mientras despiertan recelos dentro y fuera del imperio."
 rip_tur_voluntary_charters:0 "Patentes voluntarias de gremios"
 desc_rip_tur_voluntary_charters:0 "Atraer artesanos con exenciones fiscales en lugar de deportaciones facilita la integración provincial."
 rip_tur_iron_pacification:0 "Mano de hierro en Anatolia"
 desc_rip_tur_iron_pacification:0 "Las represalias sumarias quiebran pronto a las partidas armadas pero dejan las listas fiscales esquilmadas."
 rip_tur_anatolian_amnesty:0 "Cartas de amnistía en Anatolia"
 desc_rip_tur_anatolian_amnesty:0 "Los perdones y rebajas fiscales devuelven a los aldeanos a sus tierras a cambio de menor control central."
 rip_tur_danubian_exactions:0 "Exacciones extraordinarias del Danubio"
 desc_rip_tur_danubian_exactions:0 "Las levas extraordinarias exprimen a los tributarios y empujan a sus príncipes hacia protectores del norte."
 rip_tur_fixed_danubian_tribute:0 "Lista jurada de tributo"
 desc_rip_tur_fixed_danubian_tribute:0 "Respetar topes fijos de tributo mantiene dóciles a los principados danubianos aunque reduzca los ingresos."
 rip_plc_second_serfdom:0 "Servidumbre de las haciendas señoriales"
 desc_rip_plc_second_serfdom:0 "Los campesinos adscritos generan grandes excedentes de grano mientras la fuga y el rencor merman la leva real."
 rip_plc_capped_corvee:0 "Límite legal de corveas"
 desc_rip_plc_capped_corvee:0 "Los comisarios reales acotan las exigencias señoriales en el este y calman las aldeas pese a las quejas nobiliarias."
 rip_plc_crown_ordinance:0 "Supresión de la oficialidad cosaca"
 desc_rip_plc_crown_ordinance:0 "Privar a los regimientos cosacos de sus mandos electos refuerza el control noble en el Dniéper pero quiebra la caballería fronteriza."
 rip_plc_regimental_liberties:0 "Libertades regimentales juradas"
 desc_rip_plc_regimental_liberties:0 "Respetar las elecciones cosacas y las pagas mantiene viva la caballería fronteriza a costa del mando directo real."
 rip_plc_confessional_coercion:0 "Política de secuestro confesional"
 desc_rip_plc_confessional_coercion:0 "Cerrar parroquias ortodoxas en disputa impulsa las conversiones forzadas pero enturbia la relación con los vecinos orientales."
 rip_plc_municipal_confession_peace:0 "Paz confesional municipal rutena"
 desc_rip_plc_municipal_confession_peace:0 "Las escuelas de hermandades y parroquias abiertas apaciguan los gremios urbanos aunque frenan las conversiones."
 rip_rus_imperial_uniformity:0 "Uniformidad sinodal de imprenta"
 desc_rip_rus_imperial_uniformity:0 "La censura sinodal obligatoria borra la tradición impresora rutena y vuelve más recelosa la adopción de nuevas ideas."
 rip_rus_ruthenian_charters_spared:0 "Privilegios preservados de la imprenta académica"
 desc_rip_rus_ruthenian_charters_spared:0 "Dejar abiertas las prensas de Kiev y Cherníhiv difunde con rapidez las letras por las diócesis del imperio."
 rip_cri_slave_mart_infamy:0 "Infamia de los mercados de cautivos"
 desc_rip_cri_slave_mart_infamy:0 "Las razias ampliadas enriquecen a los jinetes pero tornan casi imposibles los tratados estables con las cortes cristianas."
 rip_cri_reformed_tamga:0 "Tamga jurado de sal y caravanas"
 desc_rip_cri_reformed_tamga:0 "Limitar las subastas de cautivos en favor de aduanas de sal y pieles mejora el crédito diplomático a costa del botín."
 rip_tur_reckoning.1.t:0 "Comisarios para el quinto del yasyr"
 rip_tur_reckoning.1.d:0 "Cuerdas de cautivos apresados en el Dniéper y Podolia cruzan Perekop hacia los muelles de Kaffa y Ochákiv. El tesoro urge tomar el quinto del sultán para remeros y arcas, mientras otros corredores proponen canjes regulados."
 rip_tur_reckoning.1.a:0 "Reclamar el quinto del sultán para arcas y galeras."
 rip_tur_reckoning.1.result_tt:0 "Habilita motines en galeras; tras 180 días, Quinto del pencik por 15 años junto a agitación y devastación en Kaffa y Yedisán."
 rip_tur_reckoning.1.b:0 "Limitar las cuotas portuarias al corretaje de rescate."
 rip_tur_reckoning.2.t:0 "Remeros en los arsenales"
 rip_tur_reckoning.2.d:0 "Las noticias de corrales atestados y remeros encadenados llegan a las cortes del norte y encienden la agitación en los puertos."
 rip_tur_reckoning.2.a:0 "Doblar la guardia en las atarazanas."
 rip_tur_reckoning.3.t:0 "Iglesias de las villas de Podolia"
 rip_tur_reckoning.3.d:0 "Tras entrar las enseñas en Podolia, los predicadores exigen convertir las principales iglesias de piedra en mezquitas. Los burgueses invocan antiguos fueros dhimma."
 rip_tur_reckoning.3.a:0 "Confiscar las iglesias para dotar mezquitas."
 rip_tur_reckoning.3.result_tt:0 "Tras 150 días, una provincia cristiana de Podolia o Rutenia sufre 20 de devastación, 6 de agitación y Bienes parroquiales confiscados, más Administración coercitiva de eyalato por 15 años."
 rip_tur_reckoning.3.b:0 "Confirmar la protección dhimma sobre las parroquias."
 rip_tur_reckoning.4.t:0 "Vecindario amargado bajo los nuevos alminares"
 rip_tur_reckoning.4.d:0 "Las campanas fueron fundidas y las rentas entregadas a los sipahis, pero los vecinos cierran talleres y huyen hacia el norte."
 rip_tur_reckoning.4.a:0 "Apostar guardias en las puertas."
 rip_tur_reckoning.5.t:0 "Endurecimiento de la leva del devshirme"
 rip_tur_reckoning.5.d:0 "Los oficiales reclutadores piden barrer exenciones y amparos de hijos únicos en aldeas cristianas para llenar los cuarteles. Los ancianos ruegan poder conmutar la leva en plata."
 rip_tur_reckoning.5.a:0 "Apartar exenciones y exigir la leva completa."
 rip_tur_reckoning.5.result_tt:0 "Tras 180 días, una provincia cristiana pierde 1 de soldadesca base (o sufre 20 de devastación) y gana 5 de agitación, con Leva rigurosa por 15 años."
 rip_tur_reckoning.5.b:0 "Aceptar en cambio la conmutación en plata."
 rip_tur_reckoning.6.t:0 "Hogares vacíos tras partir los reclutadores"
 rip_tur_reckoning.6.d:0 "Muchos mozos huyeron a los bosques ante los escribas, dejando registros fiscales mermados y aldeas hostiles."
 rip_tur_reckoning.6.a:0 "Enviar las levas a las compañías de instrucción."
 rip_tur_reckoning.7.t:0 "Listas de traslado del sürgün"
 rip_tur_reckoning.7.d:0 "El Diván estudia obligar a barrios enteros de artesanos griegos, armenios, eslavos y judíos a trasladarse bajo escolta a Constantinopla y plazas fuertes."
 rip_tur_reckoning.7.a:0 "Ejecutar las columnas de traslado sürgün."
 rip_tur_reckoning.7.result_tt:0 "Tras 180 días, dos provincias no turcas sufren 20 de devastación, 5 de agitación y Barrios artesanos desarraigados por 15 años, junto a Decretos imperiales de sürgün."
 rip_tur_reckoning.7.b:0 "Ofrecer cartas de asentamiento voluntario."
 rip_tur_reckoning.8.t:0 "Telares detenidos tras las caravanas"
 rip_tur_reckoning.8.d:0 "Nuevos talleres abren junto al Cuerno de Oro, mientras las calles de origen quedan apagadas y medio vacías."
 rip_tur_reckoning.8.a:0 "Registrar los gremios trasladados en Constantinopla."
 rip_tur_reckoning.9.t:0 "La pacificación en Anatolia"
 rip_tur_reckoning.9.d:0 "Arcabuceros licenciados y partidas celalíes paralizan los caminos de Anatolia. Los generales exigen represalias colectivas, mientras los cadíes advierten que los valles arrasados no rendirán tributo."
 rip_tur_reckoning.9.a:0 "Desatar las columnas punitivas y multas colectivas."
 rip_tur_reckoning.9.result_tt:0 "Tras 150 días, dos provincias de Anatolia sufren 30 de devastación y Huida campesina por 15 años, junto a Mano de hierro en Anatolia."
 rip_tur_reckoning.9.b:0 "Proclamar amnistía y rebajar las cargas rurales."
 rip_tur_reckoning.10.t:0 "Pozos cegados y aldeas abandonadas"
 rip_tur_reckoning.10.d:0 "Las partidas celalíes fueron quebradas, pero la huida masiva ha dejado comarcas enteras de Anatolia vacías."
 rip_tur_reckoning.10.a:0 "Comprobar lo que queda en los registros fiscales."
 rip_tur_reckoning.11.t:0 "Exacciones extraordinarias en la marca danubiana"
 rip_tur_reckoning.11.d:0 "Los intendentes exigen a Moldavia, Valaquia y Yedisán carros de trigo, ganado y plata muy por encima de los tributos jurados."
 rip_tur_reckoning.11.a:0 "Exigir de inmediato la doble requisa."
 rip_tur_reckoning.11.result_tt:0 "Tras 180 días, Moldavia, Valaquia y vasallos rutenos ganan 25 de deseo de libertad, una provincia sufre 25 de devastación y 5 de agitación, con Exacciones extraordinarias del Danubio."
 rip_tur_reckoning.11.b:0 "Respetar el tributo jurado en tiempo de paz."
 rip_tur_reckoning.12.t:0 "Rencor en las cortes tributarias"
 rip_tur_reckoning.12.d:0 "Los carros de abastos marchan al sur mientras boyardos moldavos y notables fronterizos buscan en secreto protectores en el norte."
 rip_tur_reckoning.12.a:0 "Vigilar de cerca los pasos del río."
 rip_tur_reckoning.13.t:0 "Villas asoladas de la Orilla Derecha"
 rip_tur_reckoning.13.d:0 "Auxiliares impagos e incendios reducen a cenizas villas de Podolia y la Orilla Derecha, aislando guarniciones entre campos yermos y alzamientos."
 rip_tur_reckoning.13.a:0 "Sostener las ciudadelas y abandonar los campos."
 rip_tur_reckoning.13.b:0 "Repartir plata para refrenar a los forrajeadores."
 rip_tur_reckoning.14.t:0 "Cenizas entre el Dniéster y el Dniéper"
 rip_tur_reckoning.14.d:0 "Las guarniciones vaciaron los graneros antes del invierno, empujando a los aldeanos restantes a alzarse o huir."
 rip_tur_reckoning.14.a:0 "Requisar caballos y pólvora a toda costa."
 rip_tur_reckoning.14.b:0 "Enviar barcazas de grano de socorro río arriba."
 rip_tur_reckoning.15.t:0 "Patrullas fronterizas restablecidas"
 rip_tur_reckoning.15.d:0 "Remiten los peores estragos entre el Dniéster y el Dniéper, aunque aldeas arruinadas recuerdan el coste de la campaña."
 rip_tur_reckoning.15.a:0 "Asentar las comarcas pacificadas en el registro."
 rip_tur_reckoning.16.t:0 "Sublevación en los bancos de las galeras"
 rip_tur_reckoning.16.d:0 "Cautivos rutenos y fronterizos se alzan con hachas y pernos en las galeras fondeadas y prenden fuego a los astilleros."
 rip_tur_reckoning.16.a:0 "Ordenar a los arcabuceros despejar las cubiertas."
 rip_tur_reckoning.16.b:0 "Sustituir a los forzados por remeros a sueldo."
 rip_tur_reckoning.17.t:0 "Fugas en las atarazanas del mar Negro"
 rip_tur_reckoning.17.d:0 "Dotaciones enteras de boga han roto sus cadenas en alta mar o huido en barcas pesqueras dejando las escuadras sin remos."
 rip_tur_reckoning.17.a:0 "Llevar a los jornaleros del puerto a los bancos."
 rip_tur_reckoning.17.b:0 "Pagar primas a remeros libres de la costa."
 rip_tur_reckoning.18.t:0 "Regresa la calma a las escuadras"
 rip_tur_reckoning.18.d:0 "Tras graves pérdidas de remeros y cascos quemados, vuelve la disciplina a los arsenales bajo vigilancia estricta."
 rip_tur_reckoning.18.a:0 "Reparar los cascos supervivientes."
 rip_plc_reckoning.1.t:0 "Corveas en las haciendas fluviales"
 rip_plc_reckoning.1.d:0 "Los grandes arrendatarios del Bug, Dniéster y Dniéper exigen cinco días semanales de corvea para cargar las barcazas hacia el Báltico. Los comisarios advierten de graneros quemados y fugas."
 rip_plc_reckoning.1.a:0 "Respaldar los cinco días de corvea señorial."
 rip_plc_reckoning.1.result_tt:0 "Habilita el riesgo de crisis; tras 180 días, una provincia rutena gana 6 de agitación y Haciendas agotadas por 20 años, junto a Servidumbre señorial."
 rip_plc_reckoning.1.b:0 "Imponer un tope real a los señoríos."
 rip_plc_reckoning.2.t:0 "Fuegos nocturnos en los graneros"
 rip_plc_reckoning.2.d:0 "Las barcazas parten llenas hacia Danzig mientras los arrendatarios reclaman dragones para perseguir a los siervos fugados."
 rip_plc_reckoning.2.a:0 "Anotar las quejas de los señores."
 rip_plc_reckoning.3.t:0 "Abolición de los mandos cosacos"
 rip_plc_reckoning.3.d:0 "Tras choques fronterizos, los nobles en la Dieta piden abolir las libertades cosacas, recortar el registro, imponer coroneles nobles y entregar a los excluidos al señorío."
 rip_plc_reckoning.3.a:0 "Promulgar la ordenanza e imponer coroneles nobles."
 rip_plc_reckoning.3.result_tt:0 "Habilita el riesgo de crisis; tras 150 días los cosacos pierden 25 de lealtad, una provincia sufre 8 de agitación y 15 de devastación, con Supresión de la oficialidad cosaca."
 rip_plc_reckoning.3.b:0 "Mantener los coroneles electos y las pagas."
 rip_plc_reckoning.4.t:0 "Juntas secretas bajo los rápidos"
 rip_plc_reckoning.4.d:0 "Borrados de las listas, los veteranos cabalgan hacia Zaporozhia jurando que la ordenanza no pasará de la primavera."
 rip_plc_reckoning.4.a:0 "Reforzar los fuertes del río."
 rip_plc_reckoning.5.t:0 "Puertas cerradas en parroquias rutenas"
 rip_plc_reckoning.5.d:0 "Alguaciles reales aguardan ante iglesias ortodoxas e imprentas de hermandades para embargar las rentas de quienes rechazan los decretos."
 rip_plc_reckoning.5.a:0 "Ejecutar los secuestros y sellar los templos."
 rip_plc_reckoning.5.result_tt:0 "Tras 180 días, una provincia ortodoxa rutena gana 6 de agitación e Iglesias ortodoxas clausuradas por 15 años, con Política de secuestro confesional."
 rip_plc_reckoning.5.b:0 "Proclamar la paz confesional urbana."
 rip_plc_reckoning.6.t:0 "Multitudes ante la nave sellada"
 rip_plc_reckoning.6.d:0 "Los feligreses expulsan a los arrendatarios y envían súplicas a las cortes ortodoxas más allá de la frontera."
 rip_plc_reckoning.6.a:0 "Convocar a los alguaciles de la villa."
 rip_plc_reckoning.7.t:0 "Comienza la Pacificación sangrienta"
 rip_plc_reckoning.7.d:0 "Nobles armados y dragones recorren las aldeas rutenas quemando graneros y tomando rehenes. Campesinos y vecinos toman guadañas y mosquetes en los palatinados."
 rip_plc_reckoning.7.a:0 "Dar carta blanca a las columnas punitivas."
 rip_plc_reckoning.7.b:0 "Detener las columnas y restaurar los tribunales locales."
 rip_plc_reckoning.8.t:0 "Banderas privadas en las aldeas"
 rip_plc_reckoning.8.d:0 "Los mesnaderos cobran atrasos a punta de sable mientras los enviados reales piden tregua antes de que arda toda la frontera."
 rip_plc_reckoning.8.a:0 "Mantener las confiscaciones para el tesoro."
 rip_plc_reckoning.8.b:0 "Enviar jueces reales a oír los agravios."
 rip_plc_reckoning.9.t:0 "Tregua en los palatinados orientales"
 rip_plc_reckoning.9.d:0 "Las columnas armadas se retiran a cuarteles de invierno dejando haciendas quemadas y aldeas recelosas."
 rip_plc_reckoning.9.a:0 "Confirmar la tregua ante la Dieta."
 rip_rus_reckoning.1.t:0 "Inspectores para las imprentas de Kiev"
 rip_rus_reckoning.1.d:0 "Los censores sinodales protestan porque las imprentas de Kiev y Cherníhiv editan cartillas y tratados con ortografía rutena propia. Un ucase sometería cada prensa a Petersburgo."
 rip_rus_reckoning.1.a:0 "Imponer censura sinodal y sellar las prensas."
 rip_rus_reckoning.1.result_tt:0 "Acelera la crisis del Hetmanato; tras 180 días Kiev (o Cherníhiv) sufre 6 de agitación e Imprentas kievitas intervenidas por 20 años, junto a Uniformidad sinodal."
 rip_rus_reckoning.1.b:0 "Respetar las cartas de imprenta de la academia."
 rip_rus_reckoning.2.t:0 "Las cajas de la Laura selladas"
 rip_rus_reckoning.2.d:0 "Cajas de tipos y manuscritos parten hacia la cancillería del gobernador entre el murmullo airado de estudiantes y burgueses de Kiev."
 rip_rus_reckoning.2.a:0 "Archivar el inventario de censura."
 rip_rus_reckoning.3.t:0 "Liquidación del Hetmanato y la Sich"
 rip_rus_reckoning.3.d:0 "Regimientos imperiales entran en las villas regimentales y descienden hacia los rápidos del Dniéper para disolver la Sich, imponer gobernadores e inscribir a los cosacos libres."
 rip_rus_reckoning.3.a:0 "Abolir los fueros regimentales y arrasar la Sich."
 rip_rus_reckoning.3.b:0 "Suavizar el ucase dejando amplia autonomía local."
 rip_rus_reckoning.4.t:0 "Levas para canales y fuga cosaca"
 rip_rus_reckoning.4.d:0 "Las partidas cosacas enviadas a excavar canales al norte caen presas de las fiebres mientras familias enteras huyen más allá de la frontera."
 rip_rus_reckoning.4.a:0 "Mantener las levas pese a las bajas."
 rip_rus_reckoning.4.b:0 "Pagar compensaciones y licenciar las levas."
 rip_rus_reckoning.5.t:0 "Frontera acallada bajo los gobernadores"
 rip_rus_reckoning.5.d:0 "Remite la resistencia armada en la Orilla Izquierda y Zaporozhia; las viejas matrículas cosacas pasan al archivo mientras abren las oficinas fiscales."
 rip_rus_reckoning.5.a:0 "Cerrar el libro fronterizo."
 rip_cri_reckoning.1.t:0 "Mercaderes de Kaffa y Perekop"
 rip_cri_reckoning.1.d:0 "Mirzas llegados del norte piden rebajas fiscales para ampliar los corrales de cautivos en Kaffa y Perekop. Viejos beys caravaneros advierten que ese tráfico vacía los valles vecinos y atrae represalias."
 rip_cri_reckoning.1.a:0 "Rebajar aranceles y ampliar los corrales."
 rip_cri_reckoning.1.result_tt:0 "Acelera la crisis de despoblación; tras 180 días Infamia de los mercados de cautivos por 15 años mientras Kaffa (o Crimea) sufre 4 de agitación y 15 de devastación."
 rip_cri_reckoning.1.b:0 "Frenar las subastas bajo aranceles de caravana fijos."
 rip_cri_reckoning.2.t:0 "Represalias más allá de los vados"
 rip_cri_reckoning.2.d:0 "Las subastas llenan las arcas de los mirzas, pero flotillas de chaikas y embajadas denuncian al kanato ante todas las cortes."
 rip_cri_reckoning.2.a:0 "Apostar vigías en la barra costera."
 rip_cri_reckoning.3.t:0 "Pastos vacíos y peste en los corrales"
 rip_cri_reckoning.3.d:0 "Las comarcas vecinas de Podolia y el Dniéper han quedado demasiado vacías para las caravanas de sal, y el hacinamiento en los corrales costeros propaga la fiebre."
 rip_cri_reckoning.3.a:0 "Aislar los barrios afectados y dispersar los rebaños."
 rip_cri_reckoning.3.b:0 "Abrir los corrales a rescates diplomáticos."
 rip_cri_reckoning.4.t:0 "Incursiones costeras y caravanas arruinadas"
 rip_cri_reckoning.4.d:0 "Lanchas armadas golpean los fondeaderos de Crimea entre la niebla para liberar cautivos mientras caen las aduanas."
 rip_cri_reckoning.4.a:0 "Rehacer los baluartes costeros con fondos del tesoro."
 rip_cri_reckoning.4.b:0 "Retirar jinetes de los puertos para guardar pastos."
 rip_cri_reckoning.5.t:0 "Las caravanas de sal regresan a Perekop"
 rip_cri_reckoning.5.d:0 "Remitida la fiebre y priorizados los aranceles regulares sobre las subastas de cautivos, los mercaderes vuelven a cruzar Perekop."
 rip_cri_reckoning.5.a:0 "Reabrir la aduana de Perekop."
