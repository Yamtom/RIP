 UZH_CULTURE_PLURAL_RUSYN:0 "Rusyns"
 UZH_CULTURE_PLURAL_RUTHENIAN:0 "Ruthenians"
 UZH_CULTURE_SINGULAR_HUNGARIAN:0 "Carpathian"
 UZH_CULTURE_SINGULAR_RUSYN:0 "Rusyn"
 UZH_CULTURE_SINGULAR_RUTHENIAN:0 "Ruthenian"
 UZH_Huszt_Name:0 "Khust"
 UZH_Huszt_Name_ADJ:0 "Khustian"
 UZH_Zakarpattia_Name:0 "Zakarpattia"
 UZH_Zakarpattia_Name_ADJ:0 "Zakarpattian"
 UZH_agriculture_pastures_tt:0 "Control at least §Ytwo§! livestock provinces in the Carpathian region."
 UZH_bartka:0 "Bartka"
 UZH_bartka_desc:0 "Among the Lemkos, the Bartka is not just a tool, but a symbol of pride and strength. A narrow-nosed axe with a blunt hammer on the reverse and a long handle, it serves both as a weapon and a sign of belonging, echoing across the Carpathian peaks with the sound of the trembita."
 UZH_carpathian_fort:0 "Carpathian Fortifications"
 UZH_carpathian_fort_desc:0 "Our people possess a unique skill of constructing fortifications that can withstand any threat. We should take advantage of this and build up our cities under our control in the Carpathians."
 UZH_carthpatia_fort:0 "Carpathian Fortresses"
 UZH_carthpatia_fort_desc:0 "The Carpathian mountains provide natural protection for our people. By building fortresses in strategic mountain passes, we can ensure our nation's security."
 UZH_congress_border_bastion_border_req_tt:0 "Hold §G60%§! reserves, §Y30§! Army Tradition, §G40%§! professionalism, and three tier §Y3§! forts in §YCarpathia§!."
 UZH_congress_border_bastion_border_tt:0 "§YBorder Bulwark Outcome:§! Permanently gain §YBorder Drill§!, receive §Y8,000§! manpower, §Y150§! Military Power, §G+5%§! Army Professionalism, and §G+15§! Army Tradition."
 UZH_congress_border_bastion_subject_req_tt:0 "Sustain §Ytwo§! loyal subjects with charters active and §G+125§! opinion, each below §G45%§! Liberty Desire."
 UZH_congress_border_bastion_subject_tt:0 "§YPan-Ruthenian Outcome:§! Gain §YPan-Ruthenian Union§! for §Y15§! years, receive §Y125§! Diplomatic Power, §Y40§! Government Reform Progress, and either §G+8§! Republican Tradition or §G+10§! Legitimacy based on our government."
 UZH_congress_subject_hegemony_border_req_tt:0 "Keep §Y55%§! manpower reserves, §G35%§! professionalism, and two §YCarpathian§! forts at tier §Y2§!."
 UZH_congress_subject_hegemony_border_tt:0 "§YBorder Drill Outcome:§! Gain §YBorder Drill§! for §Y25§! years, receive §Y5,000§! manpower, §Y125§! Military Power, §G+3%§! Army Professionalism, §G+10§! Army Tradition, improve subject opinion if applicable, and gain §Y35§! Government Reform Progress."
 UZH_congress_subject_hegemony_subject_req_tt:0 "Maintain at least §Yone§! loyal subject with §G+100§! opinion and Liberty Desire under §G50%§!."
 UZH_congress_subject_hegemony_subject_tt:0 "§YSubject Charter Outcome:§! Permanently gain §YSubject Charters§!, every subject loses §G10§! Liberty Desire and receives the §YGranted Privileges§! opinion bonus, while we gain §Y150§! Diplomatic Power and §Y50§! Government Reform Progress."
 UZH_consolidate_rusin_authority_desc:0 "We must strengthen our authority over the [Root.GetUZHIdentityCultureAdjective] lands to ensure our people's future."
 UZH_consolidate_rusin_authority_title:0 "Consolidate Rusyn Authority"
 UZH_constitutional_monarchy_tt:0 "§YConstitutional Framework:§! Permanently gain §YConstitutional System§!, receive §YStatute Codification§! for §Y25§! years, gain §G15§! Legitimacy, §Y50§! Government Reform Progress, and if the Nobility or Burghers exist they gain §G+10§! loyalty."
 UZH_establish_rusin_metropolis_desc:0 "We shall establish a grand metropolis that will serve as the cultural and political center for all [Root.GetUZHIdentityCulturePlural]."
 UZH_establish_rusin_metropolis_title:0 "Establish Rusyn Metropolis"
 UZH_expand_into_pannonia_desc:0 "The fertile plains of Pannonia are crucial for our nation's growth and prosperity."
 UZH_expand_into_pannonia_title:0 "Expand into Pannonia"
 UZH_federalization_common_tt:0 "§YFederal Mandate:§! Permanently gain §YFederal Structure§!, every subject loses §G10§! Liberty Desire, and we gain §Y75§! Government Reform Progress."
 UZH_federalization_monarchy_tt:0 "§YConstitutional Settlement:§! If the Constitutional Framework path is active, gain §G+10§! Legitimacy."
 UZH_federalization_republic_tt:0 "§YPannonian Compact Settlement:§! If the Pannonian Republic path is active, gain §G+15§! Republican Tradition."
 UZH_federalization_subjects_tt:0 "All subjects must have §YLiberty Desire§! below §Y60§!."
 UZH_federative_statutes_loyal_subjects_tt:0 "Maintain at least §Ytwo§! subjects with Liberty Desire under §G50%§!."
 UZH_federative_statutes_reward_tt:0 "§YFederative Statutes:§! Monarchies gain §G+200§! Governing Capacity, republics enjoy §G-5%§! Autonomy Change Time, each subject loses §G10§! Liberty Desire, and we gain §Y75§! Government Reform Progress."
 UZH_free_trade:0 "Unrestricted Trade"
 UZH_free_trade_desc:0 "Trade is unrestricted on our Intercarpathian land. Anyone can trade with anyone else for any goods. This has made our region a popular destination for traders and merchants."
 UZH_great_migration_culture_tt:0 "§YCarpathian Census:§! Own at least §Y8§! provinces in the Carpathia region that match the culture you have chosen."
 UZH_hungarian_protection_charter_tt:0 "§YCharter Proceedings:§! Triggers the charter event, sets the §YCharter Signed§! flag, and records whichever monarchy pledges to patronize us."
 UZH_hungarian_protection_option_a_tt:0 "§YHungarian Tutelage Outcome:§! Keeps §YAdvisor Pool§! for §Y15§! years, grants §G50§! Diplomatic Power, and if Hungary exists and is not our ally their opinion of us improves."
 UZH_hungarian_protection_option_b_tt:0 "§YLocal Autonomy Outcome:§! Keeps §YAdvisor Pool§! for §Y15§! years, grants §G100§! Diplomatic Power, and awards §G10§! Prestige."
 UZH_ideas:0 "Husztian Ideas"
 UZH_ideas_bonus:0 "Husztian Ambitions"
 UZH_ideas_start:0 "Husztian Traditions"
 UZH_identity_question_culture_tt:0 "§YAllegiance Threshold:§! Control at least §Y5§! provinces of the people you have chosen before convening the congress."
 UZH_industrial_coal_tt:0 "Own at least §Yone§! province producing §YCoal§!."
 UZH_laws:0 "Laws of Uzhhorod"
 UZH_laws_desc:0 "We will establish a new set of laws based on the principles of law used in the German city of Magdeburg. These laws will be adapted to our own traditions and practices."
 UZH_mount_faith:0 "Carpathian Mountain Faith"
 UZH_mount_faith_desc:0 "The unique geographic isolation of the Carpathian mountains has fostered religious tolerance among our people."
 UZH_mountain_faith:0 "Mountain Faith"
 UZH_mountain_faith_desc:0 "In our mountain strongholds, faith is woven into the very fabric of life, a legacy passed down through generations. Whether it be worship of the divine or reverence for the ancient spirits of the forest, our people hold fast to their ancestral beliefs."
 UZH_orthodox_unity_culture_tt:0 "§YMetropolitan Network:§! Own at least §Y8§! Orthodox provinces that share your chosen culture."
 UZH_palatial_reform_subject_seats_tt:0 "§YPalatine Chambers:§! Assign at least §Y5§! parliamentary seats to §YCarpathian§! provinces inside the federation."
 UZH_pan_congress_carpathia_tt:0 "§YCarpathian Delegations:§! Hold §Y1§! province of your chosen culture in the Carpathia region."
 UZH_pan_congress_poland_tt:0 "§YPolish Delegations:§! Hold §Y1§! province of your chosen culture in the Poland region."
 UZH_pan_congress_ruthenia_tt:0 "§YRuthenian Delegations:§! Hold §Y3§! provinces of your chosen culture in the Ruthenia region."
 UZH_pan_congress_steppe_tt:0 "§YSteppe Delegations:§! Hold §Y1§! province of your chosen culture in the Lower Dniepr or Azov frontier."
 UZH_pannonian_compact_government_tt:0 "Either maintain a republican government or complete the Constitutional Framework mission to adapt the compact for monarchic rule."
 UZH_pannonian_expansion_culture_tt:0 "§YAt least three§! owned provinces in the §YAlföld§! area must match our chosen Rusyn custom."
 UZH_pannonian_republic_foundation_tt:0 "§YPannonian Compromise:§! Permanently gain §YPannonian Autonomy§! and §YCarpathian Hegemony§!, receive §YPannonian League§! for §Y25§! years and §YBorder Guard Union§! for §Y15§! years, gain §G6,000§! manpower, and §Y50§! Government Reform Progress."
 UZH_pannonian_republic_reform_choice_tt:0 "§YGovernment Outcome:§!\n- If a republic: gain §G+12§! Republican Tradition and, if the Burghers exist, §G+10§! loyalty.\n- If a monarchy: gain §G+15§! Legitimacy and, if the Nobility exists, §G+10§! loyalty.\n- Otherwise: gain §G+1§! Stability and, if the Clergy exists, §G+10§! loyalty."
 UZH_protect_rusin_heritage_desc:0 "[Root.GetUZHIdentityCultureAdjective] culture and traditions must be preserved and celebrated across our territories."
 UZH_protect_rusin_heritage_title:0 "Protect [Root.GetUZHIdentityCultureAdjective] Heritage"
 UZH_resist_habsburgs_base_tt:0 "§YDynastic Congress:§! Gain §YBorder Dynasty Network§! for §Y25§! years, receive §G100§! Diplomatic Power, unlock the §YSelect Dynasty Patron§! decision, trigger the follow-up event, and set the §YBorder Dynasty Secured§! mission flag."
 UZH_resist_habsburgs_habsburg_tt:0 "§YHabsburg Patron Outcome:§! Gain §G20§! Prestige, §G10§! Legitimacy, and §G+5§! Army Tradition if we accept Habsburg protection."
 UZH_resist_habsburgs_neighbor_tt:0 "§YNeighbor Patron Outcome:§! The chosen neighboring monarchy gains the §YBorder Dynasty Guarantees§! opinion modifier toward us and we earn §G+10§! Power Projection."
 UZH_resist_habsburgs_overlord_tt:0 "§YOverlord Patron Outcome:§! If we side with our overlord, reduce §YLiberty Desire§! by §G15§! and, while we remain a subject, improve their opinion with §YGranted Privileges§!."
 UZH_resist_habsburgs_pressure_tt:0 "§YOne§! of the following must be true:\n- We are a subject of a monarchy with at least §Y150§! development.\n- A neighboring monarchy with at least §Y150§! development views us as a rival."
 UZH_revival_core_culture_tt:0 "§YPalanok Statutes:§! Own at least §Y12§! Carpathian provinces of your chosen culture."
 UZH_revival_komitat_condition_tt:0 "Adopt the Komitat Estates reform or otherwise restructure the Komitat administration."
 UZH_roads:0 "All Roads Lead from Uzhhorod"
 UZH_roads_desc:0 "Uzhhorod lies in the heart of Europe, and from here, one can travel to any city on the continent. This is why our people can be found in all corners of Europe."
 UZH_rusin_language_culture_tt:0 "§YStandardize the Tongue:§! Own at least §Y5§! provinces of your chosen culture."
 UZH_rusin_nobility_court_tt:0 "§YJudicial Grants:§! Control §Y5§! provinces of your chosen culture that host a Courthouse or its successors."
 UZH_salt_corridors_pest_share_tt:0 "§YDominate the Pest trade:§! We must be the strongest trade power in the Pest node."
 UZH_smereka:0 "Our Smereka Trees"
 UZH_smereka_desc:0 "The Smereka trees that grow only in our land are highly valued by the people who have lived here for centuries. The mystical forces of the land provide us with an advantage that we can harness to our benefit."
 UZH_solotvynska_camera_reward_tt:0 "Every owned §Ysalt§! province gains §Y“Solotvyno Chambers”§! for §Y10 years§!."
 UZH_solotvynska_camera_salt_tt:0 "§YRegulate the salt chambers:§! Own at least one §Ysalt§! province with either a manufactory or 15 development."
 UZH_strengthen_eastern_frontier_desc:0 "Our eastern borders are vulnerable to attacks. We must fortify the Carpathian passes to protect our [Root.GetUZHIdentityCultureAdjective] homeland."
 UZH_strengthen_eastern_frontier_title:0 "Strengthen Eastern Frontier"
 UZH_this_is_a_branching_mission:0 "This slot marks a locked branch. Resolve the parent choice to reveal the correct mission path."
 UZH_tisza_customs_downstream_tt:0 "§YSecure downstream outlets:§! Be the strongest trade power in either the Wien or Ragusa trade node."
 UZH_tisza_customs_pest_tt:0 "§YDominate Pest:§! Be the strongest trade power in the Pest node."
 UZH_tisza_customs_reward_tt:0 "Eligible markets in Carpathia, Alföld, and Slavonia gain §Y“Tisza Customs Depot”§! for §Y10 years§!."
 VLN:0 "Volyn"
 VLN_ADJ:0 "Volynian"
 VLN_baltic_aspirations_desc:0 "Turn our gaze northward to Lithuania and Samogitia. By uniting these northern lands with Volhynia, we can forge a powerful northern realm anchored in Ruthenia and stretching into the Baltic."
 VLN_baltic_aspirations_title:0 "Seek Baltic Lands"
 VLN_baltic_partnership_culmination_desc:0 "Our northern vision is now reality. Grand Ruthenia commands the Baltic coast and the Ruthenian heartland, standing as a great power among the nations of Europe."
 VLN_baltic_partnership_culmination_title:0 "Baltic Partnership Culmination"
 VLN_border_trade:0 "Border Trade"
 VLN_border_trade_desc:0 "No goods should be exported without the full support of the nobility. While this may impose a burden on the crown's trade, it will also ensure that Volhynia's demands in international trade are met."
 VLN_carpathian_black_legion_desc:0 "Inspired by the Hungarian fekete_sereg (Black Army), establish an elite professional military force loyal only to the voivode. This legion shall be the apex of our military power."
 VLN_carpathian_black_legion_title:0 "Black Voivode Legion"
 VLN_carpathian_bulwark_desc:0 "The Carpathian Mountains shall be our shield against invasion. Fortify our mountain territories following the Hungarian model of mountain defense."
 VLN_carpathian_bulwark_title:0 "Carpathian Bulwark"
 VLN_carpathian_federation_eastern_desc:0 "With Galicia pursuing a frontier-crown settlement, the moment has come to propose a formal Carpathian Federation - a union of Ruthenian lands anchored in the Carpathian mountains."
 VLN_carpathian_federation_eastern_title:0 "The Carpathian Federation"
 VLN_common_good:0 "Partnerships for the Common Good"
 VLN_common_good_desc:0 "Whether in Poland or Moscow, we must rely on others to protect our independence from centralized power. A diplomat's words are just as precious as a gun, and we must use both to protect ourselves."
 VLN_confessional_balance_desc:0 "As Galicia makes its confessional choice between Uniate and Orthodox paths, we must synchronize our own religious settlements to create harmony across all Ruthenian lands."
 VLN_confessional_balance_title:0 "Confessional Balance"
 VLN_conquer_crimea_desc:0 "Project our own steppe strategy southward and secure the Crimean peninsula under Ruthenian command."
 VLN_conquer_crimea_title:0 "Conquer the Crimean Steppes"
 VLN_constitutional_assembly_desc:0 "The realm has grown complex. Now we must hold a Constitutional Assembly to determine the nature of our governance - will we ratify an estate compact, strengthen the frontier chancery, or elevate Cossack principles?"
 VLN_constitutional_assembly_title:0 "Constitutional Assembly"
 VLN_cossack_recruitment_desc:0 "The Cossacks of our lands possess unmatched cavalry skills. Organize them into formal regiments to strengthen our military prowess."
 VLN_cossack_recruitment_title:0 "Recruit Cossack Cavalry"
 VLN_declare_independence_desc:0 "We are no longer content as a subject. Raise our banners and claim sovereignty over Volhynia!"
 VLN_declare_independence_title:0 "Declare Volhynia's Independence"
 VLN_develop_economy_desc:0 "With the Renaissance spreading throughout Ruthenia, we must invest in the prosperity of our lands. Develop our core territories and promote trade to strengthen the economic foundation of our realm."
 VLN_develop_economy_title:0 "Develop the Economy"
 VLN_eastern_partnership_culmination_desc:0 "Our Eastern partnership with Galicia has reached its fullest expression. The great project of the Eastern Partnership - uniting Ruthenia under Carpathian ideals - stands complete."
 VLN_eastern_partnership_culmination_title:0 "Eastern Partnership Culmination"
 VLN_galician_alliance_desc:0 "Form a firm alliance with the Galician state. Together, Volhynia and Galicia can resist external pressure and shape the future of Ruthenia as brothers."
 VLN_galician_alliance_title:0 "Seek Galician Alliance"
 VLN_grand_ruthenia_baltic_desc:0 "With Lithuania, Samogitia, and Ruthenia united under our banners, we have created Grand Ruthenia - a northern power to rival any in Christendom."
 VLN_grand_ruthenia_baltic_title:0 "Grand Ruthenia"
 VLN_grand_ruthenia_desc:0 "The moment has arrived. With absolute authority and vast territories under our control, we shall proclaim ourselves Grand Ruthenia - a great power capable of standing with any European monarch."
 VLN_grand_ruthenia_title:0 "Crown of Grand Ruthenia"
 VLN_harness_steppes_desc:0 "The open steppes of our southern territories are home to fierce warriors. Learn to harness their power and integrate them into our military structure."
 VLN_harness_steppes_title:0 "Harness the Steppes"
 VLN_homage:0 "Prince's Tribute"
 VLN_homage_desc:0 "Our tax system may not be perfect, but it achieves its objectives. However, some individuals and groups will resist, so we must follow the ancient example of princes and begin collecting tribute from them with the help of warriors."
 VLN_ideas:0 "Volhynian Ideas"
 VLN_ideas_bonus:0 "Volhynian Ambitions"
 VLN_ideas_start:0 "Volhynian Traditions"
 VLN_integrate_north_desc:0 "Push northward and seize Minsk and the White Ruthenia territories. These lands belong within the Ruthenian fold."
 VLN_integrate_north_title:0 "Integrate Northern Lands"
 VLN_khutor:0 "Promote the Khutor System"
 VLN_khutor_desc:0 "The Khutor system is a production system that favors agricultural surplus production. Peasants are enticed to work in them or rented through coercion. Volyn's economy would be built on this foundation."
 VLN_legitimate_crown_desc:0 "No longer shall we be merely a regional power. Our crown must be recognized as legitimate throughout Christendom. Consolidate our absolutism and establish ourselves as a sovereign kingdom."
 VLN_legitimate_crown_title:0 "Establish Legitimate Authority"
 VLN_prosvita_brotherhood:0 "Prosvita Brotherhood"
 VLN_prosvita_brotherhood_desc:0 "The Prosvita Brotherhood's purpose is to promote our people's cultural journey to the West while preserving their traditions before uniting them. We will work hard to understand and explore the world around us to learn how to best utilize it."
 VLN_restore_ruthenia_desc:0 "With both the western Dniepr and eastern Dniepr lands under our control, we have restored ancient Ruthenia. Our realm spans from the Carpathians to the Baltic."
 VLN_restore_ruthenia_title:0 "Restore the Ruthenian Realm"
 VLN_ruthen_line:0 "Ruthenian Line"
 VLN_ruthen_line_desc:0 "To defend against Tatar cavalry attacks, our forefathers devised a unique system of protection. As our country grows, we must improve and disseminate this system throughout the land."
 VLN_ruthenian_renaissance_desc:0 "With governance settled and confessional harmony achieved, the time has come to nurture the Ruthenian renaissance - a flowering of culture, learning, and innovation across our realm."
 VLN_ruthenian_renaissance_title:0 "Ruthenian Renaissance"
 VLN_unite_galicia_desc:0 "Volhynia and Galicia share blood, faith, and destiny. Bring all Red Ruthenia, Podolia, and Volhynia under one crown - the first step in uniting all Ruthenia."
 VLN_unite_galicia_title:0 "Unite with Galicia"
 VLN_universal_ruthenia_desc:0 "Ruthenia is no longer fragmented. We have unified all lands from the Carpathians to the Dnieper, from the Vistula to the Black Sea. We are the supreme authority - Universal Ruthenia incarnate."
 VLN_universal_ruthenia_title:0 "Universal Ruthenia"
 VOIVODESA_QUEEN:0 "Voivodesa Queen"
 VOIVODESHIP:0 "Voivodeship"
 VOIVODESHIP_ABSOLUTE:0 "Absolute Voivodeship"
 VOIVODESHIP_DOMINION:0 "Voivodeship Dominion"
 VOIVODESHIP_EMPEROR:0 "Voivodeship Emperor"
 VOIVODESHIP_EMPRESS:0 "Voivodeship Empress"
 VOIVODESHIP_REALM:0 "Voivodeship Realm"
 VOIVODESSA:0 "Voivodessa"
 VOIVODESSA_QUEEN:0 "Voivodessa Queen"
 VOIVODE_DOMINION:0 "Voivode Dominion"
 VOIVODE_KING:0 "Voivode King"
 VOIVODE_KINGDOM:0 "Voivode Kingdom"
 VOIVODE_PALATINATE:0 "Voivode Palatinate"
 VOIVODE_STATE:0 "Voivode State"
 VOL_austrian_path_unlocked_tooltip:0 "Frontier-crown path unlocked."
 VOL_balance_estates_desc:0 "Balance the power of the estates."
 VOL_balance_estates_title:0 "Balance the Estates"
 VOL_balance_of_power_desc:0 "Maintain balance among major factions."
 VOL_balance_of_power_title:0 "Balance of Power"
 VOL_baroco:0 "Ruthenian Baroque"
 VOL_baroco_desc:0 "Ruthenian Baroque is an artistic style flourishing in our lands, blending European Baroque elegance with Ruthenian folk traditions."
 VOL_border_control:0 "Border Security"
 VOL_can_adopt_elective_tooltip:0 "Elective succession can be adopted."
 VOL_choose_development_path_desc:0 "Select the realm's long-term direction."
 VOL_choose_development_path_title:0 "Choose a Development Path"
 VOL_choose_path_tooltip:0 "Choose a path for future reforms."
 VOL_chumak_modifier:0 "The Western Chumatsky Route"
 VOL_church_desc:0 "Every anointed of God is responsible for their subjects' piety. Religious structures are built with eye-catching architecture. Churches, like the rest of the city, are built with the same care and attention to detail."
 VOL_church_relations_desc:0 "Relations with the church are managed."
 VOL_church_relations_title:0 "Church Relations"
 VOL_church_title:0 "Churches"
 VOL_conquer_bilorus_desc:0 "To restore all of Rus, including the west, we must reclaim Belarus, also known as White Rus', as a legitimate part of the Rus. The rulers of Lithuania attempted to take control and become the new Rus, but they granted privileges to the Ruthenians and even adopted Ruthenian as the language of their documents. Over time, however, they began to oppress our people with the help of their Polish allies. We were able to defeat the invaders with the support of traditional Lithuanian views, but to prevent future encroachment on Rus, Lithuania must fall."
 VOL_conquer_bilorus_title:0 "Take control of Belarus"
 VOL_conquer_east_dniepr_desc:0 "We shall completely take possession of the Dnieper once we have taken possession of the lands on the Left Bank. This shall provide us with both strength and money and the authority to take over all of Rus'."
 VOL_conquer_east_dniepr_title:0 "Seizing the Left Bank"
 VOL_conquer_malopolska_desc:0 "Our old border was further west. If Poland dared to take our lands when we were weak, we now have the right to do the same and push the border even further west."
 VOL_conquer_malopolska_title:0 "Expansion into Poland"
 VOL_conquer_moldavia_desc:0 "To control the trade routes over Kyiv, we must reach the shore. We will follow in the footsteps of the salt traders known as Chumaks to conquer Moldavia and gain access to the Black Sea."
 VOL_conquer_moldavia_title:0 "Resuming the Chumak Way"
 VOL_conquer_sloboda_desc:0 "The Ruthenian culture's geographical boundary is the Sloboda, a region whose name also means 'freedom.' Expanding our control over this area will secure our influence over the region."
 VOL_conquer_sloboda_title:0 "Ruthenian Frontier"
 VOL_conquer_smolensk_desc:0 "Smolensk is a crucial inland trade center and a key control point for Kyiv. Therefore, it must be conquered to strengthen our hold over the region."
 VOL_conquer_smolensk_title:0 "Conquest of Smolensk"
 VOL_conquer_west_dniepr_desc:0 "Kiev, located on the Dnieper River, was once the heartland of the Rus. It must be under our control, as whoever controls Kiev controls the Dnieper, and whoever controls the Dnieper controls all of Rus'."
 VOL_conquer_west_dniepr_title:0 "Conquest of Kyiv"
 VOL_conquer_zaporozhia_desc:0 "To push into Crimea, we must first seize the Zaporozhian steppes."
 VOL_conquer_zaporozhia_title:0 "Conquer Zaporozhia"
 VOL_constitutional_compact_desc:0 "A compact defines constitutional limits."
 VOL_constitutional_compact_title:0 "Constitutional Compact"
 VOL_constitutional_ready:0 "Constitutional reforms are ready to be implemented."
 VOL_control_danube:0 "The Danube Estuary under Control"
 VOL_control_smolensk:0 "Smolensk under our Control"
 VOL_deal_with_the_boyar_mission_desc:0 "The Boyars have been a strong political force in our state since ancient times. It is necessary to come to an agreement with them so that neither they nor we suffer, preserving their status while gaining their political power for ourselves."
 VOL_deal_with_the_boyar_mission_title:0 "Deal with the Boyars"
 VOL_dealt_with_the_boyar:0 "Conciliation with the Boyars"
 VOL_declare_independence_desc:0 "For too long have we been oppressed by foreign powers since the Mongols conquered the Rus. It is time for us to take charge of our own fate."
 VOL_declare_independence_title:0 "Declaration of Independence"
 VOL_demolish_MOS_desc:0 "Zalesye was a Rus' colony situated where the principality of Moscow stands today. It was primarily inhabited by Finno-Ugric tribes who were assimilated into the Slavic culture and now refer to themselves as Muscovites. It is time for us to take over this land and expand our control."
 VOL_demolish_MOS_title:0 "Taking over Zalesye"
 VOL_demolish_lithuania_desc:0 "Although the rulers of Lithuania attempted to become the new Rus, they granted privileges to the Ruthenians, and the language of documents became Ruthenian. They began to oppress our people over time, thanks to the influence of Polish allies. We were able to defeat the invaders thanks to supporters of Lithuania's traditional views. But that is why Lithuania must fall in order for Rus to not be encroached upon again."
 VOL_demolish_lithuania_title:0 "Destroy then Lithuania"
 VOL_demolish_poland_desc:0 "Poland must be held accountable for its crimes against our people."
 VOL_demolish_poland_title:0 "Annihilation of Poland"
 VOL_develop_capitals_desc:0 "Invest in the realm's capitals."
 VOL_develop_capitals_title:0 "Develop the Capitals"
 VOL_druzhyna:0 "Druzhyna"
 VOL_druzhyna_desc:0 "The Druzhyna is an elite military formation in Rus' composed of the nobility."
 VOL_dynastic_marriages_desc:0 "Marriages secure alliances and prestige."
 VOL_dynastic_marriages_title:0 "Dynastic Marriages"
 VOL_dynastic_network_tooltip:0 "Dynastic network expanded."
 VOL_dynasty_spread_tooltip:0 "Our dynasty shall spread across Europe, bringing prestige and alliances."
 VOL_education_edict_desc:0 "Let us proclaim throughout the land that education and learning are the foundations of a great nation."
 VOL_education_edict_title:0 "Edict of Education"
 VOL_establish_sejm_desc:0 "Form a representative sejm."
 VOL_establish_sejm_title:0 "Establish the Sejm"
 VOL_expand_Chumatsky_Way_mission_desc:0 "Creating a new trade and transport route along the right bank of the Dnieper, connecting smaller rivers, will increase our economic status. To achieve this, we need to develop our cities and markets centers that will attract Black Sea traders to our western trade hubs."
 VOL_expand_Chumatsky_Way_mission_title:0 "Western Chumatsky Road"
 VOL_far_north_desc:0 "Novgorod and Vladimir-Suzdal, the far northern regions of ancient Rus, are known as Greater Rus. Just as Sicily is referred to as Greater Greece due to its historical ties to the Greek colonies."
 VOL_far_north_title:0 "Greater Rus"
 VOL_fortress_city:0 "Fortress City"
 VOL_fortress_city_desc:0 "In keeping with our state's tradition, all cities must be fortified against attacks."
 VOL_full_army_desc:0 "The fortifications of the Lutsk fortress, originally built during the rule of the Grand Duchy of Lithuania, have been restored and expanded to strengthen our military defenses."
 VOL_full_army_title:0 "Fortress of Lutsk"
 VOL_godliness:0 "The Godly State"
 VOL_integrate_north_desc:0 "The northern lands have been absorbed into the state of Halycia-Volhynia. We have intertwined religious communities and studied languages."
 VOL_integrate_north_title:0 "Absorption of Northern Lands"
 VOL_invest_in_eastern_rus_mission_desc:0 "New technologies in metallurgy and industry require resources that the East is rich in."
 VOL_invest_in_eastern_rus_mission_title:0 "The Eastern Coal Basin"
 VOL_invest_in_west_rus_mission_desc:0 "Building infrastructure to support trade in the western lands will enrich the people and increase production. Their wealth will also contribute to our own enrichment."
 VOL_invest_in_west_rus_mission_title:0 "Wealth of the People"
 VOL_invested_in_rus:0 "Commercial Infrastructure of the Western Lands"
 VOL_king_power_desc:0 "The power of the ruler is so glorious and honorable that it is known throughout all Ruthenian lands. Therefore, some free Cossack cavalry troops have decided to join our service."
 VOL_king_power_title:0 "Glory and Honor"
 VOL_land_collector_desc:0 "As the Collector of Ruthenian lands , we are beginning a new golden age. We must finish the job to confirm this title and ensure the reunification of all Rus."
 VOL_land_collector_title:0 "Collector of Ruthenian lands"
 VOL_magdeburg_laws:0 "Magdeburg Laws"
 VOL_magdeburg_laws_desc:0 "The Magdeburg Laws provided cities with a legal framework that enhanced trade and administration, increasing tax revenue."
 VOL_manage_magnates_desc:0 "Keep the magnates in check."
 VOL_manage_magnates_title:0 "Manage the Magnates"
 VOL_manage_minorities_desc:0 "Policies for minority groups are set."
 VOL_manage_minorities_title:0 "Manage Minorities"
 VOL_mastery_of_the_steppes:0 "The Steppes' Masteries"
 VOL_mod_arch:0 "Ukrainian Baroque"
 VOL_old_capital_desc:0 "Kyiv is ours, how could we not love you? Let us make this ancient and powerful city the capital of all Rus' once again."
 VOL_old_capital_title:0 "Kyiv is Ours"
 VOL_prince_general:0 "Prince-General"
 VOL_prince_general_desc:0 "Our country's military high command holds a core tradition where the head of state inspires our troops with their bravery and leads them into battle..."
 VOL_prosperity_desc:0 "Prosperity becomes a guiding goal."
 VOL_prosperity_title:0 "Prosperity"
 VOL_protectors_of_ruthenia:0 "Guardians of Rus'"
 VOL_re_establishment_of_kyiv:0 "Re-establishment of Kiev"
 VOL_rebuild_nation:0 "Rebuilding the Nation"
 VOL_religious_settlement_desc:0 "A settlement resolves confessional tensions."
 VOL_religious_settlement_title:0 "Religious Settlement"
 VOL_renaissance_court_desc:0 "A cultured court advances the arts."
 VOL_renaissance_court_title:0 "Renaissance Court"
 VOL_renaissance_mission_desc:0 "The so-called Renaissance has arrived in our lands, bringing with it a rebirth of the ideas of antiquity. It may be useful for our state to adopt these ideas and reclaim what the Mongol Horde took from us. May the winds of the West guide us towards a new era of prosperity."
 VOL_renaissance_mission_title:0 "The Western Wind"
 VOL_restore_ruthenia_desc:0 "How can we unite Rus' without controlling its heart on the Dnieper?"
 VOL_restore_ruthenia_title:0 "Heart of Rus'"
 VOL_rex_of_rus:0 "Rex of Rus'"
 VOL_rex_of_rus_desc:0 "In 1254, Daniil Halitsky accepted the title of 'King of Rus' from Pope Innocent IV in Dorogochin, showing the legitimacy of our state in Europe."
 VOL_ruthenia_triumphant_desc:0 "Ruthenia achieves its ambitions."
 VOL_ruthenia_triumphant_title:0 "Ruthenia Triumphant"
 VOL_ruthenia_triumphant_tooltip:0 "Ruthenia triumphs on the world stage."
 VOL_ruthenian_hegemony_desc:0 "The realm asserts regional hegemony."
 VOL_ruthenian_hegemony_title:0 "Ruthenian Hegemony"
 VOL_ruthenian_liberty_desc:0 "Liberties are affirmed across the realm."
 VOL_ruthenian_liberty_title:0 "Ruthenian Liberty"
 VOL_ruthenian_renaissance:0 "Renaissance of Rus'"
 VOL_stability_desc:0 "We have achieved state stability and can provide security to our citizens within our borders."
 VOL_stability_title:0 "State Stability"
 VOL_unite_galicia_desc:0 "Before we can expand outward, we must first unite our homelands. And we shall start by uniting the last surviving princes against the hordes."
 VOL_unite_galicia_title:0 "Halycia-Volhynia Union"
 VOL_unity:0 "United We Stand"
 VOL_university_expansion_desc:0 "Universities expand across the realm."
 VOL_university_expansion_title:0 "University Expansion"
 VOL_welcome_all_cultures_desc:0 "Open the realm to all cultures."
 VOL_welcome_all_cultures_title:0 "Welcome All Cultures"
 VOL_western_reforms:0 "Western Reforms"
 VOL_western_reforms_desc:0 "By establishing close ties with Western European states, we can implement similar reforms while maintaining our name and custom."
 VTB:0 "Vitebsk"
 VTB_ADJ:0 "Vitebsk"
 VTB_ideas:0 "Vitebsk Ideas"
 VTB_ideas_bonus:0 "Vitebsk Ambitions"
 VTB_ideas_start:0 "Vitebsk Traditions"
 WARRIOR_STATE:0 "Warrior State"
 WAR_VOIVODE:0 "War Voivode"
 WAR_VOIVODESSA:0 "War Voivodessa"
 ZAKARPATTIA_CULTURAL_MOSAIC:0 "Zakarpattian Cultural Mosaic"
 ZAKARPATTIA_FRONTIER_GUARD:0 "Zakarpattian Frontier Guard"
 ZAKARPATTIA_HISTORICAL_OVERVIEW:0 "Carved between the Carpathian ridgelines and the Tysa, Zakarpattia bridges crowns and confessions alike. From the Korjatovych princes to the Habsburg frontier captains, its march towns learned to bargain, fortify, and pray in many tongues."
 ZAKARPATTIA_TRADE_NETWORK:0 "Zakarpattian Caravan Network"
 ZAPOROZHIAN_HOST:0 "Zaporozhian Host"
 ZAPOROZHIAN_HOST_NAME:0 "Zaporozhian Host"
 ZAPOROZHIAN_KOSH:0 "Zaporozhian Kosh"
 ZAPOROZHIAN_SICH:0 "Zaporozhian Sich"
 ZAZ_CRIMEAN_TRADE:0 "Securing Ports on the Black Sea for Trade Dominance"
 ZAZ_GOL_attack_genoa_2_desc:0 "Foreign Genoese merchants have governed the important Black Sea commercial hubs for far too long. The money and riches they provide are just too important to ignore"
 ZAZ_GOL_attack_genoa_2_title:0 "Seize Ports"
 ZAZ_GOL_attack_genoa_desc:0 "Theodoro is a terrific addition to our collection"
 ZAZ_GOL_attack_genoa_title:0 "Conquer Theodoro"
 ZAZ_GOL_cordon_desc:0 "Having freed ourselves from our oppressors, we must strike back to ensure that such a fate does not befall us again."
 ZAZ_GOL_cordon_title:0 "Invade [LIT.GetName]"
 ZAZ_GOL_crimea_1_desc:0 "Our ancestors came from the districts of Yedisan and Zaporozhia. They should not be subjugated to the disgrace of foreign domination any longer"
 ZAZ_GOL_crimea_1_title:0 "Unite our country"
 ZAZ_GOL_crimea_2_desc:0 "The longer they are left alone, the more difficult [CRI.GetName] will become. They not only raid us in order to complete their slave trade, but they also constitute a serious military danger"
 ZAZ_GOL_crimea_2_title:0 "Dismantle [CRI.GetName]"
 ZAZ_GOL_crimea_3_desc:0 "The Circassians live in a land that would be trivially easy to attack and subjugate. Perhaps their remembrances will be useful to us"
 ZAZ_GOL_crimea_3_title:0 "Subjugate Circassia"
 ZAZ_GOL_east_dniepr_desc:0 "The meadows of East Dniepr beckon us to expand our grazing lands and strengthen our cavalry"
 ZAZ_GOL_east_dniepr_title:0 "Conquer East Dniepr"
 ZAZ_GOL_insult_crimea_desc:0 "The Crimean Khanate must recognize its inferiority. We shall not tolerate any disrespect towards our nation!"
 ZAZ_GOL_insult_crimea_title:0 "Insult [CRI.GetName]"
 ZAZ_GOL_insult_feo_desc:0 "The Goths are a remnant of a bygone era and serve no purpose in today's world. We must make it clear to them that their existence is irrelevant."
 ZAZ_GOL_insult_feo_title:0 "Insult [FEO.GetName]"
 ZAZ_GOL_insult_lit_desc:0 "Our old rulers shall be pleased with our insult to Lithuania. It is a reminder of our superiority over them!"
 ZAZ_GOL_insult_lit_title:0 "Insult [LIT.GetName]"
 ZAZ_GOL_insult_tur_desc:0 "The Turkish threat looms to the east, and we must warn them that they pose a significant danger to our security."
 ZAZ_GOL_insult_tur_title:0 "Denounce [TUR.GetName]"
 ZAZ_GOL_malopolska_desc:0 "With the prosperous cities of Kraków and Lublin under our control, we will gain renewed access to lucrative markets across Europe"
 ZAZ_GOL_malopolska_title:0 "Seize Kraków and Lublin"
 ZAZ_GOL_podolia_volhynia_desc:0 "The area of Podilia Volhynia offers fertile meadows excellent for the horses to graze in"
 ZAZ_GOL_podolia_volhynia_title:0 "Conquer Podilia Volhynia"
 ZAZ_GOL_poland_desc:0 "The fall of Poland will pave the way for our unbridled expansion and endless wealth accumulation"
 ZAZ_GOL_poland_title:0 "Annihilate Poland"
 ZAZ_GOL_politics_2_desc:0 "Our savvy political maneuvering over the years has allowed us to grab control of [GOL.GetName] from within. We shall continue to assert our dominance!"
 ZAZ_GOL_politics_2_title:0 "Succession of [Root.GetName]"
 ZAZ_GOL_politics_desc:0 "Crimea, Kazan and Astrakhan quarrel over precedence and pay Moscow separately for it. Cossack foot behind Tatar horse would make one power of the steppe, if the murzas can be brought to sit at one Rada."
 ZAZ_GOL_politics_title:0 "The Steppe Confederation"
 ZAZ_GOL_red_ruthenia_desc:0 "The vast expanse of the Eastern European Plains, which Poland calls home, is an obstacle to our ambitions"
 ZAZ_GOL_red_ruthenia_title:0 "Invade Poland"
 ZAZ_GOL_russia_2_desc:0 "Russia is no longer the superpower of the region that it once was"
 ZAZ_GOL_russia_2_title:0 "Interference in Russia"
 ZAZ_GOL_russia_3_desc:0 "With no one remaining to seriously question our claim to the Russian Region, we must establish unequivocally that the territories belong to us and us alone"
 ZAZ_GOL_russia_3_title:0 "Take control of Russia"
 ZAZ_GOL_russia_buff:0 "Strengthening Our Forces with Russian Conscripts in [GOL.GetName]"
 ZAZ_GOL_russia_desc:0 "Russia is no longer subject to foreign control, having been subject to the Mongol Yoke and later the Tartar Yoke. We can, however, modify that"
 ZAZ_GOL_russia_title:0 "Invade Russia"
 ZAZ_GOL_russian_help:0 "Assistance from Russian Officers"
 ZAZ_GOL_ruthenia:0 "Reclaiming Our Homeland in [GOL.GetName] Rus'"
 ZAZ_GOL_ruthenia_desc:0 "Rus' is the magnificent homeland of Zaprozhzhians since it is the core area of the Easten European lowlands and home to our Slavic siblings"
 ZAZ_GOL_ruthenia_title:0 "Zaprozhzhia found home"
 ZAZ_GOL_trebes_desc:0 "The Pontic Greeks live in a territory that would be simple to subjugate and amenable to our dominion. We shall expand our territories and assert our dominance in the region!"
 ZAZ_GOL_trebes_title:0 "Conquer Trebizond"
 ZAZ_GOL_tribes_2_desc:0 "The Georgian people are in shambles. It should be an easy process to incorporate them into our tribute network"
 ZAZ_GOL_tribes_2_title:0 "Subjugate Eastern Georgia"
 ZAZ_GOL_tribes_3_desc:0 "The Dagestan counties are vulnerable to subjection"
 ZAZ_GOL_tribes_3_title:0 "Subjugate Dagestan"
 ZAZ_GOL_tribes_4_desc:0 "With the bulk of the Caucasus under our control, getting the remaining territories under our control is only a formality"
 ZAZ_GOL_tribes_4_title:0 "Subjugate the Caucases"
 ZAZ_GOL_tribes_desc:0 "The Georgian people are in chaos. Incorporating them into our tribute network should be a straightforward effort"
 ZAZ_GOL_tribes_title:0 "Subdue West Georgia"
 ZAZ_GOL_tur_1_desc:0 "With abundant fields in Romania to help feed our people and the Bessarabia estuary providing a gateway to local commerce, we have a solid foundation for sustenance and economic growth."
 ZAZ_GOL_tur_1_title:0 "Conquer Moldavia"
 ZAZ_GOL_tur_2_desc:0 "Western Romania's lush farmlands will supply our people with the food they deserve"
 ZAZ_GOL_tur_2_title:0 "Conquer Wallachia"
 ZAZ_GOL_tur_3_desc:0 "We must seize control of the wealthy areas of the Bulgarian Kingdom from [TUR.GetName]. Under our leadership, the area will thrive better than under theirs"
 ZAZ_GOL_tur_3_title:0 "Invade Bulgaria"
 ZAZ_GOL_tur_4_desc:0 "Thrace has always been strategically vital as a peninsula dominating the Bosporus Strait. Securing such a key territory would offer our country great prosperity"
 ZAZ_GOL_tur_4_title:0 "Invade Thrace"
 ZAZ_GOL_tur_5_desc:0 "The splendid city of Constantinople is desired across Europe. The Romans were the first to possess it, followed by the Turks, and now we do"
 ZAZ_GOL_tur_5_title:0 "Take Constantinople"
 ZAZ_GOL_west_dniepr_desc:0 "Amidst the fertile meadows of West Dniepr lies an opportunity for our horses to thrive"
 ZAZ_GOL_west_dniepr_title:0 "Conquer Western Dniepr"
 ZAZ_GOL_weste_desc:0 "If the western vassal state is left unchecked, it may prove to be a significant hindrance in the future."
 ZAZ_GOL_weste_title:0 "Invade [GOL.GetName]"
 ZAZ_OTAMAN_GENERAL:0 "General Otaman"
 ZAZ_OTAMAN_HOST:0 "Host Otaman"
 ZAZ_OTAMAN_KOSH:0 "Kosh Otaman"
 ZAZ_POL_2_desc:0 "Western Romania's rich farmlands will provide our people with the nourishment they deserve."
 ZAZ_POL_2_title:0 "Conquer Wallachia"
 ZAZ_POL_3_desc:0 "We must grab control of the affluent districts of the Bulgarian Kingdom from [TUR.GetName], since the area would prosper better under our leadership than under theirs."
 ZAZ_POL_3_title:0 "Invade Bulgaria"
 ZAZ_POL_4_desc:0 "Thrace has always been strategically essential as a peninsula controlling the Bosporus Strait; securing such a critical area would provide our country immense riches."
 ZAZ_POL_4_title:0 "Invade Thrace"
 ZAZ_POL_5_desc:0 "The magnificent city of Constantinople is wanted across Europe; the Romans were the first to possess it, followed by the Turks, and now we do."
 ZAZ_POL_5_title:0 "Take Constantinople"
 ZAZ_POL_cordon_desc:0 "After freeing ourselves from any oppressors, we must strike back and guarantee that this does not happen again."
 ZAZ_POL_cordon_title:0 "Invade [LIT.GetName]"
 ZAZ_POL_cri_desc:0 "The inferior Crimean Khanate must be conscious of their inferiority"
 ZAZ_POL_cri_title:0 "Insult [CRI.GetName]"
 ZAZ_POL_desc:0 "In Moldova, between numerous rivers, it provides perfect protection against the Balkans... or invasion."
 ZAZ_POL_east_dniepr_desc:0 "The East Dniepr area features excellent meadows perfect for horse grazing"
 ZAZ_POL_east_dniepr_title:0 "Conquer East Dniepr"
 ZAZ_POL_end_crimea_desc:0 "We will have a brief reprieve now that the Crimean Khanate has been destroyed."
 ZAZ_POL_end_crimea_title:0 "Eliminate Crimea"
 ZAZ_POL_expand_border_desc:0 "Let us mock our neighbors to the east, for we have made new friends and can freely speak ill of Lithuania without fear of consequence."
 ZAZ_POL_expand_border_title:0 "Deride Lithuania"
 ZAZ_POL_insult_gol_desc:0 "It will be appreciated by our old rulers."
 ZAZ_POL_insult_gol_title:0 "Insult [GOL.GetName]"
 ZAZ_POL_politics_2_desc:0 "Our savvy political maneuvering over the years has allowed us to grab control of [GOL.GetName] from within"
 ZAZ_POL_politics_2_title:0 "Succession of [Root.GetName]"
 ZAZ_POL_politics_desc:0 "Let the hetman sit in the Senate beside the palatines, the starshyna be entered in the armorial, and the register be set by treaty rather than by the crown's convenience. The szlachta will ask who else may claim a coat of arms."
 ZAZ_POL_politics_title:0 "Seats in the Sejm"
 ZAZ_POL_russia_2_desc:0 "Russia is no longer the superpower of the region that it once was"
 ZAZ_POL_russia_2_title:0 "Interfere in Russia"
 ZAZ_POL_russia_3_desc:0 "With no one remaining to seriously question our claim to the Russian Region, we must establish unequivocally that the territories belong to us and us alone"
 ZAZ_POL_russia_3_title:0 "Take control of Russia"
 ZAZ_POL_russia_desc:0 "Russia is no longer subject to foreign control, having been subject to the Mongol Yoke and later the Tartar Yoke. We can, however, change that."
 ZAZ_POL_russia_title:0 "Invade Russia"
 ZAZ_POL_ruthenia_desc:0 "Rus' is the magnificent homeland of Zaprozhzhians since it is the core area of the Eastern European lowlands and home to our Slavic siblings"
 ZAZ_POL_ruthenia_title:0 "Zaprozhzhia found home"
 ZAZ_POL_seize_ports_desc:0 "For far too long, the key Black Sea trade centers have been ruled by foreign Genoese merchants. The wealth and riches they bring in are far too valuable to overlook."
 ZAZ_POL_seize_ports_title:0 "Seize Ports"
 ZAZ_POL_settle_east_2_desc:0 "The commercial route to Poland runs along the Dniester, and its growth benefits our revenues."
 ZAZ_POL_settle_east_2_title:0 "Control the Dniester"
 ZAZ_POL_settle_east_desc:0 "The Dniester River is a natural boundary to the east and south, and by rising to the center of the river, we may build a prosperous territory of our country in all aspects."
 ZAZ_POL_settle_east_title:0 "Transnistria"
 ZAZ_POL_settle_north_desc:0 "Now that the Lithuanians have been subdued, it is time to begin acquiring additional land for our people. Ukraine's huge plains will be ideal for this."
 ZAZ_POL_settle_north_title:0 "Settle Ukraine"
 ZAZ_POL_settle_south_desc:0 "With Lithuania towering over us, it is critical that we seek to reduce them to size."
 ZAZ_POL_settle_south_title:0 "Lithuania Subdued"
 ZAZ_POL_sieze_ports_desc:0 "We must seize the ports in the Crimea region to strengthen our trade and military presence."
 ZAZ_POL_sieze_ports_title:0 "Seize Ports"
 ZAZ_POL_title:0 "Balkan Gateway"
 ZAZ_POL_west_dniepr_desc:0 "The West Dniepr area contains lush meadows perfect for horse grazing."
 ZAZ_POL_west_dniepr_title:0 "Conquer West Dniepr"
 ZAZ_RAID_TARGET_CRIMEA:0 "the Crimean Khanate"
 ZAZ_RAID_TARGET_GENERIC:0 "our enemies"
 ZAZ_RAID_TARGET_TURKS:0 "the Ottoman Empire"
 ZAZ_RUS_brack_lit_desc:0 "With Muscovite guns the Dnieper towns can be taken from the Commonwealth in one season. Kyiv, Chernihiv and Smolensk would return to an Orthodox crown — though which crown, and on what terms, the treaty does not say plainly."
 ZAZ_RUS_brack_lit_title:0 "Reconquer the Ruthenian Lands"
 ZAZ_RUS_brack_tur_desc:0 "This is a critical moment in our diplomatic relations with Ottoman Empire. We must demonstrate our strength and willingness to defend our interests."
 ZAZ_RUS_brack_tur_title:0 "Insult [TUR.GetName]"
 ZAZ_RUS_conquer_steppe_desc:0 "Our neighbors to the east are merely additional tribes in need of organization"
 ZAZ_RUS_conquer_steppe_title:0 "Invade the Steppes"
 ZAZ_RUS_contest_crimea_desc:0 "With the Crimean Khanate on our doorstep, we shall never find peace. To resolve the situation, we must first prepare for war and contest their hold on the region."
 ZAZ_RUS_contest_crimea_title:0 "Contest Crimea"
 ZAZ_RUS_different_ally_desc:0 "Securing an alliance with the Russians is no simple feat, but we cannot rely only on them"
 ZAZ_RUS_different_ally_title:0 "Find More Allies"
 ZAZ_RUS_end_crimea_desc:0 "Now that the Crimean Khanate has been annihilated, we shall enjoy a temporary reprieve. Our military actions have secured our position in the region."
 ZAZ_RUS_end_crimea_title:0 "Remove Crimea"
 ZAZ_RUS_europe_trade_desc:0 "As a tiny regional power, we should prioritize integration into European commerce. Kyiv will be a fantastic place to start"
 ZAZ_RUS_europe_trade_title:0 "Encourage Inland Trade"
 ZAZ_RUS_hetman_desc:0 "We've worked our way up from the bottom, and now it's time to reap the advantages"
 ZAZ_RUS_hetman_title:0 "Dismantle the Commonwealth"
 ZAZ_RUS_orthodox_desc:0 "Our faith's centralization is shaky and vulnerable to outside influence. We need to get it under control."
 ZAZ_RUS_orthodox_title:0 "The Patriarch"
 ZAZ_RUS_settle_north_desc:0 "It is time to begin searching for fresh territory for our settlers. The huge plains of Ukraine will be suitable for this, and we must expand our influence in this region."
 ZAZ_RUS_settle_north_title:0 "Settle North Ukraine"
 ZAZ_RUS_settle_south_desc:0 "The land between the Dnipro and the Don carries neither plough nor garrison. Cossack stanitsas and slobodas would hold it, and the Tsar's surveyors would follow to write it into a province with a Russian name."
 ZAZ_RUS_settle_south_title:0 "Colonize New Russia"
 ZAZ_RUS_sieze_ports_desc:0 "Foreign Genoese merchants have governed the principal Black Sea trading hubs for far too long. The money and riches they provide are just too important to ignore. We must seize control of these ports to advance our trade ambitions."
 ZAZ_RUS_sieze_ports_title:0 "Seize Ports"
 ZAZ_RUS_threaten_tur_dec:0 "The Turks have been a thorn in our side for far too long!"
 ZAZ_RUS_threaten_tur_desc:0 "The Russians have dared to rival us, but we shall not be intimidated! We shall show them the might of Ottoman Empire!"
 ZAZ_RUS_threaten_tur_title:0 "Rival [TUR.GetName]"
 ZAZ_RUS_war_crimea_desc:0 "Sitting and looking will get you nowhere. We must take the initiative and launch an attack on the Crimean Khanate to secure our position in the Black Sea region."
 ZAZ_RUS_war_crimea_title:0 "Attack Crimea"
 ZAZ_RUS_war_rus_desc:0 "Despite our partnership with the Russians, we must still demonstrate our allegiance and usefulness to them or risk being viewed as a liability and finally abandoned"
 ZAZ_RUS_war_rus_title:0 "Warband"
 ZAZ_RUS_west_desc:0 "Red Rus' has animals and grain, which will be a valuable complement to our resources. It is time to expand our influence and bring this region under our control."
 ZAZ_RUS_west_title:0 "Settle Red Rus'"
 ZAZ_RUS_wester_desc:0 "Our commercial aspirations are obvious... Lublin is an important regional trade hub, therefore it is only natural that it would be the next target of our expansionist ambitions."
 ZAZ_RUS_wester_title:0 "Make Claim to Lublin"
 ZAZ_RUS_westest_desc:0 "Our financial progress will be enhanced by the affluent region of Malopolska. We must extend our control over this land and its resources."
 ZAZ_RUS_westest_title:0 "Settle Malopolska"
 ZAZ_SICH_CHORTOMLYK:0 "Chortomlyk Sich"
 ZAZ_SICH_GENERIC:0 "Zaporozhian Sich"
 ZAZ_SICH_KHORTYTSIA:0 "Khortytsia Sich"
 ZAZ_SICH_TOMAKIVKA:0 "Tomakivka Sich"
 ZAZ_SLAVE_TRADE:0 "Black Sea Ransom Network"
 ZAZ_TUR_brake_rus_desc:0 "Our perilous alliance with the Turks pits us against the Russians, whose territorial aspirations are aligned with ours. We must be watchful of their advances and respond in kind."
 ZAZ_TUR_brake_rus_title:0 "Rival of Russia"
 ZAZ_TUR_conquer_steppe_desc:0 "The countries to the east are just a stumbling block to our future growth. Let us show them who the superior khan is."
 ZAZ_TUR_conquer_steppe_title:0 "Conquer [GOL.GetName]"
 ZAZ_TUR_contest_crimea_desc:0 "The Khan holds his throne by Ottoman warrant and takes our people north of Perekop every season. With the Porte's favour we can press the Girays for the coastal fortresses, and for the tribute they collect in our name."
 ZAZ_TUR_contest_crimea_title:0 "Contest Crimean Dominance"
 ZAZ_TUR_convert_islam_desc:0 "The Sultan's alliance has brought us more than we could have imagined. Muslims from all corners of the world have graced our court due to our strong political ties. Perhaps a heartfelt reconsideration of our faith is in order."
 ZAZ_TUR_convert_islam_title:0 "Question of Faith"
 ZAZ_TUR_different_ally_desc:0 "Securing an alliance with the Turks is no easy task, but we cannot rely on them alone."
 ZAZ_TUR_different_ally_title:0 "Seek Other Allies"
 ZAZ_TUR_embargo_all_desc:0 "All our competitors have embargoes as a result of our policy. They shall feel the weight of our economic power!"
 ZAZ_TUR_embargo_all_title:0 "Embargo Confrontation"
 ZAZ_TUR_end_crimea_desc:0 "We have finally gained control over Crimea, and can now enjoy a little reprieve from our troubles."
 ZAZ_TUR_end_crimea_title:0 "Victory in Crimea"
 ZAZ_TUR_expand_border_desc:0 "Expand the borders of our nation."
 ZAZ_TUR_expand_border_title:0 "Expand Border"
 ZAZ_TUR_otoman_desc:0 "Our once lowly state has risen to become a mighty khanate that rivals even the Mongols."
 ZAZ_TUR_otoman_title:0 "Zaporozhian Hegemony"
 ZAZ_TUR_settle_north_desc:0 "Now that Lithuania has been subdued, it is time to acquire additional land for our people. The vast plains of Ukraine will be ideal for this purpose."
 ZAZ_TUR_settle_north_title:0 "Settle Ukraine"
 ZAZ_TUR_settle_south_desc:0 "With Lithuania towering over us, it is critical that we seek to reduce their power."
 ZAZ_TUR_settle_south_title:0 "Defeat Lithuania"
 ZAZ_TUR_side_tur_desc:0 "We must continue to prove our allegiance and usefulness to the Turks, irrespective of our ties with them. Failure to do so may lead to us being deemed a liability and ultimately abandoned."
 ZAZ_TUR_side_tur_title:0 "Warrior Clan"
 ZAZ_TUR_sieze_ports_desc:0 "The ports of Cafa and Azov would make a wonderful addition to our own expansion, allowing us to establish a foothold in Black Sea commerce."
 ZAZ_TUR_sieze_ports_title:0 "Seize Black Sea Ports"
 ZAZ_TUR_slave_trade_desc:0 "Kaffa's market moves thousands of Ruthenian and Polish captives a year, and the Khan's revenue rests on it. As the Sultan's men we may enter the port lawfully; what happens to the pens once we are inside is another matter."
 ZAZ_TUR_slave_trade_title:0 "Disrupt the Slave Trade"
 ZAZ_TUR_war_crimea_desc:0 "Sitting and looking will get you nowhere. It's time to attack!"
 ZAZ_TUR_war_crimea_title:0 "Invasion of Crimea"
 ZAZ_UKR_2_desc:0 "The rich farmlands of South Romania, specifically Wallachia, will provide our people with the nourishment and resources they need to thrive."
 ZAZ_UKR_2_title:0 "Conquer Wallachia"
 ZAZ_UKR_3_desc:0 "We must seize control of the affluent districts of the Bulgarian Kingdom from [TUR.GetName] as they would prosper better under our leadership than under theirs."
 ZAZ_UKR_3_title:0 "Invade Bulgaria"
 ZAZ_UKR_4_desc:0 "Controlling Thrace, a strategic peninsula that controls the Bosporus Strait, would bring immense riches to our growing empire, and we must seize this opportunity."
 ZAZ_UKR_4_title:0 "Invade Thrace"
 ZAZ_UKR_5_desc:0 "Behold the magnificent city of Constantinople, coveted by many across Europe throughout the ages. From the Romans to the Turks, now it is ours to possess."
 ZAZ_UKR_5_title:0 "Take Constantinople"
 ZAZ_UKR_attack_genoa_2_desc:0 "Foreign Genoese merchants have held control over important Black Sea commercial hubs for far too long. We must seize their ports and claim the riches they provide as our own."
 ZAZ_UKR_attack_genoa_2_title:0 "Seize Port"
 ZAZ_UKR_attack_genoa_desc:0 "Theodoro, a strategic addition to our collection, must be conquered and brought under our control."
 ZAZ_UKR_attack_genoa_title:0 "Conquer Theodoro"
 ZAZ_UKR_contest_crimea_desc:0 "With the Crimean Khanate on our doorstep, we shall never find peace. To resolve the situation, we must first prepare for war"
 ZAZ_UKR_contest_crimea_title:0 "Crimea Dispute"
 ZAZ_UKR_cordon_desc:0 "No foreign patron will secure the upper Dnieper marches for us. We must seize the frontier forts ourselves and turn the border into our own shield."
 ZAZ_UKR_cordon_title:0 "Break the Northern Cordon"
 ZAZ_UKR_desc:0 "Moldova, situated between numerous rivers, provides us with natural protection against the Balkans and a gateway for invasion."
 ZAZ_UKR_dip_4_desc:0 "We have taken control of Azov, a key European commercial port that has long shipped Crimean slaves. By promoting this trade, we can tap into a lucrative source of wealth that our Crimean predecessors excelled at."
 ZAZ_UKR_dip_4_title:0 "Promote Slave Trade"
 ZAZ_UKR_dip_7_desc:0 "Red Rus' presents a wealth of resources for us to exploit, including plentiful livestock and grain. Settling in this region will greatly benefit our realm."
 ZAZ_UKR_dip_7_title:0 "Settle Red Rus'"
 ZAZ_UKR_east_dniepr_desc:0 "The fertile meadows of East Dniepr are perfect for grazing our horses, providing us with a valuable asset for conquest."
 ZAZ_UKR_east_dniepr_title:0 "Conquer East Dniepr"
 ZAZ_UKR_end_crimea_desc:0 "Now that the Crimean Khanate has been annihilated, we have have a little reprieve"
 ZAZ_UKR_end_crimea_title:0 "Taking Hold of Crimea"
 ZAZ_UKR_hatman_desc:0 "With Crimea and Ruthenia under our hand, the Host can present itself as the equal of every power around the steppe and the northern forests."
 ZAZ_UKR_hatman_title:0 "The Hetman's Supremacy"
 ZAZ_UKR_insult_feo_desc:0 "The Goths are a little, useless enclave from another era. Let us make it clear to them that they are insignificant and irrelevant."
 ZAZ_UKR_insult_feo_title:0 "Insult [FEO.GetName]"
 ZAZ_UKR_insult_tur_desc:0 "To the east is the Turkish menace. Its our responsibility to inform them that they are, in fact, a threat."
 ZAZ_UKR_insult_tur_title:0 "Defiance"
 ZAZ_UKR_malopolska_desc:0 "Poland's prosperous cities lie just a few kilometers from our own borders. Seizing control of these crucial sites will give us renewed access to markets throughout Europe, furthering our economic power."
 ZAZ_UKR_malopolska_title:0 "Capture Kraków"
 ZAZ_UKR_podolia_volhynia_desc:0 "The fertile meadows of Podilia Volhynia offer an excellent grazing ground for our horses, making it a valuable conquest for our growing empire."
 ZAZ_UKR_podolia_volhynia_title:0 "Conquer Podilia Volhynia"
 ZAZ_UKR_poland_desc:0 "The annexation of Poland will contribute significantly to our ever-increasing wealth and power, cementing our position as a dominant force in the region."
 ZAZ_UKR_poland_title:0 "Eliminate Poland"
 ZAZ_UKR_politics_2_desc:0 "Our own institutions are finally strong enough to carry the state without leaning on Polish, Muscovite, or Tatar courts."
 ZAZ_UKR_politics_2_title:0 "Succession of [Root.GetName]"
 ZAZ_UKR_politics_desc:0 "Every Cossack votes at the Rada, officers are chosen by acclamation, and a Kosh Otaman who loses the Host's confidence lays down the bulava the same day. Extending that custom to towns and regiments is another matter."
 ZAZ_UKR_politics_title:0 "Cossack Liberties"
 ZAZ_UKR_russia_2_desc:0 "Russia is no longer the superpower of the region that it once was, and we must take advantage of this opportunity to interfere and assert our own dominance."
 ZAZ_UKR_russia_2_title:0 "Interference in Russia"
 ZAZ_UKR_russia_3_desc:0 "With no serious opposition to our claim to the Russian region, we must establish unequivocally that these territories belong to us and us alone."
 ZAZ_UKR_russia_3_title:0 "Take Control of Russia"
 ZAZ_UKR_russia_desc:0 "Russia has been subject to foreign control for far too long, first the Mongol Yoke and then the Tartar Yoke. We must modify this and conquer the land for ourselves."
 ZAZ_UKR_russia_title:0 "Invasion of Russia"
 ZAZ_UKR_ruthenia_desc:0 "Rus', the core area of the Eastern European lowlands, is the magnificent homeland of our Slavic siblings and must be claimed as our own."
 ZAZ_UKR_ruthenia_title:0 "Zaprozhzhia Finds Home"
 ZAZ_UKR_seize_ports_1_desc:0 "As the people, once known as Khazars who Cossacks, began and traced their lineage from militant and invincible ghettos, and because the laws of proximity inextricably link and closely unite the fate of the Cossack people with the Crimean state, the Zaporozhian Army has repeatedly joined her in an armed alliance and accepted her allied support for the defense of their homeland and freedoms. As a result, as far as possible in the future, the clairvoyant hetman should persuade the noblest khan to restore former fraternal relations with the Crimean state, armed support from it, and confirmation of eternal friendship, given that neighboring states will not encroach on Ukraine and will not dare to inflict any violence on her."
 ZAZ_UKR_seize_ports_1_title:0 "The Khazar Theory"
 ZAZ_UKR_seize_ports_desc:0 "The port of Cafa and the trade center of Azov; Would be a wonderful addition to our own expansion; Supporting us in getting a foothold in the Black Sea commerce"
 ZAZ_UKR_seize_ports_title:0 "Investigate the Black Sea Ports"
 ZAZ_UKR_settle_north_1_desc:0 "Now that the Rus territories have been restored, it is time to begin rebuilding our former lands for our people."
 ZAZ_UKR_settle_north_1_title:0 "Resettle Rus-Ukraine"
 ZAZ_UKR_settle_north_desc:0 "With the frontier secured, it is time to gather the Ukrainian lands into a single settled steppe realm."
 ZAZ_UKR_settle_north_title:0 "Settle Ukraine"
 ZAZ_UKR_settle_south_desc:0 "With the first cordon breached, we can consolidate the crossings of the northern marches and bind them to the Host."
 ZAZ_UKR_settle_south_title:0 "Secure the Frontier Marches"
 ZAZ_UKR_sieze_ports_1_desc:0 "We must seize control of the ports to strengthen our trade and military presence."
 ZAZ_UKR_sieze_ports_1_title:0 "Seize Ports"
 ZAZ_UKR_sieze_ports_desc:0 "We must seize control of the ports to strengthen our position and secure trade routes."
 ZAZ_UKR_sieze_ports_title:0 "Seize Ports"
 ZAZ_UKR_title:0 "Balkan Gateway"
 ZAZ_UKR_war_crimea_desc:0 "Sitting and waiting will get us nowhere. We must attack!"
 ZAZ_UKR_war_crimea_title:0 "Invasion of Crimea"
 ZAZ_UKR_weste_desc:0 "The lush grasslands of Podilia are perfect for our horse breeding, providing an opportunity to further enrich our cavalry."
 ZAZ_UKR_weste_title:0 "Conquer Podilia"
 ZAZ_ally_pol_desc:0 "The Commonwealth elects its kings and binds them by pacta conventa, a thing neither Moscow nor Istanbul would credit. Our elders see their own Rada in the Sejm. The Sejm sees peasants with sabres."
 ZAZ_ally_pol_title:0 "Return to the Commonwealth"
 ZAZ_ally_rus_desc:0 "Moscow styles itself the Third Rome and offers the Host artillery, grain and a patriarch of our own rite. The Tsar's clerks will also want the register, the customs, and the naming of our colonels."
 ZAZ_ally_rus_title:0 "The Muscovite Protectorate"
 ZAZ_ally_tartar_desc:0 "The Khan's horsemen and our own keep the same seasons and take the same plunder, and have ridden together as often as against each other. An understanding with the Girays frees our backs, and costs us every parish that lost a son at Perekop."
 ZAZ_ally_tartar_title:0 "Alliance of Steppe Peoples"
 ZAZ_ally_tur_desc:0 "The Porte asks little of a tributary beyond quiet on the frontier and troops when called. A sultan's charter would cover us against Polish revenge and open the Black Sea ports to our grain. It would also set the Sich under a Muslim overlord, and the parishes will have views."
 ZAZ_ally_tur_title:0 "Ottoman Alliance"
 ZAZ_attack_genoa_2_desc:0 "Foreign Genoese merchants have governed the important Black Sea commercial hubs for far too long. The money and riches they provide are just too important to ignore"
 ZAZ_attack_genoa_2_title:0 "Seize Ports"
 ZAZ_attack_genoa_desc:0 "Theodoro is a terrific addition to our collection"
 ZAZ_attack_genoa_title:0 "Conquer Theodoro"
 ZAZ_chaiky_raids_desc:0 "A chaika is a hollowed lime trunk bundled with reeds at the gunwale, fifty men to a hull, rowing where a galley draws too much water. Kaffa and the Bosphorus villages are three nights downwind. The Porte will answer, but not quickly."
 ZAZ_chaiky_raids_title:0 "The Chaiky Fleet"
 ZAZ_domestic_3_desc:0 "Expanding our core territories will help secure our future for many years to come."
 ZAZ_domestic_3_title:0 "Building [Root.GetName]"
 ZAZ_establish_sich_desc:0 "Below the rapids the islands lie beyond the reach of any starosta's writ. A palisade, a store of powder and a church make a Kish; the Rada sits, the otaman is chosen, and men who owe labour elsewhere begin to arrive."
 ZAZ_establish_sich_title:0 "Establish the Sich"
 ZAZ_evolve_to_hetmanate_desc:0 "The Zaporizhian Sich can transform from a raiding host into a settled Hetmanate, assuming formal structures of governance and broader obligations."
 ZAZ_evolve_to_hetmanate_title:0 "Elevate the Sich to a Hetmanate"
 ZAZ_finally_desc:0 "The Host answers to no crown but its own. The Rada elects the hetman, and the bulava passes by acclamation rather than by royal patent. Yet a free Host must still choose its friends: the Tsar offers protection, the Porte offers trade, the Commonwealth remembers its grievances, and the Horde remembers the road north."
 ZAZ_finally_title:0 "The Zaporozhian State"
 ZAZ_first_raze_desc:0 "When diplomacy fails and enemies threaten our borders, the traditional Cossack response is swift and terrible - ride out, strike hard, and teach our foes the price of challenging the Host. Let the countryside burn as a warning to all who would oppress free men!"
 ZAZ_first_raze_title:0 "Punitive Raids"
 ZAZ_independce_desc:0 "Our hetmans hold the bulava at the king's pleasure and our numbers are fixed by his register. The Host has kept this frontier for Vilnius, for Krakow and for Moscow in turn, and been paid in promises each time."
 ZAZ_independce_title:0 "The Path to Freedom"
 ZAZ_insult_cri_desc:0 "The inferior Crimean Khanate must be made aware of their insignificance in our realm."
 ZAZ_insult_cri_title:0 "Insult [CRI.GetName]"
 ZAZ_insult_lit_desc:0 "Let us remind our former rulers of our worth and their foolishness in underestimating us."
 ZAZ_insult_lit_title:0 "Insult [LIT.GetName]"
 ZAZ_istanbul_desc:0 "Our grandfathers took chaiky into the Bosphorus and burned the suburbs within sight of the Sultan's windows. The Porte has since chained the straits and keeps a squadron at the mouth. The insult is remembered on both sides."
 ZAZ_istanbul_title:0 "The Constantinople Raid"
 ZAZ_khanate_desc:0 "As a small free harbor state, we must use every resource available to us if we are to survive and become more than a footnote in history."
 ZAZ_khanate_title:0 "Developing [Root.GetName]"
 ZAZ_krakow_desc:0 "Krakow keeps the Wawel, the crown treasury and the rents wrung from our starostwa. A raid through Malopolska would not hold the city, but it would settle what the magnates believe about the reach of Cossack horse."
 ZAZ_krakow_title:0 "Raid on Kraków"
 ZAZ_lit_desc:0 "The magnates hold the steppe as private latifundia and press free men into labour dues. The register is cut when it suits the Sejm and our elders are executed when it does not. The bulava has bowed to that crown long enough."
 ZAZ_lit_title:0 "Break the Polish Yoke"
 ZAZ_moskva_desc:0 "Moscow calls the gathering of the Rus' lands a duty, and our liberties a privilege it may revise. If the Tsar will not set them in writing, the Host can show him what the gathering costs when the gathered object."
 ZAZ_moskva_title:0 "Strike at the Third Rome"
 ZAZ_muster_manpower_desc:0 "Before we can challenge the great powers, we must first gather our strength. Let the call go out across the Wild Field - all free men who can ride and fight are welcome in the Zaporozhian Host!"
 ZAZ_muster_manpower_title:0 "Muster the Cossack Host"
 ZAZ_only_zaz_desc:0 "No king, tsar, sultan or khan holds our charter. The Kish feeds itself from the river, the herd and the raid, and the Rada answers to nobody. Standing alone on open steppe is a policy that must be renewed every campaigning season."
 ZAZ_only_zaz_title:0 "The Cossack Republic"
 ZAZ_orthodox_protectors_desc:0 "The Latin bishops hold the endowments and the king's ear; our metropolitan keeps his seat in Kyiv on sufferance. The brotherhoods of Lviv and Kyiv keep their schools on what the pious still send, and their sons come to the Host when the town gates close to them."
 ZAZ_orthodox_protectors_title:0 "Defenders of Orthodoxy"
 ZAZ_proper_desc:0 "Neighboring huge steppe"
 ZAZ_proper_title:0 "Right Center"
 ZAZ_rally_hordes_desc:0 "The frontier villages breed men who ride from childhood and shoot from the saddle. Drilled to volley as well, the Host fields horse that skirmishes like a Nogai and holds like a Polish banner."
 ZAZ_rally_hordes_title:0 "Masters of Steppe Warfare"
 ZAZ_rus_war_6_desc:0 "Now that the Lithuanians have been defeated, it is time to start looking for fresh land for our people. The huge plains of Ukraine will be suitable for this, and we must expand our control over this region."
 ZAZ_rus_war_6_title:0 "Settle South Ukraine"
 ZAZ_saratov_desc:0 "We can arrange a raid scheme to take down the capital while [GOL.GetName] is busy in the West. They'll just never believe that!"
 ZAZ_saratov_title:0 "Saratov raid"
 ZAZ_settlements_desc:0 "Between the fortress line and the open steppe there is room for slobodas — settlements exempt from labour dues, ploughed by men who left a lord behind. Cossack posts would cover them; the lords will write to the Sejm about it."
 ZAZ_settlements_title:0 "The Sloboda System"
 ZAZ_treb_desc:0 "Within Anatolia's mountains, [TRE.GetName] is a veritable stronghold. The land will be tough to retain, so perhaps we might make them Tributes."
 ZAZ_treb_title:0 "Subjugate [TRE.GetName]"
 ZAZ_tur_dip_2_desc:0 "Let us closely monitor their embargo policies to demonstrate our unwavering commitment to the relationships we have forged. Even if it does not bring any tangible benefits, it is a noble gesture of our loyalty."
 ZAZ_tur_dip_2_title:0 "Provide Trade Assistance to Allies"
 ZAZ_tur_dip_4_desc:0 "For ages, Azov has been a prime European commercial port, shipping Crimean slaves. By pushing the same commerce that the Crimean excelled at, we can bring considerable wealth to our realm now that it is in our control."
 ZAZ_tur_dip_4_title:0 "Promote Slavery"
 abolished_register:0 "Abolished Cossack Register"
 accept_papal_supremacy:0 "Accept Papal Supremacy"
 accept_papal_supremacy_desc:0 "We recognize the Pope as spiritual head of the universal Church while maintaining our Eastern custom and autonomy."
 accepted_collegium:0 "Accepted Collegium Oversight"
 accepted_russian_candidate:0 "Accepted Russian Candidate"
 akkerman_mighty_fortress:0 "Mighty Fortress of Akkerman"
 ancient_dregovichi:0 "Ancient Dregovichi"
 ancient_dregovichi_desc:0 "The Dregovichi tribe settled the Pripyat basin in the 6th-12th centuries. Our ancient cultural roots predate even the Kyivan state, lending us historical legitimacy."
 anti_raid_fortifications:0 "Anti-Raid Fortifications"
 apostol:0 "Apostol"
 appoint_regional_governors_desc:0 "A system of loyal governors will help us administer our expanding realm efficiently."
 appoint_regional_governors_title:0 "Appoint Regional Governors"
 assembly_houses_reform:0 "Burgher Assemblies"
 assembly_houses_reform_desc:0 "Chartered towns send burghers to a standing assembly, and grievances are heard before they turn into revolt. The boyars resent every sitting of it."
 baltic_connections:0 "Baltic Connections"
 baltic_connections_desc:0 "Trade with Riga, Reval, and Dorpat brings Western technology and ideas to Vitebsk. We offer an alternative to Muscovite cultural domination."
 basilian_monasteries:0 "Basilian Monasteries"
 basilian_monasteries_desc:0 "Reformed Basilian monasteries combine Eastern monastic tradition with Catholic learning, serving as centers of education and culture."
 basilian_monastic_order:0 "Basilian Monastic Order"
 battle_of_nemiga:0 "Battle of Nemiga"
 battle_of_nemiga_desc:0 "The 1067 Battle of Nemiga marked Minsk's struggle for independence. This cultural memory inspires our soldiers and strengthens our military traditions."
 batuuryn_destroyed:0 "Batuuryn Destroyed"
 batuuryn_fortified:0 "Batuuryn Fortified"
 belarus_mixed_heritage:0 "Mixed Cultural Heritage"
 belarus_nation_desc:0 "The time has come to unite all Belarusian lands under one banner. By combining the strength of Polotsk, Minsk, Turov, Vitebsk, and Mstislavl, we shall create a unified Belarusian state that can stand against both Eastern and Western powers."
 belarus_nation_title:0 "Form Belarus"
 belarus_national_identity:0 "The Belarusian Name"
 belarus_ruthenian_heritage:0 "Ruthenian Heritage"
 belarusian_identity:0 "The Belarusian Name"
 belarusian_identity_desc:0 "Minsk synthesizes Orthodox and Catholic influences into a unique Belarusian culture. Our tolerant multi-confessional tradition fosters social harmony."
 belarusian_unity:0 "Belarusian Unity"
 belarusian_unity_desc:0 "The unification of Polotsk, Minsk, Turov, Vitebsk, and Mstislavl creates a cohesive Belarusian name and custom. Internal strife decreases as cultural synthesis progresses."
 belarusian_unity_movement:0 "Belarusian Unity Movement"
 black_ruthenia_area:0 "Black Ruthenia"
 black_ruthenia_area_adj:0 "Black Ruthenian"
 black_sea_commerce:0 "Black Sea Commerce"
 black_sea_commerce_desc:0 "We profit greatly from Black Sea trade routes."
 black_sea_grain_corridor:0 "Black Sea Grain Corridor"
 black_sea_raiding_treaty:0 "Black Sea Raiding Treaty"
 black_sea_safe_trade:0 "Black Sea Safe Trade"
 black_sea_trade_partner:0 "Black Sea Trade Partner"
 blessing_of_basilian_order:0 "Blessing of the Basilian Order"
 blessing_of_cultural_dominance:0 "Blessing of Cultural Dominance"
 blessing_of_eastern_liturgy:0 "Blessing of Eastern Liturgy"
 blessing_of_orthodox_conquest:0 "Blessing of Orthodox Conquest"
 blessing_of_papal_protection:0 "Blessing of Papal Protection"
 blessing_of_patriarch_of_moscow:0 "Blessing of the Patriarch of Moscow"
 blessing_of_religious_unity:0 "Blessing of Religious Unity"
 blessing_of_saints_cyril_and_methodius:0 "Blessing of Saints Cyril and Methodius"
 blessing_of_third_rome:0 "Blessing of the Third Rome"
 blessing_of_uniate_missionaries:0 "Blessing of Greek Catholic Missionaries"
 border_fortification_investment:0 "Border Fortifications"
 border_principalities.1.a:0 "Grant them autonomous rule as our vassals"
 border_principalities.1.b:0 "We shall rule Rylsk directly"
 border_principalities.1.d:0 "After the failure of Dmitri Shemyaka to secure the throne of Muscovy, his descendants were granted the principality of Rylsk by the Grand Duchy of Lithuania. As Rurikid princes with legitimate claims to Russian lands, they represent both a valuable asset and a potential liability. Their presence on the border could serve as a buffer against Muscovite expansion, but it also attracts the attention of Moscow's ambitious rulers who may see them as pretenders to be liberated."
 border_principalities.1.t:0 "The Shemyaka Heirs in Rylsk"
 border_principalities.10.a:0 "Welcome them as faithful servants of the Tsar"
 border_principalities.10.d:0 "The Jagoldai Tatars, led by descendants of Golden Horde nobility, have broken with Lithuania and pledged themselves to our service. Their fierce cavalry will strengthen our borders against raids from the south, and their settlement provides us with a forward military presence on the steppe frontier. This defection further weakens Lithuania's hold on the borderlands."
 border_principalities.10.t:0 "Jagoldai's Tatars Seek Our Protection"
 border_principalities.11.a:0 "We will not surrender Severia without a fight"
 border_principalities.11.b:0 "Let the Severian princes go to Moscow"
 border_principalities.11.d:0 "The princes of Starodub and other Severian lands, who have long chafed under Lithuanian rule, are being courted by Moscow. These Orthodox Rus' princes see themselves as having more in common with their fellow Russians than with Catholic Lithuania. They have approached Muscovite officials about switching their allegiance, offering their territories in exchange for estates and recognition. This could spark the war that has been brewing for years."
 border_principalities.11.t:0 "The Severian Princes Consider Moscow"
 border_principalities.12.a:0 "Accept them as brothers in the great gathering of Russian lands"
 border_principalities.12.d:0 "The Orthodox princes of the Severian lands have renounced Lithuanian overlordship and pledged themselves to us as the rightful rulers of all Rus'. They bring with them strategic territories on Lithuania's eastern border and provide moral justification for our expansion westward. This defection represents a significant victory in our long struggle to reunify the Russian lands under one sovereign."
 border_principalities.12.t:0 "The Severian Princes Offer Their Lands"
 border_principalities.2.a:0 "Grant them lands and welcome their Tatar warriors"
 border_principalities.2.b:0 "We need no Tatar cavalry in our service"
 border_principalities.2.d:0 "The Glinski family claims descent from the mighty Mamai, the Mongol general who once dominated the steppes. They have petitioned for lands in our eastern borderlands, offering to settle Tatar cavalry in exchange for defending us against raids from the wild steppes. These Tatars, though of the same stock as our enemies, have proven loyal to the Glinski princes and could provide valuable military service. However, granting such power to a family claiming descent from our former oppressors may be controversial."
 border_principalities.2.t:0 "The Glinski Princes and Their Tatars"
 border_principalities.3.a:0 "Accept Jagoldai and his warriors"
 border_principalities.3.b:0 "We need no horde vassals"
 border_principalities.3.d:0 "Jagoldai, a pretender to the throne of the Golden Horde, has offered to settle his followers in the lands south of Kursk in exchange for our protection. His Tatar cavalry would serve as a formidable buffer against raids from the steppes, and his claim to Golden Horde legitimacy could prove useful in future dealings with the successor khanates. However, allowing a horde to settle so close to our heartlands is not without risk."
 border_principalities.3.t:0 "Jagoldai's Golden Horde Remnant"
 border_principalities.4.a:0 "Grant them privileges to keep them loyal"
 border_principalities.4.b:0 "Let them go peacefully to Moscow"
 border_principalities.4.c:0 "They are our subjects! This means war!"
 border_principalities.4.d:0 "The princes of Rylsk, descendants of Dmitri Shemyaka, have been approached by Muscovite agents who remind them of their Rurikid heritage and claim to the Russian lands. Moscow offers them estates deep in Muscovite territory and recognition of their noble status if they acknowledge the Grand Prince as their rightful sovereign. We face a choice: strengthen our hold on Rylsk through concessions, allow them to depart peacefully, or risk war with Muscovy to keep them by force."
 border_principalities.4.t:0 "Rylsk Considers Muscovite Protection"
 border_principalities.5.a:0 "Welcome them as faithful subjects of the rightful Rus'"
 border_principalities.5.d:0 "The Rurikid princes of Rylsk, descendants of Dmitri Shemyaka, have renounced their allegiance to Lithuania and ask to enter our service. They bring with them legitimate claims to lands on the Lithuanian border and valuable knowledge of our enemy's defenses. Their defection provides both military advantage and diplomatic justification for future campaigns against the Grand Duchy."
 border_principalities.5.t:0 "The Princes of Rylsk Seek Our Protection"
 border_principalities.6.a:0 "Negotiate and grant them concessions"
 border_principalities.6.b:0 "Mobilize forces to suppress any rebellion"
 border_principalities.6.c:0 "Exile the troublesome family"
 border_principalities.6.d:0 "Tensions between the Glinski princes and our court have reached a breaking point. The proud descendants of Mamai feel slighted by our treatment and have been approached by Muscovite agents promising greater honors and estates. Their control over substantial Tatar cavalry forces makes them dangerous enemies. We must decide whether to appease them with gold and privileges, suppress them with military force, or allow them to depart to Moscow."
 border_principalities.6.t:0 "The Glinski Rebellion Brewing"
 border_principalities.7.a:0 "So be it, we shall face them in battle"
 border_principalities.7.d:0 "Our attempts to placate the Glinski princes have failed. They have raised their Tatar cavalry in open rebellion and declared their allegiance to Muscovy! Their intimate knowledge of our border defenses makes them particularly dangerous, and Moscow will surely use this opportunity to press claims against our eastern provinces."
 border_principalities.7.t:0 "The Glinski Rebellion Erupts"
 border_principalities.8.a:0 "Welcome them with all honors due to their station"
 border_principalities.8.d:0 "The powerful Glinski family, descendants of the legendary Mamai and commanders of formidable Tatar cavalry, have abandoned Lithuania and entered our service. They bring with them valuable military expertise, knowledge of Lithuanian defenses, and loyal Tatar warriors. Their defection is a significant blow to Lithuania and provides us with capable commanders for our campaigns. One of their descendants, Elena Glinskaya, will eventually become the mother of our future ruler."
 border_principalities.8.t:0 "The Glinski Princes Enter Our Service"
 border_principalities.9.a:0 "Increase their tribute to keep them loyal"
 border_principalities.9.b:0 "Let them seek their fortune with Moscow"
 border_principalities.9.c:0 "They are bound to us by oath! War if necessary!"
 border_principalities.9.d:0 "The Jagoldai Tatars, who have served as our border buffer for years, are being courted by Muscovite diplomats. Moscow offers them better lands and greater autonomy under Muscovite protection. As steppe nomads, they have little attachment to any overlord beyond practical considerations of safety and prosperity. We must decide whether to increase payments to retain their loyalty, allow them to depart peacefully, or risk war to keep them under our authority."
 border_principalities.9.t:0 "Jagoldai's Horde Wavers in Loyalty"
 border_raiders:0 "Border Raiders"
 border_raiders_desc:0 "Light cavalry raiding supplements our limited agricultural economy. Steppe warfare tactics blend with Rus' military traditions."
 border_vassal_buffer:0 "Border Vassal Buffer"
 border_vassal_buffer_desc:0 "Our border principalities provide a defensive buffer against enemy incursions while strengthening our diplomatic position."
 border_war_preparation:0 "Border War Preparation"
 border_war_preparation_desc:0 "Tensions on our borders have prompted military preparations and improved defensive readiness."
 boyar_elite_reform:0 "Boyar Rada"
 boyar_elite_reform_desc:0 "Even the most capable kings cannot rule alone, and needs capable councillors to guide them."
 boyars:0 "Boyars"
 boyars_desc:0 "The boyars seek fiscal stability and noble privilege."
 boyary:0 "Boyary"
 boyary_desc:0 "Administrative magnates: stability and bureaucracy, but with stronger noble inertia and autonomy pressure."
 bs_flavor.1a:0 "This is a great deal"
 bs_flavor.1b:0 "You make extortionate demands"
 bs_flavor.1d:0 "Italian merchants have provided us with a great tool in the form of Genoese compasses that make navigating our stolen goods across the terrain much easier. We use them on the grassy steppes, and they use them on the watery seas."
 bs_flavor.1t:0 "Genoese compasses"
 cas_base_sprite_pack:0 "Castile Unit Pack"
 catholic_backing_uniate:0 "Catholic Support for Union"
 catholic_oppression_resisted:0 "Resisted Catholic Oppression"
 cb_crusade_for_constantinople:0 "Orthodox Crusade for Constantinople"
 cb_crusade_for_constantinople_desc:0 "We must reclaim Constantinople from unbelievers and restore Orthodox rule."
 cb_crusade_for_jerusalem:0 "Orthodox Crusade for Jerusalem"
 cb_crusade_for_jerusalem_desc:0 "We must reclaim Jerusalem and return the Holy City to Christian hands."
 centralized_control:0 "Centralized Control"
 chaiky_naval_raid_success:0 "Chaiky Raid Success"
 chernihiv_collegium:0 "Chernihiv Collegium"
 chernihiv_colonial_center:0 "Chernihiv Colonial Center"
 chernihiv_ruina:0 "Chernihiv Ruina"
 chernihiv_ruina_desc:0 "Polish, Muscovite, and Crimean armies turn the Left Bank into a chessboard while rival hetmans barter Chernihiv's loyalty. If the starshyna and regiments cannot be steadied, the lands along the Desna will splinter."
 chernihiv_ruina_title:0 "The Ruina of the Left Bank"
 chernozem_fertility:0 "Chernozem Fertility"
 chernozem_fertility_desc:0 "The rich black earth produces abundant harvests."
 children_of_the_marshes:0 "Children of the Marshes"
 children_of_the_marshes_desc:0 "The vast Pripyat wetlands have shaped our people for centuries. Local knowledge of the marshes provides us with unmatched defensive advantages against invaders who cannot navigate these treacherous waters."
 chr_Accept_Ruthenian_desc:0 "Let the Ruthenian tongue guide our chancery, sermons, and schools so migrants, nobles, and cossacks recognise the Hetman's mandate."
 chr_Accept_Ruthenian_title:0 "Embrace the Ruthenian Name"
 chr_Astrakhan_desc:0 "No one guards these affluent areas after the fall of the 'Great' Horde, from which we will be able to harvest an infinite amount of products and export them by sea to Asia and Persia."
 chr_Astrakhan_title:0 "Caspian Direction"
 chr_Azov_desc:0 "Azov's territory is owned by either Genoese merchants or the Crimean Khanate, both of which should fall to us."
 chr_Azov_title:0 "Azov Power"
 chr_Belarus_1_desc:0 "Confirm shared charters for Belarusian burghers, Lithuanian nobles, and Ruthenian brotherhoods so their schools and courts thrive under our Hetman."
 chr_Belarus_1_title:0 "Steward White Ruthenia"
 chr_Belarus_2_desc:0 "Appoint magistrates in Minsk who balance merchants, artisans, and Uniate clergy while keeping the city loyal to our laws."
 chr_Belarus_2_title:0 "Seat Magistrates in Minsk"
 chr_Crimea_desc:0 "End the slave raids, open Crimean ports to fair trade, and respect communities willing to live under our law."
 chr_Crimea_title:0 "Secure the Black Sea Door"
 chr_Great_Horde_desc:0 "Unite Sloboda regiments and steppe allies to dismantle the Horde's power and secure peace for traders and nomads alike."
 chr_Great_Horde_title:0 "Break the Great Horde"
 chr_Kiev_desc:0 "Hold both banks of the Dnieper so Kyiv's clergy, craftspeople, and students can rebuild without fear."
 chr_Kiev_title:0 "Regather the Kyivan Heartland"
 chr_Manpower_desc:0 "Record households, drill town watches, and invite refugee bands to muster so our armies never march hollow."
 chr_Manpower_title:0 "Mobilise Sloboda Reserves"
 chr_Minsk_desc:0 "Survey the marshes, support Polissian villages, and ensure our patrols respect local elders who know every bog and causeway."
 chr_Minsk_title:0 "Guide Northern Polissia"
 chr_Smolensk_desc:0 "Smolensk's forests link Baltic markets and the Desna. Welcoming its guilds and parishes into our union steadies our northern flank."
 chr_Smolensk_title:0 "Restore the Smolensk March"
 chr_Zaporozhie_desc:0 "Provide supplies and mutual defence to the Zaporizhian host in exchange for patrols that protect every frontier family."
 chr_Zaporozhie_title:0 "Anchor the Sich"
 chr_agro_hypercorp_complete_req_tt:0 "The Agro Hypercorp program must be completed."
 chr_agro_hypercorporation:0 "Agro Hypercorporation"
 chr_agro_hypercorporation_desc:0 "Merge mills, fairs, and convoy guilds into a single hetman-backed trust that treats grain like bullion and projects our reach far beyond the Left Bank."
 chr_agro_hypercorporation_exchange_tt:0 "At least three owned provinces host Exchange Syndicate modules."
 chr_agro_hypercorporation_title:0 "Codify the Agro Hypercorp"
 chr_army_desc:0 "Sivershchyna's sotnias draw recruits from Chernihiv's burghers, resettled families, and Cossack hosts. We must standardise weapons and drills so every regiment can march together when the frontier flares."
 chr_army_title:0 "Drill the Left-Bank Regiments"
 chr_assemble_an_army_desc:0 "Pair seasoned cossack cavalry with disciplined infantry so we can strike swiftly without exhausting frontier communities."
 chr_assemble_an_army_title:0 "Balance the Host and Line"
 chr_baranovych_guard:0 "Frontier Drill Silver"
 chr_baranovych_press:0 "Baranovych's Press"
 chr_baranovych_press_cooldown:0 "Recent Baranovych Synod"
 chr_baturyn_fortifications:0 "Baturyn Fortifications"
 chr_belgorod_commission_forts_tt:0 "Operate at least §Y3§! maintained forts across Sloboda Ukraine or the Lower Don."
 chr_belgorod_commission_statute:0 "Belgorod Commission Statute"
 chr_belgorod_commission_statute_mission_desc:0 "Invite Belgorod commissioners to audit our bastions, codifying drill manuals that keep Muscovite and Chernihiv garrisons in lockstep."
 chr_belgorod_commission_statute_mission_title:0 "Belgorod Commission Statute"
 chr_belgorod_line_country:0 "Belgorod Line"
 chr_belgorod_line_desc:0 "Build forts and watch posts from Belgorod to Izium so Crimean raids meet earthworks before they reach our villages."
 chr_belgorod_line_province:0 "Belgorod Line Earthworks"
 chr_belgorod_line_title:0 "Raise the Belgorod Line"
 chr_betrayed_tsar:0 "Betrayed the Tsar"
 chr_black_sea_consortia:0 "Black Sea Consortia"
 chr_black_sea_consortia_desc:0 "Merchant houses from Chernihiv, Ochakiv, and Kaffa pool convoys, insuring their cargoes and asserting our tariffs across the Pontic routes."
 chr_black_sea_consortia_mission_desc:0 "Merge our merchant flotillas into consortia that dominate coastal marts from Ochakiv to Kaffa."
 chr_black_sea_consortia_mission_title:0 "Black Sea Consortia"
 chr_black_soil_silos:0 "Black Soil Silos"
 chr_black_soil_silos_desc:0 "Standardise elevated granaries and threshing floors across Sloboda Ukraine, taming the harvest and shielding it from mold, fire, and blockade alike."
 chr_black_soil_silos_modules_tt:0 "At least four owned grain provinces have the Sloboda Farm Module (I)."
 chr_black_soil_silos_title:0 "Raise Black Soil Silos"
 chr_border_branch_lock:0 "Border Compact Cooldown"
 chr_border_compact_betrayal:0 "Border Compact Betrayed"
 chr_border_compact_confidence:0 "Border Compact Confidence"
 chr_border_compact_confidence_partner:0 "Border Patrol Liaison"
 chr_border_compact_cooldown:0 "Border Compact Cooldown"
 chr_border_compact_rupture:0 "Compact in Ruins"
 chr_border_compact_support:0 "Renewed Patrol Accord"
 chr_border_compact_tension:0 "Border Compact Under Strain"
 chr_border_compact_watchposts:0 "Watchposts on Alert"
 chr_border_compacts_betrayal_tt:0 "We denounce the compact, gutting frontier trust while our neighbor throws up suspicious watchposts."
 chr_border_compacts_branch_diplomatic_tt:0 "We will pursue the §YDiplomatic Frontier§! branch, keeping the \"Border Compacts\" missions focused on alliances and joint patrols."
 chr_border_compacts_branch_militarized_tt:0 "We will pursue the §YMilitarised Frontier§! branch, steering the \"Border Compacts\" missions toward forts and professional armies."
 chr_border_compacts_confidence_tt:0 "We gain §YBorder Compact Confidence§! for §Y5 years§!, boosting diplomacy and trimming fort upkeep, while our partner receives §YBorder Patrol Liaison§!."
 chr_border_compacts_deescalated_tt:0 "Tense patrols settle into a cooperative rotation, unlocking the full benefits of the border compact."
 chr_border_compacts_desc:0 "Negotiate with powerful neighbors so our frontier regiments patrol alongside allies instead of fighting alone. Completing this mission triggers a diplomatic accord event with a §Y20-year§! cooldown before new compacts can be struck."
 chr_border_compacts_dissolved_tt:0 "Stand down the shared patrols and recall our envoys until the frontier cools."
 chr_border_compacts_relations_tt:0 "Maintain 125 opinion with a neighboring Lithuania, Poland, Commonwealth, Muscovy, Russia, or Crimea while they remain at peace with us."
 chr_border_compacts_renewed_tt:0 "The accord is refreshed for another §Y5 years§!, trading intelligence and trust along the marches."
 chr_border_compacts_tension_tt:0 "We gain §YBorder Compact Under Strain§! for §Y3 years§!, raising unrest but thickening our frontier pickets as the partner erects §YWatchposts on Alert§!."
 chr_border_compacts_title:0 "Forge Border Compacts"
 chr_border_outposts:0 "Border Outposts"
 chr_border_pacts_cooldown:0 "Recent Border Pact"
 chr_border_surety:0 "Border Surety"
 chr_bratslav_brotherhood:0 "Brotherhood Printing Press"
 chr_breadbasket_supremacy:0 "Breadbasket Supremacy"
 chr_breadbasket_supremacy_balanced_reward_tt:0 "Without a settled frontier doctrine we gain 100 Administrative Power instead."
 chr_breadbasket_supremacy_desc:0 "Drive production beyond rival breadbaskets until foreign courts whisper that Chernihiv's silos alone can calm famine or finance war."
 chr_breadbasket_supremacy_diplomatic_reward_tt:0 "Because our border compacts hold, we gain 100 Diplomatic Power."
 chr_breadbasket_supremacy_military_reward_tt:0 "Because we braced the marches for war, we gain 100 Military Power."
 chr_breadbasket_supremacy_title:0 "Proclaim Breadbasket Supremacy"
 chr_build_manufactories_desc:0 "Encourage mills, ironworks, and cloth halls that employ locals and migrants, keeping profits close to the Desna."
 chr_build_manufactories_title:0 "Expand Left-Bank Workshops"
 chr_build_temples_desc:0 "Fund churches, brotherhood schools, and hospices across the Left Bank so spiritual and civic life flourish together."
 chr_build_temples_title:0 "Endow Churches and Schools"
 chr_build_treasury_desc:0 "Stock silver and grain reserves in Chernihiv and Baturyn, ready for campaigns or relief."
 chr_build_treasury_title:0 "Secure the Treasury"
 chr_building_alliances_desc:0 "Cultivate trusted allies whose courts respect our autonomy and share our aim of a stable frontier."
 chr_building_alliances_title:0 "Forge Alliances"
 chr_collegium_reform:0 "Chernihiv Collegium Reform"
 chr_commission_doroshenko_pantheon_desc:0 "Convene the starshyna to canonise Petro Doroshenko and choose how his march or council will guide the republic."
 chr_commission_doroshenko_pantheon_title:0 "Pantheon Commission: Doroshenko"
 chr_commission_mazepa_pantheon_desc:0 "Seal the Pantheon by canonising Ivan Mazepa, binding either the akademia's brilliance or the state treasury's discipline."
 chr_commission_mazepa_pantheon_title:0 "Pantheon Commission: Mazepa"
 chr_commission_monastic_bastions_desc:0 "Channel war funds and engineers into the Left Bank cloisters, uplifting them into fortified monasteries that harden the frontier."
 chr_commission_monastic_bastions_title:0 "Commission Monastic Bastions"
 chr_commission_samoylovych_pantheon_desc:0 "Interpret Ivan Samoylovych's legacy, deciding whether his chancery reforms or ecclesiastical vision anchors the Hetmanate."
 chr_commission_samoylovych_pantheon_title:0 "Pantheon Commission: Samoylovych"
 chr_commonwealth_alignment:0 "Commonwealth Surety"
 chr_commonwealth_guardianship:0 "Commonwealth Guardianship"
 chr_commonwealth_guardianship_desc:0 "Diplomats anchored in Warsaw and Vilnius secure subsidies, tax harmonisation, and a pledge that our borders remain inviolate while we rebuild the hetmanate."
 chr_commonwealth_guardianship_tt:0 "Gain §YCommonwealth Guardianship§! for §Y15 years§!, improving diplomacy and taxation while trimming border tensions."
 chr_commonwealth_joint_diets:0 "Joint Diet Sessions"
 chr_commonwealth_joint_diets_desc:0 "Starshyna envoys and Polish castellans convene shared dietines, pooling reforms while rewarding estates that back consensus motions."
 chr_commonwealth_joint_diets_mission_desc:0 "Seat our envoys in parliament halls where Magdeburg burghers and Polish senators codify compromise charters."
 chr_commonwealth_joint_diets_mission_title:0 "Joint Diet Sessions"
 chr_commonwealth_protectorate_mission_desc:0 "Forge a binding alliance with the Commonwealth crowns so our border regiments drill under a shared defensive pact."
 chr_commonwealth_protectorate_mission_title:0 "Commonwealth Protectorate"
 chr_commonwealth_protectorate_tt:0 "Maintain an alliance with the Commonwealth crowns and cultivate at least §Y100§! opinion and §Y50§! trust."
 chr_compact_network:0 "Compact Envoys"
 chr_conquer_oka_desc:0 "Odoyev and the Oka fortresses control the road between the Desna and Muscovy. Binding them to Chernihiv protects merchants and refugee households travelling both ways."
 chr_conquer_oka_title:0 "Secure the Oka Gate"
 chr_conquer_russia_desc:0 "Unite the Ruthenian principalities under councils that respect local charters while speaking with one Left-Bank voice."
 chr_conquer_russia_title:0 "Confederate the Rus' Lands"
 chr_conquer_rya_desc:0 "Ryazan's boyars still rouse raids along the Seim. Fold their kreml into our realm so settlers, monastics, and merchants can share the land in safety."
 chr_conquer_rya_title:0 "Pacify Ryazan"
 chr_conquer_states_desc:0 "Resettle families along the Kharkiv and Seim lines, extend our charters, and ensure new regiments answer the Left Bank."
 chr_conquer_states_title:0 "Secure Sloboda Ukraine"
 chr_cossack_regiments:0 "Balanced Sotnia Rosters"
 chr_cossack_regiments_desc:0 "Hetman chancelleries rotate burgher musketeers, registered Cossacks, and frontier irregulars through the same muster rolls. No estate monopolises command, and every banner keeps reserves drilled for rapid mobilisations."
 chr_cossacks_desc:0 "Treat with the Zaporizhian Sich, ensuring their rada shares patrols, rations, and victories with our hetmanate."
 chr_cossacks_title:0 "Enlist the Sich"
 chr_crimean_compact_mission_desc:0 "Codify caravan treaties with the Khanate, binding escorts to our convoys while respecting steppe autonomy."
 chr_crimean_compact_mission_title:0 "Crimean Compact"
 chr_crimean_compact_tt:0 "Maintain an alliance with the Crimean Khanate with §Y100§! opinion and §Y50§! trust."
 chr_crimean_convoy_charters_mod:0 "Black Sea Grain Charters"
 chr_crimean_convoy_network_branch_desc:0 "Expand our escort flotillas or light squadrons so the Khanate keeps backing our grain fleets."
 chr_crimean_convoy_network_branch_title:0 "Launch Crimean Convoy Network"
 chr_crimean_convoy_network_fleet_tt:0 "Maintain either §Y15§! light ships or §Y50%§! of force limit in the navy."
 chr_crimean_convoy_network_mod:0 "Crimean Convoy Network"
 chr_crimean_grain_charters_desc:0 "Upgrade Crimean marketplaces to lock in joint charters with steppe brokers and Black Sea merchants."
 chr_crimean_grain_charters_market_tt:0 "Own §Y3§! provinces in the Crimea region with a §YMarketplace§!."
 chr_crimean_grain_charters_title:0 "Broker Grain Charters"
 chr_crimean_guardianship:0 "Crimean Compact"
 chr_crimean_guardianship_desc:0 "Treaties with the Khan pledge caravan escorts and tolerance for steppe faiths in exchange for our grain fleets supplying the peninsula."
 chr_crimean_guardianship_tt:0 "Gain §YCrimean Compact§! for §Y15 years§!, raising trade efficiency, heathen tolerance, and naval capacity."
 chr_cultivate_the_east_dniepr:0 "Left-Bank Grain Syndicates"
 chr_cultivate_the_east_dniepr_desc:0 "Grain syndicates that mix Cossack sotnias, Jewish factors, and Ruthenian cooperatives steer barges from Hlukhiv to Kyiv. Their charter balances low tolls with reinvestment in convoy escorts and river depots."
 chr_defeated_oka:0 "Oka March Subdued"
 chr_defeated_rya:0 "Ryazan Cohorts Broken"
 chr_desna_watch:0 "Desna Watchtowers"
 chr_diplomatic_balancers:0 "Diplomatic Balancers"
 chr_diplomatic_network_desc:0 "Deepen the compacts we forged by guaranteeing multiple allies trust our word more than rival bribes or intimidation."
 chr_diplomatic_network_loyal_allies_tt:0 "Maintain three alliances and secure at least two partners with 150 opinion and 60 trust."
 chr_diplomatic_network_title:0 "Weave Compact Networks"
 chr_dniepr_desc:0 "Secure the eastern bank of the Dnieper with forts, markets, and parish schools that welcome newcomers."
 chr_dniepr_grain_exchange:0 "Dnieper Grain Exchange"
 chr_dniepr_grain_exchange_desc:0 "Charter a permanent bourse at the river crossings where merchants settle contracts, insure flotillas, and broadcast our price signals to every steppe."
 chr_dniepr_grain_exchange_title:0 "Open the Dnieper Grain Exchange"
 chr_dniepr_grain_modules_tt:0 "At least three owned provinces have the Sloboda Farm Module (II)."
 chr_dniepr_title:0 "Advance to the Dnieper"
 chr_dominate_home_trade_node_desc:0 "Coordinate guilds and fairs along the Desna so Ruthenian, Armenian, and Jewish merchants share safe markets under our tariffs."
 chr_dominate_home_trade_node_title:0 "Steward Desna Commerce"
 chr_dominate_home_trade_reward:0 "Grain Syndicates"
 chr_eastern_chronicle_diplomatic_title:0 "Chronicle of Diplomatic Triumphs"
 chr_eastern_chronicle_ledger_title:0 "Archive the Records"
 chr_eastern_chronicle_military_title:0 "Chronicle of Military Victories"
 chr_eastern_chronicle_summary_desc:0 "The eastern chronicles of our realm have been compiled, documenting our interactions with the frontier powers. Our chosen path has shaped the character of these border relationships."
 chr_eastern_frontier_chronicle:0 "Eastern Frontier Chronicle"
 chr_eastern_march_command:0 "Eastern March Command"
 chr_ended_tatar_yoke:0 "Tatar Yoke Removed"
 chr_enterprise_academy_bonus:0 "Akademia Circuits"
 chr_enterprise_buda:0 "Buda Kilns"
 chr_enterprise_guta:0 "Glassworks"
 chr_enterprise_mlyn:0 "Mills and Breweries"
 chr_enterprise_selitra:0 "Saltpetre Works"
 chr_establish_enterprise_desc:0 "Invest diplo capital to specialise a sloboda into a lasting mill, glassworks, buda, or saltpetre works."
 chr_establish_enterprise_title:0 "Establish an Enterprise"
 chr_establish_high_seas_navy_desc:0 "Invest in galleys and heavy ships so our merchants and envoys sail safely from Ochakiv to the Bosporus."
 chr_establish_high_seas_navy_title:0 "Launch a Black Sea Fleet"
 chr_exchange_integration_cooldown:0 "Recent Exchange Integration"
 chr_expand_country_mission_desc:0 "Integrate new towns with fair levies and careful registers so the next generation inherits a resilient realm."
 chr_expand_country_mission_title:0 "Grow the Hetman's Lands"
 chr_expand_sloboda_farmlands_desc:0 "Invest diplomacy and silver into modular sloboda farming communes, upgrading grain output and labour reserves across the Left Bank."
 chr_expand_sloboda_farmlands_title:0 "Expand Sloboda Farmsteads"
 chr_flavor.1.a:0 "Raise the Baturyn garrison"
 chr_flavor.1.b:0 "Placate the regimental starshyna"
 chr_flavor.1.d:0 "The wars of the Ruina have turned Chernihiv into a prize fought over by Warsaw, Moscow, and the Khanate. Sotnias drift home to defend their kin, while the regimental starshyna debate which hetman to obey. We must either harden our strongholds or buy time with concessions before the Left Bank collapses."
 chr_flavor.1.t:0 "Border Regiments in Disarray"
 chr_flavor.10.a:0 "Renew the Lithuanian surety"
 chr_flavor.10.b:0 "Drill with Muscovite gunsmiths"
 chr_flavor.10.c:0 "Buy the steppe's silence"
 chr_flavor.10.d:0 "Envoys from Kraków, Moscow, and the Crimea all demand our allegiance. Choosing one protector may steady the frontier—yet invites the ire of the others."
 chr_flavor.10.t:0 "Guardians of the Border"
 chr_flavor.101.a:0 "Canonise Doroshenko's March of Steel."
 chr_flavor.101.b:0 "Canonise the Council of Korsun."
 chr_flavor.101.d:0 "Petro Doroshenko wrestled with ruin and invasion alike. The rada now debates whether to canonise him as a marchlord who welds the regiments together or as a diplomat whose councils kept rival crowns at bay."
 chr_flavor.101.t:0 "Council at Chyhyryn"
 chr_flavor.102.a:0 "Raise the General Chancery."
 chr_flavor.102.b:0 "Proclaim a Chernihiv Patriarchate."
 chr_flavor.102.d:0 "Ivan Samoylovych proved the hetmanate could be more than a war camp. Do we elevate his reforming chancery or found an independent metropolitan throne to anchor our soul?"
 chr_flavor.102.t:0 "Legacy of the Hetmanate"
 chr_flavor.103.a:0 "Celebrate Mazepa's Akademia."
 chr_flavor.103.b:0 "Seal Mazepa's State Treasury."
 chr_flavor.103.d:0 "Ivan Mazepa's name crowns both salons and treasuries. We may enshrine his akademia to spread learning or his fiscal order to fund mills and manufactories."
 chr_flavor.103.t:0 "Mazepa's Golden Age"
 chr_flavor.11.a:0 "Cut new canals and levees"
 chr_flavor.11.b:0 "Let the marsh be our moat"
 chr_flavor.11.c:0 "Broker Polissian accords"
 chr_flavor.11.d:0 "The marshes of Eastern Polissia shelter rebels and smugglers, yet also hide glittering peatlands. Shall we drain the bogs, let the waters guard us, or barter influence among our neighbors?"
 chr_flavor.11.t:0 "Policies for Eastern Polissia"
 chr_flavor.12.a:0 "Seat the privileged benches once more"
 chr_flavor.12.b:0 "Impose uniform regimental statutes"
 chr_flavor.12.d:0 "Starodub's magistrates petition for the renewal of their Magdeburg bench, promising steady tolls and a loyal courthouse if their liberties are restored. The starshyna instead urge us to standardise regimental statutes and leave no room for old-boy privilege."
 chr_flavor.12.t:0 "Starodub's Privileged Bench"
 chr_flavor.13.a:0 "Raise picquets to ward the river"
 chr_flavor.13.b:0 "Drill a corps of Seim dragoons"
 chr_flavor.13.d:0 "Reports of Tatar probes and banditry along the Seim river grow bolder. Veteran sotnias advocate rebuilding the old picquet lines and outfitting frontier blockhouses, while younger officers urge us to form a corps of dragoons to sweep the steppe."
 chr_flavor.13.t:0 "Outposts along the Seim"
 chr_flavor.14.a:0 "Fund Baranovych's printing houses"
 chr_flavor.14.b:0 "Send the silver to drill the border sotnias"
 chr_flavor.14.d:0 "Archbishop Lazar Baranovych has reopened the Starodub press, promising prayer books, polemics, and almanacs that bind the Seim march to Kyiv. Each investment locks our press policy for §Y20 years§!."
 chr_flavor.14.t:0 "Baranovych's Starodub Press"
 chr_flavor.15.a:0 "Endorse Lyzohub's regimental codex"
 chr_flavor.15.b:0 "Keep the coffers under hetman seals"
 chr_flavor.15.d:0 "Colonel Yakiv Lyzohub proposes a full audit of the Chernihiv regiments, harmonising sotnia statutes and reserving stores for rapid musters. The chosen policy cannot be revisited for §Y20 years§!."
 chr_flavor.15.t:0 "Yakiv Lyzohub's Muster"
 chr_flavor.16.a:0 "Ride with Mazepa and the Swedes"
 chr_flavor.16.b:0 "Reaffirm loyalty to the Tsar"
 chr_flavor.16.d:0 "Envoys whisper that Hetman Mazepa weighs an alliance with Charles XII. Our stance toward Sweden or the Tsar will remain locked for §Y20 years§!."
 chr_flavor.16.t:0 "Mazepa's Swedish Overture"
 chr_flavor.17.a:0 "Grant free homesteads to Seim settlers"
 chr_flavor.17.b:0 "Keep the land under starost authority"
 chr_flavor.17.d:0 "Settlers from the Dnieper and Desna offer to clear homesteads along the Seim if granted tax freedoms and Cossack rights. Whichever path we endorse cannot be changed for §Y20 years§!."
 chr_flavor.17.t:0 "Homesteads of the Seim Sloboda"
 chr_flavor.18.a:0 "Seal compacts with the Commonwealth"
 chr_flavor.18.b:0 "Drill beside Muscovy's auxiliaries"
 chr_flavor.18.c:0 "Ride under Crimean protection"
 chr_flavor.18.d:0 "The Ruina shattered our councils, yet three offers now sit on the hetman's table. Polish envoys promise joint dietines, Muscovite voivodes dispatch fortified advisors, and Crimean mirzas guarantee trade convoys. Each path would anchor Chernihiv's recovery—but binds us to their patronage."
 chr_flavor.18.t:0 "Settling the Ruina"
 chr_flavor.2.a:0 "Fund the Chernihiv Collegium"
 chr_flavor.2.b:0 "Seat the regimental council"
 chr_flavor.2.d:0 "The worst of the Ruina has passed. The regiments answer the same command, the Collegium writes new rolls, and the markets breathe again. We must decide who will guide the reconstruction of the Left Bank."
 chr_flavor.2.t:0 "Order Returns to Chernihiv"
 chr_flavor.201.a:0 "Charter mills and breweries."
 chr_flavor.201.b:0 "Raise a glassworks."
 chr_flavor.201.c:0 "Authorise a buda kiln."
 chr_flavor.201.d:0 "The frontier sloboda is ready for specialisation. We can channel settlers into mills and breweries, glassworks, budas, or saltpetre works depending on our long-term needs."
 chr_flavor.201.opt_d:0 "Invest in saltpetre works."
 chr_flavor.201.t:0 "Found an Enterprise"
 chr_flavor.3.a:0 "Drag the regiments back into line"
 chr_flavor.3.b:0 "Let the magistrates settle the levies"
 chr_flavor.3.d:0 "Reports arrive that sotnias shirk patrols and magistrates bicker over levies. Unless we intervene, these quarrels will explode into revolt."
 chr_flavor.3.t:0 "Starodub Drums Fall Silent"
 chr_flavor.30.a:0 "Commit the chronicle to the regimental archives."
 chr_flavor.30.d:0 "Sivershchyna's independence was carved from the crumbling Golden Horde and hesitant Gediminid princes in the mid-fifteenth century. Chernihiv bound Desna monasteries, Polissian watch posts, and Dnieper ferries into a frontier that bargained with Vilnius, Moscow, and the steppe. Through the sixteenth century the starshyna stamped sloboda charters on new grain colonies, bartering liberties in every parliament they could reach. The Ruina forged a Hetmanate that learned to balance Muscovite envoys, Ottoman raids, and restless Cossack regiments while rebuilding Polissian bastions as fortified monasteries. Eighteenth-century compromises opened grain corridors from Hlukhiv to the Black Sea and paired caravan guilds with collegiate hetmans. By the early nineteenth century the Chernihiv Commonwealth stood as broker of eastern Polissia, modernising at its own pace while defending the liberties of the Sivershchyna."
 chr_flavor.30.t:0 "Chronicle of the Left Bank"
 chr_flavor.34.a:0 "Appease the regimental boards."
 chr_flavor.34.b:0 "Empower the grain syndics."
 chr_flavor.34.c:0 "Ask the nobles to mediate."
 chr_flavor.34.d:0 "The nobles cite their Seimski Statuty, burgher syndics demand market precedence, and the cossack collegium insists on frontier stipends. The hetman must steer loyalty without breaking the pact."
 chr_flavor.34.t:0 "Balancing the Starshyna Privileges"
 chr_flavor.35.a:0 "Bind the marches in ink"
 chr_flavor.35.d:0 "Envoys from the Seim and Sloboda Marches arrive with saddle-bags of reports, petitions, and folk tales. Compiling them into a single chronicle would capture the stories of border captains, grain traders, and shepherd settlers whose vigilance keeps the Polish Crown and the Tsar from swallowing our marches whole."
 chr_flavor.35.t:0 "Western Frontier Chronicle"
 chr_flavor.36.a:0 "Extend the joint patrols"
 chr_flavor.36.b:0 "Expose their breaches"
 chr_flavor.36.c:0 "Ease the standoff"
 chr_flavor.36.d:0 "Our frontier commissioners convene with scouts and hetman's envoys to judge how the border compacts fare. Some captains insist the joint patrols still ride in step, while others warn our partner drifts toward suspicious musters. Do we extend, recalibrate, or dissolve the agreement?"
 chr_flavor.36.opt_d:0 "Stand down the patrols"
 chr_flavor.36.t:0 "Review the Border Compacts"
 chr_flavor.37.a:0 "Publish the treaties and ledgers"
 chr_flavor.37.b:0 "Drill the march regiments"
 chr_flavor.37.c:0 "Catalogue the grain wards"
 chr_flavor.37.d:0 "From the Desna palisades to the sloboda mills around Kharkiv, scribes assemble a chronicle that traces four centuries of an imagined Sivershchyna. It begins with fifteenth-century veche councils breaking the Horde's tribute, knitting frontier monasteries to Sloboda watch posts. Sixteenth-century colonists planted paired farm communes and sotnia barracks that bargained with Vilnius and Moscow while trading salt, pitch, and grain down the Donets. The long Ruina taught seventeenth-century hetmans to broker guarantees from Warsaw, the Tsar, and the Crimean Khanate while rebuilding fort-monasteries and chartering Kharkiv's markets. Eighteenth-century reforms spun grain convoys toward the Dnieper and entrenched collegiate starshyna who could calculate both tithes and troop rotations. In the nineteenth century, river steamers, rail spurs, and cooperative guilds bound Sivershchyna and eastern Sloboda into a grain commonwealth that balanced imperial statutes with local liberties."
 chr_flavor.37.t:0 "Eastern Frontier Annals"
 chr_flavor.38.a:0 "Lean on our diplomatic partners"
 chr_flavor.38.b:0 "Brace the marches for war"
 chr_flavor.38.d:0 "The border compacts are signed, yet the Seim again debates whether to entwine our fate with allied patrols or fortify the marches for a lonelier struggle. Hetman envoys favour the chancery networks that keep treaties alive, while war captains insist that walls and watchfires must speak louder than parchment."
 chr_flavor.38.t:0 "Set Our Frontier Doctrine"
 chr_flavor.39.a:0 "Dispatch guild accountants to keep the tallies honest."
 chr_flavor.39.d:0 "Sejmik commissioners have returned from Warsaw with stamped copies of the statutes aligning Chernihiv's charters to the Commonwealth's procedures. Our envoys insist that the Hetman's petitions now move through the diets without delay, provided we keep drafting memoranda and funding the scribes."
 chr_flavor.39.t:0 "Sejmik Statutes Ratified"
 chr_flavor.40.a:0 "Publish the statute and drill the sotnias accordingly."
 chr_flavor.40.d:0 "Inspectors from the Belgorod line paced every palisade from Hlukhiv to the Don, praising our rebuilt blockhouses and the discipline of our sotnias. Their report recommends longer rotations for forward garrisons and codified drills so Muscovite auxiliaries can slot seamlessly beside our banners."
 chr_flavor.40.t:0 "Belgorod Surveyors' Verdict"
 chr_flavor.41.a:0 "Finance the mathematicians' chairs."
 chr_flavor.41.b:0 "Fund bursaries for merchant sons."
 chr_flavor.41.d:0 "Scholars from Kyiv, Kraków, and Vilnius gather in Hlukhiv to bless lecture halls that will shape hetman secretaries and artillery officers alike. The curriculum mixes scholastic rigor with frontier pragmatism; now we must decide which patronage to emphasise first."
 chr_flavor.41.t:0 "Left-Bank Collegium Inaugurated"
 chr_flavor.42.a:0 "Restore the Orthodox metropolia."
 chr_flavor.42.b:0 "Codify the metropolitan statute."
 chr_flavor.42.c:0 "Adjourn the synod for now."
 chr_flavor.42.d:0 "Kyiv's monasteries and brotherhood schools have reconvened after the Ruina. Archimandrites petition to restore the Orthodox hierarchy under our banner, while legalists and foreign patrons urge a codified metropolitan statute that keeps our chancery in step with Latin ledgers. The Hetman must decide whose hands will steady the Kyiv cathedra."
 chr_flavor.42.t:0 "Synod of the Kyiv Metropolia"
 chr_flavor.44.a:0 "Confirm Lavra endowments."
 chr_flavor.44.b:0 "Assign the tithes to the regiments."
 chr_flavor.44.d:0 "With the metropolia restored, abbots from the Kyiv Pechersk Lavra and Kyiv's brotherhood schools press for new charters. Some want permanent endowments that swell the coffers of monasteries and fund cathedral repairs; others argue those tithes should ready the regiments who guard the altars."
 chr_flavor.44.t:0 "Charters of the Pechersk Chapter"
 chr_flavor.45.a:0 "Seat Jesuit-trained auditors."
 chr_flavor.45.b:0 "Empower Ruthenian fraternities."
 chr_flavor.45.d:0 "The metropolitan statute passes through parliament, but its spirit remains up for debate. Jesuit-trained auditors promise to synchronise our colleges with European courts, while Ruthenian fraternities intend to keep the ledgers bilingual and the parishes loyal to our laws."
 chr_flavor.45.t:0 "Metropolitan Statute Ratified"
 chr_flavor_42_delay_tt:0 "Gain §G50§! Administrative Power but lose §R5§! Prestige as the debate dissolves."
 chr_flavor_42_orthodox_tt:0 "Gain permanent §YKyiv Metropolia§!, +§G10§! Prestige, +§G0.10§! Patriarch Authority, and a §Y10-year§! border branch cooldown."
 chr_flavor_42_statute_tt:0 "Gain permanent §YMetropolitan Statute Patronage§!, +§G75§! Government Reform Progress, and +§G1§! Innovativeness while the border staff reorganises for §Y10 years§!."
 chr_flavor_44_cossack_tt:0 "Gain §G50§! Military Power, +§G0.02§! Army Professionalism, and §G5,000§! manpower."
 chr_flavor_44_monastic_tt:0 "Kyiv gains §G+1§! Base Tax, and we receive +§G15§! Prestige and +§G0.05§! Patriarch Authority."
 chr_flavor_45_collegium_tt:0 "Kyiv gains §G+1§! Base Production, and we gain +§G50§! Government Reform Progress, +§G1§! Innovativeness, and §G50§! Diplomatic Power."
 chr_flavor_45_ledgers_tt:0 "Gain §G50§! Governing Capacity, +§G1§! Tolerance of Heretics, §G50§! Administrative Power, and §G10§! Prestige."
 chr_fortified_monastery_lvl1:0 "Fortified Monastery"
 chr_fortified_monastery_lvl1_desc:0 "Timber palisades and refectory arsenals let the cloister double as a rally point for border watches."
 chr_fortified_monastery_lvl2:0 "Citadel Monastery"
 chr_fortified_monastery_lvl2_desc:0 "Stone curtain walls, bastions, and granaries make this monastery a genuine fortress anchoring the Polissian line."
 chr_frontier_garrisons:0 "Frontier March Command"
 chr_frontier_garrisons_desc:0 "Expand forts from Starodub to the Sloboda marches and staff them with drilled professionals so raids falter before reaching our mills. Completing this mission unlocks border compact events with a §Y20-year§! diplomatic cooldown."
 chr_frontier_garrisons_forts_tt:0 "Own at least two fortified provinces in Sloboda Ukraine, Lower Don, Novhorod-Siverskyi or Starodub."
 chr_frontier_garrisons_title:0 "Harden the Frontier Garrisons"
 chr_frontier_sloboda:0 "Frontier Sloboda"
 chr_frontier_sloboda_march_bonus:0 "March Drills"
 chr_grain_cartel_charters:0 "Grain Cartel Charters"
 chr_grain_cartel_charters_desc:0 "License syndicates that pool workshops, storehouses, and contracts across the Dnieper so our merchants negotiate from a united ledger."
 chr_grain_cartel_charters_title:0 "Grant Grain Cartel Charters"
 chr_grain_cartel_ledgers:0 "Cartel Ledgers"
 chr_grain_cartel_marketplaces_tt:0 "Own at least §Y3§! marketplaces in provinces within the §YEast§! or §YWest Dnieper§! areas."
 chr_grain_cartel_workshops_tt:0 "Own at least §Y4§! workshops in provinces within the §YEast§! or §YWest Dnieper§! areas."
 chr_grain_consortium:0 "Grain Consortium"
 chr_grain_corridors_desc:0 "Survey every black-soil strip and river pier so guarded grain convoys can sprint from Sloboda farms to Dnieper barges without delay."
 chr_grain_corridors_title:0 "Chart Grain Corridors"
 chr_grain_depot_province:0 "Regional Grain Depot"
 chr_grain_directorate_province:0 "Left-Bank Grain Combine"
 chr_grain_directorate_reform:0 "Left-Bank Grain Directorate"
 chr_grain_directorate_reform_desc:0 "Mission charters birthed a bureaucratic grain directorate that stations hetman inspectors in every granary, rewarding loyal guilds while flooding depots with surplus."
 chr_grain_directorate_reform_tt:0 "All owned grain provinces gain the hidden modifier §YLeft-Bank Grain Combine§! (+10% goods produced, +15% local production efficiency)."
 chr_grain_silo_province:0 "Steel-Rigged Silo Complex"
 chr_hetman_coffers:0 "Hetman's Counting House"
 chr_high_income_mission_desc:0 "Reform tolls, leases, and estates so crown revenue grows without crushing the households we defend."
 chr_high_income_mission_title:0 "Balance the Ledgers"
 chr_identity_branch_placeholder_tt:0 "Resolve §YThe Ruina Settled§! event and pick a guardian power to unlock one of the three bespoke mission lines."
