 vol_center_of_learning:0 "Ostroh Slavic-Greek-Latin Academy"
 vol_center_of_learning_desc:0 "The Slavic-Greek-Latin Academy of Ostroh gathers scholars, translators, and printers across Eastern Europe."
 VOL_choose_development_path_desc:0 "With the realm at peace and grown to 120 development, summon the council to choose our constitutional or diplomatic course."
 VOL_choose_development_path_title:0 "Choose Our Path"
 VOL_choose_path_tooltip:0 "Choose a path for future reforms."
 vol_chumak_convoy_charters:0 "Chumak Convoy Charters"
 vol_chumak_market_route_tt:0 "Chumak commercial route: maintain a merchant with at least 15% trade share in Crimea, secure an alliance or 100 opinion with Moldavia or the holder of Budjak or Bendery, keep Podillia peaceful and undevastated, hold a fortress along the southern approaches, and field 6 cavalry regiments for caravan escorts."
 VOL_chumak_modifier:0 "Galician Salt Markets"
 VOL_church_desc:0 "Every anointed of God is responsible for their subjects' piety. Religious structures are built with eye-catching architecture. Churches, like the rest of the city, are built with the same care and attention to detail."
 VOL_church_relations_desc:0 "Maintain at least 80% religious unity and a loyal clergy to steady parish life across the principality."
 VOL_church_relations_title:0 "Church Relations"
 vol_church_support:0 "Church Support"
 vol_church_support_desc:0 "The Church strongly supports our reforms and policies."
 VOL_church_title:0 "Churches"
 vol_confessional_academy:0 "Academy of Confessional Harmony"
 vol_confessional_dialogue:0 "Confessional Dialogue"
 vol_confessional_reform:0 "Confessional Compromise"
 vol_confessional_reform_desc:0 "After years of deliberation, we have reached a confessional settlement that balances Orthodox tradition with Uniate and Roman Catholic influence, granting tolerance and stability."
 VOL_conquer_bilorus_desc:0 "Consolidate administration across the northern lands after recognising Belarusian culture and securing the approaches to Smolensk. Completing this stage grants 50 administrative power, 75 diplomatic power and 10 prestige."
 VOL_conquer_bilorus_title:0 "Take Control of Belarus"
 VOL_conquer_east_dniepr_desc:0 "Securing the Left Bank brings the middle Dnieper fully under our rule, expanding our revenues and opening the road toward Chernihiv and the Sloboda frontier."
 VOL_conquer_east_dniepr_title:0 "Seizing the Left Bank"
 VOL_conquer_malopolska_desc:0 "Our old border was further west. If Poland dared to take our lands when we were weak, we now have the right to do the same and push the border even further west."
 VOL_conquer_malopolska_title:0 "Expansion into Poland"
 VOL_conquer_moldavia_desc:0 "Chumak salt-and-fish caravans bind Ruthenian fairs to the Black Sea ports. We may either bring Moldavia directly under our banner, or reopen the southern trade through market share in Crimea, agreements with Moldavia or the Dniester crossings, and escorted, peaceful Podillian roads."
 VOL_conquer_moldavia_title:0 "Resuming the Chumak Way"
 VOL_conquer_sloboda_desc:0 "The Ruthenian culture's geographical boundary is the Sloboda, a region whose name also means 'freedom.' Expanding our control over this area will secure our influence over the region."
 VOL_conquer_sloboda_title:0 "Ruthenian Frontier"
 VOL_conquer_smolensk_desc:0 "Smolensk is a crucial inland trade center and a key control point for Kyiv. Therefore, it must be conquered to strengthen our hold over the region."
 VOL_conquer_smolensk_title:0 "Conquest of Smolensk"
 VOL_conquer_west_dniepr_desc:0 "Develop Kyiv as a major centre of the Dnieper lands while retaining the freedom to keep our court in Volhynia."
 VOL_conquer_west_dniepr_title:0 "Conquest of Kyiv"
 VOL_conquer_zaporozhia_desc:0 "Securing Zaporozhia and the Yedisan steppe opens the lower Dnieper and Black Sea approaches to our banners."
 VOL_conquer_zaporozhia_title:0 "Conquer Zaporozhia"
 VOL_constitutional_compact_desc:0 "Enact a constitutional compact grounded in administrative scholarship, defining the rights of the crown and the diet alike."
 VOL_constitutional_compact_title:0 "Constitutional Compact"
 vol_constitutional_coronation:0 "Constitutional Coronation"
 vol_constitutional_coronation_desc:0 "We have proclaimed an empire based on constitutional principles."
 vol_constitutional_empire_tooltip:0 "Unlocks the constitutional empire path."
 vol_constitutional_focus:0 "Constitutional Focus"
 vol_constitutional_focus_desc:0 "We are pursuing constitutional reforms to strengthen our government."
 vol_constitutional_framework:0 "Constitutional Framework"
 vol_constitutional_framework_desc:0 "A framework of laws defines the relationship between crown and nobility."
 vol_constitutional_path_tooltip:0 "Unlocks the constitutional path."
 VOL_constitutional_ready:0 "Constitutional reforms are ready to be implemented."
 vol_constitutional_ready_req_tt:0 "The constitutional framework must be prepared."
 vol_constitutional_triumph:0 "Constitutional Triumph"
 vol_constitutional_triumph_desc:0 "Our constitutional system has made us a model for all of Europe."
 VOL_control_danube:0 "Black Sea Market Access"
 VOL_control_smolensk:0 "Smolensk under our Control"
