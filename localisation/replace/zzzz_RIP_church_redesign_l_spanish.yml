 rip_church_gui_slot_state_tt:0 "One synod institution at a time, lasting 10 years. Opening the menu is free."
 rip_church_gui_slot_used:0 "Synod slot\n§YIn use§!"
 rip_church_gui_slot_used_tt:0 "Local synod institution: §Y1 / 1§!"
 rip_church_gui_sponsor:0 "Sponsor the Union"
 rip_church_gui_sponsor_tt:0 "From 1596, pay §Y100 ADM, 100 DIP and one year of income§! to support the Union while remaining Catholic. Requires peace, stability +1, PAP without war, and a qualifying Orthodox core parish. One eligible parish becomes Greek Catholic. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
