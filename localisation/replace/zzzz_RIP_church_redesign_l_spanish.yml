 rip_church_gui_rite_latin:0 "Catholic"
 rip_church_gui_rite_latin_tt:0 "Catholic"
 rip_church_gui_shared_status:0 "Papal opinion: [Root.GetChurchPapalOpinion] · Hierarchical Capacity: [Root.GetChurchAuthorityReadout]"
 rip_church_gui_shared_status_tt:0 "§YPapal opinion§!: how the Papal State regards us, as of your last visit to the Curia tab. Gifts and deputations raise it.\n§YHierarchical Capacity§!: the strength of our Eastern hierarchy, shown in the religion window. It pays for icons, synods and parish visits."
