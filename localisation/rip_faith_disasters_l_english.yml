 # ============================================================
 # THE ICONOSTASIS - the four-slot icon system
 # decisions/RIP_OrthodoxIcons.txt, common/scripted_effects/rip_ro_icon_effects.txt
 # The lighting decisions reuse the rip_ro_icon_*_title keys already written for
 # them in rip_faith_mechanics_l_english.yml; only the taking-down half is new.
 # ============================================================

 rip_ro_icon_slot_free_tt:0 "There is a lamp free on the iconostasis. The patriarch's authority decides how many icons may stand at once: §Y1§! at any authority, §Y2§! at §Y30%§!, §Y3§! at §Y55%§!, §Y4§! at §Y80%§!"
 rip_ro_icon_light_cost_tt:0 "The Sobor has §Y15§! fervour to give. Lighting spends it outright, and every icon left standing is paid for again each two years - §Y3§! for one, §Y8§! for two, §Y14§! for three, §Y20§! for four. When the fervour will not stretch, a lamp goes out"

 rip_ro_douse_michael_title:0 "Take Down the Icon of the Archangel"
 rip_ro_douse_michael_desc:0 "The regiments have carried Nevsky far enough. He comes off the iconostasis, the lamp beneath him goes out, and the oil goes to something else."
 rip_ro_douse_eleusa_title:0 "Take Down the Icon of Tenderness"
 rip_ro_douse_eleusa_desc:0 "The Vladimir Mother of God goes back to the treasury. The processions stop, and the districts that have been hardest handled are left to the governors."
 rip_ro_douse_pancreator_title:0 "Take Down the Icon of the Pantocrator"
 rip_ro_douse_pancreator_desc:0 "Sergius comes down. The abbots go back to their own foundations and the surveying of new ground becomes the chancery's business again."
 rip_ro_douse_nicholas_title:0 "Take Down the Icon of Saint Nicholas"
 rip_ro_douse_nicholas_desc:0 "The wonderworker comes off the wall. Envoys will have to argue on the strength of what they are offering."
 rip_ro_douse_climacus_title:0 "Take Down the Icon of the Ladder"
 rip_ro_douse_climacus_desc:0 "The Ladder leaves the scriptoria. The schools keep their books; they lose the argument that learning them is an inheritance rather than a theft."

 # ============================================================
 # THE RASKOL - common/disasters/rip_faith_disasters.txt
 # ============================================================

 rip_ro_raskol:0 "The Raskol"
 rip_ro_raskol_title:0 "The Raskol"
 rip_ro_raskol_desc:0 "The church has finished gathering and begun governing. A patriarch who is obeyed, an iconostasis standing in every parish, and a printing house at Moscow deciding which of two service books is the correct one. The parishes that have used the other book for three hundred years are not going to be told."
 rip_ro_raskol_end_tt:0 "The patriarch's authority has fallen below §Y60%§!, or fewer than §Y2§! icons still stand. The church has stopped deciding for everyone"

 rip_faith_disaster.1.t:0 "The Correction of the Books"
 rip_faith_disaster.1.d:0 "The printers at Moscow have set the service books against their Greek exemplars and found the Muscovite ones wanting in a hundred places: the number of fingers for the cross, the number of alleluias, the spelling of the Saviour's name. The patriarch has ordered the corrected books into every parish and the old ones off the lecterns.\n\nThe parishes are asking by what authority a printing house tells them their fathers prayed wrongly. It is not a question the patriarch can answer without answering it for everything else as well."
 rip_faith_disaster.1.a:0 "The corrected books, and no others."
 rip_faith_disaster.1.b:0 "Let the old rite stand where it stands."

 rip_faith_disaster.2.t:0 "The Books Agreed"
 rip_faith_disaster.2.d:0 "A generation of it, and the argument has gone out of the parishes rather than been won. The corrected books are on most lecterns, the old ones are on some, and the sees have stopped sending men to find out which. What is left is a church that has learned the size of what it can order and has stopped ordering past it."
 rip_faith_disaster.2.a:0 "It will not be asked again."

 rip_faith_disaster.3.t:0 "The House That Would Not Burn Its Books"
 rip_faith_disaster.3.d:0 "A monastery of the north has kept its old psalters and gone on printing them. The abbot writes that his house had the books before there was a patriarch to correct them, and that he will surrender them to a council and to nothing else.\n\nHe is not wrong about the council. He is also two days' ride from anywhere, with four hundred brothers and the sympathy of every village between here and the sea."
 rip_faith_disaster.3.a:0 "Send the archimandrite. Take the press."
 rip_faith_disaster.3.b:0 "Leave the house alone."

 rip_faith_disaster.4.t:0 "Into the Forests"
 rip_faith_disaster.4.d:0 "A whole congregation has gone east with its priest, its books and its livestock, and settled where the surveyors have not been. They are not in rebellion and they are not hiding; they have simply put distance between themselves and the corrected books, and they intend to keep putting it there.\n\nThe district reports the fields left standing and the tax rolls short."
 rip_faith_disaster.4.a:0 "Bring them back."
 rip_faith_disaster.4.b:0 "Let the forest have them."

 # ============================================================
 # THE BROTHERHOODS - common/disasters/rip_faith_disasters.txt
 # ============================================================

 rip_uc_brotherhoods:0 "Revolt of the Brotherhoods"
 rip_uc_brotherhoods_title:0 "Revolt of the Brotherhoods"
 rip_uc_brotherhoods_desc:0 "The union has stopped spreading and the country has not come with it. The stauropegial brotherhoods hold the presses, the schools and the hospitals, they answer to Constantinople and to nobody nearer, and every parish the See has not taken is a parish they are speaking in."
 rip_uc_brotherhoods_end_tt:0 "Religious unity has reached §Y60%§!. The realm has stopped arguing about whose obedience it is in"

 rip_faith_disaster.5.t:0 "The Brotherhoods Refuse"
 rip_faith_disaster.5.d:0 "The confraternities of Lviv and Vilnius were chartered from Constantinople and hold their charters still. They are laymen - tanners, printers, merchants with a school and a hospital apiece - and they have been electing their own preachers and correcting their own bishops since before the Union was signed.\n\nThey write that they will take communion from a metropolitan in Rome's obedience when a council of the whole East tells them to, and that they have not heard of one."
 rip_faith_disaster.5.a:0 "The see answers them from Rome's authority."
 rip_faith_disaster.5.b:0 "Let them keep their schools and their presses."

 rip_faith_disaster.6.t:0 "The Union Kept"
 rip_faith_disaster.6.d:0 "The men who signed at Brest are dead and so are the men who refused. What is left is a generation baptised into the union, taught in its schools and married by its priests, who would be as puzzled to be told they are Latins as to be told they are Greeks. The quarrel has not been settled. It has been outlived."
 rip_faith_disaster.6.a:0 "The rite is ours and so is the obedience."

 rip_faith_disaster.7.t:0 "The School on the Square"
 rip_faith_disaster.7.d:0 "The brotherhood school teaches Greek, Slavonic and Latin, takes the sons of tanners as readily as the sons of the starshyna, and turns out better theologians than the metropolitanate does. Its rector has printed a defence of the eastern rite that names the See and does not flatter it.\n\nHalf the men who would argue back learned to argue there."
 rip_faith_disaster.7.a:0 "Close the school."
 rip_faith_disaster.7.b:0 "Endow a rival of our own rite."

 rip_faith_disaster.8.t:0 "A Visitor from Rome"
 rip_faith_disaster.8.d:0 "A visitor has come with letters, an interest in our seminaries and a list of questions about the calendar. He is courteous and he is not going home early. Whatever he writes when he does go home will be read by the men who decide how much weight a Ruthenian metropolitan's letters carry.\n\nHis household expects to be lodged at the see's expense."
 rip_faith_disaster.8.a:0 "Receive him, and pay for his stay."
 rip_faith_disaster.8.b:0 "The metropolitanate settles its own houses."

 # ============================================================
 # What surviving one leaves behind
 # common/event_modifiers/RIP_faith_modifiers.txt
 # ============================================================

 rip_ro_books_settled:0 "The Books Settled"
 desc_rip_ro_books_settled:0 "The service books argued out and finally agreed on. It cost a generation, and it is the last time anybody asks."
 rip_uc_brotherhoods_tolerated:0 "The Brotherhoods Tolerated"
 desc_rip_uc_brotherhoods_tolerated:0 "The see gave up closing their schools and their presses. The quarrel goes quiet, the schools stay, and they are good ones."
 rip_uc_union_accepted:0 "The Union Accepted"
 desc_rip_uc_union_accepted:0 "Two generations on, the union has stopped being an imposition and become the church people were baptised in."

