 rip_church_icon_war_steppe:0 "Intercession against the steppe"
 rip_church_mission_network:0 "Missionary Network"
 rip_church_mission_network_desc:0 "§YMuscovite missionary network§!\n§Y1. Fund:§! Religion -> Policies -> Choose trade node. A node costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month. Limit: §Y1 node§! (§Y2§! after renouncing communion).\n§Y2. Select:§! Choose this trade policy in the funded node. The requirements below must stay fulfilled.\n§YTargets:§! Neighbouring settled provinces along your capital-connected core parishes. Protected rites, active missionaries, religious centres, religious zeal and Rome are excluded. Independent Orthodox states are protected until you renounce communion. Conversion is gradual."
 rip_church_native_authority_heading:0 "$CURRENT_PATRIARCH_AUTHORITY$"
 rip_church_native_authority_tooltip:0 "$PATRIARCH_DESCRIPTION$"
 rip_church_node_courtyards:0 "Monastic trade courtyards"
 rip_church_nodes.1.d:0 "§YFervor§! [Root.GetChurchROFervor] / 100, net [Root.GetChurchRONet] a month. Funded nodes: [Root.GetChurchRONodes] / [Root.GetChurchRONodeLimit].\n\nA funded node plants monastic trade courtyards in a trade node. It costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month; every parish of yours there that has a temple or cathedral gains §G+20% trade power§! and §G+1% missionary strength§!. Afterwards choose the Missionary Network trade policy in that node, in the Trade window, to convert neighbouring provinces gradually.\n\nOnly nodes that qualify are listed: a merchant, 50% trade power, a connected parish with a temple or cathedral, and a province to convert. A funded node can be closed here; its 10 Fervor are not refunded."
 rip_church_nodes.1.t:0 "Fund mission nodes"
 rip_church_nodes_button:0 "Choose trade node"
 rip_church_nodes_button_tt:0 "[Root.GetChurchRONodeHint]\nOpens the trade nodes that qualify now and those already funded, each with its price and return. Opening the list costs nothing."
