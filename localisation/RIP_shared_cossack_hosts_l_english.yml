 sloboda_legacy_military:0 "Legacy of Frontier Arms"
 desc_sloboda_legacy_military:0 "The state institutionalizes Sloboda military traditions as a core pillar of power."
 sloboda_legacy_urban_economic:0 "Legacy of Urban Grain Commerce"
