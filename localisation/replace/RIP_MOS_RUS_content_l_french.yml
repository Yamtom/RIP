 rip_ro_unbroken_communion:0 "Unbroken Communion"
 rip_tot_backed_the_pretender:0 "Outfitted a Pretender Against Us"
 rip_tot_deulino_terms:0 "The Terms of Deulino"
 rip_tot_eastern_campaign:0 "The Eastern Campaigns"
 rip_tot_pretender_venture:0 "A Claimant of Our Own"
 rip_tot_the_register_remembers:0 "The Register Remembers"
 russian_backed_hetman:0 "Russian-Backed Hetman"
 russian_colonial_administration:0 "Frontier Settlement Administration"
 russian_monastery_established:0 "Russian Monastery Established"
 russian_orthodox:0 "Muscovite Orthodox"
 russian_orthodox.10.a:0 "Fund a mission in Constantinople."
 russian_orthodox.10.b:0 "Practice religious tolerance"
 russian_orthodox.10.d:0 "Constantinople, the Second Rome, is in our hands. The court clergy call it the fulfillment of the Third Rome, and the chancery will say so in every letter it writes. The Greek clergy and the other courts may read it differently. Shall we restore Orthodox rule in this ancient city and make it a jewel of our empire?"
 russian_orthodox.10.t:0 "The Conquest of Constantinople"
 russian_orthodox.11.a:0 "Establish Imperial Church"
 russian_orthodox.11.b:0 "Maintain traditional structure"
 russian_orthodox.11.d:0 "Our empire has grown mighty. The Orthodox Church should be reorganized as an imperial institution, serving the state's interests while spreading true faith. This would create unprecedented unity of purpose."
 russian_orthodox.11.t:0 "Imperial Orthodox Church"
 russian_orthodox.12.a:0 "Establish missions and monasteries"
 russian_orthodox.12.b:0 "Focus resources elsewhere"
 russian_orthodox.12.d:0 "Orthodox missionaries have achieved remarkable success converting pagan peoples in Siberia. The true faith spreads eastward as Russian power expands. Shall we establish permanent missions to consolidate these gains?"
 russian_orthodox.12.t:0 "Missionary Success in Siberia"
 russian_orthodox.13.a:0 "Accept the sacred duty"
 russian_orthodox.13.b:0 "Remain modest"
 russian_orthodox.13.d:0 "Orthodox Christians throughout the world look to us as their defender and protector. We have become the bulwark of true faith against heresy and heathenism. Shall we formally accept this sacred responsibility?"
 russian_orthodox.13.t:0 "Defender of Orthodoxy"
 russian_orthodox.14.b:0 "Decline the honor"
 russian_orthodox.14.t:0 "Patriarch of All Rus'"
 russian_orthodox.15.a:0 "Suppress the resistance"
 russian_orthodox.15.b:0 "Grant cultural concessions"
 russian_orthodox.15.d:0 "Local peoples resist our efforts at administrative uniformity. They cling to their language, faith, and ancestral customs, viewing Muscovite rule as foreign oppression."
 russian_orthodox.15.t:0 "Cultural Resistance Movement"
 russian_orthodox.18.a:0 "Ours keeps the see"
 russian_orthodox.18.b:0 "Ask who confirms ours"
 russian_orthodox.18.d:0 "Word has come from Moscow that a metropolitan of all Rus has been elected there without asking Constantinople, and that he has been enthroned regardless. Our bishops were not at that election and would not have voted for that candidate. From this year there are two metropolitans of all Rus, and only one of them is in Kyiv - which is the one thing both sides agree the title cannot mean."
 russian_orthodox.18.t:0 "The Metropolitanate Divides"
 russian_orthodox.19.a:0 "Proclaim our claim"
 russian_orthodox.19.b:0 "Wait for the proper hour"
 russian_orthodox.19.d:0 "A hundred cities answer to our throne and an ancient metropolitan see stands within our realm. Our bishops argue that a church of this stature should be headed by its own patriarch. No eastern see has been asked and none has answered: this would be a claim proclaimed at home, not a dignity recognized abroad. Pressing it now commits us before the whole Orthodox world."
 russian_orthodox.19.t:0 "A Patriarchal Claim"
 russian_orthodox.2.t:0 "Recognition of the Moscow Patriarchate"
 russian_orthodox.3.a:0 "Force immediate conversion"
 russian_orthodox.3.b:0 "Establish Orthodox missions"
 russian_orthodox.3.c:0 "Allow religious freedom for now"
 russian_orthodox.3.d:0 "The conquered parish still follows another faith. The clergy ask whether to preach under the protection of the garrison or establish a mission. Both arrangements assist ordinary missionary work; neither settles the parish's obedience at once. Local revenues and the peace of the district remain at stake."
 russian_orthodox.3.t:0 "Newly Conquered Province"
 russian_orthodox.4.b:0 "Gradual cultural integration"
 russian_orthodox.4.c:0 "Respect local cultures"
 russian_orthodox.6.t:0 "The Raskol - Old Believer Schism"
 russian_orthodox.7.a:0 "Fund a contested mission in Kazan."
 russian_orthodox.7.b:0 "Fund readers and a parish mission."
 russian_orthodox.7.c:0 "Practice religious tolerance"
 russian_orthodox.7.d:0 "We have conquered Kazan, the Tatar Muslim stronghold. This historic victory opens the way to the East. Shall we forcibly convert the Muslims, establish Orthodox missions, or practice tolerance?"
 russian_orthodox.7.t:0 "Conquest of Kazan"
 russian_orthodox.8.a:0 "Unite all Russian lands"
 russian_orthodox.8.b:0 "Pursue peaceful expansion"
 russian_orthodox.8.d:0 "Many lands that were once Rus' are still held by lesser princes or by other crowns. The chancery and the court clergy hold that, as heir to ancient Rus', our throne has both the right and the duty to gather them under one rule. Other courts call this pretension and claim the same inheritance. Shall we press the claim?"
 russian_orthodox.8.t:0 "Gathering of Russian Lands"
 russian_orthodox.9.a:0 "Establish Symphonia"
 russian_orthodox.9.b:0 "Maintain separation"
 russian_orthodox.9.d:0 "The Byzantine ideal of Symphonia - harmonious unity of church and state - can be achieved in our empire. The Patriarch and Tsar working together can create a truly Orthodox state. Shall we formalize this arrangement?"
 russian_orthodox.9.t:0 "Symphonia of Powers"
 russian_orthodox_religion_desc:0 "The Muscovite church follows the Byzantine rite under a metropolitan elected in Moscow. Its hierarchy seeks recognition, protects its monasteries and argues over the service books. A patriarchate and royal control are political settlements to be negotiated, not a different creed."
 russian_protection:0 "Russian Protection"
 russian_protection_desc:0 "Russian garrisons and administrators oversee the province, providing security while eroding local autonomy."
 russian_settlement:0 "Russian Settlement"
 russian_supervision:0 "§RRussian Collegium monitors all hetman decisions§!"
 russify_province_decision_desc:0 "Spend 50 diplomatic power to charter a settlement office in a randomly chosen eligible province, lowering culture conversion costs for twenty years while stirring local discontent."
 russify_province_decision_title:0 "Endow a Settlement Office"
 service_class_militia:0 "Service Class Militias"
 settler_colonialism:0 "Sponsored Frontier Settlement"
 subjugation_of_heretics:0 "Subjugation of Heretics"
 subjugation_of_heretics_desc:0 "Heretics and non-believers must submit to Orthodox authority or face consequences."
 suppression_old_believers:0 "Suppression of Old Believers"
 symphonia_of_powers:0 "Symphonia of Powers"
 third_rome_ideology:0 "Third Rome Doctrine"
 third_rome_mission:0 "Third Rome Mission"
 third_rome_mission_desc:0 "The doctrine of the Third Rome holds that two Romes have fallen, the third stands and a fourth there shall not be. The court clergy read it as a charge to gather the Orthodox lands under Russian rule; other courts call it pretension."
 troubles.1.a:0 "Let them outfit him"
 troubles.1.b:0 "Forbid the venture"
 troubles.1.c:0 "Take a share of it"
 troubles.1.d:0 "A young man in a magnate's house at Sambir says he is the son of the old tsar, and the household is behaving as though it believes him. What he actually needs is four thousand horse, and the men who could furnish them are discussing terms in the next room. Nobody has asked what becomes of the border if he wins, and nobody is going to."
 troubles.1.t:0 "The Claimant at Sambir"
 troubles.2.a:0 "Send the register east"
 troubles.2.b:0 "Keep them on the frontier"
 troubles.2.d:0 "The eastern campaigns pay in silver and pay on time, which is more than the treasury manages. Colonels three years in arrears are being approached one at a time, and they are listening. What comes back will be richer, harder, and used to being paid by somebody else."
 troubles.2.t:0 "The Register Marches East"
 troubles.3.a:0 "Storm the walls"
 troubles.3.b:0 "Name the price"
 troubles.3.d:0 "The hetman has brought the Host to the walls of the capital, having taken every town on the road, and the boyars inside are counting powder rather than men. He can storm it or he can name a price. He has already said, to anyone who would listen, that he did not march this far to be thanked."
 troubles.3.t:0 "Before the Walls of Moscow"
 troubles.4.a:0 "Take Siveria"
 troubles.4.b:0 "Take the ransom instead"
 troubles.4.d:0 "The truce is drafted, and the article that matters hands Chernihiv, Novhorod-Siverskyi and Starodub to the Crown for fourteen years and a half - which everyone at the table reads as permanently. None of those towns was asked. The commissioners have written down that the inhabitants consent."
 troubles.4.t:0 "The Truce at Deulino"
 troubles.5.a:0 "Confirm their privileges"
 troubles.5.b:0 "Pay them off and forget it"
 troubles.5.d:0 "The register came home from Moscow knowing three things it had not known before: that it can take a capital, that crowns will bid for it, and roughly how high the bidding goes. The starshyna have begun writing this down. Warsaw has not begun reading it."
 troubles.5.t:0 "What the Host Is Worth"
 troubles.6.a:0 "Arm the districts"
 troubles.6.b:0 "Read the new terms"
 troubles.6.d:0 "The truce is signed and the Siverian towns belong to the Crown on paper, for fourteen years and a half. The starostas are the same men, the tax is the same tax, and the garrison rides in from a different direction. What changed is which chancery answers a petition, and how long the answer now takes."
 troubles.6.t:0 "Siveria, Written Away"
 tr_rip_frontier_marches_title:0 "Frontier Marches"
 tr_rip_frontier_marches_desc:0 "Before our hosts can cross the lower Dnieper in force, we must muster border regiments and consolidate the approaches along the Oka, Seim and upper Desna."
 tr_rip_princely_domains_title:0 "Princely Domains"
 tr_rip_princely_domains_desc:0 "A rising principality needs more than border spears: stone churches, thriving workshops and prosperous towns at home give our court the wealth and permanence to rival great crowns."
 tr_rip_volga_marches_title:0 "Steppe Frontier"
 tr_rip_volga_marches_desc:0 "With the northern Russian principalities united under our banner, our frontier pushes down the Volga and across the Ural approaches toward the Crimean steppe."
 tr_rip_gather_rus_title:0 "Gather All Rus"
 tr_rip_gather_rus_desc:0 "Having humbled the steppe khanates and restored rule over the Dnieper lands, our sovereign stands ready to proclaim the full gathering of the lands of Rus."
 tr_rip_frontier_mobilization:0 "Frontier Mobilization"
 desc_tr_rip_frontier_mobilization:0 "Border levies and fast reconnaissance columns prepare our principality for campaigns along the southern approaches."
 tr_rip_princely_charter:0 "Princely Urban Charter"
 desc_tr_rip_princely_charter:0 "Town charters and princely patronage encourage steady growth across our core provinces."
 tr_rip_steppe_vanguard:0 "Steppe Vanguard"
 desc_tr_rip_steppe_vanguard:0 "Seasoned frontier cavalry and fortified supply lines carry our banners across the open steppe."
 tr_rip_sovereign_of_all_rus:0 "Sovereign of All Rus"
 desc_tr_rip_sovereign_of_all_rus:0 "Recognized across both northern forests and southern riverlands, the crown commands enduring authority and prestige."
