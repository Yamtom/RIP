l_english:
 rip_du_negotiate_title:0 "Negotiate an Eparchial Union"
 rip_du_negotiate_desc:0 "Alternative history. In the record the eparchies entered the union one by one, each on its own date; the dated events follow them, and this decision serves the eparchies that have no dated event. The chancery draws one Orthodox core eparchy from the highlighted provinces; the crown does not choose it. Requires peace, stability +1, an existing Greek Catholic parish, 50 DIP and a quarter of a year's income. Talks may be opened once every five years, even if we withdraw. A paid offer is accepted 60% of the time. A refusal leaves the faith unchanged and puts +3 unrest and +15% autonomy on the province for ten years; that eparchy cannot be approached again in that time, but the others can. No missionary or centre spreads this union. An early union here may leave a dated event with nothing to do."
 rip_diocesan_union.1.t:0 "Articles for [Root.GetName]"
 rip_diocesan_union.1.d:0 "Alternative history. No negotiation is recorded for this eparchy; the chancery has drawn it because no dated event applies.\n\nThe bishop and local clergy will consider communion with Rome if the crown guarantees their Eastern liturgy, books and clerical customs. They ask for a written settlement, not a Latin mission.\n\nThe offer costs 50 DIP and a quarter of a year's income, whether accepted or refused. Acceptance has a 60% chance: this province becomes Greek Catholic, gains 10 autonomy and twenty years of protection from missionary conversion. Refusal has a 40% chance: the province keeps its faith and takes +3 unrest and +15% autonomy for ten years, and this eparchy cannot be approached again in that time. Other eparchies are not affected. The crown remains Catholic."
 rip_diocesan_union.1.a:0 "Fund the agreement and guarantee the rite."
 rip_diocesan_union.1.b:0 "Withdraw the offer; let the eparchy remain as it is."
 rip_diocesan_union.2.t:0 "The Eparchy Accepts Communion"
 rip_diocesan_union.2.d:0 "The clergy of [Root.GetName] have signed the articles. Their churches enter communion with Rome under the crown's guarantees of the Eastern rite. The settlement applies to this eparchy alone."
 rip_diocesan_union.2.a:0 "Seal the local guarantees."
 rip_diocesan_union.3.t:0 "The Eparchy Refuses"
 rip_diocesan_union.3.d:0 "The clergy and brotherhoods of [Root.GetName] will not sign. The negotiations have spent their funds, and the province carries +3 unrest and +15% autonomy for ten years. We may not approach this eparchy again for that long; the other eparchies stay open."
 rip_diocesan_union.3.a:0 "Respect the refusal."
 rip_du_rite_guarantee:0 "Eastern Rite Protected"
 desc_rip_du_rite_guarantee:0 "A local union agreement protects the Eastern rite from missionary conversion for twenty years. It does not spread to neighbouring provinces."
