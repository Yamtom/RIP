 dniester_cossack_raids_threat:0 "Cossack Raid Threat"
 dniester_defensive_network:0 "Dniester Defensive Network"
 dniester_estuary.1.a:0 "Welcome them warmly"
 dniester_estuary.1.b:0 "Tax them heavily"
 dniester_estuary.1.c:0 "Restrict foreign merchants"
 dniester_estuary.1.d:0 "Greek merchants from Constantinople and Crimea have arrived in Akkerman, seeking to establish trading houses. They bring connections to wider Black Sea trade networks and expertise in maritime commerce. How shall we receive them?"
 dniester_estuary.1.t:0 "Greek Merchants in Akkerman"
 dniester_estuary.10.a:0 "An impregnable bastion!"
 dniester_estuary.10.d:0 "The great fortress of Akkerman is complete! Its massive walls and towers dominate the estuary, protecting our trade routes and projecting power across the Black Sea region. Neighboring powers watch nervously."
 dniester_estuary.10.t:0 "Akkerman Fortress Completed"
 dniester_estuary.11.a:0 "Build our own fortifications"
 dniester_estuary.11.b:0 "Prepare for conflict"
 dniester_estuary.11.c:0 "Accept their strength"
 dniester_estuary.11.d:0 "[From.GetName] has completed massive fortifications at Akkerman in the Dniester Estuary. This fortress threatens to dominate the entire Black Sea coast. How shall we respond?"
 dniester_estuary.11.t:0 "[From.GetName] Fortifies Akkerman"
 dniester_estuary.2.a:0 "Welcome the Armenian merchants"
 dniester_estuary.2.b:0 "Prefer local merchants"
 dniester_estuary.2.d:0 "Armenian merchants, renowned for their long-distance trade networks, have petitioned to establish themselves in Akkerman. They can connect us to Persian and Asian trade routes."
 dniester_estuary.2.t:0 "Armenian Merchants Arrive"
 dniester_estuary.20.a:0 "Expand production"
 dniester_estuary.20.b:0 "Focus on exports"
 dniester_estuary.20.c:0 "Tax the profits"
 dniester_estuary.20.d:0 "The wine trade in the Dniester Estuary is booming! Greek and Armenian merchants are exporting our wines to Constantinople, Caffa, and beyond. Demand is high and profits are substantial."
 dniester_estuary.20.t:0 "Wine Trade Flourishes"
 dniester_estuary.30.a:0 "Build alliance network"
 dniester_estuary.30.a.tt:0 "Other Ottoman rivals will view us more favorably"
 dniester_estuary.30.b:0 "Military buildup"
 dniester_estuary.30.c:0 "Delay our plans"
 dniester_estuary.30.d:0 "We have decided to contest Ottoman control of the Dniester Estuary. This strategic region is vital to Black Sea trade, and we cannot allow the Ottomans to monopolize it. How shall we prepare for the inevitable conflict?"
 dniester_estuary.30.t:0 "Preparing Against the Ottomans"
 dniester_estuary.40.a:0 "Strengthen coastal defenses"
 dniester_estuary.40.b:0 "Negotiate with the Cossacks"
 dniester_estuary.40.c:0 "Accept the raids as reality"
 dniester_estuary.40.d:0 "Cossack raiders are threatening the Dniester Estuary trade routes! Their fast boats strike merchant vessels and coastal settlements, then vanish into the steppe. This is disrupting commerce and frightening merchants."
 dniester_estuary.40.t:0 "Cossack Raids on Estuary"
 dniester_estuary.50.a:0 "Excellent for trade!"
 dniester_estuary.50.d:0 "A major merchant fleet has arrived in Akkerman, laden with goods from across the Black Sea and Mediterranean. Our port is bustling with activity and profits are flowing!"
 dniester_estuary.50.t:0 "Merchant Fleet Arrives"
 dniester_estuary.51.a:0 "Praise the fishermen!"
 dniester_estuary.51.d:0 "The fishing season in the Dniester Estuary has been exceptional! Our fishermen are bringing in record catches, and fish markets are overflowing with fresh sturgeon, herring, and other valuable catches."
 dniester_estuary.51.t:0 "Excellent Fish Harvest"
 dniester_estuary.52.a:0 "Host the competition"
 dniester_estuary.52.b:0 "Just sell the wine"
 dniester_estuary.52.d:0 "Wine merchants propose hosting a vintage competition to showcase Dniester wines and attract buyers from across the Black Sea region. This could boost our wine trade's reputation, but requires investment."
 dniester_estuary.52.t:0 "Wine Vintage Competition"
