 rip_church_rite_effects_title:0 "EFFECTS ON THE PROVINCE"
 rip_church_rite_effects_tt:0 "While the guarantee stands, Union backlash and Muscovite missions skip this province. It lapses if the owner leaves the Union or the province changes faith."
 rip_church_rite_favoured:0 "Protected local tradition"
 rip_church_rite_heading:0 "COMMUNITY RIGHTS"
 rip_church_rite_heading_tt:0 "Guarantee the rite and clergy of an Orthodox or Catholic community under Greek Catholic rule. The province keeps its faith and does not join the Union.\n§gGameplay abstraction: not an exact canonical status, and not voluntary Union acceptance.§!"
 rip_church_rite_help:0 "Gameplay abstraction: not an exact parish or canonical status, or proof of voluntary Union acceptance. The province keeps its faith; no conversion is implied. Costs §Y1 ADM per development§!; lasts at least 10 years. Unrest -2 (-0.5 from protected tradition); tax -15%, manpower -20%; no religious-unity penalty. Game-design interpretation: tax and manpower reductions model the administrative compromise of protecting local arrangements and autonomy—not a penalty for another faith and not a documented historical formula. After ecumenical settlement: unrest -3, tax -10%, manpower -15%. Revoke: +3 unrest for 10 years."
 rip_church_rite_help_tt:0 "This province-level marker is a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The province keeps its religion; it is not converted and does not enter the Union. While the guarantee stands, Union backlash events and Muscovite missionary networks skip the province. The ecumenical settlement deepens it to unrest -3, tax -10% and levies -15%. It lapses if the owner leaves the Union or the province changes faith. The Union window counts Orthodox and Muscovite Orthodox provinces as Orthodox, and Catholic provinces as Catholic. Only a Greek Catholic owner can guarantee rights. The Orthodox and Catholic counts are gameplay groupings of provinces, not historical diocesan boundaries. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 rip_church_rite_note:0 "The province keeps its faith; it is not converted and does not join the Union."
 rip_church_rite_note_tt:0 "While the guarantee stands, Union backlash and Muscovite missions skip this province. It lapses if the owner leaves the Union or the province changes faith."
