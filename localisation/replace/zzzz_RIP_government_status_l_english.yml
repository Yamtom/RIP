 rip_gov_kru_voice:0 "Junior voice: [Root.RipGovJuniorVoice]"
 rip_gov_kru_voice_tt:0 "The leading faction must have at least 60 influence to dominate. Its partner is the PREVIOUS dominant faction, not the runner-up. The third faction is the opposition. The partner receives a junior-voice modifier only at 38 influence or more.\nOn the first recorded dominance, the default partner is Boyars for Knyazi, and Knyazi for Boyars or Starshyna. Below 60 there is no coalition or junior voice; the States General scale returns to centre. The remembered previous dominant faction is retained.\nThe record refreshes monthly and after courting a faction. States General requires Res Publica or Winds of Change."
 rip_gov_kru_decay:0 "Decadence: §Y[Root.ruthenian_decadence.GetValue]§!"
 rip_gov_kru_decay_tt:0 "Current conditions for the next yearly pulse; coloured values are active, 0 means inactive. Add these values together. Events can change Decadence separately; this is not a forecast of intervening events.\n[Root.RipGovStabZero] stability = 0\n[Root.RipGovStabBad] stability < 0\n[Root.RipGovWar] at war\n[Root.RipGovLoans] at least 5 loans\n[Root.RipGovAutonomy] average autonomy at least 40%\n[Root.RipGovLegitimacy] legitimacy below 50\n[Root.RipGovStabGood] stability at least +2\n[Root.RipGovPeace] at peace\nOn the first yearly update, an uninitialised zero starts at 20 before these changes. Annual modifiers: below 40 / 40-69 / at least 70."
 rip_gov_kru_annual:0 "Yearly change: hover for active factors"
 rip_gov_kru_annual_tt:0 "Current conditions for the next yearly pulse; coloured values are active, 0 means inactive. Add these values together. Events can change Decadence separately; this is not a forecast of intervening events.\n[Root.RipGovStabZero] stability = 0\n[Root.RipGovStabBad] stability < 0\n[Root.RipGovWar] at war\n[Root.RipGovLoans] at least 5 loans\n[Root.RipGovAutonomy] average autonomy at least 40%\n[Root.RipGovLegitimacy] legitimacy below 50\n[Root.RipGovStabGood] stability at least +2\n[Root.RipGovPeace] at peace\nOn the first yearly update, an uninitialised zero starts at 20 before these changes. Annual modifiers: below 40 / 40-69 / at least 70."
 rip_gov_kru_crisis:0 "Crisis: 90+ | Retreat: <75 | End: <60, stability +1"
 rip_gov_kru_crisis_tt:0 "Court Crisis can start accumulating for KRU with this reform, no other disaster, and Decadence at least 90. Base monthly progress at 90+: +6; frontier centralisation +1.5, frontier liberties -1, southern recovery -1. Progress recedes below 75. An active crisis ends only when Decadence is below 60 AND stability is at least +1.\nThe first annual crossing of 90 can also trigger a separate court event; its choices reduce Decadence. A threshold does not mean the disaster starts immediately."
 rip_gov_kru_memory:0 "Partner follows the previous dominance."
 rip_gov_kru_memory_tt:0 "The leading faction must have at least 60 influence to dominate. Its partner is the PREVIOUS dominant faction, not the runner-up. The third faction is the opposition. The partner receives a junior-voice modifier only at 38 influence or more.\nOn the first recorded dominance, the default partner is Boyars for Knyazi, and Knyazi for Boyars or Starshyna. Below 60 there is no coalition or junior voice; the States General scale returns to centre. The remembered previous dominant faction is retained.\nThe record refreshes monthly and after courting a faction. States General requires Res Publica or Winds of Change."
