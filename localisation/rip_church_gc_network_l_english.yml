l_english:

 # --- eparchial sees
 rip_church_gc_erect_see_title:0 "Erect an Eparchial See"
 rip_church_gc_erect_see_desc:0 "The Union rests on its bishops, not on a single center. The metropolitan see is seated without a decision in the best eligible Greek Catholic parish, and moves there again if every see is lost. Pay §Y50 ADM§! and §Y100 ducats§! to seat another bishop, preferring a parish beside Orthodox ones. Each active see gives §G+2%§! missionary strength in the Orthodox parishes of its area and next to it, and adds §G+0.5§! yearly Patriarch Authority through the synod of bishops. An occupied see stands vacant until control returns; a lost or converted see is dissolved while the others keep working.\n\nSees: §Y[Root.rip_church_gc_sees.GetValue]§!, active §Y[Root.rip_church_gc_active_sees.GetValue]§!, supported §Y[Root.rip_church_gc_see_capacity.GetValue]§!."
 rip_church_gc_see_metropolitan_tt:0 "The metropolitan see is already seated; it needs no decision"
 rip_church_gc_see_capacity_tt:0 "The realm has fewer sees than it supports: one, and one more at 8, 16 and 24 Greek Catholic parishes"
 rip_church_gc_see_interval_tt:0 "No see was erected in the last year"
 rip_church_gc_see_site_tt:0 "An eligible parish exists: our controlled core Greek Catholic city with a temple or cathedral, development 8 or more, and no other see of ours in its area"

 # --- synod of bishops and its programs
 rip_church_gc_synod_programs_title:0 "Convene the Synod of Bishops"
 rip_church_gc_synod_programs_desc:0 "The synod of bishops commits the church to standing programs. A program stays in force until the synod drops it. Adopting one costs §Y20 Patriarch Authority§!, and a new program may be adopted five years after the last; dropping is free and refunds nothing. One program runs at a time, two once the realm keeps three sees. If sees are lost, the later program lapses first. Rome's consent is not required.\n\nPrograms: §Y[Root.rip_church_gc_programs.GetValue]§! of §Y[Root.rip_church_gc_program_slots.GetValue]§!."
 rip_church_gc_can_convene_bishops_tt:0 "The synod has a program to review or may adopt a new one"
 rip_church_gc_network.1.t:0 "The Synod of Bishops"
 rip_church_gc_network.1.d:0 "The bishops of the Union meet under the metropolitan to set the standing programs of the church. Each adoption costs §Y20 Patriarch Authority§!; the synod adopts no new program within five years of the last, and dropping one is free.\n\nPrograms in force: §Y[Root.rip_church_gc_programs.GetValue]§! of §Y[Root.rip_church_gc_program_slots.GetValue]§!."
 rip_church_gc_network.1.a:0 "Adopt: Custody of the Eastern Rite"
 rip_church_gc_network.1.b:0 "Adopt: Basilian Colleges"
 rip_church_gc_network.1.c:0 "Adopt: Missions of the Union"
 rip_church_gc_network.1.e:0 "Adopt: Synodal Governance"
 rip_church_gc_network.1.f:0 "Adopt: Communion with Rome"
 rip_church_gc_network.1.g:0 "Drop: Custody of the Eastern Rite"
 rip_church_gc_network.1.h:0 "Drop: Basilian Colleges"
 rip_church_gc_network.1.i:0 "Drop: Missions of the Union"
 rip_church_gc_network.1.j:0 "Drop: Synodal Governance"
 rip_church_gc_network.1.k:0 "Drop: Communion with Rome"
 rip_church_gc_network.1.l:0 "Leave the programs as they are"

 # --- modifiers
 rip_church_gc_eparchial_see:0 "Eparchial See"
 desc_rip_church_gc_eparchial_see:0 "The seat of a Greek Catholic bishop. The cathedral parish is well kept and resists conversion to other faiths."
 rip_church_gc_vacant_see:0 "Vacant Eparchial See"
 desc_rip_church_gc_vacant_see:0 "Enemy or rebel control keeps the bishop from the eparchy. The see keeps its place in the network but gives nothing until control returns."
 rip_church_gc_pastoral_visitation:0 "Pastoral Visitation"
 desc_rip_church_gc_pastoral_visitation:0 "A Greek Catholic bishop visits the Orthodox parishes of the eparchy, which helps our missionaries here. Parishes with a recognized rite are left to their compact."
 rip_church_gc_bishops_1:0 "Synod of Bishops: One See"
 desc_rip_church_gc_bishops_1:0 "The bishops of our active sees govern the church together. Their authority does not depend on Rome."
 rip_church_gc_bishops_2:0 "Synod of Bishops: Two Sees"
 desc_rip_church_gc_bishops_2:0 "The bishops of our active sees govern the church together. Their authority does not depend on Rome."
 rip_church_gc_bishops_3:0 "Synod of Bishops: Three Sees"
 desc_rip_church_gc_bishops_3:0 "The bishops of our active sees govern the church together. Their authority does not depend on Rome."
 rip_church_gc_bishops_4:0 "Synod of Bishops: Four Sees"
 desc_rip_church_gc_bishops_4:0 "The bishops of our active sees govern the church together. Their authority does not depend on Rome."
 rip_church_gc_self_government:0 "Synodal Self-Government"
 desc_rip_church_gc_self_government:0 "Rome cannot be reached: the Papal State is absent or not Catholic, at war with us, or its opinion of us is below 50. Meanwhile the synod of bishops acts on its own authority."
 rip_church_gc_program_rite:0 "Custody of the Eastern Rite"
 desc_rip_church_gc_program_rite:0 "A standing program of the synod: the Byzantine liturgy, the Julian calendar and a married parish clergy are kept against Latinizing pressure."
 rip_church_gc_program_schools:0 "Basilian Colleges"
 desc_rip_church_gc_program_schools:0 "A standing program of the synod: colleges of the Order of Saint Basil train clergy and officials."
 rip_church_gc_program_mission:0 "Missions of the Union"
 desc_rip_church_gc_program_mission:0 "A standing program of the synod: preachers of the Union work among the other Christians of the realm."
 rip_church_gc_program_synod:0 "Synodal Governance"
 desc_rip_church_gc_program_synod:0 "A standing program of the synod: regular synods under the metropolitan settle appointments and discipline."
 rip_church_gc_program_rome:0 "Communion with Rome"
 desc_rip_church_gc_program_rome:0 "A standing program of the synod: close correspondence with Rome and the Catholic courts eases our diplomacy."

 # --- Rome
 rip_church_gc_rome_cordial_tt:0 "The Catholic Papal State exists, is at peace with us and its opinion of us is at least 50"
 rip_church_gc_greek_college_title:0 "Send Students to the Greek College"
 rip_church_gc_greek_college_desc:0 "Since 1577 the Greek College of Saint Athanasius in Rome has trained clergy of the Eastern rite. Pay §Y100 ducats§! and §Y25 DIP§! to maintain our students there for twenty years. Requires a Catholic Papal State at peace with us whose opinion of us is at least 50."
 rip_church_gc_propaganda_fide_title:0 "Appeal to the Propaganda Fide"
 rip_church_gc_propaganda_fide_desc:0 "Since 1622 the Congregation for the Propagation of the Faith has supported missions of the Eastern Catholic churches. Pay §Y50 ducats§! and §Y50 DIP§! for ten years of its support. Requires a Catholic Papal State at peace with us whose opinion of us is at least 50."
 rip_church_gc_papal_protection:0 "Papal Protection of the Union"
 desc_rip_church_gc_papal_protection:0 "The Pope holds us in high regard (opinion 100 or more) and defends the Eastern rite of our church before the Catholic courts. It lasts as long as that regard and peace with the Papal State."
 rip_church_gc_greek_college:0 "Students at the Greek College"
 desc_rip_church_gc_greek_college:0 "Clergy trained at the Greek College in Rome return to serve our hierarchy and our court."
 rip_church_gc_propaganda_fide:0 "Support of the Propaganda Fide"
 desc_rip_church_gc_propaganda_fide:0 "The Congregation for the Propagation of the Faith shares the cost of our missions."
