 rip_gov_hlc_council:0 "Current course: [Root.RipGovHlcCouncil]"
 rip_gov_hlc_council_tt:0 "Active Boyar Council course:\n- Confirm in Office: +10 noble loyalty immediately, concessions for 10 years\n- Counter Claimant: +3 legitimacy equivalent immediately, authority for 10 years\n- Make an Example: +3 army tradition and -5 noble loyalty immediately, coercion for 7 years\nAll three share a ten-year cooldown, including the three years after coercion expires. See each action for its cost, benefits and penalties."
