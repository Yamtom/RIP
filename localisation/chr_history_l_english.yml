l_english:

 # --- historical processes of the Siverian land

 chr_history.1.t:0 "The Princes Come With Retinues"
 chr_history.1.d:0 "Two princes of the Moscow line have crossed over to us with their retinues, their chaplains and a claim to hold Siverian towns as udils, the way their grandfathers held them. They bring five hundred horse and a quarrel with everyone they left behind. Vilnius has taken such men in before, and has twice had to explain to Moscow why."
 chr_history.1.a:0 "Give them their udils"
 chr_history.1.b:0 "The towns keep their courts"
 chr_history.1.c:0 "Send them on eastward"

 chr_history.2.t:0 "Watchtowers Along the Desna"
 chr_history.2.d:0 "Muscovite watchposts have gone up on the far bank within sight of our fords, manned through the winter and relieved on a schedule. Nobody has crossed and nobody has said anything about it. The border lords on both banks have begun asking which side is paying them this year."
 chr_history.2.a:0 "Line our bank with forts"
 chr_history.2.b:0 "Buy a truce in Moscow"
 chr_history.2.c:0 "Let the border lords choose"

 chr_history.3.t:0 "The Hemp Goes North"
 chr_history.3.d:0 "Starodub hemp and potash have found their buyers, and the buyers are in Riga and Danzig: rope for fleets nobody here will ever see. The carts go north for six weeks and come back with silver, salt and news. Every toll along that road is collected by somebody else."
 chr_history.3.a:0 "Contract the crop to Riga"
 chr_history.3.b:0 "Set up ropewalks of our own"
 chr_history.3.c:0 "Tax the carts instead"

 chr_history.4.t:0 "Charters for the Towns"
 chr_history.4.d:0 "The magistrats have petitioned for Magdeburg law in writing, and the Chernihiv petition was drafted by a man who had read the Nizhyn one first. A chartered town elects its own council, keeps its own court and answers for its own taxes. What it stops doing is answering quickly."
 chr_history.4.a:0 "Seal every charter"
 chr_history.4.b:0 "Charter the capital alone"

 chr_history.5.t:0 "Grants in a Land They Have Not Seen"
 chr_history.5.d:0 "The country has been erected into a voivodeship, and grants inside it are being written out for men whose service was done somewhere else. Some will come, build and stay; some will send a steward and a rent roll. The starosta's court has already heard its first case between a grantee and a sloboda that was there before him."
 chr_history.5.a:0 "Enter them on our roll"
 chr_history.5.b:0 "Hold the land for the towns"

 chr_history.6.t:0 "The Colonels Take the Districts"
 chr_history.6.d:0 "The voivodes are gone and the regiments hold what they held: Chernihiv, Nizhyn and Starodub muster by sotnia, judge by sotnia and collect by sotnia. The magistrats still have their charters and their seals. Nobody has written down which of the two a townsman answers to first."
 chr_history.6.a:0 "The colonel above the magistrat"
 chr_history.6.b:0 "The magistrat above the colonel"

 chr_history.7.t:0 "A Seat Built in Brick"
 chr_history.7.d:0 "The hetman's seat is going up in brick, with a press, a mint, a chancery wing and a church front that copies nothing in Moscow and nothing in Warsaw. Masons have come from Vilnius and Lviv for the wages. A capital that looks like this is read as a statement by everyone who sees it, including those it was not addressed to."
 chr_history.7.a:0 "Build it in brick"
 chr_history.7.b:0 "Spend it on the frontier"

 chr_history.8.t:0 "Protection Offered from the Porte"
 chr_history.8.d:0 "An envoy has come up from the Porte with the offer that has always been available: protection, tribute, and no garrison of theirs on our ground. It would cost nothing this year. Every man in the rada knows what the Tatar road looks like the year after a protector changes his mind."
 chr_history.8.a:0 "Take the Sultan's word"
 chr_history.8.b:0 "Send the envoy back"

 chr_history.9.t:0 "The Collegium at Chernihiv"
 chr_history.9.d:0 "The bishop's school is to be raised into a collegium: Latin, rhetoric, poetics and enough law to argue with a chancery. Its graduates will not all take orders; most of them will take offices. The men funding it have understood this and are funding it anyway."
 chr_history.9.a:0 "Endow the Collegium"
 chr_history.9.b:0 "Send our sons to Kyiv"

 chr_history.10.t:0 "The Chancery Men"
 chr_history.10.d:0 "The registers, the treaties and the court rolls are drafted by a caste that did not exist two generations ago: chancery men who write in three languages, marry each other's daughters and end up owning the villages they were sent to survey. They are the only people who know how the country actually works. They also know what that is worth."
 chr_history.10.a:0 "Give the chancery men rank"
 chr_history.10.b:0 "Keep the offices for colonels"

 chr_history.11.t:0 "The Rights by Which the Land Is Judged"
 chr_history.11.d:0 "The commission has finished: Lithuanian statute, Magdeburg law and Cossack custom reconciled into one book, with the places where they cannot be reconciled marked in the margin. Judges have been asking for it for forty years. The marked places are where every interesting case will now be argued."
 chr_history.11.a:0 "Confirm the book"
 chr_history.11.b:0 "Leave the courts to custom"
