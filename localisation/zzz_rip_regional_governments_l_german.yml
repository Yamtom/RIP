 rip_rg_uzh_guides_tt:0 "Choose an owned highland, hills or mountain land; pay 50 MIL and 30 ducats on confirmation.\nTarget land gains +10 Local Autonomy and Highland Guides Compact (+1 Hostile Attrition) for 5 years.\nCountry gains Highland Supply Guides (-10% Land Attrition) for 5 years and loses 5 Nobles loyalty.\nInstitution shared term: 5 years."
