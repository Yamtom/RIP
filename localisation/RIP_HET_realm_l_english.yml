 desc_het_liberation_achieved:0 "The ancient Ruthenian lands have been freed from foreign domination."

 het_cultural_center:0 "Cultural Renaissance"
 desc_het_cultural_center:0 "This city flourishes as a center of Cossack culture and learning."

 het_fortified_sich:0 "Fortified Sich"
 desc_het_fortified_sich:0 "The Sich has been transformed into a formidable fortress."

 het_steppe_mastery:0 "Masters of the Steppe"
 desc_het_steppe_mastery:0 "The Cossacks have perfected warfare on the open steppe."

 het_cossack_cavalry_elite:0 "Elite Cossack Cavalry"
 desc_het_cossack_cavalry_elite:0 "Our cavalry are the finest horsemen in Eastern Europe."

 het_perfected_raids:0 "Perfected Raiding"
 desc_het_perfected_raids:0 "Cossack raids are conducted with legendary efficiency."

 het_free_cossacks:0 "Free Cossacks"
 desc_het_free_cossacks:0 "The Cossacks answer to no overlord but their own Hetman."

 het_dnieper_hub:0 "Dnieper Trade Hub"
 desc_het_dnieper_hub:0 "The Dnieper River has become a vital trade artery."

 het_black_sea_fleet:0 "Black Sea Fleet"
 desc_het_black_sea_fleet:0 "Cossack naval power extends across the Black Sea."

 het_moldovan_partnership:0 "Moldavian Partnership"
 desc_het_moldovan_partnership:0 "Strong diplomatic ties bind the Hetmanate and Moldavia."

 het_moldovan_vassalization:0 "Moldavian Vassalization"
 desc_het_moldovan_vassalization:0 "Moldavia serves as a loyal vassal of the Hetmanate."
 het_moldovan_sworn_alliance:0 "Sworn Moldavian Alliance"
 desc_het_moldovan_sworn_alliance:0 "The hospodar stands as a free ally of the Host, and the oath between them has been tested and has held."

 het_moldovan_conquest:0 "Moldavian Conquest"
 desc_het_moldovan_conquest:0 "Moldavia has been conquered and incorporated into the Hetmanate."

 het_danube_watch:0 "Danube Watch"
 desc_het_danube_watch:0 "Cossack garrisons guard the Danube frontier."

 het_bulwark_of_orthodoxy:0 "Bulwark of Orthodoxy"
 desc_het_bulwark_of_orthodoxy:0 "The Hetmanate stands as the great Orthodox defender in the Balkans."

 het_raid_preparation:0 "Raid Preparation"
 desc_het_raid_preparation:0 "The Host is preparing for a major raid."

 het_successful_raid:0 "Successful Raid"
 desc_het_successful_raid:0 "A successful raid has enriched and emboldened the Host."

 het_legendary_raid:0 "Legendary Raid"
 desc_het_legendary_raid:0 "This raid will be sung about for generations."

 het_punitive_strike:0 "Punitive Strike"
 desc_het_punitive_strike:0 "The Cossacks strike with punitive fury."

 het_steppe_hegemony:0 "Steppe Hegemony"
 desc_het_steppe_hegemony:0 "The Hetmanate rules the steppe without challenge."

 het_tamed_steppe:0 "Tamed Steppe"
 desc_het_tamed_steppe:0 "This steppe province has been brought under Cossack control."

 het_modern_cossack_army:0 "Reformed Cossack Army"
 desc_het_modern_cossack_army:0 "Combined-arms musket and artillery drill united with Cossack cavalry traditions."

 het_raid_defenses:0 "Anti-Raid Defenses"
 desc_het_raid_defenses:0 "Defenses have been strengthened against Cossack raids."

 het_deep_raided:0 "Devastated by Raid"
 desc_het_deep_raided:0 "Deep Cossack raids have left this province in ruins."

 het_anti_catholic_crusader:0 "Anti-Catholic Crusader"
 desc_het_anti_catholic_crusader:0 "The Hetmanate crusades against Catholic oppression."

 het_constantinople_liberator:0 "Liberator of Constantinople"
 desc_het_constantinople_liberator:0 "The Hetmanate marches to liberate Constantinople."

 het_moldovan_levies:0 "Moldavian Levies"
 desc_het_moldovan_levies:0 "Moldavian troops bolster our forces."

 het_danube_trade:0 "Danube Trade"
 desc_het_danube_trade:0 "Trade flows along the Danube under Cossack protection."

