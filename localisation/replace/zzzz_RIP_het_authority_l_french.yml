l_french:
 rip_hetman_cossacks_reform:0 "Hetmanate Government"
 rip_hetman_cossacks_reform_desc:0 "The Cossack institutions are retained, while the distribution of authority between the officers and the Hetman replaces the Sich government interactions. Position and previous terms survive reform changes."
 ability_rip_het_authority_mechanic:0 "Starshyna and Hetman"
 rip_het_authority:0 "Starshyna - Hetman"
 rip_het_authority_desc:0 "0: officers; 100: Hetman. Below 30: -10% state maintenance, -5% manpower, +5 noble loyalty equilibrium if present. Above 70: +10% manpower, -0.025 monthly autonomy, +1 unrest. The centre has no extra modifier. Each month, position moves 0.1 towards 50. Polity changes preserve position. Mazepist autocracy and collegial control suspend the scale and its bonuses."
 monthly_rip_het_authority:0 "Monthly Distribution of Authority"
 rip_het_authority_gain_modifier:0 "Distribution of Authority Gain"
 rip_het_rights:0 "Confirm Officers Rights"
 rip_het_rights_desc:0 "Pay 50 DIP to move 15 points towards the officers. Both mandates share a five-year term, shown among country modifiers. No payment at the left boundary."
 rip_het_chancery:0 "Review the Chancery"
 rip_het_chancery_desc:0 "Pay 50 ADM to move 15 points towards the Hetman. Nobles lose 5 loyalty if present. Both mandates share a five-year term, shown among country modifiers."
 rip_het_authority_session:0 "Hetmanate Mandate: Five-Year Term"
 desc_rip_het_authority_session:0 "A five-year political term confirmed between the Hetman and the Cossack officer corps."
 rip_het_polk_term:0 "Regimental Political Settlement: Three-Year Term"
 desc_rip_het_polk_term:0 "A three-year regimental settlement establishing internal stability and balancing power across the host."
 rip_het_negotiation_term:0 "Negotiated Settlement: Ten-Year Term"
 desc_rip_het_negotiation_term:0 "A comprehensive ten-year political compact between the estates of the Hetmanate and the central leadership."
 rip_het_contested_course:0 "Contested Government Course"
 desc_rip_het_contested_course:0 "Disagreements between the Hetman and the regimental officers over state policy provoke widespread unrest and friction across the host."
 rip_het_authority.1.t:0 "Negotiate the Distribution of Authority"
 rip_het_authority.1.d:0 "Five consecutive years of extreme power have strained the settlement between the officers and the Hetman. Compromise moves authority twenty points towards the centre. Defending the present course costs monarch power and brings three years of unrest."
 rip_het_authority.1.a:0 "Accept a compromise."
 rip_het_authority.1.b:0 "Defend the officers rights: 50 DIP."
 rip_het_authority.1.c:0 "Defend the Hetman: 50 ADM."
