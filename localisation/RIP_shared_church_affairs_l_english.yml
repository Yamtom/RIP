 rip_uc_petition_church_tax_title:0 "Chancery Petition on Church Dues"
 rip_uc_petition_church_tax_desc:0 "Recorded in older chancery registers; current church governance proceeds through the local synod."
 rip_uc_petition_blessing_title:0 "Apostolic Blessing Record"
 rip_uc_petition_blessing_desc:0 "Recorded in older chancery registers; current church governance proceeds through the local synod."
 rip_uc_petition_indulgence_title:0 "Chancery Petition on Indulgences"
