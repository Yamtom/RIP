 rip_church_gui_adopt:0 "Accept the Union"
 rip_church_gui_adopt_tt:0 "Conclude the later Orthodox state route from 1596 — a regional alternative — paying §Y100 ADM and 100 DIP§!. Uses exactly the current national decision gates: regional state, enabled faith, peace, stability, Catholic contact or union pressure, and qualifying Orthodox provinces. Catholic countries cannot use this action. Alternative history when the state has no Catholic overlord: the historical unions were concluded by bishops living under Catholic crowns, and none of those crowns changed its own faith. Here the whole state takes the union. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
