l_english:
 rip_uc_view_communion_title:0 "Communion with Rome"
 rip_uc_view_communion_desc:0 "Review the authority of our church and the conditions for sending petitions to Rome."
 rip_uc_church_benefit_slot_free_tt:0 "No active Curia petition or synod article. Our church may maintain one such benefit at a time."
 rip_uc_synod_current_desc:0 "Adopt one article for twenty years, paying 100 administrative power and 25 church authority. Only one synod article or Curia petition may be active. Closing this meeting without agreement costs nothing."
 rip_uc_synod_cancel:0 "Close the synod without an agreement"
 rip_uc_curia.1.t:0 "The Union and the Holy See"
 rip_uc_curia.1.close:0 "Return to affairs of the realm"
 rip_uc_curia.1.communion:0 "Our eastern hierarchy remains in communion with Rome. Church authority is shown in the Religion tab; spending it reduces its benefits.\n\nOnce the See of the Union is established, six petitions are available in Decisions. Each costs 25 authority, 2 prestige and a treasury fee, and lasts twenty years. We may maintain one petition or synod article at a time. Petitions require peace with Rome, Roman opinion +25 and stability 0.\n\nStable communion can raise authority by 2 every two years; war with Rome, its absence or unity below 70% costs 2 instead. Donations and the spread of the Union can also raise it.\n\nRome exists and is at peace with us."
 rip_uc_curia.1.war:0 "Our eastern hierarchy remains in communion with Rome. Church authority is shown in the Religion tab; spending it reduces its benefits.\n\nOnce the See of the Union is established, six petitions are available in Decisions. Each costs 25 authority, 2 prestige and a treasury fee, and lasts twenty years. We may maintain one petition or synod article at a time. Petitions require peace with Rome, Roman opinion +25 and stability 0.\n\nStable communion can raise authority by 2 every two years; war with Rome, its absence or unity below 70% costs 2 instead. Donations and the spread of the Union can also raise it.\n\nWe are at war with Rome. Petitions and donations are suspended."
 rip_uc_curia.1.no_rome:0 "Our eastern hierarchy remains in communion with Rome. Church authority is shown in the Religion tab; spending it reduces its benefits.\n\nOnce the See of the Union is established, six petitions are available in Decisions. Each costs 25 authority, 2 prestige and a treasury fee, and lasts twenty years. We may maintain one petition or synod article at a time. Petitions require peace with Rome, Roman opinion +25 and stability 0.\n\nStable communion can raise authority by 2 every two years; war with Rome, its absence or unity below 70% costs 2 instead. Donations and the spread of the Union can also raise it.\n\nThe Papal State does not exist. Petitions and donations are suspended."
 rip_uc_curia_church_tax:0 "Curial Sanction for Church Taxes"
 rip_uc_curia_church_tax_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
 rip_uc_curia_blessing:0 "Blessing of the Curia"
 rip_uc_curia_blessing_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
 rip_uc_curia_indulgence:0 "Curial Indulgence"
 rip_uc_curia_indulgence_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
 rip_uc_curia_usury:0 "Curial Dispensation on Usury"
 rip_uc_curia_usury_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
 rip_uc_curia_legate:0 "Legate to the Union"
 rip_uc_curia_legate_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
 rip_uc_curia_holy_war:0 "Curial Sanction for War"
 rip_uc_curia_holy_war_desc:0 "A twenty-year concession to our church from Rome. It occupies our single petition or synod benefit."
