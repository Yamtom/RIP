l_english:
 khmelnytsky_uprising_title:0 "Khmelnytsky Uprising"
 khmelnytsky_uprising_desc:0 "The great Cossack rebellion against Polish-Lithuanian rule has erupted. Led by the hetman Bohdan Khmelnytsky, masses of Cossacks, peasants, and Tatars have risen in arms, devastating vast swathes of Ukrainian territory. Cities burn, entire communities are slaughtered, and the very foundations of Polish authority crumble before the insurgent tide."







 khmelnytsky_revolt_active_desc:0 "The Cossack rebellion continues to rage, spreading unrest and destabilization throughout our realm."

 khmelnytsky_military_response_desc:0 "We have mobilized our forces to suppress the rebel insurgency, though at great cost to our military capacity."

 khmelnytsky_concessions_desc:0 "We have made concessions to the Cossack demands, easing tensions and reducing unrest at the cost of surrendering some authority."

 khmelnytsky_moscow_support_desc:0 "We have accepted Muscovite assistance against the rebels, gaining military strength while becoming dependent on the tsar's will."






 orthodox_brotherhoods_desc:0 "Lay brotherhoods maintain schools and presses, strengthening education and the Orthodox faith."
 jesuit_missions_supported_desc:0 "Jesuit missions expand with state backing, improving conversion while raising local tensions."
 jesuit_missions_restrained_desc:0 "The missions are restrained to reduce unrest and preserve local peace."
 defenders_of_orthodoxy_desc:0 "Cossack zeal protects Orthodox institutions and bolsters military morale."
 church_property_restored_desc:0 "Disputed church lands are restored to calm the Orthodox population, at fiscal cost."
 church_property_conflict_desc:0 "Confiscations enrich the crown but inflame religious tensions."

 khmelnytsky_events.7.t:0 "The Crown Presses the Union"
 khmelnytsky_events.7.d:0 "Game model. At Brest in 1596 the bishops signed the union and the crown lent it patronage. [Root.GetName] weighs a harder course all the same.\n\nThe chancery can order one Orthodox province of Ruthenia over to the union: it changes rite and takes +3 unrest and +5% autonomy, the whole realm carries +1 unrest and -1 tolerance of heretics for twenty years, and Orthodox neighbours and subjects begin to feel the pressure. Or the crown can leave the union to patronage: no province changes, prestige falls by 5, and for twenty years unrest is 1 lower and tolerance of heretics 1 higher, though the pressure on the neighbours is felt just the same.\n\nEither way the crown has taken a side, and the Orthodox will remember which."
 khmelnytsky_events.7.a:0 "Order the union in one province."
 khmelnytsky_events.7.b:0 "Leave it to patronage."
 union_of_brest_enforced:0 "Union Pressed by Royal Order"
 desc_union_of_brest_enforced:0 "The crown ordered a province over to the union instead of leaving it to the bishops, and the Orthodox have not forgotten it. Game model."
 union_of_brest_compromise:0 "Union Left to Patronage"
 desc_union_of_brest_compromise:0 "The crown kept to patronage and ordered no province over. The Orthodox noticed. Game model."
