 # --- Chernihiv and the Siverian lands ---
 chr_baroque_capital:0 "Baroque Capital"
 chr_baroque_glory:0 "Cossack Baroque"
 chr_bunchuk_tovaryshi:0 "Bunchuk Companions"
 chr_cherhiniv_collegium:0 "The Chernihiv Collegium"
 chr_ottoman_protection_turmoil:0 "Turmoil under Ottoman Protection"
 chr_siverian_law_codified:0 "The Siverian Statute"
 chr_siversk_sloboda_frontier_title:0 "Siversk Frontier"
 chr_siversk_sloboda_frontier_desc:0 "The upper Siversk borderland around Rylsk and Sloboda Ukraine stood as the frontier gateway between Chernihiv's Desna core and the southern steppes. Securing these marches fortifies our eastern horizon and opens the long steppe road toward the Don estuary."
 chr_tmutarakan_inheritance_title:0 "Tmutorokan Heritage"
 chr_tmutarakan_inheritance_desc:0 "Mstyslav Volodymyrovych held both Tmutorokan and Chernihiv. A generation later, Prince Sviatoslav of Chernihiv entrusted Tmutorokan to his son Hlib. If we secure the shores of Azov and the strait, we can reopen that southern route and replace Tana's slave market with a grain market."
 chr_tmutarakan_principality:0 "Principality of Tmutorokan"
 desc_chr_tmutarakan_principality:0 "The restored Chernihiv citadel on the Taman strait commands shipping between the Sea of Azov and the Black Sea."
