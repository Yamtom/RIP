 rip_gov_kru_title:0 "§YRada of Three Estates§!"
 rip_gov_kru_title_tt:0 "The States General bar (Res Publica or Winds of Change) shows the two blocs that lead the rada: the bloc that is SECOND by influence stands on the LEFT, the dominant bloc - the faction in power - on the RIGHT. The third bloc is the opposition and is not on the bar.\nWhen the pair changes, the rada swaps to the reform that has it: six reform ids, one government called Rada of Three Estates.\nThe bar is centred while the leader has under 50 influence and moves right by a quarter, a half and three quarters at 50, 55 and 60; the bloc on the side in power gives its floor modifiers. The leader also keeps the vanilla faction-in-power modifier. The runner-up keeps a junior voice from 38 influence.\nThe record refreshes every month and after every court ability. Without Res Publica or Winds of Change the pair, the faction panel and the abilities work, but there is no bar."
 rip_gov_kru_leader:0 "Right (leads): [Root.RipGovRadaLeader]"
