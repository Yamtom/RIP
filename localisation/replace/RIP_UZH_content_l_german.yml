l_german:
 # Tag-scoped replacement fallback (german): owner=UZH, entity=content.
 danubian_monarchy_influence:0 "Danubian Ascendancy"
 desc_danubian_monarchy_influence:0 "This country draws authority from a durable Danubian settlement, reinforcing its institutions and keeping the provinces tranquil."
 desc_hungarian_integration_zeal:0 "This province is experiencing a surge of integration and cooperation with the Hungarian population, bringing calmer streets and busier workshops."
 desc_uz_administrative_efficiency:0 "New administrative systems teach our scribes to clear petitions swiftly and keep the realm attentive."
 desc_uz_advisor_pool:0 "Hungarian support has provided us with skilled administrators and advisors."
 desc_uz_agricultural_development:0 "Agricultural improvements have left the fields heavier with harvest and villages flush with grain."
 desc_uz_ambitious_expansion_modifier:0 "Diplomats across Ruthenia are tasked with weaving new subject alliances into a single crown."
 desc_uz_amnesty_rollout:0 "County notaries commute sentences and remit salt arrears, buying uneasy calm at the cost of leaner tax rolls."
 desc_uz_backa_colonial_network:0 "Rusyn guilds and settlers weave a lattice of depots and ferries across the Bácska plain, pushing our wares deep into the Danube basin."
 desc_uz_banat_border_colonies:0 "Borderer colonies on the Maros stand ready to reinforce the line at a moment's notice."
 desc_uz_banat_colonists:0 "Settlement charters establish productive farms and households liable for local military service: +10% production efficiency, +10% national manpower and -10% development cost."
 desc_uz_basilian_monasteries:0 "Basilian monastic communities have strengthened religious life."
 desc_uz_border_dynasty_network:0 "Accredited envoys and marriage brokers knit the frontier estates into a patronage network, boosting our diplomatic standing across the marches."
 desc_uz_border_guard_union:0 "A confederation of garrisons and veteran bands patrols the frontier, ready to respond to any incursion."
 desc_uz_carpathian_commonwealth:0 "Our loyal subjects sit on federated councils, easing their liberty desire while delivering resources to Huszt."
 desc_uz_carpathian_federation:0 "The Carpathian Federation unites Rusyn and neighboring estates in a composite settlement of chartered provinces and accepted peoples."
 desc_uz_carpathian_federation_diprep:0 "A dedicated corps of envoys tends to the republic's palatine partners, soothing rivalries while we grow."
 desc_uz_carpathian_hegemony:0 "Watchtowers crown each pass and border hosts answer our summons, so every estate from Maramaros to the Tysa now bows to Huszt's seal."
 desc_uz_carpathian_vineyards:0 "Terraced vineyards and guild presses lift the tax rolls of every mountain town still loyal to Huszt."
 desc_uz_cathedral_guild_college:0 "Scholar-burghers endow bursaries in our cathedral town, training jurists, translators, and guild secretaries for the chancery."
 desc_uz_coal_export_charters:0 "Counting houses hold chartered rights to ship Carpathian ironware, timber, and mineral cargoes drawn from the realm's wider mines across the passes."
 desc_uz_coal_foundry_network:0 "Mountain ironworks and water-powered forges coordinate charcoal, local iron ore, and coal hauled from neighboring coalfields to cast tools and ordnance under crown oversight."
 desc_uz_colonist_hamlets:0 "New hamlets spread our statutes and enrich the local tax rolls."
 desc_uz_colonization_banat:0 "Stockaded farms along the Maros guard our flank while drilling settlers in frontier warcraft."
 desc_uz_colonization_cooldown:0 "The chancery is still accounting for the last colonization wave; fresh petitions must wait."
 desc_uz_colonization_homeward:0 "Carpathian valleys fill with loyal households who thicken our levy rolls and embrace our culture."
 desc_uz_colonization_pannonia:0 "Caravans and colonists reclaim the Alföld under Huszt statutes, turning Tysa towns into bustling markets."
 desc_uz_congress_border_drill:0 "Joint regiments from every Carpathian pass drill together, exchanging manuals and seasoned officers to keep the marches sharp."
 desc_uz_congress_subject_charters:0 "The Carpathian Congress codifies new liberties for our vassals, coaxing their treasuries open while their loyalty hardens into habit."
 desc_uz_constitutional_system:0 "Constitutional governance has provided stability and widespread esteem to our rule."
 desc_uz_crown_of_saint_stephen:0 "The institutions of Saint Stephen's realm lend authority and reformist momentum to our Carpathian settlement."
 desc_uz_cultural_renaissance:0 "Our people are experiencing a revival of Rusin culture and traditions."
 desc_uz_danube_consortium:0 "Guild factors coordinate river convoys and boost the output of our market towns."
 desc_uz_danube_exchange:0 "Marketplace syndics along the Danube manage tolls and storage, boosting Huszt’s take from every convoy."
 desc_uz_danube_trade_league:0 "Merchants from Vienna to Belgrade recognize Huszt's tribunals and remit dues to our chambers."
 desc_uz_dual_monarchy_administration:0 "Shared councils and harmonized taxes tie together the Rusyn march and the Hungarian heartland."
 desc_uz_duchnovych_awakening:0 "Reading rooms and singing societies spread literacy, thrift, and the conviction that [Root.GetUZHIdentityCultureAdjective] custom deserves its own print."
 desc_uz_early_industrialization:0 "Chartered watermills, saltworks, and mountain foundries enrich our craft guilds and treasuries."
 desc_uz_factory_consortiums:0 "Merchants pool capital into manufactories, raising new workshops without beggaring themselves and wringing more work from guild halls."
 desc_uz_federal_structure:0 "Federal organization has accommodated diverse communities while maintaining central authority."
 desc_uz_federative_statutes_autonomy:0 "Codified renewal cycles remind each march when to cede privileges, keeping the federated realm obedient without heavy-handed decrees."
 desc_uz_federative_statutes_capacity:0 "A federal census bureau expands our registers, easing the weight of governance while subject capitulations stay loyal."
 desc_uz_frontier_charters:0 "Settler towns along the frontier enjoy guaranteed rights and obligations, improving diplomacy and commerce with our neighbors."
 desc_uz_frontier_expansion:0 "Expansion into frontier territories has opened new tracts for settlement and enterprise."
 desc_uz_granichar_command:0 "Veteran frontier captains oversee mixed regiments, drilling musket volleys that stiffen the line while keeping payrolls lean."
 desc_uz_granichar_loyalty:0 "Subject contingents swear new oaths at Palanok, knitting their levies into our frontier corps and easing worries about distant crowns."
 desc_uz_greek_catholic_concord:0 "Rome recognizes our Basilian fathers while letting their chant resound in Slavonic, giving Uzhhorod leverage at both altar and court."
 desc_uz_habsburg_border_command:0 "Imperial engineers buttress our passes, staffing Palanok with loyal garrisons and winning favor in Vienna."
 desc_uz_habsburg_resistance:0 "Our resistance to Habsburg expansion has strengthened military resolve and national unity."
 desc_uz_identity_consolidated:0 "The estates have endorsed a single Rusyn program, letting decrees glide through the chancery while calming dissent."
 desc_uz_karloca_synod_blessing:0 "Departing from the historic jurisdiction of Serbian Orthodox Karlovci and the later Eparchy of Krizevci, clergy from the Karlóca synod preach allegiance to Khust's own state-rite hierarchy."
 desc_uz_komitat_administration:0 "The komitat system now coordinates magistrates across our territories, letting decrees flow smoothly from castle to village."
 desc_uz_kuruc_border_raids:0 "Kuruc captains harry imperial posts and draw restless youths into their camps, lifting spirits but unsettling the countryside."
 desc_uz_kyivan_legacy:0 "Our connection to the ancient Kyivan heritage strengthens our diplomatic standing and the esteem we enjoy among Ruthenian peoples."
 desc_uz_language_decree:0 "Government stipends pay for bilingual clerks, sparing coin when convincing towns to adopt our chosen custom tongue."
 desc_uz_linguistic_development:0 "Cultivating the Rusyn language has strengthened who we are and taught clerks to govern in our own tongue."
 desc_uz_magyarization_drive:0 "County inspectors enforce Magyar schooling and administration, speeding assimilation at the cost of unrest and foreign trust."
 desc_uz_mountain_gendarmerie:0 "Palanok’s watchtowers drill new gendarmes, stiffening our frontier regiments even as they siphon labour from the workshops."
 desc_uz_mukachevo_privileges:0 "Special privileges granted to our capital have increased its prosperity and importance."
 desc_uz_old_rite_resilience:0 "The brotherhoods guard the Orthodox liturgy, making it easier to keep monasteries staffed and incense burning."
 desc_uz_opryshky_pacified:0 "The opryshky fraternities now watch the ridgelines for us, uniting their knowledge of mountain trails with regular march discipline."
 desc_uz_opryshky_raids:0 "Band pikes and torches harass our caravans, driving up insurance on the salt roads while fear haunts the market stalls."
 desc_uz_opryshok_raiders:0 "Mountain bands move light and fast, bleeding foes through raids and attrition."
 desc_uz_orthodox_defender:0 "As champions of Orthodox Christianity, we inspire greater devotion among the faithful and command respect from other Orthodox nations."
 desc_uz_orthodox_metropolis:0 "Rather than answering to the Serbian Orthodox see of Karlovci or the Eparchy of Krizevci, this city houses a state-rite metropolitanate subordinate to Khust."
 desc_uz_orthodox_revival:0 "This province is experiencing a revival of the realm's Ruthenian religious tradition."
 desc_uz_palank_border_watch:0 "The palanok watch chain drills each marcher company to rotate between the passes, lightening the strain on the treasury while keeping the frontier vigilant."
 desc_uz_palatial_chambers:0 "Subject envoys sit in the palatine chambers, smoothing debate negotiations and nudging petitions through with practiced ease."
 desc_uz_pan_ruthenian_union:0 "The Huszt congress now steers Ruthenian estates across the Dnieper through oaths of common defense and codified liberties."
 desc_uz_pannonian_autonomy:0 "Autonomous governance has strengthened our local institutions and eased rule across the plains."
 desc_uz_pannonian_blockhouses:0 "Blockhouses and watchposts secure the Alföld, keeping musters ready and frontier folk at ease."
 desc_uz_pannonian_charters:0 "Mercantile communes along the Danube enjoy privileged charters that fatten customs chests and set workshops humming."
 desc_uz_pannonian_drive:0 "Veteran captains tighten our command of the Alföld, keeping levy rosters orderly and confidence high along the frontier."
 desc_uz_pannonian_league:0 "Civic councils across the plains coordinate taxation, representation, and mutual aid for the [Root.GetUZHIdentityCultureAdjective] realm."
 desc_uz_pannonian_settlement:0 "Large-scale migration has established Rusyn communities across the Pannonian plains."
 desc_uz_pressburg_compact:0 "The estates of Pressburg have codified our march's privileges through diplomacy or regional sovereignty."
 desc_uz_private_salt_leases:0 "Burgher consortia hold exclusive leases on the Solotvyno pits, promising high output in exchange for generous tax lenience."
 desc_uz_protected_frontier:0 "Our eastern borders are well fortified against potential invasions."
 desc_uz_rebel_legends:0 "Ballads of Dovbush and Pyntya echo from tavern to parish, easing unrest as subjects embrace a shared mountain lore."
 desc_uz_riverine_granaries:0 "New granaries along the Tysa and Latorytsia keep our levies fed and our markets supplied year-round."
 desc_uz_rusin_aristocracy:0 "A native Rusyn nobility has strengthened our administrative and military capabilities."
 desc_uz_rusin_enlightenment:0 "New schools and salons have awakened our people's minds."
 desc_uz_rusin_national_awakening:0 "A flowering of parish schools, courts, and letters has united the Carpathian estates under common Rusyn law."
 desc_uz_rusin_settlement:0 "Rusyn settler households hold chartered communal privileges in Bácska under an accord with the landholder, keeping their parishes, schools, and local autonomy."
 desc_uz_rusyn_autonomy:0 "The country enjoys a period of [Root.GetUZHIdentityCultureAdjective] autonomy, fostering local traditions and self-governance."
 desc_uz_rusyn_self_governance:0 "Our autonomous governance system allows for better integration of diverse cultures while maintaining local traditions."
 desc_uz_ruthenian_awakening:0 "Chancery letters and brotherhood presses revive the ancient Ruthenian name across our mountain counties."
 desc_uz_ruthenian_legacy:0 "Our connection to the great Kyivan Rus' strengthens our right to rule and custom and speech."
 desc_uz_salt_chamber_overwatch:0 "A royal accountant watches every wagon leaving Solotvyno, tightening marginal profits and keeping the salt sold under crown seal."
 desc_uz_salt_corridor_convoys:0 "Scheduled caravans and river barges knit the Tysa and Danube together, expanding caravan power and the volume of exports crossing our toll houses."
 desc_uz_salt_corridor_depots:0 "Customs clerks tally every barrel in stone-lined depots, letting guilds reinvest faster while surveyors spread new extraction methods through the marches."
 desc_uz_serdyuk_guard:0 "Seasoned Hajduk foot companies garrison the march, sparing the treasury while anchoring our line with disciplined musket volleys."
 desc_uz_slavo_rusyn_identity:0 "Town councils prize the march's communal liberties, stirring Rusyn pride while linking mountain communes."
 desc_uz_solotvyno_chambers:0 "The salt caverns of Solotvyno are braced with new timberwork and watchtowers, letting brine flow steadily to the pans."
 desc_uz_solotvynska_camera:0 "Revised camera ledgers steady the salt duties, keep prices from boiling over, and push more goods through our crown depots."
 desc_uz_sovereign_rusin_state:0 "The establishment of a sovereign Rusyn state has fulfilled our people's greatest aspirations."
 desc_uz_statute_codification:0 "The Huszt tables have copied every charter into a single statute book, letting county jurats govern with confidence."
 desc_uz_tisza_customs_convention:0 "Unified tariffs along the Upper Tisza grant us stronger trade pull, richer convoys, and an extra merchant while the agreement holds."
 desc_uz_tisza_customs_depot:0 "Customs clerks reconcile ledgers at the riverfront, drawing more merchants, swelling warehouse stocks, and speeding fresh ideas along the quays."
 desc_uz_trade_prosperity:0 "Thriving trade networks have brought wealth and commercial opportunities."
 desc_uz_uhro_rusyn_identity:0 "Hungarian charters merge with Rusyn rites, letting Palanok broker loyalty between the crown of St. Stephen and the march."
 desc_uz_uhro_rusyn_integration:0 "The integration of Uhro-Rusyn custom has strengthened the bonds between the Rusyn and Hungarian peoples, fostering cooperation and unity."
 desc_uz_uhro_rusyn_synthesis:0 "Rusyn parish customs and Hungarian komitat liberties stand woven into a shared frontier constitution."
 desc_uz_ukraino_rusyn_identity:0 "Clergy and nobles present Huszt as heir to Kyivan law, courting Ruthenian allies without surrendering march autonomy."
 desc_uz_union_compromise_plus:0 "Synodal grants keep theologians drafting conciliatory treatises, letting councils adopt fresh ideas without draining the treasury."
 desc_uz_unique_host_cooldown:0 "Captains and communes are still reordering billets after the latest muster."
 desc_ZAKARPATTIA_CULTURAL_MOSAIC:0 "Rusyn parishes, Magyar counties, and Saxon burghers share a chartered commons, nurturing schools that teach in Latin by day and sing in Church Slavonic at vespers."
 desc_ZAKARPATTIA_FRONTIER_GUARD:0 "Border cavaliers drill alongside Palanok's garrison, keeping smugglers in check and warning the Diet whenever imperial agents cross the passes."
 desc_ZAKARPATTIA_TRADE_NETWORK:0 "Salt caravans from Solotvyno and wine barges from Tokaj converge at Uzhhorod, filling the toll coffers while guildsmen weave new partnerships with Danubian markets."
 expand_into_transylvania_desc:0 "The rich lands of Transylvania would provide us with resources and strategic depth."
 expand_into_transylvania_title:0 "Expand into Transylvania"
 found_maramures_capital_desc:0 "Establishing a strong capital in Maramures will solidify our rule in the region."
 found_maramures_capital_title:0 "Found Maramures Capital"
 great_hauptmann_reform:0 "Great Hauptmann"
 great_hauptmann_reform_desc:0 "The Great Hauptmann is the elected leader of the Ruthenian and Cossack states, who has the authority to claim new lands and enact administrative policies."
