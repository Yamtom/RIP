 partia_kapitaniv:0 "Captains' Party"
 partia_kapitaniv_desc:0 "Frontier officers and sotnia colonels demand fortified marches, hardened levies, and vigilant patrols to hold the Tysa line. Victories over equal foes, the arsenal at Palanok and the border dynasty pact raise their standing."
 partia_kapitaniv_MECHANIC_TOOLTIP:0 "Captains' Party"
 partia_soymu:0 "Sejm Party"
 partia_soymu_desc:0 "Mercantile magnates and guild elders champion river tolls, brokerage rights, and pragmatic diplomacy across the captaincy. The town wharf, the salt corridors and a seated diet raise their standing."
 partia_soymu_MECHANIC_TOOLTIP:0 "Sejm Party"
 partisan_tradition:0 "Partisan Tradition"
 partisan_tradition_desc:0 "Forest guerrilla warfare is deeply embedded in Belarusian culture. Our partisan expertise makes occupation nearly impossible for foreign powers."
 patriarch_engagement_reform:0 "Blessing of the Patriarch"
 patriarch_engagement_reform_desc:0 "A ruler's claim to the throne rests on God's favour, confirmed by the Patriarch. The crown must secure the Church's assent before taking power."
