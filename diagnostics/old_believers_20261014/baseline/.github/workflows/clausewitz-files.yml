name: clausewitz-files
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # BOM in .gfx/.gui/.txt/.mod, unbalanced braces, split localisation values.
      - run: python tests/check_clausewitz_braces.py
