 kru_knyazi_boyary_balance:0 "Knyazi-Boyary Balance"
 kru_knyazi_boyary_balance_desc:0 "0-39 favours the Knyazi: +0.5 diplomatic reputation and +5% vassal income. 61-100 favours the Boyary: +5% tax and -5% advisor cost. If one faction has at least 60 influence while the other is below 60, the balance moves 0.25 per month toward the stronger side. At either end, 6 influence shifts to the winning faction and the balance returns to 50."
 kru_boyary_starshyna_balance:0 "Boyary-Starshyna Balance"
 kru_boyary_starshyna_balance_desc:0 "0-39 favours the Boyary: -5% stability cost and +5% trade efficiency. 61-100 favours the Starshyna: +10% manpower recovery and +2.5% land morale. If one faction has at least 60 influence while the other is below 60, the balance moves 0.25 per month toward the stronger side. At either end, 6 influence shifts to the winning faction and the balance returns to 50."
 kru_knyazi_starshyna_balance:0 "Knyazi-Starshyna Balance"
 kru_knyazi_starshyna_balance_desc:0 "0-39 favours the Knyazi: +0.5 legitimacy and +5% vassal force limit. 61-100 favours the Starshyna: +1% discipline and -5% land maintenance. If one faction has at least 60 influence while the other is below 60, the balance moves 0.25 per month toward the stronger side. At either end, 6 influence shifts to the winning faction and the balance returns to 50."
 ruthenian_factional_empire_reform:0 "Rada of Three Estates"
 ruthenian_factional_empire_reform_desc:0 "Princes, boyars and Cossack officers compete in one rada. The leading faction provides its full modifiers; other blocs with at least 38 influence retain a junior voice. The ruling coalition changes through faction influence, not by selecting a separate reform."
 ruthenian_factional_empire_princes_hetmans_reform:0 "Rada of Three Estates"
 ruthenian_factional_empire_princes_hetmans_reform_desc:0 "Princes, boyars and Cossack officers compete in one rada. The leading faction provides its full modifiers; other blocs with at least 38 influence retain a junior voice. The ruling coalition changes through faction influence, not by selecting a separate reform."
 ruthenian_factional_empire_boyars_hetmans_reform:0 "Rada of Three Estates"
 ruthenian_factional_empire_boyars_hetmans_reform_desc:0 "Princes, boyars and Cossack officers compete in one rada. The leading faction provides its full modifiers; other blocs with at least 38 influence retain a junior voice. The ruling coalition changes through faction influence, not by selecting a separate reform."
