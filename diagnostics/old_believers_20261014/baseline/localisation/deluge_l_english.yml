l_english:

 # ==========================================================================
 # THE DELUGE, 1655-1660
 # ==========================================================================

 deluge.1.t:0 "The Northern Storm"
 deluge.1.d:0 "The Swedish army crossed from Pomerania and the levy of Wielkopolska did not fight it - the palatines rode out to Ujscie and swore to Charles Gustavus on the spot. Warsaw is taken, Krakow invested, and the king has gone over the Silesian border with what is left of his court. The chancery still writes as though a realm exists to govern."
 deluge.1.a:0 "Hold every front and yield nothing"
 deluge.1.b:0 "Buy off one enemy while we can still pay"

 deluge.2.t:0 "The Union of Kedainiai"
 deluge.2.d:0 "Prince Radziwill has signed at Kedainiai: Lithuania passes under the protection of the Swedish crown, and the union with Poland is declared dissolved. He argues that a province with no army left must find a protector, and that Vilnius burned while Warsaw debated. Half the Lithuanian nobility has set its seal beside his."
 deluge.2.a:0 "A province with no army must find a protector"
 deluge.2.b:0 "Strike his name from the register of the nobility"

 deluge.3.t:0 "Three Crowns Bid for the Host"
 deluge.3.d:0 "The Commonwealth is on its knees, and every envoy in Europe knows where the Host's regiments are. Stockholm proposes a northern league and speaks of a Ruthenian principality guaranteed by Swedish arms. Moscow reminds us, coldly, of the oath at Pereiaslav. Transylvania offers a share in whatever is carved up. For one season the Host is courted rather than commanded - and such seasons are short."
 deluge.3.a:0 "Take the Swedish league"
 deluge.3.b:0 "The oath at Pereiaslav holds"
 deluge.3.c:0 "Treat with all of them and bind ourselves to none"

 deluge.4.t:0 "The Treaty of Radnot"
 deluge.4.d:0 "The compact is drawn: Sweden takes the north, Brandenburg Wielkopolska, Rakoczi the crown itself, and the Host the Ruthenian palatinates from the Dniester to the Berezina. It is the first document in which a foreign power writes our borders as though they were already a country. Rakoczi asks for regiments to march with him into Poland."
 deluge.4.a:0 "Send the regiments south"
 deluge.4.b:0 "Set our seal to it and keep the Host at home"

 deluge.5.t:0 "The Tide Turns"
 deluge.5.d:0 "The Swedes failed before the monastery at Jasna Gora, and the story has done what no edict could: the peasantry that shrugged at the invasion is now cutting off foraging parties in every wood. The king has returned and swears at Lviv to protect the commons and to hold the realm under the Virgin's patronage. The confederates are gathering at Tyszowce."
 deluge.5.a:0 "Swear the oath at Lviv"
 deluge.5.b:0 "Vows will not clear a province - soldiers will"

 deluge.6.t:0 "The Peace of Oliva"
 deluge.6.d:0 "The Swedes are gone and the crown has kept its title, but Livonia is signed away, the treasury is a memory, and whole palatinates will not pay a groat for a generation. The nobles who bent the knee at Ujscie and Kedainiai are pardoned - there are too many of them to punish. What survived the flood is a realm the magnates now own outright."
 deluge.6.a:0 "The realm stands, diminished"

 # --- modifiers ------------------------------------------------------------

 deluge_the_flood:0 "The Deluge"
 desc_deluge_the_flood:0 "Armies quarter where they please and the palatinates pay whoever is nearest."
 deluge_kedainiai:0 "The Union of Kedainiai"
 desc_deluge_kedainiai:0 "Lithuania has a Swedish protector and the magnates who arranged it are content."
 deluge_magnate_attainder:0 "Attainder of the Magnates"
 desc_deluge_magnate_attainder:0 "The crown struck their names from the register. The remaining houses took note."
 deluge_northern_league:0 "The Northern League"
 desc_deluge_northern_league:0 "The Host marches in Swedish company, and Europe treats with it as a power."
 deluge_tsars_shadow:0 "The Tsar's Shadow"
 desc_deluge_tsars_shadow:0 "The oath at Pereiaslav was kept. Moscow remembers it, and expects it kept again."
 deluge_hetmans_double_game:0 "The Hetman's Double Game"
 desc_deluge_hetmans_double_game:0 "Envoys leave for three capitals with three different letters, and the chancery keeps no copies."
 deluge_radnot_partition:0 "The Radnot Compact"
 desc_deluge_radnot_partition:0 "Our borders were written into a foreign treaty. The regiments marched to make it true."
 deluge_signed_not_marched:0 "Signed, Not Marched"
 desc_deluge_signed_not_marched:0 "We set our seal to the partition and kept the regiments at home. The allies noticed."
 deluge_lviv_oath:0 "The Lviv Oath"
 desc_deluge_lviv_oath:0 "The king swore protection of the commons under the Virgin's patronage, and the realm answered."
 deluge_soldiers_peace:0 "A Soldiers' Peace"
 desc_deluge_soldiers_peace:0 "The provinces were cleared by regiments rather than by vows, and the army knows it."
 deluge_eastern_misgivings:0 "Eastern Misgivings"
 desc_deluge_eastern_misgivings:0 "The oath named a Catholic crown as the realm's protector. The Orthodox parishes heard it that way too."
 deluge_after_the_flood:0 "After the Flood"
 desc_deluge_after_the_flood:0 "The realm survived. The treasury, the Livonian ports and the crown's authority over the magnates did not."

 # --- opinion modifiers ----------------------------------------------------

 deluge_league_partner:0 "Stood with us in the northern league"
 deluge_broke_faith:0 "Broke faith during the Deluge"
 deluge_kept_faith:0 "Kept faith during the Deluge"
