l_english:
 rip_rus_kyiv_scribes_title:0 "Kyivan Scribes"
 rip_rus_kyiv_scribes_desc:0 "Arrange for scribes from Kyiv to visit our court. An agreement with the ruler of Kyiv can secure passage for their manuscripts."
 rip_rus_copy_ruthenian_books_title:0 "The Copyists' Room"
 rip_rus_copy_ruthenian_books_desc:0 "Set aside a room for copyists at a church in the capital. Contacts in Lviv or Volhynia can supply Ruthenian manuscripts for their desks."
 rip_rus_ruthenian_press_title:0 "A Ruthenian Press"
 rip_rus_ruthenian_press_desc:0 "Bring the copyists and printers together in the capital. With presses in use and the route to Kyiv open, books can reach more readers than a scribe could serve alone."
 rip_rus_kyiv_scribes_alt_title:0 "$rip_rus_kyiv_scribes_title$"
 rip_rus_kyiv_scribes_alt_desc:0 "$rip_rus_kyiv_scribes_desc$"
 rip_rus_copy_ruthenian_books_alt_title:0 "$rip_rus_copy_ruthenian_books_title$"
 rip_rus_copy_ruthenian_books_alt_desc:0 "$rip_rus_copy_ruthenian_books_desc$"
 rip_rus_ruthenian_press_alt_title:0 "$rip_rus_ruthenian_press_title$"
 rip_rus_ruthenian_press_alt_desc:0 "$rip_rus_ruthenian_press_desc$"
 rip_pol_carpathian_passes_title:0 "Carpathian Passes"
 rip_pol_carpathian_passes_desc:0 "Secure passage between Halych and Maramaros so that Rusyn traders can bring salt and livestock over the mountains."
 rip_pol_rusyn_fairs_title:0 "Rusyn Fairs"
 rip_pol_rusyn_fairs_desc:0 "Equip the markets of Halych and Peremyshl to receive the caravans. Traders coming down from the passes need stalls, scales and storehouses."
 rip_pol_lviv_charters_title:0 "Lviv Charters"
 rip_pol_lviv_charters_desc:0 "Confirm the tolls and trading rights of the mountain merchants in Lviv. A charter issued in a prosperous city can carry weight on both sides of the passes."
 rip_tat_ruthenian_yarlyks_title:0 "Ruthenian Yarlyks"
 rip_tat_ruthenian_yarlyks_desc:0 "Princes of Rus' once rode to Sarai for the charters that confirmed their thrones, and paid for them. Hold the Ruthenian lands, or hold their princes as subjects, and the same bargain can be struck again."
 rip_tat_ruthenian_yarlyks_classic_title:0 "$rip_tat_ruthenian_yarlyks_title$"
 rip_tat_ruthenian_yarlyks_classic_desc:0 "$rip_tat_ruthenian_yarlyks_desc$"
 rip_tat_ruthenian_tribute:0 "Ruthenian Tribute"
 desc_rip_tat_ruthenian_tribute:0 "Tribute and charter fees from the Ruthenian lands fill the treasury and raise our standing."
 rip_hab_galician_ruthenians_title:0 "Galician Ruthenians"
 rip_hab_galician_ruthenians_desc:0 "The eastern-rite parishes of Red Ruthenia now answer to Vienna. Their priests need schools, their bishops need a hearing, and a monarchy that wants the villages' loyalty has to meet them in their own church."
 rip_hab_ruthenian_clergy:0 "Ruthenian Clergy"
 desc_rip_hab_ruthenian_clergy:0 "Eastern-rite priests educated in the monarchy's seminaries carry the Crown's authority into the Ruthenian villages."
 rip_hab_galician_ruthenians_classic_title:0 "$rip_hab_galician_ruthenians_title$"
 rip_hab_galician_ruthenians_classic_desc:0 "$rip_hab_galician_ruthenians_desc$"
