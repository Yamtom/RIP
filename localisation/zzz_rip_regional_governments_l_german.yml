 rip_rg_confirm:0 "Confirm the Ordinance"
 rip_rg_select_desc:0 "Choose the exact land. Nothing is charged until confirmation. The final order checks ownership, control, government, resources and the shared term again."
 rip_rg_confirm_desc:0 "Target: §Y[rip_rg_target.GetName]§!. The option tooltip lists the complete payment and effects. Cancellation is free. An order already in force closes every other ordinance of this institution."
 rip_rg_term_tt:0 "This institution has no order serving its shared term. Hover the active country modifier for its expiry date."
 rip_rg_grain_req_tt:0 "At least 10 development in controlled regional grain lands."
 rip_rg_second:0 "Extend the Order to Another Town"
 rip_rg_second_desc:0 "The Town Union may extend the order to one different town for 25 power. Neither the national effect nor the shared term is renewed. Declining is free."
 rip_rg_chr_term:0 "CHR Shared Ordinance Term"
