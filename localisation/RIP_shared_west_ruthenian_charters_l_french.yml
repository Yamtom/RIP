 wr_west_ruthenian_distinctiveness:0 "Registres chanceliers et paroissiaux distincts"
 desc_wr_west_ruthenian_distinctiveness:0 "Tribunaux locaux, villes de Magdebourg et scriptoria conservent actes municipaux, testaments et homélies vernaculaires à l'écart de l'usage des prikazy moscovites."
 wr_chancery_prosta_mova_tradition:0 "Chancellerie vernaculaire à charte"
 desc_wr_chancery_prosta_mova_tradition:0 "Dans la tradition de la prosta mova grand-ducale, du tournant vernaculaire de Peresopnytsia et des homélies carpatiques, les scribes protègent un registre juridique et littéraire propre."
 wr_west_ruthenian_commonwealth:0 "Sphère culturelle ruthène séparée"
 desc_wr_west_ruthenian_commonwealth:0 "Imprimeries, statuts juridiques et académies de confréries ancrent Biélorusses (bielaruski), Ruthènes (ruskyi) et Rusnaks (rusnacky) dans un groupe ruthène distinct hors de l'orbite moscovite."
 wr_west_ruthenian_statute_autonomy:0 "Autonomie statutaire et stauropégique"
 desc_wr_west_ruthenian_statute_autonomy:0 "Inspirés par les Statuts grand-ducaux, les garanties provinciales de 1569 pour l'écriture ruthène à Kyiv, en Volhynie et en Bratslav, et le ius Valachicum carpatique, les ordres défendent leur espace juridique."
 wr_west_slavic_cultural_affinity:0 "Orbite civique slave occidentale partagée"
 desc_wr_west_slavic_cultural_affinity:0 "Magistratures bilingues, congrégations universitaires à Kraków et Prague et chartes urbaines rapprochent les ordres des voisins polonais, tchèques et slovaques."
 wr_west_slavic_shared_script_space:0 "Réseau bilingue d'imprimerie et de droit"
 desc_wr_west_slavic_shared_script_space:0 "Libraires, séminaires et diétines nobiliaires diffusent gloses latines, actes en lacinka et éditions de Kraków et Trnava au-delà des frontières paroissiales."
 wr_west_slavic_synthesis:0 "Synthèse civique slave occidentale"
 desc_wr_west_slavic_synthesis:0 "À l'image des marches linguistiques de Lusace, de Silésie et de Slovaquie orientale, les institutions achèvent un rare passage vers la famille slave occidentale."
 wr_traditionalist_backlash:0 "Protestation monastique et boyarde"
 desc_wr_traditionalist_backlash:0 "Confréries orthodoxes, anciens des skites et grands seigneurs conservateurs contestent les réformes chancelières qui s'écartent du slavon d'Église."
 wr_collective_concord:0 "Concorde des trois cercles"
 desc_wr_collective_concord:0 "Des chartes coordonnées entre souverains de culture principale, cours l'ayant acceptée et provinces frontalières assurent l'appui diplomatique du congrès."
 wr_cultural_ferment:0 "Ferment provincial non résolu"
 desc_wr_cultural_ferment:0 "Les cours voisines ont ratifié les nouvelles chartes tandis que les autorités locales s'y refusaient, divisant marchands et ordres."
 opinion_wr_west_slavic_kinship:0 "Parenté civique slave occidentale"
 opinion_wr_west_ruthenian_separation:0 "Séparation des prétentions moscovites"
 opinion_wr_collective_accord:0 "Accord du congrès culturel"
 opinion_wr_collective_discord:0 "Discorde du congrès culturel"
 wr_tt_byelorussian_s2_index:0 "Parmi les provinces de culture §Ybielaruski§!, au moins §Y60%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_byelorussian_s1_pct.GetValue]%§! (§Y[Root.wr_byelorussian_s1_cnt.GetValue]§! provinces sur §Y[Root.wr_byelorussian_total.GetValue]§!)."
 wr_tt_ruthenian_s2_index:0 "Parmi les provinces de culture §Yruskyi§!, au moins §Y60%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_ruthenian_s1_pct.GetValue]%§! (§Y[Root.wr_ruthenian_s1_cnt.GetValue]§! provinces sur §Y[Root.wr_ruthenian_total.GetValue]§!)."
 wr_tt_rusyn_s2_index:0 "Parmi les provinces de culture §Yrusnacky§!, au moins §Y60%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_rusyn_s1_pct.GetValue]%§! (§Y[Root.wr_rusyn_s1_cnt.GetValue]§! provinces sur §Y[Root.wr_rusyn_total.GetValue]§!)."
 wr_tt_byelorussian_s4_index:0 "Parmi les provinces de culture §Ybjalowruszsky§!, au moins §Y85%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_byelorussian_s3_pct.GetValue]%§! (§Y[Root.wr_byelorussian_s3_cnt.GetValue]§! provinces sur §Y[Root.wr_byelorussian_total.GetValue]§!)."
 wr_tt_ruthenian_s4_index:0 "Parmi les provinces de culture §Yruszynjsky§!, au moins §Y85%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_ruthenian_s3_pct.GetValue]%§! (§Y[Root.wr_ruthenian_s3_cnt.GetValue]§! provinces sur §Y[Root.wr_ruthenian_total.GetValue]§!)."
 wr_tt_rusyn_s4_index:0 "Parmi les provinces de culture §Yrusznjoczky§!, au moins §Y85%§! doivent avoir adopté la charte. Soutien actuel : §Y[Root.wr_rusyn_s3_pct.GetValue]%§! (§Y[Root.wr_rusyn_s3_cnt.GetValue]§! provinces sur §Y[Root.wr_rusyn_total.GetValue]§!)."
 wr_charter_distinctiveness_decision_title:0 "Reconnaître la langue des chancelleries"
 wr_charter_distinctiveness_decision_desc:0 "Que les notaires rédigent leurs actes dans les langues des terres biélorusses, ruthènes et rusynes. Les trois cercles examineront la requête. Les chances d'approbation sont de 50 % au plus. Cette charte exclut le pacte des villes occidentales."
 wr_rally_branch_a_congress_decision_title:0 "Envoyer des émissaires porter la charte"
 wr_rally_branch_a_congress_decision_desc:0 "Envoyons clercs et prêtres auprès des cours qui hésitent encore. Les princes amis laisseront plus volontiers leurs provinces adhérer à la charte. Pour chaque peuple, il faut le sceau d'au moins 60 % de ses provinces dans le monde."
 wr_codify_west_ruthenian_group_decision_title:0 "Soumettre les statuts ruthènes à la diète"
 wr_codify_west_ruthenian_group_decision_desc:0 "Après 15 ans de charte, l'imprimerie et l'assentiment des trois cercles permettent de saisir la diète. Les statuts reconnaissent un groupe culturel ruthène distinct à chaque peuple dont au moins 60 % des provinces dans le monde ont adopté la charte. Les chances d'approbation sont de 30 % au plus."
 wr_proclaim_west_slavic_affinity_decision_title:0 "Offrir un pacte aux villes occidentales"
 wr_proclaim_west_slavic_affinity_decision_desc:0 "Nos villes partagent le droit de Magdebourg avec leurs voisines de l'ouest. Que leurs écoles et leurs guildes échangent livres et chartes avec Cracovie, Prague et Trnava. Ce pacte exclut la charte des chancelleries. Les chances d'approbation sont inférieures à 20 %."
 wr_rally_branch_b_congress_decision_title:0 "Inviter les guildes à rejoindre le pacte occidental"
 wr_rally_branch_b_congress_decision_desc:0 "Envoyons magistrats et savants auprès des cours dont les villes hésitent encore. Nos alliés, nos sujets et les princes qui nous tiennent en estime seront plus enclins à signer. Pour chaque peuple, le pacte doit réunir au moins 85 % de ses provinces dans le monde."
 wr_attempt_west_slavic_transition_decision_title:0 "Ratifier la charte occidentale"
 wr_attempt_west_slavic_transition_decision_desc:0 "Après 30 ans de pacte, le commerce mondial et l'assentiment des trois cercles permettent de proposer une charte définitive. Un peuple peut entrer dans le groupe culturel slave occidental si au moins 85 % de ses provinces dans le monde ont adhéré au pacte. Les chances d'approbation sont inférieures à 5 %."
 wr_cultural_maneuver.1.t:0 "Chartes vernaculaires et registre natif"
 wr_cultural_maneuver.1.d:0 "De Vilnius et Polatsk à Moukatcheve et Khoust en passant par Kyiv, Lviv et Ostroh, les greffiers rédigent actes et testaments dans des langues vivantes éloignées de l'usage des prikazy moscovites. Nous réunissons les trois cercles pour consacrer ces registres sans confondre nos peuples."
 wr_cultural_maneuver.1.d_belarus:0 "À Polatsk, Minsk, Navahroudak et Vilnius, la chancellerie grand-ducale rédige en biélorusse parlé - la prosta mova des testaments et des premières traductions de Prague et Vilnius -, distinct de Moscou comme des Ruthènes du Sud. La commission demande reconnaissance pour l'usage bielaruski."
 wr_cultural_maneuver.1.d_ruthenia:0 "À Kyiv, Volodymyr-Volynskyi, Lviv, Halych et Kamianets, les registres judiciaires suivent le parler ruthène local, distinct des prikazy moscovites, du grand-ducal biélorusse et des vallées carpatiques. L'usage ruskyi demande reconnaissance officielle."
 wr_cultural_maneuver.1.d_rusyn:0 "Dans les comitats d'Ung, Bereg, Ugocsa, Maramaros, Saris et Zemplen, les Rusnaks carpatiques conservent le droit valaque des sholtys et knyaz, les salines de Solotvyno et les homélies de Moukatcheve. Distinct des Biélorusses et des Ruthènes de Kyiv-Lviv, rusnacky demande sa charte."
 wr_cultural_maneuver.1.a:0 "Que les trois cercles nous entendent (50 % de chances d'accord au plus)."
 wr_cultural_maneuver.1.b:0 "Promulguer un décret royal malgré l'opposition."
 wr_cultural_maneuver.1.c:0 "Différer la charte et garder les clercs actuels."
 wr_cultural_maneuver.2.t:0 "Distinction vernaculaire enregistrée"
 wr_cultural_maneuver.2.d:0 "La commission a confirmé les privilèges des greffes natifs. Nos envoyés portent la charte aux souverains de même culture principale, aux cours l'ayant acceptée et aux détenteurs de provinces frontalières."
 wr_cultural_maneuver.2.d_belarus:0 "Les notaires de Vilnius, Minsk et Polatsk ont inscrit le registre bielaruski, consacrant la prosta mova grand-ducale hors de Moscou. Les émissaires partent vers les trois cercles."
 wr_cultural_maneuver.2.d_ruthenia:0 "Les greffiers de Kyiv, de Volhynie et de Lviv ont certifié le registre ruskyi des tribunaux et confréries à l'écart des usages moscovites. Nos envoyés partent vers nos cours alliées."
 wr_cultural_maneuver.2.d_rusyn:0 "Les greffiers de comitat et doyens de Moukatcheve ont confirmé les homélies rusnacky et chartes de sholtys carpatiques. Les envoyés partent rallier les cours voisines."
 wr_cultural_maneuver.2.a:0 "Diffuser la charte aux trois cercles."
 wr_cultural_maneuver.3.t:0 "Les conservateurs bloquent la charte vernaculaire"
 wr_cultural_maneuver.3.d:0 "Anciens monastiques et boyards conservateurs ont refusé de détacher l'usage des modèles slavons d'Église. La commission s'est dispersée sans résultat."
 wr_cultural_maneuver.3.d_belarus:0 "Les monastères de Polatsk et Tourov ont défendu le slavon liturgique contre les réformes vernaculaires bielaruski de Vilnius."
 wr_cultural_maneuver.3.d_ruthenia:0 "Les anciens de Kyiv, Volhynie et Halych ont défendu les recueils slavons face aux gloses judiciaires ruskyi, bloquant la commission."
 wr_cultural_maneuver.3.d_rusyn:0 "Les traditionalistes du Maramaros et du clergé de Moukatcheve ont refusé toute révision des manuscrits slavons carpatiques."
 wr_cultural_maneuver.3.a:0 "Maintenir les registres anciens."
 wr_cultural_maneuver.10.t:0 "Codification d'un groupe ruthène séparé"
 wr_cultural_maneuver.10.d:0 "La charte des chancelleries est passée des presses aux mains des juges et des curés. Les juristes portent à la diète un recueil de statuts où chacun des trois peuples aura sa place."
 wr_cultural_maneuver.10.d_belarus:0 "Appuyés sur les Statuts lituaniens de 1529, 1566 et 1588, l'imprimerie de Francysk Skaryna à Vilnius (1522), le catéchisme de Nesvizh (1562) et le chancelier Leu Sapieha exigeant d'écrire « en lettres et mots ruthènes », les Biélorusses revendiquent bielaruski dans le groupe ruthène séparé."
 wr_cultural_maneuver.10.d_ruthenia:0 "Portés par l'Académie d'Ostroh (1576) et la Bible d'Ostroh (1581), l'imprimerie stauropégique de Lviv (1586), l'Évangile de Peresopnytsia et la garantie judiciaire de 1569 à Kyiv, en Volhynie et en Bratslav, les Ruthènes revendiquent ruskyi hors de la sphère moscovite."
 wr_cultural_maneuver.10.d_rusyn:0 "Soutenus par les homélies en parler vivant des Carpates, les écoles épiscopales de Moukatcheve, les statuts de Bereg et Ugocsa et les franchises de Khust à Presov, les Rusnaks demandent le statut propre rusnacky."
 wr_cultural_maneuver.10.a:0 "Soumettons les statuts à la diète (30 % de chances d'accord au plus)."
 wr_cultural_maneuver.10.b:0 "Proclamer le codex par décret coûteux."
 wr_cultural_maneuver.10.c:0 "Conserver le classement slave oriental actuel."
 wr_cultural_maneuver.11.t:0 "Le groupe ruthène séparé est codifié"
 wr_cultural_maneuver.11.d:0 "La diète a scellé les statuts. Chaque peuple dont la charte est en vigueur dans au moins 60 % de ses provinces figurera dans les registres ruthènes sous son nom : bielaruski, ruskyi ou rusnacky."
 wr_cultural_maneuver.11.d_belarus:0 "Avec Vilnius, Polatsk, Minsk et Navahroudak unis derrière le mandat de 1588, bielaruski quitte le groupe dominé par Moscou pour entrer dans le groupe ruthène séparé."
 wr_cultural_maneuver.11.d_ruthenia:0 "Ratifié d'Ostroh et Lviv jusqu'à Kyiv et Tchernihiv, ruskyi entre dans le groupe ruthène séparé en fidélité aux garanties de 1569 et aux presses des confréries."
 wr_cultural_maneuver.11.d_rusyn:0 "Ratifié par Moukatcheve et les assemblées d'Ung, Bereg et Maramaros, rusnacky entre dans le groupe ruthène séparé comme peuple montagnard distinct."
 wr_cultural_maneuver.11.a:0 "Diffuser le codex ratifié aux trois cercles."
 wr_cultural_maneuver.12.t:0 "La diète rejette la séparation du groupe"
 wr_cultural_maneuver.12.d:0 "Les seigneurs possessionnés des deux côtés de la frontière ont rejoint le clergé. Ni les uns ni les autres ne veulent diviser les anciennes juridictions. La diète a rendu le projet sans y apposer son sceau."
 wr_cultural_maneuver.12.d_belarus:0 "Les magnats tenant terres de Polatsk à Tchernihiv ont mis en garde contre une division ecclésiastique, faisant échouer le codex bielaruski."
 wr_cultural_maneuver.12.d_ruthenia:0 "Des prélats et seigneurs de Volhynie et de Podillia ont craint de rompre les anciens liens de Kyiv et Tchernihiv, bloquant la motion ruskyi."
 wr_cultural_maneuver.12.d_rusyn:0 "Craignant de s'isoler des monastères de Halych et Lviv au-delà des cols, les députés carpatiques ont rejeté le codex rusnacky."
 wr_cultural_maneuver.12.a:0 "Rechercher un consensus plus large à l'étranger."
 wr_cultural_maneuver.15.t:0 "Le suzerain codifie le groupe ruthène séparé"
 wr_cultural_maneuver.15.d:0 "Notre suzerain a scellé les statuts ruthènes. Là où assez de provinces ont adopté la charte, notre chancellerie peut en faire autant dans ses registres."
 wr_cultural_maneuver.15.d_belarus:0 "Notre suzerain a codifié bielaruski dans un groupe ruthène propre sur le modèle des Statuts grand-ducaux et invite notre cour à s'y rallier."
 wr_cultural_maneuver.15.d_ruthenia:0 "Notre suzerain a codifié ruskyi dans un groupe ruthène séparé fidèle aux chartes de Kyiv et Lviv et invite notre chancellerie à suivre."
 wr_cultural_maneuver.15.d_rusyn:0 "Notre suzerain a inscrit les Rusnaks carpatiques sous rusnacky dans le groupe ruthène séparé et invite nos comitats à l'adopter."
 wr_cultural_maneuver.15.a:0 "Adopter le codex du suzerain."
 wr_cultural_maneuver.15.b:0 "Maintenir nos registres actuels."
 wr_cultural_maneuver.20.t:0 "Attrait de l'orbite urbaine slave occidentale"
 wr_cultural_maneuver.20.d:0 "Des étudiants reviennent de Cracovie, Prague et Trnava avec des livres que les guildes veulent imprimer. Un acte reçu dans une ville pourrait-il faire foi devant le tribunal d'une autre ? Les magistrats ont rédigé un pacte et attendent notre sceau."
 wr_cultural_maneuver.20.d_belarus:0 "Écartant la voie statutaire orientale, bourgeois et nobles de Grodno, Brest et Navahroudak envoient leurs fils à Kraków et Prague, rédigent en lacinka biélorusse et siègent sous droit de Magdebourg."
 wr_cultural_maneuver.20.d_ruthenia:0 "À l'écart des traditionalistes de Kyiv, nobles de Lviv, Przemysl, Volhynie et Kamianets fréquentent Kraków et Zamosc, tiennent des livres judiciaires bilingues et rapprochent leurs guildes de la Petite-Pologne."
 wr_cultural_maneuver.20.d_rusyn:0 "Hors des réseaux ruthènes du Nord, les Rusnaks du Saris, du Spis, du Zemplen et de l'Ung partagent bourgs, marchés et presses de Trnava et Kraków avec Slovaques et Polonais."
 wr_cultural_maneuver.20.a:0 "Offrons un pacte aux villes (moins de 20 % de chances d'accord)."
 wr_cultural_maneuver.20.b:0 "Imposer l'alignement par décret coûteux."
 wr_cultural_maneuver.20.c:0 "Préserver l'usage paroissial local."
 wr_cultural_maneuver.21.t:0 "Affinité civique slave occidentale proclamée"
 wr_cultural_maneuver.21.d:0 "Les délégués de Kraków, Prague et des villes minières slovaques accueillent nos magistrats dans un circuit civique bilingue partagé. Nos envoyés partent rallier les trois cercles."
 wr_cultural_maneuver.21.d_belarus:0 "Anciens de Kraków et Prague ratifient des chartes urbaines communes à Brest, Grodno et Vilnius, ouvrant l'espace civique à double écriture aux communautés bielaruski."
 wr_cultural_maneuver.21.d_ruthenia:0 "Corporations et juristes de Lviv, Halych, Volhynie et Bratslav concluent des pactes municipaux bilingues aux côtés du droit de Kraków et Sandomierz."
 wr_cultural_maneuver.21.d_rusyn:0 "À Presov, Bardejov et Oujhorod, échevins latins et doyennés orientaux signent un pacte commun avec les cités slovaques, polonaises et bohèmes."
 wr_cultural_maneuver.21.a:0 "Proclamer le pacte d'affinité aux trois cercles."
 wr_cultural_maneuver.22.t:0 "Échec du pacte d'affinité urbaine"
 wr_cultural_maneuver.22.d:0 "Clergé paroissial, anciens ruraux et nobles méfiants ont rejeté l'orthographe latine étrangère et les modèles municipaux occidentaux."
 wr_cultural_maneuver.22.d_belarus:0 "Magnats de Polatsk et Vitebsk et confréries orthodoxes ont rejeté les privilèges bilingues inspirés de Kraków."
 wr_cultural_maneuver.22.d_ruthenia:0 "Les confréries de Lviv et les cosaques du Dnieper ont condamné l'intrusion juridique latino-polonaise dans les paroisses."
 wr_cultural_maneuver.22.d_rusyn:0 "Prêtres carpatiques et anciens du Maramaros se sont dressés contre les écoles de Trnava et du Spis, fermant leurs chancelleries."
 wr_cultural_maneuver.22.a:0 "Conserver le droit urbain coutumier."
 wr_cultural_maneuver.30.t:0 "Le seuil slave occidental"
 wr_cultural_maneuver.30.d:0 "Depuis trente ans, négociants et écoliers partagent les mêmes franchises et les mêmes livres. Les villes demandent maintenant à la chancellerie de reconnaître leur place parmi les Slaves occidentaux. Le sceau est encore entre nos mains."
 wr_cultural_maneuver.30.d_belarus:0 "Trente ans d'édition en lacinka et cyrillique et d'intégration de Vilnius, Grodno et Brest ouvrent la voie au bjalowruszsky : non pas une assimilation polonaise, mais une culture civique slave occidentale issue de Biélorussie."
 wr_cultural_maneuver.30.d_ruthenia:0 "Trente ans d'humanisme trilingue entre Kraków, Zamosc et Kyiv et de magistratures bilingues de Lviv à Bratslav rendent possible ruszynjsky, synthèse civique slave occidentale gardant vivantes les racines paroissiales."
 wr_cultural_maneuver.30.d_rusyn:0 "Trente ans de marchés partagés, de catéchismes de Trnava et de coexistence en Saris-Spis-Zemplen font écho aux glissements de Slovaquie orientale tout en forgeant rusznjoczky comme partenaire carpatique propre."
 wr_cultural_maneuver.30.a:0 "Présentons la charte définitive (moins de 5 % de chances d'accord)."
 wr_cultural_maneuver.30.b:0 "Maintenir l'affinité bilingue sans franchir le seuil."
 wr_cultural_maneuver.31.t:0 "Synthèse civique slave occidentale accomplie"
 wr_cultural_maneuver.31.d:0 "Le congrès a ratifié la charte occidentale. Chaque peuple qui a obtenu l'adhésion d'au moins 85 % de ses provinces entre dans le groupe slave occidental sous son nom : bjalowruszsky, ruszynjsky ou rusznjoczky."
 wr_cultural_maneuver.31.d_belarus:0 "À Brest, Grodno, Vilnius et Polatsk, les magistrats entrent dans le groupe slave occidental sous bjalowruszsky, couronnant une longue tradition de lettres en lacinka."
 wr_cultural_maneuver.31.d_ruthenia:0 "De Lviv, Halych et Kamianets à la Volhynie et Kyiv, les ordres entrent dans le groupe slave occidental sous ruszynjsky, unissant droit humaniste ruthène et institutions occidentales."
 wr_cultural_maneuver.31.d_rusyn:0 "À Oujhorod, Moukatcheve, Presov et Khoust, les assemblées carpatiques entrent dans la famille slave occidentale sous rusznjoczky aux côtés des Tchèques, Polonais et Slovaques."
 wr_cultural_maneuver.31.a:0 "Proclamer la rare synthèse aux trois cercles."
 wr_cultural_maneuver.32.t:0 "Les ordres s'arrêtent au seuil slave occidental"
 wr_cultural_maneuver.32.d:0 "Même après trois décennies d'affinité, synodes et communes rurales ont refusé le passage définitif. L'alliance civique bilingue demeure sans changement de famille culturelle."
 wr_cultural_maneuver.32.d_belarus:0 "Confréries de Vilnius et noblesse de Minsk ont gardé le bilinguisme sans rompre leurs attaches ecclésiales orientales."
 wr_cultural_maneuver.32.d_ruthenia:0 "Érudits de Kyiv et Ostroh et ordres du Dnieper ont salué le savoir de Kraków tout en refusant de quitter l'héritage slave oriental."
 wr_cultural_maneuver.32.d_rusyn:0 "Paroisses de Moukatcheve et bourgs de Khoust ont conservé le commerce du Spis sans abandonner les coutumes ancestrales carpatiques."
 wr_cultural_maneuver.32.a:0 "Préserver le pacte civique à double écriture."
 wr_cultural_maneuver.35.t:0 "Le suzerain ratifie la synthèse slave occidentale"
 wr_cultural_maneuver.35.d:0 "Notre suzerain a scellé la charte occidentale. Il invite nos états à en faire autant pour chaque peuple qui a rallié au moins 85 % de ses provinces."
 wr_cultural_maneuver.35.d_belarus:0 "Notre suzerain enregistre désormais villes et noblesse biélorusses sous bjalowruszsky dans le groupe slave occidental et invite notre cour à s'aligner."
 wr_cultural_maneuver.35.d_ruthenia:0 "Notre suzerain enregistre les magistratures ruthènes sous ruszynjsky dans le groupe slave occidental et invite nos terres à suivre."
 wr_cultural_maneuver.35.d_rusyn:0 "Notre suzerain a inscrit les Rusnaks carpatiques sous rusznjoczky dans le groupe slave occidental et invite nos comitats à adopter les nouveaux registres."
 wr_cultural_maneuver.35.a:0 "Adopter la charte slave occidentale du suzerain."
 wr_cultural_maneuver.35.b:0 "Refuser et garder l'usage antérieur."
 wr_cultural_maneuver.41.t:0 "Les envoyés et les scribes"
 wr_cultural_maneuver.41.d:0 "La chancellerie de [From.GetName] propose que notre langue commune serve aux tribunaux et dans les paroisses. En apposant notre sceau, nous engageons toutes nos provinces qui la parlent."
 wr_cultural_maneuver.41.d_belarus:0 "Nos scribes emploient déjà le bielaruski à Vilnius. Les envoyés de [From.GetName] demandent notre sceau pour que cet usage s'étende à toutes nos provinces où cette langue est parlée."
 wr_cultural_maneuver.41.d_ruthenia:0 "Nos scribes emploient déjà le ruskyi à Lviv. Les envoyés de [From.GetName] demandent notre sceau pour que cet usage s'étende à toutes nos provinces où cette langue est parlée."
 wr_cultural_maneuver.41.d_rusyn:0 "Nos scribes emploient déjà le rusnacky à Presov. Les envoyés de [From.GetName] demandent notre sceau pour que cet usage s'étende à toutes nos provinces où cette langue est parlée."
 wr_cultural_maneuver.41.a:0 "Ratifier la charte sœur et inscrire nos provinces."
 wr_cultural_maneuver.41.b:0 "Conserver les formes anciennes."
 wr_cultural_maneuver.42.t:0 "Un sceau pour les statuts ruthènes"
 wr_cultural_maneuver.42.d:0 "Les envoyés de [From.GetName] sollicitent notre sceau pour les statuts ruthènes. Ceux-ci reconnaissent séparément le bielaruski, le ruskyi et le rusnacky dès qu'au moins 60 % des provinces du peuple concerné ont adopté la charte."
 wr_cultural_maneuver.42.d_belarus:0 "Les statuts inscrivent le nom bielaruski parmi les peuples de la Rus'. Les envoyés de [From.GetName] demandent si notre cour apposera son sceau aux côtés des autres signataires."
 wr_cultural_maneuver.42.d_ruthenia:0 "Les statuts inscrivent le nom ruskyi parmi les peuples de la Rus'. Les envoyés de [From.GetName] demandent si notre cour apposera son sceau aux côtés des autres signataires."
 wr_cultural_maneuver.42.d_rusyn:0 "Les statuts inscrivent le nom rusnacky parmi les peuples de la Rus'. Les envoyés de [From.GetName] demandent si notre cour apposera son sceau aux côtés des autres signataires."
 wr_cultural_maneuver.42.a:0 "Rejoindre le mandat collectif."
 wr_cultural_maneuver.42.b:0 "Refuser l'appui collectif."
 wr_cultural_maneuver.43.t:0 "Une offre des villes occidentales"
 wr_cultural_maneuver.43.d:0 "Les villes de [From.GetName] offrent une place à nos magistrats dans leur pacte occidental. Nos villes peuvent y adhérer si nous ne sommes pas déjà liés par la charte des chancelleries. Pour chaque peuple, il faut le sceau d'au moins 85 % de ses provinces."
 wr_cultural_maneuver.43.d_belarus:0 "Les guildes de Vilnius commercent sous des chartes proches de celles de Brest. Les envoyés de [From.GetName] proposent que les villes reconnaissent leurs actes respectifs et tiennent leurs registres dans les deux écritures."
 wr_cultural_maneuver.43.d_ruthenia:0 "Les guildes de Lviv commercent sous des chartes proches de celles de Zamosc. Les envoyés de [From.GetName] proposent que les villes reconnaissent leurs actes respectifs et tiennent leurs registres dans les deux écritures."
 wr_cultural_maneuver.43.d_rusyn:0 "Les guildes de Presov commercent sous des chartes proches de celles de Trnava. Les envoyés de [From.GetName] proposent que les villes reconnaissent leurs actes respectifs et tiennent leurs registres dans les deux écritures."
 wr_cultural_maneuver.43.a:0 "Rejoindre le cercle d'affinité slave occidentale."
 wr_cultural_maneuver.43.b:0 "Décliner le pacte civique occidental."
 wr_cultural_maneuver.44.t:0 "La charte définitive"
 wr_cultural_maneuver.44.d:0 "Une délégation de [From.GetName] attend notre sceau sur la charte occidentale. Les peuples qui ont rallié au moins 85 % de leurs provinces peuvent prendre place parmi les Slaves occidentaux."
 wr_cultural_maneuver.44.d_belarus:0 "Les envoyés de [From.GetName] apportent une charte portant le nom bjalowruszsky. Ils demandent à notre cour de reconnaître notre peuple sous ce nom parmi les Slaves occidentaux."
 wr_cultural_maneuver.44.d_ruthenia:0 "Les envoyés de [From.GetName] apportent une charte portant le nom ruszynjsky. Ils demandent à notre cour de reconnaître notre peuple sous ce nom parmi les Slaves occidentaux."
 wr_cultural_maneuver.44.d_rusyn:0 "Les envoyés de [From.GetName] apportent une charte portant le nom rusznjoczky. Ils demandent à notre cour de reconnaître notre peuple sous ce nom parmi les Slaves occidentaux."
 wr_cultural_maneuver.44.a:0 "Signer le traité de synthèse slave occidentale."
 wr_cultural_maneuver.44.b:0 "Refuser l'entrée dans le groupe slave occidental."
 wr_cultural_maneuver.51.t:0 "La langue de nos tribunaux"
 wr_cultural_maneuver.51.d:0 "Ces langues ont déjà droit de cité à notre cour. Les envoyés de [From.GetName] nous demandent d'en autoriser l'usage dans les actes et les registres paroissiaux des provinces concernées. Il leur faut au moins 60 % des provinces de chaque peuple."
 wr_cultural_maneuver.51.d_belarus:0 "Parce que notre cour accepte la culture biélorusse, [From.GetName] nous demande de ratifier les registres bielaruski dans nos provinces biélorusses."
 wr_cultural_maneuver.51.d_ruthenia:0 "Parce que notre royaume accepte les Ruthènes, [From.GetName] nous demande d'approuver les registres ruskyi dans nos terres ruthènes."
 wr_cultural_maneuver.51.d_rusyn:0 "Parce que notre couronne accepte les Rusnaks, [From.GetName] nous demande de confirmer les chartes rusnacky dans nos comitats."
 wr_cultural_maneuver.51.a:0 "Reconnaître les chartes natives des terres acceptées."
 wr_cultural_maneuver.51.b:0 "Refuser la reconnaissance royale."
 wr_cultural_maneuver.52.t:0 "Les députés et les statuts"
 wr_cultural_maneuver.52.d:0 "La chancellerie de [From.GetName] a envoyé un exemplaire des statuts ruthènes. Les peuples concernés ont voix à notre cour et leurs députés demandent la permission de signer."
 wr_cultural_maneuver.52.d_belarus:0 "Nos députés reçoivent déjà des requêtes en bielaruski. Les envoyés leur demandent de consacrer ce droit dans les statuts ruthènes."
 wr_cultural_maneuver.52.d_ruthenia:0 "Nos députés reçoivent déjà des requêtes en ruskyi. Les envoyés leur demandent de consacrer ce droit dans les statuts ruthènes."
 wr_cultural_maneuver.52.d_rusyn:0 "Nos députés reçoivent déjà des requêtes en rusnacky. Les envoyés leur demandent de consacrer ce droit dans les statuts ruthènes."
 wr_cultural_maneuver.52.a:0 "Soutenir le codex ruthène séparé."
 wr_cultural_maneuver.52.b:0 "Refuser l'appui de la cour."
 wr_cultural_maneuver.53.t:0 "Un pacte pour nos villes marchandes"
 wr_cultural_maneuver.53.d:0 "Les magistrats de [From.GetName] invitent les villes représentées à notre cour à échanger des chartes avec leurs voisines occidentales. Chaque adhésion rapproche le peuple concerné du seuil de 85 % de ses provinces."
 wr_cultural_maneuver.53.d_belarus:0 "Les magistrats de Vilnius se sont adressés à notre cour. Les envoyés de [From.GetName] leur offrent les mêmes franchises commerciales et les mêmes échanges de chartes qu'à leurs voisins de Brest."
 wr_cultural_maneuver.53.d_ruthenia:0 "Les magistrats de Lviv se sont adressés à notre cour. Les envoyés de [From.GetName] leur offrent les mêmes franchises commerciales et les mêmes échanges de chartes qu'à leurs voisins de Zamosc."
 wr_cultural_maneuver.53.d_rusyn:0 "Les magistrats de Presov se sont adressés à notre cour. Les envoyés de [From.GetName] leur offrent les mêmes franchises commerciales et les mêmes échanges de chartes qu'à leurs voisins de Trnava."
 wr_cultural_maneuver.53.a:0 "Confirmer la charte d'affinité slave occidentale."
 wr_cultural_maneuver.53.b:0 "Rester à l'écart de l'affinité occidentale."
 wr_cultural_maneuver.54.t:0 "Le sceau des états"
 wr_cultural_maneuver.54.d:0 "Les villes ont député leurs magistrats pour entendre la charte occidentale apportée par [From.GetName]. Ils demandent si notre couronne la reconnaîtra au nom des peuples représentés à la cour."
 wr_cultural_maneuver.54.d_belarus:0 "Les envoyés de [From.GetName] demandent la reconnaissance du nom bjalowruszsky parmi les Slaves occidentaux. Les députés sollicitent notre accord là où au moins 85 % des provinces de leur peuple ont scellé le pacte."
 wr_cultural_maneuver.54.d_ruthenia:0 "Les envoyés de [From.GetName] demandent la reconnaissance du nom ruszynjsky parmi les Slaves occidentaux. Les députés sollicitent notre accord là où au moins 85 % des provinces de leur peuple ont scellé le pacte."
 wr_cultural_maneuver.54.d_rusyn:0 "Les envoyés de [From.GetName] demandent la reconnaissance du nom rusznjoczky parmi les Slaves occidentaux. Les députés sollicitent notre accord là où au moins 85 % des provinces de leur peuple ont scellé le pacte."
 wr_cultural_maneuver.54.a:0 "Ratifier la transition pour nos ordres acceptés."
 wr_cultural_maneuver.54.b:0 "Rejeter la transition finale."
 wr_cultural_maneuver.61.t:0 "Une requête des paroisses"
 wr_cultural_maneuver.61.d:0 "Ces langues sont absentes de notre cour mais se parlent chaque jour dans les paroisses. Les envoyés de [From.GetName] demandent que les scribes locaux puissent les employer et que ces districts soient admis à la charte."
 wr_cultural_maneuver.61.d_belarus:0 "Bien que les Biélorusses ne soient pas acceptés dans notre État, [From.GetName] demande la tolérance pour les registres locaux bielaruski."
 wr_cultural_maneuver.61.d_ruthenia:0 "Bien que les Ruthènes restent non acceptés à la cour, [From.GetName] demande de tolérer les écoles des confréries et greffes ruskyi."
 wr_cultural_maneuver.61.d_rusyn:0 "Bien que les Rusnaks carpatiques ne soient pas acceptés ici, [From.GetName] demande le maintien des sholtys et paroisses rusnacky."
 wr_cultural_maneuver.61.a:0 "Accorder une tolérance paroissiale et municipale locale."
 wr_cultural_maneuver.61.b:0 "Maintenir une stricte uniformité administrative."
 wr_cultural_maneuver.62.t:0 "Les gouverneurs reçoivent les statuts"
 wr_cultural_maneuver.62.d:0 "Les envoyés de [From.GetName] demandent à nos gouverneurs d'appliquer les statuts ruthènes dans les districts sans voix à la cour. Il faut qu'au moins 60 % des provinces du peuple concerné aient adopté la charte."
 wr_cultural_maneuver.62.d_belarus:0 "Nos gouverneurs tiennent des terres biélorusses ; [From.GetName] demande de les inscrire comme bielaruski dans le groupe ruthène séparé."
 wr_cultural_maneuver.62.d_ruthenia:0 "Nous gouvernons des provinces ruthènes ; [From.GetName] demande de reconnaître ruskyi dans le groupe ruthène séparé."
 wr_cultural_maneuver.62.d_rusyn:0 "Nous tenons des comitats rusnaks ; [From.GetName] demande à nos capitaines de comitat d'adopter le codex rusnacky."
 wr_cultural_maneuver.62.a:0 "Autoriser le passage provincial au groupe séparé."
 wr_cultural_maneuver.62.b:0 "Laisser les rôles provinciaux inchangés."
 wr_cultural_maneuver.63.t:0 "Les registres des guildes"
 wr_cultural_maneuver.63.d:0 "Les guildes de la frontière ont reçu des nouvelles de [From.GetName]. Elles demandent à tenir leurs livres dans deux écritures et à recevoir les maîtres des villes occidentales. Leurs sceaux compteraient pour les 85 % de provinces requis de chaque peuple."
 wr_cultural_maneuver.63.d_belarus:0 "Les envoyés apportent une requête des guildes. Elles souhaitent enseigner les deux écritures et rédiger leurs contrats dans les mêmes formes que les négociants de Vilnius et de Brest."
 wr_cultural_maneuver.63.d_ruthenia:0 "Les envoyés apportent une requête des guildes. Elles souhaitent enseigner les deux écritures et rédiger leurs contrats dans les mêmes formes que les négociants de Lviv et de Zamosc."
 wr_cultural_maneuver.63.d_rusyn:0 "Les envoyés apportent une requête des guildes. Elles souhaitent enseigner les deux écritures et rédiger leurs contrats dans les mêmes formes que les négociants de Presov et de Trnava."
 wr_cultural_maneuver.63.a:0 "Autoriser les guildes municipales à double écriture."
 wr_cultural_maneuver.63.b:0 "Interdire tout alignement urbain étranger."
 wr_cultural_maneuver.64.t:0 "La charte parvient aux marches"
 wr_cultural_maneuver.64.d:0 "Les envoyés de [From.GetName] ont porté la charte occidentale jusqu'à nos marches. Ils nous demandent de la reconnaître partout où au moins 85 % des provinces d'un peuple ont déjà rejoint le pacte."
 wr_cultural_maneuver.64.d_belarus:0 "Les envoyés de [From.GetName] ont réuni assez de sceaux pour que la charte occidentale entre en vigueur. Ils demandent aux gouverneurs d'inscrire nos villes dans les nouveaux registres sous le nom bjalowruszsky."
 wr_cultural_maneuver.64.d_ruthenia:0 "Les envoyés de [From.GetName] ont réuni assez de sceaux pour que la charte occidentale entre en vigueur. Ils demandent aux gouverneurs d'inscrire nos villes dans les nouveaux registres sous le nom ruszynjsky."
 wr_cultural_maneuver.64.d_rusyn:0 "Les envoyés de [From.GetName] ont réuni assez de sceaux pour que la charte occidentale entre en vigueur. Ils demandent aux gouverneurs d'inscrire nos villes dans les nouveaux registres sous le nom rusznjoczky."
 wr_cultural_maneuver.64.a:0 "Harmoniser les provinces frontalières avec les Slaves occidentaux."
 wr_cultural_maneuver.64.b:0 "Conserver les registres provinciaux existants."
