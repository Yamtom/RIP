l_french:
 # Tag-scoped replacement fallback (french): owner=shared_church, entity=content.
 chr_grant_sloboda_to_old_believers_desc:0 "Spend 25 ADM to settle one waiting refugee community in a randomly chosen eligible frontier province, granting it chartered lands and encouraging local development. May be founded once every five years."
 chr_grant_sloboda_to_old_believers_title:0 "Grant a Sloboda to the Old Believers"
 desc_blessing_of_basilian_order:0 "The Basilian houses keep the schools, the novices and the presses, and answer to their own protoarchimandrite rather than to the local bishop."
 desc_blessing_of_cultural_dominance:0 "The school, the court and the tax roll all use one tongue, and a man who wishes to be heard in any of them learns it."
 desc_blessing_of_eastern_liturgy:0 "The old rite is kept as it was received: the same chant, the same fasts, the same order of feasts, whoever holds the see."
 desc_blessing_of_orthodox_conquest:0 "Land taken from a heretic prince is entered in the registers as returned rather than conquered, and the clerks charge accordingly."
 desc_blessing_of_papal_protection:0 "Rome speaks for our bishops at courts where our own envoys are not received."
 desc_blessing_of_patriarch_of_moscow:0 "The patriarch keeps his own chancery, his own courts and his own revenues, and sits beside the throne rather than beneath it."
 desc_blessing_of_religious_unity:0 "One rite is preached from the cathedral to the frontier parish, and the missionaries carry the same books as the metropolitan."
 desc_blessing_of_saints_cyril_and_methodius:0 "The liturgy is read in a tongue the congregation follows without an interpreter, and the clerks who copy it are our own."
 desc_blessing_of_third_rome:0 "Two Romes have fallen and the third stands. The claim is repeated at every coronation until it is answered as a fact."
 desc_blessing_of_uniate_missionaries:0 "Priests trained in both rites go out to parishes that have heard the Union denounced from a neighbouring pulpit."
 desc_rip_crusade_flavor_recent:0 "The campaign's parish arrangements stand for five years."
 desc_rip_faith_funded_mission:0 "Readers and missionaries receive support, but the contested parish bears new expenses and disputes."
 desc_rip_faith_pilgrim_hospice:0 "A funded hospice shelters pilgrims. Its alms reduce unrest and local tax receipts."
 desc_rip_faith_pilgrimage_recent:0 "This pilgrimage settlement runs for ten years."
 desc_rip_gc_faith_funded_mission:0 "The funded mission brings stronger local missionary support, while the contested parish bears new expenses and disputes."
 desc_rip_gc_icon_climacus:1 "John of the Ladder taught the ascent by degrees, and the Basilian schools teach it still. Their pupils learn Latin from a Jesuit grammar and pray the eastern hours; the Ladder is the image they chose for themselves."
 desc_rip_gc_icon_eleusa:1 "The Mother of Tenderness with the child against her cheek, eastern in every line of it, painted in the same workshops after the Union as before. Rome asked for the creed. It did not ask for the brushwork."
 desc_rip_gc_icon_michael:1 "Michael is the patron of Kyiv, and the Union changed nothing about that. The same Archistrategos stands over the same gate, blessed now by a metropolitan in communion with Rome, and carried at the head of a procession exactly as the fathers of the Basilians carried him."
 desc_rip_gc_icon_nicholas:1 "The wonderworker is recognised in every court and every market between Lviv and the Danube, by Latins and Greeks alike. A church in communion with both can put him forward and be understood by both without explaining itself."
 desc_rip_gc_icon_pancreator:1 "The All-Ruler overhead in the central dome, mild and stern at once. The Latin churches set him on a wall; ours keeps him where the eastern rite has always kept him, and the synod has confirmed that this is not a matter needing correction."
 desc_rip_parish_alms_register:0 "Parish revenues are reserved for alms, easing unrest at the expense of tax receipts."
 desc_rip_parish_service_books:0 "Service books support instruction in the parish, while their provision reduces the revenue remitted to the treasury."
 desc_rip_ro_books_settled:0 "A generation of argument has settled into parish custom, with corrected volumes and older texts enduring side by side."
 desc_rip_ro_icon_climacus:0 "The brothers who made the letters. Hung in the schools and the scriptoria, where the argument is that learning is an inheritance rather than a theft, and that a book in Slavonic is not a foreign book."
 desc_rip_ro_icon_eleusa:0 "The Theotokos of Vladimir, brought up from Kyiv and kept at Moscow, and credited with turning Timur back from the city without a battle. She is carried through the districts that have been hardest handled. It costs a procession and a season, and it is cheaper than a garrison."
 desc_rip_ro_icon_michael:0 "Nevsky was raised to the altars in 1547, and the icon went out with the regiments almost before the ink of the canonisation was dry. A prince who beat the Germans on the ice is the saint an army wants at the head of the column, and the men who march behind him take new ground as though it were already theirs."
 desc_rip_ro_icon_nicholas:0 "Nikola with the sword in one hand and the town in the other - the recension carved at Mozhaisk and copied everywhere after it. He is the saint every court from Novgorod to the Danube recognises, which makes him the one to send an envoy under."
 desc_rip_ro_icon_pancreator:0 "Sergius founded in the forest and his pupils founded after him, until the north was a chain of monasteries with a village at the foot of each. Building under his icon is building the church has already blessed, and the abbots are the best surveyors in the country."
 desc_rip_ro_patriarchal_office:0 "The elevation of the metropolitan see to an independent patriarchal throne secures spiritual sovereignty, bolsters dynastic legitimacy, and elevates the standing of the church hierarchy."
 desc_rip_ro_the_first_rome:0 "The city the doctrine says fell is in our hands and keeps our rite. The argument was never that Rome should be destroyed - only that it had forfeited the succession, and that the succession had moved north. Holding it settles the argument in a way no council could."
 desc_rip_ro_zeal_stability:0 "Send the preachers to the districts rather than the armies, hear the grievances in the porch and settle what can be settled there. A quiet country is the slowest of the three purchases and the one that lasts."
 desc_rip_ro_zeal_trade:0 "Let the church bless the fairs, keep the weights and hold the contracts, and let it be known that a man who cheats at the fair answers to a court that can also refuse him burial. Merchants pay for that kind of order."
 desc_rip_ro_zeal_war:0 "Let every parish preach the campaign, bless the standards and read the names of the fallen from the ambo. The regiments feel it. It is spent as fast as it is preached, and when the zeal runs out the preaching stops."
 desc_rip_uc_brotherhoods_tolerated:0 "The see gave up closing their schools and their presses. The quarrel goes quiet, the schools stay, and they are good ones."
 desc_rip_uc_see_of_the_union:0 "The principal eparchial see guiding the propagation and administrative coordination of the Church Union across surrounding dioceses."
 desc_rip_uc_see_recently_raised:0 "The treasury cannot establish another centre until this twenty-year term ends."
 desc_rip_uc_union_accepted:0 "Generations raised within the Union now keep their Byzantine rite while standing firmly in communion with Rome."
 desc_sobor_of_the_canons:0 "The council sits on the canons themselves: the order of the liturgy, the discipline of the parish clergy, and the quarrels between the sees. A church that agrees with itself is a realm that quarrels less."
 desc_sobor_of_the_market:0 "The council turns to the fairs and the river roads. Monastery charters are read out in favour of the merchants, and the salt and grain that move down the Dnieper move under the church's protection."
 desc_sobor_of_war:0 "The council has blessed the muster. Banners go out with the metropolitan's own icon at their head, and the regiments march knowing the church stands behind the campaign."
 pdl_charter_of_four_communities_desc:0 "Kamianets keeps four self-governing communities, each with its own magistrate, church and quarter. The prince confirms their charters in return for the walls: no forced conversion, and every community manning its own tower."
 pdl_charter_of_four_communities_title:0 "Charter of the Four Communities"
 rip_crusade_flavor_recent:0 "Campaign Parish Settlement"
 rip_crusade_parish_support_desc:0 "The parishes ask the treasury to relieve the burden of the campaign. Fifty ducats will reduce war exhaustion by half a point. Another grant cannot be considered for five years."
 rip_crusade_parish_support_option:0 "Pay for relief."
 rip_faith.1.a:0 "Proclaim Moscow the Third Rome"
 rip_faith.1.b:0 "Raise the patriarchal office"
 rip_faith.1.c:0 "Set the inquisition to work"
 rip_faith.1.d:0 "The bishops are in the hall, the abbots behind them, and the boyars along the wall making it clear they are present rather than participating. One act will be settled today and read in every cathedral by the spring. The clerks have laid out six drafts and nobody has yet agreed which one is on the table."
 rip_faith.1.e:0 "One tongue in every parish"
 rip_faith.1.f:0 "The church serves the realm"
 rip_faith.1.g:0 "Bring the heretics under"
 rip_faith.1.h:0 "Settle nothing this year"
 rip_faith.1.t:0 "The Sobor Sits"
 rip_faith.2.a:0 "Keep the eastern rite whole"
 rip_faith.2.b:0 "Acknowledge the supremacy"
 rip_faith.2.c:0 "Endow the Basilian houses"
 rip_faith.2.d:0 "The eparchs of the Union have come, some of them from sees where their own flocks would not receive them last year. One article will be settled and sent to Rome, to Vilnius and to the brotherhoods, in that order. The Greek text and the Latin text of the acts will not be identical, and everyone at the table knows it."
 rip_faith.2.e:0 "Build the schools"
 rip_faith.2.f:0 "Stand as defender of the Union"
 rip_faith.2.g:0 "Confirm the order's rule"
 rip_faith.2.h:0 "Ask Rome for protection"
 rip_faith.2.i:0 "Send out the missioners"
 rip_faith.2.j:0 "Settle nothing this year"
 rip_faith.2.t:0 "The Synod Sits"
 rip_faith.3.a:0 "Let the chest fill again"
 rip_faith.3.d:0 "The preaching has outrun what the church laid by for it. The parishes have gone back to the ordinary round, the standards are blessed by whoever is nearest, and the Sobor will have to fill its chest again before it can be asked for anything. Nobody is scandalised; it has happened before."
 rip_faith.3.t:0 "The Zeal Is Spent"
 rip_faith_disaster.1.a:0 "The corrected books, and no others."
 rip_faith_disaster.1.b:0 "Let the old rite stand where it stands."
 rip_faith_disaster.1.d:0 "The printers at Moscow have set the service books against their Greek exemplars and found the Muscovite ones wanting in a hundred places: the number of fingers for the cross, the number of alleluias, the spelling of the Saviour's name. The patriarch has ordered the corrected books into every parish and the old ones off the lecterns.\n\nThe parishes are asking by what authority a printing house tells them their fathers prayed wrongly. It is not a question the patriarch can answer without answering it for everything else as well."
 rip_faith_disaster.1.t:0 "The Correction of the Books"
 rip_faith_disaster.2.a:0 "It will not be asked again."
 rip_faith_disaster.2.d:0 "A generation of it, and the argument has gone out of the parishes rather than been won. The corrected books are on most lecterns, the old ones are on some, and the sees have stopped sending men to find out which. What is left is a church that has learned the size of what it can order and has stopped ordering past it."
 rip_faith_disaster.2.t:0 "The Books Agreed"
 rip_faith_disaster.3.a:0 "Send the archimandrite. Take the press."
 rip_faith_disaster.3.b:0 "Leave the house alone."
 rip_faith_disaster.3.d:0 "A monastery of the north has kept its old psalters and gone on printing them. The abbot writes that his house had the books before there was a patriarch to correct them, and that he will surrender them to a council and to nothing else.\n\nHe is not wrong about the council. He is also two days' ride from anywhere, with four hundred brothers and the sympathy of every village between here and the sea."
 rip_faith_disaster.3.t:0 "The House That Would Not Burn Its Books"
 rip_faith_disaster.4.a:0 "Bring them back."
 rip_faith_disaster.4.b:0 "Let the forest have them."
 rip_faith_disaster.4.d:0 "A whole congregation has gone east with its priest, its books and its livestock, and settled where the surveyors have not been. They are not in rebellion and they are not hiding; they have simply put distance between themselves and the corrected books, and they intend to keep putting it there.\n\nThe district reports the fields left standing and the tax rolls short."
 rip_faith_disaster.4.t:0 "Into the Forests"
 rip_faith_disaster.5.a:0 "The see answers them from Rome's authority."
 rip_faith_disaster.5.b:0 "Let them keep their schools and their presses."
 rip_faith_disaster.5.d:0 "The confraternities of Lviv and Vilnius were chartered from Constantinople and hold their charters still. They are laymen - tanners, printers, merchants with a school and a hospital apiece - and they have been electing their own preachers and correcting their own bishops since before the Union was signed.\n\nThey write that they will take communion from a metropolitan in Rome's obedience when a council of the whole East tells them to, and that they have not heard of one."
 rip_faith_disaster.5.t:0 "The Brotherhoods Refuse"
 rip_faith_disaster.6.a:0 "The rite is ours and so is the obedience."
 rip_faith_disaster.6.d:0 "The men who signed at Brest are dead and so are the men who refused. What is left is a generation baptised into the union, taught in its schools and married by its priests, who would be as puzzled to be told they are Latins as to be told they are Greeks. The quarrel has not been settled. It has been outlived."
 rip_faith_disaster.6.t:0 "The Union Kept"
 rip_faith_disaster.7.a:0 "Close the school."
 rip_faith_disaster.7.b:0 "Endow a rival of our own rite."
 rip_faith_disaster.7.d:0 "The brotherhood school teaches Greek, Slavonic and Latin, takes the sons of tanners as readily as the sons of the starshyna, and turns out better theologians than the metropolitanate does. Its rector has printed a defence of the eastern rite that names the See and does not flatter it.\n\nHalf the men who would argue back learned to argue there."
 rip_faith_disaster.7.t:0 "The School on the Square"
 rip_faith_disaster.8.a:0 "Receive him, and pay for his stay."
 rip_faith_disaster.8.b:0 "The metropolitanate settles its own houses."
 rip_faith_disaster.8.d:0 "A visitor has come with letters, an interest in our seminaries and a list of questions about the calendar. He is courteous and he is not going home early. Whatever he writes when he does go home will be read by the men who decide how much weight a Ruthenian metropolitan's letters carry.\n\nHis household expects to be lodged at the see's expense."
 rip_faith_disaster.8.t:0 "A Visitor from Rome"
 rip_faith_funded_mission:0 "Funded Parish Mission"
 rip_faith_pilgrim_hospice:0 "Pilgrim Hospice"
 rip_faith_pilgrimage_desc:0 "Pilgrims ask for a hospice in Jerusalem. Funding it costs 100 ducats and 25 administrative power, and supports the parish for ten years. It creates no free development or authority."
 rip_faith_pilgrimage_option:0 "Fund the pilgrim hospice."
 rip_faith_pilgrimage_recent:0 "Pilgrimage Settlement"
 rip_fund_a_parish_mission_desc:0 "Spend 100 ducats, 25 administrative power and 5 authority (2 Hierarchical Capacity for a Greek Catholic state) to fund one controlled core mission for ten years. Greek Catholic missions receive +3 percentage points of local missionary strength (others +1); the province gains +1 unrest and loses 5% local tax. It does not convert the province immediately and shares the ten-year parish-visit cooldown."
 rip_fund_a_parish_mission_effect_tt:0 "Spend §Y100§! ducats, §Y25§! Administrative Power, and §Y5.0%§! Patriarch Authority (§Y2.0%§! Hierarchical Capacity if Greek Catholic).\nFund a 10-year missionary effort in a random qualifying core non-state-religion province:\n - Province gains §YParish Mission§! for §Y10 years§! (§G+1.0%§! Local Missionary Strength, or §G+3.0%§! if Greek Catholic; §R+1.00§! Local Unrest, §R-5.0%§! Local Tax Modifier).\nShares the §Y10-year§! parish visit cooldown."
 rip_fund_a_parish_mission_title:0 "Fund a Parish Mission"
 rip_gc_faith_funded_mission:0 "Greek Catholic Funded Parish Mission"
 rip_gc_icon_climacus:0 "Icon of the Ladder"
 rip_gc_icon_eleusa:0 "Icon of Tenderness"
 rip_gc_icon_michael:0 "Icon of the Archangel Michael"
 rip_gc_icon_nicholas:0 "Icon of Saint Nicholas"
 rip_gc_icon_pancreator:0 "Icon of Christ Pantocrator"
 rip_parish_alms_register:0 "The Parish Alms Register"
 rip_parish_service_books:0 "Service Books for the Parish"
 rip_parish_visit.1.a:0 "Provide the service books"
 rip_parish_visit.1.b:0 "Endow the parish alms"
 rip_parish_visit.1.c:0 "Leave the commission unsigned"
 rip_parish_visit.1.desc:0 "The metropolitan's clerks have prepared a visitation of the parishes that still follow another obedience. Some priests request service books for instruction; others ask that the revenues set aside for alms remain in the parish. The treasury can pay for one commission. A register alone will not persuade every household."
 rip_parish_visit.1.t:0 "The Parish Visitation"
 rip_parish_visit_recent:0 "Recent Parish Visitation"
 rip_privilege_josephite_discipline:0 "Josephite Discipline"
 rip_privilege_josephite_discipline_desc:0 "The church holds land, keeps schools, serves the ruler and answers heresy with the court rather than the sermon. Abbot Iosif's party won this argument and spent the next century administering what it had won. Wealth in the church is only a scandal to those who do not have to fund a chancery."
 rip_privilege_nonpossessor_rule:0 "Non-Possessor Rule"
 rip_privilege_nonpossessor_rule_desc:0 "The church owns nothing it cannot carry, keeps no villages, and preaches to the heretic rather than sentencing him. It costs the treasury the tithe of the monastery lands and gives back something the treasury cannot price. The elders who argued for it lost, and were remembered anyway."
 rip_ro_books_settled:0 "The Books Settled"
 rip_ro_convene_the_sobor_desc:0 "Spend 100 ducats, 50 administrative power and 10 authority on one church policy for ten years. The assembly cannot reconvene during that term."
 rip_ro_convene_the_sobor_title:0 "Convene the Sobor"
 rip_ro_douse_climacus_desc:0 "The Ladder leaves the scriptoria. The schools keep their books; they lose the argument that learning them is an inheritance rather than a theft."
 rip_ro_douse_climacus_title:0 "Take Down the Icon of the Ladder"
 rip_ro_douse_eleusa_desc:0 "The Vladimir Mother of God goes back to the treasury. The processions stop, and the districts that have been hardest handled are left to the governors."
 rip_ro_douse_eleusa_title:0 "Take Down the Icon of Tenderness"
 rip_ro_douse_michael_desc:0 "The regiments have carried Nevsky far enough. He comes off the iconostasis, the lamp beneath him goes out, and the oil goes to something else."
 rip_ro_douse_michael_title:0 "Take Down the Icon of the Archangel"
 rip_ro_douse_nicholas_desc:0 "The wonderworker comes off the wall. Envoys will have to argue on the strength of what they are offering."
 rip_ro_douse_nicholas_title:0 "Take Down the Icon of Saint Nicholas"
 rip_ro_douse_pancreator_desc:0 "Sergius comes down. The abbots go back to their own foundations and the surveying of new ground becomes the chancery's business again."
 rip_ro_douse_pancreator_title:0 "Take Down the Icon of the Pantocrator"
 rip_ro_icon_climacus:0 "Icon of Saints Cyril and Methodius"
 rip_ro_icon_climacus_desc:0 "The brothers who made the letters. Hung in the schools and the scriptoria, where the argument is that learning is an inheritance rather than a theft, and that a book in Slavonic is not a foreign book."
 rip_ro_icon_climacus_title:0 "Set Up the Icon of the Ladder"
 rip_ro_icon_eleusa:0 "The Vladimir Mother of God"
 rip_ro_icon_eleusa_desc:0 "The Theotokos of Vladimir, brought up from Kyiv and kept at Moscow, and credited with turning Timur back from the city without a battle. She is carried through the districts that have been hardest handled. It costs a procession and a season, and it is cheaper than a garrison."
 rip_ro_icon_eleusa_title:0 "Set Up the Icon of Tenderness"
 rip_ro_icon_light_cost_tt:0 "The Sobor has §Y15§! fervour to give. Lighting spends it outright, and every icon left standing is paid for again each two years - §Y3§! for one, §Y8§! for two, §Y14§! for three, §Y20§! for four. When the fervour will not stretch, a lamp goes out"
 rip_ro_icon_michael:0 "Icon of Saint Alexander Nevsky"
 rip_ro_icon_michael_desc:0 "Nevsky was raised to the altars in 1547, and the icon went out with the regiments almost before the ink of the canonisation was dry. A prince who beat the Germans on the ice is the saint an army wants at the head of the column, and the men who march behind him take new ground as though it were already theirs."
 rip_ro_icon_michael_title:0 "Set Up the Icon of the Archangel"
 rip_ro_icon_nicholas:0 "Icon of Saint Nicholas of Mozhaisk"
 rip_ro_icon_nicholas_desc:0 "Nikola with the sword in one hand and the town in the other - the recension carved at Mozhaisk and copied everywhere after it. He is the saint every court from Novgorod to the Danube recognises, which makes him the one to send an envoy under."
 rip_ro_icon_nicholas_title:0 "Set Up the Icon of Saint Nicholas"
 rip_ro_icon_pancreator:0 "Icon of Saint Sergius of Radonezh"
 rip_ro_icon_pancreator_desc:0 "Sergius founded in the forest and his pupils founded after him, until the north was a chain of monasteries with a village at the foot of each. Building under his icon is building the church has already blessed, and the abbots are the best surveyors in the country."
 rip_ro_icon_pancreator_title:0 "Set Up the Icon of the Pantocrator"
 rip_ro_icon_slot_free_tt:0 "There is a lamp free on the iconostasis. The patriarch's authority decides how many icons may stand at once: §Y1§! at any authority, §Y2§! at §Y30%§!, §Y3§! at §Y55%§!, §Y4§! at §Y80%§!"
 rip_ro_merchant_parish:0 "A Parish That Hears Moscow"
 rip_ro_merchant_preaching:0 "The Merchants' Preaching"
 rip_ro_patriarchal_office:0 "The Patriarchal Office"
 rip_ro_raskol:0 "The Raskol"
 rip_ro_raskol_desc:0 "The church has finished gathering and begun governing. A patriarch who is obeyed, an iconostasis standing in every parish, and a printing house at Moscow deciding which of two service books is the correct one. The parishes that have used the other book for three hundred years are not going to be told."
 rip_ro_raskol_end_tt:0 "The patriarch's authority has fallen below §Y60%§!, or fewer than §Y2§! icons still stand. The church has stopped deciding for everyone"
 rip_ro_raskol_title:0 "The Raskol"
 rip_ro_retired_icon_1:0 "Chancery Icon Record"
 rip_ro_retired_icon_2:0 "Chancery Icon Record"
 rip_ro_retired_icon_3:0 "Chancery Icon Record"
 rip_ro_retired_icon_4:0 "Chancery Icon Record"
 rip_ro_retired_icon_5:0 "Chancery Icon Record"
 rip_ro_retired_sobor_desc:0 "The council's former permanent canons have been withdrawn. The church commissions an icon through the ordinary Orthodox panel; a parish visitation may be funded separately."
 rip_ro_sobor_recently_sat:0 "The Sobor Has Lately Sat"
 rip_ro_sobor_sitting_tt:0 "The Sobor will not sit again for §Y10§! years. The patriarch's authority it draws on is the same the icons burn"
 rip_ro_the_first_rome:0 "The First Rome Held"
 rip_ro_the_first_rome_desc:0 "The city the doctrine says fell is in our hands and keeps our rite. The argument was never that Rome should be destroyed - only that it had forfeited the succession, and that the succession had moved north. Holding it settles the argument in a way no council could."
 rip_ro_the_first_rome_title:0 "Take the First Rome"
 rip_ro_zeal_band_full:0 "The Sobor: the treasury of zeal is full"
 rip_ro_zeal_band_full_desc:0 "At least 80 laid by, against a ceiling of 100. What gathers beyond the ceiling is lost, so it is being wasted."
 rip_ro_zeal_band_gathering:0 "The Sobor: the zeal is gathering"
 rip_ro_zeal_band_gathering_desc:0 "Between 10 and 25 laid by. The parishes are preaching again, but not yet enough to turn to anything."
 rip_ro_zeal_band_laid_by:0 "The Sobor: the zeal is well laid by"
 rip_ro_zeal_band_laid_by_desc:0 "At least 50 laid by. A focus can be bought and held for a long while before the treasury runs dry."
 rip_ro_zeal_band_ready:0 "The Sobor: a focus may be turned"
 rip_ro_zeal_band_ready_desc:0 "At least 25 laid by, which is the price of one focus - the War, the Fairs or the Land."
 rip_ro_zeal_band_spent:0 "The Sobor: the zeal is spent"
 rip_ro_zeal_band_spent_desc:0 "Under 10 laid by. Nothing can be bought and a standing focus is about to go out."
 rip_ro_zeal_cost_tt:0 "The Sobor has at least §Y25§! zeal laid by. It gathers §Y5§! every two years, §Y2§! more while the patriarch is heeded, and §Y2§! more while the church is of one mind"
 rip_ro_zeal_of_the_land_desc:0 "Send the preachers to the districts rather than the armies, hear the grievances in the porch and settle what can be settled there. A quiet country is the slowest of the three purchases and the one that lasts."
 rip_ro_zeal_of_the_land_title:0 "Turn the Zeal to the Land"
 rip_ro_zeal_of_trade_desc:0 "Let the church bless the fairs, keep the weights and hold the contracts, and let it be known that a man who cheats at the fair answers to a court that can also refuse him burial. Merchants pay for that kind of order."
 rip_ro_zeal_of_trade_title:0 "Turn the Zeal to the Fairs"
 rip_ro_zeal_of_war_desc:0 "Let every parish preach the campaign, bless the standards and read the names of the fallen from the ambo. The regiments feel it. It is spent as fast as it is preached, and when the zeal runs out the preaching stops."
 rip_ro_zeal_of_war_title:0 "Turn the Zeal to the War"
 rip_ro_zeal_stability:0 "Zeal of the Sobor: the Land"
 rip_ro_zeal_trade:0 "Zeal of the Sobor: the Fairs"
 rip_ro_zeal_upkeep_tt:0 "A standing focus is not free: §R3§! zeal goes every two years while it holds, and the focus goes out when the last of it is gone"
 rip_ro_zeal_war:0 "Zeal of the Sobor: the War"
 rip_uc_brotherhoods:0 "Revolt of the Brotherhoods"
 rip_uc_brotherhoods_desc:0 "The union has stopped spreading and the country has not come with it. The stauropegial brotherhoods hold the presses, the schools and the hospitals, they answer to Constantinople and to nobody nearer, and every parish the See has not taken is a parish they are speaking in."
 rip_uc_brotherhoods_end_tt:0 "Religious unity has reached §Y60%§!. The realm has stopped arguing about whose obedience it is in"
 rip_uc_brotherhoods_title:0 "Revolt of the Brotherhoods"
 rip_uc_brotherhoods_tolerated:0 "The Brotherhoods Tolerated"
 rip_uc_curia_favoured:0 "Favoured in Roman Correspondence"
 rip_uc_curia_favoured_desc:0 "Roman envoys receive our chancery's dispatches with courtesy."
 rip_uc_curia_heard:0 "Heard at the Curia"
 rip_uc_curia_heard_desc:0 "Our envoys maintain diplomatic correspondence with the Apostolic See."
 rip_uc_curia_protected:0 "Under Papal Goodwill"
 rip_uc_curia_protected_desc:0 "Cordial embassies safeguard our diplomatic intercourse with the Holy See."
 rip_uc_curia_unknown:0 "Diplomatic Audience at Rome"
