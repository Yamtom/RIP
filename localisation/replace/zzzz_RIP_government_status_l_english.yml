 rip_gov_hlc_title:0 "§YGalicia: Boyar Council§!"
 rip_gov_hlc_title_tt:0 "Active Boyar Council course:\n- Co-option (Confirm in Office): +10 Noble Loyalty for 10 years (available below 60% loyalty)\n- Dynastic Defense (Counter Claimant): +3 Legitimacy for 10 years (available below 60% legitimacy)\n- Repression (Make an Example): +3 Army Tradition, -5 Noble Loyalty for 7 years (at peace, loyalty < 40%)"
 rip_gov_hlc_council:0 "Council Course: [Root.RipGovHlcCouncil]"
 rip_gov_hlc_council_tt:0 "Active Boyar Council course:\n- Co-option (Confirm in Office): +10 Noble Loyalty for 10 years (available below 60% loyalty)\n- Dynastic Defense (Counter Claimant): +3 Legitimacy for 10 years (available below 60% legitimacy)\n- Repression (Make an Example): +3 Army Tradition, -5 Noble Loyalty for 7 years (at peace, loyalty < 40%)"
 rip_gov_hlc_session:0 "Council Session: [Root.RipGovHlcSession]"
 rip_gov_hlc_session_tt:0 "Shared 10-year session lockout:\nThe Boyar Council courses share a single 10-year cooldown token (hlc_boyar_council_session).\nChoosing any course convenes the council and locks all other courses for 10 years because co-option, dynastic defence, and repression compete rather than stack as independent tools."
 rip_gov_hlc_hint:0 "Buttons: mechanics box, left."
 rip_gov_hlc_hint_tt:0 "The three council buttons are in the mechanics box on the left, under the government description."
 rip_gov_RipGovLitConsent_0:0 "§GConfirmed (+2 Legitimacy)§!"
 rip_gov_RipGovLitConsent_1:0 "§YNo Consent§!"
 rip_gov_RipGovLitRetinues_0:0 "§YRetinues Mustered§!"
 rip_gov_RipGovLitRetinues_1:0 "§GReady (Will Consume Consent)§!"
 rip_gov_RipGovLitRetinues_2:0 "§YNeeds War & 40% Loyalty§!"
 rip_gov_RipGovLitRetinues_3:0 "§RRequires Rada Consent§!"
 rip_gov_RipGovLitBrokerage_0:0 "§GLord Won Over§!"
 rip_gov_RipGovLitBrokerage_1:0 "§GAvailable (50 DIP -> +15% Loyalty)§!"
 rip_gov_RipGovLitBrokerage_2:0 "§YNobility Loyal (>=50%)§!"
 rip_gov_lit_title:0 "§YLithuania: Pany Rada§!"
 rip_gov_lit_title_tt:0 "Rada Confirmation:\nGrants +2 Legitimacy for 5 years.\nRequires noble loyalty >= 40% and costs 10% noble loyalty.\nActive consent is required to muster the Rada's Own Retinues."
 rip_gov_lit_consent:0 "Rada Consent: [Root.RipGovLitConsent]"
 rip_gov_lit_consent_tt:0 "Rada Confirmation:\nGrants +2 Legitimacy for 5 years.\nRequires noble loyalty >= 40% and costs 10% noble loyalty.\nActive consent is required to muster the Rada's Own Retinues."
 rip_gov_lit_retinues:0 "Retinues: [Root.RipGovLitRetinues]"
 rip_gov_lit_retinues_tt:0 "The Rada's Own Retinues:\nMustering the retinues during wartime CONSUMES the active Rada Consent, costs 10% noble loyalty, and gives +3 Army Tradition and a 5-year combat modifier.\nThe Grand Duke burns his political capital with the lords to call up their private armies."
 rip_gov_lit_lord:0 "Wavering Lord: [Root.RipGovLitBrokerage]"
 rip_gov_lit_lord_tt:0 "Win Over a Wavering Lord:\nCosts 50 diplomatic power to restore +15% noble loyalty when noble loyalty drops below 50%.\nEssential for recovering loyalty to reach the 40% threshold needed for consent or retinues."
 rip_gov_lit_threshold:0 "Thresholds: 40% Consent/Muster | 50% Brokerage"
 rip_gov_lit_threshold_tt:0 "Noble Loyalty Thresholds:\n- 40%: Minimum needed to seek Rada consent or muster retinues\n- 50%: Ceiling for winning over a wavering lord\nBoth major Rada actions reduce loyalty by 10%."
 rip_gov_lit_res_now:0 "In force: [Root.RipGovResName]"
 rip_gov_lit_res_now_tt:0 "The resolution in force, if any. A resolution ends after ten years, or at once if the reform that gave it is removed; the ten-year term still runs on and no other resolution can be passed until it is over."
 rip_gov_lit_res_left:0 "[Root.RipGovResLeft]"
 rip_gov_lit_res_left_tt:0 "The resolution in force, if any. A resolution ends after ten years, or at once if the reform that gave it is removed; the ten-year term still runs on and no other resolution can be passed until it is over."
 rip_gov_lit_res_needs:0 "Needs: [Root.RipGovResPeace] | [Root.RipGovResStability] | [Root.RipGovResTreasury]"
 rip_gov_lit_res_needs_tt:0 "To pass a resolution you need:\n- peace\n- stability of at least 0\n- 50 ducats, which are paid\n- 50 monarch power of the kind named on the button, which is paid\n- no other resolution in force, and ten years since the last one.\nGreen is met, red is not."
 rip_gov_lit_res_hint:0 "Buttons: mechanics box, left."
 rip_gov_lit_res_hint_tt:0 "The two buttons are in the mechanics box on the left, under the government description. The bottom row may need the mouse wheel."
 rip_gov_lit_res_lines:0 "[Root.RipGovResMunicipalCharters][Root.RipGovResMunicipalAccounts][Root.RipGovResChanceryService][Root.RipGovResChanceryRights][Root.RipGovResRegisterMuster][Root.RipGovResRegisterSettlement]"
 rip_gov_lit_res_lines_tt:0 "What each button does, for ten years:\n- Confirm the Municipal Charters (50 DIP): +5% production efficiency, +5% burghers' loyalty, -5 maximum absolutism\n- Examine the Municipal Accounts (50 ADM): +5% national tax, -0.025 yearly corruption, -5% burghers' loyalty\n- Examine the Service Rolls (50 ADM): -5% state maintenance, -0.025 yearly corruption, -5% nobles' loyalty\n- Confirm the Local Rights (50 DIP): -10% culture promotion cost, -0.5 national unrest, -5% national tax\n- Fund the Full Muster (50 MIL): +5% manpower recovery, +5% land maintenance\n- Settle the Service Obligations (50 DIP): -0.5 national unrest, -5% national manpower"
