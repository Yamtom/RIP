 vln_black_voivode_legion:0 "Volhynian Court Regiment"
 vln_black_voivode_legion_desc:0 "A permanent court regiment, paid by the voivode and drilled throughout the year, supplies a reliable professional core without importing Hungary's Black Army wholesale."
 vln_confessional_academy:0 "Confessional Academy"
 vln_confessional_academy_desc:0 "State-supported academies train clergy and administrators, improving unity and learning."
 vln_confessional_reform:0 "Confessional Voivodeship"
 vln_confessional_reform_desc:0 "A settled confessional arrangement formalizes coexistence between Volhynia's Orthodox and Latin communities, strengthening religious cohesion."
 vln_cossack_host_reform:0 "Cossack Host Privileges"
 vln_cossack_host_reform_desc:0 "The Host receives chartered lands and a voice in the realm in return for registered cavalry and frontier service. Its privileges strengthen the army but curb the crown's absolutist reach. Once in ten years the register may be settled from the government window: fund the full muster or settle the service obligations."
 vln_dietine_instructions_reform:0 "Sejmik Instructions"
 vln_dietine_instructions_reform_desc:0 "Every local sejmik binds its own deputies to a written mandate before they may sit in the wider assembly, trading flexibility for a chamber that speaks with one voice."
 vln_grand_ruthenia_reform:0 "Grand Ruthenia"
 vln_grand_ruthenia_reform_desc:0 "A universal title for a reformed Ruthenian state secures prestige and authority."
 vln_magdeburg_rights:0 "Magdeburg Rights"
 vln_magdeburg_rights_desc:0 "Chartered towns keep their own courts and accounts. Once in ten years the ruler may pass a municipal resolution from the government window, paying the clerks to confirm the charters or to examine the accounts. One resolution at a time binds the chancery and the register as well."
 vln_ruthenia_reform:0 "Ruthenian Legitimacy"
 vln_ruthenia_reform_desc:0 "The Ruthenian crown and its noble assembly codify their shared governance, bolstering legitimacy and administrative strength across Volhynia."
 vln_ruthenian_renaissance_reform:0 "Ruthenian Renaissance"
 vln_ruthenian_renaissance_reform_desc:0 "Patronage of letters and learning spurs development and prestige."
 vln_sejmik_republic_reform:0 "Sejmik Republic"
 vln_sejmik_republic_reform_desc:0 "The magnate senate stops advising the voivode and starts electing one for a fixed term, following the sejmik custom of the wider Commonwealth next door."
 vln_path_sejmik_req_tt:0 "The magnate sejmik must have asserted itself over the voivode."
 vln_voivode_council:0 "Voivode Council"
 vln_voivode_council_desc:0 "A standing council of voivodes professionalizes military leadership."
 vln_voivodeship_reform:0 "Volhynian Voivodeship"
 vln_voivodeship_reform_desc:0 "A voivodeship system balances noble authority with centralized administration."

 # --- decisions/VLNRepublicPaths ---
 vln_the_sejmik_asserts_itself_title:0 "The Sejmik Asserts Itself"
 vln_the_sejmik_asserts_itself_desc:0 "Since the Second Lithuanian Statute of 1566 and the Union of Lublin, the noble sejmik is the working organ of local self-government. The dynasty's line runs thin, and a senate that has just sat no longer sees a reason to wait on it. Let the sejmik elect the voivode outright?\n\nRequires an independent Volhynia at peace, the Magnate Senate summoned within the last five years, and a dynastic crisis (no heir or legitimacy below 50)."
 vln_sejmik_senate_sitting_tt:0 "The Magnate Senate has been summoned within the last five years."
 vln_sejmik_dynastic_crisis_tt:0 "The dynasty is in crisis: no heir, or legitimacy below 50."
 rip_vln_sejmik_asserts_itself:0 "The Sejmik Asserts Itself"
 desc_rip_vln_sejmik_asserts_itself:0 "The magnate senate governs in the voivode's name and no longer waits on his consent."

 # --- vln_magnate_senate_mechanic ---
 ability_vln_magnate_senate_mechanic:0 "The Magnate Senate"
 vln_summon_the_senate:0 "Summon the Senate"
 vln_summon_the_senate_desc:0 "Pay a quarter of a year of income to convene the great houses for five years. Their consent advances reform but strengthens noble influence; it can be consumed to call their banners in war. Eight-year cooldown."
 vln_buy_off_a_magnate_house:0 "Buy Off a Magnate House"
 vln_buy_off_a_magnate_house_desc:0 "Pay half a year of income and grant 15 autonomy in a random non-capital city with less than 75 autonomy. Local unrest falls by 5, and the house supports the voivode for five years. Ten-year cooldown."
 vln_call_up_the_magnate_banners:0 "Call Up the Magnate Banners"
 vln_call_up_the_magnate_banners_desc:0 "During war, consume the convened Senate to call the magnate banners. Gain 10 percent of maximum manpower and five years of stronger cavalry and a higher force limit, with higher army maintenance. Ten-year cooldown."
 vln_senate_convened:0 "Senate Convened"
 vln_magnate_house_bought:0 "Magnate House Bought Off"
 vln_magnate_banners_mustered:0 "Magnate Banners Mustered"
