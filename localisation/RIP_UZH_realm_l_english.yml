 UZH_this_is_a_branching_mission:0 "The council at Palanok must settle our allegiance before we can pursue this mission."
 uz_identity_branching_1_title:0 "Pending Allegiance Branch"
 uz_identity_branching_1_desc:0 "The lords at Palanok must decide whose protection our lands can trust. Their answer will determine which oaths our envoys take abroad."
 uz_identity_branching_2_title:0 "Pending Allegiance Branch"
 uz_identity_branching_2_desc:0 "We have named our friends. Now we must secure their pledges before the next council meets at Palanok."
 uz_identity_branching_3_title:0 "Pending Allegiance Branch"
 uz_identity_branching_3_desc:0 "Continued fidelity to our chosen path will unveil the final objective of this branch."
 UZH_resist_habsburgs_pressure_tt:0 "§YOne§! of the following must be true:\n- We are a subject of a monarchy with at least §Y150§! development.\n- A neighboring monarchy with at least §Y150§! development views us as a rival."
 UZH_revival_komitat_condition_tt:0 "Adopt the Komitat Estates reform or otherwise restructure the Komitat administration."
 UZH_federalization_subjects_tt:0 "All subjects must have §YLiberty Desire§! below §Y60§!."
 UZH_agriculture_pastures_tt:0 "Control at least §Ytwo§! livestock provinces in the Carpathian region."
 UZH_industrial_coal_tt:0 "Own at least §Yone§! province producing §YCoal§!."
 UZH_pannonian_compact_government_tt:0 "Either maintain a republican government or complete the Constitutional Framework mission to adapt the compact for monarchic rule."
 uz_backa_colonial_network:0 "Bácska Colonial Network"
 uzh_danube_trade_league_title:0 "Forge the Danube Trade League"
 uzh_danube_trade_league_desc:0 "Leverage every Rusyn market from Uzhhorod to Novi Sad, binding them into a riverine league that dominates toll houses and caravans alike."
 UZH_identity_question_culture_tt:0 "§YAllegiance Threshold:§! Control at least §Y5§! provinces of the people you have chosen before convening the congress."
 uz_kyivan_legacy:0 "Kyivan Legacy"
 uz_rusyn_self_governance:0 "Rusyn Self-Governance"
 uz_carpathian_federation:0 "Carpathian Federation"
 uzh_salt_corridors_title:0 "Salt Corridors"
 uzh_salt_corridors_desc:0 "Standardise salt barns and wine depots from Solotvyno to the Pest quays so every convoy marches under our counters and customs seals."
 UZH_salt_corridors_pest_share_tt:0 "§YDominate the Pest trade:§! We must be the strongest trade power in the Pest node."
 uzh_solotvynska_camera_title:0 "Solotvynska Camera"
 uzh_solotvynska_camera_desc:0 "Compile crown ledgers for the Solotvyno chambers so every barrel is weighed, taxed, and dispatched under a single Rusyn seal."
 UZH_solotvynska_camera_salt_tt:0 "§YRegulate the salt chambers:§! Own at least one §Ysalt§! province with either a manufactory or 15 development."
 UZH_solotvynska_camera_reward_tt:0 "Every owned §Ysalt§! province gains §Y“Solotvyno Chambers”§! for §Y10 years§!."
 uz_salt_corridor_depots:0 "Salt Corridor Depots"
 uz_salt_corridor_convoys:0 "Danube Convoy Schedules"
 uz_solotvynska_camera:0 "Solotvynska Camera"
 uzh_granichar_districts_title:0 "Granichar Districts"
 uzh_granichar_districts_desc:0 "Reform the Carpathian forts into permanent granichar districts, blending Military Frontier drill with Rusyn captaincies to anchor the passes."
 uz_granichar_command:0 "Granichar Commandants"
 uz_granichar_loyalty:0 "Granichar Loyalty Oaths"
 uz_union_compromise_plus_title:0 "Union Compromise Charter"
 uz_union_compromise_plus_desc:0 "Fund theological debates and print new catechisms so both rite defenders and Latin patrons embrace the compact."
 uz_union_compromise_plus:0 "Union Compromise Charter"
 uz_language_decree_title:0 "Language Decree"
 uz_language_decree_desc:0 "Issue a decree on administrative languages, commissioning translators to render statutes for every marcher commune."
 uz_language_decree:0 "Language Decree"
 uzh_tisza_customs_convention_title:0 "Tisza Customs Convention"
 uzh_tisza_customs_convention_desc:0 "Broker a customs convention along the Upper Tisza so Pest, Mukachevo, and downstream marts treat our convoys as one tariff space."
 UZH_tisza_customs_pest_tt:0 "§YDominate Pest:§! Be the strongest trade power in the Pest node."
 UZH_tisza_customs_downstream_tt:0 "§YSecure downstream outlets:§! Be the strongest trade power in either the Wien or Ragusa trade node."
 UZH_tisza_customs_reward_tt:0 "Eligible markets in Carpathia, Alföld, and Slavonia gain §Y“Tisza Customs Depot”§! for §Y10 years§!."
 uz_tisza_customs_convention:0 "Tisza Customs Convention"
 uz_tisza_customs_depot:0 "Tisza Customs Depot"
 uzh_identity.1.t:0 "The Question of Our Name"
 uzh_identity.1.d:0 "Our people stand at a crossroads. For centuries we have been [Root.GetUZHIdentityCulturePlural], yet rival voices promise different destinies—joining the greater Ruthenian nation, defending an independent [Root.GetUZHIdentityCultureAdjective] march, or binding ourselves fully to the Hungarian crown."
 uzh_identity.1.a:0 "We are part of the great Ruthenian nation!"
 uzh_identity.1.b:0 "We are an independent Rusyn nation!"
 uzh_identity.1.c:0 "We are loyal Uhro-Rusyns!"
 ZAKARPATTIA_HISTORICAL_OVERVIEW:0 "Carved between the Carpathian ridgelines and the Tysa, Zakarpattia bridges crowns and confessions alike. From the Korjatovych princes to the Habsburg frontier captains, its march towns learned to bargain, fortify, and pray in many tongues."
 ZAKARPATTIA_FRONTIER_GUARD:0 "Zakarpattian Frontier Guard"
 desc_ZAKARPATTIA_FRONTIER_GUARD:0 "Border cavaliers drill alongside Palanok's garrison, keeping smugglers in check and warning the Diet whenever imperial agents cross the passes."
 ZAKARPATTIA_TRADE_NETWORK:0 "Zakarpattian Caravan Network"
 desc_ZAKARPATTIA_TRADE_NETWORK:0 "Salt caravans from Solotvyno and wine barges from Tokaj converge at Uzhhorod, filling the toll coffers while guildsmen weave new partnerships with Danubian markets."
 ZAKARPATTIA_CULTURAL_MOSAIC:0 "Zakarpattian Cultural Mosaic"
 desc_ZAKARPATTIA_CULTURAL_MOSAIC:0 "Rusyn parishes, Magyar counties, and Saxon burghers share a chartered commons, nurturing schools that teach in Latin by day and sing in Church Slavonic at vespers."
 desc_uz_solotvyno_chambers:0 "The salt caverns of Solotvyno are braced with new timberwork and watchtowers, letting brine flow steadily to the pans."
 desc_uz_salt_chamber_overwatch:0 "A royal accountant watches every wagon leaving Solotvyno, tightening marginal profits and keeping the salt sold under crown seal."
 desc_uz_private_salt_leases:0 "Burgher consortia hold exclusive leases on the Solotvyno pits, promising high output in exchange for generous tax lenience."
 desc_uz_mountain_gendarmerie:0 "Palanok’s watchtowers drill new gendarmes, stiffening our frontier regiments even as they siphon labour from the workshops."
 desc_uz_amnesty_rollout:0 "County notaries commute sentences and remit salt arrears, buying uneasy calm at the cost of leaner tax rolls."
 desc_uz_opryshky_raids:0 "Band pikes and torches harass our caravans, driving up insurance on the salt roads while fear haunts the market stalls."
 desc_uz_rebel_legends:0 "Ballads of Dovbush and Pyntya echo from tavern to parish, easing unrest as subjects embrace a shared mountain lore."
 desc_uz_opryshky_pacified:0 "The opryshky fraternities now watch the ridgelines for us, uniting their knowledge of mountain trails with regular march discipline."
 desc_uz_greek_catholic_concord:0 "Rome recognizes our Basilian fathers while letting their chant resound in Slavonic, giving Uzhhorod leverage at both altar and court."
 desc_uz_old_rite_resilience:0 "The brotherhoods guard the Orthodox liturgy, making it easier to keep monasteries staffed and incense burning."
 desc_uz_kuruc_border_raids:0 "Kuruc captains harry imperial posts and draw restless youths into their camps, lifting spirits but unsettling the countryside."
 desc_uz_habsburg_border_command:0 "Imperial engineers buttress our passes, staffing Palanok with loyal garrisons and winning favor in Vienna."
 desc_uz_palatial_chambers:0 "Subject envoys sit in the palatine chambers, smoothing debate negotiations and nudging petitions through with practiced ease."
 desc_uz_federative_statutes_capacity:0 "A federal census bureau expands our registers, easing the weight of governance while subject capitulations stay loyal."
 desc_uz_federative_statutes_autonomy:0 "Codified renewal cycles remind each march when to cede privileges, keeping the federated realm obedient without heavy-handed decrees."
 desc_uz_karloca_synod_blessing:0 "Clergy returning from Karlovac preach unity of rite and obedience to the march, rekindling zeal while the synod's settlement strengthens our altars and estates."
 desc_uz_cathedral_guild_college:0 "Scholar-burghers endow bursaries in our cathedral town, training jurists, translators, and guild secretaries for the chancery."
 desc_uz_congress_subject_charters:0 "The Carpathian Congress codifies new liberties for our vassals, coaxing their treasuries open while their loyalty hardens into habit."
 desc_uz_congress_border_drill:0 "Joint regiments from every Carpathian pass drill together, exchanging manuals and seasoned officers to keep the marches sharp."
 desc_uz_coal_foundry_network:0 "Forges from Huszt to the Tisza operate on a single schedule, sharing coke shipments and metallurgists to feed new cannon and tools."
 desc_uz_coal_export_charters:0 "Counting houses win exclusive rights to ship Zakarpattian coal, greasing customs with ready specie and flooding the markets beyond the mountains."
 desc_uz_duchnovych_awakening:0 "Reading rooms and singing societies spread literacy, thrift, and the conviction that [Root.GetUZHIdentityCultureAdjective] custom deserves its own print."
 desc_uz_magyarization_drive:0 "County inspectors enforce Magyar schooling and administration, speeding assimilation at the cost of unrest and foreign trust."
 palanok_fortress:0 "Palanok Fortress"
 palanok_fortress_desc:0 "Crowning the volcanic hill above Mukachevo, Palanok Fortress commands the mountain passes, shelters regional diets, and endures as a bastion of Carpathian resistance."
 uzh_sg_captains_15_tt:0 "The scale of the captaincy moves §Y15§! toward the §YCaptains' Party§!."
 uzh_sg_captains_20_tt:0 "The scale of the captaincy moves §Y20§! toward the §YCaptains' Party§!."
 uzh_sg_sejm_15_tt:0 "The scale of the captaincy moves §Y15§! toward the §YSejm Party§!."
 uzh_sg_sejm_20_tt:0 "The scale of the captaincy moves §Y20§! toward the §YSejm Party§!."
 great_hauptmann_reform:0 "Great Hauptmann"
 great_hauptmann_reform_desc:0 "The Great Hauptmann is the elected leader of the Ruthenian and Cossack states, who has the authority to claim new lands and enact administrative policies."
 desc_uz_ambitious_expansion_modifier:0 "Diplomats across Ruthenia are tasked with weaving new subject alliances into a single crown."
 desc_uz_protected_frontier:0 "Our eastern borders are well fortified against potential invasions."
 desc_uz_palank_border_watch:0 "The palanok watch chain drills each marcher company to rotate between the passes, lightening the strain on the treasury while keeping the frontier vigilant."
 desc_uz_cultural_renaissance:0 "Our people are experiencing a revival of Rusin culture and traditions."
 desc_uz_carpathian_federation_diprep:0 "A dedicated corps of envoys tends to the republic's palatine partners, soothing rivalries while we grow."
 unity_of_rusin:0 "Unity of Rusin"
