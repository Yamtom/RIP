 rip_church_icon_war:0 "Military"
 rip_church_icon_war_action:0 "[Root.GetChurchIconWarAction]"
 rip_church_icon_war_action_tt:0 "§YMilitary Intercession§!\nSteppe border: your provinces on steppe or grassland, or beside a steppe power, gain §G+20% defensiveness§! and §G+1 attrition§! for invaders.\nAt war with a steppe power: §G+5% discipline§! and §G+10% manpower recovery§!, applied within a month of the war.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconWarAccess]"
 rip_church_icon_war_benefit:0 "§GSteppe border\nDefence +20%\nvs nomads +5%§!"
 rip_church_icon_war_benefit_tt:0 "§YMilitary Intercession§!\nSteppe border: your provinces on steppe or grassland, or beside a steppe power, gain §G+20% defensiveness§! and §G+1 attrition§! for invaders.\nAt war with a steppe power: §G+5% discipline§! and §G+10% manpower recovery§!, applied within a month of the war.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconWarAccess]"
 rip_church_icon_war_button:0 "Military"
 rip_church_icon_war_button_tt:0 "§YMilitary Intercession§!\nSteppe border: your provinces on steppe or grassland, or beside a steppe power, gain §G+20% defensiveness§! and §G+1 attrition§! for invaders.\nAt war with a steppe power: §G+5% discipline§! and §G+10% manpower recovery§!, applied within a month of the war.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconWarAccess]"
