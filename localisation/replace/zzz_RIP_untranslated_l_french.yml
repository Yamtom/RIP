 dnieper_commerce_network:0 "Dnieper Commerce Network"
 dnieper_commerce_network_desc:0 "An organized system of trade along the Dnieper River."
 dnieper_defense_line:0 "Dnieper Defense Line"
 dnieper_defense_line_desc:0 "Part of a defensive network protecting the Dnieper region."
 dnieper_fortified_border:0 "Dnieper Fortified Border"
 dnieper_fortified_border_desc:0 "A system of fortifications protects our Dnieper territories."
 dnieper_grain_surplus:0 "Dnieper Grain Surplus"
 dnieper_grain_surplus_desc:0 "Abundant grain production from the fertile Dnieper basin."
 dnieper_noble_estates:0 "Dnieper Noble Estates"
 dnieper_noble_estates_desc:0 "Nobles have developed agricultural estates worked by peasant labor."
 dnieper_peasant_settlement:0 "Dnieper Peasant Settlement"
 dnieper_peasant_settlement_desc:0 "Free peasants have settled this land and developed it for agriculture."
 dnieper_river_port:0 "Dnieper River Port"
 dnieper_river_port_desc:0 "A well-developed port facility facilitating river trade."
 dnieper_trade_hub:0 "Dnieper Trade Hub"
 dnieper_trade_hub_desc:0 "This city serves as a major hub for commerce along the Dnieper River trade route."
