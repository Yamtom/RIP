 wr_tt_rusyn_s4_index:0 "Global §YRusznjoczky§! Province Adoption Index is at least §Y85%§! (currently §Y[Root.wr_rusyn_s3_pct.GetValue]%§!: §Y[Root.wr_rusyn_s3_cnt.GetValue]§! of §Y[Root.wr_rusyn_total.GetValue]§! provinces)."
 wr_charter_distinctiveness_decision_title:0 "Charter Vernacular Chancery Distinction"
 wr_charter_distinctiveness_decision_desc:0 "Branch A, Stage 1 (precursor to Stage 2; excludes Branch B). Records native chancery and church usage for Belarusians (Bielaruski), Ruthenians (Ruskyi), and Carpathian Rusyns (Rusnacky) distinct from Muscovite customs. Consults the Three Circles (max 50% commission success)."
 wr_rally_branch_a_congress_decision_title:0 "Convene Branch A Envoys for Adoption Index"
 wr_rally_branch_a_congress_decision_desc:0 "Sends chancery and ecclesiastical envoys to states holding our shared lands that have not yet enrolled their Belarusian, Ruthenian, or Rusyn provinces under Stage 1 charters. Raising diplomatic ties makes foreign ratification likely, lifting the Global Province Adoption Index toward 60%."
 wr_codify_west_ruthenian_group_decision_title:0 "Codify Separate Ruthenian Cultural Group"
 wr_codify_west_ruthenian_group_decision_desc:0 "Branch A, Stage 2 (requires Stage 1 for 15 years, Printing Press, collective Three-Circle mandate, and at least 60% Global Province Adoption Index per converted people). Codifies Bielaruski, Ruskyi, and Rusnacky in a separate Ruthenian group (max 30% diet approval)."
 wr_proclaim_west_slavic_affinity_decision_title:0 "Proclaim West Slavic Urban Affinity"
 wr_proclaim_west_slavic_affinity_decision_desc:0 "Branch B, Stage 3 (parallel to Branch A and mutually exclusive; precursor to Stage 4). Connects town halls, noble dietines, and academies to Kraków, Prague, and Trnava through dual-script print and Magdeburg charters (< 20% commission approval)."
 wr_rally_branch_b_congress_decision_title:0 "Convene Branch B Envoys for West Slavic Index"
 wr_rally_branch_b_congress_decision_desc:0 "Dispatches academic and municipal envoys to states holding our shared provinces that have not yet joined Branch B affinity charters. High opinion, alliances, or overlordship sway courts to enlist their provinces, advancing the Global Province Adoption Index toward 85%."
 wr_attempt_west_slavic_transition_decision_title:0 "Petition Entry into the West Slavic Group"
 wr_attempt_west_slavic_transition_decision_desc:0 "Branch B, Stage 4 (requires Stage 3 for 30 years, Global Trade, collective Three-Circle mandate, and at least 85% Global Province Adoption Index per converted people). Moves Bjalowruszsky, Ruszynjsky, or Rusznjoczky into the West Slavic group (< 5% chancery approval)."
 wr_cultural_maneuver.1.t:0 "Vernacular Charters and Native Register"
 wr_cultural_maneuver.1.d:0 "From Vilnius and Polatsk through Kyiv, Lviv, and Ostroh to Mukachevo and Khust, scribes draft land deeds, wills, and sermons in living tongues far removed from Muscovite commandery usage. We assemble a Three-Circle commission to formalize these separate registers without confounding our peoples."
 wr_cultural_maneuver.1.d_belarus:0 "Across Polatsk, Minsk, Navahroudak, and Vilnius, the Grand Duchy's Chancery relies on spoken Belarusian prose - the prosta mova of court testaments and early Vilnius-Prague translations - clearly distinct from Muscovite orders and from the Ruthenian lands south of the Pripyat. Our commission seeks Three-Circle recognition for Bielaruski usage."
 wr_cultural_maneuver.1.d_ruthenia:0 "In Kyiv, Volodymyr-Volynskyi, Lviv, Halych, and Kamianets, castle and land court rolls already follow local Ruthenian speech, later echoed in the Volhynian-Kyivan-Bratslav charter of Ruthenian lettering and vernacular Gospel translation. Distinct from Muscovite prikazy, Belarusian Grand Ducal usage, and Carpathian Rusyn valleys, Ruskyi demands formal recognition."
 wr_cultural_maneuver.1.d_rusyn:0 "In the mountain valleys of Ung, Bereg, Ugocsa, Maramaros, Saris, and Zemplen, Carpathian Rusyns maintain ius Valachicum village charters led by sholtys and knyaz elders, salt customs at Solotvyno, and simple parish homilies under Mukachevo's eparchy. Distinct from Belarusians and Dnieper-Galician Ruthenians, Rusnacky seeks its own charter."
 wr_cultural_maneuver.1.a:0 "Convene the Three-Circle commission (<= 50%)."
 wr_cultural_maneuver.1.b:0 "Issue a royal patent despite conservative dissent."
 wr_cultural_maneuver.1.c:0 "Defer the charter and keep existing clerks."
 wr_cultural_maneuver.2.t:0 "Vernacular Distinction Inscribed"
 wr_cultural_maneuver.2.d:0 "The commission upheld native municipal and chancery registers across our lands. Imperial and local envoys carry the charter to sovereigns of the same primary culture, courts accepting the tongue, and rulers holding frontier provinces."
 wr_cultural_maneuver.2.d_belarus:0 "Notaries in Vilnius, Minsk, and Polatsk entered the Bielaruski chancery register into court books, anchoring the Grand Duchy's prosta mova tradition apart from Moscow. Envoys now invite all Three Circles to join."
 wr_cultural_maneuver.2.d_ruthenia:0 "Judicial clerks from Kyiv, Volhynia, and Lviv certified the Ruskyi chancery register, securing provincial court books and parish teaching apart from Muscovite usage. Envoys set out toward our sister courts."
 wr_cultural_maneuver.2.d_rusyn:0 "County scribes and Mukachevo deans confirmed Rusnacky vernacular homilies and ius Valachicum sholtys charters across Subcarpathia. Envoys depart to rally neighboring crowns."
 wr_cultural_maneuver.2.a:0 "Dispatch the charter across the Three Circles."
 wr_cultural_maneuver.3.t:0 "Conservatives Stall the Vernacular Charter"
 wr_cultural_maneuver.3.d:0 "Monastic elders and conservative boyars objected to separating chancery language from ancient Church Slavonic models. The commission dispersed without signing a patent."
 wr_cultural_maneuver.3.d_belarus:0 "Monastic superiors in Polatsk and Turau insisted on unaltered Church Slavonic orthography against the vernacular Bielaruski reforms of Vilnius scribes."
 wr_cultural_maneuver.3.d_ruthenia:0 "Elders of ancient Kyiv, Volhynian, and Halych monasteries defended high Slavonic books against popular Ruskyi court glosses, delaying the commission."
 wr_cultural_maneuver.3.d_rusyn:0 "Traditionalists of Maramaros and Mukachevo clergy refused any departure from old Carpathian Slavonic copybooks."
 wr_cultural_maneuver.3.a:0 "Leave the inherited registers intact."
 wr_cultural_maneuver.10.t:0 "Codifying a Separate Ruthenian Cultural Group"
 wr_cultural_maneuver.10.d:0 "European chanceries routinely use the Latin name 'Ruthenian' for the non-Muscovite Rus' peoples. With Stage 1 recognized across most provinces and printing presses active, jurists propose placing Bielaruski, Ruskyi, and Rusnacky inside a separate Ruthenian group."
 wr_cultural_maneuver.10.d_belarus:0 "Building on the Lithuanian Statutes of 1529, 1566, and 1588, Francysk Skaryna's Vilnius press (1522), Symon Budny's Nesvizh catechism (1562), and Chancellor Leu Sapieha's mandate requiring court scribes to write 'in Ruthenian letters and words', Belarusians claim a distinct Bielaruski place in the separate Ruthenian group."
 wr_cultural_maneuver.10.d_ruthenia:0 "Sustained by the Ostroh Academy (1576) and Ostroh Bible (1581), the Lviv Dormition Stavropigia press (1586), the Peresopnytsia vernacular Gospel, and the 1569 guarantee of Ruthenian lettering in Kyiv, Volhynia, and Bratslav courts, Ruthenians claim a separate Ruskyi standing outside Muscovy."
 wr_cultural_maneuver.10.d_rusyn:0 "Supported by Carpathian teaching gospels in clear peasant speech, Mukachevo episcopal schools, Bereg and Ugocsa county statutes, and Magdeburg liberties from Khust to Presov, Carpathian Rusyns seek separate Rusnacky classification outside Moscow's sphere."
 wr_cultural_maneuver.10.a:0 "Put the separate group codex to a high diet vote (<= 30%)."
 wr_cultural_maneuver.10.b:0 "Proclaim the codex by costly sovereign decree."
 wr_cultural_maneuver.10.c:0 "Retain the present East Slavic classification."
 wr_cultural_maneuver.11.t:0 "Separate Ruthenian Group Codified"
 wr_cultural_maneuver.11.d:0 "Estates and printing academies ratified the codex: only those peoples whose Global Province Adoption Index reached sixty percent enter the separate Ruthenian cultural group as Bielaruski, Ruskyi, or Rusnacky."
 wr_cultural_maneuver.11.d_belarus:0 "With Vilnius, Polatsk, Minsk, and Navahroudak aligned behind the 1588 Chancery mandate, Bielaruski leaves the Muscovite-dominated East Slavic group to stand in the separate Ruthenian group."
 wr_cultural_maneuver.11.d_ruthenia:0 "Ratified from Ostroh and Lviv to Kyiv and Chernihiv, Ruskyi enters the separate Ruthenian cultural group, honoring the 1569 chancery guarantees and brotherhood presses."
 wr_cultural_maneuver.11.d_rusyn:0 "Ratified by Mukachevo synods and Ung-Bereg-Maramaros assemblies, Rusnacky enters the separate Ruthenian group as a recognized mountain people distinct from plains Ruthenians and Belarusians."
 wr_cultural_maneuver.11.a:0 "Circulate the ratified codex to all Three Circles."
 wr_cultural_maneuver.12.t:0 "Diet Rejects Cultural Group Separation"
 wr_cultural_maneuver.12.d:0 "Magnates with wide cross-border estates and clerical deputies balked at severing ancient East Slavic taxonomy. The codex fell short of the thirty percent threshold needed to pass."
 wr_cultural_maneuver.12.d_belarus:0 "Magnates holding lands from Polatsk to Chernihiv warned against dividing ancient ecclesiastical jurisdiction, defeating the Bielaruski codex in diet."
 wr_cultural_maneuver.12.d_ruthenia:0 "Metropolitan envoys and frontier magnates in Volhynia and Podillia feared losing ancient Kyiv-Chernihiv ties, blocking the Ruskyi separation vote."
 wr_cultural_maneuver.12.d_rusyn:0 "Fearing isolation from Halych and Lviv monasteries across the Carpathian passes, highland deputies rejected the Rusnacky separation codex."
 wr_cultural_maneuver.12.a:0 "Seek broader consensus among neighboring courts."
 wr_cultural_maneuver.15.t:0 "Overlord Codifies the Separate Ruthenian Group"
 wr_cultural_maneuver.15.d:0 "Our overlord has ratified the separate Ruthenian cultural group for every culture meeting the Global Adoption Index and invites our chancery to follow suit."
 wr_cultural_maneuver.15.d_belarus:0 "Our overlord has codified Bielaruski within a separate Ruthenian cultural group modeled on Grand Ducal statute usage and invites our court to align."
 wr_cultural_maneuver.15.d_ruthenia:0 "Our overlord has codified Ruskyi within a separate Ruthenian cultural group echoing Kyiv and Lviv charter freedoms and invites our chancery to follow."
 wr_cultural_maneuver.15.d_rusyn:0 "Our overlord has placed Carpathian Rusyns under Rusnacky in a separate Ruthenian group and invites our mountain estates to adopt the code."
 wr_cultural_maneuver.15.a:0 "Adopt the overlord's Ruthenian codex."
 wr_cultural_maneuver.15.b:0 "Keep our current cultural registers."
 wr_cultural_maneuver.20.t:0 "Pull of the West Slavic Urban Orbit"
 wr_cultural_maneuver.20.d:0 "Pursuing a separate track altogether from East Slavic statute reform, printed scholarship from Kraków, Prague, and Trnava, German-Polish Magdeburg town guilds, and bilingual noble diets draw our urban estates into the West Slavic orbit (< 20%)."
 wr_cultural_maneuver.20.d_belarus:0 "Bypassing Vilnius's eastern chancery line, burghers and nobles of Grodno, Brest, and Navahroudak educate their sons at Kraków and Prague, compose court pleas in early Belarusian lacinka, and share Magdeburg town benches with Polish burghers."
 wr_cultural_maneuver.20.d_ruthenia:0 "Apart from Kyiv and Chernihiv traditionalists, gentry of Lviv, Przemysl, Volhynia, and Kamianets throng to Kraków Academy and Zamosc, keep parallel Polish-Latin and Ruthenian castle rolls, and align town guild law with Lesser Poland."
 wr_cultural_maneuver.20.d_rusyn:0 "Bypassing northern Ruthenian ties, Rusnaks of Saris, Spis, Zemplen, and Ung live side by side with Slovak and Polish towns from Presov and Bardejov to Kosice, reading Trnava and Kraków imprints in daily commerce."
 wr_cultural_maneuver.20.a:0 "Forge the West Slavic urban affinity (< 20%)."
 wr_cultural_maneuver.20.b:0 "Force the West Slavic alignment by costly decree."
 wr_cultural_maneuver.20.c:0 "Guard local parish custom."
 wr_cultural_maneuver.21.t:0 "West Slavic Civic Affinity Proclaimed"
 wr_cultural_maneuver.21.d:0 "Delegates from Kraków, Prague, and the Slovak mining towns welcome our magistrates into a shared bilingual civic and legal circuit. Envoys set out to enroll the Three Circles."
 wr_cultural_maneuver.21.d_belarus:0 "Alumnae of Kraków and Prague ratify shared municipal charters across Brest, Grodno, and Vilnius, opening dual-script West Slavic civic life to Bielaruski townsmen."
 wr_cultural_maneuver.21.d_ruthenia:0 "Guilds and dietine jurists in Lviv, Halych, Volhynia, and Bratslav establish bilingual municipal and noble compacts alongside Kraków and Sandomierz law."
 wr_cultural_maneuver.21.d_rusyn:0 "Across Presov, Bardejov, and Uzhhorod, Latin municipal benches and Greek Catholic or Orthodox deaneries sign a joint civic compact with Slovak, Polish, and Bohemian towns."
 wr_cultural_maneuver.21.a:0 "Proclaim the urban affinity pact to the Three Circles."
 wr_cultural_maneuver.22.t:0 "Urban Affinity Pact Fails"
 wr_cultural_maneuver.22.d:0 "Parish clergy, rural elders, and skeptical nobles rejected alien Latin orthography and foreign municipal models as threats to inherited custom."
 wr_cultural_maneuver.22.d_belarus:0 "Conservative magnates in Polatsk and Vitebsk allied with brotherhood clergy to reject Kraków-style dual-script privileges."
 wr_cultural_maneuver.22.d_ruthenia:0 "Burghers of the Lviv brotherhood and Dnieper cossack deputies condemned Latin-Polish legal encroachment on Ruthenian parishes."
 wr_cultural_maneuver.22.d_rusyn:0 "Carpathian parish priests and Maramaros elders rallied against Trnava and Spis schooling, keeping local chanceries closed."
 wr_cultural_maneuver.22.a:0 "Keep customary urban laws."
 wr_cultural_maneuver.30.t:0 "The West Slavic Threshold"
 wr_cultural_maneuver.30.d:0 "Thirty years of Branch B dual-script commerce and academy ties have reshaped town halls and gentry dietines, pushing our Global Province Adoption Index above eighty-five percent. Like Lusatian Sorbs and eastern Slovak marches before them, a rare final step into the West Slavic family stands open (< 5%)."
 wr_cultural_maneuver.30.d_belarus:0 "Thirty years of lacinka-Cyrillic publishing, Vilnius-Grodno-Brest guild integration, and shared gentry law with Poland make possible Bjalowruszsky - not erasure into Polish, but a distinct West Slavic civic tongue shaped by western Ruthenian lands."
 wr_cultural_maneuver.30.d_ruthenia:0 "Thirty years of trilingual Kraków-Zamosc-Kyiv humanism and bilingual Volhynian, Podillian, and Galician magistracies open the rare path to Ruszynjsky - a stylized West Slavic civic synthesis preserving local parish memory without Moscow or Warsaw absorption."
 wr_cultural_maneuver.30.d_rusyn:0 "Thirty years of shared markets, Greek Catholic Trnava catechisms, and Saris-Spis-Zemplen county coexistence parallel historical eastern Slovak shifts, yet forge Rusznjoczky as a distinct Carpathian partner in the West Slavic group."
 wr_cultural_maneuver.30.a:0 "Petition full West Slavic synthesis (< 5%)."
 wr_cultural_maneuver.30.b:0 "Retain bilingual affinity without crossing the border."
 wr_cultural_maneuver.31.t:0 "West Slavic Civic Synthesis Achieved"
 wr_cultural_maneuver.31.d:0 "Against immense odds, the chancery congress ratified the final charter: every culture whose Global Province Adoption Index passed eighty-five percent enters the West Slavic group as Bjalowruszsky, Ruszynjsky, or Rusznjoczky."
 wr_cultural_maneuver.31.d_belarus:0 "Across Brest, Grodno, Vilnius, and Polatsk, magistrates enter the West Slavic group under Bjalowruszsky, crowning centuries of lacinka civic letters and Statute law."
 wr_cultural_maneuver.31.d_ruthenia:0 "From Lviv, Halych, and Kamianets to Volhynia and Kyiv, estates enter the West Slavic family under Ruszynjsky, blending western Ruthenian humanist law with West Slavic civic forms."
 wr_cultural_maneuver.31.d_rusyn:0 "In Uzhhorod, Mukachevo, Presov, and Khust, Carpathian assemblies take their place in the West Slavic group as Rusznjoczky alongside Czech, Polish, and Slovak neighbors."
 wr_cultural_maneuver.31.a:0 "Proclaim the rare synthesis to all Three Circles."
 wr_cultural_maneuver.32.t:0 "Estates Halt Before Crossing Into West Slavic"
 wr_cultural_maneuver.32.d:0 "Even after decades of affinity, ecclesiastical synods and rural communes drew the final line. Bilingual civic partnership continues, yet full entry into the West Slavic family fails."
 wr_cultural_maneuver.32.d_belarus:0 "Vilnius brotherhoods and Minsk gentry kept dual-script customs, refusing final reclassification outside eastern Rus' church kinship."
 wr_cultural_maneuver.32.d_ruthenia:0 "Kyiv and Ostroh scholars alongside Dnieper estates praised Kraków learning yet refused to sever ancestral East Slavic church roots."
 wr_cultural_maneuver.32.d_rusyn:0 "Mukachevo parishes and Khust free villages preserved bilingual Spis trade while holding fast to Carpathian ancestral custom."
 wr_cultural_maneuver.32.a:0 "Preserve the dual-script civic compact."
 wr_cultural_maneuver.35.t:0 "Overlord Ratifies West Slavic Synthesis"
 wr_cultural_maneuver.35.d:0 "Our overlord has completed the rare transition into the West Slavic cultural group for every culture meeting the eighty-five percent Adoption Index and invites our estates to adopt it."
 wr_cultural_maneuver.35.d_belarus:0 "Our overlord now registers Belarusian towns and nobility as Bjalowruszsky inside the West Slavic group and invites our chancery to align."
 wr_cultural_maneuver.35.d_ruthenia:0 "Our overlord now registers Ruthenian magistrates as Ruszynjsky inside the West Slavic group and invites our lands to conform."
 wr_cultural_maneuver.35.d_rusyn:0 "Our overlord has enrolled Carpathian Rusyns as Rusznjoczky inside the West Slavic group and invites our comitati to accept the new registers."
 wr_cultural_maneuver.35.a:0 "Adopt the overlord's West Slavic charter."
 wr_cultural_maneuver.35.b:0 "Decline and preserve prior usage."
 wr_cultural_maneuver.41.t:0 "Congress Circle I (Stage 1): Core Culture Consultation"
 wr_cultural_maneuver.41.d:0 "Envoys from [From.GetName] present their Stage 1 charter recognizing native chancery distinction (Branch A). As a sovereign sharing this primary culture, our assent signs all our matching provinces into the Global Adoption Index."
 wr_cultural_maneuver.41.d_belarus:0 "[From.GetName] has chartered Belarusian (Bielaruski) chancery usage after the Grand Ducal prosta mova tradition. As another sovereign of Belarusian primary culture, our endorsement adds every Belarusian province we rule to the Branch A Adoption Index."
 wr_cultural_maneuver.41.d_ruthenia:0 "[From.GetName] has chartered Ruthenian (Ruskyi) court and parish usage distinct from Muscovy. As a sovereign of Ruthenian primary culture, our approval enters all Ruthenian provinces under our banner into the Stage 1 Adoption Index."
 wr_cultural_maneuver.41.d_rusyn:0 "[From.GetName] has chartered Carpathian Rusyn (Rusnacky) village and eparchial usage. As another state of Rusyn primary culture, our vote adds our highland provinces to the Branch A Adoption Index."
 wr_cultural_maneuver.41.a:0 "Ratify the sister charter and enroll our provinces."
 wr_cultural_maneuver.41.b:0 "Hold to older liturgical and chancery forms."
 wr_cultural_maneuver.42.t:0 "Congress Circle I (Stage 2): Collective Codex Mandate"
 wr_cultural_maneuver.42.d:0 "[From.GetName] seeks our primary-culture backing for Stage 2: codifying Bielaruski, Ruskyi, and Rusnacky in a separate Ruthenian cultural group. Only a culture meeting the 60% Adoption Index can complete the shift."
 wr_cultural_maneuver.42.d_belarus:0 "[From.GetName] asks our Belarusian crown to join the Stage 2 codex placing Bielaruski in a separate Ruthenian group on the Statute model."
 wr_cultural_maneuver.42.d_ruthenia:0 "[From.GetName] asks our Ruthenian state to back Stage 2, codifying Ruskyi inside a separate Ruthenian group outside Muscovite ties."
 wr_cultural_maneuver.42.d_rusyn:0 "[From.GetName] asks our Rusyn realm to back Stage 2, securing Rusnacky's separate place in the Ruthenian group."
 wr_cultural_maneuver.42.a:0 "Join the collective mandate."
 wr_cultural_maneuver.42.b:0 "Deny collective backing."
 wr_cultural_maneuver.43.t:0 "Congress Circle I (Stage 3): West Slavic Affinity"
 wr_cultural_maneuver.43.d:0 "[From.GetName] has opened Branch B, proclaiming West Slavic civic affinity. As a sovereign sharing this primary culture, joining enrolls all our matching provinces toward the 85% Adoption Index (unless committed to Branch A)."
 wr_cultural_maneuver.43.d_belarus:0 "[From.GetName] invites our Belarusian court into Branch B West Slavic urban affinity via Kraków, Prague, and lacinka guild compacts."
 wr_cultural_maneuver.43.d_ruthenia:0 "[From.GetName] invites our Ruthenian court into Branch B West Slavic urban affinity via Kraków-Zamosc humanism and bilingual city rolls."
 wr_cultural_maneuver.43.d_rusyn:0 "[From.GetName] invites our Rusyn court into Branch B West Slavic affinity alongside Presov, Bardejov, and Trnava."
 wr_cultural_maneuver.43.a:0 "Join the West Slavic affinity circle."
 wr_cultural_maneuver.43.b:0 "Decline the western civic pact."
 wr_cultural_maneuver.44.t:0 "Congress Circle I (Stage 4): West Slavic Synthesis"
 wr_cultural_maneuver.44.d:0 "[From.GetName] requests our primary-culture vote for Stage 4 entry into the West Slavic cultural group. Any people reaching the 85% Adoption Index completes the transition."
 wr_cultural_maneuver.44.d_belarus:0 "[From.GetName] asks our Belarusian court to uphold Stage 4 transition into the West Slavic group under Bjalowruszsky."
 wr_cultural_maneuver.44.d_ruthenia:0 "[From.GetName] asks our Ruthenian court to uphold Stage 4 transition into the West Slavic group under Ruszynjsky."
 wr_cultural_maneuver.44.d_rusyn:0 "[From.GetName] asks our Rusyn state to uphold Stage 4 transition into the West Slavic family under Rusznjoczky."
 wr_cultural_maneuver.44.a:0 "Sign the West Slavic synthesis treaty."
 wr_cultural_maneuver.44.b:0 "Refuse entry into the West Slavic group."
 wr_cultural_maneuver.51.t:0 "Congress Circle II (Stage 1): Accepted-Culture Courts"
 wr_cultural_maneuver.51.d:0 "[From.GetName] invites courts that recognize Belarusian, Ruthenian, or Rusyn as an accepted culture to affirm Stage 1 vernacular distinction and enroll their relevant provinces toward the 60% Adoption Index."
 wr_cultural_maneuver.51.d_belarus:0 "Because our crown accepts Belarusian at court, [From.GetName] asks us to ratify Bielaruski chancery charters in our Belarusian provinces."
 wr_cultural_maneuver.51.d_ruthenia:0 "Because our realm accepts Ruthenian as a recognized tongue, [From.GetName] asks us to endorse Ruskyi court distinction across our Ruthenian lands."
 wr_cultural_maneuver.51.d_rusyn:0 "Because our crown accepts Carpathian Rusyns, [From.GetName] asks us to affirm Rusnacky sholtys and parish charters in our mountain comitati."
 wr_cultural_maneuver.51.a:0 "Recognize native charters in accepted lands."
 wr_cultural_maneuver.51.b:0 "Withhold court recognition."
 wr_cultural_maneuver.52.t:0 "Congress Circle II (Stage 2): Accepted-Culture Vote"
 wr_cultural_maneuver.52.d:0 "[From.GetName] requests the backing of courts accepting Belarusian, Ruthenian, or Rusyn for Stage 2 codification of the separate Ruthenian group."
 wr_cultural_maneuver.52.d_belarus:0 "As an accepting crown of Belarusian estates, our delegates are asked to join the Stage 2 collective mandate for Bielaruski."
 wr_cultural_maneuver.52.d_ruthenia:0 "As an accepting crown of Ruthenian nobles and towns, our delegates are asked to join the Stage 2 mandate for Ruskyi."
 wr_cultural_maneuver.52.d_rusyn:0 "As an accepting realm of Rusyn counties, our delegates are asked to endorse Stage 2 for Rusnacky."
 wr_cultural_maneuver.52.a:0 "Back the separate Ruthenian codex."
 wr_cultural_maneuver.52.b:0 "Refuse court endorsement."
 wr_cultural_maneuver.53.t:0 "Congress Circle II (Stage 3): Accepted-Culture Affinity"
 wr_cultural_maneuver.53.d:0 "[From.GetName] asks courts that have accepted Belarusian, Ruthenian, or Rusyn to endorse Branch B West Slavic urban affinity and enroll their relevant provinces toward the 85% Adoption Index."
 wr_cultural_maneuver.53.d_belarus:0 "Because our court accepts Belarusian nobles and towns, [From.GetName] invites us into the Branch B West Slavic urban affinity alongside Vilnius and Brest."
 wr_cultural_maneuver.53.d_ruthenia:0 "Because our court accepts Ruthenian palatinates, [From.GetName] invites us into the Branch B West Slavic affinity alongside Lviv, Volhynia, and Bratslav."
 wr_cultural_maneuver.53.d_rusyn:0 "Because our court accepts Rusyns, [From.GetName] invites us into the Branch B West Slavic affinity alongside Saris, Spis, and Presov."
 wr_cultural_maneuver.53.a:0 "Confirm the West Slavic affinity charter."
 wr_cultural_maneuver.53.b:0 "Stay aloof from western affinity."
 wr_cultural_maneuver.54.t:0 "Congress Circle II (Stage 4): Accepted-Culture Synthesis"
 wr_cultural_maneuver.54.d:0 "[From.GetName] seeks our vote among accepting courts for Stage 4 entry into the West Slavic cultural group."
 wr_cultural_maneuver.54.d_belarus:0 "As an accepting crown of Belarusians, [From.GetName] invites us to ratify Stage 4 for Bjalowruszsky where the 85% Index holds."
 wr_cultural_maneuver.54.d_ruthenia:0 "As an accepting realm of Ruthenians, [From.GetName] invites us to ratify Stage 4 for Ruszynjsky where the 85% Index holds."
 wr_cultural_maneuver.54.d_rusyn:0 "As an accepting crown of Rusyns, [From.GetName] invites us to ratify Stage 4 for Rusznjoczky where the 85% Index holds."
 wr_cultural_maneuver.54.a:0 "Ratify West Slavic transition for accepted estates."
 wr_cultural_maneuver.54.b:0 "Reject final West Slavic transition."
 wr_cultural_maneuver.61.t:0 "Congress Circle III (Stage 1): Provincial Toleration"
 wr_cultural_maneuver.61.d:0 "[From.GetName] appeals to states ruling unaccepted Belarusian, Ruthenian, or Rusyn provinces to allow Stage 1 parish and municipal distinction, counting them into the Global Adoption Index."
 wr_cultural_maneuver.61.d_belarus:0 "Although Belarusians lack accepted rank in our realm, [From.GetName] asks us to permit local Bielaruski town and parish registers in those districts."
 wr_cultural_maneuver.61.d_ruthenia:0 "Although Ruthenians remain unaccepted at court, [From.GetName] asks us to tolerate local Ruskyi brotherhood schools and land court books."
 wr_cultural_maneuver.61.d_rusyn:0 "Although Carpathian Rusyns lack accepted status here, [From.GetName] asks us to uphold local Rusnacky sholtys and parish customs."
 wr_cultural_maneuver.61.a:0 "Grant local parish and charter latitude."
 wr_cultural_maneuver.61.b:0 "Maintain strict administrative uniformity."
 wr_cultural_maneuver.62.t:0 "Congress Circle III (Stage 2): Provincial Alignment"
 wr_cultural_maneuver.62.d:0 "[From.GetName] invites states holding unaccepted Belarusian, Ruthenian, or Rusyn provinces to honor the Stage 2 codex where the Global Province Adoption Index has reached sixty percent."
 wr_cultural_maneuver.62.d_belarus:0 "Our realm holds Belarusian lands; [From.GetName] asks our governors to register those districts under Bielaruski in the separate Ruthenian group."
 wr_cultural_maneuver.62.d_ruthenia:0 "Our realm holds Ruthenian provinces; [From.GetName] asks us to recognize Ruskyi within the separate Ruthenian group."
 wr_cultural_maneuver.62.d_rusyn:0 "Our realm holds Rusyn comitati; [From.GetName] asks our county captains to adopt the Rusnacky codex."
 wr_cultural_maneuver.62.a:0 "Permit provincial shift to the separate group."
 wr_cultural_maneuver.62.b:0 "Leave provincial tax rolls unchanged."
 wr_cultural_maneuver.63.t:0 "Congress Circle III (Stage 3): Bilingual Towns"
 wr_cultural_maneuver.63.d:0 "[From.GetName] asks rulers of unaccepted Belarusian, Ruthenian, or Rusyn provinces to permit Branch B bilingual municipal guilds and dual-script schools, advancing the 85% Adoption Index."
 wr_cultural_maneuver.63.d_belarus:0 "Town guilds in our Belarusian provinces petition to adopt Branch B dual-script lacinka civic charters backed by [From.GetName]."
 wr_cultural_maneuver.63.d_ruthenia:0 "Bilingual magistrates in our Ruthenian provinces ask permission to join Branch B civic affinity links championed by [From.GetName]."
 wr_cultural_maneuver.63.d_rusyn:0 "Our Rusyn frontier towns petition to join Branch B civic trade alongside Presov, Spis, and Trnava."
 wr_cultural_maneuver.63.a:0 "Permit dual-script municipal guilds."
 wr_cultural_maneuver.63.b:0 "Forbid foreign urban alignments."
 wr_cultural_maneuver.64.t:0 "Congress Circle III (Stage 4): Frontier Transition"
 wr_cultural_maneuver.64.d:0 "[From.GetName] asks states holding unaccepted Belarusian, Ruthenian, or Rusyn provinces to accept Stage 4 transition into the West Slavic family wherever the 85% Adoption Index has been met."
 wr_cultural_maneuver.64.d_belarus:0 "With Bjalowruszsky passing the Adoption Index, [From.GetName] urges us to harmonize our Belarusian districts with the West Slavic group."
 wr_cultural_maneuver.64.d_ruthenia:0 "With Ruszynjsky passing the Adoption Index, [From.GetName] urges our governors to enroll our Ruthenian towns under the West Slavic group."
 wr_cultural_maneuver.64.d_rusyn:0 "With Rusznjoczky passing the Adoption Index, [From.GetName] invites our county lords to harmonize Carpathian Rusyn districts with the West Slavic group."
 wr_cultural_maneuver.64.a:0 "Harmonize frontier provinces with West Slavic."
 wr_cultural_maneuver.64.b:0 "Retain existing provincial registers."
