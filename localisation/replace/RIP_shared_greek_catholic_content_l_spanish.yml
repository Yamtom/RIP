 develop_dniester_estuary_trade_desc:0 "Invest 300 ducats, 75 ADM and 50 DIP in the ports of Budjak, from Akkerman on the Dniester to Kilia on the lower Danube. The province owner receives the local improvements. Our trade network operates while we or a dependent subject own Budjak and its owner controls it. If the province is lost or occupied, the bonus lapses at the next monthly review. Recovering control restores the network. The initial development is granted only once."
