 rip_church_ro_window_toggle:0 "Policies"
 rip_church_ro_window_toggle_tt:0 "Show or hide the Muscovite Church policy window. Click a policy icon there to activate or deactivate it; the retired native icon selector is not used."
 rip_church_royal_concordat:0 "Liturgy Guaranteed, Crown Veto Reserved"
 rip_church_sponsor_union_desc:0 "From 1596, a Catholic crown may support an Eastern union without changing its state religion. Pay 100 ADM, 100 DIP and one year's income. The state action changes one eligible core province's religion to Greek Catholic; it is separate from a community-rights guarantee and does not report local consent. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution. The eligible core province is selected randomly; this country decision does not select a province on the map."
 rip_church_sponsor_union_title:0 "Sponsor an Eastern Catholic union"
 rip_church_theological_censorship:0 "Theological Censorship"
 rip_church_withdraw_union_support_desc:0 "End the Catholic crown's patronage of the Union. Existing parish faiths do not change; earlier foundation and negotiation payments are not refunded."
 rip_church_withdraw_union_support_title:0 "Withdraw royal support for the Union"
 rip_ob.2.a:0 "Acknowledge the Old Believer majority"
 rip_ob.2.b:0 "Maintain a mixed settlement with greater autonomy"
 rip_ob.2.d:0 "An Old Believer community has grown for at least a decade. Acknowledge its majority, or maintain the mixed settlement through greater autonomy. Neither choice erases the community."
 rip_ob.2.t:0 "The Old Rite Takes Root"
 rip_ob.3.a:0 "Record the community"
 rip_ob.3.d:0 "Families from a neighbouring Old Believer parish have established a minority here. The province keeps its religion."
 rip_ob.3.t:0 "Families of the Old Rite"
 rip_ob_active_refuge:0 "Endowed Old Rite Refuge"
 rip_ob_adopt_old_rite_desc:0 "Requires an Old Believer capital and dominant faith, peace, 1 stability and 100 ADM. Costs 100 ADM and 1 stability, and sets the policy of toleration. Changes the state confession only: the country leaves the Muscovite jurisdiction, and provincial majorities retain their faith."
 rip_ob_adopt_old_rite_title:0 "Adopt the Old Believer Confession"
 rip_ob_choose_accord_desc:0 "Current settlement: [Root.GetOldBelieverAccord].\nChoose support for visiting priests or worship under lay elders. Costs 75 ADM and 100 ducats. A later change costs an additional 1 stability. Peace, at least 0 stability; change once every 20 years. Payment is made only on confirmation. This policy models patronage of diverse communities, not a single historical Old Believer church."
 rip_ob_choose_accord_title:0 "Settle the Organization of the Old Rite"
 rip_ob_endow_refuge_desc:0 "Propose one randomly selected eligible non-capital core with an existing Old Believer community or majority. The event names the randomly proposed site, which can be accepted or declined freely; it is not a manual map selection. Costs 50 DIP, 100 ducats and adds 10 local autonomy. Refuge: -1 local unrest, +15% local production efficiency, -15% local tax and -1% local missionary strength. One foundation per 10 years; fewer than 3 foundations must already be owned. Minority communities and provincial religion are preserved. Benefits require an Old Believer ruler or the toleration policy and are suspended by repression."
 rip_ob_endow_refuge_title:0 "Endow a Refuge of the Old Rite"
 rip_ob_hold_assembly_desc:0 "Current mandate: [Root.GetOldBelieverMandate].\nFor 50 ADM and 75 ducats, choose a 10-year mandate: manuscript schools (-5% idea cost, -0.5% missionary strength), or mutual aid (-1 national unrest, -5% national tax). One mandate at a time. Peace, at least 0 stability; once every 10 years. Confirmation lists the effects."
 rip_ob_hold_assembly_title:0 "Convene the Community Assembly"
 rip_ob_inactive_refuge:0 "Suspended Old Rite Endowment"
 rip_ob_institutions.1.a:0 "Support visiting priests"
 rip_ob_institutions.1.b:0 "Entrust worship to lay elders"
 rip_ob_institutions.1.d:0 "The old books survive; the succession of clergy is harder to secure. Some communities receive priests who leave the reformed church, while others entrust prayer and teaching to lay elders. Neither policy gives us a patriarch or a new episcopal hierarchy.\nCurrent settlement: [Root.GetOldBelieverAccord]. Confirmation costs 75 ADM and 100 ducats; changing an existing settlement also costs 1 stability. Its benefits last while we follow the Old Rite, and its 20-year lock survives conversion."
 rip_ob_institutions.1.t:0 "Priests and Lay Elders"
 rip_ob_institutions.2.a:0 "Sustain manuscript schools"
 rip_ob_institutions.2.b:0 "Fund alms and mutual aid"
 rip_ob_institutions.2.d:0 "Delegates bring petitions from the settlements. The common purse can sustain the copying of old books and the teaching of readers, or support alms and mutual aid. The choice binds our expenditure for a decade.\nCurrent mandate: [Root.GetOldBelieverMandate]. Each choice costs 50 ADM and 75 ducats and lasts 10 years. The school mandate reduces idea cost by 5% and missionary strength by 0.5%; mutual aid reduces unrest by 1 at the cost of 5% tax."
 rip_ob_institutions.2.t:0 "The Community Assembly"
 rip_ob_institutions.3.a:0 "Endow the named refuge"
 rip_ob_institutions.3.d:0 "The proposed site is [rip_ob_refuge_site.GetName]. Its existing community asks for a prayer house, workshops and a secure endowment. The land remains under its present faith; this foundation does not convert a province.\nConfirm for 100 ducats and 50 DIP; local autonomy rises by 10. While protected: unrest -1, production efficiency +15%, tax -15%, missionary strength -1%. The foundation survives conquest; the new ruler's faith and policy determine whether its benefits remain active."
 rip_ob_institutions.3.t:0 "A Refuge for the Old Books"
 rip_ob_institutions.defer:0 "Leave the matter open"
 rip_ob_lay_accord:0 "Worship under Lay Elders"
 rip_ob_local_community:0 "Old Believer Community"
 rip_ob_local_repression:0 "Old Rite Persecuted"
 rip_ob_local_toleration:0 "Old Rite Guaranteed"
 rip_ob_manuscript_mandate:0 "Manuscript Schools"
 rip_ob_mutual_aid_mandate:0 "Communal Mutual Aid"
 rip_ob_no_accord:0 "No settlement chosen"
 rip_ob_no_mandate:0 "No current mandate"
 rip_ob_priestly_accord:0 "Patronage of Visiting Priests"
 rip_ob_repress_desc:0 "Spend 50 ADM to enforce uniformity. Tolerance of heretics falls and the patriarch's authority drains more slowly, so the Raskol lasts longer; the communities pay in unrest and manpower for as long as the policy stands. The policy can change once every ten years."
 rip_ob_repress_title:0 "Enforce the Revised Books"
 rip_ob_repressive_policy:0 "Enforcement of the Revised Books"
 rip_ob_tolerant_policy:0 "Toleration of the Old Rite"
 rip_ob_tolerate_desc:0 "Spend 50 ADM to protect the Old Believer communities. Local unrest falls in exchange for tax concessions, tolerance of heretics rises, and the patriarch's authority drains faster, which brings the end of the Raskol nearer. The policy can change once every ten years. The communities outlast it."
 rip_ob_tolerate_title:0 "Guarantee the Old Rite"
 rip_ro_funded_trade_missions:0 "Funded trade missions"
 rip_ro_history.1.a:0 "Correct the books; leave judgment to a later council"
 rip_ro_history.1.b:0 "Protect both ritual traditions"
 rip_ro_history.1.d:0 "The patriarch proposes bringing the books into line with contemporary Greek practice. Implementing the revision begins a dispute over ritual authority within Orthodoxy; neither the reforms nor the later Raskol create a new state confession. From 1666 a council will decide the treatment of the old rites. Protecting both practices now avoids the internal rupture, at a continuing cost to uniform missionary policy and patriarchal authority."
 rip_ro_history.1.t:0 "The Correction of the Service Books"
 rip_ro_history.2.a:0 "Delay the election and appoint a locum tenens"
 rip_ro_history.2.b:0 "Elect a patriarch and preserve the office"
 rip_ro_history.2.d:0 "The succession to the patriarchal throne confronts the crown with a choice. A locum tenens would administer the church while the ruler delays a new election, weakening patriarchal authority and clerical loyalty. Electing a new patriarch preserves the institution and clerical influence, at the expense of crown revenues."
 rip_ro_history.2.t:0 "The Vacant Patriarchal Throne"
 rip_ro_history.3.a:0 "Establish the Governing Synod under the crown"
 rip_ro_history.3.b:0 "Restore the patriarchal succession"
 rip_ro_history.3.d:0 "A governing synod under the crown can replace the vacant patriarchal office. It improves tax administration and reduces stability costs, but diminishes autonomous patriarchal authority and clerical loyalty. Alternatively, we can restore the patriarchal succession. This institutional choice does not change our religion or sever communion with the Eastern churches."
 rip_ro_history.3.t:0 "The Ecclesiastical Regulation"
 rip_ro_holy_cities_close_tt:0 "Close the register."
 rip_ro_patriarchal_vacancy:0 "Patriarchal Interregnum"
 rip_ro_preserved_patriarchate:0 "Preserved Patriarchal Succession"
 rip_ro_renounce_communion_desc:0 "Break communion with the Eastern churches for 100 DIP and 1 stability. The Muscovite state confession already exists; this choice changes relations and parish protections without converting provinces."
 rip_ro_renounce_communion_title:0 "Renounce Eastern Orthodox Communion"
 rip_ro_restricted_communion:0 "Orthodox Communion under Restrictions"
 rip_ro_ritual_compromise:0 "Two Ritual Traditions"
 rip_ro_shared_communion:0 "Orthodox Communion Preserved"
 rip_ro_synodal_government:0 "The Governing Synod"
 russian_orthodox.1.a:0 "Establish the Muscovite state church"
 russian_orthodox.1.b:0 "Continue to seek approval from Constantinople"
 russian_orthodox.1.d:0 "Elect a metropolitan and establish the Muscovite state confession. Provincial majorities keep their faith. Church affiliation, state control and a break of communion are separate choices."
 russian_orthodox.1.t:0 "The Election of a Metropolitan"
 russian_orthodox.14.a:0 "Adopt the patriarchal title"
 russian_orthodox.14.d:0 "Our established patriarchate has received recognition within Orthodox communion. Its traditional title can now be adopted at home. This confers neither jurisdiction over every Orthodox country nor a new universal patriarchate."
 russian_orthodox.2.a:0 "Accept patriarchal dignity in Orthodox communion"
 russian_orthodox.2.b:0 "Defer the settlement for now"
 russian_orthodox.2.d:0 "Patriarchal dignity offers our church a recognized place among the Eastern patriarchates. Accepting recognition preserves Orthodox communion and our present faith; conciliar confirmation follows from 1593. Refusing their authority is a deliberate alternative-history schism: it establishes a separate Muscovite confession and removes protection for Orthodox parishes."
 russian_orthodox.4.a:0 "Impose administrative and linguistic uniformity"
 russian_orthodox.4.d:0 "Our eighteenth-century administration seeks greater linguistic and institutional uniformity. Coercion will provoke provincial resistance. We may instead support gradual integration or retain local arrangements. The policy is a gameplay abstraction, not an institution of the medieval metropolitanate."
 russian_orthodox.4.t:0 "Imperial Administrative Assimilation"
 russian_orthodox.5.a:0 "Authorize coercive confessional courts"
 russian_orthodox.5.b:0 "Permit limited religious prosecutions"
 russian_orthodox.5.c:0 "Preserve religious accommodation"
 russian_orthodox.5.d:0 "After the council, church courts and secular officers can enforce approved religious practice. Strong coercion threatens Orthodox parish guarantees and may provoke resistance. These confessional courts are not a copy of the Roman Inquisition."
 russian_orthodox.5.t:0 "Confessional Courts after the Council"
 russian_orthodox.6.a:0 "Enforce the council and suppress the old rites"
 russian_orthodox.6.b:0 "Confirm the new books but tolerate private old rites"
 russian_orthodox.6.c:0 "Accept both rites and prevent the rupture"
 russian_orthodox.6.d:0 "The council may establish Old Believer minority communities. Provincial faith changes only through later majority developments or religious conflict. Other Orthodox churches are not Old Believers merely because they reject Moscow jurisdiction."
 russification_campaign_decision_desc:0 "Available from 1700. Spend 100 ADM and 50 MIL on a coercive twenty-year administrative policy. Local resistance and missionary disputes may follow; cultures do not change instantly."
 russification_campaign_decision_title:0 "Impose Administrative Assimilation"
