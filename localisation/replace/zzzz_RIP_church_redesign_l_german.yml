 rip_church_ecumenism_desc:0 "Conclude a limited diplomatic and local administrative settlement between the Eastern and Latin communities once community rights are guaranteed in both and the historical and diplomatic conditions are met. It deepens every guarantee. Its +15 is diplomatic goodwill only: Orthodox and Catholic states gain +15 mutual opinion; Russian Orthodox states are excluded. It is not a restoration of full ecclesial communion."
 rip_church_ecumenism_title:0 "Conclude the ecumenical settlement"
 rip_church_florence_desc:0 "Alternative history, 1444-1501. The union of 6 July 1439 is a Florentine precedent for this alternative path, not the founding of the UGCC or an established separate confession. The Union of Brest in 1596 remains a distinct later milestone. Pay 200 ADM, 100 DIP and one year's income for five years of negotiations. Requires stability 2, peace and PAP opinion 100. The Eastern hierarchy keeps its rite while entering communion with Rome; Catholic patrons retain their state religion."
