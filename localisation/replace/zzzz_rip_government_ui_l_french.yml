l_french:
 # Generated by tools/build_ruthenian_government_ui.py; English fallback where untranslated.
 ability_siversk_patrimony_mechanic:0 "Siversk Patrimony"
 chr_siversk_principality_reform:0 "Siversk Principality"
 chr_siversk_principality_reform_desc:0 "A patrimonial principality rooted in the Siversk land. The prince maintains service through inherited rights, agreements with the towns and the muster of his druzhyna."
 siversk_confirm_patrimonies:0 "Confirm Patrimonies"
 siversk_confirm_patrimonies_desc:0 "Confirm the landed houses in their inherited rights. For 50 administrative power, gain 10 years of lower unrest and greater noble loyalty, at the cost of tax revenue. Cooldown: 10 years."
 siversk_charter_towns:0 "Charter the Towns"
 siversk_charter_towns_desc:0 "Settle trade privileges with the towns. For 50 diplomatic power, gain 10 years of trade efficiency and burgher loyalty while reducing noble influence. Cooldown: 10 years."
 siversk_muster_druzhyna:0 "Muster the Druzhyna"
 siversk_muster_druzhyna_desc:0 "Call the prince's retinue into service. For 50 military power, gain 5 years of manpower recovery and army morale, with higher army maintenance. Cooldown: 10 years."
 rip_siversk_patrimonial_compact:0 "Patrimonial Compact"
 rip_siversk_town_compact:0 "Town Charters"
 rip_siversk_retinue_muster:0 "Druzhyna Muster"
 desc_rip_siversk_patrimonial_compact:0 "The landed houses uphold the prince in exchange for confirmation of their inherited rights and a lighter tax burden."
 desc_rip_siversk_town_compact:0 "Town charters secure merchant cooperation and diminish the landed houses' influence over trade."
 desc_rip_siversk_retinue_muster:0 "The prince's retinue is assembled for service. Maintaining its readiness raises the cost of the army."
 ability_kyivan_throne_concord_mechanic:0 "Throne Concord"
 kyivan_throne_concord:0 "Throne Concord"
 kyivan_throne_concord_desc:0 "Throne Concord starts at 50. Monthly base +0.10; stability at least 2: +0.10; negative stability: -0.20; legitimacy at least 80: +0.20; below 40: -0.25; a subject at 50 liberty desire: -0.30. Eligible Concord of Peoples at 60: +0.15; unaccepted cultural development at 30%: -0.30.\nLow concord scales legitimacy, stability-cost and advisor-cost penalties. At zero: Throne in Disarray for 5 years. At 100 there is no repeatable prestige reward."
 ability_kyivan_peoples_gathering_mechanic:0 "Concord of Peoples"
 kyivan_peoples_gathering:0 "Concord of Peoples"
 kyivan_peoples_gathering_desc:0 "Requires at least 10% of owned development in non-primary cultures, a non-primary province and at least one promoted culture. Cultural development shares refresh monthly.\nMonthly growth: +0.30 when eligible; +0.15 with three promoted cultures; +0.15 with at least 30% non-primary development; +0.10 with Throne Concord at least 60. Loss: -0.25 at 15% unaccepted development, a further -0.35 at 30%; -0.20 below 30 Throne Concord; -0.15 at 5 war exhaustion; -0.50 when ineligible.\nAt 100: renew Peoples Gathered for 10 years, gain 10 prestige and 10 Throne Concord, reset to 40. Below 20 with at least 30% unaccepted development: one court crisis per breakdown, -15 Throne Concord and Throne in Disarray for 5 years. Rearms after reaching 40 and reducing unaccepted development below 15%."
 monthly_kyivan_peoples_gathering:0 "Monthly Concord of Peoples"
 kyivan_peoples_gathering_gain_modifier:0 "Concord of Peoples Gain"
 kru_knyazi:0 "Knyazi"
 kru_boyary:0 "Boyary"
 kru_starshyna:0 "Starshyna"
 kru_knyazi_FACTION_DESC:0 "The princely houses defend dynastic standing, diplomacy and the service of dependent princes.\n\nTheir influence receives a yearly boost from legitimacy of at least 60 and from having at least two subjects. Court the Knyazi to spend 50 diplomatic power for 25 influence and 2 legitimacy. Cooldown: 6 years; unavailable at 70 influence."
 kru_boyary_FACTION_DESC:0 "The boyar houses seek office, landed rights and control of the treasury.\n\nTheir influence receives a yearly boost from stability of at least 2 and a treasury of at least 300 ducats. Court the Boyary to spend 50 administrative power for 25 influence and 50 ducats. Cooldown: 6 years; unavailable at 70 influence."
 kru_starshyna_FACTION_DESC:0 "The Cossack officers defend military service, regimental appointments and the rights of the host.\n\nTheir influence receives a yearly boost from army tradition of at least 40 and from war. Court the Starshyna to spend 50 military power for 25 influence and 5 army tradition. Cooldown: 6 years; unavailable at 70 influence."
 kru_knyazi_influence:0 "Knyazi Influence"
 kru_boyary_influence:0 "Boyary Influence"
 kru_starshyna_influence:0 "Starshyna Influence"
 ability_ruthenian_factional_court_mechanic:0 "Council of Three Estates"
 ruthenian_factional_pair_system_tt:0 "The leading faction grants its full modifiers. Other blocs with at least 38 influence receive a junior voice. Coalition changes are checked yearly, with a 5-year cooldown."
 ruthenian_factional_influence_sources_tt:0 "Yearly influence: Knyazi gain from legitimacy of at least 60 and at least two subjects; Boyary from stability of at least 2 and 300 ducats; Starshyna from army tradition of at least 40 and war. Council abilities also add influence."
