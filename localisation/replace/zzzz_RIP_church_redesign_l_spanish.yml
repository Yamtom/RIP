 rip_church_icon_building_action:0 "[Root.GetChurchIconBuildingAction]"
 rip_church_icon_building_action_tt:0 "§YCathedral Stewardship§!\nParishes with a completed cathedral: §G-25% construction cost§! there, for every building and not only churches. A temple or cathedral is what a mission node needs.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconBuildingAccess]"
