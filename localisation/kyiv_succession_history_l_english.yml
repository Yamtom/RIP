l_english:

 # --- the Kyivan succession question, 1444-1569 (events/KyivSuccessionHistory.txt)

 kyiv_succession_history.1.t:0 "The Princedom Restored"
 kyiv_succession_history.1.d:0 "Casimir has given Kyiv back a prince of its own line, and nobody at court has written down whether the seat descends by blood or rotates among the eldest of the house. Every clerk drafting the charter is waiting to be told which."
 kyiv_succession_history.1.a:0 "Revive the old rota"
 kyiv_succession_history.1.b:0 "Bind the seat to one line"
 kyiv_succession_history.1.c:0 "Leave the question open"

 kyiv_succession_history.2.t:0 "Semen Takes the Table"
 kyiv_succession_history.2.d:0 "The old prince is dead and his son sits at Kyiv. Whether the princes assented to him or Vilnius simply named him is a distinction the chroniclers have not bothered to settle."
 kyiv_succession_history.2.a:0 "Seat him by the princes' assent"
 kyiv_succession_history.2.b:0 "Seat him by Vilnius' charter"
 kyiv_succession_history.2.c:0 "Record both forms together"

 kyiv_succession_history.3.t:0 "The Vacant Table"
 kyiv_succession_history.3.d:0 "Semen is dead without an heir Casimir has agreed to seat, and the table at Kyiv stands empty. Every house with Rurikid or Gedyminovich blood is counting its claim."
 kyiv_succession_history.3.a:0 "Summon the princes to choose"
 kyiv_succession_history.3.b:0 "Ask Vilnius to name one"
 kyiv_succession_history.3.c:0 "Hold the seat vacant"

 kyiv_succession_history.4.t:0 "The Voivodeship Question"
 kyiv_succession_history.4.d:0 "Casimir can seat another prince of the old line, or send a voivode who answers to Vilnius alone and holds office at the crown's pleasure. The boyars have asked which it will be more than once."
 kyiv_succession_history.4.a:0 "Refuse the voivode outright"
 kyiv_succession_history.4.b:0 "Accept one crown-appointed office"
 kyiv_succession_history.4.c:0 "Split the office in two"

 kyiv_succession_history.5.t:0 "A Plot Among the Princes"
 kyiv_succession_history.5.d:0 "Mykhailo Olelkovych, Ivan Holshansky and Fedir Belsky are conspiring against the voivode's rule, and word of it has reached this court along with an invitation. Whoever informs Vilnius first names the winner."
 kyiv_succession_history.5.a:0 "Join the conspiring princes"
 kyiv_succession_history.5.b:0 "Denounce them to Vilnius"
 kyiv_succession_history.5.c:0 "Stay out of it"

 kyiv_succession_history.6.t:0 "The Boyars Petition"
 kyiv_succession_history.6.d:0 "Every udil wants its old grants confirmed in writing before the men who remember the original terms are gone. A single chancery could answer the petition just as well, if it were trusted."
 kyiv_succession_history.6.a:0 "Confirm every udil's grant"
 kyiv_succession_history.6.b:0 "Answer through one chancery"
 kyiv_succession_history.6.c:0 "Confirm some, refuse others"

 kyiv_succession_history.7.t:0 "Word of a Third Rome"
 kyiv_succession_history.7.d:0 "A monk's letter out of Moscow claims the whole inheritance of Constantinople for one tsar alone. Some at this court call it Muscovite pretension; others ask why the same claim could not sit at Kyiv."
 kyiv_succession_history.7.a:0 "Call it Muscovite pretension"
 kyiv_succession_history.7.b:0 "Claim the inheritance for Kyiv"
 kyiv_succession_history.7.c:0 "Let the monks argue it"

 kyiv_succession_history.8.t:0 "The Statute Committee"
 kyiv_succession_history.8.d:0 "The grand duchy's law is being set down in a single book, and every udil's custom must fit inside it or go unwritten. The committee has asked this court to send its answer before the printers begin."
 kyiv_succession_history.8.a:0 "Write the rota into the statute"
 kyiv_succession_history.8.b:0 "Write one office into the statute"
 kyiv_succession_history.8.c:0 "Leave the custom unwritten"

 kyiv_succession_history.9.t:0 "The Chancery Grows"
 kyiv_succession_history.9.d:0 "The clerks keep asking whether accounts are kept by udil, each prince answering for his own, or merged under one roof at Kyiv. The ledgers have already been copied both ways."
 kyiv_succession_history.9.a:0 "Keep accounts by each udil"
 kyiv_succession_history.9.b:0 "Merge accounts into one chancery"
 kyiv_succession_history.9.c:0 "Keep both ledgers running"

 kyiv_succession_history.10.t:0 "Word from Moscow's Coronation"
 kyiv_succession_history.10.d:0 "Ivan IV has had himself crowned tsar, and the news reached Kyiv within the week. The elder princes call it Muscovite theatre; others are already asking what a coronation like it would cost here."
 kyiv_succession_history.10.a:0 "Send envoys to study the coronation"
 kyiv_succession_history.10.b:0 "Dismiss it as Muscovite theatre"
 kyiv_succession_history.10.c:0 "Note it and say nothing"

 kyiv_succession_history.11.t:0 "Magnates on the March"
 kyiv_succession_history.11.d:0 "Families that once served the Olelkovichi as stewards now hold whole districts in their own right, and none of them wants to answer to a chancery that outranks his neighbour's. A single office could still bind them, if it moved first."
 kyiv_succession_history.11.a:0 "Let the magnates rotate office"
 kyiv_succession_history.11.b:0 "Draw offices into one chancery"
 kyiv_succession_history.11.c:0 "Confirm the magnates as they stand"

 kyiv_succession_history.12.t:0 "The Ladder of Thrones Contested"
 kyiv_succession_history.12.d:0 "Several houses now count themselves senior at Kyiv, and each can cite a precedent the others dispute. Naming one house paramount would settle the ladder for good, at the cost of the rest."
 kyiv_succession_history.12.a:0 "Reaffirm the ladder of seniority"
 kyiv_succession_history.12.b:0 "Name one house paramount"
 kyiv_succession_history.12.c:0 "Confirm every house's rank"

 kyiv_succession_history.13.t:0 "Whispers of Lublin"
 kyiv_succession_history.13.d:0 "The crown and the grand duchy are already talking of one Commonwealth, and of who at Kyiv will answer for it once the talking ends. The bench of princes and the crown's chancery cannot both hold the same seat."
 kyiv_succession_history.13.a:0 "Resist absorption, keep the bench"
 kyiv_succession_history.13.b:0 "Draw closer to the crown"
 kyiv_succession_history.13.c:0 "Keep both claims standing"

 kyiv_succession_history.14.t:0 "The Table Is Settled"
 kyiv_succession_history.14.d:0 "Lublin is close and the question cannot wait any longer. The assembled princes and boyars have gathered to choose one form outright, and to hold every other house to it afterward."
 kyiv_succession_history.14.a:0 "Confirm the rota of elder princes"
 kyiv_succession_history.14.b:0 "Confirm a single princely office"
