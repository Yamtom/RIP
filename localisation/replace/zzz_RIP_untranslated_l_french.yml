 west_ukraine_history.9.b:0 "Tax the fairs."
 west_ukraine_history.9.d:0 "Trade fairs boost regional prosperity."
 west_ukraine_history.9.t:0 "Lviv Trade Fair"
 wetland_economy:0 "Wetland Economy"
 wetland_economy_desc:0 "Fishing, hunting, peat extraction, and forest resources provide a sustainable subsistence economy. We are poor but self-sufficient."
 wetland_fortifications:0 "Wetland Fortifications"
 wetland_fortifications_desc:0 "Our wooden palisades rise from artificial islands within the marshes. These fortifications are nearly impossible to besiege without specialized local knowledge, frustrating even the most determined attackers."
 wild_fields_preserved:0 "Wild Fields Preserved"
 wild_fields_preserved_desc:0 "We maintain the traditional nomadic character of the steppe."
 wine_vintage_fame:0 "Famous Wine Vintage"
 winter_raid_season:0 "Winter Raiding Season"
 zamosc_synod_eastern_preservation:0 "Eastern Tradition Preserved"
 zamosc_synod_latinization:0 "Zamosc Synod Latinization"
 zaporozhian_charter:0 "Zaporozhian Charter"
 zaporozhian_military_peak:0 "§YThe Sich has perfected cavalry warfare and steppe mastery§!"
 zaporozhian_sich:0 "Zaporozhian Sich"
 zaporozhian_sich_capital:0 "Zaporozhian Sich Capital"
 zaporozhian_sich_capital_desc:0 "The current location of the Zaporozhian Sich."
 zaporozhian_sich_crisis:0 "Sich Crisis"
 zaporozhian_sich_crisis_desc:0 "Internal conflicts between the free Sich Rada and authoritarian Kosh Otamans, failed raids, overlord pressure, and external threats combine to threaten the very existence of the Zaporozhian Host."
 zaporozhian_sich_culture_tt:0 "Must be Ruthenian culture or accepted"
 zaporozhian_sich_desc:0 "The Zaporozhian Sich is the fortified capital of the Zaporozhian Cossack Host - a unique rule of the war council on the Dnieper rapids. Founded in the mid-16th century, the Sich serves as fortress, parliament, and cultural center for free Cossacks who reject serfdom and foreign rule. From here, Cossacks launch cavalry raids into the steppe, chaiky expeditions across the Black Sea, and defend their liberty against Polish, Russian, and Ottoman empires. The Sich's location shifts periodically as strategic needs change, but it always remains the heart of Cossack freedom."
 zaporozhian_sich_founded:0 "Zaporozhian Sich Founded"
 zaporozhian_sich_founded_desc:0 "This is the sacred heartland of Cossack freedom."
 zaporozhian_sich_tier_3_tt:0 "The Zaporozhian Sich has reached its zenith as the greatest Cossack fortress in Eastern Europe"
 zaporozhian_sich_upgrade_tt:0 "Only Ruthenian nations can upgrade the Sich"
 zasechnaya_cherta:0 "Zasechnaya Cherta"
 zasechnaya_cherta_province:0 "Great Abatis Line Defenses"
 zaz_10_a:0 "The Szlachta must carefully weigh their options and make a decision soon."
 zaz_10_b:0 "It is undeniable that his demands are just and righteous. The Szlachta must acknowledge that and take action accordingly!"
 zaz_10_c:0 "The Cossacks have served us well, and it is only right that we show them kindness in return. We shall provide for their needs."
 zaz_10_d:0 "A few well-placed bribes and some strategic blackmail will ensure that the Szlachta make the right decision."
 zaz_10_desc:0 "Severyn Nalyvaiko, a former member of our service, has sent a list of demands to the Szlachta regarding the upkeep of the Cossack regiments in their armies. These demands include respecting Cossack customs and traditions, which he justifies with their active participation in the fight against infidels from the south.\n\nAlthough it's hard to deny their contributions, the Szlachta is hesitant to accept the demands, especially after the recent uprising. Rejecting them, however, could have unpredictable consequences."
 zaz_10_e:0 "With some skillful negotiation, we can convince the Szlachta that these changes are necessary and just."
 zaz_10_f:0 "Ha! Better? I think he meant worse! But we can still use this opportunity to line our pockets."
 zaz_10_g:0 "The rebels must be crushed, we cannot let them dictate terms to us!"
 zaz_10_title:0 "An Influential Cossack Demands Change"
 zaz_11_a:0 "They must be grateful to us for this!"
 zaz_11_desc:0 "Despite the opposition to the demands, the majority of the Szlachta had decided that it would be better to improve the conditions of the upkeep for the Cossack regiments rather than risk provoking yet another devastating revolt in Rus'."
 zaz_11_title:0 "Szlachta Agrees to Cossack Demands"
 zaz_12_a:0 "This doesn't look good, but let's hold crown troops for now."
 zaz_12_desc:0 "As we had anticipated, the majority of Szlachta refused to agree to the demands. In fact, some of the nobles tried to knock Nalyvaiko out of his residence in Braclaw, which resulted in a total failure and left us with no opportunities for any further negotiations for now."
 zaz_12_title:0 "Szlachta Refuses"
 zaz_13_a:0 "Recall our Field Crown Hetman and order him to deal with this!"
 zaz_13_b:0 "This went way too far, peace must be reached!"
 zaz_13_desc:0 "Not being able to deal with the Cossacks, Szlachta from Rus' sent us a delegation. They have asked for our help, complaining that the Cossacks are even more annoying than Tatars. They've also reported about atrocities that rebels had committed against Polish nobility and Catholic clergy in Mahilyow.\n\nAt the same time, we have received a peace offer from Nalyvaiko in which he requires us to cede some of the lands in exchange for their military service and loyalty to the Commonwealth. Now, we have a choice of how to end this. Either we accept the peace offer and bring an end to this quickly, or we can drown Ruthenian lands in blood once again."
 zaz_13_title:0 "Szlachta Requests Our Help"
 zaz_14_a:0 "Is this truly over?"
 zaz_14_desc:0 "Having agreed to the peace offer, we have brought an end to the uprising. The captured cities were ceded to us, and prisoners freed. Unfortunately, due to the contradictory nature of this peace offer, some of the nobility desperately took up arms against us, trying to revert that.\n\nUnlike the previous rebellion, this one, due to the usage of scorched earth tactics, severely devastated left-bank Ukraine."
 zaz_14_title:0 "End of Nalyvaiko Uprising"
 zaz_15_a:0 "Chase after them!"
 zaz_15_desc:0 "After bloody clashes with the rebels, we have forced Nalyvaiko and the rest of his army to retreat to the left-bank Ukraine, to the village Solonystsy near the town of Lubnie. There he organized a tabor."
 zaz_15_title:0 "Rebels Were Forced to Retreat"
 zaz_16_a:0 "Confiscation of their lands will serve them a good punishment!"
 zaz_16_desc:0 "Storming the tabor, our army slaughtered everyone related to the Cossacks, including their families. Only a small pack of survivors have managed to break free. Nalyvaiko fell in the battle among his troops. With the fall of its leader, the uprising is realistically over."
 zaz_16_title:0 "End of Nalyvaiko Uprising"
 zaz_17_a:0 "Offer them amnesty in exchange for their surrender."
 zaz_17_desc:0 "Surrounded in Solonytsy for quite some time, the rebels are running out of food and water. If we offer them appealing surrender conditions, we may end the uprising quickly and without bloodshed."
 zaz_17_title:0 "Negotiations with Rebels"
 zaz_18_a:0 "It cannot be helped. We must take the necessary actions to end the rebellion."
 zaz_18_desc:0 "The rebels have rejected our terms, leaving us no choice but to siege their tabor."
 zaz_18_title:0 "Negotiations with Rebels"
 zaz_19_a:0 "We must act with civility and justice towards the rebels and their leaders."
 zaz_19_b:0 "We should storm the tabor during the final negotiations and execute them all. They have caused enough destruction and must face the consequences."
 zaz_19_desc:0 "Although the rebels have accepted our proposal to negotiate, the situation has taken a unexpected turn. One of the Cossack negotiators, Hryhory Loboda, was murdered by the rebels on suspicion of treason. The rebels have offered to hand over the leaders of the rebellion, including Nalyvaiko, on the same terms.\n\nWhile we may agree to these terms, our Nobility expects us to deal with the rebels accordingly, given the destruction caused by their uprising."
 zaz_19_title:0 "Negotiations with Rebels"
 zaz_1_a:0 "Make a decision!"
 zaz_1_b:0 "We must refrain from making impulsive decisions."
 zaz_1_desc:0 "Since the second part of the sixteenth century, they have been devastatingly attacking our area, including our prosperous trading port towns. Although they have no direct control over their behavior, the [POL.GetName] has an influence on them. We may declare war on them if they do not control these invading monsters. There's a chance they won't be able to flee, in which case we'll have to attack them with fire and sword."
 zaz_1_title:0 "Zaporozhia Cossack Raids"
 zaz_20_a:0 "We must make a public example of them in the capital, to show that rebellion will not be tolerated."
 zaz_20_desc:0 "With the ceding of the rebellion's leaders, we have finally brought an end to the Nalyvaiko Uprising. However, the question remains of how to punish the captured leaders."
 zaz_20_title:0 "End of Nalyvaiko Uprising"
 zaz_21_a:0 "Good riddance. The rebellion has been quashed, and the rebels will pay for their crimes."
 zaz_21_desc:0 "We stormed the tabor, and our army slaughtered everyone related to the Cossacks, including their families. Only a small number of Cossacks were able to escape. With their leaders in our hands, we have brought an end to the uprising. Given the scale of damage suffered by our Nobility, we have decided to confiscate the lands of the Cossacks. As for Nalyvaiko and the other leaders, their punishment will be severe and cruel."
 zaz_21_title:0 "End of Nalyvaiko Uprising"
 zaz_2_a:0 "Something must be done about it."
 zaz_2_a_tooltip:0 "Limit the Cossacks' raiding freedom."
 zaz_2_b:0 "We do not pay attention to the diabolical infidel! Come on!"
 zaz_2_b_tooltip:0 "This will very certainly result in a military war with the Ottomans."
 zaz_2_desc:0 "If the Zaporozhian Cossack incursions persisted, the Ottoman [TUR.Monarch.GetName] threatened our country with war.\n\nWar with the Ottomans and their allies, on the other hand, maybe an inconceivable calamity for us if we are not fully certain that we will be able to oppose them."
 zaz_2_title:0 "The Ottomans Pose a Menace."
 zaz_3_a:0 "They should do it!"
 zaz_3_desc:0 "[POL.Monarch.GetTitle] [POL.Monarch.GetName] has notified us that they will take sufficient measures against the Cossacks to terminate their invasion."
 zaz_3_title:0 "Our Demands are Accepted by the [POL.GetName]."
 zaz_4_a:0 "...War!"
 zaz_4_desc:0 "What a horrific offense! [POL.Monarch.GetTitle] for defying our requirements! This can only mean one thing..."
 zaz_4_title:0 "Our Queries are Rejected by [POL.GetName]."
 zaz_5_a:0 "This is a private matter of these nobles. Do not intrude."
 zaz_5_desc:0 "Krzysztof Kosinski, a colonel of the Registered Cossacks in Kyiv Voivodship captured Bila Tserkva in the retaliation against Janusz Ostrogski, who deprived of his estate in the villages of Rokitno and Olsznice earlier.\n\nThis conflict doesn't seem one that we should be bothered about."
 zaz_5_title:0 "A Conflict Between Ruthenian Nobility"
 zaz_6_a:0 "Let's keep a close eye on it."
 zaz_6_desc:0 "After Kosinski captured Bila Tserkva, he named himself a Hetman of the Cossacks and with that kindled a full-scale revolt against the rule of the Polish crown and the local Ruthenian Nobility.\n\nAlthough it looks bad, our chancellor assures us that it's just yet another struggle for power in this disorderly region so we shouldn't mobilize our troops for intervention and Ostrogski family, perhaps the most powerful noble family in Rus' is more than capable of dealing with that themselves."
 zaz_6_title:0 "Ruthenian Noble Names Himself a Hetman"
 zaz_7_a:0 "Another triumph for the Crown."
 zaz_7_desc:0 "News from the village of Piatek! The Cossacks, as expected, have been defeated by Duke Kostanty Wasyl Ostrogski after a week of fierce fighting. The leader of the revolt was forced to sign an agreement in which the Cossacks were obliged to be loyal to the crown, strip Kosinski of his Hetman status, and remove from the Cossack Register everyone who had been added during the revolt."
 zaz_7_title:0 "End of Kosinski Uprising"
 zaz_8_a:0 "We cannot allow this failure to stand. We must take action and quash the rebellion ourselves before it's too late!"
 zaz_8_desc:0 "What seemed like a routine rebellion that could have been easily crushed by the Ruthenian Nobility turned into an embarrassing failure for them. The combined forces of the nobility were completely outmaneuvered and crushed by the Cossacks!\n\nThis defeat will surely become a stain on the reputation of the entire country, especially considering how poorly equipped the rebels were."
 zaz_8_title:0 "A Humiliating Defeat"
 zaz_9_a:0 "That was a close call indeed, but the Crown has prevailed."
 zaz_9_desc:0 "After a series of clashes between our army and the rebels, we have dealt a decisive blow to the Kosinski Uprising and captured Kosinski himself in battle. He was forced to sign an agreement in which the Cossacks were obliged to be loyal to the crown, Kosinski was stripped of his Hetman status, and everyone who was added to the Cossack Register during the revolt was removed."
 zaz_9_title:0 "The End of the Kosinski Uprising"
 zaz_abolish_register_desc:0 "Burn the roll and the difference between registered and unregistered dies with it — every man who brings a horse and a sabre is of the Host. The crown will then owe nobody, and pay nobody."
 zaz_abolish_register_title:0 "Abolish the Cossack Register"
 zaz_alternate_history:0 "§YAlternate history path§!"
 zaz_army:0 "The New Army"
 zaz_betrayed_sich:0 "Betrayed the Sich"
 zaz_black_sea_trade_desc:0 "Secure ports and trade routes on the Black Sea to enrich the Sich."
 zaz_black_sea_trade_title:0 "Monopolize Black Sea Trade"
 zaz_caravan:0 "Zaporozhian Caravans"
 zaz_catholic_spread:0 "The Spread of Catholicism"
 zaz_chaiky_fleet:0 "Chaiky Fleet"
 zaz_chaiky_fleet_active:0 "Chaiky Raiders"
 zaz_chaiky_fleet_desc:0 "Our fleet of light chaiky boats dominates river warfare."
 zaz_chaiky_flotilla:0 "Chaiky Flotilla"
 zaz_chaiky_flotilla_desc:0 "Light chaiky boats allow Cossacks to raid along rivers and even across the Black Sea to Constantinople."
 zaz_chaiky_raid_cooldown:0 "Recent Chaiky Raid"
 zaz_chaiky_raid_desc:0 "Dispatch our chaiky boats to strike enemy shores and bring back spoils."
 zaz_chaiky_raid_effect:0 "Successful Chaiky Raid"
 zaz_chaiky_raid_title:0 "Send the Chaiky"
 zaz_chaiky_raid_victims:0 "Chaiky Raid Victims"
 zaz_chaiky_raiders:0 "Chaiky Raiders"
 zaz_chaiky_raiders_desc:0 "Our chaiky boats strike fear along the Ottoman coasts."
 zaz_chaiky_trade_reform:0 "Chaiky Commerce"
 zaz_chaiky_trade_reform_desc:0 "Beyond military raids, the Zaporozhian chaiky boats engage in Black Sea commerce - though often through privateering and slave-trading. This maritime activity brings wealth but damages relations with coastal powers and organized trade leagues."
 zaz_colonization_effort:0 "Colonization of Wild Fields"
 zaz_colonization_effort_desc:0 "We are establishing new settlements in the steppe."
 zaz_connections:0 "Expanding Alliance Network for Strategic Advantage"
 zaz_convene_great_rada_desc:0 "The Kish is summoned to the square and the standards set up. Whatever is decided there binds the Host, including the officers who called the assembly."
 zaz_convene_great_rada_title:0 "Convene the Great Rada"
 zaz_cossack_democracy:0 "Cossack Liberties"
 zaz_cossack_mercenaries:0 "Hired Cossack Mercenaries"
 zaz_crisis.1.a:0 "Strengthen the Kosh Otaman"
 zaz_crisis.1.b:0 "Empower the elective Rada"
 zaz_crisis.1.c:0 "Launch a great raid to unite us!"
 zaz_crisis.1.d:0 "The Zaporozhian Sich faces an existential crisis. Internal factions fight for control, raids have gone badly, and overlords demand submission. The famous Cossack freedom hangs in the balance."
 zaz_crisis.1.t:0 "The Sich in Crisis"
 zaz_crisis.2.a:0 "The Sich stands united!"
 zaz_crisis.2.b:0 "Accept our overlord's control"
 zaz_crisis.2.c:0 "Relocate the Sich to safer grounds"
 zaz_crisis.2.d:0 "Through struggle and sacrifice, the Zaporozhian Sich has weathered the storm. The Host stands united once more."
 zaz_crisis.2.t:0 "Crisis Resolved"
 zaz_crisis.3.a:0 "Accept our losses"
 zaz_crisis.3.b:0 "Prepare for retaliation!"
 zaz_crisis.3.d:0 "A Cossack raiding party has suffered a terrible defeat. Our enemies now prepare retaliation."
 zaz_crisis.3.t:0 "Raid Gone Wrong"
 zaz_crisis.4.a:0 "Support the Otaman's authority"
 zaz_crisis.4.b:0 "Support the Rada's liberty"
 zaz_crisis.4.c:0 "Hold a new election"
 zaz_crisis.4.d:0 "A power struggle has erupted between the elected Kosh Otaman and the free Sich Rada council."
 zaz_crisis.4.t:0 "Kosh Otaman vs Rada"
 zaz_crisis.5.a:0 "Submit to their demands"
 zaz_crisis.5.b:0 "Defy them!"
 zaz_crisis.5.c:0 "Negotiate a compromise"
 zaz_crisis.5.d:0 "Our overlord demands greater control over Sich affairs, threatening our cherished autonomy."
 zaz_crisis.5.t:0 "Overlord Demands Control"
 zaz_defend_orthodox_desc:0 "Commit to shielding the Orthodox faithful from oppression."
 zaz_defend_orthodox_title:0 "Defend the Orthodox"
 zaz_democratic_rada:0 "Elective Rada Council"
 zaz_despised_by_the_cossacks:0 "Despised by the Cossacks"
 zaz_establish_sloboda_desc:0 "The Wild Field beckons with empty lands waiting to be tamed. By establishing sloboda settlements - free military colonies where settlers receive land grants in exchange for military service - we can extend our control over the frontier while building a new generation of warrior-farmers."
 zaz_establish_sloboda_title:0 "Establish Sloboda Settlement"
 zaz_evolve_to_hetmanate_desc:0 "The Zaporizhian Sich can transform from a raiding host into a settled Hetmanate, assuming formal structures of governance and broader obligations."
 zaz_evolve_to_hetmanate_title:0 "Elevate the Sich to a Hetmanate"
 zaz_expand_register_desc:0 "Writing more men into the register secures their pay and lifts their labour dues, and gives the crown a list of every Cossack by name. A list serves whoever holds it."
 zaz_expand_register_title:0 "Expand the Cossack Register"
 zaz_failed_raid:0 "Failed Chaiky Raid"
 zaz_failed_raid_desc:0 "Our raid ended in disaster, with heavy losses."
 zaz_failed_raid_effect:0 "Failed Cossack Raid"
 zaz_faith:0 "The Authority of the Patriarchs"
 zaz_fixes.1.a:0 "Build the fortress and strengthen our liberty!"
 zaz_fixes.1.b:0 "The traditional Sich is sufficient."
 zaz_fixes.1.d:0 "The Zaporozhian Sich must be more than just a military camp—it must be an impregnable fortress that can withstand both Ottoman and Tatar assaults. Our master builder Dmytro Vyshnevetsky proposes constructing stone fortifications and establishing permanent liberties within the Sich. This will transform our settlement into the heart of Cossack liberties and military power."
 zaz_fixes.1.t:0 "Founding the Enhanced Sich"
 zaz_fixes.2.a:0 "Negotiate zones—pragmatism ensures survival."
 zaz_fixes.2.b:0 "We raid where we please! The Black Sea is ours!"
 zaz_fixes.2.d:0 "Our Chaiky boats have been raiding Ottoman coastal towns and merchant ships for years, bringing wealth and glory to the Sich. The Ottoman Sultan now sends envoys proposing a treaty: we may raid designated zones in exchange for ceasing attacks on major ports. Should we accept this limitation, or continue our unrestricted raids?"
 zaz_fixes.2.t:0 "Black Sea Raiding Rights"
 zaz_fixes.3.a:0 "Accept the expanded Register—we need Polish support."
 zaz_fixes.3.b:0 "We demand full autonomy, not bribes!"
 zaz_fixes.3.d:0 "The Polish Crown offers to expand the Cossack Register, granting official status and payment to more of our warriors. This would strengthen our military position and improve relations with the Commonwealth, but many Cossacks fear it compromises our independence. The unregistered Cossacks grow restless at this prospect."
 zaz_fixes.3.t:0 "Expansion of the Cossack Register"
 zaz_fixes.4.a:0 "Relocate the Sich to safety."
 zaz_fixes.4.b:0 "We will defend this ground to the last!"
 zaz_fixes.4.d:0 "War threatens the Sich! Enemy forces approach our sacred fortress. Our otamans propose relocating the Sich upstream to a more defensible position, following the tradition of our predecessors who moved the Sich multiple times throughout history. This would preserve our institutions but require abandoning our current fortifications."
 zaz_fixes.4.t:0 "Relocating the Sich"
 zaz_fixes.5.a:0 "Prepare for battle! We fear no Sultan!"
 zaz_fixes.5.b:0 "Send peace envoys—we've pushed too far."
 zaz_fixes.5.d:0 "Our unrestricted Chaiky raids have finally provoked the Sultan's wrath! Ottoman galleys sail up the Dnieper, bringing fire and destruction to our shores. We must either prepare our defenses and face the consequences of our raids, or sue for peace and moderate our aggressive activities."
 zaz_fixes.5.t:0 "Ottoman Retaliation for Raids"
 zaz_fixes.6.a:0 "Liberty is our greatest strength!"
 zaz_fixes.6.b:0 "War demands strong military leadership."
 zaz_fixes.6.d:0 "The General Rada, our sacred general assembly, gathers at the Sich. All Cossacks, from the lowliest to the most decorated otamans, have equal voice. Some argue we should strengthen these old liberties, preserving the unique Cossack way of governance. Others believe military necessity demands stronger otaman authority."
 zaz_fixes.6.t:0 "The General Rada Convenes"
 zaz_fixes.7.a:0 "Codify the relocation doctrine."
 zaz_fixes.7.b:0 "Mobilize the border Host immediately."
 zaz_fixes.7.d:0 "The Sich has survived another relocation, but the Host now debates what should follow: codify relocation doctrine and civil order, or prioritize emergency military readiness against encirclement."
 zaz_fixes.7.t:0 "After the Relocation"
 zaz_flavor.1.a:0 "Cossacks will never, ever, ever be enslaved."
 zaz_flavor.1.b:0 "Nope."
 zaz_flavor.10.a:0 "Glorious success!"
 zaz_flavor.10.b:0 "Mixed results"
 zaz_flavor.10.c:0 "Disaster strikes"
 zaz_flavor.10.d:0 "Our Cossack host has launched a devastating raid deep into enemy territory!"
 zaz_flavor.10.t:0 "The Great Raid"
 zaz_flavor.11.a:0 "Devastating blow to the Sultan!"
 zaz_flavor.11.b:0 "Successful raid"
 zaz_flavor.11.c:0 "Caught and destroyed"
 zaz_flavor.11.d:0 "Our chaiky fleet has struck at the Ottoman coastline!"
 zaz_flavor.11.t:0 "Chaiky Raid on Ottoman Coast"
 zaz_flavor.12.a:0 "Establish settlements"
 zaz_flavor.12.b:0 "Preserve the Wild Fields"
 zaz_flavor.12.d:0 "The vast Wild Fields stretch endlessly, largely empty save for nomadic herders. Our Cossacks could establish permanent settlements here, claiming these lands for cultivation. However, some argue we should preserve the steppe's wild character, which gives us strategic mobility."
 zaz_flavor.12.t:0 "Settling the Wild Fields"
 zaz_flavor.13.a:0 "Accept Russian protection"
 zaz_flavor.13.b:0 "Maintain absolute independence!"
 zaz_flavor.13.d:0 "The Russian Tsardom has grown immensely powerful, now dominating the entire region. Moscow offers us protection against Poland and the Ottomans, but at the price of our independence. Many Cossacks favor accepting Russian overlordship, while others insist we must remain free at all costs."
 zaz_flavor.13.t:0 "The Russian Question"
 zaz_flavor.14.a:0 "Accept the Polish registration"
 zaz_flavor.14.b:0 "Reject Polish control and maintain independence"
 zaz_flavor.14.c:0 "Negotiate a compromise"
 zaz_flavor.14.d:0 "The Polish-Lithuanian Commonwealth seeks to formalize our cossack forces through the 'registered' system, demanding discipline and obedience. Our free cossacks resist this attempt to curtail our ancient traditions of liberty and independence. We must decide: accept registration for stability, or maintain our freedom at the risk of conflict with our overlords."
 zaz_flavor.14.t:0 "The Registered Cossacks Crisis"
 zaz_flavor.15.a:0 "Elect a strong military commander"
 zaz_flavor.15.b:0 "Elect a skilled diplomat"
 zaz_flavor.15.c:0 "Elect an experienced elder"
 zaz_flavor.15.d:0 "The Sich Rada, the general assembly of all free cossacks, gathers to elect a new Kosh Otaman (military commander). The position is elective and temporary, answerable to the Rada. We must choose a leader who embodies the spirit of our people: a fierce warrior, a skillful diplomat, or a wise elder."
 zaz_flavor.15.t:0 "The Sich Rada Convenes: Kosh Otaman Election"
 zaz_flavor.16.a:0 "Fortify the Sich and prepare for siege"
 zaz_flavor.16.b:0 "Launch a preemptive chaiky raid"
 zaz_flavor.16.c:0 "Seek protection from Moscow or Poland"
 zaz_flavor.16.d:0 "The Ottoman Sultan and Crimean Khan, angered by our chaiky raids and piracy on the Black Sea, threaten devastating retaliation. Their military expeditions loom on the horizon, and our supply lines are at risk. We must prepare our defenses, strike preemptively, or seek protection from a neighboring power."
 zaz_flavor.16.t:0 "Ottoman and Crimean Pressure"
 zaz_flavor.17.a:0 "Relocate to a safer location upstream"
 zaz_flavor.17.b:0 "Relocate to the mouth of the Dnieper (Ottoman lands)"
 zaz_flavor.17.d:0 "Our current location has become untenable due to raids, diplomatic pressure, or changing strategic circumstances. History shows that the Sich has relocated multiple times: from Tomakivka to Bazavluk, from Bazavluk to Mykytyn, from Mykytyn to Chortomlyts'ka, and finally to Oleshky under Ottoman protection. We must choose a safer location or risk annihilation."
 zaz_flavor.17.t:0 "The Sich Must Relocate"
 zaz_flavor.18.a:0 "Fight to the last man"
 zaz_flavor.18.b:0 "Scatter to Ottoman lands (Kuban path)"
 zaz_flavor.18.c:0 "Submit to Russian rule"
 zaz_flavor.18.d:0 "The Russian Empress Catherine II has declared the Zaporozhian Sich an enemy of the state. Her armies march to destroy our last stronghold on the island of Khortytsia. This is our final moment: we can fight to the death to preserve our honor, scatter to Ottoman lands to continue our struggle, or submit to Russian rule and hope to maintain some autonomy. History will judge our choice."
 zaz_flavor.18.t:0 "The Final Reckoning: 1775"
 zaz_flavor.1a:0 "Excellent. Let the Cossacks ride!"
 zaz_flavor.1d:0 "The Zaporozhian Cossacks have organized themselves into a formidable military force. With their expertise in cavalry warfare and knowledge of the steppe, they offer us an opportunity to strengthen our military capabilities."
 zaz_flavor.1t:0 "The Cossack Host"
 zaz_flavor.2.a:0 "Establish Sich on Khortytsia Island"
 zaz_flavor.2.b:0 "Keep the Sich mobile and adaptable"
 zaz_flavor.2.d:0 "Below the Dnieper rapids, where no overlord's authority reaches, our Cossack brothers have established a fortified settlement - the Zaporozhian Sich. This will be our sanctuary of freedom, where all Cossacks are equals and the Kosh Otaman is elected by the General Rada. From here, we shall launch raids against the Tatars and Turks, defend Orthodox Christianity, and preserve our ancient liberties. The Sich stands as a beacon of Cossack independence in the Wild Fields."
 zaz_flavor.2.t:0 "The Founding of the Sich"
 zaz_flavor.3.a:0 "Build more chaiky boats"
 zaz_flavor.3.b:0 "Focus on traditional cavalry warfare"
 zaz_flavor.3.d:0 "Our Cossacks have mastered the art of naval warfare using chaiky - light, fast boats that can navigate rivers and seas. These vessels allow us to strike deep into Ottoman territory, raiding coastal cities and returning with wealth before the Sultan's fleet can respond. The Ottomans call us 'sea demons,' and they tremble when our chaiky appear on the horizon."
 zaz_flavor.3.t:0 "The Chaiky Raiders"
 zaz_flavor.4.a:0 "Raid Crimea!"
 zaz_flavor.4.b:0 "Restrain the Cossacks for now"
 zaz_flavor.4.d:0 "The Crimean Tatars have raided our lands for generations, taking our people as slaves. Now it is time for revenge! Our Cossack host stands ready to strike into Crimea, liberating captives and seizing Tatar wealth. However, such a raid risks provoking retaliation and disrupting any diplomatic relations we might have with the Khanate."
 zaz_flavor.4.t:0 "Raid into Crimean Territory"
 zaz_flavor.5.a:0 "Elect the warrior"
 zaz_flavor.5.b:0 "Elect the diplomat"
 zaz_flavor.5.c:0 "Elect the wise elder"
 zaz_flavor.5.d:0 "The position of Kosh Otaman - the elected leader of the Zaporozhian Sich - has become vacant. The General Rada must convene to elect a new leader. Three candidates have emerged: a fearsome warrior who promises decisive military action, a skilled diplomat who advocates negotiation with our neighbors, and a wise elder who embodies traditional Cossack values."
 zaz_flavor.5.t:0 "The Kosh Otaman Election"
 zaz_flavor.50.a:0 "Crush the uprising"
 zaz_flavor.50.b:0 "Negotiate registers and autonomy"
 zaz_flavor.50.d:0 "The Cossack hosts rally behind Bohdan Khmelnytsky, demanding redress for abuses and recognition of their rights. The steppe is ablaze; how shall we respond?"
 zaz_flavor.50.t:0 "Khmelnytsky Stirs the Steppe"
 zaz_flavor.6.a:0 "Accept autonomy within the Commonwealth"
 zaz_flavor.6.b:0 "Defy Polish demands!"
 zaz_flavor.6.c:0 "Remain diplomatically neutral"
 zaz_flavor.6.d:0 "The Polish-Lithuanian Commonwealth seeks to control the Cossack Host through the Registry - limiting the number of 'official' Cossacks and demanding obedience. Many of our brothers in the registered Cossacks accept Polish authority, but the Zaporozhian Sich remains fiercely independent. Poland now demands we submit or face consequences."
 zaz_flavor.6.t:0 "Clash with the Polish-Lithuanian Commonwealth"
 zaz_flavor.7.a:0 "Champion the Orthodox cause!"
 zaz_flavor.7.b:0 "Maintain religious tolerance"
 zaz_flavor.7.d:0 "The Zaporozhian Sich has always been a bastion of Orthodox Christianity, defending the faith against Catholic and Muslim pressure. However, some argue for religious tolerance to strengthen our alliances. The General Rada must decide whether to champion Orthodoxy militantly or adopt a more pragmatic approach."
 zaz_flavor.7.t:0 "Religious Debates in the Rada"
 zaz_flavor.8.a:0 "Fight back with all our strength!"
 zaz_flavor.8.b:0 "Relocate the Sich to safety"
 zaz_flavor.8.c:0 "Pay tribute to end the conflict"
 zaz_flavor.8.d:0 "Our raids have provoked the Sultan's wrath! A massive Ottoman force has struck at the Sich, bringing devastation to our lands. The enemy seeks to punish us for our audacity and break the spirit of Cossack resistance. We must decide how to respond to this crisis."
 zaz_flavor.8.t:0 "Ottoman Retaliation"
 zaz_flavor.9.a:0 "Form the alliance"
 zaz_flavor.9.b:0 "Remain independent"
 zaz_flavor.9.d:0 "Despite our conflicts with the Crimean Tatars, we Cossacks share much with the steppe nomads - a warrior culture, love of horses and freedom, and distrust of settled empires. Some nomadic chiefs have proposed a formal alliance, recognizing our common interests against Muscovy, Poland, and the Ottomans."
 zaz_flavor.9.t:0 "The Brotherly Compact"
 zaz_flavor_m_1.1.a:0 "Kill the Enemies!"
 zaz_flavor_m_1.1.b:0 "Slay the Nobles!"
 zaz_flavor_m_1.1.c:0 "Plunder and Pillage!"
 zaz_flavor_m_1.1.d:0 "Our soldiers have demonstrated their exceptional tactical prowess by launching a surprise attack on the Lithuanian forces and quickly defeating them."
 zaz_flavor_m_1.1.t:0 "Ambush in Lithuania"
 zaz_flavor_m_2.1.a:0 "Loot and Plunder the City!"
 zaz_flavor_m_2.1.b:0 "Conscript the people!"
 zaz_flavor_m_2.1.c:0 "Let the count decide!"
 zaz_flavor_m_2.1.d:0 "Our forces have successfully penetrated deep into enemy territory and captured the lightly defended fort in Kraków."
 zaz_flavor_m_2.1.t:0 "Ambush in Kraków"
 zaz_flavor_m_2.2.a:0 "Plunder and pillage!"
 zaz_flavor_m_2.2.b:0 "Population conscription!"
 zaz_flavor_m_2.2.c:0 "Leave it to the Courts!"
 zaz_flavor_m_2.2.d:0 "Our forces were able to rapidly penetrate deep into enemy territory and take the fort in Moskva, which was only weakly defended!"
 zaz_flavor_m_2.2.t:0 "Moskva ambush"
 zaz_flavor_m_3.1.a:0 "Loot and pillage!"
 zaz_flavor_m_3.1.b:0 "Recruit the population!"
 zaz_flavor_m_3.1.c:0 "Allow the courts to Decide!"
 zaz_flavor_m_3.1.d:0 "Against all odds, we have secured our independence! The Sich Rada meets in solemn assembly, the elected Kosh Otaman holds the symbolic mace, and our black and red banners fly over free soil. Foreign ambassadors arrive - some to congratulate, others to threaten, all to assess whether this Cossack republic can truly survive among the great powers of Europe. We have won our freedom; now we must keep it."
 zaz_flavor_m_3.1.t:0 "The Free Zaporozhian State"
 zaz_flavor_m_3.2.a:0 "Plunder and loot!"
 zaz_flavor_m_3.2.b:0 "Conscription of locals!"
 zaz_flavor_m_3.2.c:0 "Leave it to the judiciary!"
 zaz_flavor_m_3.2.d:0 "Our forces were able to rapidly penetrate deep into enemy territory and take Saratov's fort, which was only weakly defended!"
 zaz_flavor_m_3.2.t:0 "Ambush in Saratov"
 zaz_flavor_m_4.1.d:0 "The Sich Rada debates far into the night, voices rising in passionate argument. 'Moscow offers Orthodox brotherhood!' shouts one colonel. 'The Ottomans offer trade and freedom!' counters another. 'We should bow to no one!' declares a third. The hetman must decide our nation's future - but in the Cossack way, the final choice belongs to the assembled warriors. The vote is called. The mace is raised. History holds its breath."
 zaz_flavor_m_4.1.t:0 "Choosing Protectors"
 zaz_flavor_m_4.a:0 "Let us all hope for a happy future with the Turks"
 zaz_flavor_m_4.b:0 "We shall keep to the Old Ways"
 zaz_flavor_m_4.c:0 "Let us all look forward to a bright future"
 zaz_flavor_m_4.d:0 "We will follow proven routes"
 zaz_flavor_m_4.d1:0 "We sought to form an alliance with Ottoman Empire. Our fate is still undetermined, but the Sultan's might will keep us secure for now."
 zaz_flavor_m_4.d2:0 "We sought to form an alliance with the Great Horde. The Crimean Khanate will no longer pose a danger to us."
 zaz_flavor_m_4.d3:0 "We will continue to be on our side. Our immediate neighbors are no longer a threat to us, but there will be other challenges."
 zaz_flavor_m_4.d4:0 "We are looking for a partnership with Polish authorities. Our future may still be unpredictable, although we have already shown our will and desire to align with Poland, so cooperation will be beneficial, even if we compete."
 zaz_flavor_m_4.d5:0 "We sought an alliance with Russia's authorities. Our fate is unclear, but our faith brothers will come to our rescue in our hour of need."
 zaz_flavor_m_4.e:0 "Let us all hope for a happy future with the Russians."
 zaz_flavor_m_4.t:0 "The New Course of Action"
 zaz_flavor_m_5.1.a:0 "I agree. Thank you very much, Allahu akbar."
 zaz_flavor_m_5.1.b:0 "We can put up with them, but I will stick to my convictions"
 zaz_flavor_m_5.1.d:0 "Many prominent and respected Muslims have come to our court as a result of our long-standing connections with the Sultan. Perhaps it is time to look at this faith with a more respectful eye."
 zaz_flavor_m_5.1.t:0 "Islam Conversion"
 zaz_flavor_m_5.2.a:0 "Thank you so much, Deus Vult."
 zaz_flavor_m_5.2.b:0 "We can put up with them, but I will stand firm in my convictions"
 zaz_flavor_m_5.2.d:0 "Because of our long-standing relations to the West, many notable and renowned Catholics have visited our court. I agree that it's time to take a more respectful look at this faith."
 zaz_flavor_m_5.2.t:0 "Catholic Conversion"
 zaz_flavor_m_6.a:0 "It has been completed."
 zaz_flavor_m_6.d:0 "Desperate to display his commitment to the Rosso-Zaporozhian alliance, the [Root.Monarch.GetTitle] of [Root.GetName] has developed a plan unlike any other conceived by the world's sane rulers. \n'Do not do it!' shrieked the advisers; \n'You are insane!' exclaimed the heir, but [Root.Monarch.GetName] disregarded them both. 'It has to be done,' he added unequivocally. \nHe begins composing the letter in a demonic fury, a true incantation, a political curse. He continues for five days and six nights until, at midnight on the sixth, he throws the fourteenth pen aside and passes out. An adviser takes up a piece of letter paper and begins to write. To go through it: a letter for the [TUR.GetTitle]... a letter that will cause chaos for the [TUR.Monarch.GetName] \n\n'O Sultan, Turkish demon, cursed..."
 zaz_flavor_m_6.t:0 "The Letter of Zaporozhian Cossacks"
 zaz_flavor_m_7.a:0 "Oh no! That sounded interesting!"
 zaz_flavor_m_7.d:0 "The letter appears to have garnered a cold reception."
 zaz_flavor_m_7.t:0 "The [TUR.GetName] response from"
 zaz_flavor_m_8.a:0 "Does anyone speak Russian?"
 zaz_flavor_m_8.d:0 "Received a letter from the Zaporozhia Cossacks! We don't know what it says, but we're assuming it's an insult."
 zaz_flavor_m_8.t:0 "Letter from [ZAZ.GetName]"
 zaz_flavor_m_9.a:0 "Everything should be packed"
 zaz_flavor_m_9.b:0 "We should dedicate our resources to our present capital"
 zaz_flavor_m_9.d:0 "Our country's capture of Constantinople was a watershed event. Moving the capital there will offer us with benefits and riches previously unseen."
 zaz_flavor_m_9.t:0 "Zaporozhia's Desire City"
 zaz_fortify_frontier_desc:0 "Strengthen our border fortresses to deter incursions."
 zaz_fortify_frontier_title:0 "Fortify the Frontier"
 zaz_fortify_sloboda_desc:0 "Our civilian sloboda settlements provide manpower and production, but they remain vulnerable to raids. By investing in proper fortifications, we can transform these colonies into bastions capable of holding against nomadic raiders and enemy armies alike."
 zaz_fortify_sloboda_title:0 "Fortify Sloboda"
 zaz_free_cossacks_spirit:0 "Free Cossacks Spirit"
 zaz_free_host_reform:0 "Zaporozhian Host"
 zaz_free_host_reform_desc:0 "The Zaporozhian Host represents the culmination of Cossack rule of the war council - a warrior commonwealth that has perfected cavalry warfare and maintained independence from surrounding empires. This is the golden age of Sich power, before Russian pressure forces submission."
 zaz_freed_captives_tt:0 "Our raid has freed Christian captives from Ottoman slavery."
 zaz_frontier_tolerance:0 "Frontier Tolerance"
 zaz_frontier_tolerance_desc:0 "The Sich accepts Orthodox, Old Believers, and even some Catholics, united by Cossack brotherhood rather than theology."
 zaz_frontier_trade:0 "Frontier Trade Relations"
 zaz_general_rada_reform:0 "General Sich Rada"
 zaz_general_rada_reform_desc:0 "The General Rada is the supreme assembly of all Zaporozhian Cossacks. Every warrior has a voice and vote on matters of war, peace, and internal policy. This open Rada ensures popular support but can be chaotic and makes decisive action difficult."
 zaz_gol_friend:0 "Aligned with [GOL.GetName] for Strategic Alliance"
 zaz_grateful_cossacks:0 "Grateful Cossacks"
 zaz_great_rada_desc:0 "When the matter is war, peace or the bulava itself, the Kosh Otaman calls the whole Host to the square. Rank counts for nothing there, and a decision taken by shouting is difficult to appeal afterwards."
 zaz_great_rada_held:0 "Great Rada Convened"
 zaz_great_rada_held_desc:0 "The General Rada has met and affirmed our old liberties."
 zaz_great_rada_title:0 "Convene the Great Rada"
 zaz_great_raid:0 "Great Raid"
 zaz_great_raid_desc:0 "Organize a grand raiding expedition to seize plunder and humble our enemies."
 zaz_great_raid_title:0 "Launch a Great Raid"
 zaz_hate_mos:0 "Maintaining Tenuous Alliances with Hordes and their Allies"
 zaz_hate_plc:0 "Firmly Aligned with Opponents of Poland"
 zaz_high_difficulty:0 "§RHigh Difficulty§!"
 zaz_historically_accurate:0 "§GHistorically accurate path§!"
 zaz_hold_hetman_election_desc:0 "The Rada gathers to choose among the colonels: a man tried in the field, tolerable to the elders, and acceptable to whichever crown currently pays us. Two of the three usually suffice."
 zaz_hold_hetman_election_title:0 "Hold Hetman Election"
 zaz_host_great_rada_desc:0 "Assemble the full Sich Rada to deliberate on matters of state and reaffirm our unity."
 zaz_host_great_rada_title:0 "Host a Great Rada"
 zaz_insult_tur:0 "Defiant Posturing Against [TUR.GetName]"
 zaz_islam_spread:0 "The Spread of Islam"
 zaz_joined_confederation:0 "Joined the Kyivan Confederation"
 zaz_kosh_elections_reform:0 "Kosh Election System"
 zaz_kosh_elections_reform_desc:0 "The Kosh Otaman (chief of the Sich) is elected annually by the General Rada. Officers serve short terms and can be removed by popular vote. This frequent rotation prevents tyranny but creates instability and limits long-term planning."
 zaz_kosh_otaman:0 "Kosh Otaman Leadership"
 zaz_kosh_otaman_desc:0 "The elected Kosh Otaman leads the Host in war and peace, his authority derived from martial prowess and the Rada's confidence."
 zaz_last_sich_reform:0 "Last Sich Resistance"
 zaz_last_sich_reform_desc:0 "The Hetmanate is abolished and its chancery folded into a collegium, but the Kish still sits below the rapids, keeping its own courts and its own roll. It is the last body in these lands that elects its own head."
 zaz_launch_chaiky_raid_desc:0 "Reed-bundled hulls, fifty men to a boat, out through the liman before the Ottoman squadron can work upwind. The coast towns keep their plate in the churches and their captives in the pens, and both can be lifted in a night."
 zaz_launch_chaiky_raid_title:0 "Launch Chaiky Raid"
 zaz_liberate_slaves_desc:0 "Strike the slave markets and free our people held in bondage."
 zaz_liberate_slaves_title:0 "Liberate the Slaves"
 zaz_liberated_slaves:0 "Liberated Our Slaves"
 zaz_liberator_of_slaves:0 "Liberator of Slaves"
 zaz_liberator_of_slaves_desc:0 "Our raids freed many Christian captives from bondage, swelling our ranks and inspiring our men."
 zaz_lit_kill:0 "Eastern Maneuvers"
 zaz_loyal_subject:0 "Loyal Subject"
 zaz_mission_requirement:0 "§RRequirement:§! "
 zaz_mission_reward:0 "§YReward:§! "
 zaz_missionaries:0 "Foreign Missionaries"
 zaz_nalyvaiko_cossack_lands_confiscated:0 "Cossack Lands Confiscated"
 zaz_nalyvaiko_peace_offer:0 "Nalyvaiko Peace Agreement"
 zaz_negotiate_with_the_rebels_desc:0 "Try to negotiate with the rebels in Solonytsy."
 zaz_negotiate_with_the_rebels_title:0 "Negotiate with the Rebels"
 zaz_no_register:0 "Register Abolished"
 zaz_obedient_cossacks:0 "Obedient Cossacks"
 zaz_order_in_ukraine:0 "Order in Ukraine"
 zaz_ortho:0 "Fortress of the Orthodox Faith"
 zaz_orthodox_champions:0 "Champions of Orthodoxy"
 zaz_orthodox_champions_desc:0 "We are recognized as defenders of the Orthodox faith."
 zaz_peace_offering:0 "Peace Offering"
 zaz_plc_buff:0 "Utilizing Poland's Fields for Military and Economic Growth"
 zaz_polish_autonomy:0 "Autonomy within Commonwealth"
 zaz_polish_autonomy_desc:0 "We have negotiated special rights within the Polish-Lithuanian Commonwealth."
 zaz_prepped:0 "Prepared Defenses"
 zaz_proper_khan:0 "Establishing a Proper Khanate"
 zaz_protect_orthodox_desc:0 "The Union takes the sees and the endowments, and Moscow's patriarch would take what is left. Between them stands the Host, which owns neither but can garrison a monastery."
 zaz_protect_orthodox_title:0 "Protect Orthodox Monasteries"
 zaz_protected_orthodox:0 "Protected Orthodox Christians"
 zaz_rada_cooldown:0 "Recent Rada Assembly"
 zaz_rada_effects_tt:0 "The Great Rada makes momentous decisions affecting the entire Host."
 zaz_raid_provocation:0 "Cossack Raid Provocation"
 zaz_raiding_agreement:0 "Raiding Agreement"
 zaz_rebellious_cossacks:0 "Rebellious Cossacks"
 zaz_recent_relocation:0 "Recent Sich Relocation"
 zaz_recruit_steppe_cavalry_desc:0 "Good standing with the hordes brings us their light horse, men who scout four days ahead and vanish when pressed. The same riders were over our border last season, and their kin still are."
 zaz_recruit_steppe_cavalry_title:0 "Recruit Steppe Cavalry"
 zaz_refused_confederation:0 "Refused Confederation Invitation"
 zaz_register_abolished_tt:0 "The register is abolished - all free men may become Cossacks!"
 zaz_register_expanded:0 "Expanded Cossack Register"
 zaz_register_expanded_tt:0 "More Cossacks join the official register."
 zaz_register_limited:0 "Limited Cossack Register"
 zaz_register_reform_desc:0 "The register pays and privileges the men written into it and leaves the rest liable to their lords. Every hetman must decide whether the Host is the men on the roll or the men on the island."
 zaz_register_reform_title:0 "Reform the Register"
 zaz_register_unlimited:0 "Unlimited Cossack Register"
 zaz_registered_cossacks:0 "Registered Cossacks"
 zaz_religious_tolerance:0 "Cossack Religious Tolerance"
 zaz_religious_tolerance_desc:0 "We welcome people of all faiths to the Sich."
 zaz_relocate_sich_desc:0 "Move the Zaporozhian Sich to a new, more defensible location to safeguard our autonomy."
 zaz_relocate_sich_title:0 "Relocate the Sich"
 zaz_relocate_sich_unique_desc:0 "Alternative mechanics entry retained for compatibility; hidden unless explicitly enabled."
 zaz_relocate_sich_unique_title:0 "Relocate the Zaporozhian Sich"
 zaz_rivaled_rus:0 "Fostering a Rivalry with Russia for Regional Influence"
 zaz_rivaled_tur:0 "Rivaled by the Turks"
 zaz_russia_buff:0 "Cossack-Streltsy Exchanges"
 zaz_russian_help:0 "Russian Frontier Advisers"
 zaz_ruthenia:0 "Ruthenian Razing Spearheads"
 zaz_seeking_patron:0 "Seeking a Patron Power"
 zaz_seeks_protection:0 "Sich Petitions for Protection"
 zaz_settle_wild_fields_desc:0 "Encourage settlers to tame the Wild Fields, expanding our agricultural base and manpower."
 zaz_settle_wild_fields_title:0 "Settle the Wild Fields"
 zaz_sich_brotherhood:0 "Sich Brotherhood"
 zaz_sich_brotherhood_reform:0 "Sich Brotherhood"
 zaz_sich_brotherhood_reform_desc:0 "The Zaporozhian Sich is governed by a brotherhood of Cossacks, emphasizing collective decision-making and autonomy."
 zaz_sich_democracy:0 "Sich Liberty"
 zaz_sich_democracy_desc:0 "The Sich Rada (council) elects the Kosh Otaman and all officers, creating one of Europe's most elective military societies."
 zaz_sich_democracy_enhanced:0 "Enhanced Sich Liberty"
 zaz_sich_founded:0 "Sich Founded"
 zaz_sich_rada_justice:0 "Sich Rada Justice"
 zaz_sich_rada_justice_desc:0 "The Rada administers swift military justice and settles disputes among Cossacks, maintaining order despite elective freedoms."
 zaz_slave_raid_target:0 "Slave Raid Target"
 zaz_slave_raiders:0 "Slave-Raiders"
 zaz_sloboda_established_tt:0 "A new sloboda settlement is established on the frontier."
 zaz_steppe_alliance:0 "Steppe Alliance"
 zaz_steppe_alliance_desc:0 "Ally with the nomads of the steppe to share tactics and secure cavalry support."
 zaz_steppe_alliance_title:0 "Forge the Steppe Alliance"
 zaz_steppe_allies:0 "Steppe Allies"
 zaz_steppe_brotherhood:0 "Steppe Brotherhood"
 zaz_steppe_raiders:0 "Steppe Raiders"
 zaz_steppe_raiders_desc:0 "Zaporozhian Cossacks are renowned for their devastating raids on Crimean, Ottoman, and even Polish territories."
 zaz_strong_otaman:0 "Strong Otaman Leadership"
 zaz_successful_raid:0 "Successful Chaiky Raid"
 zaz_successful_raid_desc:0 "Our raiders have returned with great wealth and glory."
 zaz_successful_raid_effect:0 "Successful Cossack Raid"
 zaz_taxes:0 "Regime of Nomads"
 zaz_threaten_tur:0 "Asserting the Great Khan's Authority Over [TUR.GetName]"
 zaz_threatened_turks:0 "Threatened Turkish Coasts"
 zaz_trade_eff:0 "Maximizing Trade Efficiency between Lublin and Kraków for Economic Growth"
 zaz_tur_buff:0 "Controlling the Bosphorus Strait for Trade Dominance and Strategic Positioning"
 zaz_tur_friend:0 "Aligned with [TUR.GetName] for Mutual Benefits"
 zaz_tur_trade:0 "Implementing Policies of Embargo for Economic Gain"
 zaz_turkish_help:0 "Officers in Ottoman Service for Improved Military Tactics"
 zaz_unchecked_horde:0 "A Powerful Grand Khanate Next Door"
 zaz_united_host:0 "United Host"
 zaz_warrior_brotherhood:0 "Warrior Brotherhood"
 zaz_warrior_brotherhood_desc:0 "All Cossacks are brothers in arms, sharing both dangers and spoils equally according to ancient custom."
 zich_relocated:0 "Sich Relocated"
 zich_relocated_desc:0 "We have successfully moved our capital to a new, more secure location."
