 # Events
 het_enhanced.1.t:0 "The Hetman's Succession"
 het_enhanced.1.d:0 "The Hetmanate must decide whether the office remains elective or passes within a ruling house. The Starshyna favour hereditary succession; many Cossacks hold fast to election by the Rada. Which custom shall govern the Host?"
 het_enhanced.1.a:0 "Let the Rada elect the Hetman."
 het_enhanced.1.b:0 "Let hereditary succession secure the office."
 het_enhanced.1.c:0 "Hereditary rights by the Rada's consent."

 het_enhanced.2.t:0 "The Starshyna's Demands"
 het_enhanced.2.d:0 "The Starshyna's estates and regimental commands have made them a power unto themselves. Their leaders ask the Hetman to secure those privileges by law. If we refuse, their discontent may find a banner of its own."
 het_enhanced.2.a:0 "Confirm the Starshyna's privileges."
 het_enhanced.2.b:0 "The Hetman will not yield to their demands!"

 het_enhanced.3.t:0 "The Two Banks of the Dnieper"
 het_enhanced.3.d:0 "The Hetmanate spans both banks of the Dnieper. The Left Bank lies under Russian influence; Poland contests the Right. The settlement at Andrusovo recognized this division. Shall we rely on one neighbour, or seek to reunite both banks under our authority?"
 het_enhanced.3.a:0 "Stand with the Left Bank and Russia."
 het_enhanced.3.b:0 "Keep both banks under one Hetman."
 het_enhanced.3.c:0 "Seek Polish support on the Right Bank."

 het_enhanced.4.t:0 "Moscow's Candidate"
 het_enhanced.4.d:0 "The tsar's envoys have brought a candidate for the Hetman's office and call their counsel a recommendation. They promise continued favour if the Rada consents; to refuse is to risk Moscow's displeasure. Shall we accept their choice?"
 het_enhanced.4.a:0 "Accept Moscow's candidate."
 het_enhanced.4.b:0 "The Rada will choose its own Hetman."

 het_enhanced.5.t:0 "Mazepa's Choice"
 het_enhanced.5.d:0 "The Great Northern War has brought Charles XII to our frontier. The Swedish king offers a chance to break the tsar's hold, but open defiance may cost Mazepa his lands and the Host its protection. Shall we join the Swedes or remain under the tsar?"
 het_enhanced.5.a:0 "Join Sweden against the tsar."
 het_enhanced.5.b:0 "Remain loyal to our suzerain and secure a charter."

 het_enhanced.6.t:0 "The Little Russian Collegium"
 het_enhanced.6.d:0 "Tsar Peter has established the Little Russian Collegium to oversee the Hetman's administration. Its authority threatens to reduce the Rada and the Hetmanate's remaining rights to ceremony. Will we submit or resist?"
 het_enhanced.6.a:0 "Accept the Collegium."
 het_enhanced.6.b:0 "Defy the tsar's overseers."

 het_enhanced.7.t:0 "Abolition of the Hetmanate"
 het_enhanced.7.d:0 "Catherine II has decreed the abolition of the Hetman's office. Its regiments and administration are to be folded into the Russian Empire. We may accept the decree, take up arms, or bargain for limited local rights."
 het_enhanced.7.a:0 "Accept the decree."
 het_enhanced.7.b:0 "Defend the Hetmanate."
 het_enhanced.7.c:0 "Negotiate for local autonomy."

 het_enhanced.8.t:0 "Cossack Revival Movement"
 het_enhanced.8.d:0 "Having outlasted the threat of abolition, the Hetmanate stands at a crossroads. Shall we restore the old Cossack liberties and frontier order, or adopt Western European court administration and standing regiments?"
 het_enhanced.8.a:0 "Revive ancient Cossack liberties"
 het_enhanced.8.b:0 "Reform along Western court lines"

 # Modifiers
 competitive_hetman_elections:0 "Competitive Hetman Elections"
 desc_competitive_hetman_elections:0 "Elective elections preserve Cossack traditions but create political instability."
 hereditary_hetman_succession:0 "Hereditary Hetman Succession"
