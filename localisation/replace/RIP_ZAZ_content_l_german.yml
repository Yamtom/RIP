 cossack_carry_the_host_crisis_tt:0 "The Host is cornered (at most 4 provinces) and either has lost Zaporozhia, is reduced to 2 or fewer provinces, faces the Sich Crisis, or has suffered a major defeat in war"
 cossack_carry_the_host_desc:0 "The Sich has been moved before, and not by choice: to Oleshky when Muscovy came for it, and beyond the Danube when the empire finished the job. A friendly power holds ground the Host can camp on. We would arrive as guests, and guests are told where to pitch."
 cossack_carry_the_host_leave_old_tt:0 "The Host will move its seat to the refuge province and abandon its old lands behind (retaining cores on them). If the refuge holder is a player, they will be asked to consent first."
 cossack_carry_the_host_title:0 "Carry the Host Away"
 cossack_carry_the_host_tt:0 "A friendly power holds an unoccupied, non-capital steppe or grasslands province fit to camp on - an ally, a subject, or one with at least 100 opinion of us"
