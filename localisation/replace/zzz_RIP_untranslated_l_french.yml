 rip_cossacks_reform:0 "Sich Rada"
 rip_cossacks_reform_desc:0 "Free Cossacks are ruled by a military council presided over by a Hetman."
 rip_galicia.1.a:0 "Consolidate the Frontier Crown"
 rip_galicia.1.b:0 "Ratify the Halych Compact"
 rip_galicia.1.d:0 "With Red Ruthenia and Volhynia secured, Galicia must be ordered anew. Shall the realm bind the marches to a stronger frontier crown, or ratify a compact of estates centered on Halych?"
 rip_galicia.1.t:0 "The Galician Settlement"
 rip_galicia.2.a:0 "Codify the Halych Synod"
 rip_galicia.2.b:0 "Guarantee the Brotherhoods"
 rip_galicia.2.d:0 "Bishops, brotherhoods, and town elders demand a durable religious settlement. We may codify a synod of union, or guarantee the Orthodox brotherhoods as pillars of the realm."
 rip_galicia.2.t:0 "Confessional Settlement in Galicia"
 rip_galicia.3.a:0 "Promulgate the Statutes of Danylo"
 rip_galicia.3.b:0 "Entrust the Crown to the Host"
 rip_galicia.3.d:0 "Jurists in Lviv now press for a lasting order. We may proclaim a common statute that binds crown, estates, and towns, or entrust reform to a disciplined frontier court."
 rip_galicia.3.t:0 "The Statutes of Galicia"
 rip_galicia_carpathian_shield:0 "Frontier Crown"
 rip_galicia_constitution:0 "Statutes of Danylo"
 rip_galicia_crown_and_sabre:0 "Crown and Host"
 rip_galicia_halych_sejm:0 "Halych Compact"
 rip_galicia_orthodox_bastion:0 "Brotherhood Bastion"
 rip_galicia_sejm_uniate:0 "Synodal Compact"
 rip_galicia_uniate_synod:0 "Halych Synod"
 rip_hidden_sync_event.a:0 "Continue"
 rip_hidden_sync_event.d:0 "Internal maintenance event."
 rip_hidden_sync_event.t:0 "Hidden Synchronization Event"
 rip_jewish.1.a:0 "Guarantee their charters and safety"
 rip_jewish.1.b:0 "Restrict their activity"
 rip_jewish.1.d:0 "Communities of Jewish merchants and financiers seek safe haven under our protection. Granting charters could invigorate trade and supply much-needed credit, but risks backlash from conservative clergy and guilds."
 rip_jewish.1.t:0 "Invite Jewish Merchants"
 rip_jewish_invite_accept:0 "Guarantee their charters and safety"
 rip_jewish_invite_desc:0 "Communities of Jewish merchants and financiers seek safe haven under our protection. Granting charters could invigorate trade and supply much-needed credit, but risks backlash from conservative clergy and guilds."
 rip_jewish_invite_restrict:0 "Restrict their activity"
 rip_jewish_invite_title:0 "Invite Jewish Merchants"
 rip_republic_mechanic:0 "Republic"
 rip_republic_mechanic_desc:0 ""
 rip_vol_alt_history.1.a:0 "Form the Carpathian Federation"
 rip_vol_alt_history.1.b:0 "Maintain Sovereign Alliance"
 rip_vol_alt_history.1.d:0 "Our alliance with Galicia has blossomed into something deeper - a genuine brotherhood of Ruthenian realms. Now stands the question: do we forge an indissoluble Carpathian Federation, or remain sovereign allies?"
 rip_vol_alt_history.1.t:0 "The Eastern Partnership Formed"
 rip_vol_alt_history.2.a:0 "Accept Grand Ruthenia's Mantle"
 rip_vol_alt_history.2.b:0 "Remain a Regional Hegemon"
 rip_vol_alt_history.2.d:0 "With Lithuania, Samogitia, and the Dniepr lands under our sway, we command the entire Ruthenian heartland and the northern territories. The age of Volhynia as a junior power has passed - we stand as Grand Ruthenia, equal among kingdoms."
 rip_vol_alt_history.2.t:0 "Grand Ruthenia Proclaimed"
 rip_vol_alt_history.3.a:0 "Orthodox Foundation"
 rip_vol_alt_history.3.b:0 "Uniate Synthesis"
 rip_vol_alt_history.3.c:0 "Pluralist Balance"
 rip_vol_alt_history.3.d:0 "With Galicia's confessional choice now apparent, we must determine the religious foundation of our realm. Will we anchor to Orthodox tradition, embrace Uniate synthesis, or walk a pluralist path?"
 rip_vol_alt_history.3.t:0 "The Synod of Confessional Balance"
 rip_vol_alt_history.4.a:0 "Estate Compact"
 rip_vol_alt_history.4.b:0 "Frontier Chancery"
 rip_vol_alt_history.4.c:0 "Cossack Liberties"
 rip_vol_alt_history.4.d:0 "The realm has grown in strength and complexity. Now we must decide: will we ratify an estate compact, strengthen the frontier chancery through voivodeship councils, or allow Cossack customs of the Rada to flourish?"
 rip_vol_alt_history.4.t:0 "The Constitutional Assembly"
 rip_vol_alt_history.5.a:0 "Form the Carpathian Union"
 rip_vol_alt_history.5.b:0 "Remain as Allies"
 rip_vol_alt_history.5.d:0 "Galicia's path has been chosen, and our alliance stands as strong as ever. Now a historic opportunity presents itself: the formal union of our crowns under the Carpathian banner, creating a federation that rivals the great powers of Europe."
 rip_vol_alt_history.5.t:0 "The Carpathian Union"
 rip_vol_alt_history.6.a:0 "Empower the Voivodes"
 rip_vol_alt_history.6.b:0 "Centralize Monarchical Power"
 rip_vol_alt_history.6.c:0 "Allow Cossack Uprising"
 rip_vol_alt_history.6.d:0 "Our Voivode Assemblies have grown powerful. Whispers suggest the voivodes plot to constrain the monarch, or that we should strengthen the crown's hand over the assembly. How shall we balance these forces?"
 rip_vol_alt_history.6.t:0 "The Voivode Succession"
 rip_vol_alt_history.7.a:0 "Proclaim Grand Duchess Authority"
 rip_vol_alt_history.7.b:0 "Support Elective Principles"
 rip_vol_alt_history.7.d:0 "We rule over vast Ruthenian lands and northern territories. Some whisper we should take the title of Grand Duchess and rule as sovereigns equal to any. Others counsel moderation, embracing elective principles to avoid tyranny."
 rip_vol_alt_history.7.t:0 "Grand Ruthenia's Grand Duchess"
 rip_vol_alt_history.8.a:0 "Orthodox Consolidation"
 rip_vol_alt_history.8.b:0 "Protect Uniate Autonomy"
 rip_vol_alt_history.8.c:0 "Tolerance Edict"
 rip_vol_alt_history.8.d:0 "Our realm is beginning to splinter along confessional lines. The Synod of Ruthenia must convene and settle whether Orthodox consolidation, Uniate autonomy, or continued tolerance will define our spiritual character."
 rip_vol_alt_history.8.t:0 "The Confessional Crisis"
 rip_vol_restored_ruthenia_country:0 "Restored Ruthenia"
 rip_vol_restored_ruthenia_country_desc:0 "A restored Ruthenian state unites its historic lands under durable institutions and strengthens its cultural cohesion."
 rip_vol_restored_ruthenia_province:0 "Restored Ruthenia"
 rip_vol_restored_ruthenia_province_desc:0 "Local institutions are being integrated into the restored Ruthenian realm."
 river_flotilla:0 "River Flotilla"
 river_flotilla_desc:0 "Turov's shallow-draft river boats can transport troops and raid enemy positions throughout the marshlands. This mobility is a decisive military advantage."
 river_flotilla_tactics:0 "River Flotilla Tactics"
 river_flotilla_tactics_desc:0 "Our shallow-draft boats can navigate waters impassable to foreign vessels. This mobility allows us to raid, smuggle, and transport troops through terrain that cavalry cannot cross."
 river_networks:0 "River Networks"
 river_networks_desc:0 "The Dvina, Pripyat, Nioman, and Sozh create an interconnected river system. Internal commerce and external trade connections flourish."
 rozumovsky:0 "Rozumovsky"
 ruina_cossack_mobilization:0 "Cossack Mobilization"
 ruina_diplomatic_settlement:0 "Diplomatic Settlement"
 ruina_events.1.a:0 "Fortify our heartland!"
 ruina_events.1.b:0 "Seek protection from a powerful neighbor"
 ruina_events.1.c:0 "Rally the Cossack Host!"
 ruina_events.1.d:0 "The death of the great hetman has plunged our lands into chaos. Rival candidates backed by foreign powers tear at the fabric of our state, while armies march across devastated provinces. This is the beginning of what will be remembered as 'The Ruin.'"
 ruina_events.1.t:0 "The Ruina Begins"
 ruina_events.2.a:0 "Begin reconstruction"
 ruina_events.2.b:0 "Our veterans are hardened by war"
 ruina_events.2.c:0 "Secure peace through diplomacy"
 ruina_events.2.d:0 "After years of devastation, stability has finally returned to our lands. The cost was terrible - provinces lie in ruins, our population has fled, and foreign powers dictate terms - but we survived."
 ruina_events.2.t:0 "The Ruina Ends"
 ruina_events.3.a:0 "Crush the pretender!"
 ruina_events.3.b:0 "Negotiate a compromise"
 ruina_events.3.c:0 "Let them fight it out"
 ruina_events.3.d:0 "A rival hetman has emerged, claiming legitimacy and gathering supporters. Civil war threatens to tear us apart further."
 ruina_events.3.t:0 "Pretender Hetman Arises"
 ruina_events.4.a:0 "Resist with all our might!"
 ruina_events.4.b:0 "Accept vassalage"
 ruina_events.4.c:0 "Pay tribute to avoid invasion"
 ruina_events.4.d:0 "A neighboring power has decided to intervene in our internal crisis, either to impose their candidate or to vassalize us entirely."
 ruina_events.4.t:0 "Foreign Intervention"
 ruina_events.5.a:0 "Send relief"
 ruina_events.5.b:0 "They must fend for themselves"
 ruina_events.5.d:0 "One of our provinces has been ravaged by the constant warfare. Villages burn, fields lie fallow, and the population flees."
 ruina_events.5.t:0 "Province Devastated"
 ruina_foreign_protectorate:0 "Foreign Protectorate"
 ruina_fortified_heartland:0 "Fortified Heartland"
 ruina_hardened_veterans:0 "Hardened Veterans"
 ruina_reconstruction:0 "Post-Ruina Reconstruction"
 ruina_recovery_south:0 "Frontier Recovery"
 rus_abolished_sich:0 "Abolished the Zaporozhian Sich"
 rus_cossack_autonomy_granted:0 "Russian Autonomy Granted"
 rus_cossack_autonomy_granted_desc:0 "The Russian Tsar has guaranteed our traditional freedoms."
 rus_cossack_service:0 "Cossack Military Service"
 rus_hetmanate_client:0 "Hetmanate Client State"
 rus_nation_desc:0 "Unite the lands of Kyivan Rus under a single, strong ruler and create a centralized state. This will require significant effort, but it will also bring great rewards."
 rus_nation_title:0 "Centralize Kyivan Rus"
 russian_backed_hetman:0 "Russian-Backed Hetman"
 russian_colonial_administration:0 "Russian Colonial Administration"
 russian_monastery_established:0 "Russian Monastery Established"
 russian_orthodox:0 "Russian Orthodox"
 russian_orthodox.1.a:0 "Moscow is the Third Rome!"
 russian_orthodox.1.b:0 "We remain traditional Orthodox"
 russian_orthodox.1.d:0 "Constantinople has fallen to the Ottomans. The Second Rome is no more. Many Orthodox believers look to Moscow as the last bastion of true faith. Monk Philotheus proclaims: 'Two Romes have fallen, but the third stands, and a fourth there shall not be.' Should we embrace this destiny?"
 russian_orthodox.1.t:0 "The Fall of Constantinople and Third Rome"
 russian_orthodox.10.a:0 "Restore Orthodox Constantinople"
 russian_orthodox.10.b:0 "Practice religious tolerance"
 russian_orthodox.10.d:0 "Incredible! We have conquered Constantinople, the Second Rome! This historic achievement fulfills our destiny as Third Rome. Shall we restore Orthodox rule to this ancient city and make it a jewel of our empire?"
 russian_orthodox.10.t:0 "The Conquest of Constantinople!"
 russian_orthodox.11.a:0 "Establish Imperial Church"
 russian_orthodox.11.b:0 "Maintain traditional structure"
 russian_orthodox.11.d:0 "Our empire has grown mighty. The Orthodox Church should be reorganized as an imperial institution, serving the state's interests while spreading true faith. This would create unprecedented unity of purpose."
 russian_orthodox.11.t:0 "Imperial Orthodox Church"
 russian_orthodox.12.a:0 "Establish missions and monasteries"
 russian_orthodox.12.b:0 "Focus resources elsewhere"
 russian_orthodox.12.d:0 "Orthodox missionaries have achieved remarkable success converting pagan peoples in Siberia. The true faith spreads eastward as Russian power expands. Shall we establish permanent missions to consolidate these gains?"
 russian_orthodox.12.t:0 "Missionary Success in Siberia"
 russian_orthodox.13.a:0 "Accept the sacred duty"
 russian_orthodox.13.b:0 "Remain modest"
 russian_orthodox.13.d:0 "Orthodox Christians throughout the world look to us as their defender and protector. We have become the bulwark of true faith against heresy and heathenism. Shall we formally accept this sacred responsibility?"
 russian_orthodox.13.t:0 "Defender of Orthodoxy"
 russian_orthodox.14.a:0 "Proclaim Patriarch of All Rus'"
 russian_orthodox.14.b:0 "Decline the honor"
 russian_orthodox.14.d:0 "With our empire's expansion, our Patriarch should be recognized as Patriarch of All Rus' - spiritual leader of all Russian Orthodox peoples. This would formalize our religious supremacy."
 russian_orthodox.14.t:0 "Patriarch of All Rus'"
 russian_orthodox.15.a:0 "Suppress the resistance"
 russian_orthodox.15.b:0 "Grant cultural concessions"
 russian_orthodox.15.d:0 "Local peoples resist our Russification efforts. They cling to their language, customs, and custom, viewing Russian culture as foreign oppression. This threatens our empire's unity."
 russian_orthodox.15.t:0 "Cultural Resistance Movement"
 russian_orthodox.2.a:0 "Establish the Moscow Patriarchate"
 russian_orthodox.2.b:0 "Wait for a better time"
 russian_orthodox.2.d:0 "The time has come to establish an independent Patriarchate in Moscow. No longer shall we defer to Constantinople. The Russian Orthodox Church will stand equal to the ancient patriarchates, with Moscow as its head."
 russian_orthodox.2.t:0 "Establishment of Moscow Patriarchate"
 russian_orthodox.3.a:0 "Force immediate conversion"
 russian_orthodox.3.b:0 "Establish Orthodox missions"
 russian_orthodox.3.c:0 "Allow religious freedom for now"
 russian_orthodox.3.d:0 "Our armies have conquered new territory inhabited by non-Orthodox peoples. How shall we bring them into the fold of true faith? Forced conversion would be swift but cause unrest. Missionary work takes time but is more peaceful."
 russian_orthodox.3.t:0 "Newly Conquered Province"
 russian_orthodox.4.a:0 "Launch aggressive Russification"
 russian_orthodox.4.b:0 "Gradual cultural integration"
 russian_orthodox.4.c:0 "Respect local cultures"
 russian_orthodox.4.d:0 "Our empire contains many non-Russian peoples. For true unity, they must adopt Russian language, customs, and custom. Shall we launch an aggressive Russification campaign, or pursue gradual cultural integration?"
 russian_orthodox.4.t:0 "Russification Campaign"
 russian_orthodox.5.a:0 "Establish the Inquisition"
 russian_orthodox.5.b:0 "Moderate persecution only"
 russian_orthodox.5.c:0 "Maintain religious tolerance"
 russian_orthodox.5.d:0 "Heresy spreads in our realm. Some propose establishing an Orthodox Inquisition - courts with authority to investigate, judge, and punish heretics. This would enforce religious uniformity but cause fear and unrest."
 russian_orthodox.5.t:0 "Establish Orthodox Inquisition"
 russian_orthodox.6.a:0 "Suppress Old Believers harshly"
 russian_orthodox.6.b:0 "Allow them to practice in secret"
 russian_orthodox.6.c:0 "Seek compromise"
 russian_orthodox.6.d:0 "Patriarch Nikon's liturgical reforms have caused a great schism. The Old Believers reject changes to traditional rites and books. They view the reforms as heresy and corruption of true Orthodoxy. How shall we respond to this challenge?"
 russian_orthodox.6.t:0 "The Raskol - Old Believer Schism"
 russian_orthodox.7.a:0 "Force conversion to Orthodoxy"
 russian_orthodox.7.b:0 "Build Orthodox missions"
 russian_orthodox.7.c:0 "Practice religious tolerance"
 russian_orthodox.7.d:0 "We have conquered Kazan, the Tatar Muslim stronghold. This historic victory opens the way to the East. Shall we forcibly convert the Muslims, establish Orthodox missions, or practice tolerance?"
 russian_orthodox.7.t:0 "Conquest of Kazan"
 russian_orthodox.8.a:0 "Unite all Russian lands"
 russian_orthodox.8.b:0 "Pursue peaceful expansion"
 russian_orthodox.8.d:0 "Russian lands remain divided among petty princes. As successors to Kievan Rus', we have the right and duty to unite all Russian territories under our rule. Shall we pursue this historic mission?"
 russian_orthodox.8.t:0 "Gathering of Russian Lands"
 russian_orthodox.9.a:0 "Establish Symphonia"
 russian_orthodox.9.b:0 "Maintain separation"
 russian_orthodox.9.d:0 "The Byzantine ideal of Symphonia - harmonious unity of church and state - can be achieved in our empire. The Patriarch and Tsar working together can create a truly Orthodox state. Shall we formalize this arrangement?"
 russian_orthodox.9.t:0 "Symphonia of Powers"
 russian_orthodox_religion_desc:0 "The Russian Orthodox Church, centered in Moscow, proclaims itself as the Third Rome - successor to fallen Constantinople and protector of true Orthodox faith. Under the Moscow Patriarchate, this aggressive variant of Orthodoxy emphasizes Russian imperial expansion, cultural assimilation, and religious uniformity."
 russian_protection:0 "Russian Protection"
 russian_protection_desc:0 "Russian garrisons and administrators oversee the province, providing security while eroding local autonomy."
 russian_settlement:0 "Russian Settlement"
 russian_supervision:0 "§RRussian Collegium monitors all hetman decisions§!"
 russification_campaign_decision_desc:0 "We can systematically Russify non-Russian peoples in our empire."
 russification_campaign_decision_title:0 "Launch Russification Campaign"
 russify_province_decision_desc:0 "We can forcibly Russify this province, converting its culture to Russian."
 russify_province_decision_title:0 "Russify Province"
 rusyn:0 "Rusyn"
 rusyn_new:0 "Rusyn"
 rusyn_new_new:0 "Carpathian"
 rusyn_new_new_adj:0 "Carpathian"
 ruth_instituties.1:0 "The First Move"
 ruth_instituties.1a:0 "Revival in the Ruthenian"
 ruth_instituties.1d:0 "The Renaissance is already raging throughout Europe. The Ruthenian people will not remain silent, and all scientists and philosophers will consider the wiki to be the embodiment of human thought."
 ruth_instituties.1t:0 "The First Move"
 ruth_instituties.2:0 "Initial Attack"
 ruth_instituties.2a:0 "Ruthenian Reading"
 ruth_instituties.2d:0 "The first Ruthenian printing house was founded in Ostroh Academy. Ivan Fedorovych has already translated the Holy Scriptures into the Ruthenian language, as well as the 'Bukvar'. This will increase the number of literate Ruthenians by a hundred."
 ruth_instituties.2t:0 "Initial Attack"
 ruthenian_convene_court_desc:0 "Summon princes, boyars, and hetmans to set the course of our factional empire."
 ruthenian_convene_court_title:0 "Convene the Ruthenian Court"
 ruthenian_court_crisis:0 "Ruthenian Court Crisis"
 ruthenian_court_crisis_desc:0 "Factional rivalries paralyze governance as princes, boyars, and hetmans contest the court."
 ruthenian_decadence.1.a:0 "The court continues"
 ruthenian_decadence.1.d:0 "Factional rivalry shapes the realm's stability. Our actions this year will either deepen courtly decay or restore discipline."
 ruthenian_decadence.1.t:0 "Ruthenian Decadence"
 ruthenian_decadence.2.a:0 "Purge the court"
 ruthenian_decadence.2.b:0 "Buy their loyalty"
 ruthenian_decadence.2.d:0 "Decadence has peaked and the court is paralyzed. We must act decisively or pay for appeasement."
 ruthenian_decadence.2.t:0 "The Court in Crisis"
 ruthenian_eastward.1.a:0 "Organize the frontier host"
 ruthenian_eastward.1.b:0 "License the steppe trade"
 ruthenian_eastward.1.d:0 "The frontier captains press for a clear mandate: open the steppe to settlement and secure the routes with fort lines and patrols."
 ruthenian_eastward.1.t:0 "The Eastern Mandate"
 ruthenian_eastward.2.a:0 "Raise the Ural line"
 ruthenian_eastward.2.b:0 "Seed the trade posts"
 ruthenian_eastward.2.d:0 "Scouts return from the eastern ridges with maps and warnings. The Ural gate can be held by walls or opened by trade."
 ruthenian_eastward.2.t:0 "The Ural Gate"
 ruthenian_eastward.3.a:0 "March the wardens east"
 ruthenian_eastward.3.b:0 "Charter frontier companies"
 ruthenian_eastward.3.d:0 "Beyond the long forests lies a new frontier. Some call for wardens and garrisons, others for chartered companies."
 ruthenian_eastward.3.t:0 "The Manchurian Horizon"
 ruthenian_eastward.4.a:0 "Unleash raiding columns"
 ruthenian_eastward.4.b:0 "License frontier patrols"
 ruthenian_eastward.4.d:0 "Our commanders argue that one rigid fort line cannot police the open steppe. We can either rely on hard-hitting raid columns or institutional patrol contracts with frontier communities."
 ruthenian_eastward.4.t:0 "Doctrine of the Steppe Raids"
 ruthenian_eastward.5.a:0 "Open steppe corridors"
 ruthenian_eastward.5.b:0 "Raise a forward fort chain"
 ruthenian_eastward.5.d:0 "The frontier council warns that isolated forts can be bypassed or starved if movement corridors are ignored. We must choose between mobility corridors and a denser chain of fortified nodes."
 ruthenian_eastward.5.t:0 "Beyond a Single Fort"
 ruthenian_eastward_frontier_policy_desc:0 "Commit the frontier realm to an eastern policy, chartering patrols and settlement corridors toward the steppe."
 ruthenian_eastward_frontier_policy_title:0 "Ruthenian Eastern Mandate"
 ruthenian_eastward_mandate:0 "Eastern Mandate"
 ruthenian_factional_empire_boyars_hetmans_reform:0 "Ruthenian Factional Empire"
 ruthenian_factional_empire_boyars_hetmans_reform_desc:0 "A court-state where Boyary and Hetmany dominate while Knyazi are temporarily sidelined."
 ruthenian_factional_empire_princes_hetmans_reform:0 "Ruthenian Factional Empire"
 ruthenian_factional_empire_princes_hetmans_reform_desc:0 "A court-state where Knyazi and Hetmany dominate while Boyary are temporarily sidelined."
 ruthenian_factional_empire_reform:0 "Ruthenian Factional Empire"
 ruthenian_factional_empire_reform_desc:0 "A court-state where three elites compete: Knyazi, Boyary, and Hetmany. Exactly two factions dominate at any given time; the third can break into power if its influence rises high enough."
 ruthenian_factional_influence_sources_tt:0 "Influence sources: Knyazi (Legitimacy, Diplomacy, Subjects), Boyary (Stability, Autonomy, Administration), Hetmany (Army Tradition, Manpower, War Pressure)."
 ruthenian_factional_pair_system_tt:0 "Two factions dominate at all times. The third can break into the dominant pair once its influence rises enough."
 ruthenian_factions.1.a:0 "Empower the Princes"
 ruthenian_factions.1.b:0 "Side with the Boyars"
 ruthenian_factions.1.c:0 "Raise the Hetmans"
 ruthenian_factions.1.d:0 "Princes, boyars, and hetmans contend for influence. We must decide which faction will guide the realm for the coming years."
 ruthenian_factions.1.t:0 "The Ruthenian Court"
 ruthenian_factions.2.a:0 "Let the courtiers decide."
 ruthenian_factions.20.a:0 "Noted."
 ruthenian_factions.20.d:0 "Court factions have shifted influence and the dominant coalition has been recalculated."
 ruthenian_factions.20.t:0 "The Court Rebalances"
 ruthenian_forward_fort_chain_mod:0 "Forward Fort Chain"
 ruthenian_frontier_mobility_network_desc:0 "Build relay stations and corridor tracks to keep armies moving across the steppe despite sparse fort lines."
 ruthenian_frontier_mobility_network_mod:0 "Frontier Mobility Network"
 ruthenian_frontier_mobility_network_title:0 "Frontier Mobility Network"
 ruthenian_frontier_organizers:0 "Frontier Organizers"
 ruthenian_frontier_patrol_licenses:0 "Frontier Patrol Licenses"
 ruthenian_frontier_waystations_mod:0 "Frontier Waystations"
 ruthenian_independence_accepted:0 "Accepted Ruthenian Independence"
 ruthenian_line_fort_node_mod:0 "Fort Line Node"
 ruthenian_manchurian_companies:0 "Manchurian Companies"
 ruthenian_manchurian_horizon_desc:0 "Send frontier wardens and chartered traders toward the forests and plains of Manchuria."
 ruthenian_manchurian_horizon_title:0 "Pursue the Manchurian Horizon"
 ruthenian_manchurian_push:0 "Manchurian Push"
 ruthenian_manchurian_wardens:0 "Manchurian Wardens"
 ruthenian_open_steppe_corridors_mod:0 "Open Steppe Corridors"
 ruthenian_open_ural_gate_desc:0 "Organize caravans and garrisons for the long march beyond the Ural ridges."
 ruthenian_open_ural_gate_title:0 "Open the Ural Gate"
 ruthenian_principality:0 "Ruthenian Principality"
 ruthenian_principality_desc:0 "Ruthenians favor a less repressive society, as they have never been an autocracy like the Muscovites above."
 ruthenian_principality_reform:0 "Ruthenian Principality"
 ruthenian_principality_reform_desc:0 "Ruthenians have never been quite as authoritarian as the muscovites above, and thus favor a less oppressive system."
 ruthenian_raiding_columns:0 "Raiding Columns"
 ruthenian_steppe_corridor_doctrine_mod:0 "Steppe Corridor Doctrine"
 ruthenian_steppe_raid_doctrine_desc:0 "Codify fast cavalry columns, deep reconnaissance, and punitive raids in the Pontic marches."
 ruthenian_steppe_raid_doctrine_mod:0 "Steppe Raid Doctrine"
 ruthenian_steppe_raid_doctrine_title:0 "Adopt Steppe Raid Doctrine"
 ruthenian_steppe_trade_licenses:0 "Steppe Trade Licenses"
 ruthenian_ural_fortified_line:0 "Ural Fortified Line"
 ruthenian_ural_gate:0 "Ural Gate Opened"
 ruthenian_ural_trade_posts:0 "Ural Trade Posts"
 sables_fields:0 "Sables and fields"
 sables_fields_desc:0 "Ruthenian society is a fusion of farmers and warriors. This feature made it easier to recruit individuals for army service and to team them up."
 sacred_dialog_reform:0 "Sacred Council"
 sacred_dialog_reform_desc:0 "The leaders of this republic claim that they are chosen by God to represent the interests of the Cossack and Ruthenian people."
 sacred_regulation_reform:0 "Sacred Law"
 sacred_regulation_reform_desc:0 "The monarch's law is sanctioned by God and only God. As a result, the monarch's will is the lord's will."
 salt_fish_trade:0 "Salt and Fish Trade"
 salt_state_monopoly:0 "Salt State Monopoly"
 salt_state_monopoly_desc:0 "The state controls all salt trade and production."
 seek_orthodox_reconciliation_decision_desc:0 "We can pursue dialogue with Orthodox neighbors, seeking mutual understanding despite our different paths."
