 HET_REGIMENT_FORMING:0 "Forming Regiments"
 HET_REGIMENT_SYSTEM:0 "Regimental System"
 HET_all_under_the_zaoporzhian_host:0 "All Under the Zaporozhian Host"
 HET_all_under_the_zaoporzhian_host_desc:0 "The Zaporozhian Host unites our people under one banner, reducing unrest throughout our lands."
 HET_all_under_the_zaporozhian_host:0 "The Host is in Command"
 HET_all_under_the_zaporozhian_host_desc:0 "The Zaporozhian Host, guided by the Sich Rada, rules the Hetmanate with a firm hand. Led by the Kish Otaman and supported by seasoned warriors, the system ensures that leadership remains in the hands of the most proven and respected men."
 HET_baturyn_arsenal:0 "Baturyn Arsenal"
 HET_baturyn_arsenal_desc:0 "The hetman's capital at Baturyn houses workshops and arsenals producing modern artillery and fortifications."
 HET_black_sea_trade_desc:0 "The black earth yields more grain than the Host can eat and the river carries it to the sea. Contracts with the Ottoman and Genoese factors put hard coin in the treasury, and tie our harvest to a market the Porte controls."
 HET_black_sea_trade_title:0 "Black Sea Commerce"
 HET_collegium_tradition:0 "Collegium Tradition"
 HET_collegium_tradition_desc:0 "Kyiv-Mohyla Collegium and other educational institutions spread learning throughout the Hetmanate."
 HET_cossack_infantry_supremacy:0 "Infantry Supremacy"
 HET_cossack_infantry_supremacy_desc:0 "The Hetmanate has evolved beyond pure cavalry warfare, embracing firearms and artillery as vital components of our military might. By mastering these modern tactics, we ensure the supremacy of our infantry over traditional mounted foes."
 HET_establish_capital_desc:0 "A Host that keeps a chancery, an archive and a treasury needs walls to keep them behind. Kyiv carries the metropolitan see, Chyhyryn the hetman's own estates. Whichever is chosen, the Rada will meet less often once the clerks are housed."
 HET_establish_capital_title:0 "The Hetman's Capital"
 HET_exiles_and_freedom_seekers:0 "No Longer Exiled"
 HET_exiles_and_freedom_seekers_desc:0 "The Hetmanate's lands are distinct from those of the Holy Roman Empire, Russia, or Ottoman Empire. As a result, many exiles and freedom seekers flock to our country, and we can use our ties in other countries to bolster our own numbers and undermine our rivals."
 HET_final_hetman_desc:0 "The last hetman signs in French, visits his regiments seldom, and asks that the office be made hereditary in his house. The request will be answered by abolishing the office."
 HET_final_hetman_title:0 "Rozumovsky - Last of the Hetmans"
 HET_foreign_alliance_politics:0 "Alliance Politics"
 HET_foreign_alliance_politics_desc:0 "The Hetmanate must carefully navigate between Poland, Muscovy, and other powers to maintain autonomy."
 HET_hetman_authority:0 "Hetman Authority"
 HET_hetman_authority_desc:0 "The hetman's power derives from both Cossack tradition and state-building necessity, creating a unique blend of elected autocracy."
 HET_ideas:0 "Hetmanate's Ideas"
 HET_ideas_bonus:0 "Hetmanate's Ambitions"
 HET_ideas_start:0 "Hetmanate's Traditions"
 HET_kleinody:0 "Kleinody!"
 HET_kleinody_desc:0 "The Kleinody, a type of imperial regalia, are prestigious objects for the Zaporozhian Host, and only a few ever obtain them. Holding a Kleinody grants an officer status, with different ranks for different types. The most prestigious is the 'bulawa', or mace carried by the Kish. The longer we keep these heirlooms of the past, the more prestigious we will be in the eyes of future generations and foreigners."
 HET_kyiv_academy_desc:0 "Metropolitan Mohyla's academy teaches theology in Greek and Latin both, and its graduates fill the chancery as readily as the pulpit. Under our protection it draws students from Moldavia to Muscovy, and answers the Latin colleges in their own tongue. A realm is held by its scribes no less than by its sabres."
 HET_kyiv_academy_title:0 "The Kyiv-Mohyla Academy"
 HET_left_bank_settlers:0 "Left-Bank Settlers"
 HET_left_bank_settlers_desc:0 "Refugees and colonists settle the Left Bank of the Dnieper, providing both manpower and agricultural development."
 HET_mazepa_reform_desc:0 "The hetman endows churches in the new manner, keeps a Latin secretary and a court that would not shame Warsaw. Baroque masonry rises over the Dnieper, and the starshyna who pay for it expect their estates confirmed in return."
 HET_mazepa_reform_title:0 "Mazepa's Renaissance"
 HET_poltava_choice_desc:0 "The armies close near Poltava, Swedish foot against Russian works and three times their guns. Our regiments must be committed before the first volley, and there will be no second choosing."
 HET_poltava_choice_title:0 "The Battle of Poltava"
 HET_printing_press_desc:0 "Presses at Kyiv and Chernihiv would set the liturgy, the chronicles and the regimental statutes in Church Slavonic, and end our dependence on Lviv and Vilnius for books. What a press prints, a censor elsewhere cannot easily unprint."
 HET_printing_press_title:0 "The Printing Press"
 HET_registered_cossacks:0 "Registered Cossacks"
 HET_registered_cossacks_desc:0 "The registered Cossack regiments form the core of our infantry, combining discipline with Cossack fighting spirit."
 HET_russian_repression_desc:0 "Chortomlyk is burned, residents are installed in the chancery, and the register is kept in Moscow now. Colonels are appointed rather than elected. The forms of the Hetmanate remain, and are read aloud at each new appointment."
 HET_russian_repression_title:0 "After Poltava"
 HET_sich_destruction_desc:0 "Regiments of the line surround the palisade and the guns are laid before terms are offered. The Kosh Otaman goes north under escort to a monastery cell. The lands are surveyed for settlement before the year is out."
 HET_sich_destruction_title:0 "Destruction of the Sich - 1775"
 HET_starshyna_administration:0 "Starshyna Administration"
 HET_starshyna_administration_desc:0 "The starshyna officer class forms the administrative backbone of the Hetmanate, managing provinces and providing military leadership."
 HET_starshyna_system_desc:0 "The colonels hold their regiments as districts, judge within them and grant land in them. Within a generation the starshyna will be a nobility in all but the armorial, and will ask for that too."
 HET_starshyna_system_title:0 "The Starshyna Elite"
 HET_swedish_alliance_desc:0 "The Swedish king marches east with the finest army in Europe and offers a written guarantee of Cossack liberties. The Tsar's forces stand between him and us. A guarantee is worth what the guarantor's next battle makes it worth."
 HET_swedish_alliance_title:0 "The Swedish Gambit"
 HET_the_kish_the_sich_rada_and_military_court:0 "The Kish and the Sich Rada"
 HET_the_kish_the_sich_rada_and_military_court_desc:0 "The Kish, or Zaporozhian Host, and the Sich Rada not only govern the Hetmanate, but also serve as its premier military force. The Sich Rada is composed entirely of cossacks, and any cossack, regardless of origin, can vote. This encourages a military tradition that transcends class barriers."
 HET_the_price_we_set_for_service:0 "Peak Performance at a Premium Price"
 HET_the_price_we_set_for_service_desc:0 "Our martial prowess has drawn the attention of both European and Muslim realms, eager to hire our regiments for their own campaigns. By formalizing mercenary service within the Hetmanate, we can turn the skills of our warriors into a lucrative enterprise."
 HET_toward_all_of_ruthenia:0 "Rus' for the Ruthenians!"
 HET_toward_all_of_ruthenia_desc:0 "Despite the Poles' and Russians' best efforts to subjugate our fertile homeland, we will resist them at every turn! We are willing to pay any price, in cash or blood, to ensure that Rus' is governed by its own people, rather than by distant foreign powers in Moscow, Kraków, or Vilnius."
 HIGH_PRINCE:0 "High Kniaz"
 HIGH_PRINCESS:0 "High Kniaghinia"
 HIGH_VOIVODE:0 "High Voivode"
 HIGH_VOIVODESSA:0 "High Voivodessa"
 HLC:0 "Halych"
 HLC_ADJ:0 "Halycian"
 HLC_austrian_bureaucracy_reform:0 "Crown Chancery Cadre"
 HLC_austrian_bureaucracy_reform_desc:0 "Merit-trained clerks, surveyors, and judges extend a disciplined Ruthenian administration across the marches."
 HLC_cavalry_west_n_east:0 "Cavalry from the West and the East"
 HLC_cavalry_west_n_east_desc:0 "Because of our unique position, we can employ a novel tactic, such as a mix of Polish-like and Nomad-like cavalry. As a result, the cavalry will be balanced, with advantages against all opponents."
 HLC_centralized_voivodeship_reform:0 "Frontier Chancery"
 HLC_centralized_voivodeship_reform_desc:0 "A centralized frontier chancery standardizes taxation, justice, and garrison rule across Galicia."
 HLC_confessional_dualism_reform:0 "Confessional Dualism"
 HLC_confessional_dualism_reform_desc:0 "Galicia formalizes a settlement between Orthodox and Uniate institutions, turning confessional tension into provincial law."
 HLC_crown_and_sejm_reform:0 "Crown and Sejm Statutes"
 HLC_crown_and_sejm_reform_desc:0 "Crown and estates ratify a common statute that balances prerogative, law, and provincial consent."
 HLC_crown_authority_reform:0 "Frontier Crown Authority"
 HLC_crown_authority_reform_desc:0 "The crown claims direct authority over key offices, revenues, and military obligations in the marches."
 HLC_enlightened_monarchy_reform:0 "Ruthenian Enlightenment Court"
 HLC_enlightened_monarchy_reform_desc:0 "Law, schooling, and administration are rationalized through a court culture rooted in Ruthenian service and learning."
 HLC_europe_relative:0 "European Relative"
 HLC_europe_relative_desc:0 "As you may know, various European dynasties have held this title, and all of them had a family relationship with Europe's noble houses. This tradition must continue."
 HLC_galician_sejm_reform:0 "Halych Sejm Assembly"
 HLC_galician_sejm_reform_desc:0 "Galician estates and towns convene in a formal sejm that anchors provincial governance in consent and law."
 HLC_galician_voivodeship_reform:0 "Galician Voivodeship"
 HLC_galician_voivodeship_reform_desc:0 "A frontier voivodeship balances Ruthenian customary law, magnate privilege, and royal authority while binding Galicia to the wider realm."
 HLC_halician_legion:0 "Legion of Halych"
 HLC_halician_legion_desc:0 "We shall create a core army of the best-trained and most experienced troops to operate at maximum efficiency in any situation without jeopardizing our flag. Their presence serves to morally energize the entire army."
 HLC_ideas:0 "Halycian Ideas"
 HLC_ideas_bonus:0 "Halycian Ambitions"
 HLC_ideas_start:0 "Halycian Traditions"
 HLC_lviv_casle:0 "Lviv Castle"
 HLC_lviv_casle_desc:0 "The Lviv Castle stands as a symbol of our defensive might and custom and speech."
 HLC_lviv_castle:0 "Renovate the High Castle of Lviv"
 HLC_lviv_castle_desc:0 "The castle on Castle Hill in Lviv, built under the leadership of the King of Rus' Lev Danilovich and later by Polish King Casimir III, must be renovated as a symbol of our renewed ambitions and spiritual devotion."
 HLC_magnate_assembly_reform:0 "Estate Compact"
 HLC_magnate_assembly_reform_desc:0 "Leading magnates, clergy, and towns are bound to the crown through a negotiated provincial compact."
 HLC_merchant_privileges_reform:0 "Merchant Privileges"
 HLC_merchant_privileges_reform_desc:0 "Galician merchants gain guild protections and chartered rights in exchange for fiscal service to the realm."
 HLC_military_modernization_reform:0 "Frontier Army Reform"
 HLC_military_modernization_reform_desc:0 "Galician cavalry and garrisons are reorganized into a disciplined frontier army without abandoning local martial traditions."
 HLC_patrons:0 "Patrons of Real Estate"
 HLC_patrons_desc:0 "We shall grant wealthy merchants who support the state the status of 'New Princes', with privileges similar to those enjoyed by the aristocracy, and the ability to defend their own property. They will develop the system and sponsor the crown by protecting the indivisibility of their domains and attempting to maximize profits, benefiting both the owner and the state."
 HLC_registered_army:0 "City Guard of Halych"
 HLC_registered_army_desc:0 "Let us gather seasoned warriors and form a City Guard to protect our lands. By offering them a share of the city's wealth and ensuring the prosperity of their families, we shall prevent the rise of destitute veterans turned into marauders after wars."
 HLC_rus_ward:0 "Rus' Ward"
 HLC_rus_ward_desc:0 "Following the Mongol horde's departure, the Western principalities, which were the last independent ward of Rus', must defend the generally accepted traditions of the Ruthenians from new threats. We will not abdicate our responsibilities."
