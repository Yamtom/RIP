l_english:
 rip_visit_the_parishes_title:0 "Visit the Parishes"
 rip_visit_the_parishes_desc:0 "Commission a visitation of an unsettled Christian parish. Service books can assist a missionary; an alms register can ease local unrest. The visit costs 100 ducats, 25 administrative power and 5 Patriarch Authority. One visit may be funded every ten years, and the parish receives a ten-year benefit at the expense of its tax receipts."
 rip_parish_visit.1.t:0 "The Parish Visitation"
 rip_parish_visit.1.desc:0 "The metropolitan's clerks have prepared a visitation of the parishes that still follow another obedience. Some priests request service books for instruction; others ask that the revenues set aside for alms remain in the parish. The treasury can pay for one commission. A register alone will not persuade every household."
 rip_parish_visit.1.a:0 "Provide the service books"
 rip_parish_visit.1.b:0 "Endow the parish alms"
 rip_parish_visit.1.c:0 "Leave the commission unsigned"
 rip_parish_service_books:0 "Service Books for the Parish"
 rip_parish_alms_register:0 "The Parish Alms Register"
 rip_parish_visit_recent:0 "Recent Parish Visitation"
 rip_ro_retired_sobor_desc:0 "The council's former permanent canons have been withdrawn. The church commissions an icon through the ordinary Orthodox panel; a parish visitation may be funded separately."
