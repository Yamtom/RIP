l_english:
 # --- The five faith-and-border reforms (October 2026) ---

 # ZAZ / HET
 zaz_orthodox_knighthood_reform:0 "Knights of the Orthodox Faith"
 zaz_orthodox_knighthood_reform_desc:0 "The Host swears itself a sacred military order, bound to guard the pious Greek faith against Muslims and Jesuits. Its monasteries nurse the veterans and store the powder, its muskets shelter the bishops, and its Zeal rises with every war against the faithless."
 ability_zaz_holy_patronage_mechanic:0 "Holy Military Patronage"
 zaz_cossack_zeal:0 "Zaporozhian Zeal"
 zaz_cossack_zeal_desc:0 "Rises with battles and sieges won against states of another faith and ebbs in peace. Its higher bands bless the host with morale, discipline and faster recovery of recruits; the Host spends it to escort bishops and to raise the faithful."
 monthly_zaz_cossack_zeal:0 "Monthly Zaporozhian Zeal"
 zaz_cossack_zeal_gain_modifier:0 "Zaporozhian Zeal Gain"
 zaz_endow_a_military_monastery:0 "Endow a Military Monastery"
 zaz_endow_a_military_monastery_desc:0 "Mezhyhirya by Kyiv, Trakhtemyriv on the Dnieper bend and the Sich church can each become a house of the order: a hospital for the veterans, a powder store and a place of prayer. One house raises morale and the recovery of recruits; two add discipline. Costs 150 ducats."
 zaz_escort_the_hierarchy:0 "Escort the Hierarchy"
 zaz_escort_the_hierarchy_desc:0 "The Host escorts Orthodox bishops into the lands of a neighbouring ruler of another faith. Up to three Orthodox cities there gain a bishop's seat, and the Host holds a casus belli to protect the Eastern Christians for ten years. Costs 40 Zeal."
 zaz_escort_the_hierarchy_tt:0 "Grants the casus belli §YProtect Eastern Christians§! against a neighbour of another faith and seats bishops in up to three of its Orthodox cities for twenty years."
 zaz_raise_the_faithful:0 "Raise the Faithful"
 zaz_raise_the_faithful_desc:0 "Orthodox rebels rise in the lands of the enemies the Host is at war with. Costs 50 Zeal."
 zaz_raise_the_faithful_tt:0 "Orthodox rebels rise in up to two Orthodox cities, outside the capital, of every enemy of another faith."
 zaz_military_monastery:0 "Military Monastery"
 desc_zaz_military_monastery:0 "A house of the order: a hospital for the veterans, a powder store and a place of prayer."
 zaz_monastery_hospitals:0 "Monastery Hospitals"
 desc_zaz_monastery_hospitals:0 "The monks of the order nurse the wounded and drill the recruits."
 zaz_monastery_network:0 "Houses of the Order"
 desc_zaz_monastery_network:0 "The order keeps a house in more than one corner of the Host."
 zaz_clandestine_bishopric:0 "Escorted Bishop"
 desc_zaz_clandestine_bishopric:0 "An Orthodox bishop, consecrated and escorted by the Zaporozhian Host, sits where the ruler did not want one."
 cb_protect_eastern_christians:0 "Protect Eastern Christians"
 cb_protect_eastern_christians_desc:0 "The Host escorted a bishop to the Orthodox of this realm, and their ruler answers for it."
 take_province_protect_eastern_christians:0 "Free the Orthodox Provinces"
 take_province_protect_eastern_christians_desc:0 "The war goal is to take the Orthodox provinces of the enemy."

 # HLC
 hlc_stauropegion_brotherhood_reform:0 "Stauropegion of the Brotherhoods"
 hlc_stauropegion_brotherhood_reform_desc:0 "The Dormition Brotherhood of Lviv holds its church directly from the Patriarch and may watch over the conduct of the bishop himself. The burghers, not the nobility, keep the keys of the Orthodox church of Galicia: towns and workshops prosper, and the old conservative clergy loses ground."
 estate_burghers_hlc_lviv_stauropegion:0 "Lviv Stauropegion"
 estate_burghers_hlc_lviv_stauropegion_desc:0 "The burghers of the Dormition Brotherhood answer for the morals of the church to the Patriarch alone, the bishop included. The clergy resent it; the workshops and the town councils do not."
 hlc_brotherhood_vigilance:0 "Brotherhood Vigilance"
 desc_hlc_brotherhood_vigilance:0 "The brotherhood has audited the bishop and won; the town's trade profits from its standing."
 hlc_bishop_assertive:0 "Assertive Bishop"
 desc_hlc_bishop_assertive:0 "The bishop has put the brotherhood in its place, and the burghers remember it."
 hlc_ecumenical_bridge:0 "Ecumenical Bridge"
 desc_hlc_ecumenical_bridge:0 "The Eastern rite under Roman jurisdiction, the brotherhood's schools under the care of the Basilians."
 rip_stauropegion.1.t:0 "The Brotherhood and the Bishop"
 rip_stauropegion.1.d:0 "The Dormition Brotherhood has audited the conduct of the bishop of Lviv, as its stauropegion entitles it, and found much to correct. The bishop answers that a church cannot be ruled by merchants and guildsmen."
 rip_stauropegion.1.a:0 "The Brotherhood Prevails"
 rip_stauropegion.1.b:0 "Uphold the Bishop"
 rip_stauropegion.1.c:0 "Refer It to the Patriarch"
 rip_stauropegion.2.t:0 "The Question of the Union"
 rip_stauropegion.2.d:0 "The bishop's party looks to Rome, the brotherhood to Constantinople, and both claim the same Eastern rite. A bridge would keep the rite, the brotherhood's schools and the Patriarch's blessing under the Pope's jurisdiction; a refusal keeps the stauropegion whole."
 rip_stauropegion.2.a:0 "Hold to the Patriarch"
 rip_stauropegion.2.b:0 "The Bishop Turns to Rome"
 rip_stauropegion.2.c:0 "Build the Bridge"

 # CHR
 chr_vetka_asylum_reform:0 "Vetka Asylum"
 chr_vetka_asylum_reform_desc:0 "Starodub, Vetka and the forests of the Desna take in the Old Believers who flee Moscow. Their workshops and merchant communities enrich the settlements, but the metropolitan of Chernihiv counts every heretic at the gate."
 chr_vetka_refugees_req_tt:0 "Muscovy has revised the books or condemned the old rite (1653-1666)."
 chr_sloboda_refugees_tt:0 "At least one refugee family is waiting for a grant."
 chr_grant_sloboda_to_old_believers_title:0 "Grant a Sloboda to the Old Believers"
 chr_grant_sloboda_to_old_believers_desc:0 "Spend 25 ADM and settle one refugee community in a randomly selected eligible province. Map highlighting shows candidates; it does not select the destination. The settlement gains local improvements and may be founded once every five years."
 chr_old_believer_sloboda:0 "Old Believer Sloboda"
 desc_chr_old_believer_sloboda:0 "Refugees of the old rite farm and trade under a charter of freedoms."
 chr_metropolitan_displeasure:0 "Metropolitan's Displeasure"
 desc_chr_metropolitan_displeasure:0 "The metropolitan of Chernihiv withholds his support from a prince who shelters heretics."
 chr_edinoverie_compromise:0 "Common-Faith Parishes"
 desc_chr_edinoverie_compromise:0 "The Old Believers keep the old books under an Orthodox bishop."
 rip_vetka.1.t:0 "Refugees on the Forest Roads"
 rip_vetka.1.d:0 "Families of the old rite, driven from Moscow by the revised books, come through the forests to the Vetka and Starodub. They are hard workers with silver in their belts, and they ask only to be left alone to pray as their fathers did."
 rip_vetka.1.a:0 "Open the Forest Roads"
 rip_vetka.1.b:0 "Admit the Craftsmen"
 rip_vetka.1.c:0 "Turn Them Back"
 rip_vetka.2.t:0 "The Metropolitan's Complaint"
 rip_vetka.2.d:0 "The metropolitan of Chernihiv writes that the settlements of the heretics grow while the parishes of the true church empty. He asks the prince to remember whom he serves."
 rip_vetka.2.a:0 "Hear the Metropolitan"
 rip_vetka.2.b:0 "The Charters Stand"
 rip_vetka.2.c:0 "Common-Faith Parishes"

 # PDL
 pdl_kamianets_concordat_reform:0 "Border Bastion Concordat"
 pdl_kamianets_concordat_reform_desc:0 "Ruthenians, Poles, Armenians and the Jewish kahal each govern their own quarter of the frontier fortress and man its walls together. No one is converted by force; the walls hold, and the Armenian caravans carry the trade of the East."
 pdl_charter_of_four_communities_title:0 "Charter of the Four Communities"
 pdl_charter_of_four_communities_desc:0 "Kamianets keeps four self-governing communities, each with its own magistrate, church and quarter. The prince confirms their charters in return for the walls: no forced conversion, and every community manning its own tower."
 pdl_four_communities:0 "Four Communities"
 desc_pdl_four_communities:0 "Ruthenians, Poles, Armenians and the kahal man the walls of the fortress together."
 pdl_armenian_caravans:0 "Armenian Caravans"
 desc_pdl_armenian_caravans:0 "Armenian merchants carry the cloth and salt of Kamianets to the East."
 rip_kamianets.1.t:0 "Petitions at the Walls"
 rip_kamianets.1.d:0 "On the feast day the four communities of Kamianets each bring a petition to the castle: the Ruthenian brotherhood, the Polish garrison, the Armenian merchants and the Jewish kahal. The walls are held by all four, and the prince may grant one favour."
 rip_kamianets.1.a:0 "The Ruthenian Magistrate"
 rip_kamianets.1.b:0 "The Polish Garrison"
 rip_kamianets.1.c:0 "The Armenian Merchants"
 rip_kamianets.1.e:0 "The Kahal"

 # PLT
 plt_sophian_autonomy_reform:0 "Northern Sophian Autonomy"
 plt_sophian_autonomy_reform_desc:0 "The cathedral of St Sophia and the ancient eparchy of Polotsk keep their own old rule, looking to Kyiv and to the veche of Novgorod and refusing the Muscovite corrections. The Nomocanon is kept as it was written, the guilds look after the parishes, and the town communities may bar a Muscovite candidate from the bishop's throne."
 ability_plt_ancient_nomocanon_mechanic:0 "Keeping the Ancient Nomocanon"
 plt_seal_the_nomocanon:0 "Seal the Nomocanon"
 plt_seal_the_nomocanon_desc:0 "The liturgical books are held as they were written, against Muscovite correction. Twenty years of religious unity and calm. Costs 50 administrative power."
 plt_patronise_the_guild_parishes:0 "Patronise the Guild Parishes"
 plt_patronise_the_guild_parishes_desc:0 "The craft guilds take the parishes under their care: more production, cheaper buildings and content burghers for fifteen years. Costs a quarter of a year's income."
 plt_call_the_city_assembly:0 "Call the City Assembly"
 plt_call_the_city_assembly_desc:0 "The town communities hold their right of veto in advance: for ten years no Muscovite candidate for the bishop's throne is put forward, and Muscovy resents it. Costs 50 diplomatic power."
 plt_nomocanon_sealed:0 "Nomocanon Sealed"
 desc_plt_nomocanon_sealed:0 "The books of the Sophian see are held as they were written."
 plt_guild_parishes:0 "Guild Parishes"
 desc_plt_guild_parishes:0 "The craft guilds keep the parishes and build their own churches."
 plt_city_veto:0 "City Veto"
 desc_plt_city_veto:0 "The town communities hold the standing right to bar a candidate for the bishop's throne."
 plt_muscovite_bishop_accepted:0 "Muscovite Bishop"
 desc_plt_muscovite_bishop_accepted:0 "A Muscovite candidate sits on the Sophian throne, and the guilds do not forget who put him there."
 plt_barred_the_candidate:0 "Barred Our Candidate"
 plt_vetoed_the_candidate:0 "Vetoed Our Candidate"
 rip_sophia.1.t:0 "A Candidate from Moscow"
 rip_sophia.1.d:0 "The metropolitan of Moscow proposes a bishop for the throne of St Sophia in Polotsk, one who would correct the books to the Muscovite pattern. The town communities remember the old Nomocanon and their right to be asked."
 rip_sophia.1.a:0 "Accept the Candidate"
 rip_sophia.1.b:0 "The City Communities Veto"
 rip_sophia.1.c:0 "Seat Him under the Nomocanon"
