l_english:


 # DECISIONS
 develop_dniester_estuary_trade_title:0 "Develop Dniester Estuary Trade"
 develop_dniester_estuary_trade_desc:0 "Invest 300 ducats, 75 ADM and 50 DIP in the ports of Budjak, from Akkerman on the Dniester to Kilia on the lower Danube. The province owner receives the local improvements. Our trade network operates while we or a dependent subject own Budjak and its owner controls it. If the province is lost or occupied, the bonus lapses at the next monthly review. Recovering control restores the network. The initial development is granted only once."
 fortify_dniester_estuary_title:0 "Fortify Dniester Estuary"
 fortify_dniester_estuary_desc:0 "Expand the defenses of Akkerman in Budjak for 400 ducats and 75 MIL. Existing stronger forts are preserved. Local defenses benefit the province owner; our national defensive network requires continued direct or dependent-subject ownership and local control, reviewed monthly."
 establish_dniester_fishing_title:0 "Establish Estuary Fishing Industry"
 establish_dniester_fishing_desc:0 "Invest 150 ducats and 50 DIP in the fishing industry around Akkerman in Budjak. The province, including a dependent subject holding it, receives the improvements and changes its trade good to fish (mutually exclusive with other estuary specializations)."
 establish_dniester_wine_trade_title:0 "Develop Wine Trade"
 establish_dniester_wine_trade_desc:0 "Invest 200 ducats and 50 DIP in wine merchants and production around Akkerman in Budjak. Local improvements benefit the province owner, including a dependent subject; the province changes its trade good to wine (mutually exclusive with other estuary specializations)."
 establish_dniester_salt_works_title:0 "Establish Salt Production"
 establish_dniester_salt_works_desc:0 "Invest 150 ducats and 50 ADM in salt works around the Dniester Estuary in Budjak. Local improvements benefit the province owner, including a dependent subject; the province specializes in salt extraction and changes its trade good to salt (mutually exclusive with other estuary specializations)."
 contest_ottoman_dniester_control_title:0 "Contest Ottoman Control of Dniester"
 contest_ottoman_dniester_control_desc:0 "Prepare to contest Ottoman control of Akkerman and the Dniester Estuary in Budjak. This grants a claim on Budjak, not on Hajibey in Yedisan."
 # MODIFIERS
 dniester_trade_network:0 "Dniester Trade Network"
 desc_dniester_trade_network:0 "Akkerman links our merchants to Black Sea trade. The bonus requires Budjak to be owned by us or a non-sovereign subject and controlled by its owner. Access is reviewed monthly and at startup; recovery restores the network without another development reward."
 dniester_kilia_trade:0 "Kilia Trade Hub"
 desc_dniester_kilia_trade:0 "Kilia is a lower-Danube trading port, represented together with Akkerman by Budjak on the campaign map."
 dniester_fortress_akkerman:0 "Akkerman Fortress"
 desc_dniester_fortress_akkerman:0 "The mighty fortress of Akkerman guards the Dniester Estuary."

 dniester_naval_base:0 "Dniester Naval Base"
 desc_dniester_naval_base:0 "Naval facilities in the estuary support our fleet operations."

 dniester_defensive_network:0 "Dniester Defensive Network"
 desc_dniester_defensive_network:0 "Akkerman supports our coordinated defenses while Budjak is owned by us or a non-sovereign subject and controlled by its owner. The bonus is suspended on the next monthly review after access is lost and restored when access returns."
 dniester_fishing_industry:0 "Dniester Fishing Industry"
 desc_dniester_fishing_industry:0 "Thriving fishing industry in the estuary."

 dniester_wine_merchants:0 "Dniester Wine Merchants"
 desc_dniester_wine_merchants:0 "Greek and Armenian merchants trade wine from the region."

 dniester_salt_production:0 "Dniester Salt Production"
 desc_dniester_salt_production:0 "Salt works along the estuary provide valuable trade goods."

 dniester_greek_merchants:0 "Greek Merchant Community"
 desc_dniester_greek_merchants:0 "Greek merchants have established themselves in the Dniester Estuary."

 dniester_armenian_merchants:0 "Armenian Merchant Community"
 desc_dniester_armenian_merchants:0 "Armenian merchants bring expertise in long-distance trade."

 dniester_cossack_raids_threat:0 "Cossack Raid Threat"
 desc_dniester_cossack_raids_threat:0 "Cossack raiders threaten the Dniester Estuary trade."

 dniester_ottoman_control:0 "Ottoman Administration"
 desc_dniester_ottoman_control:0 "Ottoman governance brings stability to the region."

 akkerman_mighty_fortress:0 "Mighty Fortress of Akkerman"
 desc_akkerman_mighty_fortress:0 "Akkerman stands as one of the most formidable fortresses on the Black Sea."

 dniester_wine_boom:0 "Wine Trade Boom"
 desc_dniester_wine_boom:0 "Wine trade is flourishing in the Dniester Estuary."

 preparing_dniester_campaign:0 "Preparing Dniester Campaign"
 desc_preparing_dniester_campaign:0 "We are preparing military campaign to control the Dniester Estuary."

 cossack_tribute_paid:0 "Cossack Tribute Arrangement"
 desc_cossack_tribute_paid:0 "We pay tribute to Cossacks to avoid raids on the estuary."

 merchant_fleet_arrival:0 "Merchant Fleet Arrival"
 desc_merchant_fleet_arrival:0 "Major merchant fleet has arrived, boosting trade."

 excellent_fish_harvest:0 "Excellent Fish Harvest"
 desc_excellent_fish_harvest:0 "Exceptional fishing season in the estuary."

 wine_vintage_fame:0 "Famous Wine Vintage"
 desc_wine_vintage_fame:0 "Our wines have gained international fame."

 # EVENTS
 dniester_estuary.1.t:0 "Greek Merchants in Akkerman"
 dniester_estuary.1.d:0 "Greek merchants from Constantinople and Crimea have arrived in Akkerman, seeking to establish trading houses. They bring connections to wider Black Sea trade networks and expertise in maritime commerce. How shall we receive them?"
 dniester_estuary.1.a:0 "Welcome them warmly"
 dniester_estuary.1.b:0 "Tax them heavily"
 dniester_estuary.1.c:0 "Restrict foreign merchants"

 dniester_estuary.2.t:0 "Armenian Merchants Arrive"
 dniester_estuary.2.d:0 "Armenian merchants, renowned for their long-distance trade networks, have petitioned to establish themselves in Akkerman. They can connect us to Persian and Asian trade routes."
 dniester_estuary.2.a:0 "Welcome the Armenian merchants"
 dniester_estuary.2.b:0 "Prefer local merchants"

 dniester_estuary.10.t:0 "Akkerman Defenses Expanded"
 dniester_estuary.10.d:0 "From the walls of Akkerman our garrison commands the mouth of the Dniester. Merchants bound for Kilia on the lower Danube have heard the news, and so have the rulers who collect the tolls along the Black Sea shore."
 dniester_estuary.10.a:0 "An impregnable bastion!"

 dniester_estuary.11.t:0 "[From.GetName] Fortifies Akkerman"
 dniester_estuary.11.d:0 "[From.GetName] has completed massive fortifications at Akkerman in the Dniester Estuary. This fortress threatens to dominate the entire Black Sea coast. How shall we respond?"
 dniester_estuary.11.a:0 "Build our own fortifications"
 dniester_estuary.11.b:0 "Prepare for conflict"
 dniester_estuary.11.c:0 "Accept their strength"

 dniester_estuary.20.t:0 "Wine Trade Flourishes"
 dniester_estuary.20.d:0 "The wine trade along the Dniester Estuary is booming as Greek and Armenian merchants ship rich vintages to Constantinople, Caffa, and beyond. Demand runs high and duties flow steadily into our coffers."
 dniester_estuary.20.a:0 "Expand production"
 dniester_estuary.20.b:0 "Focus on exports"
 dniester_estuary.20.c:0 "Tax the profits"

 dniester_estuary.30.t:0 "Preparing Against the Ottomans"
 dniester_estuary.30.d:0 "We have decided to contest Ottoman control of the Dniester Estuary. This strategic region is vital to Black Sea trade, and we cannot allow the Ottomans to monopolize it. How shall we prepare for the inevitable conflict?"
 dniester_estuary.30.a:0 "Build alliance network"
 dniester_estuary.30.a.tt:0 "Other Ottoman rivals will view us more favorably"
 dniester_estuary.30.b:0 "Military buildup"
 dniester_estuary.30.c:0 "Delay our plans"

 dniester_estuary.40.t:0 "Cossack Raids on Estuary"
 dniester_estuary.40.d:0 "Cossack raiders threaten the Dniester Estuary trade lanes, swooping upon merchant vessels and coastal towns before slipping back into the steppe."
 dniester_estuary.40.a:0 "Strengthen coastal defenses"
 dniester_estuary.40.b:0 "Negotiate with the Cossacks"
 dniester_estuary.40.c:0 "Accept the raids as reality"

 dniester_estuary.50.t:0 "Merchant Fleet Arrives"
 dniester_estuary.50.d:0 "A great merchant convoy has dropped anchor at Akkerman, laden with silks, wine, and spices from across the Black Sea and the Mediterranean."
 dniester_estuary.50.a:0 "Excellent for trade!"

 dniester_estuary.51.t:0 "Excellent Fish Harvest"
 dniester_estuary.51.d:0 "The fishing season along the Dniester Estuary has yielded an extraordinary catch, filling our riverside markets with fresh sturgeon and herring."
 dniester_estuary.51.a:0 "Praise the fishermen!"

 dniester_estuary.52.t:0 "Wine Vintage Competition"
 dniester_estuary.52.d:0 "Wine merchants propose hosting a vintage competition to showcase Dniester wines and attract buyers from across the Black Sea region. This could boost our wine trade's reputation, but requires investment."
 dniester_estuary.52.a:0 "Host the competition"
 dniester_estuary.52.b:0 "Just sell the wine"

 opinion_threatened_by_fortifications:0 "Threatened by Fortifications"
 desc_opinion_threatened_by_fortifications:0 "Their new fortifications threaten our security."

 opinion_anti_ottoman_alliance:0 "Anti-Ottoman Alliance"
 desc_opinion_anti_ottoman_alliance:0 "We share a common enemy in the Ottoman Empire."

 desc_uniate_metropolitan_see:0 "The Uniate Church has established a metropolitan see, strengthening its hierarchy and influence."
 uniate_church.6.b:0 "Defer the foundation."
 uniate_metropolitan_see:0 "Uniate Metropolitan See"
