l_english:
 rip_uzh_union.1.t:0 "The Priests of the Mukachevo Eparchy"
 rip_uzh_union.1.d:0 "On 24 April 1646, sixty-three priests of the Mukachevo Eparchy sought reception into communion with Rome before Bishop Jakusics of Eger, asking that their Byzantine rite and episcopal tradition remain untouched. The petition arises from the clergy of the Carpathian foothills rather than a royal decree altering the faith of the realm.\n\nConfirming their union in [Root.GetName] shields the eparchy's faithful without altering the state confession, granting twenty years of protection from coerced conversion at the cost of 10 local autonomy."
 rip_uzh_union.1.a:0 "Guarantee their rite."
 rip_uzh_union.1.b:0 "Leave the parishes as they are."
 rip_uzh_union.2.t:0 "Petition of the Mukachevo Priests"
 rip_uzh_union.2.d:0 "Although the appointed hour of Uzhhorod Castle has long since passed, the priests of the Mukachevo Eparchy still petition the Catholic crown through the Bishop of Eger to enter communion with Rome while keeping their Byzantine rite and episcopal custom.\n\nConfirming their union in [Root.GetName] shields the eparchy's faithful without altering the state confession, granting twenty years of protection from coerced conversion at the cost of 10 local autonomy."
 rip_uzh_union.2.a:0 "Guarantee their rite."
 rip_uzh_union.2.b:0 "Leave the parishes as they are."
 rip_uzh_union_patron_tt:0 "A Catholic owner becomes the §Ypatron of local unions§! at once, without the sponsor decision or its price, and may negotiate eparchial unions."
 rip_uzh_synod_closed_tt:0 "§YNo state synod is founded§!, and the road of the eparchy needs one."
