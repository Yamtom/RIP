 rip_ro_holy_city_register_title:0 "Consult the Register of Holy Cities"
 rip_ro_holy_city_register_desc:0 "Review Novgorod, Moscow, Kyiv, Constantinople and Jerusalem. This register grants no bonuses. Select a city, then use the event's Go to control to find it on the map."
 rip_ro_sites.1.t:0 "The Holy Cities"
 rip_ro_sites.1.d:0 "Cities owned and controlled by us in the Russian Orthodox faith: §Y[Root.rip_ro_holy_city_count.GetValue]/5§!.\n\n[310.GetName]: [310.Owner.GetName], [310.Religion.GetName]\n[295.GetName]: [295.Owner.GetName], [295.Religion.GetName]\n[280.GetName]: [280.Owner.GetName], [280.Religion.GetName]\n[151.GetName]: [151.Owner.GetName], [151.Religion.GetName]\n[379.GetName]: [379.Owner.GetName], [379.Religion.GetName]\n\nThis is a register of sees and pilgrimage destinations, not an additional source of national bonuses."
