 hetman_succession_crisis:0 "Hetman Succession Crisis"
 desc_hetman_succession_crisis:0 "The death or incapacity of the hetman has triggered a succession crisis. Foreign powers compete to install favored candidates, and the starshyna (cossack officers) fracture into competing factions. The Hetmanate's stability hangs in the balance."

 hetman_faction_conflict:0 "Hetman Faction Conflict"
 desc_hetman_faction_conflict:0 "The officer class is divided into competing factions, each backing a different candidate for hetman."

 pacts_and_statutes:0 "Pacts & Statutes"
 desc_pacts_and_statutes:0 "The Hetmanate operates under formal agreements (Pereiaslav, Hadyach, or Kolomaky statutes) that define its relationship to overlords."

 polkovo_sotennyi_system:0 "Polkovo-Sotennyi System"
 desc_polkovo_sotennyi_system:0 "The regiment-company administrative structure of the Hetmanate provides stability and organization."

 mazepa_reforms:0 "Mazepa's Reforms"
 desc_mazepa_reforms:0 "Ivan Mazepa's patronage of churches, academies, and regular regiments strengthens the Hetmanate while arousing Muscovite suspicion."

 right_bank_loyalty:0 "Right Bank Loyalty"
 desc_right_bank_loyalty:0 "The right bank of the Dnieper remains loyal to the Hetmanate, though at risk from Polish and Ottoman intervention."

 left_bank_integration:0 "Left Bank Integration"
 desc_left_bank_integration:0 "The left bank of the Dnieper is firmly integrated into Hetmanate control, with Chernihiv as a major center of power."

 batuuryn_fortified:0 "Batuuryn Fortified"
 desc_batuuryn_fortified:0 "The fortress of Batuuryn, residence of the hetman and symbol of Cossack power, is heavily fortified."

 batuuryn_destroyed:0 "Batuuryn Destroyed"
 desc_batuuryn_destroyed:0 "Peter I's troops have destroyed the fortress of Batuuryn as punishment for Mazepa's alliance with Sweden. A symbolic blow to Cossack independence."

 collegia_influence:0 "Russian Collegia Influence"
 desc_collegia_influence:0 "Russian administrative colleges now govern aspects of Hetmanate territory, slowly integrating it into the empire."

 starshyna_clans:0 "Starshyna Clans"
 desc_starshyna_clans:0 "The officer class (starshyna) of Cossack generals wields tremendous power and influence over hetman succession and policy."
 het_joined_confederation:0 "Joined the Kyivan Confederation"
 het_refused_confederation:0 "Refused Confederation Invitation"
 ruina_recovery_south:0 "Frontier Recovery"
 desc_ruina_recovery_south:0 "State funds rebuild stockades and markets after turmoil."

 # --- Hetmanate Regimental Territorial Governance (2026-10-18) ---
 het_regimental_territorial_governance_decision_title:0 "Review Regimental Territorial Governance"
 het_regimental_territorial_governance_decision_desc:0 "The Cossack polky are both military formations and administrative territories. By issuing a Hetman's Universal, we can review the internal governance of our regimental districts, choosing whether to direct them toward full military service, confirm the local privileges of the starshyna, or impose direct central oversight."

 het_regiment_governance.1.t:0 "The Hetman's Regimental Universal"
 het_regiment_governance.1.d:0 "The regiments of the Host stand as the foundation of our state. Each regimental town balances the demands of Cossack martial mobilisation, the landed interests of the local starshyna, and the central authority of the General Military Chancery. The General Staff awaits the Hetman's decision on which regimental territory to reform."
 het_regiment_governance.1.a:0 "Review the Kyiv and Right-Bank Regiments"
 het_regiment_governance.1.b:0 "Review the Left-Bank Regimental Districts"
 het_regiment_governance.1.c:0 "Review the Sloboda and Frontier Regiments"
 het_regiment_governance.1.e:0 "Review a regimental center by Chancery choice"
 het_regiment_governance.1.f:0 "Maintain existing customs without changes"

 het_regiment_governance.2.t:0 "Kyiv and Right-Bank Regimental Governance"
 het_regiment_governance.2.d:0 "The regiments of the Right Bank guard the Dnieper crossings and the frontier with Poland. We must decide the course of governance for this regimental district."
 het_regiment_governance.2.a:0 "Military Service: Expand the combat register and artillery"
 het_regiment_governance.2.b:0 "Starshyna Rights: Confirm ranhowi estates and local jurisdiction"
 het_regiment_governance.2.c:0 "Centralization: Impose General Military Chancery audits"

 het_regiment_governance.3.t:0 "Left-Bank Regimental Governance"
 het_regiment_governance.3.d:0 "The Left-Bank regiments form the fertile heart of the Hetmanate. The colonels and sotnyks await our universal on the district's administration."
 het_regiment_governance.3.a:0 "Military Service: Muster the regiments for war"
 het_regiment_governance.3.b:0 "Starshyna Rights: Guarantee noble estates and trade rights"
 het_regiment_governance.3.c:0 "Centralization: Direct taxation and Chancery oversight"

 het_regiment_governance.4.t:0 "Sloboda and Frontier Regimental Governance"
 het_regiment_governance.4.d:0 "The frontier regiments hold the line against steppe incursions. We must establish their regimental order."
 het_regiment_governance.4.a:0 "Military Service: Reinforce watchtowers and frontier patrols"
 het_regiment_governance.4.b:0 "Starshyna Rights: Empower the frontier colonels"
 het_regiment_governance.4.c:0 "Centralization: Subordinate the slobodas directly to the Hetman"

 het_regiment_governance.5.t:0 "Regimental District Governance"
 het_regiment_governance.5.d:0 "Our chancery has selected an active regimental seat for administrative reorganization. Choose its governing course."
 het_regiment_governance.5.a:0 "Military Service: Full regimental mobilization"
 het_regiment_governance.5.b:0 "Starshyna Rights: Confirm local autonomy and rank lands"
 het_regiment_governance.5.c:0 "Centralization: Subordinate the district to the General Staff"

 het_regiment_military_service:0 "Regimental Military Service"
 desc_het_regiment_military_service:0 "This regimental territory is placed under martial mobilization. Local resources and manpower are prioritized for the Host's combat units, watchposts, and artillery."
 het_regiment_starshyna_rights:0 "Starshyna Local Rights"
 desc_het_regiment_starshyna_rights:0 "The regimental colonel and starshyna enjoy extensive landed immunities, mills, and private judicial authority, fostering local agriculture and trade while increasing provincial autonomy."
 het_regiment_centralized_rule:0 "Centralized Chancery Administration"
 desc_het_regiment_centralized_rule:0 "The General Military Chancery exercises direct administrative and fiscal supervision over this regimental seat, eliminating local immunities and directing tax revenues straight to the Hetman's treasury."
 het_recent_regimental_reform:0 "Recent Regimental Universal"
 desc_het_recent_regimental_reform:0 "The Hetman has recently issued a universal reorganizing regimental governance."
 het_kyiv_russian_protection:0 "Kyiv under Russian Protection"
 desc_het_kyiv_russian_protection:0 "Russian protection lowers unrest in Kyiv and strengthens its defenses."
 het_kyiv_mazepa_golden_age:0 "Mazepa's Kyiv"
 desc_het_kyiv_mazepa_golden_age:0 "Mazepa's patronage accelerates development and the spread of institutions in Kyiv."
 het_registered_cossacks_integrated:0 "The Register Absorbed"
 het_sahaidachnyi_host_title:0 "Sahaidachnyi's Host"
 het_sahaidachnyi_host_desc:0 "Petro Konashevych-Sahaidachnyi laid the political and military foundation of the future Hetmanate—uniting the Cossack Host with the Kyiv Brotherhood in 1620, securing the restoration of the Orthodox metropolitanate, and honing standing infantry and artillery tactics proven at Khotyn in 1621. Upholding his legacy unites sword and faith beneath the Hetman's bulawa."
 het_age_of_heroic_campaigns_title:0 "Heroic Sea Campaigns"
 het_age_of_heroic_campaigns_desc:0 "Following the heroic Pontic age of Cossack navigation, state-backed chaiky and galley squadrons descend the Dnieper and Buh estuaries to project Hetmanate power along the Crimean and Anatolian coasts."
 het_black_sea_armada_title:0 "Black Sea Armada"
 het_black_sea_armada_desc:0 "Building regular shipyards alongside traditional chaiky flotillas allows the Hetmanate to assert lasting maritime dominance in the northern Black Sea and contest the approaches to the Bosporus."
 het_sahaidachnyi_regiments:0 "Sahaidachnyi Military Heritage"
 desc_het_sahaidachnyi_regiments:0 "Inspired by Hetman Sahaidachnyi's alliance of the Cossack Host with Kyivan church and school institutions, Hetmanate regiments fight with steady discipline and firepower."
 het_heroic_sea_campaigns:0 "Pontic Naval Tradition"
 desc_het_heroic_sea_campaigns:0 "Seasoned Dnieper and Black Sea mariners uphold the daring seamanship of the heroic chaiky age."
 het_black_sea_armada_modifier:0 "Hetmanate Black Sea Fleet"
 desc_het_black_sea_armada_modifier:0 "Constructed slipways and coastal admiralties sustain a permanent Cossack war fleet on the Black Sea."
 het_black_sea_campaigns_tt:0 "Own, occupy, or have recently slave-raided at least §Y8§! coastal provinces in the §YCrimea§! or §YAnatolia§! regions."
 het_orthodox_metropolis_pillar_tt:0 "Holds Orthodox Kyiv (280) with church or collegium infrastructure and at least §Y3§! Orthodox provinces with temples or cathedrals."
 het_orthodox_brotherhood_pillar_tt:0 "At least §Y120§! development with active Orthodox brotherhood patronage or defender status."
 het_orthodox_register_pillar_tt:0 "Fields at least §Y20§! regiments with an expanded or confirmed Cossack register or the Hadiach compact."
 het_mazepa_swedish_course_tt:0 "Took Sweden's side in Mazepa's Choice or maintains an active alliance with Sweden (or a great-power ally outside the overlord)."
 het_mazepa_loyal_course_tt:0 "Chose loyalty to the suzerain in Mazepa's Choice or holds high overlord opinion (§Y150§!), trust (§Y60§!), and low liberty desire."
 het_loyal_hetmanate_charter:0 "Loyal Hetmanate Charter"
 desc_het_loyal_hetmanate_charter:0 "By keeping faith with the suzerain during the Northern War, the Hetmanate secured formal confirmation of its estates and treasury."
 het_loyal_autonomy_accord:0 "Confirmed Autonomy Accord"
 desc_het_loyal_autonomy_accord:0 "Loyal service won lasting imperial recognition for the Hetmanate's courts, regimental offices, and provincial autonomy."
 het_enhanced.9.t:0 "First Fruits of the Rising"
 het_enhanced.9.d:0 "The Host's rising has forced neighbouring courts to reckon with Cossack arms. Before pressing further west, the starshyna and clergy gather to decide what first settlement to formalize: the rights of the Kyiv Metropolis, a charter for the Orthodox brotherhoods, or a confirmed Cossack register."
 het_enhanced.9.a:0 "Confirm the rights of the Kyiv Metropolis."
 het_enhanced.9.b:0 "Charter and protect the Orthodox brotherhoods."
 het_enhanced.9.c:0 "Enshrine the Cossack register by treaty."
 het_enhanced.10.t:0 "Mazepa's Cultural Endowment"
 het_enhanced.10.d:0 "The Hetman's treasury is full enough to leave lasting stone and learning behind. Will Mazepa endow the Kyiv-Mohyla Collegium with new chairs and printing halls, raise a Baroque cathedral over the Dnieper, or preserve modest stipends across the regiments?"
 het_enhanced.10.a:0 "Endow the Collegium and scholars."
 het_enhanced.10.b:0 "Build a Baroque cathedral in Kyiv."
 het_enhanced.10.c:0 "Keep a modest endowment in the capital."
