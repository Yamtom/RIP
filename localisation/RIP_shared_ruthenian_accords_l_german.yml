l_german:
 rip_sign_hadiach_accord:0 "Offer a Sovereign Hadiach Accord"
 rip_sign_hadiach_accord_desc:0 "Offer an independent Ruthenian ally a seat beside the nations of the Commonwealth. The ally keeps its own government and lands. Both realms must be at peace, and an allied fort must guard a shared border. We grant 200 ducats and spend 50 diplomatic power to sign."
 rip_sign_kyiv_accord:0 "Propose the Kyivan Defence League"
 rip_sign_kyiv_accord_desc:0 "Invite an independent ally holding a seat of the princely compact to maintain a fortified border with Kyiv. We grant 150 ducats and spend 50 diplomatic power to sign."
 rip_sign_dniester_accord:0 "Offer the Dniester Port Accord"
 rip_sign_dniester_accord_desc:0 "Pay the independent ruler of Budjak 300 ducats and spend 50 diplomatic power to secure access to the port. The ally must control its fortress and share a secure land border with us."
 rip_accord_offer_ready_tt:0 "At least five years have passed since the last refused offer of this accord."
 rip_hadiach_accord_opinion:0 "Sovereign Hadiach Accord"
 rip_kyiv_accord_opinion:0 "Kyivan Defence Accord"
 rip_dniester_accord_opinion:0 "Dniester Port Accord"
 POL_hadiach_sovereign_accord_tt:0 "The Sovereign Hadiach Accord is in force with a free ally on a secure border."
 POL_hadiach_sovereign_charters_tt:0 "Ratify the Sovereign Hadiach Accord in parliament at +2 stability."
 POL_hadiach_crown_charters_tt:0 "Have 4 accepted cultures and seat 3 of our own Ruthenian provinces in parliament."
 POL_hadiach_sovereign_border_tt:0 "Uphold the Sovereign Hadiach Accord for five years with the same independent ally and a secure fortified border."
 rip_kyiv_accord_held_tt:0 "After the Princely Compact, sign the Kyivan Defence Accord with an independent ally. Maintain the alliance and its fortified common border for five years."
 UKR_defensive_league_title:0 "Defence League"
 UKR_defensive_league_desc:0 "Let the princely agreement become a league of defence. A free ally keeps its own council and fortresses, while both states keep the roads and crossings on their shared border secure."
 rip_conclude_dniester_accord_title:0 "Open the Dniester Ports"
 rip_conclude_dniester_accord_desc:0 "After five years of keeping the port and approaches secure with our independent ally, establish a permanent trade network under the accord."
 rip_dniester_accord_held_tt:0 "Uphold the agreement with the independent ruler of Budjak for five years. The ally must hold its port fortress and we must control our side of the border."
 rip_hadiach_accord_reward:0 "Commonwealth of Sovereign Partners"
 desc_rip_hadiach_accord_reward:0 "The ratified accord secures representation and mutual defence without absorbing the Ruthenian partner. Its benefits last while the alliance and border guarantees hold."
 rip_kyiv_accord_reward:0 "Kyivan Defence League"
 desc_rip_kyiv_accord_reward:0 "A free ally shares the burden of defending our frontier. Its benefits last while the ally and its fortified border are secure."
 rip_dniester_accord_reward:0 "Dniester Port Network"
 desc_rip_dniester_accord_reward:0 "The treaty gives us access to Budjak through a sovereign partner. Its benefits last while the ally controls the fortified port and we hold our side of the border."
