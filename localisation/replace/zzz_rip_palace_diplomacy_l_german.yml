l_german:

# Carried English until a translator takes it. Source: rip_palace_diplomacy_l_english.yml

 # --- the Palace of the Grand Dukes

 vilnius_palace:0 "Palace of the Grand Dukes"
 vilnius_palace_desc:0 "The lower castle at Vilnius, rebuilt in the Italian manner for a court that had been ruling from horseback and tents. The council sits here, the chancery writes here, the Statute was printed under this roof, and every envoy who wants the Grand Duchy rather than the Crown is lodged here on purpose."
 vilnius_palace_seat_tt:0 "The owner rules the Grand Duchy"
 vilnius_palace_upgrade_tt:0 "We are at peace"

 lit_palace.1.t:0 "The Italians at Vilnius"
 lit_palace.1.d:0 "The masons have finished, and the building does not look like anything else between here and Krakow: arcades on the courtyard, glass in the upper windows, and a hall long enough to seat the council with room to argue. The Grand Duchy has stopped being ruled out of a saddlebag. What moves in with the court is the question."
 lit_palace.1.a:0 "Move the chancery in"
 lit_palace.1.b:0 "Keep the court on the road"

 lit_palace.2.t:0 "The Palace Is Stripped"
 lit_palace.2.d:0 "The city is taken and the palace has been emptied room by room: the tapestries, the plate, the library, the roof lead. The walls stand and nothing inside them does. An inventory is being drawn up, in another country, of things that used to be here."
 lit_palace.2.a:0 "Rebuild what can be rebuilt"
 lit_palace.2.b:0 "Let it stand empty"

 rip_palace_seat_of_the_chancery:0 "Seat of the Chancery"
 rip_palace_stripped:0 "The Palace Stripped"

 # --- diplomatic actions

 rip_offer_hadiach_terms:0 "Offer the Hadiach Terms"
 rip_offer_hadiach_terms_desc:0 "Offer a Grand Duchy of Ruthenia standing beside Poland and Lithuania: its own chancery, its own courts, its own army and its own seat at the diet. The offer was made once and ratified thin, and the war resumed. It can be made properly."
 rip_grant_the_princely_charter:0 "Grant the Princely Charter"
 rip_grant_the_princely_charter_desc:0 "Write down what the princedom keeps - its courts, its levy, its own name in its own charters - and seal it. A subject that has been given something in writing argues about smaller things afterwards."

 rip_hadiach_compact:0 "The Hadiach Compact"
 rip_princely_charter:0 "The Princely Charter"

 # --- Hadiach: the offer, the ratification, and what came back

 hadiach.1.t:0 "The Articles Go to the Sejm"
 hadiach.1.d:0 "What was agreed is now a draft, and a draft has to pass a house that was not at the table. The article that will decide it is the one giving the Duchy an army of its own; the benches have already begun calling that number impossible. Everything else can be argued about afterwards, and will be."
 hadiach.1.a:0 "Press the full text through"
 hadiach.1.b:0 "Let the Sejm thin it"
 hadiach.1.c:0 "Withdraw the articles"

 hadiach.2.t:0 "What Came Back From the Sejm"
 hadiach.2.d:0 "The text that was ratified is not the text that was signed. The seat at the diet is there, the chancery is there, and the army has been cut to a number that would not hold a single palatinate. The men who negotiated at Hadiach are being asked, in public, what exactly they brought home."
 hadiach.2.a:0 "Take what was ratified"
 hadiach.2.b:0 "Repudiate it"

 hadiach.3.t:0 "The Grand Duchy of Ruthenia"
 hadiach.3.d:0 "It passed whole: a third member with its own chancery, its own courts, its own treasury, its own army and its own seat at the diet, sworn by a king who spent his own credit to get it through. Nobody involved expects it to be easy. Everybody involved understands that it has never been done before."
 hadiach.3.a:0 "Seal it in all three chanceries"

 rip_hadiach_thinned:0 "The Thinned Articles"

 # --- the udil

 rip_grant_the_udil:0 "Grant an Udil"
 rip_grant_the_udil_desc:0 "Hand the subject over as a kinsman's portion rather than a governor's district: it may not be annexed, may not be integrated, will never rank above a duchy, and pays half. It is how this realm is held together, and it is also how it comes apart."
 rip_held_as_an_udil:0 "Held as an Udil"
