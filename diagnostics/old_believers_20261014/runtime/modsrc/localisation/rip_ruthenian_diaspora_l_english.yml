l_english:
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_root_desc:0 "Merchants, exiles and settlers of Ruthenian speech have long left these shores for others. Let the crown take an interest in where they go."

 rip_colonize_canada_title:0 "Nova Volyn"
 rip_colonize_canada_desc:0 "Fur traders and fishermen from the Ruthenian lands have followed the northern rivers into the New World. Their settlements deserve a Ruthenian name: Nova Volyn."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"

 rip_colonize_canada_settlers_title:0 "Guests in Another's Colony"
 rip_colonize_canada_settlers_desc:0 "Ruthenian families have taken passage to Canada on another crown's ships, settling among colonists who are not their own. No new country has been founded, only a household in someone else's."

 rip_lysianskyi_circumnavigation_title:0 "Lysiansky's Voyage"
 rip_lysianskyi_circumnavigation_desc:0 "Yuriy Lysiansky, born to a Cossack officer's family in Nizhyn, has commanded a ship around the world. No Ruthenian had done so before him."

 rip_diaspora_usa_title:0 "Nova Rus"
 rip_diaspora_usa_desc:0 "Ruthenian settlers along the eastern seaboard have built farms and churches enough to call their country Nova Rus."

 rip_diaspora_usa_settlers_title:0 "Guests Along the Seaboard"
 rip_diaspora_usa_settlers_desc:0 "Ruthenian settlers have made homes among the eastern seaboard's existing colonists, welcomed rather than founding anything of their own."

 rip_diaspora_south_america_title:0 "Nova Bratslavshchyna and Sribna Zemlia"
 rip_diaspora_south_america_desc:0 "South of the equator, Ruthenian colonists have taken root in Brazil and along the River Plate, naming their new homes after the lands they left."

 rip_diaspora_south_america_settlers_title:0 "Guests South of the Equator"
 rip_diaspora_south_america_settlers_desc:0 "Ruthenian settlers have found welcome in another crown's holdings in Brazil or along the River Plate, without founding a colony of their own."

 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_australia_desc:0 "A handful of Ruthenian sailors and exiles have settled the southern continent. They have named their landing Nova Tavriya, after the old steppe shore."

 rip_diaspora_australia_settlers_title:0 "Guests on the Southern Continent"
 rip_diaspora_australia_settlers_desc:0 "Ruthenian sailors and exiles have settled among another crown's colonists on the southern continent, rather than raising their own flag there."

 rip_green_wedge_title:0 "The Green Wedge Breaks Away"
 rip_green_wedge_desc:0 "A pocket of Manchuria has filled with Ruthenian and Rusyn settlers until it is theirs in all but name. The crown grants what is already true and lets them govern it themselves, under its protection."

 rip_green_wedge_settlers_title:0 "Guests Beyond the Amur"
 rip_green_wedge_settlers_desc:0 "Ruthenian peasants and Cossacks have begun to move east into the taiga beyond the Amur, clearing farmland on land the crown does not hold and does not ask to."

 rip_grey_wedge_title:0 "The Grey Wedge Breaks Away"
 rip_grey_wedge_desc:0 "A pocket of the Central Asian steppe has filled with Ruthenian and Rusyn settlers until it is theirs in all but name. The crown grants what is already true and lets them govern it themselves, under its protection."

 rip_grey_wedge_settlers_title:0 "Guests on the Open Steppe"
 rip_grey_wedge_settlers_desc:0 "Ruthenian settlers have taken to the open steppe of Central Asia, tilling ground that belongs to a neighbour who tolerates them."

 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_of_rus_desc:0 "From the Amur to the River Plate, Ruthenian speech is now heard on every continent but one. Some of that scattering answers to the throne; most of it does not."

 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"

 rip_diaspora_settlers_cooldown:0 "Settlers Under Way"
 desc_rip_diaspora_settlers_cooldown:0 "We have recently sent settlers abroad. The next household will need time to gather."

 # Settler decisions and their events (decisions/RIP_RuthenianDiaspora.txt,
 # events/RIP_RuthenianDiaspora.txt).
 rip_diaspora_colonial_settlers_title:0 "Offer Settlers to a Colony"
 rip_diaspora_colonial_settlers_desc:0 "A friendly power still holds the ground we once looked at ourselves. We could send families to live among its colonists, at no cost to either crown."

 rip_diaspora_colonial_settlers_faith_title:0 "Offer Settlers and the Faith"
 rip_diaspora_colonial_settlers_faith_desc:0 "The same families could carry their religion with them, not only their tongue. It will cost more good will, and unsettle our own clergy at home."

 rip_diaspora_mainland_settlers_title:0 "Offer Settlers Across the Border"
 rip_diaspora_mainland_settlers_desc:0 "A neighbour on good terms with us still holds ground in the wedge we have only visited. We could send settlers to live under its rule, without asking for the land itself."

 rip_diaspora_mainland_settlers_faith_title:0 "Offer Settlers and the Faith Across the Border"
 rip_diaspora_mainland_settlers_faith_desc:0 "Those settlers could bring their religion as well as their tongue. It asks more of our neighbour's patience, and of our own treasury of good standing at home."

 rip_diaspora.10.t:0 "Settlers Arrive"
 rip_diaspora.10.d:0 "A shipload of Ruthenian families has landed on a neighbour's soil and begun to till it. Within a generation the ground below will speak the settlers' tongue, nothing more."
 rip_diaspora.10.a:0 "Let them settle"

 rip_diaspora.11.t:0 "Settlers Arrive With Their Priest"
 rip_diaspora.11.d:0 "A shipload of Ruthenian families has landed on a neighbour's soil, bringing a priest along with their tongue. The local clergy will not thank us for it."
 rip_diaspora.11.a:0 "Let them settle"

 rip_diaspora.12.t:0 "Settlers Cross the Border"
 rip_diaspora.12.d:0 "Ruthenian families have crossed into a neighbour's ground and begun to farm it. The crown has claimed nothing; the tongue spoken there will simply change."
 rip_diaspora.12.a:0 "Let them settle"

 rip_diaspora.13.t:0 "Settlers Cross the Border With Their Priest"
 rip_diaspora.13.d:0 "Ruthenian families have crossed into a neighbour's ground, a priest among them. The crown has claimed nothing; the faith spoken there will simply change."
 rip_diaspora.13.a:0 "Let them settle"

 rip_diaspora.20.t:0 "The Green Wedge Asks for Its Own Governor"
 rip_diaspora.20.d:0 "The Ruthenian and Rusyn settlements beyond the Amur have grown large enough to ask for a governor of their own blood rather than one sent from the capital. Distance argues for granting it."
 rip_diaspora.20.a:0 "Grant the Green Wedge its own crown"

 rip_diaspora.21.t:0 "The Grey Wedge Asks for Its Own Governor"
 rip_diaspora.21.d:0 "The Ruthenian and Rusyn settlements on the Central Asian steppe have grown large enough to ask for a governor of their own blood rather than one sent from the capital. Distance argues for granting it."
 rip_diaspora.21.a:0 "Grant the Grey Wedge its own crown"
