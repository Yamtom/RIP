l_german:

 # --- the four government types

 zaz_cossack_cantons_reform:0 "Cossack Cantons"
 zaz_cossack_cantons_reform_desc:0 "Each palanka keeps its own muster, its own court and its own ground, and sends men to the general rada rather than orders. The Host sells its swords abroad and defends its own crossings; it does not take other people's. Nobody has yet asked what happens when a canton refuses the rada."

 zaz_host_and_state_reform:0 "Host and State"
 zaz_host_and_state_reform_desc:0 "The register becomes the roll of the realm. Regiments hold the districts they recruit from, the starshyna hold the offices, and the treasury exists to keep the regiments standing. What is left of the rada meets when the hetman has finished drilling."

 zaz_sacred_host_order_reform:0 "Sacred Host of the Order"
 zaz_sacred_host_order_reform_desc:0 "The Host takes vows. The kish becomes a chapter, the otaman a master, and the frontier a rule with a wall around it. Brothers hold land in the name of the faith and answer to the chapter for it. An order that stops fighting has to explain itself."

 zaz_sacred_horde_reform:0 "Sacred Horde"
 zaz_sacred_horde_reform_desc:0 "The Host stays in the saddle and takes the steppe on the steppe's terms: a camp that moves, a herd that follows, and a faith carried at the head of the column. Towns are for wintering in and for burning. The register is a memory."

 # --- taking a road

 zaz_road_of_the_cantons_title:0 "Take the Road of the Cantons"
 zaz_road_of_the_cantons_desc:0 "Let each palanka keep its own muster and its own court, and let the general rada be a meeting of equals rather than a command. The Host will sell its swords abroad and hold its own crossings. It will not be feared, and it will not be moved."

 zaz_road_of_host_and_state_title:0 "Take the Road of Host and State"
 zaz_road_of_host_and_state_desc:0 "Put the register at the centre of everything and build the country around it: regiments in the districts, starshyna in the offices, taxes for powder. Other realms keep an army. This one will be an army that keeps a realm."

 zaz_road_of_the_sacred_order_title:0 "Take the Road of the Sacred Order"
 zaz_road_of_the_sacred_order_desc:0 "Let the kish take vows and become a chapter, the otaman a master, and the war on the frontier a rule with brothers under it. The Orthodox lands have never had an order of their own. Rome's orders answered to Rome; whom ours answers to is the question."

 zaz_road_of_the_sacred_horde_title:0 "Take the Road of the Sacred Horde"
 zaz_road_of_the_sacred_horde_desc:0 "Stop pretending the Host is a settled country. Move the camp with the grass, keep the herds, carry the faith at the head of the column, and take from the steppe what the steppe has always been taken for. The register will not survive it."

 # --- carrying the Host

 cossack_carry_the_host_title:0 "Carry the Host Away"
 cossack_carry_the_host_desc:0 "The Sich has been moved before, and not by choice: to Oleshky when Muscovy came for it, and beyond the Danube when the empire finished the job. A friendly power holds ground the Host can camp on. We would arrive as guests, and guests are told where to pitch."
 cossack_carry_the_host_tt:0 "A country that will have us holds a steppe province fit to camp on - an ally, a subject, or one that thinks well of us"

 # --- the named hosts

 found_the_don_host_title:0 "Raise the Don Host"
 found_the_don_host_desc:0 "The lower Don has its own musters, its own otamans and its own quarrel with everyone upstream. Name it a Host and the quarrel becomes ours."

 found_the_danube_sich_title:0 "Raise the Danube Sich"
 found_the_danube_sich_desc:0 "Cossacks who will not live under the empire have always had one road left: across the Danube, onto the Sultan's ground, and a new Sich there. The Porte gives land to whoever will hold the bank for it."

 found_the_eastern_host_title:0 "Raise the Eastern Host"
 found_the_eastern_host_desc:0 "East of the Azov the steppe belongs to whoever musters on it. A Host settled here holds a line nobody else wants to hold, and answers to nobody who can reach it quickly."

 found_the_sloboda_host_title:0 "Raise the Sloboda Host"
 found_the_sloboda_host_desc:0 "The free settlements between the Dnieper and the Donets were built by people walking away from somewhere else. They muster by sotnia and pay no dues. Naming them a Host is mostly writing down what they already do."

 # --- events

 zaz_paths.1.t:0 "The Cantons Agree to Agree"
 zaz_paths.1.d:0 "The general rada has settled it: each palanka keeps its own muster and its own court, and what the rada decides it decides by consent. The Swiss cantons are said to run on the same principle and have not been conquered in living memory. Whether steppe without mountains holds the same way is not yet known."
 zaz_paths.1.a:0 "Let the palanky stand"

 zaz_paths.2.t:0 "The Register Becomes the Realm"
 zaz_paths.2.d:0 "The regiments now hold the districts that feed them, the starshyna hold the offices, and the treasury has one purpose. A Prussian envoy is said to have remarked that other states keep an army while this one is an army that keeps a state. He did not mean it as praise."
 zaz_paths.2.a:0 "Muster the regiments"

 zaz_paths.3.t:0 "The Kish Takes Vows"
 zaz_paths.3.d:0 "The chapter met at dawn and the otaman rose from it a master. Brothers hold their land in the name of the faith, and the frontier has a rule written over it for the first time. The Teutonic brothers ended by fighting the neighbours they were sent to convert."
 zaz_paths.3.a:0 "Bind the brothers"

 zaz_paths.4.t:0 "The Camp Moves With the Grass"
 zaz_paths.4.d:0 "The wagons are drawn up, the herds are counted and the icons ride at the head of the column. The steppe has fed hordes before and does not much mind whose. What it will not feed is a register, and the clerks have already begun to drift away."
 zaz_paths.4.a:0 "Strike the camp"

 zaz_paths.5.t:0 "The Host Pitches on Another Man's Ground"
 zaz_paths.5.d:0 "The wagons crossed at night and the new camp stands on land that is ours only because somebody agreed to it. There is grass, there is water, and there is a host who will remember the favour. Guests keep their weapons but not their say."
 zaz_paths.5.a:0 "Pitch the camp and be grateful"
 zaz_paths.5.b:0 "Pitch it and forget the debt"

