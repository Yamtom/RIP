 kuyaba_nation_title:0 "The Slavic Homeland Under Allah's Protection"
 kuyaba_nation_desc:0 "Drawing upon the old eastern chronicle name of Kuyaba for the middle Dnieper realm, a victorious Muslim sovereign gathers the Ruthenian lands and proclaims a new Islamic crown centered on Kyiv."
 senior_udil:0 "Senior Udil"
 senior_udil_desc:0 "A junior prince of the house holds this seat at the senior prince's pleasure, rotating up the ladder of thrones. He owes the levy rather than the rent, and his grant lapses when a new senior prince takes the throne of Kyiv."
 rip_tenure_lapsed:0 "Grant of Tenure Lapsed"
 rip_kyiv_princely_levy:0 "Princely Levy Called"
 princes_desc:0 "The princes emphasize vassal networks, prestige, and diplomacy."
 ruthenian_court_crisis:0 "Ruthenian Court Crisis"
 ruthenian_court_crisis_desc:0 "Factional rivalries paralyze governance as princes, boyars, and hetmans contest the court."

 ruthenian_factions.2.a:0 "Let the courtiers decide."
 ruthenian_factions.20.t:0 "The Court Rebalances"
 ruthenian_factions.20.d:0 "Court factions have shifted influence and the dominant coalition has been recalculated."
 ruthenian_factions.20.a:0 "Noted."

 ruthenian_decadence.1.t:0 "Ruthenian Decadence"
 ruthenian_decadence.1.d:0 "Factional rivalry shapes the realm's stability. Our actions this year will either deepen courtly decay or restore discipline."
 ruthenian_decadence.1.a:0 "The court continues"
 ruthenian_decadence.2.t:0 "The Court in Crisis"
 ruthenian_decadence.2.d:0 "Decadence has peaked and the court is paralyzed. We must act decisively or pay for appeasement."
 ruthenian_decadence.10.t:0 "The Chamber Will Not Sit"
 ruthenian_decadence.10.d:0 "Three benches, three sets of law. The princes hold charters granted before the Statute was written and will not have them read against it. The boyars answer to their sejmiks and come with instructions they may not exceed. The starshyna answer to the register and to the mace, and count neither charter nor instruction. The chancery cannot issue under a seal that three benches claim, and our envoys at Warsaw and Bakhchisarai are already writing to whichever of them pays."
 ruthenian_decadence.10.a:0 "Confirm the princes' charters as they stood before the Statute."
 ruthenian_decadence.10.b:0 "Call a general Rada, and pay for its session."
 ruthenian_decadence.10.c:0 "Let the mace hold the chamber until the register is read."
 ruthenian_decadence.11.t:0 "The Chamber Sits Again"
 ruthenian_decadence.11.d:0 "The benches have agreed on the order in which the roll is read, which is as much as any of them wanted. The chancery issues under one seal again, the envoys answer to it, and the articles the next election will be fought over are already being drafted by all three."
 ruthenian_decadence.11.a:0 "Enter the settlement in the Statute and let each bench keep its seats."
 ruthenian_decadence.11.b:0 "Write the three benches into the charter of the Confederation."
 ruthenian_decadence.12.t:0 "The Chancery Seal Lies Idle"
 ruthenian_decadence.12.d:0 "The chancellor has not issued under the seal for four seasons, because no bench will accept a document the other two have not countersigned. Our envoys abroad are a year without their allowance, and two have taken a retainer from a princely house instead. The treasury can clear the arrears, or we can let the practice stand and call it custom."
 ruthenian_decadence.12.a:0 "Clear the arrears and put the envoys back on the chancery's roll."
 ruthenian_decadence.12.b:0 "Let each bench keep its own envoys."
 ruthenian_decadence.13.t:0 "A Bench Walks Out"
 ruthenian_decadence.13.d:0 "One bench has emptied. Their spokesman says they will return when the roll is read in the order the old charter sets down, and not before, and that until then whatever the chamber resolves binds nobody. The sejmiks that sent them are already drafting fresh instructions. Clerks can be sent to argue the roll, or the chamber can sit shorthanded and let the resolution stand or fall later."
 ruthenian_decadence.13.a:0 "Send the clerks to argue the roll and bring the bench back."
 ruthenian_decadence.13.b:0 "Let the chamber sit shorthanded."
 ruthenian_decadence.14.t:0 "A Black Council Is Called"
 ruthenian_decadence.14.d:0 "Word has gone out to the companies over the heads of the starshyna: the whole host to assemble, every man with a vote, and the offices to be settled there rather than in the chamber. Such a council has been called before, and the men who called it did not all leave it alive. It would clear the benches at a stroke, and it would set the precedent that the host may clear them whenever it likes."
 ruthenian_decadence.14.a:0 "Let the black council sit and settle the offices."
 ruthenian_decadence.14.b:0 "Buy the starshyna's quiet before it convenes."
 ruthenian_decadence.2.a:0 "Purge the court"
 ruthenian_decadence.2.b:0 "Buy their loyalty"
 ruthenian_principality_reform:0 "Ruthenian Principality"
 ruthenian_principality_reform_desc:0 "The prince rules through negotiated obligations with appanage princes, boyars, and chartered towns. Local rights ease administration and bind subject lands to Kyiv in return for tribute and service."
 ruthenian_principality:0 "Ruthenian Principality"
 ruthenian_principality_desc:0 "The prince governs through the negotiated rights and duties of appanages, boyars, and chartered towns."
 desc_council_of_florence:0 "The act of union signed at Florence: one Church under Rome, with the eastern rite preserved for those who keep it."
 patriarch_engagement_reform:0 "Blessing of the Patriarch"
 patriarch_engagement_reform_desc:0 "A ruler's claim to the throne rests on God's favour, confirmed by the Patriarch. The crown must secure the Church's assent before taking power."
 euro_monarchy_reform:0 "Neo Monarchy"
 euro_monarchy_reform_desc:0 "The king must have the approval of the parliament to ascend to the throne, and holds little to no authority beyond directing the sessions of the rada."
 representation_monarchy_reform:0 "Crown and Estates"
 representation_monarchy_reform_desc:0 "By order of the new constitution, the king is now legally obliged to his citizens as supreme governor."
 rep_boyary:0 "Boyary"
 rep_knyazi:0 "Knyazi"
 principality_appanage:0 "Appanage Principality"
 principality_appanage_desc:0 "Granted to a junior prince of the dynasty, the udil appanage holds its lands by patrimonial right, mustering horse and foot for the senior prince while keeping local courts and estates."
 PRINCIPALITY_desc:0 "State order, including the rights and liberties governed by principalities."
 The_federal_army:0 "The Confederate Host"
 The_federal_army_desc:0 "Every land and estate of the confederation furnishes regiments and supplies to sustain the common host."
 Ruthenian_language_act:0 "The Ruthenian Language Act"
 Ruthenian_language_act_desc:0 "Chancery statutes ordain that courts, magistracies, and provincial registers conduct their business in the Ruthenian tongue."
 Great_levy_reforms:0 "Great Levy Reforms"
 Great_levy_reforms_desc:0 "Reformed regimental muster rolls replace scattered feudal obligations, lowering the cost of reinforcing our armies in the field."
 Integrating_the_great_expanse:0 "Integration of the Great Expanse"
 Integrating_the_great_expanse_desc:0 "A petition from the farthest districts can spend weeks on the road. Appoint officers there who may hear local pleas, collect dues and send the accounts to our chancery."
 Imperial_centralisation:0 "State Reorganization"
 Imperial_centralisation_desc:0 "Binding the appanage courts more closely to the grand-princely chancery eases the integration of subject principalities into the realm."
 princedom_title:0 "Princedom"
 princedom_title_plural:0 "Princedoms"
 princedom_long_desc:0 "A Rus fief subject. The princedom enjoys autonomy while still being a subject, but it comes at a high cost in terms of tax and levy. It must fight alongside its master, and it is never allowed to rebel."
 princedom_is_our:0 "$NAME|Y$ is our principality."
 IS_OUR_OVERLORD:0 "$NAME|Y$ is our Overlord."
 euro_monarchy.1t:0 "Purification of the Aristocracy"
 euro_monarchy.1d:0 "The reform has stripped the aristocracy of its old privileges. Peasant anger now turns against former lords, and in some towns the violence has forced local assemblies to take charge."
 euro_monarchy.1a:0 "May God have mercy on their souls."
 euro_monarchy.2t:0 "Reactionary Uprising"
 euro_monarchy.2d:0 "Many nobles have taken up arms against us in response to the neutral purge of the nobility, and they have occupied the capital, causing great destabilization as the government has been unable to function effectively."
 euro_monarchy.2a:0 "Is there still any hope for us?"
 euro_monarchy.3t:0 "The Battle for the Throne"
 euro_monarchy.3d:0 "The death of our beloved monarch has plunged our nation into chaos as rival factions struggle for control of the throne. The future of our country hangs in the balance as the various claimants vie for power and the support of the people."
 euro_monarchy.3a:0 "Whose claim to the throne is the strongest? Only time will tell, but for now, we must choose our alliances carefully and prepare for a long and bloody struggle."
 partia_soymu:0 "Sejm Party"
 partia_soymu_desc:0 "Mercantile magnates and guild elders champion river tolls, brokerage rights, and pragmatic diplomacy across the captaincy. The town wharf, the salt corridors and a seated diet raise their standing."
 partia_soymu_MECHANIC_TOOLTIP:0 "Sejm Party"
 partia_kapitaniv:0 "Captains' Party"
 partia_kapitaniv_desc:0 "Frontier officers and sotnia colonels demand fortified marches, hardened levies, and vigilant patrols to hold the Tysa line. Victories over equal foes, the arsenal at Palanok and the border dynasty pact raise their standing."
 partia_kapitaniv_MECHANIC_TOOLTIP:0 "Captains' Party"
 righteous_druzhyna:0 "Righteous Druzhyna"
 righteous_druzhyna_desc:0 "Seasoned retainers of the court receive service estates in return for standing ready in arms to defend the principality and the faith."
 sables_fields:0 "Sables and Fields"
 sables_fields_desc:0 "Fertile ploughlands and rich northern fur forests sustain hardy frontier households that fill our ranks in wartime."
 removed_nepotism:0 "Merit in the Chancery"
 removed_nepotism_desc:0 "Appointing judges, tax collectors, and commanders by proven service rather than family patronage curbs corruption across the divan."
 righteous_gift:0 "Princely Waqf Endowments"
 righteous_gift_desc:0 "Pious endowments and princely grants support scholars, judges, and local administrators trained to govern the realm."
 ruth_instituties.1:0 "The First Move"
 ruth_instituties.2:0 "Initial Attack"
 ruth_instituties.1t:0 "The First Move"
 ruth_instituties.2t:0 "Initial Attack"
 ruth_instituties.1d:0 "The Renaissance is already raging throughout Europe. The Ruthenian people will not remain silent, and all scientists and philosophers will consider the wiki to be the embodiment of human thought."
 ruth_instituties.2d:0 "The first Ruthenian printing house was founded in Ostroh Academy. Ivan Fedorovych has already translated the Holy Scriptures into the Ruthenian language, as well as the 'Bukvar'. This will increase the number of literate Ruthenians by a hundred."
 ruth_instituties.1a:0 "Revival in the Ruthenian"
 ruth_instituties.2a:0 "Ruthenian Reading"
 cossacks_terror_reform:0 "Cossack Independence"
 cossacks_terror_reform_desc:0 "The Cossacks have grown so powerful that they have broken off to form a country of their own, outside of our control."
 pannonia_control:0 "Control of Pannonia"
 pannonian_capital:0 "Pannonian Capital"
