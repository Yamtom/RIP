 nov_birch_bark_tradition_title:0 "Enact Birch Bark Literacy & Veche Law"
 nov_birch_bark_tradition_desc:0 "Expand the widespread birch bark literacy and legal records across Novgorod, ensuring our republican institutions and legal traditions flourish."
 nov_birch_bark_tradition_mod:0 "Birch Bark Literacy"
 desc_nov_birch_bark_tradition_mod:0 "Universal literacy among townspeople and widespread records inscribed on birch bark foster unprecedented innovation and citizen engagement."

 nov_north_slavic_consolidation_title:0 "Consolidate the Northern Slavic Union"
 nov_north_slavic_consolidation_desc:0 "Unify the northern lands under the leadership of Great Novgorod, binding the Pomor, Ladoga, and Pskov trade networks together."
 nov_north_slavic_consolidation_mod:0 "Northern Slavic Union"
 desc_nov_north_slavic_consolidation_mod:0 "A unified northern confederation masters the Baltic-White Sea trade routes, stimulating commercial wealth and civic pride."

 mos_volga_finnic_heritage_title:0 "Address the Volga-Finnic Substrate of Zalesye"
 mos_volga_finnic_heritage_desc:0 "The lands of Zalesye rest upon an ancient substrate of Merya, Muroma, and Meshchera peoples. We must determine how to govern this diverse frontier."
 mos_volga_finnic_synthesis:0 "Volga-Finnic Synthesis"
 desc_mos_volga_finnic_synthesis:0 "Embracing the forest skills, local customs, and metallurgy of the Volga-Finnic peoples strengthens regional defense and communal peace."
 mos_autocratic_russification:0 "Autocratic Russification"
 desc_mos_autocratic_russification:0 "Rigid central authority and forced uniformity strengthen military resolve at the cost of local frontier harmony."

 mansur_principality_legacy_title:0 "Acknowledge the Legacy of Mansur's Principality"
 mansur_principality_legacy_desc:0 "The Cossack settlements and strongholds founded by Mansur Mamayevich and his Glinski descendants on the Vorskla and Sula rivers form a vital bulwark against steppe incursions."
 mansur_cossack_outpost:0 "Mansur's Cossack Outpost"
 desc_mansur_cossack_outpost:0 "Formed by descendants of Mamai and local frontiersmen, this settlement provides tough cavalry and resilient border fortifications."

 jagoldai_darkness_autonomy_title:0 "Affirm the Autonomy of Jagoldai's Host"
 jagoldai_darkness_autonomy_desc:0 "The Tatar-Severian principality of Jagoldai Sarayevich safeguards the southern approaches of Kursk and Rylsk against steppe raiders."
 jagoldai_host_settlement:0 "Jagoldai Host Settlement"
 desc_jagoldai_host_settlement:0 "The warriors of Jagoldai's Darkness provide a permanent mounted vanguard and defensive depth on the upper Donets and Seym."
 jagoldai_tatar_cavalry:0 "Jagoldai Cavalry Vanguard"
 desc_jagoldai_tatar_cavalry:0 "Veteran horse archers from the border principalities bolster our armies with fierce steppe cavalry tactics."

 nov_veche_rule_in_zalesye:0 "Veche Governance in Zalesye"
 desc_nov_veche_rule_in_zalesye:0 "The abolition of autocratic princely courts in favor of municipal veche assemblies lowers unrest and fosters civic commerce."

 nov_flavor.1.t:0 "The Fall of Muscovite Autocracy"
 nov_flavor.1.d:0 "The autocratic throne of Moscow has yielded to the banners of Great Novgorod. The boyars and citizens of Zalesye gather before our envoys, awaiting the decree that will decide their fate. Shall we dismantle their princely tyranny and introduce veche assemblies, turn Moscow into a commercial factory, or absorb the land directly?"
 nov_flavor.1.a:0 "Dismantle tyranny and establish the Veche in Zalesye"
 nov_flavor.1.b:0 "Establish commercial trading factories"
 nov_flavor.1.c:0 "Incorporate the territory directly into the Republic"

 nov_flavor.2.t:0 "The Heritage of Zalesye"
 nov_flavor.2.d:0 "Centuries of coexistence between Slavic settlers and the indigenous Merya, Muroma, and Meshchera tribes have forged a distinct culture in the Volga-Oka mesopotamia. How shall we structure our state policy toward this frontier legacy?"
 nov_flavor.2.a:0 "Respect the forest customs and foster a harmonious synthesis"
 nov_flavor.2.b:0 "Impose central autocratic rule and linguistic uniformity"

 nov_flavor.10.t:0 "Birch Bark Literacy"
 nov_flavor.10.d:0 "From master merchants down to humble craftsmen and children, our citizens record debts, prayers, and family tidings upon sheets of birch bark. This ubiquitous literacy distinguishes our Northern Slavic realm from all rivals."
 nov_flavor.10.a:0 "Knowledge is our greatest asset"

 nov_flavor.11.t:0 "Consolidation of Northern Rus"
 nov_flavor.11.d:0 "The veches of Novgorod, Pskov, and Ladoga have ratified a perpetual compact. Our northern maritime trade now spans from the Gulf of Finland to the White Sea and the Urals."
 nov_flavor.11.a:0 "Long live the Northern Republic"

 mansur_flavor.1.t:0 "The Legacy of Mansur and the Glinski Princes"
 mansur_flavor.1.d:0 "Mansur Mamayevich, prince of the Glinski lineage, established towns and fortified outposts at Poltava and Lubny, welcoming both Tatars and Ruthenian frontiersmen into a shared martial brotherhood. Their descendants remain among the finest horsemen of the frontier."
 mansur_flavor.1.a:0 "Honor the steppe vanguard"

 jagoldai_flavor.1.t:0 "The Fortress of Jagoldai's Host"
 jagoldai_flavor.1.d:0 "Jagoldai Sarayevich established his autonomous host along the Seym and Psel rivers to defend our borderlands from Crimean and Golden Horde incursions. With our confirmation of their liberties, their riders pledge eternal vigilance on our southern frontier."
 jagoldai_flavor.1.a:0 "The southern marches are secure"

