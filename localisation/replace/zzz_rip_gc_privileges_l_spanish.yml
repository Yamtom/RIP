l_spanish:
# English text carried into this language until a translator takes it.

 rip_privilege_eastern_rite_eparchies:0 "Eastern-Rite Eparchies"
 rip_privilege_eastern_rite_eparchies_desc:0 "The crown keeps the Byzantine-rite bishops and their parishes as they are, under Rome but outside the jurisdiction of the Latin diocesans. This is what the Union of Brest promised its hierarchy and what Latin bishops did not always grant."
 rip_privilege_latin_rite_primacy:0 "Latin-Rite Primacy"
 rip_privilege_latin_rite_primacy_desc:0 "Latin diocesans oversee the Eastern parishes and press them toward Latin custom. The Synod of Zamosc in 1720 took this road. It gives the Latin hierarchy order and costs the crown the goodwill of the parishes."
 rip_privilege_brotherhood_charters:0 "Brotherhood Charters"
 rip_privilege_brotherhood_charters_desc:0 "Lay brotherhoods hold the Orthodox parishes and schools by charter, as the Dormition Brotherhood of Lviv did after its stauropegial privilege of 1586, and answer the Union parishes with books and preaching. The crown defends their rights against bishops who accepted Rome."
 rip_privilege_parish_concord:0 "Concord with the Union Parishes"
 rip_privilege_parish_concord_desc:0 "The crown lets Orthodox and Union parishes stand side by side and judges each dispute on its merits. Few rulers did so willingly; most were pushed to it by war or by neighbours."
 rip_privilege_roman_concordat:0 "Roman Concordat"
 rip_privilege_roman_concordat_desc:0 "The Union bishops hold their rite and offices by agreement with Rome, as the articles of Brest promised. The senate seats promised to them were never granted in full, so the crown has to press the point itself, and Rome repays it with a friendly hand."
 rip_privilege_eastern_ecumene:0 "Eastern Ecumene"
 rip_privilege_eastern_ecumene_desc:0 "The Union keeps its door open to Orthodox who share its liturgy: priests move between parishes and the bishops speak of reunion rather than victory. Rome watches the experiment with doubt."
 rip_privilege_basilian_schools:0 "Basilian Schools"
 rip_privilege_basilian_schools_desc:0 "The Basilian Order of St Josaphat, reformed from 1617, keeps the schools and monasteries of the Union, and the Barbareum in Vienna trained Greek Catholic clergy from 1774. The crown pays the teachers; the order supplies them."
 rip_privilege_synodal_courts:0 "Synodal Courts"
 rip_privilege_synodal_courts_desc:0 "Marriage, tithe and clerical disputes go to the eparchial synod instead of the royal courts. Order improves and the treasury loses fees."
