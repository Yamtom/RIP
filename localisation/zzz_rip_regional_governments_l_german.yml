 rip_rg_chr_staple_tt:0 "Choose an owned city; pay 50 DIP on confirmation.\nTarget land gains +5 Local Autonomy and Desna Staple Right (+15% Province Trade Power) for 10 years.\nInstitution shared term: 10 years."
 rip_rg_chr_militia_decision_title:0 "Muster the Guild Militia"
 rip_rg_chr_militia_decision_desc:0 "Choose a target; pay 50 MIL only on confirmation. Shared term: 10 years. Active country and province modifiers show expiry dates. Reform changes never refund the term."
 rip_rg_chr_militia_tt:0 "Choose an owned fort city; pay 50 MIL on confirmation.\nTarget land gains Guild Militia (+20% Local Defensiveness, -10% Local Production Efficiency) for 5 years.\nCountry gains Municipal Muster Rolls (-10% Reinforce Cost) for 3 years.\nInstitution shared term: 10 years."
