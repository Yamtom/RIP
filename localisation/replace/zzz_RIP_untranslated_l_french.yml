 khmelnytsky_military_response:0 "Khmelnytsky Military Response"
 khmelnytsky_military_response_desc:0 "We have mobilized our forces to suppress the rebel insurgency, though at great cost to our military capacity."
 khmelnytsky_moscow_support:0 "Khmelnytsky Moscow Support"
 khmelnytsky_moscow_support_desc:0 "We have accepted Muscovite assistance against the rebels, gaining military strength while becoming dependent on the tsar's will."
 khmelnytsky_negotiations:0 "Negotiations with the Cossacks"
 khmelnytsky_negotiations_desc:0 "We bargained with the Sich and regiments, trading concessions for fragile peace."
 khmelnytsky_revolt_active:0 "Khmelnytsky Revolt Active"
 khmelnytsky_revolt_active_desc:0 "The Cossack rebellion continues to rage, spreading unrest and destabilization throughout our realm."
 khmelnytsky_uprising:0 "Khmelnytsky Uprising"
 khmelnytsky_uprising_desc:0 "The great Cossack rebellion against Polish-Lithuanian rule has erupted. Led by the hetman Bohdan Khmelnytsky, masses of Cossacks, peasants, and Tatars have risen in arms, devastating vast swathes of Ukrainian territory. Cities burn, entire communities are slaughtered, and the very foundations of Polish authority crumble before the insurgent tide."
 khmelnytsky_uprising_title:0 "Khmelnytsky Uprising"
 kie_joined_confederation:0 "Joined the Kyivan Confederation"
 kie_refused_confederation:0 "Refused Confederation Invitation"
 knyazi:0 "Knyazi"
 knyazi_desc:0 "Dynastic princes: legitimacy, diplomacy, and fiscal stewardship, at the cost of military recovery focus."
 kru_confederation_balance:0 "Balance between Rada and Hetman"
 kru_confederation_balance_desc:0 "The Sich Rada still gathers to guard Cossack privileges, yet the hetman's bulava now commands lasting authority. Republican custom tempers the crown, legitimacy steadies the realm, and absolutist pretensions are kept in check."
 kru_confederation_established:0 "KRU Confederation Established"
 kuyaba_nation_desc:0 "Long ago, this land was known as Kuyaba, named by Abu Zayd al-Balhi. Once an economic and political center of tribes, it has since embraced Islam, guided by destiny to spread the faith far and wide."
 kuyaba_nation_title:0 "The Slavic Homeland Under Allah's Protection"
 kyiv_artisan_guilds_modifier:0 "Kyiv Artisan Guilds"
 kyiv_artisan_guilds_modifier_desc:0 "Well-organized guilds regulate craft production and maintain quality."
 kyiv_autonomy_guaranteed:0 "Kyiv Autonomy Guaranteed"
 kyiv_cesarstvo_path_desc:0 "Reject the Muscovite Tsardom model and proclaim a Cesarstvo focused on elite quality, institutions, and tall development."
 kyiv_cesarstvo_path_title:0 "Proclaim the Kyivan Cesarstvo"
 kyiv_charter_free_city_desc:0 "Grant a privileged charter to a Ruthenian market city, boosting commerce and burgher influence."
 kyiv_charter_free_city_title:0 "Charter a Free Trade City"
 kyiv_dnieper_history.1.a:0 "Invest heavily in river trade infrastructure."
 kyiv_dnieper_history.1.b:0 "Make moderate investments in trade."
 kyiv_dnieper_history.1.c:0 "Focus on military control of the river instead."
 kyiv_dnieper_history.1.d:0 "The Dnieper River has long been a vital artery of commerce, connecting the Baltic Sea to the Black Sea and beyond. Kyiv, situated on the high western bank, serves as a natural hub for this trade. Merchants from Scandinavia, Poland, Lithuania, the German cities, Muscovy, the Crimean Khanate, and even Constantinople pass through our lands.\n\nOur advisors propose establishing a formal trading network along the Dnieper, with warehouses, docks, and customs posts at key points. This would allow us to better regulate commerce, collect revenues, and strengthen our economic position in the region."
 kyiv_dnieper_history.1.t:0 "Establishing the Dnieper Trading Network"
 kyiv_dnieper_history.10.a:0 "Establish a printing press in Kyiv."
 kyiv_dnieper_history.10.b:0 "Import books from abroad instead."
 kyiv_dnieper_history.10.d:0 "The recent establishment of the Kyiv-Mohyla Academy has created demand for books and learning materials. Our scholars propose establishing a printing press in Kyiv to publish Orthodox religious texts, educational materials, chronicles, and other works.\n\nA printing press would spread literacy, preserve our cultural heritage, and establish Kyiv as a center of Orthodox publishing. The technology and expertise required, however, demand significant investment."
 kyiv_dnieper_history.10.t:0 "Orthodox Publishing and Printing in Kyiv"
 kyiv_dnieper_history.11.a:0 "Strengthen the Metropolitan's authority."
 kyiv_dnieper_history.11.b:0 "Maintain the current arrangement."
 kyiv_dnieper_history.11.d:0 "The Orthodox Metropolitan of Kyiv holds spiritual authority over millions of believers across our lands and beyond. Historically, the Kyiv metropolitanate was the center of Eastern Slavic Orthodoxy, though its authority has been challenged by the rise of the Moscow Patriarchate and pressure from Catholic Poland.\n\nOur advisors propose measures to strengthen the Metropolitan's authority—supporting the ecclesiastical hierarchy, funding church construction and restoration, and asserting Kyiv's historic role as the mother see of Rus' Orthodoxy."
 kyiv_dnieper_history.11.t:0 "Authority of the Kyiv Metropolitan"
 kyiv_dnieper_history.12.a:0 "Fortify Kyiv with modern defenses."
 kyiv_dnieper_history.12.b:0 "Build fortifications in multiple cities."
 kyiv_dnieper_history.12.c:0 "Create a chain of fortresses along the Dnieper."
 kyiv_dnieper_history.12.d:0 "The cities of the Dnieper region face constant military threats. Tatar raiders from the Crimea strike regularly, carrying off captives and plunder. The expanding power of Muscovy threatens from the east, while conflicts with Poland and Lithuania endanger our western borders.\n\nOur military advisors strongly recommend fortifying our key cities along the Dnieper. Modern fortifications—bastions, walls, moats, and citadels—would protect our urban centers and provide strong points for military operations."
 kyiv_dnieper_history.12.e:0 "Rely on Cossack warriors for defense."
 kyiv_dnieper_history.12.t:0 "Fortification of Dnieper Cities"
 kyiv_dnieper_history.13.a:0 "Organize local defense forces."
 kyiv_dnieper_history.13.b:0 "Launch a counter-raid into Tatar lands."
 kyiv_dnieper_history.13.c:0 "Pay tribute to avoid the raids."
 kyiv_dnieper_history.13.d:0 "Reports arrive of another Tatar raiding party crossing the steppe toward the Dnieper basin. Crimean raiders have long plagued our borderlands, seeking captives (yasyr) to sell in slave markets, as well as livestock, valuables, and whatever else they can seize.\n\nOur commanders must decide how to respond to this threat: organize local defense forces, launch a counter-raid into enemy territory, or attempt to buy off the raiders with tribute."
 kyiv_dnieper_history.13.t:0 "Tatar Raids on the Dnieper Region"
 kyiv_dnieper_history.2.a:0 "Welcome these foreign merchants to Kyiv."
 kyiv_dnieper_history.2.b:0 "Restrict foreign influence in our commerce."
 kyiv_dnieper_history.2.d:0 "Kyiv's reputation as a prosperous trading city has attracted merchants from distant lands. Greek and Armenian traders, experienced in commerce between Constantinople, the Black Sea, and Central Asia, have petitioned for the right to establish permanent trading quarters in our capital.\n\nThese foreign merchants bring valuable goods—silks, spices, wines, and precious metals—along with commercial expertise and connections to distant markets. However, granting them such privileges may displease our native merchants who fear foreign competition."
 kyiv_dnieper_history.2.t:0 "Greek and Armenian Merchants in Kyiv"
 kyiv_dnieper_history.3.a:0 "Organize and support the chumak trade."
 kyiv_dnieper_history.3.b:0 "Establish a state monopoly on salt."
 kyiv_dnieper_history.3.d:0 "For centuries, the chumaky—salt traders driving ox-drawn carts—have traveled the steppes between the salt deposits of the south and the cities of the Dnieper basin. These hardy merchants endure harsh conditions, constant danger from raiders, and months on the road to bring this essential commodity to our lands.\n\nSalt is crucial for preserving food, processing leather, and many other purposes. By organizing and supporting the chumak caravans, we can ensure a steady supply of this vital resource and profit from the trade."
 kyiv_dnieper_history.3.t:0 "The Chumak Salt Caravans"
 kyiv_dnieper_history.4.a:0 "Launch a major urban development project."
 kyiv_dnieper_history.4.b:0 "Allow gradual organic growth."
 kyiv_dnieper_history.4.c:0 "The city needs no special investment."
 kyiv_dnieper_history.4.d:0 "Kyiv, the Mother of Rus' Cities, continues to grow. The ancient Upper Town (Verkhnie Misto) around St. Sophia Cathedral houses our administration and churches, while the commercial Podil district along the river bank bustles with trade. Craftsmen, merchants, and peasants from surrounding lands are drawn to the city's opportunities.\n\nOur advisors propose a major urban development project to expand Kyiv's infrastructure—new streets, markets, workshops, defensive walls, and residential quarters. This would cement our capital's status as the premier city of the Dnieper region."
 kyiv_dnieper_history.4.t:0 "Urban Expansion of Kyiv"
 kyiv_dnieper_history.5.a:0 "Grant Magdeburg Law to Kyiv."
 kyiv_dnieper_history.5.b:0 "Grant rights to Chernihiv."
 kyiv_dnieper_history.5.c:0 "Grant rights to multiple cities."
 kyiv_dnieper_history.5.d:0 "The cities along the Dnieper—Kyiv, Chernihiv, Pereiaslav, and others—seek greater autonomy and rights to govern their internal affairs. They petition for Magdeburg Law, the Germanic legal system that grants cities self-government, their own courts, and economic privileges.\n\nGranting such rights would strengthen urban development and attract merchants, but it would also limit our direct control over these cities and displease the nobility who resent urban autonomy."
 kyiv_dnieper_history.5.e:0 "Refuse these urban privileges."
 kyiv_dnieper_history.5.t:0 "Magdeburg Rights for Dnieper Cities"
 kyiv_dnieper_history.6.a:0 "Support the formation of artisan guilds."
 kyiv_dnieper_history.6.b:0 "Maintain state control over production."
 kyiv_dnieper_history.6.d:0 "Kyiv's artisans—smiths, carpenters, weavers, tanners, jewelers, and many other craftsmen—have long operated independently. Now they seek to organize formal guilds to regulate their trades, maintain quality standards, set prices, and protect their interests.\n\nWell-organized guilds could enhance our city's productive capacity and reputation for quality goods. However, guild monopolies may also restrict competition and raise prices for consumers."
 kyiv_dnieper_history.6.t:0 "Artisan Guilds of Kyiv"
 kyiv_dnieper_history.7.a:0 "Encourage peasant settlement of the land."
 kyiv_dnieper_history.7.b:0 "Establish Cossack military settlements."
 kyiv_dnieper_history.7.c:0 "Grant lands to nobles for development."
 kyiv_dnieper_history.7.d:0 "The fertile lands along the Middle Dnieper remain sparsely populated. Vast stretches of productive chernozem soil, forests rich with timber and game, and strategic river access await development. Our treasury has the means to sponsor colonization of these territories.\n\nWe must decide who should lead this settlement: free peasants seeking land, Cossack warriors establishing military outposts, or nobles founding estates worked by peasant labor."
 kyiv_dnieper_history.7.t:0 "Colonization of the Middle Dnieper"
 kyiv_dnieper_history.8.a:0 "Invest in agricultural improvements."
 kyiv_dnieper_history.8.b:0 "Focus on grain export trade."
 kyiv_dnieper_history.8.d:0 "The black earth of the Middle Dnieper region is among the most fertile soil in the world. These chernozem lands can produce abundant harvests of wheat, rye, barley, and other crops with proper cultivation. Our agricultural advisors propose improvements to farming techniques, tools, and organization to maximize the productivity of our grain-growing regions.\n\nIncreased grain production would not only feed our population but also provide valuable exports to neighboring lands hungry for our surplus."
 kyiv_dnieper_history.8.t:0 "Development of Chernozem Agriculture"
 kyiv_dnieper_history.9.a:0 "Found the Kyiv-Mohyla Academy."
 kyiv_dnieper_history.9.b:0 "Foreign education is sufficient for our needs."
 kyiv_dnieper_history.9.d:0 "Orthodox education in our lands has long relied on scattered monastery schools and individual tutors. Metropolitan Petro Mohyla proposes establishing a proper academy in Kyiv—a center of higher learning that would combine Orthodox tradition with modern educational methods, including study of languages, philosophy, theology, rhetoric, and sciences.\n\nThe Kyiv-Mohyla Academy would train clergy, administrators, and scholars, elevating the cultural and intellectual life of our realm. However, such an institution requires substantial investment and may face opposition from those who view Western-style education with suspicion."
 kyiv_dnieper_history.9.t:0 "Foundation of Kyiv-Mohyla Academy"
 kyiv_ecclesiastical_authority:0 "Kyiv Ecclesiastical Authority"
 kyiv_ecclesiastical_authority_desc:0 "The Kyiv metropolitanate exercises strong spiritual authority."
 kyiv_establish_princedoms_desc:0 "Recast our vassals as Kyivan princedoms, granting them the rights and obligations of udil princes under Kyiv's seniority."
 kyiv_establish_princedoms_title:0 "Establish Kyivan Princedoms"
 kyiv_factional_ruthenia_desc:0 "Unite Ruthenian lands under a court of princes, boyars, and hetmans, balancing imperial cohesion with factional governance."
 kyiv_factional_ruthenia_title:0 "Form the Factional Ruthenia"
 kyiv_foreign_trading_quarters:0 "Kyiv Foreign Trading Quarters"
 kyiv_foreign_trading_quarters_desc:0 "Greek and Armenian merchants maintain permanent quarters in the city."
 kyiv_independence.1a:0 "Demand their loyalty."
 kyiv_independence.1b:0 "We cannot go beyond reason."
 kyiv_independence.1d:0 "After expelling the Lithuanians from our borders, the coalition began to crumble. If we wish to maintain regional supremacy, we must stay united."
 kyiv_independence.1t:0 "Independent Again"
 kyiv_independence.2a:0 "We shall respond promptly, of course."
 kyiv_independence.2b:0 "This is a minor violation of our sovereignty."
 kyiv_independence.2d:0 "How shall we respond to the demand letter from the Prince of Kyiv, which contained a clause demanding our loyalty?"
 kyiv_independence.2t:0 "Kyiv Demands Submission"
 kyiv_independence.3a:0 "Independence"
 kyiv_independence.3d:0 "We shall bring this union to a close, honoring the customs of the various families, tribes, and principalities of the past. Glory to God, Glory to Christ, Conversion of Enemies, and above all Glory to Rus."
 kyiv_independence.3t:0 "The Principality's Feudal Status"
 kyiv_mohyla_academy:0 "Kyiv-Mohyla Academy"
 kyiv_mohyla_academy_desc:0 "A renowned center of Orthodox learning and culture."
 kyiv_orthodox_metropolitanate:0 "Kyiv Orthodox Metropolitanate"
 kyiv_orthodox_metropolitanate_desc:0 "The seat of the Orthodox Metropolitan of Kyiv."
 kyiv_podil_expansion:0 "Kyiv Podil Expansion"
 kyiv_podil_expansion_desc:0 "The commercial Podil district has been significantly expanded."
 kyiv_shogunate.1.a:0 "Establish the Chernihiv Princedom"
 kyiv_shogunate.1.b:0 "Establish the Volhynian Princedom"
 kyiv_shogunate.1.c:0 "Establish the Podillian Princedom"
 kyiv_shogunate.1.d:0 "Not now"
 kyiv_shogunate.1.e:0 "Establish the Pereiaslav Princedom"
 kyiv_shogunate.1.f:0 "Establish the Halych Princedom"
 kyiv_shogunate.1.t:0 "The Kyivan Council of Princes"
 kyiv_shogunate_path_desc:0 "Restore Kyiv as the senior seat of Rus, binding semi-autonomous princes into a disciplined order of trade and war."
 kyiv_shogunate_path_title:0 "The Kyivan Seniorate"
 kyiv_summon_princes_desc:0 "Call a council of magnates and grant a domain as a princedom, binding a new house to Kyiv's seniority."
 kyiv_summon_princes_title:0 "Summon the Kyivan Princes"
 kyiv_trade_houses.1.a:0 "House of St. Michael in Kyiv"
 kyiv_trade_houses.1.b:0 "Chernihiv Grain Syndicate"
 kyiv_trade_houses.1.c:0 "Pereiaslav River Exchange"
 kyiv_trade_houses.1.d:0 "Merchants petition the court to charter a great trade house. We must choose the city that will host it."
 kyiv_trade_houses.1.e:0 "Halych Guild Hall"
 kyiv_trade_houses.1.f:0 "Not now"
 kyiv_trade_houses.1.t:0 "The Kyivan Trade Houses"
 kyiv_trade_houses.2.a:0 "Grant the charter"
 kyiv_trade_houses.2.d:0 "Burgher councils request a free-city charter to expand markets, lower tolls, and attract foreign factors."
 kyiv_trade_houses.2.t:0 "Charter a Free Trade City"
 kyivan_cesarstvo_reform:0 "Kyivan Cesarstvo"
 kyivan_cesarstvo_reform_desc:0 "An imperial Kyivan court focused on discipline, institutions, and high-quality statecraft."
 kyivan_rus_reform:0 "Kyivan Rus"
 kyivan_rus_reform_desc:0 "We must take learning from our ancestors, to do that we must restore the old ways of rule."
 kyivan_shogunate_reform:0 "Kyivan Seniorate"
 kyivan_shogunate_reform_desc:0 "Junior houses hold their udils and rule them as they see fit; Kyiv keeps the seniority, the levy and the trade. Seniority binds only as long as the next prince accepts it."
 land_of_forests:0 "Land of Forests"
 land_of_forests_desc:0 "Belarus is densely forested, from the Belovezhskaya Pushcha to countless smaller woodlands. Timber economy and defensive terrain define our strategic position."
 last_sich_survival:0 "§YThe last free Sich desperately resists imperial absorption§!"
 last_sich_survival_desc:0 "The New Sich survives under constant imperial pressure, maintaining autonomy through militarization and frontier resilience."
 last_sich_survival_yes:0 "§YLast Sich survival stance is active§!"
 left_bank_administration:0 "Left Bank Administration"
 left_bank_administration_desc:0 "Efficient administration of the Left Bank territories."
 left_bank_integration:0 "Left Bank Integration"
 left_bank_priority:0 "Left Bank Priority"
 legacy_of_vseslav:0 "Legacy of Vseslav the Sorcerer"
 legacy_of_vseslav_desc:0 "Prince Vseslav (1044-1101) defended Polotsk against Kyiv, Novgorod, and even Byzantine influence. His legendary resistance inspires our warriors and legitimizes our independence."
 legislative_rada_reform:0 "Legislative Rada"
 legislative_rada_reform_desc:0 "A magnificent parliament founded on the representation of the population, with our nation's monarch at its helm."
 liberator_of_constantinople:0 "Liberator of Constantinople"
 liberator_of_constantinople_desc:0 "We have liberated Constantinople and restored it to Orthodox rule!"
 liberator_of_jerusalem:0 "Liberator of Jerusalem"
 liberator_of_jerusalem_desc:0 "We have liberated the Holy Land and restored Jerusalem to Christian rule!"
 lightning_raid:0 "Lightning Raid"
 like_rus_nation_desc:0 "Even God cannot deny that we, the City of Kyiv, have the right to Kyivan Rus."
 like_rus_nation_title:0 "The Days of Kyivan Rus Are Over."
 limited_hetman_autonomy:0 "§RHetman authority severely curtailed by Russian oversight§!"
 limited_hetmanate_autonomy:0 "Limited Hetmanate Autonomy"
 lipka_tatar_cavalry_tradition:0 "Lipka Tatar Cavalry Tradition"
 lipka_tatar_cavalry_tradition_desc:0 "Our Lipka Tatar cavalry maintain their steppe warrior traditions, providing formidable mounted forces."
 lipka_tatar_garrison:0 "Lipka Tatar Garrison"
 lipka_tatar_garrison_desc:0 "Lipka Tatars loyal to the Commonwealth provide garrison duties and local defense."
 lipka_tatar_privileges:0 "Lipka Tatar Privileges"
