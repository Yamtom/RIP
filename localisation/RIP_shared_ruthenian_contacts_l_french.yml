l_french:
 rip_rus_kyiv_scribes_title:0 "Scribes de Kyiv"
 rip_rus_kyiv_scribes_desc:0 "Invitons des scribes de Kyiv à notre cour. Un accord avec le souverain de la ville permettra le passage de leurs manuscrits."
 rip_rus_copy_ruthenian_books_title:0 "Les copistes"
 rip_rus_copy_ruthenian_books_desc:0 "Réservons une salle aux copistes dans une église de la capitale. Nos contacts à Lviv ou en Volhynie pourront leur fournir des manuscrits ruthènes."
 rip_rus_ruthenian_press_title:0 "Presse ruthène"
 rip_rus_ruthenian_press_desc:0 "Réunissons copistes et imprimeurs dans la capitale. Grâce aux presses et à la route de Kyiv, les livres toucheront davantage de lecteurs."
 rip_pol_carpathian_passes_title:0 "Cols des Carpates"
 rip_pol_carpathian_passes_desc:0 "Assurons le passage entre Halytch et le Maramureș pour que les marchands rusyns puissent transporter sel et bétail à travers les montagnes."
 rip_pol_rusyn_fairs_title:0 "Foires rusynes"
 rip_pol_rusyn_fairs_desc:0 "Équipons les marchés de Halytch et de Peremychl. Les marchands qui descendent des cols ont besoin d'étals, de balances et d'entrepôts."
 rip_pol_lviv_charters_title:0 "Chartes de Lviv"
 rip_pol_lviv_charters_desc:0 "Confirmons à Lviv les péages et les droits des marchands montagnards. La charte d'une ville prospère fera autorité des deux côtés des cols."
 rip_tat_ruthenian_yarlyks_title:0 "Yarlyks ruthènes"
 rip_tat_ruthenian_yarlyks_desc:0 "Les princes de la Rus' se rendaient jadis à Saraï pour obtenir les chartes qui confirmaient leur trône, et ils les payaient. Que nous tenions les terres ruthènes ou leurs princes comme sujets, le même marché peut être conclu de nouveau."
 rip_tat_ruthenian_tribute:0 "Tribut ruthène"
 desc_rip_tat_ruthenian_tribute:0 "Le tribut et les droits de charte des terres ruthènes remplissent le trésor et rehaussent notre rang."
 rip_hab_galician_ruthenians_title:0 "Ruthènes de Galicie"
 rip_hab_galician_ruthenians_desc:0 "Les paroisses de rite oriental de la Ruthénie rouge relèvent désormais de Vienne. Leurs prêtres ont besoin d'écoles, leurs évêques d'être entendus, et une monarchie qui veut la loyauté des villages doit les rencontrer dans leur propre Église."
 rip_hab_ruthenian_clergy:0 "Clergé ruthène"
 desc_rip_hab_ruthenian_clergy:0 "Des prêtres de rite oriental formés dans les séminaires de la monarchie portent l'autorité de la Couronne jusque dans les villages ruthènes."
 rip_hab_galician_ruthenians_classic_title:0 "$rip_hab_galician_ruthenians_title$"
 rip_hab_galician_ruthenians_classic_desc:0 "$rip_hab_galician_ruthenians_desc$"
