 rip_eparchy.4.a:0 "Adopt the Greek Catholic name"
 rip_eparchy.4.b:0 "Refuse the new name"
 rip_eparchy.5.t:0 "A Metropolitan for Galicia"
 rip_eparchy.5.d:0 "The emperor asked Rome to restore the Galician metropolitanate, and the bull of 22 February 1807 did so. Anhelovych was installed in 1808, with Lviv and Peremyshl as its two eparchies.\n\nThe restored metropolitan see rises at Lviv, extending shared dignity to a Greek Catholic Peremyshl. Acceptance protects the rite from missionary conversion and makes Lviv a metropolitan see (+15% local institution spread, -10% local development cost, -20% local state maintenance) for twenty years. A Greek Catholic Peremyshl receives the diocese and the protection as well. If the crown declines, the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Rome grants the title; the treasury still pays for the see."
 rip_eparchy.5.l:0 "The emperor asked Rome to restore the Galician metropolitanate, and the bull of 22 February 1807 did so. Anhelovych was installed in 1808, with Lviv and Peremyshl as its two eparchies. Although that hour has passed without a settlement, the question of the eparchy remains unsettled before the crown.\n\nThe restored metropolitan see rises at Lviv, extending shared dignity to a Greek Catholic Peremyshl. Acceptance protects the rite from missionary conversion and makes Lviv a metropolitan see (+15% local institution spread, -10% local development cost, -20% local state maintenance) for twenty years. A Greek Catholic Peremyshl receives the diocese and the protection as well. If the crown declines, the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Rome grants the title; the treasury still pays for the see."
 rip_eparchy.5.a:0 "Ask Rome to restore the see"
 rip_eparchy.5.b:0 "Leave the see as it is"
