l_french:
 rip_gov_review_municipal_title:0 "Review the Municipal Charters"
 rip_gov_review_municipal_desc:0 "The town courts hold their charters, but the treasury still asks for an account. Settle the next ten years of municipal duties. Each settlement costs 50 ducats and 50 administrative or diplomatic power. Only one institutional review may be in force throughout the country."
 rip_gov_review_chancery_title:0 "Review the Chancery Rolls"
 rip_gov_review_chancery_desc:0 "The chancery must choose between closer scrutiny of service and the confirmation of local rights. Each ten-year settlement costs 50 ducats and 50 administrative or diplomatic power. It shares its term with municipal and military reviews."
 rip_gov_review_register_title:0 "Review the Cossack Register"
 rip_gov_review_register_desc:0 "The officers ask who must answer the muster and who may remain on the land. Each ten-year settlement costs 50 ducats and 50 military or diplomatic power. It shares its term with municipal and chancery reviews."
 rip_gov_review_cooldown_tt:0 "Ten years have passed since the last institutional review. Changing a reform does not shorten this term."
 rip_gov_review.1.t:0 "The Charters and the Accounts"
 rip_gov_review.1.d:0 "The burmistrs bring sealed copies of their charters; the treasury brings a list of unpaid dues. Town courts can be left to settle their own revenues, or clerks can examine each account for the crown. Either settlement will bind the next ten years. The scribes will charge for both."
 rip_gov_review.1.a:0 "Confirm the municipal charters"
 rip_gov_review.1.b:0 "Examine the town accounts"
 rip_gov_review.2.t:0 "Service Entered in the Rolls"
 rip_gov_review.2.d:0 "Petitions crowd the chancery. One office asks for proof of service, another for confirmation of customary rights. A closer reckoning may recover dues; a clear statement of local liberties may settle disputes. Neither can be written without hearing the men whose names are on the roll."
 rip_gov_review.2.a:0 "Examine the service rolls"
 rip_gov_review.2.b:0 "Confirm the local rights"
 rip_gov_review.3.t:0 "The Next Muster"
 rip_gov_review.3.d:0 "The register names the men who owe service, but fields and households also demand their labour. The officers propose a stricter muster with regular allowances. The delegates ask for a settled share of men to remain at home. The register cannot promise both."
 rip_gov_review.3.a:0 "Pay for the full muster"
 rip_gov_review.3.b:0 "Settle the service obligations"
 rip_gov_review.cancel:0 "Leave the rolls as written"
 rip_gov_municipal_charters:0 "Confirmed Municipal Charters"
 desc_rip_gov_municipal_charters:0 "Town courts keep their fiscal privileges for this term. This settlement ends if the municipal reform is removed."
 rip_gov_municipal_accounts:0 "Examined Municipal Accounts"
 desc_rip_gov_municipal_accounts:0 "Treasury clerks scrutinise town revenues for this term, at the expense of the burmistrs' goodwill."
 rip_gov_chancery_service:0 "Examined Service Rolls"
 desc_rip_gov_chancery_service:0 "The chancery checks the service owed on each tenure. The holders have little affection for the new accounts."
 rip_gov_chancery_rights:0 "Confirmed Local Rights"
 desc_rip_gov_chancery_rights:0 "Written confirmation settles disputed rights, though some dues remain in local hands."
 rip_gov_register_muster:0 "Funded Cossack Muster"
 desc_rip_gov_register_muster:0 "More registered men answer the muster, with their allowances charged to the treasury."
 rip_gov_register_settlement:0 "Settled Cossack Obligations"
 desc_rip_gov_register_settlement:0 "A share of registered households remains on the land. Fewer men can be called to war during this term."
