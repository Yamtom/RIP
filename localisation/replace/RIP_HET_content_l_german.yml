 het_enhanced.2.a:0 "Grant the Starshyna their privileges."
 het_enhanced.2.b:0 "The Hetman answers to no oligarchs!"
 het_enhanced.2.d:0 "The Starshyna—the Cossack officer class—have evolved into a wealthy landed nobility. They demand formal recognition of their privileges, including hereditary estates, tax exemptions, and greater political power. Granting these demands would transform the Hetmanate into an oligarchy, but refusing risks their rebellion."
 het_enhanced.2.t:0 "Starshyna Oligarchy Demands"
 het_enhanced.3.a:0 "Prioritize the Left Bank—Russia is our protector."
 het_enhanced.3.b:0 "Maintain unity of both banks at all costs."
 het_enhanced.3.c:0 "Focus on the Right Bank—Poland offers more autonomy."
 het_enhanced.3.d:0 "The Hetmanate straddles the Dnieper River, divided between Left Bank (under Russian influence) and Right Bank (contested with Poland). The Andrussovo Treaty formalized this division, but we must decide where to concentrate our resources and political attention. This choice will determine our alignment for decades to come."
 het_enhanced.3.t:0 "Left Bank or Right Bank?"
 het_enhanced.4.a:0 "Accept the Russian candidate—pragmatism prevails."
 het_enhanced.4.b:0 "We elect our own Hetman! Our autonomy is not negotiable!"
 het_enhanced.4.d:0 "The Tsar's agents arrive at the Rada with a 'recommendation' for our next Hetman—a candidate loyal to Moscow who will ensure compliance with Russian interests. We can accept this interference to preserve good relations, or assert our autonomy by electing our own choice, risking Russian displeasure."
 het_enhanced.4.t:0 "Russian Interference in Elections"
 het_enhanced.5.a:0 "Ally with Sweden—independence or death!"
 het_enhanced.5.b:0 "Remain loyal to Russia. Mazepa's gambit is madness."
 het_enhanced.5.d:0 "Hetman Ivan Mazepa faces an impossible choice. The Great Northern War rages, and Sweden's Charles XII offers alliance against Russia. This could be our chance for true independence—but if Sweden loses, the consequences will be catastrophic. The fate of the Hetmanate hangs on this decision."
 het_enhanced.5.t:0 "The Mazepa Crisis: Swedish Alliance?"
 het_enhanced.6.a:0 "Accept the Collegium. Resistance is futile."
 het_enhanced.6.b:0 "We will not bow to Russian bureaucrats!"
 het_enhanced.6.d:0 "Tsar Peter establishes the Little Russian Collegium—a Russian oversight body that will supervise the Hetman's decisions and gradually absorb our autonomy into the imperial administration. This is the beginning of the end of Hetmanate independence. Do we accept this subjugation, or resist?"
 het_enhanced.6.t:0 "The Little Russian Collegium"
 het_enhanced.7.a:0 "Accept abolition. The Hetmanate's time has passed."
 het_enhanced.7.b:0 "Fight for our freedom! War against the Empire!"
 het_enhanced.7.c:0 "Negotiate for limited cultural and administrative autonomy."
 het_enhanced.7.d:0 "Catherine II has issued the decree: the office of Hetman is abolished. The Hetmanate will be dissolved and fully integrated into the Russian Empire as Little Russia Governorate. Our centuries-old Cossack autonomy ends today—unless we are willing to fight for it."
 het_enhanced.7.t:0 "Abolition of the Hetmanate"
 het_enhanced.8.a:0 "Revive ancient Cossack liberties"
 het_enhanced.8.b:0 "Reform along Western court lines"
 het_enhanced.8.d:0 "Having outlasted the threat of abolition, the Hetmanate stands at a crossroads. Shall we restore the old Cossack liberties and frontier order, or adopt Western European court administration and standing regiments?"
 het_enhanced.8.t:0 "Cossack Revival Movement"
 HET_establish_capital_desc:0 "A Host that keeps a chancery, an archive and a treasury needs walls to keep them behind. Kyiv carries the metropolitan see, Chyhyryn the hetman's own estates. Whichever is chosen, the Rada will meet less often once the clerks are housed."
 HET_establish_capital_title:0 "The Hetman's Capital"
 het_establish_printing_press_desc:0 "A press of our own would set the liturgy and the statutes in our own recension and end the buying of books from Lviv on Latin terms. The censors of three realms will take an interest."
 het_establish_printing_press_title:0 "Establish Printing Press"
 het_establish_regiments_desc:0 "Dividing our territory into military regiments will create an efficient administrative structure and strengthen our military readiness."
 het_establish_regiments_title:0 "Establish Regimental System"
 HET_exiles_and_freedom_seekers:0 "No Longer Exiled"
 HET_exiles_and_freedom_seekers_desc:0 "The Hetmanate's lands are distinct from those of the Holy Roman Empire, Russia, or Ottoman Empire. As a result, many exiles and freedom seekers flock to our country, and we can use our ties in other countries to bolster our own numbers and undermine our rivals."
 het_expand_academy_desc:0 "In 1632, Metropolitan Petro Mohyla united the Kyiv Caves and Brotherhood schools into a celebrated collegium. Elevating it into a fully chartered Academy with hetman patronage and high academic privileges crowns Kyiv as the intellectual capital of the Cossack state and the Orthodox world."
 het_expand_academy_title:0 "Charter the Kyiv-Mohyla Academy"
 HET_final_hetman_desc:0 "The last hetman signs in French, visits his regiments seldom, and asks that the office be made hereditary in his house. The request will be answered by abolishing the office."
 HET_final_hetman_title:0 "Rozumovsky - Last of the Hetmans"
 het_flavor.1.a:0 "Elect the military commander"
 het_flavor.1.b:0 "Elect the diplomat"
 het_flavor.1.c:0 "Elect the administrator"
 het_flavor.1.d:0 "The position of Hetman - the elected leader of the Cossack Hetmanate - must be filled. The starshyna (officer class) and colonels of the regiments gather to choose our new leader. Three candidates stand out: a brilliant military commander, a skilled diplomat with foreign connections, and an experienced administrator."
 het_flavor.1.t:0 "Election of the Hetman"
 het_flavor.10.a:0 "Strengthen the Orthodox church"
 het_flavor.10.b:0 "Balance church and state"
 het_flavor.10.d:0 "Kyiv has historically been the center of Orthodox Christianity in Rus'. The Metropolitan of Kyiv holds immense spiritual authority, and control over the church brings both legitimacy and political power. Should we strengthen the church's role in our state, or maintain clearer separation between spiritual and temporal authority?"
 het_flavor.10.t:0 "The Orthodox Metropolia"
 het_flavor.11.a:0 "Expand grain exports"
 het_flavor.11.b:0 "Ensure domestic food security"
 het_flavor.11.d:0 "The Hetmanate's rich black soil produces abundant grain harvests. Access to Black Sea ports allows us to export this grain to Constantinople, enriching our treasury. However, focusing on export agriculture may leave us vulnerable to crop failures and market fluctuations."
 het_flavor.11.t:0 "The Grain Trade"
 het_flavor.12.a:0 "Accept Russian control"
 het_flavor.12.b:0 "Resist quietly and preserve what we can"
 het_flavor.12.d:0 "Tsar Peter I has placed a Little Russian Collegium of imperial officers above the Hetmanate's administration. It will audit revenues, hear appeals and counter the authority of the starshyna. The hetman and regimental order remain, but their room to govern is sharply narrowed."
 het_flavor.12.t:0 "The Little Russian Collegium"
 het_flavor.13.a:0 "Support Russia fully"
 het_flavor.13.b:0 "Provide minimal support"
 het_flavor.13.d:0 "Russia is at war with the Ottoman Empire, and the Hetmanate is expected to contribute troops and resources to the Russian war effort. While defeating the Turks serves our interests, exhausting ourselves in Russia's wars weakens our position and drains our treasury."
 het_flavor.13.t:0 "The Russian-Turkish Wars"
 het_flavor.14.a:0 "There is nothing we can do..."
 het_flavor.14.b:0 "Fight to the last!"
 het_flavor.14.d:0 "Catherine II has issued her final decree: the Hetmanate is abolished, and our lands will be fully integrated into the Russian Empire. After over a century of autonomy, Cossack self-government ends. Our regiments are disbanded, our privileges revoked, and Ukraine becomes merely another province of Russia."
 het_flavor.14.t:0 "Abolition of the Hetmanate"
 het_flavor.2.a:0 "A great day for Ukrainian learning!"
 het_flavor.2.d:0 "Metropolitan Petro Mohyla has founded an academy in Kyiv that will become the leading center of Orthodox learning in Eastern Europe. The Academy teaches theology, philosophy, rhetoric, and sciences, blending Orthodox tradition with European scholastic methods. This institution will train generations of Ukrainian intellectuals and strengthen our own customs."
 het_flavor.2.t:0 "Foundation of Kyiv-Mohyla Academy"
 het_flavor.3.a:0 "Sign the treaty with Russia"
 het_flavor.3.b:0 "Continue fighting alone"
 het_flavor.3.d:0 "After years of devastating war with Poland, Hetman Bohdan Khmelnytsky has convened a council at Pereiaslav. The Russian Tsar offers military protection and recognition of our autonomy in exchange for vassalage. Many see this as our only hope for survival, though some fear it means exchanging Polish overlordship for Russian. The fate of the Hetmanate hangs in the balance."
 het_flavor.3.t:0 "The Pereiaslav Council (1654)"
 het_flavor.4.a:0 "Strengthen the regimental system"
 het_flavor.4.b:0 "Centralize under the Hetman"
 het_flavor.4.d:0 "The Hetmanate is organizing its territory into military-administrative units called regiments (polky). Each regiment encompasses several cities and towns, with a colonel commanding both civil and military affairs. This system combines Cossack military traditions with effective territorial administration."
 het_flavor.4.t:0 "The Regimental System"
 het_flavor.5.a:0 "Compromise with the starshyna"
 het_flavor.5.b:0 "Assert Hetman authority"
 het_flavor.5.c:0 "Call a general council to resolve this"
 het_flavor.5.d:0 "The starshyna - the Cossack officer class - have grown wealthy and powerful, resembling a traditional nobility. They resist the Hetman's attempts to centralize power, demanding greater privileges and local autonomy. This conflict between centralization and local rights threatens to tear the Hetmanate apart."
 het_flavor.5.t:0 "Starshyna Opposition"
 het_flavor.6.a:0 "Support Mazepa's reforms"
 het_flavor.6.b:0 "Maintain traditional liberties"
 het_flavor.6.d:0 "Hetman Ivan Mazepa's patronage has crowned Kyiv and Baturyn with baroque churches, enlarged the Kyiv-Mohyla Academy, and brought brisk silver into the treasury, though rival starshyna mutter against his growing authority."
 het_flavor.6.t:0 "Mazepa's Golden Age"
 het_flavor.7.a:0 "Swear renewed loyalty to Russia"
 het_flavor.7.b:0 "Face the consequences of rebellion"
 het_flavor.7.d:0 "Hetman Mazepa's alliance with Sweden against Russia has ended in catastrophic defeat at Poltava. The Russian army has crushed the Swedish-Cossack forces, and Tsar Peter I exacts brutal revenge. Many of our cities are burned, thousands killed, and the Hetmanate's autonomy severely curtailed. This is the darkest hour in our history."
 het_flavor.7.t:0 "The Battle of Poltava (1709)"
 het_flavor.8.a:0 "Develop the Left Bank"
 het_flavor.8.b:0 "Focus on the Right Bank"
 het_flavor.8.c:0 "Balance both regions"
 het_flavor.8.d:0 "The Hetmanate is divided by the Dnieper River into two distinct regions. The Left Bank remains under our control with Russian protection, while the Right Bank has returned to Polish rule. This division weakens our nation and separates Ukrainian families. Should we focus on strengthening what we control, or attempt to reunify both banks?"
 het_flavor.8.t:0 "Left Bank vs Right Bank"
 het_flavor.9.a:0 "Encourage free settlements"
 het_flavor.9.b:0 "Establish military colonies"
 het_flavor.9.d:0 "The Sloboda Ukraine region offers opportunities for colonization. Free Cossack settlements (slobody) can be established here with special privileges to attract settlers fleeing serfdom. These communities will strengthen our frontier and increase our population, though they may prove difficult to control."
 het_flavor.9.t:0 "Sloboda Ukraine Settlement"
 het_forced_integration:0 "Forced Integration"
 het_forced_levies:0 "Forced Military Levies"
 HET_foreign_alliance_politics:0 "Alliance Politics"
 HET_foreign_alliance_politics_desc:0 "The Hetmanate must carefully navigate between Poland, Muscovy, and other powers to maintain autonomy."
 het_foreign_backing:0 "Foreign-Backed Claimant"
 het_fortified_sich:0 "Fortified Sich"
 het_found_brotherhood_collegium_desc:0 "Before the seventeenth-century reforms of Petro Mohyla, the Orthodox burghers and clergy of Kyiv formed brotherhoods to defend their confession and letters. Expanding the Epiphany school into a collegiate foundation provides our youth with humanist and theological training."
 het_found_brotherhood_collegium_title:0 "Establish the Kyiv Brotherhood Collegium"
 het_free_cossacks:0 "Free Cossacks"
 het_grain_trade:0 "Grain Trade Partnership"
 het_hadiach_reform:0 "Hadiach Reform"
 het_hereditary_rule:0 "Hereditary Hetmanate"
 HET_hetman_authority:0 "Hetman Authority"
 HET_hetman_authority_desc:0 "The hetman's authority flows from both Cossack military election and princely statecraft, uniting the bulava with lasting executive command."
 HET_HETMAN_AUTOCRAT:0 "Autocrat Hetman"
 HET_HETMAN_ELECTED:0 "Elected Hetman"
 het_hetman_for_life_reform:0 "Hetman for Life"
 het_hetman_for_life_reform_desc:0 "Following Bohdan Khmelnytsky's precedent, the Hetman becomes an elected-but-permanent ruler rather than a rotating officer. This creates dynastic ambitions and allows long-term state-building, transforming the Hetmanate from rule of the war council to monarchical autocracy."
 HET_HETMAN_LIFE:0 "Hetman for Life"
 HET_HETMAN_RESTRICTED:0 "Restricted Hetman"
 HET_ideas:0 "Hetmanate's Ideas"
 HET_ideas_bonus:0 "Hetmanate's Ambitions"
 HET_ideas_start:0 "Hetmanate's Traditions"
 het_independence_struggle:0 "Independence Struggle"
 het_independence_struggle_desc:0 "We fight to break free from foreign domination."
 het_independent_state:0 "Independent Hetmanate"
 het_integrate_moldova_desc:0 "Fully integrate Moldova into the Hetmanate after years of vassalage."
 het_integrate_moldova_title:0 "Integrate Moldova"
 het_joined_confederation:0 "Joined the Kyivan Confederation"
 het_khmelnytsky_uprising_desc:0 "The great Hetman Bohdan Khmelnytsky rallies the Cossack Host to throw off the Polish yoke and defend Orthodox Ruthenia."
 het_khmelnytsky_uprising_title:0 "Rise of Khmelnytsky"
 het_khmelnytsky_uprising_tt:0 "The Khmelnytsky Uprising begins, granting powerful military bonuses and claims across Ruthenia."
 HET_kleinody:0 "Kleinody!"
 HET_kleinody_desc:0 "The Kleinody, a type of imperial regalia, are prestigious objects for the Zaporozhian Host, and only a few ever obtain them. Holding a Kleinody grants an officer status, with different ranks for different types. The most prestigious is the 'bulawa', or mace carried by the Kish. The longer we keep these heirlooms of the past, the more prestigious we will be in the eyes of future generations and foreigners."
 HET_kyiv_academy_desc:0 "Metropolitan Mohyla's academy teaches theology in Greek and Latin both, and its graduates fill the chancery as readily as the pulpit. Under our protection it draws students from Moldavia to Muscovy, and answers the Latin colleges in their own tongue. A realm is held by its scribes no less than by its sabres."
 HET_kyiv_academy_title:0 "The Kyiv-Mohyla Academy"
 het_kyiv_mazepa_golden_age:0 "Mazepa's Kyiv"
 het_kyiv_russian_protection:0 "Kyiv under Russian Protection"
 het_last_struggle:0 "Last Stand of Freedom"
 het_left_bank_admin_desc:0 "The Left Bank of the Dnieper must be organized into an efficient administrative system to maximize its potential."
 het_left_bank_admin_title:0 "Establish Left Bank Administration"
 het_left_bank_loyalty:0 "Left Bank Loyalty"
 het_left_bank_settled:0 "Left Bank Settled"
 het_left_bank_settled_desc:0 "The Left Bank of the Dnieper has been successfully colonized."
 HET_left_bank_settlers:0 "Left-Bank Settlers"
 HET_left_bank_settlers_desc:0 "Refugees and colonists settle the Left Bank of the Dnieper, providing both manpower and agricultural development."
 het_legacy_chronicle_administration:0 "Chronicle of Administration"
 het_legacy_chronicle_commonwealth:0 "Constitutional Commonwealth Legacy"
 het_legacy_chronicle_cultural_patronage:0 "Cultural Patronage Legacy"
 het_legacy_chronicle_reconciliation:0 "Chronicle of Reconciliation"
 het_legacy_chronicle_regimental_state:0 "Regimental State Legacy"
 het_legacy_collegium_reviewed:0 "Collegium Legacy Reviewed"
 het_legacy_eras.1.a:0 "Canonize the Khmelnytsky military legacy"
 het_legacy_eras.1.b:0 "Codify early host institutions"
 het_legacy_eras.1.d:0 "Our old registers preserve names from Lyantskoronsky and Sahaidachny to Bohdan Khmelnytsky. The chronicles can frame this era either as a revolutionary military tradition or as the institutional foundation of Hetman authority."
 het_legacy_eras.1.t:0 "The Earliest Era of the Host"
 het_legacy_eras.2.a:0 "Reconcile the officer factions"
 het_legacy_eras.2.b:0 "Impose regimental discipline"
 het_legacy_eras.2.d:0 "The succession struggles after Khmelnytsky - from Vyhovsky to Briukhovetsky and Samoylovych - fractured the polity. We must choose whether to prioritize reconciliation or enforce discipline through regimental centralization."
 het_legacy_eras.2.t:0 "Lessons of the Ruina"
 het_legacy_eras.3.a:0 "Emphasize Mazepa's renaissance"
 het_legacy_eras.3.b:0 "Emphasize military statecraft"
 het_legacy_eras.3.d:0 "Mazepa's period remains the central dispute in our memory: cultural renaissance and diplomacy, or military concentration and state coercion. The chronicles must choose a dominant interpretation."
 het_legacy_eras.3.t:0 "The Mazepa Question"
 het_legacy_eras.4.a:0 "Preserve autonomy first"
 het_legacy_eras.4.b:0 "Reform the administration"
 het_legacy_eras.4.d:0 "From Skoropadsky to Apostol and Rozumovsky, governance increasingly passed through collegial forms and imperial constraints. We can treat this as a warning about dependency, or as a model for disciplined state administration."
 het_legacy_eras.4.t:0 "Collegium and Administration"
 het_legacy_eras.5.a:0 "A constitutional Cossack commonwealth"
 het_legacy_eras.5.b:0 "A regimental military state"
 het_legacy_eras.5.c:0 "A patronage and education state"
 het_legacy_eras.5.d:0 "The chronicles are complete. Their final chapter will shape which institutions endure: constitutional commonwealth practice, regimental military statehood, or long-term cultural patronage."
 het_legacy_eras.5.t:0 "Final Legacy of the Hetmanate"
 het_legacy_eras.6.a:0 "Record Pereiaslav as a negotiated autonomy"
 het_legacy_eras.6.b:0 "Record Pereiaslav as a warning of dependency"
 het_legacy_eras.6.d:0 "The treaty settlement at Pereiaslav is still contested in our political memory. One reading treats it as a negotiated compact that preserved room for Cossack autonomy; another frames it as a hard lesson that dependence invites permanent military pressure."
 het_legacy_eras.6.t:0 "Pereiaslav Reconsidered"
 het_legacy_eras.7.a:0 "Preserve the cultural and diplomatic legacy"
 het_legacy_eras.7.b:0 "Preserve the military-political legacy"
 het_legacy_eras.7.d:0 "The Mazepa era can be codified either as a cultural high point of elite patronage, schools, and diplomacy, or as proof that state survival depends on a disciplined military center ready for great-power conflict."
 het_legacy_eras.7.t:0 "Mazepa in State Memory"
 het_legacy_eras.8.a:0 "Codify a durable administrative model"
 het_legacy_eras.8.b:0 "Codify a negotiated host model"
 het_legacy_eras.8.d:0 "The later collegial administration and imperial constraints must now be given their final place in the chronicles. We can codify this chapter as a template for durable state administration, or as a cautionary case that strengthens negotiated host governance."
 het_legacy_eras.8.t:0 "Collegium and Final Codification"
 het_legacy_eras_completed:0 "Hetmanate Legacy Eras Completed"
 het_legacy_mazepa_reviewed:0 "Mazepa Legacy Reviewed"
 het_legacy_pereiaslav_reviewed:0 "Pereiaslav Legacy Reviewed"
 het_legendary_raid:0 "Legendary Raid"
 het_liberation_achieved:0 "Liberation of Ruthenia"
 het_little_russian_collegium:0 "Little Russian Collegium"
 het_mazepa_independence_desc:0 "Cast off foreign overlordship and raise the Hetmanate's banners in an open bid for sovereignty."
 het_mazepa_independence_title:0 "Break with Overlord"
 HET_mazepa_reform_desc:0 "The hetman endows churches in the new manner, keeps a Latin secretary and a court that would not shame Warsaw. Baroque masonry rises over the Dnieper, and the starshyna who pay for it expect their estates confirmed in return."
 HET_mazepa_reform_title:0 "Mazepa's Renaissance"
 het_mazepa_renaissance_desc:0 "Under Hetman Ivan Mazepa, the Hetmanate experiences a cultural and military renaissance."
 het_mazepa_renaissance_title:0 "Mazepa's Golden Age"
 het_mazepa_treason:0 "Mazepa's Treason"
 het_mazepist_autocracy_reform:0 "Baturyn Hetman's Court"
 het_mazepist_autocracy_reform_desc:0 "The hetman keeps a court at Baturyn, a Latin chancery and estates to rival any magnate, while the serving starshyna are confirmed in theirs. The Rada remains, but executive power increasingly gathers around the bulava."
 het_military_support:0 "Military Support to Russia"
 het_modern_cossack_army:0 "Reformed Cossack Army"
 het_modernize_host_desc:0 "Organize standing pike, musket, and artillery formations alongside the traditional Cossack Host."
 het_modernize_host_title:0 "Drill the Regular Regiments"
 het_moldova.1.a:0 "Offer vassalization"
 het_moldova.1.b:0 "Propose alliance"
 het_moldova.1.c:0 "Demand submission"
 het_moldova.1.d:0 "How shall we bring Moldova into the Hetmanate's orbit?"
 het_moldova.1.t:0 "Approach Moldova"
 het_moldova.2.a:0 "Accept their protection"
 het_moldova.2.b:0 "Refuse politely"
 het_moldova.2.d:0 "The powerful Hetmanate offers to take us as their vassal, providing protection against our enemies."
 het_moldova.2.t:0 "Hetmanate Protection Offer"
 het_moldova.3.a:0 "Peaceful integration"
 het_moldova.3.b:0 "Force the annexation"
 het_moldova.3.d:0 "The time has come to fully integrate Moldova into the Hetmanate."
 het_moldova.3.t:0 "Integrate Moldova"
 het_moldova.4.a:0 "Support their cause"
 het_moldova.4.b:0 "Remain neutral"
 het_moldova.4.d:0 "Moldovan nobles seek Cossack support against their current rulers."
 het_moldova.4.t:0 "Moldovan Nobles Seek Support"
 het_moldova.5.a:0 "Together we are strong"
 het_moldova.5.d:0 "Moldova rallies to our standard in this war for the Orthodox faith."
 het_moldova.5.t:0 "Orthodox Defense Pact"
 het_moldova.6.a:0 "Excellent!"
 het_moldova.6.d:0 "Control of Moldovan territory opens lucrative Danube trade routes."
 het_moldova.6.t:0 "Danube Trade Opens"
 het_moldova.90.d:0 "Chancery scribes register the terms of Moldovan allegiance."
 het_moldova.90.t:0 "Moldovan Vassal Accord"
 het_moldovan_alliance_desc:0 "Forge ties with Moldova, opening the path to the Danube and the Balkans."
 het_moldovan_alliance_title:0 "Moldovan Alliance"
 het_moldovan_alliance_tt:0 "Opens diplomatic options for Moldovan vassalization or conquest."
 het_moldovan_conquest:0 "Moldovan Conquest"
 het_moldovan_levies:0 "Moldovan Levies"
 het_moldovan_military_access_desc:0 "Demand military service from our Moldovan subjects in time of war."
 het_moldovan_military_access_title:0 "Call Moldovan Levies"
 het_moldovan_partnership:0 "Moldovan Partnership"
 het_moldovan_protection_desc:0 "Extend the Hetmanate's protection to Moldova, bringing them into our sphere."
 het_moldovan_protection_title:0 "Offer Moldovan Protection"
 het_moldovan_vassalization:0 "Moldovan Vassalization"
 het_noble_interference:0 "Interference in Noble Affairs"
 het_obedient_hetmanate:0 "Obedient Hetmanate"
 het_organize_major_raid_desc:0 "Direct our scouts to choose a frontier theater in council. Once the course is set, Cossack riders strike an eligible neighbouring realm along that border."
 het_organize_major_raid_title:0 "Organize Major Raid"
 het_orthodox.1.a:0 "Against Catholic Poland!"
 het_orthodox.1.b:0 "Toward Constantinople"
 het_orthodox.1.d:0 "An Orthodox crusade has been proclaimed. As Cossacks and defenders of the faith, where shall we direct our banners?"
 het_orthodox.1.t:0 "Call to Orthodox Crusade"
 het_orthodox.2.a:0 "Rally the faithful!"
 het_orthodox.2.d:0 "Hetman Khmelnytsky calls for a holy war against Polish Catholic oppression of Orthodox Ruthenia."
 het_orthodox.2.t:0 "Khmelnytsky's Vendetta"
 het_orthodox.3.a:0 "Welcome their aid"
 het_orthodox.3.b:0 "We need no help"
 het_orthodox.3.d:0 "Our Orthodox allies offer military support for the crusade against the Catholics."
 het_orthodox.3.t:0 "Orthodox Brethren Offer Aid"
 het_orthodox.4.a:0 "The yoke is broken!"
 het_orthodox.4.d:0 "Our crusade has broken Polish power, liberating the Orthodox lands of Ruthenia."
 het_orthodox.4.t:0 "Poland Humbled"
 het_orthodox.5.a:0 "We shall lead the faithful"
 het_orthodox.5.b:0 "Not at this time"
 het_orthodox.5.d:0 "The Hetmanate has the prestige and strength to lead an Orthodox crusade. Shall we take up the standard?"
 het_orthodox.5.t:0 "Lead an Orthodox Crusade"
 het_orthodox_alliance_war:0 "Orthodox Alliance War"
 het_orthodox_champion:0 "Orthodox Champion"
 het_orthodox_cooperation:0 "Orthodox Cooperation"
 het_orthodox_defender_desc:0 "The Hetmanate stands as the defender of Orthodox faith against Catholic oppression."
 het_orthodox_defender_title:0 "Champion of Orthodoxy"
 het_orthodox_missionary_support_desc:0 "Send Orthodox missionaries to strengthen the faith in Moldova."
 het_orthodox_missionary_support_title:0 "Support Orthodox Missionaries"
 het_orthodox_protector:0 "Protector of Orthodoxy"
 het_orthodox_support:0 "Orthodox Missionary Support"
 het_ottoman_protection:0 "Ottoman Protection"
 HET_OVERLORD_MUSCOVY:0 "Muscovy"
 HET_OVERLORD_NONE:0 "independent"
 HET_OVERLORD_POLAND:0 "Poland"
 HET_OVERLORD_RUSSIA:0 "Russia"
 het_peaceful_integration:0 "Peaceful Integration"
 het_pereiaslav_oath:0 "Pereiaslav Oath of Allegiance"
 het_pereiaslav_treaty_desc:0 "We are exhausted by war. A treaty with Russia could bring protection, though at the cost of our independence."
 het_pereiaslav_treaty_title:0 "Sign Treaty with Russia"
 het_perfected_raids:0 "Perfected Raiding"
 het_polish_alliance:0 "Polish Alliance"
 HET_poltava_choice_desc:0 "The armies close near Poltava, Swedish foot against Russian works and three times their guns. Our regiments must be committed before the first volley, and there will be no second choosing."
 HET_poltava_choice_title:0 "The Battle of Poltava"
 het_poltava_defeat:0 "Disaster at Poltava"
 het_poltava_loyalty:0 "Loyalty at Poltava"
 het_poltava_victory:0 "Triumph at Poltava"
 het_printing_press:0 "Hetmanate Printing Press"
 HET_printing_press_desc:0 "Presses at Kyiv and Chernihiv would set the liturgy, the chronicles and the regimental statutes in Church Slavonic, and end our dependence on Lviv and Vilnius for books. What a press prints, a censor elsewhere cannot easily unprint."
 HET_printing_press_title:0 "The Printing Press"
 het_punitive_expedition_desc:0 "Launch a punitive expedition against a rival at war with us, scorching and stripping an occupied town under our banners."
 het_punitive_expedition_title:0 "Launch Punitive Expedition"
 het_punitive_strike:0 "Punitive Strike"
 het_quiet_resistance:0 "Quiet Resistance"
 het_quiet_resistance_desc:0 "We resist Russian control through subtle means."
 het_raid_cooldown:0 "Raid Exhaustion"
 het_raid_defenses:0 "Anti-Raid Defenses"
 het_raid_doctrine_desc:0 "Master the art of lightning cavalry raids that have made the Cossacks feared across the steppes."
 het_raid_doctrine_title:0 "Perfect the Raid Doctrine"
 het_raid_doctrine_tt:0 "Unlocks advanced Cossack raiding decisions."
 het_raid_preparation:0 "Raid Preparation"
 het_raided_us:0 "Raided Our Territory"
 het_recent_regimental_reform:0 "Recent Regimental Universal"
 het_reform_elections_desc:0 "The Hetman election system needs reform to ensure stable succession and reduce conflicts among the starshyna."
 het_reform_elections_title:0 "Reform Hetman Election Process"
 het_reformed_election:0 "Reformed Election"
 het_reformed_election_system:0 "Reformed Election System"
 het_reformed_election_system_desc:0 "Clear chancery statutes now govern the assembly's choice of hetman, curbing turbulent factional tumult."
 het_refused_confederation:0 "Refused Confederation Invitation"
 het_refused_protection:0 "Refused Protection"
 het_regiment_centralized_rule:0 "Centralized Chancery Administration"
 HET_REGIMENT_FORMING:0 "Forming Regiments"
 het_regiment_governance.1.a:0 "Review the Kyiv and Right-Bank Regiments"
 het_regiment_governance.1.b:0 "Review the Left-Bank Regimental Districts"
 het_regiment_governance.1.c:0 "Review the Sloboda and Frontier Regiments"
 het_regiment_governance.1.d:0 "The regiments of the Host stand as the foundation of our state. Each regimental town balances the demands of Cossack martial mobilisation, the landed interests of the local starshyna, and the central authority of the General Military Chancery. The General Staff awaits the Hetman's decision on which regimental territory to reform."
 het_regiment_governance.1.e:0 "Review a regimental center by Chancery choice"
 het_regiment_governance.1.f:0 "Maintain existing customs without changes"
 het_regiment_governance.1.t:0 "The Hetman's Regimental Universal"
 het_regiment_governance.2.a:0 "Military Service: Expand the combat register and artillery"
 het_regiment_governance.2.b:0 "Starshyna Rights: Confirm ranhowi estates and local jurisdiction"
 het_regiment_governance.2.c:0 "Centralization: Impose General Military Chancery audits"
 het_regiment_governance.2.d:0 "The regiments of the Right Bank guard the Dnieper crossings and the frontier with Poland. We must decide the course of governance for this regimental district."
 het_regiment_governance.2.t:0 "Kyiv and Right-Bank Regimental Governance"
 het_regiment_governance.3.a:0 "Military Service: Muster the regiments for war"
 het_regiment_governance.3.b:0 "Starshyna Rights: Guarantee noble estates and trade rights"
 het_regiment_governance.3.c:0 "Centralization: Direct taxation and Chancery oversight"
 het_regiment_governance.3.d:0 "The Left-Bank regiments form the fertile heart of the Hetmanate. The colonels and sotnyks await our universal on the district's administration."
 het_regiment_governance.3.t:0 "Left-Bank Regimental Governance"
 het_regiment_governance.4.a:0 "Military Service: Reinforce watchtowers and frontier patrols"
 het_regiment_governance.4.b:0 "Starshyna Rights: Empower the frontier colonels"
 het_regiment_governance.4.c:0 "Centralization: Subordinate the slobodas directly to the Hetman"
 het_regiment_governance.4.d:0 "The frontier regiments hold the line against steppe incursions. We must establish their regimental order."
 het_regiment_governance.4.t:0 "Sloboda and Frontier Regimental Governance"
 het_regiment_governance.5.a:0 "Military Service: Full regimental mobilization"
 het_regiment_governance.5.b:0 "Starshyna Rights: Confirm local autonomy and rank lands"
 het_regiment_governance.5.c:0 "Centralization: Subordinate the district to the General Staff"
 het_regiment_governance.5.d:0 "Our chancery has selected an active regimental seat for administrative reorganization. Choose its governing course."
 het_regiment_governance.5.t:0 "Regimental District Governance"
 het_regiment_military_service:0 "Regimental Military Service"
 het_regiment_starshyna_rights:0 "Starshyna Local Rights"
 HET_REGIMENT_SYSTEM:0 "Regimental System"
 het_regimental_administration:0 "Regimental Administration"
 het_regimental_administration_desc:0 "Our territory is efficiently organized into military regiments."
 het_regimental_province_administration:0 "Regimental Province"
 het_regimental_system_reform:0 "Regimental Administration"
 het_regimental_system_reform_desc:0 "The Hetmanate divides its lands into territorial regiments (polky), each governed in both justice and muster by its colonel. Once every ten years the register may be settled from the government window: fund the full muster or settle the service obligations."
 het_regimental_territorial_governance_decision_desc:0 "The Cossack polky are both military formations and administrative territories. By issuing a Hetman's Universal, we can review the internal governance of our regimental districts, choosing whether to direct them toward full military service, confirm the local privileges of the starshyna, or impose direct central oversight."
 het_regimental_territorial_governance_decision_title:0 "Review Regimental Territorial Governance"
 het_registered_army_support:0 "Supported Registered Army"
 HET_registered_cossacks:0 "Registered Cossacks"
 HET_registered_cossacks_desc:0 "The registered Cossack regiments form the core of our infantry, combining discipline with Cossack fighting spirit."
 het_religious_tension:0 "Religious Tension"
 het_resist_abolition_desc:0 "Spend 200 Military Power and 2 Stability to defend the Hetmanate charter for ten years. This removes the old abolition penalty, grants +15% fort defence and -1 unrest, and suspends the Russian abolition event. After the term, that event may return if Russian overlordship and the political threat remain. Independence ends the protection; changing tags does not refund the ten-year term. This action does not declare war."
 het_resist_abolition_title:0 "Resist Abolition of Autonomy"
 het_resists_oligarchy_desc:0 "Hetman Resists Oligarchy"
 het_right_bank_loyalty:0 "Right Bank Loyalty"
 het_rozumovsky_reforms_desc:0 "Hetman Kyrylo Rozumovsky orders the chancery, judicial courts, and regular regiments along disciplined administrative lines."
 het_rozumovsky_reforms_title:0 "Rozumovsky's Reforms"
 het_ruina_period:0 "The Ruin"
 het_russian_protection:0 "Russian Protection"
 het_russian_protection_desc:0 "Russia protects us from our enemies, at the cost of some independence."
 het_russian_repression:0 "Russian Repression"
 HET_russian_repression_desc:0 "Chortomlyk is burned, residents are installed in the chancery, and the register is kept in Moscow now. Colonels are appointed rather than elected. The forms of the Hetmanate remain, and are read aloud at each new appointment."
 HET_russian_repression_title:0 "After Poltava"
 HET_sich_destruction_desc:0 "Regiments of the line surround the palisade and the guns are laid before terms are offered. The Kosh Otaman goes north under escort to a monastery cell. The lands are surveyed for settlement before the year is out."
 HET_sich_destruction_title:0 "Destruction of the Sich - 1775"
 het_sich_stronghold_desc:0 "Transform our capital into an impregnable Cossack stronghold on the steppe."
 het_sich_stronghold_title:0 "Fortify the Sich"
 het_sloboda_settlements_desc:0 "Sloboda Ukraine offers opportunities for settlement. We can establish new communities with special freedoms to attract colonists."
 het_sloboda_settlements_title:0 "Establish Sloboda Ukraine Settlements"
 HET_starshyna_administration:0 "Starshyna Administration"
 HET_starshyna_administration_desc:0 "The starshyna officer class forms the administrative backbone of the Hetmanate, managing provinces and providing military leadership."
 het_starshyna_council:0 "Starshyna Council"
 het_starshyna_diplomacy:0 "Starshyna Diplomacy"
 het_starshyna_oligarchy_reform:0 "Starshyna Oligarchy"
 het_starshyna_oligarchy_reform_desc:0 "The Hetmanate is ruled by the starshyna - an officer-elite drawn from Cossack colonels, generals, judges, and administrators. These families dominate governance, forming a landed oligarchy that supplants the elective Rada with aristocratic administration."
 HET_starshyna_system_desc:0 "The colonels hold their regiments as districts, judge within them and grant land in them. Within a generation the starshyna will be a nobility in all but the armorial, and will ask for that too."
 HET_starshyna_system_title:0 "The Starshyna Elite"
 het_steppe_domination_desc:0 "Assert complete mastery over the steppe, where Cossack cavalry reigns supreme."
 het_steppe_domination_title:0 "Steppe Domination"
 het_steppe_hegemony:0 "Steppe Hegemony"
 het_steppe_mastery:0 "Masters of the Steppe"
 het_strengthen_hetman_desc:0 "Spend 100 ADM to strengthen the Hetman and receive ten years of support for his government. This action becomes available again ten years after its previous use."
 het_strengthen_hetman_title:0 "Strengthen Hetman Authority"
 het_strong_hetman:0 "Strong Hetman"
 het_successful_raid:0 "Successful Raid"
 het_succession.1.a:0 "Support a strong hetman"
 het_succession.1.b:0 "Compromise with the starshyna"
 het_succession.1.c:0 "Seek foreign backing"
 het_succession.1.d:0 "The hetman's weakness or death has triggered a succession crisis. The starshyna officer class, foreign powers, and rival candidates all vie for control."
 het_succession.1.t:0 "Succession Crisis Begins"
 het_succession.2.a:0 "The hetman consolidates power"
 het_succession.2.b:0 "Reform the election system"
 het_succession.2.c:0 "Balance hetman and starshyna"
 het_succession.2.d:0 "After much struggle, a new hetman has consolidated power and the succession crisis has ended."
 het_succession.2.t:0 "Succession Resolved"
 het_succession.3.a:0 "Support the current hetman"
 het_succession.3.b:0 "Hold a new election"
 het_succession.3.c:0 "Let them duel for honor"
 het_succession.3.d:0 "A rival hetman has emerged with his own supporters, threatening civil war."
 het_succession.3.t:0 "Rival Hetman Emerges"
 het_succession.4.a:0 "Curtail noble power"
 het_succession.4.b:0 "Grant concessions"
 het_succession.4.c:0 "Seek a balanced approach"
 het_succession.4.d:0 "The starshyna officer class is making a bid for greater power, threatening hetman authority."
 het_succession.4.t:0 "Starshyna Power Play"
 het_succession.5.a:0 "Accept their candidate"
 het_succession.5.b:0 "Resist interference!"
 het_succession.5.c:0 "Negotiate for autonomy"
 het_succession.5.d:0 "Our overlord is attempting to impose their own candidate as hetman."
 het_succession.5.t:0 "Foreign Interference"
 het_succession.6.a:0 "Make it hereditary"
 het_succession.6.b:0 "Keep it elective"
 het_succession.6.c:0 "Institute term limits"
 het_succession.6.d:0 "Should the hetmanate become hereditary, remain elective, or adopt term limits?"
 het_succession.6.t:0 "The Question of Succession"
 HET_swedish_alliance_desc:0 "The Swedish king marches east with the finest army in Europe and offers a written guarantee of Cossack liberties. The Tsar's forces stand between him and us. A guarantee is worth what the guarantor's next battle makes it worth."
 het_swedish_alliance_desc:0 "Ally with Sweden to challenge Russian and Polish dominance during the Great Northern War."
 HET_swedish_alliance_title:0 "The Swedish Gambit"
 het_swedish_alliance_title:0 "The Swedish Gambit"
 het_swedish_compact:0 "Swedish Alliance"
 het_swedish_gambit:0 "Swedish Alliance"
 het_tamed_steppe:0 "Tamed Steppe"
 het_term_limited_rule:0 "Term-Limited Hetmanate"
 HET_the_kish_the_sich_rada_and_military_court:0 "The Kish and the Sich Rada"
 HET_the_kish_the_sich_rada_and_military_court_desc:0 "The Kish, or Zaporozhian Host, and the Sich Rada not only govern the Hetmanate, but also serve as its premier military force. The Sich Rada is composed entirely of cossacks, and any cossack, regardless of origin, can vote. This encourages a military tradition that transcends class barriers."
 HET_the_price_we_set_for_service:0 "Peak Performance at a Premium Price"
 HET_the_price_we_set_for_service_desc:0 "Our martial prowess has drawn the attention of both European and Muslim realms, eager to hire our regiments for their own campaigns. By formalizing mercenary service within the Hetmanate, we can turn the skills of our warriors into a lucrative enterprise."
 het_threatened_moldova:0 "Threatened Moldova"
 HET_toward_all_of_ruthenia:0 "Rus' for the Ruthenians!"
 HET_toward_all_of_ruthenia_desc:0 "Despite every design of Poland and Muscovy to subjugate our fertile homeland, the Host will stand firm in arms, sparing neither gold nor blood so that Rus' is governed by its own estates rather than distant courts in Moscow, Kraków, or Vilnius."
 het_zaporizhian_liberty_desc:0 "Secure true independence for the Zaporizhian Host, free from all overlords."
 het_zaporizhian_liberty_title:0 "Zaporizhian Liberty"
 hetman_absolute_power:0 "§YHetman rules with near-monarchical authority§!"
 hetman_administrative_background:0 "Administrative Hetman"
 HETMAN_COMMANDER:0 "Hetman-Commander"
 hetman_diplomatic_background:0 "Diplomatic Hetman"
