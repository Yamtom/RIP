 rip_church_oppose_union_desc:0 "For 25 DIP, adopt or end state opposition to the Union. Opposition imposes a mutual -10 opinion with Greek Catholic countries. The policy can be changed once every five years."
 rip_church_oppose_union_title:0 "Change our policy toward the Union"
 rip_church_orthodox_authority_jurisdiction_tt:0 "§YPatriarchal Authority§! is the native measure of the Orthodox hierarchy. The local metropolitanate changes jurisdiction only: state and provinces remain Orthodox and in communion. A separate confession requires a deliberate later break; this authority bar never converts provinces."
