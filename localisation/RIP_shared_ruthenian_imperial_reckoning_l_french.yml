l_french:
 rip_tur_ruina_scorched_earth:0 "Terre brûlée sur la Rive droite"
 rip_tur_ruina_scorched_earth_title:0 "Terre brûlée sur la Rive droite"
 rip_tur_ruina_scorched_earth_desc:0 "Les sièges, les fourrageurs tatars et les incendies punitifs ont vidé les villes de Podolie et de la Rive droite, réduisant les districts conquis en désert."
 desc_rip_tur_ruina_scorched_earth:0 "Les expéditions punitives et les auxiliaires tatars laissent des bourgs calcinés, des garnisons impayées et des campagnes désertes entre Dniestr et Dniepr."
 rip_tur_captive_galley_revolt:0 "Mutineries des chiourmes captives"
 rip_tur_captive_galley_revolt_title:0 "Mutineries des chiourmes captives"
 rip_tur_captive_galley_revolt_desc:0 "Les captifs enchaînés venus des marches du nord et des Balkans remplissent les bancs de nage impériaux jusqu'à ce que le désespoir éclate en mutineries et incendies d'arsenaux."
 desc_rip_tur_captive_galley_revolt:0 "L'enrôlement massif de rameurs captifs mine le moral naval et expose les chantiers à des évasions concertées."
 rip_plc_bloody_pacification:0 "La Pacification sanglante"
 rip_plc_bloody_pacification_title:0 "La Pacification sanglante"
 rip_plc_bloody_pacification_desc:0 "Les colonnes privées des magnats, les réquisitions de quartiers d'hiver et les exécutions sommaires dans les villages ruthènes soulèvent les palatinats orientaux."
 desc_rip_plc_bloody_pacification:0 "La pacification armée des palatinats orientaux ruine l'autorité royale et pousse des districts entiers à la révolte."
 rip_rus_abolition_of_hetmanate:0 "Abolition de l'Hetmanat et de la Sitch"
 rip_rus_abolition_of_hetmanate_title:0 "Abolition de l'Hetmanat et de la Sitch"
 rip_rus_abolition_of_hetmanate_desc:0 "La suppression des cours régimentaires, le logement des dragons impériaux et les réquisitions de terrassiers pour les canaux du nord effacent les anciennes chartes ruthènes."
 desc_rip_rus_abolition_of_hetmanate:0 "La centralisation impériale sur la Rive gauche et en Zaporogie entraîne désertions fiscales, registres brûlés et troubles frontaliers."
 rip_cri_yasyr_depopulation_crisis:0 "La Steppe vide et la crise du yasyr"
 rip_cri_yasyr_depopulation_crisis_title:0 "La Steppe vide et la crise du yasyr"
 rip_cri_yasyr_depopulation_crisis_desc:0 "Des décennies de razzias incessantes ont dépeuplé les vallées voisines, tarissant les péages tandis que les enclos de Crimée propagent épidémies et représailles."
 desc_rip_cri_yasyr_depopulation_crisis:0 "La dépendance excessive aux marchés de captifs ruine la douane régulière et attire les représailles maritimes et cosaques."
 rip_tur_yasyr_port_tithe_title:0 "Percevoir la dîme portuaire du yasyr"
 rip_tur_yasyr_port_tithe_desc:0 "Poster des commissaires du pencik à Caffa et Otchakov pour prélever le quint du sultan sur les captifs ruthènes destinés au trésor et aux galères."
 rip_tur_podillian_church_seizures_title:0 "Convertir les églises de pierre de Podolie"
 rip_tur_podillian_church_seizures_desc:0 "Réquisitionner des églises fortifiées et biens monastiques en Podolie pour doter les mosquées de garnison, ou confirmer les chartes de dhimma."
 rip_tur_devshirme_northern_levy_title:0 "Étendre la levée forcée du devchirmé"
 rip_tur_devshirme_northern_levy_desc:0 "Ordonner aux recruteurs janissaires de durcir la levée d'enfants dans les districts chrétiens et les eyalets du nord, ou convertir l'obligation en argent."
 rip_tur_surgun_forced_resettlement_title:0 "Promulguer les édits de déportation sürgün"
 rip_tur_surgun_forced_resettlement_desc:0 "Contraindre guildes, familles et artisans des provinces conquises à s'établir autour de Constantinople et des places fortes, ou privilégier des chartes volontaires."
 rip_tur_celali_anatolian_reprisals_title:0 "Ordonner la pacification de fer en Anatolie"
 rip_tur_celali_anatolian_reprisals_desc:0 "Envoyer des colonnes punitives écraser les campagnes anatoliennes soulevées durant les troubles célali, ou proclamer une amnistie négociée."
 rip_tur_balkan_tribute_exactions_title:0 "Doubler les réquisitions danubiennes et de la steppe"
 rip_tur_balkan_tribute_exactions_desc:0 "Exiger des livraisons extraordinaires de blé, de moutons et d'argent de Moldavie, de Valachie et du Yédisan pour financer les armées en campagne."
 rip_plc_second_serfdom_corvee_title:0 "Imposer la corvée seigneuriale illimitée"
 rip_plc_second_serfdom_corvee_desc:0 "Soutenir les magnats exigeant cinq journées hebdomadaires de corvée sur les domaines fluviaux ruthènes, ou imposer un plafond légal."
 rip_plc_ordinance_of_1638_title:0 "Voter l'ordonnance royale sur les Cosaques"
 rip_plc_ordinance_of_1638_desc:0 "Supprimer les officiers cosaques élus, placer des commissaires nobles à la tête d'un registre réduit et soumettre les non-inscrits au servage."
 rip_plc_parish_sequestrations_title:0 "Séquestrer les paroisses orthodoxes récalcitrantes"
 rip_plc_parish_sequestrations_desc:0 "Fermer sous scellés les églises et biens monastiques des villes ruthènes refusant les décrets épiscopaux, ou garantir la paix confessionnelle urbaine."
 rip_rus_kyiv_press_censorship_title:0 "Soumettre les presses de Kiev et Tchernigov"
 rip_rus_kyiv_press_censorship_desc:0 "Soumettre les imprimeries ruthènes, manuels académiques et graphies locales à la censure synodale, ou respecter les chartes d'impression."
 rip_cri_kaffa_captive_markets_title:0 "Agrandir les marchés de captifs à Caffa et Perekop"
 rip_cri_kaffa_captive_markets_desc:0 "Accorder des remises aux mirzas et capitaines pour concentrer les captifs de Ruthénie et Zaporogie à Caffa, ou limiter les rafles sous des péages réguliers."
 rip_tur_seized_parishes:0 "Biens paroissiaux saisis"
 desc_rip_tur_seized_parishes:0 "La saisie des églises et rentes paroissiales attise le ressentiment des bourgeois chrétiens et freine la rentrée des impôts."
 rip_tur_uprooted_quarters:0 "Quartiers d'artisans déracinés"
 desc_rip_tur_uprooted_quarters:0 "Les déportations forcées du sürgün ont laissé des ateliers clos et des étals à demi vides."
 rip_tur_great_flight:0 "Grande fuite paysanne"
 desc_rip_tur_great_flight:0 "Les incendies punitifs et amendes collectives ont chassé les villageois vers les montagnes et les grandes cités."
 rip_plc_folwark_exhaustion:0 "Domaines épuisés par la corvée"
 desc_rip_plc_folwark_exhaustion:0 "Cinq jours hebdomadaires de corvée gonflent les exportations de blé au prix de fuites paysannes et d'une colère sourde."
 rip_plc_closed_parishes:0 "Églises orthodoxes scellées"
 desc_rip_plc_closed_parishes:0 "Les églises cadenassées ou affermées transforment chaque fête religieuse en foyer d'émeute."
 rip_rus_silenced_presses:0 "Presses kiéviennes mises sous scellés"
 desc_rip_rus_silenced_presses:0 "Les casses d'imprimerie scellées par le Synode étouffent l'édition savante et la vie académique locale."
 rip_tur_pencik_notoriety:0 "Dîme du pencik en mer Noire"
 desc_rip_tur_pencik_notoriety:0 "Les ventes systématiques de captifs dans les ports impériaux enrichissent la ferme des douanes tout en alarmant les cours chrétiennes."
 rip_tur_ransom_brokerage:0 "Courtage réglementé des rançons"
 desc_rip_tur_ransom_brokerage:0 "Privilégier les échanges sous rançon à la chiourme forcée réduit les tensions frontalières au prix de moindres recettes portuaires."
 rip_tur_coercive_eyalet_rule:0 "Administration coercitive d'eyalet"
 desc_rip_tur_coercive_eyalet_rule:0 "Transformer les grandes églises urbaines en mosquées hâte les conversions mais s'aliène les communautés non musulmanes."
 rip_tur_podillian_dhimma_charter:0 "Charte de dhimma en Podolie"
 desc_rip_tur_podillian_dhimma_charter:0 "Des garanties paroissiales confirmées selon la loi de dhimma apaisent les villes frontalières tout en laissant plus d'autonomie aux notables locaux."
 rip_tur_harsh_devshirme:0 "Conscription rigoureuse du devchirmé"
 desc_rip_tur_harsh_devshirme:0 "Des quotas élargis renouvellent les régiments impériaux au prix d'une profonde hostilité dans les campagnes chrétiennes."
 rip_tur_devshirme_commutation:0 "Rôles de levée commués en argent"
 desc_rip_tur_devshirme_commutation:0 "Accepter un versement financier au lieu d'enrôler des fils ménage les foyers mais ralentit le renouvellement des effectifs."
 rip_tur_surgun_edicts:0 "Décrets impériaux du sürgün"
 desc_rip_tur_surgun_edicts:0 "Les déplacements imposés remodèlent les cités conquises tout en nourrissant l'inquiétude des voisins et des provinces."
 rip_tur_voluntary_charters:0 "Patentes volontaires de corporations"
 desc_rip_tur_voluntary_charters:0 "Attirer les artisans par des franchises fiscales plutôt que par la contrainte facilite l'intégration des provinces."
 rip_tur_iron_pacification:0 "Main de fer en Anatolie"
 desc_rip_tur_iron_pacification:0 "Les représailles sommaires brisent vite les bandes armées mais ravagent l'assiette fiscale."
 rip_tur_anatolian_amnesty:0 "Chartes d'amnistie anatoliennes"
 desc_rip_tur_anatolian_amnesty:0 "Les pardons et remises d'impôts ramènent les villageois dans les vallées tout en relâchant le contrôle central."
 rip_tur_danubian_exactions:0 "Réquisitions extraordinaires du Danube"
 desc_rip_tur_danubian_exactions:0 "Des levées imprévues pressent davantage les tributaires mais poussent les hospodars vers des protecteurs du nord."
 rip_tur_fixed_danubian_tribute:0 "Rôle juré du tribut danubien"
 desc_rip_tur_fixed_danubian_tribute:0 "Respecter des plafonds fixes de tribut retient la fidélité des principautés danubiennes malgré des recettes moindres."
 rip_plc_second_serfdom:0 "Servage des grands domaines"
 desc_rip_plc_second_serfdom:0 "Les paysans attachés à la glèbe fournissent d'abondantes cargaisons de blé tandis que désertions et rancœurs affaiblissent les levées."
 rip_plc_capped_corvee:0 "Plafond statutaire des corvées"
 desc_rip_plc_capped_corvee:0 "Les commissaires royaux bornent les exigences seigneuriales à l'est et apaisent les campagnes malgré les plaintes de la noblesse."
 rip_plc_crown_ordinance:0 "Suppression de l'état-major cosaque"
 desc_rip_plc_crown_ordinance:0 "Retirer aux régiments cosaques leurs officiers élus renforce les magnats sur le Dniepr mais brise l'ardeur de la cavalerie frontalière."
 rip_plc_regimental_liberties:0 "Libertés régimentaires jurées"
 desc_rip_plc_regimental_liberties:0 "Maintenir les élections cosaques et les pensions de la steppe garde une cavalerie frontalière ardente aux dépens de la centralisation."
 rip_plc_confessional_coercion:0 "Politique de séquestre confessionnel"
 desc_rip_plc_confessional_coercion:0 "Fermer les paroisses orthodoxes disputées accélère les pressions missionnaires mais envenime les relations avec tous les voisins orientaux."
 rip_plc_municipal_confession_peace:0 "Paix confessionnelle des villes ruthènes"
 desc_rip_plc_municipal_confession_peace:0 "Les écoles de confréries et paroisses ouvertes apaisent les corporations urbaines tout en freinant le prosélytisme."
 rip_rus_imperial_uniformity:0 "Uniformité synodale d'édition"
 desc_rip_rus_imperial_uniformity:0 "La révision synodale obligatoire efface l'édition ruthène propre et rend l'administration plus méfiante envers les idées venues d'ailleurs."
 rip_rus_ruthenian_charters_spared:0 "Chartes d'imprimerie académique préservées"
 desc_rip_rus_ruthenian_charters_spared:0 "Maintenir les presses de Kiev et Tchernigov ouvertes diffuse vite les lettres latines et slavonnes à travers les diocèses."
 rip_cri_slave_mart_infamy:0 "Infamie des marchés de captifs"
 desc_rip_cri_slave_mart_infamy:0 "Des razzias accrues enrichissent les cavaliers mais rendent presque impossibles les traités durables avec les cours chrétiennes."
 rip_cri_reformed_tamga:0 "Tamga juré du sel et des caravanes"
 desc_rip_cri_reformed_tamga:0 "Freiner les enchères de captifs au profit des douanes sur le sel et les fourrures relève le crédit diplomatique au prix du butin."
 rip_tur_reckoning.1.t:0 "Commissaires pour la dîme du yasyr"
 rip_tur_reckoning.1.d:0 "Des convois de captifs pris sur le Dniepr et en Podolie traversent Perekop vers les quais de Caffa et d'Otchakov. Le Trésor presse d'enrôler le quint du sultan sur les bancs de galères, tandis que des courtiers proposent un rachat encadré."
 rip_tur_reckoning.1.a:0 "Prélever le quint du sultan en or et en rameurs."
 rip_tur_reckoning.1.result_tt:0 "Débloque l'agitation des chiourmes captives ; après 180 jours, Dîme du pencik en mer Noire pour 15 ans et troubles portuaires à Caffa et en Yédisan."
 rip_tur_reckoning.1.b:0 "Limiter les quotas portuaires au courtage de rançon."
 rip_tur_reckoning.2.t:0 "Rameurs dans les arsenaux"
 rip_tur_reckoning.2.d:0 "La rumeur des enclos bondés et des chiourmes enchaînées gagne les cours chrétiennes et alimente la colère dans les ports."
 rip_tur_reckoning.2.a:0 "Doubler la garde des chantiers navals."
 rip_tur_reckoning.3.t:0 "Églises des villes de Podolie"
 rip_tur_reckoning.3.d:0 "Après l'entrée des armées en Podolie, des prédicateurs demandent la conversion des principales églises de pierre en mosquées. Les bourgeois invoquent d'anciennes chartes de dhimma."
 rip_tur_reckoning.3.a:0 "Saisir les églises et les affecter aux mosquées."
 rip_tur_reckoning.3.result_tt:0 "Après 150 jours, une province chrétienne de Podolie ou de Ruthénie subit 20 de dévastation, 6 d'agitation et Biens paroissiaux saisis, plus Administration coercitive d'eyalet pour 15 ans."
 rip_tur_reckoning.3.b:0 "Confirmer la protection de dhimma sur ces paroisses."
 rip_tur_reckoning.4.t:0 "Bourgeois amers sous les nouveaux minarets"
 rip_tur_reckoning.4.d:0 "Les cloches ont été fondues et les terres monastiques distribuées aux spahis, mais les bourgeois chrétiens ferment boutique et fuient vers le nord."
 rip_tur_reckoning.4.a:0 "Poster des gardes aux portes de la ville."
 rip_tur_reckoning.5.t:0 "Durcissement de la levée du devchirmé"
 rip_tur_reckoning.5.d:0 "Les officiers recruteurs demandent d'étendre les levées dans les villages chrétiens au mépris des exemptions et des fils uniques. Les anciens supplient d'accepter un rachat en argent."
 rip_tur_reckoning.5.a:0 "Écarter les exemptions et prendre toute la levée."
 rip_tur_reckoning.5.result_tt:0 "Après 180 jours, une province chrétienne perd 1 d'effectif de base (ou subit 20 de dévastation) et gagne 5 d'agitation, et la Porte reçoit Conscription rigoureuse pour 15 ans."
 rip_tur_reckoning.5.b:0 "Accepter un versement d'argent des villages."
 rip_tur_reckoning.6.t:0 "Foyers vides après le passage des recruteurs"
 rip_tur_reckoning.6.d:0 "Les jeunes laboureurs ont fui dans les forêts devant les greffiers, laissant des rôles d'impôts dégarnis et des villages hostiles."
 rip_tur_reckoning.6.a:0 "Diriger les recrues vers les compagnies d'instruction."
 rip_tur_reckoning.7.t:0 "Listes de déportation du sürgün"
 rip_tur_reckoning.7.d:0 "Le Divan envisage d'ordonner à des quartiers entiers d'artisans grecs, arméniens, slaves et juifs de plier bagage sous escorte pour repeupler Constantinople et les forteresses."
 rip_tur_reckoning.7.a:0 "Exécuter les convois de déportation du sürgün."
 rip_tur_reckoning.7.result_tt:0 "Après 180 jours, deux provinces non turques subissent 20 de dévastation, 5 d'agitation et Quartiers d'artisans déracinés pour 15 ans, avec Décrets impériaux du sürgün."
 rip_tur_reckoning.7.b:0 "Accorder des chartes d'établissement volontaires."
 rip_tur_reckoning.8.t:0 "Métiers à tisser clos derrière les convois"
 rip_tur_reckoning.8.d:0 "De nouveaux ateliers ouvrent près de la Corne d'Or, mais les rues provinciales d'où ces familles furent arrachées restent amères et désertées."
 rip_tur_reckoning.8.a:0 "Inscrire les guildes déplacées à Constantinople."
 rip_tur_reckoning.9.t:0 "La pacification d'Anatolie en question"
 rip_tur_reckoning.9.d:0 "Mousquetaires licenciés et bandes célali bloquent les routes d'Anatolie. Les généraux prônent des représailles collectives implacables ; les cadis avertissent que des vallées calcinées ne paieront plus d'impôt."
 rip_tur_reckoning.9.a:0 "Lâcher les colonnes punitives et les amendes collectives."
 rip_tur_reckoning.9.result_tt:0 "Après 150 jours, deux provinces anatoliennes subissent 30 de dévastation et Grande fuite paysanne pour 15 ans, avec Main de fer en Anatolie."
 rip_tur_reckoning.9.b:0 "Proclamer une amnistie et alléger la dîme rurale."
 rip_tur_reckoning.10.t:0 "Puits comblés et hameaux désertés"
 rip_tur_reckoning.10.d:0 "Les bandes célali sont brisées, mais la grande fuite a vidé des districts entiers dont les survivants s'entassent dans les villes closes."
 rip_tur_reckoning.10.a:0 "Recenser ce qu'il reste sur les rôles fiscaux."
 rip_tur_reckoning.11.t:0 "Levées extraordinaires sur les marches du Danube"
 rip_tur_reckoning.11.d:0 "Les intendants exigent de la Moldavie, de la Valachie et du Yédisan des charrettes de blé, troupeaux et versements d'argent bien au-delà du tribut juré."
 rip_tur_reckoning.11.a:0 "Imposer sans délai la double réquisition."
 rip_tur_reckoning.11.result_tt:0 "Après 180 jours, Moldavie, Valachie et vassaux ruthènes gagnent 25 de désir de liberté, une province subit 25 de dévastation et 5 d'agitation, et la Porte reçoit Réquisitions extraordinaires du Danube."
 rip_tur_reckoning.11.b:0 "S'en tenir au tribut juré en temps de paix."
 rip_tur_reckoning.12.t:0 "Rancœur dans les cours tributaires"
 rip_tur_reckoning.12.d:0 "Les convois grincent vers le sud tandis que boyards moldaves et notables frontaliers cherchent en secret des protecteurs au nord."
 rip_tur_reckoning.12.a:0 "Surveiller étroitement les passages du fleuve."
 rip_tur_reckoning.13.t:0 "Villes ruinées de la Rive droite"
 rip_tur_reckoning.13.d:0 "Les auxiliaires impayés et la politique de terre brûlée réduisent en cendres les cités de Podolie et de la Rive droite, isolant les garnisons au milieu d'émeutes."
 rip_tur_reckoning.13.a:0 "Tenir les citadelles et abandonner le plat pays."
 rip_tur_reckoning.13.b:0 "Verser de l'argent pour contenir les fourrageurs."
 rip_tur_reckoning.14.t:0 "Cendres entre Dniestr et Dniepr"
 rip_tur_reckoning.14.d:0 "Les garnisons ont vidé les granges avant l'hiver, poussant les derniers paysans ruthènes vers les bandes armées ou au-delà des fleuves."
 rip_tur_reckoning.14.a:0 "Réquisitionner chevaux et poudre coûte que coûte."
 rip_tur_reckoning.14.b:0 "Acheminer des barges de secours par le fleuve."
 rip_tur_reckoning.15.t:0 "Patrouilles frontalières rétablies"
 rip_tur_reckoning.15.d:0 "Les plus graves ravages entre Dniestr et Dniepr s'apaisent, bien que des villages en ruines rappellent longtemps le prix de la campagne."
 rip_tur_reckoning.15.a:0 "Inscrire les districts pacifiés au registre."
 rip_tur_reckoning.16.t:0 "Révolte de la chiourme sur les galères"
 rip_tur_reckoning.16.d:0 "Des captifs ruthènes et frontaliers s'emparent de haches et de chevilles sur les galères à quai et embrasent les chantiers dans la nuit."
 rip_tur_reckoning.16.a:0 "Faire nettoyer les ponts à la mousqueterie."
 rip_tur_reckoning.16.b:0 "Remplacer les forçats par des rameurs soldés."
 rip_tur_reckoning.17.t:0 "Évasions des chantiers de la mer Noire"
 rip_tur_reckoning.17.d:0 "Des équipages entiers de rameurs ont brisé leurs fers en mer ou gagné la côte sur des barques, immobilisant les escadres."
 rip_tur_reckoning.17.a:0 "Enrôler de force les journaliers du port."
 rip_tur_reckoning.17.b:0 "Verser une prime aux rameurs libres des côtes."
 rip_tur_reckoning.18.t:0 "Le calme revient dans les escadres"
 rip_tur_reckoning.18.d:0 "Après de lourdes pertes d'hommes et de coques, la discipline reprend dans les arsenaux sous garde renforcée."
 rip_tur_reckoning.18.a:0 "Radouber les coques survivantes."
 rip_plc_reckoning.1.t:0 "Corvées sur les domaines fluviaux"
 rip_plc_reckoning.1.d:0 "Les grands tenanciers du Boug, du Dniestr et du Dniepr exigent cinq jours de corvée hebdomadaire pour charger les barges de la Baltique. Les commissaires signalent des granges brûlées et des fuites massives."
 rip_plc_reckoning.1.a:0 "Confirmer le droit des seigneurs aux cinq jours."
 rip_plc_reckoning.1.result_tt:0 "Active le risque de crise ; après 180 jours, une province ruthène gagne 6 d'agitation et Domaines épuisés par la corvée pour 20 ans, avec Servage des grands domaines."
 rip_plc_reckoning.1.b:0 "Soumettre les domaines à un plafond royal."
 rip_plc_reckoning.2.t:0 "Incendies nocturnes dans les greniers"
 rip_plc_reckoning.2.d:0 "Les barges partent pleines vers Dantzig, tandis que les fermiers réclament des dragons pour traquer les paysans en fuite."
 rip_plc_reckoning.2.a:0 "Enregistrer les plaintes des propriétaires."
 rip_plc_reckoning.3.t:0 "Abolition des officiers cosaques"
 rip_plc_reckoning.3.d:0 "Après les troubles frontaliers, la diète propose d'abolir les libertés cosaques : réduire le registre, nommer des colonels nobles et soumettre les rayés aux domaines seigneuriaux."
 rip_plc_reckoning.3.a:0 "Promulguer l'ordonnance et nommer des colonels nobles."
 rip_plc_reckoning.3.result_tt:0 "Active le risque de crise ; après 150 jours, les Cosaques perdent 25 de loyauté, une province subit 8 d'agitation et 15 de dévastation, avec Suppression de l'état-major cosaque."
 rip_plc_reckoning.3.b:0 "Préserver les colonels élus et les pensions."
 rip_plc_reckoning.4.t:0 "Conseils secrets sous les rapides"
 rip_plc_reckoning.4.d:0 "Rayés des rôles, les vétérans cosaques gagnent la Zaporogie en jurant que l'ordonnance ne passera pas le printemps."
 rip_plc_reckoning.4.a:0 "Renforcer les forts du fleuve."
 rip_plc_reckoning.5.t:0 "Portes cadenassées des paroisses ruthènes"
 rip_plc_reckoning.5.d:0 "Prévôts royaux et huissiers épiscopaux attendent devant les églises orthodoxes et imprimeries de confréries pour saisir les biens des clercs récalcitrants."
 rip_plc_reckoning.5.a:0 "Exécuter les séquestres et sceller les églises."
 rip_plc_reckoning.5.result_tt:0 "Après 180 jours, une province orthodoxe ruthène gagne 6 d'agitation et Églises orthodoxes scellées pour 15 ans, avec Politique de séquestre confessionnel."
 rip_plc_reckoning.5.b:0 "Proclamer la paix confessionnelle des villes."
 rip_plc_reckoning.6.t:0 "Foules devant la nef scellée"
 rip_plc_reckoning.6.d:0 "Les paroissiens repoussent les fermiers et envoient des suppliques aux souverains orthodoxes au-delà de la frontière."
 rip_plc_reckoning.6.a:0 "Mander les prévôts municipaux."
 rip_plc_reckoning.7.t:0 "Début de la Pacification sanglante"
 rip_plc_reckoning.7.d:0 "Des nobles armés et des dragons parcourent les villages ruthènes, incendiant les granges et exigeant des rançons. Paysans et bourgeois prennent faux et mousquets."
 rip_plc_reckoning.7.a:0 "Donner carte blanche aux colonnes punitives."
 rip_plc_reckoning.7.b:0 "Arrêter les colonnes et rétablir les cours locales."
 rip_plc_reckoning.8.t:0 "Bannières privées des magnats dans les villages"
 rip_plc_reckoning.8.d:0 "Les hommes des châteaux lèvent les arriérés sabre au clair tandis que les envoyés royaux plaident pour une trêve."
 rip_plc_reckoning.8.a:0 "Maintenir les saisies au profit du Trésor."
 rip_plc_reckoning.8.b:0 "Envoyer des juges royaux entendre les griefs."
 rip_plc_reckoning.9.t:0 "Trêve dans les palatinats orientaux"
 rip_plc_reckoning.9.d:0 "Les colonnes armées regagnent leurs quartiers d'hiver, laissant domaines brûlés et villages méfiants."
 rip_plc_reckoning.9.a:0 "Confirmer la trêve devant la Diète."
 rip_rus_reckoning.1.t:0 "Inspecteurs pour les presses de Kiev"
 rip_rus_reckoning.1.d:0 "Les censeurs synodaux se plaignent que les presses de Kiev et Tchernigov publient manuels et livres liturgiques dans leur propre graphie ruthène. Un oukase soumettrait chaque tirage à Pétersbourg."
 rip_rus_reckoning.1.a:0 "Imposer la censure synodale et sceller les fontes."
 rip_rus_reckoning.1.result_tt:0 "Accélère la crise de l'Hetmanat ; après 180 jours, Kiev (ou Tchernigov) subit 6 d'agitation et Presses kiéviennes mises sous scellés pour 20 ans, avec Uniformité synodale."
 rip_rus_reckoning.1.b:0 "Respecter les chartes d'impression de l'académie."
 rip_rus_reckoning.2.t:0 "Les casses de la Laure sous scellés"
 rip_rus_reckoning.2.d:0 "Les caisses de caractères et manuscrits partent vers la chancellerie du gouverneur sous les murmures indignés des étudiants et bourgeois de Kiev."
 rip_rus_reckoning.2.a:0 "Classer l'inventaire de la censure."
 rip_rus_reckoning.3.t:0 "Liquidation de l'Hetmanat et de la Sitch"
 rip_rus_reckoning.3.d:0 "Les régiments impériaux occupent les villes régimentaires et descendent aux rapides du Dniepr pour dissoudre la Sitch, imposer les gouverneurs impériaux et enrôler les Cosaques libres aux travaux de canaux."
 rip_rus_reckoning.3.a:0 "Abolir les chartes et raser la Sitch."
 rip_rus_reckoning.3.b:0 "Adoucir l'oukase en laissant une large autonomie."
 rip_rus_reckoning.4.t:0 "Corvées de canaux et fuite des Cosaques"
 rip_rus_reckoning.4.d:0 "Les détachements cosaques envoyés creuser les canaux du nord succombent aux fièvres tandis que des familles entières fuient au-delà des marches."
 rip_rus_reckoning.4.a:0 "Maintenir les réquisitions malgré les pertes."
 rip_rus_reckoning.4.b:0 "Indemniser les familles et libérer les conscrits."
 rip_rus_reckoning.5.t:0 "Une frontière silencieuse sous les gouverneurs"
 rip_rus_reckoning.5.d:0 "La résistance armée retombe sur la Rive gauche et en Zaporogie ; les vieux rôles cosaques dorment aux archives tandis qu'ouvrent les bureaux fiscaux."
 rip_rus_reckoning.5.a:0 "Clore le registre frontalier."
 rip_cri_reckoning.1.t:0 "Courtiers de Caffa et de Perekop"
 rip_cri_reckoning.1.d:0 "Des mirzas de retour du nord réclament des remises fiscales pour agrandir les enclos de captifs à Caffa et Perekop. D'anciens beys caravaniers avertissent que ce trafic vide les vallées voisines et attire les représailles."
 rip_cri_reckoning.1.a:0 "Réduire les droits d'entrée et agrandir les enclos."
 rip_cri_reckoning.1.result_tt:0 "Accélère la crise de dépeuplement ; après 180 jours, Infamie des marchés de captifs pour 15 ans tandis que Caffa (ou Crimée) subit 4 d'agitation et 15 de dévastation."
 rip_cri_reckoning.1.b:0 "Restreindre le trafic sous des péages de caravane fixes."
 rip_cri_reckoning.2.t:0 "Représailles par-delà les gués"
 rip_cri_reckoning.2.d:0 "Les enchères bondées gonflent les coffres des mirzas, mais flottilles de tchaïkas et ambassades dénoncent le khanat dans toutes les cours."
 rip_cri_reckoning.2.a:0 "Poster des guetteurs le long du cordon littoral."
 rip_cri_reckoning.3.t:0 "Pâturages déserts et peste dans les enclos"
 rip_cri_reckoning.3.d:0 "Les districts voisins de Podolie et du Dniepr sont trop dépeuplés pour soutenir le trafic du sel, tandis que les enclos côtiers propagent la fièvre et les troubles."
 rip_cri_reckoning.3.a:0 "Boucler les quartiers infectés et disperser les troupeaux."
 rip_cri_reckoning.3.b:0 "Ouvrir les enclos aux rachats diplomatiques."
 rip_cri_reckoning.4.t:0 "Raids côtiers et caravanes ruinées"
 rip_cri_reckoning.4.d:0 "Des barques armées frappent les rades de Crimée dans le brouillard pour délivrer les captifs tandis que la douane s'effondre."
 rip_cri_reckoning.4.a:0 "Relever les retranchements côtiers sur le Trésor."
 rip_cri_reckoning.4.b:0 "Retirer les cavaliers pour garder les pâturages."
 rip_cri_reckoning.5.t:0 "Les caravanes de sel reviennent à Perekop"
 rip_cri_reckoning.5.d:0 "La fièvre retombe et les péages réguliers reprennent le pas sur les enchères de captifs ; les marchands franchissent à nouveau la chaussée de Perekop."
 rip_cri_reckoning.5.a:0 "Rouvrir la douane de Perekop."
