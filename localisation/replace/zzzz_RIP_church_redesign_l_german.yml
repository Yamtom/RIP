 rip_church_gui_shared_status_tt:0 "Hierarchical Capacity (HC) represents the local hierarchy and synod capacity to organize clergy, sustain institutions and fund devotional initiatives. It is a gameplay abstraction using the native Patriarch Authority (PA) bar, not a historical measurement of universal UGCC authority or standing with Rome. Papal relations are tracked separately. The Greek Catholic state religion provides a base +7.5 HC per year (0.625 per month). Two icons and one synod cost 60 HC per ten years; one parish visit adds 5 HC, leaving 10 HC before other costs. No extra resource is granted on loading a save."
