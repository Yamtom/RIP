 svydrigaylo.001.a:0 "Accept their independence (we have more pressing concerns)"
 svydrigaylo.001.b:0 "This is rebellion! We will reclaim our lands."
 svydrigaylo.001.d:0 "The starshyna council has formally declared the independence of the Ruthenian confederation. This announcement echoes across the lands—from the Dnieper to the Carpathians, from the Baltic frontier to the Black Sea coast. The question now is how the overlords of Lithuania and Poland will respond."
 svydrigaylo.001.t:0 "Ruthenian Independence Declared"
 svydrigaylo.100.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.100.b:0 "Decline; we thrive as an independent republic"
 svydrigaylo.100.d:0 "Zaporizhia has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a federal state uniting Kyiv, the Hetmanate, Chernihiv, and Zaporizhia under a single banner. Our autonomy as a elective military republic would be preserved, while our military strength would be amplified by the confederation."
 svydrigaylo.100.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.101.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.101.b:0 "Decline; we remain independent"
 svydrigaylo.101.d:0 "The Hetmanate has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a federal state uniting Kyiv, the Hetmanate, Chernihiv, and Zaporizhia under a single banner. Our military tradition would be honored within the confederation structure."
 svydrigaylo.101.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.102.a:0 "Accept and join the Kyivan Confederation"
 svydrigaylo.102.b:0 "Decline; we chart our own course"
 svydrigaylo.102.d:0 "Chernihiv has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer full confederation membership: a federal state uniting Kyiv, the Hetmanate, Chernihiv, and Zaporizhia under a single banner. Our Orthodox ecclesiastical traditions would be preserved as a pillar of the confederation."
 svydrigaylo.102.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.103.a:0 "Accept and lead the Kyivan Confederation"
 svydrigaylo.103.b:0 "Decline; Kyiv remains independent"
 svydrigaylo.103.d:0 "Kyiv has received a formal invitation from the newly independent Kyivan Confederation. The starshyna offer to elevate Kyiv to the status of joint capital, where the Orthodox metropolitan would serve as a spiritual leader of the confederation. A true confederation of free peoples."
 svydrigaylo.103.t:0 "The Kyivan Confederation Extends an Invitation"
 svydrigaylo.200.a:0 "Welcome our brothers-in-arms"
 svydrigaylo.200.d:0 "The Zaporizhian assembly has voted unanimously to join the Kyivan Confederation. The elective Cossack republic will now operate as the military frontier of the confederation, protecting the settled lands from steppe incursions."
 svydrigaylo.200.t:0 "Zaporizhia Joins the Confederation"
 svydrigaylo.201.a:0 "Welcome our military brothers"
 svydrigaylo.201.d:0 "The Hetmanate council has voted to join the Kyivan Confederation. The hetman will serve as military commander of the confederal forces, while the starshyna will retain their administrative autonomy in hetman succession matters."
 svydrigaylo.201.t:0 "The Hetmanate Joins the Confederation"
 svydrigaylo.202.a:0 "Welcome our spiritual brothers"
 svydrigaylo.202.d:0 "Chernihiv has voted to join the Kyivan Confederation. The city, long a center of Orthodox ecclesiastical authority, now lends its spiritual weight to the confederation's legitimacy."
 svydrigaylo.202.t:0 "Chernihiv Joins the Confederation"
 svydrigaylo.203.a:0 "A new golden age for Ruthenia"
 svydrigaylo.203.d:0 "Kyiv has accepted the invitation to join the Kyivan Confederation as joint capital. The city's metropolitan now serves as a spiritual authority for all confederation members, uniting Orthodox Christianity with political federation."
 svydrigaylo.203.t:0 "Kyiv Accepts Leadership of the Confederation"
 svydrigaylo_confederation_invitation_desc:0 "Invite the Hetmanate, Chernihiv, and Kyiv to join the Kyivan Confederation under Svydrigaylo's leadership."
 svydrigaylo_confederation_invitation_title:0 "Send Confederation Invitations"
 svydrigaylo_declare_independence:0 "Declare Ruthenian Independence"
 svydrigaylo_declare_independence_desc:0 "The moment of liberation has arrived. The Ruthenian confederation formally declares independence from Lithuanian and Polish overlordship. The starshyna, the Cossack officers, the churches, and the people stand unified. We are no longer vassals—we are a sovereign state."
 svydrigaylo_declare_independence_tooltip:0 "Removes vassal status. §GRequires:§! republican_tradition >= 60, legitimacy >= 60, overlord war_exhaustion >= 3"
 svydrigaylo_establish_starshyna_council:0 "Establish Starshyna Council"
 svydrigaylo_establish_starshyna_council_desc:0 "The Ruthenian nobility and cossack officers have organized themselves into a formal council. This is the first step toward independence from Lithuania. The council will coordinate military and diplomatic affairs, laying the groundwork for eventual sovereignty."
 svydrigaylo_establish_starshyna_council_tooltip:0 "Establishes starshyna council modifier. §GRequires:§! republican_tradition >= 40, legitimacy >= 40, 2 generals"
 svydrigaylo_form_confederation:0 "Form Kyivan Confederation"
 svydrigaylo_form_confederation_desc:0 "The time has come to unite all Ruthenian lands under one banner. Zaporizhia, the Hetmanate, Chernihiv, and Kyiv shall form the Kyivan Confederation (KRU)—a federation of free peoples pledged to mutual defense and prosperity. The confederation claims the legacy of Kyivan Rus' and stands as a bulwark against foreign domination."
 svydrigaylo_form_confederation_tooltip:0 "Changes tag to KRU, sets primary culture to ruthenian. §GRequires:§! independence declared, num_of_cities >= 3"
 svydrigaylo_independent_ruthenian_state:0 "Independent Ruthenian State"
 svydrigaylo_invite_confederation_members:0 "Rally Confederation Members"
 svydrigaylo_invite_confederation_members_desc:0 "The KRU confederation extends formal invitations to neighboring Ruthenian states to join in federation. The strength of unity is greater than the pride of independence."
 svydrigaylo_invite_confederation_members_tooltip:0 "Sends confederation invitations to ZAZ, HET, CHR, KIE. §GRequires:§! tag = KRU, legitimacy >= 60"
 svydrigaylo_prepare_independence:0 "Prepare for Independence"
 svydrigaylo_prepare_independence_desc:0 "The starshyna council has decided: we shall prepare for independence from Lithuania. Diplomatic missions are dispatched to potential allies, the army is mobilized, and defenses are strengthened. The overlord's war exhaustion provides an opportunity for Ruthenian liberation."
 svydrigaylo_prepare_independence_tooltip:0 "Begins preparation phase. §GRequires:§! republican_tradition >= 55, legitimacy >= 55, overlord war_exhaustion >= 2"
 svydrigaylo_preparing_independence:0 "Preparing for Independence"
 svydrigaylo_ruthenian_independence_war:0 "Declare Ruthenian Independence War"
 svydrigaylo_ruthenian_independence_war_desc:0 "If diplomacy fails, call the banners and fight for our freedom from the overlord."
 svydrigaylo_ruthenian_independence_war_title:0 "Proclaim the Ruthenian Independence War"
 svydrigaylo_ruthenian_independence_war_tooltip:0 "Declares war on overlord if necessary. §GRequires:§! legitimacy >= 55, army size >= 70% of force limit"
