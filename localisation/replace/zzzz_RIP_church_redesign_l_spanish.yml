 rip_church_ro_slots_tt:0 "§WActive policies§!\nPatriarch Authority sets how many may be on at once: §Y1§! below 30%, §Y2§! from 30%, §Y3§! from 65%, §Y4§! from 90%. Each costs §R3 Fervor§! a month, so income decides how many you can keep: below 30% authority, one policy without a node drains 1 Fervor/month. The first node offsets Mission upkeep; at 65% authority two nodes can sustain three policies. All four always drain the pool."
 rip_church_ro_status:0 "[Root.GetChurchROStatus] · RD [Root.GetChurchROReformDesire]%"
 rip_church_ro_status_tt:0 "[Root.GetChurchROStatus]\nReform desire: [Root.GetChurchROReformDesire]%. Autocephaly, the patriarchate, the book reform, the councils and the later synodal settlement raise it. A deliberate break with the Eastern churches is irreversible only above 100%; reform desire never creates a schism by itself.\n1448 establishes an Orthodox metropolitanate. 1589-1593 recognition preserves Orthodoxy. The Raskol after 1666 is an internal ritual conflict: the state and provinces keep their religion. A ritual compromise prevents its disaster. A separate Muscovite confession requires a deliberate alternative-history break with the other Eastern churches."
 rip_church_ro_step1:0 "[Root.GetChurchROStep1]"
 rip_church_ro_step1_tt:0 "Mission is the fourth policy above. It must stay on: closing it closes every funded node.\n[Root.GetChurchIconMissionAccess]"
 rip_church_ro_step2:0 "[Root.GetChurchROStep2]"
 rip_church_ro_step2_tt:0 "[Root.GetChurchRONodeHint]\nA node costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month. It needs a merchant, 50% trade power, a connected parish with a temple or cathedral and a province to convert. One node is allowed; two at 65% Patriarch Authority, regardless of communion. Below 65%, monthly maintenance closes excess nodes. The first node pays for Mission: +3 income minus 3 upkeep, leaving authority income."
 rip_church_ro_step3:0 "[Root.GetChurchROStep3]"
 rip_church_ro_step3_tt:0 "Open the funded node in the Trade window and select the Missionary Network trade policy. It costs no ducats and converts settled provinces beside your parishes, slowly. Independent Orthodox states stay protected until communion is renounced."
 rip_church_ro_steps_title_tt:0 "Three steps start the Muscovite mission network.\n§Y1.§! Switch on the Mission policy above.\n§Y2.§! Fund a trade node here: §Y10 Fervor§! once, then §G+3 Fervor§! a month and trade power in your parishes there.\n§Y3.§! In the Trade window of that node choose the Missionary Network policy; it converts neighbouring provinces gradually.\nFunding alone converts nothing. The first node offsets Mission upkeep: +3 - 3 = 0; authority supplies the remaining income."
