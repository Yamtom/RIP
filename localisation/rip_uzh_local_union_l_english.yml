 rip_uzh_union.1.t:0 "The Priests of the Mukachevo Eparchy"
 rip_uzh_union.1.d:0 "Local priests seek communion with Rome under a Catholic protector, asking that their Byzantine rite and their own episcopal tradition be preserved. The initiative comes from the clergy, not from a sovereign changing the state church.\n\nHistorically, 63 priests of the Mukachevo Eparchy were received by the Bishop of Eger in Uzhhorod Castle on 24 April 1646. Here their community is represented by the religion of one province: this does not mean that every inhabitant accepted the union. Acceptance preserves our state religion and grants twenty years of local protection from missionary conversion, at the cost of 10 local autonomy."
 rip_uzh_union.1.a:0 "Protect the clergy's union and guarantee their rite."
 rip_uzh_union.1.b:0 "Withhold protection; leave the local confession unchanged."
