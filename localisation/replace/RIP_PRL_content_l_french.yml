l_french:
 # Tag-scoped replacement fallback (french): owner=PRL, entity=content.
 desc_prl_brotherhood_schools:0 "Orthodox brotherhoods fund education and literacy across the realm."
 desc_prl_central_command:0 "Authority is concentrated in the hetman's hands."
 desc_prl_defiant_council:0 "The council refused external protection and rallied the host to fight on."
 desc_prl_diplomatic_network:0 "Skilled management of complex allegiances and vassal relationships demonstrates our diplomatic expertise."
 desc_prl_diplomatic_tradition:0 "Our riders know which ferries take horses and where they can change mounts. Calls for reinforcements now reach our neighbours in time."
 desc_prl_elite_regiment:0 "The Pereiaslav Regiment has achieved professional military excellence."
 desc_prl_enlightened_clergy:0 "Brotherhood schools produce educated clergy who combine piety with learning."
 desc_prl_fortified_borders:0 "Our southern frontier bristles with strongpoints, making us virtually impregnable to steppe raids."
 desc_prl_fortress_city:0 "Pereiaslav's fortifications are maintained to the highest standard, a testament to centuries of defensive tradition."
 desc_prl_grain_exports:0 "Our grain trade is organized through workshops and export channels, maximizing profit."
 desc_prl_grain_prosperity:0 "Systematic exploitation of our black earth lands has created agricultural abundance."
 desc_prl_granary_capital:0 "Pereiaslav's grain stores overflow, feeding the region and generating substantial revenue."
 desc_prl_industrial_base:0 "Manufactories process our raw materials, creating a diversified economic base."
 desc_prl_left_bank_hegemony:0 "Pereiaslav has emerged as the dominant power of the Left Bank through military, economic, and diplomatic strength."
 desc_prl_left_bank_secured:0 "Ancient Pereiaslav principality lands have been reunited under our banner."
 desc_prl_military_dominance:0 "Pereiaslav's military might is unmatched in the region, inspiring fear in our enemies."
 desc_prl_military_expansion:0 "Successful military campaigns demonstrate our power and expand our territory."
 desc_prl_monastic_network:0 "Well-supported monasteries and temples strengthen the spiritual life of our realm."
 desc_prl_monastic_patronage:0 "The state endows monasteries and religious charities."
 desc_prl_open_crossings:0 "We keep the fords free to encourage commerce and goodwill."
 desc_prl_orthodox_beacon:0 "Pereiaslav shines as a leading center of Orthodox Christianity and Ruthenian culture."
 desc_prl_orthodox_center:0 "Our episcopal see and strong church institutions make Pereiaslav a pillar of Orthodox faith."
 desc_prl_regimental_muster:0 "The town levies have gathered at Pereiaslav with stores for the march."
 desc_prl_river_control:0 "Our flotilla dominates the Dnieper and Trubizh crossings, securing both trade and strategic movement."
 desc_prl_russian_protection:0 "Pereiaslav has accepted Russian protection, trading freedom for security."
 desc_prl_sotnya_statute:0 "The regimental system has been codified into clear statutes."
 desc_prl_sotnya_system:0 "The regimental sotnia organization creates disciplined yet motivated military units."
 desc_prl_trade_hub:0 "Pereiaslav controls a dominant share of Dnieper river commerce."
 desc_prl_treaty_protection:0 "A great power alliance or vassalage provides security and diplomatic backing."
 desc_prl_trubizh_tolls:0 "Customs stations on the Trubizh collect dues from passing traders."
 PRL:0 "Pereiaslav"
 PRL_ADJ:0 "Pereiaslavlian"
 prl_ancient_bulwark:0 "Ancient Bulwark of Kyivan Rus'"
 prl_ancient_bulwark_desc:0 "Founded in 993 by Grand Prince Volodymyr, Pereiaslav has stood for centuries as the southern shield of Rus' against steppe invaders. Our fortress walls remember the sieges of Pechenegs, Cumans, and Tatars, and our garrison traditions stretch back to the age of Volodymyr Monomakh."
 prl_ancient_principality_reform:0 "Ancient Rus' Principality"
 prl_ancient_principality_reform_desc:0 "Pereiaslav inherits the traditions of the great princes of Kyivan Rus'. From Volodymyr the Great who founded our city in 993, through Volodymyr Monomakh who ruled with wisdom and strength, to Yuriy Dolgorukiy who expanded Rus' eastward—our princely lineage stretches back to the golden age. We govern not as upstart Cossack colonels, but as legitimate heirs to a thousand years of Orthodox statecraft."
 prl_border_defenses_desc:0 "For centuries, Pereiaslav stood as the southern bulwark of Rus' against nomadic invaders. We must strengthen our fortifications to continue this proud defensive tradition."
 prl_border_defenses_title:0 "Southern Frontier"
 prl_border_fortress_reform:0 "Border Fortress Command"
 prl_border_fortress_reform_desc:0 "From its earliest foundations, Pereiaslav has stood as the southern shield of Rus' against steppe incursions. Its ramparts have endured Pecheneg sieges, Cuman raids, and Tatar assaults, passing hard-won garrison craft from father to son."
 prl_brotherhood_schools:0 "Brotherhood Schools"
 prl_brotherhood_schools_desc:0 "Education is the key to preserving Orthodox custom and speech. Brotherhood schools teach literacy, theology, and statecraft, producing enlightened clergy and administrators."
 prl_brotherhood_schools_title:0 "Brotherhood Schools"
 prl_build_army_desc:0 "Call the town levies to Pereiaslav and appoint a commander who knows the steppe roads and the crossings of the Trubizh."
 prl_build_army_title:0 "Pereiaslav Levies"
 prl_central_command:0 "Central Command"
 prl_chernozem_development_desc:0 "The rich black earth surrounding Pereiaslav is legendary for its fertility. By systematically developing these lands, we can create an agricultural powerhouse that feeds armies and fills treasuries."
 prl_chernozem_development_title:0 "Chernozem Lands"
 prl_chernozem_economy_reform:0 "Chernozem Agricultural Administration"
 prl_chernozem_economy_reform_desc:0 "The rich black earth of the Pereiaslav region produces grain harvests that overflow our granaries. By organizing our economy around systematic exploitation of these fertile lands—improved crop rotations, tax collection keyed to harvest cycles, state granaries that stabilize prices—we transform agricultural abundance into state power. Let other lands struggle with poor soil; Pereiaslav's chernozem will feed armies and fill treasuries."
 prl_chernozem_granary:0 "Chernozem Granary of the Left Bank"
 prl_chernozem_granary_desc:0 "Grain from the black earth around Pereiaslav provisions the towns along the Dnieper. In a lean year the granaries can feed the garrison and still release grain for the market."
 prl_consolidate_left_bank_desc:0 "The lands east of the Dnieper once belonged to our princes. We must reunite these territories under Pereiaslav's banner and restore the ancient principality's boundaries."
 prl_consolidate_left_bank_title:0 "Consolidate the Left Bank"
 prl_defiant_council:0 "Defiant Council"
 prl_diplomatic_network:0 "Diplomatic Network"
 prl_diplomatic_prestige_desc:0 "The watch at the Trubizh can give warning of horsemen on the steppe. Give an envoy fresh mounts and letters of credence so that word reaches our allies while they can still send help."
 prl_diplomatic_prestige_title:0 "Diplomatic Prestige"
 prl_diplomatic_tradition:0 "Frontier Envoys"
 prl_elite_regiment:0 "Elite Regiment"
 prl_enlightened_clergy:0 "Enlightened Clergy"
 prl_episcopal_authority:0 "Episcopal See and Orthodox Brotherhoods"
 prl_episcopal_authority_desc:0 "Pereiaslav's ancient episcopal see is a pillar of Orthodox Christianity in the region. We must empower the church and ensure that spiritual authority reinforces temporal power."
 prl_episcopal_authority_reform:0 "Eastern-Rite Episcopate"
 prl_episcopal_authority_reform_desc:0 "Pereiaslav's ancient episcopal see anchors an Eastern Christian network of bishops, monasteries, and lay brotherhoods. A synodal compact joins their schools and courts to the metropolitan tradition of Kyiv, allowing ecclesiastical authority to support the state without replacing it."
 prl_episcopal_authority_title:0 "Strengthen the Episcopal See"
 prl_establish_regimental_republic_desc:0 "Give the elected captains seats in the regimental rada and entrust it with taxation and the muster. Adopting this constitution installs the Pereiaslav Regimental Republic as our governing reform."
 prl_establish_regimental_republic_title:0 "Establish the Regimental Republic"
 prl_flavor.1.a:0 "Swear the oath to the Tsar"
 prl_flavor.1.b:0 "We stand alone"
 prl_flavor.1.d:0 "The war has brought officers and companies to Pereiaslav, where they can muster behind the town's defences. With the regiments assembled, the rada must decide whether to accept the tsar's protection or carry on the war under its own command."
 prl_flavor.1.t:0 "The Pereiaslav Council"
 prl_flavor.2.a:0 "Codify the sotnia statutes"
 prl_flavor.2.b:0 "Strengthen the hetman's command"
 prl_flavor.2.d:0 "The Pereiaslav Regiment has grown into a political force. Some demand a written statute to codify the elected sotnia councils, while others argue the hetman must command with a firmer hand."
 prl_flavor.2.t:0 "The Pereiaslav Regiment"
 prl_flavor.3.a:0 "Fund the brotherhood schools"
 prl_flavor.3.b:0 "Support the monasteries instead"
 prl_flavor.3.d:0 "Orthodox brotherhoods petition the council to expand schools and scriptoria in Pereiaslav. Funding them would raise literacy and administrative talent, while endowing monasteries would deepen piety and charity."
 prl_flavor.3.t:0 "Brotherhood Schools of Pereiaslav"
 prl_flavor.4.a:0 "Establish a customs office"
 prl_flavor.4.b:0 "Keep the crossings open"
 prl_flavor.4.d:0 "Merchants crowd the fords at Pereiaslav. A customs office could enrich the treasury, but open crossings build goodwill and encourage commerce."
 prl_flavor.4.t:0 "Trubizh River Tolls"
 prl_fortified_borders:0 "Fortified Borders"
 prl_fortress_city:0 "Fortress City of Pereiaslav"
 prl_grain_exports:0 "Organized Grain Exports"
 prl_grain_prosperity:0 "Chernozem Prosperity"
 prl_grain_trade_desc:0 "Our surplus grain must flow to markets across the region. By building workshops and organizing export channels, we transform agricultural wealth into state revenue."
 prl_grain_trade_title:0 "Organize the Grain Trade"
 prl_granary_capital:0 "Granary Capital"
 prl_great_power_alliance_desc:0 "A warning from the watch buys us time, but holding the crossings may take more troops than our towns can raise. Seek a protector who can put men in the field beside ours."
 prl_great_power_alliance_title:0 "Great Power Patron"
 PRL_ideas:0 "Pereiaslavlian Ideas"
 PRL_ideas_bonus:0 "Pereiaslavlian Ambitions"
 PRL_ideas_start:0 "Pereiaslavlian Traditions"
 prl_industrial_base:0 "Industrial Development"
 prl_left_bank_hegemony:0 "Left Bank Hegemony"
 prl_left_bank_secured:0 "Left Bank Secured"
 prl_manufactories_desc:0 "To move beyond simple grain exports, we must invest in manufactories that process our raw materials into finished goods, creating lasting prosperity."
 prl_manufactories_title:0 "Build Manufactories"
 prl_military_campaigns_desc:0 "A professional army must prove itself in battle. Through systematic conquest and expansion, we demonstrate that Pereiaslav is not merely a defensive principality but an offensive power."
 prl_military_campaigns_title:0 "Military Campaigns"
 prl_military_dominance:0 "Military Dominance"
 prl_military_expansion:0 "Military Expansion"
 prl_military_supremacy_desc:0 "The ultimate goal: a military so powerful that no neighbor dares challenge us. Large armies, elite troops, and strong traditions make Pereiaslav invincible."
 prl_military_supremacy_title:0 "Military Supremacy"
 prl_monasteries_desc:0 "Orthodox monasteries and brotherhoods preserve learning, provide charity, and maintain the faith. By building temples and supporting these institutions, we strengthen society's spiritual foundation."
 prl_monasteries_title:0 "Monasteries"
 prl_monastic_network:0 "Monastic Network"
 prl_monastic_patronage:0 "Monastic Patronage"
 prl_open_crossings:0 "Open River Crossings"
 prl_orthodox_beacon:0 "Orthodox Beacon"
 prl_orthodox_center:0 "Orthodox Center"
 prl_orthodox_leadership_desc:0 "Pereiaslav can emerge as a leading center of Orthodox Christianity, rivaling even Kyiv in spiritual authority and cultural influence across the Ruthenian lands."
 prl_orthodox_leadership_title:0 "Orthodox Beacon"
 prl_princely_legacy:0 "Legacy of the Pereiaslavl Princes"
 prl_princely_legacy_desc:0 "We are heirs to the great princes who once ruled from Pereiaslav: Vsevolod the Wise, Volodymyr Monomakh, Yuriy Dolgorukiy, and Volodymyr Hlibovych. Their glory sanctifies our cause, and their legitimacy flows through our veins."
 PRL_Principality_Name:0 "Pereiaslav"
 prl_professional_army_desc:0 "Beyond elective councils and elected officers, we need systematic training, experienced advisors, and military professionalism to compete with great power armies."
 prl_professional_army_title:0 "Professionalize the Regiment"
 prl_regimental_muster:0 "Pereiaslav Muster"
 prl_regimental_organization_desc:0 "Divide the territory of the regiment into sotnias. Each company will elect a captain, keep its own muster roll and answer for a known stretch of the frontier."
 prl_regimental_organization_title:0 "Organize the Sotnya System"
 prl_regimental_republic_reform:0 "Pereiaslav Regimental Republic"
 prl_regimental_republic_reform_desc:0 "The Pereiaslav Regiment organizes its government through elective councils. Centurions (sotnyky) are elected by their companies, the regimental colonel (polkovnyk) serves at the pleasure of the assembly, and major decisions pass through the regimental rada. While this system sacrifices the authority of absolute rule, it produces officers who command genuine loyalty and soldiers who fight for their homeland rather than a distant crown. Once in ten years the register may be settled from the government window: fund the full muster or settle the service obligations."
 prl_regimental_sotnya:0 "Pereiaslav Regimental Sotnya System"
 prl_regimental_sotnya_desc:0 "A company drawn from neighbouring settlements can choose a captain who knows both the men and the ground. Such companies could form the basis of a Pereiaslav regiment."
 prl_regional_hegemony_desc:0 "Through military strength, economic prosperity, and diplomatic skill, Pereiaslav can become the dominant power of the Left Bank, commanding respect from Kyiv to Moscow."
 prl_regional_hegemony_title:0 "Left Bank Hegemony"
 prl_river_control:0 "River Crossing Control"
 prl_river_flotilla_desc:0 "Control of the Dnieper and Trubizh river crossings has always been key to Pereiaslav's strategic power. A strong river flotilla will secure our commercial and military interests."
 prl_river_flotilla_title:0 "River Crossings"
 prl_russian_protection:0 "Russian Protection"
 prl_sotnya_statute:0 "Sotnya Statute"
 prl_sotnya_system:0 "Sotnya System"
 prl_trade_dominance_desc:0 "The Dnieper river carries commerce between Kyiv and the Black Sea. We must establish Pereiaslav as the dominant power controlling this vital trade route."
 prl_trade_dominance_title:0 "Dnieper Commerce"
 prl_trade_hub:0 "Dnieper Trade Hub"
 prl_treaty_diplomacy_reform:0 "Frontier Chancery"
 prl_treaty_diplomacy_reform_desc:0 "Give the frontier scribes a seal and a register. When a neighbour promises troops or asks for passage, both parties can keep a copy of the terms and the names of the witnesses."
 prl_treaty_legacy:0 "Envoys at the Dnieper Crossings"
 prl_treaty_legacy_desc:0 "The same ferries carry horsemen, grain carts and messengers. A captain who knows when the crossings are safe can get an envoy to an ally in time to ask for help."
 prl_treaty_protection:0 "Treaty Protection"
 prl_trubizh_crossings:0 "Trubizh River Crossings and Dnieper Trade"
 prl_trubizh_crossings_desc:0 "Control of the vital river fords at Pereiaslav gives us leverage over all trade flowing between Kyiv and the Left Bank. Merchants pay customs, armies pay tolls, and our coffers grow fat on the commerce that must pass through our gates."
 prl_trubizh_tolls:0 "Trubizh Tolls"
 prl_vassal_management_desc:0 "A court that answers to no overlord must still hold its own dependants to their oaths. Seat a courthouse in Pereiaslav and keep at least two subject realms loyal."
 prl_vassal_management_title:0 "Master Vassal Relations"
 prl_magdeburg_charter_title:0 "Magdeburg Charter"
 prl_magdeburg_charter_desc:0 "Chartered with Magdeburg Law in 1585, Pereiaslav stood as an autonomous burgher market town bridging Left-Bank river crossings and steppe trade fairs. Extending urban charters and merchant benches strengthens civic revenues across the Pereiaslav lands."
 prl_dnieper_baroque_title:0 "Dnieper Baroque"
 prl_dnieper_baroque_desc:0 "Invite masons and carvers to Pereiaslav to raise a stone church above the river. Endow classrooms beside it so that the town can support its own teachers as well as its craftsmen."
 prl_sloboda_regiments_title:0 "Sloboda Regiments"
 prl_sloboda_regiments_desc:0 "Organizing settlements across Sloboda Ukraine and Rylsk after our regimental model settles the steppe frontier with free Cossack colonels and seasoned sotnias."
 prl_magdeburg_charter_modifier:0 "Pereiaslav Magdeburg Charter"
 desc_prl_magdeburg_charter_modifier:0 "Municipal magistrates and burgher guilds steady urban trade and crafts along the Left Bank."
 prl_pereiaslav_baroque_collegium:0 "Pereiaslav Collegium & Cathedral"
 desc_prl_pereiaslav_baroque_collegium:0 "Endowed Baroque sanctuaries and collegium scholars turn Pereiaslav into a vibrant Left-Bank seat of learning."
 prl_sloboda_regimental_frontier:0 "Sloboda Regimental Frontier"
 desc_prl_sloboda_regimental_frontier:0 "Settled Sloboda regiments guard the northeastern steppe approaches with rapid muster and fortified towns."
