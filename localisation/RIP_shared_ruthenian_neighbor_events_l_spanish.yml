l_spanish:
 rip_tur_ruthenian_palace_waqf:0 "Fundación rutena de palacio"
 desc_rip_tur_ruthenian_palace_waqf:0 "Las fundaciones benéficas y los escribas rutenos en la corte fortalecen la diplomacia con los vecinos del norte y alivian las tensiones confesionales."
 rip_tur_kamianets_defter:0 "Defter del sanjak de Podolia"
 desc_rip_tur_kamianets_defter:0 "Registros catastrales regulares y guarniciones a sueldo aseguran Kamianets y estabilizan la recaudación fronteriza."
 rip_tur_salonika_ruthenian_factors:0 "Factores cerealistas mar Negro-Egeo"
 desc_rip_tur_salonika_ruthenian_factors:0 "Los envíos protegidos de grano, miel y madera desde Podolia y el bajo Dniéper mantienen abastecidos los puertos del Egeo."
 rip_tur_phanar_kyiv_mediation:0 "Mediación Constantinopla-Kiev"
 desc_rip_tur_phanar_kyiv_mediation:0 "Las cartas de salvaguardia reconocidas entre el Fanar y el clero kievita calman a los súbditos ortodoxos y suavizan la diplomacia del norte."
 rip_cri_dnieper_salt_truce:0 "Tregua de la sal del bajo Dniéper"
 desc_rip_cri_dnieper_salt_truce:0 "Los límites de pastoreo jurados y los vados salineros vigilados canalizan los peajes de la estepa hacia el tesoro y la caballería del kanato."
 rip_cri_ruthenian_yarlyk_chancery:0 "Cancillería rutena de yarlyks"
 desc_rip_cri_ruthenian_yarlyk_chancery:0 "Escribas bilingües en lengua túrquica y eslavo de cancillería recaudan un tributo urbano estable en lugar de saqueos irregulares."
 rip_pol_ruthenian_sejmik_accord:0 "Pacto de las dietinas rutenas"
 desc_rip_pol_ruthenian_sejmik_accord:0 "Las garantías escritas para las asambleas provinciales frenan los vetos repentinos y calman los palatinados orientales."
 rip_pol_lviv_staple_corridor:0 "Corredor comercial de depósito en Leópolis"
 desc_rip_pol_lviv_staple_corridor:0 "Almacenes afianzados y barcazas fluviales enlazan la cera moldava y el grano volinio con el Báltico a través de Leópolis."
 rip_pol_ruthenian_border_register:0 "Registro fronterizo de huestes cosacas"
 desc_rip_pol_ruthenian_border_register:0 "Las pagas trimestrales regulares mantienen listas las banderas cosacas fronterizas para cubrir el borde de la estepa."
 rip_hab_galicia_cadastre_mod:0 "Catastro de Galitzia y Lodomeria"
 desc_rip_hab_galicia_cadastre_mod:0 "Los catastros imperiales limitan las exenciones señoriales y reducen el coste administrativo en las tierras de la corona rutenas."
 rip_hab_carpathian_communes:0 "Salvaguardias de los condados carpáticos"
 desc_rip_hab_carpathian_communes:0 "Confirmar los derechos de pasto rusinos y las guardias de los pasos mantiene leales los valles carpáticos durante las crisis húngaras."
 rip_hab_carpathian_post_road:0 "Correo imperial Viena-Leópolis"
 desc_rip_hab_carpathian_post_road:0 "Las postas por los pasos de los Cárpatos aceleran los despachos imperiales y las caravanas entre el Danubio y Rutenia."
 rip_tur_ruthenian_hurrem_waqf_title:0 "Dotar el waqf ruteno del palacio"
 rip_tur_ruthenian_hurrem_waqf_desc:0 "Atender las peticiones del séquito ruteno de palacio y de la casa de Hürrem sobre fundaciones benéficas y correspondencia con el norte."
 rip_tur_ruthenian_kamianets_eyalet_title:0 "Ordenar el defter del eyalato de Podolia"
 rip_tur_ruthenian_kamianets_eyalet_desc:0 "Auditar los tributos urbanos y la paga de la guarnición a lo largo del cinturón fortificado del Dniéster en torno a Kamianets."
 rip_tur_ruthenian_janissary_levies_title:0 "Auditar las listas jenízaras del norte"
 rip_tur_ruthenian_janissary_levies_desc:0 "Han surgido disputas entre los comandantes jenízaros y las tropas auxiliares de la frontera del Dniéper y la estepa póntica."
 rip_tur_ruthenian_salonika_grain_title:0 "Fletar la flota cerealista Salónica-Podolia"
 rip_tur_ruthenian_salonika_grain_desc:0 "Los mercaderes de Salónica ofrecen crédito para enlazar los envíos rutenos de grano, potasa y sebo con los mercados del Egeo."
 rip_tur_ruthenian_phanar_kyiv_synod_title:0 "Salvaguardar la correspondencia Fanar-Kiev"
 rip_tur_ruthenian_phanar_kyiv_synod_desc:0 "Emitir un berat imperial que regule a los enviados ortodoxos entre el Patriarcado en Constantinopla y la metrópoli de Kiev."
 rip_tur_ruthenian_frontier_crisis_title:0 "Pacificar las marcas de los eyalatos del norte"
 rip_tur_ruthenian_frontier_crisis_desc:0 "Cuando flaquea la autoridad en la Puerta, los notables del Dniéster y el Dniéper exigen atrasos y autonomía local."
 rip_tur_ruthenian.1.t:0 "Cartas desde las cámaras rutenas"
 rip_tur_ruthenian.1.d:0 "Servidores rutenos de la casa imperial, guiados por el ejemplo de Hürrem, presentan peticiones para puentes, pozos y salvoconductos hacia el norte. Una escritura formal de waqf ganará buena voluntad duradera, aunque los ulemas recomiendan piedad austera."
 rip_tur_ruthenian.1.a:0 "Sellar un waqf imperial y otorgar salvoconductos al norte."
 rip_tur_ruthenian.1.result_tt:0 "Tras 180 días, la Puerta gana 50 de poder diplomático, 10 de legitimidad y el modificador Fundación rutena de palacio durante 15 años."
 rip_tur_ruthenian.1.b:0 "Limitarse a la caridad de la mezquita y declinar las peticiones."
 rip_tur_ruthenian.2.t:0 "Waqf de palacio confirmado"
 rip_tur_ruthenian.2.d:0 "El cadí ha inscrito la fundación rutena en el registro imperial. Los embajadores del norte elogian la cortesía de la Puerta."
 rip_tur_ruthenian.2.a:0 "Despachar las copias selladas."
 rip_tur_ruthenian.3.t:0 "El catastro de Kamianets"
 rip_tur_ruthenian.3.d:0 "Los comisarios en Podolia informan de puentes en ruinas y peajes disputados bajo las murallas de Kamianets. Elaborar un defter imperial formal asegurará los ingresos y la fortaleza, o se pueden arrendar los impuestos de inmediato."
 rip_tur_ruthenian.3.a:0 "Compilar un defter imperial para el sanjak de Podolia."
 rip_tur_ruthenian.3.result_tt:0 "Tras 180 días, Kamianets (o una provincia rutena) gana 1 de impuesto base, -15 de autonomía local y el Defter del sanjak de Podolia durante 20 años (o 25 de poder administrativo en su defecto)."
 rip_tur_ruthenian.3.b:0 "Subastar de inmediato el arriendo fiscal fronterizo."
 rip_tur_ruthenian.4.t:0 "El defter de Podolia sellado"
 rip_tur_ruthenian.4.d:0 "El nuevo defter enumera cada molino, barcaza y bastión sobre la garganta del Smótrych. Recaudadores y alcaides siguen ahora un mismo registro."
 rip_tur_ruthenian.4.a:0 "Apostar la guarnición en las murallas."
 rip_tur_ruthenian.5.t:0 "Auxiliares en la línea del Dniéper"
 rip_tur_ruthenian.5.d:0 "Los jenízaros destinados a los fuertes del Dniéper disputan raciones con escoltas rutenos y exploradores lipka. Pagar los atrasos e imponer disciplina de campaña convertirá estas compañías en un escudo ordenado."
 rip_tur_ruthenian.5.a:0 "Pagar atrasos e instruir a las ortas fronterizas."
 rip_tur_ruthenian.5.result_tt:0 "Tras 150 días: +8 de tradición militar, -5 de decadencia si procede y +10 de lealtad jenízara."
 rip_tur_ruthenian.5.b:0 "Dejar el reparto de las listas en manos de los agás."
 rip_tur_ruthenian.6.t:0 "Orden restablecido en los fuertes de la estepa"
 rip_tur_ruthenian.6.d:0 "Pagada la tropa en formación y unificado el servicio de guardia, las compañías rivales instruyen codo con codo junto al Dniéper."
 rip_tur_ruthenian.6.a:0 "Anotar la revista en el Diván."
 rip_tur_ruthenian.7.t:0 "Factores de Salónica y grano del norte"
 rip_tur_ruthenian.7.d:0 "Corredores cristianos y judíos de Salónica proponen adelantar capital para barcazas con trigo y lino rutenos hacia el mar Negro y el Egeo."
 rip_tur_ruthenian.7.a:0 "Avalar el consorcio cerealista de Salónica."
 rip_tur_ruthenian.7.result_tt:0 "Tras 210 días, Salónica gana 1 de producción base si sigue siendo tuya (o 20 de poder diplomático), Factores cerealistas durante 15 años y +10 de lealtad dhimmi."
 rip_tur_ruthenian.7.b:0 "Cobrar los derechos portuarios habituales sin avales."
 rip_tur_ruthenian.8.t:0 "Graneros llenos en Salónica"
 rip_tur_ruthenian.8.d:0 "Los convoyes cerealistas del norte atracan bajo la Torre Blanca, abaratando el pan en el Egeo y nutriendo las aduanas de Salónica."
 rip_tur_ruthenian.8.a:0 "Ampliar los almacenes del puerto."
 rip_tur_ruthenian.9.t:0 "Enviados entre el Fanar y Kiev"
 rip_tur_ruthenian.9.d:0 "Los obispos griegos del Fanar piden a la Puerta paso seguro para monjes y eruditos kievitas con libros litúrgicos. Regular este tráfico mediante berats imperiales convierte el recelo en influencia."
 rip_tur_ruthenian.9.a:0 "Emitir berats sellados para regular los viajes Fanar-Kiev."
 rip_tur_ruthenian.9.result_tt:0 "Tras 180 días: +10 de prestigio, +35 de poder administrativo y Mediación Constantinopla-Kiev durante 15 años."
 rip_tur_ruthenian.9.b:0 "Restringir la movilidad ortodoxa a las diócesis locales."
 rip_tur_ruthenian.10.t:0 "El registro de la cancillería del Fanar"
 rip_tur_ruthenian.10.d:0 "Al registrarse cada misiva en Constantinopla antes de cruzar la estepa, prelados griegos y rutenos alaban la justicia de la Puerta."
 rip_tur_ruthenian.10.a:0 "Custodiar los berats bajo el sello del gran visir."
 rip_tur_ruthenian.11.t:0 "Disturbios en la marca de los eyalatos del norte"
 rip_tur_ruthenian.11.d:0 "Mientras las intrigas sucesorias y los panfletos revolucionarios agitan el Imperio, los notables entre el Dniéster y el Dniéper amenazan con huelgas fiscales salvo que llegue un bajá leal con plata y refuerzos."
 rip_tur_ruthenian.11.a:0 "Enviar tesoro de emergencia y levas fronterizas leales."
 rip_tur_ruthenian.11.result_tt:0 "Tras 150 días: +1 de estabilidad (o poder administrativo si está al máximo), +0.5 de soldadesca anual y -5 de decadencia si procede."
 rip_tur_ruthenian.11.b:0 "Proclamar una tregua fronteriza temporal para descansar las guarniciones."
 rip_tur_ruthenian.12.t:0 "La frontera del norte resiste"
 rip_tur_ruthenian.12.d:0 "El oro oportuno y el mando firme devuelven a la obediencia a beys díscolos y ancianos rutenos a lo largo de los ríos del norte."
 rip_tur_ruthenian.12.a:0 "Mantener la línea fluvial para el Sultán."
 rip_cri_ruthenian_dnieper_pastures_title:0 "Regular los pastos de la ruta de la sal del Dniéper"
 rip_cri_ruthenian_dnieper_pastures_desc:0 "Arbitrar entre los mirzas nómadas de Crimea y los carreteros chumak rutenos por los abrevaderos y vados bajo Zaporizhia."
 rip_cri_ruthenian_succession_envoys_title:0 "Recibir enviados rutenos en el consejo sucesorio"
 rip_cri_ruthenian_succession_envoys_desc:0 "Recabar reconocimiento, presentes y juramentos de tregua de los nobles rutenos cuando se disputa una sucesión en Crimea."
 rip_cri_ruthenian_ulus_tribute_title:0 "Instituir la cancillería rutena de yarlyks"
 rip_cri_ruthenian_ulus_tribute_desc:0 "Organizar las ciudades rutenas bajo dominio tártaro en distritos de tributo fijo en lugar de incursiones estacionales."
 rip_cri_ruthenian.1.t:0 "Rebaños nómadas y carros de sal"
 rip_cri_ruthenian.1.d:0 "Los beys acusan a los carreteros rutenos de pisotear los pastos de verano del bajo Dniéper, mientras los mercaderes amenazan con evitar las salinas de Crimea. Sellar un arancel jurado calmará a las tribus y llenará las arcas del kan."
 rip_cri_ruthenian.1.a:0 "Jurar la tregua de pastos del Dniéper y fijar los peajes."
 rip_cri_ruthenian.1.result_tt:0 "Tras 180 días: +10 de lealtad de tribus nómadas, +65 ducados y Tregua de la sal del bajo Dniéper durante 15 años."
 rip_cri_ruthenian.1.b:0 "Dejar que los mirzas tomen caballos de paso directamente."
 rip_cri_ruthenian.2.t:0 "Peajes de los vados de la sal"
 rip_cri_ruthenian.2.d:0 "Largas caravanas de carretas de bueyes cruzan bajo escolta tribal, pagando moneda y monturas en cada vado sin derramar sangre."
 rip_cri_ruthenian.2.a:0 "Entregar las cuotas tribales al kurultái."
 rip_cri_ruthenian.3.t:0 "Enviados en Bajchisarái"
 rip_cri_ruthenian.3.d:0 "Durante una sucesión tensa, enviados rutenos traen pieles de cebellina y cartas para reconocer jueces fronterizos mutuos y evitar ataques por la espalda durante el kurultái."
 rip_cri_ruthenian.3.a:0 "Recibir con honor a los enviados e intercambiar tamgas."
 rip_cri_ruthenian.3.result_tt:0 "Tras 150 días: +15 de unidad de horda (o 15 de legitimidad), +10 de prestigio y +40 de poder diplomático."
 rip_cri_ruthenian.3.b:0 "Aceptar los obsequios como mero tributo y despedirlos pronto."
 rip_cri_ruthenian.4.t:0 "Tregua septentrional confirmada"
 rip_cri_ruthenian.4.d:0 "Con las fronteras del Dniéper calmadas, los beys vacilantes se agrupan bajo el estandarte Giray en Bajchisarái."
 rip_cri_ruthenian.4.a:0 "Alzar el estandarte de colas de caballo."
 rip_cri_ruthenian.5.t:0 "Listas de tributo del ulús del norte"
 rip_cri_ruthenian.5.d:0 "Los burgueses y ancianos rutenos de las ciudades conquistadas ofrecen plata y grano estables a cambio de yarlyks bilingües que libren sus talleres del saqueo."
 rip_cri_ruthenian.5.a:0 "Fundar una cancillería bilingüe de yarlyks rutenos."
 rip_cri_ruthenian.5.result_tt:0 "Tras 210 días, una provincia rutena gana 1 de impuesto y 1 de producción base (o 25 de poder administrativo), más Cancillería rutena de yarlyks durante 15 años."
 rip_cri_ruthenian.5.b:0 "Exigir en su lugar un tributo de guerra inmediato a las ciudades."
 rip_cri_ruthenian.6.t:0 "Yarlyks de sello dorado en circulación"
 rip_cri_ruthenian.6.d:0 "Los mercados del ulús del norte reabren bajo el sello del kan, convirtiendo villas castigadas en núcleos fiscales fiables."
 rip_cri_ruthenian.6.a:0 "Enviar escribas a auditar las arcas del próximo trimestre."
 rip_pol_ruthenian_sejmik_compacts_title:0 "Negociar los pactos de las dietinas rutenas"
 rip_pol_ruthenian_sejmik_compacts_desc:0 "Acordar con los diputados de los palatinados rutenos límites escritos a las rupturas de la Dieta y las promesas electorales."
 rip_pol_ruthenian_baltic_moldavian_road_title:0 "Enlazar las rutas moldavas y bálticas de Leópolis"
 rip_pol_ruthenian_baltic_moldavian_road_desc:0 "Coordinar las aduanas entre Moldavia, Leópolis y Danzig para mover especias del mar Negro y grano volinio bajo fueros reales."
 rip_pol_ruthenian_cossack_register_roll_title:0 "Sellar la matrícula cosaca del Dniéper"
 rip_pol_ruthenian_cossack_register_roll_desc:0 "Acordar las pagas trimestrales, paños y banderas registradas con los ancianos cosacos que guardan el borde de la estepa."
 rip_pol_ruthenian.1.t:0 "Ordenanzas de los palatinados rutenos"
 rip_pol_ruthenian.1.d:0 "En Vishnia y Lutsk, las dietinas rutenas redactan ordenanzas exigiendo reglas claras antes de la próxima Dieta o elección real. Los pactos escritos pueden contener el veto y calmar los tribunales locales."
 rip_pol_ruthenian.1.a:0 "Ratificar los pactos de las dietinas bajo sello real."
 rip_pol_ruthenian.1.result_tt:0 "Tras 180 días: +1 de estabilidad (o poder administrativo si está al máximo), +10 de legitimidad y Pacto de las dietinas rutenas durante 15 años."
 rip_pol_ruthenian.1.b:0 "Responder a los diputados con meras cartas de cortesía."
 rip_pol_ruthenian.2.t:0 "Cámaras sosegadas en la Dieta"
 rip_pol_ruthenian.2.d:0 "Los diputados rutenos se alzan al unísono para leer los pactos firmados, dejando aislados a quienes pretenden obstruir la Dieta."
 rip_pol_ruthenian.2.a:0 "Inscribir las ordenanzas en la Matrícula de la Corona."
 rip_pol_ruthenian.3.t:0 "La carta de depósito Leópolis-Báltico"
 rip_pol_ruthenian.3.d:0 "Burgueses armenios, rutenos y alemanes de Leópolis piden a la Corona unir los peajes moldavos y las barcazas del Vístula bajo una sola carta de depósito hasta Danzig."
 rip_pol_ruthenian.3.a:0 "Invertir en los almacenes y barcazas de Leópolis."
 rip_pol_ruthenian.3.result_tt:0 "Tras 210 días, Leópolis gana 1 de producción base y Corredor comercial de depósito en Leópolis durante 20 años (o 30 de poder diplomático), más 2 de mercantilismo."
 rip_pol_ruthenian.3.b:0 "Vender salvoconductos temporales a los factores extranjeros."
 rip_pol_ruthenian.4.t:0 "Las caravanas llenan la plaza del mercado de Leópolis"
 rip_pol_ruthenian.4.d:0 "Los carros llegados de Suceava enlazan con las barcazas hacia el Bug y el Vístula, haciendo de Leópolis la bisagra entre el mar Negro y el Báltico."
 rip_pol_ruthenian.4.a:0 "Confirmar el sello de los gremios mercantiles."
 rip_pol_ruthenian.5.t:0 "Delegados de las villas del Dniéper"
 rip_pol_ruthenian.5.d:0 "Los coroneles cosacos presentan al gran hetmán de la Corona listas gastadas, pidiendo paños y paga segura a cambio de mantener vigilias permanentes frente a los incursores de la estepa."
 rip_pol_ruthenian.5.a:0 "Financiar la matrícula trimestral de los cosacos registrados."
 rip_pol_ruthenian.5.result_tt:0 "Tras 150 días: +8 de tradición militar, +10 de lealtad cosaca y Registro fronterizo de huestes cosacas durante 15 años."
 rip_pol_ruthenian.5.b:0 "Dejar que las banderas vivan sobre sus cuarteles de invierno locales."
 rip_pol_ruthenian.6.t:0 "Las banderas del sur revistadas"
 rip_pol_ruthenian.6.d:0 "Paños nuevos, barriles de pólvora y libros sellados llegan a Korsun y Cherkasy a tiempo para la campaña de primavera."
 rip_pol_ruthenian.6.a:0 "Aprobar la revista del gran hetmán."
 rip_hab_ruthenian_galicia_cadastre_title:0 "Catastrar las tierras de la corona de Galitzia rutena"
 rip_hab_ruthenian_galicia_cadastre_desc:0 "Enviar agrimensores de los Habsburgo para medir haciendas, salinas reales y cargas campesinas en Galitzia, Lodomeria y Rutenia carpática."
 rip_hab_ruthenian_carpathian_compromise_title:0 "Garantizar las libertades condales de Rutenia carpática"
 rip_hab_ruthenian_carpathian_compromise_desc:0 "Confirmar los fueros de las aldeas montañesas rusinas y milicias de los pasos durante crisis o compromisos en las tierras húngaras."
 rip_hab_ruthenian_danube_carpathian_post_title:0 "Abrir la posta imperial Viena-Cárpatos"
 rip_hab_ruthenian_danube_carpathian_post_desc:0 "Establecer postas por Moravia y los pasos carpáticos para enlazar Viena con Uzhgorod, Leópolis y las cortes orientales."
 rip_hab_ruthenian.1.t:0 "El catastro imperial en Rutenia"
 rip_hab_ruthenian.1.d:0 "Los comisarios imperiales en Leópolis y Maramures informan de inmunidades nobiliarias confusas, salinas ocultas y duras cargas campesinas. Un catastro unificado asegurará tributos estables y limitará la autonomía señorial."
 rip_hab_ruthenian.1.a:0 "Ordenar el catastro imperial."
 rip_hab_ruthenian.1.result_tt:0 "Tras 210 días, Leópolis (o Maramures, o 25 de poder administrativo) gana 1 de impuesto base y -15 de autonomía local, más Catastro de Galitzia y Lodomeria durante 15 años."
 rip_hab_ruthenian.1.b:0 "Dejar los repartos fiscales actuales en manos de las dietas locales."
 rip_hab_ruthenian.2.t:0 "Los libros encuadernados llegan a Viena"
 rip_hab_ruthenian.2.d:0 "Cada hacienda, salina y hogar ruteno queda inscrito en los libros de la Cámara Áulica de Viena, frenando el fraude provincial."
 rip_hab_ruthenian.2.a:0 "Depositar el catastro en la Cámara Áulica."
 rip_hab_ruthenian.3.t:0 "Ancianos de los pasos carpáticos"
 rip_hab_ruthenian.3.d:0 "En medio de las disputas entre Viena y los estamentos húngaros, alcaldes rusinos del noreste piden al soberano confirmar sus pastos, escuelas y guardias de paso bajo amparo imperial."
 rip_hab_ruthenian.3.a:0 "Confirmar las cartas locales y las guardias de los pasos."
 rip_hab_ruthenian.3.result_tt:0 "Tras 150 días: +1 de estabilidad (o poder administrativo), +1 de soldadesca base y -4 de agitación en Maramures (o 20 de poder militar), más Salvaguardias de los condados carpáticos durante 15 años."
 rip_hab_ruthenian.3.b:0 "Remitir las peticiones a la cancillería húngara."
 rip_hab_ruthenian.4.t:0 "Lealtad en los valles de montaña"
 rip_hab_ruthenian.4.d:0 "Confirmados en sus comunales serranos, los vigilantes rusinos mantienen abiertos los pasos de Verecke y Yablunytsia para los correos leales."
 rip_hab_ruthenian.4.a:0 "Pasar revista a la guardia montañesa."
 rip_hab_ruthenian.5.t:0 "Diligencias por los Beskides"
 rip_hab_ruthenian.5.d:0 "Los maestros de postas de Olomouc y Košice proponen habilitar relevos por los pasos de los Beskides hasta Uzhgorod y Leópolis."
 rip_hab_ruthenian.5.a:0 "Conceder patentes postales imperiales para la ruta carpática."
 rip_hab_ruthenian.5.result_tt:0 "Tras 180 días: +45 de poder diplomático, +8 de prestigio y Correo imperial Viena-Leópolis durante 15 años."
 rip_hab_ruthenian.5.b:0 "Contratar correos privados para despachos puntuales."
 rip_hab_ruthenian.6.t:0 "La primera trompa postal en Leópolis"
 rip_hab_ruthenian.6.d:0 "Caballos frescos aguardan cada dos leguas del Danubio al piedemonte del Dniéster, acortando a la mitad el viaje de despachos y letras de cambio."
 rip_hab_ruthenian.6.a:0 "Fijar el horario en la puerta del Hofburg."
