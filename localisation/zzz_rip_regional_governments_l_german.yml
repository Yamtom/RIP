 rip_rg_chr_bell_decision_title:0 "Ring the Veche Bell"
 rip_rg_chr_bell_decision_desc:0 "Choose a target; pay 50 ADM only on confirmation. Shared term: 10 years. Active country and province modifiers show expiry dates. Reform changes never refund the term."
 rip_rg_chr_bell_tt:0 "Choose an owned city; pay 50 ADM on confirmation.\nTarget land gains -3 Nationalism and Veche Municipal Judges (-2 Local Unrest) for 5 years.\nCountry gains Veche Deliberations (-0.05 Yearly Corruption, +10% Stability Cost; halved under Magistrat Rule) for 5 years.\nInstitution shared term: 10 years."
