 rip_church_recognize_rite_button_tt:0 "Costs §Y1 ADM§! per development. Local unrest falls by 2.5, local tax falls by 15% and manpower by 20%; after the ecumenical settlement, unrest -3, tax -10% and manpower -15%.\nThe province is not converted and does not enter the Union. It is spared Union backlash and Muscovite missions. The guarantee cannot be revoked for 10 years."
 rip_church_reconcile_button:0 "Reconcile"
 rip_church_reconcile_button_tt:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
 rip_church_reconcile_desc:0 "Costs 100 DIP and 20 Authority. Negotiations last at least five years and conclude at peace with stability 1. Universal claims are renounced; internal discontent lasts ten years."
 rip_church_reconcile_title:0 "Reconcile with the eastern patriarchates"
