 rus_cossack_autonomy_granted:0 "Russian Autonomy Granted"
 rus_cossack_autonomy_granted_desc:0 "The Russian Tsar has guaranteed our traditional freedoms."
 ruth_instituties.1:0 "The First Move"
 ruth_instituties.1a:0 "Revival in the Ruthenian"
 ruth_instituties.1d:0 "The Renaissance is already raging throughout Europe. The Ruthenian people will not remain silent, and all scientists and philosophers will consider the wiki to be the embodiment of human thought."
 ruth_instituties.1t:0 "The First Move"
 ruth_instituties.2:0 "Initial Attack"
 ruth_instituties.2a:0 "Ruthenian Reading"
 ruth_instituties.2d:0 "The first Ruthenian printing house was founded in Ostroh Academy. Ivan Fedorovych has already translated the Holy Scriptures into the Ruthenian language, as well as the 'Bukvar'. This will increase the number of literate Ruthenians by a hundred."
 ruth_instituties.2t:0 "Initial Attack"
 ruthenian_convene_court_desc:0 "Summon princes, boyars, and hetmans to set the course of our factional empire."
 ruthenian_convene_court_title:0 "Convene the Ruthenian Court"
 ruthenian_court_crisis:0 "Ruthenian Court Crisis"
 ruthenian_court_crisis_desc:0 "Factional rivalries paralyze governance as princes, boyars, and hetmans contest the court."
 ruthenian_decadence.1.a:0 "The court continues"
 ruthenian_decadence.1.d:0 "Factional rivalry shapes the realm's stability. Our actions this year will either deepen courtly decay or restore discipline."
 ruthenian_decadence.1.t:0 "Ruthenian Decadence"
 ruthenian_decadence.2.a:0 "Purge the court"
 ruthenian_decadence.2.b:0 "Buy their loyalty"
 ruthenian_decadence.2.d:0 "Decadence has peaked and the court is paralyzed. We must act decisively or pay for appeasement."
 ruthenian_decadence.2.t:0 "The Court in Crisis"
 ruthenian_eastward.1.a:0 "Organize the frontier host"
 ruthenian_eastward.1.b:0 "License the steppe trade"
 ruthenian_eastward.1.d:0 "The frontier captains press for a clear mandate: open the steppe to settlement and secure the routes with fort lines and patrols."
 ruthenian_eastward.1.t:0 "The Eastern Mandate"
 ruthenian_eastward.2.a:0 "Raise the Ural line"
 ruthenian_eastward.2.b:0 "Seed the trade posts"
 ruthenian_eastward.2.d:0 "Scouts return from the eastern ridges with maps and warnings. The Ural gate can be held by walls or opened by trade."
 ruthenian_eastward.2.t:0 "The Ural Gate"
 ruthenian_eastward.3.a:0 "March the wardens east"
 ruthenian_eastward.3.b:0 "Charter frontier companies"
 ruthenian_eastward.3.d:0 "Beyond the long forests lies a new frontier. Some call for wardens and garrisons, others for chartered companies."
 ruthenian_eastward.3.t:0 "The Manchurian Horizon"
 ruthenian_eastward.4.a:0 "Unleash raiding columns"
 ruthenian_eastward.4.b:0 "License frontier patrols"
 ruthenian_eastward.4.d:0 "Our commanders argue that one rigid fort line cannot police the open steppe. We can either rely on hard-hitting raid columns or institutional patrol contracts with frontier communities."
 ruthenian_eastward.4.t:0 "Doctrine of the Steppe Raids"
 ruthenian_eastward.5.a:0 "Open steppe corridors"
 ruthenian_eastward.5.b:0 "Raise a forward fort chain"
 ruthenian_eastward.5.d:0 "The frontier council warns that isolated forts can be bypassed or starved if movement corridors are ignored. We must choose between mobility corridors and a denser chain of fortified nodes."
 ruthenian_eastward.5.t:0 "Beyond a Single Fort"
 ruthenian_eastward_mandate:0 "Eastern Mandate"
 ruthenian_factions.2.a:0 "Let the courtiers decide."
 ruthenian_factions.20.a:0 "Noted."
 ruthenian_factions.20.d:0 "Court factions have shifted influence and the dominant coalition has been recalculated."
 ruthenian_factions.20.t:0 "The Court Rebalances"
 ruthenian_forward_fort_chain_mod:0 "Forward Fort Chain"
 ruthenian_frontier_mobility_network_desc:0 "Build relay stations and corridor tracks to keep armies moving across the steppe despite sparse fort lines."
 ruthenian_frontier_mobility_network_mod:0 "Frontier Mobility Network"
 ruthenian_frontier_mobility_network_title:0 "Frontier Mobility Network"
 ruthenian_frontier_organizers:0 "Frontier Organizers"
 ruthenian_frontier_patrol_licenses:0 "Frontier Patrol Licenses"
 ruthenian_frontier_waystations_mod:0 "Frontier Waystations"
 ruthenian_independence_accepted:0 "Accepted Ruthenian Independence"
 Ruthenian_language_act:0 "The Ruthenian Language Act"
 Ruthenian_language_act_desc:0 "Chancery statutes ordain that courts, magistracies, and provincial registers conduct their business in the Ruthenian tongue."
 ruthenian_line_fort_node_mod:0 "Fort Line Node"
 ruthenian_manchurian_companies:0 "Manchurian Companies"
 ruthenian_manchurian_push:0 "Manchurian Push"
 ruthenian_manchurian_wardens:0 "Manchurian Wardens"
 ruthenian_open_steppe_corridors_mod:0 "Open Steppe Corridors"
 ruthenian_principality:0 "Ruthenian Principality"
 ruthenian_principality_desc:0 "The prince governs through the negotiated rights and duties of appanages, boyars, and chartered towns."
 ruthenian_principality_reform:0 "Ruthenian Principality"
 ruthenian_principality_reform_desc:0 "The prince rules through negotiated obligations with appanage princes, boyars, and chartered towns. Local rights ease administration and bind subject lands to Kyiv in return for tribute and service."
 ruthenian_raiding_columns:0 "Raiding Columns"
 ruthenian_steppe_corridor_doctrine_mod:0 "Steppe Corridor Doctrine"
 ruthenian_steppe_raid_doctrine_desc:0 "Codify fast cavalry columns, deep reconnaissance, and punitive raids in the Pontic marches."
 ruthenian_steppe_raid_doctrine_mod:0 "Steppe Raid Doctrine"
 ruthenian_steppe_raid_doctrine_title:0 "Adopt Steppe Raid Doctrine"
 ruthenian_steppe_trade_licenses:0 "Steppe Trade Licenses"
 ruthenian_ural_fortified_line:0 "Ural Fortified Line"
 ruthenian_ural_gate:0 "Ural Gate Opened"
 ruthenian_ural_trade_posts:0 "Ural Trade Posts"
 sables_fields:0 "Sables and Fields"
 sables_fields_desc:0 "Fertile ploughlands and rich northern fur forests sustain hardy frontier households that fill our ranks in wartime."
 salt_state_monopoly:0 "Salt State Monopoly"
 seeking_anti_crusade_allies:0 "Seeking Anti-Crusade Allies"
 senior_udil:0 "Senior Udil"
 senior_udil_desc:0 "A junior prince of the house holds this seat at the senior prince's pleasure, rotating up the ladder of thrones. He owes the levy rather than the rent, and his grant lapses when a new senior prince takes the throne of Kyiv."
 SUPREME_ELDER:0 "Supreme Elder"
 swe_base_sprite_pack:0 "Sweden Unit Pack"
 The_federal_army:0 "The Confederate Host"
 The_federal_army_desc:0 "Every land and estate of the confederation furnishes regiments and supplies to sustain the common host."
 the_ruina_desc:0 "Hetmans are elected on both banks and each is recognised by a different crown. Armies winter where they campaigned, the towns are taken and retaken, and the register is whatever the nearest colonel says it is."
 tolerant_policy:0 "Tolerant Policy"
 TOO_MUCH_DEV_FOR_CENTER_OF_CONVERSION_TT:0 "This province has too much development to host a new center of conversion."
 union_of_brest_compromise_desc:0 "A compromise preserves local rites and reduces unrest but slows conversion."
 union_of_brest_enforced_desc:0 "The church union is enforced by the crown, provoking unrest while improving conversion efforts."
 UNITED_CLANS:0 "United Clans"
 ven_base_sprite_pack:0 "Venice Unit Pack"
 victorious_crusader:0 "Victorious Crusader"
 KUY_magdeburg_guilds_title:0 "Magdeburg Guilds"
 KUY_magdeburg_guilds_desc:0 "Medieval Arabic geographers knew Kuyaba as a thriving trading city at the crossroads of northern riverways and southern caravans. Confirming autonomous municipal guilds and merchant courts across our cities draws artisans and credit from the Baltic to the Black Sea."
 KUY_granary_of_steppe_title:0 "Granary of the Steppe"
 KUY_granary_of_steppe_desc:0 "Reconciling sedentary farmers along the Dnieper with steppe caravaneers unlocks vast harvests of chernozem wheat. Storing and shipping this grain turns Kuyaba into a vital supplier across Pontic and Mediterranean markets."
 KUY_dnieper_crossings_title:0 "Across the Dnieper"
 KUY_dnieper_crossings_desc:0 "With the right bank secured beneath Kyiv's citadel, Kuyaba's banners must cross the Dnieper to unite the meadows of Pereiaslav and Poltava and safeguard the northeastern approaches."
 KUY_steppe_caravans_title:0 "Steppe Caravans"
 KUY_steppe_caravans_desc:0 "Rather than abandoning the lower Dnieper to raiding corridors, Kuyaba's amirs and merchant syndics fortify waystations across Yedisan, Zaporozhia, and Crimea so livestock drovers and silk-road caravans move under one peace."
 KUY_restore_kuyaba_title:0 "Restore Kuyaba"
 KUY_restore_kuyaba_desc:0 "Raising the banner of Kuyaba over Kyiv proclaims a syncretic Muslim-Ruthenian realm uniting urban craftsmanship with the diplomatic networks of the Pontic steppe."
 KUY_crimean_gates_title:0 "Crimean Gates"
 KUY_crimean_gates_desc:0 "Controlling the Crimean peninsula and the Azov mouths gives Kuyaba mastery of the northern Black Sea ports and the river exits of the Don and Dnieper."
 KUY_sultanate_of_rus_title:0 "Sultanate of Rus'"
 KUY_sultanate_of_rus_desc:0 "With the Ruthenian heartland governed under Kuyabian law, our fleets active on the Black Sea, and our caravan cities prosperous, Kuyaba stands recognized as a sovereign sultanate spanning the steppe and forest zones alike."
 KUY_black_sea_fleet_title:0 "Black Sea Fleet"
 KUY_black_sea_fleet_desc:0 "No sovereign of the lower Dnieper can rest secure without galleys and frigates shielding its estuaries. Launching a war fleet from our Pontic harbors projects Kuyabian sea power toward the Bosporus."
 KUY_bosporus_straits_title:0 "Bosporus Straits"
 KUY_bosporus_straits_desc:0 "Whether through bold conquest of the imperial straits or an enduring commercial entente with the holder of the Queen of Cities, Kuyabian merchants claim direct passage between the Dnieper basin and Mediterranean ports."
 kuy_magdeburg_guilds_modifier:0 "Kuyabian Merchant Guilds"
 desc_kuy_magdeburg_guilds_modifier:0 "Autonomous town magistrates and caravan fondacos coordinate urban crafts and long-distance commerce across Kuyaba."
 kuy_steppe_granary:0 "Kuyabian Grain Granaries"
 desc_kuy_steppe_granary:0 "Protected black-earth estates feed both Kuyaba's cities and Pontic merchant fleets."
 kuy_steppe_caravans_modifier:0 "Pontic Caravan Peace"
 desc_kuy_steppe_caravans_modifier:0 "Fortified steppe stations keep Dnieper-Crimean caravan roads open and profitable."
 kuy_black_sea_fleet_modifier:0 "Kuyabian Pontic Fleet"
 desc_kuy_black_sea_fleet_modifier:0 "Light galleys and river corsairs guard Kuyaba's estuaries and sea lanes."
 kuy_sultanate_of_rus_modifier:0 "Sultanate of Kuyaba"
 desc_kuy_sultanate_of_rus_modifier:0 "Inclusive frontier governance and imperial standing stabilize Kuyaba across diverse faiths and peoples."
 KUY_every_grain_province_tt:0 "Every owned province producing §YGrain§! with a production building receives §YKuyabian Grain Granaries§! for §Y20 years§!."
 kuy_steppe_grain:0 "Kuyabian Steppe Grain"
