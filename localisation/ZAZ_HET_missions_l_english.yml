l_english:


# ZAZ_establish_sich
 ZAZ_establish_sich_title:0 "Establish the Sich"
 ZAZ_establish_sich_desc:0 "Below the rapids the islands lie beyond the reach of any starosta's writ. A palisade, a store of powder and a church make a Kish; the Rada sits, the otaman is chosen, and men who owe labour elsewhere begin to arrive."
 
# ZAZ_chaiky_raids
 ZAZ_chaiky_raids_title:0 "The Chaiky Fleet"
 ZAZ_chaiky_raids_desc:0 "A chaika is a hollowed lime trunk bundled with reeds at the gunwale, fifty men to a hull, rowing where a galley draws too much water. Kaffa and the Bosphorus villages are three nights downwind. The Porte will answer, but not quickly."
 
# ZAZ_rally_hordes
 ZAZ_rally_hordes_title:0 "Masters of Steppe Warfare"
 ZAZ_rally_hordes_desc:0 "The frontier villages breed men who ride from childhood and shoot from the saddle. Drilled to volley as well, the Host fields horse that skirmishes like a Nogai and holds like a Polish banner."
 
# ZAZ_orthodox_protectors
 ZAZ_orthodox_protectors_title:0 "Defenders of Orthodoxy"
 ZAZ_orthodox_protectors_desc:0 "The Latin bishops hold the endowments and the king's ear; our metropolitan keeps his seat in Kyiv on sufferance. The brotherhoods of Lviv and Kyiv keep their schools on what the pious still send, and their sons come to the Host when the town gates close to them."
 
# ZAZ_independce
 ZAZ_independce_title:0 "The Path to Freedom"
 ZAZ_independce_desc:0 "Our hetmans hold the bulava at the king's pleasure and our numbers are fixed by his register. The Host has kept this frontier for Vilnius, for Krakow and for Moscow in turn, and been paid in promises each time."
 
# ZAZ_lit
 ZAZ_lit_title:0 "Break the Polish Yoke"
 ZAZ_lit_desc:0 "The magnates hold the steppe as private latifundia and press free men into labour dues. The register is cut when it suits the Sejm and our elders are executed when it does not. The bulava has bowed to that crown long enough."
 
# ZAZ_finally
 ZAZ_finally_title:0 "The Zaporozhian State"
 ZAZ_finally_desc:0 "The Host answers to no crown but its own. The Rada elects the hetman, and the bulava passes by acclamation rather than by royal patent. Yet a free Host must still choose its friends: the Tsar offers protection, the Porte offers trade, the Commonwealth remembers its grievances, and the Horde remembers the road north."


 ZAZ_ally_tur_title:0 "Ottoman Alliance"
 ZAZ_ally_tur_desc:0 "The Porte asks little of a tributary beyond quiet on the frontier and troops when called. A sultan's charter would cover us against Polish revenge and open the Black Sea ports to our grain. It would also set the Sich under a Muslim overlord, and the parishes will have views."
 
 ZAZ_TUR_contest_crimea_title:0 "Contest Crimean Dominance"
 ZAZ_TUR_contest_crimea_desc:0 "The Khan holds his throne by Ottoman warrant and takes our people north of Perekop every season. With the Porte's favour we can press the Girays for the coastal fortresses, and for the tribute they collect in our name."
 
 ZAZ_TUR_slave_trade_title:0 "Disrupt the Slave Trade"
 ZAZ_TUR_slave_trade_desc:0 "Kaffa's market moves thousands of Ruthenian and Polish captives a year, and the Khan's revenue rests on it. As the Sultan's men we may enter the port lawfully; what happens to the pens once we are inside is another matter."

 ZAZ_ally_rus_title:0 "The Muscovite Protectorate"
 ZAZ_ally_rus_desc:0 "Moscow styles itself the Third Rome and offers the Host artillery, grain and a patriarch of our own rite. The Tsar's clerks will also want the register, the customs, and the naming of our colonels."
 
 ZAZ_RUS_brack_lit_title:0 "Reconquer the Ruthenian Lands"
 ZAZ_RUS_brack_lit_desc:0 "With Muscovite guns the Dnieper towns can be taken from the Commonwealth in one season. Kyiv, Chernihiv and Smolensk would return to an Orthodox crown — though which crown, and on what terms, the treaty does not say plainly."
 
 ZAZ_RUS_settle_south_title:0 "Colonize New Russia"
 ZAZ_RUS_settle_south_desc:0 "The land between the Dnieper and the Don carries neither plough nor garrison. Cossack stanitsas and slobodas would hold it, and the Tsar's surveyors would follow to write it into a province with a Russian name."

 ZAZ_ally_pol_title:0 "Return to the Commonwealth"
 ZAZ_ally_pol_desc:0 "The Commonwealth elects its kings and binds them by pacta conventa, a thing neither Moscow nor the Porte would credit. Our elders see their own Rada in the Sejm. The Sejm sees peasants with sabres."
 
 ZAZ_POL_politics_title:0 "Seats in the Sejm"
 ZAZ_POL_politics_desc:0 "Let the hetman sit in the Senate beside the palatines, the starshyna be entered in the armorial, and the register be set by treaty rather than by the crown's convenience. The szlachta will ask who else may claim a coat of arms."

 ZAZ_ally_tartar_title:0 "Alliance of Steppe Peoples"
 ZAZ_ally_tartar_desc:0 "The Khan's horsemen and our own keep the same seasons and take the same plunder, and have ridden together as often as against each other. An understanding with the Girays frees our backs, and costs us every parish that lost a son at Perekop."
 
 ZAZ_GOL_politics_title:0 "The Steppe Confederation"
 ZAZ_GOL_politics_desc:0 "Crimea, Kazan and Astrakhan quarrel over precedence and pay Moscow separately for it. Cossack foot behind Tatar horse would make one power of the steppe, if the murzas can be brought to sit at one Rada."

 ZAZ_only_zaz_title:0 "The Cossack Republic"
 ZAZ_only_zaz_desc:0 "No king, tsar, sultan or khan holds our charter. The Kish feeds itself from the river, the herd and the raid, and the Rada answers to nobody. Standing alone on open steppe is a policy that must be renewed every campaigning season."
 
 ZAZ_UKR_politics_title:0 "Cossack Liberties"
 ZAZ_UKR_politics_desc:0 "Every Cossack votes at the Rada, officers are chosen by acclamation, and a Kosh Otaman who loses the Host's confidence lays down the bulava the same day. Extending that custom to towns and regiments is another matter."


# ZAZ_krakow
 ZAZ_krakow_title:0 "Raid on Kraków"
 ZAZ_krakow_desc:0 "Krakow keeps the Wawel, the crown treasury and the rents wrung from our starostwa. A raid through Malopolska would not hold the city, but it would settle what the magnates believe about the reach of Cossack horse."
 
# ZAZ_moskva  
 ZAZ_moskva_title:0 "Strike at the Third Rome"
 ZAZ_moskva_desc:0 "Moscow calls the gathering of the Rus' lands a duty, and our liberties a privilege it may revise. If the Tsar will not set them in writing, the Host can show him what the gathering costs when the gathered object."


# ZAZ_settlements
 ZAZ_settlements_title:0 "The Sloboda System"
 ZAZ_settlements_desc:0 "Between the fortress line and the open steppe there is room for slobodas — settlements exempt from labour dues, ploughed by men who left a lord behind. Cossack posts would cover them; the lords will write to the Sejm about it."

# ZAZ_istanbul
 ZAZ_istanbul_title:0 "The Constantinople Raid"
 ZAZ_istanbul_desc:0 "Our grandfathers took chaiky into the Bosphorus and burned the suburbs within sight of the Sultan's windows. The Porte has since chained the straits and keeps a squadron at the mouth. The insult is remembered on both sides."


# HET_establish_capital
 HET_establish_capital_title:0 "The Hetman's Capital"
 HET_establish_capital_desc:0 "A Host that keeps a chancery, an archive and a treasury needs walls to keep them behind. Kyiv carries the metropolitan see, Chyhyryn the hetman's own estates. Whichever is chosen, the Rada will meet less often once the clerks are housed."

# HET_starshyna_system
 HET_starshyna_system_title:0 "The Starshyna Elite"
 HET_starshyna_system_desc:0 "The colonels hold their regiments as districts, judge within them and grant land in them. Within a generation the starshyna will be a nobility in all but the armorial, and will ask for that too."

# HET_kyiv_academy
 HET_kyiv_academy_title:0 "The Kyiv-Mohyla Academy"
 HET_kyiv_academy_desc:0 "Metropolitan Mohyla's academy teaches theology in Greek and Latin both, and its graduates fill the chancery as readily as the pulpit. Under our protection it draws students from Moldavia to Muscovy, and answers the Latin colleges in their own tongue. A realm is held by its scribes no less than by its sabres."

# HET_printing_press
 HET_printing_press_title:0 "The Printing Press"
 HET_printing_press_desc:0 "Presses at Kyiv and Chernihiv would set the liturgy, the chronicles and the regimental statutes in Church Slavonic, and end our dependence on Lviv and Vilnius for books. What a press prints, a censor elsewhere cannot easily unprint."

# HET_black_sea_trade
 HET_black_sea_trade_title:0 "Black Sea Commerce"
 HET_black_sea_trade_desc:0 "The black earth yields more grain than the Host can eat and the river carries it to the sea. Contracts with the Ottoman and Genoese factors put hard coin in the treasury, and tie our harvest to a market the Porte controls."


# HET_mazepa_reform
 HET_mazepa_reform_title:0 "Mazepa's Renaissance"
 HET_mazepa_reform_desc:0 "The hetman endows churches in the new manner, keeps a Latin secretary and a court that would not shame Warsaw. Baroque masonry rises over the Dnieper, and the starshyna who pay for it expect their estates confirmed in return."

# HET_swedish_alliance
 HET_swedish_alliance_title:0 "The Swedish Gambit"
 HET_swedish_alliance_desc:0 "The Swedish king marches east with the finest army in Europe and offers a written guarantee of Cossack liberties. The Tsar's forces stand between him and us. A guarantee is worth what the guarantor's next battle makes it worth."

# HET_poltava_choice
 HET_poltava_choice_title:0 "The Battle of Poltava"
 HET_poltava_choice_desc:0 "The armies close near Poltava, Swedish foot against Russian works and three times their guns. Our regiments must be committed before the first volley, and there will be no second choosing."

# HET_russian_repression
 HET_russian_repression_title:0 "After Poltava"
 HET_russian_repression_desc:0 "Chortomlyk is burned, residents are installed in the chancery, and the register is kept in Moscow now. Colonels are appointed rather than elected. The forms of the Hetmanate remain, and are read aloud at each new appointment."

# HET_final_hetman
 HET_final_hetman_title:0 "Rozumovsky - Last of the Hetmans"
 HET_final_hetman_desc:0 "The last hetman signs in French, visits his regiments seldom, and asks that the office be made hereditary in his house. The request will be answered by abolishing the office."

# HET_sich_destruction
 HET_sich_destruction_title:0 "Destruction of the Sich - 1775"
 HET_sich_destruction_desc:0 "Regiments of the line surround the palisade and the guns are laid before terms are offered. The Kosh Otaman goes north under escort to a monastery cell. The lands are surveyed for settlement before the year is out."


