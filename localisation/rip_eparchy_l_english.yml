 rip_eparchy.1.t:0 "Bishop Vynnytsky of Peremyshl"
 rip_eparchy.1.d:0 "Bishop Kopystensky stayed Orthodox in 1596, and Orthodox and Uniate claimants contested the Peremyshl see for nearly a century after. Bishop Inokentii Vynnytsky joined the union publicly in 1691, some sources say 1692, and ended the quarrel with one dated act.\n\nHere the seat is represented by one province; the union does not mean that every inhabitant followed the bishop. Acceptance makes the province Greek Catholic at the cost of 10 local autonomy; it also protects the rite from missionary conversion and grants a diocese (-1 local unrest, +10% local tax) for twenty years. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Twenty years is a long promise for any crown to keep."
 rip_eparchy.1.l:0 "Bishop Kopystensky stayed Orthodox in 1596, and Orthodox and Uniate claimants contested the Peremyshl see for nearly a century after. Bishop Inokentii Vynnytsky joined the union publicly in 1691, some sources say 1692, and ended the quarrel with one dated act. Here that date has passed without a settlement, and the question is still open.\n\nHere the seat is represented by one province; the union does not mean that every inhabitant followed the bishop. Acceptance makes the province Greek Catholic at the cost of 10 local autonomy; it also protects the rite from missionary conversion and grants a diocese (-1 local unrest, +10% local tax) for twenty years. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Twenty years is a long promise for any crown to keep."
 rip_eparchy.1.a:0 "Receive the bishop's union"
 rip_eparchy.1.b:0 "Turn the petition away — alternative history"
 rip_eparchy.2.t:0 "Bishop Shumliansky of Lviv"
 rip_eparchy.2.d:0 "Bishop Shumliansky of Lviv joined the union officially on 9 June 1700, after an acceptance kept secret that some sources place in 1677. The Lviv Dormition brotherhood followed in 1708.\n\nHere the seat is represented by one province; the brotherhood's step of 1708 is not modelled. Acceptance makes the province Greek Catholic at the cost of 10 local autonomy; it also protects the rite from missionary conversion and grants a diocese (-1 local unrest, +10% local tax) for twenty years. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. A written guarantee is worth what the next chancellor makes of it."
