l_english:

 # --- the union quarrel

 union_dispute.1.t:0 "Krakow Has No King"
 union_dispute.1.d:0 "The king is dead in the field beyond the Danube and the Crown has nobody to crown. The lords of Vilnius have a grand duke already - ours - and Krakow's envoys have come to ask whether he would care to be king as well. They did not bring a copy of the terms. The last union was written by whoever held the pen, and the two chanceries still keep different copies of it."
 union_dispute.1.a:0 "Send him south, on our terms"
 union_dispute.1.b:0 "He stays in Vilnius"
 union_dispute.1.c:0 "Let the envoys wait"

 union_dispute.2.t:0 "The Terms from Vilnius"
 union_dispute.2.d:0 "The Lithuanian answer reads like a treaty rather than an acceptance: a common monarch, and everything else - council, treasury, levy, courts - left where it stands. The Crown's lawyers observe that this is not what a union is. The Crown's soldiers observe that Vilnius is a long way off."
 union_dispute.2.a:0 "Accept, and crown him"
 union_dispute.2.b:0 "The Crown does not treat with a province"

 union_dispute.3.t:0 "The Castles Nobody Will Divide"
 union_dispute.3.d:0 "Two chanceries have been issuing grants for the same castles in Volhynia and Podillia for as long as the registers go back, and each starosta holds a charter from whichever court gave him one first. Neither king wants a war over them. Neither will sign them away either."
 union_dispute.3.a:0 "Put our own garrisons in"
 union_dispute.3.b:0 "Send it to arbitration"
 union_dispute.3.c:0 "Let the local princes hold them"

 union_dispute.4.t:0 "Two Treasuries, One King"
 union_dispute.4.d:0 "The Grand Duchy pays its own levy, keeps its own chest and audits it at Vilnius; the Crown does the same at Krakow, and the king signs both sets of accounts without setting them side by side. It works, in the sense that nothing has fallen over. It works badly whenever both halves are at war at once."
 union_dispute.4.a:0 "The chest stays in Vilnius"
 union_dispute.4.b:0 "Let the chests be joined"

 union_dispute.5.t:0 "The Act Before the Diet"
 union_dispute.5.d:0 "The Crown has put an act before the diet moving Podlasie, Volhynia, Bratslav and Kyiv out of the Grand Duchy and into the Crown, and the king's signature is available for it. Nothing is being invaded. The szlachta of those palatinates were asked what they thought, and enough of them prefer the Crown's law of inheritance to have answered."
 union_dispute.5.a:0 "Let the act pass"
 union_dispute.5.b:0 "Walk out of the diet"

 union_dispute.6.t:0 "The Act Passes"
 union_dispute.6.d:0 "The palatinates are the Crown's: entered in the Crown's registers, judged in the Crown's courts, represented in the Crown's Sejm. It took a session and a signature. The Grand Duchy's delegation was not in the room, which is being described here as their own decision."
 union_dispute.6.a:0 "Enter them in the register"

 union_dispute.7.t:0 "Two Nations, One Monarch"
 union_dispute.7.d:0 "It is settled and written: one elected monarch and one foreign policy, above two treasuries, two armies, two codes and two sets of offices. The lawyers of both halves have signed something neither half can now amend alone. Everything will take longer. Everything will also require us."
 union_dispute.7.a:0 "Seal it in both chanceries"

 union_dispute.8.t:0 "A Crown at Vilnius"
 union_dispute.8.d:0 "The Grand Duke has been crowned in his own cathedral with a crown made here, and the deputies who used to ride to Lublin have been told to stay home. The Statute, the levy, the treasury and the palatinates are ours to hold - and ours alone to hold. Krakow's first letter was courteous. The second asked whose candidate would stand at our next election."
 union_dispute.8.a:0 "Let the crown stand"

 union_dispute.9.t:0 "Signed About Us, Without Us"
 union_dispute.9.d:0 "Word has come from the diet: the palatinates changed hands between two chanceries, in one session, without a shot. The land is the same, the starostas are the same, the tax is the same. What changed is which court hears a case and which law decides who inherits."
 union_dispute.9.a:0 "Note it, and arm the districts"
 union_dispute.9.b:0 "Note it, and read the new law"

 union_dispute.10.t:0 "The Delegation Walks Out"
 union_dispute.10.d:0 "The Lithuanian benches emptied before the vote and the act died where it lay. The palatinates stay with the Grand Duchy, and the szlachta who had already bought land in them are asking the Crown what it means to do about their charters. The king has so far said nothing."
 union_dispute.10.a:0 "Let it lie for now"
 union_dispute.10.b:0 "Draw up the charters anyway"

 union_dispute.11.t:0 "Offices for Our Own"
 union_dispute.11.d:0 "The Statute keeps office in the Grand Duchy for men who hold land in the Grand Duchy, which in practice means our own families, and the Crown keeps a matching rule of its own. A lord who wants both must buy land twice. The Crown's lawyers call this a barrier; the council calls it the point."
 union_dispute.11.a:0 "Keep office in our own hands"
 union_dispute.11.b:0 "Open the offices both ways"

 # --- the confessional split inside the Grand Duchy

 lit_confession.1.t:0 "The Court and the Country"
 lit_confession.1.d:0 "The Grand Duke hears mass in Latin and most of his subjects hear it in Slavonic, and the privilege that fills the council reserves its seats for men of the Latin rite. The Orthodox lords who hold half the eastern palatinates have done the arithmetic. So far they have raised it politely."
 lit_confession.1.a:0 "Open the council to them"
 lit_confession.1.b:0 "The privilege stands as written"

 lit_confession.2.t:0 "Who Keeps the Metropolitan"
 lit_confession.2.d:0 "The metropolitan of Kyiv sits inside the Grand Duchy, and Moscow's man claims the title of all Rus along with the tithes that follow it. Whoever pays for the see appoints to it, and whoever appoints to it is heard in every parish from Polotsk to the steppe. A third suitor, in Rome, has been writing for years."
 lit_confession.2.a:0 "Fund a metropolitan of our own"
 lit_confession.2.b:0 "Let Moscow's man collect"
 lit_confession.2.c:0 "Write to Rome about a union"

 lit_confession.3.t:0 "Slavonic Type in Vilnius"
 lit_confession.3.d:0 "A printer has set up in Vilnius with type cut for Slavonic, and his first books are a psalter and a Bible in a language the palatinates can read without a priest at the elbow. The Church has not decided whether this is piety or a problem. The buyers have."
 lit_confession.3.a:0 "Charter the press"
 lit_confession.3.b:0 "Let the bishop hold the licence"

 lit_confession.4.t:0 "The Court Turns Calvinist"
 lit_confession.4.d:0 "The greatest house in the Grand Duchy has taken the new confession, and its town now has a press, a school and a congregation that argues in print with anyone who answers. The Crown's magnates have flirted with the same books. Here it is the palatine himself, and half his clients have followed him."
 lit_confession.4.a:0 "The court may follow him"
 lit_confession.4.b:0 "The court stays with Rome"

 lit_confession.5.t:0 "Which Guarantee Holds"
 lit_confession.5.d:0 "A Ruthenian lord threatened with the loss of an office may plead the Confederation, which the Crown swore to, or the Statute, which is ours. The two say nearly the same thing. Which one he pleads decides whose court hears him, and that has become the whole question."
 lit_confession.5.a:0 "The Statute answers first"
 lit_confession.5.b:0 "The Confederation answers first"

 lit_confession.6.t:0 "The Academy at Vilnius"
 lit_confession.6.d:0 "The Society has been offered the college at Vilnius and an endowment to raise it into an academy: Latin, theology, and disputations open to the town. Its graduates will argue better than anyone else in the Grand Duchy. Their first opponents will be the brotherhood schools two streets away."
 lit_confession.6.a:0 "Endow the academy"
 lit_confession.6.b:0 "Endow the brotherhood schools"

 lit_confession.7.t:0 "Two Bishops in Every See"
 lit_confession.7.d:0 "Every eastern see now has two claimants: the bishop who signed the union and the bishop the brotherhoods consecrated against him, each with his own clergy, his own courts and his own registers of baptism. The parishes are being asked to choose, and asked again the next year. The lawsuits will outlive everyone in them."
 lit_confession.7.a:0 "Enforce the union in every see"
 lit_confession.7.b:0 "Let both hierarchies stand"
 lit_confession.7.c:0 "Restore the old hierarchy"

 lit_confession.8.t:0 "The Guarantee Is Sealed"
 lit_confession.8.d:0 "It is in the Statute now, in the same hand as the land law: no man of the Grand Duchy forfeits property, office or court for the rite he was baptised in. The nuncio's protest arrived within the month. The palatinates that furnish half our horse sent something warmer."
 lit_confession.8.a:0 "Read it in every castle court"

 lit_confession.9.t:0 "The Bishops Ask About the East"
 lit_confession.9.d:0 "The Crown's bishops have spent a generation recovering what the Reformation took, and they have noticed that across the border the Grand Duchy's Statute protects a rite they consider themselves finished arguing with. They want the king to raise it at the diet. He holds both crowns, which is precisely the difficulty."
 lit_confession.9.a:0 "Raise it at the diet"
 lit_confession.9.b:0 "The Statute is not ours to amend"

 lit_confession.10.t:0 "The Nuncio's Question"
 lit_confession.10.d:0 "Rome has read the Grand Duchy's guarantee to its Orthodox lords, written in the same hand as the land law, and wishes to know how a Catholic monarch came to sign it. The nuncio has been polite and has not left. The clause protects half the horse of the eastern palatinates."
 lit_confession.10.a:0 "Have the clause struck"
 lit_confession.10.b:0 "Tell Rome whose Statute it is"

 lit_confession.11.t:0 "Our Statute, Read Out in Krakow"
 lit_confession.11.d:0 "The Crown has raised our confessional clause at its own diet, and the speeches have been reported here word for word. The lords of the council are less exercised about the rite than about who imagines he may amend our code. The palatinates that furnish the horse have written in already."
 lit_confession.11.a:0 "Then the Statute answers first"
 lit_confession.11.b:0 "Let the king have his way"
