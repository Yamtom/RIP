 south_ukraine_codify_frontier_desc:0 "After consolidating the late southern reforms, issue statutes that standardize patrol duties, settlement rights, and border obligations across the marches."
 south_ukraine_codify_frontier_title:0 "Codify the Steppe Frontier"
 south_ukraine_enable_process_cri_desc:0 "Bypass Crimea's vanilla Ottoman synchronization and manually enable the Southern Ukraine process under direct khanate oversight."
 south_ukraine_enable_process_cri_title:0 "Enable Crimean Southern Process"
 south_ukraine_enable_process_mol_desc:0 "Bypass Moldavia's vanilla march synchronization and manually enable the Southern Ukraine process under direct state oversight."
 south_ukraine_enable_process_mol_title:0 "Enable Moldavian Southern Process"
 south_ukraine_grain_exchange_desc:0 "Once the maritime route is secured, charter an exchange that unifies grain contracts, convoy insurance, and market prices for the southern ports."
 south_ukraine_grain_exchange_title:0 "Establish a Black Sea Grain Exchange"
 south_ukraine_history.1.a:0 "Build the watchlines"
 south_ukraine_history.1.b:0 "Rely on mobile patrols"
 south_ukraine_history.1.d:0 "Raiders probe the lower Dnieper marches. Veteran scouts urge the construction of watch posts and beacon lines, while others argue for mobile patrols instead of fixed forts."
 south_ukraine_history.1.t:0 "Frontier Watchlines"
 south_ukraine_history.10.a:0 "Charter the port"
 south_ukraine_history.10.b:0 "Strengthen the interior"
 south_ukraine_history.10.d:0 "Surveyors propose a new port on the northern Black Sea coast to channel trade and shipbuilding. The charter would require heavy investment."
 south_ukraine_history.10.t:0 "New Port Foundations"
 south_ukraine_history.11.a:0 "Launch settlement drives"
 south_ukraine_history.11.b:0 "Hold to existing estates"
 south_ukraine_history.11.d:0 "Empty tracts along the steppe invite settlement. Offering charters and supplies could raise new towns and fields, while restraint preserves the old order."
 south_ukraine_history.11.t:0 "Steppe Colonization Drives"
 south_ukraine_history.12.a:0 "Centralize the frontier"
 south_ukraine_history.12.b:0 "Preserve frontier liberties"
 south_ukraine_history.12.d:0 "Administrators argue that the southern marches must be brought under tighter imperial regulation. Others warn that heavy hands could shatter frontier loyalty."
 south_ukraine_history.12.t:0 "Imperial Frontier Reform"
 south_ukraine_history.2.a:0 "Sponsor the caravans"
 south_ukraine_history.2.b:0 "Tax their wagons"
 south_ukraine_history.2.d:0 "Salt and grain caravans drift between the steppe wells and the Black Sea estuaries. Sponsoring the Chumak routes could strengthen southern trade, but taxing them promises fast revenue."
 south_ukraine_history.2.t:0 "Chumak Caravans"
 south_ukraine_history.3.a:0 "Sign a compact"
 south_ukraine_history.3.b:0 "Defy the demands"
 south_ukraine_history.3.d:0 "Steppe intermediaries offer escorts and safe conduct in exchange for tribute and market access. Accepting could steady the border, but at the price of pride and coin."
 south_ukraine_history.3.t:0 "Steppe Protection Compact"
 south_ukraine_history.4.a:0 "Set the registers"
 south_ukraine_history.4.b:0 "Keep the host free"
 south_ukraine_history.4.d:0 "Frontier captains demand that their service be recognized through formal registers. A disciplined host promises reliability, yet free riders claim their autonomy is the lifeblood of the steppe."
 south_ukraine_history.4.t:0 "Cossack Registers"
 south_ukraine_history.5.a:0 "Grant the charters"
 south_ukraine_history.5.b:0 "Refuse their demands"
 south_ukraine_history.5.d:0 "New settlements seek charters that grant tax freedom and self-government in return for clearing the steppe. These charters would anchor our southern colonies."
 south_ukraine_history.5.t:0 "Sloboda Charters"
 south_ukraine_history.6.a:0 "Let the raiders sail"
 south_ukraine_history.6.b:0 "Protect commerce instead"
 south_ukraine_history.6.d:0 "Swift chaiky and light galleys tempt our captains to raid the Black Sea. Raids promise fame, but safe trade could yield steadier profit."
 south_ukraine_history.6.t:0 "Chaiky on the Black Sea"
 south_ukraine_history.7.a:0 "Grant the charter"
 south_ukraine_history.7.b:0 "Centralize the frontier"
 south_ukraine_history.7.d:0 "The Zaporozhian host demands a charter securing its rights and frontier privileges. Granting autonomy may calm the steppe, while centralization promises tighter control."
 south_ukraine_history.7.t:0 "Zaporozhian Autonomy Charter"
 south_ukraine_history.8.a:0 "Fund recovery"
 south_ukraine_history.8.b:0 "Let local lords rebuild"
 south_ukraine_history.8.d:0 "War and turmoil have scarred the southern marches. Officials seek funds to repair stockades and restore markets, but local lords offer to handle matters on their own terms."
 south_ukraine_history.8.t:0 "Frontier Recovery"
 south_ukraine_history.9.a:0 "Invest in the corridor"
 south_ukraine_history.9.b:0 "Focus inland"
 south_ukraine_history.9.d:0 "Merchants press for river depots and convoy escorts to move grain from the steppe to the Black Sea. Building the corridor could strengthen our trade position."
 south_ukraine_history.9.t:0 "Black Sea Grain Corridor"
