 wr_tt_rusyn_s4_index:0 "Von allen Provinzen der Kultur §YRusznjoczky§! müssen mindestens §Y85%§! die Charta angenommen haben. Derzeitige Zustimmung: §Y[Root.wr_rusyn_s3_pct.GetValue]%§! (§Y[Root.wr_rusyn_s3_cnt.GetValue]§! von §Y[Root.wr_rusyn_total.GetValue]§! Provinzen)."
 wr_charter_distinctiveness_decision_title:0 "Die Kanzleisprachen verbriefen"
 wr_charter_distinctiveness_decision_desc:0 "Unsere Notare sollen Urkunden in den Sprachen der belarussischen, ruthenischen und russinischen Länder ausstellen dürfen. Die drei Kreise beraten das Gesuch. Die Aussicht auf Zustimmung beträgt höchstens 50 %. Diese Charta schließt den westlichen Städtebund aus."
 wr_rally_branch_a_congress_decision_title:0 "Gesandte mit der Kanzleicharta entsenden"
 wr_rally_branch_a_congress_decision_desc:0 "Unsere Schreiber und Geistlichen sollen die Höfe aufsuchen, deren Siegel noch fehlen. Befreundete Fürsten lassen ihre Provinzen eher beitreten. Für jedes Volk müssen weltweit mindestens 60 % seiner Provinzen die Charta annehmen."
 wr_codify_west_ruthenian_group_decision_title:0 "Die ruthenischen Statuten dem Landtag vorlegen"
 wr_codify_west_ruthenian_group_decision_desc:0 "Nach 15 Jahren unter der Charta können wir mit Buchdruck und Zustimmung der drei Kreise den Landtag anrufen. Die Statuten erkennen jene Völker als eigene ruthenische Kulturgruppe an, bei denen weltweit mindestens 60 % der Provinzen die Charta angenommen haben. Die Aussicht auf Zustimmung beträgt höchstens 30 %."
 wr_proclaim_west_slavic_affinity_decision_title:0 "Den westlichen Städten einen Bund anbieten"
 wr_proclaim_west_slavic_affinity_decision_desc:0 "Unsere Städte teilen das Magdeburger Recht mit ihren westlichen Nachbarn. Ihre Schulen und Zünfte sollen Bücher und Urkunden mit Krakau, Prag und Trnava austauschen. Der Bund schließt die Kanzleicharta aus. Die Aussicht auf Zustimmung liegt unter 20 %."
 wr_rally_branch_b_congress_decision_title:0 "Die Zünfte zum westlichen Städtebund laden"
 wr_rally_branch_b_congress_decision_desc:0 "Schicken wir Ratsherren und Gelehrte an die Höfe, deren Städte noch fehlen. Verbündete, Untertanen und uns wohlgesinnte Fürsten lassen sich eher gewinnen. Für jedes Volk müssen weltweit mindestens 85 % seiner Provinzen dem Bund beitreten."
 wr_attempt_west_slavic_transition_decision_title:0 "Die westliche Charta besiegeln"
 wr_attempt_west_slavic_transition_decision_desc:0 "Nach 30 Jahren im Bund können wir mit Welthandel und Zustimmung der drei Kreise um eine endgültige Charta bitten. Ein Volk kann der westslawischen Kulturgruppe beitreten, wenn weltweit mindestens 85 % seiner Provinzen dem Bund angehören. Die Aussicht auf Zustimmung liegt unter 5 %."
 wr_cultural_maneuver.1.t:0 "Volkssprachliche Charta und eigene Register"
 wr_cultural_maneuver.1.d:0 "Von Vilnius und Polazk über Kyiv, Lviv und Ostroh bis Mukatschewo und Chust verfassen Schreiber Urkunden, Testamente und Predigten fern vom Moskauer Prikas-Stil. Wir rufen eine Kommission der Drei Kreise zusammen, ohne unsere drei Völker zu vermengen."
 wr_cultural_maneuver.1.d_belarus:0 "In Polazk, Minsk, Nawahradak und Vilnius schreibt die großfürstliche Kanzlei in lebendiger belarussischer Prosta Mova - wie frühe Testamente und Prager-Vilniuser Übersetzungen zeigen -, klar getrennt von Moskau wie vom Süden. Wir ersuchen Anerkennung für Bielaruski."
 wr_cultural_maneuver.1.d_ruthenia:0 "In Kyiv, Wolodymyr-Wolynskyj, Lviv, Halytsch und Kamjanez folgen Burg- und Landgerichtsbücher der örtlichen ruthenischen Sprache, fern von Moskauer Prikazy, Litauens Norden und Karpaten-Tälern. Ruskyi fordert förmliche Anerkennung."
 wr_cultural_maneuver.1.d_rusyn:0 "In den Komitaten Ung, Bereg, Ugocsa, Maramaros, Saris und Zemplen pflegen Karpatenrusynen walachisches Dorfrecht unter Sholtys und Knjaz, die Salinen von Solotwyno und schlichte Predigten von Mukatschewo. Getrennt von Belarussen und Dnipro-Ruthenen sucht Rusnacky seine eigene Charta."
 wr_cultural_maneuver.1.a:0 "Die drei Kreise sollen uns anhören (höchstens 50 % Zustimmungschance)."
 wr_cultural_maneuver.1.b:0 "Königliches Patent trotz Widerspruch erlassen."
 wr_cultural_maneuver.1.c:0 "Charta vertagen und alte Schreiber behalten."
 wr_cultural_maneuver.2.t:0 "Volkssprachliche Eigenständigkeit verbrieft"
 wr_cultural_maneuver.2.d:0 "Die Kommission bestätigte die eigenen Stadt- und Kanzleiregister. Gesandte tragen die Charta zu Reichen gleicher Hauptkultur, akzeptierender Kultur und mit Grenzprovinzen."
 wr_cultural_maneuver.2.d_belarus:0 "Notare in Vilnius, Minsk und Polazk trugen das Register Bielaruski ein und sicherten die Prosta-Mova-Tradition abseits Moskaus. Gesandte reisen zu den Drei Kreisen."
 wr_cultural_maneuver.2.d_ruthenia:0 "Gerichtsschreiber in Kyiv, Wolhynien und Lviv beglaubigten das Register Ruskyi für Landbücher und Bruderschaften fern von Moskau. Gesandte brechen auf."
 wr_cultural_maneuver.2.d_rusyn:0 "Komitatsschreiber und Dekane von Mukatschewo bestätigten Predigten und Sholtys-Urkunden in Rusnacky. Gesandte werben bei Nachbarhöfen."
 wr_cultural_maneuver.2.a:0 "Charta an alle Drei Kreise versenden."
 wr_cultural_maneuver.3.t:0 "Konservative blockieren die Sprachcharta"
 wr_cultural_maneuver.3.d:0 "Klosterälteste und konservative Bojaren weigerten sich, die Kanzleisprache von alten kirchenslawischen Mustern zu lösen. Die Kommission ging ergebnislos auseinander."
 wr_cultural_maneuver.3.d_belarus:0 "Klöster in Polazk und Turau verteidigten strenges Kirchenslawisch gegen Vilniuser Bielaruski-Reformen."
 wr_cultural_maneuver.3.d_ruthenia:0 "Älteste von Kyiv, Wolhynien und Halytsch stellten alte Kirchenbücher über volkssprachliche Ruskyi-Glossen und verzögerten die Charta."
 wr_cultural_maneuver.3.d_rusyn:0 "Konservative von Maramaros und Kleriker aus Mukatschewo lehnten jede Änderung alter Karpatenhandschriften ab."
 wr_cultural_maneuver.3.a:0 "Die ererbten Register unverändert lassen."
 wr_cultural_maneuver.10.t:0 "Kodifizierung einer eigenen ruthenischen Gruppe"
 wr_cultural_maneuver.10.d:0 "Die Drucker haben die Kanzleicharta vervielfältigt. Richter und Pfarrer halten sie nun in Händen. Juristen legen dem Landtag ein gemeinsames Gesetzbuch vor, in dem jedes der drei Völker seinen Platz erhält."
 wr_cultural_maneuver.10.d_belarus:0 "Gestützt auf die Litauischen Statute (1529, 1566, 1588), Francysk Skarynas Vilniuser Presse (1522), Symon Budnys Katechismus von Njaswisch (1562) und Kanzler Leu Sapiehas Gebot, in ruthenischen Lettern zu schreiben, fordern Belarussen Bielaruski in der eigenen Gruppe."
 wr_cultural_maneuver.10.d_ruthenia:0 "Getragen von der Ostroher Akademie (1576) und Bibel (1581), der Lviv-Mariä-Entschlafens-Stauropegie (1586), dem Peresopnyzja-Evangelium und den Gerichtsrechten von 1569 für Kyiv, Wolhynien und Brazlaw beanspruchen Ruthenen Ruskyi abseits Moskaus."
 wr_cultural_maneuver.10.d_rusyn:0 "Getragen von karpatischen Volkspredigten, den Schulen von Mukatschewo, Statuten in Bereg und Ugocsa sowie Stadtrechten von Chust bis Presov beanspruchen Karpatenrusynen Rusnacky als eigenes Glied."
 wr_cultural_maneuver.10.a:0 "Legen wir die Statuten dem Landtag vor (höchstens 30 % Zustimmungschance)."
 wr_cultural_maneuver.10.b:0 "Kodex durch kostspieligen Herrschererlass verkünden."
 wr_cultural_maneuver.10.c:0 "Die bestehende ostslawische Zuordnung behalten."
 wr_cultural_maneuver.11.t:0 "Eigene ruthenische Kulturgruppe kodifiziert"
 wr_cultural_maneuver.11.d:0 "Der Landtag hat die Statuten besiegelt. Gilt die Charta in mindestens 60 % der Provinzen eines Volkes, wird es unter seinem eigenen Namen in die ruthenischen Register eingetragen: Bielaruski, Ruskyi oder Rusnacky."
 wr_cultural_maneuver.11.d_belarus:0 "Mit Vilnius, Polazk, Minsk und Nawahradak vereint hinter dem Kanzleimandat von 1588 tritt Bielaruski aus dem Moskau-nahen Ostslawischen in die eigene ruthenische Gruppe über."
 wr_cultural_maneuver.11.d_ruthenia:0 "Ratifiziert von Ostroh und Lviv bis Kyiv und Tschernihiw tritt Ruskyi in die eigene ruthenische Gruppe ein und wahrt das Erbe von 1569 und den Druckereien."
 wr_cultural_maneuver.11.d_rusyn:0 "Ratifiziert von Mukatschewo und den Versammlungen in Ung-Bereg-Maramaros tritt Rusnacky als anerkanntes Bergvolk in die eigene ruthenische Gruppe ein."
 wr_cultural_maneuver.11.a:0 "Den ratifizierten Kodex allen Drei Kreisen mitteilen."
 wr_cultural_maneuver.12.t:0 "Landtag lehnt Gruppentrennung ab"
 wr_cultural_maneuver.12.d:0 "Die Grundherren mit Besitz auf beiden Seiten der Grenze stellten sich hinter die Geistlichen. Keiner wollte die alten Gerichtsbarkeiten teilen. Der Landtag hat den Entwurf ohne Siegel zurückgegeben."
 wr_cultural_maneuver.12.d_belarus:0 "Magnaten mit Gütern von Polazk bis Tschernihiw warnten vor kirchlicher Spaltung und brachten den Bielaruski-Kodex zu Fall."
 wr_cultural_maneuver.12.d_ruthenia:0 "Prälaten und Magnaten in Wolhynien und Podillia fürchteten um die Einheit von Kyiv und Tschernihiw und blockierten Ruskyi."
 wr_cultural_maneuver.12.d_rusyn:0 "Aus Sorge vor Entfremdung von den Klöstern in Halytsch und Lviv lehnten Hochlandstände den Rusnacky-Kodex ab."
 wr_cultural_maneuver.12.a:0 "Breiteren Konsens an Nachbarhöfen suchen."
 wr_cultural_maneuver.15.t:0 "Lehnsherr kodifiziert eigene ruthenische Gruppe"
 wr_cultural_maneuver.15.d:0 "Unser Lehnsherr hat die ruthenischen Statuten besiegelt. Wo genügend Provinzen die Charta angenommen haben, darf unsere Kanzlei ihr Volk zu denselben Bedingungen eintragen."
 wr_cultural_maneuver.15.d_belarus:0 "Unser Lehnsherr hat Bielaruski nach großfürstlichem Statutenrecht in eine eigene ruthenische Gruppe überführt und lädt unseren Hof zur Angleichung ein."
 wr_cultural_maneuver.15.d_ruthenia:0 "Unser Lehnsherr hat Ruskyi nach Kyiver und Lviver Freiheitsrechten in der eigenen ruthenischen Gruppe verankert und lädt unsere Kanzlei ein."
 wr_cultural_maneuver.15.d_rusyn:0 "Unser Lehnsherr führt Karpatenrusynen als Rusnacky in der eigenen ruthenischen Gruppe und lädt unsere Komitate zur Übernahme ein."
 wr_cultural_maneuver.15.a:0 "Den Kodex des Lehnsherrn übernehmen."
 wr_cultural_maneuver.15.b:0 "Bisherige Register beibehalten."
 wr_cultural_maneuver.20.t:0 "Anziehung der westslawischen Stadtsphäre"
 wr_cultural_maneuver.20.d:0 "Studenten kehren aus Krakau, Prag und Trnava mit Büchern heim, die unsere Zünfte drucken wollen. Könnte eine Urkunde aus einer Stadt auch vor dem Gericht einer anderen gelten? Die Ratsherren haben einen Vertrag aufgesetzt und warten auf unser Siegel."
 wr_cultural_maneuver.20.d_belarus:0 "Abseits des östlichen Kanzleiwegs studieren Söhne aus Grodno, Brest und Nawahradak in Kraków und Prag, schreiben Eingaben in belarussischer Lacinka und teilen Magdeburger Ratssitze."
 wr_cultural_maneuver.20.d_ruthenia:0 "Abseits der Kyiver Altgläubigen besuchen Adlige aus Lviv, Przemysl, Wolhynien und Kamjanez Kraków und Zamosc, führen zweisprachige Burgakten und nähern Zünfte Kleinpolen an."
 wr_cultural_maneuver.20.d_rusyn:0 "Abseits der Nordverbindungen teilen Rusnaks in Saris, Spis, Zemplen und Ung Märkte, Presse in Trnava und Kraków sowie Stadtrechte mit Slowaken und Polen."
 wr_cultural_maneuver.20.a:0 "Bieten wir den Städten einen Bund an (unter 20 % Zustimmungschance)."
 wr_cultural_maneuver.20.b:0 "Ausrichtung durch kostspieligen Erlass erzwingen."
 wr_cultural_maneuver.20.c:0 "Ortsübliche Pfarreirechte wahren."
 wr_cultural_maneuver.21.t:0 "Westslawische Stadtaffinität verkündet"
 wr_cultural_maneuver.21.d:0 "Gesandte aus Kraków, Prag und den oberungarischen Bergstädten heißen unsere Magistrate in einem zweisprachigen Bürgerkreis willkommen. Boten reisen zu den Drei Kreisen."
 wr_cultural_maneuver.21.d_belarus:0 "Heimkehrer aus Kraków und Prag bestätigen gemeinsame Stadtrechte in Brest, Grodno und Vilnius und öffnen Bielaruski-Bürgern das zweischriftliche Leben."
 wr_cultural_maneuver.21.d_ruthenia:0 "Zünfte und Landrechtskundige in Lviv, Halytsch, Wolhynien und Brazlaw schließen zweisprachige Stadtbünde nach Vorbild von Kraków und Sandomierz."
 wr_cultural_maneuver.21.d_rusyn:0 "In Presov, Bardejov und Uschhorod schließen lateinische Räte und Ost-Dekanate ein Bürgerbündnis mit slowakischen, polnischen und böhmischen Städten."
 wr_cultural_maneuver.21.a:0 "Den Affinitätspakt allen Drei Kreisen verkünden."
 wr_cultural_maneuver.22.t:0 "Pakt der Stadtaffinität gescheitert"
 wr_cultural_maneuver.22.d:0 "Pfarreiklerus, Dorfälteste und skeptische Adlige wiesen fremde Lateinschrift und westliche Stadtordnungen als Bedrohung des Herkommens zurück."
 wr_cultural_maneuver.22.d_belarus:0 "Magnaten aus Polazk und Witebsk und Bruderschaften verwarfen zweischriftliche Privilegien nach Kraków-Muster."
 wr_cultural_maneuver.22.d_ruthenia:0 "Die Lviver Bruderschaft und Dnipro-Kosaken verurteilten lateinisch-polnische Eingriffe in ruthenische Pfarreien."
 wr_cultural_maneuver.22.d_rusyn:0 "Karpatenpriester und Älteste aus Maramaros sperrten sich gegen Schulen aus Trnava und dem Spis."
 wr_cultural_maneuver.22.a:0 "Alte Stadtbräuche beibehalten."
 wr_cultural_maneuver.30.t:0 "Die westslawische Schwelle"
 wr_cultural_maneuver.30.d:0 "Seit dreißig Jahren handeln die Kaufleute unter denselben Urkunden und lernen die Schüler aus denselben Büchern. Nun bitten die Städte die Kanzlei, ihren Platz unter den Westslawen anzuerkennen. Noch liegt das Siegel in unserer Hand."
 wr_cultural_maneuver.30.d_belarus:0 "Dreißig Jahre Lacinka-Kyrillisch-Drucke und Gilden von Vilnius bis Brest ermöglichen Bjalowruszsky - keine Polonisierung, sondern eine eigene westslawische Bürgersprache."
 wr_cultural_maneuver.30.d_ruthenia:0 "Dreißig Jahre dreisprachiger Humanismus zwischen Kraków, Zamosc und Kyiv sowie zweisprachige Räte von Lviv bis Brazlaw eröffnen den Weg zu Ruszynjsky, einer westslawischen Bürgersynthese ohne Aufgabe örtlicher Wurzeln."
 wr_cultural_maneuver.30.d_rusyn:0 "Dreißig Jahre gemeinsamer Märkte, Trnava-Katechismen und Nachbarschaft in Saris-Spis-Zemplen spiegeln ostslowakische Übergänge und formen doch das eigene karpatische Rusznjoczky."
 wr_cultural_maneuver.30.a:0 "Legen wir die endgültige Charta vor (unter 5 % Zustimmungschance)."
 wr_cultural_maneuver.30.b:0 "Zweisprachige Affinität ohne Gruppenwechsel wahren."
 wr_cultural_maneuver.31.t:0 "Westslawische Bürgersynthese vollzogen"
 wr_cultural_maneuver.31.d:0 "Der Kongress hat die westliche Charta besiegelt. Hat ein Volk die Zustimmung von mindestens 85 % seiner Provinzen gewonnen, tritt es unter seinem Namen der westslawischen Gruppe bei: Bjalowruszsky, Ruszynjsky oder Rusznjoczky."
 wr_cultural_maneuver.31.d_belarus:0 "In Brest, Grodno, Vilnius und Polazk treten Magistrate als Bjalowruszsky in die westslawische Gruppe ein - Krönung langer Lacinka-Rechtstradition."
 wr_cultural_maneuver.31.d_ruthenia:0 "Von Lviv, Halytsch und Kamjanez bis Wolhynien und Kyiv treten Stände als Ruszynjsky in die westslawische Familie ein."
 wr_cultural_maneuver.31.d_rusyn:0 "In Uschhorod, Mukatschewo, Presov und Chust nehmen Karpatenversammlungen als Rusznjoczky neben Tschechen, Polen und Slowaken Platz."
 wr_cultural_maneuver.31.a:0 "Die seltene Synthese allen Drei Kreisen verkünden."
 wr_cultural_maneuver.32.t:0 "Stände halten vor der westslawischen Grenze inne"
 wr_cultural_maneuver.32.d:0 "Selbst nach dreißig Jahren Affinität zogen Synoden und Dorfgemeinden die letzte Grenze. Zweisprachige Partnerschaft bleibt bestehen ohne Gruppenwechsel."
 wr_cultural_maneuver.32.d_belarus:0 "Vilniuser Bruderschaften und Minsker Adel behielten ihre Zweisprachigkeit ohne Bruch mit der östlichen Kirchlichkeit."
 wr_cultural_maneuver.32.d_ruthenia:0 "Gelehrte von Kyiv und Ostroh sowie Stände am Dnieper schätzten Krakóws Lehre, bewahrten aber ihre ostslawischen Wurzeln."
 wr_cultural_maneuver.32.d_rusyn:0 "Pfarreien in Mukatschewo und Märkte von Chust hielten Spis-Handel offen und blieben dem Karpatenbrauch treu."
 wr_cultural_maneuver.32.a:0 "Den zweischriftlichen Bürgerbund fortführen."
 wr_cultural_maneuver.35.t:0 "Lehnsherr ratifiziert westslawische Synthese"
 wr_cultural_maneuver.35.d:0 "Unser Lehnsherr hat die westliche Charta besiegelt. Er lädt unsere Stände ein, es ihm für jedes Volk gleichzutun, das mindestens 85 % seiner Provinzen gewonnen hat."
 wr_cultural_maneuver.35.d_belarus:0 "Unser Lehnsherr führt belarussische Städte und Adel nun als Bjalowruszsky in der westslawischen Gruppe und lädt unsere Kanzlei zur Folge ein."
 wr_cultural_maneuver.35.d_ruthenia:0 "Unser Lehnsherr führt ruthenische Magistrate als Ruszynjsky in der westslawischen Gruppe und lädt unsere Lande ein."
 wr_cultural_maneuver.35.d_rusyn:0 "Unser Lehnsherr hat Karpatenrusynen als Rusznjoczky in der westslawischen Gruppe eingeschrieben und lädt unsere Komitate ein."
 wr_cultural_maneuver.35.a:0 "Die westslawische Charta des Lehnsherrn annehmen."
 wr_cultural_maneuver.35.b:0 "Ablehnen und alten Brauch wahren."
 wr_cultural_maneuver.41.t:0 "Gesandte und Schreiber"
 wr_cultural_maneuver.41.d:0 "Die Kanzlei von [From.GetName] legt uns eine Charta für den Gebrauch unserer gemeinsamen Sprache vor Gericht und in der Kirche vor. Mit unserem Siegel treten alle unsere Provinzen bei, in denen diese Sprache gesprochen wird."
 wr_cultural_maneuver.41.d_belarus:0 "In Vilnius verwenden unsere Schreiber bereits Bielaruski. Gesandte aus [From.GetName] bitten um unser Siegel, damit dieser Brauch in allen unseren Provinzen gilt, die diese Sprache sprechen."
 wr_cultural_maneuver.41.d_ruthenia:0 "In Lviv verwenden unsere Schreiber bereits Ruskyi. Gesandte aus [From.GetName] bitten um unser Siegel, damit dieser Brauch in allen unseren Provinzen gilt, die diese Sprache sprechen."
 wr_cultural_maneuver.41.d_rusyn:0 "In Presov verwenden unsere Schreiber bereits Rusnacky. Gesandte aus [From.GetName] bitten um unser Siegel, damit dieser Brauch in allen unseren Provinzen gilt, die diese Sprache sprechen."
 wr_cultural_maneuver.41.a:0 "Schwestercharta ratifizieren und Provinzen eintragen."
 wr_cultural_maneuver.41.b:0 "Bei alten liturgischen und Kanzleiformen bleiben."
 wr_cultural_maneuver.42.t:0 "Ein Siegel für die ruthenischen Statuten"
 wr_cultural_maneuver.42.d:0 "Gesandte aus [From.GetName] erbitten unser Siegel für die ruthenischen Statuten. Diese erkennen Bielaruski, Ruskyi und Rusnacky jeweils an, sobald mindestens 60 % der Provinzen des betreffenden Volkes die Charta angenommen haben."
 wr_cultural_maneuver.42.d_belarus:0 "Die Statuten führen Bielaruski unter den Völkern der Rus auf. Gesandte aus [From.GetName] fragen, ob unser Hof sein Siegel neben die der anderen Unterzeichner setzen will."
 wr_cultural_maneuver.42.d_ruthenia:0 "Die Statuten führen Ruskyi unter den Völkern der Rus auf. Gesandte aus [From.GetName] fragen, ob unser Hof sein Siegel neben die der anderen Unterzeichner setzen will."
 wr_cultural_maneuver.42.d_rusyn:0 "Die Statuten führen Rusnacky unter den Völkern der Rus auf. Gesandte aus [From.GetName] fragen, ob unser Hof sein Siegel neben die der anderen Unterzeichner setzen will."
 wr_cultural_maneuver.42.a:0 "Dem Kollektivmandat beitreten."
 wr_cultural_maneuver.42.b:0 "Kollektive Deckung verweigern."
 wr_cultural_maneuver.43.t:0 "Ein Angebot der westlichen Städte"
 wr_cultural_maneuver.43.d:0 "Die Städte von [From.GetName] bieten unseren Ratsherren einen Platz im westlichen Bund an. Haben wir uns noch nicht an die Kanzleicharta gebunden, können unsere Städte beitreten. Für jedes Volk werden die Siegel von mindestens 85 % seiner Provinzen benötigt."
 wr_cultural_maneuver.43.d_belarus:0 "Die Zünfte in Vilnius handeln nach ähnlichen Urkunden wie die in Brest. Gesandte aus [From.GetName] bieten an, dass die Städte ihre Urkunden gegenseitig anerkennen und ihre Bücher in beiden Schriften führen."
 wr_cultural_maneuver.43.d_ruthenia:0 "Die Zünfte in Lviv handeln nach ähnlichen Urkunden wie die in Zamosc. Gesandte aus [From.GetName] bieten an, dass die Städte ihre Urkunden gegenseitig anerkennen und ihre Bücher in beiden Schriften führen."
 wr_cultural_maneuver.43.d_rusyn:0 "Die Zünfte in Presov handeln nach ähnlichen Urkunden wie die in Trnava. Gesandte aus [From.GetName] bieten an, dass die Städte ihre Urkunden gegenseitig anerkennen und ihre Bücher in beiden Schriften führen."
 wr_cultural_maneuver.43.a:0 "Dem westslawischen Affinitätskreis beitreten."
 wr_cultural_maneuver.43.b:0 "Den westlichen Stadtpakt ablehnen."
 wr_cultural_maneuver.44.t:0 "Die endgültige Charta"
 wr_cultural_maneuver.44.d:0 "Eine Gesandtschaft aus [From.GetName] wartet auf unser Siegel für die westliche Charta. Völker, deren Städte mindestens 85 % ihrer Provinzen gewonnen haben, können unter die Westslawen aufgenommen werden."
 wr_cultural_maneuver.44.d_belarus:0 "Gesandte aus [From.GetName] haben eine Charta mit dem Namen Bjalowruszsky gebracht. Sie bitten unseren Hof, unser Volk unter diesem Namen unter den Westslawen anzuerkennen."
 wr_cultural_maneuver.44.d_ruthenia:0 "Gesandte aus [From.GetName] haben eine Charta mit dem Namen Ruszynjsky gebracht. Sie bitten unseren Hof, unser Volk unter diesem Namen unter den Westslawen anzuerkennen."
 wr_cultural_maneuver.44.d_rusyn:0 "Gesandte aus [From.GetName] haben eine Charta mit dem Namen Rusznjoczky gebracht. Sie bitten unseren Hof, unser Volk unter diesem Namen unter den Westslawen anzuerkennen."
 wr_cultural_maneuver.44.a:0 "Vertrag zur westslawischen Synthese unterzeichnen."
 wr_cultural_maneuver.44.b:0 "Beitritt zur westslawischen Gruppe verweigern."
 wr_cultural_maneuver.51.t:0 "Die Sprache unserer Gerichte"
 wr_cultural_maneuver.51.d:0 "Diese Sprachen finden an unserem Hof bereits Gehör. Die Gesandten von [From.GetName] bitten darum, sie auch in Urkunden und Kirchenbüchern der betreffenden Provinzen zuzulassen. Ihre Charta braucht mindestens 60 % der Provinzen jedes Volkes."
 wr_cultural_maneuver.51.d_belarus:0 "Da unsere Krone Belarussen akzeptiert, bittet [From.GetName] uns um Billigung der Bielaruski-Charta in unseren belarussischen Provinzen."
 wr_cultural_maneuver.51.d_ruthenia:0 "Da unser Reich Ruthenen akzeptiert, bittet [From.GetName] um Bestätigung von Ruskyi-Gerichtsurkunden in unseren ruthenischen Landen."
 wr_cultural_maneuver.51.d_rusyn:0 "Da unsere Krone Rusynen akzeptiert, bittet [From.GetName] um Bestätigung von Rusnacky-Sholtys-Briefen in unseren Komitaten."
 wr_cultural_maneuver.51.a:0 "Eigene Register in akzeptierten Landen anerkennen."
 wr_cultural_maneuver.51.b:0 "Hofanerkennung versagen."
 wr_cultural_maneuver.52.t:0 "Die Abgeordneten und die Statuten"
 wr_cultural_maneuver.52.d:0 "Die Kanzlei von [From.GetName] hat eine Abschrift der ruthenischen Statuten geschickt. Die betroffenen Völker haben an unserem Hof eine Stimme. Ihre Abgeordneten bitten um Erlaubnis zu unterzeichnen."
 wr_cultural_maneuver.52.d_belarus:0 "Unsere Abgeordneten nehmen bereits Gesuche in der Sprache Bielaruski entgegen. Die Gesandten bitten sie, dieses Recht in den ruthenischen Statuten festzuschreiben."
 wr_cultural_maneuver.52.d_ruthenia:0 "Unsere Abgeordneten nehmen bereits Gesuche in der Sprache Ruskyi entgegen. Die Gesandten bitten sie, dieses Recht in den ruthenischen Statuten festzuschreiben."
 wr_cultural_maneuver.52.d_rusyn:0 "Unsere Abgeordneten nehmen bereits Gesuche in der Sprache Rusnacky entgegen. Die Gesandten bitten sie, dieses Recht in den ruthenischen Statuten festzuschreiben."
 wr_cultural_maneuver.52.a:0 "Den eigenen ruthenischen Kodex stützen."
 wr_cultural_maneuver.52.b:0 "Unterstützung versagen."
 wr_cultural_maneuver.53.t:0 "Ein Bund für unsere Marktstädte"
 wr_cultural_maneuver.53.d:0 "Ratsherren aus [From.GetName] laden die an unserem Hof vertretenen Städte ein, mit ihren westlichen Nachbarn Urkunden auszutauschen. Jeder Beitritt hilft dem betreffenden Volk, die erforderlichen 85 % seiner Provinzen zu gewinnen."
 wr_cultural_maneuver.53.d_belarus:0 "Die Ratsherren von Vilnius haben sich an unseren Hof gewandt. Gesandte aus [From.GetName] bieten ihnen dieselben Handelsrechte und denselben Austausch von Urkunden an wie ihren Nachbarn in Brest."
 wr_cultural_maneuver.53.d_ruthenia:0 "Die Ratsherren von Lviv haben sich an unseren Hof gewandt. Gesandte aus [From.GetName] bieten ihnen dieselben Handelsrechte und denselben Austausch von Urkunden an wie ihren Nachbarn in Zamosc."
 wr_cultural_maneuver.53.d_rusyn:0 "Die Ratsherren von Presov haben sich an unseren Hof gewandt. Gesandte aus [From.GetName] bieten ihnen dieselben Handelsrechte und denselben Austausch von Urkunden an wie ihren Nachbarn in Trnava."
 wr_cultural_maneuver.53.a:0 "Die westslawische Affinitätscharta bestätigen."
 wr_cultural_maneuver.53.b:0 "Westlicher Affinität fernbleiben."
 wr_cultural_maneuver.54.t:0 "Das Siegel der Stände"
 wr_cultural_maneuver.54.d:0 "Die Städte haben Abgeordnete entsandt, um die westliche Charta aus [From.GetName] anzuhören. Sie fragen, ob die Krone das Abkommen im Namen der bei Hof vertretenen Völker anerkennen wird."
 wr_cultural_maneuver.54.d_belarus:0 "Gesandte aus [From.GetName] bitten um Anerkennung von Bjalowruszsky unter den Westslawen. Die Abgeordneten ersuchen uns um Zustimmung, wo mindestens 85 % der Provinzen ihres Volkes den Bund besiegelt haben."
 wr_cultural_maneuver.54.d_ruthenia:0 "Gesandte aus [From.GetName] bitten um Anerkennung von Ruszynjsky unter den Westslawen. Die Abgeordneten ersuchen uns um Zustimmung, wo mindestens 85 % der Provinzen ihres Volkes den Bund besiegelt haben."
 wr_cultural_maneuver.54.d_rusyn:0 "Gesandte aus [From.GetName] bitten um Anerkennung von Rusznjoczky unter den Westslawen. Die Abgeordneten ersuchen uns um Zustimmung, wo mindestens 85 % der Provinzen ihres Volkes den Bund besiegelt haben."
 wr_cultural_maneuver.54.a:0 "Westslawischen Übergang für akzeptierte Stände ratifizieren."
 wr_cultural_maneuver.54.b:0 "Letzten Übertritt ablehnen."
 wr_cultural_maneuver.61.t:0 "Ein Gesuch der Pfarreien"
 wr_cultural_maneuver.61.d:0 "Am Hof haben diese Sprachen keinen Rang, in den Pfarreien hört man sie täglich. Gesandte aus [From.GetName] bitten uns, den örtlichen Schreibern ihren Gebrauch zu gestatten und diese Bezirke in die Charta aufzunehmen."
 wr_cultural_maneuver.61.d_belarus:0 "Obgleich Belarussen bei uns nicht akzeptiert sind, bittet [From.GetName] um Duldung örtlicher Bielaruski-Stadtbücher."
 wr_cultural_maneuver.61.d_ruthenia:0 "Obgleich Ruthenen am Hof nicht akzeptiert sind, bittet [From.GetName] um Duldung örtlicher Ruskyi-Bruderschaftsschulen."
 wr_cultural_maneuver.61.d_rusyn:0 "Obgleich Rusynen hier nicht akzeptiert sind, bittet [From.GetName] um Wahrung örtlicher Rusnacky-Sholtys-Bräuche."
 wr_cultural_maneuver.61.a:0 "Örtliche Pfarrei- und Stadtspielräume gewähren."
 wr_cultural_maneuver.61.b:0 "Strenge Verwaltungseinheitlichkeit wahren."
 wr_cultural_maneuver.62.t:0 "Die Statuten erreichen die Statthalter"
 wr_cultural_maneuver.62.d:0 "Gesandte aus [From.GetName] bitten unsere Statthalter, die ruthenischen Statuten in Bezirken ohne Stimme bei Hof anzuerkennen. Sie gelten, wenn mindestens 60 % der Provinzen des jeweiligen Volkes die Charta angenommen haben."
 wr_cultural_maneuver.62.d_belarus:0 "Wir verwalten belarussische Lande; [From.GetName] bittet um Eintragung als Bielaruski in die eigene ruthenische Gruppe."
 wr_cultural_maneuver.62.d_ruthenia:0 "Wir halten ruthenische Provinzen; [From.GetName] bittet um Anerkennung von Ruskyi in der eigenen ruthenischen Gruppe."
 wr_cultural_maneuver.62.d_rusyn:0 "Wir halten rusynische Komitate; [From.GetName] bittet unsere Komitatshauptleute um Annahme von Rusnacky."
 wr_cultural_maneuver.62.a:0 "Provinzwechsel in die eigene Gruppe zulassen."
 wr_cultural_maneuver.62.b:0 "Provinzsteuerlisten unverändert lassen."
 wr_cultural_maneuver.63.t:0 "Die Bücher der Zünfte"
 wr_cultural_maneuver.63.d:0 "Die Zünfte an der Grenze haben Post aus [From.GetName] erhalten. Sie bitten darum, ihre Bücher in zwei Schriften zu führen und Lehrer aus den westlichen Städten aufzunehmen. Ihre Siegel zählen für die erforderlichen 85 % der Provinzen jedes Volkes."
 wr_cultural_maneuver.63.d_belarus:0 "Die Gesandten überbringen ein Gesuch der Zünfte. Diese wollen beide Schriften lehren und ihre Verträge so ausfertigen wie die Kaufleute in Vilnius und Brest."
 wr_cultural_maneuver.63.d_ruthenia:0 "Die Gesandten überbringen ein Gesuch der Zünfte. Diese wollen beide Schriften lehren und ihre Verträge so ausfertigen wie die Kaufleute in Lviv und Zamosc."
 wr_cultural_maneuver.63.d_rusyn:0 "Die Gesandten überbringen ein Gesuch der Zünfte. Diese wollen beide Schriften lehren und ihre Verträge so ausfertigen wie die Kaufleute in Presov und Trnava."
 wr_cultural_maneuver.63.a:0 "Zweischriftliche Stadtgilden zulassen."
 wr_cultural_maneuver.63.b:0 "Fremde Stadtausrichtung verbieten."
 wr_cultural_maneuver.64.t:0 "Die Charta erreicht die Grenzmarken"
 wr_cultural_maneuver.64.d:0 "Die Gesandten von [From.GetName] haben die westliche Charta in unsere Grenzbezirke gebracht. Sie bitten um Anerkennung, wo bereits mindestens 85 % der Provinzen eines Volkes dem Bund angehören."
 wr_cultural_maneuver.64.d_belarus:0 "Gesandte aus [From.GetName] haben genügend Siegel für die westliche Charta gesammelt. Sie bitten die Statthalter, unsere Städte unter dem Namen Bjalowruszsky in die neuen Register einzutragen."
 wr_cultural_maneuver.64.d_ruthenia:0 "Gesandte aus [From.GetName] haben genügend Siegel für die westliche Charta gesammelt. Sie bitten die Statthalter, unsere Städte unter dem Namen Ruszynjsky in die neuen Register einzutragen."
 wr_cultural_maneuver.64.d_rusyn:0 "Gesandte aus [From.GetName] haben genügend Siegel für die westliche Charta gesammelt. Sie bitten die Statthalter, unsere Städte unter dem Namen Rusznjoczky in die neuen Register einzutragen."
 wr_cultural_maneuver.64.a:0 "Grenzprovinzen dem Westslawischen angleichen."
 wr_cultural_maneuver.64.b:0 "Bestehende Provinzregister beibehalten."
