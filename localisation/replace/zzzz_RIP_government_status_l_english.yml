 rip_gov_vln_title:0 "§YVolhynia: Magnate Senate§!"
 rip_gov_vln_title_tt:0 "Senate Consent:\nSummon the Senate costs 0.25 years of income and grants +2 Legitimacy for 5 years (8-year cooldown).\nConvening the Senate is required before calling up the Magnate Banners."
 rip_gov_vln_consent:0 "Senate Consent: [Root.RipGovVlnConsent]"
 rip_gov_vln_consent_tt:0 "Senate Consent:\nSummon the Senate costs 0.25 years of income and grants +2 Legitimacy for 5 years (8-year cooldown).\nConvening the Senate is required before calling up the Magnate Banners."
 rip_gov_vln_banners:0 "Magnate Banners: [Root.RipGovVlnBanners]"
 rip_gov_vln_banners_tt:0 "Call Up the Magnate Banners:\nDuring wartime, calling up the banners instantly CONSUMES the convened Senate, granting +10% maximum manpower, +3 Army Tradition, and a 5-year defensive boost (10-year cooldown)."
 rip_gov_vln_buyoff:0 "Magnate House: [Root.RipGovVlnBuyoff]"
 rip_gov_vln_buyoff_tt:0 "Buy Off a Magnate House:\nCosts 0.50 years of income and adds 15 autonomy in a non-capital city to reduce local unrest by -5 and grant 5 years of stability bonus."
 rip_gov_vln_threshold:0 "Cost: 0.25 yr (Senate) | 0.50 yr (House)"
 rip_gov_vln_threshold_tt:0 "Volhynian Treasury Planning:\n- Summon Senate: 0.25 years of income\n- Appease House: 0.50 years of income\nEnsure adequate reserves before war to convene the Senate in time."
