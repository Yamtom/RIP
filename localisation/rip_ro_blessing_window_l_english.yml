 # Modifier names and descs
 rip_ro_myth_novgorod:0 "Myth of Saint Sophia"
 desc_rip_ro_myth_novgorod:0 "Novgorod's sacred myth of Saint Sophia, Divine Wisdom, has matured after 30 years of Orthodox devotion, inspiring commercial trade and scholarly innovation."
 rip_ro_myth_moscow:0 "Myth of the Third Rome"
 desc_rip_ro_myth_moscow:0 "Two Romes have fallen, the third stands, and a fourth there shall never be. Moscow's sacred myth stands mature, cementing imperial legitimacy and church authority."
 rip_ro_myth_kyiv:0 "Myth of the Second Jerusalem"
 desc_rip_ro_myth_kyiv:0 "Kyiv, the cradle of baptism and mother of Rus' cities, stands as a Second Jerusalem with its ancient caves and holy shrines, strengthening the true faith."
 rip_ro_myth_constantinople:0 "Myth of the Imperial Succession"
 desc_rip_ro_myth_constantinople:0 "The legacy of Tsargrad and the Second Rome has been restored under the Orthodox fold, granting imperial renown and diplomatic eminence."
 rip_ro_myth_jerusalem:0 "Myth of Heavenly Sion"
 desc_rip_ro_myth_jerusalem:0 "The Holy Sepulchre and the ancient sites of Palestine receive our pilgrims and protection, infusing our warriors with enduring morale and martial recovery."

