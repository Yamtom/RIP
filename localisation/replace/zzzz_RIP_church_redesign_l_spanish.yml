 rip_church_gc_heading:0 "THE UNION OF THE CHURCHES"
 rip_church_gc_help:0 "Use the local synod and devotional icons. Select an owned province to guarantee its community rights.\nHover buttons for costs and conditions."
 rip_church_gc_help_tt:0 "Hierarchical Capacity (HC) is the Greek Catholic label for the native Patriarch Authority bar (0–100), used here as a gameplay abstraction for the local church administration, not as papal standing or a historical measure of universal UGCC authority. Recurring gain: +7.5 HC per year (+0.625 per month) from the Greek Catholic state religion. Country-specific decisions, events and mission rewards may also change the bar; there is no free refill when loading a save. One devotional icon at a time costs 20 HC and lasts five years: Liturgy grants +1 yearly prestige, +1 diplomatic reputation and +20% improve relations; Learning grants -5% development cost and -5% technology cost; Almsgiving grants -1 global unrest and -10% stability cost. A local synod lasts ten years and costs 20 HC plus 75 ducats for Infrastructure (-10% state maintenance, +5% church loyalty and -5% local autonomy in owned Greek Catholic core cities), or 20 HC plus 100 ducats for Coexistence (-0.5 global unrest, +10% improve relations and +5% local autonomy in recognized non-Greek-Catholic communities). A parish visit costs 5 HC, 100 ducats and 25 ADM, once per ten years: choose +1% local missionary strength or -1 local unrest in one eligible province; either choice also gives -5% local tax for ten years. The inherited Orthodox bonuses are offset by balancing modifiers in five-point bands rounded down. At 100 HC the net country effects are 0% global missionary strength and 0% church influence; owned Greek Catholic provinces have -0.375 local unrest and 0% local manpower. Between bands, a small part of the native bonus remains. Other decisions show their own HC thresholds and costs."
