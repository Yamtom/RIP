 kru_rada_knyazi:0 "Knyazi"
 kru_rada_knyazi_desc:0 "The princely houses hold the floor of the Rada. Their agenda - dynastic standing, diplomacy and the service of dependent princes - prevails while they lead it with at least 50 influence. The faction that is second by influence stands on the left of the bar and the dominant faction on the right; the bar moves right with the leader's influence."
 kru_rada_knyazi_MECHANIC_TOOLTIP:0 "Knyazi"
 kru_rada_boyary:0 "Boyary"
 kru_rada_boyary_desc:0 "The boyar houses hold the floor of the Rada. Their agenda - office, landed rights and the treasury - prevails while they lead it with at least 50 influence. The faction that is second by influence stands on the left of the bar and the dominant faction on the right; the bar moves right with the leader's influence."
 kru_rada_boyary_MECHANIC_TOOLTIP:0 "Boyary"
 kru_rada_starshyna:0 "Starshyna"
 kru_rada_starshyna_desc:0 "The Cossack officers hold the floor of the Rada. Their agenda - regimental appointments, the register and the rights of the host - prevails while they lead it with at least 50 influence. The faction that is second by influence stands on the left of the bar and the dominant faction on the right; the bar moves right with the leader's influence."
 kru_rada_starshyna_MECHANIC_TOOLTIP:0 "Starshyna"
