 jagoldai_horde_settlement_desc:0 "Followers of Jagoldai, a Golden Horde pretender, have established themselves here as a military buffer against raids from the wild steppes."
 jagoldai_loyalty:0 "Jagoldai Loyalty"
 jagoldai_loyalty_desc:0 "The Jagoldai Tatars continue their faithful service on our steppe frontier."
 jagoldai_muscovite_service:0 "Jagoldai in Muscovite Service"
 jagoldai_muscovite_service_desc:0 "The Jagoldai Tatars now serve the Grand Prince of Moscow, providing cavalry strength and border defense."
 jesuit_missions_restrained:0 "Jesuit Missions Restrained"
