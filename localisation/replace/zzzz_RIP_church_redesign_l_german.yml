 rip_church_gc_help:0 "Use the local synod and devotional icons. Select an owned province to guarantee its community rights.\nHover buttons for costs and conditions."
 rip_church_gc_help_tt:0 "Hierarchical Capacity (HC) represents the local hierarchy and synod capacity to organize clergy, sustain institutions and fund devotional initiatives. It is a gameplay abstraction using the native Patriarch Authority (PA) bar, not a historical measurement of universal UGCC authority or standing with Rome. Papal relations are tracked separately. The Greek Catholic state religion provides a base +7.5 HC per year (0.625 per month). Two icons and one synod cost 60 HC per ten years; one parish visit adds 5 HC, leaving 10 HC before other costs. No extra resource is granted on loading a save."
 rip_church_gc_holy_see_gift_button:0 "Send a gift to Rome"
 rip_church_gc_holy_see_gift_button_tt:0 "Send 100 ducats to the Holy See. The Papal State gains +25 opinion of us, decaying by 5 per year. Available once every five years. Requires the Catholic Papal State, peace and 100 ducats. This is diplomatic goodwill only: no Patriarch Authority, Curia vote, cardinal or electoral influence is gained."
