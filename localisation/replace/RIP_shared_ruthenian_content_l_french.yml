 magdeburg_law_tradition:0 "Magdeburg Law Tradition"
 magdeburg_law_tradition_desc:0 "Urban self-governance via Magdeburg rights is widespread across Belarus. This commercial culture drives economic development."
 magdeburg_privileges:0 "Magdeburg Privileges"
 magdeburg_privileges_desc:0 "The town keeps its charter through every passage of armies: the magistracy sits, the guilds keep their books, and the market is held on the appointed days."
 mazepa_golden_age:0 "Mazepa Era"
 merchant_guilds:0 "Merchant Guilds"
 merchant_guilds_desc:0 "Many-peopled guilds unite Ruthenian, Jewish, and German merchants. Commercial expertise and economic pragmatism drive our prosperity."
 MERCHANT_LADY:0 "Merchant Lady"
 MERCHANT_LORD:0 "Merchant Lord"
 merchant_networks:0 "Merchant Networks"
 merchant_networks_desc:0 "Jewish merchants, Armenian traders, and Polish factors create a many-peopled commercial culture. Economic pragmatism drives our prosperity."
 middle_dnieper_settlement:0 "Middle Dnieper Settlement"
 military_society:0 "Military Society"
 military_society_desc:0 "Constant border conflicts have created a society where every citizen is a potential soldier. Martial traditions permeate our culture."
 mobile_sich_desc:0 "The Sich can be quickly relocated if threatened."
 national_consciousness:0 "One Rusyn Estate"
 opinion_friendly:0 "Friendly Relations"
