 assembly_houses_reform:0 "Burgher Assemblies"
 assembly_houses_reform_desc:0 "Chartered towns send burghers to a standing assembly, and grievances are heard before they turn into revolt. The boyars resent every sitting of it."
 legislative_rada_reform:0 "Legislative Rada"
 legislative_rada_reform_desc:0 "A magnificent parliament founded on the representation of the population, with our nation's monarch at its helm."
 sacred_regulation_reform:0 "Sacred Law"
 sacred_regulation_reform_desc:0 "The sovereign's authority rests on divine sanction; no earthly court may set itself above it."
 merchant_nobility_reform:0 "Merchant Nobility"
 merchant_nobility_reform_desc:0 "Our country's trade guilds are the lifeblood of our economy, and by granting them greater political influence, we can ensure a prosperous future for our nation. However, this will undoubtedly come at the expense of our traditional nobility."
 open_trading_ports_reform:0 "Open Trading Ports"
 open_trading_ports_reform_desc:0 "Granting foreign merchants access to selected ports draws their trade into our realm and eases the cost of maintaining those harbours."
 considerable_bloodline_reform:0 "Unbroken Dynasty"
 considerable_bloodline_reform_desc:0 "Establishing a constant line of succession can near eliminate dynastic struggle and allow us to foster even greater rulers."
 elected_assemblies_reform:0 "Veche Assemblies"
 elected_assemblies_reform_desc:0 "Delegates from chartered towns, clergy, and landed communities gather in veche assemblies before proposals pass to the rada. This broad consent strengthens local administration but limits the crown's absolutist reach."
 divine_tsyisar_reform:0 "Divine Tsisar"
 divine_tsyisar_reform_desc:0 "The Tsisar rules by divine appointment and absolute authority; his word is law, and no council or court may question it."
