 rip_eparchy.4.t:0 "The Name Greek Catholic"
 rip_eparchy.4.d:0 "In 1774 Maria Theresa's court adopted the name Greek Catholic for the Uniates, and Vienna's Barbareum seminary, open from 1774 to 1784, belongs to the same policy. Joseph II's later reforms made the clergy legally equal to the Latin clergy.\n\nHere the seat, already Greek Catholic, gains the standing of a diocese under its Catholic owner. Acceptance protects the rite from missionary conversion and grants a diocese (-1 local unrest, +10% local tax) for twenty years. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. A new name settles the chancery; the parishes will take longer."
