l_english:
 het_compile_legacy_chronicles_title:0 "Compile the Legacy Chronicles"
 het_compile_legacy_chronicles_desc:0 "Systematize the political lessons of the Hetmanate from early host commanders to late collegial governance."

 het_legacy_eras.1.t:0 "The Earliest Era of the Host"
 het_legacy_eras.1.d:0 "Our old registers preserve names from Lyantskoronsky and Sahaidachny to Bohdan Khmelnytsky. The chronicles can frame this era either as a revolutionary military tradition or as the institutional foundation of Hetman authority."
 het_legacy_eras.1.a:0 "Canonize the Khmelnytsky military legacy"
 het_legacy_eras.1.b:0 "Codify early host institutions"

 het_legacy_eras.2.t:0 "Lessons of the Ruina"
 het_legacy_eras.2.d:0 "The succession struggles after Khmelnytsky - from Vyhovsky to Briukhovetsky and Samoylovych - fractured the polity. We must choose whether to prioritize reconciliation or enforce discipline through regimental centralization."
 het_legacy_eras.2.a:0 "Reconcile the officer factions"
 het_legacy_eras.2.b:0 "Impose regimental discipline"

 het_legacy_eras.3.t:0 "The Mazepa Question"
 het_legacy_eras.3.d:0 "Mazepa's period remains the central dispute in our memory: cultural renaissance and diplomacy, or military concentration and state coercion. The chronicles must choose a dominant interpretation."
 het_legacy_eras.3.a:0 "Emphasize Mazepa's renaissance"
 het_legacy_eras.3.b:0 "Emphasize military statecraft"

 het_legacy_eras.4.t:0 "The Hetman's Chancery and the Collegium"
 het_legacy_eras.4.d:0 "In the days of Skoropadsky, Apostol and Rozumovsky, the hetman's chancery repeatedly found an imperial official looking over its books. Our chroniclers disagree about the lesson. Should we guard the officers' liberties more closely, or keep the stricter accounts?"
 het_legacy_eras.4.a:0 "Preserve autonomy first"
 het_legacy_eras.4.b:0 "Reform the administration"

 het_legacy_eras.5.t:0 "Final Legacy of the Hetmanate"
 het_legacy_eras.5.d:0 "The chronicles are complete. Their final chapter will shape which institutions endure: constitutional commonwealth practice, regimental military statehood, or long-term cultural patronage."
 het_legacy_eras.5.a:0 "A constitutional Cossack commonwealth"
 het_legacy_eras.5.b:0 "A regimental military state"
 het_legacy_eras.5.c:0 "A patronage and education state"

 het_legacy_eras.6.t:0 "Pereiaslav Reconsidered"
 het_legacy_eras.6.d:0 "The treaty settlement at Pereiaslav is still contested in our political memory. One reading treats it as a negotiated compact that preserved room for Cossack autonomy; another frames it as a hard lesson that dependence invites permanent military pressure."
 het_legacy_eras.6.a:0 "Record Pereiaslav as a negotiated autonomy"
 het_legacy_eras.6.b:0 "Record Pereiaslav as a warning of dependency"

 het_legacy_eras.7.t:0 "Mazepa in State Memory"
 het_legacy_eras.7.d:0 "The Mazepa era can be codified either as a cultural high point of elite patronage, schools, and diplomacy, or as proof that state survival depends on a disciplined military center ready for great-power conflict."
 het_legacy_eras.7.a:0 "Preserve the cultural and diplomatic legacy"
 het_legacy_eras.7.b:0 "Preserve the military-political legacy"

 het_legacy_eras.8.t:0 "Collegium and Final Codification"
 het_legacy_eras.8.d:0 "The later collegial administration and imperial constraints must now be given their final place in the chronicles. We can codify this chapter as a template for durable state administration, or as a cautionary case that strengthens negotiated host governance."
 het_legacy_eras.8.a:0 "Codify a durable administrative model"
 het_legacy_eras.8.b:0 "Codify a negotiated host model"

 het_legacy_pereiaslav_reviewed:0 "Pereiaslav Legacy Reviewed"
 het_legacy_mazepa_reviewed:0 "Mazepa Legacy Reviewed"
 het_legacy_collegium_reviewed:0 "Collegium Legacy Reviewed"
 het_legacy_eras_completed:0 "Hetmanate Legacy Eras Completed"

 het_legacy_chronicle_reconciliation:0 "Chronicle of Reconciliation"
 desc_het_legacy_chronicle_reconciliation:0 "Official memory now favors negotiated settlements between competing officer factions and districts."
 het_legacy_chronicle_administration:0 "Chronicle of Administration"
 desc_het_legacy_chronicle_administration:0 "Administrative lessons from collegial governance are formalized into a practical state model."
 het_legacy_chronicle_commonwealth:0 "Constitutional Commonwealth Legacy"
 desc_het_legacy_chronicle_commonwealth:0 "The Hetmanate's record is interpreted as a constitutional tradition balancing estates and central authority."
 het_legacy_chronicle_regimental_state:0 "Regimental State Legacy"
 desc_het_legacy_chronicle_regimental_state:0 "The Hetmanate's memory is organized around military discipline, regimental hierarchy, and frontier readiness."
 het_legacy_chronicle_cultural_patronage:0 "Cultural Patronage Legacy"
 desc_het_legacy_chronicle_cultural_patronage:0 "The legacy emphasizes education, elite patronage, and fiscal support for state-building institutions."

 het_khmelnytsky_uprising_title:0 "Uprising of the Host"
 het_khmelnytsky_uprising_desc:0 "Whether breaking away before 1648 or rising under Bohdan Khmelnytsky, the Cossack Host takes up arms to defend its liberties and secure the core Dnieper lands."
 het_khmelnytsky_uprising_tt:0 "The Host rises in arms, granting military readiness and claims over the core Dnieper, Volhynian, and Podillian lands."

 het_orthodox_defender_title:0 "Kyiv & the Register"
 het_orthodox_defender_desc:0 "First tangible fruits of Cossack arms: formal recognition of the Kyiv Metropolis, chartering of Orthodox brotherhoods, or a confirmed Cossack register."

 het_break_polish_yoke_title:0 "Break the Polish Yoke"
 het_break_polish_yoke_desc:0 "Liberate the historic Ruthenian lands of Kyiv, Volhynia, and Podillia from Polish-Lithuanian domination."

 het_mazepa_renaissance_title:0 "Mazepa's Patronage"
 het_mazepa_renaissance_desc:0 "Hetman Ivan Mazepa's endowments raise Baroque churches, sustain the Kyiv-Mohyla Academy, and foster scholarship across the Hetmanate."

 het_swedish_alliance_title:0 "Mazepa's Course"
 het_swedish_alliance_desc:0 "Decide the Hetmanate's Northern War alignment: strike for independence alongside Sweden or uphold loyalty to the suzerain in exchange for a confirmed autonomy charter."

 het_rozumovsky_reforms_title:0 "Rozumovsky's Reforms"
 het_rozumovsky_reforms_desc:0 "Hetman Kyrylo Rozumovsky orders the chancery, judicial courts, and regular regiments along disciplined administrative lines."

 het_sich_stronghold_title:0 "Fortify the Sich"
 het_sich_stronghold_desc:0 "Transform our capital into an impregnable Cossack stronghold on the steppe."

 het_cossack_host_title:0 "Assemble the Host"
 het_cossack_host_desc:0 "Gather a formidable cavalry army worthy of the Cossack tradition."

 het_raid_doctrine_title:0 "Perfect the Raid Doctrine"
 het_raid_doctrine_desc:0 "Master the art of lightning cavalry raids that have made the Cossacks feared across the steppes."
 het_raid_doctrine_tt:0 "Unlocks advanced Cossack raiding decisions."

 het_zaporizhian_liberty_title:0 "Zaporozhian Liberty"
 het_zaporizhian_liberty_desc:0 "Secure true independence for the Zaporozhian Host, free from all overlords."

 het_dnieper_control_title:0 "Masters of the Dnieper"
 het_dnieper_control_desc:0 "Control the vital Dnieper River trade route from Kyiv to the Black Sea."

 het_black_sea_ambition_title:0 "Black Sea Ambitions"
 het_black_sea_ambition_desc:0 "Build a fleet to project Cossack power across the Black Sea."

 het_moldovan_alliance_title:0 "Moldavian Alliance"
 het_moldovan_alliance_desc:0 "Forge ties with Moldavia, opening the path to the Danube and the Balkans."
 het_moldovan_alliance_tt:0 "Opens the Moldavian course: vassalization, conquest, or a free alliance that holds."

 het_absorb_moldova_title:0 "Moldavian Union"
 het_absorb_moldova_desc:0 "Bind Moldavia to the Hetmanate as a vassal, as conquered land, or as a free ally whose hospodar the Host has defended in war or stood by under foreign pressure."

 het_danube_frontier_title:0 "The Danube Frontier"
 het_danube_frontier_desc:0 "Establish the Hetmanate as a power on the lower Danube."

 het_bulwark_christendom_title:0 "Bulwark of Christendom"
 het_bulwark_christendom_desc:0 "Stand as the Orthodox defender in the Balkans against Turkish expansion."


 het_organize_major_raid_title:0 "Organize Major Raid"
 het_organize_major_raid_desc:0 "Direct our scouts to choose a frontier theater in council. Once the course is set, Cossack riders strike an eligible neighbouring realm along that border."
 het_deep_penetration_raid_title:0 "Deep Penetration Raid"
 het_deep_penetration_raid_desc:0 "Dispatch elite cavalry behind enemy watchlines to strike a random unready city of a rival realm at peace with us."
 het_punitive_expedition_title:0 "Launch Punitive Expedition"
 het_punitive_expedition_desc:0 "Launch a punitive expedition against a rival at war with us, scorching and stripping an occupied town under our banners."
 het_steppe_domination_title:0 "Steppe Domination"
 het_steppe_domination_desc:0 "Assert complete mastery over the steppe, where Cossack cavalry reigns supreme."

 het_modernize_host_title:0 "Drill the Regular Regiments"
 het_modernize_host_desc:0 "Organize standing pike, musket, and artillery formations alongside the traditional Cossack Host."


 het_moldovan_protection_title:0 "Offer Moldavian Protection"
 het_moldovan_protection_desc:0 "Extend the Hetmanate's protection to Moldavia, bringing them into our sphere."

 het_integrate_moldova_title:0 "Integrate Moldavia"
 het_integrate_moldova_desc:0 "Fully integrate Moldavia into the Hetmanate after years of vassalage."

 het_moldovan_military_access_title:0 "Call Moldavian Levies"
 het_moldovan_military_access_desc:0 "Demand military service from our Moldavian subjects in time of war."

 het_danube_trade_charter_title:0 "Danube Trade Charter"
 het_danube_trade_charter_desc:0 "Establish formal trade rights along the Danube River."

 het_orthodox_missionary_support_title:0 "Support Orthodox Missionaries"
 het_orthodox_missionary_support_desc:0 "Send Orthodox missionaries to strengthen the faith in Moldavia."


 het_cossack_raids.1.t:0 "Organize the Raid"
 het_cossack_raids.1.d:0 "The Host has assembled and awaits orders. Where shall we strike?"
 het_cossack_raids.1.a:0 "Raid Ottoman territories"
 het_cossack_raids.1.b:0 "Raid Polish lands"
 het_cossack_raids.1.c:0 "Raid Crimean Tatars"
 het_cossack_raids.1.cancel:0 "Cancel the raid"

 het_cossack_raids.2.t:0 "Cossack Raiders Strike"
 het_cossack_raids.2.d:0 "Cossack cavalry has raided our borderlands, burning villages and seizing plunder."
 het_cossack_raids.2.a:0 "Ready the counterattack!"
 het_cossack_raids.2.b:0 "Strengthen our defenses"

 het_cossack_raids.3.t:0 "Deep Raid"
 het_cossack_raids.3.d:0 "Our cavalry has ridden deep past the enemy's watchlines. Songs of this foray will echo along every frontier post."
 het_cossack_raids.3.a:0 "Strike hard!"

 het_cossack_raids.4.t:0 "Cossack Punitive Strike"
 het_cossack_raids.4.d:0 "The Hetmanate has unleashed a devastating punitive raid against our troops."
 het_cossack_raids.4.a:0 "We must endure"

 het_cossack_raids.5.t:0 "Deep Raid Devastation"
 het_cossack_raids.5.d:0 "Cossack raiders have struck deep into our heartland, leaving destruction and humiliation."
 het_cossack_raids.5.a:0 "This is an outrage!"
 het_cossack_raids.5.b:0 "We cannot respond"

 het_cossack_raids.6.t:0 "Raid Spoils"
 het_cossack_raids.6.d:0 "Our raiders have returned with considerable treasure. How shall we handle the spoils?"
 het_cossack_raids.6.a:0 "Share it among the Host"
 het_cossack_raids.6.b:0 "Fill the treasury"

 het_raid_cooldown:0 "Raid Exhaustion"
 desc_het_raid_cooldown:0 "The horses need pasture and the companies must replace their stores before the next expedition."


 het_orthodox.1.t:0 "Call to Orthodox Crusade"
 het_orthodox.1.d:0 "An Orthodox crusade has been proclaimed. As Cossacks and defenders of the faith, where shall we direct our banners?"
 het_orthodox.1.a:0 "Against Catholic Poland!"
 het_orthodox.1.b:0 "Toward Constantinople"

 het_orthodox.2.t:0 "Khmelnytsky's Vendetta"
 het_orthodox.2.d:0 "Hetman Khmelnytsky calls for a holy war against Polish Catholic oppression of Orthodox Ruthenia."
 het_orthodox.2.a:0 "Rally the faithful!"

 het_orthodox.3.t:0 "Orthodox Brethren Offer Aid"
 het_orthodox.3.d:0 "Our Orthodox allies offer military support for the crusade against the Catholics."
 het_orthodox.3.a:0 "Welcome their aid"
 het_orthodox.3.b:0 "We need no help"

 het_orthodox.4.t:0 "Poland Humbled"
 het_orthodox.4.d:0 "Our crusade has broken Polish power, liberating the Orthodox lands of Ruthenia."
 het_orthodox.4.a:0 "The yoke is broken!"

 het_orthodox.5.t:0 "Lead an Orthodox Crusade"
 het_orthodox.5.d:0 "The Hetmanate has the prestige and strength to lead an Orthodox crusade. Shall we take up the standard?"
 het_orthodox.5.a:0 "We shall lead the faithful"
 het_orthodox.5.b:0 "Not at this time"


 het_moldova.1.t:0 "Approach Moldavia"
 het_moldova.1.d:0 "With our southern border reaching the Dniester, the Hetmanate must decide whether to court the Principality of Moldavia as an Orthodox ally and vassal or press our claims by force of arms."
 het_moldova.1.a:0 "Offer vassalization"
 het_moldova.1.b:0 "Propose alliance"
 het_moldova.1.c:0 "Demand submission"

 het_moldova.2.t:0 "Hetmanate Protection Offer"
 het_moldova.2.d:0 "The powerful Hetmanate offers to take us as their vassal, providing protection against our enemies."
 het_moldova.2.a:0 "Accept their protection"
 het_moldova.2.b:0 "Refuse politely"

 het_moldova.3.t:0 "Integrate Moldavia"
 het_moldova.3.d:0 "The time has come to fully integrate Moldavia into the Hetmanate."
 het_moldova.3.a:0 "Peaceful integration"
 het_moldova.3.b:0 "Force the annexation"

 het_moldova.4.t:0 "Moldavian Nobles Seek Support"
 het_moldova.4.d:0 "Moldavian nobles seek Cossack support against their current rulers."
 het_moldova.4.a:0 "Support their cause"
 het_moldova.4.b:0 "Remain neutral"

 het_moldova.5.t:0 "Orthodox Defense Pact"
 het_moldova.5.d:0 "Moldavia rallies to our standard in this war for the Orthodox faith."
 het_moldova.5.a:0 "Together we are strong"

 het_moldova.6.t:0 "Danube Trade Opens"
 het_moldova.6.d:0 "Control of Moldavian territory opens lucrative Danube trade routes."
 het_moldova.6.a:0 "Excellent!"
 het_moldova.7.t:0 "The Hospodar Besieged"
 het_moldova.7.d:0 "The hospodar's army has fallen back on the fortresses of the Moldavian uplands, and his envoys ride hard for the Dnieper. An ally under siege asks whether the Host's oath was only ink. Regiments could reach the Prut within weeks, at the price of the harvest at home."
 het_moldova.7.a:0 "Send the regiments to the Prut."
 het_moldova.7.b:0 "The hospodar must hold on his own."
 het_moldova.8.t:0 "Pressure on the Pact"
 het_moldova.8.d:0 "Envoys of the great courts that border Moldavia call at the hetman's chancery. They speak of friendship and of trade, and they ask only that the Host forget its pact with the hospodar. The colonels are divided; some would see the Host stand clear of other men's quarrels."
 het_moldova.8.a:0 "Keep faith with the hospodar."
 het_moldova.8.b:0 "Soothe the envoys and say nothing of the pact."

 het_moldova.90.t:0 "Moldavian Vassal Accord"
 het_moldova.90.d:0 "Chancery scribes register the terms of Moldavian allegiance."


