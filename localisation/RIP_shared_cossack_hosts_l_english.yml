 sloboda_mobile_watchposts:0 "Mobile Watchposts"
 desc_sloboda_mobile_watchposts:0 "Mounted watchmen carry word of a raid from one post to the next before the enemy can reach the villages."
 sloboda_service_privileges:0 "Renewed Service Privileges"
 desc_sloboda_service_privileges:0 "Confirmed service rights preserve frontier loyalty and military readiness."
 sloboda_central_oversight:0 "Central Frontier Oversight"
