l_french:
 rip_tur_ruthenian_palace_waqf:0 "Fondation ruthène du palais"
 desc_rip_tur_ruthenian_palace_waqf:0 "Les fondations charitables et les scribes ruthènes de la cour renforcent la diplomatie avec les voisins du nord et apaisent les tensions confessionnelles."
 rip_tur_kamianets_defter:0 "Defter du sandjak de Podolie"
 desc_rip_tur_kamianets_defter:0 "Des registres cadastraux réguliers et des garnisons soldées sécurisent Kamianets et stabilisent la fiscalité frontalière."
 rip_tur_salonika_ruthenian_factors:0 "Facteurs céréaliers mer Noire-Égée"
 desc_rip_tur_salonika_ruthenian_factors:0 "Les convois protégés de blé, de miel et de bois venus de Podolie et du bas Dniepr approvisionnent régulièrement les ports égéens."
 rip_tur_phanar_kyiv_mediation:0 "Médiation Constantinople-Kiev"
 desc_rip_tur_phanar_kyiv_mediation:0 "Des sauf-conduits reconnus entre le Phanar et le clergé kiévien apaisent les sujets orthodoxes et facilitent la diplomatie septentrionale."
 rip_cri_dnieper_salt_truce:0 "Trêve du sel du bas Dniepr"
 desc_rip_cri_dnieper_salt_truce:0 "Des limites de pâturage jurées et des gués saliniers gardés dirigent les péages de la steppe vers le trésor et la cavalerie du khanat."
 rip_cri_ruthenian_yarlyk_chancery:0 "Chancellerie des yarlyks ruthènes"
 desc_rip_cri_ruthenian_yarlyk_chancery:0 "Des clercs bilingues en langue turque et slave de chancellerie perçoivent un tribut urbain régulier plutôt qu'un pillage irrégulier."
 rip_pol_ruthenian_sejmik_accord:0 "Pacte des diétines ruthènes"
 desc_rip_pol_ruthenian_sejmik_accord:0 "Des garanties écrites pour les diétines provinciales freinent les vetos soudains et apaisent les palatinats orientaux."
 rip_pol_lviv_staple_corridor:0 "Corridor d'étape de Lwów"
 desc_rip_pol_lviv_staple_corridor:0 "Des entrepôts sous douane et des barges fluviales relient la cire moldave et le blé volhynien à la Baltique via Lwów."
 rip_pol_ruthenian_border_register:0 "Rôle de revue des Cosaques frontaliers"
 desc_rip_pol_ruthenian_border_register:0 "Des rôles de solde trimestriels maintiennent les bannières cosaques prêtes à couvrir la frontière de la steppe."
 rip_hab_galicia_cadastre_mod:0 "Cadastre de Galicie-Lodomérie"
 desc_rip_hab_galicia_cadastre_mod:0 "Les relevés fonciers impériaux limitent les exemptions seigneuriales et réduisent les coûts d'administration des terres ruthènes."
 rip_hab_carpathian_communes:0 "Sauvegardes des comitats carpatiques"
 desc_rip_hab_carpathian_communes:0 "La confirmation des droits pastoraux ruthènes et des gardes de cols maintient la fidélité des vallées carpatiques durant les crises hongroises."
 rip_hab_carpathian_post_road:0 "Poste impériale Vienne-Lwów"
 desc_rip_hab_carpathian_post_road:0 "Des relais postaux à travers les cols des Carpates accélèrent les dépêches impériales et les caravanes entre le Danube et la Ruthénie."
 rip_tur_ruthenian_hurrem_waqf_title:0 "Fonder le waqf ruthène du palais"
 rip_tur_ruthenian_hurrem_waqf_desc:0 "Recevoir les requêtes de la suite ruthène du palais et de la maison de Roxelane au sujet des fondations charitables et de la correspondance du nord."
 rip_tur_ruthenian_kamianets_eyalet_title:0 "Régler le defter de l'eyalet de Podolie"
 rip_tur_ruthenian_kamianets_eyalet_desc:0 "Vérifier les impôts urbains et la solde des garnisons le long de la ceinture fortifiée du Dniestr autour de Kamianets."
 rip_tur_ruthenian_janissary_levies_title:0 "Vérifier les rôles janissaires du nord"
 rip_tur_ruthenian_janissary_levies_desc:0 "Des différends ont éclaté entre les chefs d'orta janissaires et les auxiliaires frontaliers postés le long du Dniepr et de la steppe pontique."
 rip_tur_ruthenian_salonika_grain_title:0 "Affréter la flotte céréalière Salonique-Podolie"
 rip_tur_ruthenian_salonika_grain_desc:0 "Les marchands de Salonique proposent des crédits pour relier les cargaisons ruthènes de blé, de potasse et de suif aux marchés égéens."
 rip_tur_ruthenian_phanar_kyiv_synod_title:0 "Protéger la correspondance Phanar-Kiev"
 rip_tur_ruthenian_phanar_kyiv_synod_desc:0 "Délivrer un bérat impérial régissant les envoyés orthodoxes circulant entre le Patriarcat à Constantinople et la métropole de Kiev."
 rip_tur_ruthenian_frontier_crisis_title:0 "Pacifier les marches des eyalets du nord"
 rip_tur_ruthenian_frontier_crisis_desc:0 "Lorsque l'autorité chancelle à la Porte, les notables du Dniestr et du Dniepr réclament leurs arriérés et des franchises locales."
 rip_tur_ruthenian.1.t:0 "Lettres des appartements ruthènes"
 rip_tur_ruthenian.1.d:0 "Des serviteurs ruthènes de la maison impériale, longtemps inspirés par Roxelane, présentent des requêtes pour des ponts, des puits et des sauf-conduits vers le nord. Un acte de waqf solennel gagnera la bienveillance durable des voisins, bien que les oulémas préfèrent la piété austère."
 rip_tur_ruthenian.1.a:0 "Sceller un waqf impérial et accorder les sauf-conduits."
 rip_tur_ruthenian.1.result_tt:0 "Après 180 jours, la Porte gagne 50 de puissance diplomatique, 10 de légitimité et le modificateur Fondation ruthène du palais pour 15 ans."
 rip_tur_ruthenian.1.b:0 "Observer la charité de la mosquée et écarter les requêtes."
 rip_tur_ruthenian.2.t:0 "Le waqf du palais confirmé"
 rip_tur_ruthenian.2.d:0 "Le cadi a inscrit la fondation ruthène au registre impérial. Les ambassadeurs du nord saluent la courtoisie de la Porte."
 rip_tur_ruthenian.2.a:0 "Expédier les copies scellées."
 rip_tur_ruthenian.3.t:0 "Le relevé cadastral de Kamianets"
 rip_tur_ruthenian.3.d:0 "Les commissaires envoyés en Podolie signalent des ponts ruinés et des péages contestés sous les remparts de Kamianets. Dresser un defter impérial régulier stabilisera l'impôt et la forteresse, ou l'on peut affermer le revenu dès aujourd'hui."
 rip_tur_ruthenian.3.a:0 "Rédiger un defter impérial pour le sandjak de Podolie."
 rip_tur_ruthenian.3.result_tt:0 "Après 180 jours, Kamianets (ou une province ruthène) gagne 1 d'impôt de base, -15 d'autonomie locale et le modificateur Defter du sandjak de Podolie pour 20 ans (ou 25 de puissance administrative sinon)."
 rip_tur_ruthenian.3.b:0 "Affermer aussitôt les impôts frontaliers contre argent comptant."
 rip_tur_ruthenian.4.t:0 "Le defter de Podolie scellé"
 rip_tur_ruthenian.4.d:0 "Le nouveau defter recense chaque moulin, bac et bastion surplombant les gorges du Smotrytch. Percepteurs et garnisons partagent désormais le même rôle."
 rip_tur_ruthenian.4.a:0 "Poster la garnison sur les remparts."
 rip_tur_ruthenian.5.t:0 "Auxiliaires sur la ligne du Dniepr"
 rip_tur_ruthenian.5.d:0 "Des janissaires envoyés dans les forts du Dniepr s'opposent aux milices ruthènes et aux éclaireurs lipkas sur le partage des vivres. Régler les arriérés et l'exercice commun transformera ces garnisons en bouclier discipliné."
 rip_tur_ruthenian.5.a:0 "Régler les arriérés et exercer les ortas frontalières."
 rip_tur_ruthenian.5.result_tt:0 "Après 150 jours, gain de 8 en tradition terrestre, -5 de décadence le cas échéant et +10 de loyauté des janissaires."
 rip_tur_ruthenian.5.b:0 "Laisser les aghas répartir les rôles de garnison."
 rip_tur_ruthenian.6.t:0 "L'ordre rétabli dans les forts de la steppe"
 rip_tur_ruthenian.6.d:0 "La solde versée lors de la parade et les tours de garde unifiés, les compagnies rivales manœuvrent côte à côte sur le Dniepr."
 rip_tur_ruthenian.6.a:0 "Inscrire le rôle au Divan."
 rip_tur_ruthenian.7.t:0 "Facteurs de Salonique et blé du nord"
 rip_tur_ruthenian.7.d:0 "Les courtiers en grains chrétiens et juifs de Salonique proposent de financer des barges acheminant le blé et le lin ruthènes vers la mer Noire puis la mer Égée."
 rip_tur_ruthenian.7.a:0 "Garantir le consortium céréalier de Salonique."
 rip_tur_ruthenian.7.result_tt:0 "Après 210 jours, Salonique gagne 1 de production de base si elle est possédée (sinon 20 de puissance diplomatique), plus le modificateur Facteurs céréaliers pour 15 ans et +10 de loyauté des dhimmi."
 rip_tur_ruthenian.7.b:0 "Percevoir les droits portuaires ordinaires sans garantie."
 rip_tur_ruthenian.8.t:0 "Les greniers pleins à Salonique"
 rip_tur_ruthenian.8.d:0 "Les convois céréaliers du nord accostent sous la Tour Blanche, modérant le prix du pain en mer Égée et enrichissant la douane de Salonique."
 rip_tur_ruthenian.8.a:0 "Agrandir les entrepôts du port."
 rip_tur_ruthenian.9.t:0 "Envoyés entre le Phanar et Kiev"
 rip_tur_ruthenian.9.d:0 "Les évêques grecs du Phanar demandent à la Porte d'accorder un libre passage aux moines et lettrés kiéviens porteurs de livres liturgiques. Encadrer ces voyages par des bérats scellés transforme la méfiance en levier diplomatique."
 rip_tur_ruthenian.9.a:0 "Délivrer des bérats scellés encadrant les voyages Phanar-Kiev."
 rip_tur_ruthenian.9.result_tt:0 "Après 180 jours, gain de 10 de prestige, 35 de puissance administrative et Médiation Constantinople-Kiev pour 15 ans."
 rip_tur_ruthenian.9.b:0 "Limiter les déplacements orthodoxes aux diocèses locaux."
 rip_tur_ruthenian.10.t:0 "Le rôle de la chancellerie du Phanar"
 rip_tur_ruthenian.10.d:0 "Chaque lettre étant enregistrée à Constantinople avant la traversée de la steppe, prélats grecs et ruthènes louent la justice de la Porte."
 rip_tur_ruthenian.10.a:0 "Conserver les bérats sous le sceau du grand vizir."
 rip_tur_ruthenian.11.t:0 "Troubles sur la marche des eyalets du nord"
 rip_tur_ruthenian.11.d:0 "Alors que les intrigues de palais et les pamphlets révolutionnaires agitent l'Empire, les notables entre Dniestr et Dniepr menacent de suspendre l'impôt si un pacha loyal n'apporte solde et renforts."
 rip_tur_ruthenian.11.a:0 "Envoyer un trésor d'urgence et des levées loyales."
 rip_tur_ruthenian.11.result_tt:0 "Après 150 jours, gain de 1 de stabilité (ou de puissance administrative au maximum), +0.5 effectif annuel et -5 de décadence le cas échéant."
 rip_tur_ruthenian.11.b:0 "Proclamer une trêve frontalière pour reposer les garnisons."
 rip_tur_ruthenian.12.t:0 "La frontière du nord tient bon"
 rip_tur_ruthenian.12.d:0 "Des fonds opportuns et un commandement ferme ramènent les beys rétifs et les doyens ruthènes à l'obéissance sur les fleuves du nord."
 rip_tur_ruthenian.12.a:0 "Tenir la ligne des fleuves pour le Sultan."
 rip_cri_ruthenian_dnieper_pastures_title:0 "Régler les pâturages de la route du sel sur le Dniepr"
 rip_cri_ruthenian_dnieper_pastures_desc:0 "Arbitrer entre les mirzas nomades de Crimée et les charretiers tchoumak ruthènes au sujet des abreuvoirs et péages sous la Zaporogie."
 rip_cri_ruthenian_succession_envoys_title:0 "Recevoir les envoyés ruthènes au conseil de succession"
 rip_cri_ruthenian_succession_envoys_desc:0 "Obtenir reconnaissance, présents d'hommage et serments de trêve des seigneurs ruthènes lors d'une succession contestée en Crimée."
 rip_cri_ruthenian_ulus_tribute_title:0 "Instituer la chancellerie ruthène des yarlyks"
 rip_cri_ruthenian_ulus_tribute_desc:0 "Organiser les villes ruthènes soumises à l'ulus tatar en districts de tribut régulier plutôt qu'en cibles de razzias."
 rip_cri_ruthenian.1.t:0 "Troupeaux nomades et chariots de sel"
 rip_cri_ruthenian.1.d:0 "Les beys nomades accusent les tchoumak ruthènes de fouler les pâturages d'été du bas Dniepr, tandis que les marchands menacent de contourner les salines de Crimée. Sceller un tarif juré apaisera les clans et remplira le trésor du khan."
 rip_cri_ruthenian.1.a:0 "Jurer la trêve des pâturages et fixer les péages du sel."
 rip_cri_ruthenian.1.result_tt:0 "Après 180 jours, gain de 10 de loyauté des tribus nomades, 65 ducats et Trêve du sel du bas Dniepr pour 15 ans."
 rip_cri_ruthenian.1.b:0 "Laisser les mirzas prélever des chevaux sur les caravanes."
 rip_cri_ruthenian.2.t:0 "Péages des gués du sel"
 rip_cri_ruthenian.2.d:0 "De longs convois de chariots à bœufs traversent sous escorte clanique, acquittant droits et montures à chaque gué sans heurts."
 rip_cri_ruthenian.2.a:0 "Remettre la part des clans au kurultaï."
 rip_cri_ruthenian.3.t:0 "Envoyés à Bakhtchissaraï"
 rip_cri_ruthenian.3.d:0 "Lors d'une succession tendue, des envoyés ruthènes apportent zibelines et lettres proposant la reconnaissance mutuelle des juges frontaliers afin d'éviter un coup de poignard dans le dos durant le kurultaï."
 rip_cri_ruthenian.3.a:0 "Recevoir les envoyés avec honneur et échanger les tamgas."
 rip_cri_ruthenian.3.result_tt:0 "Après 150 jours, gain de 15 d'unité de horde (ou 15 de légitimité), 10 de prestige et 40 de puissance diplomatique."
 rip_cri_ruthenian.3.b:0 "Accepter les présents comme un simple tribut et les congédier."
 rip_cri_ruthenian.4.t:0 "Une trêve septentrionale confirmée"
 rip_cri_ruthenian.4.d:0 "Les frontières du Dniepr étant apaisées, les beys hésitants se rallient à la bannière des Giray à Bakhtchissaraï."
 rip_cri_ruthenian.4.a:0 "Arborer l'étendard aux queues de cheval."
 rip_cri_ruthenian.5.t:0 "Rôles de tribut de l'ulus du nord"
 rip_cri_ruthenian.5.d:0 "Les bourgeois et anciens ruthènes des cités conquises proposent un tribut régulier d'argent et de blé en échange de yarlyks bilingues qui préservent leurs ateliers du pillage."
 rip_cri_ruthenian.5.a:0 "Fonder une chancellerie bilingue des yarlyks ruthènes."
 rip_cri_ruthenian.5.result_tt:0 "Après 210 jours, une province ruthène gagne 1 d'impôt et 1 de production de base (sinon 25 de puissance administrative), plus Chancellerie des yarlyks ruthènes pour 15 ans."
 rip_cri_ruthenian.5.b:0 "Exiger plutôt une contribution de guerre immédiate des cités."
 rip_cri_ruthenian.6.t:0 "Yarlyks au sceau d'or en circulation"
 rip_cri_ruthenian.6.d:0 "Les marchés de l'ulus du nord rouvrent sous le sceau du khan, faisant de villes éprouvées des foyers fiscaux sûrs."
 rip_cri_ruthenian.6.a:0 "Envoyer les scribes vérifier la caisse du trimestre suivant."
 rip_pol_ruthenian_sejmik_compacts_title:0 "Négocier les pactes des diétines ruthènes"
 rip_pol_ruthenian_sejmik_compacts_desc:0 "Convenir avec les députés des palatinats ruthènes de règles écrites limitant les ruptures de Diète."
 rip_pol_ruthenian_baltic_moldavian_road_title:0 "Relier les étapes moldaves et baltiques de Lwów"
 rip_pol_ruthenian_baltic_moldavian_road_desc:0 "Coordonner les douanes entre la Moldavie, Lwów et Dantzig afin d'acheminer épices de mer Noire et blé volhynien sous chartes d'étape royales."
 rip_pol_ruthenian_cossack_register_roll_title:0 "Sceller le rôle des Cosaques du Dniepr"
 rip_pol_ruthenian_cossack_register_roll_desc:0 "Vérifier la solde trimestrielle, les draps d'uniforme et les bannières enregistrées avec les anciens cosaques de la frontière sud."
 rip_pol_ruthenian.1.t:0 "Lauda des palatinats ruthènes"
 rip_pol_ruthenian.1.d:0 "À Sądowa Wisznia et Loutsk, les diétines ruthènes rédigent des lauda réclamant des garanties précises avant la prochaine Diète ou élection royale. Des pactes écrits peuvent contenir le veto et apaiser les tribunaux."
 rip_pol_ruthenian.1.a:0 "Ratifier les pactes des diétines sous le sceau de la Couronne."
 rip_pol_ruthenian.1.result_tt:0 "Après 180 jours, gain de 1 de stabilité (ou puissance administrative au maximum), 10 de légitimité et Pacte des diétines ruthènes pour 15 ans."
 rip_pol_ruthenian.1.b:0 "Répondre aux députés par de simples lettres de courtoisie."
 rip_pol_ruthenian.2.t:0 "Débats apaisés à la Diète"
 rip_pol_ruthenian.2.d:0 "Les députés ruthènes se lèvent d'un même mouvement pour lire les pactes signés, isolant les partisans du blocage à la Diète."
 rip_pol_ruthenian.2.a:0 "Inscrire les lauda dans la Matricule de la Couronne."
 rip_pol_ruthenian.3.t:0 "La charte d'étape Lwów-Baltique"
 rip_pol_ruthenian.3.d:0 "Les bourgeois arméniens, ruthènes et allemands de Lwów demandent à la Couronne d'unir péages moldaves et barges de la Vistule sous une même charte d'étape jusqu'à Dantzig."
 rip_pol_ruthenian.3.a:0 "Financer les entrepôts et barges fluviales de Lwów."
 rip_pol_ruthenian.3.result_tt:0 "Après 210 jours, Lwów gagne 1 de production de base et Corridor d'étape de Lwów pour 20 ans (sinon 30 de puissance diplomatique), plus 2 de mercantilisme."
 rip_pol_ruthenian.3.b:0 "Vendre des laissez-passer temporaires aux facteurs étrangers."
 rip_pol_ruthenian.4.t:0 "Les caravanes emplissent le marché de Lwów"
 rip_pol_ruthenian.4.d:0 "Les chariots venus de Suceava rejoignent les barges du Boug et de la Vistule, faisant de Lwów le pivot entre mer Noire et Baltique."
 rip_pol_ruthenian.4.a:0 "Confirmer le sceau des guildes marchandes."
 rip_pol_ruthenian.5.t:0 "Délégués des villes du Dniepr"
 rip_pol_ruthenian.5.d:0 "Les colonels cosaques présentent au grand hetman de la Couronne des rôles usés, demandant draps d'uniforme et solde assurée contre la garde permanente face aux pillards de la steppe."
 rip_pol_ruthenian.5.a:0 "Financer le rôle trimestriel des Cosaques enregistrés."
 rip_pol_ruthenian.5.result_tt:0 "Après 150 jours, gain de 8 en tradition terrestre, +10 de loyauté des Cosaques et Rôle de revue des Cosaques frontaliers pour 15 ans."
 rip_pol_ruthenian.5.b:0 "Laisser les bannières vivre sur leurs quartiers d'hiver locaux."
 rip_pol_ruthenian.6.t:0 "Les bannières du sud rassemblées"
 rip_pol_ruthenian.6.d:0 "Draps neufs, barils de poudre et rôles scellés parviennent à Korsoun et Tcherkassy avant la campagne de printemps."
 rip_pol_ruthenian.6.a:0 "Approuver l'inspection du grand hetman."
 rip_hab_ruthenian_galicia_cadastre_title:0 "Arpenter les terres de la couronne en Galicie ruthène"
 rip_hab_ruthenian_galicia_cadastre_desc:0 "Envoyer les arpenteurs des Habsbourg mesurer domaines, salines royales et redevances paysannes en Galicie, Lodomérie et Ruthénie carpatique."
 rip_hab_ruthenian_carpathian_compromise_title:0 "Garantir les libertés des comitats de Ruthénie carpatique"
 rip_hab_ruthenian_carpathian_compromise_desc:0 "Confirmer les franchises des villages ruthènes de montagne et des milices de cols lors des troubles ou compromis dans les terres hongroises."
 rip_hab_ruthenian_danube_carpathian_post_title:0 "Ouvrir la route postale impériale Vienne-Carpates"
 rip_hab_ruthenian_danube_carpathian_post_desc:0 "Établir des relais de poste à travers la Moravie et les cols carpatiques pour relier Vienne à Oujhorod, Lwów et aux cours orientales."
 rip_hab_ruthenian.1.t:0 "Le cadastre impérial en Ruthénie"
 rip_hab_ruthenian.1.d:0 "Les commissaires impériaux à Lwów et en Maramaros signalent des immunités nobiliaires confuses, des salines dissimulées et de lourdes corvées paysannes. Un cadastre habsbourgeois unifié dégagera des revenus réguliers tout en réduisant l'autonomie seigneuriale."
 rip_hab_ruthenian.1.a:0 "Ordonner le relevé cadastral impérial."
 rip_hab_ruthenian.1.result_tt:0 "Après 210 jours, Lwów (ou Maramaros sinon, ou 25 de puissance administrative) gagne 1 d'impôt de base et -15 d'autonomie locale, plus Cadastre de Galicie-Lodomérie pour 15 ans."
 rip_hab_ruthenian.1.b:0 "Laisser l'assiette fiscale actuelle aux diètes locales."
 rip_hab_ruthenian.2.t:0 "Les registres reliés arrivent à Vienne"
 rip_hab_ruthenian.2.d:0 "Chaque domaine, saline et foyer villageois ruthène figure désormais dans les registres de la Hofkammer de Vienne."
 rip_hab_ruthenian.2.a:0 "Déposer le relevé auprès de la Hofkammer."
 rip_hab_ruthenian.3.t:0 "Anciens des cols des Carpates"
 rip_hab_ruthenian.3.d:0 "Au cœur des différends entre Vienne et les états hongrois, les maires ruthènes des comitats du nord-est demandent au souverain de confirmer leurs pâturages, leurs écoles et leurs gardes de cols sous protection impériale."
 rip_hab_ruthenian.3.a:0 "Confirmer les chartes villageoises et les gardes des cols."
 rip_hab_ruthenian.3.result_tt:0 "Après 150 jours, gain de 1 de stabilité (ou puissance administrative), +1 d'effectif de base et -4 d'agitation à Maramaros (sinon 20 de puissance militaire), plus Sauvegardes des comitats carpatiques pour 15 ans."
 rip_hab_ruthenian.3.b:0 "Renvoyer les requêtes devant la chancellerie hongroise."
 rip_hab_ruthenian.4.t:0 "Fidélité dans les vallées montagneuses"
 rip_hab_ruthenian.4.d:0 "Confirmés dans leurs biens communaux, les veilleurs ruthènes gardent les cols de Verecke et de Yablunytsia ouverts aux courriers fidèles."
 rip_hab_ruthenian.4.a:0 "Passer la revue montagnarde."
 rip_hab_ruthenian.5.t:0 "Diligences à travers les Beskides"
 rip_hab_ruthenian.5.d:0 "Les maîtres de poste d'Olomouc et de Košice proposent d'aménager des relais sur les cols des Beskides jusqu'à Oujhorod et Lwów."
 rip_hab_ruthenian.5.a:0 "Accorder des patentes de poste impériales pour la route carpatique."
 rip_hab_ruthenian.5.result_tt:0 "Après 180 jours, gain de 45 de puissance diplomatique, 8 de prestige et Poste impériale Vienne-Lwów pour 15 ans."
 rip_hab_ruthenian.5.b:0 "Engager des courriers privés au coup par coup."
 rip_hab_ruthenian.6.t:0 "Le premier cor de poste à Lwów"
 rip_hab_ruthenian.6.d:0 "Des chevaux frais attendent toutes les deux lieues du Danube aux contreforts du Dniestr, acheminant dépêches et lettres de change deux fois plus vite."
 rip_hab_ruthenian.6.a:0 "Afficher l'horaire à la porte de la Hofburg."
