 rip_church_gui_policy_help:0 "Church policy · Ecumenism is locked until every requirement in its tooltip is met."
 rip_church_gui_policy_help_tt:0 "Local Synod opens the institution choices.\nA limited diplomatic and local administrative settlement between Orthodox and Catholic communities.\nRequires twenty years of union, no forced integration in the last ten, stability +2, peace, guaranteed community rights in an Orthodox and in a Catholic province, and an Orthodox ally with opinion +100. Muscovite Orthodox provinces and states do not count.\nIn every province with guaranteed rights the extra unrest reduction rises from 0.5 to 1 and the tax and levy penalties shrink by 5 points each (net unrest -3, tax -10%, levies -15%). This is a limited diplomatic and local administrative settlement between Orthodox and Catholic communities, not a restoration of full ecclesial communion. Its +15 is diplomatic goodwill only: Orthodox and Catholic states gain +15 mutual opinion; Russian Orthodox states are excluded. The settlement costs nothing and is not withdrawn once concluded."
 rip_church_gui_policy_locked:0 "§RLocked§!"
 rip_church_gui_policy_locked_tt:0 "§RLocked§!"
 rip_church_gui_policy_ready:0 "§GAvailable§!"
 rip_church_gui_policy_ready_tt:0 "§GAvailable§!"
 rip_church_gui_protected:0 "§GCommunity rights guaranteed: spared Union backlash§!"
 rip_church_gui_protected_tt:0 "§GCommunity rights guaranteed: spared Union backlash§!"
 rip_church_gui_recognition_cost:0 "§Y1 ADM per development§! · lasts at least ten years\nOwned, controlled Orthodox, Muscovite Orthodox or Catholic city. Its religion does not change."
 rip_church_gui_recognition_cost_tt:0 "§Y1 ADM per development§! · lasts at least ten years\nOwned, controlled Orthodox, Muscovite Orthodox or Catholic city. Its religion does not change."
 rip_church_gui_recognition_reason:0 "[Root.GetChurchRecognitionReason]"
 rip_church_gui_recognition_reason_tt:0 "[Root.GetChurchRecognitionReason]"
 rip_church_gui_recognize_help:0 "Requires an eligible owned province to be selected."
 rip_church_gui_recognize_help_tt:0 "Community rights are guaranteed from the selected province panel."
 rip_church_gui_recognize_parish:0 "Guarantee community rights"
 rip_church_gui_recognize_parish_tt:0 "Select an owned Orthodox, Muscovite Orthodox or Catholic province, then use Guarantee community rights in its province panel. This province-level marker is a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The province keeps its religion; it is not converted and does not enter the Union. Costs 1 ADM per development and lasts at least ten years. Unrest falls by 2, plus 0.5 from the protected local tradition; local tax falls by 15% and manpower by 20%. The tax and manpower reductions are a game-design interpretation of the administrative compromise of protecting local arrangements and autonomy, not a penalty for another faith and not a documented historical formula. After the ecumenical settlement: unrest -3, tax -10%, manpower -15%."
 rip_church_gui_register_columns:0 "[Root.GetChurchRegisterColumns]"
 rip_church_gui_register_columns_tt:0 "[Root.GetChurchRegisterColumns]"
 rip_church_gui_register_header_empty:0 "§WProvince          Rite          Status§!"
 rip_church_gui_register_header_empty_tt:0 "§WProvince          Rite          Status§!"
 rip_church_gui_register_header_full:0 "§WProvince          Rite          Status          Action§!"
 rip_church_gui_register_header_full_tt:0 "§WProvince          Rite          Status          Action§!"
 rip_church_gui_rite_cell:0 "§WCommunity rights§!\n§YProvince by province§!"
 rip_church_gui_rite_cell_tt:0 "A guarantee protects a province's rite and clergy under Greek Catholic rule. It does not convert the province or bring it into the Union. Guarantee rights from the province panel."
 rip_church_gui_rite_eastern:0 "Orthodox"
