 rip_church_ro_status:0 "[Root.GetChurchROStatus]"
 rip_church_ro_status_tt:0 "[Root.GetChurchROStatus]\n1448 establishes an Orthodox metropolitanate. 1589-1593 recognition preserves Orthodoxy. A separate Muscovite confession follows a deliberate schism or the formal Raskol after 1666; a ritual compromise avoids the latter. Orthodox parishes retain local toleration and unity protection while communion holds. Repression weakens that protection; renouncing communion removes it."
 rip_church_ro_step1:0 "[Root.GetChurchROStep1]"
 rip_church_ro_step1_tt:0 "Mission is the fourth policy above. It must stay on: closing it closes every funded node.\n[Root.GetChurchIconMissionAccess]"
 rip_church_ro_step2:0 "[Root.GetChurchROStep2]"
 rip_church_ro_step2_tt:0 "[Root.GetChurchRONodeHint]\nA node costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month. It needs a merchant, 50% trade power, a connected parish with a temple or cathedral and a province to convert. One node is allowed; two after renouncing communion."
 rip_church_ro_step3:0 "[Root.GetChurchROStep3]"
 rip_church_ro_step3_tt:0 "Open the funded node in the Trade window and select the Missionary Network trade policy. It costs no ducats and converts settled provinces beside your parishes, slowly. Independent Orthodox states stay protected until communion is renounced."
 rip_church_ro_steps_title:0 "Mission network"
 rip_church_ro_steps_title_tt:0 "Three steps start the Muscovite mission network.\n§Y1.§! Switch on the Mission policy above.\n§Y2.§! Fund a trade node here: §Y10 Fervor§! once, then §G+3 Fervor§! a month and trade power in your parishes there.\n§Y3.§! In the Trade window of that node choose the Missionary Network policy; it converts neighbouring provinces gradually.\nFunding alone converts nothing, but it already pays."
 rip_church_ro_synodal_status:0 "Governing Synod in Orthodox communion"
 rip_church_ro_two_nodes:0 "2"
 rip_church_ro_unrecognized:0 "Muscovite confession in Eastern communion"
 rip_church_ro_window_toggle:0 "Policies"
 rip_church_ro_window_toggle_tt:0 "Show or hide the Muscovite Church policy window. Click a policy icon there to activate or deactivate it; the retired native icon selector is not used."
 rip_church_sponsor_union_desc:0 "From 1596, a Catholic crown may support an Eastern union without changing its state religion. Pay 100 ADM, 100 DIP and one year's income. The state action changes one eligible core province's religion to Greek Catholic; it is separate from a community-rights guarantee and does not report local consent. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 rip_church_sponsor_union_title:0 "Sponsor an Eastern Catholic union"
 rip_church_withdraw_union_support_desc:0 "End the Catholic crown's patronage of the Union. Existing parish faiths do not change; earlier foundation and negotiation payments are not refunded."
 rip_church_withdraw_union_support_title:0 "Withdraw royal support for the Union"
 rip_ro_history.1.a:0 "Correct the books; leave judgment to a later council"
 rip_ro_history.1.b:0 "Protect both ritual traditions"
 rip_ro_history.1.d:0 "The patriarch proposes correcting the books against contemporary Greek practice. Implementing the revision begins a dispute over ritual authority; it does not yet create a new confession. From 1666 a council will decide whether to condemn the old rites. Recognizing both practices now avoids that rupture, at a continuing cost to uniform missionary policy and patriarchal authority."
 rip_ro_history.1.t:0 "The Correction of the Service Books"
 rip_ro_history.2.a:0 "Delay the election and appoint a locum tenens"
 rip_ro_history.2.b:0 "Elect a patriarch and preserve the office"
 rip_ro_history.2.d:0 "The succession to the patriarchal throne confronts the crown with a choice. A locum tenens would administer the church while the ruler delays a new election, weakening patriarchal authority and clerical loyalty. Electing a new patriarch preserves the institution and clerical influence, at the expense of crown revenues."
 rip_ro_history.2.t:0 "The Vacant Patriarchal Throne"
 rip_ro_history.3.a:0 "Establish the Governing Synod under the crown"
 rip_ro_history.3.b:0 "Restore the patriarchal succession"
 rip_ro_history.3.d:0 "A governing synod under the crown can replace the vacant patriarchal office. It improves tax administration and reduces stability costs, but diminishes autonomous patriarchal authority and clerical loyalty. Alternatively, we can restore the patriarchal succession. This institutional choice does not change our religion or sever communion with the Eastern churches."
 rip_ro_history.3.t:0 "The Ecclesiastical Regulation"
 rip_ro_patriarchal_vacancy:0 "Patriarchal Interregnum"
 rip_ro_preserved_patriarchate:0 "Preserved Patriarchal Succession"
 rip_ro_renounce_communion_desc:0 "Deliberately proclaim a separate Muscovite confession. Costs 100 DIP and 1 stability. Our Orthodox core capital follows the hierarchy once; other provinces keep their faith. Orthodox parish protections end and our relations with the other Eastern churches deteriorate. This is an alternative-history choice, not the automatic consequence of autocephaly."
 rip_ro_renounce_communion_title:0 "Renounce Eastern Orthodox Communion"
 rip_ro_restricted_communion:0 "Orthodox Communion under Restrictions"
 rip_ro_ritual_compromise:0 "Two Ritual Traditions"
 rip_ro_shared_communion:0 "Orthodox Communion Preserved"
 rip_ro_synodal_government:0 "The Governing Synod"
 russian_orthodox.1.a:0 "Elect our metropolitan within Orthodoxy"
 russian_orthodox.1.b:0 "Continue to seek approval from Constantinople"
 russian_orthodox.1.d:0 "Our bishops propose electing their metropolitan without awaiting Constantinople. This establishes a local autocephalous jurisdiction within Orthodoxy. Our state and provinces remain Orthodox. A separate Muscovite confession can emerge only through a deliberate later schism or the Raskol."
 russian_orthodox.1.t:0 "The Election of a Metropolitan"
 russian_orthodox.14.a:0 "Adopt the patriarchal title"
 russian_orthodox.14.d:0 "Our established patriarchate has received recognition within Orthodox communion. Its traditional title can now be adopted at home. This confers neither jurisdiction over every Orthodox country nor a new universal patriarchate."
 russian_orthodox.2.a:0 "Accept patriarchal dignity in Orthodox communion"
 russian_orthodox.2.b:0 "Defer the settlement for now"
 russian_orthodox.2.d:0 "Patriarchal dignity offers our church a recognized place among the Eastern patriarchates. Accepting recognition preserves Orthodox communion and our present faith; conciliar confirmation follows from 1593. Refusing their authority is a deliberate alternative-history schism: it establishes a separate Muscovite confession and removes protection for Orthodox parishes."
 russian_orthodox.4.a:0 "Impose administrative and linguistic uniformity"
 russian_orthodox.4.d:0 "Our eighteenth-century administration seeks greater linguistic and institutional uniformity. Coercion will provoke provincial resistance. We may instead support gradual integration or retain local arrangements. The policy is a gameplay abstraction, not an institution of the medieval metropolitanate."
 russian_orthodox.4.t:0 "Imperial Administrative Assimilation"
 russian_orthodox.5.a:0 "Authorize coercive confessional courts"
 russian_orthodox.5.b:0 "Permit limited religious prosecutions"
 russian_orthodox.5.c:0 "Preserve religious accommodation"
 russian_orthodox.5.d:0 "After the council, church courts and secular officers can enforce approved religious practice. Strong coercion threatens Orthodox parish guarantees and may provoke resistance. These confessional courts are not a copy of the Roman Inquisition."
 russian_orthodox.5.t:0 "Confessional Courts after the Council"
 russian_orthodox.6.a:0 "Enforce the council and suppress the old rites"
 russian_orthodox.6.b:0 "Confirm the new books but tolerate private old rites"
 russian_orthodox.6.c:0 "Accept both rites and prevent the rupture"
 russian_orthodox.6.d:0 "The correction of the service books has reached a formal council. Condemning the old rites will create the Raskol and a separate Muscovite confession in game terms, while preserving communion with the other Eastern churches unless we have deliberately broken it. Repression weakens protection for Orthodox parishes; accepting both rites avoids the confessional separation and its disaster at the price of weaker uniformity."
 russification_campaign_decision_desc:0 "Available from 1700. Spend 100 ADM and 50 MIL on a coercive twenty-year administrative policy. Local resistance and missionary disputes may follow; cultures do not change instantly."
 russification_campaign_decision_title:0 "Impose Administrative Assimilation"
