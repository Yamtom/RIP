 rip_gov_kru_domestic_tt:0 "§YCOURT STABILITY§!"
 rip_gov_kru_decay:0 "Decadence: [Root.RipGovDecadence]"
 rip_gov_kru_decay_tt:0 "Yearly change in Decadence under present conditions. Add the coloured values below. Court events may also raise or lower Decadence.\n[Root.RipGovStabZero] stability = 0\n[Root.RipGovStabBad] stability < 0\n[Root.RipGovWar] at war\n[Root.RipGovLoans] at least 5 loans\n[Root.RipGovAutonomy] average autonomy at least 40%\n[Root.RipGovLegitimacy] legitimacy below 50\n[Root.RipGovStabGood] stability at least +2\n[Root.RipGovPeace] at peace\nAt the first yearly review, Decadence starts at 20 before the adjustments listed above. Its effects change at 40 and again at 70."
 rip_gov_kru_annual:0 "Yearly change: inspect the active causes"
 rip_gov_kru_annual_tt:0 "Yearly change in Decadence under present conditions. Add the coloured values below. Court events may also raise or lower Decadence.\n[Root.RipGovStabZero] stability = 0\n[Root.RipGovStabBad] stability < 0\n[Root.RipGovWar] at war\n[Root.RipGovLoans] at least 5 loans\n[Root.RipGovAutonomy] average autonomy at least 40%\n[Root.RipGovLegitimacy] legitimacy below 50\n[Root.RipGovStabGood] stability at least +2\n[Root.RipGovPeace] at peace\nAt the first yearly review, Decadence starts at 20 before the adjustments listed above. Its effects change at 40 and again at 70."
 rip_gov_kru_crisis:0 "Risk at 90 | Recedes below 75\nEnd crisis: below 60 and stability at least +1"
 rip_gov_kru_crisis_tt:0 "Court Crisis can start accumulating while the Kyivan Confederation holds this reform, faces no other disaster, and Decadence reaches at least 90. Base monthly progress at 90+: +6; frontier centralisation +1.5, frontier liberties -1, southern recovery -1. Progress recedes below 75. An active crisis ends only when Decadence is below 60 AND stability is at least +1.\nThe first time a yearly review puts Decadence at 90 or higher, the court may offer a way to reduce it. The disaster begins only when its progress is full."
 rip_gov_cesar_title:0 "§YCesarstvo: Lands and Settlement§!"
 rip_gov_cesar_title_tt:0 "Shares use total development of ALL owned provinces, including territories; subjects are excluded. The census updates monthly. Displayed whole percentages are rounded down; thresholds use the exact share.\nNon-primary: provinces whose culture differs from the owner's primary culture. Unaccepted: the subset of those provinces whose culture the crown does not recognize as accepted. Accepted cultures within our cultural union follow imperial union standing.\nConquest, development, province loss, culture conversion and changes in accepted or primary culture alter these shares at the next census. Promoting a culture can reduce the unaccepted share without reducing the non-primary share."
 rip_gov_cesar_purpose:0 "Cultural recognition sustains the imperial settlement."
 rip_gov_cesar_purpose_tt:0 "Shares use total development of ALL owned provinces, including territories; subjects are excluded. The census updates monthly. Displayed whole percentages are rounded down; thresholds use the exact share.\nNon-primary: provinces whose culture differs from the owner's primary culture. Unaccepted: the subset of those provinces whose culture the crown does not recognize as accepted. Accepted cultures within our cultural union follow imperial union standing.\nConquest, development, province loss, culture conversion and changes in accepted or primary culture alter these shares at the next census. Promoting a culture can reduce the unaccepted share without reducing the non-primary share."
