l_english:

 # =====================================================================
 # THE UNION TAKEN BY THE CROWN - events/UniateCrownUnion.txt
 #
 # SPECULATIVE. Every union that was actually signed was signed by bishops
 # living under a Catholic crown. This chain is the mirror image and it did
 # not happen: a Ruthenian sovereign takes his own church first and walks it
 # into communion afterwards, on the English pattern. The opening event and
 # the capstone both say so where the player can read it.
 # =====================================================================

 rip_ucr_treat_with_rome_title:0 "Treat with Rome"
 rip_ucr_treat_with_rome_desc:0 "The chancery has named what the crown wants and cannot get from Constantinople. An embassy can be sent to put the question to Rome directly - not through our bishops, and not with their knowledge."
 rip_ucr_needs_a_catholic_broker_tt:0 "A Catholic great power we are not at war with can carry the letter"
 rip_ucr_needs_a_strong_crown_tt:0 "The crown is strong enough to answer for its own church"
 rip_ucr_synod_not_consulted_tt:0 "§RThe metropolitan is not told.§!"

 uniate_crown.1.t:0 "The Chancery Reads Its List"
 uniate_crown.1.d:0 "The secretaries have set out what the crown needs and cannot obtain. Constantinople is under the Turk and can grant nothing that the western courts will read; the Patriarch's letters carry weight in our own churches and nowhere else.\n\nRome can grant those things. Rome has always been able to grant them. What Rome has never been offered is the obedience of a metropolitanate that keeps its own rite, its own liturgy and its own married clergy, and asks only that the commemoration change.\n\nThe metropolitan is not in this room.\n\n§YThis is alternate history. No Ruthenian sovereign took his church to Rome over the heads of his own bishops; every real union was signed by the bishops themselves, under a Catholic crown.§!"
 uniate_crown.1.a:0 "We want the word kingdom, written by a hand the west reads."
 uniate_crown.1.b:0 "We want a dispensation, and a succession that holds."
 uniate_crown.1.c:0 "Name nothing. The church is not the crown's to sell."

 uniate_crown.2.t:0 "The Terms Come Back Written"
 uniate_crown.2.d:0 "The articles have returned from the Curia, engrossed and sealed, and they are shorter than the embassy expected. The rite is untouched: the liturgy, the calendar, the married priests, the Slavonic books, the communion in both kinds. Nothing that a parish would notice on a Sunday.\n\nWhat is asked is the chain of command. The metropolitanate passes under Rome, the metropolitan is confirmed from Rome, and the commemoration at the anaphora changes from the Patriarch to the Pope.\n\nThe secretaries note, without being asked to, that our own synod has not seen these articles and is not named in them."
 uniate_crown.2.a:0 "Sign the articles as they stand."
 uniate_crown.2.b:0 "Sign, but ask for a legate to stand behind us."
 uniate_crown.2.c:0 "Burn them. This is further than the crown may go."

 uniate_crown.3.t:0 "The Metropolitan Learns of It"
 uniate_crown.3.d:0 "He learns of it from a chancery clerk, on an ordinary morning, from a copy made for the archive. Not from Rome, not from the crown, and not before it was done.\n\nHe is an old man and he does not raise his voice. He asks one question - whether the liturgy is to change - and when he is told that it is not, he sits down and says nothing for some time. Then he asks who signed for the church.\n\nThere is no good answer to that, and the clerk does not attempt one."
 uniate_crown.3.a:0 "Keep him. Let the see be seen to continue."
 uniate_crown.3.b:0 "Replace him with a man who signed."
 uniate_crown.3.c:0 "Let him go where he likes. He will not go far."

 uniate_crown.4.t:0 "The Synod Is Told"
 uniate_crown.4.d:0 "The bishops are summoned to a hall the crown pays for, and the articles are read to them by a royal secretary rather than by one of their own. They are not asked whether the union is to be made. They are asked to subscribe to a union that has been made.\n\nThe older sees understand at once what has happened to them and what will happen if they refuse. The younger men, who owe their mitres to the palace, look at the older men and wait.\n\nWhat is being decided in this hall is not doctrine. It is whether a Ruthenian synod is a council or a chancery."
 uniate_crown.4.a:0 "Every see subscribes, and every see is paid for it."
 uniate_crown.4.b:0 "The sees that will subscribe are enough."
 uniate_crown.4.c:0 "There will be no more synods. The crown will name the bishops."

 uniate_crown.5.t:0 "The Parishes Hear It Last"
 uniate_crown.5.d:0 "It reaches the villages the way everything reaches them: from the reader's desk, in the announcement that the commemoration has changed. One name is said where another was said before.\n\nIn most places nothing follows. The priest is the same man, the icons are in the same corners, the fast is kept on the same days. In some places the congregation walks out. In a few, the brotherhood locks the church and keeps the key, and the priest holds the liturgy on the porch.\n\nThe crown had reckoned on the bishops. It had not reckoned on the brotherhoods."
 uniate_crown.5.a:0 "Send commissioners. Buy the brotherhoods off."
 uniate_crown.5.b:0 "Send soldiers. The keys will be handed over."
 uniate_crown.5.c:0 "Leave them. A locked church opens by itself in winter."

 uniate_crown.6.t:0 "What Was Bought"
 uniate_crown.6.d:0 "The bull has come, and with it the thing the chancery named at the beginning.\n\nThe western courts read it the way they read such documents - carefully, and with an eye to what it costs them to acknowledge. But they do read it, and that is the whole difference. What a Patriarch under the Turk could not confer, a Pope has conferred in a single line.\n\nThe price is already paid. It was paid in the hall where the synod subscribed, and in the parishes where the key was handed over."
 uniate_crown.6.a:0 "Let it be proclaimed in every town we hold."
 uniate_crown.6.b:0 "Let it be filed. The succession is what mattered."

 uniate_crown.7.t:0 "The Standing Bill"
 uniate_crown.7.d:0 "A generation has passed and the clergy have worked out what the settlement means for them. It means that a see is a crown appointment, that a complaint travels to the palace before it travels to Rome, and that a bishop who is inconvenient is a bishop who is replaced.\n\nThe better sort of them say so plainly, in memorials that are respectful and impossible to answer. The worse sort have simply learned to be useful.\n\nThe crown has a church that does what it is told. Whether it has a church anyone believes is a different account."
 uniate_crown.7.a:0 "Endow the sees properly. A paid bishop complains less."
 uniate_crown.7.b:0 "Let the memorials be answered, point by point."
 uniate_crown.7.c:0 "They will be useful or they will be replaced."

 uniate_crown.8.t:0 "Two Generations On"
 uniate_crown.8.d:0 "Nobody now alive remembers the hall where the synod subscribed. The liturgy is what it always was; the commemoration is what the crown made it; and the men in the sees have never known any other arrangement.\n\nWhat the settlement produced is a church that is genuinely of this country and genuinely in communion with Rome, and which answers, in every practical matter, to the palace. Whether that is a Ruthenian church that found a protector or a royal department that says the liturgy is a question the century has stopped asking.\n\n§YThis road was not taken in life. The union came from the bishops, not from the throne, and the throne it came under was not Ruthenian.§!"
 uniate_crown.8.a:0 "Let it stand as it is. It works."
 uniate_crown.8.b:0 "Give the synod back its voice, now that it is safe to."

 # --- the standing modifiers of this chain ---------------------------
 rip_ucr_church_of_the_palace:0 "Church of the Palace"
 desc_rip_ucr_church_of_the_palace:0 "The bishops answer to the chancery. A see is a crown appointment, a complaint travels to the palace before it travels to Rome, and the synod meets when it is summoned."
 rip_ucr_crown_names_the_bishops:0 "The Crown Names the Bishops"
 desc_rip_ucr_crown_names_the_bishops:0 "The metropolitan who would not subscribe has been replaced by one who did. Every see after him understands the arrangement without being told."
 rip_ucr_synod_by_decree:0 "Synod by Decree"
 desc_rip_ucr_synod_by_decree:0 "There is no council. The crown issues what a council would have issued, and the sees receive it."
 rip_ucr_metropolitan_in_exile:0 "The Metropolitan in Exile"
 desc_rip_ucr_metropolitan_in_exile:0 "He went, and he did not go quietly. His letters are read in the brotherhoods, and every one of them is dated from somewhere the crown does not reach."
 rip_ucr_recognition_of_rome:0 "Recognition of Rome"
 desc_rip_ucr_recognition_of_rome:0 "What Constantinople could not confer under the Turk, the Curia has conferred in a line, and the western courts have read it."
 rip_ucr_palace_church_settled:0 "The Settlement Holds"
 desc_rip_ucr_palace_church_settled:0 "Two generations on, nobody remembers the arrangement being made. The church is of this country, in communion with Rome, and obedient to the palace, and it no longer occurs to anyone that these might be three different things."
 rip_ucr_synod_restored:0 "The Synod Restored"
 desc_rip_ucr_synod_restored:0 "The council sits again, and its acts are its own. It was safe to give back only because it had been taken long enough ago that nobody proposed to use it."
 rip_ucr_parish_disquiet:0 "Disquiet in the Parishes"
 desc_rip_ucr_parish_disquiet:0 "The commemoration changed and the brotherhoods noticed. The churches are open, the fast is kept, and the collection box is lighter than it was."
 rip_ucr_crown_preachers:0 "Crown Preachers"
 desc_rip_ucr_crown_preachers:0 "Men sent from the capital to explain the settlement in the villages, paid by the treasury and heard with the courtesy owed to a guest."

 # The union taken by the crown, as the neighbours see it
 rip_ucr_opinion_took_the_church:0 "Took the Church by Decree"
 rip_ucr_legate_judged_between_us:0 "A Roman Legate Judged Between Us"
