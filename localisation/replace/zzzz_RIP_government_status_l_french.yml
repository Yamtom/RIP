 rip_gov_kru_partner_tt:0 "The leading faction must have at least 60 influence to dominate. Its partner is the PREVIOUS dominant faction, not the runner-up. The third faction is the opposition. The partner receives a junior-voice modifier only at 38 influence or more.\nOn the first recorded dominance, the default partner is Boyars for Knyazi, and Knyazi for Boyars or Starshyna. Below 60 there is no coalition or junior voice; the States General scale returns to centre. The remembered previous dominant faction is retained.\nThe record refreshes monthly and after courting a faction. States General requires Res Publica or Winds of Change."
