 post_poltava_repression:0 "Post-Poltava Repression"
 post_poltava_repression_desc:0 "After our defeat at Poltava, Russia tightens its grip on the Hetmanate."
 desperate_independence_war:0 "Desperate War for Independence"
 desperate_independence_war_desc:0 "We fight a hopeless war against overwhelming odds."
 mobile_sich_desc:0 "The Sich can be quickly relocated if threatened."
