l_english:
 rip_tur_ruthenian_palace_waqf:0 "Ruthenian Palace Endowment"
 desc_rip_tur_ruthenian_palace_waqf:0 "Charitable endowments and Ruthenian scribes at court strengthen diplomacy with northern neighbours and ease communal tensions."
 rip_tur_kamianets_defter:0 "Podillian Sanjak Defter"
 desc_rip_tur_kamianets_defter:0 "Regular cadastral registers and salaried fortress crews secure Kamianets and stabilize frontier tax collection."
 rip_tur_salonika_ruthenian_factors:0 "Black Sea-Aegean Grain Factors"
 desc_rip_tur_salonika_ruthenian_factors:0 "Protected grain, honey, and timber shipments from Podillia and the lower Dnieper keep Aegean ports supplied."
 rip_tur_phanar_kyiv_mediation:0 "Constantinople-Kyiv Mediation"
 desc_rip_tur_phanar_kyiv_mediation:0 "Recognized letters of safeguard between the Phanar and Kyivan churchmen soothe Orthodox subjects and soften northern diplomacy."
 rip_cri_dnieper_salt_truce:0 "Lower Dnieper Salt Truce"
 desc_rip_cri_dnieper_salt_truce:0 "Sworn pasture limits and guarded salt-cart crossings channel steppe tolls into the Khanate treasury and cavalry stables."
 rip_cri_ruthenian_yarlyk_chancery:0 "Ruthenian Yarlyk Chancery"
 desc_rip_cri_ruthenian_yarlyk_chancery:0 "Bilingual Turkic and Chancery Slavonic clerks collect predictable urban tribute instead of erratic seasonal plunder."
 rip_pol_ruthenian_sejmik_accord:0 "Ruthenian Sejmik Compact"
 desc_rip_pol_ruthenian_sejmik_accord:0 "Written procedural guarantees for provincial assemblies curb sudden vetoes and calm eastern palatinates."
 rip_pol_lviv_staple_corridor:0 "Lviv Staple Trade Corridor"
 desc_rip_pol_lviv_staple_corridor:0 "Bonded warehouses and river barges link Moldavian wax and Volhynian grain through Lviv to the Baltic."
 rip_pol_ruthenian_border_register:0 "Frontier Cossack Muster Roll"
 desc_rip_pol_ruthenian_border_register:0 "Regular quarterly pay rolls keep frontier Cossack banners ready for rapid cavalry screening along the steppe edge."
 rip_hab_galicia_cadastre_mod:0 "Galician-Lodomeria Cadastre"
 desc_rip_hab_galicia_cadastre_mod:0 "Imperial land surveys curb magnate tax exemptions and lower administrative overhead in newly incorporated Ruthenian crownlands."
 rip_hab_carpathian_communes:0 "Carpathian County Safeguards"
 desc_rip_hab_carpathian_communes:0 "Confirming Rusyn mountain grazing rights and pass watches keeps Carpathian valleys loyal during Hungarian crises."
 rip_hab_carpathian_post_road:0 "Vienna-Lviv Imperial Post"
 desc_rip_hab_carpathian_post_road:0 "Relay stations across the Carpathian passes speed imperial dispatches and overland caravans between the Danube and Ruthenia."
 rip_tur_ruthenian_hurrem_waqf_title:0 "Endow the Ruthenian Palace Waqf"
 rip_tur_ruthenian_hurrem_waqf_desc:0 "Receive petitions from Ruthenian palace attendants and Hurrem's household regarding northern charitable endowments and correspondence."
 rip_tur_ruthenian_kamianets_eyalet_title:0 "Settle the Podillian Eyalet Defter"
 rip_tur_ruthenian_kamianets_eyalet_desc:0 "Audit urban taxes, converted churches, and garrison pay along the Dniester fortress belt around Kamianets."
 rip_tur_ruthenian_janissary_levies_title:0 "Audit the Northern Janissary Rolls"
 rip_tur_ruthenian_janissary_levies_desc:0 "Disputes have arisen between Janissary orta commanders and frontier auxiliaries stationed along the Dnieper and Black Sea steppe."
 rip_tur_ruthenian_salonika_grain_title:0 "Charter the Salonika-Podillian Grain Fleet"
 rip_tur_ruthenian_salonika_grain_desc:0 "Merchants in Salonika offer credit to link Ruthenian river grain, potash, and tallow shipments directly to Aegean markets."
 rip_tur_ruthenian_phanar_kyiv_synod_title:0 "Safeguard the Phanar-Kyiv Correspondence"
 rip_tur_ruthenian_phanar_kyiv_synod_desc:0 "Issue an imperial berat governing Orthodox envoys travelling between the Patriarchate in Constantinople and the Metropolis of Kyiv."
 rip_tur_ruthenian_frontier_crisis_title:0 "Pacify the Northern Eyalet Borderlands"
 rip_tur_ruthenian_frontier_crisis_desc:0 "When imperial authority falters at the Porte, frontier notables on the Dniester and Dnieper demand arrears and local autonomy."
 rip_tur_ruthenian.1.t:0 "Letters from the Ruthenian Chambers"
 rip_tur_ruthenian.1.d:0 "Ruthenian attendants in the imperial household, long guided by Hurrem's example, present petitions for bridges, wells, and safe-conducts for northern envoys. A formal waqf deed will win lasting goodwill in Podillia and Poland, though the ulema urge simple piety instead."
 rip_tur_ruthenian.1.a:0 "Seal an imperial waqf and grant northern safe-conducts."
 rip_tur_ruthenian.1.result_tt:0 "After 180 days the Porte gains 50 diplomatic power, 10 legitimacy, and the Ruthenian Palace Endowment modifier for 15 years."
 rip_tur_ruthenian.1.b:0 "Observe strict mosque charity and decline the court petitions."
 rip_tur_ruthenian.2.t:0 "The Palace Waqf Confirmed"
 rip_tur_ruthenian.2.d:0 "The kadi has entered the Ruthenian endowment into the imperial register. Northern ambassadors remark warmly upon the Porte's courtesy."
 rip_tur_ruthenian.2.a:0 "Dispatch the sealed copies."
 rip_tur_ruthenian.3.t:0 "The Kamianets Cadastral Survey"
 rip_tur_ruthenian.3.d:0 "Commissioners sent to Podillia report ruined stone bridges, empty burgher plots, and disputed salt tolls beneath Kamianets's cliffs. Registering households in a formal imperial defter will anchor treasury revenue and cut smuggling, or we can farm the taxes out immediately for coin."
 rip_tur_ruthenian.3.a:0 "Compile an imperial defter for the Podillian sanjak."
 rip_tur_ruthenian.3.result_tt:0 "After 180 days Kamianets (or a Ruthenian province if lost) gains 1 base tax, -15 local autonomy, and the Podillian Sanjak Defter modifier for 20 years (or 25 administrative power if none is owned)."
 rip_tur_ruthenian.3.b:0 "Auction the frontier tax-farms for quick silver."
 rip_tur_ruthenian.4.t:0 "The Podillian Defter Sealed"
 rip_tur_ruthenian.4.d:0 "The new defter lists every mill, ferry, and stone bastion overlooking the Smotrych gorge. Tax clerks and fortress commanders now work from the same roll."
 rip_tur_ruthenian.4.a:0 "Post the garrison on the ramparts."
 rip_tur_ruthenian.5.t:0 "Auxiliaries on the Dnieper Line"
 rip_tur_ruthenian.5.d:0 "Veteran Janissaries rotated to northern river forts clash with locally raised Ruthenian wagon-guards and Lipka scouts over rations and powder. Paying arrears and enforcing camp drill can turn these frontier companies into a disciplined shield against decadence."
 rip_tur_ruthenian.5.a:0 "Pay arrears and drill the combined frontier ortas."
 rip_tur_ruthenian.5.result_tt:0 "After 150 days gain 8 army tradition, -5 decadence if applicable, and 10 Janissary loyalty."
 rip_tur_ruthenian.5.b:0 "Leave internal muster distribution to the aghas."
 rip_tur_ruthenian.6.t:0 "Order Restored in the Steppe Forts"
 rip_tur_ruthenian.6.d:0 "With silver issued at parade and shared guard duty enforced, rival companies drill side by side above the Dnieper crossings."
 rip_tur_ruthenian.6.a:0 "Record the muster roll in the Divan."
 rip_tur_ruthenian.7.t:0 "Salonika Factors and Northern Grain"
 rip_tur_ruthenian.7.d:0 "Christian and Jewish grain brokers in Salonika propose advancing capital for barges hauling Ruthenian wheat, flax, and barrels down to Black Sea ports for transshipment into the Aegean."
 rip_tur_ruthenian.7.a:0 "Underwrite the Salonika grain consortium."
 rip_tur_ruthenian.7.result_tt:0 "After 210 days Salonika gains 1 base production if still owned (or 20 diplomatic power), plus Black Sea-Aegean Grain Factors for 15 years and 10 Dhimmi loyalty."
 rip_tur_ruthenian.7.b:0 "Collect ordinary port customs without guarantees."
 rip_tur_ruthenian.8.t:0 "Granaries Full at Salonika"
 rip_tur_ruthenian.8.d:0 "Northern grain convoys dock beneath the White Tower, easing bread prices across the Aegean and enriching the Salonika customs houses."
 rip_tur_ruthenian.8.a:0 "Expand the harbour warehouses."
 rip_tur_ruthenian.9.t:0 "Envoys Between the Phanar and Kyiv"
 rip_tur_ruthenian.9.d:0 "Greek bishops of the Phanar petition the Porte to allow Kyivan monks and scholars safe transit with printed liturgical books and charitable alms. Controlling this traffic through stamped imperial berats turns suspicion into leverage."
 rip_tur_ruthenian.9.a:0 "Issue stamped berats for regulated Phanar-Kyiv travel."
 rip_tur_ruthenian.9.result_tt:0 "After 180 days gain 10 prestige, 35 administrative power, and Constantinople-Kyiv Mediation for 15 years."
 rip_tur_ruthenian.9.b:0 "Restrict Orthodox movement to local dioceses."
 rip_tur_ruthenian.10.t:0 "The Phanar Chancery Roll"
 rip_tur_ruthenian.10.d:0 "With every letter registered at Constantinople before crossing the steppe, Greek and Ruthenian prelates praise the Porte's justice and northern envoys find warmer audience."
 rip_tur_ruthenian.10.a:0 "Keep the berats under Grand Vizieral seal."
 rip_tur_ruthenian.11.t:0 "Unrest on the Northern Eyalet March"
 rip_tur_ruthenian.11.d:0 "As succession intrigues and revolutionary pamphlets echo across the Empire, provincial notables between the Dniester and Dnieper threaten tax strikes and cross-border defections unless a loyal pasha arrives with silver and fresh recruits."
 rip_tur_ruthenian.11.a:0 "Dispatch emergency treasure and loyal border levies."
 rip_tur_ruthenian.11.result_tt:0 "After 150 days gain 1 stability (or administrative power if at max), 0.5 yearly manpower, and -5 decadence if applicable."
 rip_tur_ruthenian.11.b:0 "Declare a temporary frontier truce to rest the garrisons."
 rip_tur_ruthenian.12.t:0 "The Northern Frontier Holds"
 rip_tur_ruthenian.12.d:0 "Timely coin and firm command bring unruly beys and Ruthenian village elders back to obedience along the northern rivers."
 rip_tur_ruthenian.12.a:0 "Hold the river line for the Sultan."
 rip_cri_ruthenian_dnieper_pastures_title:0 "Settle the Dnieper Salt-Road Pastures"
 rip_cri_ruthenian_dnieper_pastures_desc:0 "Arbitrate between Crimean nomadic mirzas and Ruthenian chumak salt-carters over watering holes and ford tolls below Zaporozhia."
 rip_cri_ruthenian_succession_envoys_title:0 "Receive Ruthenian Envoys in Succession Councils"
 rip_cri_ruthenian_succession_envoys_desc:0 "Seek recognition, hostage-gifts, and truce oaths from neighbouring Ruthenian nobles when a Crimean succession is contested."
 rip_cri_ruthenian_ulus_tribute_title:0 "Establish the Ruthenian Yarlyk Chancery"
 rip_cri_ruthenian_ulus_tribute_desc:0 "Organize settled Ruthenian towns under the Great Horde or Crimean ulus into fixed tribute districts rather than seasonal raids."
 rip_cri_ruthenian.1.t:0 "Grazing Herds and Salt Wagons"
 rip_cri_ruthenian.1.d:0 "Clan begs accuse Ruthenian salt carters of trampling summer grass along the lower Dnieper, while carters threaten to bypass Crimean salt pans altogether. Sealing an oath-backed toll schedule will pacify the tribes and refill the Khan's purse."
 rip_cri_ruthenian.1.a:0 "Swear the Dnieper pasture truce and fix salt tolls."
 rip_cri_ruthenian.1.result_tt:0 "After 180 days gain 10 Nomadic Tribes loyalty, 65 ducats, and Lower Dnieper Salt Truce for 15 years."
 rip_cri_ruthenian.1.b:0 "Let the mirzas take pasture horses directly from caravans."
 rip_cri_ruthenian.2.t:0 "Tolls of the Salt Fords"
 rip_cri_ruthenian.2.d:0 "Long trains of ox-wagons cross under clan escort, paying brass coin and grey geldings at every crossing without bloodshed."
 rip_cri_ruthenian.2.a:0 "Deliver the clan shares to the kurultai."
 rip_cri_ruthenian.3.t:0 "Envoys at Bakhchisarai"
 rip_cri_ruthenian.3.d:0 "During a tense Crimean succession, Ruthenian envoys bring sable pelts and letters proposing mutual recognition of border Truce-Justices so neither side faces a knife at its back while rivals contend for the kurultai."
 rip_cri_ruthenian.3.a:0 "Receive the envoys with honour and exchange tamgas."
 rip_cri_ruthenian.3.result_tt:0 "After 150 days gain 15 horde unity (or 15 legitimacy), 10 prestige, and 40 diplomatic power."
 rip_cri_ruthenian.3.b:0 "Accept the gifts as mere tribute and dismiss them quickly."
 rip_cri_ruthenian.4.t:0 "A Northern Truce Confirmed"
 rip_cri_ruthenian.4.d:0 "With quiet borders along the Dnieper, wavering begs rally behind the Giray banner at Bakhchisarai."
 rip_cri_ruthenian.4.a:0 "Mount the horsetail standard."
 rip_cri_ruthenian.5.t:0 "Tribute Rolls of the Northern Ulus"
 rip_cri_ruthenian.5.d:0 "Ruthenian burghers and elders inside the Khan's conquered towns offer steady coin and grain in return for written yarlyks written in Chancery Slavonic beside Turkic script, sparing their workshops from sudden pillage."
 rip_cri_ruthenian.5.a:0 "Found a bilingual Ruthenian yarlyk chancery."
 rip_cri_ruthenian.5.result_tt:0 "After 210 days a Ruthenian province gains 1 base tax and 1 base production (or 25 administrative power), plus Ruthenian Yarlyk Chancery for 15 years."
 rip_cri_ruthenian.5.b:0 "Exact an immediate war levy from the towns instead."
 rip_cri_ruthenian.6.t:0 "Golden-Sealed Yarlyks in Circulation"
 rip_cri_ruthenian.6.d:0 "Markets in the northern ulus reopen quickly under the Khan's seal, turning scarred towns into dependable fiscal hubs."
 rip_cri_ruthenian.6.a:0 "Send scribes to audit the next quarter's chest."
 rip_pol_ruthenian_sejmik_compacts_title:0 "Negotiate the Ruthenian Sejmik Compacts"
 rip_pol_ruthenian_sejmik_compacts_desc:0 "Agree with Ruthenian palatinate envoys on written limits to Sejm disruptions and royal election pledges."
 rip_pol_ruthenian_baltic_moldavian_road_title:0 "Link Lviv's Moldavian and Baltic Staples"
 rip_pol_ruthenian_baltic_moldavian_road_desc:0 "Coordinate customs houses between Moldavia, Lviv, and Danzig so Black Sea spices and Volhynian grain move under royal staple charters."
 rip_pol_ruthenian_cossack_register_roll_title:0 "Seal the Dnieper Cossack Muster Roll"
 rip_pol_ruthenian_cossack_register_roll_desc:0 "Verify quarterly pay, cloth issues, and registered banners with frontier Cossack elders guarding the southern steppe."
 rip_pol_ruthenian.1.t:0 "Lauda of the Ruthenian Palatinates"
 rip_pol_ruthenian.1.d:0 "At Vyshnia and Lutsk, nobles of the Ruthenian palatinates draft provincial lauda demanding clear rules before the next general Sejm or royal election. Buying their goodwill with written chancery compacts can tame the veto and calm local courts."
 rip_pol_ruthenian.1.a:0 "Ratify the Ruthenian sejmik compacts under Crown seal."
 rip_pol_ruthenian.1.result_tt:0 "After 180 days gain 1 stability (or administrative power if at max), 10 legitimacy, and Ruthenian Sejmik Compact for 15 years."
 rip_pol_ruthenian.1.b:0 "Answer the envoys with royal letters of compliment."
 rip_pol_ruthenian.2.t:0 "Quiet Chambers at the Sejm"
 rip_pol_ruthenian.2.d:0 "Ruthenian deputies rise in unison to read the signed compacts, leaving would-be obstructionists isolated in the chamber."
 rip_pol_ruthenian.2.a:0 "Enter the lauda in the Crown Metrica."
 rip_pol_ruthenian.3.t:0 "The Lviv-Baltic Staple Charter"
 rip_pol_ruthenian.3.d:0 "Armenian, Ruthenian, and German burghers in Lviv petition the Crown to unite Moldavian cattle tolls and Vistula grain barges under one staple charter so Hanseatic buyers in Danzig can settle bills directly at Lviv fairs."
 rip_pol_ruthenian.3.a:0 "Invest in Lviv's bonded warehouses and river barges."
 rip_pol_ruthenian.3.result_tt:0 "After 210 days Lviv gains 1 base production and Lviv Staple Trade Corridor for 20 years (or 30 diplomatic power if lost), plus 2 mercantilism."
 rip_pol_ruthenian.3.b:0 "Sell temporary royal transit passes to foreign factors."
 rip_pol_ruthenian.4.t:0 "Caravans Fill Lviv Market Square"
 rip_pol_ruthenian.4.d:0 "Wagons from Suceava meet barges bound down the Bug and Vistula, turning Lviv into the hinge between Black Sea trade and Baltic counting-houses."
 rip_pol_ruthenian.4.a:0 "Confirm the merchant guilds' seal."
 rip_pol_ruthenian.5.t:0 "Delegates from the Dnieper Towns"
 rip_pol_ruthenian.5.d:0 "Cossack colonels bring tattered service rolls to the Crown Hetman, asking for prompt cloth issues and guaranteed pay in return for keeping permanent watches against steppe raiders."
 rip_pol_ruthenian.5.a:0 "Fund the registered Cossack quarterly roll."
 rip_pol_ruthenian.5.result_tt:0 "After 150 days gain 8 army tradition, 10 Cossack loyalty, and Frontier Cossack Muster Roll for 15 years."
 rip_pol_ruthenian.5.b:0 "Leave the banners to subsist on local winter quarters."
 rip_pol_ruthenian.6.t:0 "The Southern Banners Mustered"
 rip_pol_ruthenian.6.d:0 "Clean scarlet and blue coats, powder kegs, and sealed muster books reach Korsun and Cherkasy in time for the spring campaign."
 rip_pol_ruthenian.6.a:0 "Approve the Crown Hetman's inspection."
 rip_hab_ruthenian_galicia_cadastre_title:0 "Survey the Galician-Ruthenian Crownlands"
 rip_hab_ruthenian_galicia_cadastre_desc:0 "Send Habsburg land surveyors to measure estates, royal salt-works, and peasant dues across Galicia, Lodomeria, and Carpathian Rus."
 rip_hab_ruthenian_carpathian_compromise_title:0 "Guarantee Carpathian Rus' County Liberties"
 rip_hab_ruthenian_carpathian_compromise_desc:0 "Confirm Rusyn mountain villages and pass militias during dynastic constitutional settlements or unrest in the Hungarian crownlands."
 rip_hab_ruthenian_danube_carpathian_post_title:0 "Open the Vienna-Carpathian Imperial Post Road"
 rip_hab_ruthenian_danube_carpathian_post_desc:0 "Establish coached relay stations through Moravia and the Carpathian passes linking Vienna to Uzhhorod, Lviv, and eastern courts."
 rip_hab_ruthenian.1.t:0 "The Josephine Cadastre in Ruthenia"
 rip_hab_ruthenian.1.d:0 "Imperial commissioners in Lviv and Maramaros report tangled noble immunities, hidden salt-pans, and heavy corvee burdens on Ruthenian peasants. Commissioning a unified Habsburg cadastre will unlock steady tax yields and pare back magnate autonomy."
 rip_hab_ruthenian.1.a:0 "Commission the imperial cadastral survey."
 rip_hab_ruthenian.1.result_tt:0 "After 210 days Lviv (or Maramaros if owned, otherwise 25 administrative power) gains 1 base tax and -15 local autonomy, plus Galician-Lodomeria Cadastre for 15 years."
 rip_hab_ruthenian.1.b:0 "Leave local tax assessments with the existing diet."
 rip_hab_ruthenian.2.t:0 "Bound Ledgers Reach Vienna"
 rip_hab_ruthenian.2.d:0 "Every manor, salt-well, and Ruthenian village hearth now stands numbered in Vienna's Hofkammer books, curbing provincial embezzlement."
 rip_hab_ruthenian.2.a:0 "Deposit the survey with the Hofkammer."
 rip_hab_ruthenian.3.t:0 "Elders of the Carpathian Passes"
 rip_hab_ruthenian.3.d:0 "During disputes between Vienna and the Hungarian estates, Rusyn village mayors from the northeastern counties ask the monarch to confirm their mountain pastures, vernacular schools, and pass watches directly under imperial protection."
 rip_hab_ruthenian.3.a:0 "Confirm Carpathian village charters and pass guards."
 rip_hab_ruthenian.3.result_tt:0 "After 150 days gain 1 stability (or administrative power), 1 base manpower and -4 unrest in Maramaros (or 20 military power), and Carpathian County Safeguards for 15 years."
 rip_hab_ruthenian.3.b:0 "Refer the petitions back to the Hungarian chancellery."
 rip_hab_ruthenian.4.t:0 "Loyalty in the Mountain Valleys"
 rip_hab_ruthenian.4.d:0 "Confirmed in their mountain commons, Rusyn watchmen keep the Veretsky and Yablunytsia passes open for loyal couriers while the lowlands simmer."
 rip_hab_ruthenian.4.a:0 "Inspect the mountain muster."
 rip_hab_ruthenian.5.t:0 "Coaches Across the Beskids"
 rip_hab_ruthenian.5.d:0 "Postmasters from Olomouc and Kosice offer to pave relay yards across the Beskid passes and coordinate schedules with Lviv and Uzhhorod, binding Vienna's chancery to eastern merchants and envoys."
 rip_hab_ruthenian.5.a:0 "Grant imperial post patents for the Carpathian road."
 rip_hab_ruthenian.5.result_tt:0 "After 180 days gain 45 diplomatic power, 8 prestige, and Vienna-Lviv Imperial Post for 15 years."
 rip_hab_ruthenian.5.b:0 "Contract private couriers for single dispatches."
 rip_hab_ruthenian.6.t:0 "The First Post Horn in Lviv"
 rip_hab_ruthenian.6.d:0 "Fresh horses wait every two leagues from the Danube to the Dniester foothills, carrying sealed dispatches and bills of exchange in half the former days."
 rip_hab_ruthenian.6.a:0 "Post the timetable on the Hofburg gate."
