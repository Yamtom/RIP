l_spanish:

# The reworked faith mechanics carry their English text into this language
# until a translator takes them. Source of truth:
# localisation/rip_faith_mechanics_l_english.yml.

 # --- the five icons, bought with patriarch authority

 rip_ro_icon_michael_title:0 "Set Up the Icon of the Archangel"
 rip_ro_icon_michael_desc:0 "The Archangel is carried at the head of the column and set above the camp gate. Regiments that march behind it are said to hold their line longer, and the men who say so are the ones who marched. One icon stands at a time; raising this one puts the others away."
 rip_ro_icon_michael:0 "Icon of the Archangel Michael"

 rip_ro_icon_eleusa_title:0 "Set Up the Icon of Tenderness"
 rip_ro_icon_eleusa_desc:0 "The Mother of Tenderness is carried through the districts that have been hardest handled, and the priests read the same homily in each. It costs a procession and a season. It is cheaper than a garrison."
 rip_ro_icon_eleusa:0 "Icon of Tenderness"

 rip_ro_icon_pancreator_title:0 "Set Up the Icon of the Pantocrator"
 rip_ro_icon_pancreator_desc:0 "The Ruler of All goes above the door of every new works and every new wall, and the masons are blessed under it before they are paid. Building is cheaper when the church is standing behind the scaffolding."
 rip_ro_icon_pancreator:0 "Icon of the Pantocrator"

 rip_ro_icon_nicholas_title:0 "Set Up the Icon of Saint Nicholas"
 rip_ro_icon_nicholas_desc:0 "Nicholas is the saint every court from Novgorod to the Danube recognises, and envoys who travel under him are received as something other than strangers. He is also the saint of everyone we are about to annoy."
 rip_ro_icon_nicholas:0 "Icon of Saint Nicholas"

 rip_ro_icon_climacus_title:0 "Set Up the Icon of the Ladder"
 rip_ro_icon_climacus_desc:0 "The Ladder is hung in the schools and the scriptoria, where the argument is that learning is a climb and not a theft. New things travel faster in a country whose church has blessed the reading of them."
 rip_ro_icon_climacus:0 "Icon of the Ladder"

 # --- the zeal of the Sobor

 rip_ro_zeal_cost_tt:0 "The Sobor has at least §Y25§! zeal laid by. It gathers §Y5§! every two years, §Y2§! more while the patriarch is heeded, and §Y2§! more while the church is of one mind"

 rip_ro_zeal_upkeep_tt:0 "A standing focus is not free: §R3§! zeal goes every two years while it holds, and the focus goes out when the last of it is gone"
 rip_ro_sobor_sitting_tt:0 "The Sobor will not sit again for §Y10§! years. The patriarch's authority it draws on is the same the icons burn"
 rip_ro_zeal_band_spent:0 "The Sobor: the zeal is spent"
 rip_ro_zeal_band_spent_desc:0 "Under 10 laid by. Nothing can be bought and a standing focus is about to go out."
 rip_ro_zeal_band_gathering:0 "The Sobor: the zeal is gathering"
 rip_ro_zeal_band_gathering_desc:0 "Between 10 and 25 laid by. The parishes are preaching again, but not yet enough to turn to anything."
 rip_ro_zeal_band_ready:0 "The Sobor: a focus may be turned"
 rip_ro_zeal_band_ready_desc:0 "At least 25 laid by, which is the price of one focus - the War, the Fairs or the Land."
 rip_ro_zeal_band_laid_by:0 "The Sobor: the zeal is well laid by"
 rip_ro_zeal_band_laid_by_desc:0 "At least 50 laid by. A focus can be bought and held for a long while before the treasury runs dry."
 rip_ro_zeal_band_full:0 "The Sobor: the treasury of zeal is full"
 rip_ro_zeal_band_full_desc:0 "At least 80 laid by, against a ceiling of 100. What gathers beyond the ceiling is lost, so it is being wasted."
 rip_ro_zeal_of_war_title:0 "Turn the Zeal to the War"
 rip_ro_zeal_of_war_desc:0 "Let every parish preach the campaign, bless the standards and read the names of the fallen from the ambo. The regiments feel it. It is spent as fast as it is preached, and when the zeal runs out the preaching stops."
 rip_ro_zeal_war:0 "Zeal of the Sobor: the War"

 rip_ro_zeal_of_trade_title:0 "Turn the Zeal to the Fairs"
 rip_ro_zeal_of_trade_desc:0 "Let the church bless the fairs, keep the weights and hold the contracts, and let it be known that a man who cheats at the fair answers to a court that can also refuse him burial. Merchants pay for that kind of order."
 rip_ro_zeal_trade:0 "Zeal of the Sobor: the Fairs"

 rip_ro_zeal_of_the_land_title:0 "Turn the Zeal to the Land"
 rip_ro_zeal_of_the_land_desc:0 "Send the preachers to the districts rather than the armies, hear the grievances in the porch and settle what can be settled there. A quiet country is the slowest of the three purchases and the one that lasts."
 rip_ro_zeal_stability:0 "Zeal of the Sobor: the Land"

 # --- the sittings

 rip_ro_convene_the_sobor_title:0 "Convene the Sobor"
 rip_ro_convene_the_sobor_desc:0 "Call the bishops, the abbots and the boyars who will sit with them, and put one act before them. What a Sobor settles, it settles for good; what it fails to settle it will be asked again in ten years. The patriarch has already sent word about which act he expects."
 rip_ro_sobor_recently_sat:0 "The Sobor Has Lately Sat"

 rip_uc_hold_a_synod_title:0 "Hold a Synod"
 rip_uc_hold_a_synod_desc:0 "Call the eparchs of the Union to one table and settle one article of it. Rome will read the acts, and so will the brotherhoods; both will find something in them to object to, which is how it is known the synod did its work."
 rip_uc_synod_recently_sat:0 "The Synod Has Lately Sat"

 # --- petitions to the curia

 rip_uc_petition_church_tax_title:0 "Petition for the Church Tax"
 rip_uc_petition_church_tax_desc:0 "Ask the curia to sanction a levy on the eparchies, as it does for kings in communion with it. We may petition; we may not vote on the petition, and no one of ours sits in the room when it is read."
 rip_uc_petition_blessing_title:0 "Seek the Blessing of the Curia"
 rip_uc_petition_blessing_desc:0 "Ask for the blessing that Catholic princes ask for before a campaign. It arrives by letter, is read at the muster, and is worth precisely as much as the men believe it is - which has never been nothing."
 rip_uc_petition_indulgence_title:0 "Petition for an Indulgence"
 rip_uc_petition_indulgence_desc:0 "Ask the curia to grant the indulgence for our own churches and let the chest stand in our own cathedrals. The Uniate parishes will notice that the terms are the same as the Latin ones. Some of them will find that reassuring."
 rip_uc_petition_usury_title:0 "Petition on the Question of Usury"
 rip_uc_petition_usury_desc:0 "Ask Rome to hold that the loans our treasury has taken are not the sin the canonists say they are. The argument has been made before, by wealthier petitioners, and it succeeded for them."
 rip_uc_petition_legate_title:0 "Petition for a Legate"
 rip_uc_petition_legate_desc:0 "Ask that a legate be sent to reside with us. He will carry Rome's ear and Rome's eye in equal measure, and both are useful; which of the two is more useful depends on what we intend to do next."
 rip_uc_petition_holy_war_title:0 "Petition for the Sanction of the War"
 rip_uc_petition_holy_war_desc:0 "Ask the curia to name this war what we say it is. The sanction will not send a single soldier. It will change what the Catholic courts are able to say about us while we fight it."
 rip_uc_petition_cooldown:0 "A Petition Is With the Curia"

 # --- the piety axis, as Church privileges

 rip_privilege_josephite_discipline:0 "Josephite Discipline"
 rip_privilege_josephite_discipline_desc:0 "The church holds land, keeps schools, serves the ruler and answers heresy with the court rather than the sermon. Abbot Iosif's party won this argument and spent the next century administering what it had won. Wealth in the church is only a scandal to those who do not have to fund a chancery."
 rip_privilege_nonpossessor_rule:0 "Non-Possessor Rule"
 rip_privilege_nonpossessor_rule_desc:0 "The church owns nothing it cannot carry, keeps no villages, and preaches to the heretic rather than sentencing him. It costs the treasury the tithe of the monastery lands and gives back something the treasury cannot price. The elders who argued for it lost, and were remembered anyway."

 # --- the standing acts

 rip_ro_patriarchal_office:0 "The Patriarchal Office"

 rip_faith.1.t:0 "The Sobor Sits"
 rip_faith.1.d:0 "The bishops are in the hall, the abbots behind them, and the boyars along the wall making it clear they are present rather than participating. One act will be settled today and read in every cathedral by the spring. The clerks have laid out six drafts and nobody has yet agreed which one is on the table."
 rip_faith.1.a:0 "Moscow is the Third Rome"
 rip_faith.1.b:0 "Raise the patriarchal office"
 rip_faith.1.c:0 "Set the inquisition to work"
 rip_faith.1.e:0 "One tongue in every parish"
 rip_faith.1.f:0 "The church serves the realm"
 rip_faith.1.g:0 "Bring the heretics under"
 rip_faith.1.h:0 "Settle nothing this year"

 rip_faith.2.t:0 "The Synod Sits"
 rip_faith.2.d:0 "The eparchs of the Union have come, some of them from sees where their own flocks would not receive them last year. One article will be settled and sent to Rome, to Vilnius and to the brotherhoods, in that order. The Greek text and the Latin text of the acts will not be identical, and everyone at the table knows it."
 rip_faith.2.a:0 "Keep the eastern rite whole"
 rip_faith.2.b:0 "Acknowledge the supremacy"
 rip_faith.2.c:0 "Endow the Basilian houses"
 rip_faith.2.e:0 "Build the schools"
 rip_faith.2.f:0 "Stand as defender of the Union"
 rip_faith.2.g:0 "Confirm the order's rule"
 rip_faith.2.h:0 "Ask Rome for protection"
 rip_faith.2.i:0 "Send out the missioners"
 rip_faith.2.j:0 "Settle nothing this year"

 rip_faith.3.t:0 "The Zeal Is Spent"
 rip_faith.3.d:0 "The preaching has outrun what the church laid by for it. The parishes have gone back to the ordinary round, the standards are blessed by whoever is nearest, and the Sobor will have to fill its chest again before it can be asked for anything. Nobody is scandalised; it has happened before."
 rip_faith.3.a:0 "Let the chest fill again"

 # --- the Uniate icons
 #
 # The engine picks the picture by the entry's position in the orthodox_icons
 # block, not by its name, so these five carry vanilla's five paintings under
 # our own keys. Vanilla's own icon_michael and the rest are left alone: five
 # vanilla mission files test current_icon against them.

 rip_gc_icon_michael:0 "Icon of the Archangel Michael"
 desc_rip_gc_icon_michael:1 "Michael is the patron of Kyiv, and the Union changed nothing about that. The same Archistrategos stands over the same gate, blessed now by a metropolitan in communion with Rome, and carried at the head of a procession exactly as the fathers of the Basilians carried him."
 rip_gc_icon_eleusa:0 "Icon of Tenderness"
 desc_rip_gc_icon_eleusa:1 "The Mother of Tenderness with the child against her cheek, eastern in every line of it, painted in the same workshops after the Union as before. Rome asked for the creed. It did not ask for the brushwork."
 rip_gc_icon_pancreator:0 "Icon of Christ Pantocrator"
 desc_rip_gc_icon_pancreator:1 "The All-Ruler overhead in the central dome, mild and stern at once. The Latin churches set him on a wall; ours keeps him where the eastern rite has always kept him, and the synod has confirmed that this is not a matter needing correction."
 rip_gc_icon_nicholas:0 "Icon of Saint Nicholas"
 desc_rip_gc_icon_nicholas:1 "The wonderworker is recognised in every court and every market between Lviv and the Danube, by Latins and Greeks alike. A church in communion with both can put him forward and be understood by both without explaining itself."
 rip_gc_icon_climacus:0 "Icon of the Ladder"
 desc_rip_gc_icon_climacus:1 "John of the Ladder taught the ascent by degrees, and the Basilian schools teach it still. Their pupils learn Latin from a Jesuit grammar and pray the eastern hours; the Ladder is the image they chose for themselves."

 # --- Rome as a trophy rather than a holy site

 rip_ro_the_first_rome_title:0 "Take the First Rome"
 rip_ro_the_first_rome_desc:0 "The city the doctrine says fell is in our hands and keeps our rite. The argument was never that Rome should be destroyed - only that it had forfeited the succession, and that the succession had moved north. Holding it settles the argument in a way no council could."
 rip_ro_the_first_rome:0 "The First Rome Held"

 # --- how the two faiths travel

 rip_ro_merchant_preaching:0 "The Merchants' Preaching"
 rip_ro_merchant_parish:0 "A Parish That Hears Moscow"
 rip_uc_union_preaching:0 "The Union Is Preached Here"
 rip_uc_see_of_the_union:0 "The See of the Union"

 rip_uc_raise_the_see_title:0 "Raise the See of the Union"
 rip_uc_raise_the_see_desc:0 "Seat the Union in one city and let it work outward from there, parish by parish, on both sides of the rite: eastern parishes whose lord is Latin, Latin parishes whose lord is not. Where lord and parish already agree, it will be listened to politely and change nothing. There will be one such see; a church that plants two of them is arguing with itself."
