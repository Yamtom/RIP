 uz_carpathian_commonwealth:0 "Carpathian Commonwealth"
 uz_carpathian_commonwealth_desc:0 "Crown the autonomous Carpathian course by sustaining an estate commonwealth through accepted cultures and subjects, or through six federalized Carpathian provinces equipped with courthouses and komitat charters."
 uz_carpathian_commonwealth_title:0 "Carpathian Commonwealth"
 uz_carpathian_federation:0 "Carpathian Federation"
 uz_carpathian_federation_desc:0 "Seat the mountain communes and magnates in a federal council modeled on composite estate diets: unite six federalized Carpathian provinces across multiple accepted cultures, or five federalized provinces supported by four Carpathian courthouses."
 uz_carpathian_federation_diprep:0 "Federation Envoys"
 uz_carpathian_federation_summary:0 "Our federal system promotes harmony between different peoples while strengthening administrative efficiency."
