l_german:

# The Troubles chain and the three dates of the Muscovite church carry their
# English text into this language until a translator takes them.

 # --- the Muscovite Troubles, from the Ruthenian side

 troubles.1.t:0 "The Claimant at Sambir"
 troubles.1.d:0 "A young man in a magnate's house at Sambir says he is the son of the old tsar, and the household is behaving as though it believes him. What he actually needs is four thousand horse, and the men who could furnish them are discussing terms in the next room. Nobody has asked what becomes of the border if he wins, and nobody is going to."
 troubles.1.a:0 "Let them outfit him"
 troubles.1.b:0 "Forbid the venture"
 troubles.1.c:0 "Take a share of it"

 troubles.2.t:0 "The Register Marches East"
 troubles.2.d:0 "The eastern campaigns pay in silver and pay on time, which is more than the treasury manages. Colonels three years in arrears are being approached one at a time, and they are listening. What comes back will be richer, harder, and used to being paid by somebody else."
 troubles.2.a:0 "Send the register east"
 troubles.2.b:0 "Keep them on the frontier"

 troubles.3.t:0 "Before the Walls of Moscow"
 troubles.3.d:0 "The hetman has brought the Host to the walls of the capital, having taken every town on the road, and the boyars inside are counting powder rather than men. He can storm it or he can name a price. He has already said, to anyone who would listen, that he did not march this far to be thanked."
 troubles.3.a:0 "Storm the walls"
 troubles.3.b:0 "Name the price"

 troubles.4.t:0 "The Truce at Deulino"
 troubles.4.d:0 "The truce is drafted, and the article that matters hands Chernihiv, Novhorod-Siverskyi and Starodub to the Crown for fourteen years and a half - which everyone at the table reads as permanently. None of those towns was asked. The commissioners have written down that the inhabitants consent."
 troubles.4.a:0 "Take Siveria"
 troubles.4.b:0 "Take the ransom instead"

 troubles.5.t:0 "What the Host Is Worth"
 troubles.5.d:0 "The register came home from Moscow knowing three things it had not known before: that it can take a capital, that crowns will bid for it, and roughly how high the bidding goes. The starshyna have begun writing this down. Warsaw has not begun reading it."
 troubles.5.a:0 "Confirm their privileges"
 troubles.5.b:0 "Pay them off and forget it"

 troubles.6.t:0 "Siveria, Written Away"
 troubles.6.d:0 "The truce is signed and the Siverian towns belong to the Crown on paper, for fourteen years and a half. The starostas are the same men, the tax is the same tax, and the garrison rides in from a different direction. What changed is which chancery answers a petition, and how long the answer now takes."
 troubles.6.a:0 "Arm the districts"
 troubles.6.b:0 "Read the new terms"

 # --- modifiers

 rip_tot_pretender_venture:0 "A Claimant of Our Own"
 rip_tot_eastern_campaign:0 "The Eastern Campaigns"
 rip_tot_deulino_terms:0 "The Terms of Deulino"
 rip_tot_the_register_remembers:0 "The Register Remembers"
 rip_tot_backed_the_pretender:0 "Outfitted a Pretender Against Us"

 # --- the three dates of the Muscovite church

 rip_ro_autocephaly:0 "The Church That Elected Its Own"

 russian_orthodox.18.t:0 "The Metropolitanate Divides"
 russian_orthodox.18.d:0 "Word has come from Moscow that a metropolitan of all Rus has been elected there without asking Constantinople, and that he has been enthroned regardless. Our bishops were not at that election and would not have voted for that candidate. From this year there are two metropolitans of all Rus, and only one of them is in Kyiv - which is the one thing both sides agree the title cannot mean."
 russian_orthodox.18.a:0 "Ours keeps the see"
 russian_orthodox.18.b:0 "Ask who confirms ours"
