 wr_west_ruthenian_distinctiveness:0 "Registros cancillerescos y parroquiales propios"
 desc_wr_west_ruthenian_distinctiveness:0 "Tribunales locales, ciudades de Magdeburgo y escritorios guardan actas, testamentos y homilías vernáculas al margen de los prikazy moscovitas."
 wr_chancery_prosta_mova_tradition:0 "Cancillería vernácula aforada"
 desc_wr_chancery_prosta_mova_tradition:0 "Siguiendo la prosta mova gran ducal, el giro vernáculo de Peresopnytsia y los evangelios didácticos carpáticos, los escribanos protegen su propio registro jurídico y literario."
 wr_west_ruthenian_commonwealth:0 "Esfera cultural rutena separada"
 desc_wr_west_ruthenian_commonwealth:0 "Imprentas, estatutos legales y academias de cofradías anclan a bielorrusos (bielaruski), rutenos (ruskyi) y rusnaks (rusnacky) en un grupo ruteno propio fuera de Moscú."
 wr_west_ruthenian_statute_autonomy:0 "Autonomía estatutaria y estauropégica"
 desc_wr_west_ruthenian_statute_autonomy:0 "Inspirados por los Estatutos gran ducales, las garantías provinciales de 1569 para la escritura rutena en Volhynia, Kyiv y Bratslav, y el ius Valachicum carpático, los estamentos defienden su ámbito legal."
 wr_west_slavic_cultural_affinity:0 "Órbita cívica eslava occidental compartida"
 desc_wr_west_slavic_cultural_affinity:0 "Cabildos bilingües, congregaciones universitarias de Kraków y Praga y cartas urbanas acercan los estamentos urbanos a vecinos polacos, checos y eslovacos."
 wr_west_slavic_shared_script_space:0 "Circuito bilingüe de imprenta y derecho"
 desc_wr_west_slavic_shared_script_space:0 "Libreros, seminarios y dietas nobiliarias difunden glosas latinas, escritos en lacinka y prensas de Kraków y Trnava entre parroquias."
 wr_west_slavic_synthesis:0 "Síntesis cívica eslava occidental"
 desc_wr_west_slavic_synthesis:0 "A semejanza de Lusacia, Silesia y Eslovaquia oriental, concejos bilingües y cancillerías consuman un raro paso hacia la familia eslava occidental."
 wr_traditionalist_backlash:0 "Protesta monástica y boyarda"
 desc_wr_traditionalist_backlash:0 "Cofradías ortodoxas, ancianos de ermitas y magnates conservadores disputan reformas cancillerescas que aflojan el eslavo eclesiástico."
 wr_collective_concord:0 "Concordia de los tres círculos"
 desc_wr_collective_concord:0 "Cartas coordinadas entre coronas con cultura primaria, cortes que la aceptan y gobernadores fronterizos aseguran el respaldo diplomático del congreso."
 wr_cultural_ferment:0 "Fermento provincial sin resolver"
 desc_wr_cultural_ferment:0 "Las cortes vecinas ratificaron nuevas cartas mientras las autoridades locales se negaban, dividiendo a mercaderes y estamentos."
 opinion_wr_west_slavic_kinship:0 "Afinidad cívica eslava occidental"
 opinion_wr_west_ruthenian_separation:0 "Separación de pretensiones moscovitas"
 opinion_wr_collective_accord:0 "Acuerdo del congreso cultural"
 opinion_wr_collective_discord:0 "Discordia del congreso cultural"
 wr_tt_byelorussian_s2_index:0 "De todas las provincias de cultura §Ybielaruski§!, al menos el §Y60%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_byelorussian_s1_pct.GetValue]%§! (§Y[Root.wr_byelorussian_s1_cnt.GetValue]§! de §Y[Root.wr_byelorussian_total.GetValue]§! provincias)."
 wr_tt_ruthenian_s2_index:0 "De todas las provincias de cultura §Yruskyi§!, al menos el §Y60%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_ruthenian_s1_pct.GetValue]%§! (§Y[Root.wr_ruthenian_s1_cnt.GetValue]§! de §Y[Root.wr_ruthenian_total.GetValue]§! provincias)."
 wr_tt_rusyn_s2_index:0 "De todas las provincias de cultura §Yrusnacky§!, al menos el §Y60%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_rusyn_s1_pct.GetValue]%§! (§Y[Root.wr_rusyn_s1_cnt.GetValue]§! de §Y[Root.wr_rusyn_total.GetValue]§! provincias)."
 wr_tt_byelorussian_s4_index:0 "De todas las provincias de cultura §Ybjalowruszsky§!, al menos el §Y85%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_byelorussian_s3_pct.GetValue]%§! (§Y[Root.wr_byelorussian_s3_cnt.GetValue]§! de §Y[Root.wr_byelorussian_total.GetValue]§! provincias)."
 wr_tt_ruthenian_s4_index:0 "De todas las provincias de cultura §Yruszynjsky§!, al menos el §Y85%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_ruthenian_s3_pct.GetValue]%§! (§Y[Root.wr_ruthenian_s3_cnt.GetValue]§! de §Y[Root.wr_ruthenian_total.GetValue]§! provincias)."
 wr_tt_rusyn_s4_index:0 "De todas las provincias de cultura §Yrusznjoczky§!, al menos el §Y85%§! debe haber adoptado la carta. Apoyo actual: §Y[Root.wr_rusyn_s3_pct.GetValue]%§! (§Y[Root.wr_rusyn_s3_cnt.GetValue]§! de §Y[Root.wr_rusyn_total.GetValue]§! provincias)."
 wr_charter_distinctiveness_decision_title:0 "Reconocer las lenguas de cancillería"
 wr_charter_distinctiveness_decision_desc:0 "Que los notarios redacten sus escrituras en las lenguas de las tierras bielorrusas, rutenas y rusinas. Los tres círculos oirán la petición. La probabilidad de aprobación es del 50 % como máximo. Esta carta excluye el pacto de las ciudades occidentales."
 wr_rally_branch_a_congress_decision_title:0 "Enviar emisarios con la carta de cancillería"
 wr_rally_branch_a_congress_decision_desc:0 "Enviemos escribanos y clérigos a las cortes que aún no han sellado la carta. Los soberanos amigos estarán más dispuestos a que se sumen sus provincias. Para cada pueblo hace falta el sello de al menos el 60 % de sus provincias en el mundo."
 wr_codify_west_ruthenian_group_decision_title:0 "Presentar los estatutos rutenos a la dieta"
 wr_codify_west_ruthenian_group_decision_desc:0 "Tras 15 años de vigencia de la carta, la imprenta y el respaldo de los tres círculos nos permiten acudir a la dieta. Los estatutos reconocen un grupo cultural ruteno propio a cada pueblo cuya carta rija en al menos el 60 % de sus provincias en el mundo. La probabilidad de aprobación es del 30 % como máximo."
 wr_proclaim_west_slavic_affinity_decision_title:0 "Ofrecer un pacto a las ciudades occidentales"
 wr_proclaim_west_slavic_affinity_decision_desc:0 "Nuestras ciudades comparten el derecho de Magdeburgo con sus vecinas occidentales. Que sus escuelas y gremios intercambien libros y cartas con Cracovia, Praga y Trnava. Este pacto excluye la carta de cancillería. La probabilidad de aprobación es inferior al 20 %."
 wr_rally_branch_b_congress_decision_title:0 "Invitar a los gremios al pacto occidental"
 wr_rally_branch_b_congress_decision_desc:0 "Enviemos magistrados y eruditos a las cortes cuyas villas aún vacilan. Nuestros aliados, súbditos y los soberanos que nos estiman serán más propensos a firmar. Para cada pueblo, el pacto debe reunir al menos el 85 % de sus provincias en el mundo."
 wr_attempt_west_slavic_transition_decision_title:0 "Ratificar la carta occidental"
 wr_attempt_west_slavic_transition_decision_desc:0 "Tras 30 años de pacto, el comercio mundial y el respaldo de los tres círculos permiten solicitar la carta definitiva. Un pueblo puede entrar en el grupo cultural eslavo occidental si se ha adherido al pacto al menos el 85 % de sus provincias en el mundo. La probabilidad de aprobación es inferior al 5 %."
 wr_cultural_maneuver.1.t:0 "Cartas vernáculas y registro propio"
 wr_cultural_maneuver.1.d:0 "De Vilnius y Polatsk a Mukachevo y Khust pasando por Kyiv, Lviv y Ostroh, los escribanos redactan actas y sermones en lenguas vivas ajenas a los prikazy de Moscú. Reunimos los tres círculos para consagrar estos registros sin confundir nuestros tres pueblos."
 wr_cultural_maneuver.1.d_belarus:0 "En Polatsk, Minsk, Navahroudak y Vilnius, la cancillería gran ducal emplea el bielorruso hablado - la prosta mova de testamentos y primeras traducciones de Praga y Vilnius -, distinto de Moscú y del sur. Pedimos reconocimiento para bielaruski."
 wr_cultural_maneuver.1.d_ruthenia:0 "En Kyiv, Volodymyr-Volynskyi, Lviv, Halych y Kamianets, los libros judiciales siguen el habla rutena local, distinta de prikazy moscovitas, cancillería bielorrusa y valles carpáticos. Ruskyi reclama reconocimiento formal."
 wr_cultural_maneuver.1.d_rusyn:0 "En los comitados de Ung, Bereg, Ugocsa, Maramaros, Saris y Zemplen, los rusnaks carpáticos mantienen cartas de sholtys y knyaz según el ius Valachicum, salinas de Solotvyno y homilías de Mukachevo. Rusnacky pide su carta propia."
 wr_cultural_maneuver.1.a:0 "Que nos escuchen los tres círculos (hasta un 50 % de probabilidad de aprobación)."
 wr_cultural_maneuver.1.b:0 "Promulgar patente real pese a la oposición."
 wr_cultural_maneuver.1.c:0 "Aplazar la carta y conservar los escribanos actuales."
 wr_cultural_maneuver.2.t:0 "Distinción vernácula asentada en registro"
 wr_cultural_maneuver.2.d:0 "La comisión confirmó los privilegios locales y cancillerescos. Nuestros enviados llevan la carta a soberanos de la misma cultura primaria, cortes que la aceptan y poseedores de provincias fronterizas."
 wr_cultural_maneuver.2.d_belarus:0 "Notarios de Vilnius, Minsk y Polatsk inscribieron el registro bielaruski, asegurando la prosta mova gran ducal al margen de Moscú. Los legados parten hacia los tres círculos."
 wr_cultural_maneuver.2.d_ruthenia:0 "Escribanos de Kyiv, Volhynia y Lviv certificaron el registro ruskyi en libros judiciales y cofradías lejos del uso moscovita. Parten enviados hacia cortes hermanas."
 wr_cultural_maneuver.2.d_rusyn:0 "Escribanos condales y decanos de Mukachevo confirmaron homilías rusnacky y cartas de sholtys carpáticas. Los legados salen a sumar cortes vecinas."
 wr_cultural_maneuver.2.a:0 "Enviar la carta por los tres círculos."
 wr_cultural_maneuver.3.t:0 "Los conservadores bloquean la carta vernácula"
 wr_cultural_maneuver.3.d:0 "Ancianos monásticos y boyardos conservadores se negaron a apartar la cancillería del eslavo eclesiástico antiguo. La comisión se disolvió sin pacto."
 wr_cultural_maneuver.3.d_belarus:0 "Monasterios de Polatsk y Turau defendieron el eslavo litúrgico frente a las reformas bielaruski de Vilnius."
 wr_cultural_maneuver.3.d_ruthenia:0 "Ancianos de Kyiv, Volhynia y Halych opusieron los viejos libros eslavos a las glosas judiciales ruskyi, frenando la comisión."
 wr_cultural_maneuver.3.d_rusyn:0 "Tradicionalistas del Maramaros y clérigos de Mukachevo rechazaron alterar los códices eslavos carpáticos."
 wr_cultural_maneuver.3.a:0 "Dejar intactos los registros heredados."
 wr_cultural_maneuver.10.t:0 "Codificación de un grupo ruteno separado"
 wr_cultural_maneuver.10.d:0 "La carta de cancillería ha salido de las imprentas y ya está en manos de jueces y párrocos. Los juristas llevan a la dieta un libro común de estatutos que reconoce a cada uno de los tres pueblos."
 wr_cultural_maneuver.10.d_belarus:0 "Apoyados en los Estatutos lituanos (1529, 1566, 1588), la prensa de Francysk Skaryna en Vilnius (1522), el catecismo de Nesvizh (1562) y la orden de Leu Sapieha de redactar «con letras y palabras rutenas», los bielorrusos reclaman bielaruski en el grupo separado."
 wr_cultural_maneuver.10.d_ruthenia:0 "Sostenidos por la Academia de Ostroh (1576) y su Biblia (1581), la estauropégia de Lviv (1586), el Evangelio de Peresopnytsia y la garantía de 1569 en Kyiv, Volhynia y Bratslav, los rutenos reclaman ruskyi fuera de Moscú."
 wr_cultural_maneuver.10.d_rusyn:0 "Respaldados por evangelios didácticos en habla viva, escuelas episcopales de Mukachevo, estatutos de Bereg y Ugocsa y fueros de Khust a Presov, los rusnaks carpáticos piden el estatuto separado rusnacky."
 wr_cultural_maneuver.10.a:0 "Presentemos los estatutos a la dieta (hasta un 30 % de probabilidad de aprobación)."
 wr_cultural_maneuver.10.b:0 "Proclamar el códice por costoso decreto soberano."
 wr_cultural_maneuver.10.c:0 "Mantener la clasificación eslava oriental actual."
 wr_cultural_maneuver.11.t:0 "El grupo ruteno separado queda codificado"
 wr_cultural_maneuver.11.d:0 "La dieta ha sellado los estatutos. Todo pueblo cuya carta rija en al menos el 60 % de sus provincias figurará en los registros rutenos bajo su propio nombre: bielaruski, ruskyi o rusnacky."
 wr_cultural_maneuver.11.d_belarus:0 "Con Vilnius, Polatsk, Minsk y Navahroudak alineados tras el mandato de 1588, bielaruski abandona el bloque moscovita para entrar al grupo ruteno separado."
 wr_cultural_maneuver.11.d_ruthenia:0 "Ratificado desde Ostroh y Lviv hasta Kyiv y Chernihiv, ruskyi entra en el grupo ruteno separado honrando las garantías de 1569 y sus prensas."
 wr_cultural_maneuver.11.d_rusyn:0 "Ratificado en Mukachevo y las asambleas de Ung-Bereg-Maramaros, rusnacky entra en el grupo ruteno separado como pueblo montañés propio."
 wr_cultural_maneuver.11.a:0 "Difundir el códice ratificado a los tres círculos."
 wr_cultural_maneuver.12.t:0 "La dieta rechaza la separación de grupo"
 wr_cultural_maneuver.12.d:0 "Los señores con tierras a ambos lados de la frontera se han unido al clero. Ninguno quiso dividir las antiguas jurisdicciones. La dieta ha devuelto el proyecto sin su sello."
 wr_cultural_maneuver.12.d_belarus:0 "Magnates con tierras de Polatsk a Chernihiv advirtieron contra una escisión eclesial, frustrando el códice bielaruski."
 wr_cultural_maneuver.12.d_ruthenia:0 "Prelados y señores de Volhynia y Podillia temieron quebrar los viejos lazos de Kyiv y Chernihiv, bloqueando ruskyi."
 wr_cultural_maneuver.12.d_rusyn:0 "Temiendo aislarse de los monasterios de Halych y Lviv tras los pasos carpáticos, los diputados rechazaron el códice rusnacky."
 wr_cultural_maneuver.12.a:0 "Buscar mayor consenso entre cortes vecinas."
 wr_cultural_maneuver.15.t:0 "El soberano codifica el grupo ruteno separado"
 wr_cultural_maneuver.15.d:0 "Nuestro señor ha sellado los estatutos rutenos. Allí donde suficientes provincias hayan adoptado la carta, nuestra cancillería podrá inscribir a sus gentes en las mismas condiciones."
 wr_cultural_maneuver.15.d_belarus:0 "Nuestro soberano ha codificado bielaruski dentro de un grupo ruteno propio según los Estatutos gran ducales e invita a nuestra corte a alinearse."
 wr_cultural_maneuver.15.d_ruthenia:0 "Nuestro soberano ha codificado ruskyi en el grupo ruteno separado conforme a las cartas de Kyiv y Lviv e invita a nuestra cancillería."
 wr_cultural_maneuver.15.d_rusyn:0 "Nuestro soberano inscribió a los rusnaks carpáticos como rusnacky en el grupo ruteno separado e invita a nuestros comitados a adoptarlo."
 wr_cultural_maneuver.15.a:0 "Adoptar el códice ruteno del soberano."
 wr_cultural_maneuver.15.b:0 "Conservar los registros actuales."
 wr_cultural_maneuver.20.t:0 "Atracción de la órbita urbana eslava occidental"
 wr_cultural_maneuver.20.d:0 "Los estudiantes vuelven de Cracovia, Praga y Trnava con libros que los gremios desean imprimir. ¿Podría una escritura otorgada en una villa tener validez ante el concejo de otra? Los magistrados han redactado un pacto y aguardan nuestro sello."
 wr_cultural_maneuver.20.d_belarus:0 "Apartados de la ruta oriental, burgueses y nobles de Grodno, Brest y Navahroudak estudian en Kraków y Praga, escriben pleitos en lacinka bielorrusa y comparten concejos de Magdeburgo."
 wr_cultural_maneuver.20.d_ruthenia:0 "Apartados de los tradicionalistas de Kyiv, hidalgos de Lviv, Przemysl, Volhynia y Kamianets acuden a Kraków y Zamosc, llevan registros bilingües y acercan sus gremios a Pequeña Polonia."
 wr_cultural_maneuver.20.d_rusyn:0 "Fuera de los circuitos rutenos del norte, los rusnaks de Saris, Spis, Zemplen y Ung conviven en mercados e imprentas de Trnava y Kraków con eslovacos y polacos."
 wr_cultural_maneuver.20.a:0 "Ofrezcamos el pacto a las villas (menos del 20 % de probabilidad de aprobación)."
 wr_cultural_maneuver.20.b:0 "Imponer la alineación por costoso decreto."
 wr_cultural_maneuver.20.c:0 "Guardar la costumbre parroquial local."
 wr_cultural_maneuver.21.t:0 "Afinidad cívica eslava occidental proclamada"
 wr_cultural_maneuver.21.d:0 "Delegados de Kraków, Praga y las villas mineras eslovacas acogen a nuestros magistrados en un circuito cívico bilingüe. Parten legados hacia los tres círculos."
 wr_cultural_maneuver.21.d_belarus:0 "Antiguos alumnos de Kraków y Praga ratifican cartas urbanas comunes en Brest, Grodno y Vilnius para las villas bielaruski."
 wr_cultural_maneuver.21.d_ruthenia:0 "Gremios y juristas de Lviv, Halych, Volhynia y Bratslav firman pactos municipales bilingües junto al derecho de Kraków y Sandomierz."
 wr_cultural_maneuver.21.d_rusyn:0 "En Presov, Bardejov y Uzhhorod, regidores latinos y decanatos orientales suscriben un pacto cívico con villas eslovacas, polacas y bohemias."
 wr_cultural_maneuver.21.a:0 "Proclamar el pacto de afinidad a los tres círculos."
 wr_cultural_maneuver.22.t:0 "Fracaso del pacto de afinidad urbana"
 wr_cultural_maneuver.22.d:0 "Clero parroquial, ancianos rurales y nobles recelosos rechazaron la grafía latina foránea y los modelos municipales occidentales."
 wr_cultural_maneuver.22.d_belarus:0 "Magnates de Polatsk y Vitebsk junto a cofradías ortodoxas rechazaron privilegios bilingües inspirados en Kraków."
 wr_cultural_maneuver.22.d_ruthenia:0 "Cofradías de Lviv y cosacos del Dnieper condenaron la injerencia jurídica latino-polaca en las parroquias."
 wr_cultural_maneuver.22.d_rusyn:0 "Sacerdotes carpáticos y ancianos de Maramaros bloquearon la enseñanza llegada de Trnava y Spis."
 wr_cultural_maneuver.22.a:0 "Conservar los fueros urbanos tradicionales."
 wr_cultural_maneuver.30.t:0 "El umbral eslavo occidental"
 wr_cultural_maneuver.30.d:0 "Hace treinta años que los mercaderes negocian bajo las mismas cartas y los escolares aprenden de los mismos libros. Las villas piden ahora a la cancillería que reconozca su lugar entre los eslavos occidentales. El sello sigue en nuestras manos."
 wr_cultural_maneuver.30.d_belarus:0 "Treinta años de edición en lacinka y cirílico e integración gremial de Vilnius a Brest hacen posible bjalowruszsky: no una asimilación polaca, sino una lengua cívica eslava occidental propia."
 wr_cultural_maneuver.30.d_ruthenia:0 "Treinta años de humanismo trilingüe entre Kraków, Zamosc y Kyiv y magistraturas bilingües de Lviv a Bratslav abren camino a ruszynjsky, síntesis cívica con memoria parroquial propia."
 wr_cultural_maneuver.30.d_rusyn:0 "Treinta años de mercados comunes, catecismos de Trnava y convivencia en Saris-Spis-Zemplen reflejan los tránsitos eslovacos orientales forjando rusznjoczky como socio carpático."
 wr_cultural_maneuver.30.a:0 "Presentemos la carta definitiva (menos del 5 % de probabilidad de aprobación)."
 wr_cultural_maneuver.30.b:0 "Mantener la afinidad bilingüe sin cruzar el umbral."
 wr_cultural_maneuver.31.t:0 "Síntesis cívica eslava occidental lograda"
 wr_cultural_maneuver.31.d:0 "El congreso ha ratificado la carta occidental. Cada pueblo que haya obtenido el respaldo de al menos el 85 % de sus provincias ingresa en el grupo eslavo occidental bajo su nombre: bjalowruszsky, ruszynjsky o rusznjoczky."
 wr_cultural_maneuver.31.d_belarus:0 "En Brest, Grodno, Vilnius y Polatsk, los concejos entran en el grupo eslavo occidental como bjalowruszsky, coronando siglos de letras en lacinka."
 wr_cultural_maneuver.31.d_ruthenia:0 "De Lviv, Halych y Kamianets a Volhynia y Kyiv, los estamentos ingresan como ruszynjsky en la familia eslava occidental."
 wr_cultural_maneuver.31.d_rusyn:0 "En Uzhhorod, Mukachevo, Presov y Khust, las asambleas carpáticas ocupan su lugar en el grupo eslavo occidental como rusznjoczky junto a checos, polacos y eslovacos."
 wr_cultural_maneuver.31.a:0 "Proclamar la rara síntesis a los tres círculos."
 wr_cultural_maneuver.32.t:0 "Los estamentos se detienen ante la frontera eslava occidental"
 wr_cultural_maneuver.32.d:0 "Incluso tras décadas de afinidad, sínodos y comunas rurales trazaron el límite definitivo. La alianza cívica bilingüe prosigue sin cambio de grupo cultural."
 wr_cultural_maneuver.32.d_belarus:0 "Cofradías de Vilnius y nobleza de Minsk conservaron el bilingüismo sin romper sus lazos eclesiales orientales."
 wr_cultural_maneuver.32.d_ruthenia:0 "Eruditos de Kyiv y Ostroh y estamentos del Dnieper elogiaron Kraków, pero conservaron sus raíces eslavas orientales."
 wr_cultural_maneuver.32.d_rusyn:0 "Parroquias de Mukachevo y villas de Khust mantuvieron el comercio con Spis sin abandonar la costumbre carpática."
 wr_cultural_maneuver.32.a:0 "Preservar el pacto cívico de doble escritura."
 wr_cultural_maneuver.35.t:0 "El soberano ratifica la síntesis eslava occidental"
 wr_cultural_maneuver.35.d:0 "Nuestro señor ha sellado la carta occidental. Invita a nuestros estamentos a hacer lo propio por cada pueblo que haya obtenido el respaldo de al menos el 85 % de sus provincias."
 wr_cultural_maneuver.35.d_belarus:0 "Nuestro soberano registra a ciudades y nobleza bielorrusas como bjalowruszsky en el grupo eslavo occidental e invita a nuestra corte a alinearse."
 wr_cultural_maneuver.35.d_ruthenia:0 "Nuestro soberano registra a las magistraturas rutenas como ruszynjsky en el grupo eslavo occidental e invita a nuestras tierras a seguirlo."
 wr_cultural_maneuver.35.d_rusyn:0 "Nuestro soberano inscribió a los rusnaks carpáticos como rusznjoczky en el grupo eslavo occidental e invita a nuestros comitados a adoptarlo."
 wr_cultural_maneuver.35.a:0 "Adoptar la carta eslava occidental del soberano."
 wr_cultural_maneuver.35.b:0 "Rehusar y mantener el uso anterior."
 wr_cultural_maneuver.41.t:0 "Los enviados y los escribanos"
 wr_cultural_maneuver.41.d:0 "La cancillería de [From.GetName] nos trae una carta para usar nuestra lengua común en tribunales y parroquias. Con nuestro sello se adherirán todas las provincias de nuestros dominios que la hablan."
 wr_cultural_maneuver.41.d_belarus:0 "Nuestros escribanos ya usan el bielaruski en Vilnius. Los enviados de [From.GetName] piden nuestro sello para que esta costumbre se extienda a todas nuestras provincias donde se habla esa lengua."
 wr_cultural_maneuver.41.d_ruthenia:0 "Nuestros escribanos ya usan el ruskyi en Lviv. Los enviados de [From.GetName] piden nuestro sello para que esta costumbre se extienda a todas nuestras provincias donde se habla esa lengua."
 wr_cultural_maneuver.41.d_rusyn:0 "Nuestros escribanos ya usan el rusnacky en Presov. Los enviados de [From.GetName] piden nuestro sello para que esta costumbre se extienda a todas nuestras provincias donde se habla esa lengua."
 wr_cultural_maneuver.41.a:0 "Ratificar la carta hermana e inscribir nuestras provincias."
 wr_cultural_maneuver.41.b:0 "Mantener las formas litúrgicas y cancillerescas previas."
 wr_cultural_maneuver.42.t:0 "Un sello para los estatutos rutenos"
 wr_cultural_maneuver.42.d:0 "Los enviados de [From.GetName] solicitan nuestro sello para los estatutos rutenos. Estos reconocen por separado el bielaruski, el ruskyi y el rusnacky allí donde al menos el 60 % de las provincias del pueblo correspondiente hayan adoptado la carta."
 wr_cultural_maneuver.42.d_belarus:0 "Los estatutos recogen el nombre bielaruski entre los pueblos de la Rus. Los enviados de [From.GetName] preguntan si nuestra corte pondrá su sello junto al de los demás signatarios."
 wr_cultural_maneuver.42.d_ruthenia:0 "Los estatutos recogen el nombre ruskyi entre los pueblos de la Rus. Los enviados de [From.GetName] preguntan si nuestra corte pondrá su sello junto al de los demás signatarios."
 wr_cultural_maneuver.42.d_rusyn:0 "Los estatutos recogen el nombre rusnacky entre los pueblos de la Rus. Los enviados de [From.GetName] preguntan si nuestra corte pondrá su sello junto al de los demás signatarios."
 wr_cultural_maneuver.42.a:0 "Sumarse al mandato colectivo."
 wr_cultural_maneuver.42.b:0 "Denegar el respaldo colectivo."
 wr_cultural_maneuver.43.t:0 "Una oferta de las villas occidentales"
 wr_cultural_maneuver.43.d:0 "Las villas de [From.GetName] ofrecen a nuestros magistrados un lugar en su pacto occidental. Podrán sumarse si aún no hemos jurado la carta de cancillería. Para cada pueblo buscan el sello de al menos el 85 % de sus provincias."
 wr_cultural_maneuver.43.d_belarus:0 "Los gremios de Vilnius comercian bajo cartas semejantes a las de Brest. Los enviados de [From.GetName] proponen que las villas reconozcan sus escrituras respectivas y lleven sus libros en ambos alfabetos."
 wr_cultural_maneuver.43.d_ruthenia:0 "Los gremios de Lviv comercian bajo cartas semejantes a las de Zamosc. Los enviados de [From.GetName] proponen que las villas reconozcan sus escrituras respectivas y lleven sus libros en ambos alfabetos."
 wr_cultural_maneuver.43.d_rusyn:0 "Los gremios de Presov comercian bajo cartas semejantes a las de Trnava. Los enviados de [From.GetName] proponen que las villas reconozcan sus escrituras respectivas y lleven sus libros en ambos alfabetos."
 wr_cultural_maneuver.43.a:0 "Unirse al círculo de afinidad eslava occidental."
 wr_cultural_maneuver.43.b:0 "Rechazar el pacto cívico occidental."
 wr_cultural_maneuver.44.t:0 "La carta definitiva"
 wr_cultural_maneuver.44.d:0 "Una delegación de [From.GetName] aguarda nuestro sello en la carta occidental. Los pueblos que hayan reunido el respaldo de al menos el 85 % de sus provincias podrán ocupar un lugar entre los eslavos occidentales."
 wr_cultural_maneuver.44.d_belarus:0 "Los enviados de [From.GetName] traen una carta que lleva el nombre bjalowruszsky. Piden que la corte reconozca a nuestro pueblo bajo ese nombre entre los eslavos occidentales."
 wr_cultural_maneuver.44.d_ruthenia:0 "Los enviados de [From.GetName] traen una carta que lleva el nombre ruszynjsky. Piden que la corte reconozca a nuestro pueblo bajo ese nombre entre los eslavos occidentales."
 wr_cultural_maneuver.44.d_rusyn:0 "Los enviados de [From.GetName] traen una carta que lleva el nombre rusznjoczky. Piden que la corte reconozca a nuestro pueblo bajo ese nombre entre los eslavos occidentales."
 wr_cultural_maneuver.44.a:0 "Firmar el tratado de síntesis eslava occidental."
 wr_cultural_maneuver.44.b:0 "Rehusar el ingreso en el grupo eslavo occidental."
 wr_cultural_maneuver.51.t:0 "La lengua de nuestros tribunales"
 wr_cultural_maneuver.51.d:0 "Estas lenguas ya se oyen en nuestra corte. Los enviados de [From.GetName] piden que puedan usarse en las escrituras y los libros parroquiales de sus provincias. Necesitan al menos el 60 % de las provincias de cada pueblo."
 wr_cultural_maneuver.51.d_belarus:0 "Dado que nuestra corona acepta a los bielorrusos, [From.GetName] pide ratificar cartas bielaruski en nuestras provincias bielorrusas."
 wr_cultural_maneuver.51.d_ruthenia:0 "Dado que nuestro reino acepta a los rutenos, [From.GetName] pide avalar los registros ruskyi en nuestras tierras rutenas."
 wr_cultural_maneuver.51.d_rusyn:0 "Dado que nuestra corona acepta a los rusnaks, [From.GetName] pide confirmar cartas rusnacky en nuestros comitados."
 wr_cultural_maneuver.51.a:0 "Reconocer las cartas nativas en tierras aceptadas."
 wr_cultural_maneuver.51.b:0 "Retener el reconocimiento real."
 wr_cultural_maneuver.52.t:0 "Los diputados y los estatutos"
 wr_cultural_maneuver.52.d:0 "La cancillería de [From.GetName] nos ha enviado una copia de los estatutos rutenos. Los pueblos a quienes atañen tienen voz en nuestra corte y sus diputados piden permiso para firmar."
 wr_cultural_maneuver.52.d_belarus:0 "Nuestros diputados ya reciben peticiones en bielaruski. Los enviados les piden que consagren ese derecho en los estatutos rutenos."
 wr_cultural_maneuver.52.d_ruthenia:0 "Nuestros diputados ya reciben peticiones en ruskyi. Los enviados les piden que consagren ese derecho en los estatutos rutenos."
 wr_cultural_maneuver.52.d_rusyn:0 "Nuestros diputados ya reciben peticiones en rusnacky. Los enviados les piden que consagren ese derecho en los estatutos rutenos."
 wr_cultural_maneuver.52.a:0 "Respaldar el códice ruteno separado."
 wr_cultural_maneuver.52.b:0 "Denegar el apoyo de la corte."
 wr_cultural_maneuver.53.t:0 "Un pacto para nuestras villas mercantiles"
 wr_cultural_maneuver.53.d:0 "Los magistrados de [From.GetName] invitan a las villas representadas en nuestra corte a intercambiar cartas con sus vecinas occidentales. Cada adhesión acerca al pueblo correspondiente al 85 % de provincias exigido."
 wr_cultural_maneuver.53.d_belarus:0 "Los magistrados de Vilnius han acudido a nuestra corte. Los enviados de [From.GetName] les ofrecen los mismos privilegios comerciales e intercambios de cartas que a sus vecinos de Brest."
 wr_cultural_maneuver.53.d_ruthenia:0 "Los magistrados de Lviv han acudido a nuestra corte. Los enviados de [From.GetName] les ofrecen los mismos privilegios comerciales e intercambios de cartas que a sus vecinos de Zamosc."
 wr_cultural_maneuver.53.d_rusyn:0 "Los magistrados de Presov han acudido a nuestra corte. Los enviados de [From.GetName] les ofrecen los mismos privilegios comerciales e intercambios de cartas que a sus vecinos de Trnava."
 wr_cultural_maneuver.53.a:0 "Confirmar la carta de afinidad eslava occidental."
 wr_cultural_maneuver.53.b:0 "Mantenerse al margen de la afinidad occidental."
 wr_cultural_maneuver.54.t:0 "El sello de los estamentos"
 wr_cultural_maneuver.54.d:0 "Las villas han enviado diputados a escuchar la carta occidental que trae [From.GetName]. Preguntan si la corona reconocerá el acuerdo en nombre de los pueblos representados en la corte."
 wr_cultural_maneuver.54.d_belarus:0 "Los enviados de [From.GetName] piden que se reconozca el nombre bjalowruszsky entre los eslavos occidentales. Los diputados solicitan nuestro consentimiento allí donde al menos el 85 % de las provincias de su pueblo hayan sellado el pacto."
 wr_cultural_maneuver.54.d_ruthenia:0 "Los enviados de [From.GetName] piden que se reconozca el nombre ruszynjsky entre los eslavos occidentales. Los diputados solicitan nuestro consentimiento allí donde al menos el 85 % de las provincias de su pueblo hayan sellado el pacto."
 wr_cultural_maneuver.54.d_rusyn:0 "Los enviados de [From.GetName] piden que se reconozca el nombre rusznjoczky entre los eslavos occidentales. Los diputados solicitan nuestro consentimiento allí donde al menos el 85 % de las provincias de su pueblo hayan sellado el pacto."
 wr_cultural_maneuver.54.a:0 "Ratificar la transición para nuestros estamentos aceptados."
 wr_cultural_maneuver.54.b:0 "Rechazar la transición final."
 wr_cultural_maneuver.61.t:0 "Una petición de las parroquias"
 wr_cultural_maneuver.61.d:0 "Aunque estas lenguas carecen de reconocimiento en la corte, se oyen a diario en las parroquias. Los enviados de [From.GetName] piden que los escribanos puedan emplearlas y que estos distritos se acojan a la carta."
 wr_cultural_maneuver.61.d_belarus:0 "Aunque los bielorrusos no estén aceptados aquí, [From.GetName] pide tolerar los registros municipales bielaruski."
 wr_cultural_maneuver.61.d_ruthenia:0 "Aunque los rutenos no estén aceptados en la corte, [From.GetName] pide tolerar escuelas de cofradías y libros ruskyi."
 wr_cultural_maneuver.61.d_rusyn:0 "Aunque los rusnaks no gocen de aceptación aquí, [From.GetName] pide respetar las costumbres locales rusnacky y sholtys."
 wr_cultural_maneuver.61.a:0 "Conceder margen parroquial y concejil local."
 wr_cultural_maneuver.61.b:0 "Mantener estricta uniformidad administrativa."
 wr_cultural_maneuver.62.t:0 "Los gobernadores reciben los estatutos"
 wr_cultural_maneuver.62.d:0 "Los enviados de [From.GetName] piden a nuestros gobernadores que respeten los estatutos rutenos en los distritos sin voz en la corte. Rigen allí donde al menos el 60 % de las provincias del pueblo hayan aceptado la carta."
 wr_cultural_maneuver.62.d_belarus:0 "Gobernamos tierras bielorrusas; [From.GetName] pide registrarlas como bielaruski dentro del grupo ruteno separado."
 wr_cultural_maneuver.62.d_ruthenia:0 "Poseemos provincias rutenas; [From.GetName] pide reconocer ruskyi en el grupo ruteno separado."
 wr_cultural_maneuver.62.d_rusyn:0 "Poseemos condados rusnaks; [From.GetName] pide a nuestros capitanes adoptar el códice rusnacky."
 wr_cultural_maneuver.62.a:0 "Permitir el paso provincial al grupo separado."
 wr_cultural_maneuver.62.b:0 "Dejar sin cambios los padrones provinciales."
 wr_cultural_maneuver.63.t:0 "Los libros de los gremios"
 wr_cultural_maneuver.63.d:0 "Los gremios fronterizos han recibido noticias de [From.GetName]. Piden permiso para llevar sus libros en dos escrituras y acoger maestros de las villas occidentales. Sus sellos contarían para el 85 % de provincias que necesita cada pueblo."
 wr_cultural_maneuver.63.d_belarus:0 "Los enviados traen una petición de los gremios. Quieren enseñar ambos alfabetos y redactar sus contratos como los mercaderes de Vilnius y Brest."
 wr_cultural_maneuver.63.d_ruthenia:0 "Los enviados traen una petición de los gremios. Quieren enseñar ambos alfabetos y redactar sus contratos como los mercaderes de Lviv y Zamosc."
 wr_cultural_maneuver.63.d_rusyn:0 "Los enviados traen una petición de los gremios. Quieren enseñar ambos alfabetos y redactar sus contratos como los mercaderes de Presov y Trnava."
 wr_cultural_maneuver.63.a:0 "Permitir gremios municipales de doble escritura."
 wr_cultural_maneuver.63.b:0 "Prohibir alineaciones urbanas foráneas."
 wr_cultural_maneuver.64.t:0 "La carta llega a las marcas"
 wr_cultural_maneuver.64.d:0 "Los enviados de [From.GetName] han traído la carta occidental a nuestras marcas. Nos piden que la reconozcamos allí donde al menos el 85 % de las provincias de un pueblo se hayan adherido al pacto."
 wr_cultural_maneuver.64.d_belarus:0 "Los enviados de [From.GetName] han reunido suficientes sellos para que la carta occidental entre en vigor. Piden a los gobernadores que inscriban nuestras villas en los nuevos registros bajo el nombre bjalowruszsky."
 wr_cultural_maneuver.64.d_ruthenia:0 "Los enviados de [From.GetName] han reunido suficientes sellos para que la carta occidental entre en vigor. Piden a los gobernadores que inscriban nuestras villas en los nuevos registros bajo el nombre ruszynjsky."
 wr_cultural_maneuver.64.d_rusyn:0 "Los enviados de [From.GetName] han reunido suficientes sellos para que la carta occidental entre en vigor. Piden a los gobernadores que inscriban nuestras villas en los nuevos registros bajo el nombre rusznjoczky."
 wr_cultural_maneuver.64.a:0 "Armonizar provincias fronterizas con el grupo eslavo occidental."
 wr_cultural_maneuver.64.b:0 "Conservar los registros provinciales vigentes."
 wr_is_byelorussian_province_tt:0 "Province culture belongs to the Belarusian charter tradition."
 wr_is_byelorussian_country_tt:0 "Our primary culture belongs to the Belarusian charter tradition."
 wr_has_accepted_byelorussian_tt:0 "The Belarusian tradition is represented by an accepted culture outside our primary tradition."
 wr_is_ruthenian_province_tt:0 "Province culture belongs to the Ruthenian charter tradition."
 wr_is_ruthenian_country_tt:0 "Our primary culture belongs to the Ruthenian charter tradition."
 wr_has_accepted_ruthenian_tt:0 "The Ruthenian tradition is represented by an accepted culture outside our primary tradition."
 wr_is_rusyn_province_tt:0 "Province culture belongs to the Rusyn charter tradition."
 wr_is_rusyn_country_tt:0 "Our primary culture belongs to the Rusyn charter tradition."
 wr_has_accepted_rusyn_tt:0 "The Rusyn tradition is represented by an accepted culture outside our primary tradition."
