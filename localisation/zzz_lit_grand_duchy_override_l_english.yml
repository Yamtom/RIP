l_english:

 # Deliberate override of a vanilla key.
 #
 # common/government_reforms/RIP_lit_grand_duchy.txt replaces vanilla's
 # grand_duchy_reform by key: the stub had one modifier and said nothing about
 # what the Grand Duchy was. The reform name stays vanilla's; only the
 # description is rewritten, and the zzz_ prefix is what makes this file sort
 # after vanilla's own reform localisation so the override actually wins.

 grand_duchy_reform_desc:0 "The dynasty is Catholic and the country mostly is not, and the two have agreed not to raise it. The Grand Duke rules through the lords of his council, the chancery writes to the palatinates in Ruthenian, and the boyars hold their land against a levy of horse. None of this is written down anywhere a lawyer could produce it."
