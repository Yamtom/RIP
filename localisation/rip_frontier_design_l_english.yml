l_english:
 found_the_danube_sich_desc:0 "Organize a Danube Host on our controlled lower-Danube frontier. This is territorial organization, not the exile route of the Transdanubian Sich. Pay 50 MIL once; the foundation grants 10 army tradition. The national Host package is shared, not multiplied by the number of Hosts. Local musters require state cores of the corresponding region. Loss or occupation of the regional base suspends benefits at the next monthly review; recovery never repeats the founding reward. Regional musters require the founded Host and its controlled territorial base. Two active bases give the United Cossack Hosts name. Lost bases suspend musters; founding dates and payments remain recorded."
 found_the_don_host_desc:0 "Organize the Don Host on the controlled lower Don. Pay 50 MIL once; the foundation grants 10 army tradition. The national Host package is shared, not multiplied by the number of Hosts. Local musters require state cores of the corresponding region. Loss or occupation of the regional base suspends benefits at the next monthly review; recovery never repeats the founding reward. Regional musters require the founded Host and its controlled territorial base. Two active bases give the United Cossack Hosts name. Lost bases suspend musters; founding dates and payments remain recorded."
 found_the_eastern_host_desc:0 "Organize the Eastern Host on our controlled Circassian or Nogai frontier. The broad geographical condition does not claim an exact reconstruction of a Kuban institution. Pay 50 MIL once; the foundation grants 10 army tradition. The national Host package is shared, not multiplied by the number of Hosts. Local musters require state cores of the corresponding region. Loss or occupation of the regional base suspends benefits at the next monthly review; recovery never repeats the founding reward. Regional musters require the founded Host and its controlled territorial base. Two active bases give the United Cossack Hosts name. Lost bases suspend musters; founding dates and payments remain recorded."
 found_the_sloboda_host_desc:0 "Organize the Sloboda Host in the controlled Sloboda Ukraine area. Pay 50 MIL once; the foundation grants 10 army tradition. The national Host package is shared, not multiplied by the number of Hosts. Local musters require state cores of the corresponding region. Loss or occupation of the regional base suspends benefits at the next monthly review; recovery never repeats the founding reward. Regional musters require the founded Host and its controlled territorial base. Two active bases give the United Cossack Hosts name. Lost bases suspend musters; founding dates and payments remain recorded."
 rip_frontier_ai_reserve_tt:0 "After paying, retain one year of gross income; no loans or negative monthly balance."
 rip_frontier_batch_tt:0 "Up to five NEW normal claims in one connected frontier batch. The first target must border directly controlled land connected to the capital. Existing cores, claims and dependent-subject land are excluded. Shared ten-year term across all theatres. No payment without a target. Repeat purchases never renew initial benefits."
 rip_host_active_basis_tt:0 "Regional musters require the founded Host and its controlled territorial base. Two active bases give the United Cossack Hosts name. Lost bases suspend musters; founding dates and payments remain recorded."
 ruthenian_eastward_frontier_policy_desc:0 "Pay 100 ducats, 50 DIP. Up to five NEW normal claims in one connected frontier batch. The first target must border directly controlled land connected to the capital. Existing cores, claims and dependent-subject land are excluded. Shared ten-year term across all theatres. No payment without a target. Repeat purchases never renew initial benefits. Highlighting shows possible starting provinces. Later picks extend the chosen batch; the province is not selected manually. Losing the territorial base ends project benefits without refund or renewal."
 ruthenian_eastward_frontier_policy_effect_tt:0 "Gain up to §Y5§! temporary claims on connected frontier provinces in the §YCrimea region§!.\nImposes a §Y10-year§! cooldown on new frontier expeditions.\n§YFirst Expedition:§! Gain §YRuthenian Eastward Mandate§! for §Y20 years§! (§G+5.0%§! Manpower Recovery Speed, §G-10.0%§! Fort Maintenance) and convene the frontier council."
 ruthenian_eastward_frontier_policy_title:0 "Commission an Eastern Frontier Expedition"
 ruthenian_manchurian_horizon_desc:0 "Pay 200 ducats, 50 ADM, 50 DIP. Up to five NEW normal claims in one connected frontier batch. The first target must border directly controlled land connected to the capital. Existing cores, claims and dependent-subject land are excluded. Shared ten-year term across all theatres. No payment without a target. Repeat purchases never renew initial benefits. Highlighting shows possible starting provinces. Later picks extend the chosen batch; the province is not selected manually. Losing the territorial base ends project benefits without refund or renewal."
 ruthenian_manchurian_horizon_effect_tt:0 "Gain up to §Y5§! temporary claims on connected frontier provinces in the §YManchuria region§!.\nImposes a §Y10-year§! cooldown on new frontier expeditions.\n§YFirst Expedition:§! Gain §YThe Manchurian Push§! for §Y25 years§! (§G+1§! Colonist) and convene the Manchurian council."
 ruthenian_manchurian_horizon_title:0 "Commission a Manchurian Frontier Expedition"
 ruthenian_open_ural_gate_desc:0 "Pay 150 ducats, 50 DIP, 50 MIL. Up to five NEW normal claims in one connected frontier batch. The first target must border directly controlled land connected to the capital. Existing cores, claims and dependent-subject land are excluded. Shared ten-year term across all theatres. No payment without a target. Repeat purchases never renew initial benefits. Highlighting shows possible starting provinces. Later picks extend the chosen batch; the province is not selected manually. Losing the territorial base ends project benefits without refund or renewal."
 ruthenian_open_ural_gate_effect_tt:0 "Gain up to §Y5§! temporary claims on connected frontier provinces in the §YUral region§!.\nImposes a §Y10-year§! cooldown on new frontier expeditions.\n§YFirst Expedition:§! Gain §YThe Ural Gate§! for §Y25 years§! (§G+150§! Governing Capacity, §G-10.0%§! State Maintenance) and convene the Ural council."
 ruthenian_open_ural_gate_title:0 "Commission a Ural Frontier Expedition"
