 kru_rada_coalition:0 "Rada Coalition"
 kru_rada_coalition_desc:0 "The faction in power and the previously dominant faction govern together."
 kru_rada_opposition:0 "Rada Opposition"
 kru_rada_opposition_desc:0 "The remaining faction stands outside the coalition and may prevail in the States General."
 kyivan_veche_reform:0 "Kyivan Veche Republic"
 kyivan_veche_reform_desc:0 "The town assembly elects a posadnik in place of a prince; merchants and lineages speak in the veche, and the office answers to a term, not a bloodline."
 kyivan_boyar_republic_reform:0 "Kyivan Boyar Rada"
 kyivan_boyar_republic_reform_desc:0 "The veche's yearly muster hardens into a standing council of boyar lineages, traders, and guildsmen, each with a settled voice in the city's rule."
 ruthenian_factional_empire_reform:0 "Rada of Three Estates"
 ruthenian_factional_empire_reform_desc:0 "When a faction reaches 60 influence, it and the previously dominant faction form the ruling coalition; the third bloc is the opposition. With Res Publica or Winds of Change, the States General follows this contest. Below 60 influence no bloc dominates and the scale returns to neutral. The former bloc keeps a junior voice from 38 influence."
 ruthenian_factional_empire_princes_hetmans_reform:0 "Rada of Three Estates"
 ruthenian_factional_empire_princes_hetmans_reform_desc:0 "When a faction reaches 60 influence, it and the previously dominant faction form the ruling coalition; the third bloc is the opposition. With Res Publica or Winds of Change, the States General follows this contest. Below 60 influence no bloc dominates and the scale returns to neutral. The former bloc keeps a junior voice from 38 influence."
