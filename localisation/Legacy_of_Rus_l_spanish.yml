 flavor_ukr_legacy_of_rus.1.a:0 "Let our envoys announce the victory."
 flavor_ukr_legacy_of_rus.1.d:0 "Our victory at Constantinople has transformed our standing among the powers of Europe. The city offers new opportunities for trade and diplomacy, alongside the burden of defending the straits."
 flavor_ukr_legacy_of_rus.1.t:0 "Our Banners at Tsarhorod"
 flavor_ukr_legacy_of_rus.2.a:0 "A new settlement begins."
 flavor_ukr_legacy_of_rus.2.d:0 "With Moscow under our authority and Novgorod beyond Muscovite rule, the balance of power has shifted. Our court can now press its own claims to leadership among the lands of Rus."
 flavor_ukr_legacy_of_rus.2.t:0 "Muscovite Power Broken"
 flavor_ukr_legacy_of_rus.3.a:0 "Put the new administration to work."
 flavor_ukr_legacy_of_rus.3.d:0 "The towns of the western Dnieper once again answer to a common authority. Rebuilding Kyiv has given our administrators a firm centre from which to govern these lands."
 flavor_ukr_legacy_of_rus.3.t:0 "Kyiv Restored"
 flavor_ukr_legacy_of_rus.4.a:0 "Endow the school."
 flavor_ukr_legacy_of_rus.4.d:0 "Patrons in the lands around Ostroh and Rivne have gathered scholars, teachers and printers. State support can turn their work into a lasting institution of learning."
 flavor_ukr_legacy_of_rus.4.t:0 "Learning in Volhynia"
