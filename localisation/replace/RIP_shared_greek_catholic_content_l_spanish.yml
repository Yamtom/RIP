 desc_rip_du_rite_guarantee:0 "A local union agreement protects the Eastern rite from missionary conversion. Its twenty-year modifier is renewed each year while the province remains Greek Catholic under a Catholic owner, and is removed at the next yearly pulse if either condition fails. It does not spread to neighbouring provinces."
 desc_rip_ucr_church_of_the_palace:0 "The church answers in temporal governance to the royal chancery while keeping its Eastern liturgy intact."
