l_german:
 rip_rus_kyiv_scribes_title:0 "Kiewer Schreiber"
 rip_rus_kyiv_scribes_desc:0 "Ladet Schreiber aus Kiew an unseren Hof ein. Ein Abkommen mit dem Herrscher der Stadt sichert ihren Handschriften freies Geleit."
 rip_rus_copy_ruthenian_books_title:0 "Die Schreibstube"
 rip_rus_copy_ruthenian_books_desc:0 "Richtet in einer Kirche der Hauptstadt eine Schreibstube ein. Kontakte in Lwiw oder Wolhynien können ruthenische Handschriften vermitteln."
 rip_rus_ruthenian_press_title:0 "Buchdruck am Hof"
 rip_rus_ruthenian_press_desc:0 "Bringt Schreiber und Drucker in der Hauptstadt zusammen. Mit Druckpressen und offenem Weg nach Kiew können Bücher mehr Leser erreichen."
 rip_pol_carpathian_passes_title:0 "Karpatenpässe"
 rip_pol_carpathian_passes_desc:0 "Sichert den Weg zwischen Halytsch und der Maramuresch, damit russinische Händler Salz und Vieh über die Berge bringen können."
 rip_pol_rusyn_fairs_title:0 "Russinische Märkte"
 rip_pol_rusyn_fairs_desc:0 "Baut die Märkte von Halytsch und Peremyschl aus. Händler brauchen nach dem Abstieg von den Pässen Stände, Waagen und Lagerhäuser."
 rip_pol_lviv_charters_title:0 "Lwiwer Urkunden"
 rip_pol_lviv_charters_desc:0 "Bestätigt in Lwiw die Zölle und Handelsrechte der Kaufleute aus den Bergen. Die Urkunde einer wohlhabenden Stadt hat auf beiden Seiten der Pässe Gewicht."
 rip_tat_ruthenian_yarlyks_title:0 "Ruthenische Jarlyks"
 rip_tat_ruthenian_yarlyks_desc:0 "Die Fürsten der Rus ritten einst nach Sarai, um die Urkunden zu erhalten, die ihre Throne bestätigten, und sie bezahlten dafür. Wer die ruthenischen Lande oder ihre Fürsten als Untertanen hält, kann denselben Handel wieder schließen."
 rip_tat_ruthenian_tribute:0 "Ruthenischer Tribut"
 desc_rip_tat_ruthenian_tribute:0 "Tribut und Urkundengebühren aus den ruthenischen Landen füllen die Schatzkammer und mehren unser Ansehen."
 rip_hab_galician_ruthenians_title:0 "Galizische Ruthenen"
 rip_hab_galician_ruthenians_desc:0 "Die Pfarreien des östlichen Ritus in Rotreußen unterstehen nun Wien. Ihre Priester brauchen Schulen, ihre Bischöfe Gehör, und eine Monarchie, die die Treue der Dörfer will, muss ihnen in ihrer eigenen Kirche begegnen."
 rip_hab_ruthenian_clergy:0 "Ruthenischer Klerus"
 desc_rip_hab_ruthenian_clergy:0 "In den Seminaren der Monarchie ausgebildete Priester des östlichen Ritus tragen die Autorität der Krone in die ruthenischen Dörfer."
 rip_hab_galician_ruthenians_classic_title:0 "$rip_hab_galician_ruthenians_title$"
 rip_hab_galician_ruthenians_classic_desc:0 "$rip_hab_galician_ruthenians_desc$"
