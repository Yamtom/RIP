 palanok_fortress:0 "Palanok Fortress"
 palanok_fortress_desc:0 "Carved into the volcanic hill above Mukachevo, Palanok Fortress guarded the mountain passes, sheltered Transcarpathian diets, and became a beacon of anti-Habsburg resistance under the Rákóczi princes."
 pannonia_control:0 "Control of Pannonia"
 pannonian_capital:0 "Pannonian Capital"
 papal_protection_greek_catholic:0 "Papal Protection of Greek Catholics"
 partia_kapitaniv:0 "Captaincy Party"
 partia_kapitaniv_desc:0 "Frontier officers and sotnia colonels demand fortified marches, hardened levies, and vigilant patrols to hold the Tysa line."
 partia_soymu:0 "Sejm Party"
 partia_soymu_desc:0 "Mercantile magnates and guild elders champion river tolls, brokerage rights, and pragmatic diplomacy across the captaincy."
 partisan_tradition:0 "Partisan Tradition"
 partisan_tradition_desc:0 "Forest guerrilla warfare is deeply embedded in Belarusian culture. Our partisan expertise makes occupation nearly impossible for foreign powers."
 patriarch_authority:0 "Patriarch Authority"
 patriarch_authority_desc:0 "The Moscow Patriarch exercises supreme authority over church and state matters."
 patriarch_engagement_reform:0 "Blessing of the Patriarch"
 patriarch_engagement_reform_desc:0 "No one may call himself king without God's consent, which is bestowed by the choice of the Patriarch. As a result, before ascending to the throne, the king must obtain the Patriarch's assent."
 patriarch_of_all_rus:0 "Patriarch of All Rus'"
 patriarch_of_constantinople_restored:0 "Patriarch of Constantinople Restored"
 patriarch_of_constantinople_restored_desc:0 "The Orthodox Patriarch has returned to his ancient throne in Constantinople."
 patronize_greek_catholic_culture_decision_desc:0 "We can become patrons of Greek Catholic arts, literature, and scholarship, fostering cultural flowering."
 patronize_greek_catholic_culture_decision_title:0 "Patronize Greek Catholic Culture"
 pays_tatar_tribute:0 "Pays Tatar Tribute"
 pays_tatar_tribute_desc:0 "We pay tribute to Tatar raiders to secure peace."
 pdl_absolute_dominion_reform:0 "Absolute Dominion"
 pdl_absolute_dominion_reform_desc:0 "Central authority is concentrated in the hands of the voivode, who rules absolutely. Military and administrative power are unified under single command."
 pdl_accepted_suzerainty:0 "Accepted Suzerainty"
 pdl_adopt_carpathian_doctrine_desc:0 "Following Croatian traditions of border defense, we can transform Podillia into a fortified bastion. This path emphasizes fortress construction, garrison strength, and defensive warfare."
 pdl_adopt_carpathian_doctrine_title:0 "Embrace Carpathian Defense Doctrine"
 pdl_adopt_cossack_traditions_desc:0 "The Cossack hosts offer us cavalry expertise and frontier resilience. By integrating their traditions, we become masters of steppe warfare and mobile defense."
 pdl_adopt_cossack_traditions_title:0 "Embrace Cossack Frontier Traditions"
 pdl_adopt_magnate_governance_desc:0 "Following Mazovian precedent, we can grant magnate families significant autonomy in exchange for economic development and trade expertise. This path rewards commercial growth."
 pdl_adopt_magnate_governance_title:0 "Embrace Magnate Governance"
 pdl_annual_fair:0 "Annual Trade Fair"
 pdl_aristocratic_assembly_reform:0 "Aristocratic Assembly"
 pdl_aristocratic_assembly_reform_desc:0 "Noble power grows as an aristocratic assembly gains influence in governance. The magnate families of Podillia demand a voice in decision-making."
 pdl_breadbasket:0 "Podillian Breadbasket"
 pdl_carpathian_bastion_reform:0 "Carpathian Bastion"
 pdl_carpathian_bastion_reform_desc:0 "Following the defensive traditions of our Croatian neighbors, Podillia has transformed into a military bastion. Fortifications dominate governance, and military concerns eclipse civilian affairs."
 pdl_clan_assembly_reform:0 "Clan Assembly"
 pdl_clan_assembly_reform_desc:0 "Our governance rests upon the ancient traditions of the steppe clans, where elder councils gather to decide the fate of the people. Power emerges from tribal unity and collective wisdom."
 pdl_confessional_peace:0 "Confessional Peace"
 pdl_confessional_peace_enacted:0 "Confessional Peace Enacted"
 pdl_cossack_autonomy_granted:0 "Cossack Autonomy Granted"
 pdl_cossack_host:0 "Cossack Host Assembly"
 pdl_cossack_integration:0 "Cossack Integration"
 pdl_cossack_settlement:0 "Cossack Settlement"
 pdl_cossack_upheaval_base_progress:0 "Base monthly progress toward Cossack uprising"
 pdl_crimea_raids:0 "Secured from Crimean Raids"
 pdl_crimean_tributary:0 "Crimean Tributary Status"
 pdl_crisis_base_progress:0 "Base monthly progress toward crisis"
 pdl_defensive_alliances:0 "Defensive Alliances"
 pdl_develop_kamianets_desc:0 "Invest in the development of Kamianets-Podilskyi, transforming it into a worthy capital with improved infrastructure and commercial facilities."
 pdl_develop_kamianets_title:0 "Develop Kamianets as Capital"
 pdl_emergency_fortifications:0 "Emergency Fortifications"
 pdl_emergency_mobilization:0 "Emergency Mobilization"
 pdl_enlightened_compromise:0 "Enlightened Compromise"
 pdl_enlightened_voivodeship_reform:0 "Enlightened Voivodeship"
 pdl_enlightened_voivodeship_reform_desc:0 "The voivode embraces enlightenment principles while preserving traditional authority. Reforms modernize Podillia while respecting historical customs."
 pdl_enlightenment_values:0 "Enlightenment Values"
 pdl_establish_lviv_trade_desc:0 "Develop commercial connections with Lviv, integrating Podillia into the broader trade networks of Red Ruthenia and Poland."
 pdl_establish_lviv_trade_title:0 "Establish Trade Route to Lviv"
 pdl_establish_magnate_council_desc:0 "Create a formal council of magnate representatives to advise on state affairs, following Polish-Lithuanian traditions of noble governance."
 pdl_establish_magnate_council_title:0 "Establish Magnate Council"
 pdl_establish_trade_company_desc:0 "The great river routes of Podillia offer tremendous commercial opportunities. By establishing a trade company with monopoly privileges, we can harness these profits for the state treasury."
 pdl_establish_trade_company_title:0 "Establish a Trade Company"
 pdl_expand_trade_network_desc:0 "Our merchants have established footholds in regional trade networks. By investing capital and influence, we can expand our commercial reach and access new trade routes."
 pdl_expand_trade_network_title:0 "Expand Trade Network"
 pdl_expanded_trade_profits:0 "Expanded Trade Profits"
 pdl_form_greater_ruthenia_desc:0 "With Podillia, Galicia, and Volhynia united under one crown, we stand at the threshold of a historic achievement: the restoration of a united Ruthenian kingdom. From the Carpathians to the Dnieper, from Lviv to Kamianets, all Ruthenian lands shall be governed by one sovereign. This will be the foundation of a new era of prosperity and security for our people."
 pdl_form_greater_ruthenia_title:0 "Form Greater Ruthenian Kingdom"
 pdl_fortify_khotyn_decision_desc:0 "Strengthen the fortifications at Khotyn, creating a formidable bastion against threats from the south. This fortress guards our most vulnerable frontier."
 pdl_fortify_khotyn_decision_title:0 "Fortify Khotyn"
 pdl_frontier_republic_reform:0 "Frontier Republic"
 pdl_frontier_republic_reform_desc:0 "Inspired by Mazovian steppe traditions and Cossack principles, Podillia has become a cavalry republic. Mounted warriors command authority, and Cossack hosts shape our future."
 pdl_frontier_voivodeship_reform:0 "Frontier Voivodeship"
 pdl_frontier_voivodeship_reform_desc:0 "Podillia has emerged as an independent frontier voivodeship, balancing autonomy with the need for strong governance in this contested borderland."
 pdl_galician_diplomatic_union:0 "Galician-Podillian Union"
 pdl_garrison_drills:0 "Garrison Drill System"
 pdl_grand_podillia_reform:0 "Grand Podillia"
 pdl_grand_podillia_reform_desc:0 "Podillia has achieved supreme regional dominance, unifying all territories and establishing itself as a true empire. All paths have culminated in this moment of glory."
 pdl_grant_cossack_lands_desc:0 "Allocate frontier territories to Cossack communities, establishing permanent settlements that provide military manpower and border security."
 pdl_grant_cossack_lands_title:0 "Grant Lands to Cossack Settlers"
 pdl_grant_magnate_titles_desc:0 "The great magnate families of Podillia have long expected formal recognition of their status. By issuing hereditary titles and privileges, we can formalize their position within our realm and secure their loyalty."
 pdl_grant_magnate_titles_title:0 "Grant Magnate Titles"
 pdl_granted_magnate_status:0 "Granted Magnate Status"
 pdl_greater_ruthenia:0 "Greater Ruthenian Kingdom"
 pdl_integrate_magnate_vassal_desc:0 "One of our vassal magnates seeks greater integration within our realm. By absorbing their holdings and granting them positions at court, we can strengthen centralization."
 pdl_integrate_magnate_vassal_title:0 "Integrate a Magnate Vassal"
 pdl_integrated_magnates:0 "Integrated Magnates"
 pdl_jewish_emancipation_enacted:0 "Jewish Emancipation"
 pdl_jewish_emancipation_modifier:0 "Jewish Emancipation"
 pdl_jewish_protection:0 "Protection of Jewish Communities"
 pdl_jewish_trade_networks:0 "Jewish Trade Networks"
 pdl_kamianets_trade_hub:0 "Kamianets Trade Hub"
 pdl_khotyn_victory:0 "Defenders of Khotyn"
 pdl_magnate_council:0 "Magnate Council"
 pdl_magnate_dominion_reform:0 "Magnate Dominion"
 pdl_magnate_dominion_reform_desc:0 "Blending Polish-Lithuanian and Mazovian traditions, the magnate families of Podillia have secured control through a deliberative assembly. Noble autonomy and trade power define this path."
 pdl_magnate_republic_reform:0 "Magnate Republic"
 pdl_magnate_republic_reform_desc:0 "An oligarchic republic emerges, controlled by competing magnate families. Following the Mazovian model, power is concentrated in the hands of noble oligarchs."
 pdl_magnate_vassal_system:0 "Magnate Vassal System"
 pdl_military_modernization:0 "Military Modernization"
 pdl_military_victory:0 "Military Victory over the Ottomans"
 pdl_negotiated_tribute:0 "Negotiated Tribute"
 pdl_ottoman_menace_modifier:0 "Ottoman Menace"
 pdl_ottoman_mobilization:0 "Ottoman Mobilization"
 pdl_ottoman_resistance:0 "Withstood Ottoman Threat"
 pdl_ottoman_strength:0 "We are strong enough to face the Ottomans"
 pdl_ottoman_treaty:0 "Ottoman Treaty"
 pdl_palatine_court_reform:0 "Palatine Court"
 pdl_palatine_court_reform_desc:0 "A formal court centered on the palatine nobility has emerged, drawing from Polish-Lithuanian traditions. The voivode now rules as a feudal monarch with noble counselors."
 pdl_proclaim_tolerance_desc:0 "Officially recognize the religious diversity of Podillia, protecting Orthodox, Catholic, and Jewish communities. This policy promotes stability and prosperity."
 pdl_proclaim_tolerance_title:0 "Proclaim Religious Tolerance"
 pdl_progressive_reputation:0 "Progressive Reputation"
 pdl_protect_jewish_communities_desc:0 "Extend formal protection to Jewish merchants and craftsmen, encouraging their settlement and commercial activities in Podillia."
 pdl_protect_jewish_communities_title:0 "Protect Jewish Communities"
 pdl_rejected_demands:0 "Rejected Demands"
 pdl_rejected_reform_pressure:0 "Rejected Reform Pressure"
 pdl_religious_tolerance:0 "Religious Tolerance Policy"
 pdl_religious_tolerance_reform:0 "Confessional Balance"
 pdl_religious_tolerance_reform_desc:0 "Podillia embraces religious tolerance, honoring the Orthodox, Catholic, and Jewish traditions that have flourished in our lands. Coexistence strengthens our realm."
 pdl_revolutionary_republic_reform:0 "Revolutionary Republic"
 pdl_revolutionary_republic_reform_desc:0 "A revolutionary transformation has swept through Podillia, replacing monarchy with a elective republic. The ideals of the people triumph over noble privilege."
 pdl_steppe_masters:0 "Masters of the Steppe"
 pdl_steppe_principality_reform:0 "Steppe Principality"
 pdl_steppe_principality_reform_desc:0 "A prince now rises above the clans, establishing princely authority over the disparate tribes of the steppe. Yet the ancient traditions of the assemblies still influence governance."
 pdl_steppe_security:0 "Secured Steppes"
 pdl_steppe_warfare:0 "Steppe Warfare Mastery"
 pdl_trade_company_profits:0 "Trade Company Profits"
 pdl_trade_network_node:0 "Trade Network Node"
 pdl_trade_route:0 "Trade Route to Lviv"
 pdl_traditional_restrictions:0 "Traditional Restrictions Maintained"
 pdl_unite_with_galicia_diplo_desc:0 "Through patient diplomacy and shared cultural bonds, we have brought Galicia into our sphere of influence. The time has come to formalize this union and create a stronger, unified Ruthenian state. The Galician nobility have indicated their willingness to accept our sovereignty, provided we respect their ancient privileges and institutions."
 pdl_unite_with_galicia_diplo_title:0 "Unite with Galicia"
 pdl_unite_with_volhynia_desc:0 "Volhynia, our northern neighbor, shares deep cultural and linguistic ties with Podillia. Both regions are predominantly Ruthenian, and both have suffered under foreign domination. By integrating Volhynia into our realm, we can create a powerful Ruthenian confederation capable of defending our common interests against Polish, Lithuanian, and Turkish threats."
 pdl_unite_with_volhynia_title:0 "Integrate Volhynia"
 pdl_voivodeship_kingdom_reform:0 "Voivodeship Kingdom"
 pdl_voivodeship_kingdom_reform_desc:0 "The voivode has transformed into a true king, blending the military traditions of regional commanders with royal prerogatives. Tribal and feudal systems coexist."
 pdl_volhynian_integration:0 "Volhynian Cultural Integration"
 persecution_of_greek_catholics:0 "Persecution of Greek Catholics"
 persecution_of_heretics:0 "Persecution of Heretics"
 pl_brethren_presses:0 "The Brethren's Presses"
 pl_confederation_oath:0 "The Warsaw Confederation"
 pl_confederation_upheld:0 "The Confederation Upheld"
 pl_confession_of_the_crown:0 "Confession of the Crown"
 pl_early_catholic_stand:0 "The Crown Holds with Rome"
 pl_episcopal_schools:0 "Episcopal Schools"
 pl_jesuit_colleges:0 "The Jesuit Colleges"
 pl_magnate_confessions:0 "Magnate Confessions"
 pl_orthodox_brotherhoods:0 "Orthodox Brotherhoods"
 pl_reformation.1.a:0 "A lord answers for his own chapel"
 pl_reformation.1.b:0 "The crown will not break with Rome"
 pl_reformation.1.d:0 "Prince Radziwill has turned his Vilnius court over to the Calvinists, and his presses are already printing psalters in Polish. Half the senate follows where the great houses lead. The nobles argue that a lord answers for his own chapel and no bishop may enter his gates uninvited; the papal nuncio calls this the ruin of the realm. Neither side speaks of the Orthodox, who are watching very closely."
 pl_reformation.1.t:0 "The Magnates Change Confession"
 pl_reformation.2.a:0 "Let them print and dispute"
 pl_reformation.2.b:0 "Curb the radicals, spare the rest"
 pl_reformation.2.d:0 "A congregation at Rakow now denies the Trinity outright and holds that a Christian may bear no sword. Even the Calvinists disown them. Yet their school teaches Greek and Hebrew better than any in the realm, and their printers will set any manuscript brought to them - including, it is said, those the Orthodox brotherhoods cannot print at home."
 pl_reformation.2.t:0 "The Brethren at Rakow"
 pl_reformation.3.a:0 "Swear it, and bind the crown"
 pl_reformation.3.b:0 "No oath binds the crown in matters of faith"
 pl_reformation.3.d:0 "The assembled nobles would bind the next king by oath: that those who differ in religion keep peace among themselves, and that no man be punished in blood or goods for his confession. The bishops refuse their seals. The lords answer that a king who will not swear it will not be crowned - and that the oath covers the Greek rite no less than the Augsburg."
 pl_reformation.3.t:0 "The Warsaw Confederation"
 pl_reformation.4.a:0 "Confirm their charters"
 pl_reformation.4.b:0 "The schools belong under the bishops"
 pl_reformation.4.d:0 "While the great houses quarrel over confessions, the burghers of Lviv and Vilnius have quietly chartered brotherhoods of their own - lay guilds that keep a school, a press, and a hospital, and that answer to the patriarch rather than to the local bishop. Prince Ostrogski has endowed an academy at Ostroh on the same pattern. The bishops complain that laymen now examine their clergy."
 pl_reformation.4.t:0 "The Brotherhoods Take Their Chance"
 pl_reformation.5.a:0 "Let the colleges do their work"
 pl_reformation.5.b:0 "The Confederation still binds us"
 pl_reformation.5.d:0 "The Jesuit colleges have done in one generation what no edict could: the sons of Calvinist magnates come home speaking Latin and hearing Mass. Father Skarga preaches that there is one Church and that the Greeks stand outside it. The Protestant lords are dwindling, and the shelter their quarrel gave the Orthodox is going with them. The eastern bishops can read the season as well as anyone."
 pl_reformation.5.t:0 "The Colleges Reclaim the Sons"
 plc_cossack_allies:0 "Cossack Alliance"
 plc_cossack_rebellion:0 "Cossack Rebellion"
 plc_registered_cossacks:0 "Registered Cossacks"
 podillia_confessional_crisis:0 "Confessional Crisis"
 podillia_confessional_crisis_desc:0 "Religious tensions between Orthodox, Catholic, and Jewish communities have escalated into open conflict. Unless we can find a way to restore religious harmony, our realm risks descending into sectarian violence."
 podillia_confessional_crisis_title:0 "Confessional Crisis"
 podillia_cossack_upheaval:0 "Cossack Upheaval"
 podillia_cossack_upheaval_desc:0 "The Cossack estate has risen in rebellion, demanding greater autonomy and military leadership. Their raids and desertions threaten our ability to defend the realm."
 podillia_cossack_upheaval_title:0 "Cossack Upheaval"
 podillia_disasters.1.a:0 "We must find a path to peace."
 podillia_disasters.1.d:0 "Religious tensions have been simmering in $COUNTRY$ for years, but recent events have brought them to a boiling point. Orthodox clergy denounce Catholic influences from Poland, Catholic nobles view the Orthodox hierarchy with suspicion, and both groups increasingly persecute our Jewish communities. In Kamianets, riots broke out last week when a Catholic procession passed through the Jewish quarter. Unless we act decisively, this religious discord threatens to tear our realm apart."
 podillia_disasters.1.t:0 "The Seeds of Discord"
 podillia_disasters.11.a:0 "A hard-won peace."
 podillia_disasters.11.d:0 "Through patience, diplomacy, and occasionally force, we have finally restored religious peace to $COUNTRY$. A comprehensive settlement has been reached guaranteeing the rights of all confessions while maintaining public order. Though tensions remain, the worst of the crisis has passed."
 podillia_disasters.11.t:0 "Confessional Peace Restored"
 podillia_disasters.2.a:0 "Support the Orthodox hierarchy."
 podillia_disasters.2.b:0 "Favor the Catholic church."
 podillia_disasters.2.c:0 "Enforce separation and neutrality."
 podillia_disasters.2.d:0 "The Orthodox metropolitan and the Catholic bishop have entered into open conflict over ecclesiastical jurisdiction. Each claims authority over mixed congregations, and both have excommunicated clergy who recognize the other's authority. The nobility is divided along confessional lines, and several magnates have begun arming their retainers. This theological dispute risks becoming a civil war."
 podillia_disasters.2.t:0 "Orthodox-Catholic Confrontation"
 podillia_disasters.21.a:0 "Prepare for conflict."
 podillia_disasters.21.d:0 "Years of grievances have finally boiled over. The Cossack estate, feeling slighted by our policies and denied their rightful share of military glory and plunder, has risen in open rebellion. Cossack bands are raiding our own territories, and several hetmans have declared they no longer recognize our authority. Unless we can restore their loyalty or crush this uprising, our realm's military strength will be crippled."
 podillia_disasters.21.t:0 "The Cossacks Rise"
 podillia_disasters.22.a:0 "Accept their demands."
 podillia_disasters.22.b:0 "Refuse and suppress them."
 podillia_disasters.22.c:0 "Negotiate a compromise."
 podillia_disasters.22.d:0 "Cossack representatives have submitted a list of demands: greater autonomy in their lands, exclusive rights to certain offices, increased military funding, and a share in all war spoils. They threaten to continue their rebellion until these demands are met in full."
 podillia_disasters.22.t:0 "Cossack Demands"
 podillia_disasters.23.a:0 "Send the army against them."
 podillia_disasters.23.b:0 "Fortify our key holdings."
 podillia_disasters.23.d:0 "Cossack raiding parties have intensified their attacks on our territories. Villages are being plundered, officials are being driven out, and local nobles are either fleeing or making separate peace with the rebels. The Cossacks are demonstrating their military prowess while humiliating our authority."
 podillia_disasters.23.t:0 "Raids Intensify"
 podillia_disasters.24.a:0 "A devastating blow."
 podillia_disasters.24.d:0 "Cossack soldiers are deserting from our armies in massive numbers, taking their weapons and horses with them. Our cavalry regiments, which depended heavily on Cossack recruits, are now at a fraction of their former strength. Worst of all, these deserters are joining the rebel forces, turning our own military assets against us."
 podillia_disasters.24.t:0 "Mass Desertions"
 podillia_disasters.25.a:0 "Appoint loyal replacements."
 podillia_disasters.25.b:0 "Seek reconciliation with Cossack officers."
 podillia_disasters.25.d:0 "The Cossack uprising has created a leadership crisis within our own administration. Several officers of Cossack origin have resigned in protest, and others are suspected of secretly sympathizing with the rebels. Our ability to command and organize military operations has been severely compromised."
 podillia_disasters.25.t:0 "Leadership Crisis"
 podillia_disasters.26.a:0 "Accept his mediation."
 podillia_disasters.26.b:0 "We negotiate only from strength."
 podillia_disasters.26.d:0 "A respected Cossack hetman who has remained loyal has offered to mediate between us and the rebels. He believes he can convince the uprising's leaders to return to loyalty if we make certain concessions regarding Cossack autonomy and privileges."
 podillia_disasters.26.t:0 "Hetman's Mediation"
 podillia_disasters.27.a:0 "Grant autonomy and end this."
 podillia_disasters.27.b:0 "We will accept nothing less than full submission."
 podillia_disasters.27.d:0 "After months of conflict, the rebel leadership has sent envoys offering a compromise: they will return to loyalty if we grant them substantial autonomy and recognize their traditional rights and privileges. This would end the rebellion but at the cost of significant central authority."
 podillia_disasters.27.t:0 "Compromise Offer"
 podillia_disasters.28.a:0 "This complicates matters greatly."
 podillia_disasters.28.d:0 "Intelligence reports indicate that foreign powers are providing weapons, money, and diplomatic support to the Cossack rebels. They see our internal strife as an opportunity to weaken $COUNTRY$ and extend their influence over the Cossack hosts."
 podillia_disasters.28.t:0 "Foreign Support for Rebels"
 podillia_disasters.3.a:0 "Grant royal protection to Jews."
 podillia_disasters.3.b:0 "Allow local authorities to handle it."
 podillia_disasters.3.c:0 "Expel troublemakers from both sides."
 podillia_disasters.3.d:0 "Radical preachers have begun inciting violence against Jewish communities, accusing them of economic exploitation and religious corruption. Several synagogues have been vandalized, and Jewish merchants report increasing harassment. The Dhimmi estate appeals for royal protection, warning that without it, they may be forced to flee to more tolerant lands."
 podillia_disasters.3.t:0 "Persecution of Jewish Communities"
 podillia_disasters.31.a:0 "Order is restored."
 podillia_disasters.31.d:0 "Through force, diplomacy, or concessions, we have finally resolved the Cossack uprising. The rebel bands have been disbanded or reintegrated into our armies, and the hetmans have sworn renewed oaths of loyalty. Though scars remain, our realm's unity has been restored."
 podillia_disasters.31.t:0 "The Cossacks Return to Loyalty"
 podillia_disasters.4.a:0 "Deploy the army to restore order."
 podillia_disasters.4.b:0 "Let them exhaust themselves."
 podillia_disasters.4.d:0 "What began as isolated incidents has now escalated into widespread religious riots. In several cities, mobs have attacked churches, synagogues, and temples of rival confessions. The local militia is overwhelmed, and military intervention may be necessary to restore order."
 podillia_disasters.4.t:0 "Religious Riots Spread"
 podillia_disasters.41.a:0 "Mobilize every able-bodied man!"
 podillia_disasters.41.b:0 "Pour resources into our fortifications."
 podillia_disasters.41.c:0 "Perhaps diplomacy can avert disaster."
 podillia_disasters.41.d:0 "Reports from our southern borders grow increasingly dire. Ottoman forces, often accompanied by their Crimean vassals, have begun probing our defenses with disturbing frequency. Our border fortresses report raids nearly every month, and our people live in constant fear of the next attack. The Sultan's ambitions in the region are clear, and we must decide how to respond to this growing threat to our realm."
 podillia_disasters.41.t:0 "The Ottoman Shadow"
 podillia_disasters.42.a:0 "Pay tribute to reduce the raids."
 podillia_disasters.42.b:0 "Launch counter-raids into their territory!"
 podillia_disasters.42.c:0 "We must endure and rebuild."
 podillia_disasters.42.d:0 "The raids have escalated beyond mere border skirmishes. Entire villages in Podolia have been put to the torch, their inhabitants carried off to slave markets in Crimea and Constantinople. Our military commanders plead for resources to mount effective counter-operations, while our treasury officials warn that continued devastation will cripple our economy for years to come."
 podillia_disasters.42.t:0 "Intensifying Raids"
 podillia_disasters.43.a:0 "Better to bend than break. Accept the terms."
 podillia_disasters.43.b:0 "We bow to no foreign power!"
 podillia_disasters.43.c:0 "Counter-offer with limited concessions."
 podillia_disasters.43.d:0 "An envoy from the Crimean Khan has arrived at our court bearing an ultimatum. The Khan demands that we acknowledge Crimean overlordship, pay annual tribute, and provide military support when called upon. In exchange, he promises protection from Ottoman aggression and safe passage for our merchants through Tatar lands. Our advisors are divided on how to respond to these humiliating demands."
 podillia_disasters.43.t:0 "The Khan's Ultimatum"
 podillia_disasters.44.a:0 "Accept a full military alliance."
 podillia_disasters.44.b:0 "Accept financial aid only."
 podillia_disasters.44.c:0 "We will handle this ourselves."
 podillia_disasters.44.d:0 "News of our predicament has reached the great powers of Europe. Several nations, concerned about Ottoman expansion or seeking to gain influence in the region, have offered assistance. Some propose military alliances and troop deployments, while others offer substantial financial aid to bolster our defenses. However, such assistance always comes with strings attached."
 podillia_disasters.44.t:0 "Foreign Assistance Offered"
 podillia_disasters.45.a:0 "Grant them generous privileges."
 podillia_disasters.45.b:0 "Accept limited Cossack assistance."
 podillia_disasters.45.c:0 "We cannot afford to empower them further."
 podillia_disasters.45.d:0 "The Cossack hosts have offered their services in defending our southern borders. These fierce warriors know the steppes intimately and have proven their worth in countless battles against Tatar raiders. However, their ataman makes it clear that their assistance comes with expectations of increased autonomy, land grants, and formal recognition of Cossack privileges."
 podillia_disasters.45.t:0 "Cossack Volunteers"
 podillia_disasters.46.a:0 "Implement comprehensive military reforms."
 podillia_disasters.46.b:0 "Make modest improvements where possible."
 podillia_disasters.46.c:0 "Focus solely on strengthening our fortifications."
 podillia_disasters.46.d:0 "Our military advisors have presented a comprehensive plan for reforming our armed forces to better counter the Ottoman threat. The proposals include adopting new infantry tactics, improving cavalry training, modernizing our artillery, and overhauling our logistical systems. Such reforms would require substantial investment but could decisively shift the military balance in our favor."
 podillia_disasters.46.t:0 "Military Modernization"
 podillia_disasters.47.a:0 "Sign the treaty despite the cost."
 podillia_disasters.47.b:0 "Accept some terms, reject others."
 podillia_disasters.47.c:0 "The demands are unacceptable!"
 podillia_disasters.47.d:0 "After months of diplomatic maneuvering, Ottoman envoys have agreed to negotiate. They present terms for a lasting peace: substantial tribute, trade concessions, and recognition of Ottoman influence in the region. While the terms are costly, they would end the constant raids and allow us to focus on internal development. However, accepting such terms would be seen as submission by many of our subjects."
 podillia_disasters.47.t:0 "Path to Peace"
 podillia_disasters.48.a:0 "Launch the decisive offensive!"
 podillia_disasters.48.b:0 "Conduct a defensive campaign instead."
 podillia_disasters.48.d:0 "Our armies are finally ready. Months of preparation, training, and fortification have positioned us to launch a decisive campaign against our southern foes. Intelligence reports suggest that a coordinated offensive could break the cycle of raids permanently and secure our borders for generations. However, failure would leave us devastated and open to conquest."
 podillia_disasters.48.t:0 "The Decisive Campaign"
 podillia_disasters.5.a:0 "Grant the Church's demands."
 podillia_disasters.5.b:0 "Maintain religious plurality."
 podillia_disasters.5.d:0 "The Church estate has submitted a formal petition demanding that we recognize their confession as the sole legitimate religion in $COUNTRY$. They argue that religious pluralism is the root cause of our current instability and that only by enforcing religious unity can we restore peace. The Dhimmi estate, meanwhile, threatens to withdraw their financial support if we accede to these demands."
 podillia_disasters.5.t:0 "Estates Demand Religious Supremacy"
 podillia_disasters.51.a:0 "We have survived the storm!"
 podillia_disasters.51.d:0 "Through a combination of military strength, diplomatic skill, and fortuitous circumstances, the Ottoman threat to our realm has finally subsided. Our people can sleep soundly again, knowing that their southern borders are secure. The crisis has tested our resolve and transformed our nation, leaving us stronger and more united than before."
 podillia_disasters.51.t:0 "The Threat Recedes"
 podillia_disasters.6.a:0 "Support the moderates."
 podillia_disasters.6.b:0 "This changes nothing."
 podillia_disasters.6.d:0 "A coalition of moderate clergy from all confessions has emerged, calling for dialogue and reconciliation. They have organized interfaith councils in several cities and are working to reduce tensions through education and mutual understanding. Their efforts may provide a path toward lasting peace."
 podillia_disasters.6.t:0 "Moderate Clergy Intervene"
 podillia_disasters.61.a:0 "Support immediate emancipation."
 podillia_disasters.61.b:0 "Maintain the traditional order."
 podillia_disasters.61.c:0 "Appoint a commission to study the matter."
 podillia_disasters.61.d:0 "The debate over Jewish rights has reached a fever pitch at our court. Enlightenment ideals clash with traditional restrictions as Jewish community leaders petition for full civic equality. The nobility and clergy view such reforms with alarm, seeing them as threats to the established order. Meanwhile, our more progressive advisors argue that emancipation would unlock tremendous economic and intellectual potential. The realm stands divided, awaiting our decision."
 podillia_disasters.61.t:0 "The Emancipation Question"
 podillia_disasters.62.a:0 "Grant full citizenship rights."
 podillia_disasters.62.b:0 "Allow some limited reforms."
 podillia_disasters.62.c:0 "Reject their demands entirely."
 podillia_disasters.62.d:0 "Representatives of our Jewish communities have presented a formal petition outlining their demands. They seek the right to own land freely, practice any profession, hold public office, and live wherever they choose. The document eloquently argues that such freedoms would benefit the entire realm through increased commerce, innovation, and loyalty. However, granting these rights would overturn centuries of tradition and provoke fierce resistance from established powers."
 podillia_disasters.62.t:0 "The Petition of Rights"
 podillia_disasters.63.a:0 "Compromise to preserve noble support."
 podillia_disasters.63.b:0 "Assert royal authority over the nobles."
 podillia_disasters.63.c:0 "Seek a middle ground through negotiation."
 podillia_disasters.63.d:0 "The magnates have made their position clear through a strongly worded declaration. They view Jewish emancipation as an assault on their traditional privileges and economic dominance. Several powerful nobles threaten to withdraw their support for the crown if reforms proceed. Some speak openly of taking up arms to defend the 'natural order.' Our response will determine whether we can maintain noble loyalty while pursuing reform."
 podillia_disasters.63.t:0 "Noble Resistance"
 podillia_disasters.64.a:0 "Embrace the Enlightenment fully."
 podillia_disasters.64.b:0 "Take a balanced, moderate position."
 podillia_disasters.64.c:0 "Defend traditional values publicly."
 podillia_disasters.64.d:0 "Philosophers and intellectuals throughout the realm have entered the debate with passion. Pamphlets arguing for universal human rights circulate widely, while traditionalists counter with defenses of hierarchy and divine order. Our universities host heated debates between reformers citing Enlightenment thinkers and conservatives appealing to scripture and custom. The intellectual ferment threatens to spill over into broader social unrest if not carefully managed."
 podillia_disasters.64.t:0 "Enlightenment Principles"
 podillia_disasters.65.a:0 "Let economic benefits guide policy."
 podillia_disasters.65.b:0 "Accept the benefits with caution."
 podillia_disasters.65.c:0 "Some things matter more than gold."
 podillia_disasters.65.d:0 "Our treasury ministers present compelling evidence of the economic benefits of Jewish emancipation. They note the prosperity of cities where Jewish merchants face fewer restrictions, the innovations introduced by Jewish craftsmen and entrepreneurs, and the international trade networks that could be leveraged. Conservative voices dismiss these arguments as prioritizing profit over principle, but the numbers are difficult to ignore."
 podillia_disasters.65.t:0 "Economic Arguments"
 podillia_disasters.66.a:0 "Respect the Church's authority."
 podillia_disasters.66.b:0 "The state must lead on this issue."
 podillia_disasters.66.c:0 "Seek theological compromise."
 podillia_disasters.66.d:0 "The clergy have organized a coordinated response to the emancipation movement. Sermons across the realm warn of divine displeasure if traditional religious order is overturned. Church leaders argue that granting equality to non-believers undermines the spiritual foundation of our realm and sets a dangerous precedent. They remind us of the Church's crucial role in legitimizing our rule and maintaining social order."
 podillia_disasters.66.t:0 "The Church Responds"
 podillia_disasters.67.a:0 "Align with progressive international norms."
 podillia_disasters.67.b:0 "Balance foreign and domestic concerns."
 podillia_disasters.67.c:0 "Our internal affairs are our own!"
 podillia_disasters.67.d:0 "Foreign powers are watching our internal debate with interest. Progressive nations urge us toward emancipation, promising closer ties and favorable treatment if we adopt enlightened policies. They point to their own experiences as proof that religious tolerance and civic equality enhance rather than undermine national strength. Meanwhile, more conservative powers warn against hasty reforms that could destabilize our realm."
 podillia_disasters.67.t:0 "International Opinion"
 podillia_disasters.68.a:0 "Proclaim full and complete emancipation."
 podillia_disasters.68.b:0 "Reaffirm traditional restrictions."
 podillia_disasters.68.c:0 "Adopt a carefully balanced compromise."
 podillia_disasters.68.d:0 "After months of debate, negotiation, and sometimes conflict, the moment has come to resolve the emancipation question definitively. Our choice will shape the character of our realm for generations to come, determining whether we embrace the principles of the Enlightenment or maintain traditional hierarchies, whether we risk noble and clerical opposition for the sake of reform or preserve established power structures for the sake of stability."
 podillia_disasters.68.t:0 "The Final Decision"
 podillia_disasters.7.a:0 "Crack down on all radicals."
 podillia_disasters.7.b:0 "Focus on the most dangerous faction."
 podillia_disasters.7.d:0 "Radical factions have formed among all religious communities, each committed to the violent suppression of rival faiths. These extremists have begun organizing militias and stockpiling weapons. If we cannot dismantle these organizations, the crisis may escalate into full-scale sectarian warfare."
 podillia_disasters.7.t:0 "Radical Factions Emerge"
 podillia_disasters.71.a:0 "A new era begins for our realm."
 podillia_disasters.71.d:0 "The emancipation crisis has finally concluded. Whatever our decision, the realm can now move forward with clarity rather than continuing in divisive uncertainty. The passions aroused by the debate will take time to cool, but we have demonstrated our ability to navigate complex moral and political questions. Our handling of this crisis will be remembered as a defining moment in our nation's history."
 podillia_disasters.71.t:0 "A New Chapter"
 podillia_disasters.8.a:0 "Expel all foreign agents."
 podillia_disasters.8.b:0 "Seek foreign mediation."
 podillia_disasters.8.d:0 "Foreign powers have begun exploiting our religious crisis for their own ends. Polish emissaries are courting Catholic nobles, Russian agents are supporting Orthodox clergy, and Ottoman diplomats are offering protection to our Muslim minorities. This foreign interference threatens to transform our internal religious dispute into an international conflict."
 podillia_disasters.8.t:0 "Foreign Powers Interfere"
 podillia_events.1.a:0 "Appoint the commander"
 podillia_events.1.d:0 "Our fortifications along the Carpathian frontier require experienced commanders. A veteran officer has been recommended to oversee our garrison defenses, bringing discipline and tactical expertise to our defensive network."
 podillia_events.1.t:0 "Fortress Commander Appointment"
 podillia_events.10.a:0 "A blessing for our realm"
 podillia_events.10.d:0 "Under our protection, Jewish merchants and craftsmen have prospered in Kamianets. Their commercial networks and expertise contribute significantly to our economic development."
 podillia_events.10.t:0 "Jewish Community Prosperity"
 podillia_events.11.a:0 "Glory to our defenders!"
 podillia_events.11.d:0 "The garrison at Khotyn has held its walls through a summer siege and the besiegers have drawn off downriver. The engineers say the outer works can be repaired before the frost; the paymaster says otherwise."
 podillia_events.11.t:0 "The Khotyn Victory"
 podillia_events.12.a:0 "The steppes are secure"
 podillia_events.12.d:0 "Through military strength and diplomatic skill, we have secured our steppes against Crimean raids. The threat from the south has been contained, allowing our people to prosper in peace."
 podillia_events.12.t:0 "Crimean Threat Neutralized"
 podillia_events.2.a:0 "Implement the drill system"
 podillia_events.2.b:0 "We trust our existing methods"
 podillia_events.2.d:0 "Following Croatian defensive traditions, our military advisors propose implementing regular garrison drills. These exercises will maintain readiness and improve coordination between our fortified positions."
 podillia_events.2.t:0 "Garrison Drill Reforms"
 podillia_events.3.a:0 "Overlook their independence"
 podillia_events.3.b:0 "Discipline the raiders"
 podillia_events.3.d:0 "Cossack warriors under our banner have conducted unauthorized raids into neighboring territories. While their martial prowess is valuable, such actions complicate our diplomatic position. How should we respond?"
 podillia_events.3.t:0 "Cossack Raid Dispute"
 podillia_events.4.a:0 "Welcome the settlers"
 podillia_events.4.d:0 "Cossack families are establishing new settlements in the plains of Podillia. These communities bring military manpower and frontier resilience, strengthening our border regions."
 podillia_events.4.t:0 "Cossack Settlement Expansion"
 podillia_events.5.a:0 "Excellent news!"
 podillia_events.5.d:0 "Our cavalry has mastered the art of steppe warfare, combining speed, mobility, and tactical flexibility. These skills give us an advantage in the open plains that dominate our borderlands."
 podillia_events.5.t:0 "Steppe Warfare Tactics"
 podillia_events.6.a:0 "Allow them to compete"
 podillia_events.6.b:0 "Assert central authority"
 podillia_events.6.d:0 "Two powerful magnate families compete for influence at court. Their rivalry threatens stability but also drives economic development as each faction seeks to prove its worth. How should we manage this competition?"
 podillia_events.6.t:0 "Magnate Rivalry"
 podillia_events.7.a:0 "Support the fair"
 podillia_events.7.d:0 "Merchants from across the region gather in Kamianets for an annual trade fair. Polish, Armenian, Jewish, and Ruthenian traders exchange goods, enriching our commercial prosperity."
 podillia_events.7.t:0 "Trade Fair in Kamianets"
 podillia_events.8.a:0 "Convene the sejm"
 podillia_events.8.b:0 "Refuse their demands"
 podillia_events.8.d:0 "The magnates request a formal sejm to deliberate state affairs. Following Polish-Lithuanian traditions, this assembly would give nobles a voice in governance but may limit absolutist ambitions."
 podillia_events.8.t:0 "Magnate Sejm Convocation"
 podillia_events.9.a:0 "Encourage this cooperation"
 podillia_events.9.d:0 "Orthodox and Catholic clergy in Podillia engage in theological dialogue, seeking common ground despite doctrinal differences. Their cooperation promotes confessional peace in our diverse realm."
 podillia_events.9.t:0 "Orthodox-Catholic Dialogue"
 podillia_jewish_emancipation:0 "Jewish Emancipation Crisis"
 podillia_ottoman_menace:0 "Ottoman Menace"
 pol_army_commission:0 "Army Commission"
 pol_codify_hadiach_privileges_desc:0 "Formalise the liberties promised at Hadiach by seating subject delegations in the Sejm and sealing their charters."
 pol_codify_hadiach_privileges_title:0 "Codify Hadiach Privileges"
 pol_commonwealth_legacy:0 "Commonwealth Legacy"
 pol_frontier_commissariat:0 "Frontier Commissariat"
 pol_grain_headlands:0 "Grain Headlands"
 pol_guardian_of_frontier_desc:0 "Raise commissariats along Podolia to hold steppe raids at bay and project Polish power across the border marches."
 pol_guardian_of_frontier_title:0 "Guardian of the Frontier"
 pol_hadiach_charters:0 "Hadiach Charters"
 pol_hadiach_commission:0 "Hadiach Commission"
 pol_hadiach_commission_desc:0 "Convene Ruthenian and Cossack deputies to renegotiate the Hadiach articles, showing that our parliament honours their liberties."
 pol_hadiach_commission_title:0 "Summon the Hadiach Commission"
 pol_hussar_reform_desc:0 "Codify hussar pay, remounts, and tactics so their charges remain the terror of Europe."
 pol_hussar_reform_title:0 "Reform the Winged Hussars"
 pol_professionalize_army_desc:0 "Invest in permanent commissions that drill our regiments and curb the excesses of private magnate levies."
 pol_professionalize_army_title:0 "Professionalise the Army"
 pol_reaffirm_union_desc:0 "Renew the pact with Lithuania, binding Vilnius and Kraków into a single, resilient Commonwealth."
 pol_reaffirm_union_title:0 "Reaffirm the Union"
 pol_restore_sejm_discipline_desc:0 "Reimpose procedure on the Sejm so that liberum veto and factionalism no longer paralyse the Commonwealth."
 pol_restore_sejm_discipline_title:0 "Restore Sejm Discipline"
 pol_ruthenian_compact_desc:0 "Guarantee Ruthenian liberties while integrating their lands, tempering rebellion with real representation."
 pol_ruthenian_compact_title:0 "Ruthenian Compact"
 pol_ruthenian_pact:0 "Ruthenian Pact"
 pol_secure_grain_trade_desc:0 "Dominate the Vistula markets and Baltic entrepôts so Polish grain continues to feed the continent."
 pol_secure_grain_trade_title:0 "Secure the Grain Trade"
 pol_sejm_reform:0 "Reformed Sejm"
 pol_triatomic_commonwealth_desc:0 "Realise the tri-nation Commonwealth by binding Ruthenian lands into our administration and balancing their estates with ours."
 pol_triatomic_commonwealth_title:0 "Commonwealth of Three Nations"
 pol_triatomic_compact:0 "Compact of Three Nations"
 pol_winged_hussars:0 "Winged Hussars"
 polesian_belarus.1.a:0 "Train our troops in marsh warfare"
 polesian_belarus.1.b:0 "Conventional tactics suffice"
 polesian_belarus.1.d:0 "Our ancestors have survived for centuries in the treacherous Pripyat marshes. The wetlands that confound our enemies are our greatest ally. We could train our soldiers in these unique tactics, passing down generations of knowledge about navigating the swamps, ambushing invaders, and using the terrain to our advantage."
 polesian_belarus.1.t:0 "Marsh Warfare Traditions"
 polesian_belarus.10.a:0 "Expand Magdeburg law"
 polesian_belarus.10.b:0 "Maintain central control"
 polesian_belarus.10.d:0 "The Magdeburg rights have brought prosperity to our major cities through self-governance and merchant guilds. We could extend these privileges to more towns, fostering urban development across our realm. However, this would reduce central authority."
 polesian_belarus.10.t:0 "Magdeburg Law Expansion"
 polesian_belarus.2.a:0 "Establish the Polotsk Academy"
 polesian_belarus.2.b:0 "Provide modest support"
 polesian_belarus.2.d:0 "Polotsk was once a great center of learning, rivaling even Kyiv in prestige. The legacy of Vseslav the Sorcerer and our ancient traditions inspire intellectuals to establish a new academy. With proper support, Polotsk could once again become a beacon of Ruthenian culture and Orthodox scholarship."
 polesian_belarus.2.t:0 "Polotsk Cultural Renaissance"
 polesian_belarus.20.a:0 "Forge a modern Belarusian name and custom"
 polesian_belarus.20.b:0 "Embrace our Ruthenian heritage"
 polesian_belarus.20.c:0 "Allow both identities to coexist"
 polesian_belarus.20.d:0 "Our lands have been home to many peoples throughout history. As we unite the territories of Belarus, a fundamental question arises: what custom shall we embrace? Shall we forge a modern Belarusian national consciousness, distinct from Russians and Ukrainians? Or shall we honor our roots in the ancient Ruthenian traditions of Polotsk and the northern lands, maintaining continuity with the grandeur of Kievan Rus'? Or perhaps we should acknowledge the diversity within our realm and allow both traditions to flourish together?"
 polesian_belarus.20.t:0 "The Question of Our Name"
 polesian_belarus.3.a:0 "Support the unification movement"
 polesian_belarus.3.b:0 "We are content with our current borders"
 polesian_belarus.3.d:0 "Across the lands of Polotsk, Minsk, Turov, and Vitebsk, a common sentiment grows: we are one people, bound by shared language, culture, and history. Though we have been divided by foreign powers, the dream of a united Belarus persists. Shall we champion this cause?"
 polesian_belarus.3.t:0 "Belarusian Unity Movement"
 polesian_belarus.4.a:0 "Invest in the trade fair"
 polesian_belarus.4.b:0 "Make a modest investment"
 polesian_belarus.4.d:0 "Minsk sits at the crossroads of major trade routes connecting Vilnius, Smolensk, Polotsk, and Kyiv. Merchants from across Eastern Europe gather here. By investing in trade infrastructure and establishing a permanent trade fair, we could dramatically increase Minsk's commercial importance."
 polesian_belarus.4.t:0 "Minsk Trade Fair"
 polesian_belarus.5.a:0 "Support the bishopric generously"
 polesian_belarus.5.b:0 "Limit church influence"
 polesian_belarus.5.d:0 "The ancient bishopric of Turov has served as a spiritual center for centuries. The bishop requests greater support to restore Turov's ecclesiastical prestige and expand the cathedral. This would increase our religious authority throughout the region."
 polesian_belarus.5.t:0 "Turov Episcopal Authority"
 polesian_belarus.6.a:0 "Expand trade infrastructure"
 polesian_belarus.6.b:0 "Focus on craft production"
 polesian_belarus.6.d:0 "Vitebsk commands the strategic Western Dvina trade route connecting us to Riga and the Baltic Sea. By expanding our port facilities and trade infrastructure along the Dvina, we could transform Vitebsk into the premier commercial hub of northern Belarus."
 polesian_belarus.6.t:0 "Vitebsk Dvina Trade"
 polesian_belarus.7.a:0 "Fortify the eastern border"
 polesian_belarus.7.b:0 "Seek diplomatic resolution"
 polesian_belarus.7.d:0 "Mstislavl has always been a contested borderland between Belarus and Russia. Skirmishes with our eastern neighbors grow more frequent. Our military advisors recommend strengthening Mstislavl's defenses and establishing a permanent border guard."
 polesian_belarus.7.t:0 "Mstislavl Border Conflict"
 polesian_belarus.8.a:0 "Embrace the Lithuanian legacy"
 polesian_belarus.8.b:0 "Emphasize our a name of our own"
 polesian_belarus.8.d:0 "For centuries, our lands were part of the Grand Duchy of Lithuania. While we have established our independence, the Lithuanian legal codes, administrative traditions, and cultural influences remain valuable. Should we embrace this shared heritage?"
 polesian_belarus.8.t:0 "Lithuanian-Belarusian Cultural Synthesis"
 polesian_belarus.9.a:0 "Develop the timber trade"
 polesian_belarus.9.b:0 "Preserve our forests"
 polesian_belarus.9.d:0 "The vast forests and marshes of Polesia contain immense timber resources. By developing a river flotilla to transport logs down the Pripyat to the Dnieper, we could establish a profitable timber trade. However, some worry about over-exploitation of our forests."
 polesian_belarus.9.t:0 "Polesian Timber Economy"
 polesian_endurance:0 "Polesian Endurance"
 polesian_endurance_desc:0 "Centuries of subsisting in harsh wetlands have bred a hardy, self-reliant population. We can sustain low-intensity warfare indefinitely, wearing down wealthier but less resilient enemies."
 polesian_marsh_tactics:0 "Marsh Warfare Tactics"
 polesian_marsh_warfare:0 "Polesian Marsh Warfare"
 polesian_mysticism:0 "Polesian Mysticism"
 polesian_mysticism_desc:0 "Ancient pagan traditions survive beneath the veneer of Orthodox Christianity. Our folk magic and nature worship create a unique custom and speech that resists foreign assimilation."
 polesian_nation_desc:0 "The wetlands of the Pripyat basin have bred a unique Polesian people. By uniting Turov, Mozyr, and Pinsk, we can establish an independent Polesian state that uses the marshes as our greatest defense."
 polesian_nation_title:0 "Form Polesia"
 polesian_river_raids:0 "Polesian River Raids"
 polesian_timber_trade:0 "Timber Trade"
 polkovo_sotennyi_system:0 "Polkovo-Sotennyi System"
 polotsk_independence:0 "Polotsk Independence"
 polotsk_independence_desc:0 "For centuries we have resisted domination by Kyiv, Novgorod, Lithuania, and Moscow. This proud tradition of autonomy defines our national character."
 polotsk_nation_desc:0 "The ancient principality of Polotsk once rivaled Kyiv itself. Vseslav the Sorcerer defended our independence for decades. By controlling the Dvina trade route, we can restore Polotsk's historic glory."
 polotsk_nation_title:0 "Restore Polotsk"
 polotsk_renaissance:0 "Polotsk Renaissance"
 polotsk_sophia:0 "St. Sophia Cathedral"
 polotsk_sophia_desc:0 "Built 1044-1066, our St. Sophia Cathedral symbolizes Polotsk's independence from Kyiv. This ecclesiastical autonomy enhances our prestige and cultural authority."
 pomestie_system_defense:0 "Pomestie System"
 por_base_sprite_pack:0 "Portugal Unit Pack"
 post_poltava_repression:0 "Post-Poltava Repression"
 post_poltava_repression_desc:0 "After our defeat at Poltava, Russia tightens its grip on the Hetmanate."
 preparing_dniester_campaign:0 "Preparing Dniester Campaign"
 preserve_eastern_rite_decision_desc:0 "We can formally commit to preserving Orthodox liturgical traditions within our union with Rome."
 preserve_eastern_rite_decision_title:0 "Preserve Eastern Rite Traditions"
 princedom_is_our:0 "$NAME|Y$ is our principality."
 princedom_long_desc:0 "A Rus fief subject. The princedom enjoys autonomy while still being a subject, but it comes at a high cost in terms of tax and levy. It must fight alongside its master, and it is never allowed to rebel."
 princedom_title:0 "Princedom"
 princedom_title_plural:0 "Princedoms"
 princes:0 "Princes"
 princes_desc:0 "The princes emphasize vassal networks, prestige, and diplomacy."
 princes_revolt.0a:0 "Interesting."
 princes_revolt.0d:0 "The goal of Kyiv, as the capital of Rus, is to restore its former glory. Will it succeed, or will it fall to the ambitions of its rivals?"
 princes_revolt.0t:0 "There is Kyiv"
 princes_revolt.1a:0 "Meet the princes face to face."
 princes_revolt.1b:0 "It's just a matter of time."
 princes_revolt.1d:0 "Finally, a skirmish broke out between the princes of Lithuania and the princes of Rus' after prolonged disputes between them, which led to other princes forming a broad coalition to wage war. Our dukes only need a formal declaration of war to start a war."
 princes_revolt.1t:0 "Uprising of the Principalities"
 princes_revolt.2a:0 "Rebels Win"
 princes_revolt.2d:0 "The princes have revolted against our rule, challenging our authority."
 princes_revolt.2t:0 "Disorderly Princes"
 princes_revolt.3a:0 "We won!"
 princes_revolt.3d:0 "We have conquered the capital of Lithuania, greatly disrupting the ranks of the enemy. This is an excellent time to demand peace."
 princes_revolt.3t:0 "Occupation of Vilnius"
 principality_appanage:0 "Appanage Principality"
 principality_appanage_desc:0 "Lands in Rus were owned by individual princes."
 pripyat_heartland:0 "Pripyat Heartland"
 pripyat_heartland_desc:0 "Turov controls the strategic center of the Pripyat river basin. This waterway connects us to the Dnieper and grants commercial influence over wetland trade."
 pripyat_river_trade:0 "Pripyat River Trade"
 pripyat_river_trade_desc:0 "The Pripyat flows into the Dnieper, connecting us to the Black Sea trade routes. Our timber flotillas carry forest goods downstream, while we maintain a modest but strategic river navy."
 prl_ancient_bulwark:0 "Ancient Bulwark of Kyivan Rus'"
 prl_ancient_bulwark_desc:0 "Founded in 993 by Grand Prince Volodymyr, Pereiaslav has stood for centuries as the southern shield of Rus' against steppe invaders. Our fortress walls remember the sieges of Pechenegs, Cumans, and Tatars, and our garrison traditions stretch back to the age of Volodymyr Monomakh."
 prl_ancient_principality_reform:0 "Ancient Rus' Principality"
 prl_ancient_principality_reform_desc:0 "Pereiaslav inherits the traditions of the great princes of Kyivan Rus'. From Volodymyr the Great who founded our city in 993, through Volodymyr Monomakh who ruled with wisdom and strength, to Yuriy Dolgorukiy who expanded Rus' eastward—our princely lineage stretches back to the golden age. We govern not as upstart Cossack colonels, but as legitimate heirs to a thousand years of Orthodox statecraft."
 prl_border_defenses_desc:0 "For centuries, Pereiaslav stood as the southern bulwark of Rus' against nomadic invaders. We must strengthen our fortifications to continue this proud defensive tradition."
 prl_border_defenses_title:0 "Fortify the Southern Frontier"
 prl_border_fortress_reform:0 "Border Fortress Command"
 prl_border_fortress_reform_desc:0 "For centuries, Pereiaslav has stood as the southern shield of Rus' civilization against steppe barbarians. Our walls have endured Pecheneg sieges, Cuman raids, and Tatar invasions. Every generation of our garrison learns from the last: how to stretch supplies during a blockade, where to place artillery for maximum effect, when to sortie and when to endure. Our fortress traditions are written in stone and blood."
 prl_brotherhood_schools:0 "Brotherhood Schools"
 prl_brotherhood_schools_desc:0 "Education is the key to preserving Orthodox custom and speech. Brotherhood schools teach literacy, theology, and statecraft, producing enlightened clergy and administrators."
 prl_brotherhood_schools_title:0 "Establish Brotherhood Schools"
 prl_build_army_desc:0 "The ancient Pereiaslav principality has always relied on strong military forces to defend against steppe raids. We must rebuild our regimental strength and prepare for the challenges ahead."
 prl_build_army_title:0 "Muster the Pereiaslav Regiment"
 prl_central_command:0 "Central Command"
 prl_chernozem_development_desc:0 "The rich black earth surrounding Pereiaslav is legendary for its fertility. By systematically developing these lands, we can create an agricultural powerhouse that feeds armies and fills treasuries."
 prl_chernozem_development_title:0 "Cultivate the Chernozem Lands"
 prl_chernozem_economy_reform:0 "Chernozem Agricultural Administration"
 prl_chernozem_economy_reform_desc:0 "The rich black earth of the Pereiaslav region produces grain harvests that overflow our granaries. By organizing our economy around systematic exploitation of these fertile lands—improved crop rotations, tax collection keyed to harvest cycles, state granaries that stabilize prices—we transform agricultural abundance into state power. Let other lands struggle with poor soil; Pereiaslav's chernozem will feed armies and fill treasuries."
 prl_chernozem_granary:0 "Chernozem Granary of the Left Bank"
 prl_chernozem_granary_desc:0 "The rich black earth surrounding Pereiaslav yields harvests that feed armies and fill treasuries. Our grain stores overflow while neighboring lands struggle with famine, making our region the breadbasket of the Hetmanate."
 prl_consolidate_left_bank_desc:0 "The lands east of the Dnieper once belonged to our princes. We must reunite these territories under Pereiaslav's banner and restore the ancient principality's boundaries."
 prl_consolidate_left_bank_title:0 "Consolidate the Left Bank"
 prl_defiant_council:0 "Defiant Council"
 prl_diplomatic_network:0 "Diplomatic Network"
 prl_diplomatic_prestige_desc:0 "The council made our town a place where crowns send envoys. Let us keep the chancery, the interpreters and the lodgings that make it convenient to negotiate here rather than elsewhere."
 prl_diplomatic_prestige_title:0 "Establish Diplomatic Prestige"
 prl_diplomatic_tradition:0 "Diplomatic Tradition"
 prl_elite_regiment:0 "Elite Regiment"
 prl_enlightened_clergy:0 "Enlightened Clergy"
 prl_episcopal_authority:0 "Episcopal See and Orthodox Brotherhoods"
 prl_episcopal_authority_desc:0 "Pereiaslav's ancient episcopal see is a pillar of Orthodox Christianity in the region. We must empower the church and ensure that spiritual authority reinforces temporal power."
 prl_episcopal_authority_reform:0 "Episcopal Orthodox Authority"
 prl_episcopal_authority_reform_desc:0 "Pereiaslav's ancient episcopal see makes our city a pillar of Orthodox Christendom. Our bishops trace their consecration back to the Metropolitan of Kyiv, our monasteries preserve the wisdom of the Church Fathers, and our brotherhoods maintain schools that teach the faithful to read scripture in their own tongue. By centering governance on ecclesiastical institutions, we ensure that spiritual authority reinforces temporal power."
 prl_episcopal_authority_title:0 "Strengthen the Episcopal See"
 prl_flavor.1.a:0 "Swear the oath to the Tsar"
 prl_flavor.1.b:0 "We stand alone"
 prl_flavor.1.d:0 "War with the Commonwealth has drained our strength. In Pereiaslav, the regimental rada debates whether to seek the Tsar's protection or to stand alone. The decision will define our autonomy for generations."
 prl_flavor.1.t:0 "The Pereiaslav Council"
 prl_flavor.2.a:0 "Codify the sotnya statutes"
 prl_flavor.2.b:0 "Strengthen the hetman's command"
 prl_flavor.2.d:0 "The Pereiaslav Regiment has grown into a political force. Some demand a written statute to codify the elected sotnya councils, while others argue the hetman must command with a firmer hand."
 prl_flavor.2.t:0 "The Pereiaslav Regiment"
 prl_flavor.3.a:0 "Fund the brotherhood schools"
 prl_flavor.3.b:0 "Support the monasteries instead"
 prl_flavor.3.d:0 "Orthodox brotherhoods petition the council to expand schools and scriptoria in Pereiaslav. Funding them would raise literacy and administrative talent, while endowing monasteries would deepen piety and charity."
 prl_flavor.3.t:0 "Brotherhood Schools of Pereiaslav"
 prl_flavor.4.a:0 "Establish a customs office"
 prl_flavor.4.b:0 "Keep the crossings open"
 prl_flavor.4.d:0 "Merchants crowd the fords at Pereiaslav. A customs office could enrich the treasury, but open crossings build goodwill and encourage commerce."
 prl_flavor.4.t:0 "Trubizh River Tolls"
 prl_fortified_borders:0 "Fortified Borders"
 prl_fortress_city:0 "Fortress City of Pereiaslav"
 prl_grain_exports:0 "Organized Grain Exports"
 prl_grain_prosperity:0 "Chernozem Prosperity"
 prl_grain_trade_desc:0 "Our surplus grain must flow to markets across the region. By building workshops and organizing export channels, we transform agricultural wealth into state revenue."
 prl_grain_trade_title:0 "Organize the Grain Trade"
 prl_granary_capital:0 "Granary Capital"
 prl_great_power_alliance_desc:0 "Like Bohdan Khmelnytsky before us, we must navigate the complex world of great power politics. Whether through alliance or vassalage, we need a powerful protector to survive."
 prl_great_power_alliance_title:0 "Secure Great Power Protection"
 prl_industrial_base:0 "Industrial Development"
 prl_left_bank_hegemony:0 "Left Bank Hegemony"
 prl_left_bank_secured:0 "Left Bank Secured"
 prl_manufactories_desc:0 "To move beyond simple grain exports, we must invest in manufactories that process our raw materials into finished goods, creating lasting prosperity."
 prl_manufactories_title:0 "Build Manufactories"
 prl_military_campaigns_desc:0 "A professional army must prove itself in battle. Through systematic conquest and expansion, we demonstrate that Pereiaslav is not merely a defensive principality but an offensive power."
 prl_military_campaigns_title:0 "Launch Military Campaigns"
 prl_military_dominance:0 "Military Dominance"
 prl_military_expansion:0 "Military Expansion"
 prl_military_supremacy_desc:0 "The ultimate goal: a military so powerful that no neighbor dares challenge us. Large armies, elite troops, and strong traditions make Pereiaslav invincible."
 prl_military_supremacy_title:0 "Achieve Military Supremacy"
 prl_monasteries_desc:0 "Orthodox monasteries and brotherhoods preserve learning, provide charity, and maintain the faith. By building temples and supporting these institutions, we strengthen society's spiritual foundation."
 prl_monasteries_title:0 "Support Monasteries and Brotherhoods"
 prl_monastic_network:0 "Monastic Network"
 prl_monastic_patronage:0 "Monastic Patronage"
 prl_open_crossings:0 "Open River Crossings"
 prl_orthodox_beacon:0 "Orthodox Beacon"
 prl_orthodox_center:0 "Orthodox Center"
 prl_orthodox_leadership_desc:0 "Pereiaslav can emerge as a leading center of Orthodox Christianity, rivaling even Kyiv in spiritual authority and cultural influence across the Ruthenian lands."
 prl_orthodox_leadership_title:0 "Become an Orthodox Beacon"
 prl_princely_legacy:0 "Legacy of the Pereiaslavl Princes"
 prl_princely_legacy_desc:0 "We are heirs to the great princes who once ruled from Pereiaslav: Svyatoslav the Brave, Vsevolod the Wise, Volodymyr Monomakh, and Yuriy Dolgorukiy. Their glory sanctifies our cause, and their legitimacy flows through our veins."
 prl_professional_army_desc:0 "Beyond elective councils and elected officers, we need systematic training, experienced advisors, and military professionalism to compete with great power armies."
 prl_professional_army_title:0 "Professionalize the Regiment"
 prl_regimental_muster:0 "Regimental Muster"
 prl_regimental_organization_desc:0 "The Pereiaslav Regiment's strength lies in its sotnya units—companies of Cossacks led by elected centurions. We must perfect this organization to create a professional military force."
 prl_regimental_organization_title:0 "Organize the Sotnya System"
 prl_regimental_republic_reform:0 "Pereiaslav Regimental Republic"
 prl_regimental_republic_reform_desc:0 "The Pereiaslav Regiment organizes its government through elective councils. Centurions (sotnyky) are elected by their companies, the regimental colonel (polkovnyk) serves at the pleasure of the assembly, and major decisions pass through the regimental rada. While this system sacrifices the authority of absolute rule, it produces officers who command genuine loyalty and soldiers who fight for their homeland rather than a distant crown."
 prl_regimental_sotnya:0 "Pereiaslav Regimental Sotnya System"
 prl_regimental_sotnya_desc:0 "The Pereiaslav Regiment organizes its forces into elective sotnia units, where centurions are elected by their men and military councils debate strategy. This system produces disciplined yet motivated warriors who fight for their homeland and their chosen commanders."
 prl_regional_hegemony_desc:0 "Through military strength, economic prosperity, and diplomatic skill, Pereiaslav can become the dominant power of the Left Bank, commanding respect from Kyiv to Moscow."
 prl_regional_hegemony_title:0 "Establish Left Bank Hegemony"
 prl_river_control:0 "River Crossing Control"
 prl_river_flotilla_desc:0 "Control of the Dnieper and Trubizh river crossings has always been key to Pereiaslav's strategic power. A strong river flotilla will secure our commercial and military interests."
 prl_river_flotilla_title:0 "Command the River Crossings"
 prl_russian_protection:0 "Russian Protection"
 prl_sotnya_statute:0 "Sotnya Statute"
 prl_sotnya_system:0 "Sotnya System"
 prl_trade_dominance_desc:0 "The Dnieper river carries commerce between Kyiv and the Black Sea. We must establish Pereiaslav as the dominant power controlling this vital trade route."
 prl_trade_dominance_title:0 "Dominate Dnieper Commerce"
 prl_trade_hub:0 "Dnieper Trade Hub"
 prl_treaty_diplomacy_reform:0 "Treaty Diplomacy Tradition"
 prl_treaty_diplomacy_reform_desc:0 "Since the hetman swore the articles here, Pereiaslav has kept a chancery used to treaty work: clerks who know the forms, interpreters, and a church large enough for an oath-taking."
 prl_treaty_legacy:0 "Legacy of the Pereiaslav Council"
 prl_treaty_legacy_desc:0 "The council at Pereiaslav met in our town, and the articles were sworn in our church. Envoys have come here for treaties ever since, which is worth something to the chancery and rather less to the townsmen."
 prl_treaty_protection:0 "Treaty Protection"
 prl_trubizh_crossings:0 "Trubizh River Crossings and Dnieper Trade"
 prl_trubizh_crossings_desc:0 "Control of the vital river fords at Pereiaslav gives us leverage over all trade flowing between Kyiv and the Left Bank. Merchants pay customs, armies pay tolls, and our coffers grow fat on the commerce that must pass through our gates."
 prl_trubizh_tolls:0 "Trubizh Tolls"
 prl_vassal_management_desc:0 "True diplomatic skill lies not just in making treaties, but in managing complex relationships with subjects and overlords. We must demonstrate our expertise in this delicate art."
 prl_vassal_management_title:0 "Master Vassal Relations"
 proclaim_orthodox_empire_decision_desc:0 "We can formally proclaim our empire as the Orthodox Empire, leader of true faith."
 proclaim_orthodox_empire_decision_title:0 "Proclaim Orthodox Empire"
 protected_from_raids:0 "Protected from Raids"
 province_heavily_raided:0 "Province Heavily Raided"
 province_raided:0 "Province Raided"
 provincial_uniate_resistance:0 "Provincial Uniate Resistance"
 pru_base_sprite_pack:0 "Prussia Unit Pack"
 prussian_republic_desc:0 "A unique blend of republican governance with Prussian military efficiency and discipline."
 qasim_khanate.1.a:0 "Establish the Qasim Khanate as our vassal"
 qasim_khanate.1.b:0 "We need no puppet khanate"
 qasim_khanate.1.d:0 "Following our recent conflicts with Kazan, Qasim, a prince of the Kazani royal house, has fled to our court seeking protection. He offers to establish a loyal Tatar khanate under our protection if we grant him lands and military support. This 'Qasim Khanate' could serve multiple purposes: a buffer against raids, a source of skilled cavalry, and most importantly, a rival claimant to the throne of Kazan that we can use to justify future interventions. However, hosting a rival khan may provoke Kazan's hostility."
 qasim_khanate.1.t:0 "Foundation of the Qasim Khanate"
 qasim_khanate.2.a:0 "Support the claim with military force"
 qasim_khanate.2.b:0 "Apply diplomatic pressure only"
 qasim_khanate.2.c:0 "Restrain our vassal for now"
 qasim_khanate.2.d:0 "Our vassal, the Khan of Qasim, has petitioned for our support in pressing his claim to the throne of Kazan. As a prince of the Kazani royal house, he has legitimate grounds to challenge the current khan. Supporting his claim would give us a pretext for war and potentially place a loyal ruler on Kazan's throne. However, such aggression may alarm our neighbors and strain our resources."
 qasim_khanate.2.t:0 "The Qasim Khan's Ambition"
 qasim_khanate.3.a:0 "Install the Qasim Khan as ruler of Kazan"
 qasim_khanate.3.b:0 "Annex Kazan directly into our realm"
 qasim_khanate.3.d:0 "With Kazan conquered, we must decide its future. We could install our loyal Qasim vassal as Khan of Kazan, creating a large but dependent Tatar khanate under our control. This would please our Tatar subjects and provide a buffer state. Alternatively, we could annex Kazan directly, bringing its wealth and population under our direct administration but risking resentment from the Qasim Khan who expected to rule these lands."
 qasim_khanate.3.t:0 "The Fate of Conquered Kazan"
 qasim_khanate.4.a:0 "Integrate the khanate into our state"
 qasim_khanate.4.b:0 "Maintain them as a loyal vassal"
 qasim_khanate.4.d:0 "The Qasim Khanate has served faithfully as our vassal for many years. Its rulers have become thoroughly integrated into our court, their nobility intermarries with Russian families, and their military serves in our campaigns. The question arises whether to formally integrate this khanate into our realm or maintain it as a distinct but loyal vassal state. Integration would simplify administration but end a useful diplomatic fiction."
 qasim_khanate.4.t:0 "The Future of the Qasim Khanate"
 qasim_khanate.5.a:0 "Grant them lands and welcome their service"
 qasim_khanate.5.b:0 "We need no Muslim settlers"
 qasim_khanate.5.d:0 "A group of Tatars, fleeing conflicts in the eastern steppes, have petitioned for permission to settle in our eastern territories. These 'Lipka Tatars' are Muslims who have already served various Christian rulers and are experienced in both warfare and administration. They offer to provide military service, particularly cavalry, in exchange for land grants and religious tolerance. Their settlement would strengthen our borders and provide elite cavalry, though it may concern our Orthodox subjects."
 qasim_khanate.5.t:0 "The Lipka Tatars Seek Settlement"
 qasim_khanate.6.a:0 "Grant formal privileges to the Lipka Tatars"
 qasim_khanate.6.b:0 "Maintain current informal arrangements"
 qasim_khanate.6.d:0 "The Lipka Tatars who settled in our lands have proven themselves loyal and capable warriors. Their cavalry has distinguished itself in numerous campaigns, and their nobility has integrated well into our social structure while maintaining their Muslim faith. They now seek formal recognition of their privileges and guarantees of religious freedom in exchange for continued military service. Granting these privileges would secure their loyalty for generations."
 qasim_khanate.6.t:0 "The Lipka Tatars' Loyalty"
 qasim_khanate_capital:0 "Qasim Khanate Capital"
 qasim_khanate_capital_desc:0 "This city serves as the capital of the Qasim Khanate, a Tatar vassal state providing cavalry strength and legitimacy."
 qasim_khanate_vassal:0 "Qasim Khanate Vassal"
 qasim_khanate_vassal_desc:0 "The Qasim Khanate serves as our loyal Tatar vassal, providing cavalry strength and legitimacy in dealings with other Tatar states."
 raid_flotilla_preparation:0 "Preparing Raid Flotilla"
 raid_mechanics.1.a:0 "Prepare a major raid"
 raid_mechanics.1.b:0 "Organize minor raids"
 raid_mechanics.1.c:0 "Focus on border defense"
 raid_mechanics.1.d:0 "Spring has arrived, and with it the traditional raiding season. Our warriors are eager to raid enemy territory for plunder, glory, and captives. Shall we prepare a major expedition, or focus on defense this year?"
 raid_mechanics.1.t:0 "Spring Raiding Season"
 raid_mechanics.10.a:0 "Raid wealthy provinces (high risk/reward)"
 raid_mechanics.10.b:0 "Raid border provinces (moderate risk)"
 raid_mechanics.10.c:0 "Raid for slaves and livestock"
 raid_mechanics.10.d:0 "Our raiders are assembled and ready. Should we target wealthy provinces deep in enemy territory, safer border regions, or focus on specific objectives like slaves or livestock?"
 raid_mechanics.10.e:0 "Cancel the raid"
 raid_mechanics.10.t:0 "Choose Raid Target"
 raid_mechanics.11.a:0 "A profitable expedition"
 raid_mechanics.11.d:0 "Our raiders have returned with modest plunder and a few captives. While not a spectacular success, the raid has enriched our treasury and boosted our warriors' morale."
 raid_mechanics.11.t:0 "Successful Minor Raid"
 raid_mechanics.12.a:0 "A disappointing outcome"
 raid_mechanics.12.d:0 "Our raiding party encountered stiff resistance and was forced to retreat with minimal gains. This setback has embarrassed our warriors and damaged our prestige."
 raid_mechanics.12.t:0 "Minor Raid Fails"
 raid_mechanics.2.a:0 "Send spies to scout enemy territory"
 raid_mechanics.2.a.tt:0 "Better chance of raid success"
 raid_mechanics.2.b:0 "Rely on local informants"
 raid_mechanics.2.b.tt:0 "Normal raid chances"
 raid_mechanics.2.c:0 "No time for reconnaissance"
 raid_mechanics.2.c.tt:0 "Higher risk of failure or ambush"
 raid_mechanics.2.d:0 "Before launching our raid, we should gather intelligence on enemy defenses and troop movements. Shall we send spies, rely on local informants, or proceed without reconnaissance?"
 raid_mechanics.2.t:0 "Reconnaissance Reports"
 raid_mechanics.20.a:0 "A legendary raid!"
 raid_mechanics.20.d:0 "Our raid has exceeded all expectations! Our warriors penetrated deep into enemy territory, sacked wealthy settlements, and returned with enormous plunder. Songs will be sung of this raid for generations!"
 raid_mechanics.20.t:0 "Spectacular Raid Success!"
 raid_mechanics.21.a:0 "Well done!"
 raid_mechanics.21.d:0 "Our raiders have successfully struck enemy border provinces, bringing back substantial plunder and captives. This victory boosts our prestige and enriches our coffers."
 raid_mechanics.21.t:0 "Successful Raid"
 raid_mechanics.22.a:0 "Acceptable results"
 raid_mechanics.22.d:0 "Our raid achieved modest success, bringing back some plunder and livestock. While not spectacular, it was a profitable venture that boosts our warriors' confidence."
 raid_mechanics.22.t:0 "Modest Raid Success"
 raid_mechanics.30.a:0 "A terrible defeat"
 raid_mechanics.30.d:0 "Our raid has ended in disaster. Enemy forces intercepted our raiders, inflicting heavy casualties and forcing a humiliating retreat. This defeat damages our military reputation and warrior morale."
 raid_mechanics.30.t:0 "Raid Ends in Disaster"
 raid_mechanics.31.a:0 "A catastrophic failure"
 raid_mechanics.31.d:0 "Our raiding party walked into a trap! Enemy forces were waiting in ambush and inflicted devastating casualties. Few raiders escaped to tell the tale. This is a humiliating defeat that will embolden our enemies."
 raid_mechanics.31.t:0 "Raiders Ambushed!"
 raid_mechanics.40.a:0 "A profitable, if controversial, raid"
 raid_mechanics.40.d:0 "Our raiders have captured hundreds of slaves in enemy territory. These captives will fetch high prices in the slave markets of Caffa and Constantinople, enriching our treasury. However, this raid will outrage Christian powers."
 raid_mechanics.40.t:0 "Slave Raid Success"
 raid_mechanics.41.a:0 "Excellent plunder!"
 raid_mechanics.41.d:0 "Our raiders have driven off thousands of horses, cattle, and sheep from enemy pastures. This livestock will enrich our herds and strengthen our cavalry forces."
 raid_mechanics.41.t:0 "Livestock Raid Success"
 raid_mechanics.42.a:0 "Launch the chaiky raid!"
 raid_mechanics.42.b:0 "Too risky this year"
 raid_mechanics.42.d:0 "Our Cossack mariners propose a chaiky raid against Ottoman coastal settlements. Using small, fast boats, they can strike enemy ports and return before Ottoman galleys can respond. Shall we approve this daring expedition?"
 raid_mechanics.42.t:0 "Chaiky Naval Raid Opportunity"
 raid_mechanics.43.a:0 "Launch marsh guerrilla raids"
 raid_mechanics.43.b:0 "Focus on peaceful pursuits"
 raid_mechanics.43.d:0 "Our warriors propose using the marshes as base for guerrilla raids into enemy territory. Our knowledge of marsh routes will allow us to strike and vanish before enemy forces can respond."
 raid_mechanics.43.t:0 "Marsh Raid Opportunity"
 raid_mechanics.50.a:0 "We will have revenge!"
 raid_mechanics.50.d:0 "Enemy raiders have struck deep into our territory, sacking settlements and driving off livestock and captives. This brazen attack demands response!"
 raid_mechanics.50.t:0 "Our Territory Raided!"
 raid_mechanics.51.a:0 "A brilliant victory!"
 raid_mechanics.51.d:0 "Our forces ambushed enemy raiders, catching them laden with plunder. We inflicted heavy casualties and recovered much of the stolen goods. This victory boosts our military prestige!"
 raid_mechanics.51.t:0 "Ambush Success!"
 raid_mechanics.52.a:0 "This is an outrage!"
 raid_mechanics.52.d:0 "Enemy slavers have raided our provinces, carrying off hundreds of our people into captivity! This outrage demands strong response. Our people cry for justice and revenge!"
 raid_mechanics.52.t:0 "Slave Raid on Our Territory!"
 raid_mechanics.53.a:0 "Those damned Cossacks!"
 raid_mechanics.53.d:0 "Cossack chaiky raiders have struck our coastal settlements! Using small boats, they evaded our galleys, sacked ports, and escaped across the Black Sea. This humiliating raid damages our prestige."
 raid_mechanics.53.t:0 "Cossack Chaiky Raid!"
 raid_mechanics.60.a:0 "Build fortifications"
 raid_mechanics.60.b:0 "Organize mobile patrols"
 raid_mechanics.60.c:0 "Accept raids as reality"
 raid_mechanics.60.d:0 "We have suffered repeated raids on our territory. Should we invest in border fortifications, organize mobile patrols, or accept raids as unavoidable reality?"
 raid_mechanics.60.t:0 "Strengthen Border Defenses?"
 raid_mechanics.61.a:0 "Launch counter-raid"
 raid_mechanics.61.b:0 "Diplomatic pressure"
 raid_mechanics.61.c:0 "Do nothing"
 raid_mechanics.61.d:0 "After suffering enemy raids, our commanders propose a punitive counter-raid into enemy territory. This would restore our prestige and discourage future raids. Alternatively, we could pursue diplomatic solutions."
 raid_mechanics.61.t:0 "Counter-Raid Opportunity"
