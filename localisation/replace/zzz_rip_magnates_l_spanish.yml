l_spanish:

# Carried English until a translator takes it. Source: rip_magnates_l_english.yml

 # --- the magnate estate

 estate_magnates:0 "Magnates"
 estate_magnates_desc:0 "Two dozen families hold more land between them than the crown does, keep private banners larger than some royal armies, and treat a starostwo as an inheritance rather than an office. They are the reason the Commonwealth can raise a war and the reason it cannot finish one."
 magnates_loyalty_modifier:0 "Magnate Loyalty"
 magnates_influence_modifier:0 "Magnate Influence"
 magnates_privilege_slots:0 "Magnate Max Privileges"

 rip_est_magnates_latifundia:0 "Five Ruthenian latifundia in our hands"
 rip_est_magnates_the_offices_are_ours:0 "The offices are kept for our own families"
 rip_est_magnates_the_crown_presses:0 "The crown reaches for absolute power"

 # --- their privileges

 estate_magnates_land_rights:0 "Latifundia of the Magnates"
 estate_magnates_land_rights_desc:0 "The great families hold their estates outright, judge on them, and are asked for nothing but their presence at the diet. It buys a decade of quiet and costs the crown the tenth part of the realm."
 estate_magnates_folwarks:0 "The Folwark Economy"
 estate_magnates_folwarks_desc:0 "Grain is grown for the Vistula barges rather than for the district, and the labour that grows it owes days rather than rent. The ledgers improve every year. So does the number of people walking east to the steppe."
 estate_magnates_private_banners:0 "Private Banners"
 estate_magnates_private_banners_desc:0 "Each great house keeps its own horse, its own guns and its own colonel, and brings them when it is asked politely enough. It is the best cavalry in Europe and it belongs to somebody else."
 estate_magnates_supremacy_over_szlachta:0 "Supremacy Over the Szlachta"
 estate_magnates_supremacy_over_szlachta_desc:0 "The lesser nobility keep their golden liberty and exercise it as their patrons advise. A vote is still a vote; it is simply known in advance. The szlachta have noticed and have not yet decided what to do about it."
 estate_magnates_anti_absolutism:0 "Nothing New Without Us"
 estate_magnates_anti_absolutism_desc:0 "The crown swears that no new tax, no standing army and no new office will be raised without the estate's consent. Every ruler signs it. Roughly every third one later tries to find out what happens if he does not."
 estate_magnates_curtail_cossacks:0 "Curtail the Register"
 estate_magnates_curtail_cossacks_desc:0 "Cut the register, put the men struck from it back on the land they were sitting on, and let the starostas collect from them like anyone else. It pays immediately. The Host keeps a list of everything of this kind, and the list is long."

 # --- their agendas

 estate_magnates_agenda_develop_latifundium:0 "Develop a Latifundium"
 estate_magnates_agenda_develop_latifundium_desc:0 "The estate wants one of its Ruthenian holdings brought up: more hands, more grain, more barges. It will pay for none of it and will remember whether it was done."
 estate_magnates_agenda_hire_advisor:0 "A Magnate at Court"
 estate_magnates_agenda_hire_advisor_desc:0 "The estate expects one of its own in the diplomatic seat at court. He will be competent; that is not the point of him."

 rip_magnate_folwark:0 "Magnate Folwark"
 desc_rip_magnate_folwark:0 "The demesne is worked by the labour the charter owes us rather than by hired hands, and the grain goes down the river under our own seal. It pays, and the village knows exactly who it pays."
