l_english:

 # ==========================================================================
 # CHURCH ASPECT DESCRIPTIONS
 # Names live in the older files; these are the descriptions EU4 looks up as
 # desc_<aspect>, which were missing for ten of the twenty-one aspects.
 # ==========================================================================

 desc_blessing_of_saints_cyril_and_methodius:0 "The liturgy is read in a tongue the congregation follows without an interpreter, and the clerks who copy it are our own."
 desc_blessing_of_eastern_liturgy:0 "The old rite is kept as it was received: the same chant, the same fasts, the same order of feasts, whoever holds the see."
 desc_blessing_of_religious_unity:0 "One rite is preached from the cathedral to the frontier parish, and the missionaries carry the same books as the metropolitan."
 desc_blessing_of_basilian_order:0 "The Basilian houses keep the schools, the novices and the presses, and answer to their own protoarchimandrite rather than to the local bishop."
 desc_blessing_of_papal_protection:0 "Rome speaks for our bishops at courts where our own envoys are not received."
 desc_blessing_of_uniate_missionaries:0 "Priests trained in both rites go out to parishes that have heard the Union denounced from a neighbouring pulpit."
 desc_blessing_of_third_rome:0 "Two Romes have fallen and the third stands. The claim is repeated at every coronation until it is answered as a fact."
 desc_blessing_of_patriarch_of_moscow:0 "The patriarch keeps his own chancery, his own courts and his own revenues, and sits beside the throne rather than beneath it."
 desc_blessing_of_orthodox_conquest:0 "Land taken from a heretic prince is entered in the registers as returned rather than conquered, and the clerks charge accordingly."
 desc_blessing_of_cultural_dominance:0 "The school, the court and the tax roll all use one tongue, and a man who wishes to be heard in any of them learns it."
