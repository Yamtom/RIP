l_french:
 RIP_UNION_OPPONENT:0 "Opponents of the Union"
 rip_ro_sobor_current_desc:0 "The council can strengthen the hierarchy, fund religious mobilization, or withdraw coercive parish measures. Each sitting costs 100 ducats, 50 ADM and 10 Authority. It may be repeated after ten years; the chosen outcome is an immediate institutional action."
 rip_ro_sobor_lands_option:0 "Strengthen the hierarchy: +20 Authority after the sitting's cost"
 rip_ro_sobor_books_option:0 "Organize mobilization: +30 Fervor"
 rip_ro_sobor_courts_option:0 "Withdraw coercive parish measures and restore the sitting's Authority"
 rip_ro_sobor_lands:0 "Monastic Lands Confirmed"
 desc_rip_ro_sobor_lands:0 "The church keeps its estates at the expense of the treasury."
 rip_ro_sobor_books:0 "Corrected Service Books"
 desc_rip_ro_sobor_books:0 "Readers receive new books, while dissenting clergy contest the corrections."
 rip_ro_sobor_courts:0 "Settlement of Church Courts"
 desc_rip_ro_sobor_courts:0 "The throne's rights are recorded, but disputes must pass through the church courts."
 rip_kyiv_convene_the_council_title:0 "Convene the Kyivan Church Council"
 rip_kyiv_convene_the_council_desc:0 "Remain in the Orthodox communion and negotiate one ten-year settlement with the metropolitan and brotherhoods. Cost: 100 ducats, 50 administrative power and 10 authority."
 rip_church_council.1.t:0 "The Metropolitan and the Brotherhoods"
 rip_church_council.1.d:0 "Our bishops, patrons and brotherhoods meet to settle the church's affairs. They can confirm the election of a metropolitan, charter the schools or defend the rights of neighbouring confessions. One settlement will stand for ten years; the council costs 100 ducats, 50 administrative power and 10 authority."
 rip_church_council.1.a:0 "Confirm the elected metropolitan."
 rip_church_council.1.b:0 "Charter the brotherhood schools."
 rip_church_council.1.c:0 "Guarantee the church courts and parish rights."
 rip_church_council.cancel:0 "Leave the matter for another sitting."
 rip_kyiv_elected_metropolitan:0 "Elected Metropolitan"
 desc_rip_kyiv_elected_metropolitan:0 "The bishops and patrons have confirmed the metropolitan in office."
 rip_kyiv_brotherhood_charters:0 "Brotherhood School Charters"
 desc_rip_kyiv_brotherhood_charters:0 "The treasury supports the schools and presses maintained by the brotherhoods."
 rip_kyiv_church_rights:0 "Guaranteed Parish Rights"
 desc_rip_kyiv_church_rights:0 "The settlement protects dissenting parishes and limits pressure to convert."
 rip_kyiv_council_recent:0 "The Council's Ten-Year Term"
 desc_rip_kyiv_council_recent:0 "The existing settlement must run its term before another is negotiated."
 rip_fund_a_parish_mission_title:0 "Fund a Parish Mission"
 rip_fund_a_parish_mission_desc:0 "Spend 100 ducats, 25 administrative power and 5 authority to support missionaries in one controlled core parish for ten years. This shares the visitation cooldown and does not convert the province immediately."
 rip_faith_funded_mission:0 "Funded Parish Mission"
 desc_rip_faith_funded_mission:0 "Readers and missionaries receive support, but the contested parish bears new expenses and disputes."
 rip_uc_see_recently_raised:0 "The Cathedra's Founding Term"
 desc_rip_uc_see_recently_raised:0 "The treasury cannot establish another centre until this twenty-year term ends."
 rip_faith_pilgrim_hospice:0 "Pilgrim Hospice"
 desc_rip_faith_pilgrim_hospice:0 "A funded hospice shelters pilgrims. Its alms reduce unrest and local tax receipts."
 rip_faith_pilgrimage_recent:0 "Pilgrimage Settlement"
 desc_rip_faith_pilgrimage_recent:0 "This pilgrimage settlement runs for ten years."
 rip_faith_pilgrimage_desc:0 "Pilgrims ask for a hospice in Jerusalem. Funding it costs 100 ducats and 25 administrative power, and supports the parish for ten years. It creates no free development or authority."
 rip_faith_pilgrimage_option:0 "Fund the pilgrim hospice."
 rip_crusade_flavor_recent:0 "Campaign Parish Settlement"
 desc_rip_crusade_flavor_recent:0 "The campaign's parish arrangements stand for five years."
 rip_crusade_parish_support_desc:0 "The parishes ask the treasury to relieve the burden of the campaign. Fifty ducats will reduce war exhaustion by half a point. Another grant cannot be considered for five years."
 rip_crusade_parish_support_option:0 "Pay for relief."
