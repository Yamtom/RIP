l_french:
 # Tag-scoped replacement fallback (french): owner=KIE, entity=content.
 ability_kyivan_seniorate_mechanic:0 "The Kyivan Seniorate"
 ability_kyivan_seniority_mechanic:0 "Seniority of the Rus"
 chernozem_fertility_desc:0 "The rich black earth produces abundant harvests."
 chumak_salt_extraction_desc:0 "Intensive salt extraction and trade through chumak caravans."
 chumak_salt_trade_desc:0 "Organized caravans of ox-carts transport salt from the southern steppes."
 cossack_military_settlement_desc:0 "Cossack warriors have established a fortified settlement."
 desc_KIE_balkan:0 "The Gates of the Danube are open and they lead to the Balkans, where the Cyrillic alphabet and the Church Slavonic liturgy took root, and where Orthodox monasteries still copy the books our own scribes read."
 desc_KIE_blac_sea_fleet:0 "Kyiv's oared squadrons sweep from Ochakiv to Chersonesus, closing the sea-lanes to foes and filling our harbors with tribute."
 desc_KIE_black_sea_fleet:0 "The creation of a single fleet in the Black Sea and the Sea of Azov promotes trade in the Caucasus and Anatolia, and even with the Arabs and elsewhere."
 desc_KIE_brotherhood_schools:0 "Orthodox brotherhoods fund schools and scriptoria, strengthening education and administration."
 desc_KIE_campaign:0 "The restoration will come from the will that waged the Mongol Wars."
 desc_KIE_cesarstvo:0 "Imperial reforms privilege elite drill, institutions, and refined statecraft."
 desc_KIE_cesarstvo_ruthenia:0 "A hybrid imperial administration blends Habsburg and Rus' traditions across Ruthenian lands."
 desc_KIE_cossacks:0 "Frontier horsemen serve alongside our armies, bringing experience of the Dnieper crossings and steppe warfare."
 desc_KIE_crimean_port:0 "The ports of Crimea are now under our control."
 desc_KIE_defence:0 "The Golden Gate guards the approach to the upper town. An army bound for the heart of Kyiv must first pass beneath its walls."
 desc_KIE_develop_ruthenia:0 "Bountiful black-earth harvests fill our storehouses and river barges, feeding both our cities and foreign markets."
 desc_KIE_dynasty:0 "Our dynasty carries the blood of a true bloodline, which gives us a rightful claim to the throne and strengthens our rule over the lands of Kyiv."
 desc_KIE_expansion:0 "Expansionism is in Rus's blood."
 desc_KIE_factional_ruthenia:0 "Princes, boyars, and hetmans compete in a structured imperial court."
 desc_KIE_free_city_charter_cooldown:0 "The court has recently granted a free-city charter; another must wait."
 desc_KIE_free_trade_city:0 "A city charter grants autonomy in exchange for commerce and tribute."
 desc_KIE_glory:0 "A self-governing guard of volunteers who form a splendid brigade to safeguard their households."
 desc_KIE_great_building:0 "With Red Ruthenia and Moldavia secured, masons and garrisons raise fortresses and rebuild market towns along the Dniester and the southern approaches to Kyiv."
 desc_KIE_heir_of_rus:0 "From the Dnieper to the northern principalities, the lands of Rus' acknowledge Kyiv's imperial authority and draw strength from a unified administration."
 desc_KIE_kyiv:0 "Kyiv has been rebuilt and rises once again as a magnificent city."
 desc_KIE_moscow_subjugated:0 "Kyiv has humbled Muscovy and reclaimed the northern heart of Rus'."
 desc_KIE_prince:0 "The prince of Kyiv wields storied authority, summoning boyars and townsfolk alike beneath the gilded banners of Saint Michael."
 desc_KIE_princedom_network:0 "A web of Kyivan princedoms supports the seniorate with troops and tribute."
 desc_KIE_scandinavia:0 "According to the chronicle tradition, Rurik first took his seat here."
 desc_KIE_serbian_conquest:0 "Serbia has been brought under Kyiv's authority."
 desc_KIE_shogunate:0 "Kyiv rules through a seniority of princes and merchant councils."
 desc_KIE_siberian_frontier:0 "We shall be curious and courteous about these Siberian virgin lands."
 desc_KIE_subjugated:0 "Muscovy has been conquered."
 desc_KIE_tatar_harassment:0 "The Tatars are raiding our borders, causing destruction and chaos. We must defend ourselves and push them back to protect our lands and people."
 desc_KIE_trade_house_hub:0 "A chartered trade house anchors local markets and river exchange."
 desc_KIE_trade_houses:0 "Chartered merchant houses concentrate capital and extend Kyiv's commercial reach."
 desc_KIE_udil_recently_confirmed:0 "This prince has recently been confirmed in his rotational appanage seat by the Grand Prince of Kyiv."
 desc_KIE_unified:0 "The lands of Rus' stand united beneath one throne."
 desc_KIE_union:0 "A union has been formed between the Poles and the Ruthenians."
 desc_KIE_yoke:0 "One of the first measures taken by the Kyiv government was to send envoys to the Horde in order to seek compensation for Mongol crimes committed in the old Kyivan lands."
 desc_kyiv_artisan_guilds_modifier:0 "Guilds improve production and crafts."
 desc_kyiv_brotherhood_collegium:0 "A collegiate school founded by the Orthodox burghers of the Epiphany brotherhood, fostering humanist letters and theological study."
 desc_kyiv_ecclesiastical_authority:0 "Religious authority is consolidated in Kyiv."
 desc_kyiv_foreign_trading_quarters:0 "Foreign merchants establish quarters in Kyiv."
 desc_kyiv_independence.3a:0 "We have declared our independence from foreign rule and established our own sovereign state. We will govern ourselves and strive for greatness."
 desc_kyiv_orthodox_metropolitanate:0 "The metropolitanate strengthens church authority."
 desc_kyiv_podil_expansion:0 "Kyiv's merchant district expands."
 desc_kyivan_peoples_gathered:0 "The diverse peoples of the Cesarstvo are gathered in harmony under the imperial crown, fostering internal tranquility and prosperity across the provinces."
 desc_kyivan_throne_in_disarray:0 "Factions and lineages openly contest the crown, plunging the court into division, driving up administrative costs, and undermining stability across the realm."
 desc_rip_kyiv_brotherhood_charters:0 "The treasury supports the schools and presses maintained by the brotherhoods."
 desc_rip_kyiv_church_rights:0 "The settlement protects dissenting parishes and limits pressure to convert."
 desc_rip_kyiv_council_recent:0 "The existing settlement must run its term before another is negotiated."
 desc_rip_kyiv_elected_metropolitan:0 "The bishops and patrons have confirmed the metropolitan in office."
 desc_UKR_dynasty:0 "We shall sing the praises of our dynasty, and it will outshine all others!"
 desc_UKR_gedyminovich:0 "Our court draws legitimacy from the Gediminid tradition of princely rule in the lands of Rus'."
 desc_UKR_jagiellon:0 "Our court cultivates connections with the Jagiellonian dynasty to strengthen its standing abroad."
 desc_UKR_prosvita:0 "The Prosvita society is a cultural and educational organization aimed at promoting knowledge and enlightenment among the people. Through the establishment of libraries and schools, we can elevate our society and achieve progress."
 desc_UKR_rurikovich:0 "Our court invokes the legacy of the Rurikid princes as a political claim to Kyiv, without changing the ruling house."
 dnieper_commerce_network_desc:0 "An organized system of trade along the Dnieper River."
 dnieper_defense_line_desc:0 "Part of a defensive network protecting the Dnieper region."
 dnieper_fortified_border_desc:0 "A system of fortifications protects our Dnieper territories."
 dnieper_grain_surplus_desc:0 "Abundant grain production from the fertile Dnieper basin."
 dnieper_noble_estates_desc:0 "Nobles have developed agricultural estates worked by peasant labor."
 dnieper_peasant_settlement_desc:0 "Free peasants have settled this land and developed it for agriculture."
 dnieper_river_port_desc:0 "A well-developed port facility facilitating river trade."
 dnieper_trade_hub_desc:0 "This city serves as a major hub for commerce along the Dnieper River trade route."
 fortified_dnieper_city_desc:0 "This city is protected by modern fortifications."
 grain_export_economy_desc:0 "Our economy benefits from large-scale grain exports."
 GRAND_KYIVAN_DUCHY:0 "Grand Kyivan Principality"
 GRAND_KYIVAN_DUCHY_desc:0 "We are the most powerful dukes and princes in the Rus, but we are not yet a true hegemony."
 KIE:0 "Kyiv"
 KIE_ADJ:0 "Kyiven"
 KIE_agriculture_desc:0 "Since the splintering of old Rus', broad tracts of fertile soil have lain fallow under border raids. Let us bring our grain and cattle lands back to full cultivation, so that Kyiv becomes the granary of Eastern Europe."
 KIE_agriculture_title:0 "Countryside Development"
 KIE_balkan:0 "Gates on the Danube"
 KIE_baltic_desc:0 "The Livonian Order guards the Baltic approaches. Defeat its armies and bring the eastern shore under Kyiv’s protection."
 KIE_baltic_title:0 "Baltic Security"
 KIE_blac_sea_fleet:0 "Black Sea Fleet"
 KIE_black_sea_fleet:0 "Bases of the Black Sea Fleet"
 KIE_brotherhood_schools:0 "Brotherhood Schools"
 KIE_brotherhood_schools_desc:0 "In 1615 the Orthodox community of Kyiv founded the Epiphany Brotherhood and opened its school in Podil. In 1620 Hetman Petro Sahaidachnyi enrolled the whole Zaporozhian Host in it. An Orthodox realm can raise the parish network itself. A realm of another faith may instead protect Kyiv's Orthodox community through its burghers or the Cossack Host, as the brotherhood's own patrons did under a Catholic king."
 KIE_brotherhood_schools_title:0 "Brotherhood Schools"
 KIE_byzantine_relations_desc:0 "In 1439, Metropolitan Isidore of Kyiv supported the church union concluded at Florence. Its contested reception made relations with Constantinople a question of ecclesiastical authority as well as diplomacy. While Byzantium survives, secure an alliance, or, as its rival, make a public declaration of the primacy Kyiv claims, ecclesiastical or dynastic, and bear the opinion of Constantinople that follows. If Byzantium no longer exists, employ a theologian and maintain a temple or cathedral in Kyiv under our direct rule. This diplomatic mission does not itself settle the union or change our faith."
 KIE_byzantine_relations_title:0 "In the Wake of Florence"
 KIE_campaign:0 "Restoration of the Mongol Wars"
 KIE_cesarstvo:0 "Kyivan Cesarstvo"
 KIE_cesarstvo_ruthenia:0 "Cesarstvo Administration"
 KIE_chernihiv_desc:0 "Chernihiv's princes rival Kyiv in antiquity, yet war has left both cities in need of renewal. Bring the Chernihiv lands under our rule, by treaty or by arms, and raise their old city from ruin."
 KIE_chernihiv_title:0 "Reunite Chernihiv"
 KIE_consolidate_desc:0 "Rus's region has been divided for centuries. We must first consolidate our rule before moving on to the next step."
 KIE_consolidate_title:0 "State Consolidation"
 KIE_cossack_desc:0 "Bring the mounted bands of the Dnieper frontier into our service and strengthen our cavalry.\n\nHistorical background: a complaint from 1492 records Cossack activity associated with Kyiv and Cherkasy. In the early sixteenth century, Ostafii Dashkevych, starosta of Kaniv and Cherkasy, organized Cossack forces for frontier defense and proposed a standing defense force in 1533. Earlier organization under a surviving Kyivan principality is an alternative-history possibility."
 KIE_cossack_title:0 "Organize the Frontier Host"
 KIE_cossacks:0 "Kyiv Enlists Cossacks"
 KIE_crimean_port:0 "Crimean Port"
 KIE_defence:0 "The Golden Gates of Kyiv"
 KIE_develop_ruthenia:0 "The Granary of Europe"
 KIE_dnieper_settlement_desc:0 "Encourage settlement and fortified communities along the middle Dnieper, turning the frontier into a productive heartland."
 KIE_dnieper_settlement_title:0 "Settle the Dnieper"
 KIE_dniestr_trade_route_desc:0 "Grain, salt, wax and cloth travel the road that joins Krakow to Kyiv and the Black Sea ports. Our merchants' dominance in the markets along this route is critical to our success. Whoever controls the flow of trade controls the land, and we must hold the reins."
 KIE_dniestr_trade_route_title:0 "The Black Sea Trade Road"
 KIE_dynasty:0 "Our Dynasty"
 KIE_dynasty_desc:0 "The Olelkovychi were a branch of the Gediminids, not a house free to choose its ancestry. Yet descent alone could not secure the Kyivan throne. Consolidate our standing and choose which political tradition our court will emphasize."
 KIE_dynasty_title:0 "Our House and Its Claim"
 KIE_expansion:0 "Ruthenian Expansionism"
 KIE_factional_ruthenia:0 "Ruthenian Factional Court"
 KIE_free_city_charter_cooldown:0 "Charters Exhausted"
 KIE_free_trade_cities_desc:0 "Grant burgher councils charters to turn key markets into semi-autonomous trade hubs."
 KIE_free_trade_cities_path_tt:0 "Has taken the Kyivan Shogunate path"
 KIE_free_trade_cities_title:0 "Free Trade Cities"
 KIE_free_trade_city:0 "Free Trade City"
 KIE_friend_or_foe_desc:0 "Across our southern frontier lie the Great Horde and Crimea. A khan who rides beside our princes could guard that frontier. A khan who refuses us may one day have to answer to Kyiv."
 KIE_friend_or_foe_title:0 "Friend or Foe?"
 KIE_glory:0 "Glorious Protection"
 KIE_great_building:0 "Southern Frontier Works"
 KIE_growing_wealth_desc:0 "Kyiv's markets once drew merchants from the Baltic to the Black Sea. Restore their traffic, and build a realm whose revenues can sustain its armies."
 KIE_growing_wealth_title:0 "Increasing Wealth"
 KIE_heir_of_rus:0 "Heir of Rus'"
 KIE_heir_of_rus_desc:0 "With Kyiv and the northern lands united under our hand, the legacy of Rus' is restored in its original heartland."
 KIE_heir_of_rus_title:0 "Heir of Rus'"
 KIE_ideas:0 "Idées de Kyiv"
 KIE_ideas_bonus:0 "Ambitions de Kyiv"
 KIE_ideas_start:0 "Traditions de Kyiv"
 KIE_integrate_novgorod_desc:0 "Novgorod's search for protection offers Kyiv an opening in the north. Establish our authority there and secure the surrounding lands, directly or through our subjects.\n\nHistorical background: Mykhailo Olelkovych served as prince in Novgorod in 1470-1471. His brief tenure provides a precedent for Kyivan involvement; lasting control of this wider northern region is an alternative-history ambition."
 KIE_integrate_novgorod_title:0 "The Novgorod Connection"
 kie_joined_confederation:0 "Joined the Kyivan Confederation"
 KIE_kyiv:0 "Kyiv Rebuilt"
 KIE_magdeburg_law_desc:0 "A charter gives the burghers of Kyiv a council and a court of their own, and the same charter can be extended to the market towns along the Dnieper. What it leaves open is how far the magistrate's power reaches: the court must choose between a magistrate that answers to the city and a voivode who keeps oversight."
 KIE_magdeburg_law_title:0 "Magdeburg Law in Kyiv"
 KIE_moscow_subjugated:0 "Moscow Subjugated"
 KIE_northern_expansion_desc:0 "Smolensk alone separates Kyiv from the northern merchant city of Novgorod. Bringing those borderlands under our crown opens the old river road to the north."
 KIE_northern_expansion_title:0 "Northern Expansion"
 KIE_patriarchy_desc:0 "In 1458 the Orthodox Church of Rus' divided into the metropolitanates of Kyiv and Moscow, and Kyiv's still answers to Constantinople. Let us raise it to a patriarchate of its own, to strengthen the realm and win a greater voice in the religious affairs of our people."
 KIE_patriarchy_title:0 "All-Rus' Patriarchy"
 KIE_prince:0 "Prince of Kyiv"
 KIE_princedom_network:0 "Princedom Network"
 kie_refused_confederation:0 "Refused Confederation Invitation"
 KIE_restore_kyiv_desc:0 "In 1482 Khan Mengli I Giray burned Kyiv and plundered the Caves Monastery, and the old capital has never fully recovered. Let its walls, churches and markets be rebuilt, so that Kyiv again deserves its place at the head of the Rus' cities."
 KIE_restore_kyiv_title:0 "Rebuilding Kyiv"
 KIE_scandinavia:0 "Rurik's Ladoga"
 KIE_secure_kyiv_desc:0 "Consolidate the heartland around Kyiv by curbing local autonomy, keeping the Dnieper provinces free of devastation, and strengthening the capital's urban foundations."
 KIE_secure_kyiv_title:0 "Secure the Heartland"
 KIE_secure_the_south_desc:0 "The steppe and the Black Sea offer rich routes, but leave our southern border exposed to raids. Fortify the approaches to Kyiv and secure the ports before a rival can use them against us."
 KIE_secure_the_south_title:0 "Defend the South"
 KIE_serbian_conquest:0 "Serbia Falls to Kyiv"
 KIE_shogunate:0 "Kyivan Seniorate"
 KIE_siberian_frontier:0 "Exploring the Siberian Frontier"
 KIE_stability_desc:0 "Named for its legendary founder Kyi, ancient Kyiv has weathered centuries of siege and fire upon the high bluffs above the Dnieper."
 KIE_stability_title:0 "City of Kyiv"
 KIE_subjugate_moscow_desc:0 "Muscovy claims to inherit Rus'. By breaking their power and taking Moscow, we prove Kyiv is the rightful center of the Rus lands."
 KIE_subjugate_moscow_title:0 "Subjugate Moscow"
 KIE_subjugate_volynians_desc:0 "To our west lie Volhynia and Podlasie. Bringing their lands and castles under our rule will secure Kyiv's western marches and open the road south to Podillia."
 KIE_subjugate_volynians_title:0 "Subjugate Volhynia"
 KIE_subjugate_white_ruthenia_desc:0 "The Belarusian realm is one of many in this region that lacks proper governance. Let us make them pay homage to us and demonstrate our dominance."
 KIE_subjugate_white_ruthenia_title:0 "Subjugate White Rus'"
 KIE_subjugated:0 "Muscovy Subjugated"
 KIE_tatar_harassment:0 "Tatar Harassment"
 KIE_trade_house_hub:0 "Trade House Hub"
 KIE_trade_houses:0 "Kyivan Trade Houses"
 KIE_trade_houses_desc:0 "A boatman on the Dnieper needs credit before he can load his cargo. Bring six town markets and an established centre of trade into a network backed by the burghers, then decide how the merchant houses should operate."
 KIE_trade_houses_title:0 "Kyivan Trade Houses"
 KIE_true_ruler_desc:0 "A strong leader, capable of managing his land, dealing with his people, and fighting on the field, is a figure worthy of leading our people."
 KIE_true_ruler_title:0 "True Ruler of the Rus"
 KIE_udil_recently_confirmed:0 "Confirmed Udil Seat"
 KIE_unified:0 "Rus' United"
 KIE_union:0 "Union of Poles and Ruthenians"
 KIE_yoke:0 "Kyiv Breaks the Yoke"
 kyiv_artisan_guilds_modifier:0 "Kyiv Artisan Guilds"
 kyiv_artisan_guilds_modifier_desc:0 "Well-organized guilds regulate craft production and maintain quality."
 kyiv_brotherhood_collegium:0 "Kyiv Brotherhood Collegium"
 kyiv_brotherhood_collegium_desc:0 "A collegiate school founded by the Orthodox burghers of the Epiphany brotherhood, fostering humanist letters and theological study."
 kyiv_call_the_princely_levy:0 "Call the Princely Levy"
 kyiv_call_the_princely_levy_desc:0 "Summon the senior udils' retinues in full, beyond the standing service the seats already owe. The host swells for a campaign; feeding it costs the treasury."
 kyiv_call_the_snem:0 "Call the Snem"
 kyiv_call_the_snem_desc:0 "Summon the princes of the house of Rurik to a congress. They reaffirm the seniority of Kyiv and their subjects' unrest subsides - but, as at Liubech, each leaves confirmed in his own patrimony."
 kyiv_cesarstvo_path_desc:0 "Claim the imperial dignity of Constantinople for the Kyivan throne. Win the assent of the boyars and confirm the charters of the peoples who will live under the new crown."
 kyiv_cesarstvo_path_title:0 "Proclaim the Kyivan Cesarstvo"
 kyiv_charter_free_city_desc:0 "Grant a privileged charter to a Ruthenian market city, boosting commerce and burgher influence."
 kyiv_charter_free_city_title:0 "Charter a Free Trade City"
 kyiv_convene_boyar_council_desc:0 "Turn the town veche into a standing council of lineages, traders, and guildsmen."
 kyiv_convene_boyar_council_title:0 "Convene the Boyar Council"
 kyiv_convene_church_sobor_desc:0 "Seat a permanent sobor of bishops beside the Metropolitan, now that the see's writ covers more than one people's faith."
 kyiv_convene_church_sobor_title:0 "Convene the Church Sobor"
 kyiv_dnieper_history.1.a:0 "Invest heavily in river trade infrastructure."
 kyiv_dnieper_history.1.b:0 "Make moderate investments in trade."
 kyiv_dnieper_history.1.c:0 "Focus on military control of the river instead."
 kyiv_dnieper_history.1.d:0 "The Dnieper River has long been a vital artery of commerce, connecting the Baltic Sea to the Black Sea and beyond. Kyiv, situated on the high western bank, serves as a natural hub for this trade. Merchants from Scandinavia, Poland, Lithuania, the German cities, Muscovy, the Crimean Khanate, and even Constantinople pass through our lands.\n\nOur advisors propose establishing a formal trading network along the Dnieper, with warehouses, docks, and customs posts at key points. This would allow us to better regulate commerce, collect revenues, and strengthen our economic position in the region."
 kyiv_dnieper_history.1.t:0 "Establishing the Dnieper Trading Network"
 kyiv_dnieper_history.10.a:0 "Establish a printing press in Kyiv."
 kyiv_dnieper_history.10.b:0 "Import books from abroad instead."
 kyiv_dnieper_history.10.d:0 "The recent establishment of the Kyiv-Mohyla Academy has created demand for books and learning materials. Our scholars propose establishing a printing press in Kyiv to publish Orthodox religious texts, educational materials, chronicles, and other works.\n\nA printing press would spread literacy, preserve our cultural heritage, and establish Kyiv as a center of Orthodox publishing. The technology and expertise required, however, demand significant investment."
 kyiv_dnieper_history.10.t:0 "Orthodox Publishing and Printing in Kyiv"
 kyiv_dnieper_history.11.a:0 "Strengthen the Metropolitan's authority."
 kyiv_dnieper_history.11.b:0 "Maintain the current arrangement."
 kyiv_dnieper_history.11.d:0 "Petitions arrive in Kyiv from parishes far beyond our borders. Some ask the metropolitan to settle a disputed appointment. Others can scarcely afford a roof for their church.\n\nOur councillors would endow the see and repair its churches. A metropolitan able to answer such appeals would carry the word of Kyiv far down the Dnieper."
 kyiv_dnieper_history.11.t:0 "Authority of the Kyiv Metropolitan"
 kyiv_dnieper_history.12.a:0 "Fortify Kyiv with modern defenses."
 kyiv_dnieper_history.12.b:0 "Build fortifications in multiple cities."
 kyiv_dnieper_history.12.c:0 "Create a chain of fortresses along the Dnieper."
 kyiv_dnieper_history.12.d:0 "The cities of the Dnieper region face constant military threats. Tatar raiders from the Crimea strike regularly, carrying off captives and plunder. The expanding power of Muscovy threatens from the east, while conflicts with Poland and Lithuania endanger our western borders.\n\nOur military advisors strongly recommend fortifying our key cities along the Dnieper. Modern fortifications—bastions, walls, moats, and citadels—would protect our urban centers and provide strong points for military operations."
 kyiv_dnieper_history.12.e:0 "Rely on Cossack warriors for defense."
 kyiv_dnieper_history.12.t:0 "Fortification of Dnieper Cities"
 kyiv_dnieper_history.13.a:0 "Organize local defense forces."
 kyiv_dnieper_history.13.b:0 "Launch a counter-raid into Tatar lands."
 kyiv_dnieper_history.13.c:0 "Pay tribute to avoid the raids."
 kyiv_dnieper_history.13.d:0 "Reports arrive of another Tatar raiding party crossing the steppe toward the Dnieper basin. Crimean raiders have long plagued our borderlands, seeking captives (yasyr) to sell in slave markets, as well as livestock, valuables, and whatever else they can seize.\n\nOur commanders must decide how to respond to this threat: organize local defense forces, launch a counter-raid into enemy territory, or attempt to buy off the raiders with tribute."
 kyiv_dnieper_history.13.t:0 "Tatar Raids on the Dnieper Region"
 kyiv_dnieper_history.2.a:0 "Welcome these foreign merchants to Kyiv."
 kyiv_dnieper_history.2.b:0 "Restrict foreign influence in our commerce."
 kyiv_dnieper_history.2.d:0 "Kyiv's reputation as a prosperous trading city has attracted merchants from distant lands. Greek and Armenian traders, experienced in commerce between Constantinople, the Black Sea, and Central Asia, have petitioned for the right to establish permanent trading quarters in our capital.\n\nThese foreign merchants bring valuable goods—silks, spices, wines, and precious metals—along with commercial expertise and connections to distant markets. However, granting them such privileges may displease our native merchants who fear foreign competition."
 kyiv_dnieper_history.2.t:0 "Greek and Armenian Merchants in Kyiv"
 kyiv_dnieper_history.3.a:0 "Organize and support the chumak trade."
 kyiv_dnieper_history.3.b:0 "Establish a state monopoly on salt."
 kyiv_dnieper_history.3.d:0 "For centuries, the chumaky—salt traders driving ox-drawn carts—have traveled the steppes between the salt deposits of the south and the cities of the Dnieper basin. These hardy merchants endure harsh conditions, constant danger from raiders, and months on the road to bring this essential commodity to our lands.\n\nSalt is crucial for preserving food, processing leather, and many other purposes. By organizing and supporting the chumak caravans, we can ensure a steady supply of this vital resource and profit from the trade."
 kyiv_dnieper_history.3.t:0 "The Chumak Salt Caravans"
 kyiv_dnieper_history.4.a:0 "Launch a major urban development project."
 kyiv_dnieper_history.4.b:0 "Allow gradual organic growth."
 kyiv_dnieper_history.4.c:0 "The city needs no special investment."
 kyiv_dnieper_history.4.d:0 "Kyiv, the Mother of Rus' Cities, continues to grow. The ancient Upper Town (Verkhnie Misto) around St. Sophia Cathedral houses our administration and churches, while the commercial Podil district along the river bank bustles with trade. Craftsmen, merchants, and peasants from surrounding lands are drawn to the city's opportunities.\n\nOur advisors propose a major urban development project to expand Kyiv's infrastructure—new streets, markets, workshops, defensive walls, and residential quarters. This would cement our capital's status as the premier city of the Dnieper region."
 kyiv_dnieper_history.4.t:0 "Urban Expansion of Kyiv"
 kyiv_dnieper_history.5.a:0 "Grant Magdeburg Law to Kyiv."
 kyiv_dnieper_history.5.b:0 "Grant rights to Chernihiv."
 kyiv_dnieper_history.5.c:0 "Grant rights to multiple cities."
 kyiv_dnieper_history.5.d:0 "The cities along the Dnieper—Kyiv, Chernihiv, Pereiaslav, and others—seek greater autonomy and rights to govern their internal affairs. They petition for Magdeburg Law, the Germanic legal system that grants cities self-government, their own courts, and economic privileges.\n\nGranting such rights would strengthen urban development and attract merchants, but it would also limit our direct control over these cities and displease the nobility who resent urban autonomy."
 kyiv_dnieper_history.5.e:0 "Refuse these urban privileges."
 kyiv_dnieper_history.5.t:0 "Magdeburg Rights for Dnieper Cities"
 kyiv_dnieper_history.6.a:0 "Support the formation of artisan guilds."
 kyiv_dnieper_history.6.b:0 "Maintain state control over production."
 kyiv_dnieper_history.6.d:0 "Kyiv's artisans—smiths, carpenters, weavers, tanners, jewelers, and many other craftsmen—have long operated independently. Now they seek to organize formal guilds to regulate their trades, maintain quality standards, set prices, and protect their interests.\n\nWell-organized guilds could enhance our city's productive capacity and reputation for quality goods. However, guild monopolies may also restrict competition and raise prices for consumers."
 kyiv_dnieper_history.6.t:0 "Artisan Guilds of Kyiv"
 kyiv_dnieper_history.7.a:0 "Encourage peasant settlement of the land."
 kyiv_dnieper_history.7.b:0 "Establish Cossack military settlements."
 kyiv_dnieper_history.7.c:0 "Grant lands to nobles for development."
 kyiv_dnieper_history.7.d:0 "The fertile lands along the Middle Dnieper remain sparsely populated. Vast stretches of productive chernozem soil, forests rich with timber and game, and strategic river access await development. Our treasury has the means to sponsor colonization of these territories.\n\nWe must decide who should lead this settlement: free peasants seeking land, Cossack warriors establishing military outposts, or nobles founding estates worked by peasant labor."
 kyiv_dnieper_history.7.t:0 "Colonization of the Middle Dnieper"
 kyiv_dnieper_history.8.a:0 "Invest in agricultural improvements."
 kyiv_dnieper_history.8.b:0 "Focus on grain export trade."
 kyiv_dnieper_history.8.d:0 "The black earth of the Middle Dnieper region is among the most fertile soil in the world. These chernozem lands can produce abundant harvests of wheat, rye, barley, and other crops with proper cultivation. Our agricultural advisors propose improvements to farming techniques, tools, and organization to maximize the productivity of our grain-growing regions.\n\nIncreased grain production would not only feed our population but also provide valuable exports to neighboring lands hungry for our surplus."
 kyiv_dnieper_history.8.t:0 "Development of Chernozem Agriculture"
 kyiv_dnieper_history.9.a:0 "Found the Kyiv-Mohyla Academy."
 kyiv_dnieper_history.9.b:0 "Foreign education is sufficient for our needs."
 kyiv_dnieper_history.9.d:0 "Orthodox education in our lands has long relied on scattered monastery schools and individual tutors. Metropolitan Petro Mohyla proposes establishing a proper academy in Kyiv—a center of higher learning that would combine Orthodox tradition with modern educational methods, including study of languages, philosophy, theology, rhetoric, and sciences.\n\nThe Kyiv-Mohyla Academy would train clergy, administrators, and scholars, elevating the cultural and intellectual life of our realm. However, such an institution requires substantial investment and may face opposition from those who view Western-style education with suspicion."
 kyiv_dnieper_history.9.t:0 "Foundation of Kyiv-Mohyla Academy"
 kyiv_druzhyna_muster:0 "Druzhyna Muster"
 kyiv_ecclesiastical_authority:0 "Kyiv Ecclesiastical Authority"
 kyiv_ecclesiastical_authority_desc:0 "The Kyiv metropolitanate exercises strong spiritual authority."
 kyiv_establish_princedoms_desc:0 "Recast our vassals as Kyivan princedoms, granting them the rights and obligations of udil princes under Kyiv's seniority."
 kyiv_establish_princedoms_title:0 "Establish Kyivan Princedoms"
 kyiv_factional_ruthenia_desc:0 "Bring the lands of Rus' under one crown. Let princes, boyars and hetmans each have a place in its council and a stake in keeping the realm together."
 kyiv_factional_ruthenia_title:0 "Convene the Three Estates of Rus'"
 kyiv_foreign_trading_quarters:0 "Kyiv Foreign Trading Quarters"
 kyiv_foreign_trading_quarters_desc:0 "Greek and Armenian merchants maintain permanent quarters in the city."
 kyiv_independence.1a:0 "Demand their loyalty."
 kyiv_independence.1b:0 "We cannot go beyond reason."
 kyiv_independence.1d:0 "After expelling the Lithuanians from our borders, the coalition began to crumble. If we wish to maintain regional supremacy, we must stay united."
 kyiv_independence.1t:0 "Independent Again"
 kyiv_independence.2a:0 "We shall respond promptly, of course."
 kyiv_independence.2b:0 "This is a minor violation of our sovereignty."
 kyiv_independence.2d:0 "How shall we respond to the demand letter from the Prince of Kyiv, which contained a clause demanding our loyalty?"
 kyiv_independence.2t:0 "Kyiv Demands Submission"
 kyiv_independence.3a:0 "Independence"
 kyiv_independence.3d:0 "We shall bring this union to a close, honoring the customs of the various families, tribes, and principalities of the past. Glory to God, Glory to Christ, Conversion of Enemies, and above all Glory to Rus."
 kyiv_independence.3t:0 "The Principality's Feudal Status"
 kyiv_metropolitan_theocracy_desc:0 "Set the Metropolitan of Kyiv above the princely line, ruling Rus' through the see rather than the blood."
 kyiv_metropolitan_theocracy_title:0 "Proclaim the Kyivan Metropolitanate"
 kyiv_mohyla_academy:0 "Kyiv-Mohyla Academy"
 kyiv_mohyla_academy_desc:0 "A renowned center of Orthodox learning and culture."
 kyiv_orthodox_metropolitanate:0 "Kyiv Orthodox Metropolitanate"
 kyiv_orthodox_metropolitanate_desc:0 "The seat of the Orthodox Metropolitan of Kyiv."
 kyiv_podil_expansion:0 "Kyiv Podil Expansion"
 kyiv_podil_expansion_desc:0 "The commercial Podil district has been significantly expanded."
 kyiv_reconfirm_the_grants:0 "Reconfirm the Grants"
 kyiv_reconfirm_the_grants_desc:0 "The new senior prince confirms every seat-holder in his tenure, lifting the lapse that a succession leaves behind and rebuilding trust across the ladder."
 kyiv_regrant_the_udil:0 "Regrant the Udil"
 kyiv_regrant_the_udil_desc:0 "Move a prince up the ladder of thrones, or invest a kinsman with a fresh appanage. A new grant of tenure binds the holder to the senior prince for a time."
 kyiv_rotate_the_seats:0 "Rotate the Seats"
 kyiv_rotate_the_seats_desc:0 "Move a junior prince up the ladder of thrones. A rotation the senior prince controls, rather than one forced by a death, resets the seat-holder's standing toward Kyiv."
 kyiv_shogunate.1.a:0 "Establish the Chernihiv Princedom"
 kyiv_shogunate.1.b:0 "Establish the Volhynian Princedom"
 kyiv_shogunate.1.c:0 "Establish the Podillian Princedom"
 kyiv_shogunate.1.d:0 "The senior prince convenes the council in Kyiv to partition outlying lands into dependent udils, binding junior houses to service, counsel, and tribute beneath the senior throne."
 kyiv_shogunate.1.e:0 "Establish the Pereiaslav Princedom"
 kyiv_shogunate.1.f:0 "Establish the Halych Princedom"
 kyiv_shogunate.1.t:0 "The Kyivan Council of Princes"
 kyiv_shogunate_path_desc:0 "Revive the ancient rule of princely seniority and appanage oaths through a new Kyivan compact, binding junior houses to tribute, counsel, and levied banners beneath the senior throne."
 kyiv_shogunate_path_title:0 "The Kyivan Seniorate"
 kyiv_snem_convened:0 "Snem Convened"
 kyiv_succession_history.1.a:0 "Revive the old rota"
 kyiv_succession_history.1.b:0 "Bind the seat to one line"
 kyiv_succession_history.1.c:0 "Leave the question open"
 kyiv_succession_history.1.d:0 "Casimir has given Kyiv back a prince of its own line, and nobody at court has written down whether the seat descends by blood or rotates among the eldest of the house. Every clerk drafting the charter is waiting to be told which."
 kyiv_succession_history.1.t:0 "The Princedom Restored"
 kyiv_succession_history.10.a:0 "Send envoys to study the coronation"
 kyiv_succession_history.10.b:0 "Dismiss it as Muscovite theatre"
 kyiv_succession_history.10.c:0 "Note it and say nothing"
 kyiv_succession_history.10.d:0 "Ivan IV has had himself crowned tsar, and the news reached Kyiv within the week. The elder princes call it Muscovite theatre; others are already asking what a coronation like it would cost here."
 kyiv_succession_history.10.t:0 "Word from Moscow's Coronation"
 kyiv_succession_history.11.a:0 "Let the magnates rotate office"
 kyiv_succession_history.11.b:0 "Draw offices into one chancery"
 kyiv_succession_history.11.c:0 "Confirm the magnates as they stand"
 kyiv_succession_history.11.d:0 "Families that once served the Olelkovichi as stewards now hold whole districts in their own right, and none of them wants to answer to a chancery that outranks his neighbour's. A single office could still bind them, if it moved first."
 kyiv_succession_history.11.t:0 "Magnates on the March"
 kyiv_succession_history.12.a:0 "Reaffirm the ladder of seniority"
 kyiv_succession_history.12.b:0 "Name one house paramount"
 kyiv_succession_history.12.c:0 "Confirm every house's rank"
 kyiv_succession_history.12.d:0 "Several houses now count themselves senior at Kyiv, and each can cite a precedent the others dispute. Naming one house paramount would settle the ladder for good, at the cost of the rest."
 kyiv_succession_history.12.t:0 "The Ladder of Thrones Contested"
 kyiv_succession_history.13.a:0 "Resist absorption, keep the bench"
 kyiv_succession_history.13.b:0 "Draw closer to the crown"
 kyiv_succession_history.13.c:0 "Keep both claims standing"
 kyiv_succession_history.13.d:0 "The crown and the grand duchy are already talking of one Commonwealth, and of who at Kyiv will answer for it once the talking ends. The bench of princes and the crown's chancery cannot both hold the same seat."
 kyiv_succession_history.13.t:0 "Whispers of Lublin"
 kyiv_succession_history.14.a:0 "Confirm the rota of elder princes"
 kyiv_succession_history.14.b:0 "Confirm a single princely office"
 kyiv_succession_history.14.d:0 "Lublin is close and the question cannot wait any longer. The assembled princes and boyars have gathered to choose one form outright, and to hold every other house to it afterward."
 kyiv_succession_history.14.t:0 "The Table Is Settled"
 kyiv_succession_history.2.a:0 "Seat him by the princes' assent"
 kyiv_succession_history.2.b:0 "Seat him by Vilnius' charter"
 kyiv_succession_history.2.c:0 "Record both forms together"
 kyiv_succession_history.2.d:0 "The old prince is dead and his son sits at Kyiv. Whether the princes assented to him or Vilnius simply named him is a distinction the chroniclers have not bothered to settle."
 kyiv_succession_history.2.t:0 "Semen Takes the Table"
 kyiv_succession_history.3.a:0 "Summon the princes to choose"
 kyiv_succession_history.3.b:0 "Ask Vilnius to name one"
 kyiv_succession_history.3.c:0 "Hold the seat vacant"
 kyiv_succession_history.3.d:0 "Semen is dead without an heir Casimir has agreed to seat, and the table at Kyiv stands empty. Every house with Rurikid or Gedyminovich blood is counting its claim."
 kyiv_succession_history.3.t:0 "The Vacant Table"
 kyiv_succession_history.4.a:0 "Refuse the voivode outright"
 kyiv_succession_history.4.b:0 "Accept one crown-appointed office"
 kyiv_succession_history.4.c:0 "Split the office in two"
 kyiv_succession_history.4.d:0 "The future of Kyiv's princely seat is at stake: preserve a hereditary ruler or accept an appointed voivode.\n\nHistorical background: after Semen Olelkovych died in 1470, Casimir IV ended the appanage principality in 1471 and replaced it with a voivodeship. The choices here explore alternative political responses; preserving the principality departs from that historical outcome."
 kyiv_succession_history.4.t:0 "The Fate of the Kyivan Principality"
 kyiv_succession_history.5.a:0 "Join the conspiring princes"
 kyiv_succession_history.5.b:0 "Denounce them to Vilnius"
 kyiv_succession_history.5.c:0 "Stay out of it"
 kyiv_succession_history.5.d:0 "Mykhailo Olelkovych, Ivan Holshansky and Fedir Belsky are conspiring against the voivode's rule, and word of it has reached this court along with an invitation. Whoever informs Vilnius first names the winner."
 kyiv_succession_history.5.t:0 "A Plot Among the Princes"
 kyiv_succession_history.6.a:0 "Confirm every udil's grant"
 kyiv_succession_history.6.b:0 "Answer through one chancery"
 kyiv_succession_history.6.c:0 "Confirm some, refuse others"
 kyiv_succession_history.6.d:0 "Every udil wants its old grants confirmed in writing before the men who remember the original terms are gone. A single chancery could answer the petition just as well, if it were trusted."
 kyiv_succession_history.6.t:0 "The Boyars Petition"
 kyiv_succession_history.7.a:0 "Call it Muscovite pretension"
 kyiv_succession_history.7.b:0 "Claim the inheritance for Kyiv"
 kyiv_succession_history.7.c:0 "Let the monks argue it"
 kyiv_succession_history.7.d:0 "A monk's letter out of Moscow claims the whole inheritance of Constantinople for one tsar alone. Some at this court call it Muscovite pretension; others ask why the same claim could not sit at Kyiv."
 kyiv_succession_history.7.t:0 "Word of a Third Rome"
 kyiv_succession_history.8.a:0 "Write the rota into the statute"
 kyiv_succession_history.8.b:0 "Write one office into the statute"
 kyiv_succession_history.8.c:0 "Leave the custom unwritten"
 kyiv_succession_history.8.d:0 "The grand duchy's law is being set down in a single book, and every udil's custom must fit inside it or go unwritten. The committee has asked this court to send its answer before the printers begin."
 kyiv_succession_history.8.t:0 "The Statute Committee"
 kyiv_succession_history.9.a:0 "Keep accounts by each udil"
 kyiv_succession_history.9.b:0 "Merge accounts into one chancery"
 kyiv_succession_history.9.c:0 "Keep both ledgers running"
 kyiv_succession_history.9.d:0 "The clerks keep asking whether accounts are kept by udil, each prince answering for his own, or merged under one roof at Kyiv. The ledgers have already been copied both ways."
 kyiv_succession_history.9.t:0 "The Chancery Grows"
 kyiv_summon_princes_desc:0 "Call a council of magnates and grant a domain as a princedom, binding a new house to Kyiv's seniority."
 kyiv_summon_princes_title:0 "Summon the Kyivan Princes"
 kyiv_summon_the_druzhyny:0 "Summon the Druzhyny"
 kyiv_summon_the_druzhyny_desc:0 "The senior prince calls the retinues of the junior princes to ride with his own - the one duty of seniority the ladder still enforces, and the reason it holds against the steppe at all."
 kyiv_trade_houses.1.a:0 "House of St. Michael in Kyiv"
 kyiv_trade_houses.1.b:0 "Chernihiv Grain Syndicate"
 kyiv_trade_houses.1.c:0 "Pereiaslav River Exchange"
 kyiv_trade_houses.1.d:0 "Merchants petition the court to charter a great trade house. We must choose the city that will host it."
 kyiv_trade_houses.1.e:0 "Halych Guild Hall"
 kyiv_trade_houses.1.f:0 "Not now"
 kyiv_trade_houses.1.t:0 "The Kyivan Trade Houses"
 kyiv_trade_houses.2.a:0 "Grant the charter"
 kyiv_trade_houses.2.d:0 "Burgher councils request a free-city charter to expand markets, lower tolls, and attract foreign factors."
 kyiv_trade_houses.2.t:0 "Charter a Free Trade City"
 kyiv_veche_republic_desc:0 "Let the veche and its elected posadnik stand where a prince once did, binding Kyiv, Chernihiv, and Polotsk into a merchant commonwealth."
 kyiv_veche_republic_title:0 "Proclaim the Kyivan Veche"
 kyivan_boyar_council_established_req_tt:0 "The Boyar Council has been convened with the §YConvene the Boyar Council§! decision."
 KYIVAN_CESARSTVO:0 "Kyivan Cesarstvo"
 kyivan_cesarstvo_reform:0 "Kyivan Cesarstvo"
 kyivan_cesarstvo_reform_desc:0 "The grand prince claims the dignity of Cesar. At court he must win the boyars' assent. Across his lands he confirms the charters by which peoples of different tongues live under one crown."
 kyivan_church_synod_reform:0 "Church Synod of Kyiv"
 kyivan_church_synod_reform_desc:0 "A standing sobor of bishops now sits beside the Metropolitan, tempering one man's rule with the council of the see."
 kyivan_confirmed_in_the_udil:0 "Confirmed in the Udil"
 KYIVAN_DUCHY:0 "Kyivan Principality"
 KYIVAN_DUCHY_desc:0 "We must learn from the glory of Kyivan Rus."
 KYIVAN_KING:0 "Kyivan King"
 KYIVAN_KINGDOM:0 "Kyivan Kingdom"
 KYIVAN_METROPOLITANATE:0 "Kyivan Metropolitanate"
 kyivan_metropolitanate_reform:0 "Kyivan Metropolitanate"
 kyivan_metropolitanate_reform_desc:0 "The Metropolitan of Kyiv sits where a prince once did, chosen by the clergy and bound to no dynasty."
 kyivan_peoples_gathered:0 "Peoples Gathered"
 KYIVAN_PRINCE:0 "Kyivan Prince"
 KYIVAN_PRINCESS:0 "Kyivan Princess"
 KYIVAN_PRINCIPALITY:0 "Kyivan Principality"
 KYIVAN_QUEEN:0 "Kyivan Queen"
 KYIVAN_RUS:0 "Kyivan Rus"
 KYIVAN_RUS_desc:0 "We claim to be the heirs to the previous order, as we are the dominant power in the Rus."
 kyivan_rus_reform:0 "Kyivan Rus"
 kyivan_rus_reform_desc:0 "The Grand Prince of Kyiv sits upon the ancestral throne of St. Volodymyr, claiming seniority over the princes of Rus and gathering the lands between the forest and the steppe under one dynastic crown."
 KYIVAN_SENIORATE:0 "Kyivan Seniorate"
 kyivan_shogunate_reform:0 "Kyivan Seniorate"
 kyivan_shogunate_reform_desc:0 "Junior houses hold their udils while Kyiv retains the seniority and calls their levies. A grant of tenure binds each house to the senior prince and must be renewed upon every succession."
 kyivan_throne_concord_gain_modifier:0 "Throne Concord Gain Modifier"
 kyivan_throne_in_disarray:0 "Throne in Disarray"
 KYIVAN_VECHE:0 "Kyivan Veche"
 like_rus_nation_desc:0 "Even God cannot deny that we, the City of Kyiv, have the right to Kyivan Rus."
 like_rus_nation_title:0 "The Days of Kyivan Rus Are Over."
 M_UKR_Events.1.a:0 "Invoke the legacy of the Rurikid princes."
 M_UKR_Events.1.b:0 "Uphold the Gediminid tradition of princely rule."
 M_UKR_Events.1.c:0 "Seek legitimacy through ties with the Jagiellonian court."
 M_UKR_Events.1.d:0 "The Olelkovychi descended from the Gediminids through Algirdas and his son Volodymyr of Kyiv. Kinship and marriage linked princely houses, but did not make their dynastic identities interchangeable. Our court must decide which tradition best supports its claim to Kyiv. This political choice preserves the ruling dynasty."
 M_UKR_Events.1.e:0 "Affirm the standing of our own house."
 M_UKR_Events.1.t:0 "The Foundations of Our Claim"
 magdeburg_law_city_desc:0 "This city enjoys self-government under Magdeburg Law."
 middle_dnieper_settlement_desc:0 "Organized colonization of the Middle Dnieper region."
 monthly_kyivan_throne_concord:0 "Monthly Throne Concord"
 orthodox_education_center_desc:0 "Our lands serve as a center of Orthodox scholarship and learning."
 orthodox_literary_tradition_desc:0 "A flourishing tradition of Orthodox religious and cultural literature."
 orthodox_printing_press_desc:0 "A printing press publishes Orthodox religious and educational texts."
 paid_tribute:0 "Paid Tribute"
 pays_tatar_tribute_desc:0 "We pay tribute to Tatar raiders to secure peace."
 raided_us:0 "Raided Our Lands"
 recent_tatar_raid:0 "Recent Tatar Raid"
 recent_tatar_raid_desc:0 "The region has recently experienced a Tatar raid."
 rip_church_council.1.a:0 "Confirm the elected metropolitan."
 rip_church_council.1.b:0 "Charter the brotherhood schools."
 rip_church_council.1.c:0 "Guarantee the church courts and parish rights."
 rip_church_council.1.d:0 "Our bishops, patrons and brotherhoods meet to settle the church's affairs. They can confirm the election of a metropolitan, charter the schools or defend the rights of neighbouring confessions. One settlement will stand for ten years; the council costs 100 ducats, 50 administrative power and 10 authority."
 rip_church_council.1.t:0 "The Metropolitan and the Brotherhoods"
 rip_church_council.cancel:0 "Leave the matter for another sitting."
 rip_kyiv_brotherhood_charters:0 "Brotherhood School Charters"
 rip_kyiv_church_rights:0 "Guaranteed Parish Rights"
 rip_kyiv_convene_the_council_desc:0 "Remain in the Orthodox communion and negotiate one ten-year settlement with the metropolitan and brotherhoods. Cost: 100 ducats, 50 administrative power and 10 authority."
 rip_kyiv_convene_the_council_title:0 "Convene the Kyivan Church Council"
 rip_kyiv_council_recent:0 "The Council's Ten-Year Term"
 rip_kyiv_elected_metropolitan:0 "Elected Metropolitan"
 rip_regrant_the_udil:0 "Re-grant the Princely Udil"
 rip_regrant_the_udil_desc:0 "Reconfirm a specific Rurikid prince in his appanage seat, settling succession quarrels, quenching unrest, and checking his liberty desire."
 rip_regrant_the_udil_title:0 "Re-grant the Princely Udil"
 rip_regrant_the_udil_tooltip:0 "Reconfirms this specific prince in his appanage, reducing liberty desire by §G30%§! and lifting any lapsed tenure status."
 salt_state_monopoly_desc:0 "The state controls all salt trade and production."
 UKR_ancestral_desc:0 "The Primary Chronicle places Rurik's first seat at Ladoga, on the Volkhov, before the princes moved to Novgorod and then to Kyiv. Holding that old port closes the circle and gives the dynasty a claim to the road from the Varangians to the Greeks."
 UKR_ancestral_title:0 "Rurik's Ladoga"
 UKR_baltic_desc:0 "The charters of our towns give merchants the means to reach the Baltic. Establish a dockyard, win a share of Baltic trade or secure a friendly power on the northern shore."
 UKR_baltic_title:0 "Baltic Ambitions"
 UKR_bulgaria_desc:0 "The Bulgarian lands lie across the road to Constantinople. They share our Orthodox faith and the Church Slavonic liturgy, and their churchmen once sent books north to Rus'. Their clergy and boyars may welcome a protector against the Turks, but a protector must first hold the ground."
 UKR_bulgaria_title:0 "Subjugate Bulgaria"
 UKR_crimea_desc:0 "Rus' has been threatened by Crimean Tatars for far too long. It is now or never to strike against them."
 UKR_crimea_title:0 "Conquer Crimea"
 UKR_demand_tribute_desc:0 "Because many of our areas are impoverished and thinly inhabited, our economy is based on tribute and commerce. The steppe to the east of us is ideal for paying tribute to the people who live there."
 UKR_demand_tribute_title:0 "Demanding Tribute"
 UKR_dniepr_desc:0 "After securing the right bank of the Dnieper, our armies must cross the river and hold a bridgehead on the left bank. Kyiv holds the right bank and Pereiaslav guards the way over to the left. Hold both, and raise a fort or a Cossack settlement at Pereiaslav so that the crossing can be defended. From there the roads lead east to the Don and south to Crimea."
 UKR_dniepr_title:0 "Crossing the Dnieper"
 UKR_dynasty:0 "Our Dynasty"
 ukr_flavor.1.a:0 "Let's not rush into anything."
 ukr_flavor.1.b:0 "This may help us gain favor in Europe."
 ukr_flavor.1.d:0 "Word comes from Florence that the Greeks have signed: one Church, with the Pope at its head and the eastern rite preserved. Metropolitan Isidore set his hand to it and has started home with a cardinal's hat. Nobody has yet asked the parishes, or the Grand Prince."
 ukr_flavor.1.t:0 "Joining the Council of Florence"
 ukr_flavor.2a:0 "However, Novgorod is facing challenges, and we can extend our old contract to offer them aid."
 ukr_flavor.2d:0 "Our strength is spent in the war with Muscovy. A neighbouring Ruthenian power may shield Novgorod from the grand princes, but such protection will cost the republic its independence. The council has little choice but to accept."
 ukr_flavor.2t:0 "Novgorod is Asking for Help"
 ukr_flavor.3a:0 "However, this land is facing difficulties, and we can extend our current agreement to offer them assistance."
 ukr_flavor.3d:0 "Muscovy's pressure has brought the princes of these lands to the brink. The Hetmanate of Chernihiv can shelter them, but only if they accept its authority."
 ukr_flavor.3t:0 "This Land Needs Assistance"
 UKR_fleet_desc:0 "The Black Sea is a vital commercial highway linking East and West, requiring a strong fleet to guard our maritime trade."
 UKR_fleet_title:0 "Crimean Fleet"
 UKR_gedyminovich:0 "Gediminid Tradition"
 UKR_greece_desc:0 "Now that we have conquered Constantinople, we must travel south to protect our Greek brethren in faith. It is our duty to defend and unite all Orthodox nations under our banner."
 UKR_greece_title:0 "Triumph in Greece"
 UKR_horde_desc:0 "The steppe along the Don, the Donets and the lower Volga was long the khans' pasture. Fortified towns, Cossack hosts and Ruthenian farmsteads now hold it, and the Great Horde's tribute-taking is a memory."
 UKR_horde_title:0 "Taming the Wild Field"
 UKR_jagiellon:0 "Jagiellonian Connections"
 UKR_kazan_desc:0 "Kazan, the great khanate of the middle Volga, has fallen to our banners."
 UKR_kazan_title:0 "Conquest of Kazan"
 UKR_muscovy_desc:0 "Muscovy has grown into the fiercest of the northern principalities, and its ambition to gather the lands of Rus' under Moscow's sceptre directly challenges Kyiv's primacy."
 UKR_muscovy_title:0 "Take Control of Moscow"
 UKR_novgorod_desc:0 "Novgorod is the wealthiest city in Rus, and it must become our subject."
 UKR_novgorod_title:0 "Take Novgorod"
 UKR_perm_desc:0 "Perm is the final country that we need to conquer in order to attain true control over Russia."
 UKR_perm_title:0 "Earning Perm"
 UKR_poland_desc:0 "Since Casimir III seized Galicia in the 1340s, the Polish crown has held Rus' land in the west. The hour has come to turn that tide and bring Poland itself beneath our sceptre. We shall rule it by union rather than assimilation, and accept its culture as our own."
 UKR_poland_title:0 "Taking Poland"
 UKR_port_desc:0 "With the conquest of Crimea, we now have access to the Great Sea. A fleet on this sea would be beneficial to us, but we must first construct docks."
 UKR_port_title:0 "Port on the Black Sea"
 UKR_princes_desc:0 "The other Russian princes must bow to Rus', just as the Muscovites have."
 UKR_princes_title:0 "Gather the Princes"
 UKR_prosvita:0 "Prosvita"
 UKR_romania_desc:0 "The Orthodox principalities of Moldavia and Wallachia command the lower Danube; bringing them under our protection secures the road into the Balkans."
 UKR_romania_title:0 "Danubian Principalities"
 UKR_rurikovich:0 "Rurikid Legacy"
 UKR_ruthenia_desc:0 "Long divided among warring principalities and foreign crowns, the lands of our forefathers call for a rightful heir to gather Rus' beneath one banner."
 UKR_ruthenia_title:0 "Unite Rus'"
 UKR_serbia_desc:0 "Serbian monasteries and princes keep the Orthodox faith alive in the Balkans, where the road to Constantinople is contested. Holding Rascia and Serbia secures that road's western flank and wins the lasting goodwill of the Orthodox clergy."
 UKR_serbia_title:0 "Conquest of Serbia"
 UKR_siberia_desc:0 "The lands beyond the Urals are still little known to us. With a foothold on the ridge, we can send hunters, traders and settlers further east to see where the trail leads."
 UKR_siberia_title:0 "Siberian Borders"
 UKR_small_discrepancies_desc:0 "Merchants sailing from Crimea must pass Constantinople. Win the goodwill of the court that holds the city, or take control of the crossing ourselves."
 UKR_small_discrepancies_title:0 "Bosporus Passage"
 UKR_tatar_desc:0 "For generations, the successor hordes of the Mongol Empire raided our villages and carried captives across the steppe. Our banners have finally broken their dominion over Rus'."
 UKR_tatar_title:0 "Breaking the Tatar Yoke"
 UKR_tsyisar_desc:0 "Tsarhorod—Constantinople—stands as the ancient seat of Eastern Christendom. With Kyiv's strength now eclipsing that of the Bosphorus, we can lay claim to the imperial city itself. The city will not take our culture and faith by decree: the court must choose whether to confirm the rights of its Greek institutions or to begin the long work of drawing them into the realm."
 UKR_tsyisar_title:0 "The Claim of Tsarhorod"
 UKR_union_desc:0 "In tough times, the Ruthenian people tend to band together, because everyone is like a family, and every Ruthenian is ready to protect each other."
 UKR_union_title:0 "Chaos of Unity"
 KIE_mohyla_academy_title:0 "Kyiv-Mohyla Collegium"
 KIE_mohyla_academy_desc:0 "In 1632, through the patronage of Metropolitan Petro Mohyla, the Kyiv Brotherhood school and the Lavra school united into the Kyiv-Mohyla Collegium, bridging Orthodox theology with Latin, Greek and Church Slavonic humanism. Once the Brotherhood schools stand, the printing press and a university in Kyiv can make the ancient capital the premier seat of Eastern European learning."
 KIE_ruthenian_baroque_title:0 "Ruthenian Baroque"
 KIE_ruthenian_baroque_desc:0 "From St. Sophia and the Golden-Domed St. Michael in Kyiv to the cathedrals and brotherhood churches of Chernihiv, Pereiaslav, Poltava, Novhorod-Siverskyi, and Starodub, stone sanctuaries and Lavra printing presses shaped an unmistakable Ruthenian Baroque golden age. Cultivating temples and scholarship across both banks of the Dnieper cements Kyiv's cultural supremacy."
 KIE_second_jerusalem_title:0 "A Second Jerusalem"
 KIE_second_jerusalem_desc:0 "Chroniclers and theologians hailed Kyiv as a Second Jerusalem—the sacred mother city of Rus' whose cathedrals, scholars, and printed scriptures radiate authority across the Orthodox world. Raising both cathedral and university in Kyiv while defending our faith fulfills that ancient calling."
 UKR_lithuanian_inheritance_title:0 "Lithuanian Heritage"
 UKR_lithuanian_inheritance_desc:0 "For generations the Grand Duchy of Lithuania governed Ruthenian and Belarusian lands alongside Aukstaitija and Samogitia under shared statutes and chancery Slavonic. Gathering Minsk, Polotsk, Vilnius, and Kaunas beneath Kyiv's authority integrates the peoples of the old Grand Duchy on equal terms and opens our road to the Baltic littoral."
 UKR_swedish_question_title:0 "The Swedish Question"
 UKR_swedish_question_desc:0 "As the Swedish crown commands the Baltic shore, Kyiv and its successors must decide whether Stockholm is a counterweight against neighboring empires or a maritime rival to be matched on open waters."
 UKR_breadbasket_of_europe_title:0 "Granary of Europe"
 UKR_breadbasket_of_europe_desc:0 "Rich black-earth harvests along the Dnieper and Bug feed armies and distant ports alike. Equipping our grain estates with workshops and dominating continental grain exports transforms agricultural abundance into unrivaled treasury strength."
 UKR_ruthenian_empire_title:0 "A Ruthenian Empire"
 UKR_ruthenian_empire_desc:0 "Having established Kyiv as a spiritual centre and secured Greece and the Straits, the restored realm of Rus' can claim an imperial crown."
 KIE_lavra_printing_press:0 "Kyiv-Pechersk Printing Press"
 desc_KIE_lavra_printing_press:0 "Established under the Lavra and Mohyla's scholars, Kyiv's printing house spreads liturgical, legal, and humanist works across Ruthenia."
 KIE_second_jerusalem_modifier:0 "Kyiv, Second Jerusalem"
 desc_KIE_second_jerusalem_modifier:0 "Kyiv's cathedrals, printed scriptures, and scholars command deep reverence across the faithful."
 UKR_grand_duchy_heritage:0 "Legacy of the Grand Duchy"
 desc_UKR_grand_duchy_heritage:0 "Lithuanian and Belarusian legal traditions stand accommodated alongside Kyivan administration."
 UKR_breadbasket_granary:0 "Chernozem Grain Estates"
 desc_UKR_breadbasket_granary:0 "High-yield black-earth harvests and organized granary depots supply distant European markets."
 UKR_ruthenian_empire_modifier:0 "Ruthenian Imperial Majesty"
 desc_UKR_ruthenian_empire_modifier:0 "Consolidated institutions and imperial prestige steady our crown across the Ruthenian realm."
 UKR_every_grain_province_tt:0 "Every owned province producing §YGrain§! with a production building receives §YChernozem Grain Estates§! for §Y20 years§!."
 UKR_ruthenian_grain:0 "Ukrainian Chernozem Grain"
 UKR_sloboda_frontier_title:0 "Settling the Sloboda"
 UKR_sloboda_frontier_desc:0 "East of the Dnieper the sloboda lands, the free settlements, stretch toward the Don. They are settled town by town, not culture by culture: two fortified or Cossack-settled towns of Ruthenian settlers are enough to anchor the road east, and the steppe villages will follow them."
 UKR_baltic_dominion_title:0 "Baltic Dominion"
 UKR_baltic_dominion_desc:0 "With Poland joined to our crown and the Swedish question settled, one ambition of the northern road remains: every harbour from Danzig to Reval held by us or by our subjects. A realm of such reach would rival the Hansa and the Order together."
 UKR_baltic_port_tt:0 "We hold a Baltic harbour of at least 10 development with a dock"
 UKR_baltic_trade_tt:0 "We hold at least 25% of the trade power in the Baltic Sea"
 UKR_baltic_alliance_tt:0 "We are allied with a power of the Baltic or Scandinavian shore that holds us in at least +100 opinion"
 KIE_brotherhood_parish_network_tt:0 "Orthodox realm: Kyiv and at least 3 provinces hold a temple or a cathedral"
 KIE_brotherhood_patronage_tt:0 "Realm of another faith: Kyiv keeps an Orthodox temple or cathedral, and the burghers (40 influence), the frontier host or an alliance with Zaporozhia patronise it"
 KIE_byzantine_primacy_declared_tt:0 "Kyiv has publicly declared its primacy over Constantinople"
 UKR_baltic_dominion:0 "Dominion of the Baltic Shore"
 desc_UKR_baltic_dominion:0 "Every harbour from Danzig to Reval answers to our crown, and the Baltic trade pays its dues to us."
 UKR_tsarhorod_greek_privileges:0 "Privileges of the Greek Institutions"
 desc_UKR_tsarhorod_greek_privileges:0 "The Great Church, the guilds of the Golden Horn and the old palace households keep their rights under our crown."
 UKR_tsarhorod_court_integration:0 "Integration of the Imperial Court"
 desc_UKR_tsarhorod_court_integration:0 "The Greek court and clergy of the city are being drawn into our realm, and the years of change are restless."
 KIE_kyiv_magistrate:0 "Magistrate of Kyiv"
 desc_KIE_kyiv_magistrate:0 "The elected council and its lawspeakers answer to the city, and Kyiv's markets prosper on their own rights."
 KIE_kyiv_voivode_oversight:0 "Voivode's Oversight"
 desc_KIE_kyiv_voivode_oversight:0 "The voivode's court confirms the magistrate's verdicts and levies, and the crown collects more from the city."
 kie_church_primacy_declared:0 "Claimed Primacy of the Kyivan Church"
 kie_dynastic_primacy_declared:0 "Claimed Primacy of the Kyivan House"
 rip_kie_declare_primacy_title:0 "Declare Kyiv's Primacy"
 rip_kie_declare_primacy_desc:0 "Rivalry with Constantinople is only a quarrel until the Kyiv court says what it claims. Declare in public whether the church of the Rus' or the house of the Rus' takes precedence. Byzantium will remember the words for a generation."
 kyiv_choices.1.t:0 "The Fate of Tsarhorod"
 kyiv_choices.1.d:0 "The Queen of Cities is ours. Its Greek merchants, clerics and court officials await our decision. The Great Church and the guilds of the Golden Horn outlasted Latins and Ottomans alike, and the old palace households keep titles older than our dynasty. We may confirm their rights and let the Greek city remain itself, or begin the slow work of drawing its court into the rest of the realm."
 kyiv_choices.1.a:0 "Confirm the rights of the Greek institutions"
 kyiv_choices.1.b:0 "Begin the long integration of the court"
 kyiv_choices.2.t:0 "Tsarhorod Joins the Realm"
 kyiv_choices.2.d:0 "Fifteen years of marriages, offices and shared liturgy have worn down the walls between the imperial court and our own. The clergy and guilds of the city now speak the language of our chancery, and the city is ours in more than name."
 kyiv_choices.2.a:0 "The city is ours at last"
 kyiv_choices.3.t:0 "The Magistrate of Kyiv"
 kyiv_choices.3.d:0 "The Magdeburg charter has given Kyiv a council and a court bench of its own. What it does not say is whether the burgomasters answer to those who elected them, or whether the voivode's court keeps the right to confirm every verdict and levy. The burghers wait for our answer."
 kyiv_choices.3.a:0 "A magistrate of the city's own"
 kyiv_choices.3.b:0 "The voivode confirms the verdicts"
 kyiv_choices.4.t:0 "The Court Speaks of Primacy"
 kyiv_choices.4.d:0 "Since Metropolitan Isidore signed the union at Florence in 1439, the rank of the Kyivan church and of the Kyivan house beside Constantinople has been argued rather than conceded. Our rivalry with the court on the Bosphorus is only a quarrel until we say what we claim. A public declaration will be read in every Orthodox court, and Constantinople will remember its words."
 kyiv_choices.4.a:0 "The church of the Rus' speaks first"
 kyiv_choices.4.b:0 "The house of the Rus' speaks first"
 kyiv_choices.4.c:0 "Hold our tongue for now"
 UKR_princely_compact_title:0 "Princely Compact"
 UKR_princely_compact_desc:0 "Gather delegates from Volhynia, Chernihiv and Lviv. Each seat may answer to us directly, to one of our subjects or to an independent Ruthenian ally with at least +100 opinion of us."
 UKR_princely_compact:0 "Compact of the Ruthenian Princes"
 desc_UKR_princely_compact:0 "A common council gives the princes a voice in the affairs of Rus'."
 UKR_merchant_commonwealth_title:0 "Merchant League"
 UKR_merchant_commonwealth_desc:0 "Train merchants and secure a lasting share of trade in Kyiv and the Baltic Sea. The charters of our cities underpin a league that can prosper across borders."
 UKR_merchant_commonwealth:0 "Kyivan Merchant League"
 desc_UKR_merchant_commonwealth:0 "Chartered merchant houses sustain regular trade between Kyiv and the Baltic."
 UKR_baltic_charters:0 "Baltic Trade Charters"
 desc_UKR_baltic_charters:0 "New routes and trading agreements connect our merchants to the Baltic ports."
