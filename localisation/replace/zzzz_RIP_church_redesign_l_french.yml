 rip_church_gui_recognize_help_tt:0 "Community rights are guaranteed from the selected province panel."
 rip_church_gui_recognize_parish:0 "Guarantee community rights"
 rip_church_gui_recognize_parish_tt:0 "Select an owned Orthodox, Muscovite Orthodox or Catholic province, then use Guarantee community rights in its province panel. This province-level marker is a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The province keeps its religion; it is not converted and does not enter the Union. Costs 1 ADM per development and lasts at least ten years. Unrest falls by 2, plus 0.5 from the protected local tradition; local tax falls by 15% and manpower by 20%. The tax and manpower reductions are a game-design interpretation of the administrative compromise of protecting local arrangements and autonomy, not a penalty for another faith and not a documented historical formula. After the ecumenical settlement: unrest -3, tax -10%, manpower -15%."
