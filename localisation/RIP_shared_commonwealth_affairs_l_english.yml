l_english:
 # ==========================================================================
 # THE DELUGE, 1655-1660
 # ==========================================================================

 deluge.1.t:0 "The Northern Storm"
 deluge.1.d:0 "The Swedish army crossed from Pomerania and the levy of Wielkopolska did not fight it - the palatines rode out to Ujscie and swore to Charles Gustavus on the spot. Warsaw is taken, Krakow invested, and the king has gone over the Silesian border with what is left of his court. The chancery still writes as though a realm exists to govern."
 deluge.1.a:0 "Hold every front and yield nothing"
 deluge.1.b:0 "Buy off one enemy while we can still pay"

 deluge.2.t:0 "The Union of Kedainiai"
 deluge.2.d:0 "Prince Radziwill has signed at Kedainiai: Lithuania passes under the protection of the Swedish crown, and the union with Poland is declared dissolved. He argues that a province with no army left must find a protector, and that Vilnius burned while Warsaw debated. Half the Lithuanian nobility has set its seal beside his."
 deluge.2.a:0 "A province with no army must find a protector"
 deluge.2.b:0 "Strike his name from the register of the nobility"

 deluge.3.t:0 "Three Crowns Bid for the Host"
 deluge.3.d:0 "The Commonwealth is on its knees, and every envoy in Europe knows where the Host's regiments are. Stockholm proposes a northern league and speaks of a Ruthenian principality guaranteed by Swedish arms. Moscow reminds us, coldly, of the oath at Pereiaslav. Transylvania offers a share in whatever is carved up. For one season the Host is courted rather than commanded - and such seasons are short."
 deluge.3.a:0 "Take the Swedish league"
 deluge.3.b:0 "The oath at Pereiaslav holds"
 deluge.3.c:0 "Treat with all of them and bind ourselves to none"

 deluge.4.t:0 "The Treaty of Radnot"
 deluge.4.d:0 "The compact is drawn: Sweden takes the north, Brandenburg Wielkopolska, Rakoczi the crown itself, and the Host the Ruthenian palatinates from the Dniester to the Berezina. It is the first document in which a foreign power writes our borders as though they were already a country. Rakoczi asks for regiments to march with him into Poland."
 deluge.4.a:0 "Send the regiments south"
 deluge.4.b:0 "Set our seal to it and keep the Host at home"

 deluge.5.t:0 "The Tide Turns"
 deluge.5.d:0 "The Swedes failed before the monastery at Jasna Gora, and the story has done what no edict could: the peasantry that shrugged at the invasion is now cutting off foraging parties in every wood. The king has returned and swears at Lviv to protect the commons and to hold the realm under the Virgin's patronage. The confederates are gathering at Tyszowce."
 deluge.5.a:0 "Swear the oath at Lviv"
 deluge.5.b:0 "Vows will not clear a province - soldiers will"

 deluge.6.t:0 "The Peace of Oliva"
 deluge.6.d:0 "The Swedes are gone and the crown has kept its title, but Livonia is signed away, the treasury is a memory, and whole palatinates will not pay a groat for a generation. The nobles who bent the knee at Ujscie and Kedainiai are pardoned - there are too many of them to punish. What survived the flood is a realm the magnates now own outright."
 deluge.6.a:0 "The realm stands, diminished"

 # --- modifiers ------------------------------------------------------------

 deluge_the_flood:0 "The Deluge"
 desc_deluge_the_flood:0 "Armies quarter where they please and the palatinates pay whoever is nearest."
 deluge_kedainiai:0 "The Union of Kedainiai"
 desc_deluge_kedainiai:0 "Lithuania has a Swedish protector and the magnates who arranged it are content."
 deluge_magnate_attainder:0 "Attainder of the Magnates"
 desc_deluge_magnate_attainder:0 "The crown struck their names from the register. The remaining houses took note."
 deluge_northern_league:0 "The Northern League"
 desc_deluge_northern_league:0 "The Host marches in Swedish company, and Europe treats with it as a power."
 deluge_tsars_shadow:0 "The Tsar's Shadow"
 desc_deluge_tsars_shadow:0 "The oath at Pereiaslav was kept. Moscow remembers it, and expects it kept again."
 deluge_hetmans_double_game:0 "The Hetman's Double Game"
 desc_deluge_hetmans_double_game:0 "Envoys leave for three capitals with three different letters, and the chancery keeps no copies."
 deluge_radnot_partition:0 "The Radnot Compact"
 desc_deluge_radnot_partition:0 "Our borders were written into a foreign treaty. The regiments marched to make it true."
 deluge_signed_not_marched:0 "Signed, Not Marched"
 desc_deluge_signed_not_marched:0 "We set our seal to the partition and kept the regiments at home. The allies noticed."
 deluge_lviv_oath:0 "The Lviv Oath"
 desc_deluge_lviv_oath:0 "The king swore protection of the commons under the Virgin's patronage, and the realm answered."
 deluge_soldiers_peace:0 "A Soldiers' Peace"
 desc_deluge_soldiers_peace:0 "The provinces were cleared by regiments rather than by vows, and the army knows it."
 deluge_eastern_misgivings:0 "Eastern Misgivings"
 desc_deluge_eastern_misgivings:0 "The oath named a Catholic crown as the realm's protector. The Orthodox parishes heard it that way too."
 deluge_after_the_flood:0 "After the Flood"
 desc_deluge_after_the_flood:0 "The realm survived. The treasury, the Livonian ports and the crown's authority over the magnates did not."

 # --- opinion modifiers ----------------------------------------------------

 deluge_league_partner:0 "Stood with us in the northern league"
 deluge_broke_faith:0 "Broke faith during the Deluge"
 deluge_kept_faith:0 "Kept faith during the Deluge"

 # ==========================================================================
 # THE REFORMATION IN THE COMMONWEALTH
 # ==========================================================================

 pl_reformation.1.t:0 "The Magnates Change Confession"
 pl_reformation.1.d:0 "Prince Radziwill has turned his Vilnius court over to the Calvinists, and his presses are already printing psalters in Polish. Half the senate follows where the great houses lead. The nobles argue that a lord answers for his own chapel and no bishop may enter his gates uninvited; the papal nuncio calls this the ruin of the realm. Neither side speaks of the Orthodox, who are watching very closely."
 pl_reformation.1.a:0 "A lord answers for his own chapel"
 pl_reformation.1.b:0 "The crown will not break with Rome"

 pl_reformation.2.t:0 "The Brethren at Rakow"
 pl_reformation.2.d:0 "A congregation at Rakow now denies the Trinity outright and holds that a Christian may bear no sword. Even the Calvinists disown them. Yet their school teaches Greek and Hebrew better than any in the realm, and their printers will set any manuscript brought to them - including, it is said, those the Orthodox brotherhoods cannot print at home."
 pl_reformation.2.a:0 "Let them print and dispute"
 pl_reformation.2.b:0 "Curb the radicals, spare the rest"

 pl_reformation.3.t:0 "The Warsaw Confederation"
 pl_reformation.3.d:0 "The assembled nobles would bind the next king by oath: that those who differ in religion keep peace among themselves, and that no man be punished in blood or goods for his confession. The bishops refuse their seals. The lords answer that a king who will not swear it will not be crowned - and that the oath covers the Greek rite no less than the Augsburg."
 pl_reformation.3.a:0 "Swear it, and bind the crown"
 pl_reformation.3.b:0 "No oath binds the crown in matters of faith"

 pl_reformation.4.t:0 "The Brotherhoods Take Their Chance"
 pl_reformation.4.d:0 "While the great houses quarrel over confessions, the burghers of Lviv and Vilnius have quietly chartered brotherhoods of their own - lay guilds that keep a school, a press, and a hospital, and that answer to the patriarch rather than to the local bishop. Prince Ostrogski has endowed an academy at Ostroh on the same pattern. The bishops complain that laymen now examine their clergy."
 pl_reformation.4.a:0 "Confirm their charters"
 pl_reformation.4.b:0 "The schools belong under the bishops"

 pl_reformation.5.t:0 "The Colleges Reclaim the Sons"
 pl_reformation.5.d:0 "The Jesuit colleges have done in one generation what no edict could: the sons of Calvinist magnates come home speaking Latin and hearing Mass. Father Skarga preaches that there is one Church and that the Greeks stand outside it. The Protestant lords are dwindling, and the shelter their quarrel gave the Orthodox is going with them. The eastern bishops can read the season as well as anyone."
 pl_reformation.5.a:0 "Let the colleges do their work"
 pl_reformation.5.b:0 "The Confederation still binds us"

 # --- modifiers ------------------------------------------------------------

 pl_magnate_confessions:0 "Magnate Confessions"
 desc_pl_magnate_confessions:0 "The great houses keep their own chapels and their own preachers, and the crown looks away."
 pl_early_catholic_stand:0 "The Crown Holds with Rome"
 desc_pl_early_catholic_stand:0 "The king was seen at Mass while the senate argued. Rome is grateful; the senate is not."
 pl_brethren_presses:0 "The Brethren's Presses"
 desc_pl_brethren_presses:0 "Rakow sets Greek and Hebrew type for anyone who brings a manuscript, and asks few questions about the rite."
 pl_confederation_oath:0 "The Warsaw Confederation"
 desc_pl_confederation_oath:0 "Those who differ in religion keep peace among themselves. Sworn by the crown, and read broadly by the Greek rite."
 pl_confession_of_the_crown:0 "Confession of the Crown"
 desc_pl_confession_of_the_crown:0 "One king, one faith. The dissenting lords have not forgotten being told so."
 pl_orthodox_brotherhoods:0 "Orthodox Brotherhoods"
 desc_pl_orthodox_brotherhoods:0 "Chartered lay guilds keep the schools, the presses and the hospitals, and answer to the patriarch."
 pl_episcopal_schools:0 "Episcopal Schools"
 desc_pl_episcopal_schools:0 "The bishops kept the schools in their own hands, and the brotherhoods with them."
 pl_jesuit_colleges:0 "The Jesuit Colleges"
 desc_pl_jesuit_colleges:0 "The colleges teach better than their rivals and return the sons of dissenters to Rome."
 pl_confederation_upheld:0 "The Confederation Upheld"
 desc_pl_confederation_upheld:0 "The oath of 1573 still stands, whatever the nuncio writes to Rome."

 # --- the free election

 free_election.1.t:0 "The Throne Falls Vacant"
 free_election.1.d:0 "The king is dead and the realm has no heir to hand it to, because it never agreed to have one. Until an election is held there is no crown, only a primate holding the seal and a diet that has to be summoned. Everyone concerned has done this before and knows exactly what it will cost."
 free_election.1.a:0 "Summon the election sejm"
 free_election.1.b:0 "Let the primate hold the seal"
 free_election.1.c:0 "Let the great houses arrange it"

 free_election.2.t:0 "The Pacta Conventa"
 free_election.2.d:0 "The candidate is handed the terms before he is handed the crown: what he may not tax, what he may not raise, whom he may not appoint, and what the estate may lawfully do if he forgets. Every king since the line failed has signed this. Two of them have since tried to find out what happens if he does not."
 free_election.2.a:0 "Sign the articles"
 free_election.2.b:0 "Refuse the articles"
 free_election.2.c:0 "Pay for the votes instead"

 free_election.3.t:0 "A Candidate From Outside"
 free_election.3.d:0 "A foreign prince has entered his name, and his backers are counting on the fact that a king with no relatives here has no faction here either. He brings money, an army that is not ours, and a treaty obligation nobody at the election field has read carefully."
 free_election.3.a:0 "Take the foreign prince"
 free_election.3.b:0 "Take one of our own"

 free_election.4.t:0 "The Rokosz"
 free_election.4.d:0 "A confederation has formed against the election and is riding under its own banners, which the law permits it to do. Its leaders say they are defending the liberties rather than attacking the crown, and they are not entirely wrong, which is the difficulty."
 free_election.4.a:0 "Put it down"
 free_election.4.b:0 "Hear them out"

 rip_pacta_conventa:0 "The Pacta Conventa"
 rip_rokosz_put_down:0 "A Rokosz Put Down"
 pol_restore_sejm_discipline_title:0 "Restore Sejm Discipline"
 pol_restore_sejm_discipline_desc:0 "Reimpose procedure on the Sejm so that liberum veto and factionalism no longer paralyse the Commonwealth."
 pol_reaffirm_union_title:0 "Reaffirm the Union"
 pol_reaffirm_union_desc:0 "Renew the pact with Lithuania, binding Vilnius and Kraków into a single, resilient Commonwealth."
 pol_ruthenian_compact_title:0 "Ruthenian Compact"
 pol_ruthenian_compact_desc:0 "Guarantee Ruthenian liberties while integrating their lands, tempering rebellion with real representation."
 pol_guardian_of_frontier_title:0 "Guardian of the Frontier"
 pol_guardian_of_frontier_desc:0 "Raise commissariats along Podillia to hold steppe raids at bay and project Polish power across the border marches."
 pol_hadiach_commission_title:0 "Summon the Hadiach Commission"
 pol_hadiach_commission_desc:0 "Convene Ruthenian and Cossack deputies to renegotiate the Hadiach articles, showing that our parliament honours their liberties."
 pol_codify_hadiach_privileges_title:0 "Codify Hadiach Privileges"
 pol_codify_hadiach_privileges_desc:0 "Formalise the liberties promised at Hadiach by seating subject delegations in the Sejm and sealing their charters."
 pol_triatomic_commonwealth_title:0 "Commonwealth of Three Nations"
 pol_triatomic_commonwealth_desc:0 "Realise the tri-nation Commonwealth by binding Ruthenian lands into our administration and balancing their estates with ours."
 POL_hadiach_commission_subject_tt:0 "Have at least one loyal Ruthenian or Cossack subject with Liberty Desire below §G50%§!."
 POL_hadiach_seats_tt:0 "Seat at least §Y3§! Ruthenian provinces in parliament to uphold the Hadiach guarantees."
 POL_triatomic_integration_tt:0 "Own at least §Y10§! provinces in the Ruthenia region."
 POL_triatomic_autonomy_tt:0 "All owned provinces in the Ruthenia region have autonomy below §Y40%§!."
 pol_professionalize_army_title:0 "Professionalise the Army"
 pol_professionalize_army_desc:0 "Invest in permanent commissions that drill our regiments and curb the excesses of private magnate levies."
 pol_hussar_reform_title:0 "Reform the Winged Hussars"
 pol_hussar_reform_desc:0 "Codify hussar pay, remounts, and tactics so their charges remain the terror of Europe."
 pol_secure_grain_trade_title:0 "Secure the Grain Trade"
 pol_secure_grain_trade_desc:0 "Dominate the Vistula markets and Baltic entrepôts so Polish grain continues to feed the continent."
 pol_sejm_reform:0 "Reformed Sejm"
 desc_pol_sejm_reform:0 "Rules of order and loyal commissions carry Commonwealth bills through the parliament without the usual chaos."
 pol_commonwealth_legacy:0 "Commonwealth Legacy"
 desc_pol_commonwealth_legacy:0 "The revived union of Kraków and Vilnius steadies our diplomacy and lets the chancery clasp distant provinces without strain."
 pol_ruthenian_pact:0 "Ruthenian Pact"
 desc_pol_ruthenian_pact:0 "Ruthenian estates now enjoy protections that quell unrest and broaden our cultural base."
 pol_frontier_commissariat:0 "Frontier Commissariat"
 desc_pol_frontier_commissariat:0 "Commissariats along the marches keep levy ledgers current and spirits high along the steppe frontier."
 pol_army_commission:0 "Army Commission"
 desc_pol_army_commission:0 "Permanent commissions drill the army relentlessly, slowing the decay of our martial traditions."
 pol_winged_hussars:0 "Winged Hussars"
 desc_pol_winged_hussars:0 "Reformed hussar banners thunder across the field with unmatched ferocity while remount stables spare the treasury."
 pol_grain_headlands:0 "Grain Headlands"
 desc_pol_grain_headlands:0 "Grain ports on the Baltic yield larger profits as merchants queue to load Commonwealth harvests."
 pol_hadiach_commission:0 "Hadiach Commission"
 desc_pol_hadiach_commission:0 "Commissioners from Ruthenian lands sit in our chambers, lending diplomatic weight and lowering the leverage of subject estates."
 pol_hadiach_charters:0 "Hadiach Charters"
 desc_pol_hadiach_charters:0 "The codified Hadiach privileges add loyal deputies to the Sejm and help provincial debates sail through committees."
 pol_triatomic_compact:0 "Compact of Three Nations"
 desc_pol_triatomic_compact:0 "A Commonwealth of three nations steadies unrest, deepens tolerance, and shares governing burdens across Ruthenia."
 supports_ruthenian_confederation:0 "Supports the Kyivan Confederation"

