 rip_church_gui_florence_tt:0 "Invoke an alternative settlement drawing on the Florentine precedent of 1439, not the founding of the UGCC. Separate from the Brest route of 1596. Begin in 1444-1501: §Y200 ADM, 100 DIP and one year of income§!. Requires peace, stability +2, PAP opinion +100 and an eligible Orthodox core province. After five years, peace, stability and relations are checked again. Orthodox acceptance changes state faith; Catholic completion grants patronage and changes one eligible province to Greek Catholic. This is a campaign-created alternative, not a claim of an institution founded in 1439. One attempt."
