 vol_crown_and_sejmik_reform:0 "Estate Compact"
 vol_cultural_flowering:0 "Cultural Flowering"
 vol_cultural_flowering_desc:0 "Art, science, and literature flourish in our enlightened realm."
 vol_cultural_golden_age:0 "Cultural Golden Age"
 vol_cultural_golden_age_desc:0 "Arts, letters, and learning bloom throughout the realm in a rare golden age."
 vol_cultural_tolerance:0 "Cultural Tolerance"
 vol_cultural_tolerance_desc:0 "Our realm welcomes peoples of all cultures and backgrounds."
 VOL_deal_with_the_boyar_mission_desc:0 "The Boyars have been a strong political force in our state since ancient times. It is necessary to come to an agreement with them so that neither they nor we suffer, preserving their status while gaining their political power for ourselves."
 VOL_deal_with_the_boyar_mission_title:0 "Deal with the Boyars"
 VOL_dealt_with_the_boyar:0 "Conciliation with the Boyars"
 VOL_declare_independence_desc:0 "For too long have we been oppressed by foreign powers since the Mongols conquered the Rus. It is time for us to take charge of our own fate."
 VOL_declare_independence_title:0 "Declaration of Independence"
 VOL_demolish_lithuania_desc:0 "Expel Lithuania and the Commonwealth from all Ruthenian lands and end their regional hegemony—or bring them under our authority. This is an optional imperial ambition."
 VOL_demolish_lithuania_title:0 "Humble Lithuania"
 VOL_demolish_MOS_desc:0 "Expel Muscovy and Russia from all Ruthenian lands and break their regional dominance—or bring them under our authority. This is an optional imperial ambition."
 VOL_demolish_MOS_title:0 "Humble Muscovy"
 VOL_demolish_poland_desc:0 "End Polish supremacy over the borderlands by expelling Poland from Ruthenia and Lesser Poland and breaking its great-power standing—or by bringing the Polish crown under our authority."
 vol_demolish_poland_hlc_path_req_tt:0 "Galicia has settled how its lands are to be governed."
 vol_demolish_poland_military_route_req_tt:0 "Military route: achieve overwhelming force posture and prestige without alliance support."
 VOL_demolish_poland_title:0 "Break Polish Hegemony"
 VOL_develop_capitals_desc:0 "Raise Volodymyr and Halych to at least 20 development so these regional centres anchor our administration."
 VOL_develop_capitals_title:0 "Develop the Capitals"
 vol_diplomatic_ascendancy:0 "Diplomatic Ascendancy"
 vol_diplomatic_ascendancy_desc:0 "Our diplomatic prowess is recognized throughout Europe."
 vol_diplomatic_focus:0 "Diplomatic Focus"
 vol_diplomatic_focus_desc:0 "We are pursuing an imperial path based on diplomacy and dynastic marriages."
 vol_diplomatic_web:0 "Diplomatic Web"
 vol_diplomatic_web_desc:0 "Our network of alliances protects our interests."
 VOL_druzhyna:0 "Druzhyna"
 VOL_druzhyna_desc:0 "The Druzhyna is an elite military formation in Rus' composed of the nobility."
 VOL_dynastic_marriages_desc:0 "Maintain five royal marriages and at least two diplomatic reputation, or demonstrate military tradition, prestige and legitimate authority."
 vol_dynastic_marriages_military_route_tt:0 "Military route: demonstrate sovereign prestige, army tradition, and elite legitimacy without dynastic webbing."
 VOL_dynastic_marriages_title:0 "Dynastic Marriages"
 VOL_dynastic_network_tooltip:0 "Dynastic network expanded."
 vol_dynastic_prestige:0 "Dynastic Prestige"
 vol_dynastic_prestige_desc:0 "Our dynasty sits on multiple thrones, bringing great prestige."
 vol_dynastic_ties:0 "Dynastic Ties"
 vol_dynasty_prestige:0 "Dynastic Prestige"
 vol_dynasty_prestige_desc:0 "Our royal house is renowned across Europe."
 VOL_dynasty_spread_tooltip:0 "Our diplomatic network gains prestige and capacity. No foreign dynasty is changed by this reward."
 vol_eastern_prosperity:0 "Eastern Prosperity"
 VOL_education_edict_desc:0 "Carry the teachers, printers, and statutes of Ostroh across our principalities, linking Volhynia with the schools of Kyiv and Lviv."
 VOL_education_edict_title:0 "Edict of Learning"
 vol_educational_reform:0 "Educational Reform"
 vol_educational_reform_desc:0 "Our investment in education bears fruit across the realm."
 vol_elective_principles:0 "Elective Principles"
 vol_empire_proclaimed_req_tt:0 "The Ruthenian Empire must already be proclaimed."
 vol_enlightened_realm:0 "Enlightened Realm"
 vol_enlightened_realm_desc:0 "Education and learning have transformed our nation."
 VOL_establish_sejm_desc:0 "Invest 100 administrative power to convene a regular noble Sejm, giving the estates a lawful voice in the governance of the realm."
 VOL_establish_sejm_title:0 "Establish the Sejm"
 vol_eternal_union:0 "Eternal Union"
 VOL_expand_Chumatsky_Way_mission_desc:0 "Support Halych's markets and the Dniester trade connecting them with the saltworks of Subcarpathia, including Drohobych. Galician salt supplied eastern markets alongside the distinct southern salt-caravan routes."
 VOL_expand_Chumatsky_Way_mission_title:0 "Galician Salt Trade"
 VOL_far_north_desc:0 "Campaigns in Pskov, Novgorod and Tver open a new northern imperial frontier. This is a ruler's programme of expansion, not the restoration of former Galician-Volhynian borders."
 VOL_far_north_title:0 "Greater Rus"
 VOL_fortress_city:0 "Fortress City"
 VOL_fortress_city_desc:0 "In keeping with our state's tradition, all cities must be fortified against attacks."
 VOL_full_army_desc:0 "Restore the medieval stone works and garrison quarters of Volhynia - from Volodymyr to Lubart's Castle at Lutsk - providing a permanent fortress and barracks for our western host."
 VOL_full_army_title:0 "Volhynian Stronghold"
 vol_galician_brotherhood:0 "Galician Brotherhood"
 VOL_godliness:0 "The Godly State"
 vol_golden_liberty:0 "Golden Liberty"
 vol_golden_liberty_desc:0 "The liberties of our nobility are enshrined in law, granting the Sejm and estates broad constitutional freedom."
 vol_grand_duchess_authority:0 "Grand Duchess Authority"
 vol_grand_ruthenia_hegemony:0 "Ruthenia's Hegemony"
 vol_grand_ruthenia_modifier:0 "Grand Ruthenia"
 vol_grand_ruthenia_reform:0 "Grand Ruthenia"
 VOL_ideas:0 "Halyzisch-wolhynische Ideen"
 VOL_ideas_bonus:0 "Halyzisch-wolhynische Ambitionen"
 VOL_ideas_start:0 "Halyzisch-wolhynische Traditionen"
 vol_imperial_capital:0 "Imperial Capital"
 vol_imperial_capital_desc:0 "This city serves as one of our twin capitals, a center of power and culture."
 vol_imperial_coronation:0 "Imperial Coronation"
 vol_imperial_coronation_desc:0 "The coronation of our Emperor has been celebrated throughout Europe."
 vol_imperial_triumph:0 "Imperial Triumph"
 vol_imperial_triumph_desc:0 "Through dynastic marriages and diplomatic mastery, our empire stands supreme."
 VOL_integrate_north_desc:0 "Recognise Belarusian culture and support the administration of our northern provinces. Local languages and faiths remain protected."
 VOL_integrate_north_title:0 "Northern Integration"
 VOL_invest_in_eastern_rus_mission_desc:0 "Develop manufactories, workshops and commercial centres in the eastern lands. This programme supports early modern production and trade; it does not represent the later industrial coal basin."
 VOL_invest_in_eastern_rus_mission_title:0 "Eastern Manufactories"
 VOL_invest_in_west_rus_mission_desc:0 "Building infrastructure to support trade in the western lands will enrich the people and increase production. Their wealth will also contribute to our own enrichment."
 VOL_invest_in_west_rus_mission_title:0 "Wealth of the People"
 VOL_invested_in_rus:0 "Regional Commercial Infrastructure"
 VOL_king_power_desc:0 "Strengthen crown lands and royal administration in Red Ruthenia. Better-organised service obligations replenish the army and develop its military experience."
 VOL_king_power_title:0 "Glory and Honor"
 VOL_land_collector_desc:0 "The conquest of Lithuania and the northern principalities establishes a new empire. These ambitions extend beyond restoring the Romanovych state and represent our ruler's own alternative-history programme."
 VOL_land_collector_title:0 "Gatherer of Rus'"
 vol_lithuania_hegemony_broken_tt:0 "Neither Lithuania nor the Commonwealth exists independently as a regional hegemon: each must be gone, our subject, or driven out of Ruthenia without Great Power standing and below half our military strength."
 VOL_magdeburg_laws:0 "Magdeburg Laws"
 VOL_magdeburg_laws_desc:0 "The Magdeburg Laws provided cities with a legal framework that enhanced trade and administration, increasing tax revenue."
 vol_magdeburg_rights:0 "Magdeburg Law Charter"
 vol_magnate_alliance_req_tt:0 "A durable alliance with the magnates must be secured."
 vol_magnate_support:0 "Magnate Support"
 vol_magnate_support_desc:0 "The great nobles of the realm support our rule."
 VOL_manage_magnates_desc:0 "Win the confidence of the great magnate houses while curbing private lawlessness along the frontier."
 VOL_manage_magnates_title:0 "Manage the Magnates"
 VOL_manage_minorities_desc:0 "Restore peace in all our Polish, Lithuanian, Hungarian and Romanian communities, or in ten provinces if none are present. Confirm permanent protection for the faiths of our diverse realm."
 VOL_manage_minorities_title:0 "Manage Minorities"
 vol_manage_minorities_unlock_req_tt:0 "Minority rights policy must be unlocked by prior constitutional choices."
 VOL_mastery_of_the_steppes:0 "The Steppes' Masteries"
 vol_minority_rights:0 "Minority Rights"
 vol_minority_rights_desc:0 "Local minorities enjoy special protections and privileges."
 VOL_mod_arch:0 "Church Building Patronage"
 vol_monarchical_centralization:0 "Monarchical Centralization"
 vol_multicultural_realm:0 "Multicultural Realm"
 vol_multicultural_realm_desc:0 "We have embraced the diversity of our empire, creating a harmonious many-peopled state."
 vol_muscovy_hegemony_broken_tt:0 "Neither Muscovy nor Russia exists independently as a regional hegemon: each must be gone, our subject, or driven out of Ruthenia without Great Power standing and below 60% of our military strength."
 vol_northern_integration:0 "Northern Integration"
 VOL_old_capital_desc:0 "Kyiv stands once more under our banner. Let us restore our court to the ancient seat of the grand princes and anchor all Rus' on the Dnieper."
 VOL_old_capital_title:0 "Kyiv is Ours"
 vol_orthodox_confesionalism:0 "Orthodox Confessionalism"
 vol_orthodox_consolidated:0 "Orthodox Consolidated"
 vol_ostroh_bible_legacy:0 "Legacy of the Ostroh Bible"
 vol_ostroh_printing_house:0 "Ostroh Printing House"
 vol_path_events.1.a:0 "Pursue diplomacy."
 vol_path_events.1.b:0 "Pursue constitutional reform."
 vol_path_events.1.d:0 "Envoys urge us to look abroad for allies. The estates would have us settle a question nearer home first: who may levy taxes and whose consent must the crown obtain?"
 vol_path_events.1.t:0 "Volhynia Chooses Its Path"
 vol_path_events.2.a:0 "Strengthen dynastic ties."
 vol_path_events.2.d:0 "Our envoys report that the name of our house opens doors at neighbouring courts. A marriage agreed now might secure a hearing for our heirs long after the present treaties lapse."
 vol_path_events.2.t:0 "Dynastic Strategy"
 vol_path_events.3.a:0 "Empower the sejm."
 vol_path_events.3.b:0 "Maintain royal control."
 vol_path_events.3.d:0 "The deputies of the Sejm ask that matters of taxation and service be laid before them. The crown's councillors are reluctant to yield powers they have long exercised alone."
 vol_path_events.3.t:0 "Sejm Debates"
 vol_path_events.4.a:0 "Patronize culture."
 vol_path_events.4.d:0 "Printers have brought their first sheets to court, and painters are seeking patrons among the great houses. A grant from our treasury would keep their workshops at home."
 vol_path_events.4.t:0 "Cultural Flowering"
 vol_path_events.5.a:0 "Grant protections."
 vol_path_events.5.b:0 "Deny protections."
 vol_path_events.5.d:0 "Delegates from communities that follow other customs have petitioned for protection. They ask for letters their magistrates can produce when a local officer challenges their rights."
 vol_path_events.5.t:0 "Minority Rights"
 vol_path_events.6.a:0 "Set our seal to the articles."
 vol_path_events.6.b:0 "Return the draft to the deputies."
 vol_path_events.6.d:0 "The deputies have put the rights of crown and estates on parchment. Once the articles bear our seal, either side may appeal to them when the next dispute comes before the court."
 vol_path_events.6.t:0 "Articles for Crown and Estates"
 vol_path_events.7.a:0 "Seek imperial recognition."
 vol_path_events.7.d:0 "Our envoys still take their places behind those of the imperial courts. The great houses now urge us to claim a title worthy of the lands that answer to our seal."
 vol_path_events.7.t:0 "Imperial Ambitions"
 vol_path_events.8.a:0 "Endow Herasym Smotrytsky's trilingual chair"
 vol_path_events.8.b:0 "Equip Ivan Fedorov's printing workshop"
 vol_path_events.8.d:0 "In 1576 Prince Kostiantyn-Vasyl Ostrozky's patronage brought Greek, Latin, and Church Slavonic teachers together at Ostroh. As halls and bursaries open in Volhynia, the academy's curators ask whether to widen the trilingual curriculum under rector Herasym Smotrytsky or invest first in a printing workshop under master printer Ivan Fedorov."
 vol_path_events.8.t:0 "The Ostroh Academy"
 vol_path_events.9.a:0 "Distribute copies to our parishes and brotherhoods"
 vol_path_events.9.b:0 "Send presentation volumes across Europe"
 vol_path_events.9.d:0 "After years of collating Greek and Slavonic manuscripts, the Ostroh press has completed the full printed Church Slavonic Bible of 1581. Bound volumes now wait in the academy scriptorium for distribution across parish churches, brotherhood schools, and foreign courts."
 vol_path_events.9.t:0 "The Ostroh Bible"
 vol_poland_hegemony_broken_tt:0 "Poland no longer exists, is our subject, or has been expelled from Ruthenia, Red Ruthenia, Malopolska, and Sandomierz while losing Great Power standing and falling below half our military strength."
 VOL_prince_general:0 "Prince-General"
 VOL_prince_general_desc:0 "Our country's military high command holds a core tradition where the head of state inspires our troops with their bravery and leads them into battle..."
 VOL_prosperity_desc:0 "Develop ten provinces across Volhynia, Red Ruthenia, and Podillia to build a flourishing heartland of towns and estates."
 VOL_prosperity_title:0 "Prosperity"
 vol_prosperous_realm:0 "Prosperous Realm"
 vol_prosperous_realm_desc:0 "Wise governance has brought prosperity to our lands."
 VOL_protectors_of_ruthenia:0 "Guardians of Rus'"
 VOL_re_establishment_of_kyiv:0 "Re-establishment of Kyiv"
 VOL_rebuild_nation:0 "Rebuilding the Nation"
 vol_regional_power:0 "Regional Power"
 vol_religious_harmony:0 "Religious Harmony"
 vol_religious_harmony_desc:0 "The diverse faiths of our realm coexist in peace."
 VOL_religious_settlement_desc:0 "Achieve 90% religious unity under our chosen confessional policy to bring lasting peace to our parishes."
 VOL_religious_settlement_title:0 "Religious Settlement"
 vol_religious_tolerance:0 "Religious Tolerance"
 VOL_renaissance_court_desc:0 "With the printing press active in Ostroh under Ivan Fedorov, gather theologians and philologists to complete the monumental 1581 Ostroh Bible—the first full printed Church Slavonic scripture."
 VOL_renaissance_court_title:0 "The Ostroh Bible"
 VOL_renaissance_mission_desc:0 "The so-called Renaissance has arrived in our lands, bringing with it a rebirth of the ideas of antiquity. It may be useful for our state to adopt these ideas and reclaim what the Mongol Horde took from us. May the winds of the West guide us towards a new era of prosperity."
 VOL_renaissance_mission_title:0 "The Western Wind"
 VOL_restore_ruthenia_desc:0 "How can we unite Rus' without controlling its heart on the Dnieper?"
 VOL_restore_ruthenia_title:0 "Heart of Rus'"
 VOL_rex_of_rus:0 "Rex of Rus'"
 VOL_rex_of_rus_desc:0 "In 1253, Danylo Romanovych was crowned King of Rus at Dorohychyn by a papal legate. His royal title provides a historical precedent for our alternative-history claim to the crown."
 vol_ruthenia_reform:0 "Ruthenian Constitution"
 vol_ruthenia_reform_desc:0 "The Constitutional Assembly has established the fundamental law of Grand Ruthenia, establishing a balance between monarchical authority, noble privilege, and the rights of all subjects."
 vol_ruthenia_triumphant_branch_req_tt:0 "Diplomatic path: three subjects and either three royal marriages or three diplomatic reputation. Constitutional path: Golden Liberty, stability of three and legitimacy equivalent of 95."
 VOL_ruthenia_triumphant_desc:0 "With 600 development and Great Power standing, crown our imperial ambitions and establish Ruthenia as a preeminent European realm."
 VOL_ruthenia_triumphant_title:0 "Ruthenia Triumphant"
 VOL_ruthenia_triumphant_tooltip:0 "Ruthenia triumphs on the world stage."
 vol_ruthenian_consolidation:0 "Ruthenian Consolidation"
 vol_ruthenian_empire:0 "Ruthenian Empire"
 vol_ruthenian_empire_desc:0 "We have proclaimed an imperial crown, standing supreme among the realms of Eastern Europe."
 VOL_ruthenian_hegemony_desc:0 "Reach 400 development and field forty regiments to proclaim a new imperial programme in Eastern Europe. This alternative-history ambition goes beyond the restoration of Galicia-Volhynia."
 VOL_ruthenian_hegemony_title:0 "Ruthenian Hegemony"
 VOL_ruthenian_liberty_desc:0 "Uphold high stability and legitimacy under our constitutional statutes to secure the golden liberties of the Ruthenian nobility."
 VOL_ruthenian_liberty_title:0 "Ruthenian Liberty"
 VOL_ruthenian_renaissance:0 "Renaissance of Rus'"
 vol_ruthenian_renaissance_modifier:0 "Ruthenian Renaissance"
 vol_ruthenian_renaissance_reform:0 "Ruthenian Renaissance"
 vol_ruthenian_sejm:0 "Ruthenian Sejm"
 vol_ruthenian_sejm_desc:0 "The Sejm provides a forum for nobles to deliberate on national affairs."
 vol_sejm_established_req_tt:0 "The Sejm must already be established."
 VOL_stability_desc:0 "We have achieved state stability and can provide security to our citizens within our borders."
 VOL_stability_title:0 "State Stability"
 vol_successful_reform:0 "Successful Reform"
 vol_successful_reform_desc:0 "Recent constitutional reforms have strengthened our government."
 vol_tolerance_edict:0 "Tolerance Edict"
 vol_twin_capitals:0 "Twin Capitals"
 vol_twin_capitals_desc:0 "Volhynia and Halych serve as twin jewels of our empire."
 vol_uniate_protected:0 "Uniate Protected"
 vol_uniate_synthesis:0 "Uniate Concord"
 VOL_unite_galicia_desc:0 "Reuniting Galicia and Volhynia is an alternative-history project inspired by the legacy of the Romanovych state. Reconcile the regional elites and rebuild a common political centre."
 VOL_unite_galicia_title:0 "Halych and Volhynia"
 VOL_unity:0 "United We Stand"
 VOL_university_expansion_desc:0 "In 1576, Prince Kostiantyn-Vasyl Ostrozky founded the Slavic-Greek-Latin Academy at Ostroh, bringing together scholars and teachers. Endow this centre of Ruthenian learning in the province of Rivne, which represents Ostroh on the game map. Earlier foundation is an alternative-history possibility."
 VOL_university_expansion_title:0 "Ostroh Academy"
 vol_voivode_council:0 "Council of Voivodes"
 vol_voivode_empowered:0 "Voivodes Empowered"
 vol_voivodeship_assembly_reform:0 "Frontier Chancery"
 vol_voivodeship_reform:0 "Voivodeship Tradition"
 vol_voivodeship_reform_desc:0 "The voivodes of Volhynia gather to affirm their role in governance. The voivodeship becomes the foundation of our state structure."
 VOL_welcome_all_cultures_desc:0 "Accept Polish alongside our Ruthenian estates and uphold a realm where multiple peoples prosper under common law."
 VOL_welcome_all_cultures_title:0 "Welcome All Cultures"
 VOL_western_reforms:0 "Western Reforms"
 VOL_western_reforms_desc:0 "By establishing close ties with Western European states, we can implement similar reforms while maintaining our name and custom."
 volhynia_conquer_chernihiv_desc:0 "Chernihiv, an ancient city built by one of the great tribes of the Eastern Slavs before the establishment of Rus, holds great significance."
 volhynia_conquer_chernihiv_title:0 "Conquest of Old Chernihiv"
 volyn_halich_nation_desc:0 "We must reclaim the title of King Danylo Halytskyi Romanovych, bestowed upon him by Pope Innocent IV. Our state once stood on this land and was the last bastion of Rus' resistance against the Mongol Horde. While Kyiv has gained independence like us, the devastation caused by the horde prevents it from acting as the center of a once-powerful state like Rus'. Thus, by uniting Halych-Volhynia, we shall unite all of Rus', despite the roadblocks we will undoubtedly face."
 volyn_halich_nation_title:0 "Restoration of Halycia-Volhynia"
 WAR_VOIVODE:0 "War Voivode"
 WAR_VOIVODESSA:0 "War Voivodessa"
 WARRIOR_STATE:0 "Martial State"
 VOL_vistula_marches_title:0 "Vistula Marches"
 VOL_vistula_marches_desc:0 "The old western borders of King Danylo's Halych-Volhynia reached across Podlasie to the Upper Vistula, Lublin, Tarnów, Nowy Sącz, and the Carpathian passes. Bringing those borderlands under our rule reopens the direct road from Volodymyr and Lviv toward Kraków and the Baltic basin."
 vol_vistula_carpathian_march:0 "Vistula-Carpathian Marches"
 desc_vol_vistula_carpathian_march:0 "Secured passes across the Carpathians and Upper Vistula broaden the crown's western diplomatic reach and garrison posture."
