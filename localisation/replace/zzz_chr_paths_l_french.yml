l_french:

# The Siversk roads carry their English text into this language until a
# translator takes them. Source of truth: localisation/chr_paths_l_english.yml
# and localisation/chr_history_l_english.yml.

 # --- the nine government types of the three roads

 chr_desna_staple_reform:0 "Desna Staple"
 chr_desna_staple_reform_desc:0 "The chartered towns of the Desna keep one staple between them: hemp, potash and grain are unloaded, weighed and taxed where the Rada says, and sold on from there. Each magistrat keeps its own court and sends deputies rather than obedience. It works while the river is ours."

 chr_town_union_reform:0 "Union of the Siversk Towns"
 chr_town_union_reform_desc:0 "Chernihiv, Novhorod-Siverskyi and Starodub hold one treasury, one staple and three separate sets of privileges, and every levy is argued through all three magistrats before it is collected. The union holds crossings rather than provinces. What it cannot do is decide anything quickly."

 chr_rada_of_lands_reform:0 "Rada of the Lands"
 chr_rada_of_lands_reform_desc:0 "Every land of the Siverian country sends deputies to one Rada, and the marshal of the Rada executes what it agrees on and nothing else. Taxes are voted, garrisons are voted, and a land that votes against pays all the same. Whether that survives a long war has not been tested."

 chr_magistrat_rule_reform:0 "Rule of the Magistrat"
 chr_magistrat_rule_reform_desc:0 "The grain, salt and hemp houses have bought the seats on the magistrat outright, and the magistrat sets the tolls their own carts pay. The election is real and the outcome is known a year in advance. Nobody in the market square calls it anything but what it is."

 chr_siversk_principality_reform:0 "Siversk Principality"
 chr_siversk_principality_reform_desc:0 "The houses invited a prince, paid for his druzhina and wrote the terms themselves: he keeps the peace, the courts and the frontier, and they keep the tolls. A prince with a standing retinue reads such terms once and remembers them differently in the second year."

 chr_prykaz_tsardom_reform:0 "Tsardom of the Prykazy"
 chr_prykaz_tsardom_reform_desc:0 "Every branch of the business of the realm has its own office, its own seal and its own clerks: the frontier, the register, the salt, the post. The General Chancellery sits above them and the tsar sits above it. Offices multiply faster than the revenue that pays for them."

 chr_kanceliaryst_republic_reform:0 "Kanceliaryst Republic"
 chr_kanceliaryst_republic_reform_desc:0 "Office goes to whoever passes the chancery examination, whatever his father did, and the roll of service is read out in public. Sons of priests and sotnia clerks draft the statutes of the land in three languages. The examination is fair; the recommendation that gets a man to it is not."

 chr_dzhura_corps_reform:0 "Corps of the Dzhury"
 chr_dzhura_corps_reform_desc:0 "Boys are taken into the corps young, taught arms, letters and the roll, and rise as far as service carries them - and no further, because none of them may leave an office to a son. The corps chooses its master from among its own. A body that recruits its own rulers seldom picks a reformer."

 chr_many_nations_union_reform:0 "Union of Many Nations"
 chr_many_nations_union_reform_desc:0 "The lands under the roll keep their own law, their own rite and their own tongue, and answer to one chancery and one host. Every people brought in writes its clause into the union, and the clause outlives whoever conquered it. How many clauses can hold together at once nobody has counted."

