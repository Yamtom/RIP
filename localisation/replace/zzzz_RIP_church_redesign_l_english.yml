 desc_rip_church_ro_schism:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 rip_church.2.a:0 "Cultivate the Third Rome ideal"
 rip_church.2.b:0 "Emphasize our place among the Orthodox churches"
 rip_church.2.d:0 "Writers at the Muscovite court describe Moscow as a guardian of the Orthodox inheritance. This sixteenth-century political theology does not itself create a new creed or end communion with the eastern patriarchates. Universal jurisdiction would require a separate, deliberate claim."
 rip_church.2.t:0 "Moscow and the Third Rome"
 rip_church.3.d:0 "The ecclesiastical settlement recognizes our patriarchate within the wider Orthodox communion. Moscow accepts its place after the four ancient eastern patriarchates. Our centralized church remains a distinct political institution; recognition does not abolish its internal responsibilities."
 rip_church.3.t:0 "A Recognized Patriarchate"
 rip_church.5.d:0 "Our negotiated settlement has sustained a union that historically failed to gain lasting general acceptance. This is an alternative historical path: the Byzantine rite and its bishops remain, while communion with Rome is accepted. Parish integration will proceed locally."
 rip_church.5.t:0 "The Florentine Settlement Endures"
 rip_church.6.d:0 "Only one ten-year privilege may operate at a time. Eastern institutions draw on internal church authority; Roman support draws on Papal Standing. All options cost money. The position of Communion Balance determines which instruments are available."
 rip_church.6.t:0 "The Institutions of Communion"
 rip_church_active:0 "ACTIVE"
 rip_church_break_communion_desc:0 "Deliberate alternative history: abandon recognized communion and claim an independent universal church. This enables a second funded mission node, increases confessional conflict and imposes -1 diplomatic reputation. Earlier reconciliation payments are not refunded."
 rip_church_break_communion_title:0 "Renounce the patriarchal settlement"
 rip_church_center_absent:0 "No Centre of Union is established"
 rip_church_center_active:0 "Our Centre of Union is active"
 rip_church_center_button:0 "Found the Union's seat"
 rip_church_center_button_tt:0 "Only one centre exists worldwide. Costs 100 ADM and one year's income. Requires peace, stability 1, and a controlled Greek Catholic core with 10 development and a temple or cathedral. Twenty years between foundations. Occupation suspends the centre and reserves the world slot. Liberation restarts native conversion; its previous in-flight progress may be lost."
 rip_church_center_elsewhere:0 "The single Centre is held by another country"
 rip_church_center_suspended:0 "Our Centre is suspended by occupation"
 rip_church_close:0 "Close"
 rip_church_conversion_pressure:0 "Recent missionary pressure"
 rip_church_conversion_resistance:0 "Resistance to jurisdictional pressure"
 rip_church_east_button:0 "Toward the East"
 rip_church_east_button_tt:0 "Costs 25 ADM; move 20 toward Eastern autonomy. Five-year policy interval. Existing contracts keep their original expiry."
 rip_church_ecumenism_button:0 "Conclude ecumenical settlement"
 rip_church_ecumenism_button_tt:0 "Twenty years of union, ten years of balanced policy without forced conversion, stability 2, 60 Papal Standing, recognized Orthodox and Catholic parishes, and an Orthodox ally with opinion 100."
 rip_church_ecumenism_desc:0 "Twenty years of union, ten years of balanced policy without forced conversion, stability 2, 60 Papal Standing, recognized Orthodox and Catholic parishes, and an Orthodox ally with opinion 100."
 rip_church_ecumenism_title:0 "Conclude the ecumenical settlement"
 rip_church_florence_desc:0 "Alternative history, 1444–1501. Pay 200 ADM, 100 DIP and one year's income for five years of negotiations. Requires stability 2, peace and PAP opinion 100. Catholic patrons retain their state religion."
 rip_church_florence_title:0 "Sustain the Florentine union"
 rip_church_gc_coexistence:0 "Agreement on coexistence"
 rip_church_gc_coexistence_button:0 "Agreement of coexistence"
 rip_church_gc_coexistence_button_tt:0 "Balanced orientation, 20 Authority and 100 ducats; ten years: -0.5 unrest, +10% improve relations."
