 rip_ask_to_expand_the_register:0 "Ask to Expand the Register"
 rip_ask_to_expand_the_register_alert_tooltip:0 "We are asked to enlarge the register"
 rip_ask_to_expand_the_register_desc:0 "The register is the list of Cossacks the crown pays and therefore admits to exist. Enlarging it puts men on the roll before a campaign, and every man on the roll is one the starosta can no longer treat as a runaway. It has been enlarged before a war and quietly cut after it often enough that the Host counts the promise, not the parchment."
 rip_ask_to_expand_the_register_dialog:0 "[Root.GetName] asks us to enlarge the register before the campaign. More of ours on the roll is more of ours the lords cannot touch - and the roll has been enlarged before a war and cut after it often enough that the Host counts the promise, not the parchment."
 rip_ask_to_expand_the_register_title:0 "Ask to Expand the Register"
 rip_ask_to_expand_the_register_tooltip:0 "Ask the Host to put more men on the roll before the campaign. Men on the roll are men the starosta can no longer call runaways."
 rip_hadiach_compact:0 "The Hadiach Compact"
 rip_hadiach_offer_refused:0 "The Articles Were Refused"
 rip_hadiach_thinned:0 "The Thinned Articles"
 rip_offer_hadiach_terms:0 "Offer the Hadiach Terms"
 rip_offer_hadiach_terms_alert_tooltip:0 "The Hadiach articles have been offered to us"
 rip_offer_hadiach_terms_desc:0 "Offer a Grand Duchy of Ruthenia standing beside Poland and Lithuania: its own chancery, its own courts, its own army and its own seat at the diet. The offer was made once and ratified thin, and the war resumed. It can be made properly."
 rip_offer_hadiach_terms_dialog:0 "[Root.GetName] offers us the articles of Hadiach: a Grand Duchy standing beside the Crown and the Grand Duchy, with our own chancery, our own courts and our own hetman. It is everything the Host has asked for since Zboriv. It is also a text that has to pass their diet, and we have watched what their diet does to texts."
 rip_offer_hadiach_terms_title:0 "Offer the Hadiach Terms"
 rip_offer_hadiach_terms_tooltip:0 "Offer a Ruthenian court the articles agreed at Hadiach: a third seat beside Poland and Lithuania, if the diet will carry it."
 rip_petition_to_confirm_the_register:0 "Petition to Confirm the Register"
 rip_petition_to_confirm_the_register_alert_tooltip:0 "We are asked to confirm the register in writing"
 rip_petition_to_confirm_the_register_desc:0 "Not a larger register - the register we have, set down in a charter that outlives the campaign it was raised for. The Host has asked at Kurukove, at Pereiaslav and at Boryspil, and has been enlarged for a war and cut after it every time. Asking again costs nothing. Being refused again costs a great deal."
 rip_petition_to_confirm_the_register_dialog:0 "[Root.GetName] asks us to set the register down in a charter rather than agree it before each campaign. Granting it costs nothing today and costs everything the day we want the roll cut. Refusing it costs nothing today either, and they will remember which we chose."
 rip_petition_to_confirm_the_register_title:0 "Petition to Confirm the Register"
 rip_petition_to_confirm_the_register_tooltip:0 "Ask the overlord for the roll in a charter that outlives the campaign it was raised for."
 rip_register_asked_recently:0 "The Register Was Lately Argued"
 rip_register_confirmed:0 "The Register Confirmed"
 rozumovsky:0 "Rozumovsky"
 ruina_cossack_mobilization:0 "Cossack Mobilization"
 ruina_diplomatic_settlement:0 "Diplomatic Settlement"
 ruina_events.1.a:0 "Fortify our heartland!"
 ruina_events.1.b:0 "Seek protection from a powerful neighbor"
 ruina_events.1.c:0 "Rally the Cossack Host!"
 ruina_events.1.d:0 "The death of the great hetman has plunged our lands into chaos. Rival candidates backed by foreign powers tear at the fabric of our state, while armies march across devastated provinces. This is the beginning of what will be remembered as 'The Ruin.'"
 ruina_events.1.t:0 "The Ruina Begins"
 ruina_events.2.a:0 "Begin reconstruction"
 ruina_events.2.b:0 "Our veterans are hardened by war"
 ruina_events.2.c:0 "Secure peace through diplomacy"
 ruina_events.2.d:0 "After years of devastation, stability has finally returned to our lands. The cost was terrible - provinces lie in ruins, our population has fled, and foreign powers dictate terms - but we survived."
 ruina_events.2.t:0 "The Ruina Ends"
 ruina_events.3.a:0 "Crush the pretender!"
 ruina_events.3.b:0 "Negotiate a compromise"
 ruina_events.3.c:0 "Let them fight it out"
 ruina_events.3.d:0 "A rival hetman has emerged, claiming legitimacy and gathering supporters. Civil war threatens to tear us apart further."
 ruina_events.3.t:0 "Pretender Hetman Arises"
 ruina_events.4.a:0 "Resist with all our might!"
 ruina_events.4.b:0 "Accept vassalage"
 ruina_events.4.c:0 "Pay tribute to avoid invasion"
 ruina_events.4.d:0 "A neighboring power has decided to intervene in our internal crisis, either to impose their candidate or to vassalize us entirely."
 ruina_events.4.t:0 "Foreign Intervention"
 ruina_events.5.a:0 "Send relief"
 ruina_events.5.b:0 "They must fend for themselves"
 ruina_events.5.d:0 "One of our provinces has been ravaged by the constant warfare. Villages burn, fields lie fallow, and the population flees."
 ruina_events.5.t:0 "Province Devastated"
