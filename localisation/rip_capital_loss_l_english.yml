l_english:
 rip_seat_become_hlc_title:0 "Take the Name of [HLC.GetName]"
 rip_seat_become_hlc_desc:0 "[Root.GetName] has not held the seat that gave it its name for a generation, and its court has long sat elsewhere. The old capital of [HLC.GetName] is now ours. We may take that name and its arms, make that seat our capital and rule as its heirs. Our provinces, armies, ruler and treasury remain as they are; the old name passes into memory."
