 vol_path_events.1.t:0 "Volhynia Chooses Its Path"
 vol_path_events.1.d:0 "Envoys urge us to look abroad for allies. The estates would have us settle a question nearer home first: who may levy taxes and whose consent must the crown obtain?"
 vol_path_events.1.a:0 "Pursue diplomacy."
 vol_path_events.1.b:0 "Pursue constitutional reform."
 vol_diplomatic_focus:0 "Diplomatic Focus"
 desc_vol_diplomatic_focus:0 "Diplomacy becomes the priority."
 vol_austrian_path_tooltip:0 "Unlocks the frontier-crown path."
 vol_constitutional_focus:0 "Constitutional Focus"
 desc_vol_constitutional_focus:0 "Reforms focus on constitutional limits."
 vol_constitutional_path_tooltip:0 "Unlocks the constitutional path."
 vol_path_events.2.t:0 "Dynastic Strategy"
 vol_path_events.2.d:0 "Our envoys report that the name of our house opens doors at neighbouring courts. A marriage agreed now might secure a hearing for our heirs long after the present treaties lapse."
 vol_path_events.2.a:0 "Strengthen dynastic ties."
 vol_dynastic_prestige:0 "Dynastic Prestige"
 desc_vol_dynastic_prestige:0 "The dynasty gains prestige."
 vol_dynastic_ties:0 "Dynastic Ties"
 vol_path_events.3.t:0 "Sejm Debates"
 vol_path_events.3.d:0 "The deputies of the Sejm ask that matters of taxation and service be laid before them. The crown's councillors are reluctant to yield powers they have long exercised alone."
 vol_path_events.3.a:0 "Empower the sejm."
 vol_path_events.3.b:0 "Maintain royal control."
 vol_ruthenian_sejm:0 "Ruthenian Sejm"
 desc_vol_ruthenian_sejm:0 "A representative sejm shapes policy."
 vol_path_events.4.t:0 "Cultural Flowering"
 vol_path_events.4.d:0 "Printers have brought their first sheets to court, and painters are seeking patrons among the great houses. A grant from our treasury would keep their workshops at home."
 vol_path_events.4.a:0 "Patronize culture."
 vol_cultural_flowering:0 "Cultural Flowering"
 desc_vol_cultural_flowering:0 "The arts and learning prosper."
 vol_path_events.5.t:0 "Minority Rights"
 vol_path_events.5.d:0 "Delegates from communities that follow other customs have petitioned for protection. They ask for letters their magistrates can produce when a local officer challenges their rights."
 vol_path_events.5.a:0 "Grant protections."
 vol_path_events.5.b:0 "Deny protections."
 vol_multicultural_realm:0 "Multicultural Realm"
 desc_vol_multicultural_realm:0 "A diverse realm is governed with care."
 vol_minority_rights:0 "Minority Rights"
 desc_vol_minority_rights:0 "Minority rights are safeguarded."
 vol_path_events.6.t:0 "Articles for Crown and Estates"
 vol_path_events.6.d:0 "The deputies have put the rights of crown and estates on parchment. Once the articles bear our seal, either side may appeal to them when the next dispute comes before the court."
 vol_path_events.6.a:0 "Set our seal to the articles."
 vol_path_events.6.b:0 "Return the draft to the deputies."
 vol_constitutional_framework:0 "Constitutional Framework"
 desc_vol_constitutional_framework:0 "A formal constitutional order is established."
 vol_successful_reform:0 "Successful Reform"
 desc_vol_successful_reform:0 "Reform efforts succeed."
 vol_path_events.7.t:0 "Imperial Ambitions"
 vol_path_events.7.d:0 "Our envoys still take their places behind those of the imperial courts. The great houses now urge us to claim a title worthy of the lands that answer to our seal."
 vol_path_events.7.a:0 "Seek imperial recognition."
 vol_austrian_empire_tooltip:0 "Unlocks the imperial coronation path."
 vol_imperial_coronation:0 "Imperial Coronation"
 desc_vol_imperial_coronation:0 "The ruler is crowned in imperial ceremony."
 vol_constitutional_empire_tooltip:0 "Unlocks the constitutional empire path."
 vol_constitutional_coronation:0 "Constitutional Coronation"
 desc_vol_constitutional_coronation:0 "A constitutional coronation is held."

 vol_carpathian_bulwark_modifier:0 "Carpathian Bulwark"
 desc_vol_carpathian_bulwark_modifier:0 "Fortifications defend the Carpathian frontier."
 vol_crimean_conquest:0 "Crimean Conquest"
 desc_vol_crimean_conquest:0 "Campaigns secure the Crimean frontier."
 VOL_balance_estates_title:0 "Balance the Estates"
 VOL_balance_estates_desc:0 "Secure at least 30% Crown Land and keep the nobility and clergy loyal so the estates serve the throne in concord."
 vol_balanced_estates:0 "Balanced Estates"
 desc_vol_balanced_estates:0 "Estate influence is balanced."
 VOL_austrian_path_unlocked_tooltip:0 "Frontier-crown path unlocked."
 VOL_manage_minorities_title:0 "Manage Minorities"
 VOL_manage_minorities_desc:0 "Restore peace in all our Polish, Lithuanian, Hungarian and Romanian communities, or in ten provinces if none are present. Confirm permanent protection for the faiths of our diverse realm."
 VOL_welcome_all_cultures_title:0 "Welcome All Cultures"
 VOL_welcome_all_cultures_desc:0 "Accept Polish alongside our Ruthenian estates and uphold a realm where multiple peoples prosper under common law."
 vol_cultural_tolerance:0 "Cultural Tolerance"
 desc_vol_cultural_tolerance:0 "Tolerance policies strengthen cohesion."
 VOL_develop_capitals_title:0 "Develop the Capitals"
 VOL_develop_capitals_desc:0 "Raise both Lutsk and Halych to at least 20 development so the twin seats of our principality anchor royal administration."
 vol_imperial_capital:0 "Imperial Capital"
 desc_vol_imperial_capital:0 "The capital is elevated to imperial status."
 vol_twin_capitals:0 "Twin Capitals"
 desc_vol_twin_capitals:0 "Twin capitals share administrative duties."
 VOL_balance_of_power_title:0 "Balance of Power"
 VOL_balance_of_power_desc:0 "Forge a lasting alliance with a major neighbouring power to safeguard Volhynia's borders and elevate our diplomatic standing."
 vol_diplomatic_ascendancy:0 "Diplomatic Ascendancy"
 desc_vol_diplomatic_ascendancy:0 "Diplomacy elevates the realm's status."
 VOL_dynastic_marriages_title:0 "Dynastic Marriages"
 VOL_dynastic_marriages_desc:0 "Maintain five royal marriages and at least two diplomatic reputation, or demonstrate military tradition, prestige and legitimate authority."
 VOL_dynastic_network_tooltip:0 "Dynastic network expanded."
 VOL_manage_magnates_title:0 "Manage the Magnates"
 VOL_manage_magnates_desc:0 "Win the confidence of the great magnate houses while curbing private lawlessness along the frontier."
 vol_magnate_support:0 "Magnate Support"
 desc_vol_magnate_support:0 "Magnates support the crown."
 VOL_establish_sejm_title:0 "Establish the Sejm"
 VOL_establish_sejm_desc:0 "Invest 100 administrative power to convene a regular noble Sejm, giving the estates a lawful voice in the governance of the realm."
 VOL_constitutional_compact_title:0 "Constitutional Compact"
 VOL_constitutional_compact_desc:0 "Enact a constitutional compact grounded in administrative scholarship, defining the rights of the crown and the diet alike."
 VOL_can_adopt_elective_tooltip:0 "Elective succession can be adopted."
 VOL_ruthenian_liberty_title:0 "Ruthenian Liberty"
 VOL_ruthenian_liberty_desc:0 "Uphold high stability and legitimacy under our constitutional statutes to secure the golden liberties of the Ruthenian nobility."
 vol_golden_liberty:0 "Golden Liberty"
 desc_vol_golden_liberty:0 "Noble liberties shape governance."
 VOL_church_relations_title:0 "Church Relations"
 VOL_church_relations_desc:0 "Maintain at least 80% religious unity and a loyal clergy to steady parish life across the principality."
 vol_church_support:0 "Church Support"
 desc_vol_church_support:0 "Clerical support strengthens legitimacy."
 VOL_university_expansion_title:0 "Found the Ostroh Academy"
 VOL_university_expansion_desc:0 "Founded by Prince Kostiantyn-Vasyl Ostrozky in 1576, the Ostroh Slavic-Greek-Latin Academy became the first institution of higher learning in Eastern Europe. Endow the academy in Rivne and Ostroh to unite Ruthenian scholarship with classical letters."
 vol_center_of_learning:0 "Ostroh Slavic-Greek-Latin Academy"
 desc_vol_center_of_learning:0 "The Academy of Ostroh draws Orthodox and humanist scholars from across Ruthenia and beyond."
 vol_educational_reform:0 "Educational Reform"
 desc_vol_educational_reform:0 "Education reforms improve expertise."
 VOL_renaissance_court_title:0 "The Ostroh Press and Bible"
 VOL_renaissance_court_desc:0 "With the printing press active in Ostroh under Ivan Fedorov, gather theologians and philologists to complete the monumental 1581 Ostroh Bible—the first full printed Church Slavonic scripture."
 vol_enlightened_realm:0 "Enlightened Realm"
 desc_vol_enlightened_realm:0 "Enlightened statutes order justice, schooling, and crown administration."
 VOL_choose_development_path_title:0 "Choose a Development Path"
 VOL_choose_development_path_desc:0 "With the realm at peace and grown to 120 development, summon the council to choose our constitutional or diplomatic course."
 VOL_choose_path_tooltip:0 "Choose a path for future reforms."
 VOL_prosperity_title:0 "Prosperity"
 VOL_prosperity_desc:0 "Develop ten provinces across Volhynia, Red Ruthenia, and Podillia to build a flourishing heartland of towns and estates."
 vol_prosperous_realm:0 "Prosperous Realm"
 desc_vol_prosperous_realm:0 "Economic growth strengthens the realm."
 VOL_religious_settlement_title:0 "Religious Settlement"
 VOL_religious_settlement_desc:0 "Achieve 90% religious unity under our chosen confessional policy to bring lasting peace to our parishes."
 vol_religious_harmony:0 "Religious Harmony"
 desc_vol_religious_harmony:0 "Religious harmony improves stability."
 VOL_ruthenian_hegemony_title:0 "Ruthenian Hegemony"
 VOL_ruthenian_hegemony_desc:0 "Reach 400 development and field forty regiments to proclaim a new imperial programme in Eastern Europe. This alternative-history ambition goes beyond the restoration of Galicia-Volhynia."
 vol_ruthenian_empire:0 "Ruthenian Empire"
 desc_vol_ruthenian_empire:0 "An empire is proclaimed."
 VOL_ruthenia_triumphant_title:0 "Ruthenia Triumphant"
 VOL_ruthenia_triumphant_desc:0 "With 600 development and Great Power standing, crown our imperial ambitions and establish Ruthenia as a preeminent European realm."
 VOL_ruthenia_triumphant_tooltip:0 "Ruthenia triumphs on the world stage."
 vol_imperial_triumph:0 "Imperial Triumph"
 desc_vol_imperial_triumph:0 "Imperial victory consolidates power."
 vol_constitutional_triumph:0 "Constitutional Triumph"
 desc_vol_constitutional_triumph:0 "A constitutional victory secures reform."
 rip_vol_alt_history.9.t:0 "A Carpathian Defence Compact"
 rip_vol_alt_history.9.d:0 "Our ally proposes a voluntary twenty-year agreement. Joint defence and diplomacy will protect both realms, financed by concessions from crown revenues. We retain our sovereignty and may refuse."
 rip_vol_alt_history.9.a:0 "Share the burden of defence"
 rip_vol_alt_history.9.b:0 "Keep our present alliance"
 rip_vol_federal_compact:0 "Carpathian Defence Compact"
 desc_rip_vol_federal_compact:0 "Shared defence and diplomacy are financed by crown revenue. This agreement does not create a subject or a new state."
 rip_vol_sovereign_crown_modifier:0 "Sovereign Crown"
 desc_rip_vol_sovereign_crown_modifier:0 "Stronger taxation supports the crown but provokes local opposition."
 rip_vol_sejmik_compact:0 "Compact of the Sejmiks"
 desc_rip_vol_sejmik_compact:0 "Representative consent lowers the cost of stability and limits absolutism."
 rip_vol_voivode_compact:0 "Voivodeship Compact"
 desc_rip_vol_voivode_compact:0 "Provincial administration increases governing capacity in exchange for revenue concessions."
 rip_vol_cossack_compact:0 "Cossack Political Compact"
 desc_rip_vol_cossack_compact:0 "Military participation strengthens recruitment while alienating the nobility."
 rip_vol_carpathian_compact:0 "Carpathian Mutual Compact"
 desc_rip_vol_carpathian_compact:0 "Volhynia and Galicia share border garrisons and diplomatic commitments, funded by joint crown contributions."
 vol_chumak_market_route_tt:0 "Chumak commercial route: maintain a merchant with at least 15% trade share in Crimea, secure an alliance or 100 opinion with Moldavia or the holder of Budjak or Bendery, keep Podillia peaceful and undevastated, hold a fortress along the southern approaches, and field 6 cavalry regiments for caravan escorts."
 vol_chumak_convoy_charters:0 "Chumak Convoy Charters"
 desc_vol_chumak_convoy_charters:0 "Escorted ox-wagon convoys and customs charters channel Black Sea salt and steppe trade smoothly into our markets."
 vol_ostroh_printing_house:0 "Ostroh Printing House"
 desc_vol_ostroh_printing_house:0 "Master printers and type-founders turn Ostroh into the foremost publishing centre of Ruthenian letters."
 vol_ostroh_bible_legacy:0 "Legacy of the Ostroh Bible"
 desc_vol_ostroh_bible_legacy:0 "The 1581 Ostroh Bible anchors liturgical learning and scholarly prestige throughout the Ruthenian lands."
 vol_path_events.8.t:0 "The Ostroh Academy"
 vol_path_events.8.d:0 "In 1576 Prince Kostiantyn-Vasyl Ostrozky's patronage brought Greek, Latin, and Church Slavonic teachers together at Ostroh. As halls and bursaries open in Volhynia, the academy's curators ask whether to widen the trilingual curriculum under rector Herasym Smotrytsky or invest first in a printing workshop under master printer Ivan Fedorov."
 vol_path_events.8.a:0 "Endow Herasym Smotrytsky's trilingual chair"
 vol_path_events.8.b:0 "Equip Ivan Fedorov's printing workshop"
 vol_path_events.9.t:0 "The Ostroh Bible"
 vol_path_events.9.d:0 "After years of collating Greek and Slavonic manuscripts, the Ostroh press has completed the full printed Church Slavonic Bible of 1581. Bound volumes now wait in the academy scriptorium for distribution across parish churches, brotherhood schools, and foreign courts."
 vol_path_events.9.a:0 "Distribute copies to our parishes and brotherhoods"
 vol_path_events.9.b:0 "Send presentation volumes across Europe"
