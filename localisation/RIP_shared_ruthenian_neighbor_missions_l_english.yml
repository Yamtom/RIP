l_english:
 rip_lit_ruthenian_chancery_title:0 "Ruthenian Chancery"
 rip_lit_ruthenian_chancery_desc:0 "The Grand Duchy governs wide Ruthenian lands from the Pripyat to the Dnieper. Codify Chancery Ruthenian privileges, seat regional judges, and keep local autonomy low across our Ruthenian palatinates."
 rip_lit_princes_of_rus_title:0 "Princes of Rus"
 rip_lit_princes_of_rus_desc:0 "Kyiv remains the historic seat of the lands of Rus within our realm. Raise its walls and workshops alongside our leading Ruthenian towns so Vilnius and Kyiv stand as twin pillars of the Grand Duchy."
 rip_lit_ruthenian_chancery_classic_title:0 "$rip_lit_ruthenian_chancery_title$"
 rip_lit_ruthenian_chancery_classic_desc:0 "$rip_lit_ruthenian_chancery_desc$"
 rip_lit_princes_of_rus_classic_title:0 "$rip_lit_princes_of_rus_title$"
 rip_lit_princes_of_rus_classic_desc:0 "$rip_lit_princes_of_rus_desc$"
 rip_tatar_dnieper_tribute_title:0 "Dnieper Tribute"
 rip_tatar_dnieper_tribute_desc:0 "Hold sway over the towns and crossings of Ruthenia, either directly or through loyal tributary rulers, and extract regular tribute from the Dnieper heartland."
 rip_tatar_dnieper_tribute_classic_title:0 "$rip_tatar_dnieper_tribute_title$"
 rip_tatar_dnieper_tribute_classic_desc:0 "$rip_tatar_dnieper_tribute_desc$"
 rip_tur_podillian_eyalet_title:0 "Kamianets Frontier"
 rip_tur_podillian_eyalet_desc:0 "Secure Kamianets in Podillia and bring the Ruthenian borderlands under direct Ottoman watch or a loyal northern tributary, turning the Dniester and Dnieper frontier into a shield for the Porte."
 rip_tur_podillian_eyalet_classic_title:0 "$rip_tur_podillian_eyalet_title$"
 rip_tur_podillian_eyalet_classic_desc:0 "$rip_tur_podillian_eyalet_desc$"
 rip_pol_ruthenian_palatinates_title:0 "Ruthenian Palatinates"
 rip_pol_ruthenian_palatinates_desc:0 "Strengthen crown governance across Red Ruthenia and the Dnieper palatinates centered on Lviv. Prosperous Ruthenian burghers, loyal churches, and well-ordered voivodeships anchor the eastern half of the realm."
 rip_lit_chancery_statutes:0 "Ruthenian Chancery Statutes"
 desc_rip_lit_chancery_statutes:0 "Codified Ruthenian chancery law lowers administrative friction and eases cultural integration across the Grand Duchy."
 rip_lit_ruthenian_pillar:0 "Twin Pillars of Lithuania and Rus"
 desc_rip_lit_ruthenian_pillar:0 "Closer union between Vilnius and Kyiv strengthens our standing army and keeps diverse subjects loyal."
 rip_tatar_ruthenian_tribute:0 "Ruthenian Steppe Tribute"
 desc_rip_tatar_ruthenian_tribute:0 "Tribute caravans from the Ruthenian towns sustain our cavalry hosts and fill the khan's treasury."
 rip_tur_kamianets_citadel:0 "Kamianets Frontier Fortress"
 desc_rip_tur_kamianets_citadel:0 "Ottoman engineers and garrison troops reinforce Kamianets as a forward bastion overlooking Podillia."
 rip_tur_northern_protectorate:0 "Northern Borderlands Protectorate"
 desc_rip_tur_northern_protectorate:0 "Vassal hosts along the Pontic and Podillian marches expand our diplomatic reach and supply frontier armies."
 rip_pol_ruthenian_palatinates_mod:0 "Prosperous Ruthenian Palatinates"
 desc_rip_pol_ruthenian_palatinates_mod:0 "Orderly voivodeship administration boosts output and reduces upkeep across the Ruthenian lands of the Crown."
