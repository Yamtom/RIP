 wr_west_ruthenian_distinctiveness:0 "Distinct Chancery and Parish Registers"
 desc_wr_west_ruthenian_distinctiveness:0 "Local courts, Magdeburg towns, and scriptoria keep municipal deeds, testaments, and vernacular homilies distinct from Muscovite prikaz usage."
 wr_chancery_prosta_mova_tradition:0 "Chartered Vernacular Chancery"
 desc_wr_chancery_prosta_mova_tradition:0 "Following the tradition of Grand Ducal prosta mova, the Peresopnytsia vernacular turn, and Subcarpathian teaching gospels, scribes guard a native legal and literary register."
 wr_west_ruthenian_commonwealth:0 "Separate Ruthenian Cultural Sphere"
 desc_wr_west_ruthenian_commonwealth:0 "Printing houses, law statutes, and brotherhood academies anchor Belarusians (Bielaruski), Ruthenians (Ruskyi), and Rusyns (Rusnacky) in a separate Ruthenian group outside Moscow's orbit."
 wr_west_ruthenian_statute_autonomy:0 "Statute and Stavropigia Autonomy"
 desc_wr_west_ruthenian_statute_autonomy:0 "Inspired by the Statutes of the Grand Duchy, the 1569 provincial guarantees of Ruthenian lettering in Volhynia, Kyiv, and Bratslav, and Carpathian ius Valachicum charters, estates defend their own legal sphere."
 wr_west_slavic_cultural_affinity:0 "Shared West Slavic Civic Orbit"
 desc_wr_west_slavic_cultural_affinity:0 "Bilingual magistrates, university sodalities in Kraków and Prague, and shared town statutes draw Ruthenian urban estates toward Polish, Czech, and Slovak neighbors."
 wr_west_slavic_shared_script_space:0 "Dual-Script Print and Legal Circuit"
 desc_wr_west_slavic_shared_script_space:0 "Booksellers, Jesuit and Protestant seminaries, and noble dietines circulate Latin-script glosses, lacinka legal briefs, and Kraków-Trnava presses across parish borders."
 wr_west_slavic_synthesis:0 "West Slavic Civic Synthesis"
 desc_wr_west_slavic_synthesis:0 "Echoing linguistic borderlands in Lusatia, Silesia, and Eastern Slovakia, bilingual town law and bilingual chanceries consummate a rare transition into the West Slavic family."
 wr_traditionalist_backlash:0 "Monastic and Boyar Protest"
 desc_wr_traditionalist_backlash:0 "Orthodox brotherhoods, skete elders, and conservative magnates dispute chancery innovations that loosen ancient Church Slavonic forms."
 wr_collective_concord:0 "Concord of the Three Circles"
 desc_wr_collective_concord:0 "Coordinated charters between sovereigns holding primary culture, courts accepting the tongue, and borderland provinces secure broad diplomatic backing."
 wr_cultural_ferment:0 "Unresolved Provincial Ferment"
 desc_wr_cultural_ferment:0 "Neighboring courts ratified new chancery charters while local authorities held back, leaving merchants and estates divided."
 opinion_wr_west_slavic_kinship:0 "West Slavic Civic Kinship"
 opinion_wr_west_ruthenian_separation:0 "Separate From Muscovite Claims"
 opinion_wr_collective_accord:0 "Cultural Congress Accord"
 opinion_wr_collective_discord:0 "Cultural Congress Discord"
 wr_tt_byelorussian_s2_index:0 "Global §YBielaruski§! Province Adoption Index is at least §Y60%§! (currently §Y[Root.wr_byelorussian_s1_pct.GetValue]%§!: §Y[Root.wr_byelorussian_s1_cnt.GetValue]§! of §Y[Root.wr_byelorussian_total.GetValue]§! provinces)."
 wr_tt_ruthenian_s2_index:0 "Global §YRuskyi§! Province Adoption Index is at least §Y60%§! (currently §Y[Root.wr_ruthenian_s1_pct.GetValue]%§!: §Y[Root.wr_ruthenian_s1_cnt.GetValue]§! of §Y[Root.wr_ruthenian_total.GetValue]§! provinces)."
 wr_tt_rusyn_s2_index:0 "Global §YRusnacky§! Province Adoption Index is at least §Y60%§! (currently §Y[Root.wr_rusyn_s1_pct.GetValue]%§!: §Y[Root.wr_rusyn_s1_cnt.GetValue]§! of §Y[Root.wr_rusyn_total.GetValue]§! provinces)."
 wr_tt_byelorussian_s4_index:0 "Global §YBjalowruszsky§! Province Adoption Index is at least §Y85%§! (currently §Y[Root.wr_byelorussian_s3_pct.GetValue]%§!: §Y[Root.wr_byelorussian_s3_cnt.GetValue]§! of §Y[Root.wr_byelorussian_total.GetValue]§! provinces)."
