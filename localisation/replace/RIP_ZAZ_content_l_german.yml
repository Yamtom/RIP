 ZAPOROZHIAN_SICH:0 "Zaporozhian Sich"
 zaporozhian_sich:0 "Zaporozhian Sich"
 zaporozhian_sich_capital:0 "Zaporozhian Sich Capital"
 zaporozhian_sich_capital_desc:0 "The current location of the Zaporozhian Sich."
 zaporozhian_sich_crisis:0 "Sich Crisis"
 zaporozhian_sich_crisis_desc:0 "Internal conflicts between the free Sich Rada and authoritarian Kosh Otamans, failed raids, overlord pressure, and external threats combine to threaten the very existence of the Zaporozhian Host."
 zaporozhian_sich_culture_tt:0 "Must be Ruthenian culture or accepted"
 zaporozhian_sich_desc:0 "Below the Dnieper rapids stands the Zaporozhian Sich, at once earthen fortress, war camp, and general council of free Cossacks rejecting serfdom and foreign dominion. From here the Host launches steppe raids and chaiky voyages across the Black Sea, carrying the camp upriver or down whenever war demands while keeping Cossack liberties unbroken."
 zaporozhian_sich_founded:0 "Zaporozhian Sich Founded"
 zaporozhian_sich_founded_desc:0 "This is the sacred heartland of Cossack freedom."
 zaporozhian_sich_host_tt:0 "We are a Cossack polity, or the Cossacks sit as an estate"
 zaporozhian_sich_tier_3_tt:0 "The Zaporozhian Sich has reached its zenith as the greatest Cossack fortress in Eastern Europe"
 zaporozhian_sich_upgrade_tt:0 "Only Ruthenian nations can upgrade the Sich"
 ZAZ:0 "Saporoschja"
 zaz_10_a:0 "The Szlachta must carefully weigh their options and make a decision soon."
 zaz_10_b:0 "It is undeniable that his demands are just and righteous. The Szlachta must acknowledge that and take action accordingly!"
 zaz_10_c:0 "The Cossacks have served us well, and it is only right that we show them kindness in return. We shall provide for their needs."
 zaz_10_d:0 "A few well-placed bribes and some strategic blackmail will ensure that the Szlachta make the right decision."
 zaz_10_desc:0 "Severyn Nalyvaiko, a former member of our service, has sent a list of demands to the Szlachta regarding the upkeep of the Cossack regiments in their armies. These demands include respecting Cossack customs and traditions, which he justifies with their active participation in the fight against infidels from the south.\n\nAlthough it's hard to deny their contributions, the Szlachta is hesitant to accept the demands, especially after the recent uprising. Rejecting them, however, could have unpredictable consequences."
 zaz_10_e:0 "With some skillful negotiation, we can convince the Szlachta that these changes are necessary and just."
 zaz_10_f:0 "Accept their silver while leaving their petitions unanswered."
 zaz_10_g:0 "Crush the rebels; the Sejm bows to no terms."
 zaz_10_title:0 "An Influential Cossack Demands Change"
 zaz_11_a:0 "They must be grateful to us for this!"
 zaz_11_desc:0 "Despite the opposition to the demands, the majority of the Szlachta had decided that it would be better to improve the conditions of the upkeep for the Cossack regiments rather than risk provoking yet another devastating revolt in Rus'."
 zaz_11_title:0 "Szlachta Agrees to Cossack Demands"
 zaz_12_a:0 "This doesn't look good, but let's hold crown troops for now."
 zaz_12_desc:0 "As we had anticipated, the majority of Szlachta refused to agree to the demands. In fact, some of the nobles tried to knock Nalyvaiko out of his residence in Bratslav, which resulted in a total failure and left us with no opportunities for any further negotiations for now."
 zaz_12_title:0 "Szlachta Refuses"
 zaz_13_a:0 "Dispatch the Field Crown Hetman to restore order."
 zaz_13_b:0 "Accept peace before the frontier bleeds dry."
 zaz_13_desc:0 "Not being able to deal with the Cossacks, Szlachta from Rus' sent us a delegation. They have asked for our help, complaining that the Cossacks are even more annoying than Tatars. They've also reported about atrocities that rebels had committed against Polish nobility and Catholic clergy in Mahilyow.\n\nAt the same time, we have received a peace offer from Nalyvaiko in which he requires us to cede some of the lands in exchange for their military service and loyalty to the Commonwealth. Now, we have a choice of how to end this. Either we accept the peace offer and bring an end to this quickly, or we can drown Ruthenian lands in blood once again."
 zaz_13_title:0 "Szlachta Requests Our Help"
 zaz_14_a:0 "Is this truly over?"
 zaz_14_desc:0 "Having agreed to the peace offer, we have brought an end to the uprising. The captured cities were ceded to us, and prisoners freed. Unfortunately, due to the contradictory nature of this peace offer, some of the nobility desperately took up arms against us, trying to revert that.\n\nUnlike the previous rebellion, this one, due to the usage of scorched earth tactics, severely devastated left-bank Ukraine."
 zaz_14_title:0 "End of Nalyvaiko Uprising"
 zaz_15_a:0 "Chase after them!"
 zaz_15_desc:0 "After bloody clashes with the rebels, we have forced Nalyvaiko and the rest of his army to retreat to the left-bank Ukraine, to the village Solonystsy near the town of Lubnie. There he organized a tabor."
 zaz_15_title:0 "Rebels Were Forced to Retreat"
 zaz_16_a:0 "Confiscation of their lands will serve them a good punishment!"
 zaz_16_desc:0 "Storming the tabor, our army slaughtered everyone related to the Cossacks, including their families. Only a small pack of survivors have managed to break free. Nalyvaiko fell in the battle among his troops. With the fall of its leader, the uprising is realistically over."
 zaz_16_title:0 "End of Nalyvaiko Uprising"
 zaz_17_a:0 "Offer them amnesty in exchange for their surrender."
 zaz_17_desc:0 "Surrounded in Solonytsy for quite some time, the rebels are running out of food and water. If we offer them appealing surrender conditions, we may end the uprising quickly and without bloodshed."
 zaz_17_title:0 "Negotiations with Rebels"
 zaz_18_a:0 "It cannot be helped. We must take the necessary actions to end the rebellion."
 zaz_18_desc:0 "The rebels have rejected our terms, leaving us no choice but to siege their tabor."
 zaz_18_title:0 "Negotiations with Rebels"
 zaz_19_a:0 "We must act with civility and justice towards the rebels and their leaders."
 zaz_19_b:0 "Break the parley and storm the tabor. The rebels have left us no cause for mercy."
 zaz_19_desc:0 "Though the besieged camp consented to parley, mutiny erupted inside the tabor: suspicious rebels slew Hryhory Loboda and now offer to surrender Nalyvaiko and the remaining captains on the former terms. The nobility cries out for exemplary vengeance after months of devastation."
 zaz_19_title:0 "Negotiations with Rebels"
 zaz_1_a:0 "Demand satisfaction from the crown."
 zaz_1_b:0 "We must refrain from making impulsive decisions."
 zaz_1_desc:0 "For decades, Cossack chaiky raiders from beyond the rapids have struck our Black Sea port towns and merchant convoys. Though the Polish crown denies responsibility, Warsaw alone holds sway over their frontier. Unless [POL.GetName] restrains these raiders, we shall answer with fire and steel."
 zaz_1_title:0 "Zaporozhia Cossack Raids"
 zaz_20_a:0 "We must make a public example of them in the capital, to show that rebellion will not be tolerated."
 zaz_20_desc:0 "With the ceding of the rebellion's leaders, we have finally brought an end to the Nalyvaiko Uprising. However, the question remains of how to punish the captured leaders."
 zaz_20_title:0 "End of Nalyvaiko Uprising"
 zaz_21_a:0 "Good riddance. The rebellion has been quashed, and the rebels will pay for their crimes."
 zaz_21_desc:0 "We stormed the tabor, and our army slaughtered everyone related to the Cossacks, including their families. Only a small number of Cossacks were able to escape. With their leaders in our hands, we have brought an end to the uprising. Given the scale of damage suffered by our Nobility, we have decided to confiscate the lands of the Cossacks. As for Nalyvaiko and the other leaders, their punishment will be severe and cruel."
 zaz_21_title:0 "End of Nalyvaiko Uprising"
 zaz_2_a:0 "Restrain the frontier raiders."
 zaz_2_a_tooltip:0 "Limit the Cossacks' raiding freedom."
 zaz_2_b:0 "Ignore the Sultan's threats."
 zaz_2_b_tooltip:0 "The Ottomans may gain a one-year Diplomatic Insult casus belli against us, if both countries remain independent and are not allied, at war, or bound by a truce."
 zaz_2_desc:0 "Sultan [TUR.Monarch.GetName] threatens war should Cossack raids across the Black Sea continue unchecked. A war with the Porte and its Tatar vassals would bring ruin to our southern palatinates unless our banners stand ready."
 zaz_2_title:0 "The Ottoman Ultimatum"
 zaz_3_a:0 "See that they keep their word."
 zaz_3_desc:0 "[POL.Monarch.GetTitle] [POL.Monarch.GetName] has sent word that the crown will rein in the Cossack raids along the Black Sea."
 zaz_3_title:0 "[POL.GetName] Accepts Our Demands"
 zaz_4_a:0 "Reserve our right to answer this insult."
 zaz_4_desc:0 "The Commonwealth has refused our demands to restrain the Cossacks. This affront may give us grounds for war, but our response must account for our current diplomatic commitments."
 zaz_4_title:0 "Our Demands Are Rejected by [PLC.GetName]"
 zaz_5_a:0 "This is a private matter of these nobles. Do not intrude."
 zaz_5_desc:0 "Krzysztof Kosinski, colonel of the Registered Cossacks in the Kyiv Voivodeship, has seized Bila Tserkva in reprisal after Janusz Ostrogski stripped him of his estates in Rokytne and Vilshanytsia. At court, many treat the quarrel as a private feud among border lords."
 zaz_5_title:0 "A Conflict Between Ruthenian Nobility"
 zaz_6_a:0 "Let's keep a close eye on it."
 zaz_6_desc:0 "After Kosinski captured Bila Tserkva, he named himself a Hetman of the Cossacks and with that kindled a full-scale revolt against the rule of the Polish crown and the local Ruthenian Nobility.\n\nAlthough it looks bad, our chancellor assures us that it's just yet another struggle for power in this disorderly region so we shouldn't mobilize our troops for intervention and Ostrogski family, perhaps the most powerful noble family in Rus' is more than capable of dealing with that themselves."
 zaz_6_title:0 "Ruthenian Noble Names Himself a Hetman"
 zaz_7_a:0 "Another triumph for the Crown."
 zaz_7_desc:0 "Tidings arrive from Piatka: after a week of bitter fighting, Duke Kostiantyn Wasyl Ostrogski has routed the Cossack tabor. Kosinski was compelled to swear renewed obedience, surrender the bulava, and strike every unlawful recruit from the register."
 zaz_7_title:0 "End of Kosinski Uprising"
 zaz_8_a:0 "Muster the royal army before the frontier is lost."
 zaz_8_desc:0 "What the magnates expected to quell in a single skirmish has turned into a humiliating rout: the Cossacks outmaneuvered the noble banners and shattered their field camp. Unless the crown intervenes, the revolt will sweep across Right-Bank Ukraine."
 zaz_8_title:0 "A Humiliating Defeat"
 zaz_9_a:0 "That was a close call indeed, but the Crown has prevailed."
 zaz_9_desc:0 "After a series of clashes between our army and the rebels, we have dealt a decisive blow to the Kosinski Uprising and captured Kosinski himself in battle. He was forced to sign an agreement in which the Cossacks were obliged to be loyal to the crown, Kosinski was stripped of his Hetman status, and everyone who was added to the Cossack Register during the revolt was removed."
 zaz_9_title:0 "The End of the Kosinski Uprising"
 zaz_abolish_register_desc:0 "Burn the roll and the difference between registered and unregistered dies with it — every man who brings a horse and a sabre is of the Host. The crown will then owe nobody, and pay nobody."
 zaz_abolish_register_title:0 "Abolish the Cossack Register"
 ZAZ_ADJ:0 "Saporozhische"
 ZAZ_ally_pol_desc:0 "The Commonwealth elects its kings and binds them by pacta conventa, a thing neither Moscow nor the Porte would credit. Our elders see their own Rada in the Sejm. The Sejm sees peasants with sabres."
 ZAZ_ally_pol_title:0 "Return to the Crown"
 ZAZ_ally_rus_desc:0 "Moscow styles itself the Third Rome and offers the Host artillery, grain and a patriarch of our own rite. The Tsar's clerks will also want the register, the customs, and the naming of our colonels."
 ZAZ_ally_rus_title:0 "The Muscovite Protectorate"
 ZAZ_ally_tartar_desc:0 "The Khan's horsemen and our own keep the same seasons and take the same plunder, and have ridden together as often as against each other. An understanding with the Girays frees our backs, and costs us every parish that lost a son at Perekop."
 ZAZ_ally_tartar_title:0 "Alliance of Steppe Peoples"
 ZAZ_ally_tur_desc:0 "The Porte asks little of a tributary beyond quiet on the frontier and troops when called. A sultan's charter would cover us against Polish revenge and open the Black Sea ports to our grain. It would also set the Sich under a Muslim overlord, and the parishes will have views."
 ZAZ_ally_tur_title:0 "Ottoman Alliance"
 zaz_alternate_history:0 "§YBranching Path§!"
 zaz_army:0 "The New Army"
 ZAZ_attack_genoa_2_desc:0 "Foreign Genoese merchants have governed the important Black Sea commercial hubs for far too long. The money and riches they provide are just too important to ignore."
 ZAZ_attack_genoa_2_title:0 "Seize Ports"
 ZAZ_attack_genoa_desc:0 "The mountain principality of Theodoro commands key Crimean passes and harbors along the northern Black Sea."
 ZAZ_attack_genoa_title:0 "Conquer Theodoro"
 zaz_betrayed_sich:0 "Betrayed the Sich"
 zaz_black_sea_trade_desc:0 "Secure ports and trade routes on the Black Sea to enrich the Sich."
 zaz_black_sea_trade_title:0 "Monopolize Black Sea Trade"
 zaz_canton_charter:0 "Canton Charter"
 zaz_caravan:0 "Zaporozhian Caravans"
 zaz_catholic_spread:0 "The Spread of Catholicism"
 zaz_chaiky_fleet:0 "Chaiky Fleet"
 zaz_chaiky_fleet_active:0 "Chaiky Raiders"
 zaz_chaiky_fleet_desc:0 "Our fleet of light chaiky boats dominates river warfare."
 zaz_chaiky_flotilla:0 "Chaiky Flotilla"
 zaz_chaiky_flotilla_desc:0 "Light chaiky boats allow Cossacks to raid along rivers and even across the Black Sea to Constantinople."
 zaz_chaiky_raid_cooldown:0 "Recent Chaiky Raid"
 zaz_chaiky_raid_desc:0 "Dispatch our chaiky boats to strike enemy shores and bring back spoils."
 zaz_chaiky_raid_effect:0 "Successful Chaiky Raid"
 zaz_chaiky_raid_title:0 "Send the Chaiky"
 zaz_chaiky_raid_victims:0 "Chaiky Raid Victims"
 zaz_chaiky_raiders:0 "Chaiky Raiders"
 zaz_chaiky_raiders_desc:0 "Our chaiky boats strike fear along the Ottoman coasts."
 ZAZ_chaiky_raids_desc:0 "A chaika is a hollowed lime trunk bundled with reeds at the gunwale, fifty men to a hull, rowing where a galley draws too much water. Kaffa and the Bosphorus villages are three nights downwind. The Porte will answer, but not quickly."
 ZAZ_chaiky_raids_title:0 "The Chaiky Fleet"
 zaz_chaiky_trade_reform:0 "Chaiky Commerce"
 zaz_chaiky_trade_reform_desc:0 "Beyond military raids, the Zaporozhian chaiky boats carry goods, privateers, and freed captives across the Black Sea. This armed commerce brings wealth, sailors, and captured vessels, but damages relations with coastal powers and organized trade leagues."
 zaz_colonization_effort:0 "Colonization of Wild Fields"
 zaz_colonization_effort_desc:0 "We are establishing new settlements in the steppe."
 zaz_connections:0 "Expanding Alliance Network for Strategic Advantage"
 zaz_convene_great_rada_desc:0 "The Kish is summoned to the square and the standards set up. Whatever is decided there binds the Host, including the officers who called the assembly."
 zaz_convene_great_rada_title:0 "Convene the Great Rada"
 zaz_cossack_cantons_reform:0 "Union of Palankas"
 zaz_cossack_cantons_reform_desc:0 "Each palanka keeps its own muster, its own court and its own ground, and sends men to the general rada rather than orders. The Host sells its swords abroad and defends its own crossings; it does not take other people's. Nobody has yet asked what happens when a canton refuses the rada."
 zaz_cossack_democracy:0 "Cossack Liberties"
 zaz_cossack_mercenaries:0 "Hired Cossack Mercenaries"
 ZAZ_CRIMEAN_TRADE:0 "Securing Ports on the Black Sea for Trade Dominance"
 zaz_crisis.1.a:0 "Strengthen the Kosh Otaman"
 zaz_crisis.1.b:0 "Empower the elective Rada"
 zaz_crisis.1.c:0 "Launch a great raid to unite us!"
 zaz_crisis.1.d:0 "The Zaporozhian Sich faces an existential crisis. Internal factions fight for control, raids have gone badly, and overlords demand submission. The famous Cossack freedom hangs in the balance."
 zaz_crisis.1.t:0 "The Sich in Crisis"
 zaz_crisis.2.a:0 "The Sich stands united!"
 zaz_crisis.2.b:0 "Accept our overlord's control"
 zaz_crisis.2.c:0 "Relocate the Sich to safer grounds"
 zaz_crisis.2.d:0 "Through struggle and sacrifice, the Zaporozhian Sich has weathered the storm. The Host stands united once more."
 zaz_crisis.2.t:0 "Crisis Resolved"
 zaz_crisis.3.a:0 "Accept our losses"
 zaz_crisis.3.b:0 "Prepare for retaliation!"
 zaz_crisis.3.d:0 "A Cossack raiding party has suffered a terrible defeat. Our enemies now prepare retaliation."
 zaz_crisis.3.t:0 "Raid Gone Wrong"
 zaz_crisis.4.a:0 "Support the Otaman's authority"
 zaz_crisis.4.b:0 "Support the Rada's liberty"
 zaz_crisis.4.c:0 "Hold a new election"
 zaz_crisis.4.d:0 "A power struggle has erupted between the elected Kosh Otaman and the free Sich Rada council."
 zaz_crisis.4.t:0 "Kosh Otaman vs Rada"
 zaz_crisis.5.a:0 "Submit to their demands"
 zaz_crisis.5.b:0 "Defy them!"
 zaz_crisis.5.c:0 "Negotiate a compromise"
 zaz_crisis.5.d:0 "Our overlord demands greater control over Sich affairs, threatening our cherished autonomy."
 zaz_crisis.5.t:0 "Overlord Demands Control"
 zaz_defend_orthodox_desc:0 "Commit to shielding the Orthodox faithful from oppression."
 zaz_defend_orthodox_title:0 "Defend the Orthodox"
 zaz_democratic_rada:0 "Elective Rada Council"
 zaz_despised_by_the_cossacks:0 "Despised by the Cossacks"
 zaz_dniester_chumak_route:0 "Dniester Chumak Route"
 ZAZ_domestic_3_desc:0 "Expanding our core territories will help secure our future for many years to come."
 ZAZ_domestic_3_title:0 "Building [Root.GetName]"
 ZAZ_establish_sich_desc:0 "Below the rapids the islands lie beyond the reach of any starosta's writ. A palisade, a store of powder and a church make a Kish; the Rada sits, the otaman is chosen, and men who owe labour elsewhere begin to arrive."
 ZAZ_establish_sich_title:0 "Establish the Sich"
 zaz_establish_sloboda_desc:0 "The Wild Field beckons with empty lands waiting to be tamed. By establishing sloboda settlements - free military colonies where settlers receive land grants in exchange for military service - we can extend our control over the frontier while building a new generation of warrior-farmers."
 zaz_establish_sloboda_title:0 "Establish Sloboda Settlement"
 ZAZ_evolve_to_hetmanate_desc:0 "The Zaporozhian Sich can transform from a raiding host into a settled Hetmanate, assuming formal structures of governance and broader obligations."
 zaz_evolve_to_hetmanate_desc:0 "The Zaporozhian Sich can transform from a raiding host into a settled Hetmanate, assuming formal structures of governance and broader obligations."
 ZAZ_evolve_to_hetmanate_title:0 "Elevate the Sich to a Hetmanate"
 zaz_evolve_to_hetmanate_title:0 "Elevate the Sich to a Hetmanate"
 zaz_expand_register_desc:0 "Writing more men into the register secures their pay and lifts their labour dues, and gives the crown a list of every Cossack by name. A list serves whoever holds it."
 zaz_expand_register_title:0 "Expand the Cossack Register"
 zaz_failed_raid:0 "Failed Chaiky Raid"
 zaz_failed_raid_desc:0 "Our raid ended in disaster, with heavy losses."
 zaz_failed_raid_effect:0 "Failed Cossack Raid"
 zaz_faith:0 "The Authority of the Patriarchs"
 ZAZ_finally_desc:0 "The Host answers to no crown but its own. The Rada elects the hetman, and the bulava passes by acclamation rather than by royal patent. Yet a free Host must still choose its friends: the Tsar offers protection, the Porte offers trade, the Commonwealth remembers its grievances, and the Horde remembers the road north."
 ZAZ_finally_title:0 "A Zaporozhian State"
 ZAZ_first_raze_desc:0 "When envoys return empty-handed and foes press upon our borders, the Host answers with swift steel—riding deep behind enemy lines to scatter their garrisons and strip their frontier towns."
 ZAZ_first_raze_title:0 "Punitive Raids"
 zaz_fixes.1.a:0 "Build the fortress and strengthen our liberty!"
 zaz_fixes.1.b:0 "The traditional Sich is sufficient."
 zaz_fixes.1.d:0 "The Zaporozhian Sich must be more than just a military camp—it must be an impregnable fortress that can withstand both Ottoman and Tatar assaults. Our master builder Dmytro Vyshnevetsky proposes constructing stone fortifications and establishing permanent liberties within the Sich. This will transform our settlement into the heart of Cossack liberties and military power."
 zaz_fixes.1.t:0 "Founding the Enhanced Sich"
 zaz_fixes.2.a:0 "Negotiate zones—pragmatism ensures survival."
 zaz_fixes.2.b:0 "We raid where we please! The Black Sea is ours!"
 zaz_fixes.2.d:0 "Our Chaiky boats have been raiding Ottoman coastal towns and merchant ships for years, bringing wealth and glory to the Sich. The Ottoman Sultan now sends envoys proposing a treaty: we may raid designated zones in exchange for ceasing attacks on major ports. Should we accept this limitation, or continue our unrestricted raids?"
 zaz_fixes.2.t:0 "Black Sea Raiding Rights"
 zaz_fixes.3.a:0 "Accept the expanded Register—we need Polish support."
 zaz_fixes.3.b:0 "We demand full autonomy, not bribes!"
 zaz_fixes.3.d:0 "The Polish Crown offers to expand the Cossack Register, granting official status and payment to more of our warriors. This would strengthen our military position and improve relations with the Commonwealth, but many Cossacks fear it compromises our independence. The unregistered Cossacks grow restless at this prospect."
 zaz_fixes.3.t:0 "Expansion of the Cossack Register"
 zaz_fixes.4.a:0 "Relocate the Sich to safety."
 zaz_fixes.4.b:0 "We will defend this ground to the last!"
 zaz_fixes.4.d:0 "War threatens the Sich as enemy forces advance upon our fortress. Our otamans propose moving the Sich upstream to a stronger haven, following the custom of the Host across the rapids. This will preserve our liberties and camp, though our existing works must be left behind."
 zaz_fixes.4.t:0 "Relocating the Sich"
 zaz_fixes.5.a:0 "Prepare for battle! We fear no Sultan!"
 zaz_fixes.5.b:0 "Send peace envoys—we've pushed too far."
 zaz_fixes.5.d:0 "Our unrestricted chaiky raids have brought Ottoman galleys up the Dnieper with fire and powder. We must brace our palisades and fight back, or dispatch envoys to seek a truce."
 zaz_fixes.5.t:0 "Ottoman Retaliation for Raids"
 zaz_fixes.6.a:0 "Liberty is our greatest strength!"
 zaz_fixes.6.b:0 "War demands strong military leadership."
 zaz_fixes.6.d:0 "The General Rada gathers at the Sich to decide the Host's future. Some would preserve the old liberties of the Cossack ranks; others argue that war demands firmer authority in the otaman's hands."
 zaz_fixes.6.t:0 "The General Rada Convenes"
 zaz_fixes.7.a:0 "Codify the relocation doctrine."
 zaz_fixes.7.b:0 "Mobilize the border Host immediately."
 zaz_fixes.7.d:0 "The Sich has survived another relocation, but the Host now debates what should follow: codify relocation doctrine and civil order, or prioritize emergency military readiness against encirclement."
 zaz_fixes.7.t:0 "After the Relocation"
 zaz_flavor.1.a:0 "Cossack freedom is not for sale."
 zaz_flavor.1.b:0 "We will not submit."
 zaz_flavor.10.a:0 "Glorious success!"
 zaz_flavor.10.b:0 "Mixed results"
 zaz_flavor.10.c:0 "Disaster strikes"
 zaz_flavor.10.d:0 "Our Cossack host has ridden deep beyond the border watchlines into enemy territory."
 zaz_flavor.10.t:0 "The Great Raid"
 zaz_flavor.11.a:0 "Devastating blow to the Sultan!"
 zaz_flavor.11.b:0 "Successful raid"
 zaz_flavor.11.c:0 "Caught and destroyed"
 zaz_flavor.11.d:0 "Our chaiky flotilla has descended upon the Ottoman Black Sea coast."
 zaz_flavor.11.t:0 "Chaiky Raid on Ottoman Coast"
 zaz_flavor.12.a:0 "Establish settlements"
 zaz_flavor.12.b:0 "Preserve the Wild Fields"
 zaz_flavor.12.d:0 "Cossack bands and nomadic herders share the Wild Fields, where no crown has held lasting sway. We may cultivate settled lands here, or preserve the open steppe that gives our riders room to move."
 zaz_flavor.12.t:0 "Settling the Wild Fields"
 zaz_flavor.13.a:0 "Accept Russian protection"
 zaz_flavor.13.b:0 "Maintain absolute independence!"
 zaz_flavor.13.d:0 "The Russian Tsardom now dominates the region. Moscow offers protection against Poland and the Ottomans, but at the price of subjection. Some in the Host would accept the tsar's overlordship; others insist that Cossack liberties survive only if we remain free."
 zaz_flavor.13.t:0 "The Russian Question"
 zaz_flavor.14.a:0 "Accept the Polish registration"
 zaz_flavor.14.b:0 "Reject Polish control and maintain independence"
 zaz_flavor.14.c:0 "Negotiate a compromise"
 zaz_flavor.14.d:0 "The Polish-Lithuanian Commonwealth seeks to formalize our cossack forces through the 'registered' system, demanding discipline and obedience. Our free cossacks resist this attempt to curtail our ancient traditions of liberty and independence. We must decide: accept registration for stability, or maintain our freedom at the risk of conflict with our overlords."
 zaz_flavor.14.t:0 "The Registered Cossacks Crisis"
 zaz_flavor.15.a:0 "Elect a strong military commander"
 zaz_flavor.15.b:0 "Elect a skilled diplomat"
 zaz_flavor.15.c:0 "Elect an experienced elder"
 zaz_flavor.15.d:0 "The Sich Rada, the general assembly of all free cossacks, gathers to elect a new Kosh Otaman (military commander). The position is elective and temporary, answerable to the Rada. We must choose a leader who embodies the spirit of our people: a fierce warrior, a skillful diplomat, or a wise elder."
 zaz_flavor.15.t:0 "The Sich Rada Convenes: Kosh Otaman Election"
 zaz_flavor.16.a:0 "Fortify the Sich and prepare for siege"
 zaz_flavor.16.b:0 "Launch a preemptive chaiky raid"
 zaz_flavor.16.c:0 "Seek protection from Moscow or Poland"
 zaz_flavor.16.d:0 "The Ottoman Sultan and Crimean Khan, angered by our chaiky raids and piracy on the Black Sea, threaten devastating retaliation. Their military expeditions loom on the horizon, and our supply lines are at risk. We must prepare our defenses, strike preemptively, or seek protection from a neighboring power."
 zaz_flavor.16.t:0 "Ottoman and Crimean Pressure"
 zaz_flavor.17.a:0 "Relocate to a safer location upstream"
 zaz_flavor.17.b:0 "Relocate to the mouth of the Dnieper (Ottoman lands)"
 zaz_flavor.17.d:0 "Our current location has become untenable due to raids, diplomatic pressure, or changing strategic circumstances. History shows that the Sich has relocated multiple times: from Tomakivka to Bazavluk, from Bazavluk to Mykytyn, from Mykytyn to Chortomlyts'ka, and finally to Oleshky under Ottoman protection. We must choose a safer location or risk annihilation."
 zaz_flavor.17.t:0 "The Sich Must Relocate"
 zaz_flavor.18.a:0 "Fight to the last man"
 zaz_flavor.18.b:0 "Scatter to Ottoman lands (Kuban path)"
 zaz_flavor.18.c:0 "Submit to Russian rule"
 zaz_flavor.18.d:0 "The Russian government threatens the survival of the Zaporozhian Sich. Our New Sich on the Pidpilna River faces its final reckoning. This is our final moment: we can fight to the death to preserve our honor, scatter to Ottoman lands to continue our struggle, or submit to Russian rule and hope to maintain some autonomy. History will judge our choice."
 zaz_flavor.18.t:0 "The Final Reckoning: 1775"
 zaz_flavor.19.t:0 "Sahaidachny and the Host"
 zaz_flavor.19.d:0 "Hetman Petro Konashevych-Sahaidachny has led the Host against Kaffa in 1616 and ridden to Moscow beside Prince Wladyslaw in 1618. Now he asks the Host to enrol, with its colonels and its banner, in the Kyiv Epiphany Brotherhood and to stand behind the Orthodox hierarchy restored in 1620. Some of the Rada fear that the Church will bind the Host, while others see in it the cause that makes Cossacks more than raiders."
 zaz_flavor.19.a:0 "Enrol the Host in the Kyiv Brotherhood"
 zaz_flavor.19.b:0 "The sea is our road: send the chaiky to Kaffa again"
 zaz_flavor.1a:0 "Excellent. Let the Cossacks ride!"
 zaz_flavor.1d:0 "The Zaporozhian Cossacks have organized themselves into a formidable military force. With their expertise in cavalry warfare and knowledge of the steppe, they offer us an opportunity to strengthen our military capabilities."
 zaz_flavor.1t:0 "The Cossack Host"
 zaz_flavor.2.a:0 "Establish Sich on Khortytsia Island"
 zaz_flavor.2.b:0 "Keep the Sich mobile and adaptable"
 zaz_flavor.2.d:0 "Below the Dnieper rapids, where no overlord's authority reaches, our Cossack brothers have established a fortified settlement - the Zaporozhian Sich. This will be our sanctuary of freedom, where all Cossacks are equals and the Kosh Otaman is elected by the General Rada. From here, we shall launch raids against the Tatars and Turks, defend Orthodox Christianity, and preserve our ancient liberties. The Sich stands as a beacon of Cossack independence in the Wild Fields."
 zaz_flavor.2.t:0 "The Founding of the Sich"
 zaz_flavor.3.a:0 "Build more chaiky boats"
 zaz_flavor.3.b:0 "Focus on traditional cavalry warfare"
 zaz_flavor.3.d:0 "Our Cossacks have mastered the art of naval warfare using chaiky - light, fast boats that can navigate rivers and seas. These vessels allow us to strike deep into Ottoman territory, raiding coastal cities and returning with wealth before the Sultan's fleet can respond. The Ottomans call us 'sea demons,' and they tremble when our chaiky appear on the horizon."
 zaz_flavor.3.t:0 "The Chaiky Raiders"
 zaz_flavor.4.a:0 "Raid Crimea!"
 zaz_flavor.4.b:0 "Restrain the Cossacks for now"
 zaz_flavor.4.d:0 "Crimean riders have harassed our settlements for generations, driving captives toward the slave markets of Caffa. Our sotnias now stand ready to ride south into Crimea, free prisoners, and seize plunder, though the foray risks provoking the Khan's retaliation."
 zaz_flavor.4.t:0 "Raid into Crimean Territory"
 zaz_flavor.5.a:0 "Elect the warrior"
 zaz_flavor.5.b:0 "Elect the diplomat"
 zaz_flavor.5.c:0 "Elect the wise elder"
 zaz_flavor.5.d:0 "The position of Kosh Otaman - the elected leader of the Zaporozhian Sich - has become vacant. The General Rada must convene to elect a new leader. Three candidates have emerged: a fearsome warrior who promises decisive military action, a skilled diplomat who advocates negotiation with our neighbors, and a wise elder who embodies traditional Cossack values."
 zaz_flavor.5.t:0 "The Kosh Otaman Election"
 zaz_flavor.50.a:0 "Crush the uprising"
 zaz_flavor.50.b:0 "Negotiate registers and autonomy"
 zaz_flavor.50.d:0 "The Cossack hosts rally behind Bohdan Khmelnytsky, demanding redress for abuses and recognition of their rights. The steppe is ablaze; how shall we respond?"
 zaz_flavor.50.t:0 "Khmelnytsky Stirs the Steppe"
 zaz_flavor.6.a:0 "Accept autonomy within the Commonwealth"
 zaz_flavor.6.b:0 "Defy Warsaw's demands."
 zaz_flavor.6.c:0 "Remain diplomatically neutral"
 zaz_flavor.6.d:0 "The Polish-Lithuanian Commonwealth seeks to control the Cossack Host through the Registry - limiting the number of 'official' Cossacks and demanding obedience. Many of our brothers in the registered Cossacks accept Polish authority, but the Zaporozhian Sich remains fiercely independent. Poland now demands we submit or face consequences."
 zaz_flavor.6.t:0 "Clash with the Polish-Lithuanian Commonwealth"
 zaz_flavor.7.a:0 "Champion the Orthodox cause!"
 zaz_flavor.7.b:0 "Maintain religious tolerance"
 zaz_flavor.7.d:0 "The Zaporozhian Sich has always been a bastion of Orthodox Christianity, defending the faith against Catholic and Muslim pressure. However, some argue for religious tolerance to strengthen our alliances. The General Rada must decide whether to champion Orthodoxy militantly or adopt a more pragmatic approach."
 zaz_flavor.7.t:0 "Religious Debates in the Rada"
 zaz_flavor.8.a:0 "Fight back with all our strength!"
 zaz_flavor.8.b:0 "Relocate the Sich to safety"
 zaz_flavor.8.c:0 "Pay tribute to end the conflict"
 zaz_flavor.8.d:0 "Our sea raids have drawn an Ottoman punitive army up the Dnieper against the Sich, threatening to burn the koshes and break the Host's resistance."
 zaz_flavor.8.t:0 "Ottoman Retaliation"
 zaz_flavor.9.a:0 "Form the alliance"
 zaz_flavor.9.b:0 "Remain independent"
 zaz_flavor.9.d:0 "Despite our conflicts with the Crimean Tatars, we Cossacks share much with the steppe nomads - a warrior culture, love of horses and freedom, and distrust of settled empires. Some nomadic chiefs have proposed a formal alliance, recognizing our common interests against Muscovy, Poland, and the Ottomans."
 zaz_flavor.9.t:0 "The Brotherly Compact"
 zaz_flavor_m_1.1.a:0 "Kill the Enemies!"
 zaz_flavor_m_1.1.b:0 "Slay the Nobles!"
 zaz_flavor_m_1.1.c:0 "Plunder and Pillage!"
 zaz_flavor_m_1.1.d:0 "Our soldiers have demonstrated their exceptional tactical prowess by launching a surprise attack on the Lithuanian forces and quickly defeating them."
 zaz_flavor_m_1.1.t:0 "Ambush in Lithuania"
 zaz_flavor_m_2.1.a:0 "Loot and Plunder the City!"
 zaz_flavor_m_2.1.b:0 "Conscript the people!"
 zaz_flavor_m_2.1.c:0 "Let the count decide!"
 zaz_flavor_m_2.1.d:0 "Our forces have successfully penetrated deep into enemy territory and captured the lightly defended fort in Kraków."
 zaz_flavor_m_2.1.t:0 "Ambush in Kraków"
 zaz_flavor_m_2.2.a:0 "Plunder and pillage!"
 zaz_flavor_m_2.2.b:0 "Population conscription!"
 zaz_flavor_m_2.2.c:0 "Leave it to the Courts!"
 zaz_flavor_m_2.2.d:0 "Our forces struck swiftly behind enemy lines and carried the weakly held fortress of Moskva."
 zaz_flavor_m_2.2.t:0 "Moskva ambush"
 zaz_flavor_m_3.1.a:0 "Loot and pillage!"
 zaz_flavor_m_3.1.b:0 "Recruit the population!"
 zaz_flavor_m_3.1.c:0 "Allow the courts to Decide!"
 zaz_flavor_m_3.1.d:0 "Against steep odds, the Host has won its independence. The Sich Rada meets in solemn assembly, the elected Kosh Otaman raises the bulava, and the black and red banners fly over free ground. Foreign envoys arrive to congratulate, to warn, or to measure whether a Cossack commonwealth can endure among the empires of Europe."
 zaz_flavor_m_3.1.t:0 "The Free Zaporozhian State"
 zaz_flavor_m_3.2.a:0 "Plunder and loot!"
 zaz_flavor_m_3.2.b:0 "Conscription of locals!"
 zaz_flavor_m_3.2.c:0 "Leave it to the judiciary!"
 zaz_flavor_m_3.2.d:0 "Our forces struck swiftly behind enemy lines and carried the weakly held fortress of Saratov."
 zaz_flavor_m_3.2.t:0 "Ambush in Saratov"
 zaz_flavor_m_4.1.d:0 "The Sich Rada debates far into the night, voices rising across the square. 'Moscow offers Orthodox brotherhood,' urges one colonel. 'The Porte grants trade and tribute from the steppe,' counters another. 'We bow to neither Tsar nor Sultan,' declares a third. In the Cossack way, the final reckoning belongs to the assembled Host."
 zaz_flavor_m_4.1.t:0 "Choosing Protectors"
 zaz_flavor_m_4.a:0 "Send our answer to the Porte."
 zaz_flavor_m_4.b:0 "Keep faith with the steppe alliance."
 zaz_flavor_m_4.c:0 "The Host will stand on its own."
 zaz_flavor_m_4.d:0 "Send our terms to the crown."
 zaz_flavor_m_4.d1:0 "Our envoys have sought the Sultan's protection. His fleet commands the Black Sea. Much will depend on what he asks of the Host in return."
 zaz_flavor_m_4.d2:0 "Our envoys have sought an alliance with the Great Horde. If its horsemen ride with us, the Crimean khan must reckon with more than the Sich."
 zaz_flavor_m_4.d3:0 "The Rada has chosen to stand alone. We shall keep our own counsel and answer for our own frontier."
 zaz_flavor_m_4.d4:0 "Our envoys have opened talks with the Polish crown. We have served beside its banners before, and our officers remember the price of that service."
 zaz_flavor_m_4.d5:0 "Our envoys have appealed to Russia. We share a faith, but the Host will judge our fellow Orthodox by the help they send."
 zaz_flavor_m_4.e:0 "Let our envoys carry the Rada's word."
 zaz_flavor_m_4.t:0 "The New Course of Action"
 zaz_flavor_m_5.1.a:0 "Embrace the faith of the Prophet."
 zaz_flavor_m_5.1.b:0 "We can put up with them, but I will stick to my convictions"
 zaz_flavor_m_5.1.d:0 "Envoys and scholars from the Sultan's court have long been welcome at our own. Their learning and conduct may persuade us to consider their faith more closely."
 zaz_flavor_m_5.1.t:0 "Islam Conversion"
 zaz_flavor_m_5.2.a:0 "Enter communion with the Roman Church."
 zaz_flavor_m_5.2.b:0 "We can put up with them, but I will stand firm in my convictions"
 zaz_flavor_m_5.2.d:0 "Because of our long-standing relations to the West, many notable and renowned Catholics have visited our court. I agree that it's time to take a more respectful look at this faith."
 zaz_flavor_m_5.2.t:0 "Catholic Conversion"
 zaz_flavor_m_6.a:0 "Seal the letter and dispatch the riders."
 zaz_flavor_m_6.d:0 "Seeking to proclaim our defiance before our allies and the entire steppe frontier, the elders gather around an oak table to draft a stinging epistle to the Sultan. As the scribe dips his quill in ink, laughter and fierce taunts ring across the Sich, each sotnia offering sharper epithets against the Porte."
 zaz_flavor_m_6.t:0 "The Letter of the Zaporozhian Cossacks"
 zaz_flavor_m_7.a:0 "They heard every word."
 zaz_flavor_m_7.d:0 "Our defiant epistle was received at the Porte with cold fury; envoys bring word of stiffened garrisons along the Danube and the Dnieper mouth."
 zaz_flavor_m_7.t:0 "Reply from the [TUR.GetAdjective] Court"
 zaz_flavor_m_8.a:0 "Teach these frontier insolents respect!"
 zaz_flavor_m_8.d:0 "Couriers have laid a mocking, coarse epistle from Zaporozhia before our Divan, written in fiery Ruthenian phrasing that leaves no doubt of the Host's defiance."
 zaz_flavor_m_8.t:0 "A Defiant Letter from the Sich"
 zaz_flavor_m_9.a:0 "Everything should be packed"
 zaz_flavor_m_9.b:0 "We should dedicate our resources to our present capital"
 zaz_flavor_m_9.d:0 "Our country's capture of Constantinople was a watershed event. Moving the capital there will offer us with benefits and riches previously unseen."
 zaz_flavor_m_9.t:0 "Zaporozhia's Desire City"
 zaz_fortify_frontier_desc:0 "Strengthen our border fortresses to deter incursions."
 zaz_fortify_frontier_title:0 "Fortify the Frontier"
 zaz_fortify_sloboda_desc:0 "Our civilian sloboda settlements provide manpower and production, but they remain vulnerable to raids. By investing in proper fortifications, we can transform these colonies into bastions capable of holding against nomadic raiders and enemy armies alike."
 zaz_fortify_sloboda_title:0 "Fortify Sloboda"
 zaz_free_cossacks_spirit:0 "Free Cossacks Spirit"
 zaz_free_host_reform:0 "Zaporozhian Host"
 zaz_free_host_reform_desc:0 "The Zaporozhian Host is a warrior commonwealth governed through the Sich and its war council. Its cavalry, elected officers, and frontier diplomacy preserve Cossack liberty between rival empires."
 zaz_freed_captives_tt:0 "Our raid has freed Christian captives from Ottoman slavery."
 zaz_frontier_tolerance:0 "Frontier Tolerance"
 zaz_frontier_tolerance_desc:0 "The Sich accepts Orthodox, Old Believers, and even some Catholics, united by Cossack brotherhood rather than theology."
 zaz_frontier_trade:0 "Frontier Trade Relations"
 zaz_gave_the_host_refuge:0 "Gave the Host refuge"
 zaz_general_rada_reform:0 "General Sich Rada"
 zaz_general_rada_reform_desc:0 "The General Rada is the supreme assembly of all Zaporozhian Cossacks. Every warrior has a voice and vote on matters of war, peace, and internal policy. This open Rada ensures popular support but can be chaotic and makes decisive action difficult."
 ZAZ_GOL_attack_genoa_2_desc:0 "Foreign Genoese merchants have governed the important Black Sea commercial hubs for far too long. The money and riches they provide are just too important to ignore."
 ZAZ_GOL_attack_genoa_2_title:0 "Seize Ports"
 ZAZ_GOL_attack_genoa_desc:0 "Theodoro is a terrific addition to our collection."
 ZAZ_GOL_attack_genoa_title:0 "Conquer Theodoro"
 ZAZ_GOL_cordon_desc:0 "Having freed ourselves from our oppressors, we must strike back to ensure that such a fate does not befall us again."
 ZAZ_GOL_cordon_title:0 "Invade [LIT.GetName]"
 ZAZ_GOL_crimea_1_desc:0 "Yedisan and the lower Dnieper steppes belong by right and blood to our winter camps; let no foreign tribute weigh upon them longer."
 ZAZ_GOL_crimea_1_title:0 "Unite our country"
 ZAZ_GOL_crimea_2_desc:0 "The longer they are left alone, the more difficult [CRI.GetName] will become. They not only raid us in order to complete their slave trade, but they also constitute a serious military danger."
 ZAZ_GOL_crimea_2_title:0 "Dismantle [CRI.GetName]"
 ZAZ_GOL_crimea_3_desc:0 "The Circassians live in a land that would be trivially easy to attack and subjugate. Perhaps their remembrances will be useful to us."
 ZAZ_GOL_crimea_3_title:0 "Subjugate Circassia"
 ZAZ_GOL_east_dniepr_desc:0 "The grassy steppes of the Left Bank beckon our host to widen our winter quarters and pastures."
 ZAZ_GOL_east_dniepr_title:0 "East Dnieper"
 zaz_gol_friend:0 "Aligned with [GOL.GetName] for Strategic Alliance"
 ZAZ_GOL_insult_crimea_desc:0 "Let envoys remind Bakhchysarai that the Cossack Host yields no steppe pasture or crossing to Crimean threats."
 ZAZ_GOL_insult_crimea_title:0 "Insult [CRI.GetName]"
 ZAZ_GOL_insult_feo_desc:0 "The Goths are a remnant of a bygone era and serve no purpose in today's world. We must make it clear to them that their existence is irrelevant."
 ZAZ_GOL_insult_feo_title:0 "Insult [FEO.GetName]"
 ZAZ_GOL_insult_lit_desc:0 "Let Lithuania hear plainly that the free Host answers no longer to Vilnius."
 ZAZ_GOL_insult_lit_title:0 "Insult [LIT.GetName]"
 ZAZ_GOL_insult_tur_desc:0 "Ottoman designs press along the Black Sea shore. Let our envoys deliver a sharp warning to the Porte that Zaporozhia fears no threat."
 ZAZ_GOL_insult_tur_title:0 "Denounce [TUR.GetName]"
 ZAZ_GOL_malopolska_desc:0 "With the prosperous cities of Kraków and Lublin under our control, we will gain renewed access to lucrative markets across Europe."
 ZAZ_GOL_malopolska_title:0 "Seize Kraków and Lublin"
 ZAZ_GOL_podolia_volhynia_desc:0 "The fertile meadows of Podillia and Volhynia offer rich grazing grounds for our cavalry mounts."
 ZAZ_GOL_podolia_volhynia_title:0 "Podillia and Volhynia"
 ZAZ_GOL_poland_desc:0 "The fall of Poland will pave the way for our unbridled expansion and endless wealth accumulation."
 ZAZ_GOL_poland_title:0 "Annihilate Poland"
 ZAZ_GOL_politics_2_desc:0 "Patient diplomacy and faction-craft within the Horde have placed our own allies at its helm."
 ZAZ_GOL_politics_2_title:0 "Succession of [Root.GetName]"
 ZAZ_GOL_politics_desc:0 "Crimea, Kazan and Astrakhan quarrel over precedence and pay Moscow separately for it. Cossack foot behind Tatar horse would make one power of the steppe, if the murzas can be brought to sit at one Rada."
 ZAZ_GOL_politics_title:0 "The Steppe Confederation"
 ZAZ_GOL_red_ruthenia_desc:0 "The vast expanse of the Eastern European Plains, which Poland calls home, is an obstacle to our ambitions."
 ZAZ_GOL_red_ruthenia_title:0 "Invade Poland"
 ZAZ_GOL_russia_2_desc:0 "Muscovy's northern dominance is waning, leaving its borderlands open to the Host's ambition."
 ZAZ_GOL_russia_2_title:0 "Interference in Russia"
 ZAZ_GOL_russia_3_desc:0 "With no one remaining to seriously question our claim to the Russian Region, we must establish unequivocally that the territories belong to us and us alone."
 ZAZ_GOL_russia_3_title:0 "Take control of Russia"
 ZAZ_GOL_russia_buff:0 "Strengthening Our Forces with Russian Conscripts in [GOL.GetName]"
 ZAZ_GOL_russia_desc:0 "Muscovy has gathered the principalities of Rus' under its rule. The khans' overlordship has ended, yet the Golden Horde may still claim the inheritance of the steppe and march north."
 ZAZ_GOL_russia_title:0 "Invade Russia"
 ZAZ_GOL_russian_help:0 "Assistance from Russian Officers"
 ZAZ_GOL_ruthenia:0 "Reclaiming Our Rus' Homeland"
 ZAZ_GOL_ruthenia_desc:0 "The ancient cities of Rus' are the ancestral hearth of our Cossacks and kindred peoples across the Dnieper plains."
 ZAZ_GOL_ruthenia_title:0 "Reclaim the Homeland"
 ZAZ_GOL_trebes_desc:0 "From the Pontic mountains to the harbors of Trebizond, the Anatolian shore offers rich tribute for a swift amphibious host."
 ZAZ_GOL_trebes_title:0 "Conquer Trebizond"
 ZAZ_GOL_tribes_2_desc:0 "The princes of Eastern Georgia are divided. Force of arms may bring their courts beneath our suzerainty and restore the tribute once paid to the khans."
 ZAZ_GOL_tribes_2_title:0 "Eastern Georgia"
 ZAZ_GOL_tribes_3_desc:0 "The Dagestan counties are vulnerable to subjection."
 ZAZ_GOL_tribes_3_title:0 "Subjugate Dagestan"
 ZAZ_GOL_tribes_4_desc:0 "The bulk of the Caucasus now answers to the Host. The remaining princes may be brought into the same tribute arrangement."
 ZAZ_GOL_tribes_4_title:0 "Subjugate the Caucasus"
 ZAZ_GOL_tribes_desc:0 "The princes of Western Georgia are divided. Demand tribute in return for protection, and draw their courts into our steppe alliance."
 ZAZ_GOL_tribes_title:0 "Subdue West Georgia"
 ZAZ_GOL_tur_1_desc:0 "With the fertile fields of Moldavia and the Dniester estuary in our hands, the Host commands a thriving gateway to Danubian commerce."
 ZAZ_GOL_tur_1_title:0 "Conquer Moldavia"
 ZAZ_GOL_tur_2_desc:0 "Wallachia's rich Danubian plains will supply our regiments and towns with abundant grain."
 ZAZ_GOL_tur_2_title:0 "Conquer Wallachia"
 ZAZ_GOL_tur_3_desc:0 "The Bulgarian lands are under [TUR.GetName]'s rule. Their towns and roads would strengthen our hold on the Balkans."
 ZAZ_GOL_tur_3_title:0 "Invade Bulgaria"
 ZAZ_GOL_tur_4_desc:0 "Thrace guards the Bosporus and the approaches to Constantinople. Whoever holds this peninsula commands the passage between the Black Sea and the Aegean."
 ZAZ_GOL_tur_4_title:0 "Invade Thrace"
 ZAZ_GOL_tur_5_desc:0 "Constantinople, capital of the Roman and Byzantine emperors, now lies under Ottoman rule. Its conquest would place the imperial city and the straits in our hands."
 ZAZ_GOL_tur_5_title:0 "Take Tsargrad"
 ZAZ_GOL_west_dniepr_desc:0 "The fertile meadows of the Right Bank offer rich grazing for our remounts and safe crossings along the Dnieper."
 ZAZ_GOL_west_dniepr_title:0 "West Dnieper"
 ZAZ_GOL_weste_desc:0 "Holding the fortress ports of Budjak opens the Dniester crossing and prepares the Host to march into Moldavia."
 ZAZ_GOL_weste_title:0 "Dniester Mouth"
 zaz_grateful_cossacks:0 "Grateful Cossacks"
 zaz_great_rada_desc:0 "When the matter is war, peace or the bulava itself, the Kosh Otaman calls the whole Host to the square. Rank counts for nothing there, and a decision taken by shouting is difficult to appeal afterwards."
 zaz_great_rada_held:0 "Great Rada Convened"
 zaz_great_rada_held_desc:0 "The General Rada has met and affirmed our old liberties."
 zaz_great_rada_title:0 "Convene the Great Rada"
 zaz_great_raid:0 "Great Raid"
 zaz_great_raid_desc:0 "Organize a grand raiding expedition. The following event randomly selects an eligible known target country; there is no manual selection of a country or province on the map."
 zaz_great_raid_title:0 "Launch a Great Raid"
 zaz_hate_mos:0 "Maintaining Tenuous Alliances with Hordes and their Allies"
 zaz_hate_plc:0 "Firmly Aligned with Opponents of Poland"
 zaz_high_difficulty:0 "§RHigh Difficulty§!"
 zaz_historically_accurate:0 "§GHistorically accurate path§!"
 zaz_hold_hetman_election_desc:0 "Spend 100 Administrative Power and 1 Stability to assemble the Rada and choose a new hetman. Elections require a twenty-year mandate to have elapsed, an initial legitimacy crisis, or a demand by our overlord. At least two years must pass after any election. The mandate and shared election terms are recorded before the candidates are presented."
 zaz_hold_hetman_election_title:0 "Hold Hetman Election"
 zaz_host_and_state_reform:0 "Registered Host"
 zaz_host_and_state_reform_desc:0 "The register becomes the roll of the realm. Regiments hold the districts they recruit from, the starshyna hold the offices, and the treasury exists to keep the regiments standing. What is left of the rada meets when the hetman has finished drilling."
 zaz_host_great_rada_desc:0 "Spend 75 ADM to assemble the full Sich Rada and reaffirm our unity. Its modifier lasts ten years; the assembly may be convened again ten years after its previous use."
 zaz_host_great_rada_title:0 "Host a Great Rada"
 zaz_host_in_exile:0 "Host in Exile"
 ZAZ_ideas:0 "Saporozhische Ideen"
 ZAZ_ideas_bonus:0 "Saporozhische Ambitionen"
 ZAZ_ideas_start:0 "Saporozhische Traditionen"
 ZAZ_independce_desc:0 "Our hetmans hold the bulava at the king's pleasure and our numbers are fixed by his register. The Host has kept this frontier for Vilnius, for Krakow and for Moscow in turn, and been paid in promises each time."
 ZAZ_independce_title:0 "The Path to Freedom"
 ZAZ_insult_cri_desc:0 "The inferior Crimean Khanate must be made aware of their insignificance in our realm."
 ZAZ_insult_cri_title:0 "Insult [CRI.GetName]"
 ZAZ_insult_lit_desc:0 "Let us remind our former rulers of our worth and their foolishness in underestimating us."
 ZAZ_insult_lit_title:0 "Insult [LIT.GetName]"
 zaz_insult_tur:0 "Defiant Posturing Against [TUR.GetName]"
 zaz_islam_spread:0 "The Spread of Islam"
 ZAZ_istanbul_desc:0 "Our grandfathers took chaiky into the Bosphorus and burned the suburbs within sight of the Sultan's windows. The Porte has since chained the straits and keeps a squadron at the mouth. The insult is remembered on both sides."
 ZAZ_istanbul_title:0 "Raid on the Bosporus"
 zaz_joined_confederation:0 "Joined the Kyivan Confederation"
 ZAZ_khanate_desc:0 "As a small free harbor state, we must use every resource available to us if we are to survive and become more than a footnote in history."
 ZAZ_khanate_title:0 "Developing [Root.GetName]"
 zaz_kosh_elections_reform:0 "Kosh Election System"
 zaz_kosh_elections_reform_desc:0 "The Kosh Otaman (chief of the Sich) is elected annually by the General Rada. Officers serve short terms and can be removed by popular vote. This frequent rotation prevents tyranny but creates instability and limits long-term planning."
 zaz_kosh_otaman:0 "Kosh Otaman Leadership"
 zaz_kosh_otaman_desc:0 "The elected Kosh Otaman leads the Host in war and peace, his authority derived from martial prowess and the Rada's confidence."
 ZAZ_krakow_desc:0 "Krakow keeps the Wawel, the crown treasury and the rents wrung from our starostwa. A raid through Malopolska would not hold the city, but it would settle what the magnates believe about the reach of Cossack horse."
 ZAZ_krakow_title:0 "Raid on Kraków"
 zaz_last_sich_reform:0 "Last Sich Resistance"
 zaz_last_sich_reform_desc:0 "Under mounting imperial pressure, the Kish preserves its elected officers, courts, and military roll. The Sich endures as a final bastion of Cossack frontier liberty."
 zaz_launch_chaiky_raid_desc:0 "Reed-bundled hulls, fifty men to a boat, out through the liman before the Ottoman squadron can work upwind. The coast towns keep their plate in the churches and their captives in the pens, and both can be lifted in a night."
 zaz_launch_chaiky_raid_title:0 "Launch Chaiky Raid"
 zaz_liberate_slaves_desc:0 "Strike the slave markets and free our people held in bondage."
 zaz_liberate_slaves_title:0 "Liberate the Slaves"
 zaz_liberated_slaves:0 "Liberated Our Slaves"
 zaz_liberator_of_slaves:0 "Liberator of Slaves"
 zaz_liberator_of_slaves_desc:0 "Our raids freed many Christian captives from bondage, swelling our ranks and inspiring our men."
 ZAZ_lit_desc:0 "The magnates hold the steppe as private latifundia and press free men into labour dues. The register is cut when it suits the Sejm and our elders are executed when it does not. The bulava has bowed to that crown long enough."
 zaz_lit_kill:0 "Eastern Maneuvers"
 ZAZ_lit_title:0 "Break the Polish Yoke"
 zaz_loyal_subject:0 "Loyal Subject"
 zaz_mission_requirement:0 "§RRequirement:§! "
 zaz_mission_reward:0 "§YReward:§! "
 zaz_missionaries:0 "Foreign Missionaries"
 zaz_monument.1.a:0 "Let the Rada meet in the open."
 zaz_monument.1.b:0 "Draw up the register and shut the gate."
 zaz_monument.1.d:0 "The palisade above the rapids is finished and the Kish has a roof that will stand a winter. The old hands want the Rada to meet in the open as it always has, with every man who came downriver entitled to speak. The colonels want a register, a muster roll, and a gate that can be shut."
 zaz_monument.1.t:0 "The Sich Behind Its Walls"
 zaz_monument.2.a:0 "Build the flotilla."
 zaz_monument.2.b:0 "Keep the Host in the saddle."
 zaz_monument.2.d:0 "Below the rapids there is now timber, pitch and a slipway. The Host could put sixty chaiky on the Black Sea in a season and take Ottoman shipping from its own yards. The horsemen answer that the steppe is where the Host has always won, and that boats rot in the reeds."
 zaz_monument.2.t:0 "The Chaiky Yards"
 zaz_monument.3.a:0 "Keep a standing treasury."
 zaz_monument.3.b:0 "Share out the stores as before."
 zaz_monument.3.d:0 "The finished fortress has cellars, and for the first time the Host has something to keep in them. The Kish otaman proposes a standing treasury, taxed from the crossings and the fisheries. The old hands answer that the Host has always shared out what it took, and that a locked cellar makes officers of comrades."
 zaz_monument.3.t:0 "The Winter Stores"
 ZAZ_moskva_desc:0 "Moscow calls the gathering of the Rus' lands a duty, and our liberties a privilege it may revise. If the Tsar will not set them in writing, the Host can show him what the gathering costs when the gathered object."
 ZAZ_moskva_title:0 "Strike at the Third Rome"
 ZAZ_muster_manpower_desc:0 "Before the Host can stand against great empires, we must summon fresh riders across the Wild Fields—every free man ready to handle sabre and musket may take his place in the ranks."
 ZAZ_muster_manpower_title:0 "Muster the Cossack Host"
 zaz_nalyvaiko_cossack_lands_confiscated:0 "Cossack Lands Confiscated"
 zaz_nalyvaiko_peace_offer:0 "Nalyvaiko Peace Agreement"
 zaz_negotiate_with_the_rebels_desc:0 "Try to negotiate with the rebels in Solonytsy."
 zaz_negotiate_with_the_rebels_title:0 "Negotiate with the Rebels"
 zaz_new_sich_camp:0 "New Sich Camp"
 zaz_no_register:0 "Register Abolished"
 zaz_obedient_cossacks:0 "Obedient Cossacks"
 ZAZ_only_zaz_desc:0 "No king, tsar, sultan or khan holds our charter. The Kish feeds itself from the river, the herd and the raid, and the Rada answers to nobody. Standing alone on open steppe is a policy that must be renewed every campaigning season."
 ZAZ_only_zaz_title:0 "The Cossack Republic"
 zaz_order_in_ukraine:0 "Order in Ukraine"
 zaz_ortho:0 "Fortress of the Orthodox Faith"
 zaz_orthodox_champions:0 "Champions of Orthodoxy"
 zaz_orthodox_champions_desc:0 "We are recognized as defenders of the Orthodox faith."
 ZAZ_orthodox_protectors_desc:0 "The Latin bishops hold the endowments and the king's ear; our metropolitan keeps his seat in Kyiv on sufferance. The brotherhoods of Lviv and Kyiv keep their schools on what the pious still send, and their sons come to the Host when the town gates close to them."
 ZAZ_orthodox_protectors_title:0 "Defenders of Orthodoxy"
 ZAZ_OTAMAN_GENERAL:0 "General Otaman"
 ZAZ_OTAMAN_HOST:0 "Host Otaman"
 ZAZ_OTAMAN_KOSH:0 "Kosh Otaman"
 zaz_paths.1.a:0 "Let the palanky stand"
 zaz_paths.1.d:0 "The general rada has settled it: each palanka keeps its own muster and its own court, and what the rada decides it decides by consent. The Swiss cantons are said to run on the same principle and have not been conquered in living memory. Whether steppe without mountains holds the same way is not yet known."
 zaz_paths.1.t:0 "The Cantons Agree to Agree"
 zaz_paths.2.a:0 "Muster the regiments"
 zaz_paths.2.d:0 "The regiments now hold the districts that feed them, the starshyna hold the offices, and the treasury has one purpose. A Prussian envoy is said to have remarked that other states keep an army while this one is an army that keeps a state. He did not mean it as praise."
 zaz_paths.2.t:0 "The Register Becomes the Realm"
 zaz_paths.3.a:0 "Bind the brothers"
 zaz_paths.3.d:0 "The chapter met at dawn and the otaman rose from it a master. Brothers hold their land in the name of the faith, and the frontier has a monastic rule written over it for the first time. The Teutonic brothers ended by fighting the neighbours they were sent to convert."
 zaz_paths.3.t:0 "The Kish Takes Vows"
 zaz_paths.4.a:0 "Strike the camp"
 zaz_paths.4.d:0 "The wagons are drawn up, the herds are counted and the icons ride at the head of the column. The steppe has fed hordes before and does not much mind whose. What it will not feed is a register, and the clerks have already begun to drift away."
 zaz_paths.4.t:0 "The Camp Moves With the Grass"
 zaz_paths.5.a:0 "Pitch the camp and be grateful"
 zaz_paths.5.b:0 "Pitch it and forget the debt"
 zaz_paths.5.d:0 "The wagons crossed at night and the new camp stands on land that is ours only because somebody agreed to it. There is grass, there is water, and there is a host who will remember the favour. Guests keep their weapons but not their say."
 zaz_paths.5.t:0 "The Host Pitches on Another Man's Ground"
 zaz_paths.6.a:0 "Grant them a frontier camp"
 zaz_paths.6.b:0 "Turn the Host away"
 zaz_paths.6.d:0 "Driven from their old camps, envoys of [From.GetName] have ridden to our court asking leave to pitch their kish on an outlying stretch of our frontier steppe. They promise to guard the border and remember the shelter, though granting them a camp means ceding a non-capital frontier province to the exiled Host."
 zaz_paths.6.t:0 "The Cossack Host Seeks Refuge"
 zaz_peace_offering:0 "Peace Offering"
 zaz_plc_buff:0 "The Granaries of the Polish Lands"
 ZAZ_POL_2_desc:0 "Wallachia's rich Danubian plains will supply our regiments and towns with abundant grain."
 ZAZ_POL_2_title:0 "Conquer Wallachia"
 ZAZ_POL_3_desc:0 "The Ottoman-held Bulgarian provinces command the roads between the Danube and the Aegean. Seizing them would carry our influence deeper into the Balkans."
 ZAZ_POL_3_title:0 "Invade Bulgaria"
 ZAZ_POL_4_desc:0 "Thrace has always been strategically essential as a peninsula controlling the Bosporus Strait; securing such a critical area would provide our country immense riches."
 ZAZ_POL_4_title:0 "Invade Thrace"
 ZAZ_POL_5_desc:0 "The magnificent city of Constantinople is wanted across Europe; the Romans were the first to possess it, followed by the Turks, and now we do."
 ZAZ_POL_5_title:0 "Take Tsargrad"
 ZAZ_POL_cordon_desc:0 "After freeing ourselves from any oppressors, we must strike back and guarantee that this does not happen again."
 ZAZ_POL_cordon_title:0 "Invade [LIT.GetName]"
 ZAZ_POL_cri_desc:0 "Let Bakhchysarai learn that the Cossack Host yields no crossing along the Dnieper."
 ZAZ_POL_cri_title:0 "Insult [CRI.GetName]"
 ZAZ_POL_desc:0 "Situated between the Carpathians and the Dniester, Moldavia commands the approaches to the Danube and the Balkans."
 ZAZ_POL_east_dniepr_desc:0 "The Left-Bank steppes along the Eastern Dnieper offer boundless grazing for the Host's cavalry."
 ZAZ_POL_east_dniepr_title:0 "East Dnieper"
 ZAZ_POL_end_crimea_desc:0 "We will have a brief reprieve now that the Crimean Khanate has been destroyed."
 ZAZ_POL_end_crimea_title:0 "Eliminate Crimea"
 ZAZ_POL_expand_border_desc:0 "Backed by our Polish allies, the Host can hurl open defiance at the Sultan and press our claims down to the Dniester marches."
 ZAZ_POL_expand_border_title:0 "Defy the Porte"
 ZAZ_POL_insult_gol_desc:0 "Sending a sharp insult to the Khanate shows Warsaw and the steppe alike that the Host fears no Tatar banner."
 ZAZ_POL_insult_gol_title:0 "Insult [GOL.GetName]"
 ZAZ_POL_politics_2_desc:0 "Our alliance with Poland and the strength of our realm have raised the Host's standing among the neighbouring courts."
 ZAZ_POL_politics_2_title:0 "Pillar of the Crown"
 ZAZ_POL_politics_desc:0 "Let the hetman sit in the Senate beside the palatines, the starshyna be entered in the armorial, and the register be set by treaty rather than by the crown's convenience. The szlachta will ask who else may claim a coat of arms."
 ZAZ_POL_politics_title:0 "Seats in the Sejm"
 ZAZ_POL_russia_2_desc:0 "Moscow's northern supremacy has waned, leaving its western marches vulnerable to our banners."
 ZAZ_POL_russia_2_title:0 "Interfere in Russia"
 ZAZ_POL_russia_3_desc:0 "With no one remaining to seriously question our claim to the Russian Region, we must establish unequivocally that the territories belong to us and us alone."
 ZAZ_POL_russia_3_title:0 "Take control of Russia"
 ZAZ_POL_russia_desc:0 "Russia is no longer subject to foreign control, having been subject to the Mongol Yoke and later the Tatar Yoke. We can, however, change that."
 ZAZ_POL_russia_title:0 "Invade Russia"
 ZAZ_POL_ruthenia_desc:0 "The ancient heartland of Rus' across the Dnieper lowlands is the natural homeland of the Zaporozhian Host and our kindred peoples."
 ZAZ_POL_ruthenia_title:0 "Zaporozhia Reclaims Rus'"
 ZAZ_POL_seize_ports_desc:0 "For far too long, the key Black Sea trade centers have been ruled by foreign Genoese merchants. The wealth and riches they bring in are far too valuable to overlook."
 ZAZ_POL_seize_ports_title:0 "Seize Ports"
 ZAZ_POL_settle_east_2_desc:0 "The commercial route to Poland runs along the Dniester, and its growth benefits our revenues."
 ZAZ_POL_settle_east_2_title:0 "Control the Dniester"
 ZAZ_POL_settle_east_desc:0 "The Dniester River is a natural boundary to the east and south, and by rising to the center of the river, we may build a prosperous territory of our country in all aspects."
 ZAZ_POL_settle_east_title:0 "Across the Dniester"
 ZAZ_POL_settle_north_desc:0 "With Podillia secured along our western flank, we can fortify Bratslav and anchor our settlements across the Right Bank."
 ZAZ_POL_settle_north_title:0 "Settle Ukraine"
 ZAZ_POL_settle_south_desc:0 "With the shores of Azov in our hands, the Host controls the mouth of the Don and can press its claims across the whole of the Crimean steppe."
 ZAZ_POL_settle_south_title:0 "Command the Sea of Azov"
 ZAZ_POL_sieze_ports_desc:0 "We must seize the ports in the Crimea region to strengthen our trade and military presence."
 ZAZ_POL_sieze_ports_title:0 "Seize Ports"
 ZAZ_POL_title:0 "Balkan Gateway"
 ZAZ_POL_west_dniepr_desc:0 "The Right Bank along the Western Dnieper holds broad meadows rich enough to sustain our mounted banners."
 ZAZ_POL_west_dniepr_title:0 "West Dnieper"
 zaz_polish_autonomy:0 "Autonomy within Commonwealth"
 zaz_polish_autonomy_desc:0 "We have negotiated special rights within the Polish-Lithuanian Commonwealth."
 zaz_prepped:0 "Prepared Defenses"
 ZAZ_proper_desc:0 "Our camp commands respect across the great steppe marches."
 zaz_proper_khan:0 "Establishing a Proper Khanate"
 ZAZ_proper_title:0 "Rightful Khanate"
 zaz_protect_orthodox_desc:0 "The Union takes the sees and the endowments, and Moscow's patriarch would take what is left. Between them stands the Host, which owns neither but can garrison a monastery."
 zaz_protect_orthodox_title:0 "Protect Orthodox Monasteries"
 zaz_protected_orthodox:0 "Protected Orthodox Christians"
 zaz_rada_cooldown:0 "Recent Rada Assembly"
 zaz_rada_effects_tt:0 "The Great Rada makes momentous decisions affecting the entire Host."
 zaz_raid_provocation:0 "Cossack Raid Provocation"
 ZAZ_RAID_TARGET_CRIMEA:0 "the Crimean Khanate"
 ZAZ_RAID_TARGET_GENERIC:0 "our enemies"
 ZAZ_RAID_TARGET_TURKS:0 "the Ottoman Empire"
 zaz_raiding_agreement:0 "Raiding Agreement"
 ZAZ_rally_hordes_desc:0 "The frontier villages breed men who ride from childhood and shoot from the saddle. Drilled to volley as well, the Host fields horse that skirmishes like a Nogai and holds like a Polish banner."
 ZAZ_rally_hordes_title:0 "Steppe Warfare"
 zaz_rebellious_cossacks:0 "Rebellious Cossacks"
 zaz_recent_relocation:0 "Recent Sich Relocation"
 zaz_recruit_steppe_cavalry_desc:0 "Good standing with the hordes brings us their light horse, men who scout four days ahead and vanish when pressed. The same riders were over our border last season, and their kin still are."
 zaz_recruit_steppe_cavalry_title:0 "Recruit Steppe Cavalry"
 zaz_refused_confederation:0 "Refused Confederation Invitation"
 zaz_register_abolished_tt:0 "The register is abolished, welcoming all free men into the Cossack Host."
 zaz_register_expanded:0 "Expanded Cossack Register"
 zaz_register_expanded_tt:0 "More Cossacks join the official register."
 zaz_register_limited:0 "Limited Cossack Register"
 zaz_register_reform_desc:0 "The register pays and privileges the men written into it and leaves the rest liable to their lords. Every hetman must decide whether the Host is the men on the roll or the men on the island."
 zaz_register_reform_title:0 "Reform the Register"
 zaz_register_unlimited:0 "Unlimited Cossack Register"
 zaz_registered_cossacks:0 "Registered Cossacks"
 zaz_religious_tolerance:0 "Cossack Religious Tolerance"
 zaz_religious_tolerance_desc:0 "We welcome people of all faiths to the Sich."
 zaz_relocate_sich_desc:0 "Move the Zaporozhian Sich to a new, more defensible location to safeguard our autonomy."
 zaz_relocate_sich_monument_tt:0 "The Sich itself is carried to the new seat, one tier lower, and half the cost of that tier is returned"
 zaz_relocate_sich_title:0 "Relocate the Sich"
 zaz_relocate_sich_unique_desc:0 "Chartered winter stronghold of the Host, established where the council ordains a new Sich."
 zaz_relocate_sich_unique_title:0 "Relocate the Zaporozhian Sich"
 zaz_rivaled_rus:0 "Fostering a Rivalry with Russia for Regional Influence"
 zaz_rivaled_tur:0 "Rivaled by the Turks"
 zaz_road_of_host_and_state_desc:0 "Put the register at the centre of everything and build the country around it: regiments in the districts, starshyna in the offices, taxes for powder. Other realms keep an army. This one will be an army that keeps a realm."
 zaz_road_of_host_and_state_title:0 "Take the Road of Host and State"
 zaz_road_of_the_cantons_desc:0 "Let each palanka keep its own muster and its own court, and let the general rada be a meeting of equals rather than a command. The Host will sell its swords abroad and hold its own crossings. It will not be feared, and it will not be moved."
 zaz_road_of_the_cantons_title:0 "Take the Road of the Cantons"
 zaz_road_of_the_sacred_horde_desc:0 "Stop pretending the Host is a settled country. Move the camp with the grass, keep the herds, carry the faith at the head of the column, and take from the steppe what the steppe has always been taken for. The register will not survive it."
 zaz_road_of_the_sacred_horde_title:0 "Take the Road of the Sacred Horde"
 zaz_road_of_the_sacred_order_desc:0 "Bind Cossack piety by monastic oath and govern the Host as a vowed military order. Let the kish take vows and become a chapter, the otaman a master, and the war on the frontier a rule with brothers under it. The Orthodox lands have never had an order of their own. Rome's orders answered to Rome; whom ours answers to is the question."
 zaz_road_of_the_sacred_order_title:0 "Take the Road of the Sacred Order"
 zaz_road_taken:0 "A Road Taken"
 ZAZ_RUS_brack_lit_desc:0 "With Muscovite guns the Dnieper towns can be taken from the Commonwealth in one season. Kyiv, Chernihiv and Smolensk would return to an Orthodox crown — though which crown, and on what terms, the treaty does not say plainly."
 ZAZ_RUS_brack_lit_title:0 "Reclaim Ruthenia"
 ZAZ_RUS_brack_tur_desc:0 "With tensions rising along the lower Dnieper, we must demonstrate to the Ottoman Porte that the Host yields to no intimidation."
 ZAZ_RUS_brack_tur_title:0 "Insult [TUR.GetName]"
 ZAZ_RUS_conquer_steppe_desc:0 "Our neighbors to the east are merely additional tribes in need of organization."
 ZAZ_RUS_conquer_steppe_title:0 "Invade the Steppes"
 ZAZ_RUS_contest_crimea_desc:0 "With the Crimean Khanate on our doorstep, we shall never find peace. To resolve the situation, we must first prepare for war and contest their hold on the region."
 ZAZ_RUS_contest_crimea_title:0 "Contest Crimea"
 ZAZ_RUS_different_ally_desc:0 "Securing an alliance with the Russians is no simple feat, but we cannot rely only on them."
 ZAZ_RUS_different_ally_title:0 "Find More Allies"
 ZAZ_RUS_end_crimea_desc:0 "Now that the Crimean Khanate has been annihilated, we shall enjoy a temporary reprieve. Our military actions have secured our position in the region."
 ZAZ_RUS_end_crimea_title:0 "Remove Crimea"
 ZAZ_RUS_europe_trade_desc:0 "Kyiv's markets connect Dnieper trade to the Baltic and the Black Sea. Strengthen these routes and give our merchants a foothold in European commerce."
 ZAZ_RUS_europe_trade_title:0 "Encourage Inland Trade"
 ZAZ_RUS_hetman_desc:0 "We've worked our way up from the bottom, and now it's time to reap the advantages."
 ZAZ_RUS_hetman_title:0 "Break the Union"
 ZAZ_RUS_orthodox_desc:0 "Our faith's centralization is shaky and vulnerable to outside influence. We need to get it under control."
 ZAZ_RUS_orthodox_title:0 "The Patriarch"
 ZAZ_RUS_settle_north_desc:0 "The open Ukrainian steppe offers room for new Cossack settlements. Secure the land and strengthen the Host along the Dnieper."
 ZAZ_RUS_settle_north_title:0 "Settle North Ukraine"
 ZAZ_RUS_settle_south_desc:0 "The land between the Dnieper and the Don carries neither plough nor garrison. Cossack stanitsas and slobodas would hold it, and the Tsar's surveyors would follow to write it into a province with a Russian name."
 ZAZ_RUS_settle_south_title:0 "Colonize New Russia"
 ZAZ_RUS_sieze_ports_desc:0 "Foreign Genoese merchants have governed the principal Black Sea trading hubs for far too long. The money and riches they provide are just too important to ignore. We must seize control of these ports to advance our trade ambitions."
 ZAZ_RUS_sieze_ports_title:0 "Seize Ports"
 ZAZ_RUS_threaten_tur_dec:0 "The Porte has pressed upon our southern rivers for far too long."
 ZAZ_RUS_threaten_tur_desc:0 "With our regiments now matching the armies of the Porte along the southern marches, the Sultan can no longer dictate terms on the Black Sea frontier."
 ZAZ_RUS_threaten_tur_title:0 "Rival [TUR.GetName]"
 ZAZ_rus_war_6_desc:0 "Having followed Russia into war, the Host must prove its worth as an ally. Service at the frontier may win the tsar's favour; failure would leave us exposed."
 ZAZ_rus_war_6_title:0 "Settle South Ukraine"
 ZAZ_RUS_war_crimea_desc:0 "Idleness invites Tatar raids along our northern fords. We must strike Crimea swiftly to secure the steppe and the Black Sea shore."
 ZAZ_RUS_war_crimea_title:0 "Attack Crimea"
 ZAZ_RUS_war_rus_desc:0 "Despite our partnership with the Russians, we must still demonstrate our allegiance and usefulness to them or risk being viewed as a liability and finally abandoned."
 ZAZ_RUS_war_rus_title:0 "Warband"
 ZAZ_RUS_west_desc:0 "Red Rus' has animals and grain, which will be a valuable complement to our resources. It is time to expand our influence and bring this region under our control."
 ZAZ_RUS_west_title:0 "Settle Red Rus'"
 ZAZ_RUS_wester_desc:0 "Our commercial aspirations are obvious... Lublin is an important regional trade hub, therefore it is only natural that it would be the next target of our expansionist ambitions."
 ZAZ_RUS_wester_title:0 "Make Claim to Lublin"
 ZAZ_RUS_westest_desc:0 "Our financial progress will be enhanced by the affluent region of Malopolska. We must extend our control over this land and its resources."
 ZAZ_RUS_westest_title:0 "Settle Malopolska"
 zaz_russia_buff:0 "Cossack-Streltsy Exchanges"
 zaz_russian_help:0 "Russian Frontier Advisers"
 zaz_ruthenia:0 "Ruthenian Razing Spearheads"
 zaz_sacred_horde_reform:0 "Sacred Horde"
 zaz_sacred_horde_reform_desc:0 "The Host stays in the saddle and takes the steppe on the steppe's terms: a camp that moves, a herd that follows, and a faith carried at the head of the column. Towns are for wintering in and for burning. The register is a memory."
 zaz_sacred_host_order_reform:0 "Sacred Host of the Order"
 zaz_sacred_host_order_reform_desc:0 "The Host takes solemn vows. The kish becomes a chapter, the otaman a master, and the frontier a walled rule of knightly devotion. Brothers hold land in the name of the faith and answer to the chapter for it. An order that stops fighting has to explain itself."
 ZAZ_saratov_desc:0 "While the Horde's riders are drawn westward, swift sotnias can strike deep across the steppe toward Saratov."
 ZAZ_saratov_title:0 "Saratov raid"
 zaz_seeking_patron:0 "Seeking a Patron Power"
 zaz_seeks_protection:0 "Sich Petitions for Protection"
 zaz_settle_wild_fields_desc:0 "Encourage settlers to tame the Wild Fields, expanding our agricultural base and manpower."
 zaz_settle_wild_fields_title:0 "Settle the Wild Fields"
 ZAZ_settlements_desc:0 "Between the fortress line and the open steppe there is room for slobodas — settlements exempt from labour dues, ploughed by men who left a lord behind. Cossack posts would cover them; the lords will write to the Sejm about it."
 ZAZ_settlements_title:0 "The Sloboda System"
 zaz_sich_brotherhood:0 "Sich Brotherhood"
 zaz_sich_brotherhood_reform:0 "Sich Brotherhood"
 zaz_sich_brotherhood_reform_desc:0 "The Zaporozhian Sich is governed by a brotherhood of Cossacks, emphasizing collective decision-making and autonomy."
 ZAZ_SICH_CHORTOMLYK:0 "Chortomlyk Sich"
 zaz_sich_democracy:0 "Sich Liberty"
 zaz_sich_democracy_desc:0 "The Sich Rada (council) elects the Kosh Otaman and all officers, creating one of Europe's most elective military societies."
 zaz_sich_democracy_enhanced:0 "Enhanced Sich Liberty"
 zaz_sich_founded:0 "Sich Founded"
 ZAZ_SICH_GENERIC:0 "Zaporozhian Sich"
 ZAZ_SICH_KHORTYTSIA:0 "Khortytsia Sich"
 zaz_sich_rada_justice:0 "Sich Rada Justice"
 zaz_sich_rada_justice_desc:0 "The Rada administers swift military justice and settles disputes among Cossacks, maintaining order despite elective freedoms."
 ZAZ_SICH_TOMAKIVKA:0 "Tomakivka Sich"
 zaz_slave_raid_target:0 "Slave Raid Target"
 zaz_slave_raiders:0 "Slave-Raiders"
 ZAZ_SLAVE_TRADE:0 "Black Sea Ransom Network"
 zaz_sloboda_established_tt:0 "A new sloboda settlement is established on the frontier."
 zaz_steppe_alliance:0 "Steppe Alliance"
 zaz_steppe_alliance_desc:0 "Ally with the nomads of the steppe to share tactics and secure cavalry support."
 zaz_steppe_alliance_title:0 "Forge the Steppe Alliance"
 zaz_steppe_allies:0 "Steppe Allies"
 zaz_steppe_brotherhood:0 "Steppe Brotherhood"
 zaz_steppe_raiders:0 "Steppe Raiders"
 zaz_steppe_raiders_desc:0 "Zaporozhian Cossacks are renowned for their devastating raids on Crimean, Ottoman, and even Polish territories."
 zaz_strong_otaman:0 "Strong Otaman Leadership"
 zaz_successful_raid:0 "Successful Chaiky Raid"
 zaz_successful_raid_desc:0 "Our raiders have returned with great wealth and glory."
 zaz_successful_raid_effect:0 "Successful Cossack Raid"
 zaz_taxes:0 "Regime of Nomads"
 zaz_threaten_tur:0 "Challenging [TUR.GetName] on the Southern Frontier"
 zaz_threatened_turks:0 "Threatened Turkish Coasts"
 zaz_trade_eff:0 "Maximizing Trade Efficiency between Lublin and Kraków for Economic Growth"
 ZAZ_treb_desc:0 "Within Anatolia's mountains, [TRE.GetName] is a veritable stronghold. The land will be tough to retain, so perhaps we might make them Tributes."
 ZAZ_treb_title:0 "Subjugate [TRE.GetName]"
 ZAZ_TUR_brake_rus_desc:0 "Our perilous alliance with the Turks pits us against the Russians, whose territorial aspirations are aligned with ours. We must be watchful of their advances and respond in kind."
 ZAZ_TUR_brake_rus_title:0 "Rival of Russia"
 zaz_tur_buff:0 "Controlling the Bosphorus Strait for Trade Dominance and Strategic Positioning"
 ZAZ_TUR_conquer_steppe_desc:0 "The countries to the east are just a stumbling block to our future growth. Let us show them who the superior khan is."
 ZAZ_TUR_conquer_steppe_title:0 "Conquer [GOL.GetName]"
 ZAZ_TUR_contest_crimea_desc:0 "The Khan holds his throne by Ottoman warrant and takes our people north of Perekop every season. With the Porte's favour we can press the Girays for the coastal fortresses, and for the tribute they collect in our name."
 ZAZ_TUR_contest_crimea_title:0 "Contest Crimea"
 ZAZ_TUR_convert_islam_desc:0 "Our close ties with the Porte have brought Ottoman scholars, commanders, and merchants to the Sich. Some among the council ask whether closer spiritual bonds with the Sultan's court might cement our alliance."
 ZAZ_TUR_convert_islam_title:0 "Question of Faith"
 ZAZ_TUR_different_ally_desc:0 "Securing an alliance with the Turks is no easy task, but we cannot rely on them alone."
 ZAZ_TUR_different_ally_title:0 "Seek Other Allies"
 ZAZ_tur_dip_2_desc:0 "Let us closely monitor their embargo policies to demonstrate our unwavering commitment to the relationships we have forged. Even if it does not bring any tangible benefits, it is a noble gesture of our loyalty."
 ZAZ_tur_dip_2_title:0 "Provide Trade Assistance to Allies"
 ZAZ_tur_dip_4_desc:0 "For ages, Azov has been a prime European commercial port, shipping Crimean slaves. By pushing the same commerce that the Crimean excelled at, we can bring considerable wealth to our realm now that it is in our control."
 ZAZ_tur_dip_4_title:0 "Promote Slavery"
 ZAZ_TUR_embargo_all_desc:0 "Closing our river tolls and markets to rival merchants strikes directly at their silver and supplies."
 ZAZ_TUR_embargo_all_title:0 "Embargo Confrontation"
 ZAZ_TUR_end_crimea_desc:0 "We have finally gained control over Crimea, and can now enjoy a little reprieve from our troubles."
 ZAZ_TUR_end_crimea_title:0 "Victory in Crimea"
 ZAZ_TUR_expand_border_desc:0 "With the Porte at our back, let our envoys hurl open defiance at Vilnius and lay claim to the Dnieper borderlands."
 ZAZ_TUR_expand_border_title:0 "Defy [LIT.GetName]"
 zaz_tur_friend:0 "Aligned with [TUR.GetName] for Mutual Benefits"
 ZAZ_TUR_otoman_desc:0 "Our once lowly state has risen to become a mighty khanate that rivals even the Mongols."
 ZAZ_TUR_otoman_title:0 "Zaporozhian Hegemony"
 ZAZ_TUR_settle_north_desc:0 "With Lithuanian power checked, secure the Ukrainian plains and anchor the Host along the Dnieper."
 ZAZ_TUR_settle_north_title:0 "Settle Ukraine"
 ZAZ_TUR_settle_south_desc:0 "With Lithuania towering over us, it is critical that we seek to reduce their power."
 ZAZ_TUR_settle_south_title:0 "Defeat Lithuania"
 ZAZ_TUR_side_tur_desc:0 "We must continue to prove our allegiance and usefulness to the Turks, irrespective of our ties with them. Failure to do so may lead to us being deemed a liability and ultimately abandoned."
 ZAZ_TUR_side_tur_title:0 "Warrior Clan"
 ZAZ_TUR_sieze_ports_desc:0 "The ports of Caffa and Azov command the northern Black Sea trade, offering rich customs revenue to the Host."
 ZAZ_TUR_sieze_ports_title:0 "Seize Black Sea Ports"
 ZAZ_TUR_slave_trade_desc:0 "Kaffa's market moves thousands of Ruthenian and Polish captives a year, and the Khan's revenue rests on it. As the Sultan's men we may enter the port lawfully; what happens to the pens once we are inside is another matter."
 ZAZ_TUR_slave_trade_title:0 "Disrupt the Slave Trade"
 zaz_tur_trade:0 "Implementing Policies of Embargo for Economic Gain"
 ZAZ_TUR_war_crimea_desc:0 "Watching the Crimean border in idleness invites fresh raids upon our settlements. To saddle—we strike the Khanate first."
 ZAZ_TUR_war_crimea_title:0 "Invasion of Crimea"
 zaz_turkish_help:0 "Officers in Ottoman Service for Improved Military Tactics"
 ZAZ_UKR_2_desc:0 "The fertile Danubian plains of Wallachia will supply our people with abundant grain and resources."
 ZAZ_UKR_2_title:0 "Conquer Wallachia"
 ZAZ_UKR_3_desc:0 "Seizing the Balkan districts of Bulgaria from [TUR.GetName] will carry Cossack protection across the Danube."
 ZAZ_UKR_3_title:0 "Invade Bulgaria"
 ZAZ_UKR_4_desc:0 "Controlling Thrace, a strategic peninsula that controls the Bosporus Strait, would bring immense riches to our growing empire, and we must seize this opportunity."
 ZAZ_UKR_4_title:0 "Invade Thrace"
 ZAZ_UKR_5_desc:0 "Behold the magnificent city of Constantinople, coveted by many across Europe throughout the ages. From the Romans to the Turks, now it is ours to possess."
 ZAZ_UKR_5_title:0 "Take Tsargrad"
 ZAZ_UKR_attack_genoa_2_desc:0 "Foreign Genoese merchants have held control over important Black Sea commercial hubs for far too long. We must seize their ports and claim the riches they provide as our own."
 ZAZ_UKR_attack_genoa_2_title:0 "Seize Port"
 ZAZ_UKR_attack_genoa_desc:0 "The mountain strongholds and harbors of Theodoro guard the Crimean shore and must pass under the Host's banner."
 ZAZ_UKR_attack_genoa_title:0 "Conquer Theodoro"
 ZAZ_UKR_contest_crimea_desc:0 "With the Crimean Khanate on our doorstep, we shall never find peace. To resolve the situation, we must first prepare for war."
 ZAZ_UKR_contest_crimea_title:0 "Crimea Dispute"
 ZAZ_UKR_cordon_desc:0 "No foreign patron will secure the upper Dnieper marches for us. We must seize the frontier forts ourselves and turn the border into our own shield."
 ZAZ_UKR_cordon_title:0 "Northern Cordon"
 ZAZ_UKR_desc:0 "Situated between the Carpathians and the Dniester, Moldavia guards our southern flank and opens the road into the Balkans."
 ZAZ_UKR_dip_4_desc:0 "With the Sandomierz marches within our reach, our sotnias can press westward toward Podlasie and the royal heartland of Lesser Poland."
 ZAZ_UKR_dip_4_title:0 "Advance into Lesser Poland"
 ZAZ_UKR_dip_7_desc:0 "Red Rus’ can supply the Host with grain and livestock. Secure its fields and towns, and settle the frontier under Cossack protection."
 ZAZ_UKR_dip_7_title:0 "Settle Red Rus'"
 ZAZ_UKR_east_dniepr_desc:0 "The grassy Left-Bank pastures along the Eastern Dnieper provide ideal forage for our cavalry regiments."
 ZAZ_UKR_east_dniepr_title:0 "East Dnieper"
 ZAZ_UKR_end_crimea_desc:0 "With the Crimean Khanate broken, our southern settlements enjoy hard-won peace along the steppe roads."
 ZAZ_UKR_end_crimea_title:0 "Taking Hold of Crimea"
 ZAZ_UKR_hatman_desc:0 "With Crimea and Ruthenia under our hand, the Host can present itself as the equal of every power around the steppe and the northern forests."
 ZAZ_UKR_hatman_title:0 "The Hetman's Supremacy"
 ZAZ_UKR_insult_feo_desc:0 "The Goths are a little, useless enclave from another era. Let us make it clear to them that they are insignificant and irrelevant."
 ZAZ_UKR_insult_feo_title:0 "Insult [FEO.GetName]"
 ZAZ_UKR_insult_tur_desc:0 "Across the Black Sea looms the power of the Porte; let our envoys make plain that the free Host will never bow to Ottoman threats."
 ZAZ_UKR_insult_tur_title:0 "Defiance"
 ZAZ_UKR_malopolska_desc:0 "Poland's prosperous cities lie just a short march from our own borders. Seizing control of these crucial sites will give us renewed access to markets throughout Europe, furthering our economic power."
 ZAZ_UKR_malopolska_title:0 "Capture Kraków"
 ZAZ_UKR_podolia_volhynia_desc:0 "The fertile meadows of Podillia and Volhynia offer rich grazing grounds for our horses, strengthening our western marches."
 ZAZ_UKR_podolia_volhynia_title:0 "Podillia and Volhynia"
 ZAZ_UKR_poland_desc:0 "The annexation of Poland will contribute significantly to our ever-increasing wealth and power, cementing our position as a dominant force in the region."
 ZAZ_UKR_poland_title:0 "Eliminate Poland"
 ZAZ_UKR_politics_2_desc:0 "Our own institutions are finally strong enough to carry the state without leaning on Polish, Muscovite, or Tatar courts."
 ZAZ_UKR_politics_2_title:0 "Succession of [Root.GetName]"
 ZAZ_UKR_politics_desc:0 "Every Cossack votes at the Rada, officers are chosen by acclamation, and a Kosh Otaman who loses the Host's confidence lays down the bulava the same day. Extending that custom to towns and regiments is another matter."
 ZAZ_UKR_politics_title:0 "Cossack Liberties"
 ZAZ_UKR_russia_2_desc:0 "Muscovy's northern grip is faltering, opening the way for the Host to intervene in northern affairs and assert our ascendancy."
 ZAZ_UKR_russia_2_title:0 "Interference in Russia"
 ZAZ_UKR_russia_3_desc:0 "With no serious opposition to our claim to the Russian region, we must establish unequivocally that these territories belong to us and us alone."
 ZAZ_UKR_russia_3_title:0 "Take Control of Russia"
 ZAZ_UKR_russia_desc:0 "Moscow has long claimed the lands of Rus’ as its own. Break its hold and bring these territories beneath the Host’s protection."
 ZAZ_UKR_russia_title:0 "Invasion of Russia"
 ZAZ_UKR_ruthenia_desc:0 "The ancient heartland of Rus' across the Dnieper lowlands is our rightful inheritance and the home of our kindred peoples."
 ZAZ_UKR_ruthenia_title:0 "Zaporozhia Reclaims Rus'"
 ZAZ_UKR_seize_ports_1_desc:0 "As our chroniclers trace the valorous Cossack Host back to the ancient warriors of Khazaria, neighborhood and common frontier perils have often bound the Sich and the Crimean Khanate in mutual pacts. A far-sighted hetman may renew eternal friendship with Bakhchysarai so that neither neighbor encroaches upon Ukraine's liberties."
 ZAZ_UKR_seize_ports_1_title:0 "The Khazar Chronicle"
 ZAZ_UKR_seize_ports_desc:0 "The ports of Caffa and Azov command the northern Black Sea trade, offering rich customs revenue to the Host."
 ZAZ_UKR_seize_ports_title:0 "Investigate the Black Sea Ports"
 ZAZ_UKR_settle_north_1_desc:0 "With the old lands of Rus' restored, rebuild their towns and fields, and let the people return under a realm that guards their customs."
 ZAZ_UKR_settle_north_1_title:0 "Resettle Rus-Ukraine"
 ZAZ_UKR_settle_north_desc:0 "With the frontier secured, it is time to gather the Ukrainian lands into a single settled steppe realm."
 ZAZ_UKR_settle_north_title:0 "Settle Ukraine"
 ZAZ_UKR_settle_south_desc:0 "With the first cordon breached, we can consolidate the crossings of the northern marches and bind them to the Host."
 ZAZ_UKR_settle_south_title:0 "Frontier Marches"
 ZAZ_UKR_sieze_ports_1_desc:0 "As our chroniclers trace the valorous Cossack Host back to the ancient warriors of Khazaria, neighborhood and common frontier perils have often bound the Sich and the Crimean Khanate in mutual pacts. A far-sighted hetman may renew eternal friendship with Bakhchysarai so that neither neighbor encroaches upon Ukraine's liberties."
 ZAZ_UKR_sieze_ports_1_title:0 "The Khazar Chronicle"
 ZAZ_UKR_sieze_ports_desc:0 "Seizing the ports of Caffa and Azov secures the Host's hold over Black Sea commerce and coastal navigation."
 ZAZ_UKR_sieze_ports_title:0 "Black Sea Ports"
 ZAZ_UKR_title:0 "Balkan Gateway"
 ZAZ_UKR_war_crimea_desc:0 "Idleness along the rapids only invites the next Tatar raid; we must ride south into Crimea."
 ZAZ_UKR_war_crimea_title:0 "Invasion of Crimea"
 ZAZ_UKR_weste_desc:0 "Taking the coastal stronghold of Budjak secures the Dniester mouth and opens the way into Podillia."
 ZAZ_UKR_weste_title:0 "Secure Budjak"
 zaz_unchecked_horde:0 "A Powerful Grand Khanate Next Door"
 zaz_united_host:0 "United Host"
 zaz_warrior_brotherhood:0 "Warrior Brotherhood"
 zaz_warrior_brotherhood_desc:0 "All Cossacks are brothers in arms, sharing both dangers and spoils equally according to ancient custom."
 zich_relocated:0 "Sich Relocated"
 zich_relocated_desc:0 "We have successfully moved our capital to a new, more secure location."
 ZAZ_sahaidachnyi_reforms_title:0 "Sahaidachnyi Reforms"
 ZAZ_sahaidachnyi_reforms_desc:0 "Under Hetman Petro Konashevych-Sahaidachnyi, Zaporozhian Cossack bands evolved into a disciplined registered host capable of open-field musket volleys, siege warfare, and campaigns stretching from Caffa and Khotyn to the walls of Moscow. Reforming our host's drill and command turns irregular frontier riders into an unmatched field army."
 ZAZ_heroic_campaigns_title:0 "Heroic Sea Campaigns"
 ZAZ_heroic_campaigns_desc:0 "Flat-bottomed oak chaiky glided down the Dnieper rapids into the Black Sea, outmaneuvering Ottoman galleys to raid Sinope, Trebizond, Caffa, and the suburbs of Constantinople while freeing captives. Sustaining heroic maritime expeditions across Pontic waters establishes Cossack sea mastery."
 zaz_sahaidachnyi_reforms_modifier:0 "Sahaidachnyi's Host Reforms"
 desc_zaz_sahaidachnyi_reforms_modifier:0 "Disciplined regimental musketry and seasoned Cossack officers elevate the Zaporozhian infantry."
 zaz_heroic_campaigns_modifier:0 "Heroic Chaiky Campaigns"
 desc_zaz_heroic_campaigns_modifier:0 "Daring Pontic naval raids and seasoned chaiky crews trouble rival fleets across the Black Sea."
 zaz_black_sea_campaigns_tt:0 "Own, occupy, or have recently slave-raided at least §Y8§! coastal provinces in the §YCrimea§! or §YAnatolia§! regions."
