l_german:
 convert_to_greek_catholic_decision_desc:0 "Alternative history when the state has no Catholic overlord: the historical unions were concluded by bishops living under Catholic crowns, and none of those crowns changed its own faith. Here the whole state takes the union. Bring our local hierarchy into communion with Rome while retaining its Byzantine rite. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 convert_to_greek_catholic_decision_title:0 "Accept a local church union"
