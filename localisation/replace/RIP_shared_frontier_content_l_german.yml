l_german:
 # Tag-scoped replacement fallback (german): owner=shared_frontier, entity=content.
 border_fortification_investment:0 "Border Fortifications"
 BORDER_PRINCE:0 "Border Prince"
 BORDER_PRINCESS:0 "Border Princess"
 border_principalities.1.a:0 "Grant them autonomous rule as our vassals"
 border_principalities.1.b:0 "We shall rule Rylsk directly"
 border_principalities.1.d:0 "After the failure of Dmitri Shemyaka to secure the throne of Muscovy, his descendants were granted the principality of Rylsk by the Grand Duchy of Lithuania. As Rurikid princes with legitimate claims to Russian lands, they represent both a valuable asset and a potential liability. Their presence on the border could serve as a buffer against Muscovite expansion, but it also attracts the attention of Moscow's ambitious rulers who may see them as pretenders to be liberated."
 border_principalities.1.t:0 "The Shemyaka Heirs in Rylsk"
 border_principalities.10.a:0 "Welcome them as faithful servants of the Tsar"
 border_principalities.10.d:0 "The Jagoldai Tatars, who keep the style of Golden Horde nobility, have broken with [From.GetName] and pledged themselves to our service. Their horsemen will screen the southern approaches, and their settlement gives us a watch post out on the steppe. A horde that has changed masters once keeps the habit."
 border_principalities.10.t:0 "Jagoldai's Tatars Seek Our Protection"
 border_principalities.11.a:0 "We will not surrender Severia without a fight"
 border_principalities.11.b:0 "Let the Severian princes go to Moscow"
 border_principalities.11.d:0 "The princes of Starodub and the Severian lands have chafed under our overlordship for a generation, and Moscow is courting them. They are Orthodox, and they reckon the Grand Prince a nearer neighbour than our own court. Muscovite officials have already been approached: the princes offer their lands, and ask for estates and recognition in return. This is the quarrel that has been waiting for a reason."
 border_principalities.11.t:0 "The Severian Princes Consider Moscow"
 border_principalities.12.a:0 "Accept them as brothers in the great gathering of Russian lands"
 border_principalities.12.d:0 "The Orthodox princes of the Severian lands have renounced [From.GetAdjective] overlordship and pledged themselves to us as rightful rulers of all Rus'. They bring the ground that commands that border, and a reason to press west that our chancery can put in writing. Princes who arrive by their own choice may leave by it as well."
 border_principalities.12.t:0 "The Severian Princes Offer Their Lands"
 border_principalities.2.a:0 "Grant them lands and welcome their Tatar warriors"
 border_principalities.2.b:0 "We need no Tatar cavalry in our service"
 border_principalities.2.d:0 "The Glinski family claims descent from the mighty Mamai, the Mongol general who once dominated the steppes. They have petitioned for lands in our eastern borderlands, offering to settle Tatar cavalry in exchange for defending us against raids from the wild steppes. These Tatars, though of the same stock as our enemies, have proven loyal to the Glinski princes and could provide valuable military service. However, granting such power to a family claiming descent from our former oppressors may be controversial."
 border_principalities.2.t:0 "The Glinski Princes and Their Tatars"
 border_principalities.3.a:0 "Accept Jagoldai and his warriors"
 border_principalities.3.b:0 "We need no horde vassals"
 border_principalities.3.d:0 "Jagoldai, a pretender to the throne of the Golden Horde, has offered to settle his followers in the lands south of Kursk in exchange for our protection. His Tatar cavalry would serve as a formidable buffer against raids from the steppes, and his claim to Golden Horde legitimacy could prove useful in future dealings with the successor khanates. However, allowing a horde to settle so close to our heartlands is not without risk."
 border_principalities.3.t:0 "Jagoldai's Golden Horde Remnant"
 border_principalities.4.a:0 "Grant them privileges to keep them loyal"
 border_principalities.4.b:0 "Let them go peacefully to Moscow"
 border_principalities.4.c:0 "Prepare to punish Muscovite interference"
 border_principalities.4.d:0 "The princes of Rylsk, descendants of Dmitri Shemyaka, have been approached by Muscovite agents who remind them of their Rurikid heritage and claim to the Russian lands. Moscow offers them estates deep in Muscovite territory and recognition of their noble status if they acknowledge the Grand Prince as their rightful sovereign. We face a choice: strengthen our hold on Rylsk through concessions, allow them to depart peacefully, or risk war with Muscovy to keep them by force."
 border_principalities.4.t:0 "Rylsk Considers Muscovite Protection"
 border_principalities.5.a:0 "Welcome them as faithful subjects of the rightful Rus'"
 border_principalities.5.d:0 "The Rurikid princes of Rylsk, descendants of Dmitri Shemyaka, have renounced their allegiance to [From.GetName] and ask to enter our service. They bring Rylsk itself and a working knowledge of how the border is garrisoned. Men who have changed sovereign once are capable of doing so twice."
 border_principalities.5.t:0 "The Princes of Rylsk Seek Our Protection"
 border_principalities.6.a:0 "Negotiate and grant them concessions"
 border_principalities.6.b:0 "Mobilize forces to suppress any rebellion"
 border_principalities.6.c:0 "Exile the troublesome family"
 border_principalities.6.d:0 "Tensions between the Glinski princes and our court have reached a breaking point. The proud descendants of Mamai feel slighted by our treatment and have been approached by Muscovite agents promising greater honors and estates. Their control over substantial Tatar cavalry forces makes them dangerous enemies. We must decide whether to appease them with gold and privileges, suppress them with military force, or allow them to depart to Moscow."
 border_principalities.6.t:0 "The Glinski Rebellion Brewing"
 border_principalities.7.a:0 "So be it, we shall face them in battle"
 border_principalities.7.d:0 "Our attempts to placate the Glinski princes have failed. They have raised their Tatar cavalry in open rebellion and declared their allegiance to Muscovy. Their intimate knowledge of our border defenses makes them particularly dangerous, and Moscow will surely use this opportunity to press claims against our eastern provinces."
 border_principalities.7.t:0 "The Glinski Rebellion Erupts"
 border_principalities.8.a:0 "Welcome them with all honors due to their station"
 border_principalities.8.d:0 "The Glinski, who trace themselves to Mamai and command Tatar horse of their own, have abandoned [From.GetName] and entered our service. They bring commanders, a map of the border garrisons, and retainers who answer to the family rather than to us. The Glinski have married into half the courts of Rus' and expect to be seated accordingly."
 border_principalities.8.t:0 "The Glinski Princes Enter Our Service"
 border_principalities.9.a:0 "Increase their tribute to keep them loyal"
 border_principalities.9.b:0 "Let them seek their fortune with Moscow"
 border_principalities.9.c:0 "Mobilize to enforce their oath"
 border_principalities.9.d:0 "The Jagoldai Tatars, who have served as our border buffer for years, are being courted by Muscovite diplomats. Moscow offers them better lands and greater autonomy under Muscovite protection. As steppe nomads, they have little attachment to any overlord beyond practical considerations of safety and prosperity. We must decide whether to increase payments to retain their loyalty, allow them to depart peacefully, or risk war to keep them under our authority."
 border_principalities.9.t:0 "Jagoldai's Horde Wavers in Loyalty"
 border_raiders:0 "Border Raiders"
 border_raiders_desc:0 "Light cavalry raiding supplements our limited agricultural economy. Steppe warfare tactics blend with Rus' military traditions."
 border_vassal_buffer:0 "Border Vassal Buffer"
 border_vassal_buffer_desc:0 "Our border principalities provide a defensive buffer against enemy incursions while strengthening our diplomatic position."
 border_war_preparation:0 "Border War Preparation"
 border_war_preparation_desc:0 "Tensions on our borders have prompted military preparations and improved defensive readiness."
 desc_border_fortification_investment:0 "Investment in fortifications strengthens defense against raids."
 desc_border_vassal_buffer:0 "Border vassals serve as a buffer against invasion."
 desc_dnestr_estuary_modifier:0 "A fortified estuary funnels grain and salt downriver, enriching the port and repairing ships that shelter there."
 desc_dniester_anti_raid_fortifications:0 "Local ramparts and fortified watch posts protect the Dniester estuary from raiders."
 desc_fortified_against_crusade:0 "Fortifications strengthened against a crusade."
 desc_fortified_border:0 "Fortifications reinforce the eastern border."
 desc_fortified_dnieper_city:0 "Defensive works fortify the city."
 desc_frontier_centralization:0 "Imperial directives enforce standardized taxes and garrisons along the marches, tightening control at social cost."
 desc_frontier_fortress:0 "A mighty fortress guards the marches against raids."
 desc_frontier_liberties:0 "Local charters preserve Cossack and settler privileges, trading strict control for frontier loyalty."
 desc_glinski_advisors_muscovy:0 "Glinski advisors aid Muscovy, harming our position."
 desc_glinski_appeasement:0 "Concessions keep the Glinski loyal at cost."
 desc_glinski_loyalty:0 "The Glinski remain loyal to the crown."
 desc_glinski_tatar_settlement:0 "Glinski-led Tatar cavalry settle the frontier, providing defense."
 desc_horde_vassal_buffer:0 "A vassal horde shields our borders."
 desc_jagoldai_horde_settlement:0 "Jagoldai's followers settle as a frontier horde."
 desc_jagoldai_host_settlement:0 "The warriors of Jagoldai's Darkness provide a permanent mounted vanguard and defensive depth on the upper Donets and Seym."
 desc_jagoldai_loyalty:0 "Payments and privileges secure Jagoldai loyalty."
 desc_jagoldai_muscovite_service:0 "Jagoldai's Tatars now serve Muscovy."
 desc_jagoldai_tatar_cavalry:0 "Veteran horse archers from the border principalities bolster our armies with fierce steppe cavalry tactics."
 desc_mansur_cossack_outpost:0 "Formed by descendants of Mamai and local frontiersmen, this settlement provides tough cavalry and resilient border fortifications."
 desc_moldavian_corridor_network:0 "Relay routes and supply tracks sustain movement between inland districts and frontier lines."
 desc_moldavian_customs_office:0 "A formal customs office regulates frontier exchange and channels trade into state revenue."
 desc_moldavian_fort_node:0 "A fortified node anchors district defense and deepens local frontier resilience."
 desc_moldavian_fortress_belt:0 "A connected belt of forts and supporting posts hardens the frontier against incursions."
 desc_moldavian_frontier_mandate:0 "The state coordinates manpower, patrols, and district obligations across the Moldavian frontier zone."
 desc_moldavian_host_settlements:0 "Service settlements reinforce manpower reserves and administrative reach in exposed districts."
 desc_moldavian_legacy_balanced:0 "The wardens keep the forts manned and the road to the customs houses open."
 desc_moldavian_legacy_military:0 "Frontier institutions prioritize military discipline, cohesion, and service obligations."
 desc_moldavian_legacy_trade:0 "Frontier institutions prioritize customs efficiency, market integration, and export capacity."
 desc_moldavian_patrol_contracts:0 "Licensed patrol hosts blend local knowledge with regular service obligations."
 desc_moldavian_raid_columns:0 "Small bands of horsemen range ahead of the main force and fall on enemy detachments along the open frontier."
 desc_moldavian_trade_customs:0 "Customs offices and controlled crossings convert frontier traffic into stable state revenue."
 desc_moldavian_waystation_node:0 "Waystations support local garrisons, rotation schedules, and logistical continuity."
 desc_refused_powerful_family:0 "We refused a powerful family's demands, risking unrest."
 desc_shemyaka_rurikid_rule:0 "The Shemyaka princes rule with autonomy and Rurikid legitimacy."
 desc_strengthened_border_vassals:0 "Our border vassals are strengthened and loyal."
 desc_tatar_border_defense:0 "Tatar cavalry guard our borders against steppe raids."
 dnestr_estuary_modifier:0 "Dniester Estuary"
 dniester_anti_raid_fortifications:0 "Dniester Anti-Raid Fortifications"
 fortified_against_crusade:0 "Fortified Against Crusade"
 fortified_border:0 "Fortified Border"
 fortified_dnieper_city:0 "Fortified Dnieper City"
 fortified_frontier_desc:0 "Our frontier fortresses deter raids and protect our people."
 fortify_eastern_borders_desc:0 "We must secure our eastern frontiers with proper fortifications to defend against any threats."
 fortify_eastern_borders_title:0 "Fortify Eastern Borders"
 frontier_centralization:0 "Frontier Centralization"
 frontier_endurance:0 "Frontier Endurance"
 frontier_endurance_desc:0 "Centuries of border warfare have bred exceptional resilience. We have never been fully conquered despite facing overwhelming odds."
 frontier_fortress:0 "Frontier Fortress"
 frontier_fortress_desc:0 "A strong fortress guards this frontier province."
 frontier_liberties:0 "Frontier Liberties"
 FRONTIER_PRINCIPALITY:0 "Frontier Principality"
 glinski_advisors_muscovy:0 "Glinski Advisors"
 glinski_advisors_muscovy_desc:0 "The Glinski princes bring valuable military and diplomatic expertise to Muscovite service, strengthening our court."
 glinski_appeasement:0 "Glinski Appeasement"
 glinski_appeasement_desc:0 "Concessions granted to the powerful Glinski family to maintain their loyalty, at considerable cost to local revenue."
 glinski_loyalty:0 "Glinski Loyalty"
 glinski_loyalty_desc:0 "The powerful Glinski family remains loyal to our cause, providing military expertise and Tatar cavalry."
 glinski_tatar_settlement:0 "Glinski Tatar Settlement"
 glinski_tatar_settlement_desc:0 "Tatar cavalry loyal to the Glinski princes have settled these lands, providing both military strength and protection against steppe raids."
 horde_vassal_buffer:0 "Horde Vassal Buffer"
 horde_vassal_buffer_desc:0 "A Tatar horde serving as our vassal provides formidable cavalry strength and protection from steppe raids."
 jagoldai_darkness_autonomy_desc:0 "The Tatar-Severian principality of Jagoldai Sarayevich safeguards the southern approaches of Kursk and Rylsk against steppe raiders."
 jagoldai_darkness_autonomy_title:0 "Affirm the Autonomy of Jagoldai's Host"
 jagoldai_flavor.1.a:0 "The southern marches are secure"
 jagoldai_flavor.1.d:0 "Jagoldai Sarayevich established his autonomous host along the Seym and Psel rivers to defend our borderlands from Crimean and Golden Horde incursions. With our confirmation of their liberties, their riders pledge eternal vigilance on our southern frontier."
 jagoldai_flavor.1.t:0 "The Fortress of Jagoldai's Host"
 jagoldai_horde_settlement:0 "Jagoldai Horde Settlement"
 jagoldai_horde_settlement_desc:0 "Followers of Jagoldai, a Golden Horde pretender, have established themselves here as a military buffer against raids from the wild steppes."
 jagoldai_host_settlement:0 "Jagoldai Host Settlement"
 jagoldai_loyalty:0 "Jagoldai Loyalty"
 jagoldai_loyalty_desc:0 "The Jagoldai Tatars continue their faithful service on our steppe frontier."
 jagoldai_muscovite_service:0 "Jagoldai in Muscovite Service"
 jagoldai_muscovite_service_desc:0 "The Jagoldai Tatars now serve the Grand Prince of Moscow, providing cavalry strength and border defense."
 jagoldai_tatar_cavalry:0 "Jagoldai Cavalry Vanguard"
 kazan_pretender_claims:0 "Kazan Pretender Claims"
 kazan_pretender_claims_desc:0 "Our Qasim vassal's claims to Kazan provide justification for intervention in the affairs of the Kazan Khanate."
 lipka_tatar_cavalry_tradition:0 "Lipka Tatar Cavalry Tradition"
 lipka_tatar_cavalry_tradition_desc:0 "Our Lipka Tatar cavalry maintain their steppe warrior traditions, providing formidable mounted forces."
 lipka_tatar_garrison:0 "Lipka Tatar Garrison"
 lipka_tatar_garrison_desc:0 "Lipka Tatars loyal to the Commonwealth provide garrison duties and local defense."
 mansur_cossack_outpost:0 "Mansur's Cossack Outpost"
 mansur_flavor.1.a:0 "Honor the steppe vanguard"
 mansur_flavor.1.d:0 "Mansur Mamayevich, prince of the Glinski lineage, established towns and fortified outposts at Poltava and Lubny, welcoming both Tatars and Ruthenian frontiersmen into a shared martial brotherhood. Their descendants remain among the finest horsemen of the frontier."
 mansur_flavor.1.t:0 "The Legacy of Mansur and the Glinski Princes"
 mansur_principality_legacy_desc:0 "The Cossack settlements and strongholds founded by Mansur Mamayevich and his Glinski descendants on the Vorskla and Sula rivers form a vital bulwark against steppe incursions."
 mansur_principality_legacy_title:0 "Acknowledge the Legacy of Mansur's Principality"
 moldavian_corridor_and_customs_desc:0 "Post wardens on the roads from inland Moldavia to the estuary. At the crossings, customs officers can collect dues from river merchants and caravans coming off the steppe."
 moldavian_corridor_and_customs_title:0 "Corridors and Customs"
 moldavian_corridor_network:0 "Moldavian Corridor Network"
 moldavian_customs_office:0 "Moldavian Customs Office"
 moldavian_fort_node:0 "Moldavian Fort Node"
 moldavian_fortress_belt:0 "Moldavian Fortress Belt"
 moldavian_fortress_belt_statute_desc:0 "Issue a statute defining defense obligations for forts, relay posts, and district levies along the frontier."
 moldavian_fortress_belt_statute_title:0 "Statute of the Fortress Belt"
 moldavian_frontier.1.a:0 "Adopt raiding columns"
 moldavian_frontier.1.b:0 "License patrol contracts"
 moldavian_frontier.1.d:0 "Captains of the marches insist that Moldavia's border host must be formalized. One camp argues for hard-hitting strike columns; another favors licensed patrol companies that combine local knowledge with regular supervision."
 moldavian_frontier.1.t:0 "Doctrine for the Border Host"
 moldavian_frontier.2.a:0 "Open corridor routes"
 moldavian_frontier.2.b:0 "Raise a fortress belt"
 moldavian_frontier.2.d:0 "The council now debates operations in depth. We can prioritize mobility corridors and waystations, or build a denser chain of fortified nodes to absorb pressure along the steppe edge."
 moldavian_frontier.2.t:0 "The Defence of the Marches"
 moldavian_frontier.3.a:0 "Expand customs administration"
 moldavian_frontier.3.b:0 "Back host settlements"
 moldavian_frontier.3.d:0 "With doctrine and operations in place, policy turns to revenue and settlement. Customs offices can capture estuary trade, while host settlements can anchor manpower and control in the exposed districts."
 moldavian_frontier.3.t:0 "Customs, Markets, and Settlement"
 moldavian_frontier.4.a:0 "Codify the defense statute"
 moldavian_frontier.4.b:0 "Codify the trade-security statute"
 moldavian_frontier.4.d:0 "The fortress captains claim labour from the same villages that cart goods to the estuary. Our jurists propose a statute. Shall service at the forts have first claim, or shall the customs houses also have men to guard the river trade?"
 moldavian_frontier.4.t:0 "Statute of Consolidation"
 moldavian_frontier.5.a:0 "A military frontier legacy"
 moldavian_frontier.5.b:0 "A commercial frontier legacy"
 moldavian_frontier.5.c:0 "A balanced frontier legacy"
 moldavian_frontier.5.d:0 "Generations of reform have transformed our borderlands. The final settlement will shape what this frontier means for Moldavia's statecraft and custom."
 moldavian_frontier.5.t:0 "Legacy of the Moldavian Frontier"
 moldavian_frontier_legacy_desc:0 "Our frontier system is mature. We must define whether its permanent legacy is military, commercial, or balanced."
 moldavian_frontier_legacy_title:0 "Set the Frontier Legacy"
 moldavian_frontier_mandate:0 "Moldavian Frontier Mandate"
 moldavian_frontier_mandate_desc:0 "Codify a frontier mandate for Moldavia, linking the Carpathian marches to the Dniester estuary and the Pontic borderlands."
 moldavian_frontier_mandate_title:0 "Moldavian Frontier Mandate"
 moldavian_host_settlements:0 "Moldavian Host Settlements"
 moldavian_legacy_balanced:0 "Moldavian Balanced Frontier Legacy"
 moldavian_legacy_military:0 "Moldavian Military Frontier Legacy"
 moldavian_legacy_trade:0 "Moldavian Trade Frontier Legacy"
 moldavian_patrol_contracts:0 "Moldavian Patrol Contracts"
 moldavian_raid_columns:0 "Moldavian Raiding Columns"
 moldavian_steppe_host_doctrine_desc:0 "Choose whether our frontier host emphasizes rapid strike columns or licensed patrol contracts in the open borderlands."
 moldavian_steppe_host_doctrine_title:0 "Form the Steppe Host Doctrine"
 moldavian_trade_customs:0 "Moldavian Trade Customs"
 moldavian_waystation_node:0 "Moldavian Waystation Node"
 qasim_khanate_vassal:0 "Qasim Khanate Vassal"
 qasim_khanate_vassal_desc:0 "The Qasim Khanate serves as our loyal Tatar vassal, providing cavalry strength and legitimacy in dealings with other Tatar states."
 refused_powerful_family:0 "Refused Powerful Family"
 refused_powerful_family_desc:0 "Our refusal to grant lands to a powerful noble family has damaged our reputation among the aristocracy."
 severian_princes_defection:0 "Severian Princes' Defection"
 severian_princes_defection_desc:0 "The defection of the Severian princes has damaged our prestige and legitimacy among the Rus' nobility."
 shemyaka_rurikid_rule:0 "Shemyaka Rurikid Rule"
 shemyaka_rurikid_rule_desc:0 "The descendants of Dmitri Shemyaka, legitimate Rurikid princes, rule this principality with considerable autonomy while providing loyal service to their overlord."
 strengthened_border_vassals:0 "Strengthened Border Vassals"
 strengthened_border_vassals_desc:0 "Our border principalities remain loyal thanks to generous concessions, providing both income and military protection."
 tatar_border_defense:0 "Tatar Border Defense"
 tatar_border_defense_desc:0 "Tatar cavalry settled in our border regions provide effective defense against steppe raids while reducing our military expenditures."
 tatar_nobility_service:0 "Tatar Nobility in Service"
 tatar_nobility_service_desc:0 "Tatar nobles serving in our military strengthen our cavalry while demonstrating our tolerance of diverse faiths."
