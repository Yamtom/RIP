 zaz_flavor_m_3.1.t:0 "The Free Zaporozhian State"
 zaz_flavor_m_3.1.d:0 "Against all odds, we have secured our independence! The Sich Rada meets in solemn assembly, the elected Kosh Otaman holds the symbolic mace, and our black and red banners fly over free soil. Foreign ambassadors arrive - some to congratulate, others to threaten, all to assess whether this Cossack republic can truly survive among the great powers of Europe. We have won our freedom; now we must keep it."
 
 zaz_flavor_m_4.1.t:0 "Choosing Protectors"
 zaz_flavor_m_4.1.d:0 "The Sich Rada debates far into the night, voices rising in passionate argument. 'Moscow offers Orthodox brotherhood!' shouts one colonel. 'The Ottomans offer trade and freedom!' counters another. 'We should bow to no one!' declares a third. The hetman must decide our nation's future - but in the Cossack way, the final choice belongs to the assembled warriors. The vote is called. The mace is raised. History holds its breath."


 zaz_great_rada_title:0 "Convene the Great Rada"
 zaz_great_rada_desc:0 "When the matter is war, peace or the bulava itself, the Kosh Otaman calls the whole Host to the square. Rank counts for nothing there, and a decision taken by shouting is difficult to appeal afterwards."

 zaz_register_reform_title:0 "Reform the Register"
 zaz_register_reform_desc:0 "The register pays and privileges the men written into it and leaves the rest liable to their lords. Every hetman must decide whether the Host is the men on the roll or the men on the island."


# Decisions
 zaz_convene_great_rada_title:0 "Convene the Great Rada"
 zaz_convene_great_rada_desc:0 "The Kish is summoned to the square and the standards set up. Whatever is decided there binds the Host, including the officers who called the assembly."
 
 zaz_launch_chaiky_raid_title:0 "Launch Chaiky Raid"
 zaz_launch_chaiky_raid_desc:0 "Reed-bundled hulls, fifty men to a boat, out through the liman before the Ottoman squadron can work upwind. The coast towns keep their plate in the churches and their captives in the pens, and both can be lifted in a night."
 
 zaz_expand_register_title:0 "Expand the Cossack Register"
 zaz_expand_register_desc:0 "Writing more men into the register secures their pay and lifts their labour dues, and gives the crown a list of every Cossack by name. A list serves whoever holds it."
 
 zaz_abolish_register_title:0 "Abolish the Cossack Register"
 zaz_abolish_register_desc:0 "Burn the roll and the difference between registered and unregistered dies with it — every man who brings a horse and a sabre is of the Host. The crown will then owe nobody, and pay nobody."
 
 zaz_recruit_steppe_cavalry_title:0 "Recruit Steppe Cavalry"
 zaz_recruit_steppe_cavalry_desc:0 "Good standing with the hordes brings us their light horse, men who scout four days ahead and vanish when pressed. The same riders were over our border last season, and their kin still are."
 
 zaz_establish_sloboda_title:0 "Establish Sloboda Settlement"
 zaz_establish_sloboda_desc:0 "The Wild Field beckons with empty lands waiting to be tamed. By establishing sloboda settlements - free military colonies where settlers receive land grants in exchange for military service - we can extend our control over the frontier while building a new generation of warrior-farmers."
 
 zaz_fortify_sloboda_title:0 "Fortify Sloboda"
 zaz_fortify_sloboda_desc:0 "Our civilian sloboda settlements provide manpower and production, but they remain vulnerable to raids. By investing in proper fortifications, we can transform these colonies into bastions capable of holding against nomadic raiders and enemy armies alike."
 
 zaz_protect_orthodox_title:0 "Protect Orthodox Monasteries"
 zaz_protect_orthodox_desc:0 "The Union takes the sees and the endowments, and Moscow's patriarch would take what is left. Between them stands the Host, which owns neither but can garrison a monastery."
 
 zaz_hold_hetman_election_title:0 "Hold Hetman Election"
 zaz_hold_hetman_election_desc:0 "The Rada gathers to choose among the colonels: a man tried in the field, tolerable to the elders, and acceptable to whichever crown currently pays us. Two of the three usually suffice."
 
 het_establish_printing_press_title:0 "Establish Printing Press"
 het_establish_printing_press_desc:0 "A press of our own would set the liturgy and the statutes in our own recension and end the buying of books from Lviv on Latin terms. The censors of three realms will take an interest."
 
 het_resist_abolition_title:0 "Resist Abolition of Autonomy"
 het_resist_abolition_desc:0 "Governors are installed, elected hetmans set aside, and our colonels addressed as provincial officials. Each privilege is removed separately, and each removal is described as a clarification."

 
 zaz_rada_cooldown:0 "Recent Rada Assembly"
 desc_zaz_rada_cooldown:0 "The Great Rada has recently convened; we must allow time for its decisions to be implemented before calling another assembly."

 
 zaz_recent_relocation:0 "Recent Sich Relocation"
 desc_zaz_recent_relocation:0 "The Host is still settling into its new location; another relocation so soon would cause too much disruption."

 
 
 zaz_chaiky_raid_cooldown:0 "Recent Chaiky Raid"
 desc_zaz_chaiky_raid_cooldown:0 "Our chaiky fleet needs time to refit and recruit new sailors before launching another raid."

 zaz_register_limited:0 "Limited Cossack Register"
 desc_zaz_register_limited:0 "Only a small number of Cossacks are officially registered and receive pay from our overlords, but this modest arrangement maintains our independence."
 
 zaz_register_expanded:0 "Expanded Cossack Register"
 desc_zaz_register_expanded:0 "More Cossacks have been added to the official register, providing steady manpower and better equipment, though at the cost of some autonomy."
 
 zaz_register_unlimited:0 "Unlimited Cossack Register"
 desc_zaz_register_unlimited:0 "The register has been expanded to include all who wish to serve, providing maximum manpower but also binding us more closely to foreign powers."
 
 zaz_no_register:0 "Register Abolished"
 desc_zaz_no_register:0 "We have cast off the chains of the register entirely! Every man who can ride and fight is a free Cossack, though this defiance may provoke our overlords' wrath."

 
 steppe_cavalry_recruited:0 "Steppe Cavalry Recruited"
 desc_steppe_cavalry_recruited:0 "Warriors from the steppe hordes have joined our ranks, bringing their superior horsemanship and lightning-fast tactics."

 
 desc_military_sloboda:0 "This fortified sloboda serves as a frontier bastion, its garrison of soldier-settlers ready to repel raiders and hold the line against invasion."
 
 sloboda_network_established:0 "Sloboda Network"
 desc_sloboda_network_established:0 "A network of sloboda settlements extends our control across the frontier, providing manpower, production, and strategic depth."

 
 
 orthodox_defender_war:0 "War for the Faith"
 desc_orthodox_defender_war:0 "Our warriors fight with holy zeal, knowing they defend not just land but the Orthodox faith itself against foreign oppressors."

 hetman_strong_mandate:0 "Strong Hetman Mandate"
 desc_hetman_strong_mandate:0 "The newly elected Hetman enjoys overwhelming support from the Rada and the Cossack starshyna, allowing him to govern effectively."
 
 hetman_weak_mandate:0 "Weak Hetman Mandate"
 desc_hetman_weak_mandate:0 "The Hetman's authority is contested - rival factions scheme against him, and even loyal officers question his decisions."
 
 hetman_military_background:0 "Military Hetman"
 desc_hetman_military_background:0 "Our Hetman rose through the ranks as a brilliant military commander, inspiring troops and leading them to victory after victory."
 
 hetman_diplomatic_background:0 "Diplomatic Hetman"
 desc_hetman_diplomatic_background:0 "Our Hetman is a master of diplomacy, skilled in navigating the treacherous waters between great powers and preserving our autonomy through negotiation."
 
 hetman_administrative_background:0 "Administrative Hetman"
 desc_hetman_administrative_background:0 "Our Hetman excels at governance and administration, ensuring that taxes are collected efficiently and the machinery of state runs smoothly."

 desc_het_cultural_golden_age:0 "Under enlightened hetman patronage, the arts and learning flourish throughout our lands - academies open their doors, printing presses spread knowledge, and Ukrainian culture reaches new heights."
 
 het_printing_press:0 "Hetmanate Printing Press"
 desc_het_printing_press:0 "Our printing presses produce books in the Ruthenian tongue, spreading literacy and preserving our cultural heritage for future generations."
 
 het_academy_network:0 "Academy Network"
 desc_het_academy_network:0 "A network of academies and schools educates the sons of Cossack officers and burghers, creating a learned class loyal to Ukrainian traditions."

 het_autonomy_guaranteed:0 "Autonomy Guaranteed"
 desc_het_autonomy_guaranteed:0 "Our overlords have formally guaranteed the Hetmanate's ancient rights and privileges, allowing us to govern ourselves according to Cossack traditions."
 
 het_autonomy_threatened:0 "Autonomy Threatened"
 desc_het_autonomy_threatened:0 "Foreign administrators encroach upon our traditional privileges, and our overlords show less and less respect for Cossack customs and elected officers."
 
 desc_het_last_struggle:0 "Knowing that defeat means the end of Cossack liberty forever, our warriors fight with desperate courage - this may be our final chance to preserve Ukrainian autonomy."

 het_swedish_gambit:0 "Swedish Alliance"
 desc_het_swedish_gambit:0 "We have thrown our lot in with Sweden against Russia, gambling everything on the chance that Charles XII's armies can break the Tsar's power and secure our independence."
 
 het_poltava_victory:0 "Triumph at Poltava"
 desc_het_poltava_victory:0 "Victory at Poltava! The Russian army is shattered, the Tsar humiliated, and Ukrainian independence secured for generations to come!"
 
 het_poltava_defeat:0 "Disaster at Poltava"
 desc_het_poltava_defeat:0 "Catastrophe at Poltava - the Swedish army destroyed, Hetman Mazepa in exile, the Sich burned, and Russian vengeance falling like a hammer upon our people."

