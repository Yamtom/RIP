 rip_church_gui_policy_help_tt:0 "Local Synod opens the institution choices.\nA limited diplomatic and local administrative settlement between Eastern and Latin communities.\nRequires twenty years of union, no forced integration in the last ten, stability +2, peace, guaranteed community rights in an Orthodox and in a Latin province, and an Orthodox ally with opinion +100. Muscovite Orthodox provinces and states do not count.\nIn every province with guaranteed rights the extra unrest reduction rises from 0.5 to 1 and the tax and levy penalties shrink by 5 points each (net unrest -3, tax -10%, levies -15%). This is a limited diplomatic and local administrative settlement between Eastern and Latin communities, not a restoration of full ecclesial communion. Its +15 is diplomatic goodwill only: Orthodox and Catholic states gain +15 mutual opinion; Russian Orthodox states are excluded. The settlement costs nothing and is not withdrawn once concluded."
