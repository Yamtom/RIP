 rip_church_request_recognition_title:0 "Seek recognition of our patriarchate"
 rip_church_restore_compact_desc:0 "After ten years, spend 100 ADM and 50 DIP to restore one randomly selected eligible charter. The map does not select the parish. Requires peace, 1 stability, an Orthodox or Greek Catholic parish under control and no missionary. Other breaches and their diplomatic consequences remain."
