 rip_church_lay_supervisor:0 "Lay Supervisor of the Synod"
 rip_church_mission_network:0 "Missionary Network"
 rip_church_mission_network_desc:0 "§YMuscovite missionary network§!\n§Y1. Fund:§! Religion -> Policies -> Choose trade node. A node costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month. Limit: §Y1 node§! (§Y2§! at 65% Patriarch Authority, regardless of communion).\n§Y2. Select:§! Choose this trade policy in the funded node. The requirements below must stay fulfilled.\n§YTargets:§! Neighbouring settled provinces along your capital-connected core parishes. Protected rites, active missionaries, religious centres, religious zeal and Rome are excluded. Independent Orthodox states are protected until you renounce communion. Conversion is gradual."
 rip_church_mobilize_confession_desc:0 "During war, spend 50 MIL to gain manpower recovery and cheaper army maintenance for up to five years, at the price of unrest and minority resistance. Requires crown appointments; ten-year cooldown."
 rip_church_mobilize_confession_title:0 "Mobilize through the State Church"
 rip_church_native_authority_heading:0 "Patriarch Authority"
 rip_church_native_authority_tooltip:0 "$PATRIARCH_DESCRIPTION$"
 rip_church_negotiate_compact_desc:0 "Negotiate with one randomly selected highlighted core parish. Agree on liturgical continuity and either free episcopal elections or a crown veto. Acceptance costs 75 ADM and 50 DIP. Talks have a two-year cooldown. No province changes religion."
 rip_church_negotiate_compact_title:0 "Negotiate an Eastern Church Charter"
 rip_church_node_courtyards:0 "Monastic trade courtyards"
 rip_church_nodes.1.d:0 "§YFervor§! [Root.GetChurchROFervor] / 100, net [Root.GetChurchRONet] a month. Funded nodes: [Root.GetChurchRONodes] / [Root.GetChurchRONodeLimit].\n\nA funded node plants monastic trade courtyards in a trade node. It costs §Y10 Fervor§! once, then pays §G+3 Fervor§! a month; every parish of yours there that has a temple or cathedral gains §G+20% trade power§! and §G+1% missionary strength§!. Afterwards choose the Missionary Network trade policy in that node, in the Trade window, to convert neighbouring provinces gradually.\n\nOnly nodes that qualify are listed: a merchant, 50% trade power, a connected parish with a temple or cathedral, and a province to convert. A funded node can be closed here; its 10 Fervor are not refunded."
 rip_church_nodes.1.t:0 "Fund mission nodes"
 rip_church_nodes_button:0 "Choose trade node"
 rip_church_nodes_button_tt:0 "[Root.GetChurchRONodeHint]\nOpens the trade nodes that qualify now and those already funded, each with its price and return. Opening the list costs nothing."
