l_english:

 # --- the free election

 free_election.1.t:0 "The Throne Falls Vacant"
 free_election.1.d:0 "The king is dead and the realm has no heir to hand it to, because it never agreed to have one. Until an election is held there is no crown, only a primate holding the seal and a diet that has to be summoned. Everyone concerned has done this before and knows exactly what it will cost."
 free_election.1.a:0 "Summon the election sejm"
 free_election.1.b:0 "Let the primate hold the seal"
 free_election.1.c:0 "Let the great houses arrange it"

 free_election.2.t:0 "The Pacta Conventa"
 free_election.2.d:0 "The candidate is handed the terms before he is handed the crown: what he may not tax, what he may not raise, whom he may not appoint, and what the estate may lawfully do if he forgets. Every king since the line failed has signed this. Two of them have since tried to find out what happens if he does not."
 free_election.2.a:0 "Sign the articles"
 free_election.2.b:0 "Refuse the articles"
 free_election.2.c:0 "Pay for the votes instead"

 free_election.3.t:0 "A Candidate From Outside"
 free_election.3.d:0 "A foreign prince has entered his name, and his backers are counting on the fact that a king with no relatives here has no faction here either. He brings money, an army that is not ours, and a treaty obligation nobody at the election field has read carefully."
 free_election.3.a:0 "Take the foreign prince"
 free_election.3.b:0 "Take one of our own"

 free_election.4.t:0 "The Rokosz"
 free_election.4.d:0 "A confederation has formed against the election and is riding under its own banners, which the law permits it to do. Its leaders say they are defending the liberties rather than attacking the crown, and they are not entirely wrong, which is the difficulty."
 free_election.4.a:0 "Put it down"
 free_election.4.b:0 "Hear them out"

 rip_pacta_conventa:0 "The Pacta Conventa"
 rip_rokosz_put_down:0 "A Rokosz Put Down"
