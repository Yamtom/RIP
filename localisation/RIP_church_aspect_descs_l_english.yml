l_english:
 # Church aspects whose names were localised but whose tooltips were not, so
 # the aspect panel showed the raw desc_ key beneath each one.

 desc_embrace_eastern_rite:0 "The old rite is kept in full: the liturgy in Church Slavonic, the calendar as the metropolitan reckons it, and the parishes answering to their own bishops."
 desc_accept_papal_supremacy:0 "Rome is acknowledged as first among sees. The rite stays eastern and the clergy keep their wives; what changes is whose name is read at the commemoration."
 desc_basilian_monasteries:0 "The Basilian houses take in novices, keep the presses running and school the sons of the szlachta alongside the sons of priests."
 desc_uniate_educational_network_aspect:0 "Collegia and parish schools under one order, teaching Latin and law to boys who would otherwise have learned neither."
 desc_third_rome_mission:0 "Two Romes have fallen and the third stands. The claim is made from the pulpit before it is made in any chancery."
 desc_patriarch_authority:0 "The patriarch's writ runs beside the sovereign's, and the two are read together in every cathedral of the realm."
 desc_imperial_orthodox_church:0 "The church is administered as a department of state: its lands surveyed, its appointments confirmed, its revenues counted with the rest."
 desc_subjugation_of_heretics:0 "Dissenting congregations are closed, their books taken and their preachers moved on. The parishes conform, at least on the register."
