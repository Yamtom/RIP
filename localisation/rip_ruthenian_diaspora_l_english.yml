l_english:
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_root_desc:0 "Alternate history. This branch imagines an early Ruthenian state sponsoring overseas and continental settlements through exploration and friendly foreign partners. The distant colonies and their names are author-created possibilities, not a reconstruction of an early mass diaspora. Settler missions lead to cultural influence abroad or to new dependent states."

 rip_colonize_canada_title:0 "Nova Volyn"
 rip_colonize_canada_desc:0 "Alternate history. Fur traders and fishermen from the Ruthenian lands have followed the northern rivers into the New World. Their settlements deserve a Ruthenian name: Nova Volyn. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"

 rip_colonize_canada_settlers_title:0 "Guests in Another's Colony"
 rip_colonize_canada_settlers_desc:0 "Alternate history. Ruthenian families have taken passage to Canada on another crown's ships, settling among colonists who are not their own. No new country has been founded, only a household in someone else's. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_lysianskyi_circumnavigation_title:0 "A Ruthenian Circumnavigation"
 rip_lysianskyi_circumnavigation_desc:0 "Historical inspiration: Yurii Lysiansky sailed around the world in 1803-1806. In this alternate timeline, our navigators may achieve a circumnavigation earlier. The name commemorates that later voyage; it does not place Lysiansky himself in an earlier century."

 rip_diaspora_usa_title:0 "Nova Rus"
 rip_diaspora_usa_desc:0 "Alternate history. Ruthenian settlers along the eastern seaboard have built farms and churches enough to call their country Nova Rus. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_usa_settlers_title:0 "Guests Along the Seaboard"
 rip_diaspora_usa_settlers_desc:0 "Alternate history. Ruthenian settlers have made homes among the eastern seaboard's existing colonists, welcomed rather than founding anything of their own. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_south_america_title:0 "Nova Bratslavshchyna and Sribna Zemlia"
 rip_diaspora_south_america_desc:0 "Alternate history. South of the equator, Ruthenian colonists have taken root in Brazil and along the River Plate, naming their new homes after the lands they left. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_south_america_settlers_title:0 "Guests South of the Equator"
 rip_diaspora_south_america_settlers_desc:0 "Alternate history. Ruthenian settlers have found welcome in another crown's holdings in Brazil or along the River Plate, without founding a colony of their own. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_australia_desc:0 "Alternate history. A handful of Ruthenian sailors and exiles have settled the southern continent. They have named their landing Nova Tavriya, after the old steppe shore. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_australia_settlers_title:0 "Guests on the Southern Continent"
 rip_diaspora_australia_settlers_desc:0 "Alternate history. Ruthenian sailors and exiles have settled among another crown's colonists on the southern continent, rather than raising their own flag there. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_green_wedge_title:0 "The Green Wedge Breaks Away"
 rip_green_wedge_desc:0 "Alternate history. A Ruthenian settlement project has created a foothold in the campaign's Manchurian region, and we can release it as our dependent Green Wedge. Historical Ukrainian mass settlement of the Far East belongs mainly to the second half of the nineteenth century; the name Green Wedge came into use around 1900. Both the early settlement and its dependent state are imagined divergences."

 rip_green_wedge_settlers_title:0 "Guests Beyond the Amur"
 rip_green_wedge_settlers_desc:0 "Alternate history. Earlier exploration and friendly foreign rule allow Ruthenian families to settle in the Far East without annexing the land. Historical mass migration belongs mainly to the second half of the nineteenth century, and Green Wedge is a later name. This route imagines an early sponsored diaspora rather than reproducing that migration."

 rip_grey_wedge_title:0 "The Grey Wedge Breaks Away"
 rip_grey_wedge_desc:0 "Alternate history. An earlier sponsored migration has established a Ruthenian foothold in Central Asia. We can release these lands as a dependent Grey Wedge. The later diaspora name is used as a recognizable inspiration for an imagined early state, not as evidence that such a state existed in the campaign period."

 rip_grey_wedge_settlers_title:0 "Guests on the Open Steppe"
 rip_grey_wedge_settlers_desc:0 "Alternate history. A friendly power permits a Ruthenian settlement project in Central Asia without surrendering its territory. Grey Wedge is a retrospective diaspora name; this campaign brings the settlement process forward through an imagined early diplomatic agreement."

 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_of_rus_desc:0 "Alternate history. From the Amur to the River Plate, Ruthenian speech is now heard on every continent but one. Some of that scattering answers to the throne; most of it does not. These overseas settlements and their names belong to an imagined early diaspora enabled by exploration and state sponsorship."

 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"

 rip_diaspora_settlers_cooldown:0 "Settlers Under Way"
 desc_rip_diaspora_settlers_cooldown:0 "We have recently sent settlers abroad. The next household will need time to gather."

 # Settler decisions and their events (decisions/RIP_RuthenianDiaspora.txt,
 # events/RIP_RuthenianDiaspora.txt).
 rip_diaspora_colonial_settlers_title:0 "Offer Settlers to a Colony"
 rip_diaspora_colonial_settlers_desc:0 "Alternate history. Sponsor an early Ruthenian diaspora through a friendly colonial partner in a mission-unlocked region. An eligible partner and one of its eligible provinces are selected randomly. Settlement is abstracted as a change to our primary culture; ownership stays with the partner. The four settler actions share a five-year cooldown."

 rip_diaspora_colonial_settlers_faith_title:0 "Offer Settlers and the Faith"
 rip_diaspora_colonial_settlers_faith_desc:0 "Alternate history. Sponsor settlers and their clergy through a friendly colonial partner, bringing an imagined diaspora forward into the campaign period. A randomly selected eligible province adopts our primary culture and religion while retaining its owner. Requires the higher opinion threshold, costs one stability and shares the five-year settler cooldown."

 rip_diaspora_mainland_settlers_title:0 "Offer Settlers Across the Border"
 rip_diaspora_mainland_settlers_desc:0 "Alternate history. Sponsor earlier settlement in the Far East or Central Asia through a friendly foreign partner. Green Wedge and Grey Wedge are retrospective names, not contemporary claims. An eligible partner and province are selected randomly; the province adopts our primary culture but keeps its owner. The settler actions share a five-year cooldown."

 rip_diaspora_mainland_settlers_faith_title:0 "Offer Settlers and the Faith Across the Border"
 rip_diaspora_mainland_settlers_faith_desc:0 "Alternate history. Sponsor settlers and clergy in the Far East or Central Asia, anticipating later diaspora movements through an imagined early agreement. Green Wedge and Grey Wedge are retrospective names. A randomly selected eligible province adopts our primary culture and religion without changing owner. Requires the higher opinion threshold, costs one stability and shares the five-year cooldown."

 rip_diaspora.10.t:0 "Settlers Arrive"
 rip_diaspora.10.d:0 "Alternate history. Our sponsored families have reached a randomly selected eligible province of a friendly colonial partner. The settlement programme is represented by a provincial culture change. The partner retains the land; this is an imagined early diaspora rather than a dated historical migration."
 rip_diaspora.10.a:0 "Let them settle"

 rip_diaspora.11.t:0 "Settlers Arrive With Their Priest"
 rip_diaspora.11.d:0 "Alternate history. Sponsored families and clergy have reached a randomly selected eligible province of a friendly colonial partner. Settlement is represented by changes to provincial culture and religion. The province retains its owner; this is an imagined early diaspora."
 rip_diaspora.11.a:0 "Let them settle"

 rip_diaspora.12.t:0 "Settlers Cross the Border"
 rip_diaspora.12.d:0 "Alternate history. Families have settled in a randomly selected eligible province under friendly foreign rule in the Far East or Central Asia. Provincial culture represents the settlement programme, and ownership remains unchanged. The later wedge names identify the inspiration rather than a contemporary historical polity."
 rip_diaspora.12.a:0 "Let them settle"

 rip_diaspora.13.t:0 "Settlers Cross the Border With Their Priest"
 rip_diaspora.13.d:0 "Alternate history. Families and clergy have settled in a randomly selected eligible province under friendly foreign rule in the Far East or Central Asia. Culture and religion represent the settlement programme; ownership remains unchanged. The later wedge names are retrospective inspirations."
 rip_diaspora.13.a:0 "Let them settle"

 rip_diaspora.20.t:0 "The Green Wedge Asks for Its Own Governor"
 rip_diaspora.20.d:0 "Alternate history. Our imagined early settlements in the Far East now seek a government of their own. Release the eligible Ruthenian or Rusyn lands as our dependent Green Wedge. The historical mass migration and the Green Wedge name belong to a later era; this dependent state is an authored alternative."
 rip_diaspora.20.a:0 "Grant the Green Wedge its own crown"

 rip_diaspora.21.t:0 "The Grey Wedge Asks for Its Own Governor"
 rip_diaspora.21.d:0 "Alternate history. Our imagined early settlements in Central Asia now seek a government of their own. Release the eligible Ruthenian or Rusyn lands as our dependent Grey Wedge. The later diaspora name supplies an inspiration, not proof of an early historical state."
 rip_diaspora.21.a:0 "Grant the Grey Wedge its own crown"
