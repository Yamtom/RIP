l_english:

 # =====================================================================
 # THE UNION THAT ARRIVES FROM BELOW - events/UniateReformationSpread.txt
 #
 # PLAUSIBLE. This is how the union actually spread in Galicia and
 # Transcarpathia across the seventeenth century: parish by parish, long
 # after Brest, because the Basilian schools taught the children and the
 # bishop's court was quicker than the starosta's. Only the moment where a
 # whole country follows its own parishes is counterfactual.
 #
 # It is the Reformation shape rather than the Brest shape: a centre
 # appears, it works outward, and the crown finds its realm changed under
 # it and has to answer.
 # =====================================================================

 uniate_spread.1.t:0 "The Consistory at the Border"
 uniate_spread.1.d:0 "A Uniate consistory has opened a day's ride beyond our border, and with it a school. It takes boys of any rite, teaches them Latin and Slavonic together, and charges nothing.\n\nOur own clergy report the difficulty honestly. Their seminaries are poor, their books are old, and a priest's son who wants a training now has somewhere better to go and no reason not to go there.\n\nThe consistory has broken no law. It has simply made itself useful on a frontier where nothing else is."
 uniate_spread.1.a:0 "Let it sit. A school is not an army."
 uniate_spread.1.b:0 "Close the school and set our seal on the consistory."

 uniate_spread.2.t:0 "The First Parish"
 uniate_spread.2.d:0 "A village has gone over. Not by decree, not under arms: the priest died, the parish had no candidate of its own, and the man who came was ordained on the other side of the border and says the same liturgy.\n\nThe congregation could not tell you what changed. The commemoration changed. Everything they can see is what it was.\n\nIt is one village and it is a long way from the capital. It is also the first, and the dean has written to say so twice."
 uniate_spread.2.a:0 "Send the dean. The parish comes back."
 uniate_spread.2.b:0 "One village, and a long way from the capital."

 uniate_spread.3.t:0 "The Brotherhoods Answer"
 uniate_spread.3.d:0 "The brotherhoods have seen what is happening to the parishes and they have not waited for us. They are printing, they are teaching, and they are arguing in the marketplaces with men trained to argue better.\n\nThey want two things from the crown: charters that put their schools beyond the reach of a hostile bishop, and money. They are willing to say plainly what happens if they get neither.\n\nThey are also, several of them, more of a problem to their own hierarchy than the union is."
 uniate_spread.3.a:0 "Charter them, and pay for the presses."
 uniate_spread.3.b:0 "Let it be pronounced against from every ambo."
 uniate_spread.3.c:0 "The parishes will answer for themselves."

 uniate_spread.4.t:0 "What the Schools Are Making"
 uniate_spread.4.d:0 "The first Basilian graduates have come of age, and they are not what anyone expected. They keep the eastern rite, they write in Latin, they know canon law and they know the western courts, and they are the best-trained clerks in the country.\n\nOur chancery wants them. Our bishops distrust them. Both are right.\n\nA generation of men who are eastern in church and western in the schoolroom is exactly what the union was built to produce, and it is now producing them faster than we produce anyone."
 uniate_spread.4.a:0 "Put a brotherhood school beside every Basilian one."
 uniate_spread.4.b:0 "Take their graduates into the chancery and use them."

 uniate_spread.5.t:0 "The Realm Has Changed Under Us"
 uniate_spread.5.d:0 "The visitations are in and the arithmetic is not arguable. More of this realm keeps the union than keeps the obedience of its sovereign, and the line no longer follows the border or the estate or the language. It follows where the schools reached.\n\nThe crown may follow its parishes, which is an admission that they decided a question the crown did not, or it may hold, which means governing a church its own subjects have left.\n\nEither way, nobody is going to pretend this was decided in a hall."
 uniate_spread.5.a:0 "Follow the parishes into the union."
 uniate_spread.5.b:0 "The crown does not follow. It leads or it holds."

 uniate_spread.6.t:0 "Holding the Line"
 uniate_spread.6.d:0 "The refusal has to be enforced or it is not a refusal. That means commissioners, sequestered churches, priests removed from parishes that want them, and the brotherhoods - which have spent a generation learning to organise - on the wrong side of us for the first time.\n\nThe sabre is available. It has been used on this ground before, by the other side, and everyone remembers how well it worked.\n\nWhat is being decided is not whether the crown wins. It is what is left when it does."
 uniate_spread.6.a:0 "Press it to the end."
 uniate_spread.6.b:0 "Stop short of the sabre."

 uniate_spread.7.t:0 "Where the Metropolitan Sits"
 uniate_spread.7.d:0 "The union is made and the awkward question arrives immediately behind it: what our metropolitan actually is, now, in a church that has Latin bishops in it.\n\nHe is in communion with them and he does not rank with them. He sits below men whose sees are smaller and younger than his, and the eastern clergy notice it every time he does.\n\nThe rite was promised untouched. Nobody promised the precedence, and the precedence is what the clergy will remember."
 uniate_spread.7.a:0 "Seat him where the Latin bishops sit."
 uniate_spread.7.b:0 "Leave the old rite its own courts and its own order."

 uniate_spread.8.t:0 "The Question Will Not Wait"
 uniate_spread.8.d:0 "It has been put off through one reign and it cannot be put off through another. The parishes have gone where they have gone; the schools have taught whom they have taught; the sees are held by men who were educated by the union whether or not they profess it.\n\nA decision now is a decision about a fact. A decision later will be somebody else's, made with fewer choices."
 uniate_spread.8.a:0 "Take the union now, while it is still ours to take."
 uniate_spread.8.b:0 "Hold. Let the next reign answer it too."
