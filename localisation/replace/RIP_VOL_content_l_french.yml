 M_VOL_Events.1.a:0 "Excellent!"
 M_VOL_Events.1.d:0 "A physician's son from Drohobych holds a chair at Bologna and has printed a book of prognostications there - the first from any man of our lands. He writes to say he would return if there were a school here worth the name."
 M_VOL_Events.1.t:0 "Yuriy Drohobych"
