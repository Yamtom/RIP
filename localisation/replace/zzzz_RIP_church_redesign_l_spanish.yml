 rip_church_gui_count_value:0 "Rights guaranteed · Orthodox: [Root.GetChurchEasternCount] · Catholic: [Root.GetChurchLatinCount]"
 rip_church_gui_count_value_tt:0 "§WCommunity rights guaranteed§!\n§YOrthodox§!: our provinces of Orthodox or Muscovite Orthodox faith where we guarantee community rights.\n§YCatholic§!: our provinces of Catholic faith where we guarantee community rights.\nProvinces without a guarantee are not counted. To add one, select a controlled city and press Guarantee community rights in its province panel.\nThe ecumenical settlement needs one Orthodox guarantee (Muscovite Orthodox does not count) and one Catholic guarantee; a compact of coexistence needs one of any of the three faiths.\nUpdated monthly and whenever rights change.\n§gGameplay abstraction: not an exact historical parish or canonical status, and not evidence of voluntary Union acceptance.§!"
 rip_church_gui_ecumenism:0 "Conclude settlement"
 rip_church_gui_ecumenism_reason:0 "[Root.GetChurchEcumenismReason]"
 rip_church_gui_ecumenism_reason_tt:0 "[Root.GetChurchEcumenismReason]\n§YEcumenical settlement§!\nA limited diplomatic and local administrative settlement between Orthodox and Catholic communities, not a restoration of full ecclesial communion.\n§YRequires§!\n20 years in the Union, no forced integration for 10 years, stability +2 and peace.\nGuaranteed rights in an Orthodox and in a Catholic province.\nAn Orthodox ally with +100 opinion of us (Muscovite Orthodox does not count).\n§YEffect§!\n§Gunrest -3§!, §Rtax -10%§!, §Rlevies -15%§! in every guaranteed province.\nOrthodox and Catholic states gain +15 mutual opinion; this is diplomatic goodwill only. Russian Orthodox states are excluded.\nCosts nothing; never withdrawn."
 rip_church_gui_ecumenism_state:0 "§WEcumenism§!\n[Root.GetChurchEcumenismAccess]"
 rip_church_gui_ecumenism_state_tt:0 "§YEcumenical settlement§!\nA limited diplomatic and local administrative settlement between Orthodox and Catholic communities, not a restoration of full ecclesial communion.\n§YRequires§!\n20 years in the Union, no forced integration for 10 years, stability +2 and peace.\nGuaranteed rights in an Orthodox and in a Catholic province.\nAn Orthodox ally with +100 opinion of us (Muscovite Orthodox does not count).\n§YEffect§!\n§Gunrest -3§!, §Rtax -10%§!, §Rlevies -15%§! in every guaranteed province.\nOrthodox and Catholic states gain +15 mutual opinion; this is diplomatic goodwill only. Russian Orthodox states are excluded.\nCosts nothing; never withdrawn."
 rip_church_gui_ecumenism_tt:0 "§YEcumenical settlement§!\nA limited diplomatic and local administrative settlement between Orthodox and Catholic communities, not a restoration of full ecclesial communion.\n§YRequires§!\n20 years in the Union, no forced integration for 10 years, stability +2 and peace.\nGuaranteed rights in an Orthodox and in a Catholic province.\nAn Orthodox ally with +100 opinion of us (Muscovite Orthodox does not count).\n§YEffect§!\n§Gunrest -3§!, §Rtax -10%§!, §Rlevies -15%§! in every guaranteed province.\nOrthodox and Catholic states gain +15 mutual opinion; this is diplomatic goodwill only. Russian Orthodox states are excluded.\nCosts nothing; never withdrawn."
