 # --- decisions

 lit_hold_the_union_on_our_terms_title:0 "Hold the Union on Our Terms"
 lit_hold_the_union_on_our_terms_desc:0 "Confirm the union as a bargain between two realms rather than a swallowing of one by the other: one monarch and one foreign policy, and everything else kept separate and kept ours. It will make every decision slower and every decision joint. It will also make the Grand Duchy impossible to legislate out of existence."

 lit_take_a_separate_crown_title:0 "Take a Crown of Our Own"
 lit_take_a_separate_crown_desc:0 "Crown the Grand Duke at Vilnius and stop sending deputies south. The Statute, the levy, the treasury and the Ruthenian palatinates stay where they are, and stay ours to defend. Krakow will not answer this with a letter."

 pol_press_the_incorporation_title:0 "Press for the Palatinates"
 pol_press_the_incorporation_desc:0 "Podlasie, Volhynia, Bratslav and Kyiv are held from Vilnius and taxed by Vilnius, and the Crown's szlachta have been buying land in all four for two generations. Put the act before the diet while the king's signature is available. No army needs to move for this."

 lit_guarantee_the_orthodox_lords_title:0 "Guarantee the Orthodox Lords"
 lit_guarantee_the_orthodox_lords_desc:0 "Write into the Statute what the practice has been for a century: that no man of the Grand Duchy loses his land, his court or his seat for the rite he was baptised in. Rome will read it as a defeat. The palatinates that pay for half our levy will read it as a contract."

 lit_confirm_the_statute_title:0 "Confirm the Statute"
 lit_confirm_the_statute_desc:0 "Print the code, send it to every castle court, and instruct the judges to cite the book rather than the custom of the district. A written law is harder to bend. It is also harder to quietly replace with somebody else's."

