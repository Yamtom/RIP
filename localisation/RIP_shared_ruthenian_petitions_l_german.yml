l_german:
 rip_rus_ruthenian_kyiv_petitions_title:0 "Hear the Kyivan Petitioners"
 rip_rus_ruthenian_kyiv_petitions_desc:0 "Invite scribes from Kyiv to interpret appeals and settle how the chancery will record their rulings."
 rip_rus_ruthenian.1.t:0 "Kyivan Petition Books"
 rip_rus_ruthenian.1.d:0 "Kyiv sends petitions in several hands. A wax seal can establish who sent a letter, but a clerk must still decide whether a disputed field is a grant, a lease or a pledge. The visiting scribes offer to compile a register of precedents."
 rip_rus_ruthenian.1.a:0 "Commission a bilingual register."
 rip_rus_ruthenian.1.result_tt:0 "After 180 days the register grants 55 diplomatic power."
 rip_rus_ruthenian.1.b:0 "Hear the petitioners through an interpreter today."
 rip_rus_ruthenian.2.t:0 "A Register in Two Hands"
 rip_rus_ruthenian.2.d:0 "The new register sets each petition beside its translation. Clerks have begun leaving space in the margins for the next appeal."
 rip_rus_ruthenian.2.a:0 "Enter it in the chancery book."
 rip_rus_ruthenian_garrison_ovens_title:0 "Settle the Garrison Bread Accounts"
 rip_rus_ruthenian_garrison_ovens_desc:0 "Hear the Pereiaslav bakers who have been provisioning the streltsy on credit."
 rip_rus_ruthenian.3.t:0 "Bread for the Streltsy"
 rip_rus_ruthenian.3.d:0 "Bakers on the left bank of the Dnieper have kept the streltsy fed on credit. Their tally sticks and the garrison ledger disagree. The bakers will accept a regular contract if the treasury pays the first instalment."
 rip_rus_ruthenian.3.a:0 "Pay the bakers and establish a bread depot."
 rip_rus_ruthenian.3.result_tt:0 "After 120 days Pereiaslav gains 1 base manpower if still owned. Otherwise the court gains 15 military power."
 rip_rus_ruthenian.3.b:0 "Release the households from this levy."
 rip_rus_ruthenian.4.t:0 "The First Bread Convoy"
 rip_rus_ruthenian.4.d:0 "The flour has arrived by river. With the bakers paid and the ovens ready, fewer soldiers need to leave their posts to buy food."
 rip_rus_ruthenian.4.a:0 "Send word to the districts."
 rip_rus_ruthenian_winter_carters_title:0 "Hire Carters for Siberia"
 rip_rus_ruthenian_winter_carters_desc:0 "Set terms for Ruthenian carters supplying the western Siberian settlements."
 rip_rus_ruthenian.5.t:0 "A Winter Freight Contract"
 rip_rus_ruthenian.5.d:0 "Carters from Ruthenian towns offer to carry tools and seed to settlements beyond the Urals. They want an advance for spare harness and the right to carry private freight on the return journey."
 rip_rus_ruthenian.5.a:0 "Advance the cost of the winter convoy."
 rip_rus_ruthenian.5.result_tt:0 "After 270 days a western Siberian town gains 1 base production if one is still owned. The court also gains 4 prestige."
 rip_rus_ruthenian.5.b:0 "Sell the merchants a single freight licence."
 rip_rus_ruthenian.6.t:0 "The Sledges Return"
 rip_rus_ruthenian.6.d:0 "The convoy has delivered its seed and tools. Its drivers bring back the first freight receipts and a list of places where a second winter road could be laid."
 rip_rus_ruthenian.6.a:0 "Receive the accounts."
 rip_rus_ruthenian_border_grain_title:0 "Convene the Border Granaries"
 rip_rus_ruthenian_border_grain_desc:0 "During the Time of Troubles, ask the Ruthenian border towns to release grain for relief."
 rip_rus_ruthenian.7.t:0 "Grain during the Troubles"
 rip_rus_ruthenian.7.d:0 "The granary wardens of the Ruthenian borderlands can open their stores during the succession crisis. They ask who will replace the seed grain when the roads are safe again."
 rip_rus_ruthenian.7.a:0 "Underwrite a season of relief."
 rip_rus_ruthenian.7.result_tt:0 "After 180 days gain 1 stability, or administrative power if stability is already at its maximum."
 rip_rus_ruthenian.7.b:0 "Let each town decide how much to release."
 rip_rus_ruthenian.8.t:0 "Seed for the Next Sowing"
 rip_rus_ruthenian.8.d:0 "The wardens have received the promised seed. Households that might have abandoned their fields can stay for another harvest."
 rip_rus_ruthenian.8.a:0 "Let the agreement stand."
 rip_rus_ruthenian_sloboda_roll_title:0 "Review the Sloboda Service Rolls"
 rip_rus_ruthenian_sloboda_roll_desc:0 "Call the Cossack delegates from Sloboda Ukraine to verify the service rolls."
 rip_rus_ruthenian.9.t:0 "Households on the Cossack Roll"
 rip_rus_ruthenian.9.d:0 "The Cossack delegates bring a service roll from Sloboda Ukraine. Several households share a surname, and several riders have moved since the spring muster. A local clerk offers to keep a second copy at the crossing."
 rip_rus_ruthenian.9.a:0 "Pay a clerk to reconcile the rolls."
 rip_rus_ruthenian.9.result_tt:0 "After 150 days the new rolls grant 8 army tradition."
 rip_rus_ruthenian.9.b:0 "Accept the delegates' tally for this muster."
 rip_rus_ruthenian.10.t:0 "A Roll the Sotnia Can Use"
 rip_rus_ruthenian.10.d:0 "The two copies now agree. The next summons can name a household and a crossing instead of sending riders from village to village."
 rip_rus_ruthenian.10.a:0 "Acknowledge the report."
 rip_rus_ruthenian_widows_deeds_title:0 "Examine the Widows' Deeds"
 rip_rus_ruthenian_widows_deeds_desc:0 "Hear Ruthenian widows seeking recognition of deeds issued under an earlier ruler."
 rip_rus_ruthenian.11.t:0 "Deeds from the Border Courts"
 rip_rus_ruthenian.11.d:0 "Widows from Ruthenian service families have brought deeds made out under an earlier ruler. Their seals are intact. If the deeds are copied into the new court book, the women can defend their holdings without another journey to the capital."
 rip_rus_ruthenian.11.a:0 "Fund a travelling bench to record their claims."
 rip_rus_ruthenian.11.result_tt:0 "After 240 days gain 10 legitimacy and 6 prestige."
 rip_rus_ruthenian.11.b:0 "Grant safe conduct for individual appeals."
 rip_rus_ruthenian.12.t:0 "The Circuit Book Returns"
 rip_rus_ruthenian.12.d:0 "The judges return with copies made before local witnesses. When an heir contests a widow's title, the clerk can now produce the testimony taken in her own district."
 rip_rus_ruthenian.12.a:0 "Keep a copy under seal."
 rip_lit_ruthenian_chancery_copies_title:0 "Order Copies of Ruthenian Deeds"
 rip_lit_ruthenian_chancery_copies_desc:0 "Decide where petitioners from the Ruthenian lands can consult certified copies of their deeds."
 rip_lit_ruthenian.1.t:0 "The Chancery Copyists"
 rip_lit_ruthenian.1.d:0 "Petitioners from the Ruthenian lands may travel for weeks to consult a deed in the grand duke's chancery. The clerks propose sending certified copies back to the district where the witnesses live."
 rip_lit_ruthenian.1.a:0 "Pay for district copies and seals."
 rip_lit_ruthenian.1.result_tt:0 "After 180 days the district copies grant 50 diplomatic power."
 rip_lit_ruthenian.1.b:0 "Keep the originals in Vilnius and hear appeals there."
 rip_lit_ruthenian.2.t:0 "Seals in the District Courts"
 rip_lit_ruthenian.2.d:0 "The district clerks have received their sealed copies. A plaintiff can now have a boundary read aloud before calling neighbours to testify."
 rip_lit_ruthenian.2.a:0 "Enter it in the chancery book."
 rip_lit_ruthenian_volhynian_bench_title:0 "Hear the Volhynian Land Court"
 rip_lit_ruthenian_volhynian_bench_desc:0 "Hear the landholders of Volhynia before the disputed hay meadow is cut."
 rip_lit_ruthenian.3.t:0 "The Volhynian Boundary Walk"
 rip_lit_ruthenian.3.d:0 "Two Volhynian households hold deeds to the same meadow. The court can send witnesses to walk the boundary before the hay is cut, or license the neighbours to share the meadow this season."
 rip_lit_ruthenian.3.a:0 "Endow a circuit of sworn surveyors."
 rip_lit_ruthenian.3.result_tt:0 "After 150 days Rivne gains 1 base tax if still owned. Otherwise the court gains 15 administrative power."
 rip_lit_ruthenian.3.b:0 "Seal a temporary grazing agreement."
 rip_lit_ruthenian.4.t:0 "The Marked Boundary"
 rip_lit_ruthenian.4.d:0 "The surveyors have returned with a sketch of the watercourse and the names of the witnesses. Other villages now bring their disputed boundaries to the same bench."
 rip_lit_ruthenian.4.a:0 "Send word to the districts."
 rip_lit_ruthenian_dnipro_watch_title:0 "Negotiate the Dnieper River Watch"
 rip_lit_ruthenian_dnipro_watch_desc:0 "Agree with the Cossack boatmen on terms for guarding the Dnieper crossing at Pereiaslav."
 rip_lit_ruthenian.5.t:0 "The Price of a River Watch"
 rip_lit_ruthenian.5.d:0 "Cossack boatmen know where a convoy must land when the Dnieper runs low. They will keep a watch at the crossing if their boats are entered on the duke's rolls, or guide a single convoy for a fee."
 rip_lit_ruthenian.5.a:0 "Equip a permanent river watch."
 rip_lit_ruthenian.5.result_tt:0 "After 180 days Pereiaslav gains 1 base manpower if still owned. Otherwise the watchmen grant 3 navy tradition."
 rip_lit_ruthenian.5.b:0 "Let the boatmen collect this season's ferry tolls."
 rip_lit_ruthenian.6.t:0 "Signals from the Crossing"
 rip_lit_ruthenian.6.d:0 "The watchmen have agreed on landing places and signals. A messenger can now pass the warning upriver before a convoy sets out."
 rip_lit_ruthenian.6.a:0 "Receive the accounts."
 rip_lit_ruthenian_convent_school_title:0 "Hear the Volhynian School Founders"
 rip_lit_ruthenian_convent_school_desc:0 "Receive the Volhynian patrons seeking an endowment for a school and its Ruthenian books."
 rip_lit_ruthenian.7.t:0 "A School under Its Founders' Seal"
 rip_lit_ruthenian.7.d:0 "Women from several Volhynian households offer rents for a school where pupils can learn letters from Ruthenian books. They ask the grand duke to secure the endowment against the next dispute over an inheritance."
 rip_lit_ruthenian.7.a:0 "Confirm the endowment and buy the first books."
 rip_lit_ruthenian.7.result_tt:0 "After 365 days the school grants 55 administrative power and 5 prestige."
 rip_lit_ruthenian.7.b:0 "Give the founders a charter to collect private gifts."
 rip_lit_ruthenian.8.t:0 "The First School Accounts"
 rip_lit_ruthenian.8.d:0 "The founders present the accounts in their own names. The rents have bought paper, paid a reader and kept a room warm through the winter."
 rip_lit_ruthenian.8.a:0 "Let the agreement stand."
 rip_lit_ruthenian_union_articles_title:0 "Hear the Ruthenian Union Delegates"
 rip_lit_ruthenian_union_articles_desc:0 "Hear what guarantees the Ruthenian districts want on the table during negotiations with Poland."
 rip_lit_ruthenian.9.t:0 "Articles for a Future Union"
 rip_lit_ruthenian.9.d:0 "Ruthenian delegates ask what will become of their courts if Lithuania and Poland unite. A promise spoken at the diet may die with its witnesses. The delegates want copies under seal before the next round of talks."
 rip_lit_ruthenian.9.a:0 "Negotiate written guarantees for local courts."
 rip_lit_ruthenian.9.result_tt:0 "After 180 days the articles grant 45 administrative power and 10 prestige."
 rip_lit_ruthenian.9.b:0 "Reserve the question for the grand duke."
 rip_lit_ruthenian.10.t:0 "The Delegates Exchange Copies"
 rip_lit_ruthenian.10.d:0 "Each delegation takes home the same text. Whatever form the union takes, its negotiators now have agreed articles on the language and jurisdiction of the district courts."
 rip_lit_ruthenian.10.a:0 "Acknowledge the report."
 rip_lit_ruthenian_diet_mandates_title:0 "Summon the Ruthenian District Diets"
 rip_lit_ruthenian_diet_mandates_desc:0 "Ask the Ruthenian district assemblies to address their grievances before the general diet meets."
 rip_lit_ruthenian.11.t:0 "Instructions from the Districts"
 rip_lit_ruthenian.11.d:0 "With the veto in force, a single envoy can carry a dispute from a Ruthenian district into the general diet. The district assemblies offer to put their objections in writing before their envoys leave home."
 rip_lit_ruthenian.11.a:0 "Send commissioners to hear the district instructions."
 rip_lit_ruthenian.11.result_tt:0 "After 120 days gain 1 stability, or administrative power if stability is already at its maximum."
 rip_lit_ruthenian.11.b:0 "Let the envoys negotiate on the floor."
 rip_lit_ruthenian.12.t:0 "The Instructions Are Read"
 rip_lit_ruthenian.12.d:0 "The envoys lay their instructions before the marshal. Two districts find they can settle a disputed toll between themselves and withdraw their objection to the levy."
 rip_lit_ruthenian.12.a:0 "Keep a copy under seal."
