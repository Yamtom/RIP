 dniester_wine_merchants:0 "Dniester Wine Merchants"
 domestic_grain_security:0 "Domestic Grain Security"
 domestic_grain_security_desc:0 "We prioritize feeding our own people over exports."
 doroshenko:0 "Doroshenko"
 dual_communion_compromise:0 "Dual Communion Compromise"
 dvina_commerce:0 "Dvina Commerce"
 dvina_commerce_desc:0 "The Western Dvina connects Polotsk to Riga and the Baltic trade networks. We control a vital commercial artery linking the Baltic to the Black Sea."
 dvina_fortifications:0 "Dvina Fortifications"
 dvina_fortifications_desc:0 "Vitebsk fortress commands the strategic Dvina river crossing. Our defensive position makes us a key border stronghold."
 dvina_fortress_line:0 "Dvina Fortress Line"
 dvina_fortress_line_desc:0 "Strategic fortifications at Polotsk, Vitebsk, and Disna control all major river crossings, providing defensive depth against any invasion."
 dvina_gateway:0 "Dvina Gateway"
 dvina_gateway_desc:0 "Vitebsk controls the Dvina trade route between Riga and Smolensk. This strategic position brings commercial prosperity and cultural influence."
 dvina_trade_hub:0 "Dvina Trade Hub"
 eastern_frontier:0 "Eastern Frontier"
 eastern_frontier_desc:0 "Mstislavl guards the border between Belarus and Russia. Constant warfare with Smolensk, Polotsk, and Muscovy has forged a militarized society."
 eastern_rite_preservation:0 "Eastern Rite Preservation"
 eastern_rite_tradition_preserved:0 "Eastern Rite Tradition Preserved"
 elected_assemblies_reform:0 "Veche Assemblies"
 elected_assemblies_reform_desc:0 "The general assemblies are held once every few months where all peoples within the realm can attend. In the assemblies proposals are discussed and then proposed to the rada."
 embrace_eastern_rite:0 "Embrace Eastern Rite"
 embrace_eastern_rite_desc:0 "We preserve Orthodox liturgical traditions, Church Slavonic language, and Byzantine iconography while maintaining communion with Rome."
 embraced_minority_religion:0 "Embraced Minority Religion"
 emergency_border_mobilization:0 "Emergency Border Mobilization"
 enables_chaiky_raids:0 "§YChaiky maritime raids are formally authorized§!"
 enables_chaiky_raids_desc:0 "The Host legitimizes Black Sea chaiky expeditions, expanding privateering income while worsening relations with targeted powers."
 enables_chaiky_raids_yes:0 "§YChaiky raids are enabled§!"
 enables_democratic_assembly:0 "§YGeneral Sich assembly participates in state decisions§!"
 enables_democratic_assembly_desc:0 "A broad Cossack rada influences war, diplomacy, and leadership selection, improving representation but slowing consensus."
 enables_democratic_assembly_yes:0 "§YDemocratic assembly is enabled§!"
 enables_frequent_elections:0 "§YFrequent elections create instability but prevent tyranny§!"
 enables_frequent_elections_desc:0 "Annual or very frequent officer rotation strengthens political accountability but increases short-term instability."
 enables_frequent_elections_yes:0 "§YFrequent elections are enabled§!"
 enables_hereditary_succession:0 "§YHetman can designate successor, creating quasi-dynasty§!"
 eng_base_sprite_pack:0 "England Unit Pack"
 enhanced_sich_fortress:0 "Enhanced Sich Fortress"
 establish_dniester_fishing_desc:0 "The Dniester Estuary's rich waters can support a thriving fishing industry, providing food and trade goods."
 establish_dniester_fishing_title:0 "Establish Estuary Fishing Industry"
 establish_dniester_salt_works_desc:0 "The estuary's salt resources can be exploited for profit."
 establish_dniester_salt_works_title:0 "Establish Salt Production"
 establish_dniester_wine_trade_desc:0 "Greek and Armenian merchants can help establish profitable wine trade in the Dniester Estuary region."
 establish_dniester_wine_trade_title:0 "Develop Wine Trade"
 establish_greek_catholic_center_decision_desc:0 "We should establish a major center of Greek Catholic faith to coordinate church administration and spread the faith."
 establish_greek_catholic_center_decision_title:0 "Establish Greek Catholic Center"
 establish_host_organization_desc:0 "Create formal military administrative structures for the Host, including regimental systems, supply chains, and command hierarchies."
 establish_host_organization_title:0 "Establish Host Military Organization"
 establish_moscow_patriarchate_decision_desc:0 "We can establish an independent Patriarchate in Moscow, asserting our religious autonomy."
 establish_moscow_patriarchate_decision_title:0 "Establish Moscow Patriarchate"
 establish_orthodox_inquisition_decision_desc:0 "We can create inquisitorial courts to enforce religious conformity."
 establish_orthodox_inquisition_decision_title:0 "Establish Orthodox Inquisition"
 establish_symphonia_decision_desc:0 "We can create harmonious unity of church and state authority."
 establish_symphonia_decision_title:0 "Establish Symphonia of Powers"
 estate_burghers_chr_grain_cartels:0 "Grain Cartel Charters"
 estate_burghers_chr_grain_cartels_desc:0 "Grant Left Bank guilds exclusive charters over export depots, letting merchant syndics finance new elevators in exchange for influence."
 estate_burghers_het_left_bank:0 "Left-Bank Development"
 estate_burghers_het_left_bank_desc:0 "The Left Bank of the Dnieper becomes a center of agricultural development and urban growth under burgher management. Refugees and settlers develop the land, creating prosperous towns and productive estates."
 estate_church_chr_chernihiv_collegium:0 "Chernihiv Collegium Charters"
 estate_church_chr_chernihiv_collegium_desc:0 "Grant the Chernihiv Collegium the right to train clergy and jurists for the Hetmanate, spreading institutions, missions, and reformist discipline through its lecture halls."
 estate_church_het_academy:0 "Kyiv-Mohyla Academy"
 estate_church_het_academy_desc:0 "The Kyiv-Mohyla Academy (Collegium) is the premier educational institution of Eastern Europe, combining Orthodox theology with Western scholarship. It produces learned clergy, administrators, and military officers who spread enlightenment throughout the Hetmanate."
 estate_cossacks_chr_starshyna_collegium:0 "Starshyna Collegium"
 estate_cossacks_chr_starshyna_collegium_desc:0 "Seat senior cossack officers on a permanent collegium, rewarding frontier service with greater say over cavalry levies."
 estate_cossacks_het_registered_host:0 "Registered Cossack Army"
 estate_cossacks_het_registered_host_desc:0 "The Hetmanate maintains a professional army of registered Cossacks organized into disciplined regiments. Unlike the free Sich, these are state soldiers combining Cossack martial prowess with regular army organization."
 estate_cossacks_zaz_chaiky_raids:0 "Chaiky Sea Raiders"
 estate_cossacks_zaz_chaiky_raids_desc:0 "The legendary chaiky boats allow Zaporozhian Cossacks to conduct devastating naval raids along the Black Sea, attacking Ottoman and Crimean ports for plunder and slaves. This grants naval capabilities but damages diplomatic relations."
 estate_cossacks_zaz_free_steppe:0 "Steppe Brotherhood"
 estate_cossacks_zaz_free_steppe_desc:0 "The Sich rejects serfdom and class hierarchies, accepting all free men as equals. This creates a unique society of warriors united by brotherhood rather than feudal bonds, though it limits tax revenue."
 estate_cossacks_zaz_sich_rada:0 "Sich Rada Authority"
 estate_cossacks_zaz_sich_rada_desc:0 "The Sich Rada (council) is the supreme elective body of the Zaporozhian Host, electing all officers including the Kosh Otaman. This privilege grants the Rada extensive powers, ensuring Cossack freedoms but limiting central authority."
 estate_cossacks_zaz_wild_field:0 "Wild Field Mastery"
 estate_cossacks_zaz_wild_field_desc:0 "The Zaporozhian Cossacks are masters of the Wild Fields - the vast steppe frontier between civilizations. They move through these lands with unmatched speed and know how to survive where others perish."
 estate_jewish_black_sea_network:0 "Black Sea Network"
 estate_jewish_black_sea_network_desc:0 "Support Jewish merchants in establishing trade networks in the Black Sea."
 estate_jewish_kahal_autonomy:0 "Kahal Autonomy"
 estate_jewish_kahal_autonomy_desc:0 "Grant the Jewish community autonomy in their internal affairs."
 estate_jewish_loan_banks:0 "Jewish Loan Banks"
 estate_jewish_loan_banks_desc:0 "Allow Jewish merchants to establish loan banks."
 estate_jewish_merchants:0 "Jewish Merchants"
 estate_jewish_merchants_desc:0 "Recognize and organize the estate of Jewish merchants within our realm."
 estate_jewish_tax_farmers:0 "Jewish Tax Farmers"
 estate_jewish_tax_farmers_desc:0 "Grant the Jewish merchants the privilege of collecting taxes."
 estate_mecenates:0 "Mischane"
 estate_nobles_chr_seimski_statuty:0 "Seimski Statuty"
 estate_nobles_chr_seimski_statuty_desc:0 "Codify the starshyna's parliamentary statutes as noble privilege, trading absolutism for steadier backing in every rada and diet."
 estate_nobles_het_hetman_power:0 "Hetman Autocracy"
 estate_nobles_het_hetman_power_desc:0 "The Hetman concentrates power in his hands, transforming the Cossack polity into an autocratic state. This enables efficient governance and reform but angers the starshyna who lose their traditional privileges."
 estate_nobles_het_starshyna_class:0 "Starshyna Privileges"
 estate_nobles_het_starshyna_class_desc:0 "The starshyna (officer class) forms the administrative and military elite of the Hetmanate. These Cossack officers hold extensive privileges and govern provinces, providing experienced leadership but demanding influence in state affairs."
 euro_monarchy.1a:0 "May God have mercy on their souls."
 euro_monarchy.1d:0 "The Aristocracy has been stripped of its power as a result of the monarchy's reform, and the pent-up resentment and rage of the peasants have led to attacks on the nobility. In more extreme cases, the nobility has been tortured or executed in their own homes, which have subsequently been seized by revolutionary guards."
 euro_monarchy.1t:0 "Purification of the Aristocracy"
 euro_monarchy.2a:0 "Is there still any hope for us?"
 euro_monarchy.2d:0 "Many nobles have taken up arms against us in response to the neutral purge of the nobility, and they have occupied the capital, causing great destabilization as the government has been unable to function effectively."
 euro_monarchy.2t:0 "Reactionary Uprising"
 euro_monarchy.3a:0 "Whose claim to the throne is the strongest? Only time will tell, but for now, we must choose our alliances carefully and prepare for a long and bloody struggle."
 euro_monarchy.3d:0 "The death of our beloved monarch has plunged our nation into chaos as rival factions struggle for control of the throne. The future of our country hangs in the balance as the various claimants vie for power and the support of the people."
 euro_monarchy.3t:0 "The Battle for the Throne"
 euro_monarchy_reform:0 "Neo Monarchy"
 euro_monarchy_reform_desc:0 "The king must have the approval of the parliament to ascend to the throne, and holds little to no authority beyond directing the sessions of the rada."
 excellent_fish_harvest:0 "Excellent Fish Harvest"
 exhausted_raiders:0 "Exhausted Raiders"
 expand_into_transylvania_desc:0 "The rich lands of Transylvania would provide us with resources and strategic depth."
 expand_into_transylvania_title:0 "Expand into Transylvania"
 expanded_register:0 "Expanded Cossack Register"
 failed_orthodox_crusade:0 "Failed Orthodox Crusade"
 failed_orthodox_crusade_desc:0 "Our crusade has ended in shameful defeat."
 fighting_for_hetmanate:0 "Fighting for the Hetmanate"
 force_convert_province_decision_desc:0 "We can forcibly convert this province to Russian Orthodox faith."
 force_convert_province_decision_title:0 "Force Convert Province"
 forced_conversions:0 "Forced Conversions"
 forced_religious_union:0 "Forced Religious Union"
 forced_russification:0 "Forced Russification"
 forced_russification_desc:0 "Non-Russian peoples must adopt Russian language, culture, and custom for the empire's unity."
 forest_and_field:0 "Forest and Field"
 forest_and_field_desc:0 "Minsk sits at the forest-steppe transition, allowing diverse economic development. We benefit from both timber resources and agricultural production."
 forest_wardens:0 "Forest Wardens"
 forest_wardens_desc:0 "Dense forests breed warriors skilled in ambush and guerrilla tactics. Our light infantry excel at rapid strikes and partisan warfare, making occupation of our lands costly for any invader."
 form_cossack_host_desc:0 "Formalize our military society as a Cossack Host, a permanent armed community organized for frontier defense and expansion. This will elevate our status and strengthen our military traditions."
 form_cossack_host_title:0 "Proclaim Cossack Host"
 formalize_host_democracy_desc:0 "Codify the liberties of the Host, ensuring that all Cossacks have a voice in the General Rada and preserving our unique egalitarian traditions."
 formalize_host_democracy_title:0 "Formalize Liberties of the Host"
 formalized_host_democracy:0 "Formalized Liberties of the Host"
 former_qasim_khanate:0 "Former Qasim Khanate"
 former_qasim_khanate_desc:0 "This territory was once the semi-autonomous Qasim Khanate, and its Tatar military traditions remain strong."
 fortified_against_crusade:0 "Fortified Against Crusade"
 fortified_against_crusade_desc:0 "We have prepared defenses against the Orthodox crusade."
 fortified_border:0 "Fortified Border"
 fortified_dnieper_city:0 "Fortified Dnieper City"
 fortified_dnieper_city_desc:0 "This city is protected by modern fortifications."
 fortified_frontier:0 "Fortified Frontier"
 fortified_frontier_desc:0 "Our frontier fortresses deter raids and protect our people."
 fortified_settlements:0 "Fortified Settlements"
 fortify_dniester_estuary_desc:0 "The strategic importance of the Dniester Estuary demands powerful fortifications. The fortress of Akkerman must become impregnable to protect our trade routes and deter enemies."
 fortify_dniester_estuary_title:0 "Fortify Dniester Estuary"
 fortify_eastern_borders_desc:0 "We must secure our eastern frontiers with proper fortifications to defend against any threats."
 fortify_eastern_borders_title:0 "Fortify Eastern Borders"
 fought_alongside_cossacks:0 "Fought Alongside Cossacks"
 found_maramures_capital_desc:0 "Establishing a strong capital in Maramures will solidify our rule in the region."
 found_maramures_capital_title:0 "Found Maramures Capital"
 frontier_centralization:0 "Frontier Centralization"
 frontier_endurance:0 "Frontier Endurance"
 frontier_endurance_desc:0 "Centuries of border warfare have bred exceptional resilience. We have never been fully conquered despite facing overwhelming odds."
 frontier_fortress:0 "Frontier Fortress"
 frontier_fortress_desc:0 "A strong fortress guards this frontier province."
 frontier_liberties:0 "Frontier Liberties"
 frontier_military_culture:0 "Frontier Military Culture"
 galician_sejm_assembly:0 "Halych Sejm Assembly"
 garrison_and_mission:0 "Garrison and Mission"
 gatherers_tribute:0 "Gatherers of tribute"
 gatherers_tribute_desc:0 "Due to our state's legal authority to levy tribute, these areas were taxed in a manner akin to that of the Golden Horde, following the model of Muscovy. The benefits of the company they established to carry out this duty are still present today."
 gathering_raiders:0 "Gathering Raiders"
 gathering_russian_lands:0 "Gathering of Russian Lands"
 gathering_russian_lands_decision_desc:0 "We can pursue unification of all Russian territories under our rule."
 gathering_russian_lands_decision_title:0 "Gathering of Russian Lands"
 gdl_cultural_legacy:0 "Grand Duchy Legacy"
 general_rada_authority:0 "General Rada Authority"
 general_rada_recent_cd:0 "Recent General Rada"
 glinski_advisors_muscovy:0 "Glinski Advisors"
 glinski_advisors_muscovy_desc:0 "The Glinski princes bring valuable military and diplomatic expertise to Muscovite service, strengthening our court."
 glinski_appeasement:0 "Glinski Appeasement"
 glinski_appeasement_desc:0 "Concessions granted to the powerful Glinski family to maintain their loyalty, at considerable cost to local revenue."
 glinski_loyalty:0 "Glinski Loyalty"
 glinski_loyalty_desc:0 "The powerful Glinski family remains loyal to our cause, providing military expertise and Tatar cavalry."
 glinski_tatar_settlement:0 "Glinski Tatar Settlement"
 glinski_tatar_settlement_desc:0 "Tatar cavalry loyal to the Glinski princes have settled these lands, providing both military strength and protection against steppe raids."
 governmental_disruption:0 "Governmental Disruption"
 governmental_disruption_desc:0 "Following the recent reforms to the monarchy, the government has become increasingly unstable. Corruption and infighting have taken hold, and the future of the state is uncertain. It is up to the ruler to restore order and stability, or risk the collapse of the entire realm."
 governmental_disruption_title:0 "Governmental Disruption"
 grain_export_economy:0 "Grain Export Economy"
 grain_export_economy_desc:0 "Our economy benefits from large-scale grain exports."
 grain_export_hub:0 "Grain Export Hub"
 grain_export_hub_desc:0 "A major center for grain exports."
 grain_trade_agreement:0 "Grain Trade Agreement"
 grand_duchy_legacy:0 "Grand Duchy Legacy"
 grand_duchy_legacy_desc:0 "We keep the Lithuanian Statutes, the land courts and the sejmiks that go with them. Magdeburg charters govern the towns, and the szlachta's privileges are read out at every assembly."
 great_hauptmann_reform:0 "Great Hauptmann"
 great_hauptmann_reform_desc:0 "The Great Hauptmann is the elected leader of the Ruthenian and Cossack states, who has the authority to claim new lands and enact administrative policies."
 greek_catholic:0 "Greek Catholic"
 greek_catholic_center:0 "Center of Greek Catholic Faith"
 greek_catholic_church_patronage:0 "Patronage of Greek Catholic Church"
 greek_catholic_diocese:0 "Greek Catholic Diocese"
 greek_catholic_education_decision_desc:0 "We should found schools and seminaries to educate Greek Catholic clergy and spread learning."
 greek_catholic_education_decision_title:0 "Establish Greek Catholic Educational Network"
 greek_catholic_latin_cooperation:0 "Greek Catholic-Latin Cooperation"
 greek_catholic_missionary_activity:0 "Greek Catholic Missionary Campaign"
 greek_catholic_missionary_campaign_decision_desc:0 "We can organize a major missionary effort to spread the Greek Catholic faith throughout our lands."
 greek_catholic_missionary_campaign_decision_title:0 "Launch Greek Catholic Missionary Campaign"
 greek_catholic_orthodox_dialogue:0 "Greek Catholic-Orthodox Dialogue"
 greek_catholic_printing_press:0 "Greek Catholic Printing Press"
 greek_catholic_reformation_active:0 "Greek Catholic Reformation"
 greek_catholic_religion_desc:0 "The Greek Catholic Church keeps the Byzantine liturgy, the Slavonic books and a married parish clergy, and commemorates the Pope. It answers to Rome in doctrine and to its own bishops in everything else."
 greek_catholic_synodal_administration:0 "Greek Catholic Synodal Administration"
 hab_base_sprite_pack:0 "Habsburg Unit Pack"
 hanseatic_connections:0 "Hanseatic Connections"
 hanseatic_connections_desc:0 "Trade with the Hanseatic League brings Western technology and ideas to our lands, offering an alternative to Moscow-dominated Rus' culture."
 harass_tatar.1a:0 "How much longer can we endure this?"
 harass_tatar.1d:0 "Our people are worn out and unable to generate either taxes or soldiers to fill our ranks, as we have long been the target of constant Tatar invasions that have destroyed our villages and caused several famines. As long as the Tatars are not driven from our territories, we will endure their yoke."
 harass_tatar.1t:0 "The Tatar Harassment"
 hereditary_hetman_succession:0 "Hereditary Hetman Succession"
 het_abolished:0 "Hetmanate Abolished"
 het_absorb_moldova_desc:0 "Bring Moldova under Hetmanate protection, either as vassal or conquered territory."
 het_absorb_moldova_title:0 "Absorb Moldova"
 het_academy_enlightenment_reform:0 "Academy Enlightenment"
 het_academy_enlightenment_reform_desc:0 "Under Hetman Ivan Mazepa's patronage, the Kyiv-Mohyla Academy flourishes as Eastern Europe's greatest center of learning. Graduates spread baroque culture, Orthodox scholarship, and administrative expertise throughout the Hetmanate, creating an educated elite that transforms Cossack society."
 het_academy_excellence:0 "Academy of Excellence"
 het_academy_excellence_desc:0 "The Kyiv-Mohyla Academy is renowned throughout Eastern Europe."
 het_academy_network:0 "Academy Network"
 het_anti_catholic_crusader:0 "Anti-Catholic Crusader"
 het_autonomy_ending:0 "Autonomy in Twilight"
 het_autonomy_guaranteed:0 "Autonomy Guaranteed"
 het_autonomy_guaranteed_desc:0 "Our overlord has promised to respect our traditional rights."
 het_autonomy_respected:0 "Respected Hetmanate Autonomy"
 het_autonomy_threatened:0 "Autonomy Threatened"
 het_autonomy_violated:0 "Violated Hetmanate Rights"
 het_balanced_development:0 "Balanced Regional Development"
 het_balanced_development_desc:0 "We develop both banks of the Dnieper equally."
 het_black_sea_ambition_desc:0 "Build a fleet to project Cossack power across the Black Sea."
 het_black_sea_ambition_title:0 "Black Sea Ambitions"
 het_black_sea_fleet:0 "Black Sea Fleet"
 het_black_sea_trade_desc:0 "Access to Black Sea ports will allow us to export our abundant grain and import valuable goods."
 het_black_sea_trade_title:0 "Establish Black Sea Trade"
 het_break_polish_yoke_desc:0 "Liberate the historic Ruthenian lands of Kyiv, Volhynia, and Podillia from Polish-Lithuanian domination."
 het_break_polish_yoke_title:0 "Break the Polish Yoke"
 het_bulwark_christendom_desc:0 "Stand as the Orthodox defender in the Balkans against Turkish expansion."
 het_bulwark_christendom_title:0 "Bulwark of Christendom"
 het_bulwark_of_orthodoxy:0 "Bulwark of Orthodoxy"
 het_centralized_control:0 "Centralized Control"
 het_centralized_control_desc:0 "The Hetman exercises strong central authority."
 het_collegium_control_reform:0 "Little Russian Collegium"
 het_collegium_control_reform_desc:0 "A collegium of Russian officers now sits above the hetman, auditing the treasury and confirming appointments. The bulava is still carried in procession, and the collegium's seal is on the orders."
 het_collegium_graduates:0 "Kyiv-Mohyla Academy Graduates"
 het_compile_legacy_chronicles_desc:0 "Systematize the political lessons of the Hetmanate from early host commanders to late collegial governance."
 het_compile_legacy_chronicles_title:0 "Compile the Legacy Chronicles"
 het_consolidated_power:0 "Consolidated Hetman Power"
 het_constantinople_liberator:0 "Liberator of Constantinople"
 het_cossack_cavalry_elite:0 "Elite Cossack Cavalry"
 het_cossack_host_desc:0 "Gather a formidable cavalry army worthy of the Cossack tradition."
 het_cossack_host_title:0 "Assemble the Host"
 het_cossack_raids.1.a:0 "Raid Ottoman territories"
 het_cossack_raids.1.b:0 "Raid Polish lands"
 het_cossack_raids.1.c:0 "Raid Crimean Tatars"
 het_cossack_raids.1.cancel:0 "Cancel the raid"
 het_cossack_raids.1.d:0 "The Host has assembled and awaits orders. Where shall we strike?"
 het_cossack_raids.1.t:0 "Organize the Raid"
 het_cossack_raids.2.a:0 "Ready the counterattack!"
 het_cossack_raids.2.b:0 "Strengthen our defenses"
 het_cossack_raids.2.d:0 "Cossack cavalry has raided our borderlands, burning villages and seizing plunder."
 het_cossack_raids.2.t:0 "Cossack Raiders Strike!"
 het_cossack_raids.3.a:0 "Strike hard!"
 het_cossack_raids.3.d:0 "Our cavalry has penetrated deep into enemy territory. The raid will be legendary!"
 het_cossack_raids.3.t:0 "Deep Raid"
 het_cossack_raids.4.a:0 "We must endure"
 het_cossack_raids.4.d:0 "The Hetmanate has unleashed a devastating punitive raid against our troops."
 het_cossack_raids.4.t:0 "Cossack Punitive Strike"
 het_cossack_raids.5.a:0 "This is an outrage!"
 het_cossack_raids.5.b:0 "We cannot respond"
 het_cossack_raids.5.d:0 "Cossack raiders have struck deep into our heartland, leaving destruction and humiliation."
 het_cossack_raids.5.t:0 "Deep Raid Devastation"
 het_cossack_raids.6.a:0 "Share it among the Host"
 het_cossack_raids.6.b:0 "Fill the treasury"
 het_cossack_raids.6.d:0 "Our raiders have returned with considerable treasure. How shall we handle the spoils?"
 het_cossack_raids.6.t:0 "Raid Spoils"
 het_cultural_center:0 "Cultural Renaissance"
 het_cultural_golden_age:0 "Mazepa's Golden Age"
 het_danube_frontier_desc:0 "Establish the Hetmanate as a power on the lower Danube."
 het_danube_frontier_title:0 "The Danube Frontier"
 het_danube_trade:0 "Danube Trade"
 het_danube_trade_charter_desc:0 "Establish formal trade rights along the Danube River."
 het_danube_trade_charter_title:0 "Danube Trade Charter"
 het_danube_trade_hub:0 "Danube Trade Hub"
 het_danube_watch:0 "Danube Watch"
 het_deep_penetration_raid_desc:0 "Strike deep into the enemy heartland with elite cavalry, leaving devastation in our wake."
 het_deep_penetration_raid_title:0 "Deep Penetration Raid"
 het_deep_raid_vendetta:0 "Deep Raid Vendetta"
 het_deep_raided:0 "Devastated by Raid"
 het_defend_orthodox_desc:0 "As Orthodox Christians under Catholic or Muslim neighbors, we must protect our faith and resist forced conversions."
 het_defend_orthodox_title:0 "Defend the Orthodox Faith"
 het_defiant_hetmanate:0 "Defiant Hetmanate"
 het_divided_state:0 "Divided Hetmanate"
 het_dnieper_control_desc:0 "Control the vital Dnieper River trade route from Kyiv to the Black Sea."
 het_dnieper_control_title:0 "Masters of the Dnieper"
 het_dnieper_hub:0 "Dnieper Trade Hub"
 het_elective_rule:0 "Elective Hetmanate"
 het_empower_starshyna_desc:0 "The starshyna officer class demands greater influence. Granting them power will ensure their loyalty and support."
 het_empower_starshyna_title:0 "Empower the Starshyna Council"
 het_enhanced.1.a:0 "The Rada must elect all Hetmans—liberty is sacred!"
 het_enhanced.1.b:0 "Allow hereditary succession—stability demands it."
 het_enhanced.1.c:0 "Compromise: limited hereditary rights with Rada approval."
 het_enhanced.1.d:0 "A critical debate rages in the Hetmanate: should the office of Hetman remain elective, as in the free Sich tradition, or should we allow hereditary succession to ensure stability and prevent Russian interference? The Starshyna elite increasingly favor dynasty, while common Cossacks defend their right to elect. This decision will define our political future."
 het_enhanced.1.t:0 "The Question of Hetman Succession"
 het_enhanced.2.a:0 "Grant the Starshyna their privileges."
 het_enhanced.2.b:0 "The Hetman answers to no oligarchs!"
 het_enhanced.2.d:0 "The Starshyna—the Cossack officer class—have evolved into a wealthy landed nobility. They demand formal recognition of their privileges, including hereditary estates, tax exemptions, and greater political power. Granting these demands would transform the Hetmanate into an oligarchy, but refusing risks their rebellion."
 het_enhanced.2.t:0 "Starshyna Oligarchy Demands"
 het_enhanced.3.a:0 "Prioritize the Left Bank—Russia is our protector."
 het_enhanced.3.b:0 "Maintain unity of both banks at all costs."
 het_enhanced.3.c:0 "Focus on the Right Bank—Poland offers more autonomy."
 het_enhanced.3.d:0 "The Hetmanate straddles the Dnieper River, divided between Left Bank (under Russian influence) and Right Bank (contested with Poland). The Andrussovo Treaty formalized this division, but we must decide where to concentrate our resources and political attention. This choice will determine our alignment for decades to come."
 het_enhanced.3.t:0 "Left Bank or Right Bank?"
 het_enhanced.4.a:0 "Accept the Russian candidate—pragmatism prevails."
 het_enhanced.4.b:0 "We elect our own Hetman! Our autonomy is not negotiable!"
 het_enhanced.4.d:0 "The Tsar's agents arrive at the Rada with a 'recommendation' for our next Hetman—a candidate loyal to Moscow who will ensure compliance with Russian interests. We can accept this interference to preserve good relations, or assert our autonomy by electing our own choice, risking Russian displeasure."
 het_enhanced.4.t:0 "Russian Interference in Elections"
 het_enhanced.5.a:0 "Ally with Sweden—independence or death!"
 het_enhanced.5.b:0 "Remain loyal to Russia. Mazepa's gambit is madness."
 het_enhanced.5.d:0 "Hetman Ivan Mazepa faces an impossible choice. The Great Northern War rages, and Sweden's Charles XII offers alliance against Russia. This could be our chance for true independence—but if Sweden loses, the consequences will be catastrophic. The fate of the Hetmanate hangs on this decision."
 het_enhanced.5.t:0 "The Mazepa Crisis: Swedish Alliance?"
 het_enhanced.6.a:0 "Accept the Collegium. Resistance is futile."
 het_enhanced.6.b:0 "We will not bow to Russian bureaucrats!"
 het_enhanced.6.d:0 "Tsar Peter establishes the Little Russian Collegium—a Russian oversight body that will supervise the Hetman's decisions and gradually absorb our autonomy into the imperial administration. This is the beginning of the end of Hetmanate independence. Do we accept this subjugation, or resist?"
 het_enhanced.6.t:0 "The Little Russian Collegium"
 het_enhanced.7.a:0 "Accept abolition. The Hetmanate's time has passed."
 het_enhanced.7.b:0 "Fight for our freedom! War against the Empire!"
 het_enhanced.7.c:0 "Negotiate for limited cultural and administrative autonomy."
 het_enhanced.7.d:0 "Catherine II has issued the decree: the office of Hetman is abolished. The Hetmanate will be dissolved and fully integrated into the Russian Empire as Little Russia Governorate. Our centuries-old Cossack autonomy ends today—unless we are willing to fight for it."
 het_enhanced.7.t:0 "Abolition of the Hetmanate"
 het_enhanced.8.a:0 "Revive the ancient Cossack traditions!"
 het_enhanced.8.b:0 "Modernize as a European state."
 het_enhanced.8.d:0 "Despite surviving the threat of abolition, we face a choice about who we are. Should we revive the traditional Cossack military culture and old liberties that defined our ancestors? Or should we embrace European modernity and transform into a modern state?"
 het_enhanced.8.t:0 "Cossack Revival Movement"
 het_establish_printing_press_desc:0 "A press of our own would set the liturgy and the statutes in our own recension and end the buying of books from Lviv on Latin terms. The censors of three realms will take an interest."
 het_establish_printing_press_title:0 "Establish Printing Press"
 het_establish_regiments_desc:0 "Dividing our territory into military regiments will create an efficient administrative structure and strengthen our military readiness."
 het_establish_regiments_title:0 "Establish Regimental System"
 het_expand_academy_desc:0 "The Kyiv-Mohyla Academy is a beacon of learning. Expanding it will spread enlightenment and strengthen our own customs."
 het_expand_academy_title:0 "Expand Kyiv-Mohyla Academy"
 het_flavor.1.a:0 "Elect the military commander"
 het_flavor.1.b:0 "Elect the diplomat"
 het_flavor.1.c:0 "Elect the administrator"
 het_flavor.1.d:0 "The position of Hetman - the elected leader of the Cossack Hetmanate - must be filled. The starshyna (officer class) and colonels of the regiments gather to choose our new leader. Three candidates stand out: a brilliant military commander, a skilled diplomat with foreign connections, and an experienced administrator."
 het_flavor.1.t:0 "Election of the Hetman"
 het_flavor.10.a:0 "Strengthen the Orthodox church"
 het_flavor.10.b:0 "Balance church and state"
 het_flavor.10.d:0 "Kyiv has historically been the center of Orthodox Christianity in Rus'. The Metropolitan of Kyiv holds immense spiritual authority, and control over the church brings both legitimacy and political power. Should we strengthen the church's role in our state, or maintain clearer separation between spiritual and temporal authority?"
 het_flavor.10.t:0 "The Orthodox Metropolia"
 het_flavor.11.a:0 "Expand grain exports"
 het_flavor.11.b:0 "Ensure domestic food security"
 het_flavor.11.d:0 "The Hetmanate's rich black soil produces abundant grain harvests. Access to Black Sea ports allows us to export this grain to Constantinople, enriching our treasury. However, focusing on export agriculture may leave us vulnerable to crop failures and market fluctuations."
 het_flavor.11.t:0 "The Grain Trade"
 het_flavor.12.a:0 "Accept Russian control"
 het_flavor.12.b:0 "Resist quietly and preserve what we can"
 het_flavor.12.d:0 "Tsar Peter II has abolished the Hetmanate's independence, replacing the Hetman with the Little Russian Collegium - a Russian-controlled administrative board. This marks the effective end of Cossack autonomy. Our traditional rights and freedoms are being systematically dismantled."
 het_flavor.12.t:0 "The Little Russian Collegium"
 het_flavor.13.a:0 "Support Russia fully"
 het_flavor.13.b:0 "Provide minimal support"
 het_flavor.13.d:0 "Russia is at war with the Ottoman Empire, and the Hetmanate is expected to contribute troops and resources to the Russian war effort. While defeating the Turks serves our interests, exhausting ourselves in Russia's wars weakens our position and drains our treasury."
 het_flavor.13.t:0 "The Russian-Turkish Wars"
 het_flavor.14.a:0 "There is nothing we can do..."
 het_flavor.14.b:0 "Fight to the last!"
 het_flavor.14.d:0 "Catherine II has issued her final decree: the Hetmanate is abolished, and our lands will be fully integrated into the Russian Empire. After over a century of autonomy, Cossack self-government ends. Our regiments are disbanded, our privileges revoked, and Ukraine becomes merely another province of Russia."
 het_flavor.14.t:0 "Abolition of the Hetmanate"
 het_flavor.2.a:0 "A great day for Ukrainian learning!"
 het_flavor.2.d:0 "Metropolitan Petro Mohyla has founded an academy in Kyiv that will become the leading center of Orthodox learning in Eastern Europe. The Academy teaches theology, philosophy, rhetoric, and sciences, blending Orthodox tradition with European scholastic methods. This institution will train generations of Ukrainian intellectuals and strengthen our own customs."
 het_flavor.2.t:0 "Foundation of Kyiv-Mohyla Academy"
 het_flavor.3.a:0 "Sign the treaty with Russia"
 het_flavor.3.b:0 "Continue fighting alone"
 het_flavor.3.d:0 "After years of devastating war with Poland, Hetman Bohdan Khmelnytsky has convened a council at Pereiaslav. The Russian Tsar offers military protection and recognition of our autonomy in exchange for vassalage. Many see this as our only hope for survival, though some fear it means exchanging Polish overlordship for Russian. The fate of the Hetmanate hangs in the balance."
 het_flavor.3.t:0 "The Pereiaslav Council (1654)"
 het_flavor.4.a:0 "Strengthen the regimental system"
 het_flavor.4.b:0 "Centralize under the Hetman"
 het_flavor.4.d:0 "The Hetmanate is organizing its territory into military-administrative units called regiments (polky). Each regiment encompasses several cities and towns, with a colonel commanding both civil and military affairs. This system combines Cossack military traditions with effective territorial administration."
 het_flavor.4.t:0 "The Regimental System"
 het_flavor.5.a:0 "Compromise with the starshyna"
 het_flavor.5.b:0 "Assert Hetman authority"
 het_flavor.5.c:0 "Call a general council to resolve this"
 het_flavor.5.d:0 "The starshyna - the Cossack officer class - have grown wealthy and powerful, resembling a traditional nobility. They resist the Hetman's attempts to centralize power, demanding greater privileges and local autonomy. This conflict between centralization and local rights threatens to tear the Hetmanate apart."
 het_flavor.5.t:0 "Starshyna Opposition"
 het_flavor.6.a:0 "Support Mazepa's reforms"
 het_flavor.6.b:0 "Maintain traditional liberties"
 het_flavor.6.d:0 "Hetman Ivan Mazepa has brought unprecedented prosperity and cultural flowering to the Hetmanate. He patronizes arts and architecture, expands the Kyiv-Mohyla Academy, builds magnificent Baroque churches, and runs an effective administration. Under his enlightened autocracy, Ukrainian culture reaches its zenith, though some worry about excessive centralization of power."
 het_flavor.6.t:0 "Mazepa's Golden Age"
 het_flavor.7.a:0 "Swear renewed loyalty to Russia"
 het_flavor.7.b:0 "Face the consequences of rebellion"
 het_flavor.7.d:0 "Hetman Mazepa's alliance with Sweden against Russia has ended in catastrophic defeat at Poltava. The Russian army has crushed the Swedish-Cossack forces, and Tsar Peter I exacts brutal revenge. Many of our cities are burned, thousands killed, and the Hetmanate's autonomy severely curtailed. This is the darkest hour in our history."
 het_flavor.7.t:0 "The Battle of Poltava (1709)"
 het_flavor.8.a:0 "Develop the Left Bank"
 het_flavor.8.b:0 "Focus on the Right Bank"
 het_flavor.8.c:0 "Balance both regions"
 het_flavor.8.d:0 "The Hetmanate is divided by the Dnieper River into two distinct regions. The Left Bank remains under our control with Russian protection, while the Right Bank has returned to Polish rule. This division weakens our nation and separates Ukrainian families. Should we focus on strengthening what we control, or attempt to reunify both banks?"
 het_flavor.8.t:0 "Left Bank vs Right Bank"
 het_flavor.9.a:0 "Encourage free settlements"
 het_flavor.9.b:0 "Establish military colonies"
 het_flavor.9.d:0 "The Sloboda Ukraine region offers opportunities for colonization. Free Cossack settlements (slobody) can be established here with special privileges to attract settlers fleeing serfdom. These communities will strengthen our frontier and increase our population, though they may prove difficult to control."
 het_flavor.9.t:0 "Sloboda Ukraine Settlement"
 het_forced_integration:0 "Forced Integration"
