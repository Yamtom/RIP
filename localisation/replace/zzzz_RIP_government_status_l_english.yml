 rip_gov_rev_title:0 "§YInstitutional Resolutions§!"
 rip_gov_rev_title_tt:0 "Institutional resolutions: the towns' charters, the chancery's rolls and the Cossack register can each pass one paid resolution of ten years, and only one resolution can stand in the whole realm.\nThe buttons are in the government mechanics box on the left of this window; their tooltips say what each one costs, what it does and why it is refused."
