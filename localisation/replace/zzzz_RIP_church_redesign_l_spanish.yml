 rip_church_gui_parish_list_title_tt:0 "Communities whose rights we guarantee, Orthodox and Catholic. These province-level counts are a gameplay abstraction, not an exact historical parish or canonical status, and not evidence of voluntary acceptance of the Union. The Orthodox and Catholic counts are gameplay groupings of provinces, not historical diocesan boundaries. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 rip_church_gui_parish_register_active:0 "§bCommunity rights are guaranteed in some of our provinces.§!\nSelect a province to inspect or revoke its guarantee."
 rip_church_gui_parish_register_active_tt:0 "Province-level gameplay groupings, not exact canonical parish statuses and not evidence of voluntary Union acceptance.\n\n§HOrthodox communities§!\nProvince · Faith · Rights\n\n§HCatholic communities§!\nProvince · Faith · Rights\n\nSelect an owned province with guaranteed rights to inspect or revoke its guarantee."
