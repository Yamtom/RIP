 desc_het_orthodox_support:0 "Cossack missionaries strengthen Orthodox faith."

 het_orthodox_alliance_war:0 "Orthodox Alliance War"
 desc_het_orthodox_alliance_war:0 "Orthodox allies fight together in holy war."

 het_danube_trade_hub:0 "Danube Trade Hub"
 desc_het_danube_trade_hub:0 "A thriving trade hub on the Danube."

