 desc_west_ukr_ruthenian_nobility:0 "Our nobility maintains distinct Ruthenian traditions and custom."
 desc_west_ukr_ruthenian_pride:0 "Local custom strengthens resolve."
 desc_west_ukr_sarmatism:0 "Sarmatist ideas shape elite culture."
 desc_west_ukr_soft_on_cossacks:0 "A conciliatory stance toward Cossacks."
 desc_west_ukr_tatar_raid_damage:0 "Raids cause damage and disruption."
 desc_wine_vintage_fame:0 "Our wines have gained international fame."
 desc_winter_raid_season:0 "Desperate winter raids target enemy supplies."
 desc_zamosc_synod_eastern_preservation:0 "We have preserved Orthodox liturgical traditions within the Union."
 desc_zamosc_synod_latinization:0 "The Synod of Zamosc has latinized the Uniate Church, eroding Eastern traditions."
 desc_zaporozhian_charter:0 "Frontier rights stabilize the host and calm unrest."
 desc_zaporozhian_sich_capital:0 "The Sich capital fortifies our frontier and anchors Cossack self-rule."
 desc_zaporozhian_sich_founded:0 "A permanent Sich has been raised, serving as the heart of Zaporozhian freedom."
 desc_zasechnaya_cherta:0 "The Great Abatis Line - a massive defensive system protecting our southern frontier from steppe raids."
 desc_zasechnaya_cherta_province:0 "This province is protected by the Zasechnaya Cherta defensive system with its fortifications, zaseki (felled tree barriers), and garrison troops."
 desc_zaz_army:0 "Our newly-formed army is a formidable force that has been trained and equipped with the latest weapons and tactics. This well-disciplined and battle-hardened army is ready to take on any enemy that dares to threaten our nation. With experienced commanders at the helm, our army is fully prepared to defend our borders and expand our territories."
 desc_zaz_caravan:0 "Our caravans are the lifeblood of our trade network. We must protect them from any threats and ensure they reach their destinations safely."
 desc_zaz_catholic_spread:0 "The spread of Catholicism in our lands has caused concern among our Orthodox subjects, and we must take measures to prevent unrest and maintain religious harmony."
 desc_zaz_chaiky_fleet:0 "An elite chaiky flotilla patrols the rivers and Black Sea."
 desc_zaz_chaiky_fleet_active:0 "Our swift chaiky boats strike terror into the hearts of Ottoman and Crimean coastal settlements, enriching our Host through plunder and freed captives."
 desc_zaz_chaiky_raid_cooldown:0 "Our chaiky fleet needs time to refit and recruit new sailors before launching another raid."
 desc_zaz_chaiky_raiders:0 "Our chaiky flotillas terrorize enemy coasts and bring home plunder."
 desc_zaz_colonization_effort:0 "Zaporozhian settlers tame wild steppe into arable land."
 desc_zaz_connections:0 "Zaporozhia is located at a strategic crossroads, with connections to many the neighboring regions. As a result, we have the opportunity to establish valuable trade relationships, alliances, and military access agreements with our neighbors. We should explore these opportunities and seek to establish strong connections with the surrounding powers."
 desc_zaz_cossack_democracy:0 "The Sich Rada's tradition of rule of the war council ensures that leadership is earned through merit, not inherited through blood."
 desc_zaz_democratic_rada:0 "The General Rada has asserted its elective authority."
 desc_zaz_despised_by_the_cossacks:0 "Our actions have earned us the enmity of the Cossack communities."
 desc_zaz_failed_raid:0 "Our raid ended in disaster - ships lost, warriors captured or killed. We must rebuild our chaiky fleet and restore our naval reputation."
 desc_zaz_faith:0 "Our faith is what unites us and gives us strength. We must stay true to our beliefs and defend them against any who seek to undermine them."
 desc_zaz_free_cossacks_spirit:0 "Our cossacks remain free and unregistered, preserving our old liberties but risking conflict with foreign powers."
 desc_zaz_grateful_cossacks:0 "The Cossacks are grateful for our fair treatment."
 desc_zaz_great_rada_held:0 "The Sich Rada has met in full assembly, renewing the bonds of the Rada that unite all free Cossacks and making great decisions for the future of our Host."
 desc_zaz_great_raid:0 "The Host is prepared for a major raid deep into enemy territory."
 desc_zaz_insult_tur:0 "Coming soon"
 desc_zaz_islam_spread:0 "The followers of Islam have been growing in number in our lands, and we must be vigilant to ensure they do not threaten the stability of our nation."
 desc_zaz_liberator_of_slaves:0 "Cossack raids have freed captives and struck at the slave trade."
 desc_zaz_lit_kill:0 "The Zaporozhian Cossacks are known for their love of literature and poetry, but this particular piece is darker than most. It speaks of death and destruction, and the futility of glory in the face of it. Perhaps it reflects the recent events in our nation's history, or perhaps it is simply the product of a troubled mind. Either way, it is a stark reminder of the harsh realities of life in this tumultuous world."
 desc_zaz_loyal_subject:0 "The Sich has accepted its subordinate status."
 desc_zaz_missionaries:0 "Missionaries from various countries have come to spread their faith in our lands, but we must be cautious not to let foreign influence weaken our own beliefs."
 desc_zaz_nalyvaiko_cossack_lands_confiscated:0 "We have confiscated land from rebellious Cossacks."
 desc_zaz_nalyvaiko_peace_offer:0 "We have reached a settlement with the Cossack rebels."
 desc_zaz_no_register:0 "We have cast off the chains of the register entirely! Every man who can ride and fight is a free Cossack, though this defiance may provoke our overlords' wrath."
 desc_zaz_order_in_ukraine:0 "We have established order in the Ukrainian regions, limiting Cossack raids."
 desc_zaz_ortho:0 "We take great pride in the strength and unity of our Orthodox faith, which serves as a fortress of our nation's custom and speech."
 desc_zaz_orthodox_champions:0 "We are recognized as defenders of the Orthodox faithful."
 desc_zaz_plc_buff:0 "The Commonwealth is a beacon of hope in a tumultuous region. Its strength and stability are vital to the balance of power in Eastern Europe, and its continued growth and prosperity must be ensured. As our neighbor, it is in our best interest to maintain friendly relations and seek opportunities for cooperation and mutual benefit."
 desc_zaz_polish_autonomy:0 "A degree of Polish-recognized autonomy has been secured for the Host."
 desc_zaz_prepped:0 "The Zaporozhian Cossacks are always prepared for battle. They have honed their skills in warfare and are ready to defend their land and their people at any cost. With their weapons sharpened and their spirits high, they are a force to be reckoned with."
 desc_zaz_proper_khan:0 "Right Center"
 desc_zaz_rada_cooldown:0 "The Great Rada has recently convened; we must allow time for its decisions to be implemented before calling another assembly."
 desc_zaz_rebellious_cossacks:0 "The Zaporozhian Cossacks resist Russian dominance and plot rebellion."
 desc_zaz_recent_relocation:0 "The Host is still settling into its new location; another relocation so soon would cause too much disruption."
 desc_zaz_register_expanded:0 "More Cossacks have been added to the official register, providing steady manpower and better equipment, though at the cost of some autonomy."
 desc_zaz_register_limited:0 "Only a small number of Cossacks are officially registered and receive pay from our overlords, but this modest arrangement maintains our independence."
 desc_zaz_register_unlimited:0 "The register has been expanded to include all who wish to serve, providing maximum manpower but also binding us more closely to foreign powers."
 desc_zaz_registered_cossacks:0 "Our cossacks are now officially registered with the Crown, bringing military discipline and pay, but at the cost of our traditional freedoms."
 desc_zaz_rivaled_rus:0 "The Russians have dared to rival us, but we shall show them the might of Ottoman Empire!"
 desc_zaz_rivaled_tur:0 "We have been engaged in a long-standing rivalry with Ottoman Empire, constantly competing for dominance in the region."
 desc_zaz_russia_buff:0 "Joint drills with Russian frontier detachments swell our muster rolls and refresh exhausted regiments."
 desc_zaz_russian_help:0 "Veteran Muscovite officers and confessors drill our regiments, steadying volatile marches while spreading Orthodox rites."
 desc_zaz_ruthenia:0 "Cossack sotnias scour hostile marches, razing enemy stockades and funneling their spoils into our frontier war chest."
 desc_zaz_seeking_patron:0 "We have appealed to Moscow or Poland for military support against Ottoman pressure."
 desc_zaz_sich_democracy_enhanced:0 "The Sich's liberties are strengthened."
 desc_zaz_sich_founded:0 "The Zaporozhian Sich has been established as the center of free Cossackdom, where warriors govern themselves through the Sich Rada and elect their own leadership."
 desc_zaz_slave_raiders:0 "Cossack raiders strike slavers, seizing booty and liberating captives."
 desc_zaz_steppe_alliance:0 "Allied steppe hosts coordinate raids, trade, and mutual defense."
 desc_zaz_steppe_brotherhood:0 "Allied steppe hosts coordinate raids, trade, and mutual defense."
 desc_zaz_steppe_raiders:0 "The steppe raiders are a constant threat to our borders. We must keep a close eye on them and be ready to defend ourselves at all times."
 desc_zaz_strong_otaman:0 "The Sich has rallied behind a powerful military leader."
 desc_zaz_successful_raid:0 "Our naval warriors have returned victorious from their raid, bringing plunder and freed captives while spreading fear among our enemies."
 desc_zaz_taxes:0 "Our nation has a long history of coexisting with nomadic peoples, and we have learned much from their ways. By embracing a tax system based on mobility and flexibility, we can tap into the wealth and resources of the vast steppes and deserts that surround us. This will require a shift in mindset and a willingness to adapt, but the rewards could be immense."
 desc_zaz_threaten_tur:0 "For far too long, the Turks have been a thorn in our side! We shall not rest until we have subdued them and secured our dominance in the region!"
 desc_zaz_trade_eff:0 "We must sharpen our merchant craft so that every caravan returns laden and our markets eclipse rival halls."
 desc_zaz_tur_buff:0 "The Ottomans have been a formidable force for far too long. It's time for us to show them that we too can be a force to be reckoned with."
 desc_zaz_tur_trade:0 "Our trade routes are vital to the prosperity of our great nation. We must ensure that we control the flow of goods and wealth."
 desc_zaz_turkish_help:0 "The Zaporozhian Cossacks are in dire need of assistance from Ottoman Empire. Our enemies are numerous and powerful, and we require the aid of a strong ally to ensure our survival. A strategic alliance with the Ottomans could provide us with the military and economic support we need to secure our borders and expand our territory; It is crucial that we establish diplomatic relations with the Ottomans and seek their assistance in our struggles."
 desc_zaz_unchecked_horde:0 "Neighboring huge steppe"
 desc_zaz_united_host:0 "The Zaporozhian Host has overcome internal divisions."
 desc_zich_relocated:0 "The Zaporozhian Sich has been moved to a new stronghold, confounding our enemies and securing our position on new ground."
 desperate_independence_war:0 "Desperate War for Independence"
 desperate_independence_war_desc:0 "We fight a hopeless war against overwhelming odds."
 develop_dniester_estuary_trade_desc:0 "The Dniester Estuary, with its strategic ports at Akkerman and Kilia, offers enormous economic potential. By investing in infrastructure and attracting merchants, we can transform this region into a major Black Sea trade hub."
 develop_dniester_estuary_trade_title:0 "Develop Dniester Estuary Trade"
 dharynsky:0 "Dharynsky"
 disorderly_princes:0 "Disorderly Princes"
 disorderly_princes_desc:0 "The princes of Rus' have grown tired of foreign interference and have united to fight for their independence. They will not rest until they have achieved their goal, and the realm may be thrown into chaos as a result."
 disorderly_princes_title:0 "Disorderly Princes"
 divine_right_of_conquest:0 "Divine Right of Conquest"
 divine_tsyisar_reform:0 "Divine Tsisar"
 divine_tsyisar_reform_desc:0 "The Tsisar is the divine and absolute ruler of the realm, nothing can question it and nothing shall. Long live the Tsisar!"
