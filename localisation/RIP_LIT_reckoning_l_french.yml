l_french:
 rip_lit_kyiv_succession_title:0 "The Last Prince of Kyiv"
 rip_lit_kyiv_succession_desc:0 "Semen Olelkovych, the last prince of Kyiv, died in December 1470. Casimir IV did not give the appanage to his brother Mykhailo, and Kyiv was governed by appointed voivodes from then on. In 1481 Mykhailo Olelkovych and Ivan Holshansky were executed for a plot against the Grand Duke; Fedir Bilsky escaped to Moscow. Hold Kyiv and decide how the court treats the princes of the old line."
 rip_lit_kyiv_succession_classic_title:0 "$rip_lit_kyiv_succession_title$"
 rip_lit_kyiv_succession_classic_desc:0 "$rip_lit_kyiv_succession_desc$"
 rip_lit_volok_survey_title:0 "The Volok Survey"
 rip_lit_volok_survey_desc:0 "On 1 April 1557 Sigismund II Augustus ordered the crown estates of the Grand Duchy, in Ukrainian and Belarusian lands among others, to be measured in voloks. Labour dues on the manorial farms were reckoned from the survey, and the Second and Third Statutes later narrowed the ways a villager could leave his landlord. Hold Ruthenian provinces and decide what the survey asks of their villages."
 rip_lit_volok_survey_classic_title:0 "$rip_lit_volok_survey_title$"
 rip_lit_volok_survey_classic_desc:0 "$rip_lit_volok_survey_desc$"

 rip_lit_reckoning.1.t:0 "The Appanage of Kyiv"
 rip_lit_reckoning.1.d:0 "Semen Olelkovych has died in Kyiv, the last prince to hold it as an appanage. His brother Mykhailo and the Ruthenian princes expect the seat to pass within the Olelkovych line, as it passed from Olelko to his son. The Grand Duke's councillors answer that an appanage is a gift that can be withdrawn, and that a voivode answers to Vilnius alone."
 rip_lit_reckoning.1.a:0 "Appoint a voivode; the appanage ends."
 rip_lit_reckoning.1.b:0 "Confirm the Olelkovych line as hereditary governors."
 rip_lit_reckoning.2.t:0 "The Plot of the Princes"
 rip_lit_reckoning.2.d:0 "Years after Kyiv lost its prince, Mykhailo Olelkovych, Ivan Holshansky and Fedir Bilsky are accused of plotting against the Grand Duke. Some say they meant to seize the court, others that they meant to carry their lands over to Moscow. The Rada waits to hear what the court will do with them."
 rip_lit_reckoning.2.a:0 "Behead the ringleaders."
 rip_lit_reckoning.2.b:0 "Strip them of office and send them into exile."
 rip_lit_reckoning.2.c:0 "Hear their grievance before the Rada and confirm the charter."
 rip_lit_reckoning.3.t:0 "The Border Princes Look to Moscow"
 rip_lit_reckoning.3.d:0 "Princes of the eastern lands, who saw Kyiv lose its seat and its prince lose his head, are sending riders to Moscow. Their estates lie on the border and their retainers know the roads. If they go, they take the villages with them."
 rip_lit_reckoning.3.a:0 "March against the defectors."
 rip_lit_reckoning.3.b:0 "Buy their loyalty with new estates and titles."
 rip_lit_reckoning.4.t:0 "A Prince Raises His Retainers"
 rip_lit_reckoning.4.d:0 "A prince of the border lands has called out his retainers and will not let the voivode's clerks into his estate. His neighbours are watching what the court does."
 rip_lit_reckoning.4.a:0 "Take the estate by force and pay the men from its rolls."
 rip_lit_reckoning.4.b:0 "Send an envoy with gifts and a written promise."
 rip_lit_reckoning.5.t:0 "The Princes Come to Terms"
 rip_lit_reckoning.5.d:0 "The riders have stopped and the retainers have gone home. The princes keep their estates and the court keeps its voivodes. Each side remembers who was beheaded and who was forgiven."
 rip_lit_reckoning.5.a:0 "The land is quiet again."

 rip_lit_reckoning.11.t:0 "The Volok Survey"
 rip_lit_reckoning.11.d:0 "The surveyors have measured the crown estates village by village. The volok is the unit of land, and the dues of a household in grain, carts and days on the manorial farm are fixed against it. The landlords say the survey will fill the granaries. The village elders say the days on the manor will leave no time for their own fields."
 rip_lit_reckoning.11.a:0 "Enforce the survey in full."
 rip_lit_reckoning.11.b:0 "Cap the dues at the surveyed holdings."
 rip_lit_reckoning.12.t:0 "Villages Beyond the Rapids"
 rip_lit_reckoning.12.d:0 "Families from the surveyed estates are leaving down the Dnieper, past the last fortresses, to the steppe frontier where no landlord can claim them. The landlords demand that the fugitives be returned. Frontier captains report that the new arrivals hunt, fish and ride, and will fight for whoever feeds them."
 rip_lit_reckoning.12.a:0 "Send the sheriffs to bring them back."
 rip_lit_reckoning.12.b:0 "Write them into a frontier register as hosts."
 rip_lit_reckoning.13.t:0 "The Manors Stand Empty"
 rip_lit_reckoning.13.d:0 "The harvest has come and the manors have no hands. The landlords blame the sheriffs for letting the villages go, and the sheriffs blame the dues. The clerks report that the estates' rolls will not be met."
 rip_lit_reckoning.13.a:0 "Pay the landlords' arrears from the treasury."
 rip_lit_reckoning.13.b:0 "Grant the surveyed villages a respite from the heaviest dues."
 rip_lit_reckoning.14.t:0 "A Village Leaves"
 rip_lit_reckoning.14.d:0 "A whole village has gone in a night, with its cattle and its priest. The manor has sent for armed men, and the neighbouring villages are waiting to see whether the fugitives are brought back."
 rip_lit_reckoning.14.a:0 "Let the landlord's men pursue them."
 rip_lit_reckoning.14.b:0 "Offer the neighbouring villages a written respite."
 rip_lit_reckoning.15.t:0 "The Villages Settle"
 rip_lit_reckoning.15.d:0 "The roads south are quiet and the manors are worked again. Some villages stayed and some are lost. The sheriffs' books balance, and the villagers remember what the survey cost them."
 rip_lit_reckoning.15.a:0 "The estates are worked again."

 rip_lit_rehabilitate_olelkovych_title:0 "Clear the Olelkovych Name"
 rip_lit_rehabilitate_olelkovych_desc:0 "Declare before the Rada that the Ruthenian princes beheaded or exiled after the plot were not fairly heard, and lift the shadow from Kyiv's princely seat."
 rip_lit_open_frontier_register_title:0 "Open the Frontier Register"
 rip_lit_open_frontier_register_desc:0 "Stop hunting the villagers who left the surveyed estates. Write them into a register at the southern fortresses as hosts, and ease the dues that drove them out."

 rip_lit_ruthenian_princes_revolt:0 "The Princes' Revolt"
 rip_lit_ruthenian_princes_revolt_title:0 "The Princes' Revolt"
 rip_lit_ruthenian_princes_revolt_desc:0 "Princes who saw the Kyiv appanage abolished and their kin beheaded send riders to Moscow. Border estates drift out of the court's hands and retainers gather under the old princely names."
 desc_rip_lit_ruthenian_princes_revolt:0 "The Ruthenian princes of the border lands have stopped answering the court's summons."
 rip_lit_peasant_flight:0 "The Flight Beyond the Rapids"
 rip_lit_peasant_flight_title:0 "The Flight Beyond the Rapids"
 rip_lit_peasant_flight_desc:0 "Villages leave the surveyed estates for the steppe frontier. The manors cannot find hands, the tax rolls shrink and the levy cannot be filled."
 desc_rip_lit_peasant_flight:0 "The surveyed villages are emptying and the manors stand idle."

 rip_lit_kyiv_voivodeship:0 "Kyiv Under a Voivode"
 desc_rip_lit_kyiv_voivodeship:0 "Appointed voivodes govern Kyiv, and the Ruthenian princes' trust in the court is thin."
 rip_lit_princes_executed:0 "The Princes' Fate"
 desc_rip_lit_princes_executed:0 "The court beheaded or exiled the princes of the old Ruthenian lines. The Ruthenian nobility remembers."
 rip_lit_appanage_charter:0 "The Appanage Charter"
 desc_rip_lit_appanage_charter:0 "A charter confirms the Olelkovych governors in Kyiv. The Ruthenian princes keep their seats and the treasury sees less of them."
 rip_lit_princes_rehabilitated:0 "The Olelkovych Name Cleared"
 desc_rip_lit_princes_rehabilitated:0 "The court has cleared the names of the Ruthenian princes who were beheaded or exiled."
 rip_lit_princely_seat_lost:0 "Princely Seat Lost"
 desc_rip_lit_princely_seat_lost:0 "Kyiv has no prince of its own, and the town waits on the voivode."
 rip_lit_princes_defected:0 "Estates of the Defecting Princes"
 desc_rip_lit_princes_defected:0 "The border estates are half emptied by riders and retainers who followed their princes."
 rip_lit_volok_dues:0 "Volok Dues"
 desc_rip_lit_volok_dues:0 "Labour dues fixed by the survey fill the granaries and take the villages' men from the levy."
 rip_lit_capped_dues:0 "Capped Volok Dues"
 desc_rip_lit_capped_dues:0 "Dues are held at the surveyed holdings. The manors earn less and the villages stay."
 rip_lit_frontier_hosts:0 "Frontier Hosts"
 desc_rip_lit_frontier_hosts:0 "Fugitives from the estates are written into a register as hosts, and ride for the court beyond the rapids."
 rip_lit_runaway_estates:0 "Estates Left by Their Villages"
 desc_rip_lit_runaway_estates:0 "The village left in a night, and the manor cannot find hands for its fields."
