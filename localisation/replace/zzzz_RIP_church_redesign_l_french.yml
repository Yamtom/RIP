 rip_church_ro_policies_label_tt:0 "§WActive policies§!\nPatriarch Authority sets how many may be on at once: §Y1§! below 30%, §Y2§! from 30%, §Y3§! from 65%, §Y4§! from 90%. Each costs §R3 Fervor§! a month, so income decides how many you can keep: the authority band pays for about one, each funded node for one more. All four drain the pool within a year or two."
