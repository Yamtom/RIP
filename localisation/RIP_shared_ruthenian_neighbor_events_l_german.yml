l_german:
 rip_tur_ruthenian_palace_waqf:0 "Ruthenische Palaststiftung"
 desc_rip_tur_ruthenian_palace_waqf:0 "Wohltätige Stiftungen und ruthenische Schreiber am Hof stärken die Diplomatie mit den nördlichen Nachbarn und mildern konfessionelle Spannungen."
 rip_tur_kamianets_defter:0 "Defter des Sandschaks Podolien"
 desc_rip_tur_kamianets_defter:0 "Regelmäßige Steuerregister und besoldete Festungsbesatzungen sichern Kamjanez und stabilisieren die Grenzbesteuerung."
 rip_tur_salonika_ruthenian_factors:0 "Schwarzmeer-Ägäis-Getreidefaktoren"
 desc_rip_tur_salonika_ruthenian_factors:0 "Geschützte Getreide-, Honig- und Holzlieferungen aus Podolien und vom unteren Dnepr versorgen die Häfen der Ägäis."
 rip_tur_phanar_kyiv_mediation:0 "Vermittlung Konstantinopel-Kiew"
 desc_rip_tur_phanar_kyiv_mediation:0 "Anerkannte Schutzbriefe zwischen dem Phanar und der Kiewer Geistlichkeit beruhigen orthodoxe Untertanen und erleichtern die Norddiplomatie."
 rip_cri_dnieper_salt_truce:0 "Salzwaffenruhe am unteren Dnepr"
 desc_rip_cri_dnieper_salt_truce:0 "Beschworene Weidegrenzen und bewachte Salzfurten lenken Steppenzölle in die Kasse und Reiterei des Khanats."
 rip_cri_ruthenian_yarlyk_chancery:0 "Ruthenische Jarlyk-Kanzlei"
 desc_rip_cri_ruthenian_yarlyk_chancery:0 "Zweisprachige Schreiber in Turksprache und Kanzleislawisch erheben verlässlichen Städtetribut statt wechselhafter Plünderungen."
 rip_pol_ruthenian_sejmik_accord:0 "Vertrag der ruthenischen Landtage"
 desc_rip_pol_ruthenian_sejmik_accord:0 "Schriftliche Verfahrensgarantien für die Landtage dämpfen plötzliche Vetos und befrieden die östlichen Woiwodschaften."
 rip_pol_lviv_staple_corridor:0 "Lemberger Stapelhandelskorridor"
 desc_rip_pol_lviv_staple_corridor:0 "Zollspeicher und Flusskähne verbinden moldauisches Wachs und wolhynisches Getreide über Lemberg mit der Ostsee."
 rip_pol_ruthenian_border_register:0 "Grenz-Musterregister der Kosaken"
 desc_rip_pol_ruthenian_border_register:0 "Regelmäßige Soldlisten halten die Grenzfahnen der Kosaken für schnelle Reiteraufklärung am Steppenrand einsatzbereit."
 rip_hab_galicia_cadastre_mod:0 "Kataster von Galizien-Lodomerien"
 desc_rip_hab_galicia_cadastre_mod:0 "Kaiserliche Grundbücher begrenzen adlige Steuerbefreiungen und senken die Verwaltungskosten in den ruthenischen Kronländern."
 rip_hab_carpathian_communes:0 "Schutzbriefe der Karpatenkomitate"
 desc_rip_hab_carpathian_communes:0 "Die Bestätigung russinischer Bergweiderechte und Passwachen hält die Karpatentäler während ungarischer Krisen loyal."
 rip_hab_carpathian_post_road:0 "Reichspoststraße Wien-Lemberg"
 desc_rip_hab_carpathian_post_road:0 "Poststationen über die Karpatenpässe beschleunigen kaiserliche Depeschen und Handelskarawanen zwischen Donau und Ruthenien."
 rip_tur_ruthenian_hurrem_waqf_title:0 "Den ruthenischen Palast-Waqf stiften"
 rip_tur_ruthenian_hurrem_waqf_desc:0 "Bittschriften des ruthenischen Palastgefolges und von Hürrems Hofstaat zu Stiftungen und Briefwechseln nach Norden anhören."
 rip_tur_ruthenian_kamianets_eyalet_title:0 "Das Defter des Eyâlets Podolien ordnen"
 rip_tur_ruthenian_kamianets_eyalet_desc:0 "Städtische Abgaben und Garnisonssold entlang des Dnestr-Festungsgürtels um Kamjanez prüfen."
 rip_tur_ruthenian_janissary_levies_title:0 "Die nördlichen Janitscharenrollen prüfen"
 rip_tur_ruthenian_janissary_levies_desc:0 "Zwischen Janitscharen-Kommandeuren und Grenztruppen am Dnepr und in der Schwarzmeersteppe sind Streitigkeiten ausgebrochen."
 rip_tur_ruthenian_salonika_grain_title:0 "Die Getreideflotte Saloniki-Podolien beurkunden"
 rip_tur_ruthenian_salonika_grain_desc:0 "Kaufleute in Saloniki bieten Kredite an, um ruthenisches Flussgetreide, Pottasche und Talg direkt nach der Ägäis zu leiten."
 rip_tur_ruthenian_phanar_kyiv_synod_title:0 "Den Briefwechsel Phanar-Kiew schützen"
 rip_tur_ruthenian_phanar_kyiv_synod_desc:0 "Einen kaiserlichen Berat für orthodoxe Gesandte zwischen dem Patriarchat in Konstantinopel und der Metropolie Kiew erlassen."
 rip_tur_ruthenian_frontier_crisis_title:0 "Die nördlichen Eyâlet-Marken befrieden"
 rip_tur_ruthenian_frontier_crisis_desc:0 "Wenn die Autorität an der Pforte wankt, fordern Notabeln am Dnestr und Dnepr ausstehenden Sold und Sonderrechte."
 rip_tur_ruthenian.1.t:0 "Briefe aus den ruthenischen Gemächern"
 rip_tur_ruthenian.1.d:0 "Ruthenische Bedienstete des Kaiserhauses, geprägt von Hürrems Vorbild, erbitten Stiftungen für Brücken, Brunnen und Geleitbriefe nach Norden. Ein förmlicher Waqf sichert dauerhaftes Ansehen, doch die Ulema raten zu schlichter Frömmigkeit."
 rip_tur_ruthenian.1.a:0 "Einen kaiserlichen Waqf siegeln und Geleitbriefe erteilen."
 rip_tur_ruthenian.1.result_tt:0 "Nach 180 Tagen erhält die Pforte 50 diplomatische Macht, 10 Legitimität und für 15 Jahre den Modifikator Ruthenische Palaststiftung."
 rip_tur_ruthenian.1.b:0 "Auf schlichte Moscheealmosen beschränken und die Bitten abweisen."
 rip_tur_ruthenian.2.t:0 "Der Palast-Waqf bestätigt"
 rip_tur_ruthenian.2.d:0 "Der Kadi hat die ruthenische Stiftung ins Reichsbuch eingetragen. Nördliche Gesandte loben die Höflichkeit der Pforte."
 rip_tur_ruthenian.2.a:0 "Die gesiegelten Abschriften versenden."
 rip_tur_ruthenian.3.t:0 "Die Katasteraufnahme von Kamjanez"
 rip_tur_ruthenian.3.d:0 "Kommissare in Podolien berichten von zerstörten Brücken und umstrittenen Salzzöllen unter den Klippen von Kamjanez. Ein ordentliches Reichsdefter sichert Steuern und Festung, oder die Abgaben werden sofort verpachtet."
 rip_tur_ruthenian.3.a:0 "Ein kaiserliches Defter für den Sandschak Podolien anlegen."
 rip_tur_ruthenian.3.result_tt:0 "Nach 180 Tagen erhält Kamjanez (oder eine ruthenische Provinz) 1 Grundsteuer, -15 lokale Autonomie und für 20 Jahre das Defter des Sandschaks Podolien (sonst 25 administrative Macht)."
 rip_tur_ruthenian.3.b:0 "Die Grenzsteuerpacht sofort gegen Silber versteigern."
 rip_tur_ruthenian.4.t:0 "Das podolische Defter gesiegelt"
 rip_tur_ruthenian.4.d:0 "Das neue Defter verzeichnet jede Mühle, Fähre und Bastion über der Smotrytsch-Schlucht. Steuerbeamte und Festungskommandanten arbeiten nun nach demselben Register."
 rip_tur_ruthenian.4.a:0 "Die Besatzung auf den Wällen aufziehen lassen."
 rip_tur_ruthenian.5.t:0 "Hilfstruppen an der Dnepr-Linie"
 rip_tur_ruthenian.5.d:0 "In die Dnepr-Festungen verlegte Janitscharen streiten mit lokalen ruthenischen Wagenburgschützen und Lipka-Spähern um Rationen. Soldnachzahlung und gemeinsame Übungen können die Truppe gegen den Verfall festigen."
 rip_tur_ruthenian.5.a:0 "Rückstände zahlen und die vereinten Grenz-Ortas exerzieren."
 rip_tur_ruthenian.5.result_tt:0 "Nach 150 Tagen: +8 Armeetradition, -5 Dekadenz falls zutreffend und +10 Janitscharenloyalität."
 rip_tur_ruthenian.5.b:0 "Die interne Musterung den Aghas überlassen."
 rip_tur_ruthenian.6.t:0 "Ordnung in den Steppenforts hergestellt"
 rip_tur_ruthenian.6.d:0 "Nach Auszahlung des Solds bei der Parade und einheitlichem Wachdienst exerzieren die Truppen Seite an Seite am Dnepr."
 rip_tur_ruthenian.6.a:0 "Die Musterungsrolle im Diwan vermerken."
 rip_tur_ruthenian.7.t:0 "Faktoren in Saloniki und nördliches Korn"
 rip_tur_ruthenian.7.d:0 "Christliche und jüdische Getreidehändler in Saloniki schlagen vor, Kähne für ruthenischen Weizen und Flachs vom Schwarzen Meer in die Ägäis vorzufinanzieren."
 rip_tur_ruthenian.7.a:0 "Das Getreidekonsortium von Saloniki absichern."
 rip_tur_ruthenian.7.result_tt:0 "Nach 210 Tagen erhält Saloniki 1 Grundproduktion (sonst 20 diplomatische Macht), für 15 Jahre Schwarzmeer-Ägäis-Getreidefaktoren und +10 Dhimmi-Loyalität."
 rip_tur_ruthenian.7.b:0 "Nur die regulären Hafenzölle erheben."
 rip_tur_ruthenian.8.t:0 "Volle Kornspeicher in Saloniki"
 rip_tur_ruthenian.8.d:0 "Nördliche Kornkonvois legen unter dem Weißen Turm an, stabilisieren die Brotpreise in der Ägäis und füllen die Zollkassen."
 rip_tur_ruthenian.8.a:0 "Die Hafenspeicher erweitern."
 rip_tur_ruthenian.9.t:0 "Gesandte zwischen Phanar und Kiew"
 rip_tur_ruthenian.9.d:0 "Bischöfe des Phanar bitten die Pforte um freies Geleit für Kiewer Mönche und Gelehrte mit liturgischen Drucken. Amtliche Berats verwandeln Misstrauen in diplomatischen Einfluss."
 rip_tur_ruthenian.9.a:0 "Gesiegelte Berats für geregelten Verkehr zwischen Phanar und Kiew ausstellen."
 rip_tur_ruthenian.9.result_tt:0 "Nach 180 Tagen: +10 Prestige, +35 administrative Macht und für 15 Jahre Vermittlung Konstantinopel-Kiew."
 rip_tur_ruthenian.9.b:0 "Orthodoxe Reisen auf die eigenen Sprengel beschränken."
 rip_tur_ruthenian.10.t:0 "Die Kanzleirolle des Phanar"
 rip_tur_ruthenian.10.d:0 "Da jedes Schreiben vor der Steppenreise in Konstantinopel beglaubigt wird, preisen griechische wie ruthenische Prälaten die Ordnung der Pforte."
 rip_tur_ruthenian.10.a:0 "Die Berats unter dem Siegel des Großwesirs verwahren."
 rip_tur_ruthenian.11.t:0 "Unruhen in der nördlichen Eyâlet-Mark"
 rip_tur_ruthenian.11.d:0 "Während Machtkämpfe und revolutionäre Schriften das Reich erschüttern, drohen Notabeln zwischen Dnestr und Dnepr mit Steuerverweigerung, sofern kein loyaler Pascha mit Silber und Entsatz eintrifft."
 rip_tur_ruthenian.11.a:0 "Notgelder und loyale Grenzaufgebote entsenden."
 rip_tur_ruthenian.11.result_tt:0 "Nach 150 Tagen: +1 Stabilität (sonst administrative Macht), +0.5 Jahres-Rekrutenreserve und -5 Dekadenz falls zutreffend."
 rip_tur_ruthenian.11.b:0 "Eine vorläufige Waffenruhe zur Schonung der Garnisonen verkünden."
 rip_tur_ruthenian.12.t:0 "Die Nordgrenze hält stand"
 rip_tur_ruthenian.12.d:0 "Rechtzeitiges Silber und straffe Führung bringen widerspenstige Beys und ruthenische Dorfälteste wieder zum Gehorsam."
 rip_tur_ruthenian.12.a:0 "Die Flusslinie für den Sultan halten."
 rip_cri_ruthenian_dnieper_pastures_title:0 "Die Weiden der Dnepr-Salzstraße regeln"
 rip_cri_ruthenian_dnieper_pastures_desc:0 "Zwischen krimtatarischen Mirzas und ruthenischen Tschumak-Salzfuhrleuten über Tränken und Furten unterhalb Saporoschjes vermitteln."
 rip_cri_ruthenian_succession_envoys_title:0 "Ruthenische Gesandte im Thronrat empfangen"
 rip_cri_ruthenian_succession_envoys_desc:0 "Bei umstrittener Thronfolge auf der Krim Anerkennung, Ehrengaben und Waffenstillstandseide ruthenischer Großer einholen."
 rip_cri_ruthenian_ulus_tribute_title:0 "Die ruthenische Jarlyk-Kanzlei einrichten"
 rip_cri_ruthenian_ulus_tribute_desc:0 "Unterworfene ruthenische Städte im tatarischen Ulus in feste Tributbezirke statt in jährliche Beutezüge überführen."
 rip_cri_ruthenian.1.t:0 "Wanderherden und Salzwagen"
 rip_cri_ruthenian.1.d:0 "Clans klagen ruthenische Salzfuhrleute an, Sommerweiden am unteren Dnepr zu zertrampeln, doch jene drohen, die Krimsalinen zu meiden. Ein beschworener Zolltarif befriedet die Stämme und füllt die Kasse des Khans."
 rip_cri_ruthenian.1.a:0 "Die Dnepr-Weideruhe beschwören und Salzzölle festsetzen."
 rip_cri_ruthenian.1.result_tt:0 "Nach 180 Tagen: +10 Loyalität der Nomadenstämme, +65 Dukaten und Salzwaffenruhe am unteren Dnepr für 15 Jahre."
 rip_cri_ruthenian.1.b:0 "Den Mirzas erlauben, Weidepferde direkt abzupressen."
 rip_cri_ruthenian.2.t:0 "Zölle der Salzfurten"
 rip_cri_ruthenian.2.d:0 "Lange Ochsenwagenzüge überqueren die Furten unter Stammesgeleit und entrichten Abgaben wie Reitpferde ohne Blutvergießen."
 rip_cri_ruthenian.2.a:0 "Die Anteile der Stämme beim Kurultai verteilen."
 rip_cri_ruthenian.3.t:0 "Gesandte in Bachtschissarai"
 rip_cri_ruthenian.3.d:0 "Während einer gespannten Thronfolge bringen ruthenische Gesandte Zobelpelze und Schreiben für gegenseitige Grenzfriedensrichter, damit keinem der Rivalen während des Kurultai der Rücken entblößt bleibt."
 rip_cri_ruthenian.3.a:0 "Die Gesandten ehrenvoll empfangen und Tamgas tauschen."
 rip_cri_ruthenian.3.result_tt:0 "Nach 150 Tagen: +15 Hordeneinheit (oder 15 Legitimität), +10 Prestige und +40 diplomatische Macht."
 rip_cri_ruthenian.3.b:0 "Die Gaben nur als Tribut annehmen und rasch abfertigen."
 rip_cri_ruthenian.4.t:0 "Eine nördliche Waffenruhe bestätigt"
 rip_cri_ruthenian.4.d:0 "Da die Dnepr-Grenze ruhig bleibt, sammeln sich schwankende Beys in Bachtschissarai unter dem Giray-Banner."
 rip_cri_ruthenian.4.a:0 "Die Rossschweifstandarte aufrichten."
 rip_cri_ruthenian.5.t:0 "Tributrollen des nördlichen Ulus"
 rip_cri_ruthenian.5.d:0 "Ruthenische Bürger und Älteste eroberter Städte bieten stetes Silber und Korn im Tausch für zweisprachige Jarlyks, die ihre Werkstätten vor Plünderung schützen."
 rip_cri_ruthenian.5.a:0 "Eine zweisprachige ruthenische Jarlyk-Kanzlei gründen."
 rip_cri_ruthenian.5.result_tt:0 "Nach 210 Tagen erhält eine ruthenische Provinz je 1 Grundsteuer und Grundproduktion (sonst 25 administrative Macht) sowie für 15 Jahre Ruthenische Jarlyk-Kanzlei."
 rip_cri_ruthenian.5.b:0 "Stattdessen sofort eine Kriegsabgabe von den Städten eintreiben."
 rip_cri_ruthenian.6.t:0 "Goldgesiegelte Jarlyks im Umlauf"
 rip_cri_ruthenian.6.d:0 "Die Märkte des nördlichen Ulus öffnen unter dem Siegel des Khans erneut und wandeln gezeichnete Städte in verlässliche Steuerplätze."
 rip_cri_ruthenian.6.a:0 "Schreiber zur Prüfung der nächsten Quartalskasse entsenden."
 rip_pol_ruthenian_sejmik_compacts_title:0 "Die Verträge der ruthenischen Landtage aushandeln"
 rip_pol_ruthenian_sejmik_compacts_desc:0 "Mit den Abgeordneten der ruthenischen Woiwodschaften schriftliche Regeln gegen Sejm-Sprengungen und Wahlstreitigkeiten vereinbaren."
 rip_pol_ruthenian_baltic_moldavian_road_title:0 "Lembergs moldauische und Ostsee-Stapel verbinden"
 rip_pol_ruthenian_baltic_moldavian_road_desc:0 "Zollhäuser zwischen der Moldau, Lemberg und Danzig abstimmen, um Schwarzmeerwaren und wolhynisches Korn unter königlichem Stapelrecht zu lenken."
 rip_pol_ruthenian_cossack_register_roll_title:0 "Die Musterrolle der Dnepr-Kosaken siegeln"
 rip_pol_ruthenian_cossack_register_roll_desc:0 "Vierteljährlichen Sold, Tuchlieferungen und registrierte Fahnen mit den Kosakenältesten an der Steppengrenze festlegen."
 rip_pol_ruthenian.1.t:0 "Beschlüsse der ruthenischen Landtage"
 rip_pol_ruthenian.1.d:0 "In Wisznia und Luzk verfassen ruthenische Landtage Beschlüsse mit klaren Verfahrensforderungen vor dem nächsten Reichstag oder Königswahltag. Schriftliche Zusagen können das Veto bändigen."
 rip_pol_ruthenian.1.a:0 "Die Landtagsverträge unter Kronsiegel bestätigen."
 rip_pol_ruthenian.1.result_tt:0 "Nach 180 Tagen: +1 Stabilität (sonst administrative Macht), +10 Legitimität und Vertrag der ruthenischen Landtage für 15 Jahre."
 rip_pol_ruthenian.1.b:0 "Den Gesandten mit bloßen Höflichkeitsbriefen antworten."
 rip_pol_ruthenian.2.t:0 "Ruhige Kammern auf dem Sejm"
 rip_pol_ruthenian.2.d:0 "Ruthenische Abgeordnete verlesen geschlossen die unterzeichneten Verträge und stellen Störer in der Kammer bloß."
 rip_pol_ruthenian.2.a:0 "Die Beschlüsse in die Kronmatrikel eintragen."
 rip_pol_ruthenian.3.t:0 "Die Stapelurkunde Lemberg-Ostsee"
 rip_pol_ruthenian.3.d:0 "Armenische, ruthenische und deutsche Bürger Lembergs bitten die Krone, moldauische Viehzölle und Weichselkähne bis Danzig unter einem gemeinsamen Stapelrecht zu verbinden."
 rip_pol_ruthenian.3.a:0 "In Lembergs Speicher und Flusskähne investieren."
 rip_pol_ruthenian.3.result_tt:0 "Nach 210 Tagen erhält Lemberg 1 Grundproduktion und für 20 Jahre Lemberger Stapelhandelskorridor (sonst 30 diplomatische Macht) sowie 2 Merkantilismus."
 rip_pol_ruthenian.3.b:0 "Zeitweilige Durchlassbriefe an fremde Händler verkaufen."
 rip_pol_ruthenian.4.t:0 "Karawanen füllen den Lemberger Ringplatz"
 rip_pol_ruthenian.4.d:0 "Wagenzüge aus Suczawa treffen auf Kähne für Bug und Weichsel und machen Lemberg zum Drehkreuz zwischen Schwarzem Meer und Ostsee."
 rip_pol_ruthenian.4.a:0 "Das Siegel der Kaufmannsgilden bestätigen."
 rip_pol_ruthenian.5.t:0 "Abgesandte der Dnepr-Städte"
 rip_pol_ruthenian.5.d:0 "Kosakenobersten legen dem Kronhetman abgenutzte Dienstrollen vor und fordern verlässliches Tuch und Sold im Gegenzug für ständige Grenzwachen gegen Steppenräuber."
 rip_pol_ruthenian.5.a:0 "Die Vierteljahresrolle der registrierten Kosaken finanzieren."
 rip_pol_ruthenian.5.result_tt:0 "Nach 150 Tagen: +8 Armeetradition, +10 Kosakenloyalität und Grenz-Musterregister der Kosaken für 15 Jahre."
 rip_pol_ruthenian.5.b:0 "Die Fahnen auf örtliche Winterquartiere verweisen."
 rip_pol_ruthenian.6.t:0 "Die Südfahnen gemustert"
 rip_pol_ruthenian.6.d:0 "Neue Röcke, Pulverfässer und gesiegelte Musterbücher erreichen Korsun und Tscherkassy rechtzeitig zum Frühjahrsfeldzug."
 rip_pol_ruthenian.6.a:0 "Die Musterung des Kronhetmans billigen."
 rip_hab_ruthenian_galicia_cadastre_title:0 "Die galizisch-ruthenischen Kronländer vermessen"
 rip_hab_ruthenian_galicia_cadastre_desc:0 "Habsburgische Landmesser entsenden, um Güter, Salzwerke und Bauernabgaben in Galizien, Lodomerien und Karpatenrus zu erfassen."
 rip_hab_ruthenian_carpathian_compromise_title:0 "Die Komitatsfreiheiten der Karpatenrus garantieren"
 rip_hab_ruthenian_carpathian_compromise_desc:0 "Russinische Bergdörfer und Passmilizen während ungarischer Verfassungskrisen oder Ausgleichsverhandlungen mit Privilegien absichern."
 rip_hab_ruthenian_danube_carpathian_post_title:0 "Die Reichspoststraße Wien-Karpaten eröffnen"
 rip_hab_ruthenian_danube_carpathian_post_desc:0 "Poststationen durch Mähren und über die Karpatenpässe zwischen Wien, Uschhorod, Lemberg und den östlichen Höfen anlegen."
 rip_hab_ruthenian.1.t:0 "Der kaiserliche Kataster in Ruthenien"
 rip_hab_ruthenian.1.d:0 "Kaiserliche Kommissare in Lemberg und der Maramuresch berichten über verworrene Adelsimmunitäten, verborgene Salinen und drückende Frondienste. Ein einheitlicher Habsburger Kataster erschließt verlässliche Steuern."
 rip_hab_ruthenian.1.a:0 "Die kaiserliche Katastervermessung anordnen."
 rip_hab_ruthenian.1.result_tt:0 "Nach 210 Tagen erhält Lemberg (sonst Maramuresch oder 25 administrative Macht) 1 Grundsteuer und -15 lokale Autonomie sowie für 15 Jahre Kataster von Galizien-Lodomerien."
 rip_hab_ruthenian.1.b:0 "Die Steuererhebung vorerst den alten Landtagen belassen."
 rip_hab_ruthenian.2.t:0 "Gebundene Grundbücher erreichen Wien"
 rip_hab_ruthenian.2.d:0 "Jedes Gut, jede Salzquelle und jede ruthenische Bauernstelle steht nun in den Büchern der Wiener Hofkammer verzeichnet."
 rip_hab_ruthenian.2.a:0 "Das Verzeichnis bei der Hofkammer hinterlegen."
 rip_hab_ruthenian.3.t:0 "Älteste der Karpatenpässe"
 rip_hab_ruthenian.3.d:0 "Inmitten der Streitigkeiten zwischen Wien und den ungarischen Ständen bitten russinische Dorfrichter um kaiserlichen Schutz für Bergweiden, Dorfschulen und Passwachen."
 rip_hab_ruthenian.3.a:0 "Die Dorfurkunden und Passwachen der Karpaten bestätigen."
 rip_hab_ruthenian.3.result_tt:0 "Nach 150 Tagen: +1 Stabilität (sonst administrative Macht), +1 Grundrekruten und -4 Unruhe in Maramuresch (sonst 20 militärische Macht) sowie für 15 Jahre Schutzbriefe der Karpatenkomitate."
 rip_hab_ruthenian.3.b:0 "Die Gesuche an die ungarische Kanzlei verweisen."
 rip_hab_ruthenian.4.t:0 "Treue in den Gebirgstälern"
 rip_hab_ruthenian.4.d:0 "In ihren Bergrechten bestätigt, halten russinische Grenzwächter die Pässe von Verecke und Jablonitza für kaiserliche Kuriere offen."
 rip_hab_ruthenian.4.a:0 "Die Gebirgswacht mustern."
 rip_hab_ruthenian.5.t:0 "Postkutschen über die Beskiden"
 rip_hab_ruthenian.5.d:0 "Postmeister aus Olmütz und Kaschau bieten an, Wechselstationen über die Beskidenpässe nach Uschhorod und Lemberg auszubauen."
 rip_hab_ruthenian.5.a:0 "Kaiserliche Postpatente für die Karpatenstraße erteilen."
 rip_hab_ruthenian.5.result_tt:0 "Nach 180 Tagen: +45 diplomatische Macht, +8 Prestige und für 15 Jahre Reichspoststraße Wien-Lemberg."
 rip_hab_ruthenian.5.b:0 "Nur fallweise private Eilboten anwerben."
 rip_hab_ruthenian.6.t:0 "Das erste Posthorn in Lemberg"
 rip_hab_ruthenian.6.d:0 "Alle zwei Meilen zwischen Donau und Dnestr-Vorland stehen frische Pferde bereit und verkürzen die Laufzeit von Depeschen und Wechseln auf die Hälfte."
 rip_hab_ruthenian.6.a:0 "Den Fahrplan am Hofburgtor anschlagen."
