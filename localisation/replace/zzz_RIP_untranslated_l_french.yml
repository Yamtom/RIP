 refused_powerful_family:0 "Refused Powerful Family"
 refused_powerful_family_desc:0 "Our refusal to grant lands to a powerful noble family has damaged our reputation among the aristocracy."
 regimental_headquarters:0 "Regimental Headquarters"
 regimental_headquarters_desc:0 "This city serves as headquarters for a Hetmanate regiment."
 regimental_provincial_system:0 "§YRegiments function as military-administrative provinces§!"
 registered_cossack_raids:0 "Registered Cossack Raids"
 registered_cossacks_border:0 "Registered Cossacks"
 registered_cossacks_expanded:0 "Expanded Cossack Register"
 registered_cossacks_south:0 "Registered Cossacks"
 rejected_russian_candidate:0 "Rejected Russian Candidate"
 religious_resistance_movement:0 "Religious Resistance Movement"
 religious_tolerance:0 "Religious Tolerance"
 religious_tolerance_desc:0 "Orthodox and Catholic coexistence, along with Jewish communities and the Uniate Church, creates pragmatic multi-confessionalism. Religious diversity is our strength."
 religious_tolerance_policy:0 "Religious Tolerance Policy"
 religious_uniformity_enforcement:0 "Religious Uniformity Enforcement"
 removed_nepotism:0 "Removal of nepotism"
 removed_nepotism_desc:0 "Nepotism was a long-standing vice of a system that held that people were given public posts based on how connected or dishonest they were. Because it neglected to consider the candidate's appropriateness, this was problematic. By enabling merit-based appointments, getting rid of this harmful tendency will enhance the state bureaucracy."
 representation_monarchy_reform:0 "Crown and Estates"
 representation_monarchy_reform_desc:0 "By order of the new constitution, the king is now legally obliged to his citizens as supreme governor."
 resistance_to_greek_catholic_spread:0 "Resistance to Greek Catholic Spread"
 resisted_collegium:0 "Resisted Collegium"
 resisting_russian_control:0 "Resisting Russian Control"
 restored_orthodox_constantinople:0 "Restored Orthodox Constantinople"
 restored_orthodox_constantinople_desc:0 "Constantinople has been restored to Orthodox Christian rule."
 restored_orthodox_jerusalem:0 "Restored Orthodox Jerusalem"
 restored_orthodox_jerusalem_desc:0 "Jerusalem has been liberated and returned to Christian rule."
 restored_ruthenia:0 "Restored Ruthenia"
 revolutionary_empire_desc:0 "A revolutionary empire that has overthrown the old order and seeks to spread its ideals through conquest and reformation."
 revolutionary_republic_desc:0 "A revolutionary republic that has cast aside the chains of monarchy and aristocracy, establishing a government by the people."
 right_bank_development:0 "Right Bank Development"
 right_bank_development_desc:0 "Economic development of the Right Bank."
 right_bank_loyalty:0 "Right Bank Loyalty"
 right_bank_priority:0 "Right Bank Priority"
 righteous_druzhyna:0 "Righteous Druzhyna"
 righteous_druzhyna_desc:0 "To defend our principality and faith, we can produce elite soldiers by redistributing stolen lands to the nobility and giving them to upright Muslims."
 righteous_gift:0 "Righteous gift"
 righteous_gift_desc:0 "The ruler used to train his subordinates for the job of reigning under them, the righteous gift became a custom. The righteous gift is an effort for all potential landlord candidates to practice playing this role."
