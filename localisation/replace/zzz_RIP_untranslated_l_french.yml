 sloboda_history.1.a:0 "Open the slobodas to settlers."
 sloboda_history.1.b:0 "Channel settlement through starshyna patrons."
 sloboda_history.1.c:0 "Restrict migration for now."
 sloboda_history.1.d:0 "Fresh groups of frontier settlers are arriving in the Sloboda lands, drawn by open soil, military protection, and promises of limited obligations. If we shape this migration now, the border can become both a shield and a breadbasket.\n\nOur council must decide whether to maximize inflow, tie settlement to elite patronage, or slow colonization to preserve immediate order."
 sloboda_history.1.t:0 "Migrant Wave into the Slobodas"
 sloboda_history.10.a:0 "Broker a community compromise."
 sloboda_history.10.b:0 "Impose top-down uniformity."
 sloboda_history.10.d:0 "The Sloboda borderland hosts mixed confessional communities whose cooperation underpins local order. Pressure is rising between compromise-oriented councils and officials favoring direct uniformity.\n\nA negotiated balance may stabilize the region, while forced standardization could accelerate integration at political cost."
 sloboda_history.10.t:0 "Multi-Confessional Frontier"
 sloboda_history.11.a:0 "Preserve the hybrid frontier code."
 sloboda_history.11.b:0 "Integrate into central service tables."
 sloboda_history.11.d:0 "Frontier practice has accumulated into a dense web of local precedents. Reformers now propose a codified service framework to settle disputes over obligations, command, and privileges.\n\nWe can preserve a hybrid frontier model or align service rules with central state tables."
 sloboda_history.11.t:0 "Codification of Sloboda Service"
 sloboda_history.12.a:0 "Implement gradual integration."
 sloboda_history.12.b:0 "Impose rapid uniformization."
 sloboda_history.12.d:0 "Late-century reforms demand administrative clarity across the frontier. Sloboda institutions can be folded into governorate structures either gradually or by rapid uniformization.\n\nThe pace of this transition will determine whether loyalty is preserved through adaptation or enforced through command."
 sloboda_history.12.t:0 "Governorate Reorganization"
 sloboda_history.13.a:0 "Emphasize military legacy."
 sloboda_history.13.b:0 "Emphasize urban-economic legacy."
 sloboda_history.13.c:0 "Synthesize frontier and bureaucratic traditions."
 sloboda_history.13.d:0 "After decades of settlement, defense, trade expansion, and reform, the Sloboda frontier has become a defining layer of our state custom. We must decide what legacy future generations will institutionalize.\n\nThe realm may privilege military tradition, urban-economic modernization, or a synthesis of frontier and bureaucratic governance."
 sloboda_history.13.t:0 "Legacy of the Sloboda Frontier"
 sloboda_history.2.a:0 "Guarantee fiscal privileges."
 sloboda_history.2.b:0 "Confirm elective local offices."
 sloboda_history.2.c:0 "Standardize charters under central chancery."
 sloboda_history.2.d:0 "New communities demand formal charters to regulate taxes, duties, and local governance. The precedent of Sloboda privileges has already transformed nearby districts, and many expect us to codify similar terms.\n\nThe question is whether to prioritize fiscal concessions, elective offices, or tighter chancery supervision."
 sloboda_history.2.t:0 "Sloboda Charters Issued"
 sloboda_history.3.a:0 "Strengthen sotnia service."
 sloboda_history.3.b:0 "Rely on urban garrisons."
 sloboda_history.3.d:0 "As warfare evolves, our frontier administration can no longer rely on improvised detachments. Officers propose a formal regimental-hundred order that links local service, command discipline, and mobilization.\n\nWe may strengthen sotnia institutions directly or lean on city-based garrisons to secure the line."
 sloboda_history.3.t:0 "Regimental-Hundred Order"
 sloboda_history.4.a:0 "Build earthworks and a fort chain."
 sloboda_history.4.b:0 "Invest in mobile watchposts."
 sloboda_history.4.d:0 "Raids and border alarms are forcing a strategic choice. With forts rising across the frontier - and the Belgorod model proving its value - we can now invest in a durable defensive architecture for Sloboda Ukraine.\n\nThe state can fund continuous earthworks and forts, or prioritize mobile watchposts that trade permanence for flexibility."
 sloboda_history.4.t:0 "Eastern Fortified Line"
 sloboda_history.5.a:0 "Renew service privileges."
 sloboda_history.5.b:0 "Expand central oversight."
 sloboda_history.5.d:0 "A decade of military routines has exposed legal gaps in service obligations and frontier rights. Officers, settlers, and administrators now press for a statute review.\n\nWe can renew traditional service privileges or expand direct oversight from the center."
 sloboda_history.5.t:0 "Review of Frontier Statutes"
 sloboda_history.6.a:0 "Build silos and mills."
 sloboda_history.6.b:0 "Pursue pastoral diversification."
 sloboda_history.6.d:0 "The black-soil zone is entering a new stage of agrarian intensity. Estates linked to the Black Soil Silos model show higher reliability, lower spoilage, and stronger market output.\n\nWe can invest in silos and milling networks for maximum grain throughput, or diversify into lower-risk pastoral structures."
 sloboda_history.6.t:0 "Chernozem Specialization"
 sloboda_history.7.a:0 "Open a regional contract hall."
 sloboda_history.7.b:0 "Preserve local market trade."
 sloboda_history.7.d:0 "Kharkiv's merchants propose a formal contract hall to coordinate supply, storage, and long-distance deliveries. With local workshops expanding and grain finance deepening, the city is ready for institutional trade scaling.\n\nWe can build a regional contract system or preserve a looser local market pattern."
 sloboda_history.7.t:0 "Kharkiv Fairs and Contracting"
 sloboda_history.8.a:0 "Invest in logistics."
 sloboda_history.8.b:0 "Fiscalize grain exports."
 sloboda_history.8.d:0 "Surveyors and merchants argue that Sloboda grain must be tied more tightly to river export routes. Where Grain Corridors already exist, logistics are smoother and losses are lower.\n\nWe can invest directly in convoy logistics, or fiscalize exports to maximize immediate state revenue."
 sloboda_history.8.t:0 "Grain Corridors to the Dnieper"
 sloboda_history.9.a:0 "Invest in brotherhood schools."
 sloboda_history.9.b:0 "Expand the service chancellery."
 sloboda_history.9.d:0 "Growing administration and urban literacy have created demand for trained clerks, teachers, and legal specialists. Frontier governance now depends as much on schools and paperwork as on cavalry musters.\n\nThe state can sponsor brotherhood education or prioritize an expanded service chancellery."
 sloboda_history.9.t:0 "Collegium and Chancellery Culture"
