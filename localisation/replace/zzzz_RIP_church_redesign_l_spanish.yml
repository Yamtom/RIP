 rip_church_ro_authority_communion_tt:0 "§YPatriarchal Authority§! remains the native 0–100 measure of this hierarchy; it is not a schism meter.\n§YWhile communion with the Eastern churches remains unbroken§!, each owned Orthodox parish receives §G+5 local tolerance of heretics§! and its local religious-unity weight is removed.\nDuring a listed coercive church policy, protection falls to §G+3 local tolerance§! and half the religious-unity weight is removed. An external schism withdraws these guarantees; reconciliation restores them. These are local safeguards only: provinces keep their faith and are never converted automatically."
 rip_church_ro_authority_label:0 "Patriarch Authority"
 rip_church_ro_authority_label_tt:0 "[Root.GetChurchAuthorityTooltip]"
 rip_church_ro_authority_link:0 "Monthly Fervor: [Root.GetChurchRONet]"
 rip_church_ro_authority_link_tt:0 "§WFervor§!\nThe currency of the church, at most §Y100§!. It is spent to start policies and to found nodes, §Y10§! each, and paid in by authority and by funded nodes.\nThis month: authority [Root.GetChurchROBase], nodes [Root.GetChurchRONodeIncome], policies [Root.GetChurchROUpkeep], net [Root.GetChurchRONet].\nIf the pool cannot pay the upkeep, the newest policy closes first."
 rip_church_ro_authority_schism_tt:0 "§YPatriarchal Authority§! remains the native 0–100 measure of this hierarchy; it is not a schism meter.\nThe state has deliberately broken communion with the Eastern churches, so Orthodox parishes no longer receive the communion-based tolerance or religious-unity protections. Reconciliation can restore those local guarantees. Province religions do not change automatically."
 rip_church_ro_fervor_label:0 "Fervor"
 rip_church_ro_fervor_label_tt:0 "§WFervor§!\nThe currency of the church, at most §Y100§!. It is spent to start policies and to found nodes, §Y10§! each, and paid in by authority and by funded nodes.\nThis month: authority [Root.GetChurchROBase], nodes [Root.GetChurchRONodeIncome], policies [Root.GetChurchROUpkeep], net [Root.GetChurchRONet].\nIf the pool cannot pay the upkeep, the newest policy closes first."
