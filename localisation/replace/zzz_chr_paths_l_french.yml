 # --- taking and widening a road

 chr_road_of_the_towns_title:0 "Take the Road of the Towns"
 chr_road_of_the_towns_desc:0 "Let the staple on the Desna be the whole business of the country: one weighing house, one toll, one court in each chartered town, and a Rada that bargains for all of them. Hemp and potash pay for walls better than tribute does. It asks that the river stay ours."

 chr_union_of_the_towns_title:0 "Bind the Towns into a Union"
 chr_union_of_the_towns_desc:0 "Chernihiv, Novhorod-Siverskyi and Starodub already share a staple; let them share a treasury and a levy as well, each keeping its own privileges and its own vote. The Dutch towns are said to run on the same bargain. They also have a sea at the end of their rivers."

 chr_rada_of_all_the_lands_title:0 "Seat the Rada of the Lands"
 chr_rada_of_all_the_lands_desc:0 "Call every land of the Siverian country to one standing Rada, with a marshal to execute what it votes and no authority to do anything else. A country that argues everything through is slow. It has also never yet been sold by one man."

 chr_road_of_the_houses_title:0 "Take the Road of the Houses"
 chr_road_of_the_houses_desc:0 "The grain, salt and hemp houses will pay the country's debts and expect the magistrat in exchange. The tolls will be set by the men whose carts pay them, and the tolls will be low. The towns will keep the forms of election and stop keeping the substance."

 chr_call_a_prince_title:0 "Call a Prince to Siversk"
 chr_call_a_prince_desc:0 "Invite a prince with a retinue, pay him from the tolls, and write the terms before he arrives: the peace, the courts and the frontier are his; the trade stays ours. Every town that has tried this has agreed the terms were clear. Few of them agree on what happened next."

 chr_crown_the_prykaz_tsardom_title:0 "Raise the Tsardom of the Prykazy"
 chr_crown_the_prykaz_tsardom_desc:0 "Give each branch of the realm its own office, seal and clerks, put the General Chancellery over them and the crown over that, and call the thing by its proper name. A realm run by offices answers faster than a realm run by argument. It also stops hearing anything the offices do not write down."

 chr_road_of_the_chancery_title:0 "Take the Road of the Chancery"
 chr_road_of_the_chancery_desc:0 "Let office go by examination and the roll of service rather than by birth or by purchase. Sons of priests, clerks and sotnia scribes will draft our statutes, and they will owe their place to the chancery. A man who owes everything to the roll defends the roll."

 chr_raise_the_dzhury_title:0 "Raise the Corps of the Dzhury"
 chr_raise_the_dzhury_desc:0 "Take boys into the corps, feed them, teach them arms and letters, and let them rise as far as service carries them - with no office passing to a son. The Mamluks of Egypt held a country this way for three centuries. They also chose every ruler it had."

 chr_union_of_many_nations_title:0 "Proclaim the Union of Many Nations"
 chr_union_of_many_nations_desc:0 "Let every land under the roll keep its law, its rite and its tongue, and let each write its own clause into the union it enters. The chancery and the host are held in common; nothing else is. Such a bargain is kept as long as the chancery can still read all of it."

 chr_proclaim_great_chernihiv_title:0 "Proclaim Great Chernihiv"
 chr_proclaim_great_chernihiv_desc:0 "Chernihiv, Novhorod-Siverskyi, Starodub, Rylsk, Bryansk and Kursk answer to one chancery again, which they last did before the Horde. Declare the Siverian land whole, and let the rest of what the old principality reached be written down as a claim rather than a chronicle."

 chr_four_lands_beyond_tt:0 "Hold at least four provinces whose culture is not East Slavic"

 # --- the roads taken

 chr_paths.1.t:0 "The Staple Is Fixed at Chernihiv"
 chr_paths.1.d:0 "The weighing house at Chernihiv has the seal, and every cart of hemp, potash and salt that comes down the Desna is unloaded, weighed and taxed there before it goes further. The magistrats of the smaller towns signed the article, having read the clause that gives each of them a court of its own. The clerks have already begun arguing about what counts as coming down the Desna."
 chr_paths.1.a:0 "Set the weights and the tolls"

 chr_paths.2.t:0 "Three Towns, One Treasury"
 chr_paths.2.d:0 "Chernihiv, Novhorod-Siverskyi and Starodub have agreed to a common chest, a common levy and separate privileges, which took four sittings and two walkouts. Each town keeps its vote, and no levy passes without all three. The Starodub deputies have already asked what happens if one of them says no while an army is on the march."
 chr_paths.2.a:0 "Let all three keep the vote"
 chr_paths.2.b:0 "Let the chest outvote them"

 chr_paths.3.t:0 "The Rada of the Lands Sits"
 chr_paths.3.d:0 "Deputies from every land of the Siverian country have taken their seats, and the marshal has read out what he may do and what he may not: he executes, he does not decide. The first session voted the garrisons, the second voted the salt toll, and the third is still arguing about the second. The land that voted against the toll is paying it."
 chr_paths.3.a:0 "Let the Rada stand"

 chr_paths.4.t:0 "The Houses Take the Magistrat"
 chr_paths.4.d:0 "The debts of the town are paid and the men who paid them now sit on the magistrat, which has spent its first sitting on the schedule of tolls. The election was held; the outcome had been known since spring. The burghers who are not in a house have noticed that the tolls on their carts were not the ones that fell."
 chr_paths.4.a:0 "Sign the schedule of tolls"

 chr_paths.5.t:0 "A Prince Is Invited"
 chr_paths.5.d:0 "The prince has come with his retinue, sworn to the terms in front of the magistrat, and taken the courts, the peace and the frontier into his hand. The houses kept the tolls and paid for the retinue out of them. His marshal has asked, courteously, where the town keeps its powder."
 chr_paths.5.a:0 "Hold him to the terms"
 chr_paths.5.b:0 "Give him the szlachta roll"

 chr_paths.6.t:0 "The Offices Multiply"
 chr_paths.6.d:0 "There is now an office for the frontier, an office for the register, an office for the salt and an office for the post, each with its seal, and the General Chancellery reads what they all send it. Business that once took a rada and a season now takes a clerk and a fortnight. So does business nobody asked for."
 chr_paths.6.a:0 "Seal the new offices"

 chr_paths.7.t:0 "The Roll of Service Is Opened"
 chr_paths.7.d:0 "The chancery examination was held in the refectory, in Latin, Ruthenian and Polish, and the roll of those who passed was read out at the door. Two of the first eight are sons of village priests and one is a sotnia clerk's boy. The men who recommended them are the same men who have always recommended people."
 chr_paths.7.a:0 "Read out the roll"

 chr_paths.8.t:0 "The Corps Raises Its Own"
 chr_paths.8.d:0 "The first intake of dzhury has been quartered, fed and set to arms and letters together, and the article has been read to them: no office they earn will pass to a son of theirs. The older starshyna understood the article perfectly and dislike it precisely. The boys have understood only the part about how far they may rise."
 chr_paths.8.a:0 "Enter them on the roll"

 chr_paths.9.t:0 "Every Land Writes Its Clause"
 chr_paths.9.d:0 "The union has been sealed land by land, each with its own article: this one keeps its rite, that one its courts, a third the tongue its charters are written in. The chancery holds a copy of every clause and the host holds all of them together. The clerk who has to read them all before a levy has asked for an assistant."
 chr_paths.9.a:0 "Seal the union"

 chr_paths.10.t:0 "Great Chernihiv"
 chr_paths.10.d:0 "The six towns of the Siverian land answer to one chancery for the first time since before the Horde, and the chronicle at the Collegium has been brought up to date to say so. What lies beyond them - the upper Oka, the Seim, the road to the old bishopric on the Kuban - is in the chronicle too, and the chronicle is not a title. Whether it becomes one is a decision, not a discovery."
 chr_paths.10.a:0 "Hold the six towns"
 chr_paths.10.b:0 "Claim what the chronicle names"

