l_english:
 rip_tur_ruina_scorched_earth:0 "Scorched Earth on the Right Bank"
 rip_tur_ruina_scorched_earth_title:0 "Scorched Earth on the Right Bank"
 rip_tur_ruina_scorched_earth_desc:0 "Sieges, Tatar forage parties, and punitive burnings have emptied the river towns of Podillia and the Right Bank, turning conquered districts into a ruined desert."
 desc_rip_tur_ruina_scorched_earth:0 "Punitive campaigns and Tatar auxiliaries leave ruined towns, unpaid garrisons, and deserted pastures between the Dniester and Dnieper."
 rip_tur_captive_galley_revolt:0 "Captive Galley Mutinies"
 rip_tur_captive_galley_revolt_title:0 "Captive Galley Mutinies"
 rip_tur_captive_galley_revolt_desc:0 "Chained captives seized from northern steppe raids and Balkan marches fill the imperial rowing benches until desperation erupts in dockyard fires and mutinies at sea."
 desc_rip_tur_captive_galley_revolt:0 "Mass conscription of chained yasyr oarsmen undermines naval morale and exposes dockyards to coordinated escapes."
 rip_plc_bloody_pacification:0 "The Bloody Pacification"
 rip_plc_bloody_pacification_title:0 "The Bloody Pacification"
 rip_plc_bloody_pacification_desc:0 "Magnate private columns, quartering exactions, and summary executions in Ruthenian villages provoke desperate risings across the eastern palatinates."
 desc_rip_plc_bloody_pacification:0 "Coercive pacification in the eastern palatinates tears apart royal authority and drives whole districts into armed flight."
 rip_rus_abolition_of_hetmanate:0 "Dismantling of the Hetmanate and Sich"
 rip_rus_abolition_of_hetmanate_title:0 "Dismantling of the Hetmanate and Sich"
 rip_rus_abolition_of_hetmanate_desc:0 "Suppressing regimental courts, billeting imperial dragoon regiments, and marching Cossack households to northern canal works strips old Ruthenian charters away."
 desc_rip_rus_abolition_of_hetmanate:0 "Imperial centralization in Left-Bank Ruthenia and Zaporozhia breeds tax flight, burned registers, and borderland unrest."
 rip_cri_yasyr_depopulation_crisis:0 "The Empty Steppe and Captive Glut"
 rip_cri_yasyr_depopulation_crisis_title:0 "The Empty Steppe and Captive Glut"
 rip_cri_yasyr_depopulation_crisis_desc:0 "Years of relentless captive-raiding have depopulated neighbouring river valleys, collapsing trade tolls while packed Crimean pens breed plague and retaliatory raids."
 desc_rip_cri_yasyr_depopulation_crisis:0 "Overreliance on captive marts hollows out peacetime customs and invites maritime and steppe retaliation."
 rip_tur_yasyr_port_tithe_title:0 "Enforce the Yasyr Port Tithe"
 rip_tur_yasyr_port_tithe_desc:0 "Station pencik commissioners at Kaffa and Ochakiv to claim the Sultan's fifth of incoming Ruthenian and frontier captives for the treasury and fleet oars."
 rip_tur_podillian_church_seizures_title:0 "Convert Podillian Stone Churches"
 rip_tur_podillian_church_seizures_desc:0 "Seize fortified Ruthenian churches and monastery revenues across conquered Podillian towns to endow garrison mosques, or confirm local dhimma charters."
 rip_tur_devshirme_northern_levy_title:0 "Extend Harsh Devshirme Conscription"
 rip_tur_devshirme_northern_levy_desc:0 "Order Janissary recruiting commissioners to tighten youth levies across Christian districts and newly held northern eyalets, or commute the levy to coin."
 rip_tur_surgun_forced_resettlement_title:0 "Issue Surgun Deportation Edicts"
 rip_tur_surgun_forced_resettlement_desc:0 "Compel guilds, families, and craftsmen from conquered provinces to resettle around Constantinople and strategic fortresses, or rely on voluntary charters."
 rip_tur_celali_anatolian_reprisals_title:0 "Order Iron Pacification in Anatolia"
 rip_tur_celali_anatolian_reprisals_desc:0 "Send grand vizieral punitive columns to crush rebellious Anatolian countryside districts during Celali turmoil, or proclaim a negotiated provincial amnesty."
 rip_tur_balkan_tribute_exactions_title:0 "Double the Danubian & Steppe Requisitions"
 rip_tur_balkan_tribute_exactions_desc:0 "Demand extraordinary grain, sheep, and silver requisitions from Moldavia, Wallachia, and the Yedisan borderlands to pay campaigning armies."
 rip_plc_second_serfdom_corvee_title:0 "Enforce Unlimited Folwark Corvee"
 rip_plc_second_serfdom_corvee_desc:0 "Back magnate manors in demanding five days of weekly peasant labour across Ruthenian river estates, or bind landlords to a statutory corvee ceiling."
 rip_plc_ordinance_of_1638_title:0 "Pass the Crown Cossack Ordinance"
 rip_plc_ordinance_of_1638_desc:0 "Abolish elected Cossack senior officers, install noble Crown commissioners over a reduced register, and reduce unregistered communities to manorial serfdom."
 rip_plc_parish_sequestrations_title:0 "Sequestrate Unyielding Orthodox Parishes"
 rip_plc_parish_sequestrations_desc:0 "Seal parish churches and monastery estates in Ruthenian towns that refuse royal and Latin bishopric decrees, or confirm municipal religious peace."
 rip_rus_kyiv_press_censorship_title:0 "Silence the Kyivan & Chernihiv Presses"
 rip_rus_kyiv_press_censorship_desc:0 "Subordinate Ruthenian printing houses, academy books, and chancery orthography to Synodal censors, or leave local book-printing charters intact."
 rip_cri_kaffa_captive_markets_title:0 "Expand the Kaffa & Perekop Captive Marts"
 rip_cri_kaffa_captive_markets_desc:0 "Grant mirzas and sea-captains tax rebates to channel Ruthenian, Podillian, and Zaporozhian yasyr through expanded pens, or curb raiding under fixed tamga tolls."
 rip_tur_seized_parishes:0 "Seized Parish Properties"
 desc_rip_tur_seized_parishes:0 "Locked churches and confiscated parish endowments leave local Christian townsmen resentful and reluctant to pay taxes."
 rip_tur_uprooted_quarters:0 "Uprooted Artisan Quarters"
 desc_rip_tur_uprooted_quarters:0 "Forced surgun deportations have left workshops shuttered and market stalls half-abandoned."
 rip_tur_great_flight:0 "Peasant Flight of the Turmoil"
 desc_rip_tur_great_flight:0 "Punitive burnings and collective fines have driven villagers into mountain caves and distant cities."
 rip_plc_folwark_exhaustion:0 "Exhausted Corvee Estates"
 desc_rip_plc_folwark_exhaustion:0 "Five-day weekly labour extracts grain exports at the cost of desertions, broken cottages, and hidden smouldering unrest."
 rip_plc_closed_parishes:0 "Sealed Orthodox Churches"
 desc_rip_plc_closed_parishes:0 "Churches padlocked or leased out by royal commissioners turn every feast day into an occasion for riot."
 rip_rus_silenced_presses:0 "Sequestered Kyivan Printing Presses"
 desc_rip_rus_silenced_presses:0 "Type cases packed under Synodal seal choke scholarly exchange and local printing."
 rip_tur_pencik_notoriety:0 "Black Sea Pencik Tithe"
 desc_rip_tur_pencik_notoriety:0 "Systematic captive auctions at imperial ports enrich customs farmers while alarming every Christian neighbour."
 rip_tur_ransom_brokerage:0 "Regulated Ransom Brokerage"
 desc_rip_tur_ransom_brokerage:0 "Limiting the galley tithe in favour of sworn ransom exchanges lowers border tensions at some cost to port fees."
 rip_tur_coercive_eyalet_rule:0 "Coercive Eyalet Administration"
 desc_rip_tur_coercive_eyalet_rule:0 "Converting prominent town churches into mosques speeds religious conformity but alienates local non-Muslim communities."
 rip_tur_podillian_dhimma_charter:0 "Podillian Dhimma Safeguard"
 desc_rip_tur_podillian_dhimma_charter:0 "Guaranteed parish rights under imperial dhimma law calm frontier towns while leaving considerable authority to local elders."
 rip_tur_harsh_devshirme:0 "Rigorous Youth Conscription"
 desc_rip_tur_harsh_devshirme:0 "Expanded devshirme quotas replenish imperial regiments at the price of deep hostility across Christian districts."
 rip_tur_devshirme_commutation:0 "Commuted Levy Rolls"
 desc_rip_tur_devshirme_commutation:0 "Accepting cash commutation instead of youths spares provincial households while slowing manpower replacement."
 rip_tur_surgun_edicts:0 "Imperial Surgun Decrees"
 desc_rip_tur_surgun_edicts:0 "State-directed deportations reshape conquered cities quickly while stirring resentment both at home and abroad."
 rip_tur_voluntary_charters:0 "Voluntary Guild Patents"
 desc_rip_tur_voluntary_charters:0 "Relying on tax-exempt settlement patents rather than forced deportations eases provincial integration."
 rip_tur_iron_pacification:0 "Iron Hand in Anatolia"
 desc_rip_tur_iron_pacification:0 "Summary reprisals break armed bands swiftly yet leave scarred tax rolls and frightened courts."
 rip_tur_anatolian_amnesty:0 "Anatolian Amnesty Charters"
 desc_rip_tur_anatolian_amnesty:0 "Pardons and local tax remissions lure displaced villagers back down from the hills at the cost of softer central oversight."
 rip_tur_danubian_exactions:0 "Danubian Extraordinary Requisitions"
 desc_rip_tur_danubian_exactions:0 "Unannounced wartime levies squeeze more tribute from tributaries while driving hospodars to seek northern protectors."
 rip_tur_fixed_danubian_tribute:0 "Sworn Tributary Roll"
 desc_rip_tur_fixed_danubian_tribute:0 "Honouring fixed peacetime tribute caps keeps Danubian hospodars compliant at a lower fiscal yield."
 rip_plc_second_serfdom:0 "Magnate Folwark Enserfment"
 desc_rip_plc_second_serfdom:0 "Bound peasants produce heavy grain surpluses for river barges while flight and hatred hollow out Crown manpower."
 rip_plc_capped_corvee:0 "Statutory Corvee Ceiling"
 desc_rip_plc_capped_corvee:0 "Royal commissioners restrain landlord labour demands on the eastern estates, calming villages despite noble complaints."
 rip_plc_crown_ordinance:0 "Abolition of Cossack Officers"
 desc_rip_plc_crown_ordinance:0 "Stripping Cossack regiments of elected elders tightens noble authority on the Dnieper while shattering frontier cavalry willingness."
 rip_plc_regimental_liberties:0 "Sworn Regimental Liberties"
 desc_rip_plc_regimental_liberties:0 "Honouring Cossack elections and steppe pensions preserves lively frontier horse at the expense of direct Crown command."
 rip_plc_confessional_coercion:0 "Confessional Sequestration Policy"
 desc_rip_plc_confessional_coercion:0 "Closing contested Orthodox parishes pushes rapid conversion drives while souring relations with every eastern neighbour."
 rip_plc_municipal_confession_peace:0 "Ruthenian Municipal Confession Peace"
 desc_rip_plc_municipal_confession_peace:0 "Chartered brotherhood schools and open parish doors quiet urban guilds while slowing Catholic proselytizing."
 rip_rus_imperial_uniformity:0 "Synodal Print & Chancery Uniformity"
 desc_rip_rus_imperial_uniformity:0 "Mandatory Synodal proofing suppresses distinct Ruthenian print traditions while stiffening scholarly suspicion toward foreign learning."
 rip_rus_ruthenian_charters_spared:0 "Preserved Academy Printing Charters"
 desc_rip_rus_ruthenian_charters_spared:0 "Leaving the Kyivan and Chernihiv presses active spreads Latin and Slavonic learning quickly across imperial dioceses."
 rip_cri_slave_mart_infamy:0 "Notorious Black Sea Captive Marts"
 desc_rip_cri_slave_mart_infamy:0 "Expanded raiding profits Crimean and Nogai horsemen while making settled treaties with Christian courts nearly impossible."
 rip_cri_reformed_tamga:0 "Sworn Salt & Caravan Tamga"
 desc_rip_cri_reformed_tamga:0 "Curbing captive auctions in favour of regular salt, horse, and fur customs improves diplomatic standing at the price of plunder."
 rip_tur_reckoning.1.t:0 "Commissioners for the Yasyr Port Tithe"
 rip_tur_reckoning.1.d:0 "Strings of captives seized along the Dnieper, Podillia, and the steppe march through Perekop toward Black Sea docks at Kaffa and Ochakiv. Treasury scribes urge taking the Sultan's fifth straight into the rowing benches and coffers, while port brokers propose regulated ransom exchanges instead."
 rip_tur_reckoning.1.a:0 "Claim the Sultan's fifth for coin and the fleet."
 rip_tur_reckoning.1.result_tt:0 "Enables captive galley unrest; after 180 days gain Black Sea Pencik Tithe for 15 years and port unrest and devastation in Yedisan and Kaffa."
 rip_tur_reckoning.1.b:0 "Restrict port quotas to ransom brokerage."
 rip_tur_reckoning.2.t:0 "Oarsmen in the Arsenals"
 rip_tur_reckoning.2.d:0 "Word of packed captive pens and chained crews spreads rapidly across northern courts and Black Sea docks, hardening Christian leagues while filling the port quarters with unrest."
 rip_tur_reckoning.2.a:0 "Double the dockyard watch."
 rip_tur_reckoning.3.t:0 "Churches of the Podillian Towns"
 rip_tur_reckoning.3.d:0 "After imperial banners enter Podillia, ulema preachers call for the chief stone churches and monastery estates of Kamianets and its neighbours to be converted into Friday mosques. Local burghers appeal to older Ottoman dhimma charters."
 rip_tur_reckoning.3.a:0 "Seize the churches and assign them as mosque waqfs."
 rip_tur_reckoning.3.result_tt:0 "After 150 days an owned Podillian or Ruthenian Christian province suffers 20 devastation, 6 unrest, and Seized Parish Properties, alongside Coercive Eyalet Administration for 15 years."
 rip_tur_reckoning.3.b:0 "Confirm dhimma protection over the existing parishes."
 rip_tur_reckoning.4.t:0 "Embittered Townsmen Under New Minarets"
 rip_tur_reckoning.4.d:0 "Bells have been melted down and monastery lands apportioned to garrison spahis, but Christian burghers shutter their shops and slip northward whenever patrols thin."
 rip_tur_reckoning.4.a:0 "Place guards at the town gates."
 rip_tur_reckoning.5.t:0 "Tightening the Devshirme Muster"
 rip_tur_reckoning.5.d:0 "Provincial recruiting officers ask leave to sweep wider through Christian villages, overriding old exemptions and widow claims to fill the Janissary barracks quickly. Elders plead instead for a coin commutation."
 rip_tur_reckoning.5.a:0 "Sweep the exemptions aside and take the full levy."
 rip_tur_reckoning.5.result_tt:0 "After 180 days a Christian province loses 1 base manpower (or suffers 20 devastation) and gains 5 unrest, while the Porte gains Rigorous Youth Conscription for 15 years."
 rip_tur_reckoning.5.b:0 "Accept village silver commutation instead."
 rip_tur_reckoning.6.t:0 "Empty Hearths After the Recruiters Depart"
 rip_tur_reckoning.6.d:0 "Young ploughmen have fled into forests and across borders ahead of the muster-clerks, leaving thinned tax rolls and bitter elders behind."
 rip_tur_reckoning.6.a:0 "Send the recruits south to the training companies."
 rip_tur_reckoning.7.t:0 "Surgun Deportation Lists"
 rip_tur_reckoning.7.d:0 "The imperial Divan weighs ordering whole artisan quarters, Greek, Armenian, Slavic, and Jewish households from conquered towns to pack their looms and move under guard to repopulate Constantinople and frontier bastions."
 rip_tur_reckoning.7.a:0 "Enforce the surgun resettlement columns."
 rip_tur_reckoning.7.result_tt:0 "After 180 days two non-Turkish provinces suffer 20 devastation, 5 unrest, and Uprooted Artisan Quarters for 15 years, alongside Imperial Surgun Decrees."
 rip_tur_reckoning.7.b:0 "Issue voluntary tax-exempt settlement charters instead."
 rip_tur_reckoning.8.t:0 "Shuttered Looms Behind the Convoys"
 rip_tur_reckoning.8.d:0 "New workshops open near the Golden Horn, yet the provincial streets whence those families were uprooted remain sullen and half-deserted."
 rip_tur_reckoning.8.a:0 "Register the resettled guilds in Constantinople."
 rip_tur_reckoning.9.t:0 "The Kuyucu Murad Question in Anatolia"
 rip_tur_reckoning.9.d:0 "Discharged musketeers, starved villagers, and Celali commanders paralyse the Anatolian highroads. Commanders advise ruthless collective reprisals and burned rebel villages; kadis warn that scorched valleys will never pay another tax roll."
 rip_tur_reckoning.9.a:0 "Unleash punitive columns and collective fines."
 rip_tur_reckoning.9.result_tt:0 "After 150 days two Anatolian provinces suffer 30 devastation and Peasant Flight of the Turmoil for 15 years, alongside Iron Hand in Anatolia."
 rip_tur_reckoning.9.b:0 "Proclaim an amnesty and lower rural grain dues."
 rip_tur_reckoning.10.t:0 "Wells Filled, Hamlets Abandoned"
 rip_tur_reckoning.10.d:0 "Armed Celali bands have been broken, yet the great flight has emptied whole Anatolian districts whose survivors shelter behind walled towns."
 rip_tur_reckoning.10.a:0 "Verify what remains on the tax registers."
 rip_tur_reckoning.11.t:0 "Extraordinary Levies on the Danubian Marches"
 rip_tur_reckoning.11.d:0 "Quartermasters demand emergency grain carts, mutton herds, and extra silver from Moldavia, Wallachia, and Yedisan far beyond sworn peacetime tribute rolls."
 rip_tur_reckoning.11.a:0 "Force the double requisition through immediately."
 rip_tur_reckoning.11.result_tt:0 "After 180 days Moldavia, Wallachia, and Ruthenian subjects gain 25 liberty desire, a Danubian or Yedisan province suffers 25 devastation and 5 unrest, and the Porte gets Danubian Extraordinary Requisitions."
 rip_tur_reckoning.11.b:0 "Respect the sworn peacetime tribute schedule."
 rip_tur_reckoning.12.t:0 "Resentment in the Tributary Courts"
 rip_tur_reckoning.12.d:0 "Supply wagons creak southward while Moldavian boyars and frontier notables secretly dispatch envoys north to seek foreign guarantees against further seizures."
 rip_tur_reckoning.12.a:0 "Watch the river crossings closely."
 rip_tur_reckoning.13.t:0 "Ruined Towns of the Right Bank"
 rip_tur_reckoning.13.d:0 "Unpaid auxiliaries and scorched-earth raids across Podillia and the Right Bank turn conquered river towns into ash, leaving garrisons stranded amid empty fields and rising rebels."
 rip_tur_reckoning.13.a:0 "Hold the stone citadels and let the countryside burn."
 rip_tur_reckoning.13.b:0 "Pay out silver to restrain the foraging bands."
 rip_tur_reckoning.14.t:0 "Ashes Between Dniester and Dnieper"
 rip_tur_reckoning.14.d:0 "Garrisons stripped local barns bare before winter, driving the remaining Ruthenian villagers either into armed bands or across the steppe."
 rip_tur_reckoning.14.a:0 "Requisition horses and gunpowder at all costs."
 rip_tur_reckoning.14.b:0 "Import emergency grain barges upriver."
 rip_tur_reckoning.15.t:0 "Frontier Patrols Restored"
 rip_tur_reckoning.15.d:0 "The worst burning along the Dniester and Right Bank has subsided, though roofless cottages and neglected orchards mark the borderland for years to come."
 rip_tur_reckoning.15.a:0 "Enter the pacified districts in the roll."
 rip_tur_reckoning.16.t:0 "Oarsmen Rise on the Imperial Galleys"
 rip_tur_reckoning.16.d:0 "Captives taken from Ruthenian towns and coastal raids seize axes and iron pins aboard moored galleys and arsenal yards, setting hulls ablaze in the night."
 rip_tur_reckoning.16.a:0 "Order musketeers to clear the rowing decks by force."
 rip_tur_reckoning.16.b:0 "Replace captive conscripts with salaried oarsmen."
 rip_tur_reckoning.17.t:0 "Escapes from the Black Sea Yards"
 rip_tur_reckoning.17.d:0 "Whole rowing crews have broken their chains at sea or slipped aboard fishing boats along the coast, leaving squadrons undermanned."
 rip_tur_reckoning.17.a:0 "Press dockyard labourers onto the benches."
 rip_tur_reckoning.17.b:0 "Pay bonuses to free coastal rowers."
 rip_tur_reckoning.18.t:0 "Calm Returns to the Rowing Squadrons"
 rip_tur_reckoning.18.d:0 "After heavy losses of oarsmen and burned hulls, dockyard discipline is restored under closer watch."
 rip_tur_reckoning.18.a:0 "Refit the surviving hulls."
 rip_plc_reckoning.1.t:0 "Unpaid Labour on the River Manors"
 rip_plc_reckoning.1.d:0 "Great magnate leaseholders along the Bug, Dniester, and Dnieper demand five days of weekly peasant corvee to feed Baltic grain barges. Royal commissioners warn that villages across Ruthenia are quietly burning barns and slipping away."
 rip_plc_reckoning.1.a:0 "Uphold the landlords' five-day corvee right."
 rip_plc_reckoning.1.result_tt:0 "Enables pacification disaster risk; after 180 days a Ruthenian province gains 6 unrest and Exhausted Corvee Estates for 20 years, and the Commonwealth gains Magnate Folwark Enserfment."
 rip_plc_reckoning.1.b:0 "Bind the manors to a royal corvee ceiling."
 rip_plc_reckoning.2.t:0 "Night Fires at the Granaries"
 rip_plc_reckoning.2.d:0 "Grain barges leave full for Danzig, yet behind them leaseholders demand armed dragoons to track fugitive serfs into the steppe."
 rip_plc_reckoning.2.a:0 "Record the landlords' petitions."
 rip_plc_reckoning.3.t:0 "Abolishing the Cossack Officers"
 rip_plc_reckoning.3.d:0 "After recent frontier clashes, nobles in the Sejm demand tearing up old Cossack liberties: slashing the register, placing noble colonels over every regiment, and turning struck-off Cossacks into manorial peasants under castle oversight."
 rip_plc_reckoning.3.a:0 "Enact the Sejm ordinance and install noble colonels."
 rip_plc_reckoning.3.result_tt:0 "Enables pacification disaster risk; after 150 days Cossacks lose 25 loyalty, a Dnieper or Podillian province suffers 8 unrest and 15 devastation, and the Commonwealth gets Abolition of Cossack Officers."
 rip_plc_reckoning.3.b:0 "Preserve elected regimental colonels and pensions."
 rip_plc_reckoning.4.t:0 "Whispered Councils Below the Rapids"
 rip_plc_reckoning.4.d:0 "Stripped of coats and registers, veteran Cossacks ride out toward Zaporozhia with hidden banners, swearing the ordinance will not survive the spring."
 rip_plc_reckoning.4.a:0 "Reinforce the river forts."
 rip_plc_reckoning.5.t:0 "Padlocked Doors in Ruthenian Parishes"
 rip_plc_reckoning.5.d:0 "Royal sheriffs and church bailiffs wait outside Orthodox churches and brotherhood printing houses in Ruthenian towns, ready to sequester endowments where clergy refuse obedience."
 rip_plc_reckoning.5.a:0 "Execute the sequestrations and seal the churches."
 rip_plc_reckoning.5.result_tt:0 "After 180 days an Orthodox Ruthenian province gains 6 unrest and Sealed Orthodox Churches for 15 years, alongside Confessional Sequestration Policy."
 rip_plc_reckoning.5.b:0 "Proclaim municipal peace for brotherhood parishes."
 rip_plc_reckoning.6.t:0 "Crowds Gather Before the Sealed Nave"
 rip_plc_reckoning.6.d:0 "Parishioners force back church leases and send petitions to Orthodox monarchs beyond the eastern frontier."
 rip_plc_reckoning.6.a:0 "Summon the town bailiffs."
 rip_plc_reckoning.7.t:0 "The Bloody Pacification Begins"
 rip_plc_reckoning.7.d:0 "Armed nobles and hired dragoons ride across Ruthenian villages burning barns, seizing hostages, and enforcing quartering dues. Desperate peasants and townsmen take up scythes and muskets across the palatinates."
 rip_plc_reckoning.7.a:0 "Give the punitive columns full licence."
 rip_plc_reckoning.7.b:0 "Halt the columns and restore local town courts."
 rip_plc_reckoning.8.t:0 "Private Magnate Banners in the Villages"
 rip_plc_reckoning.8.d:0 "Castle retainers collect arrears at sabre-point while Crown emissaries urge a truce before the entire eastern border breaks into open rising."
 rip_plc_reckoning.8.a:0 "Keep the confiscations flowing to the treasury."
 rip_plc_reckoning.8.b:0 "Send royal judges to hear peasant grievances."
 rip_plc_reckoning.9.t:0 "Truce Across the Eastern Palatinates"
 rip_plc_reckoning.9.d:0 "The armed columns pull back to winter quarters, leaving burned estates and wary villages counting the cost of magnate justice."
 rip_plc_reckoning.9.a:0 "Confirm the truce before the Sejm."
 rip_rus_reckoning.1.t:0 "Inspectors for the Kyivan Presses"
 rip_rus_reckoning.1.d:0 "Synodal officials complain that printing houses in Kyiv and Chernihiv issue liturgical editions, primers, and treatises with distinct Ruthenian orthography and independent dedications. An imperial ukaz would bring every press under Petersburg proofing."
 rip_rus_reckoning.1.a:0 "Enforce Synodal censorship and seal local fonts."
 rip_rus_reckoning.1.result_tt:0 "Hasten the Hetmanate crisis; after 180 days Kyiv (or Chernihiv) suffers 6 unrest and Sequestered Kyivan Printing Presses for 20 years, alongside Synodal Print & Chancery Uniformity."
 rip_rus_reckoning.1.b:0 "Spare the academy printing charters."
 rip_rus_reckoning.2.t:0 "The Lavra Type Cases Sealed"
 rip_rus_reckoning.2.d:0 "Boxes of Cyrillic type and manuscript sermons are carted to the governor's chancellery, stirring angry murmurs among Kyiv's students and burghers."
 rip_rus_reckoning.2.a:0 "File the censorship inventory."
 rip_rus_reckoning.3.t:0 "Liquidation of the Hetmanate and Sich"
 rip_rus_reckoning.3.d:0 "Imperial regiments march into the Hetmanate's regimental towns and down to the Dnieper rapids to dissolve the Sich fortress, replace local courts with gubernia governors, and bind free Cossack peasants into tax rolls and canal levies."
 rip_rus_reckoning.3.a:0 "Abolish the regimental charters and raze the Sich."
 rip_rus_reckoning.3.b:0 "Soften the decree with broad local autonomy."
 rip_rus_reckoning.4.t:0 "Canal Levies and Cossack Flight"
 rip_rus_reckoning.4.d:0 "Cossack companies drafted far north to dig marsh canals succumb to fever, while families along the Samara and Orel slip across the border."
 rip_rus_reckoning.4.a:0 "Press the canal drafts regardless of losses."
 rip_rus_reckoning.4.b:0 "Pay compensation and release the frontier levies."
 rip_rus_reckoning.5.t:0 "A Quiet Border Under Gubernia Rule"
 rip_rus_reckoning.5.d:0 "Armed resistance across Left-Bank Ruthenia and Zaporozhia ebbs, leaving old Cossack rolls stowed away in archive chests while provincial tax offices open."
 rip_rus_reckoning.5.a:0 "Close the frontier ledger."
 rip_cri_reckoning.1.t:0 "Brokers of the Kaffa and Perekop Marts"
 rip_cri_reckoning.1.d:0 "Mirzas returning from northern campaigns seek tax cuts to expand the captive pens outside Kaffa and Perekop for Ruthenian and frontier yasyr. Older caravan begs warn that turning the steppe into a slave depot leaves neighbouring valleys empty and attracts retaliatory raids."
 rip_cri_reckoning.1.a:0 "Cut the mart duties and widen the captive pens."
 rip_cri_reckoning.1.result_tt:0 "Hasten the steppe depopulation crisis; after 180 days gain Notorious Black Sea Captive Marts for 15 years while Kaffa (or Crimea) suffers 4 unrest and 15 devastation."
 rip_cri_reckoning.1.b:0 "Curb the slave auctions under fixed caravan tamgas."
 rip_cri_reckoning.2.t:0 "Retaliation Beyond the Fords"
 rip_cri_reckoning.2.d:0 "Crowded auctions swell the mirzas' chests, yet angry chaika fleets and northern embassies accuse the Khanate across every court."
 rip_cri_reckoning.2.a:0 "Post watchmen along the spit."
 rip_cri_reckoning.3.t:0 "Empty Pastures and Plague in the Pens"
 rip_cri_reckoning.3.d:0 "Border districts across Podillia and the Dnieper lie too emptied to feed regular salt caravans, while overcrowding in coastal captive pens spreads fever and triggers rising unrest."
 rip_cri_reckoning.3.a:0 "Seal the infected quarters and scatter the herds."
 rip_cri_reckoning.3.b:0 "Open the pens to diplomatic ransoms and curb raids."
 rip_cri_reckoning.4.t:0 "Coastal Raids and Ruined Caravans"
 rip_cri_reckoning.4.d:0 "Armed boats strike the Crimean roadsteads under night fog to free captives, while salt and fur customs dwindle further."
 rip_cri_reckoning.4.a:0 "Rebuild the coastal earthworks from treasury coin."
 rip_cri_reckoning.4.b:0 "Pull horsemen back from the ports to guard pastures."
 rip_cri_reckoning.5.t:0 "Salt Caravans Return to Perekop"
 rip_cri_reckoning.5.d:0 "With fever abating and regular caravan tamgas taking precedence over empty captive auctions, traders slowly venture across the Perekop causeway again."
 rip_cri_reckoning.5.a:0 "Reopen the Perekop tollhouse."
