 vol_voivodeship_reform:0 "Voivodeship Tradition"
 desc_vol_voivodeship_reform:0 "The ancient Ruthenian voivodes maintain their estates and gather authority through proven valor and council."

 vol_confessional_reform:0 "Confessional Compromise"
 desc_vol_confessional_reform:0 "Orthodox, Uniate, and Catholic traditions find balance through synodal dialogue and mutual tolerance."

 vol_ruthenia_reform:0 "Ruthenian Constitution"
 desc_vol_ruthenia_reform:0 "A codified framework of rights and duties legitimizes the throne and binds the estates to shared purpose."

 vol_cossack_host_reform:0 "Cossack Host Privilege"
 desc_vol_cossack_host_reform:0 "Licensed raiders serve the crown while maintaining their traditional warrior culture and cavalry excellence."

 vol_confessional_academy:0 "Academy of Confessional Harmony"
 desc_vol_confessional_academy:0 "Scholars of multiple faiths gather to teach rhetoric, law, and piety through a Ruthenian program of confessional concord."

 vol_magdeburg_rights:0 "Magdeburg Law Charter"
 desc_vol_magdeburg_rights:0 "City councils and burgher guilds gain self-governance rights, modeled on the prosperity of Western towns."

 vol_voivode_council:0 "Council of Voivodes"
 desc_vol_voivode_council:0 "The ancient warrior nobility coordinates defense and counsel through hereditary assemblies, reinforcing martial tradition."

 vol_black_voivode_legion:0 "Black Voivode Legion"
 desc_vol_black_voivode_legion:0 "An elite standing army of professional soldiers, inspired by the Magyar fekete_sereg, enforces the voivode's will."

 vol_ruthenian_renaissance_reform:0 "Ruthenian Renaissance"
 desc_vol_ruthenian_renaissance_reform:0 "Libraries, printing presses, and academies flourish under royal patronage, spreading Ruthenian culture and learning."

 vol_grand_ruthenia_reform:0 "Grand Ruthenia"
 desc_vol_grand_ruthenia_reform:0 "A true grand power emerges from the Dnieper valleys - uniting Ruthenians under their own crown, independent at last."

 vln_voivodeship_assembly:0 "Volhynian Voivodeship Assembly"
 desc_vln_voivodeship_assembly:0 "The voivodeship assembly coordinates military service, taxation, and provincial consent under Ruthenian law."
 vln_confessional_diet:0 "Confessional Diet"
 desc_vln_confessional_diet:0 "A standing confessional diet mediates religious disputes and prevents sectarian fracture in state governance."
 vln_crown_statutes:0 "Crown Statutes of Ruthenia"
 desc_vln_crown_statutes:0 "Codified crown statutes align elite privilege, administrative order, and provincial obligations in one constitutional frame."

 desc_rus_the_strong_motherland:0 "Trials have hardened our realm, and our soldiers stand firmer than ever."
 desc_rus_the_stable_empire:0 "Steadfast leadership has preserved order and strengthened state stability."
 desc_rus_philosopher_focus:0 "A philosopher's counsel advances enlightened administration and reform."
 desc_rus_natural_scientist_focus:0 "Scientific expertise guides practical innovation across the state."
 desc_rus_artist_focus:0 "Artistic patronage elevates culture and prestige at court."
 desc_rus_treasurer_focus:0 "Careful fiscal oversight improves state finances and efficiency."
 desc_rus_theologian_focus:0 "Theologians strengthen doctrine, unity, and spiritual authority."
 desc_rus_master_of_mint_focus:0 "Mint expertise improves coinage standards and financial management."
 desc_rus_inquisitor_focus:0 "Inquisitorial guidance reinforces confessional discipline and order."

