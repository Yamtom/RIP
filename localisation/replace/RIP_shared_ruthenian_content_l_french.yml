 prussian_republic_desc:0 "Elective civic councils govern a disciplined commonwealth backed by strict Prussian military drill."
 regimental_headquarters_desc:0 "This city serves as headquarters for a Hetmanate regiment."
 regimental_provincial_system:0 "§YRegiments function as military-administrative provinces§!"
 religious_tolerance:0 "Religious Tolerance"
 religious_tolerance_desc:0 "Orthodox and Catholic coexistence, along with Jewish communities and the Uniate Church, creates pragmatic multi-confessionalism. Religious diversity is our strength."
 removed_nepotism:0 "Merit in the Chancery"
 removed_nepotism_desc:0 "Appointing judges, tax collectors, and commanders by proven service rather than family patronage curbs corruption across the divan."
 rep_boyary:0 "Boyary"
 rep_knyazi:0 "Knyazi"
 representation_monarchy_reform:0 "Crown and Estates"
 representation_monarchy_reform_desc:0 "By order of the new constitution, the king is now legally obliged to his citizens as supreme governor."
 restored_orthodox_constantinople:0 "Restored Orthodox Constantinople"
 restored_orthodox_jerusalem:0 "Restored Orthodox Jerusalem"
 restored_ruthenia:0 "Restored Ruthenia"
 revolutionary_empire_desc:0 "A revolutionary empire that has overthrown the old order and seeks to spread its ideals through conquest and reformation."
 revolutionary_republic_desc:0 "A revolutionary republic that has cast aside the chains of monarchy and aristocracy, establishing a government by the people."
 right_bank_development:0 "Right Bank Development"
 right_bank_development_desc:0 "Economic development of the Right Bank."
 righteous_druzhyna:0 "Righteous Druzhyna"
 righteous_druzhyna_desc:0 "Seasoned retainers of the court receive service estates in return for standing ready in arms to defend the principality and the faith."
 righteous_gift:0 "Princely Waqf Endowments"
 righteous_gift_desc:0 "Pious endowments and princely grants support scholars, judges, and local administrators trained to govern the realm."
 rip_BLR_ideas:0 "Belarusian Ideas"
 rip_BLR_ideas_bonus:0 "Belarusian Ambitions"
 rip_BLR_ideas_start:0 "Belarusian Traditions"
 rip_colonize_canada_desc:0 "Fur trappers, merchants and fishermen from our northern rivers have followed cold western waters into the New World, naming their timbered settlements and trading posts Nova Volyn after their ancestral woodlands."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"
 rip_colonize_canada_settlers_desc:0 "Ruthenian craftsmen and trappers have taken passage to Canada aboard friendly foreign vessels, raising farmsteads and wooden chapels within another crown's dominion."
 rip_colonize_canada_settlers_title:0 "Guests in Another's Colony"
 rip_colonize_canada_title:0 "Nova Volyn"
 rip_diaspora.10.a:0 "Let them settle"
 rip_diaspora.10.d:0 "After months at sea, our sponsored households have dropped anchor in a welcoming province of our colonial partner. Timber cabins and workshops already mark their quarter along the harbour, carrying Ruthenian speech and craft to a distant shore under friendly rule."
 rip_diaspora.10.t:0 "Settlers Arrive"
 rip_diaspora.11.a:0 "Let them settle"
 rip_diaspora.11.d:0 "Our sponsored households have landed alongside their parish priest, bringing Ruthenian speech and worship into a friendly colonial partner's province. A chapel bell now rings beside the harbour under our ally's banner."
 rip_diaspora.11.t:0 "Settlers Arrive With Their Priest"
 rip_diaspora.12.a:0 "Let them settle"
 rip_diaspora.12.d:0 "Carts and families have arrived safely in an allied eastern province along the Far Eastern frontier or the Central Asian steppe. Settlers now clear fields and keep their own custom beneath friendly sovereignty."
 rip_diaspora.12.t:0 "Settlers Cross the Border"
 rip_diaspora.13.a:0 "Let them settle"
 rip_diaspora.13.d:0 "Wagons carrying settler families, parish priests and icons have arrived in an allied eastern province. The settlers raise homesteads and keep both their tongue and their ancestral liturgy under friendly rule."
 rip_diaspora.13.t:0 "Settlers Cross the Border With Their Priest"
 rip_diaspora.20.a:0 "Grant the Green Wedge its own crown"
 rip_diaspora.20.d:0 "Our distant settlements across the Amur have grown rich in timber, grain and river trade. Their elders and starshyna now petition the throne for a governor of their own, asking to raise the Green Wedge under our protection."
 rip_diaspora.20.t:0 "The Green Wedge Asks for Its Own Governor"
 rip_diaspora.21.a:0 "Grant the Grey Wedge its own crown"
 rip_diaspora.21.d:0 "Across the Central Asian steppe, our sponsored settlements have grown into thriving frontier towns and caravan posts. Their elders now petition the throne for their own viceroy, seeking to govern the Grey Wedge under our protection."
 rip_diaspora.21.t:0 "The Grey Wedge Asks for Its Own Governor"
 rip_diaspora_australia_desc:0 "Beyond the spice straits, sailors, pioneers and hardy steppe exiles have anchored upon the southern continent, naming their sunlit harbors Nova Tavriya in memory of the Pontic shore."
 rip_diaspora_australia_settlers_desc:0 "Across the distant southern ocean, Ruthenian mariners and settlers have struck roots alongside friendly colonists, building storehouses and tending flocks under another monarch's banner."
 rip_diaspora_australia_settlers_title:0 "Guests on the Southern Continent"
 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_colonial_settlers_desc:0 "Dispatch settlers under royal patronage to an eligible overseas province of a friendly colonial partner, establishing our culture within that holding while leaving ownership untouched. Shares a five-year cooldown with other settlement charters."
 rip_diaspora_colonial_settlers_faith_desc:0 "Send settler households alongside priests and liturgical books to an eligible overseas province of a friendly colonial partner, planting both our culture and faith under its crown. Requires higher diplomatic trust, costs 1 stability and shares the five-year settler cooldown."
 rip_diaspora_colonial_settlers_faith_title:0 "Offer Settlers and the Faith"
 rip_diaspora_colonial_settlers_title:0 "Offer Settlers to a Colony"
 rip_diaspora_mainland_settlers_desc:0 "Dispatch settlers by diplomatic agreement to an eligible province of a friendly partner in the Far East or Central Asia, establishing our culture while leaving ownership untouched. Shares a five-year cooldown with other settlement charters."
 rip_diaspora_mainland_settlers_faith_desc:0 "Send settler families and clergy by diplomatic agreement into an eligible province of a friendly partner in the Far East or Central Asia, planting our culture and faith while leaving ownership untouched. Requires higher diplomatic trust, costs 1 stability and shares the five-year cooldown."
 rip_diaspora_mainland_settlers_faith_title:0 "Offer Settlers and the Faith Across the Border"
 rip_diaspora_mainland_settlers_title:0 "Offer Settlers Across the Border"
 rip_diaspora_of_rus_desc:0 "Gather the overseas communities of the eastern American seaboard, South America and Australia. Complete either Green Wedge route or establish a Ruthenian or Rusyn community at Taman on the Kuban frontier (the Raspberry Wedge). Complete either Grey Wedge route or establish such a community on the steppe of southwestern Siberia and northern Kazakhstan, the Irtysh, Ishim and Akmola lands. A community may live under our rule or under a host with at least +100 opinion of us. A voyage round the world of our own adds renown but is not required."
 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"
 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_root_desc:0 "From 1800, a free kingdom with a port can sponsor households abroad. Some will sail under our charter, others under letters of passage from a friendly court. These settlements imagine a head start on the great migrations of the nineteenth century."
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_settlers_cooldown:0 "Settlers Under Way"
 rip_diaspora_south_america_desc:0 "South of the equator, amid sugar coasts and broad estuary plains, Ruthenian colonists have staked out orchards and river ports, christening their new lands Nova Bratslavshchyna and Sribna Zemlia."
 rip_diaspora_south_america_settlers_desc:0 "Across southern waters, Ruthenian artisans and farmers have settled in Brazil and along the River Plate, preserving their parish brotherhoods under a friendly crown's protection."
 rip_diaspora_south_america_settlers_title:0 "Guests South of the Equator"
 rip_diaspora_south_america_title:0 "Nova Bratslavshchyna and Sribna Zemlia"
 rip_diaspora_usa_desc:0 "Along the wooded bays and river mouths of the western Atlantic, Ruthenian settlers have cleared fields, built stone churches and raised a commonwealth worthy of the name Nova Rus."
 rip_diaspora_usa_settlers_desc:0 "Bearing royal letters of passage, Ruthenian families have found welcome along the eastern seaboard, carving homesteads and keeping their own tongue among an allied crown's colonists."
 rip_diaspora_usa_settlers_title:0 "Guests Along the Seaboard"
 rip_diaspora_usa_title:0 "Nova Rus"
 rip_grant_the_princely_charter:0 "Grant the Princely Charter"
 rip_grant_the_princely_charter_desc:0 "Write down what the princedom keeps - its courts, its levy, its own name in its own charters - and seal it. A subject that has been given something in writing argues about smaller things afterwards."
 rip_grant_the_princely_charter_title:0 "Grant the Princely Charter"
 rip_grant_the_princely_charter_tooltip:0 "Write down what the princedom may keep. It argues about smaller things afterwards, and the nobility that witnessed it will hold you to it."
 rip_grant_the_udil:0 "Grant an Udil"
 rip_grant_the_udil_desc:0 "Hand the subject over as a kinsman's portion rather than a governor's district: it may not be annexed, may not be integrated, will never rank above a duchy, and pays half. It is how this realm is held together, and it is also how it comes apart."
 rip_grant_the_udil_title:0 "Grant an Udil"
 rip_grant_the_udil_tooltip:0 "Hand a kinsman a portion of the realm. Each one held is another claim in the line of seniority, and the cost rises with the count."
 rip_green_wedge_desc:0 "The Green Wedge took shape in the Russian Far East, along the Amur and in the Pacific coastal lands, as settler communities among local peoples rather than as one province of one people. Our charter imagines an earlier start: hold three provinces in the Manchuria region, at least two of them with Ruthenian or Rusyn communities. Local peoples may remain in the rest."
 rip_green_wedge_settlers_desc:0 "Under safe-conducts granted by friendly eastern courts, Ruthenian peasant households have crossed the Amur to till fertile valleys and raise timber churches in the Green Wedge without severing the land from its sovereign."
 rip_green_wedge_settlers_title:0 "Guests Beyond the Amur"
 rip_green_wedge_title:0 "The Green Wedge Breaks Away"
 rip_grey_wedge_desc:0 "The Grey Wedge grew across southwestern Siberia and the northern Kazakh steppe. A charter for our settlers in the Central Asia region imagines an early foothold on the steppe side of that wider settlement zone: three provinces, at least two of them with Ruthenian or Rusyn communities among the local peoples."
 rip_grey_wedge_settlers_desc:0 "By accord with a friendly court, Ruthenian settlers have journeyed onto the open steppe of Central Asia, founding farmsteads and fairs without displacing the reigning ruler."
 rip_grey_wedge_settlers_title:0 "Guests on the Open Steppe"
 rip_grey_wedge_title:0 "The Grey Wedge Breaks Away"
 rip_held_as_an_udil:0 "Held as an Udil"
 rip_HET_ideas:0 "Hetmanate's Ideas"
 rip_HET_ideas_bonus:0 "Hetmanate's Ambitions"
 rip_HET_ideas_start:0 "Hetmanate's Traditions"
 rip_hidden_sync_event.a:0 "Continue"
 rip_hidden_sync_event.d:0 "Internal maintenance event."
 rip_hidden_sync_event.t:0 "Hidden Synchronization Event"
 rip_HLC_ideas:0 "Halycian Ideas"
 rip_HLC_ideas_bonus:0 "Halycian Ambitions"
 rip_HLC_ideas_start:0 "Halycian Traditions"
 rip_KRU_ideas:0 "Rus' Ideas"
 rip_KRU_ideas_bonus:0 "Rus' Ambitions"
 rip_KRU_ideas_start:0 "Rus' Traditions"
 rip_KUY_ideas:0 "Kuyabian Ideas"
 rip_KUY_ideas_bonus:0 "Kuyabian Ambitions"
 rip_KUY_ideas_start:0 "Kuyabian Traditions"
 rip_kyiv_princely_levy:0 "Princely Levy Called"
 rip_lysianskyi_circumnavigation_desc:0 "Yurii Lysianskyi of Nizhyn commanded the Neva in the Russian expedition of 1803-1806. Ivan Krusenstern sailed aboard its companion ship, the Nadezhda. From 1806, a realm whose own sailors have circled the globe may honour a voyage under its own flag. The voyage crowns the diaspora and no longer gates our settlements in the southern lands."
 rip_lysianskyi_circumnavigation_title:0 "A Ruthenian Circumnavigation"
 rip_MSK_ideas:0 "Minsk Ideas"
 rip_MSK_ideas_bonus:0 "Minsk Ambitions"
 rip_MSK_ideas_start:0 "Minsk Traditions"
 rip_MSL_ideas:0 "Mstislavl Ideas"
 rip_MSL_ideas_bonus:0 "Mstislavl Ambitions"
 rip_MSL_ideas_start:0 "Mstislavl Traditions"
 rip_princely_charter:0 "The Princely Charter"
 rip_PRL_ideas:0 "Pereiaslavlian Ideas"
 rip_PRL_ideas_bonus:0 "Pereiaslavlian Ambitions"
 rip_PRL_ideas_start:0 "Pereiaslavlian Traditions"
 rip_revoke_the_udil:0 "Revoke the Udil"
 rip_revoke_the_udil_desc:0 "The portion was given to a kinsman and a kinsman does not give it back. Taking it is done by the same hand that gave it, in front of everyone who was given one, and each of them will spend tonight counting how many swords he could raise. Rome takes back a legateship; a senior prince takes back a birthright."
 rip_revoke_the_udil_title:0 "Revoke the Udil"
 rip_revoke_the_udil_tooltip:0 "Take the portion back. He keeps his throne as an ordinary vassal, gains a claim on you, and every other kinsman holding a portion will hear of it."
 rip_ro_autocephaly:0 "The Church That Elected Its Own"
 rip_ro_sobor_books:0 "Corrected Service Books"
 rip_ro_sobor_books_option:0 "Organize mobilization: +30 Fervor"
 rip_ro_sobor_courts:0 "Settlement of Church Courts"
 rip_ro_sobor_courts_option:0 "Withdraw coercive parish measures and restore the sitting's Authority"
 rip_ro_sobor_current_desc:0 "The council can strengthen the hierarchy, fund religious mobilization, or withdraw coercive parish measures. Each sitting costs 100 ducats, 50 ADM and 10 Authority. It may be repeated after ten years; the chosen outcome is an immediate institutional action."
 rip_ro_sobor_lands:0 "Monastic Lands Confirmed"
 rip_ro_sobor_lands_option:0 "Strengthen the hierarchy: +20 Authority after the sitting's cost"
 rip_RPS_ideas:0 "Polesian Ideas"
 rip_RPS_ideas_bonus:0 "Polesian Ambitions"
 rip_RPS_ideas_start:0 "Polesian Traditions"
 rip_seat_become_chr_desc:0 "[Root.GetName] has not held the seat that gave it its name for a generation, and its court has long sat elsewhere. The old capital of [CHR.GetName] is now ours. We may take that name and its arms, make that seat our capital and rule as its heirs. Our provinces, armies, ruler and treasury remain as they are; the old name passes into memory."
 rip_seat_become_chr_title:0 "Take the Name of [CHR.GetName]"
