l_english:
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_root_desc:0 "Once Global Trade reaches our shores or the Age of Absolutism dawns, a free kingdom with a port can sponsor households abroad. Some will sail under our charter, others under letters of passage from a friendly court. As an optional counterfactual epilogue, this branch imagines early settlements ahead of the mass migrations of the late nineteenth and early twentieth centuries."
 rip_diaspora_counterfactual_epilogue_tt:0 "This optional counterfactual epilogue imagines early overseas and frontier settlements ahead of the mass migrations of the late nineteenth and early twentieth centuries. No national formation or mainland campaign requires it."

 rip_colonize_canada_title:0 "Nova Volyn"
 rip_colonize_canada_desc:0 "Fur trappers, merchants and fishermen from our northern rivers have followed cold western waters into the New World, naming their timbered settlements and trading posts Nova Volyn after their ancestral woodlands."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"

 rip_colonize_canada_settlers_title:0 "Guests of the Crown"
 rip_colonize_canada_settlers_desc:0 "Ruthenian craftsmen and trappers have taken passage to Canada aboard friendly foreign vessels, raising farmsteads and wooden chapels within another crown's dominion."

 rip_lysianskyi_circumnavigation_title:0 "Around the World"
 rip_lysianskyi_circumnavigation_desc:0 "Yurii Lysianskyi of Nizhyn commanded the Neva in the expedition of 1803-1806, while Ivan Krusenstern sailed aboard its companion ship, the Nadezhda. From 1806, a realm whose own sailors have circled the globe may honour a voyage under its own flag. The voyage crowns the diaspora and does not gate our settlements in the southern lands."

 rip_diaspora_usa_title:0 "Nova Rus"
 rip_diaspora_usa_desc:0 "Along the wooded bays and river mouths of the western Atlantic, Ruthenian settlers have cleared fields, built stone churches and raised a commonwealth worthy of the name Nova Rus."

 rip_diaspora_usa_settlers_title:0 "Guests Along the Seaboard"
 rip_diaspora_usa_settlers_desc:0 "Bearing royal letters of passage, Ruthenian families have found welcome along the eastern seaboard, carving homesteads and keeping their own tongue among an allied crown's colonists."

 rip_diaspora_south_america_title:0 "Sribna Zemlia"
 rip_diaspora_south_america_desc:0 "South of the equator, amid sugar coasts and broad estuary plains, Ruthenian colonists have staked out orchards and river ports, christening their new lands Nova Bratslavshchyna and Sribna Zemlia."

 rip_diaspora_south_america_settlers_title:0 "Guests South of the Equator"
 rip_diaspora_south_america_settlers_desc:0 "Across southern waters, Ruthenian artisans and farmers have settled in Brazil and along the River Plate, preserving their parish brotherhoods under a friendly crown's protection."

 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_australia_desc:0 "Beyond the spice straits, sailors, pioneers and hardy steppe exiles have anchored upon the southern continent, naming their sunlit harbors Nova Tavriya in memory of the Pontic shore."

 rip_diaspora_australia_settlers_title:0 "Southern Settlers"
 rip_diaspora_australia_settlers_desc:0 "Across the distant southern ocean, Ruthenian mariners and settlers have struck roots alongside friendly colonists, building storehouses and tending flocks under another monarch's banner."

 rip_green_wedge_title:0 "The Green Wedge"
 rip_green_wedge_desc:0 "The Green Wedge took shape in the Russian Far East, along the Amur and in the Pacific coastal lands, as settler communities among local peoples rather than as one province of one people. Our charter imagines an earlier start: hold three provinces north of the Amur, along its lower course or in the Ussuri and Pacific coast lands, from Albazin to Furdan, at least two of them with Ruthenian or Rusyn communities. Liaodong, Girin, Ningguta and Sakhalin do not count. Local peoples may remain in the rest."

 rip_green_wedge_settlers_title:0 "Guests Beyond the Amur"
 rip_green_wedge_settlers_desc:0 "Under safe-conducts granted by friendly eastern courts, Ruthenian peasant households have crossed the Amur to till fertile valleys and raise timber churches in the Green Wedge without severing the land from its sovereign."

 rip_grey_wedge_title:0 "The Grey Wedge"
 rip_grey_wedge_desc:0 "The Grey Wedge grew across southwestern Siberia and the northern Kazakh steppe. A charter for our settlers in the Central Asia region imagines an early foothold on the steppe side of that wider settlement zone: three provinces, at least two of them with Ruthenian or Rusyn communities among the local peoples."

 rip_grey_wedge_settlers_title:0 "Guests on the Open Steppe"
 rip_grey_wedge_settlers_desc:0 "By accord with a friendly court, Ruthenian settlers have journeyed onto the open steppe of Central Asia, founding farmsteads and fairs without displacing the reigning ruler."

 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_of_rus_desc:0 "Gather the overseas communities of the eastern American seaboard, South America and Australia. Complete either Green Wedge route or establish a Ruthenian or Rusyn community along the Amur and Maritime Primorye. Complete either Grey Wedge route or establish such a community on the steppe of southwestern Siberia and northern Kazakhstan, the Irtysh, Ishim and Akmola lands. A community may live under our rule or under a host with at least +100 opinion of us. A voyage round the world of our own adds renown but is not required."

 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"

 rip_diaspora_settlers_cooldown:0 "Settlers Under Way"
 desc_rip_diaspora_settlers_cooldown:0 "We have recently sent settlers abroad. The next household will need time to gather."

 # Settler decisions and their events (decisions/RIP_RuthenianDiaspora.txt,
 # events/RIP_shared_ruthenian_RuthenianDiaspora.txt).
 rip_diaspora_colonial_settlers_title:0 "Offer Settlers to a Colony"
 rip_dec_settlers_colonial_100_tt:0 "In a region unlocked by a settler mission, a foreign landowner with an unconverted province must have at least +100 opinion of us. For a colonial nation, its overlord must also have that opinion."
 rip_dec_settlers_colonial_140_tt:0 "In a region unlocked by a settler mission, a foreign landowner with a province not yet sharing our culture and faith must have at least +140 opinion of us. For a colonial nation, its overlord must also have that opinion."
 rip_dec_settlers_mainland_100_tt:0 "In a region unlocked by a settler mission, a foreign landowner with an unconverted province must have at least +100 opinion of us."
 rip_dec_settlers_mainland_140_tt:0 "In a region unlocked by a settler mission, a foreign landowner with a province not yet sharing our culture and faith must have at least +140 opinion of us."
 rip_diaspora_colonial_settlers_desc:0 "Choose an eligible overseas region unlocked by our settler missions and dispatch households to a friendly colonial partner's province, establishing our culture while leaving ownership untouched. Shares a three-year cooldown with other settlement charters."

 rip_diaspora_colonial_settlers_faith_title:0 "Offer Settlers and the Faith"
 rip_diaspora_colonial_settlers_faith_desc:0 "Choose an eligible overseas region unlocked by our settler missions and send settler households alongside priests and liturgical books to a friendly colonial partner's province, planting both our culture and faith under its crown. Requires higher diplomatic trust, costs 1 stability and shares the three-year settler cooldown."

 rip_diaspora_mainland_settlers_title:0 "Offer Settlers Across the Border"
 rip_diaspora_mainland_settlers_desc:0 "Choose the Green or Grey Wedge region and dispatch settlers by diplomatic agreement to an eligible province of a friendly partner, establishing our culture while leaving ownership untouched. Shares a three-year cooldown with other settlement charters."

 rip_diaspora_mainland_settlers_faith_title:0 "Offer Settlers and the Faith Across the Border"
 rip_diaspora_mainland_settlers_faith_desc:0 "Choose the Green or Grey Wedge region and send settler families and clergy by diplomatic agreement into an eligible province of a friendly partner, planting our culture and faith while leaving ownership untouched. Requires higher diplomatic trust, costs 1 stability and shares the three-year settler cooldown."

 rip_diaspora.10.t:0 "Choose a Colonial Destination"
 rip_diaspora.10.d:0 "Sponsored households, timberwrights and riverfolk are ready to sail under friendly letters of passage. Which unlocked overseas region shall receive our settlers?"
 rip_diaspora.10.a:0 "Send settlers to Canada"
 rip_diaspora.10.b:0 "Send settlers to the Eastern Seaboard"
 rip_diaspora.10.c:0 "Send settlers to Brazil"
 rip_diaspora.10.e:0 "Send settlers to La Plata"
 rip_diaspora.10.f:0 "Send settlers to Australia"
 rip_diaspora.10.g:0 "Hold the ships in port for now"

 rip_diaspora.11.t:0 "Choose a Destination With Parish Priests"
 rip_diaspora.11.d:0 "Settler families, parish priests and liturgical chests stand ready for departure under trusted allied crowns. Which unlocked overseas region shall receive both our settlers and our rite?"
 rip_diaspora.11.a:0 "Send settlers and priests to Canada"
 rip_diaspora.11.b:0 "Send settlers and priests to the Eastern Seaboard"
 rip_diaspora.11.c:0 "Send settlers and priests to Brazil"
 rip_diaspora.11.e:0 "Send settlers and priests to La Plata"
 rip_diaspora.11.f:0 "Send settlers and priests to Australia"
 rip_diaspora.11.g:0 "Hold the mission in port for now"

 rip_diaspora.12.t:0 "Choose a Frontier Destination"
 rip_diaspora.12.d:0 "Wagons and settler families hold safe-conducts from friendly eastern courts. Toward which unlocked frontier region shall we direct this caravan?"
 rip_diaspora.12.a:0 "Direct settlers to the Green Wedge (Amur and Pacific)"
 rip_diaspora.12.b:0 "Direct settlers to the Grey Wedge (Central Asia)"
 rip_diaspora.12.c:0 "Delay the caravan for now"

 rip_diaspora.13.t:0 "Choose a Frontier Destination With Clergy"
 rip_diaspora.13.d:0 "Carts carrying settler families, parish priests and church bells await royal marching orders under trusted eastern accords. Toward which unlocked frontier region shall they set out?"
 rip_diaspora.13.a:0 "Direct settlers and priests to the Green Wedge (Amur and Pacific)"
 rip_diaspora.13.b:0 "Direct settlers and priests to the Grey Wedge (Central Asia)"
 rip_diaspora.13.c:0 "Delay the caravan for now"

 rip_diaspora.20.t:0 "The Green Wedge Asks for Its Own Governor"
 rip_diaspora.20.d:0 "Our distant settlements across the Amur have grown rich in timber, grain and river trade. Their elders and starshyna now petition the throne for a governor of their own, asking to raise the Green Wedge under our protection."
 rip_diaspora.20.a:0 "Grant the Green Wedge its own crown"
 rip_diaspora.20.b:0 "Establish the Green Wedge as a frontier march"
 rip_diaspora.20.c:0 "Keep the Green Wedge under direct crown rule"

 rip_diaspora.21.t:0 "The Grey Wedge Asks for Its Own Governor"
 rip_diaspora.21.d:0 "Across the Central Asian steppe, our sponsored settlements have grown into thriving frontier towns and caravan posts. Their elders now petition the throne for their own viceroy, seeking to govern the Grey Wedge under our protection."
 rip_diaspora.21.a:0 "Grant the Grey Wedge its own crown"
 rip_diaspora.21.b:0 "Establish the Grey Wedge as a frontier march"
 rip_diaspora.21.c:0 "Keep the Grey Wedge under direct crown rule"

 rip_diaspora_crown_frontier:0 "Crown Frontier Administration"
 desc_rip_diaspora_crown_frontier:0 "Direct royal charters ease governing burdens across distant settler districts while strengthening local workshops and stockades."
 ruthenian_steppe_raid_doctrine_title:0 "Adopt Steppe Raid Doctrine"
 ruthenian_steppe_raid_doctrine_desc:0 "Codify fast cavalry columns, deep reconnaissance, and punitive raids in the Pontic marches."
 ruthenian_frontier_mobility_network_title:0 "Frontier Mobility Network"
 ruthenian_frontier_mobility_network_desc:0 "Build relay stations and corridor tracks to keep armies moving across the steppe despite sparse fort lines."

 ruthenian_eastward.1.t:0 "The Eastern Mandate"
 ruthenian_eastward.1.d:0 "The frontier captains press for a clear mandate: open the steppe to settlement and secure the routes with fort lines and patrols."
 ruthenian_eastward.1.a:0 "Organize the frontier host"
 ruthenian_eastward.1.b:0 "License the steppe trade"

 ruthenian_eastward.2.t:0 "The Ural Gate"
 ruthenian_eastward.2.d:0 "Scouts return from the eastern ridges with maps and warnings. The Ural gate can be held by walls or opened by trade."
 ruthenian_eastward.2.a:0 "Raise the Ural line"
 ruthenian_eastward.2.b:0 "Seed the trade posts"

 ruthenian_eastward.3.t:0 "The Manchurian Horizon"
 ruthenian_eastward.3.d:0 "Beyond the long forests lies a new frontier. Some call for wardens and garrisons, others for chartered companies."
 ruthenian_eastward.3.a:0 "March the wardens east"
 ruthenian_eastward.3.b:0 "Charter frontier companies"

 ruthenian_eastward.4.t:0 "Doctrine of the Steppe Raids"
 ruthenian_eastward.4.d:0 "Our commanders argue that one rigid fort line cannot police the open steppe. We can either rely on hard-hitting raid columns or institutional patrol contracts with frontier communities."
 ruthenian_eastward.4.a:0 "Unleash raiding columns"
 ruthenian_eastward.4.b:0 "License frontier patrols"

 ruthenian_eastward.5.t:0 "Beyond a Single Fort"
 ruthenian_eastward.5.d:0 "The frontier council warns that isolated forts can be bypassed or starved if movement corridors are ignored. We must choose between mobility corridors and a denser chain of fortified nodes."
 ruthenian_eastward.5.a:0 "Open steppe corridors"
 ruthenian_eastward.5.b:0 "Raise a forward fort chain"

 ruthenian_eastward_mandate:0 "Eastern Mandate"
 desc_ruthenian_eastward_mandate:0 "The frontier policy directs manpower and forts toward the eastern steppe."
 ruthenian_frontier_organizers:0 "Frontier Organizers"
 desc_ruthenian_frontier_organizers:0 "Frontier captains standardize patrols and reduce wastage in the marches."
 ruthenian_steppe_trade_licenses:0 "Steppe Trade Licenses"
 desc_ruthenian_steppe_trade_licenses:0 "Licensed caravans and barter stations open new trade income along the steppe routes."
 ruthenian_ural_gate:0 "Ural Gate Opened"
 desc_ruthenian_ural_gate:0 "The Ural approaches are garrisoned and charted, stabilizing the long frontier."
 ruthenian_ural_fortified_line:0 "Ural Fortified Line"
 desc_ruthenian_ural_fortified_line:0 "Fort lines and watch posts harden the ridges against raids."
 ruthenian_ural_trade_posts:0 "Ural Trade Posts"
 desc_ruthenian_ural_trade_posts:0 "Chartered posts turn the Ural approaches into a profitable exchange network."
 ruthenian_manchurian_push:0 "Manchurian Push"
 desc_ruthenian_manchurian_push:0 "Settlers and patrols move east in a coordinated wave."
 ruthenian_manchurian_wardens:0 "Manchurian Wardens"
 desc_ruthenian_manchurian_wardens:0 "Wardens and garrisons keep the eastern frontier stable."
 ruthenian_manchurian_companies:0 "Manchurian Companies"
 desc_ruthenian_manchurian_companies:0 "Chartered companies finance the long supply lines to the east."
 ruthenian_steppe_raid_doctrine_mod:0 "Steppe Raid Doctrine"
 desc_ruthenian_steppe_raid_doctrine_mod:0 "A formal doctrine combines reconnaissance, cavalry raids, and flexible march discipline in the open frontier."
 ruthenian_raiding_columns:0 "Raiding Columns"
 desc_ruthenian_raiding_columns:0 "Fast cavalry detachments strike deep and withdraw before fortified responses can consolidate."
 ruthenian_frontier_patrol_licenses:0 "Frontier Patrol Licenses"
 desc_ruthenian_frontier_patrol_licenses:0 "Licensed patrol hosts coordinate with local guides and merchants to police trade and crossings."
 ruthenian_frontier_mobility_network_mod:0 "Frontier Mobility Network"
 desc_ruthenian_frontier_mobility_network_mod:0 "Relay stations, tracks, and supply depots keep armies moving across the steppe without overreliance on a single fort."
 ruthenian_steppe_corridor_doctrine_mod:0 "Steppe Corridor Doctrine"
 desc_ruthenian_steppe_corridor_doctrine_mod:0 "Mapped corridors and scout relays let field armies outmaneuver fixed positions in the open grasslands."
 ruthenian_forward_fort_chain_mod:0 "Forward Fort Chain"
 desc_ruthenian_forward_fort_chain_mod:0 "A distributed chain of forts and watchposts hardens the frontier against breakthrough raids."
 ruthenian_frontier_waystations_mod:0 "Frontier Waystations"
 desc_ruthenian_frontier_waystations_mod:0 "Waystations supply patrols, circulate intelligence, and support rapid redeployment across the marches."
 ruthenian_open_steppe_corridors_mod:0 "Open Steppe Corridors"
 desc_ruthenian_open_steppe_corridors_mod:0 "Surveyed tracks and relay signals reduce bottlenecks and keep the frontier from hinging on one fort choke point."
 ruthenian_line_fort_node_mod:0 "Fort Line Node"
 desc_ruthenian_line_fort_node_mod:0 "Integrated fort nodes and field depots create depth in defense along the steppe edge."
 black_ruthenia_area:0 "Black Ruthenia"
 black_ruthenia_area_adj:0 "Black Ruthenian"
