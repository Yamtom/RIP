l_english:

 rip_hgc.1.t:0 "The Bull for Mukachevo"
 rip_hgc.1.d:0 "On 19 September 1771 Pope Clement XIV, with the empress behind the petition, issued the bull Eximia regalium and made the Eparchy of Mukachevo a see in its own right. Until now its bishops had governed the Rusyn parishes in the shadow of the Latin Bishop of Eger, who claimed authority over them. The Union of Uzhhorod of 1646 brought these parishes into communion with Rome; it did not give them a bishop who answered only to Rome. The bull does. The chancery asks how the Carpathian parishes are to be governed from here."
 rip_hgc.1.a:0 "Publish the bull and let the eparchy govern itself"
 rip_hgc.1.b:0 "Leave the parishes in Eger's care for now"
 rip_hgc.2.t:0 "A Name for the Church"
 rip_hgc.2.d:0 "In 1774 the empress approves a new name for the church of the Eastern rite in her lands: Greek Catholic, in place of Uniate, so that it is distinguished from the Roman Catholic Church. In the same year a seminary is founded at Saint Barbara's in Vienna, the Barbareum, to train Eastern-rite clergy from the Slavic provinces of the monarchy. The name is a matter of chancery usage and the seminary is a matter of money. The court wants to know whether the treasury will carry both."
 rip_hgc.2.a:0 "Adopt the name and found the seminary"
 rip_hgc.2.b:0 "Keep the old name in the chancery"
