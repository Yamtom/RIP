 rip_church_reconciliation_unrest:0 "Opposition to reconciliation"
 rip_church_request_recognition_desc:0 "Seek recognition within the wider Orthodox communion from 1589. Delay leaves the question open; rejection is a deliberate alternative schism. Constantinople need not be an independent state."
 rip_church_request_recognition_title:0 "Seek recognition of our patriarchate"
 rip_church_revoke_rite_button:0 "Revoke confessional autonomy"
 rip_church_revoke_rite_button_tt:0 "After ten years, revoke the agreement. No refund; +3 local unrest for ten years and a new record of forced integration."
