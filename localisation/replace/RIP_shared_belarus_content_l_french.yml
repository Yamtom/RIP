l_french:
 # Tag-scoped replacement fallback (french): owner=shared_belarus, entity=content.
 ancient_dregovichi:0 "Ancient Dregovichi"
 ancient_dregovichi_desc:0 "The Dregovichi tribe settled the Pripyat basin in the 6th-12th centuries. Our ancient cultural roots predate even the Kyivan state, lending us historical legitimacy."
 baltic_connections:0 "Baltic Connections"
 baltic_connections_desc:0 "Trade with Riga, Reval, and Dorpat brings Baltic crafts and learning to Vitebsk, setting the principality apart from Muscovite predominance."
 battle_of_nemiga:0 "Battle of Nemiga"
 battle_of_nemiga_desc:0 "The 1067 Battle of Nemiga marked Minsk's struggle for independence. This cultural memory inspires our soldiers and strengthens our military traditions."
 belarus_mixed_heritage:0 "Mixed Cultural Heritage"
 belarus_nation_desc:0 "Uniting the cities of Polotsk, Minsk, Turov, Vitebsk, and Mstislavl alongside the Ruthenian statutes of the Grand Duchy, raise a sovereign crown of White Rus'."
 belarus_nation_title:0 "Form Belarus"
 belarus_national_identity:0 "The Belarusian Name"
 belarus_ruthenian_heritage:0 "Ruthenian Heritage"
 belarusian_identity:0 "The Belarusian Name"
 belarusian_identity_desc:0 "Minsk blends Orthodox parishes, Catholic nobles, and urban guild courts into a distinct Belarusian society marked by civic peace."
 belarusian_unity:0 "Belarusian Unity"
 belarusian_unity_desc:0 "Uniting Polotsk, Minsk, Turov, Vitebsk, and Mstislavl binds the Belarusian lands under shared statutes and steadies provincial concord."
 belarusian_unity_movement:0 "Belarusian Unity Movement"
 belarusian_white_rus_crown:0 "Crown of White Rus'"
 belarusian_white_ruthenian_levy:0 "White Ruthenian Levy"
 BLR:0 "Belarus"
 BLR_ADJ:0 "Belarusian"
 BLR_ideas:0 "Belarusian Ideas"
 BLR_ideas_bonus:0 "Belarusian Ambitions"
 BLR_ideas_start:0 "Belarusian Traditions"
 children_of_the_marshes:0 "Children of the Marshes"
 children_of_the_marshes_desc:0 "The vast Pripyat wetlands have shaped our people for centuries. Local knowledge of the marshes provides us with unmatched defensive advantages against invaders who cannot navigate these treacherous waters."
 crossroads_of_rus:0 "Crossroads of Rus'"
 crossroads_of_rus_desc:0 "Minsk occupies the geographic center of Belarus, where trade routes from Vilnius, Smolensk, Polotsk, and Kyiv intersect. This strategic position brings commercial prosperity."
 desc_belarus_mixed_heritage:0 "Multiple traditions coexist in our name and custom."
 desc_belarus_national_identity:0 "A distinct Belarusian custom takes shape."
 desc_belarus_ruthenian_heritage:0 "We embrace our Ruthenian heritage."
 desc_belarusian_unity_movement:0 "A movement for Belarusian unity gains strength."
 desc_belarusian_white_rus_crown:0 "Seven seats of White Rus' stand under one crown."
 desc_belarusian_white_ruthenian_levy:0 "The boyars of Vitebsk, Mogilev and Mstislavl bring their households to the muster."
 desc_dvina_castle_line:0 "Castles and garrisons hold the river crossings."
 desc_dvina_trade_charter:0 "Merchants of Polotsk and Vitebsk trade with Riga under our charter."
 desc_gdl_ruthenian_chancery:0 "Charters and court records are kept in Ruthenian."
 desc_gdl_vilnius_accord:0 "The terms with the Grand Duke are settled, and envoys travel freely."
 desc_minsk_svislach_markets:0 "The markets of Minsk and Mazyr trade grain and timber."
 desc_minsk_trade_fair:0 "A thriving trade fair boosts Minsk commerce."
 desc_mstislavl_border_guard:0 "A permanent border guard strengthens defenses."
 desc_polesian_marsh_tactics:0 "Our forces train for warfare in the Pripyat marshes."
 desc_polesian_timber_trade:0 "Timber exports enrich the Polesian economy."
 desc_polotsk_dvina_quay:0 "The quays of Polotsk load the barges that go down the Dvina."
 desc_polotsk_magdeburg_law:0 "The town magistrate keeps order under the town's own law."
 desc_polotsk_renaissance:0 "Patronage revives Polotsk as a cultural center."
 desc_polotsk_skaryna_press:0 "Printed books in Ruthenian spread learning through the realm."
 desc_polotsk_sophia_precinct:0 "The cathedral precinct has its own privileges and draws pilgrims and clerks."
 desc_turov_episcopal_prestige:0 "The Turov bishopric gains authority and prestige."
 desc_turov_pripyat_wardens:0 "Marsh wardens guard the paths through the Pripyat."
 desc_vitebsk_dvina_prosperity:0 "Dvina trade brings prosperity to Vitebsk."
 dvina_castle_line:0 "Castle Line of the Dvina"
 dvina_trade_charter:0 "Dvina Trade Charter"
 eastern_frontier:0 "Eastern Frontier"
 eastern_frontier_desc:0 "Mstislavl guards the border between Belarus and Russia. Constant warfare with Smolensk, Polotsk, and Muscovy has forged a militarized society."
 forest_and_field:0 "Forest and Field"
 forest_and_field_desc:0 "Minsk sits at the forest-steppe transition, allowing diverse economic development. We benefit from both timber resources and agricultural production."
 forest_wardens:0 "Forest Wardens"
 forest_wardens_desc:0 "Dense forests breed warriors skilled in ambush and guerrilla tactics. Our light infantry excel at rapid strikes and partisan warfare, making occupation of our lands costly for any invader."
 gdl_ruthenian_chancery:0 "Ruthenian Chancery"
 gdl_vilnius_accord:0 "Vilnius Accord"
 hanseatic_connections:0 "Hanseatic Connections"
 hanseatic_connections_desc:0 "Trade with the Hanseatic League brings Baltic crafts and learning to our towns, charting a Western course clear of Moscow's tutelage."
 land_of_forests:0 "Land of Forests"
 land_of_forests_desc:0 "Roads wind through deep woods from the great forest of Belovezha to the smaller stands around our towns. The timber feeds our markets, and the tracks are easier for our scouts to follow than for an invading army."
 legacy_of_vseslav:0 "Legacy of Vseslav the Sorcerer"
 legacy_of_vseslav_desc:0 "Prince Vseslav (1044-1101) defended Polotsk against Kyiv, Novgorod, and even Byzantine influence. His legendary resistance inspires our warriors and legitimizes our independence."
 marsh_defenders:0 "Marsh Defenders"
 marsh_defenders_desc:0 "Centuries of wetland warfare have made us experts in defensive operations. Invaders face impossible terrain and devastating guerrilla attacks."
 minsk_magdeburg_law:0 "Magdeburg Law"
 minsk_magdeburg_law_desc:0 "The town holds its charter of Magdeburg law: a magistracy, its own court, and guilds that answer to the burgomaster rather than to the starosta."
 minsk_svislach_markets:0 "Svislach Markets"
 minsk_trade_fair:0 "Minsk Trade Fair"
 MSK:0 "Minsk"
 MSK_ADJ:0 "Minsk"
 MSK_ideas:0 "Minsk Ideas"
 MSK_ideas_bonus:0 "Minsk Ambitions"
 MSK_ideas_start:0 "Minsk Traditions"
 MSL:0 "Mstislavl"
 MSL_ADJ:0 "Mstislavl"
 MSL_ideas:0 "Mstislavl Ideas"
 MSL_ideas_bonus:0 "Mstislavl Ambitions"
 MSL_ideas_start:0 "Mstislavl Traditions"
 mstislavl_border_guard:0 "Border Guard"
 mstislavl_fortress:0 "Mstislavl Fortress"
 mstislavl_fortress_desc:0 "Our border fortress has been besieged and rebuilt countless times. Defensive expertise is woven into our own customs."
 northern_border:0 "Northern Border"
 northern_border_desc:0 "Polotsk has defended the Rus' lands against Teutonic Knights and Swedish expansion for centuries. Our defensive fortifications along the Dvina are legendary."
 northern_crafts:0 "Northern Crafts"
 northern_crafts_desc:0 "Vitebsk craftsmen are renowned for quality leatherwork, metalwork, and textiles. Our export goods are prized throughout the Baltic region."
 PLT:0 "Polotsk"
 PLT_ADJ:0 "Polotsk"
 plt_city_of_sophia_desc:0 "The cathedral of St. Sophia, raised above the Dvina under Prince Vseslav in the eleventh century, made Polotsk a see of its own long before the Grand Duke sent governors. Historically Polotsk was a voivodeship of the Grand Duchy; a sovereign Polotsk is an alternative-history path. Raise the city to development 16 and give the cathedral precinct its own privileges."
 plt_city_of_sophia_title:0 "City of St. Sophia"
 plt_dvina_castles_desc:0 "Polotsk and Vitebsk hold the Dvina between Livonia and Muscovy. Raise a fort in each town, with a castle garrison and a dry magazine, so that the river line is ours to close."
 plt_dvina_castles_title:0 "Dvina Castles"
 plt_dvina_trade_desc:0 "Wax, flax, hemp, timber and grain go down the Dvina to Riga, and salt, cloth and herring come back up it. Give Polotsk and Vitebsk a marketplace, trade depot or exchange each, with their own scales and weights, so that the profit stays on our river."
 plt_dvina_trade_title:0 "Dvina Merchants"
 PLT_ideas:0 "Polotsk Ideas"
 PLT_ideas_bonus:0 "Polotsk Ambitions"
 PLT_ideas_start:0 "Polotsk Traditions"
 PLT_legacy_of_vseslav:0 "Legacy of Vseslav"
 PLT_legacy_of_vseslav_desc:0 "The memory of Vseslav the Sorcerer inspires Polotsk's people and rulers."
 plt_magdeburg_rights_desc:0 "Late in the fifteenth century the Grand Dukes began to grant Magdeburg law to the great towns of the east, and Polotsk received it in 1498. Give Polotsk a courthouse or town hall, and its magistrate will answer to the town's own law rather than to the voivode."
 plt_magdeburg_rights_title:0 "Magdeburg Rights"
 plt_minsk_lands_desc:0 "Minsk on the Svislach, Mazyr on the Pripyat, Ula and Bobrujsk: the heart of the Grand Duchy's eastern half. Hold all of them, directly or through a subject, and the marsh country lies beyond."
 plt_minsk_lands_title:0 "The Minsk Lands"
 plt_old_principality_desc:0 "The principality of Polotsk once held the Dvina and the headwaters of the Dnieper, and the boyars of Vitebsk, Mogilev and Mstislavl still remember its princes. Show that the old seat is steady, and our lawyers will find the old rights over those towns."
 plt_old_principality_title:0 "The Old Principality"
 plt_pripyat_marshes_desc:0 "Pinsk, Turov and the marsh towns of the Pripyat, where the old Turov bishopric stood and no army moves fast. Hold all of them, directly or through a subject, and the marshes shield our rear while the claims on Smolensk are pressed."
 plt_pripyat_marshes_title:0 "The Pripyat Marshes"
 plt_riga_road_desc:0 "The Dvina does not end at our border: Latgalia holds the middle river and Riga its mouth. Spend 150 ducats on envoys, convoys and a factor in Riga, and the lands along the lower Dvina become claims we may press for a time."
 plt_riga_road_title:0 "The Road to Riga"
 plt_ruthenian_chancery_desc:0 "The Grand Duchy's charters and its Statutes were written in the Ruthenian of its chancery, not in Latin or Lithuanian. Records in our own tongue need clerks and courts in more than one town: reach administrative technology 12 with courthouses or town halls in two provinces."
 plt_ruthenian_chancery_title:0 "Ruthenian Chancery"
 plt_skaryna_press_desc:0 "Francysk Skaryna of Polotsk began printing a Ruthenian Bible at Prague in 1517 and set up a press at Vilnius a few years later. Embrace the printing press at our own court, and learning in the Ruthenian tongue will follow."
 plt_skaryna_press_title:0 "Skaryna's Press"
 plt_vilnius_terms_desc:0 "Between Vilnius, Moscow and Livonia, Polotsk needs a settled word with the Grand Duke. Be his ally or his subject, hold Vilnius yourself, or see his state gone, and the question of terms is closed."
 plt_vilnius_terms_title:0 "Terms with Vilnius"
 plt_white_rus_desc:0 "Polotsk, Vitebsk, Minsk, Turov, Pinsk, Mazyr and Mstislavl: seven seats of the White Ruthenian land, with the Dvina open to the Baltic. Hold all of them as cores, with administrative technology 15, and the crown of White Rus' can be raised. These are also the conditions of the decision to form Belarus."
 plt_white_rus_title:0 "The Crown of White Rus'"
 plt_white_ruthenia_desc:0 "Vitebsk, Mogilev and Mstislavl are the towns that gave White Ruthenia its name in the Grand Duchy's chancery. Hold all of them, directly or through a subject, and the road to Minsk lies open."
 plt_white_ruthenia_title:0 "White Ruthenia"
 polesian_belarus.1.a:0 "Train our troops in marsh warfare"
 polesian_belarus.1.b:0 "Conventional tactics suffice"
 polesian_belarus.1.d:0 "Our ancestors have survived for centuries in the treacherous Pripyat marshes. The wetlands that confound our enemies are our greatest ally. We could train our soldiers in these unique tactics, passing down generations of knowledge about navigating the swamps, ambushing invaders, and using the terrain to our advantage."
 polesian_belarus.1.t:0 "Marsh Warfare Traditions"
 polesian_belarus.10.a:0 "Expand Magdeburg law"
 polesian_belarus.10.b:0 "Maintain central control"
 polesian_belarus.10.d:0 "The Magdeburg rights have brought prosperity to our major cities through self-governance and merchant guilds. We could extend these privileges to more towns, fostering urban development across our realm. However, this would reduce central authority."
 polesian_belarus.10.t:0 "Magdeburg Law Expansion"
 polesian_belarus.2.a:0 "Establish the Polotsk Academy"
 polesian_belarus.2.b:0 "Provide modest support"
 polesian_belarus.2.d:0 "Polotsk once rivaled Kyiv itself in learning and church dignity. Drawing on the fame of Prince Vseslav and the St. Sophia chapter, scholars petition the throne to found an academy restoring Polotsk as a seat of Orthodox learning."
 polesian_belarus.2.t:0 "Polotsk Cultural Renaissance"
 polesian_belarus.20.a:0 "Raise a distinct Belarusian crown and chancery"
 polesian_belarus.20.b:0 "Embrace our Ruthenian heritage"
 polesian_belarus.20.c:0 "Allow both traditions to flourish side by side"
 polesian_belarus.20.d:0 "Many peoples and statutes have shaped the lands between the Dvina and the Pripyat. As we unite Belarus under one crown, the diet asks what name and custom the realm shall carry forward: a distinct Belarusian kingdom set apart from Moscow and Kyiv, an honoured continuation of northern Ruthenian princely heritage, or a realm accommodating both traditions in peace?"
 polesian_belarus.20.t:0 "The Question of Our Name"
 polesian_belarus.3.a:0 "Support the unification movement"
 polesian_belarus.3.b:0 "We are content with our current borders"
 polesian_belarus.3.d:0 "Across the lands of Polotsk, Minsk, Turov, and Vitebsk, a common sentiment grows: we are one people, bound by shared language, culture, and history. Though we have been divided by foreign powers, the dream of a united Belarus persists. Shall we champion this cause?"
 polesian_belarus.3.t:0 "Belarusian Unity Movement"
 polesian_belarus.4.a:0 "Invest in the trade fair"
 polesian_belarus.4.b:0 "Make a modest investment"
 polesian_belarus.4.d:0 "Minsk sits at the crossroads of major trade routes connecting Vilnius, Smolensk, Polotsk, and Kyiv. Merchants from across Eastern Europe gather here. By investing in trade infrastructure and establishing a permanent trade fair, we could dramatically increase Minsk's commercial importance."
 polesian_belarus.4.t:0 "Minsk Trade Fair"
 polesian_belarus.5.a:0 "Support the bishopric generously"
 polesian_belarus.5.b:0 "Limit church influence"
 polesian_belarus.5.d:0 "The ancient bishopric of Turov has served as a spiritual center for centuries. The bishop requests greater support to restore Turov's ecclesiastical prestige and expand the cathedral. This would increase our religious authority throughout the region."
 polesian_belarus.5.t:0 "Turov Episcopal Authority"
 polesian_belarus.6.a:0 "Expand trade infrastructure"
 polesian_belarus.6.b:0 "Focus on craft production"
 polesian_belarus.6.d:0 "Vitebsk commands the strategic Western Dvina trade route connecting us to Riga and the Baltic Sea. By expanding our port facilities and trade infrastructure along the Dvina, we could transform Vitebsk into the premier commercial hub of northern Belarus."
 polesian_belarus.6.t:0 "Vitebsk Dvina Trade"
 polesian_belarus.7.a:0 "Fortify the eastern border"
 polesian_belarus.7.b:0 "Seek diplomatic resolution"
 polesian_belarus.7.d:0 "Mstislavl has always been a contested borderland between Belarus and Russia. Skirmishes with our eastern neighbors grow more frequent. Our military advisors recommend strengthening Mstislavl's defenses and establishing a permanent border guard."
 polesian_belarus.7.t:0 "Mstislavl Border Conflict"
 polesian_belarus.8.a:0 "Embrace the Lithuanian legacy"
 polesian_belarus.8.b:0 "Uphold a name and custom of our own"
 polesian_belarus.8.d:0 "For centuries, our lands were part of the Grand Duchy of Lithuania. While we have established our independence, the Lithuanian legal codes, administrative traditions, and cultural influences remain valuable. Should we embrace this shared heritage?"
 polesian_belarus.8.t:0 "Lithuanian-Belarusian Accord"
 polesian_belarus.9.a:0 "Develop the timber trade"
 polesian_belarus.9.b:0 "Preserve our forests"
 polesian_belarus.9.d:0 "The vast forests and marshes of Polesia contain immense timber resources. By developing a river flotilla to transport logs down the Pripyat to the Dnieper, we could establish a profitable timber trade. However, some worry about over-exploitation of our forests."
 polesian_belarus.9.t:0 "Polesian Timber Economy"
 polesian_endurance:0 "Polesian Endurance"
 polesian_endurance_desc:0 "Centuries of subsisting in harsh wetlands have bred a hardy, self-reliant population. We can sustain low-intensity warfare indefinitely, wearing down wealthier but less resilient enemies."
 polesian_marsh_tactics:0 "Marsh Warfare Tactics"
 polesian_mysticism:0 "Polesian Mysticism"
 polesian_mysticism_desc:0 "Old forest rites linger beneath village Orthodoxy across the Pripyat bogs, binding local speech and custom firmly against outside conformity."
 polesian_nation_desc:0 "Drawing upon the wetland boroughs and ancient seats of Pinsk and Turov, a victorious ruler gathers the Pripyat basin into an independent Principality of Polesia."
 polesian_nation_title:0 "Form Polesia"
 polesian_timber_trade:0 "Timber Trade"
 polotsk_dvina_quay:0 "Polotsk Quays"
 polotsk_independence:0 "Polotsk Independence"
 polotsk_independence_desc:0 "For centuries we have resisted domination by Kyiv, Novgorod, Lithuania, and Moscow. This proud tradition of autonomy defines our national character."
 polotsk_magdeburg_law:0 "Polotsk Magdeburg Law"
 polotsk_nation_desc:0 "Reclaiming the ancient legacy of the Dvina principalities and Hanseatic commerce, restore Polotsk as a proud sovereign seat in the northern borderlands."
 polotsk_nation_title:0 "Restore Polotsk"
 polotsk_renaissance:0 "Polotsk Renaissance"
 polotsk_skaryna_press:0 "Skaryna's Printing House"
 polotsk_sophia:0 "St. Sophia Cathedral"
 polotsk_sophia_desc:0 "Built 1044-1066, our St. Sophia Cathedral symbolizes Polotsk's independence from Kyiv. This ecclesiastical autonomy enhances our prestige and cultural authority."
 polotsk_sophia_precinct:0 "Sophia Precinct"
 river_flotilla:0 "River Flotilla"
 river_flotilla_desc:0 "Turov's shallow-draft river boats can transport troops and raid enemy positions throughout the marshlands. This mobility is a decisive military advantage."
 river_flotilla_tactics:0 "River Flotilla Tactics"
 river_flotilla_tactics_desc:0 "Our shallow-draft boats can navigate waters impassable to foreign vessels. This mobility allows us to raid, smuggle, and transport troops through terrain that cavalry cannot cross."
 river_networks:0 "River Networks"
 river_networks_desc:0 "The Dvina, Pripyat, Nioman, and Sozh create an interconnected river system. Internal commerce and external trade connections flourish."
 RPS:0 "Polesia"
 RPS_ADJ:0 "Polesian"
 RPS_ideas:0 "Polesian Ideas"
 RPS_ideas_bonus:0 "Polesian Ambitions"
 RPS_ideas_start:0 "Polesian Traditions"
 sozh_trade:0 "Sozh Trade"
 sozh_trade_desc:0 "The Sozh river connects Mstislavl to the Dnieper trade system. Though our commerce is limited, it remains strategically valuable."
 TRV:0 "Turov"
 TRV_ADJ:0 "Turov"
 TRV_ideas:0 "Turov Ideas"
 TRV_ideas_bonus:0 "Turov Ambitions"
 TRV_ideas_start:0 "Turov Traditions"
 turov_episcopal_prestige:0 "Turov Episcopal Authority"
 turov_pripyat_wardens:0 "Pripyat Wardens"
 turov_resilience:0 "Turov Resilience"
 turov_resilience_desc:0 "Mongols, Lithuanians, and Poles all failed to fully conquer Turov. Our cultural endurance through centuries of invasion is legendary."
 urban_fortifications:0 "Urban Fortifications"
 urban_fortifications_desc:0 "Minsk Castle and the town walls guard the warehouses and markets where the roads of the region meet."
 vitebsk_dvina_prosperity:0 "Dvina Trade Prosperity"
 vitebsk_magdeburg:0 "Vitebsk Magdeburg Rights"
 vitebsk_magdeburg_desc:0 "Magdeburg law gives the town its magistracy, its market rights and jurisdiction over its own burghers. The voivode's writ stops at the town wall."
 vitebsk_tolerance:0 "Vitebsk Tolerance"
 vitebsk_tolerance_desc:0 "Orthodox Christians, Catholics, and Jews coexist peacefully in Vitebsk. Commercial pragmatism trumps religious conflict."
 VTB:0 "Vitebsk"
 VTB_ADJ:0 "Vitebsk"
 VTB_ideas:0 "Vitebsk Ideas"
 VTB_ideas_bonus:0 "Vitebsk Ambitions"
 VTB_ideas_start:0 "Vitebsk Traditions"
 wetland_economy:0 "Wetland Economy"
 wetland_economy_desc:0 "Fishing, hunting, peat extraction, and forest resources provide a sustainable subsistence economy. We are poor but self-sufficient."
 wetland_fortifications:0 "Wetland Fortifications"
 wetland_fortifications_desc:0 "Our wooden palisades rise from artificial islands within the marshes. These fortifications are nearly impossible to besiege without specialized local knowledge, frustrating even the most determined attackers."
 vtb_dvina_tolls_title:0 "Dvina River Tolls"
 vtb_dvina_tolls_desc:0 "Barges carrying flax, wax, and timber past Vitebsk owe custom to the castle river gate. Expand the town quays and raise Vitebsk's standing."
 vtb_guild_charters_title:0 "Vitebsk Guilds"
 vtb_guild_charters_desc:0 "Charter merchant weigh-houses and artisan workshops in Vitebsk so Dvina commerce settles in our burghers' coffers."
 vtb_baltic_outlet_title:0 "Baltic Outlet"
 vtb_baltic_outlet_desc:0 "Vitebsk's prosperity runs downstream to Riga. Either seize a port on the open sea or bind Riga's masters into close friendship."
 msk_nemiga_burghers_title:0 "Nemiga Burghers"
 msk_nemiga_burghers_desc:0 "Where the Nemiga meets the Svislach, caravans between Vilnius, Polotsk, and Kyiv cross paths. Grow Minsk into a thriving urban seat."
 msk_svislach_workshops_title:0 "Minsk Workshops"
 msk_svislach_workshops_desc:0 "Encourage craft booths, tanneries, and market stalls along the Svislach so the fairs of Minsk anchor White Ruthenian trade."
 msk_crossroads_capital_title:0 "Crossroads Seat"
 msk_crossroads_capital_desc:0 "With courts of law and steady rule, Minsk stands ready to govern the crossroads between Lithuania and the upper Dnieper."
 msl_sozh_bulwark_title:0 "Sozh Bulwark"
 msl_sozh_bulwark_desc:0 "Above the Sozh Valley, Mstislavl guards the eastern gate toward Smolensk. Raise its garrison and earthworks before war reaches the wall."
 msl_eastern_watch_title:0 "Eastern Watch"
 msl_eastern_watch_desc:0 "Keep our regiments mustered at full strength with deep reserves, lest eastern armies strike across the upper Dnieper."
 msl_guard_dnieper_gate_title:0 "Dnieper Gate"
 msl_guard_dnieper_gate_desc:0 "Whoever holds Mstislavl looks straight toward Smolensk and the Upper Dnieper crossings. Press our claims to the eastern marches."
 blr_minor_free_banner_title:0 "Free Banner"
 blr_minor_free_banner_desc:0 "Cast off outside tutelage and raise an armed banner capable of uniting the White Ruthenian principalities."
 blr_minor_white_ruthenia_title:0 "White Ruthenia"
 blr_minor_white_ruthenia_desc:0 "Bring Vitebsk, Mogilev, and Mstislavl under one banner so no rival splits the upper Dnieper basin."
 blr_minor_pripyat_minsk_title:0 "Pripyat & Minsk"
 blr_minor_pripyat_minsk_desc:0 "Join the crossroads of Minsk to the marsh fortresses of Turov and Pinsk, forming one continuous Belarusian heartland."
 blr_minor_proclaim_belarus_title:0 "White Rus' Crown"
 blr_minor_proclaim_belarus_desc:0 "Hold all seven seats from Polotsk and Vitebsk to Minsk, Turov, Pinsk, Mazyr, and Mstislavl as settled cores of one Belarusian realm."
 blr_minor_diplomatic_terms_title:0 "Lithuanian Terms"
 blr_minor_diplomatic_terms_desc:0 "Settle our standing with Vilnius—as partner, sovereign rival, or through allies capable of shielding our autonomy."
 blr_minor_town_laws_title:0 "Magdeburg Towns"
 blr_minor_town_laws_desc:0 "Charter town halls and magdeburg courts across our major burghs so charters and burgher levies sustain the crown."
 blr_minor_ruthenian_press_title:0 "Skaryna Learning"
 blr_minor_ruthenian_press_desc:0 "Embrace printed Ruthenian learning and flourishing urban schools to bind the realm's towns in one written law."
 blr_podlasie_west_title:0 "Podlasie March"
 blr_podlasie_west_desc:0 "Look west toward Brest, Grodno, and Podlasie along the Bug frontier, where Ruthenian towns bridge Crown and Grand Duchy."
 blr_podlasie_secured_title:0 "Hold Podlasie"
 blr_podlasie_secured_desc:0 "With Brest and Podlasie secured, Belarus commands the western river crossings toward Vilnius and Lithuania proper."
 blr_vilnius_march_title:0 "Vilnius Road"
 blr_vilnius_march_desc:0 "Bring the old Lithuanian capital under the Belarusian banner and extend our shipping charter down the lower Niemen and Dvina."
 blr_minsk_seat_title:0 "Royal Minsk"
 blr_minsk_seat_desc:0 "Rebuild Minsk with a grand town court and populous quarters worthy of a united Belarusian kingdom."
 blr_dnieper_river_trade_title:0 "River Markets"
 blr_dnieper_river_trade_desc:0 "Link the grain, timber, and potash markets from the Pripyat and Dnieper through Minsk's staple fairs."
 blr_unified_diet_title:0 "Grand Diet"
 blr_unified_diet_desc:0 "Bind princes, boyars, and burghers in one realm-wide diet supported by provincial courts and stable laws."
 blr_smolensk_claims_title:0 "Eye on Smolensk"
 blr_smolensk_claims_desc:0 "Muster the host along the Sozh and upper Dnieper to contest the great stone fortress at Smolensk."
 blr_smolensk_fortress_title:0 "Hold Smolensk"
 blr_smolensk_fortress_desc:0 "Keep Smolensk garrisoned and ringed by bastion walls, turning the Dnieper gateway into an unbreakable eastern shield."
 blr_eastern_rampart_title:0 "Upper Dnieper"
 blr_eastern_rampart_desc:0 "Extend our border watch along the Chernihiv and Siverian marches, securing the southern approaches to White Rus'."
 blr_statute_codex_title:0 "Law Codex"
 blr_statute_codex_desc:0 "Codify our provincial customs into written Chancery statutes backed by rising burgh workshops and tax rolls."
 blr_confessional_peace_title:0 "Confessional Peace"
 blr_confessional_peace_desc:0 "Preserve harmony among parishes and bishoprics across Belarus so religious strife never fractures the crown."
 blr_golden_statute_title:0 "Golden Statute"
 blr_golden_statute_desc:0 "With printing presses and universities thriving across our towns, promulgate a settled Golden Statute of Belarus."
 blr_dvina_tollhouse:0 "Dvina River Tollhouse"
 desc_blr_dvina_tollhouse:0 "Chartered river tollhouses along the Dvina funnel trade revenue directly into Vitebsk."
 blr_minsk_fairgrounds:0 "Minsk Fairgrounds"
 desc_blr_minsk_fairgrounds:0 "Expanded market squares and weighing stalls anchor Minsk's crossroads commerce."
 blr_sozh_citadel:0 "Sozh Citadel"
 desc_blr_sozh_citadel:0 "Reinforced earthworks and permanent watches guard Mstislavl's crossing over the Sozh."
 blr_minsk_royal_seat:0 "Royal Seat of Minsk"
 desc_blr_minsk_royal_seat:0 "Wide avenues, stone courts, and chartered markets mark Minsk as the capital of Belarus."
 blr_smolensk_bastion:0 "Smolensk Dnieper Bastion"
 desc_blr_smolensk_bastion:0 "Restored stone towers and deep magazines anchor the upper Dnieper frontier."
 blr_vitebsk_guilds:0 "Vitebsk Merchant Guilds"
 desc_blr_vitebsk_guilds:0 "Sworn artisan and river-merchant guilds streamline customs and manufacturing."
 blr_minsk_magistracy:0 "Minsk Crossroads Magistracy"
 desc_blr_minsk_magistracy:0 "Central magistrates coordinate provincial dues and urban charters from Minsk."
 blr_smolensk_watch_doctrine:0 "Smolensk Watch Doctrine"
 desc_blr_smolensk_watch_doctrine:0 "Border garrisons rotate along the upper Dnieper roads to contest eastern advances."
 blr_burgher_courts:0 "Burgher Chancery Courts"
 desc_blr_burgher_courts:0 "Magdeburg courts standardize town records, reducing administrative friction."
 blr_baltic_amber_fleet:0 "Baltic River Fleet"
 desc_blr_baltic_amber_fleet:0 "Belarusian barges and Baltic shipping factors carry timber and flax to northern markets."
 blr_dnieper_dvina_exchange:0 "Dnieper-Dvina Exchange"
 desc_blr_dnieper_dvina_exchange:0 "Synchronized river staples link southern grain with northern naval stores."
 blr_litva_rus_compact:0 "Compact of White Rus'"
 desc_blr_litva_rus_compact:0 "A unified diet balances boyar estates, town magistrates, and royal decrees."
 blr_upper_dnieper_guard:0 "Upper Dnieper Guard"
 desc_blr_upper_dnieper_guard:0 "Permanent frontier regiments drill behind fortified river crossings."
 blr_vilnius_polotsk_synod:0 "Belarusian Confessional Peace"
 desc_blr_vilnius_polotsk_synod:0 "Guaranteed toleration and parish compacts preserve civic peace across denominations."
 blr_white_rus_statute:0 "Golden Statute of Belarus"
 desc_blr_white_rus_statute:0 "Printed legal codes and royal academies anchor modern Belarusian governance."
