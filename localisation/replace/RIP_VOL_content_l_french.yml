 desc_rip_vol_carpathian_compact:0 "Volhynia and Galicia share border garrisons and diplomatic commitments, funded by joint crown contributions."
 desc_rip_vol_cossack_compact:0 "Military participation strengthens recruitment while alienating the nobility."
 desc_rip_vol_federal_compact:0 "Shared defence and diplomacy are financed by crown revenue. This agreement does not create a subject or a new state."
 desc_rip_vol_sejmik_compact:0 "Representative consent lowers the cost of stability and limits absolutism."
 desc_rip_vol_sovereign_crown_modifier:0 "Stronger taxation supports the crown but provokes local opposition."
 desc_rip_vol_voivode_compact:0 "Provincial administration increases governing capacity in exchange for revenue concessions."
 desc_vol_balanced_estates:0 "Estate influence is balanced."
 desc_vol_black_voivode_legion:0 "A standing mercenary and regular corps, fashioned after the Hungarian Black Army, enforces the voivode's writ."
 desc_VOL_border_control:0 "The process of controlling the movement of people and goods across international borders is known as border security. It is a component of national security."
 desc_vol_carpathian_bulwark_modifier:0 "Fortifications defend the Carpathian frontier."
 desc_vol_center_of_learning:0 "The Academy of Ostroh draws Orthodox and humanist scholars from across Ruthenia and beyond."
 desc_vol_chumak_convoy_charters:0 "Escorted ox-wagon convoys and customs charters channel Black Sea salt and steppe trade smoothly into our markets."
 desc_VOL_chumak_modifier:0 "Workshops in the west draw Black Sea traders, leading to fresh convoys and richer trade compacts."
 desc_vol_church_support:0 "Clerical support strengthens legitimacy."
 desc_vol_confessional_academy:0 "Scholars of multiple faiths gather to teach rhetoric, law, and piety through a Ruthenian program of confessional concord."
 desc_vol_confessional_reform:0 "Orthodox, Uniate, and Catholic traditions find balance through synodal dialogue and mutual tolerance."
 desc_vol_constitutional_coronation:0 "A constitutional coronation is held."
 desc_vol_constitutional_focus:0 "Reforms focus on constitutional limits."
 desc_vol_constitutional_framework:0 "A formal constitutional order is established."
 desc_vol_constitutional_triumph:0 "A constitutional victory secures reform."
 desc_vol_cossack_host_reform:0 "Licensed raiders serve the crown while maintaining their traditional warrior culture and cavalry excellence."
 desc_vol_crimean_conquest:0 "Campaigns secure the Crimean frontier."
 desc_vol_cultural_flowering:0 "The arts and learning prosper."
 desc_vol_cultural_tolerance:0 "Tolerance policies strengthen cohesion."
 desc_VOL_dealt_with_the_boyar:0 "After discussing the conditions of the boyars and voicing our own, we reached a compromise that satisfied both parties."
 desc_vol_diplomatic_ascendancy:0 "Diplomacy elevates the realm's status."
 desc_vol_diplomatic_focus:0 "Diplomacy becomes the priority."
 desc_vol_dynastic_prestige:0 "The dynasty gains prestige."
 desc_vol_educational_reform:0 "Education reforms improve expertise."
 desc_vol_enlightened_realm:0 "Enlightened statutes order justice, schooling, and crown administration."
 desc_VOL_godliness:0 "Our state is blessed with the Godliness of the Ruthenian Orthodox Church, with roots dating back to the 15th century when the Metropolitan of Kyiv, Halych, and all Rus was established."
 desc_vol_golden_liberty:0 "Noble liberties shape governance."
 desc_vol_grand_ruthenia_reform:0 "A true grand power emerges from the Dnieper valleys - uniting Ruthenians under their own crown, independent at last."
 desc_vol_imperial_capital:0 "The capital is elevated to imperial status."
 desc_vol_imperial_coronation:0 "The ruler is crowned in imperial ceremony."
 desc_vol_imperial_triumph:0 "Imperial victory consolidates power."
 desc_VOL_invested_in_rus:0 "Buying and selling goods brings coin to every stallholder."
 desc_vol_magdeburg_rights:0 "City councils and burgher guilds gain self-governance rights, modeled on the prosperity of Western towns."
 desc_vol_magnate_support:0 "Magnates support the crown."
 desc_VOL_mastery_of_the_steppes:0 "We learned some useful information about steppe warfare after conquering the Wild pole."
 desc_vol_minority_rights:0 "Minority rights are safeguarded."
 desc_VOL_mod_arch:0 "Ruthenian Baroque architecture, favoured by starshyna patrons and cathedral chapters, pairs Western stucco ornament with solemn eastern proportions."
 desc_vol_multicultural_realm:0 "A diverse realm is governed with care."
 desc_vol_ostroh_bible_legacy:0 "The 1581 Ostroh Bible anchors liturgical learning and scholarly prestige throughout the Ruthenian lands."
 desc_vol_ostroh_printing_house:0 "Master printers and type-founders turn Ostroh into the foremost publishing centre of Ruthenian letters."
 desc_vol_prosperous_realm:0 "Economic growth strengthens the realm."
 desc_VOL_protectors_of_ruthenia:0 "As the guardians of the Ruthenian people, they look up to us as their leaders, and we have a greater degree of control over them."
 desc_VOL_re_establishment_of_kyiv:0 "With Kyiv re-established as the capital of Rus', we can begin restoring it to its former glory."
 desc_VOL_rebuild_nation:0 "Now that Halychia and Volhynia have been united, we must rebuild our nation so that we can conquer Rus'."
 desc_vol_religious_harmony:0 "Religious harmony improves stability."
 desc_vol_ruthenia_reform:0 "A codified framework of rights and duties legitimizes the throne and binds the estates to shared purpose."
 desc_vol_ruthenian_empire:0 "An empire is proclaimed."
 desc_VOL_ruthenian_renaissance:0 "A cultural and scientific explosion combining the work of ancient masters with the ingenuity of our people."
 desc_vol_ruthenian_renaissance_reform:0 "Libraries, printing presses, and academies flourish under royal patronage, spreading Ruthenian culture and learning."
 desc_vol_ruthenian_sejm:0 "A representative sejm shapes policy."
 desc_vol_successful_reform:0 "Reform efforts succeed."
 desc_vol_twin_capitals:0 "Twin capitals share administrative duties."
 desc_VOL_unity:0 "Together, we are many and strong. In unity lies our strength, and all who live in our land can benefit from it."
 desc_vol_voivode_council:0 "The ancient warrior nobility coordinates defense and counsel through hereditary assemblies, reinforcing martial tradition."
 desc_vol_voivodeship_reform:0 "The ancient Ruthenian voivodes maintain their estates and gather authority through proven valor and council."
