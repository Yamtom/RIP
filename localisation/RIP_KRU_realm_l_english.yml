l_english:
 # --- ruthenian_factional_court_mechanic (vanilla factions + States General coalition) ---
 kru_court_the_knyazi:0 "Court the Knyazi"
 kru_court_the_knyazi_desc:0 "Favour the princes of the blood - honours, precedence, a hearing at every rada. Their standing in the faction rises, and the crown's own legitimacy rises with theirs. Their influence rises by §G25§!, and the pair on the States General bar is checked at once."
 kru_court_the_boyary:0 "Court the Boyary"
 kru_court_the_boyary_desc:0 "Favour the boyar houses and the chartered towns - offices, charters, a share of the customs. Their standing in the faction rises, and the treasury takes it in. Their influence rises by §G25§!, and the pair on the States General bar is checked at once."
 kru_court_the_starshyna:0 "Court the Starshyna"
 kru_court_the_starshyna_desc:0 "Favour the Cossack starshyna - regimental appointments, land for the officers, the register widened. Their standing in the faction rises, and the host is readier for it. Their influence rises by §G25§!, and the pair on the States General bar is checked at once."
 KRU_junior_knyazi:0 "Knyazi in the Coalition"
 desc_KRU_junior_knyazi:0 "The princely faction holds substantial sway in the Rada as a junior coalition partner, lending dynastic legitimacy and diplomatic weight."
 KRU_junior_boyary:0 "Boyary in the Coalition"
 desc_KRU_junior_boyary:0 "The boyar houses and city burghers sit as junior coalition partners, streamlining provincial revenues and administrative costs."
 KRU_junior_starshyna:0 "Starshyna in the Coalition"
 desc_KRU_junior_starshyna:0 "The Cossack starshyna wields considerable influence as a junior partner in the coalition, stiffening army discipline and cavalry muster."

 KRU_factional_pair_shift_cooldown:0 "A Truce Between the Court Parties"
 desc_KRU_factional_pair_shift_cooldown:0 "The dominant court coalition has recently shifted. Another shift will not happen immediately."
 KRU_pair_knyazi_boyary:0 "Dominant Pair: Knyazi-Boyary"
 desc_KRU_pair_knyazi_boyary:0 "Knyazi and Boyary currently dominate the court; Hetmany remain influential but outside the ruling pair."
 KRU_pair_knyazi_hetmany:0 "Dominant Pair: Knyazi-Hetmany"
 desc_KRU_pair_knyazi_hetmany:0 "Knyazi and Hetmany currently dominate the court; Boyary remain influential but outside the ruling pair."
 KRU_pair_boyary_hetmany:0 "Dominant Pair: Boyary-Hetmany"
 desc_KRU_pair_boyary_hetmany:0 "Boyary and Hetmany currently dominate the court; Knyazi remain influential but outside the ruling pair."
 KRU_courting_boyary:0 "Courting the Boyary"
 KRU_courting_knyazi:0 "Courting the Knyazi"
 KRU_courting_starshyna:0 "Courting the Starshyna"
 KRU_princes_court:0 "Princes' Court"
 desc_KRU_princes_court:0 "The princes dominate the court, strengthening vassal ties and diplomatic standing."
 KRU_boyar_duma:0 "Boyar Duma"
 desc_KRU_boyar_duma:0 "The boyars steer policy toward fiscal stability and noble privilege."
 KRU_hetman_council:0 "Hetman Council"
 desc_KRU_hetman_council:0 "Hetmans lead the realm, focusing on martial readiness and cavalry power."
 knyazi:0 "Knyazi"
 knyazi_desc:0 "Dynastic princes: legitimacy, diplomacy, and fiscal stewardship, at the cost of military recovery focus."
 boyary:0 "Boyary"
 boyary_desc:0 "Administrative magnates: stability and bureaucracy, but with stronger noble inertia and autonomy pressure."
 boyars_desc:0 "The boyars seek fiscal stability and noble privilege."

 KRU_decadence_low:0 "Ruthenian Decadence"
 desc_KRU_decadence_low:0 "Factional rivalries begin to erode the authority of the court."
 KRU_decadence_medium:0 "Deepening Decadence"
 desc_KRU_decadence_medium:0 "Court struggles sap the state's coherence and capacity."
 KRU_decadence_high:0 "Severe Decadence"
 desc_KRU_decadence_high:0 "The realm frays as factions undermine authority at every level."
 KRU_decadence_appeased:0 "Costly Appeasement"
 desc_KRU_decadence_appeased:0 "Temporary peace was bought at the expense of revenues and stability."
 rus_nation_title:0 "Centralize Kyivan Rus"
 rus_nation_desc:0 "Unite the lands of Kyivan Rus under a single, strong ruler and create a centralized state. This will require significant effort, but it will also bring great rewards."


 kru_confederation_balance_desc:0 "The Sich Rada still gathers to guard Cossack privileges, yet the hetman's bulava now commands lasting authority. Republican custom tempers the crown, legitimacy steadies the realm, and absolutist pretensions are kept in check."
 disorderly_princes:0 "Disorderly Princes"
 disorderly_princes_title:0 "Disorderly Princes"
 disorderly_princes_desc:0 "The princes of Rus' have grown tired of foreign interference and have united to fight for their independence. They will not rest until they have achieved their goal, and the realm may be thrown into chaos as a result."
 governmental_disruption:0 "Governmental Disruption"
 governmental_disruption_title:0 "Governmental Disruption"
 governmental_disruption_desc:0 "Following the recent reforms to the monarchy, the government has become increasingly unstable. Corruption and infighting have taken hold, and the future of the state is uncertain. It is up to the ruler to restore order and stability, or risk the collapse of the entire realm."
 boyar_elite_reform:0 "Boyar Rada"
 boyar_elite_reform_desc:0 "Even the most capable kings cannot rule alone and need capable councillors to guide them."
 Absolute_hegemony_of_the_east:0 "Absolute Rule of the East"
 Absolute_hegemony_of_the_east_desc:0 "We hold absolute rule over Eastern Europe, and no one dares to question our power."
 princes_revolt.1t:0 "Uprising of the Principalities"
 princes_revolt.1d:0 "Finally, a skirmish broke out between the princes of Lithuania and the princes of Rus' after prolonged disputes between them, which led to other princes forming a broad coalition to wage war. Our dukes only need a formal declaration of war to start a war."
 princes_revolt.1a:0 "Meet the princes face to face."
 princes_revolt.1b:0 "It's just a matter of time."
 princes_revolt.3t:0 "Occupation of Vilnius"
 princes_revolt.3d:0 "We have conquered the capital of Lithuania, greatly disrupting the ranks of the enemy. This is an excellent time to demand peace."
 princes_revolt.3a:0 "We won!"
 princes_revolt.0t:0 "There is Kyiv"
 princes_revolt.0d:0 "The goal of Kyiv, as the capital of Rus, is to restore its former glory. Will it succeed, or will it fall to the ambitions of its rivals?"
 princes_revolt.0a:0 "Interesting."
 boyars:0 "Boyars"
 princes_revolt.2t:0 "Disorderly Princes"
 princes_revolt.2d:0 "The princes have revolted against our rule, challenging our authority."
 princes_revolt.2a:0 "Rebels Win"

 kru_confederation_established:0 "Kyivan Confederation Proclaimed"
 desc_kru_confederation_established:0 "The Kyivan Confederation unites the estates of Ruthenia beneath one banner as heir to ancient Rus'."

