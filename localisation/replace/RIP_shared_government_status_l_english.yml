 rip_gov_kru_title:0 "§YRada of Three Estates§!"
 rip_gov_kru_title_tt:0 "The balance bar shows the two blocs that lead the rada: the bloc that is SECOND by influence stands on the LEFT, the dominant bloc - the faction in power - on the RIGHT. The third bloc is the opposition and is not on the bar.\nWhen the leading pair changes, the Rada shifts to the standing held by that pair under the Rada of Three Estates.\nThe bar is centred while the leader has under 50 influence and moves right by a quarter, a half and three quarters at 50, 55 and 60; the bloc on the side in power gives its floor modifiers. The leader also keeps its faction-in-power standing. The runner-up keeps a junior voice from 38 influence.\nThe record refreshes every month and after every court ability. Where no Estates balance bar is active, the leading pair, the faction council and the court abilities still govern the realm."
 rip_gov_kru_purpose:0 "Balance the ruling coalition and contain court decadence."
