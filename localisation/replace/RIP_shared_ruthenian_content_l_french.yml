 desc_rip_diaspora_settlers_cooldown:0 "We have recently sent settlers abroad. The next household will need time to gather."
 desc_rip_hadiach_offer_refused:0 "The offer was made and turned down. It will not be made again while the men who refused it are still at the table."
 desc_rip_held_as_an_udil:0 "Our land is held as a prince's udil. Recognition of this dynastic grant strengthens legitimacy, eases unrest and supports the local levy."
 desc_rip_princely_charter:0 "The overlord has confirmed our princely rights by charter. This settlement strengthens the prince's legitimacy, eases unrest and reduces our desire for independence."
 desc_rip_register_asked_recently:0 "The roll has been argued over once this decade already, and neither court wants to open it again so soon."
 desc_rip_register_confirmed:0 "The roll is written into a charter rather than agreed before a campaign and forgotten after it. A Cossack on a confirmed register knows what he is, which is the whole of what was ever being asked for."
 desc_rip_ro_sobor_books:0 "Readers receive new books, while dissenting clergy contest the corrections."
 desc_rip_ro_sobor_courts:0 "The throne's rights are recorded, but disputes must pass through the church courts."
 desc_rip_ro_sobor_lands:0 "The church keeps its estates at the expense of the treasury."
 desc_rip_the_rota_1:0 "One kinsman holds land of his own, and one claim stands in the line of seniority behind yours."
 desc_rip_the_rota_2:0 "Two kinsmen hold land of their own. They have not yet worked out that they outnumber you, and they will."
 desc_rip_the_rota_3:0 "Three kinsmen hold land of their own. The seniority that decides who follows you is now an argument with three sides and no arbiter."
 desc_rip_the_rota_4:0 "Four kinsmen hold land of their own. The realm is held together by the same thing that is pulling it apart, and everyone at court can name it."
 desc_rip_the_rota_5:0 "Five kinsmen hold land of their own. This is the arrangement that ended the Kyivan realm, and it ended it exactly here - not in a war, but in a succession nobody could settle."
 desc_rip_the_udil_revoked:0 "The senior prince took back what he had given. Every other kinsman holding a portion heard about it within the month, and none of them has stopped thinking about it since."
 desc_ruthenian_eastward_mandate:0 "The frontier policy directs manpower and forts toward the eastern steppe."
 desc_ruthenian_forward_fort_chain_mod:0 "A distributed chain of forts and watchposts hardens the frontier against breakthrough raids."
 desc_ruthenian_frontier_mobility_network_mod:0 "Relay stations, tracks, and supply depots keep armies moving across the steppe without overreliance on a single fort."
 desc_ruthenian_frontier_organizers:0 "Frontier captains standardize patrols and reduce wastage in the marches."
 desc_ruthenian_frontier_patrol_licenses:0 "Licensed patrol hosts coordinate with local guides and merchants to police trade and crossings."
 desc_ruthenian_frontier_waystations_mod:0 "Waystations supply patrols, circulate intelligence, and support rapid redeployment across the marches."
 desc_ruthenian_line_fort_node_mod:0 "Integrated fort nodes and field depots create depth in defense along the steppe edge."
 desc_ruthenian_manchurian_companies:0 "Chartered companies finance the long supply lines to the east."
 desc_ruthenian_manchurian_push:0 "Settlers and patrols move east in a coordinated wave."
 desc_ruthenian_manchurian_wardens:0 "Wardens and garrisons keep the eastern frontier stable."
 desc_ruthenian_open_steppe_corridors_mod:0 "Surveyed tracks and relay signals reduce bottlenecks and keep the frontier from hinging on one fort choke point."
 desc_ruthenian_raiding_columns:0 "Fast cavalry detachments strike deep and withdraw before fortified responses can consolidate."
 desc_ruthenian_steppe_corridor_doctrine_mod:0 "Mapped corridors and scout relays let field armies outmaneuver fixed positions in the open grasslands."
 desc_ruthenian_steppe_raid_doctrine_mod:0 "A formal doctrine combines reconnaissance, cavalry raids, and flexible march discipline in the open frontier."
 desc_ruthenian_steppe_trade_licenses:0 "Licensed caravans and barter stations open new trade income along the steppe routes."
 desc_ruthenian_ural_fortified_line:0 "Fort lines and watch posts harden the ridges against raids."
 desc_ruthenian_ural_gate:0 "The Ural approaches are garrisoned and charted, stabilizing the long frontier."
 desc_ruthenian_ural_trade_posts:0 "Chartered posts turn the Ural approaches into a profitable exchange network."
 desc_salt_state_monopoly:0 "The state tightens control over salt."
 desc_seeking_anti_crusade_allies:0 "Diplomatic efforts to counter a crusade."
 desc_settled_urban_economy:0 "Settling in cities brings economic benefits but reduces our nomadic mobility."
