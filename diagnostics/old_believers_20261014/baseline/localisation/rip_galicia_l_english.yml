l_english:
 rip_galicia.1.t:0 "The Galician Settlement"
 rip_galicia.1.d:0 "With Red Ruthenia and Volhynia secured, Galicia must be ordered anew. Shall the realm bind the marches to a stronger frontier crown, or ratify a compact of estates centered on Halych?"
 rip_galicia.1.a:0 "Consolidate the Frontier Crown"
 rip_galicia.1.b:0 "Ratify the Halych Compact"

 rip_galicia.2.t:0 "Confessional Settlement in Galicia"
 rip_galicia.2.d:0 "Bishops, brotherhoods, and town elders demand a durable religious settlement. We may codify a synod of union, or guarantee the Orthodox brotherhoods as pillars of the realm."
 rip_galicia.2.a:0 "Codify the Halych Synod"
 rip_galicia.2.b:0 "Guarantee the Brotherhoods"

 rip_galicia.3.t:0 "The Statutes of Galicia"
 rip_galicia.3.d:0 "Jurists in Lviv now press for a lasting order. We may proclaim a common statute that binds crown, estates, and towns, or entrust reform to a disciplined frontier court."
 rip_galicia.3.a:0 "Promulgate the Statutes of Danylo"
 rip_galicia.3.b:0 "Entrust the Crown to the Host"

 hlc_the_boyars_take_power_title:0 "The Boyars Take Power"
 hlc_the_boyars_take_power_desc:0 "The Boyar Rada may depose the dynasty during a succession crisis: legitimacy must be below 50, or below 60 with no heir. The independent Galician state must also have at least +1 stability before it elects a voivode."
 hlc_elevate_the_metropolitan_title:0 "Seat the Metropolitan of Halych"
 hlc_elevate_the_metropolitan_desc:0 "An independent Galician state may place its metropolitan at the head of government with at least +1 stability. It needs 50% Patriarch Authority as an Orthodox state or 35% Hierarchical Capacity as a Greek Catholic state."

 rip_galicia_carpathian_shield:0 "Frontier Crown"
 desc_rip_galicia_carpathian_shield:0 "Fortified passes, sworn garrisons, and a disciplined chancery bind the Carpathian marches to the crown."

 rip_galicia_halych_sejm:0 "Halych Compact"
 desc_rip_galicia_halych_sejm:0 "Regional estates and towns secure influence over taxation and law through a negotiated compact in Halych."

 rip_galicia_sejm_uniate:0 "Synodal Compact"
 desc_rip_galicia_sejm_uniate:0 "A Galician synod balances church union, estate privilege, and provincial oversight."

 rip_galicia_uniate_synod:0 "Halych Synod"
 desc_rip_galicia_uniate_synod:0 "Clergy, schools, and presses are coordinated through a local synod that ties reform to crown service."

 rip_galicia_orthodox_bastion:0 "Brotherhood Bastion"
 desc_rip_galicia_orthodox_bastion:0 "Orthodox brotherhoods, monasteries, and town patrons anchor Ruthenian loyalty across the realm."

 rip_galicia_constitution:0 "Statutes of Danylo"
 desc_rip_galicia_constitution:0 "A common statute binds crown, estates, and towns into a workable Ruthenian constitutional order."

 rip_galicia_crown_and_sabre:0 "Crown and Host"
 desc_rip_galicia_crown_and_sabre:0 "The crown relies on drilled frontier officers and loyal service elites to enforce order."

 galician_sejm_assembly:0 "Halych Sejm Assembly"
 desc_galician_sejm_assembly:0 "The Halych Sejm Assembly expands governing capacity and bolsters legitimacy through provincial consent and deliberation."

 rip_galicia_boyar_supremacy:0 "Boyar Supremacy"
 desc_rip_galicia_boyar_supremacy:0 "The boyar council answers to no prince: it elects the voivode and holds him to its own privileges."

 rip_galicia_halych_see:0 "The Halych See"
 desc_rip_galicia_halych_see:0 "A metropolitan of Halych's own tends the province's faith and stands as the visible head of the realm."

 rip_galicia_metropolitanate_confirmed:0 "Synodal Confirmation"
 desc_rip_galicia_metropolitanate_confirmed:0 "A patriarchal tomos has settled the Halych see's standing against Kyiv and Moscow, for as long as Constantinople holds to it."

 rip_galicia_lviv_union_synod:0 "The Lviv Union"
 desc_rip_galicia_lviv_union_synod:0 "The eparchy's synod sits within the Roman fold now, its Byzantine rite and local governance otherwise undisturbed."
