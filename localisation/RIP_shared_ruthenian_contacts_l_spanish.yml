l_spanish:
 rip_rus_kyiv_scribes_title:0 "Escribas de Kyiv"
 rip_rus_kyiv_scribes_desc:0 "Invitemos a los escribas de Kyiv a nuestra corte. Un acuerdo con el soberano de la ciudad puede garantizar el paso de sus manuscritos."
 rip_rus_copy_ruthenian_books_title:0 "Los copistas"
 rip_rus_copy_ruthenian_books_desc:0 "Reservemos una sala para los copistas en una iglesia de la capital. Nuestros contactos en Leópolis o Volinia pueden aportar manuscritos rutenos."
 rip_rus_ruthenian_press_title:0 "Imprenta rutena"
 rip_rus_ruthenian_press_desc:0 "Reunamos a copistas e impresores en la capital. Con la imprenta y una ruta abierta a Kyiv, los libros llegarán a más lectores."
 rip_rus_kyiv_scribes_alt_title:0 "$rip_rus_kyiv_scribes_title$"
 rip_rus_kyiv_scribes_alt_desc:0 "$rip_rus_kyiv_scribes_desc$"
 rip_rus_copy_ruthenian_books_alt_title:0 "$rip_rus_copy_ruthenian_books_title$"
 rip_rus_copy_ruthenian_books_alt_desc:0 "$rip_rus_copy_ruthenian_books_desc$"
 rip_rus_ruthenian_press_alt_title:0 "$rip_rus_ruthenian_press_title$"
 rip_rus_ruthenian_press_alt_desc:0 "$rip_rus_ruthenian_press_desc$"
 rip_pol_carpathian_passes_title:0 "Pasos de montaña"
 rip_pol_carpathian_passes_desc:0 "Aseguremos el paso entre Hálych y Maramureș para que los mercaderes rusinos puedan llevar sal y ganado a través de los Cárpatos."
 rip_pol_rusyn_fairs_title:0 "Ferias rusinas"
 rip_pol_rusyn_fairs_desc:0 "Equipemos los mercados de Hálych y Peremyshl. Los mercaderes que bajan de los puertos de montaña necesitan puestos, balanzas y almacenes."
 rip_pol_lviv_charters_title:0 "Cartas de Leópolis"
 rip_pol_lviv_charters_desc:0 "Confirmemos en Leópolis los peajes y los derechos de los mercaderes de la montaña. Una carta expedida por una ciudad próspera tendrá peso a ambos lados de los pasos."
 rip_tat_ruthenian_yarlyks_title:0 "Yarlyks rutenos"
 rip_tat_ruthenian_yarlyks_desc:0 "Los príncipes de la Rus' viajaban antaño a Sarái para obtener las cartas que confirmaban sus tronos, y las pagaban. Quien domine las tierras rutenas, o tenga a sus príncipes como súbditos, puede cerrar de nuevo el mismo trato."
 rip_tat_ruthenian_yarlyks_classic_title:0 "$rip_tat_ruthenian_yarlyks_title$"
 rip_tat_ruthenian_yarlyks_classic_desc:0 "$rip_tat_ruthenian_yarlyks_desc$"
 rip_tat_ruthenian_tribute:0 "Tributo ruteno"
 desc_rip_tat_ruthenian_tribute:0 "El tributo y las tasas de las cartas de las tierras rutenas llenan el tesoro y elevan nuestro prestigio."
 rip_hab_galician_ruthenians_title:0 "Rutenos de Galitzia"
 rip_hab_galician_ruthenians_desc:0 "Las parroquias de rito oriental de la Rutenia Roja dependen ahora de Viena. Sus sacerdotes necesitan escuelas, sus obispos ser escuchados, y una monarquía que quiere la lealtad de las aldeas debe encontrarlas en su propia Iglesia."
 rip_hab_ruthenian_clergy:0 "Clero ruteno"
 desc_rip_hab_ruthenian_clergy:0 "Sacerdotes de rito oriental formados en los seminarios de la monarquía llevan la autoridad de la Corona a las aldeas rutenas."
 rip_hab_galician_ruthenians_classic_title:0 "$rip_hab_galician_ruthenians_title$"
 rip_hab_galician_ruthenians_classic_desc:0 "$rip_hab_galician_ruthenians_desc$"
