l_english:
 rip_rus_kyiv_scribes_title:0 "Kyivan Scribes"
 rip_rus_kyiv_scribes_desc:0 "Arrange for scribes from Kyiv to visit our court. An agreement with the ruler of Kyiv can secure passage for their manuscripts."
 rip_rus_copy_ruthenian_books_title:0 "The Copyists' Room"
 rip_rus_copy_ruthenian_books_desc:0 "Set aside a room for copyists at a church in the capital. Contacts in Lviv or Volhynia can supply Ruthenian manuscripts for their desks."
 rip_rus_ruthenian_press_title:0 "A Ruthenian Press"
 rip_rus_ruthenian_press_desc:0 "Bring the copyists and printers together in the capital. With presses in use and the route to Kyiv open, books can reach more readers than a scribe could serve alone."
 rip_pol_carpathian_passes_title:0 "Carpathian Passes"
 rip_pol_carpathian_passes_desc:0 "Secure passage between Halych and Maramaros so that Rusyn traders can bring salt and livestock over the mountains."
 rip_pol_rusyn_fairs_title:0 "Rusyn Fairs"
 rip_pol_rusyn_fairs_desc:0 "Equip the markets of Halych and Peremyshl to receive the caravans. Traders coming down from the passes need stalls, scales and storehouses."
 rip_pol_lviv_charters_title:0 "Lviv Charters"
 rip_pol_lviv_charters_desc:0 "Confirm the tolls and trading rights of the mountain merchants in Lviv. A charter issued in a prosperous city can carry weight on both sides of the passes."
