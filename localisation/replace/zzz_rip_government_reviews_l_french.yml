 rip_resolution_municipal_charters:0 "Confirm the Municipal Charters"
 rip_resolution_municipal_charters_desc:0 "The town courts keep their charters and their fiscal privileges. For ten years: production efficiency §G+5%§!, burghers' loyalty §G+5%§!, maximum absolutism §R-5§!.\n\nCosts §Y50§! diplomatic power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_municipal_accounts:0 "Examine the Municipal Accounts"
 rip_resolution_municipal_accounts_desc:0 "Treasury clerks go through the accounts of every town. For ten years: national tax §G+5%§!, yearly corruption §G-0.025§!, burghers' loyalty §R-5%§!.\n\nCosts §Y50§! administrative power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_chancery_service:0 "Examine the Service Rolls"
 rip_resolution_chancery_service_desc:0 "The chancery checks the service owed on every tenure. For ten years: state maintenance §G-5%§!, yearly corruption §G-0.025§!, nobles' loyalty §R-5%§!.\n\nCosts §Y50§! administrative power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_chancery_rights:0 "Confirm the Local Rights"
 rip_resolution_chancery_rights_desc:0 "A written confirmation settles the disputed rights of the lands. For ten years: culture promotion cost §G-10%§!, unrest §G-0.5§!, national tax §R-5%§!.\n\nCosts §Y50§! diplomatic power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_register_muster:0 "Fund the Full Muster"
 rip_resolution_register_muster_desc:0 "More registered men answer the muster, their allowances charged to the treasury. For ten years: manpower recovery speed §G+5%§!, land maintenance §R+5%§!.\n\nCosts §Y50§! military power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_register_settlement:0 "Settle the Service Obligations"
 rip_resolution_register_settlement_desc:0 "A share of the registered households stays on the land. For ten years: unrest §G-0.5§!, national manpower §R-5%§!.\n\nCosts §Y50§! diplomatic power and §Y50§! ducats, and needs peace and stability of at least 0. It stands for §Y10§! years; until it ends no institution of the realm can pass another resolution."
 rip_resolution_none_in_force_tt:0 "No institutional resolution is in force."
 rip_resolution_lock_over_tt:0 "Ten years have passed since the last institutional resolution."
 rip_resolution_cooldown_desc:0 "An Institutional Resolution"
 rip_gov_municipal_charters:0 "Confirmed Municipal Charters"
 desc_rip_gov_municipal_charters:0 "Town courts keep their fiscal privileges for this term. This settlement ends if the municipal reform is removed."
 rip_gov_municipal_accounts:0 "Examined Municipal Accounts"
 desc_rip_gov_municipal_accounts:0 "Treasury clerks scrutinise town revenues for this term, at the expense of the burmistrs' goodwill."
 rip_gov_chancery_service:0 "Examined Service Rolls"
 desc_rip_gov_chancery_service:0 "The chancery checks the service owed on each tenure. The holders have little affection for the new accounts."
 rip_gov_chancery_rights:0 "Confirmed Local Rights"
 desc_rip_gov_chancery_rights:0 "Written confirmation settles disputed rights, though some dues remain in local hands."
 rip_gov_register_muster:0 "Funded Cossack Muster"
 desc_rip_gov_register_muster:0 "More registered men answer the muster, with their allowances charged to the treasury."
 rip_gov_register_settlement:0 "Settled Cossack Obligations"
 desc_rip_gov_register_settlement:0 "A share of registered households remains on the land. Fewer men can be called to war during this term."
