 voluntary_houses_reform:0 "Voluntary Houses"
 voluntary_houses_reform_desc:0 "By allowing our Ruthenian and Cossack subjects to form their own local councils, we can increase their loyalty and acceptance of different religions. This reform also helps us spread institutions faster and lower our stability costs, but it may weaken our central authority."
