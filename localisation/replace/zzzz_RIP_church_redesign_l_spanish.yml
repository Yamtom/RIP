 desc_rip_church_ro_pa_local_8:0 "Offsets the inherited Orthodox authority bonus for this confession. Recalculated in five-point authority bands; the native Orthodox faith is unchanged."
 desc_rip_church_ro_pa_local_9:0 "Offsets the inherited Orthodox authority bonus for this confession. Recalculated in five-point authority bands; the native Orthodox faith is unchanged."
 desc_rip_church_ro_schism:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 desc_rip_church_royal_concordat:0 "Unrest -1, tax -5%, missionary strength -2%. The rite is guaranteed, but the crown retains a veto over episcopal appointments."
 desc_rip_church_theological_censorship:0 "Unrest -1, idea cost +5%, heretic tolerance -1 and yearly patriarchal authority -0.5 percentage points. Minority parishes suffer additional resistance."
 desc_rip_ob_active_refuge:0 "An endowed prayer house and workshops sustain an existing Old Believer community. Local unrest -1, production efficiency +15%, tax -15%, missionary strength -1%. Benefits cease under repression or an unprotective conqueror; the community and foundation survive."
 desc_rip_ob_inactive_refuge:0 "The refuge foundation and its community survive, but its benefits are suspended. An Old Believer ruler or the toleration policy can reactivate them; repression overrides either form of protection."
 desc_rip_ob_lay_accord:0 "Readers and lay elders direct communal worship and preserve the old books. Tolerance of the true faith +1 and idea cost -5%, at the cost of missionary strength -1%. Communities retain their diversity."
 desc_rip_ob_local_community:0 "A persistent community, not necessarily a provincial majority. It survives conquest and the end of the Raskol."
 desc_rip_ob_local_repression:0 "Enforcement increases local unrest and reduces manpower."
 desc_rip_ob_local_toleration:0 "The current ruler guarantees the community in exchange for tax concessions."
 desc_rip_ob_manuscript_mandate:0 "The community assembly supports readers, scribes and the study of old books. For 10 years: idea cost -5%, missionary strength -0.5%. A game-design interpretation of community scholarship."
 desc_rip_ob_mutual_aid_mandate:0 "The assembly directs funds to alms and relief. For 10 years: national unrest -1, national tax -5%."
 desc_rip_ob_priestly_accord:0 "Communities receive clergy from outside the old-rite settlements. Missionary strength +1%, yearly prestige +0.5; tax income -5% pays for their support. This grants no patriarchate or nineteenth-century episcopal succession."
 desc_rip_ob_repressive_policy:0 "Tolerance of heretics -1 and yearly patriarchal authority +0.5 percentage points. The communities keep their local penalties after the Raskol ends."
 desc_rip_ob_tolerant_policy:0 "Tolerance of heretics +1. Within the Muscovite jurisdiction, yearly patriarchal authority also falls by 0.5 percentage points; an Old Believer state has no common patriarchal-authority resource."
 desc_rip_ro_funded_trade_missions:0 "An active missionary network. Each funded node pays 3 Fervor a month and adds trade power and missionary strength in your parishes there. Conversion operates through eligible trade-node policies; this status grants no additional national bonus."
 desc_rip_ro_patriarchal_vacancy:0 "A locum tenens administers the church while the crown delays the patriarchal election. From 1721 the institutional settlement can establish a synod or restore the succession."
 desc_rip_ro_preserved_patriarchate:0 "An independent patriarchal office retains clerical influence. Yearly patriarchal authority +0.5 percentage points, clergy loyalty equilibrium +5%, tax -5%. Communion is unchanged."
 desc_rip_ro_restricted_communion:0 "The state restricts religious practice without renouncing Eastern communion. Orthodox parishes retain +3 local heretic tolerance and half their religious-unity weight is removed. Protection returns when the coercive policy expires, or disappears upon a deliberate schism."
 desc_rip_ro_ritual_compromise:0 "Both old and revised rites are permitted. The Raskol disaster and its recurring Old Believer backlash are prevented. Missionary strength -0.5%; yearly patriarchal authority -0.5 percentage points. This is a counterfactual settlement."
 desc_rip_ro_shared_communion:0 "This Orthodox parish shares communion with our hierarchy. Local heretic tolerance +5; its religious-unity weight is removed. EU4 retains the generic heretic label for different religions, but these local protections apply only to Orthodox parishes. Repression reduces them; a deliberate schism removes them."
 desc_rip_ro_synodal_government:0 "A governing synod answers to the crown. Tax +5%, stability cost -5%, yearly patriarchal authority -0.5 percentage points, clergy loyalty equilibrium -5%. Communion is unchanged."
 establish_orthodox_inquisition_decision_desc:0 "Available from 1667. Spend 75 ADM and 15 percentage points of patriarchal authority. Coercive enforcement lasts twenty years, weakens protection for Orthodox parishes and can provoke religious backlash."
 establish_orthodox_inquisition_decision_title:0 "Authorize Confessional Courts"
 forced_russification:0 "Coercive Administrative Assimilation"
 greek_catholic_religion_desc:0 "A broad game category covering several distinct Ruthenian and Carpathian Eastern Catholic union traditions and jurisdictions in communion with Rome, not one church institution and not the modern Ukrainian Greek Catholic Church in its narrow sense. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution. Availability from 6 July 1439 uses the Florentine union as a precedent for an alternative historical path, not as the founding of the UGCC or an established separate confession. The Union of Brest in 1596 is a distinct later milestone. Their hierarchies retain internal authority, represented by Hierarchical Capacity. The Curia panel records diplomatic relations only. The Hierarchical Capacity bar in the religion window lists what it pays for."
 old_believer:0 "Old Believer"
 old_believer_rebels_army:0 "Old Believer Host"
 old_believer_rebels_demand:0 "Freedom for the Old Rite"
 old_believer_rebels_demand_desc:0 "Protect the Old Believers; if their faith is dominant, adopt it as the state confession."
 old_believer_rebels_desc:0 "These communities defend the old books. Their success can establish Old Believer majorities. A state conversion requires their faith to be dominant."
 old_believer_rebels_name:0 "$RELIGION$ Zealots"
 old_believer_rebels_title:0 "Old Believer Zealots"
 old_believer_religion_desc:0 "Communities preserving the old Russian rites and rejecting the revised books. State institutions support visiting priests or lay elders, community assemblies, and endowed refuges. These are available through decisions. There is no common patriarchal-authority resource. The province religion represents a majority; smaller communities remain provincial modifiers."
 orthodox_inquisition:0 "Coercive Confessional Courts"
 rip_church.2.a:0 "Cultivate the Third Rome ideal"
 rip_church.2.b:0 "Emphasize our place among the Orthodox churches"
 rip_church.2.d:0 "Writers at the Muscovite court describe Moscow as a guardian of the Orthodox inheritance. This sixteenth-century political theology does not itself create a new creed or end communion with the eastern patriarchates. Universal jurisdiction would require a separate, deliberate claim."
 rip_church.2.t:0 "Moscow and the Third Rome"
 rip_church.3.d:0 "The ecclesiastical settlement recognizes our patriarchate within the wider Orthodox communion. Moscow accepts its place after the four ancient eastern patriarchates. Our centralized church remains a distinct political institution; recognition does not abolish its internal responsibilities."
 rip_church.3.t:0 "A Recognized Patriarchate"
 rip_church.5.d:0 "Our negotiated settlement draws on the Florentine union of 1439 as a precedent; historically, it did not gain lasting general acceptance. This campaign-created alternative does not represent the founding of the UGCC in 1439 or an unbroken institutional line to Brest in 1596: the Byzantine rite and its bishops remain, while communion with Rome is accepted. Integration is represented province by province; that game abstraction does not establish a canonical parish status or local voluntary consent."
 rip_church.5.t:0 "The Florentine Legacy Reaffirmed"
 rip_church.6.d:0 "Eastern infrastructure costs 20 HC and 75 ducats. A compact of coexistence costs 20 HC and 100 ducats and needs a province with guaranteed rights. Each lasts 10 years and fills the single synod slot. An option is listed only while its conditions are met."
 rip_church.6.t:0 "The Local Synod"
 rip_church_appoint_supervisor_desc:0 "After 1721 and the synodal settlement, spend 75 ADM to subordinate administration to a lay official. Requires crown appointments; shares the ten-year institutional cooldown."
 rip_church_appoint_supervisor_title:0 "Appoint a Lay Supervisor of the Synod"
 rip_church_authority_heading:0 "[Root.GetChurchAuthorityHeading]"
 rip_church_authority_heading_tt:0 "[Root.GetChurchAuthorityTooltip]"
 rip_church_break_communion_desc:0 "Deliberate alternative history: abandon recognized communion and claim an independent universal church. Costs 100 DIP and 1 stability. This increases confessional conflict and imposes -1 diplomatic reputation. Earlier reconciliation payments are not refunded."
 rip_church_break_communion_title:0 "Renounce the patriarchal settlement"
 rip_church_broken_promises:0 "Broken Promises to the Eastern Churches"
 rip_church_cathedral_drive:0 "Church building drive"
 rip_church_censor_theology_desc:0 "Costs 50 ADM and requires crown appointments. Reduce general unrest at the price of ideas, tolerance, patriarchal authority and minority resistance. Reintroduction has a ten-year cooldown."
 rip_church_censor_theology_title:0 "Require Crown Approval of Theology"
 rip_church_close:0 "Close"
 rip_church_coercion_resistance:0 "Resistance to Church Coercion"
 rip_church_compact.1.a:0 "Guarantee the liturgy and episcopal elections"
 rip_church_compact.1.b:0 "Guarantee the liturgy; reserve the crown veto"
 rip_church_compact.1.c:0 "Conclude no agreement"
 rip_church_compact.1.d:0 "The local clergy asks what communion will mean in practice. Will its liturgy remain intact, and who chooses its bishops? Guarantees bind the ruler after the negotiations, without changing the provincial majority."
 rip_church_compact.1.t:0 "The Terms of Church Union"
 rip_church_compact.2.a:0 "Honour the guaranteed election"
 rip_church_compact.2.b:0 "Impose the royal candidate"
 rip_church_compact.2.d:0 "The chapter has chosen a bishop without royal approval, as its charter allows. Honouring the promise costs the monarch 5 legitimacy. Imposing a candidate gains 5 legitimacy but breaks the charter, creates ten years of resistance and damages the crown credibility."
 rip_church_compact.2.t:0 "A Bishop the Crown Did Not Choose"
 rip_church_compact_resistance:0 "A Broken Church Charter"
 rip_church_confessional_mobilization:0 "Confessional Mobilization"
 rip_church_conversion_pressure:0 "Recent missionary pressure"
 rip_church_conversion_resistance:0 "Resistance to jurisdictional pressure"
 rip_church_crown_appointments:0 "Crown Appointment of Bishops"
 rip_church_crown_appointments_desc:0 "Costs 75 ADM; requires peace and 1 stability. Gain tax income while sacrificing clergy influence, loyalty and patriarchal authority. Institutional changes share a ten-year cooldown."
 rip_church_crown_appointments_title:0 "Reserve Episcopal Appointments to the Crown"
 rip_church_eastern_clemency:0 "Clemency in the east"
 rip_church_ecumenism_desc:0 "Conclude a limited diplomatic and local administrative settlement between the Orthodox and Catholic communities once community rights are guaranteed in both and the historical and diplomatic conditions are met. It deepens every guarantee. Its +15 is diplomatic goodwill only: Orthodox and Catholic states gain +15 mutual opinion; Russian Orthodox states are excluded. It is not a restoration of full ecclesial communion."
 rip_church_ecumenism_title:0 "Conclude the ecumenical settlement"
 rip_church_end_censorship_desc:0 "End censorship without a refund. It cannot be reintroduced for ten years."
 rip_church_end_censorship_title:0 "End Theological Censorship"
 rip_church_episcopal_guarantees:0 "Liturgy and Episcopal Elections Guaranteed"
 rip_church_florence_desc:0 "Alternative history, 1444-1501. The union of 6 July 1439 is a Florentine precedent for this alternative path, not the founding of the UGCC or an established separate confession. The Union of Brest in 1596 remains a distinct later milestone. Pay 200 ADM, 100 DIP and one year's income for five years of negotiations. Requires stability 2, peace and PAP opinion 100. The Eastern hierarchy keeps its rite while entering communion with Rome; Catholic patrons retain their state religion. For a Catholic patron, completion changes one randomly selected eligible parish to Greek Catholic. The province is not selected manually."
 rip_church_florence_title:0 "Invoke the Florentine precedent — alternative history"
 rip_church_frontier_watch:0 "Church frontier watch"
