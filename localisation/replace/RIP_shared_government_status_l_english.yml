 rip_gov_rev_title_t:0 "§YInstitutional Resolutions§!"
 rip_gov_rev_title_t_tt:0 "Institutional resolutions: the towns' charters, the chancery's rolls and the Cossack register can each pass one paid resolution of ten years, and only one resolution can stand in the whole realm.\nChoose a resolution on the left. Hover over a resolution to see its cost, effects and requirements."
 rip_gov_rev_left_t:0 "[Root.RipGovResLeft]"
 rip_gov_rev_left_t_tt:0 "The resolution in force, if any. A resolution ends after ten years, or at once if the reform that gave it is removed; the ten-year term still runs on and no other resolution can be passed until it is over."
 rip_gov_rev_now_t:0 "In force: [Root.RipGovResName]"
 rip_gov_rev_now_t_tt:0 "The resolution in force, if any. A resolution ends after ten years, or at once if the reform that gave it is removed; the ten-year term still runs on and no other resolution can be passed until it is over."
 rip_gov_rv_state_MunicipalCharters_mun0_t:0 "[Root.RipGovResStateMunicipalCharters]"
 rip_gov_rv_state_MunicipalCharters_mun0_t_tt:0 "Confirm the Municipal Charters: +5% production efficiency, +5% burghers' loyalty, -5 maximum absolutism, for ten years.\nCost: 50 ducats and 50 DIP power, paid when you press "Confirm the Municipal Charters" in the mechanics box on the left.\nTo pass an order you need:\n- peace\n- stability of at least 0\n- 50 ducats, which are paid\n- 50 monarch power of the kind named on the button, which is paid\n- no other order in force, and ten years since the last one.\nThe line above says which of these holds now: gold stands, green is ready, red is not met."
