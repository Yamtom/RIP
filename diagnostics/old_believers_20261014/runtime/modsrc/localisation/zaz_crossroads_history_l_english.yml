l_english:

 # --- the recurring argument

 zaz_crossroads.1.t:0 "Arguments Around the Kish Fire"
 zaz_crossroads.1.d:0 "The old question comes up again, as it does most winters: what the Host is for, and what it should become. Nobody has ever settled it for good, and this round will not either."
 zaz_crossroads.1.a:0 "Argue for the palanky"
 zaz_crossroads.1.b:0 "Argue for the register"
 zaz_crossroads.1.c:0 "Argue for the vows"
 zaz_crossroads.1.e:0 "Argue for the saddle"

 # --- mid reflections, lean >= 35

 zaz_crossroads.10.t:0 "The Palanky Make Their Case"
 zaz_crossroads.10.d:0 "Enough kurins now speak for keeping their own musters and their own courts that the case has stopped sounding like a complaint. The starshyna call it a threat to answer."
 zaz_crossroads.10.a:0 "Press the palanky's case"
 zaz_crossroads.10.b:0 "Let the starshyna answer"

 zaz_crossroads.11.t:0 "The Register Asks for More"
 zaz_crossroads.11.d:0 "The regiments that keep the register fed want the districts that feed the regiments, plainly and in writing. The rada calls it a fine way to lose its say."
 zaz_crossroads.11.a:0 "Give the regiments the districts"
 zaz_crossroads.11.b:0 "Send the rada to answer"

 zaz_crossroads.12.t:0 "A Chapter Forms Around the Question"
 zaz_crossroads.12.d:0 "Enough brothers now speak of vows and a rule that the kish has stopped treating it as pious talk. What an order does with a frontier is a fair question, and nobody has answered it yet."
 zaz_crossroads.12.a:0 "Press the chapter's case"
 zaz_crossroads.12.b:0 "Send the horsemen to answer"

 zaz_crossroads.13.t:0 "The Saddle Argues for Itself"
 zaz_crossroads.13.d:0 "Enough of the Host now argue that a register cannot outrun a horse that the camp has started drawing up wagons before the vote is called. The chapter calls it an argument for staying poor."
 zaz_crossroads.13.a:0 "Press the saddle's case"
 zaz_crossroads.13.b:0 "Send the chapter to answer"

 # --- late reflections, lean >= 70

 zaz_crossroads.14.t:0 "The General Rada Is Asked to Swear"
 zaz_crossroads.14.d:0 "The palanky have the numbers now; all that is left is to put the charter to the general rada and have it sworn. A sworn charter is hard to walk back from."
 zaz_crossroads.14.a:0 "Swear the general rada to it"
 zaz_crossroads.14.b:0 "Ask for one more winter"

 zaz_crossroads.15.t:0 "The Hetman Is Asked to Sign"
 zaz_crossroads.15.d:0 "The regiments have the numbers now; all that is left is a hetman's signature on the roll. A signed roll is hard to walk back from."
 zaz_crossroads.15.a:0 "Put the roll before the hetman"
 zaz_crossroads.15.b:0 "Ask for one more winter"

 zaz_crossroads.16.t:0 "The Brothers Are Asked to Kneel"
 zaz_crossroads.16.d:0 "The chapter has the numbers now; all that is left is the vow itself, sworn kneeling before the whole kish. A sworn vow is hard to walk back from."
 zaz_crossroads.16.a:0 "Swear the brothers to the vow"
 zaz_crossroads.16.b:0 "Ask for one more winter"

 zaz_crossroads.17.t:0 "The Wagons Are Asked to Move"
 zaz_crossroads.17.d:0 "The camp has the numbers now; all that is left is to strike the tents and go. Wagons already loaded are hard to unload again."
 zaz_crossroads.17.a:0 "Give the order to strike camp"
 zaz_crossroads.17.b:0 "Ask for one more winter"

 # --- the forcing pulse, from 1550

 zaz_crossroads.50.t:0 "The Kish Grows Impatient"
 zaz_crossroads.50.d:0 "Sixty years of the same argument is long enough for a council that meets every year to have heard every side of it. The otaman calls a rada and tells it to decide something, anything, before the next one."
 zaz_crossroads.50.a:0 "Let the rada press on"

 # --- the argument ends

 zaz_crossroads.60.t:0 "The Palanky Carry the Rada"
 zaz_crossroads.60.d:0 "The vote is no longer close. Every kurin now speaks the same way, and the starshyna have stopped arguing the other side. It falls to the kish to put the charter into writing."
 zaz_crossroads.60.a:0 "Let it be written"

 zaz_crossroads.61.t:0 "The Register Carries the Rada"
 zaz_crossroads.61.d:0 "The vote is no longer close. The regiments hold the districts in fact already, and the rada has stopped pretending otherwise. It falls to the hetman to put the roll into writing."
 zaz_crossroads.61.a:0 "Let it be written"

 zaz_crossroads.62.t:0 "The Chapter Carries the Rada"
 zaz_crossroads.62.d:0 "The vote is no longer close. Brothers already answer to the chapter in everything but the vow itself. It falls to the kish to swear what it has been practising for years."
 zaz_crossroads.62.a:0 "Let it be sworn"

 zaz_crossroads.63.t:0 "The Saddle Carries the Rada"
 zaz_crossroads.63.d:0 "The vote is no longer close. Half the Host is already living out of its wagons, and the other half has stopped pretending it will not follow. It falls to the kish to strike the camp for good."
 zaz_crossroads.63.a:0 "Let the camp be struck"
