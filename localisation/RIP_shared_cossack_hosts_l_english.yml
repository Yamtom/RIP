 sloboda_history.1.t:0 "Migrant Wave into the Slobodas"
 sloboda_history.1.d:0 "Families have arrived on the frontier with carts, seed and few beasts to draw a plough. They ask for land and a term free of dues. The starshyna offer to settle them at their own expense, provided the newcomers answer to them."
 sloboda_history.1.a:0 "Open the slobodas to settlers."
 sloboda_history.1.b:0 "Channel settlement through starshyna patrons."
 sloboda_history.1.c:0 "Restrict migration for now."

 sloboda_history.2.t:0 "Sloboda Charters Issued"
 sloboda_history.2.d:0 "The elders of the slobodas have brought their charters to the chancery. One promises relief from dues, another the right to elect officers. The settlers want to know which liberties their children will inherit."
 sloboda_history.2.a:0 "Guarantee fiscal privileges."
 sloboda_history.2.b:0 "Confirm elective local offices."
 sloboda_history.2.c:0 "Standardize charters under central chancery."

 sloboda_history.3.t:0 "Regimental-Hundred Order"
 sloboda_history.3.d:0 "When the alarm sounds, some men muster under a sotnyk and others answer to the nearest town. The colonels want a roll that gives every household a place in the levy. The towns would sooner keep their garrisons."
 sloboda_history.3.a:0 "Strengthen sotnia service."
 sloboda_history.3.b:0 "Rely on urban garrisons."

 sloboda_history.4.t:0 "Eastern Fortified Line"
 sloboda_history.4.d:0 "With every alarm the riders must cover the open ground between our forts. The frontier captains propose joining the strongpoints with ditches and earthen banks. Others ask for fresh horses and more watchposts."
 sloboda_history.4.a:0 "Build earthworks and a fort chain."
 sloboda_history.4.b:0 "Invest in mobile watchposts."

 sloboda_history.5.t:0 "Review of Frontier Statutes"
 sloboda_history.5.d:0 "A colonel claims service from a village whose charter promises it exemption. Other settlements have produced grants much like it. We must decide whether the chancery may revise terms once pledged to the settlers."
 sloboda_history.5.a:0 "Renew service privileges."
 sloboda_history.5.b:0 "Expand central oversight."

 sloboda_history.6.t:0 "Grain from the Black Earth"
 sloboda_history.6.d:0 "The harvest has filled the barns, and sacks left outside are spoiling in the rain. The millers offer to build granaries if we advance the cost. The herdsmen ask us to reserve some of the black earth for pasture."
 sloboda_history.6.a:0 "Build silos and mills."
 sloboda_history.6.b:0 "Set land aside for the herds."

 sloboda_history.7.t:0 "Kharkiv Fairs and Contracting"
 sloboda_history.7.d:0 "At the Kharkiv fair a merchant can buy next year's grain, but a promise made across a stall is hard to prove once the carts have gone. The merchants want a hall where a clerk can witness their bargains."
 sloboda_history.7.a:0 "Open a regional contract hall."
 sloboda_history.7.b:0 "Preserve local market trade."

 sloboda_history.8.t:0 "Grain Corridors to the Dnieper"
 sloboda_history.8.d:0 "A cart of grain pays its way only if it reaches the Dnieper before the roads turn to mud. Merchants petition for better crossings and escorts. Our collectors would sooner put a duty on each load that passes."
 sloboda_history.8.a:0 "Pay for crossings and escorts."
 sloboda_history.8.b:0 "Collect a duty on exported grain."

 sloboda_history.9.t:0 "Collegium and Chancellery Culture"
 sloboda_history.9.d:0 "Our colonels need men who can draw up a deed as readily as a muster roll. The brotherhoods offer to school the sons of the towns. The chancery would take the most promising boys into its own service."
 sloboda_history.9.a:0 "Invest in brotherhood schools."
 sloboda_history.9.b:0 "Expand the service chancellery."

 sloboda_history.10.t:0 "Multi-Confessional Frontier"
 sloboda_history.10.d:0 "The parishes of the frontier keep different feasts, yet their households pay dues to the same officers. The elders have offered to settle their disputes together. Some officials would impose a single rule on them all."
 sloboda_history.10.a:0 "Broker a community compromise."
 sloboda_history.10.b:0 "Impose top-down uniformity."

 sloboda_history.11.t:0 "Codification of Sloboda Service"
 sloboda_history.11.d:0 "No two colonels can agree how many carts a village owes the Host. Each can produce a charter to prove his case. Our clerks may reconcile the local grants or enter every village on the same service roll."
 sloboda_history.11.a:0 "Preserve the hybrid frontier code."
 sloboda_history.11.b:0 "Integrate into central service tables."

 sloboda_history.12.t:0 "Governorate Reorganization"
 sloboda_history.12.d:0 "The governors have orders to take charge of the Sloboda regiments' civil affairs. The officers ask leave to hand over their courts and rolls district by district. The chancery wants them all by the same date."
 sloboda_history.12.a:0 "Implement gradual integration."
 sloboda_history.12.b:0 "Transfer all districts at once."

 sloboda_history.13.t:0 "Legacy of the Sloboda Frontier"
 sloboda_history.13.d:0 "After generations of settlement, border watch, and thriving fairs, the Sloboda frontier has shaped the very marrow of our realm. We must now ordain whether martial host custom, commercial city charters, or a balance of frontier liberty and chancery order shall endure."
 sloboda_history.13.a:0 "Keep the regimental muster."
 sloboda_history.13.b:0 "Confirm the charters of the towns."
 sloboda_history.13.c:0 "Enter the frontier liberties in the chancery rolls."

 sloboda_migrant_wave:0 "Sloboda Migrant Wave"
