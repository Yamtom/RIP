 rip_eparchy.4.a:0 "Adopt the Greek Catholic name"
 rip_eparchy.4.b:0 "Refuse the new name — alternative history"
 rip_eparchy.5.t:0 "A Metropolitan for Galicia"
 rip_eparchy.5.d:0 "The emperor asked Rome to restore the Galician metropolitanate, and the bull of 22 February 1807 did so. Anhelovych was installed in 1808, with Lviv and Peremyshl as its two eparchies.\n\nHere the metropolitan see is placed at Lviv, and a Greek Catholic Peremyshl shares its standing. Acceptance protects the rite from missionary conversion and makes Lviv a metropolitan see (+15% local institution spread, -10% local development cost, -20% local state maintenance) for twenty years. A Greek Catholic Peremyshl receives the diocese and the protection as well. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Rome grants the title; the treasury still pays for the see."
 rip_eparchy.5.l:0 "The emperor asked Rome to restore the Galician metropolitanate, and the bull of 22 February 1807 did so. Anhelovych was installed in 1808, with Lviv and Peremyshl as its two eparchies. Here that date has passed without a settlement, and the question is still open.\n\nHere the metropolitan see is placed at Lviv, and a Greek Catholic Peremyshl shares its standing. Acceptance protects the rite from missionary conversion and makes Lviv a metropolitan see (+15% local institution spread, -10% local development cost, -20% local state maintenance) for twenty years. A Greek Catholic Peremyshl receives the diocese and the protection as well. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. Rome grants the title; the treasury still pays for the see."
 rip_eparchy.5.a:0 "Ask Rome to restore the see"
