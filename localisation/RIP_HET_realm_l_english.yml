 little_russian_collegium:0 "Little Russian Collegium"
 desc_little_russian_collegium:0 "Russian oversight body monitoring and controlling Hetmanate affairs."
 resisting_russian_control:0 "Resisting Russian Control"
 desc_resisting_russian_control:0 "Active opposition to Russian imperial interference."
 fighting_for_hetmanate:0 "Fighting for the Hetmanate"
 desc_fighting_for_hetmanate:0 "The Cossacks fight desperately to preserve their autonomy."
 limited_hetmanate_autonomy:0 "Limited Hetmanate Autonomy"
 desc_limited_hetmanate_autonomy:0 "Negotiated autonomy after threatened abolition."
 cossack_traditions_revival:0 "Cossack Traditions Revival"
 desc_cossack_traditions_revival:0 "Revival of ancient Cossack military culture and liberties."
 hetmanate_modernization:0 "Reformed Hetmanate Administration"
 desc_hetmanate_modernization:0 "Administrative colleges and regular regimental statutes order the Hetmanate on a European footing."

 het_resists_oligarchy_desc:0 "The hetman curbs the growing autonomy of the starshyna families, reasserting the authority of the bulava over the regimental council."

 het_left_bank_loyalty:0 "Left Bank Loyalty"
 het_right_bank_loyalty:0 "Right Bank Loyalty"
 accepted_russian_candidate:0 "Accepted Russian Candidate"
 rejected_russian_candidate:0 "Rejected Russian Candidate"
 hetmanate_swedish_alliance:0 "Hetmanate-Swedish Alliance"
 hetmanate_remained_loyal:0 "Remained Loyal During Crisis"
 accepted_collegium:0 "Accepted Collegium Oversight"
 resisted_collegium:0 "Resisted Collegium"
 negotiated_autonomy:0 "Negotiated Autonomy"
 khmelnytsky_uprising_title:0 "Khmelnytsky Uprising"
 khmelnytsky_uprising_desc:0 "The great Cossack rebellion against Polish-Lithuanian rule has erupted. Led by the hetman Bohdan Khmelnytsky, masses of Cossacks, peasants, and Tatars have risen in arms, devastating vast swathes of Ukrainian territory. Cities burn, entire communities are slaughtered, and the very foundations of Polish authority crumble before the insurgent tide."







 khmelnytsky_revolt_active_desc:0 "The Cossack rebellion continues to rage, spreading unrest and destabilization throughout our realm."

 khmelnytsky_military_response_desc:0 "We have mobilized our forces to suppress the rebel insurgency, though at great cost to our military capacity."

 khmelnytsky_concessions_desc:0 "We have made concessions to the Cossack demands, easing tensions and reducing unrest at the cost of surrendering some authority."

 khmelnytsky_moscow_support_desc:0 "We have accepted Muscovite assistance against the rebels, gaining military strength while becoming dependent on the tsar's will."






 orthodox_brotherhoods_desc:0 "Lay brotherhoods maintain schools and presses, strengthening education and the Orthodox faith."
 jesuit_missions_supported_desc:0 "Jesuit missions expand with state backing, improving conversion while raising local tensions."
 jesuit_missions_restrained_desc:0 "The missions are restrained to reduce unrest and preserve local peace."
 defenders_of_orthodoxy_desc:0 "Cossack zeal protects Orthodox institutions and bolsters military morale."
 church_property_restored_desc:0 "Disputed church lands are restored to calm the Orthodox population, at fiscal cost."
 church_property_conflict_desc:0 "Confiscations enrich the crown but inflame religious tensions."

 khmelnytsky_events.7.t:0 "The Crown Presses the Union"
 khmelnytsky_events.7.d:0 "At Brest in 1596 the bishops signed the union and the crown lent it patronage, yet [Root.GetName] now weighs a sterner course.\n\nThe chancery can order one Orthodox province of Ruthenia over to the union: it changes rite and takes +3 unrest and +5% autonomy, the whole realm carries +1 unrest and -1 tolerance of heretics for twenty years, and Orthodox neighbours and subjects begin to feel the pressure. Or the crown can leave the union to patronage: no province changes, prestige falls by 5, and for twenty years unrest is 1 lower and tolerance of heretics 1 higher, though the pressure on the neighbours is felt just the same.\n\nEither way the crown has taken a side, and the Orthodox will remember which."
 khmelnytsky_events.7.a:0 "Order the union in one province."
 khmelnytsky_events.7.b:0 "Leave it to patronage."
 union_of_brest_enforced:0 "Union Pressed by Royal Order"
 desc_union_of_brest_enforced:0 "The crown ordered a province over to the union by decree instead of leaving it to the bishops, and the Orthodox have not forgotten it."
 union_of_brest_compromise:0 "Union Left to Patronage"
 desc_union_of_brest_compromise:0 "The crown kept to patronage and forced no province into the union by decree. The Orthodox marked the restraint."
 rip_het_autonomy_defended:0 "Hetmanate Charter Defended"
 desc_rip_het_autonomy_defended:0 "The paid ten-year defence of the charter suspends the Russian abolition event. After expiry, a continuing political threat can reopen the question. Independence or leaving the Hetmanate ends this protection without refunding its term."
 HET_ADJ:0 "Hetmanate's"
 HET_ideas:0 "Hetmanate's Ideas"
 HET_ideas_start:0 "Hetmanate's Traditions"
 HET_ideas_bonus:0 "Hetmanate's Ambitions"
 HET_toward_all_of_ruthenia:0 "Rus' for the Ruthenians!"
 HET_toward_all_of_ruthenia_desc:0 "Despite every design of Poland and Muscovy to subjugate our fertile homeland, the Host will stand firm in arms, sparing neither gold nor blood so that Rus' is governed by its own estates rather than distant courts in Moscow, Kraków, or Vilnius."
 HET_all_under_the_zaporozhian_host:0 "The Host is in Command"
 HET_all_under_the_zaporozhian_host_desc:0 "The Zaporozhian Host, guided by the Sich Rada, rules the Hetmanate with a firm hand. Led by the Kosh Otaman and supported by seasoned warriors, the system ensures that leadership remains in the hands of the most proven and respected men."
 HET_exiles_and_freedom_seekers:0 "No Longer Exiled"
 HET_exiles_and_freedom_seekers_desc:0 "Our position between the Empire, Muscovy, and the Porte draws exiles from every frontier. We may shelter them, recruit those fit to serve, and learn from the troubles they leave behind."
 HET_the_kish_the_sich_rada_and_military_court:0 "The Kish and the Sich Rada"
 HET_the_kish_the_sich_rada_and_military_court_desc:0 "The Kish, or Zaporozhian Host, and the Sich Rada not only govern the Hetmanate, but also serve as its premier military force. The Sich Rada is composed entirely of cossacks, and any cossack, regardless of origin, can vote. This encourages a military tradition that transcends class barriers."
 HET_cossack_infantry_supremacy:0 "Infantry Supremacy"
 HET_cossack_infantry_supremacy_desc:0 "The Hetmanate has grown beyond mounted steppe skirmishing, pairing disciplined matchlock and flintlock volleys with field artillery so that our foot regiments hold fast against any cavalry host."
 HET_the_price_we_set_for_service:0 "Peak Performance at a Premium Price"
 HET_the_price_we_set_for_service_desc:0 "Our martial prowess has drawn the attention of both European and Muslim realms, eager to hire our regiments for their own campaigns. By formalizing mercenary service within the Hetmanate, we can turn the skills of our warriors into a lucrative enterprise."
 HET_kleinody:0 "Kleinody!"
 HET_kleinody_desc:0 "The Kleinody, a type of imperial regalia, are prestigious objects for the Zaporozhian Host, and only a few ever obtain them. Holding a Kleinody grants an officer status, with different ranks for different types. The most prestigious is the 'bulawa', or mace carried by the Kish. The longer we keep these heirlooms of the past, the more prestigious we will be in the eyes of future generations and foreigners."
 hetmany:0 "Hetmany"
 hetmany_desc:0 "Military commanders: battlefield performance and manpower recovery, but with heavier militarization costs."
 hetmans_desc:0 "The hetmans drive martial readiness and cavalry power."
 hetmans:0 "Hetmans"
 HET_all_under_the_zaoporzhian_host:0 "All Under the Zaporozhian Host"
 HET_all_under_the_zaoporzhian_host_desc:0 "The Zaporozhian Host unites our people under one banner, reducing unrest throughout our lands."
 GRAIN_COLLEGIUM:0 "Siversk Veche"
 HET:0 "Hetmanate"
 hetmanate_nation_title:0 "Proclaim the Hetmanate"
 hetmanate_nation_desc:0 "Between Polish magnates, Muscovite voivodes, Crimean raiders, and Ottoman pashas, our homesteads have burned too long in other crowns' wars. With regiments seasoned in battle and cities rising along the Dnieper, the Host proclaims a sovereign Ruthenian Hetmanate."

 the_ruina:0 "The Ruina"
 ruina_events.1.t:0 "The Ruina Begins"
 ruina_events.1.d:0 "The death of the great hetman has plunged our lands into chaos. Rival candidates backed by foreign powers tear at the fabric of our state, while armies march across devastated provinces. This is the beginning of what will be remembered as 'The Ruin.'"
 ruina_events.1.a:0 "Fortify our heartland!"
 ruina_events.1.b:0 "Seek protection from a powerful neighbor"
 ruina_events.1.c:0 "Rally the Cossack Host!"
 ruina_events.2.t:0 "The Ruina Ends"
 ruina_events.2.d:0 "After years of devastation, stability has finally returned to our lands. The cost was terrible - provinces lie in ruins, our population has fled, and foreign powers dictate terms - but we survived."
 ruina_events.2.a:0 "Begin reconstruction"
 ruina_events.2.b:0 "Our veterans are hardened by war"
 ruina_events.2.c:0 "Secure peace through diplomacy"
 ruina_events.3.t:0 "Pretender Hetman Arises"
 ruina_events.3.d:0 "A rival hetman has emerged, claiming legitimacy and gathering supporters. Civil war threatens to tear us apart further."
 ruina_events.3.a:0 "Crush the pretender!"
 ruina_events.3.b:0 "Negotiate a compromise"
 ruina_events.3.c:0 "Let them fight it out"
 ruina_events.4.t:0 "Foreign Intervention"
 ruina_events.4.d:0 "A neighboring power has decided to intervene in our internal crisis, either to impose their candidate or to vassalize us entirely."
 ruina_events.4.a:0 "Resist with all our might!"
 ruina_events.4.b:0 "Accept vassalage"
 ruina_events.4.c:0 "Pay tribute to avoid invasion"
 ruina_events.5.t:0 "Province Devastated"
 ruina_events.5.d:0 "One of our provinces has been ravaged by the constant warfare. Villages burn, fields lie fallow, and the population flees."
 ruina_events.5.a:0 "Send relief"
 ruina_events.5.b:0 "They must fend for themselves"

 hetman_succession_crisis_desc:0 "Chronic instability caused by hetman elections, competing candidates backed by foreign powers, starshyna factionalism, and the struggle between centralization and autonomy threatens the Hetmanate."
 het_succession.1.t:0 "Succession Crisis Begins"
 het_succession.1.d:0 "The hetman's weakness or death has triggered a succession crisis. The starshyna officer class, foreign powers, and rival candidates all vie for control."
 het_succession.1.a:0 "Support a strong hetman"
 het_succession.1.b:0 "Compromise with the starshyna"
 het_succession.1.c:0 "Seek foreign backing"
 het_succession.2.t:0 "Succession Resolved"
 het_succession.2.d:0 "After much struggle, a new hetman has consolidated power and the succession crisis has ended."
 het_succession.2.a:0 "The hetman consolidates power"
 het_succession.2.b:0 "Reform the election system"
 het_succession.2.c:0 "Balance hetman and starshyna"
 het_succession.3.t:0 "Rival Hetman Emerges"
 het_succession.3.d:0 "A rival hetman has emerged with his own supporters, threatening civil war."
 het_succession.3.a:0 "Support the current hetman"
 het_succession.3.b:0 "Hold a new election"
 het_succession.3.c:0 "Let them duel for honor"
 het_succession.4.t:0 "Starshyna Power Play"
 het_succession.4.d:0 "The starshyna officer class is making a bid for greater power, threatening hetman authority."
 het_succession.4.a:0 "Curtail noble power"
 het_succession.4.b:0 "Grant concessions"
 het_succession.4.c:0 "Seek a balanced approach"
 het_succession.5.t:0 "Foreign Interference"
 het_succession.5.d:0 "Our overlord is attempting to impose their own candidate as hetman."
 het_succession.5.a:0 "Accept their candidate"
 het_succession.5.b:0 "Resist interference!"
 het_succession.5.c:0 "Negotiate for autonomy"
 het_succession.6.t:0 "The Question of Succession"
 het_succession.6.d:0 "Should the hetmanate become hereditary, remain elective, or adopt term limits?"
 het_succession.6.a:0 "Make it hereditary"
 het_succession.6.b:0 "Keep it elective"
 het_succession.6.c:0 "Institute term limits"

 HET_hetman_authority:0 "Hetman Authority"
 HET_hetman_authority_desc:0 "The hetman's authority flows from both Cossack military election and princely statecraft, uniting the bulava with lasting executive command."
 HET_starshyna_administration:0 "Starshyna Administration"
 HET_starshyna_administration_desc:0 "The starshyna officer class forms the administrative backbone of the Hetmanate, managing provinces and providing military leadership."
 HET_left_bank_settlers:0 "Left-Bank Settlers"
 HET_left_bank_settlers_desc:0 "Refugees and colonists settle the Left Bank of the Dnieper, providing both manpower and agricultural development."
 HET_collegium_tradition:0 "Collegium Tradition"
 HET_collegium_tradition_desc:0 "Kyiv-Mohyla Collegium and other educational institutions spread learning throughout the Hetmanate."
 HET_registered_cossacks:0 "Registered Cossacks"
 HET_registered_cossacks_desc:0 "The registered Cossack regiments form the core of our infantry, combining discipline with Cossack fighting spirit."
 HET_foreign_alliance_politics:0 "Alliance Politics"
 HET_foreign_alliance_politics_desc:0 "The Hetmanate must carefully navigate between Poland, Muscovy, and other powers to maintain autonomy."
 HET_baturyn_arsenal:0 "Baturyn Arsenal"
 HET_baturyn_arsenal_desc:0 "Baturyn's gun foundries and arsenals cast heavy bronze cannon and supply powder and shot for every border fortress."

 estate_cossacks_het_registered_host:0 "Registered Cossack Army"
 estate_cossacks_het_registered_host_desc:0 "The Hetmanate maintains a professional army of registered Cossacks organized into disciplined regiments. Unlike the free Sich, these are state soldiers combining Cossack martial prowess with regular army organization."
 estate_nobles_het_starshyna_class:0 "Starshyna Privileges"
 estate_nobles_het_starshyna_class_desc:0 "The starshyna (officer class) forms the administrative and military elite of the Hetmanate. These Cossack officers hold extensive privileges and govern provinces, providing experienced leadership but demanding influence in state affairs."
 estate_nobles_het_hetman_power:0 "Hetman Autocracy"
 estate_nobles_het_hetman_power_desc:0 "The Hetman concentrates power in his hands, transforming the Cossack polity into an autocratic state. This enables efficient governance and reform but angers the starshyna who lose their traditional privileges."
 estate_burghers_het_left_bank:0 "Left-Bank Development"
 estate_burghers_het_left_bank_desc:0 "The Left Bank of the Dnieper becomes a center of agricultural development and urban growth under burgher management. Refugees and settlers develop the land, creating prosperous towns and productive estates."
 estate_church_het_academy:0 "Kyiv-Mohyla Academy"
 estate_church_het_academy_desc:0 "The Kyiv-Mohyla Academy (Collegium) is the premier educational institution of Eastern Europe, combining Orthodox theology with Western scholarship. It produces learned clergy, administrators, and military officers who spread enlightenment throughout the Hetmanate."

 het_starshyna_oligarchy_reform:0 "Starshyna Oligarchy"
 het_starshyna_oligarchy_reform_desc:0 "The Hetmanate is ruled by the starshyna - an officer-elite drawn from Cossack colonels, generals, judges, and administrators. These families dominate governance, forming a landed oligarchy that supplants the elective Rada with aristocratic administration."

 het_hetman_for_life_reform:0 "Hetman for Life"
 het_hetman_for_life_reform_desc:0 "Following Bohdan Khmelnytsky's precedent, the Hetman becomes an elected-but-permanent ruler rather than a rotating officer. This creates dynastic ambitions and allows long-term state-building, transforming the Hetmanate from rule of the war council to monarchical autocracy."

 het_regimental_system_reform:0 "Regimental Administration"
 het_regimental_system_reform_desc:0 "The Hetmanate divides its lands into territorial regiments (polky), each governed in both justice and muster by its colonel. Once every ten years the register may be settled from the government window: fund the full muster or settle the service obligations."

 het_academy_enlightenment_reform:0 "Kyiv-Mohyla Patronage"
 het_academy_enlightenment_reform_desc:0 "Hetman patronage allows the Kyiv-Mohyla Academy to flourish as a center of baroque culture, Orthodox scholarship, and administrative learning for the Cossack state."

 het_mazepist_autocracy_reform:0 "Baturyn Hetman's Court"
 het_mazepist_autocracy_reform_desc:0 "The hetman keeps a court at Baturyn, a Latin chancery and estates to rival any magnate, while the serving starshyna are confirmed in theirs. The Rada remains, but executive power increasingly gathers around the bulava."

 het_collegium_control_reform:0 "Little Russian Collegium"
 het_collegium_control_reform_desc:0 "A collegium of Russian officers now sits above the hetman, auditing the treasury and confirming appointments. The bulava is still carried in procession, and the collegium's seal is on the orders."
 hetman_absolute_power:0 "§YHetman rules with near-monarchical authority§!"
 limited_hetman_autonomy:0 "§RHetman authority severely curtailed by Russian oversight§!"
 HETMAN_OTAMAN:0 "Hetman-Otaman"
 HETMANKA_OTAMAN:0 "Hetmanka-Otamanka"
 HETMAN_STATE:0 "Hetman State"
 HETMAN_COMMANDER:0 "Hetman-Commander"
 HETMANKA_COMMANDER:0 "Hetmanka-Commander"

 HETMANATE:0 "Hetmanate"
 HETMAN_DOMINION:0 "Hetman Dominion"
 HETMAN_FOR_LIFE:0 "Hetman for Life"
 HETMANKA_FOR_LIFE:0 "Hetmanka for Life"

 MAZEPIST_HETMANATE:0 "Mazepist Hetmanate"
 HETMAN_MONARCHY:0 "Hetman Monarchy"
 HETMAN_SOVEREIGN:0 "Hetman-Sovereign"
 HETMANKA_SOVEREIGN:0 "Hetmanka-Sovereign"
 LITTLE_RUSSIAN_STATE:0 "Little Russian State"
 COLLEGIUM_HETMAN:0 "Collegium Hetman"
 COLLEGIUM_HETMANKA:0 "Collegium Hetmanka"

 het_polish_alliance:0 "Polish Alliance"
 het_ottoman_protection:0 "Ottoman Protection"
 het_swedish_compact:0 "Swedish Alliance"
 het_starshyna_diplomacy:0 "Starshyna Diplomacy"
 het_collegium_graduates:0 "Kyiv-Mohyla Academy Graduates"
 het_registered_army_support:0 "Supported Registered Army"
 het_grain_trade:0 "Grain Trade Partnership"
 het_orthodox_protector:0 "Protector of Orthodoxy"
 het_autonomy_respected:0 "Respected Hetmanate Autonomy"
 het_autonomy_violated:0 "Violated Hetmanate Rights"
 crimean_alliance_het:0 "Alliance with Hetmanate"

 rus_cossack_service:0 "Cossack Military Service"
 rus_hetmanate_client:0 "Hetmanate Client State"

 het_strengthen_hetman_title:0 "Strengthen Hetman Authority"
 het_strengthen_hetman_desc:0 "Spend 100 ADM to strengthen the Hetman and receive ten years of support for his government. This action becomes available again ten years after its previous use."
 het_empower_starshyna_title:0 "Empower the Starshyna Council"
 het_empower_starshyna_desc:0 "Spend 75 ADM to empower the starshyna council and receive ten years of support from the officers. This action becomes available again ten years after its previous use."
 het_establish_regiments_title:0 "Establish Regimental System"
 het_establish_regiments_desc:0 "Dividing our territory into military regiments will create an efficient administrative structure and strengthen our military readiness."
 het_found_brotherhood_collegium_title:0 "Establish the Kyiv Brotherhood Collegium"
 het_found_brotherhood_collegium_desc:0 "Before the seventeenth-century reforms of Petro Mohyla, the Orthodox burghers and clergy of Kyiv formed brotherhoods to defend their confession and letters. Expanding the Epiphany school into a collegiate foundation provides our youth with humanist and theological training."
 het_expand_academy_title:0 "Charter the Kyiv-Mohyla Academy"
 het_expand_academy_desc:0 "In 1632, Metropolitan Petro Mohyla united the Kyiv Caves and Brotherhood schools into a celebrated collegium. Elevating it into a fully chartered Academy with hetman patronage and high academic privileges crowns Kyiv as the intellectual capital of the Cossack state and the Orthodox world."
 het_pereiaslav_treaty_title:0 "Sign Treaty with Russia"
 het_pereiaslav_treaty_desc:0 "We are exhausted by war. A treaty with Russia could bring protection, though at the cost of our independence."
 het_mazepa_independence_title:0 "Break with Overlord"
 het_mazepa_independence_desc:0 "Cast off foreign overlordship and raise the Hetmanate's banners in an open bid for sovereignty."
 het_left_bank_admin_title:0 "Establish Left Bank Administration"
 het_left_bank_admin_desc:0 "Let every town on the Left Bank know which colonel hears its petitions and where its men must gather when the Host is called."
 het_sloboda_settlements_title:0 "Establish Sloboda Ukraine Settlements"
 het_sloboda_settlements_desc:0 "Sloboda Ukraine offers opportunities for settlement. We can establish new communities with special freedoms to attract colonists."
 het_defend_orthodox_title:0 "Defend the Orthodox Faith"
 het_defend_orthodox_desc:0 "As Orthodox Christians under Catholic or Muslim neighbors, we must protect our faith and resist forced conversions."
 het_black_sea_trade_title:0 "Establish Black Sea Trade"
 het_black_sea_trade_desc:0 "Access to Black Sea ports will allow us to export our abundant grain and import valuable goods."
 het_reform_elections_title:0 "Reform Hetman Election Process"
 het_reform_elections_desc:0 "The Hetman election system needs reform to ensure stable succession and reduce conflicts among the starshyna."

 het_russian_protection_desc:0 "Russia protects us from our enemies, at the cost of some independence."
 het_independence_struggle_desc:0 "We fight to break free from foreign domination."
 het_regimental_administration:0 "Regimental Administration"
 het_regimental_administration_desc:0 "Our territory is efficiently organized into military regiments."
 het_regimental_province_administration:0 "Regimental Province"
 desc_het_regimental_province_administration:0 "The civil and military administration of this province follows the Hetmanate's regimental order."
 het_academy_excellence_desc:0 "The Kyiv-Mohyla Academy is renowned throughout Eastern Europe."
 het_autonomy_guaranteed_desc:0 "Our overlord has promised to respect our traditional rights."
 mazepa_golden_age_desc:0 "Hetman Mazepa's enlightened rule brings prosperity and cultural flourishing."
 het_left_bank_settled:0 "Left Bank Settled"
 het_left_bank_settled_desc:0 "The Left Bank of the Dnieper has been successfully colonized."
 het_centralized_control:0 "Centralized Control"
 het_centralized_control_desc:0 "The Hetman exercises strong central authority."
 het_balanced_development:0 "Balanced Regional Development"
 het_balanced_development_desc:0 "We develop both banks of the Dnieper equally."
 collegium_administration:0 "Collegium Administration"
 collegium_administration_desc:0 "The Little Russian Collegium oversees our administration."
 het_quiet_resistance:0 "Quiet Resistance"
 het_quiet_resistance_desc:0 "We resist Russian control through subtle means."
 het_reformed_election_system_desc:0 "The chancery has set down who may vote for the hetman and how the Rada shall hear a disputed election."
 left_bank_administration:0 "Left Bank Administration"
 left_bank_administration_desc:0 "Efficient administration of the Left Bank territories."

 het_flavor.1.t:0 "Election of the Hetman"
 het_flavor.1.d:0 "The position of Hetman - the elected leader of the Cossack Hetmanate - must be filled. The starshyna (officer class) and colonels of the regiments gather to choose our new leader. Three candidates stand out: a brilliant military commander, a skilled diplomat with foreign connections, and an experienced administrator."
 het_flavor.1.a:0 "Elect the military commander"
 het_flavor.1.b:0 "Elect the diplomat"
 het_flavor.1.c:0 "Elect the administrator"
 het_flavor.2.t:0 "Foundation of Kyiv-Mohyla Academy"
 het_flavor.2.d:0 "Metropolitan Petro Mohyla has founded an academy in Kyiv that will become the leading center of Orthodox learning in Eastern Europe. The Academy teaches theology, philosophy, rhetoric, and sciences, blending Orthodox tradition with European scholastic methods. This institution will train generations of Ukrainian intellectuals and strengthen our own customs."
 het_flavor.2.a:0 "A great day for Ukrainian learning!"
 het_flavor.3.t:0 "The Pereiaslav Council (1654)"
 het_flavor.3.d:0 "After years of devastating war with Poland, Hetman Bohdan Khmelnytsky has convened a council at Pereiaslav. The Russian Tsar offers military protection and recognition of our autonomy in exchange for vassalage. Many see this as our only hope for survival, though some fear it means exchanging Polish overlordship for Russian. The fate of the Hetmanate hangs in the balance."
 het_flavor.3.a:0 "Sign the treaty with Russia"
 het_flavor.3.b:0 "Continue fighting alone"
 het_flavor.4.t:0 "The Regimental System"
 het_flavor.4.d:0 "The Hetmanate is organizing its territory into military-administrative units called regiments (polky). Each regiment encompasses several cities and towns, with a colonel commanding both civil and military affairs. This system combines Cossack military traditions with effective territorial administration."
 het_flavor.4.a:0 "Strengthen the regimental system"
 het_flavor.4.b:0 "Centralize under the Hetman"
 het_flavor.5.t:0 "Starshyna Opposition"
 het_flavor.5.d:0 "The starshyna - the Cossack officer class - have grown wealthy and powerful, resembling a traditional nobility. They resist the Hetman's attempts to centralize power, demanding greater privileges and local autonomy. This conflict between centralization and local rights threatens to tear the Hetmanate apart."
 het_flavor.5.a:0 "Compromise with the starshyna"
 het_flavor.5.b:0 "Assert Hetman authority"
 het_flavor.5.c:0 "Call a general council to resolve this"
 het_flavor.6.t:0 "Mazepa's Golden Age"
 het_flavor.6.d:0 "Hetman Ivan Mazepa's patronage has crowned Kyiv and Baturyn with baroque churches, enlarged the Kyiv-Mohyla Academy, and brought brisk silver into the treasury, though rival starshyna mutter against his growing authority."
 het_flavor.6.a:0 "Support Mazepa's reforms"
 het_flavor.6.b:0 "Maintain traditional liberties"
 het_flavor.7.t:0 "The Battle of Poltava (1709)"
 het_flavor.7.d:0 "Hetman Mazepa's alliance with Sweden against Russia has ended in catastrophic defeat at Poltava. The Russian army has crushed the Swedish-Cossack forces, and Tsar Peter I exacts brutal revenge. Many of our cities are burned, thousands killed, and the Hetmanate's autonomy severely curtailed. This is the darkest hour in our history."
 het_flavor.7.a:0 "Swear renewed loyalty to Russia"
 het_flavor.7.b:0 "Face the consequences of rebellion"
 het_flavor.8.t:0 "Left Bank vs Right Bank"
 het_flavor.8.d:0 "The Hetmanate is divided by the Dnieper River into two distinct regions. The Left Bank remains under our control with Russian protection, while the Right Bank has returned to Polish rule. This division weakens our nation and separates Ukrainian families. Should we focus on strengthening what we control, or attempt to reunify both banks?"
 het_flavor.8.a:0 "Develop the Left Bank"
 het_flavor.8.b:0 "Focus on the Right Bank"
 het_flavor.8.c:0 "Balance both regions"
 het_flavor.9.t:0 "Sloboda Ukraine Settlement"
 het_flavor.9.d:0 "The Sloboda Ukraine region offers opportunities for colonization. Free Cossack settlements (slobody) can be established here with special privileges to attract settlers fleeing serfdom. These communities will strengthen our frontier and increase our population, though they may prove difficult to control."
 het_flavor.9.a:0 "Encourage free settlements"
 het_flavor.9.b:0 "Establish military colonies"
 het_flavor.10.t:0 "The Orthodox Metropolia"
 het_flavor.10.d:0 "The Metropolitan of Kyiv has asked the hetman to confirm the privileges of his see. His word carries weight in parishes on both banks of the Dnieper. How much of that authority should rest beside the bulava in council?"
 het_flavor.10.a:0 "Strengthen the Orthodox church"
 het_flavor.10.b:0 "Balance church and state"
 het_flavor.11.t:0 "The Grain Trade"
 het_flavor.11.d:0 "The Hetmanate's rich black soil produces abundant grain harvests. Access to Black Sea ports allows us to export this grain to Constantinople, enriching our treasury. However, focusing on export agriculture may leave us vulnerable to crop failures and market fluctuations."
 het_flavor.11.a:0 "Expand grain exports"
 het_flavor.11.b:0 "Ensure domestic food security"
 het_flavor.12.t:0 "The Little Russian Collegium"
 het_flavor.12.d:0 "Tsar Peter I has placed a Little Russian Collegium of imperial officers above the Hetmanate's administration. It will audit revenues, hear appeals and counter the authority of the starshyna. The hetman and regimental order remain, but their room to govern is sharply narrowed."
 het_flavor.12.a:0 "Accept Russian control"
 het_flavor.12.b:0 "Resist quietly and preserve what we can"
 het_flavor.13.t:0 "The Russian-Turkish Wars"
 het_flavor.13.d:0 "Russia is at war with the Ottoman Empire, and the Hetmanate is expected to contribute troops and resources to the Russian war effort. While defeating the Turks serves our interests, exhausting ourselves in Russia's wars weakens our position and drains our treasury."
 het_flavor.13.a:0 "Support Russia fully"
 het_flavor.13.b:0 "Provide minimal support"
 het_flavor.14.t:0 "Abolition of the Hetmanate"
 het_flavor.14.d:0 "Catherine II has issued her final decree: the Hetmanate is abolished, and our lands will be fully integrated into the Russian Empire. After over a century of autonomy, Cossack self-government ends. Our regiments are disbanded, our privileges revoked, and Ukraine becomes merely another province of Russia."
 het_flavor.14.a:0 "There is nothing we can do..."
 het_flavor.14.b:0 "Fight to the last!"
