 # Holy Cities UI Object Button
 rip_ro_holy_cities_open:0 "Holy Cities Register"
 rip_ro_holy_cities_open_tt:0 "§YHoly Cities Register§!\nOpen the register of five sacred sees and pilgrimage destinations to inspect province faith, the 30-year sacred myth bars, and the blessings they grant."

 # Register Window
 rip_ro_holy_cities_heading:0 "Holy Cities Register"
 rip_ro_holy_cities_intro:0 "Five sees under Orthodox protection. After 30 years each matures a sacred myth and grants a national blessing."
 rip_ro_holy_cities_sites_title:0 "Sees, Sacred Myths and Pilgrimage Destinations"
 rip_ro_holy_cities_footer:0 "A myth gains one year each year its see is under Orthodox protection. Hover a bar for the exact rule."
 rip_ro_holy_cities_close:0 "Close Register"

