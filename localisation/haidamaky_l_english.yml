l_english:
 haidamaky.1.t:0 "Bands in the Ravines"
 haidamaky.1.d:0 "They winter in the ravines of Kholodnyi Yar and come out at harvest: runaway subjects, hired hands whose wages were withheld, and men down from the Sich who know the country. They take the tenant's roll and the steward's strongbox and are gone before a column can be raised. The magnates want leave to keep armed retainers of their own, which solves the season and creates a private army in every latifundium. The starosta's writ, as usual, stops at the ravine's edge."
 haidamaky.1.a:0 "Let the magnates keep retainers"
 haidamaky.1.b:0 "Send a punitive column"
 haidamaky.1.c:0 "Hear the villages out"

 haidamaky.2.t:0 "The Koliivshchyna"
 haidamaky.2.d:0 "It began as another season of bands and did not stop. The countryside is up from the Dnieper to the Boh; the towns have shut their gates, and those that did not are being counted. Confederate detachments, crown troops and the risen villages are all in the field, none of them under one command. The Empress has offered her regiments to restore order in a kingdom that is not hers, which is the kind of offer that is accepted and remembered."
 haidamaky.2.a:0 "Put it down ourselves"
 haidamaky.2.b:0 "Accept the Empress's regiments"

 haidamaky.3.t:0 "The Sich and the Haidamaky"
 haidamaky.3.d:0 "The Kish is asked, politely and then less politely, whether the men wintering below the rapids are the same men who took the fairs at Uman and Lysianka. Some of them are. They came with horses, and the horses have Polish brands. The Kosh Otaman may say that no register is kept of who winters where, which is true and will not be believed, or he may give up names and keep the peace a while longer."
 haidamaky.3.a:0 "The ravines keep their own counsel"
 haidamaky.3.b:0 "Hand the ringleaders over"

 haidamaka_country:0 "Haidamaka Country"
 desc_haidamaka_country:0 "The bands hold the ravines and the roads between fairs. Dues are collected here by whoever arrives first."
 nadvirna_militia:0 "Household Militias"
 desc_nadvirna_militia:0 "Every magnate keeps armed retainers of his own. The roads are safer, the crown's monopoly on force is not."
 koliivshchyna_reprisals:0 "Reprisals after the Koliivshchyna"
 desc_koliivshchyna_reprisals:0 "The rising was put down village by village, and the villages remember which of them were counted."
 order_kept_by_foreign_troops:0 "Order Kept by Foreign Troops"
 desc_order_kept_by_foreign_troops:0 "Another sovereign's regiments keep the peace in our provinces. They are efficient, and they have not been asked when they intend to leave."
 sich_shelters_haidamaky:0 "The Sich Shelters the Haidamaky"
 desc_sich_shelters_haidamaky:0 "Men winter below the rapids and are not asked where they summered. The Host is stronger for it, and its neighbours have noticed."
