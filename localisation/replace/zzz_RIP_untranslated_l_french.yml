 uz_identity_branching_3_title:0 "Pending Allegiance Branch"
 uz_identity_consolidated:0 "Name Settled"
 uz_identity_question_desc:0 "Debate whether Huszt should cleave to the Rusyn patrimony, stand as a march apart, or fuse with the laws of St. Stephen."
 uz_identity_question_title:0 "Question of Our Name"
 uz_increase_tolerance_of_true_faith:0 "Increases tolerance of the true faith by 1"
 uz_integrate_local_nobility_desc:0 "Integrate the local nobility into our administration to strengthen their loyalty and support."
 uz_integrate_local_nobility_title:0 "Integrate Local Nobility"
 uz_karloca_synod_blessing:0 "Karlovac Synod Benediction"
 uz_komitat_administration:0 "Komitat Administration"
 uz_kuruc_border_raids:0 "Kuruc Border Raids"
 uz_kyivan_heritage_desc:0 "Invoke the Koriyatovych legacy to extend our charters across Red Ruthenia and keep Vilnius as partner instead of rival."
 uz_kyivan_heritage_title:0 "Kyivan Heritage"
 uz_kyivan_legacy:0 "Kyivan Legacy"
 uz_language_decree:0 "Language Decree"
 uz_language_decree_desc:0 "Issue a decree on administrative languages, commissioning translators to render statutes for every marcher commune."
 uz_language_decree_title:0 "Language Decree"
 uz_legacy_old_rus_desc:0 "Embrace the legacy of the Old Rus, uniting our lands and securing a prosperous future for our people."
 uz_legacy_old_rus_title:0 "Legacy of the Old Rus"
 uz_linguistic_development:0 "Linguistic Development"
 uz_magyarization_drive:0 "Magyarization Drive"
 uz_mountain_gendarmerie:0 "Mountain Gendarmerie"
 uz_mukachevo_autonomy_desc:0 "Confirm Mukachevo's petition for Rusyn courts and tolls, turning the fortress town into the undisputed seat of the Huszt March."
 uz_mukachevo_autonomy_title:0 "Mukachevo Autonomy"
 uz_mukachevo_privileges:0 "Mukachevo Privileges"
 uz_national_revival_desc:0 "Gather the Holy Cross brotherhoods into a common estate so Máramaros, uzh and Bereg speak with one Rusyn voice."
 uz_national_revival_title:0 "National Revival"
 uz_old_rite_resilience:0 "Old Rite Resilience"
 uz_old_rus_alliances_desc:0 "Strengthen alliances with countries that share our culture or have strategic interests in Ruthenian lands."
 uz_old_rus_alliances_title:0 "Old Rus Alliances"
 uz_opryshky_pacified:0 "Pacified Mountain Brotherhoods"
 uz_opryshky_raids:0 "Opryshky Raids"
 uz_opryshok_raiders:0 "Opryshok Raiders"
 uz_orthodox_defender:0 "Orthodox Defender"
 uz_orthodox_metropolis:0 "Orthodox Metropolis"
 uz_orthodox_revival:0 "Orthodox Revival"
 uz_orthodox_unity_desc:0 "Unite all Orthodox believers under our spiritual leadership and defend the true faith."
 uz_orthodox_unity_title:0 "Orthodox Unity"
 uz_palank_border_watch:0 "Palanok Border Watch"
 uz_palank_border_watch_desc:0 "Restore the watch posts and garrison drills that shield Palanok's valleys, keeping reserves ready to ride the Tysa passes at a moment's notice."
 uz_palank_border_watch_title:0 "Guard the Palanok Border"
 uz_palatial_chambers:0 "Palatine Chambers"
 uz_pan_ruthenian_congress_desc:0 "Summon bishops and hetmans from every Ruthenian principality to the Huszt tables to sketch a common charter for the Dnieper and the Bug."
 uz_pan_ruthenian_congress_title:0 "Pan-Ruthenian Congress"
 uz_pan_ruthenian_union:0 "Pan-Ruthenian Union"
 uz_pannonian_autonomy:0 "Pannonian Autonomy"
 uz_pannonian_blockhouses:0 "Pannonian Blockhouses"
 uz_pannonian_charters:0 "Pannonian Charters"
 uz_pannonian_drive:0 "Pannonian Drive"
 uz_pannonian_league:0 "Pannonian League"
 uz_pannonian_settlement:0 "Pannonian Settlement"
 uz_preserve_orthodox_faith_desc:0 "The Concord sealed after Svydrygailo's rising binds us to uphold the Orthodox bishops of Huszt within the crown. If we neglect that promise, the march will splinter."
 uz_preserve_orthodox_faith_title:0 "Preserve Orthodox Faith"
 uz_pressburg_compact:0 "Pressburg Compact"
 uz_pressburg_compact_desc:0 "Reconvene the estates at Pressburg and renew our oath with the Hungarian crown, securing guarantees for Huszt's liberties in exchange for loyal service."
 uz_pressburg_compact_title:0 "Pressburg Compact"
 uz_private_salt_leases:0 "Private Salt Leases"
 uz_protect_eastern_frontier_1_desc:0 "Our eastern borders must be fortified to protect our lands from foreign invaders. Building strong fortifications in the Eastern Carpathians will secure our realm."
 uz_protect_eastern_frontier_1_title:0 "Protect the Eastern Frontier"
 uz_protect_eastern_frontier_desc:0 "Our eastern borders must be secured against any potential threats. By fortifying the Eastern Carpathians, we can ensure the safety of our realm."
 uz_protect_eastern_frontier_title:0 "Protect the Eastern Frontier"
 uz_protect_rusin_heritage_desc:0 "Revitalize and protect the Rusin culture, ensuring that it thrives and is preserved for future generations."
 uz_protect_rusin_heritage_title:0 "Protect Rusin Heritage"
 uz_protected_frontier:0 "Protected Eastern Frontier"
 uz_rebel_legends:0 "Folk Heroes of the Carpathians"
 uz_recover_lost_rusin_lands_desc:0 "Reclaim the lost lands of Galicia and Volhynia, restoring them to our control."
 uz_recover_lost_rusin_lands_title:0 "Recover Lost Rusin Lands"
 uz_resist_habsburgs_desc:0 "Convene a dynastic congress at Palanok, braiding our marriages with overlords, rivals, or the Viennese court so whichever patron we choose must underwrite our liberties with charters and soldiers."
 uz_resist_habsburgs_title:0 "Palanok Dynastic Congress"
 uz_riverine_granaries:0 "Riverine Granaries"
 uz_rusin_aristocracy:0 "Rusyn Aristocracy"
 uz_rusin_enlightenment:0 "Rusyn Enlightenment"
 uz_rusin_enlightenment_desc:0 "Foster learning and cultural development among our people to create a renaissance of Rusyn civilization."
 uz_rusin_enlightenment_title:0 "Rusyn Enlightenment"
 uz_rusin_language_desc:0 "Compile the statutes, hymns, and salt ledgers of the march into a Rusyn chancery tongue respected by both crown and communes."
 uz_rusin_language_title:0 "Rusyn Language"
 uz_rusin_literacy_desc:0 "Endow the monastic scriptoria of Huszt and Csernek so every village judge can read the charters in both Ruthenian and Latin."
 uz_rusin_literacy_title:0 "Rusyn Literacy"
 uz_rusin_national_awakening:0 "Rusyn National Awakening"
 uz_rusin_settlement:0 "Rusyn Settlement"
 uz_rusin_state_desc:0 "When revolutions sweep Europe, the Huszt Diet must be ready to demand a federated Rusyn crown land within the Apostolic realm."
 uz_rusin_state_title:0 "Rusyn State"
 uz_rusyn_autonomy:0 "Rusyn Autonomy"
 uz_rusyn_autonomy_desc:0 "Establish a unique autonomous system that preserves our distinct Rusyn custom while ensuring prosperity."
 uz_rusyn_autonomy_title:0 "Rusyn Autonomy"
 uz_rusyn_cultural_awakening_desc:0 "Our cultural heritage must be preserved and celebrated. Let us establish ourselves as the guardians of [Root.GetUZHIdentityCultureAdjective] culture."
 uz_rusyn_cultural_awakening_title:0 "Rusyn Cultural Awakening"
 uz_rusyn_self_governance:0 "Rusyn Self-Governance"
 uz_ruthenian_awakening:0 "Ruthenian Awakening"
 uz_ruthenian_legacy:0 "Ruthenian Legacy"
 uz_salt_chamber_overwatch:0 "Salt Chamber Overwatch"
 uz_salt_corridor_convoys:0 "Danube Convoy Schedules"
 uz_salt_corridor_depots:0 "Salt Corridor Depots"
 uz_secure_maramures_desc:0 "Fortify the Maramures region to ensure our defenses and provide a stronghold against our enemies."
 uz_secure_maramures_title:0 "Secure the Maramures"
 uz_self_identification_desc:0 "Seal the verdict of the Palanok synod, binding clergy, guilds, and captains to the national course we have chosen."
 uz_self_identification_title:0 "Self-Identification of the Rusyns"
 uz_serdyuk_guard:0 "Serdyuk Guard"
 uz_slavo_rusyn_identity:0 "The Slavo-Rusyn Name"
 uz_solotvyno_chambers:0 "Solotvyno Salt Galleries"
 uz_solotvynska_camera:0 "Solotvynska Camera"
 uz_sovereign_rusin_state:0 "Sovereign Rusyn State"
 uz_statute_codification:0 "Palanok Statutes"
 uz_tisza_customs_convention:0 "Tisza Customs Convention"
 uz_tisza_customs_depot:0 "Tisza Customs Depot"
 uz_trade_prosperity:0 "Trade Prosperity"
 uz_uhro_rusyn_identity:0 "The Uhro-Rusyn Name"
 uz_uhro_rusyn_integration:0 "Uhro-Rusyn Integration"
 uz_uhro_rusyn_integration_desc:0 "Forge a synthesis between Rusyn and Hungarian traditions, creating a unique Uhro-Rusyn custom."
 uz_uhro_rusyn_integration_title:0 "Uhro-Rusyn Integration"
 uz_uhro_rusyn_synthesis:0 "Uhro-Rusyn Synthesis"
 uz_ukraino_rusyn_identity:0 "The Kyivan-Rusyn Name"
 uz_union_compromise_plus:0 "Union Compromise Charter"
 uz_union_compromise_plus_desc:0 "Fund theological debates and print new catechisms so both rite defenders and Latin patrons embrace the compact."
 uz_union_compromise_plus_title:0 "Union Compromise Charter"
 uz_union_dilemma_desc:0 "Mediate between the Basilian abbots and Latin envoys to keep the Huszt Concord from tearing the march in two."
 uz_union_dilemma_title:0 "Union Dilemma"
 uz_unique_host_cooldown:0 "Hosts Reorganising"
 uz_unite_rusin_lands_desc:0 "We must unite all Rusin territories under our rule to preserve our culture and heritage."
 uz_unite_rusin_lands_title:0 "Unite the Rusin Lands"
 uz_zakarpattia_realm_desc:0 "With Huszt ascendant, proclaim a Zakarpattian realm that gathers every Carpathian valley beneath one banner."
 uz_zakarpattia_realm_title:0 "Realm of Zakarpattia"
 uzh.1.a:0 "Orthodoxy is our strength!"
 uzh.1.d:0 "Our ancestors brought the Orthodox faith to these Carpathian lands centuries ago. Now, as religious wars and reformations rage around us, we must preserve our faith and the unity of our people."
 uzh.1.t:0 "Preserve the Orthodox Faith"
 uzh.10.a:0 "Empower the civic councils"
 uzh.10.b:0 "Forge a frontier guard"
 uzh.10.d:0 "The republic is born from the frontier. We must decide whether civic councils and guilds will guide our expansion or whether a disciplined frontier guard will ensure stability across the plains."
 uzh.10.t:0 "Shape the Pannonian Republic"
 uzh.2.a:0 "Accept Hungarian protection"
 uzh.2.b:0 "Remain independent but maintain good relations"
 uzh.2.d:0 "The Hungarian crown offers us its protection. This may shield us from our enemies, but could also limit our independence. How shall we proceed?"
 uzh.2.t:0 "Hungarian Protection"
 uzh.201.a:0 "Proclaim the synod’s benediction"
 uzh.201.b:0 "Fund the cathedral guild college"
 uzh.201.d:0 "Basilian abbots, Orthodox hierarchs, and royal confessors assemble at Karlovac to settle decades of argument over rites and patronage. Some urge us to trumpet the synod’s blessing as proof that heaven smiles on our mountain march. Others would rather endow a cathedral college, turning the reunion into schools, bursaries, and jurists loyal to Uzhhorod."
 uzh.201.t:0 "The Karlovac Synod"
 uzh.202.a:0 "Grant charters to our subject marches"
 uzh.202.b:0 "Turn the congress into a border staff"
 uzh.202.d:0 "Delegates from palatinates, marcher towns, and border companies crowd Palanok’s halls to sketch the future of our congress. Merchant envoys plead for broader charters to steady the crowns of our subjects. Generals insist that joint drills and magazines along the southern frontier are the only shield against encroaching empires."
 uzh.202.t:0 "The Carpathian Congress"
 uzh.203.a:0 "Anchor the furnaces with royal foundries"
 uzh.203.b:0 "Lease export charters to the counting houses"
 uzh.203.d:0 "Surveyors report rich seams beneath the valleys of Máramaros. Guild syndics and aristocratic investors race to sink shafts, demanding the crown’s backing before rival polities seize the trade. We must decide whether to knit the new foundries into a single network or to auction export charters to the highest bidders."
 uzh.203.t:0 "Zakarpattian Coal Companies"
 uzh.230.a:0 "Fortify the march and drill the border guard."
 uzh.230.b:0 "Grant charters to the Danube guilds."
 uzh.230.c:0 "Push deeper into the Banat palisades."
 uzh.230.d:0 "Danubian blockhouses spring up beside market sheds, while colonists beg for guidance. Shall we drill soldiers, reward guilds, or march deeper toward the Maros?"
 uzh.230.t:0 "Axes over the Danube"
 uzh.241.a:0 "Stamp the Solotvynska ledgers."
 uzh.241.d:0 "Mukachevo's clerks cart in new salt ledgers, tallying the brine of Solotvyno against crown quotas. Once sealed, the camera will police every barrel that leaves the valley."
 uzh.241.t:0 "Camera Ledgers Balanced"
 uzh.242.a:0 "Sign the customs articles."
 uzh.242.d:0 "Envoys from Pest, Mukachevo, and the Danube marts agree to treat the Upper Tisza as a single tariff space. Harmonised tariffs could flood our depots with river trade—if we bind every market to the articles."
 uzh.242.t:0 "Convention of the Tisza"
 uzh.3.a:0 "Focus on administrative development"
 uzh.3.b:0 "Promote trade and economic growth"
 uzh.3.d:0 "Mukachevo is becoming the center of our administration. We can grant the city special privileges to foster its development and strengthen our rule in the region."
 uzh.3.t:0 "Mukachevo Autonomy"
 uzh.310.a:0 "Reinforce the Carpathian hearthlands."
 uzh.310.b:0 "Send families into the Alföld."
 uzh.310.c:0 "Raise stockades along the Maros."
 uzh.310.d:0 "Petitions from towns and parishes crowd the chancery. Some beg for support to repopulate Carpathian valleys, others to stake claims in the Alföld or the Banat."
 uzh.310.t:0 "Rusyn Colonization Wave"
 uzh.4.a:0 "Enlightenment is the foundation of our future!"
 uzh.4.b:0 "Let the brotherhoods guide our cultural awakening."
 uzh.4.d:0 "The printing press arrives in our lands! This gives us the opportunity to spread education among our people and preserve our language and culture for future generations."
 uzh.4.t:0 "Rusyn Literacy"
 uzh.410.a:0 "Form the Serdyuk Guard."
 uzh.410.b:0 "Let the opryshky patrol the passes."
 uzh.410.c:0 "Stand down and husband our strength."
 uzh.410.d:0 "Captains urge us to raise a permanent guard. Should we drill loyal Serdyuk battalions, unleash swift mountain opryshky, or conserve our strength?"
 uzh.410.t:0 "Hosts of the March"
 uzh.5.a:0 "Mobilize all our forces!"
 uzh.5.b:0 "Form partisan detachments"
 uzh.5.d:0 "The Habsburgs are seeking to expand their influence over our lands. We must show that the Rusyns will not surrender without a fight! How shall we organize our resistance?"
 uzh.5.t:0 "Resist the Habsburgs"
 uzh.50.a:0 "Post a captain of the chambers"
 uzh.50.b:0 "Lease the wells to the burghers"
 uzh.50.d:0 "The salt domes near Solotvyno glitter with wealth for anyone who can keep their galleries dry and smugglers in line. Royal commissioners argue that only disciplined state auditors can guard the crown's monopoly, while the burghers claim that leasing the chambers to their counting houses would raise production overnight."
 uzh.50.t:0 "Salt Chambers of Solotvyno"
 uzh.51.a:0 "Seal the union and welcome Latin favor"
 uzh.51.b:0 "Defend the ancient rite from change"
 uzh.51.d:0 "In the refectory of Uzhhorod Castle the Basilian fathers have agreed to swear obedience to Rome while keeping the Byzantine rite. Some nobles hail this Greek Catholic compromise as a bridge between mountain parishes and Habsburg patronage. Others fear it will dissolve the old Orthodox order that shielded our people in the valleys."
 uzh.51.t:0 "The Union of Uzhhorod"
 uzh.52.a:0 "Arm the kuruc riders and strike from the forests"
 uzh.52.b:0 "Hold the line for the Emperor"
 uzh.52.d:0 "Ferenc Rákóczi has lit the plains with rebellion, and the passes of Ung are alive with kuruc scouts begging for powder. They promise to raid imperial caravans and guard our mountain roads in exchange for shelter. Vienna will surely demand we suppress them or reinforce the garrisons with loyalists."
 uzh.52.t:0 "Kuruc Border Companies"
 uzh.53.a:0 "Endow reading houses for [Root.GetUZHIdentityCultureAdjective] youth"
 uzh.53.b:0 "Channel stipends into Magyar schools"
 uzh.53.d:0 "Priest Aleksander Dukhnovych prints an almanac at Pest, proclaiming \"I was, am, and will remain a [Root.GetUZHIdentityCultureSingular].\" His reading circles teach grammar, hymnody, and history to shepherds and guildsmen alike. Magyar administrators, however, insist that public funds support a single tongue and tradition."
 uzh.53.t:0 "Dukhnovych's Awakening"
 uzh.54.a:0 "Raise the Palanok gendarmerie"
 uzh.54.b:0 "Parley with the band chiefs"
 uzh.54.d:0 "From spruce-clad Máramaros to the alleys of Uzhhorod, bands of opryshky rally peasants angered by levies, salt monopolies, and gendarme abuses. Their petitions cite the old valach law; their axes and muskets promise to carve justice instead. We can either flood the passes with loyal soldiers or barter an amnesty that risks emboldening the brotherhoods."
 uzh.54.t:0 "Opryshky Stir the Mountains"
 uzh.55.a:0 "Send kuruc patrols through the forests"
 uzh.55.b:0 "Pay them off with salt silver"
 uzh.55.d:0 "A convoy of Solotvyno salt wagons lies ablaze where the road bends toward Khust. Opryshky captains melt into the forest, leaving a warning knifed into a commissioner’s desk: more tithe collectors will hang unless the crown eases its grip."
 uzh.55.t:0 "Ambush in the Salt Pass"
 uzh.56.a:0 "Institutionalise the mountain gendarmerie"
 uzh.56.b:0 "Celebrate the folk heroes"
 uzh.56.d:0 "The last opryshky bands descend to hear our verdict. Some captains accept commissions in Palanok’s watch, others ask only that songs of freedom be left untouched. How we close this chapter will define Máramaros for a generation."
 uzh.56.t:0 "A Quiet Carpathian Dawn"
 uzh.6.a:0 "Organize planned resettlement"
 uzh.6.b:0 "Support settlers with resources"
 uzh.6.d:0 "Our people are growing in number and need new lands. The great migration beckons—[Root.GetUZHIdentityCulturePlural] stand ready to settle new territories in Pannonia."
 uzh.6.t:0 "The Great Migration"
 uzh.7.a:0 "Glory to the [Root.GetUZHIdentityCultureAdjective] people!"
 uzh.7.d:0 "[Root.GetUZHIdentityCulturePlural] are experiencing a true revival! Our culture, language, and traditions are flourishing once again. This is the moment we can become a true nation."
 uzh.7.t:0 "National Revival"
 uzh.8.a:0 "Long live the Rusyn State!"
 uzh.8.d:0 "At last! After centuries of struggle for survival, the Rusyns have established their own sovereign state. We have proven that a small people can have a great future!"
 uzh.8.t:0 "The Rusyn State"
 uzh.9.a:0 "Fortify the borderlands"
 uzh.9.b:0 "Grant charters to loyal settlers"
 uzh.9.d:0 "Our soldiers and settlers stand at the edge of the plains. Some urge us to fortify every pass and expand the chain of border forts, while others argue for negotiated charters that bind the frontier towns to our cause."
 uzh.9.t:0 "Guarding the Pannonian Frontier"
 uzh_agriculture_desc:0 "Reorganize the Tysa starosties to terrace vineyards, restore salt granaries, and endow Mukachevo's farm estates with crown backing."
 uzh_agriculture_title:0 "Agricultural Development"
 uzh_backa_settlements_desc:0 "Lead salt teamsters and guild families to new plots in Backa, carrying Huszt's statutes to the Danube marshes."
 uzh_backa_settlements_title:0 "Backa Settlements"
 uzh_banat_colonization_desc:0 "Chart Banat crown lands for loyal borderers who will garrison the fort chains while keeping their Rusyn rites."
 uzh_banat_colonization_title:0 "Banat Colonization"
 uzh_carpathian_border_commissariat_reform:0 "Carpathian Border Commissariat"
 uzh_carpathian_border_commissariat_reform_desc:0 "Habsburg generals and local nobles forged a standing commissariat to watch the passes, muster hajduks, and ration the salt mines. Its drilling statutes turn Uzhhorod into the headquarters of the Carpathian cordon."
 uzh_congress_border_bastion_desc:0 "Fuse the congress' border drill into a permanent command that keeps fortresses manned and armies ready for any imperial threat."
 uzh_congress_border_bastion_title:0 "Carpathian Defensive Shield"
 uzh_congress_subject_hegemony_desc:0 "Convert the congress' temporary charters into a binding union of loyal marches, rewarding obedience with lasting privileges."
 uzh_congress_subject_hegemony_title:0 "Carpathian Patronal Union"
 uzh_constitutional_monarchy_desc:0 "Codify the Huszt Statute—an accord between the diet and the prince—that entrenches parliamentary reform, rewards loyal estates, and directs crown authority through written law."
 uzh_constitutional_monarchy_title:0 "Codify the Huszt Statute"
 uzh_control_of_pannonia_desc:0 "By controlling the entire Pannonian region, we can establish our dominance and secure our position among the European powers."
 uzh_control_of_pannonia_title:0 "Control of Pannonia"
 uzh_cultural_revival_desc:0 "We must promote [Root.GetUZHIdentityCultureAdjective] culture and ensure its prosperity throughout our lands."
 uzh_cultural_revival_title:0 "Cultural Revival"
 uzh_danube_trade_league_desc:0 "Leverage every Rusyn market from Uzhhorod to Novi Sad, binding them into a riverine league that dominates toll houses and caravans alike."
 uzh_danube_trade_league_title:0 "Forge the Danube Trade League"
 uzh_federalization_desc:0 "Extend the Carpathian compact into a federated march where loyal subjects keep their charters yet answer a common council from Huszt."
 uzh_federalization_title:0 "Federalization"
 uzh_federative_statutes_desc:0 "Publish the federative statutes that bind loyal subjects and multilingual bureaus into a durable Ruthenian federation."
 uzh_federative_statutes_title:0 "Federative Statutes"
 uzh_granichar_districts_desc:0 "Reform the Carpathian forts into permanent granichar districts, blending Military Frontier drill with Rusyn captaincies to anchor the passes."
 uzh_granichar_districts_title:0 "Granichar Districts"
 uzh_identity.1.a:0 "We are part of the great Ruthenian nation!"
 uzh_identity.1.b:0 "We are an independent Rusyn nation!"
 uzh_identity.1.c:0 "We are loyal Uhro-Rusyns!"
 uzh_identity.1.d:0 "Our people stand at a crossroads. For centuries we have been [Root.GetUZHIdentityCulturePlural], yet rival voices promise different destinies—joining the greater Ruthenian nation, defending an independent [Root.GetUZHIdentityCultureAdjective] march, or binding ourselves fully to the Hungarian crown."
 uzh_identity.1.t:0 "The Question of Our Name"
 uzh_identity.2.a:0 "Orthodoxy unites all [Root.GetUZHIdentityCulturePlural]!"
 uzh_identity.2.d:0 "By choosing the Ruthenian name, we open new opportunities for spiritual and cultural renewal. The Orthodox Church supports our choice."
 uzh_identity.2.t:0 "Ruthenian Revival"
 uzh_identity.3.a:0 "Popular rule is our strength!"
 uzh_identity.3.d:0 "As an independent nation, we can develop our own old liberties and self-government. Our villages and towns gain greater freedom."
 uzh_identity.3.t:0 "Rusyn Autonomy"
 uzh_identity.4.a:0 "Together with the Hungarians, we are stronger!"
 uzh_identity.4.d:0 "Our choice to integrate with Hungary opens new opportunities for cooperation. The Hungarians value our loyalty."
 uzh_identity.4.t:0 "Uhro-Rusyn Loyalty"
 uzh_industrial_revolution_desc:0 "Harness saltworks and mountain forges into manufactories, financing early workshops that feed Huszt's industrial experiment."
 uzh_industrial_revolution_title:0 "Industrial Revolution"
 uzh_komitat_captains_party_tt:0 "Monarchist influence (Captains' Party) is at least §Y70§!, or the Res Publica DLC is not enabled."
 uzh_komitat_system_desc:0 "Replace the Palanok captaincy with elected komitat estates, binding nobles to Huszt's statutes while fitting the march into St. Stephen's code."
 uzh_komitat_system_reform:0 "Komitat Estates"
 uzh_komitat_system_reform_desc:0 "We replace the hereditary Palanok captaincy with elected komitat estates, widening enfranchisement while binding nobles to the march's statutes."
 uzh_komitat_system_title:0 "Komitat System"
 uzh_launch_colonization_wave_desc:0 "Fund a wave of settlers to reshape the Carpathian or Pannonian marches under Huszt statutes."
 uzh_launch_colonization_wave_title:0 "Launch Rusyn Colonization"
 uzh_national_consciousness_desc:0 "By fostering a strong name and custom, we can unite our people under one banner and reduce internal strife."
 uzh_national_consciousness_title:0 "National Consciousness"
 uzh_opryshky_uprising:0 "Opryshky Uprising"
 uzh_opryshky_uprising_desc:0 "Mountain brotherhoods born of valach charters and salt smugglers now hoist banners in Máramaros. If the state squeezes the passes too hard, opryshky chiefs will rouse peasants, deserters, and guildsmen into a revolt that bleeds caravans dry."
 uzh_opryshky_uprising_title:0 "Opryshky Uprising"
 uzh_palanok_captaincy_reform:0 "Palanok Captaincy"
 uzh_palanok_captaincy_reform_desc:0 "The Palanok fortress above Mukachevo anchors our frontier. Entrusting command to a hereditary captaincy keeps the Drugeth and Rákóczi captains loyal while turning the castle into the keystone of a hardened Carpathian march."
 uzh_palatial_reform_desc:0 "Seat subject envoys in the palatine chambers and standardise parliamentary procedure so debates no longer bankrupt our federated estates."
 uzh_palatial_reform_title:0 "Palatine Reform"
 uzh_palatial_rusyn_identity_req_tt:0 "Allegiance not yet chosen: choose the Rusyn civic path."
 uzh_palatial_rusyn_reform:0 "Municipal Palatine Pact"
 uzh_palatial_rusyn_reform_desc:0 "Rusyn burghers codify a municipal palatine pact, setting a steady rhythm for city councils while a shared registry keeps new statutes gliding through the chancery."
 uzh_palatial_ruthenian_identity_req_tt:0 "Allegiance not yet chosen: choose the Ruthenian Congress path."
 uzh_palatial_ruthenian_reform:0 "Palatinate of Three Nations"
 uzh_palatial_ruthenian_reform_desc:0 "A tri-nation palatine compact seats Ruthenian deputies beside Polish and Lithuanian peers, widening the Commonwealth's embrace and lending greater weight to our diplomatic envoys."
 uzh_palatial_uhro_identity_req_tt:0 "Allegiance not yet chosen: choose the Ugro-Rusyn crown path."
 uzh_palatial_uhro_reform:0 "Crown Palatine Protectorate"
 uzh_palatial_uhro_reform_desc:0 "Crown palatines sworn to Saint Stephen steward the frontier, shoring up royal esteem and noble loyalty without loosening our grip on the march."
 uzh_pannonian_ambitions_desc:0 "The fertile lands of Pannonia have been coveted by many nations throughout history. We must establish our presence in this region to secure our future."
 uzh_pannonian_ambitions_title:0 "Pannonian Ambitions"
 uzh_pannonian_capital_desc:0 "Establishing a grand capital in Pest will solidify our rule over the Pannonian Basin and demonstrate our power to all of Europe."
 uzh_pannonian_capital_title:0 "Pannonian Capital"
 uzh_pannonian_expansion_desc:0 "Anchor our march beyond the Danube by securing Rusyn communes in the Alföld and Slavonia, then decide whether forts or charters will guard the new frontier."
 uzh_pannonian_expansion_title:0 "Pannonian Expansion"
 uzh_pannonian_frontier_desc:0 "Strengthen the passes and river fords so our chartered companies can police the Pannonian plain without surrendering their freedoms."
 uzh_pannonian_frontier_title:0 "Pannonian Frontier"
 uzh_pannonian_republic_desc:0 "Bind the frontier communes and komitats into a single compact so Palanok can balance republican councils with loyal captaincies no matter who wears the crown."
 uzh_pannonian_republic_title:0 "Pannonian Compact"
 uzh_raise_serdyuk_host_desc:0 "Summon loyal warriors as Serdyuk guards or opryshky raiders, accepting the costs of mustering a unique host."
 uzh_raise_serdyuk_host_title:0 "Raise the Serdyuk Host"
 uzh_rusin_nobility_desc:0 "Ennoble Rusyn magistrates and border captains, trading court benches and tax farms for loyal service in the Carpathian passes."
 uzh_rusin_nobility_title:0 "Rusyn Nobility"
 uzh_salt_corridors_desc:0 "Standardise salt barns and wine depots from Solotvyno to the Pest quays so every convoy marches under our counters and customs seals."
 uzh_salt_corridors_title:0 "Salt Corridors"
 uzh_solotvynska_camera_desc:0 "Compile crown ledgers for the Solotvyno chambers so every barrel is weighed, taxed, and dispatched under a single Rusyn seal."
 uzh_solotvynska_camera_title:0 "Solotvynska Camera"
 uzh_srem_metropolis_desc:0 "Seat a Greek Catholic metropolitan at Karlóca who answers to Huszt, binding the new parishes to our march instead of Buda."
 uzh_srem_metropolis_title:0 "Srem Metropolis"
 uzh_tisza_customs_convention_desc:0 "Broker a customs convention along the Upper Tisza so Pest, Mukachevo, and downstream marts treat our convoys as one tariff space."
 uzh_tisza_customs_convention_title:0 "Tisza Customs Convention"
 uzh_trade_routes_desc:0 "Bind the wine roads of the Alföld and Slavonia to Huszt's customs houses, steering merchants so our node commands the Danube tolls."
 uzh_trade_routes_title:0 "Trade Routes"
 uzh_union_synod_reform:0 "Union Synod of Uzhhorod"
 uzh_union_synod_reform_desc:0 "The synod at Uzhhorod bound our priests to Rome while leaving them the Byzantine rite, and the chancery has since learned to answer to a Latin bishop in Eger and a Slavonic parish in the same week."
 uzh_unity_of_rusin_desc:0 "All [Root.GetUZHIdentityCulturePlural] should be united under our leadership. We shall reclaim our ancestral lands and protect our cultural heritage."
 uzh_unity_of_rusin_title:0 "Unity of Rusin"
