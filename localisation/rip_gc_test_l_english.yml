l_english:
 rip_gc_test.1.t:0 "[TEST] Laboratory"
 rip_gc_test.1.d:0 "Use only a disposable non-Ironman save. Preparing fixtures changes state religion, resources and province ownership. It does not restore the original world. Start as peaceful Poland (POL) in 1444; use a separate save for dated scenarios. These events never fire automatically."
 rip_gc_test.1.o0:0 "Prepare Greek Catholic laboratory (280, 2961, 1952)"
 rip_gc_test.1.o1:0 "Set Hierarchical Capacity"
 rip_gc_test.1.o2:0 "Reset selected test state"
 rip_gc_test.1.o3:0 "Catholic patron / Uzhhorod"
 rip_gc_test.1.o4:0 "AI, education and ecumenism"
 rip_gc_test.2.t:0 "[TEST] Exact HC thresholds"
 rip_gc_test.2.d:0 "Changes only the native PA/HC bar. Keep the game paused: the monthly income changes boundary values. Active icons or synods remain active."
 rip_gc_test.2.o0:0 "0 HC"
 rip_gc_test.2.o1:0 "19 HC"
 rip_gc_test.2.o2:0 "20 HC"
 rip_gc_test.2.o3:0 "40 HC"
 rip_gc_test.2.o4:0 "100 HC"
 rip_gc_test.3.t:0 "[TEST] Reset controls"
 rip_gc_test.3.d:0 "These are test resets, not normal game actions. They do not refund payments, undo autonomy changes, clear pending events or restore event fire_only_once history. Reload the baseline save for independent tests."
 rip_gc_test.3.o0:0 "Clear icons only"
 rip_gc_test.3.o1:0 "Clear both local synod institutions"
 rip_gc_test.3.o2:0 "Clear Rome audience cooldown"
 rip_gc_test.3.o3:0 "Clear community rights in our provinces"
 rip_gc_test.3.o4:0 "Add supplies and restore 100 HC"
 rip_gc_test.4.t:0 "[TEST] Territorial union routes"
 rip_gc_test.4.d:0 "The Catholic fixture transfers 280 (Kyiv) and 279 (Lutsk) to you. It creates one Greek Catholic community and one Orthodox core seat. The real Eparchial Union decision still checks dates, Rome, peace, resources and cooldowns."
 rip_gc_test.4.o0:0 "Prepare Catholic patron: Kyiv and Lutsk"
 rip_gc_test.4.o1:0 "Open Uzhhorod test menu"
 rip_gc_test.5.t:0 "[TEST] Uzhhorod territorial test"
 rip_gc_test.5.d:0 "Preparation transfers province 1952 to you and makes your state Catholic and the province Orthodox. It clears local test flags but cannot cancel queued popups or reset engine one-shot history. Use a fresh save for each dated test. The direct popup button tests only the response, not historical scheduling."
 rip_gc_test.5.o0:0 "Prepare Catholic owner of province 1952"
 rip_gc_test.5.o1:0 "Open real historical response (April 1646 only)"
 rip_gc_test.5.o2:0 "Open real late response (May 1646 onward)"
 rip_gc_test.6.t:0 "[TEST] AI icon fixture"
 rip_gc_test.6.d:0 "Greek Catholic country only. Preparation clears icons, sets 40 HC and suppresses provincial unrest by 20. It does NOT activate an icon. After choosing, switch to another existing tag while paused, run to the next monthly pulse, pause and return. Active rebel armies override Liturgy/Learning; check them first. Use a new baseline for each case."
 rip_gc_test.6.o0:0 "Crisis: expect Almsgiving"
 rip_gc_test.6.o1:0 "Low prestige: expect Liturgy"
 rip_gc_test.6.o2:0 "Peace and points: expect Learning"
 rip_gc_test.7.t:0 "[TEST] School foundation"
 rip_gc_test.7.d:0 "Preparation clears the education flags and network and adds a temple in owned Greek Catholic Kyiv. Supplies are separate (test menu 3). The real event and decision use the same paid transaction. Neither should create a university."
 rip_gc_test.7.o0:0 "Reset school foundation in owned Greek Catholic Kyiv"
 rip_gc_test.7.o1:0 "Open real school proposal"
 rip_gc_test.8.t:0 "[TEST] Ecumenical settlement"
 rip_gc_test.8.d:0 "The first button uses the real gate: twenty-year foundation, peace, stability, guaranteed Orthodox and Catholic communities and an Orthodox ally with sufficient opinion. The preview button BYPASSES eligibility to inspect provincial/UI consequences only. It is not evidence that the real decision is reachable."
 rip_gc_test.8.o0:0 "Apply real settlement (requires all conditions)"
 rip_gc_test.8.o1:0 "PREVIEW ONLY: set ecumenical status"
 rip_gc_test.8.o2:0 "Clear preview status"
 rip_gc_test.9.t:0 "[TEST] Additional tests"
 rip_gc_test.9.d:0 "Choose an isolated scenario. Disabling the laboratory removes only its access flag: it does NOT undo fixture changes. Restore your original save to leave the laboratory."
 rip_gc_test.9.o0:0 "Prepare an AI icon case"
 rip_gc_test.9.o1:0 "Education"
 rip_gc_test.9.o2:0 "Ecumenical settlement"
 rip_gc_test.9.o3:0 "Disable laboratory access"
 rip_gc_test.close:0 "Close without changes."
 rip_gc_test.10.t:0 "[TEST] Diplomatic neighbour"
 rip_gc_test.10.d:0 "This changes only the current country's confession and union policy, not its territory. Switch to the intended neighbour while paused, select a profile, then return to the tested country before advancing time. No alliance or peace is created."
 rip_gc_test.10.a:0 "Greek Catholic neighbour, no opposition policy."
 rip_gc_test.10.b:0 "Orthodox neighbour, no opposition policy."
 rip_gc_test.10.c:0 "Catholic neighbour opposing the union."
