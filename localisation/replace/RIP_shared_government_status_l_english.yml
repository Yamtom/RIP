 rip_gov_hlc_title_tt:0 "Shared 10-year session lockout:\nThe Boyar Council courses share a single ten-year council session.\nChoosing any course convenes the council and locks all other courses for 10 years because co-option, dynastic defence, and repression compete rather than stack as independent tools."
