l_english:
 rip_uzh_union.1.t:0 "The Priests of the Mukachevo Eparchy"
 rip_uzh_union.1.d:0 "Local priests seek communion with Rome under a Catholic protector, asking that their Byzantine rite and their own episcopal tradition be preserved. The initiative comes from the clergy, not from a sovereign changing the state church.\n\nHistorically, 63 priests of the Mukachevo Eparchy were received by Bishop Jakusics of Eger in Uzhhorod Castle on 24 April 1646. Here the map has no province for Uzhhorod, so [Root.GetName] stands for it, and its religion for one local community, not for every inhabitant. Acceptance leaves our state religion alone and grants twenty years of local protection from missionary conversion, at the cost of 10 local autonomy. The patron, the price and the twenty years are game rules, not the record."
 rip_uzh_union.1.a:0 "Guarantee their rite."
 rip_uzh_union.1.b:0 "Leave the parishes as they are."
 rip_uzh_union.2.t:0 "The Mukachevo Priests Petition Late — alternative history"
 rip_uzh_union.2.d:0 "§YAlternative history.§! The record puts the union of the Mukachevo priests in April 1646; here their patron came late.\n\nThe priests still ask communion with Rome under a Catholic protector, with their Byzantine rite and their own episcopal tradition preserved. The map has no province for Uzhhorod, so [Root.GetName] stands for it. Acceptance leaves our state religion alone and grants twenty years of local protection from missionary conversion, at the cost of 10 local autonomy. The record knows no late petition; this one is ours."
 rip_uzh_union.2.a:0 "Guarantee their rite."
 rip_uzh_union.2.b:0 "Leave the parishes as they are."
 rip_uzh_union_patron_tt:0 "A Catholic owner becomes the §Ypatron of local unions§! at once, without the sponsor decision or its price, and may negotiate eparchial unions."
 rip_uzh_synod_closed_tt:0 "§YNo state synod is founded§!, and the road of the eparchy needs one."
