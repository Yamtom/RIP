 desc_conquest_of_constantinople:0 "The ancient imperial city on the Bosphorus now hears liturgy sung beneath our protection."
 desc_conquest_of_pagan_lands:0 "Priests and garrison chaplains follow the frontier armies beyond the Volga and Kama."
 desc_cultural_integration_program:0 "Royal decrees encourage gradual adoption of court speech, law, and customs among border subjects."
 desc_cultural_preservation_movement:0 "Local peoples organize to preserve their traditional culture."
 desc_defender_of_orthodoxy:0 "Foreign Orthodox embassies seek protection and alms from the northern throne."
 desc_divine_right_of_conquest:0 "Our banners advance with solemn prayers and patriarchal blessings against rival realms."
 desc_forced_conversions:0 "Local populations face stern pressure to conform to the established liturgy."
 desc_forced_russification:0 "Imperial officers press administrative and linguistic conformity across subject provinces, sparking local resentment."
 desc_garrison_and_mission:0 "Military garrison and Orthodox mission work together to control and convert population."
 desc_gathering_russian_lands:0 "The sovereign court pursues the union of surrounding Rus' principalities under Moscow's sceptre."
 desc_imperial_church_hierarchy:0 "Disciplined eparchial administration binds cathedral chapters closely to the central court."
 desc_imperial_orthodox_state:0 "Temporal administration and diocesan governance work together to anchor the crown across newly won lands."
 desc_local_resistance_russification:0 "Local population resists forced adoption of Russian culture and language."
 desc_mos_autocratic_russification:0 "Rigid central authority and forced uniformity strengthen military resolve at the cost of local frontier harmony."
 desc_mos_volga_finnic_synthesis:0 "Embracing the forest skills, local customs, and metallurgy of the Volga-Finnic peoples strengthens regional defense and communal peace."
 desc_moscow_patriarchate_authority:0 "The patriarchal chancery at Moscow exercises broad oversight over sees, monasteries, and clerical discipline."
 desc_old_believer_underground:0 "Old Believers practice their faith in secret, resisting church reforms."
 desc_orthodox_caesaropapism:0 "Imperial statutes place the governance of synods and sees firmly beneath the throne."
 desc_orthodox_cathedral_province:0 "A grand Orthodox cathedral dominates the city as symbol of Russian power."
 desc_orthodox_empire_proclaimed:0 "The court styles itself supreme secular protector of the Orthodox world."
 desc_orthodox_inquisition:0 "Ecclesiastical investigators and secular bailiffs prosecute dissident preaching, provoking unrest among minority parishes."
 desc_orthodox_manifest_destiny:0 "Clerical embassies and border missions champion the expansion of Muscovite jurisdiction into distant borderlands."
 desc_orthodox_mission_established:0 "Orthodox missionaries work to convert and assimilate local population."
 desc_patriarch_of_all_rus:0 "The metropolitan throne at Moscow assumes the patriarchal title, claiming primatial honour among northern sees."
 desc_persecution_of_heretics:0 "Magistrates and church courts harry nonconformist congregations, breeding resistance in dissenting provinces."
 desc_pomestie_system_defense:0 "Pomestnaya sistema - land granted in exchange for military service strengthens border defense."
 desc_religious_resistance_movement:0 "Organized resistance to forced religious conversion."
 desc_religious_uniformity_enforcement:0 "Diocesan overseers enforce the corrected service books throughout parish churches."
 desc_rip_ro_patriarchal_claim:0 "A claim to a patriarchate of all Rus' proclaimed at home without recognition from the ancient eastern sees."
 desc_rip_ro_state_controlled_church:0 "Crown officials hold firm supervisory sway over episcopal appointments and church revenues."
 desc_rip_ro_unbroken_communion:0 "The election of 1448 changed jurisdiction, not faith: the other Orthodox sees keep the same rite, calendar and saints, and their faithful are not treated as alien while communion holds. A deliberate break with the other churches revokes this settlement."
 desc_rus_artist_focus:0 "Artistic patronage elevates culture and prestige at court."
 desc_rus_inquisitor_focus:0 "Inquisitorial guidance reinforces confessional discipline and order."
 desc_rus_master_of_mint_focus:0 "Assaying craft improves coinage standards and treasury oversight."
 desc_rus_natural_scientist_focus:0 "Natural philosophy and empirical study guide practical improvements across the realm."
 desc_rus_philosopher_focus:0 "A philosopher's counsel advances enlightened administration and reform."
 desc_rus_the_stable_empire:0 "Steadfast leadership has preserved order and strengthened state stability."
 desc_rus_the_strong_motherland:0 "Trials have hardened our realm, and our soldiers stand firmer than ever."
 desc_rus_theologian_focus:0 "Theologians strengthen doctrine, unity, and spiritual authority."
 desc_rus_treasurer_focus:0 "Careful fiscal oversight improves state finances and efficiency."
 desc_russian_backed_hetman:0 "Moscow has imposed its chosen candidate as hetman, reducing our autonomy."
 desc_russian_colonial_administration:0 "Frontier provinces are ordered around fortified ostrogs, parish churches, and crown settlers."
 desc_russian_monastery_established:0 "A Russian Orthodox monastery serves as center of faith and culture."
 desc_russian_protection:0 "Russian garrisons and administrators oversee the province, providing security while eroding local autonomy."
 desc_russian_settlement:0 "Russian settlers establish communities, spreading Russian culture."
 desc_service_class_militia:0 "Sluzhilye lyudi - service nobility and their retainers defend the borderlands."
 desc_settler_colonialism:0 "Crown grants entice ploughmen and artisans into sparsely held borderland districts."
 desc_suppression_old_believers:0 "Royal officers confiscate old service books and scatter nonconforming communities, stirring local bitterness."
 desc_symphonia_of_powers:0 "Sovereign and patriarch coordinate temporal law and ecclesiastical dignity in shared counsel."
 desc_third_rome_ideology:0 "Court chroniclers proclaim Moscow the true guardian of Orthodox succession after the fall of Constantinople."
 divine_right_of_conquest:0 "Sanctified Banner"
 establish_moscow_patriarchate_decision_desc:0 "We can establish an independent Patriarchate in Moscow, asserting our religious autonomy."
 establish_moscow_patriarchate_decision_title:0 "Establish Moscow Patriarchate"
 establish_symphonia_decision_desc:0 "We can create harmonious unity of church and state authority."
 establish_symphonia_decision_title:0 "Establish Symphonia of Powers"
 force_convert_province_decision_desc:0 "Spend 50 administrative power to dispatch missionary preachers and an armed guard to a randomly chosen eligible unsettled province, strengthening local missionary efforts at the cost of unrest and higher autonomy."
 force_convert_province_decision_title:0 "Protect a Provincial Mission"
 forced_conversions:0 "Forced Conversions"
 forced_russification_desc:0 "Non-Russian peoples must adopt Russian language, culture, and custom for the empire's unity."
 garrison_and_mission:0 "Garrison and Mission"
 gathering_russian_lands:0 "Gathering of Russian Lands"
 gathering_russian_lands_decision_desc:0 "We can pursue unification of all Russian territories under our rule."
 gathering_russian_lands_decision_title:0 "Gathering of Russian Lands"
 imperial_church_hierarchy:0 "Imperial Church Hierarchy"
 imperial_orthodox_church:0 "Imperial Orthodox Church"
 imperial_orthodox_church_desc:0 "The Orthodox Church serves as instrument of imperial administration and control."
 imperial_orthodox_state:0 "Imperial Orthodox State"
 local_resistance_russification:0 "Resistance to Russification"
 mos_autocratic_russification:0 "Autocratic Russification"
 mos_volga_finnic_heritage_desc:0 "The lands of Zalesye rest upon an ancient substrate of Merya, Muroma, and Meshchera peoples. We must determine how to govern this diverse frontier."
 mos_volga_finnic_heritage_title:0 "Address the Volga-Finnic Substrate of Zalesye"
 mos_volga_finnic_synthesis:0 "Volga-Finnic Synthesis"
 moscow_patriarchate_authority:0 "Moscow Patriarchate Authority"
 muscovite_expansion_momentum:0 "Muscovite Expansion Momentum"
 muscovite_expansion_momentum_desc:0 "The successful incorporation of border principalities has strengthened our claim to leadership of all Rus' and improved our diplomatic standing."
 old_believer_underground:0 "Old Believer Underground"
