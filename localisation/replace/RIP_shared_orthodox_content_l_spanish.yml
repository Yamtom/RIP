 joined_orthodox_crusade:0 "Joined Our Crusade"
 liberator_of_constantinople_desc:0 "We have liberated Constantinople and restored it to Orthodox rule."
 monastery_looted:0 "Monastery Looted"
 orthodox_bishopric:0 "Orthodox Bishopric"
 orthodox_bishopric_desc:0 "The ancient Turov bishopric wields ecclesiastical authority throughout the Pripyat region. Our religious prestige reinforces political power."
 orthodox_brotherhoods:0 "Orthodox Brotherhoods"
 orthodox_champions:0 "Champions of Orthodoxy"
 orthodox_champions_desc:0 "We are recognized as defenders of the Orthodox faith."
 orthodox_cossack_defenders:0 "Cossack Defenders of Faith"
 orthodox_crusade.1.a:0 "For Orthodoxy and glory!"
 orthodox_crusade.1.d:0 "We have proclaimed a holy crusade to reclaim Constantinople, the Second Rome, from the hands of infidels. Throughout our realm, church bells summon the faithful to arms so that our banners may fly over the Hagia Sophia once more and the Orthodox Patriarch may return to his throne."
 orthodox_crusade.1.t:0 "The Orthodox Crusade for Constantinople"
 orthodox_crusade.10.a:0 "The faithful are united"
 orthodox_crusade.10.d:0 "The crusade has inspired tremendous religious fervor among our people. Churches overflow with faithful worshippers, and priests report miraculous signs. The Orthodox faith has never been stronger in our realm."
 orthodox_crusade.10.t:0 "Religious Fervor Spreads"
 orthodox_crusade.11.a:0 "To Jerusalem!"
 orthodox_crusade.11.d:0 "We have proclaimed a holy crusade to recover Jerusalem, the holiest city of Christendom. Every parish in our realm summons the faithful to deliver the sacred places for the Eastern Church."
 orthodox_crusade.11.t:0 "The Orthodox Crusade for Jerusalem"
 orthodox_crusade.12.a:0 "We shall join this holy war!"
 orthodox_crusade.12.b:0 "We support them spiritually"
 orthodox_crusade.12.c:0 "We cannot spare troops"
 orthodox_crusade.12.d:0 "[From.GetName] has proclaimed a crusade to deliver the Holy Land, calling upon Orthodox rulers everywhere to join this sacred war."
 orthodox_crusade.12.t:0 "[From.GetName] Declares Crusade for Jerusalem"
 orthodox_crusade.13.a:0 "Prepare the defenses!"
 orthodox_crusade.13.b:0 "Rally our own allies"
 orthodox_crusade.13.d:0 "[From.GetName] has declared a crusade to wrest Jerusalem from our hands, rallying Orthodox banners against our dominion in the Holy Land."
 orthodox_crusade.13.t:0 "Orthodox Crusade for Jerusalem Declared"
 orthodox_crusade.14.a:0 "Victory is near!"
 orthodox_crusade.14.d:0 "Our crusade for the Holy Land presses onward, and with each victory our columns draw nearer to the walls of Jerusalem under the gaze of the Orthodox world."
 orthodox_crusade.14.t:0 "Jerusalem Within Reach"
 orthodox_crusade.15.a:0 "Glory to God in the highest!"
 orthodox_crusade.15.d:0 "The campaign for Jerusalem has been settled. The first victory grants 25 of each monarch power, 5 authority and 10 prestige, with a twenty-year church distinction. Campaign benefits and unused casus belli have ended."
 orthodox_crusade.15.t:0 "Jerusalem Liberated"
 orthodox_crusade.16.a:0 "God has forsaken us"
 orthodox_crusade.16.d:0 "Our crusade for Jerusalem has ended in catastrophic failure. The Holy Land remains under infidel control, and countless faithful have perished for nothing. This defeat is a terrible blow to Orthodox Christianity and our prestige."
 orthodox_crusade.16.t:0 "Jerusalem Crusade Failed"
 orthodox_crusade.17.a:0 "This is a miracle!"
 orthodox_crusade.17.d:0 "[From.GetName] has delivered Jerusalem from infidel rule. The crusade has achieved a triumph long prayed for across the Eastern churches, restoring Christian worship to the Holy City."
 orthodox_crusade.17.t:0 "Jerusalem Liberated"
 orthodox_crusade.18.a:0 "We mourn this failure"
 orthodox_crusade.18.d:0 "The crusade for Jerusalem has ended in defeat. Despite our participation, [From.GetName] failed to liberate the Holy Land. This is a grievous blow to all Orthodox Christians."
 orthodox_crusade.18.t:0 "Jerusalem Crusade Failed"
 orthodox_crusade.19.a:0 "Welcome them all"
 orthodox_crusade.19.d:0 "Now that Jerusalem is under Orthodox control, pilgrims from across Christendom flood into the Holy City. The Church of the Holy Sepulchre receives thousands of faithful visitors, and the city prospers from their devotion."
 orthodox_crusade.19.t:0 "Pilgrims Flock to Jerusalem"
 orthodox_crusade.2.a:0 "We shall join the crusade!"
 orthodox_crusade.2.b:0 "We offer prayers but not soldiers"
 orthodox_crusade.2.c:0 "This is not our war"
 orthodox_crusade.2.d:0 "[From.GetName] has proclaimed a holy crusade to liberate Constantinople from infidel rule, summoning all Orthodox realms to deliver the Second Rome."
 orthodox_crusade.2.t:0 "[From.GetName] Declares Crusade for Constantinople"
 orthodox_crusade.20.a:0 "United in Christ"
 orthodox_crusade.20.d:0 "Our crusade has united Orthodox Christians across the world. Nations that once viewed each other with suspicion now stand together in common cause. This brotherhood of faith strengthens us all."
 orthodox_crusade.20.t:0 "Orthodox Unity Through Crusade"
 orthodox_crusade.21.a:0 "Press on."
 orthodox_crusade.21.d:0 "Our victory in battle strengthens our claim to glory in the crusade."
 orthodox_crusade.21.t:0 "Crusade Contribution"
 orthodox_crusade.22.a:0 "Onward."
 orthodox_crusade.22.d:0 "A fortress falls before our banners, increasing our standing in the crusade."
 orthodox_crusade.22.t:0 "Crusade Contribution"
 orthodox_crusade.23.a:0 "So be it."
 orthodox_crusade.23.d:0 "The Orthodox crusade has reached its end."
 orthodox_crusade.23.t:0 "Crusade Concludes"
 orthodox_crusade.3.a:0 "Fortify the city!"
 orthodox_crusade.3.b:0 "Seek allies against this threat"
 orthodox_crusade.3.d:0 "[From.GetName] has declared a crusade against us, claiming religious justification for their aggression. Orthodox nations across the world are rallying to their banner, threatening our control of Constantinople."
 orthodox_crusade.3.t:0 "Orthodox Crusade Threatens Our Realm"
 orthodox_crusade.4.a:0 "God guides our sword!"
 orthodox_crusade.4.d:0 "Our crusade marches on. Fighting with fierce zeal, our regiments draw closer with every victory to restoring Constantinople to Orthodoxy."
 orthodox_crusade.4.t:0 "The Crusade Progresses"
 orthodox_crusade.5.a:0 "The bells of Tsargrad ring again."
 orthodox_crusade.5.d:0 "The campaign for Constantinople has been settled. The first victory grants 25 of each monarch power, 5 authority and 10 prestige, with a twenty-year church distinction. Campaign benefits and unused casus belli have ended."
 orthodox_crusade.5.t:0 "Constantinople Liberated"
 orthodox_crusade.6.a:0 "We have been humbled"
 orthodox_crusade.6.d:0 "Despite our prayers and sacrifices, we have failed to liberate Constantinople. Our crusade has ended in defeat, and the holy city remains under infidel control. This shameful failure shall haunt us for years to come."
 orthodox_crusade.6.t:0 "The Crusade Has Failed"
 orthodox_crusade.7.a:0 "Blessed be this day!"
 orthodox_crusade.7.d:0 "[From.GetName] has liberated Constantinople from infidel rule. The crusade we joined has ended in victory, restoring Orthodox liturgy to the Second Rome."
 orthodox_crusade.7.t:0 "Constantinople Liberated"
 orthodox_crusade.8.a:0 "A dark day for Orthodoxy"
 orthodox_crusade.8.d:0 "The crusade to liberate Constantinople has ended in defeat. Despite our participation, [From.GetName] was unable to reclaim the holy city from infidel hands."
 orthodox_crusade.8.t:0 "The Crusade Has Failed"
 orthodox_crusade.9.a:0 "God fights alongside us!"
 orthodox_crusade.9.d:0 "Our armies have won a great battle in the crusade. The enemy breaks before our advance, and our soldiers give thanks for deliverance as the road opens before them."
 orthodox_crusade.9.t:0 "Crusade Victory in Battle"
 orthodox_crusade_active_tt:0 "There must be an active Orthodox crusade"
 orthodox_crusade_constantinople_desc:0 "Beginning in §Y1525§!, a ruler with the backing of the Church can call the Orthodox allies to Constantinople. Muster a field army and keep reserves at home before issuing the call."
 rip_crusade_het_role_tt:0 "As the Hetmanate, complete §YKyiv & the Register§! to lead a crusade."
 rip_crusade_interval_tt:0 "No Orthodox crusade is active. At least §Y20 years§! have passed since the last campaign ended, if one has been fought."
 rip_crusade_eligible_owner_tt:0 "The city belongs to an independent ruler outside the Eastern Orthodox rites. You have neither an alliance nor a truce with its owner."
 rip_crusade_launch_tt:0 "Spend §Y200 ducats§! and §Y20 patriarch authority§! to lead the crusade. Gain a casus belli against the owner for up to §Y10 years§! and invite your Orthodox allies."
 rip_crusade_join_tt:0 "Spend §Y5 patriarch authority§! to join. Gain the campaign modifier and a casus belli against the marked ruler until the campaign ends (up to 10 years)."
 rip_crusade_end_tt:0 "Settle the campaign now. Owning the objective with an Orthodox parish brings victory. The first victory at each city grants §G10 prestige, 5 authority and 25 of each monarch power§!, plus a 20-year liberator modifier. Failure costs §R10 prestige§! and, for rulers using patriarch authority, §R5 authority§!, with a 10-year penalty. Campaign benefits and unused casus belli expire."
 orthodox_crusade_constantinople_title:0 "Declare Crusade for Constantinople"
 orthodox_crusade_cooldown:0 "Crusade Exhaustion"
 orthodox_crusade_cooldown_desc:0 "We cannot declare another crusade so soon after the last one."
 orthodox_crusade_cooldown_tt:0 "Must not have recently concluded a crusade"
 orthodox_crusade_end_desc:0 "Settle the campaign now. Victory requires ownership of the objective and an Orthodox parish there; otherwise the campaign is abandoned. All campaign benefits and unused war claims are withdrawn."
 orthodox_crusade_end_title:0 "End the Orthodox Crusade"
 orthodox_crusade_for_constantinople:0 "Crusade for Constantinople"
 orthodox_crusade_for_constantinople_desc:0 "We have declared a holy crusade to liberate Constantinople from infidel rule."
 orthodox_crusade_for_jerusalem:0 "Crusade for Jerusalem"
 orthodox_crusade_for_jerusalem_desc:0 "We have declared a holy crusade to reclaim the Holy Land."
 orthodox_crusade_het_role_tt:0 "Hetmanate must unlock the Orthodox crusade role first"
 orthodox_crusade_jerusalem_desc:0 "Organise a ten-year campaign for Jerusalem for 200 ducats and 20 authority. Orthodox allies receive invitations. The campaign ends when its objective is settled, lost to another ruler or abandoned."
 orthodox_crusade_jerusalem_title:0 "Declare Crusade for Jerusalem"
 orthodox_crusade_join_desc:0 "Spend 5 authority to join an allied Orthodox campaign. Its military benefits and unused casus belli end with the campaign."
 orthodox_crusade_join_title:0 "Join the Orthodox Crusade"
 orthodox_crusade_leader:0 "Orthodox Crusade Leader"
 orthodox_crusade_leader_desc:0 "We lead a holy crusade to reclaim Orthodox lands."
 orthodox_crusade_participant:0 "Orthodox Crusade Participant"
 orthodox_crusade_participant_desc:0 "We have joined an Orthodox crusade."
 orthodox_crusade_unity:0 "Orthodox Crusade Unity"
 orthodox_education_center:0 "Orthodox Education Center"
 orthodox_literary_tradition:0 "Orthodox Literary Tradition"
 orthodox_metropolia:0 "Orthodox Metropolia"
 orthodox_metropolia_desc:0 "Seat of the Orthodox Metropolitan."
 orthodox_monastery_network:0 "Orthodox Monastery Network"
 orthodox_printing_press:0 "Orthodox Printing Press"
 orthodox_protected:0 "Orthodox Sanctuary Protected"
 orthodox_protected_desc:0 "The Orthodox faith is actively protected here."
 orthodox_protector_desc:0 "We are recognized as defenders of Orthodox Christianity."
 orthodox_stronghold:0 "Orthodox Stronghold"
 orthodox_zeal:0 "Ruthenian Rite Settlement"
 patriarch_of_constantinople_restored_desc:0 "The Orthodox Patriarch has returned to his ancient throne in Constantinople."
 refused_orthodox_crusade:0 "Refused to Join Crusade"
 Restore_the_Orthodoxy:0 "Restoration of Orthodoxy"
 Restore_the_Orthodoxy_desc:0 "Orthodoxy, once a dominant form of Christianity throughout Europe, has now become weak and dispersed. Our country is committed to restoring Orthodoxy to its former glory in the name of the Lord."
 restored_orthodox_constantinople_desc:0 "Constantinople has been restored to Orthodox Christian rule."
 restored_orthodox_jerusalem_desc:0 "Jerusalem has been liberated and returned to Christian rule."
 rip_ro_liberator_of_jerusalem:0 "Orthodox Liberator of Jerusalem"
 rip_ro_liberator_of_jerusalem_desc:0 "We have liberated the Holy Land and restored Jerusalem to Orthodox rule."
 seeking_anti_crusade_allies_desc:0 "We actively seek allies to help us resist the crusade."
 take_province_crusade_constantinople:0 "Take Constantinople"
 take_province_crusade_constantinople_desc:0 "War goal is to take the enemy capital and secure Constantinople."
 take_province_crusade_jerusalem:0 "Take Jerusalem"
 take_province_crusade_jerusalem_desc:0 "War goal is to take the enemy capital and secure Jerusalem."
