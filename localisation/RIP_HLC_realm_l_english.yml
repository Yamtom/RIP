l_english:
 hlc_carpathian_bulwark_title:0 "Frontier Crown"
 hlc_carpathian_bulwark_desc:0 "Guard the Galician approaches to the Carpathians with forts at Peremyshl, Drohobych and Halych. Own and control all three fortress provinces; any permanent fort level qualifies. This defensive line provides the foundation for our confessional settlement and statutes. In a united realm, Volhynia supplies the hinterland that these forts guard."
 hlc_confessional_compact_title:0 "Confessional Settlement"
 hlc_confessional_compact_desc:0 "Resolve Galicia's religious settlement through synod, brotherhood and provincial law. The Dormition Brotherhood of Lviv, with its school and press, stands at the centre of Ruthenian church life."
 hlc_halych_sejm_mission_title:0 "Halych Compact"
 hlc_halych_sejm_mission_desc:0 "Secure a negotiated compact with Galicia's estates and towns in Halych."
 hlc_constitutional_settlement_title:0 "Statutes of Galicia"
 hlc_constitutional_settlement_desc:0 "Complete Galicia's constitutional settlement and define the balance between crown, estates, and service elites."
 hlc_confessional_fallback_req_tt:0 "By sovereign strength: maintain confessional cohesion through stability and broad provincial development."
 hlc_constitution_fallback_req_tt:0 "By sovereign strength: codify constitutional order via administrative maturity, rank, and stability."
 hlc_halych_sejm_fallback_req_tt:0 "By sovereign strength: establish sejm governance through administrative maturity and domestic stability."
 hlc_path_poland_req_tt:0 "Galicia must institutionalize provincial estates governance."
 hlc_path_austria_req_tt:0 "Galicia must consolidate a centralized frontier chancery order."
 hlc_constitution_done_req_tt:0 "The Galician constitutional settlement must be completed."
 hlc_confessional_dualism_confessional_req_tt:0 "The confessional settlement has been formalized through synod or brotherhood guarantees."
 hlc_crown_and_sejm_constitution_req_tt:0 "The constitutional settlement of Galicia has been ratified."
 hlc_path_boyar_req_tt:0 "The Boyar Rada must have deposed the dynasty outright."
 hlc_path_metropolitanate_req_tt:0 "The Metropolitan of Halych must have been seated as head of state."
 hlc_path_confirmed_metropolitanate_req_tt:0 "Constantinople must have confirmed the Metropolitanate of Halych against Kyiv and Moscow."
 hlc_path_lviv_union_req_tt:0 "The Lviv eparchy's own synod must have completed its union with Rome."
 rip_galicia.1.t:0 "The Galician Settlement"
 rip_galicia.1.d:0 "With Red Ruthenia and Volhynia secured, Galicia must be ordered anew. Shall the realm bind the marches to a stronger frontier crown, or ratify a compact of estates centered on Halych?"
 rip_galicia.1.a:0 "Consolidate the Frontier Crown"
 rip_galicia.1.b:0 "Ratify the Halych Compact"

 rip_galicia.2.t:0 "Confessional Settlement in Galicia"
 rip_galicia.2.d:0 "Bishops, brotherhoods, and town elders demand a durable religious settlement. We may codify a synod of union, or guarantee the Orthodox brotherhoods as pillars of the realm."
 rip_galicia.2.a:0 "Codify the Halych Synod"
 rip_galicia.2.b:0 "Guarantee the Brotherhoods"

 rip_galicia.3.t:0 "The Statutes of Galicia"
 rip_galicia.3.d:0 "Jurists in Lviv now press for a lasting order. We may proclaim a common statute that binds crown, estates, and towns, or entrust reform to a disciplined frontier court."
 rip_galicia.3.a:0 "Promulgate the Statutes of Danylo"
 rip_galicia.3.b:0 "Entrust the Crown to the Host"

 hlc_the_boyars_take_power_title:0 "The Boyars Take Power"
 hlc_the_boyars_take_power_desc:0 "The Boyar Rada may depose the dynasty during a succession crisis: legitimacy must be below 50, or below 60 with no heir. The independent Galician state must also have at least +1 stability before it elects a voivode."
 hlc_elevate_the_metropolitan_title:0 "Seat the Metropolitan of Halych"
 hlc_elevate_the_metropolitan_desc:0 "An independent Galician state may place its metropolitan at the head of government with at least +1 stability. It needs 50% Patriarch Authority as an Orthodox state or 12% Hierarchical Capacity as a Greek Catholic state."

 rip_galicia_carpathian_shield:0 "Frontier Crown"
 desc_rip_galicia_carpathian_shield:0 "Fortified passes, sworn garrisons, and a disciplined chancery bind the Carpathian marches to the crown."

 rip_galicia_halych_sejm:0 "Halych Compact"
 desc_rip_galicia_halych_sejm:0 "Regional estates and towns secure influence over taxation and law through a negotiated compact in Halych."

 rip_galicia_sejm_uniate:0 "Synodal Compact"
 desc_rip_galicia_sejm_uniate:0 "A Galician synod balances church union, estate privilege, and provincial oversight."

 rip_galicia_uniate_synod:0 "Halych Synod"
 desc_rip_galicia_uniate_synod:0 "Clergy, schools, and presses are coordinated through a local synod that ties reform to crown service."

 rip_galicia_orthodox_bastion:0 "Brotherhood Bastion"
 desc_rip_galicia_orthodox_bastion:0 "Orthodox brotherhoods, monasteries, and town patrons anchor Ruthenian loyalty across the realm."

 rip_galicia_constitution:0 "Statutes of Danylo"
 desc_rip_galicia_constitution:0 "A common statute binds crown, estates, and towns into a workable Ruthenian constitutional order."

 rip_galicia_crown_and_sabre:0 "Crown and Host"
 desc_rip_galicia_crown_and_sabre:0 "The crown relies on drilled frontier officers and loyal service elites to enforce order."

 galician_sejm_assembly:0 "Halych Sejm Assembly"
 desc_galician_sejm_assembly:0 "The Halych Sejm Assembly expands governing capacity and bolsters legitimacy through provincial consent and deliberation."

 rip_galicia_boyar_supremacy:0 "Boyar Supremacy"
 desc_rip_galicia_boyar_supremacy:0 "The boyar council answers to no prince: it elects the voivode and holds him to its own privileges."

 rip_galicia_halych_see:0 "The Halych See"
 desc_rip_galicia_halych_see:0 "A metropolitan of Halych's own tends the province's faith and stands as the visible head of the realm."

 rip_galicia_metropolitanate_confirmed:0 "Synodal Confirmation"
 desc_rip_galicia_metropolitanate_confirmed:0 "A patriarchal tomos has settled the Halych see's standing against Kyiv and Moscow, for as long as Constantinople holds to it."

 rip_galicia_lviv_union_synod:0 "The Lviv Union"
 desc_rip_galicia_lviv_union_synod:0 "The eparchy's synod sits within the Roman fold now, its Byzantine rite and local governance otherwise undisturbed."
 HLC:0 "Halych"
 HLC_ADJ:0 "Halycian"
 HLC_ideas:0 "Halycian Ideas"
 HLC_ideas_start:0 "Halycian Traditions"
 HLC_ideas_bonus:0 "Halycian Ambitions"
 HLC_patrons:0 "Chartered Landed Estates"
 HLC_patrons_desc:0 "Merchants offer to advance the crown money in return for charters securing their estates intact. Let these new princes defend their holdings and furnish the treasury with a share of the wealth they bring in."
 HLC_lviv_castle:0 "Renovate the High Castle of Lviv"
 HLC_lviv_castle_desc:0 "The castle on Castle Hill in Lviv, built under the leadership of the King of Rus' Lev Danilovich and later by Polish King Casimir III, must be renovated as a symbol of our renewed ambitions and spiritual devotion."
 HLC_rus_ward:0 "Rus' Ward"
 HLC_rus_ward_desc:0 "Following the Mongol horde's departure, the Western principalities, which were the last independent ward of Rus', must defend the generally accepted traditions of the Ruthenians from new threats. We will not abdicate our responsibilities."
 HLC_cavalry_west_n_east:0 "Cavalry from the West and the East"
 HLC_cavalry_west_n_east_desc:0 "Our armies face both western lancers and steppe riders. Halych-Volhynia's cavalry must meet disciplined horsemen in the field and answer swift raids on the open frontier."
 HLC_registered_army:0 "City Guard of Halych"
 HLC_registered_army_desc:0 "Let us gather seasoned warriors and form a City Guard to protect our lands. By offering them a share of the city's wealth and ensuring the prosperity of their families, we shall prevent the rise of destitute veterans turned into marauders after wars."
 HLC_europe_relative:0 "Dynastic Ties Across Europe"
 HLC_europe_relative_desc:0 "Royal marriages with neighbouring Christian courts strengthen our dynasty's standing and secure the succession of the Galician crown."
 HLC_halician_legion:0 "Legion of Halych"
 HLC_halician_legion_desc:0 "Let our most experienced captains gather a standing force under one banner. When the levies muster, they will have veterans beside them who can hold the line."
 HLC_lviv_casle:0 "Lviv Castle"
 HLC_lviv_casle_desc:0 "The High Castle of Lviv commands the approaches to the city, standing as a bulwark of Galician defense and royal authority."

 hlc_galician_voivodeship_reform:0 "Galician Voivodeship"
 hlc_galician_voivodeship_reform_desc:0 "A frontier voivodeship balances Ruthenian customary law, magnate privilege, and royal authority while binding Galicia to the wider realm."

 # --- hlc_boyar_council_mechanic ---
 ability_hlc_boyar_council_mechanic:0 "The Boyar Council"
 hlc_confirm_the_boyars_in_office:0 "Confirm the Boyars in Office"
 hlc_confirm_the_boyars_in_office_desc:0 "Spend 50 administrative power to secure cooperation when noble loyalty is below 60. Offices strengthen noble influence for ten years. All boyar council courses share a ten-year cooldown."
 hlc_counter_the_foreign_claimant:0 "Counter the Foreign Claimant"
 hlc_counter_the_foreign_claimant_desc:0 "Spend 50 diplomatic power to defend the dynasty when legitimacy is below 60. This shares the ten-year boyar council cooldown."
 hlc_make_an_example_of_a_defiant_boyar:0 "Make an Example of a Defiant Boyar"
 hlc_make_an_example_of_a_defiant_boyar_desc:0 "At peace, spend 60 military power to repress nobles whose loyalty is below 40. Their influence falls, but unrest rises and loyalty suffers. This shares the ten-year council cooldown."
 hlc_boyar_council_session_cd:0 "The Boyar Council cannot choose another course for §Y10§! years."
 hlc_boyars_confirmed:0 "Boyars Confirmed in Office"
 hlc_foreign_claimant_countered:0 "Foreign Claimant Countered"
 hlc_boyars_made_example:0 "Boyars Made an Example Of"
 hlc_confessional_dualism_reform:0 "Confessional Dualism"
 hlc_confessional_dualism_reform_desc:0 "Galicia formalizes a settlement between Orthodox and Uniate institutions, turning confessional tension into provincial law."
 hlc_crown_and_sejm_reform:0 "Crown and Sejm Statutes"
 hlc_crown_and_sejm_reform_desc:0 "Crown and estates ratify a common statute that balances prerogative, law, and provincial consent; the statute confirms the assembly's right to elect the voivode, so a foreign house may yet inherit the seat it grants."
 hlc_magnate_assembly_reform:0 "Estate Compact"
 hlc_magnate_assembly_reform_desc:0 "Leading magnates, clergy, and towns are bound to the crown through a negotiated provincial compact - and, as in the wider Commonwealth, the voivode's seat itself may fall to open election, with princes, hetmans, and neighbouring dynasties free to press a candidate on the assembly."
 hlc_centralized_voivodeship_reform:0 "Frontier Chancery"
 hlc_centralized_voivodeship_reform_desc:0 "A centralized frontier chancery standardizes taxation, justice, and garrison rule across Galicia."
 hlc_galician_sejm_reform:0 "Halych Sejm Assembly"
 hlc_galician_sejm_reform_desc:0 "Galician estates and towns convene in a formal sejm that anchors provincial governance in consent and law."
 hlc_austrian_bureaucracy_reform:0 "Crown Chancery Cadre"
 hlc_austrian_bureaucracy_reform_desc:0 "Merit-trained clerks, surveyors, and judges extend a disciplined Ruthenian administration across the marches. Its chancery may take an appanage prince under direct administration, for a price in governing capacity."
 hlc_merchant_privileges_reform:0 "Merchant Privileges"
 hlc_merchant_privileges_reform_desc:0 "Galician merchants gain guild protections and chartered rights in exchange for fiscal service to the realm."
 hlc_crown_authority_reform:0 "Frontier Crown Authority"
 hlc_crown_authority_reform_desc:0 "The crown claims direct authority over key offices, revenues, and military obligations in the marches. Its chancery can issue six different ordinances, each lasting ten years, and keep at most three of them in force at a time."
 hlc_enlightened_monarchy_reform:0 "Ruthenian Enlightenment Court"
 hlc_enlightened_monarchy_reform_desc:0 "Law, schooling, and administration are rationalized through a court culture rooted in Ruthenian service and learning."
 hlc_military_modernization_reform:0 "Frontier Army Reform"
 hlc_military_modernization_reform_desc:0 "Galician cavalry and garrisons are reorganized into a disciplined frontier army without abandoning local martial traditions."
 hlc_boyar_republic_reform:0 "Boyar Republic"
 hlc_boyar_republic_reform_desc:0 "The Boyar Rada stops confirming princes and starts electing a term-limited voivode outright, ending the dynasty it once merely constrained."
 hlc_boyar_oligarchy_reform:0 "Rule of the Great Houses"
 hlc_boyar_oligarchy_reform_desc:0 "A handful of boyar clans hold the offices of the republic between them, trading broader consent for a tighter, more experienced hand on the chancery."
 hlc_halych_metropolitanate_reform:0 "Halych Metropolitanate"
 hlc_halych_metropolitanate_reform_desc:0 "The Metropolitan of Halych, once a petition to Constantinople and twice a broken jurisdiction, now sits as head of state over voivode and boyar alike."
 hlc_halych_synodal_confirmation_reform:0 "Synodal Confirmation"
 hlc_halych_synodal_confirmation_reform_desc:0 "Constantinople founded the Halych see in 1303, closed it in 1347 and restored it in 1371, yet it lapsed again after 1391. This reform is the confirmation that would have held it against the standing claim of Kyiv and Moscow to the whole Rus church."
 hlc_lviv_uniate_synod_reform:0 "Lviv Uniate Synod"
 hlc_lviv_uniate_synod_reform_desc:0 "A century after Brest, the Lviv eparchy brings its own synod into the union, long after Halych's original see had lapsed."

 # --- decisions/HLCRepublicPaths ---

 # --- decisions/HLCMetropolitanatePaths ---
 hlc_confirm_the_metropolitan_see_title:0 "Confirm the Metropolitan See"
 hlc_confirm_the_metropolitan_see_desc:0 "Kyiv and Moscow have not stopped pressing their claim on the Halych see. Petition for a tomos that settles the matter without further appeal."
 hlc_complete_the_union_of_lviv_title:0 "Complete the Union of Lviv"
 hlc_complete_the_union_of_lviv_desc:0 "The eparchy has drifted toward Rome for a generation already. Bring its synod into the union outright, rather than leave the matter to a future bishop."

 # --- hlc_austrian_reorganization_mechanic ---
 ability_hlc_austrian_reorganization_mechanic:0 "The Crown Ordinances"
 hlc_enact_chancery_ordinance:0 "Enact the Chancery Ordinance"
 hlc_enact_chancery_ordinance_desc:0 "Trained clerks are seconded to the chancellor's staff, sharpening the crown's hand in negotiation at the cost of keeping them from other offices.\n\nCosts §Y50§! diplomatic power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_chancery_ordinance_modifier:0 "Chancery Ordinance"
 desc_hlc_chancery_ordinance_modifier:0 "The chancery improves diplomacy but raises advisor costs by 10 percent."
 hlc_chancery_ordinance_not_in_force_tt:0 "The Chancery Ordinance is not in force."
 hlc_enact_settlement_ordinance:0 "Enact the Settlement Ordinance"
 hlc_enact_settlement_ordinance_desc:0 "Newly converted communities are settled under standing chancery rules rather than case by case. Culture conversion costs §G10%§! less, and the first conversion ordered by hand in a year steadies the nobles who receive the land, unless they already stand at §Y60%§! loyalty or more.\n\nCosts §Y50§! administrative power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_settlement_ordinance_modifier:0 "Settlement Ordinance"
 desc_hlc_settlement_ordinance_modifier:0 "Newly converted communities are settled under standing chancery rules, which makes conversion cheaper. The first manual conversion in a year also steadies the nobles who receive the land, by §G+2§! loyalty, unless they already stand at §Y60%§! or more. National unrest rises by 1 while the ordinance is in force."
 hlc_settlement_ordinance_not_in_force_tt:0 "The Settlement Ordinance is not in force."
 hlc_settlement_loyalty_timer:0 "Settlement Favour Granted"
 desc_hlc_settlement_loyalty_timer:0 "The nobles have lately been steadied by resettled land; the chancery grants no further favour for a year."
 hlc_enact_cadastral_ordinance:0 "Enact the Cadastral Ordinance"
 hlc_enact_cadastral_ordinance_desc:0 "The chancery's surveyors measure every holding and enter it in the land registers, so the treasury collects on what each estate truly holds. The nobility will remember who drew the map.\n\nCosts §Y50§! administrative power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_cadastral_ordinance_modifier:0 "Cadastral Ordinance"
 desc_hlc_cadastral_ordinance_modifier:0 "Every holding is measured and entered in the land registers. The treasury collects more, and the nobles resent being counted."
 hlc_cadastral_ordinance_not_in_force_tt:0 "The Cadastral Ordinance is not in force."
 hlc_enact_urbarial_ordinance:0 "Enact the Urbarial Ordinance"
 hlc_enact_urbarial_ordinance_desc:0 "The chancery writes down what each village owes its lord and for how many days in the week. Fields are tilled, recruits are easier to find, and the lords remember who set their dues in a register.\n\nCosts §Y50§! administrative power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_urbarial_ordinance_modifier:0 "Urbarial Ordinance"
 desc_hlc_urbarial_ordinance_modifier:0 "Dues are written down and no longer left to custom. Villages are calmer and yield more recruits, and the nobles resent the register."
 hlc_urbarial_ordinance_not_in_force_tt:0 "The Urbarial Ordinance is not in force."
 hlc_enact_toleration_ordinance:0 "Enact the Toleration Ordinance"
 hlc_enact_toleration_ordinance_desc:0 "Congregations of every rite in the marches keep and build their houses of worship under the crown's seal. The towns are quieter; the bishops count what the seal has cost them.\n\nCosts §Y50§! diplomatic power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_toleration_ordinance_modifier:0 "Toleration Ordinance"
 desc_hlc_toleration_ordinance_modifier:0 "The crown's seal protects the houses of worship of every congregation in the marches. Other faiths are better borne and the provinces are quieter, but the clergy are not pleased."
 hlc_toleration_ordinance_not_in_force_tt:0 "The Toleration Ordinance is not in force."
 hlc_enact_frontier_ordinance:0 "Enact the Frontier Guard Ordinance"
 hlc_enact_frontier_ordinance_desc:0 "Villages along the Carpathian passes owe the crown watchmen in return for their land and freedom from other dues. The passes are watched and invaders are worn down in them, at the price of a larger army to feed.\n\nCosts §Y50§! military power. The ordinance stands for §Y10§! years and cannot be enacted again until its term has run out. The crown keeps at most §Ythree§! of its six ordinances in force at a time."
 hlc_frontier_ordinance_modifier:0 "Frontier Guard Ordinance"
 desc_hlc_frontier_ordinance_modifier:0 "Watchmen hold the passes. Fortresses are harder to take and invaders suffer for crossing the mountains, while the army costs more to keep."
 hlc_frontier_ordinance_not_in_force_tt:0 "The Frontier Guard Ordinance is not in force."
 hlc_ordinance_slot_free_tt:0 "Fewer than three of the crown's ordinances are in force."

 # --- RIP_HLC_diplomatic_actions ---
 hlc_incorporate_appanage:0 "Incorporate the Appanage"
 hlc_incorporate_appanage_title:0 "Incorporate the Appanage"
 hlc_incorporate_appanage_tooltip:0 "Bring [From.GetName] under the chancery's direct administration. A later diplomatic annexation is §G25%§! cheaper; each Incorporated Vassal costs §R100§! Governing Capacity."
 hlc_incorporate_appanage_desc:0 "Are you sure you want to bring [From.GetName] under the chancery's direct administration? This turns §Y[From.GetName]§! into an §YIncorporated Vassal§!: a future diplomatic annexation becomes §G-25.0%§! cheaper than for a regular vassal, but our Governing Capacity falls by §R-100.00§! for as long as it is held, and annexation is not possible for another §Y10§! years. The nobility's §YStrong Appanages§! privilege needs at least one Incorporated Vassal.\n\nThe change cannot be undone."
 hlc_incorporate_appanage_limit_tt:0 "The crown holds fewer than five Incorporated Vassals."

 # --- RIP_HLC_estate_privileges ---
 estate_nobles_hlc_strong_appanages:0 "Strong Appanages"
 estate_nobles_hlc_strong_appanages_desc:0 "The incorporated appanage princes keep their courts and their garrisons; the voivode keeps their loyalty by leaving both alone. The privilege lapses when the last Incorporated Vassal is annexed or lost."
 estate_nobles_hlc_strong_appanages_trigger_tooltip:0 "The voivode holds at least one Incorporated Vassal."

 # --- government attributes shown on the Austrian-path reform cards ---
 mechanic_hlc_enables_incorporated_appanages_yes:0 "May turn §YVassals§! into §YIncorporated Vassals§! with the '§YIncorporate the Appanage§!' diplomatic action, up to five at a time and only while their liberty desire is below §Y50%§!. §YIncorporated Vassals§! are §G-25.0%§! cheaper to annex by diplomacy, but each reduces our Governing Capacity by §R-100.00§!, and the nobility's §YStrong Appanages§! privilege needs one."
 mechanic_hlc_disables_chernihiv_ruina_yes:0 "Disables the §YLeft-Bank Ruin§! disaster"
 hlc_lviv_magdeburg_charters_title:0 "Lviv Town Charters"
 hlc_lviv_magdeburg_charters_desc:0 "King Casimir's 1356 charter and Halych-Volhynian municipal grants turned Lviv into a crossroads of Rusyn, Armenian, German, Polish, and Jewish merchants trading between the Dniester and the Vistula. Securing all of Red Ruthenia and upholding Lviv's self-governing town hall and magistrat anchors urban wealth and guild craftsmanship beneath the Galician crown."
 rip_galicia_lviv_magdeburg_hall:0 "Lviv Magdeburg Magistrat"
 desc_rip_galicia_lviv_magdeburg_hall:0 "Self-governing burgher courts and merchant halls make Lviv a disciplined commercial pivot between the Vistula and the Black Sea."
 rip_galicia_magdeburg_charters:0 "Red Ruthenian Town Charters"
 desc_rip_galicia_magdeburg_charters:0 "Municipal privileges patterned on Magdeburg Law encourage urban crafts, fair-day trade, and steady town revenues across our realm."
