 khmelnytsky_concessions:0 "Khmelnytsky Concessions"
 khmelnytsky_events.1.a:0 "Rally the host."
 khmelnytsky_events.1.b:0 "Seek a compromise."
 khmelnytsky_events.1.d:0 "Word has gone out along the Dnieper that the Host is gathering. Men who have waited years for a place on the register are leaving their villages to join it. The officers must decide what answer to send the crown."
 khmelnytsky_events.1.t:0 "The Uprising Begins"
 khmelnytsky_events.10.a:0 "Embrace their cause."
 khmelnytsky_events.10.b:0 "Curb their zeal."
 khmelnytsky_events.10.d:0 "At the muster, men who have taken up arms for their churches ask to march under their own banners. The captains await our word."
 khmelnytsky_events.10.t:0 "Defenders of Faith"
 khmelnytsky_events.11.a:0 "Restore property."
 khmelnytsky_events.11.b:0 "Let disputes linger."
 khmelnytsky_events.11.d:0 "Two claimants have brought deeds to the same church lands. Until the court settles the matter, neither the parish priest nor the tenants know to whom the rents are due."
 khmelnytsky_events.11.t:0 "Church Property"
 khmelnytsky_events.2.a:0 "Hold the line."
 khmelnytsky_events.2.d:0 "The ferrymen bring the same news from one crossing after another. The villages are sending men and provisions to the Host, and the watch can no longer hold every road."
 khmelnytsky_events.2.t:0 "The Revolt Spreads"
 khmelnytsky_events.3.a:0 "Keep the men under arms."
 khmelnytsky_events.3.b:0 "Send envoys to the other camp."
 khmelnytsky_events.3.d:0 "Each side has called up more men. The officers gathered in council can still send envoys across the lines, but neither camp will wait much longer for an answer."
 khmelnytsky_events.3.t:0 "Arms or Articles"
 khmelnytsky_events.4.a:0 "Press the advantage."
 khmelnytsky_events.4.d:0 "The opposing companies have drawn back, leaving the roads open. Our captains urge us to move while the enemy is still gathering his men."
 khmelnytsky_events.4.t:0 "A Turning Point"
 khmelnytsky_events.5.a:0 "Accept terms."
 khmelnytsky_events.5.b:0 "Reject terms."
 khmelnytsky_events.5.d:0 "Envoys have laid their articles before the council. We may put our seals to the terms they offer, or send them home and face another season in the field."
 khmelnytsky_events.5.t:0 "Negotiations"
 khmelnytsky_events.6.a:0 "Seek support."
 khmelnytsky_events.6.b:0 "Stand alone."
 khmelnytsky_events.6.d:0 "The Host needs friends beyond the frontier. A foreign court might lend us troops or coin, but its envoys will ask what we pledge in return."
 khmelnytsky_events.6.t:0 "Foreign Appeals"
 khmelnytsky_events.8.a:0 "Support them."
 khmelnytsky_events.8.b:0 "Restrain them."
 khmelnytsky_events.8.d:0 "The brotherhoods have opened their halls to the townspeople. Their elders collect alms and carry petitions from one parish to the next. They ask leave to speak in the name of the faithful."
 khmelnytsky_events.8.t:0 "Brotherhoods Organize"
 khmelnytsky_events.9.a:0 "Grant privileges."
 khmelnytsky_events.9.b:0 "Hold firm."
 khmelnytsky_events.9.d:0 "Priests from the frontier parishes have come before our council. They want their privileges set down in writing, with a seal that the captains and magistrates must honour."
 khmelnytsky_events.9.t:0 "Clerical Influence"
