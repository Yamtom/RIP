 right_bank_development_desc:0 "Economic development of the Right Bank."
 grain_export_hub_desc:0 "A major center for grain exports."

 revolutionary_empire_desc:0 "A revolutionary empire that has overthrown the old order and seeks to spread its ideals through conquest and reformation."
 revolutionary_republic_desc:0 "A revolutionary republic that has cast aside the chains of monarchy and aristocracy, establishing a government by the people."
 prussian_republic_desc:0 "Elective civic councils govern a disciplined commonwealth backed by strict Prussian military drill."
 domestic_grain_security:0 "Domestic Grain Security"
 domestic_grain_security_desc:0 "We prioritize feeding our own people over exports."

 ruthenian_independence_accepted:0 "Accepted Ruthenian Independence"
 opinion_friendly:0 "Friendly Relations"
 opinion_likes_us:0 "Favorable Impression"
 pripyat_river_trade:0 "Pripyat River Trade"
 pripyat_river_trade_desc:0 "The Pripyat flows into the Dnieper, connecting us to the Black Sea trade routes. Our timber flotillas carry forest goods downstream, while we maintain a modest but strategic river navy."
 merchant_networks:0 "Merchant Networks"
 merchant_networks_desc:0 "Jewish merchants, Armenian traders, and Polish factors create a many-peopled commercial culture. Economic pragmatism drives our prosperity."
 pripyat_heartland:0 "Pripyat Heartland"
 pripyat_heartland_desc:0 "Turov controls the strategic center of the Pripyat river basin. This waterway connects us to the Dnieper and grants commercial influence over wetland trade."
 merchant_guilds:0 "Merchant Guilds"
 merchant_guilds_desc:0 "Many-peopled guilds unite Ruthenian, Jewish, and German merchants. Commercial expertise and economic pragmatism drive our prosperity."
 magdeburg_privileges:0 "Magdeburg Privileges"
 magdeburg_privileges_desc:0 "The town keeps its charter through every passage of armies: the magistracy sits, the guilds keep their books, and the market is held on the appointed days."
 military_society:0 "Military Society"
 military_society_desc:0 "Constant border conflicts have created a society where every citizen is a potential soldier. Martial traditions permeate our culture."
 magdeburg_law_tradition:0 "Magdeburg Law Tradition"
 magdeburg_law_tradition_desc:0 "Urban self-governance via Magdeburg rights is widespread across Belarus. This commercial culture drives economic development."
 religious_tolerance:0 "Religious Tolerance"
 religious_tolerance_desc:0 "Orthodox and Catholic coexistence, along with Jewish communities and the Uniate Church, creates pragmatic multi-confessionalism. Religious diversity is our strength."
 partisan_tradition:0 "Partisan Tradition"
 partisan_tradition_desc:0 "Forest guerrilla warfare is deeply embedded in Belarusian culture. Our partisan expertise makes occupation nearly impossible for foreign powers."
