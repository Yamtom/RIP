 rip_gov_cesar_title:0 "§YCesarstvo: Lands and Settlement§!"
 rip_gov_cesar_title_tt:0 "Shares use total development of ALL owned provinces, including territories; subjects are excluded. The census updates monthly. Displayed whole percentages are rounded down; thresholds use the exact share.\nNon-primary: provinces whose culture differs from the owner's primary culture. Unaccepted: the subset of those provinces for which the engine reports no owner-accepted culture. Accepted same-group cultures therefore follow the engine's cultural-union rules.\nConquest, development, province loss, culture conversion and changes in accepted or primary culture alter these shares at the next census. Promoting a culture can reduce the unaccepted share without reducing the non-primary share."
 rip_gov_cesar_minority:0 "Non-primary development: ~[Root.RipGovMinorityShare]"
 rip_gov_cesar_minority_tt:0 "Shares use total development of ALL owned provinces, including territories; subjects are excluded. The census updates monthly. Displayed whole percentages are rounded down; thresholds use the exact share.\nNon-primary: provinces whose culture differs from the owner's primary culture. Unaccepted: the subset of those provinces for which the engine reports no owner-accepted culture. Accepted same-group cultures therefore follow the engine's cultural-union rules.\nConquest, development, province loss, culture conversion and changes in accepted or primary culture alter these shares at the next census. Promoting a culture can reduce the unaccepted share without reducing the non-primary share."
 rip_gov_cesar_excluded:0 "Unaccepted development: ~[Root.RipGovExcludedShare]"
 rip_gov_cesar_excluded_tt:0 "Shares use total development of ALL owned provinces, including territories; subjects are excluded. The census updates monthly. Displayed whole percentages are rounded down; thresholds use the exact share.\nNon-primary: provinces whose culture differs from the owner's primary culture. Unaccepted: the subset of those provinces for which the engine reports no owner-accepted culture. Accepted same-group cultures therefore follow the engine's cultural-union rules.\nConquest, development, province loss, culture conversion and changes in accepted or primary culture alter these shares at the next census. Promoting a culture can reduce the unaccepted share without reducing the non-primary share."
 rip_gov_cesar_eligible:0 "Integration: [Root.RipGovIntegration]"
 rip_gov_cesar_eligible_tt:0 "Integration requires ALL three: at least one owned non-primary province with an owner-accepted culture; at least one accepted culture; non-primary development at least 10%. A cultural union alone does not waive the accepted-culture requirement.\nThree accepted cultures add growth only while these requirements hold. Development matters, not the number of provinces."
 rip_gov_cesar_concord:0 "Throne Concord: monthly factors"
 rip_gov_cesar_concord_tt:0 "Monthly Concord: base +0.10, plus active values below.\n[Root.CesarConcordStable] stability at least +2\n[Root.CesarConcordUnstable] negative stability\n[Root.CesarConcordLegit] legitimacy at least 80\n[Root.CesarConcordIllegit] legitimacy below 40\n[Root.CesarConcordSubjects] any subject at 50% liberty desire\n[Root.CesarConcordCompact] Gathering at least 60 and integration eligible\n[Root.CesarConcordExcluded] unaccepted share at least 30%\nAt zero Concord, Throne in Disarray lasts 1825 days."
 rip_gov_cesar_gather:0 "Gathering: monthly factors"
 rip_gov_cesar_gather_tt:0 "Monthly Gathering: base 0, plus active values below.\n[Root.CesarGatherEligible] integration eligible\n[Root.CesarGatherCultures] eligible and at least 3 accepted cultures\n[Root.CesarGatherMinority] eligible and non-primary share at least 30%\n[Root.CesarGatherThrone] eligible and Concord at least 60\n[Root.CesarGatherExcluded15] unaccepted share at least 15%\n[Root.CesarGatherExcluded30] unaccepted share at least 30% (stacks with 15%)\n[Root.CesarGatherWeakThrone] Concord below 30\n[Root.CesarGatherExhausted] war exhaustion at least 5\n[Root.CesarGatherIneligible] integration not eligible\nAt 100: a 3650-day compact, +10 prestige and +10 Concord; Gathering resets to 40. This reset is not a breakdown."
 rip_gov_cesar_breakdown:0 "[Root.RipGovBreakdown]"
 rip_gov_cesar_breakdown_tt:0 "Monthly breakdown check: unaccepted development at least 30% AND Gathering below 20. Once per breakdown: -15 Concord and Throne in Disarray for 1825 days.\nRecovery requires unaccepted development strictly below 15% AND Gathering at least 40. It clears the breakdown flag; the timed Throne in Disarray modifier remains until expiry. Falling to zero Concord can also apply that modifier."
 rip_gov_cesar_recovery:0 "Crisis and recovery: hover for thresholds"
 rip_gov_cesar_recovery_tt:0 "Monthly breakdown check: unaccepted development at least 30% AND Gathering below 20. Once per breakdown: -15 Concord and Throne in Disarray for 1825 days.\nRecovery requires unaccepted development strictly below 15% AND Gathering at least 40. It clears the breakdown flag; the timed Throne in Disarray modifier remains until expiry. Falling to zero Concord can also apply that modifier."
