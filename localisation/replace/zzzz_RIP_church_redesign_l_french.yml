 rip_church_icon_mercy_action:0 "[Root.GetChurchIconMercyAction]"
 rip_church_icon_mercy_action_tt:0 "§YMercy§!\nThe eastern lands, the Volga, the Urals and Siberia: §G-10% local autonomy§! and §G-1 local unrest§! in your provinces there, whatever their faith.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMercyAccess]"
 rip_church_icon_mercy_benefit:0 "§GEastern lands\nAutonomy -10%\nUnrest -1§!"
 rip_church_icon_mercy_benefit_tt:0 "§YMercy§!\nThe eastern lands, the Volga, the Urals and Siberia: §G-10% local autonomy§! and §G-1 local unrest§! in your provinces there, whatever their faith.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMercyAccess]"
 rip_church_icon_mercy_button:0 "Mercy"
 rip_church_icon_mercy_button_tt:0 "§YMercy§!\nThe eastern lands, the Volga, the Urals and Siberia: §G-10% local autonomy§! and §G-1 local unrest§! in your provinces there, whatever their faith.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMercyAccess]"
 rip_church_icon_mercy_label:0 "[Root.GetChurchIconMercyName]"
 rip_church_icon_mission:0 "Mission"
 rip_church_icon_mission_action:0 "[Root.GetChurchIconMissionAction]"
 rip_church_icon_mission_action_tt:0 "§YApostolic Mission§!\nSettled provinces of another faith, Orthodox ones excluded: §G+2% local missionary strength§!. It opens the funding of mission nodes, which pay Fervor; closing it closes every node. It needs §Y20 Fervor§! in the pool: 10 to start it and 10 to found the first node.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMissionAccess]"
 rip_church_icon_mission_benefit:0 "§GOther faiths\nMissionary +2%\nOpens nodes§!"
 rip_church_icon_mission_benefit_tt:0 "§YApostolic Mission§!\nSettled provinces of another faith, Orthodox ones excluded: §G+2% local missionary strength§!. It opens the funding of mission nodes, which pay Fervor; closing it closes every node. It needs §Y20 Fervor§! in the pool: 10 to start it and 10 to found the first node.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMissionAccess]"
 rip_church_icon_mission_button:0 "Mission"
