 rip_church_ro_policies_label:0 "Policies"
 rip_church_ro_policies_label_tt:0 "§WActive policies§!\nPatriarch Authority sets how many may be on at once: §Y1§! below 30%, §Y2§! from 30%, §Y3§! from 65%, §Y4§! from 90%. Each costs §R3 Fervor§! a month, so income decides how many you can keep: below 30% authority, one policy without a node drains 1 Fervor/month. The first node offsets Mission upkeep; at 65% authority two nodes can sustain three policies. All four always drain the pool."
 rip_church_ro_policies_sub:0 "[Root.GetChurchROUpkeep] Fervor / mo"
 rip_church_ro_policies_sub_tt:0 "§WActive policies§!\nPatriarch Authority sets how many may be on at once: §Y1§! below 30%, §Y2§! from 30%, §Y3§! from 65%, §Y4§! from 90%. Each costs §R3 Fervor§! a month, so income decides how many you can keep: below 30% authority, one policy without a node drains 1 Fervor/month. The first node offsets Mission upkeep; at 65% authority two nodes can sustain three policies. All four always drain the pool."
 rip_church_ro_policies_title:0 "Church policies"
 rip_church_ro_policies_title_tt:0 "Click a policy to switch it on or off. Costs §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Each acts only where it was made for: the steppe frontier, the eastern lands, parishes with a cathedral, provinces of other faiths. Hover a policy for its effects. The gold arrows between the summary tiles are visual only, not buttons or a separate effect: Fervor pays to fund nodes; each funded node returns +3 Fervor per month to help pay policy upkeep."
 rip_church_ro_policies_value:0 "[Root.GetChurchROPolicies] / [Root.GetChurchROCapacity]"
 rip_church_ro_policies_value_tt:0 "§WActive policies§!\nPatriarch Authority sets how many may be on at once: §Y1§! below 30%, §Y2§! from 30%, §Y3§! from 65%, §Y4§! from 90%. Each costs §R3 Fervor§! a month, so income decides how many you can keep: below 30% authority, one policy without a node drains 1 Fervor/month. The first node offsets Mission upkeep; at 65% authority two nodes can sustain three policies. All four always drain the pool."
