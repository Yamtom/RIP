l_spanish:
 convert_to_greek_catholic_decision_desc:0 "Alternative history when the state has no Catholic overlord: the historical unions were concluded by bishops living under Catholic crowns, and none of those crowns changed its own faith. Here the whole state takes the union. Bring our local hierarchy into communion with Rome while retaining its Byzantine rite. Shared rules model several local Ruthenian and Carpathian Eastern Catholic union traditions under a broad game category, not one church institution. Brest, Uzhhorod, Peremyshl, Lviv and Lutsk have distinct local histories, chronologies and jurisdictions; these rules do not imply that every region followed the same path or belonged to one institution."
 convert_to_greek_catholic_decision_title:0 "Accept a local church union"
 convert_to_russian_orthodox_decision_desc:0 "Spend 150 ADM and 100 DIP to establish the Muscovite state confession. Requires peace, stability 2, legitimacy 75 and Moscow or a capital in the Russian region. Provincial majorities retain their faith; diplomatic communion remains a separate choice."
 convert_to_russian_orthodox_decision_title:0 "Elect an Independent Metropolitan"
 current_patriarch_authority_text:0 "Autoridad patriarcal"
 desc_rip_church_broken_promises:0 "Diplomatic reputation -1 and clergy loyalty equilibrium -10 for ten years. New charters are unavailable and ecumenical standing is lost."
 desc_rip_church_cathedral_drive:0 "An established cathedral supports local infrastructure: construction costs are reduced for all buildings here while the policy is active."
 desc_rip_church_coercion_resistance:0 "A minority parish or an Old Believer community resists state censorship or mobilization: unrest +2, tax and manpower -10%."
 desc_rip_church_compact_resistance:0 "The crown broke its promises: unrest +4 and tax -15% for ten years. The population does not automatically change faith."
 desc_rip_church_confessional_mobilization:0 "Manpower recovery +10%, land maintenance -10%, unrest +1. Minority resistance increases. Ends after five years or at the next monthly update after peace."
 desc_rip_church_conversion_pressure:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 desc_rip_church_conversion_resistance:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 desc_rip_church_crown_appointments:0 "Tax +5%; clergy influence -10 and loyalty equilibrium -10 percentage points; yearly patriarchal authority -0.5 percentage points. The monarch controls appointments at the expense of ecclesiastical independence."
 desc_rip_church_eastern_clemency:0 "The church pleads for the peoples of the east: less unrest and a firmer hold on the province."
 desc_rip_church_episcopal_guarantees:0 "Unrest -2, tax -10%, missionary strength -2%. The crown promises liturgical continuity and episcopal elections. A missionary or imposed confession breaches the charter."
 desc_rip_church_frontier_watch:0 "Monasteries and parish bells warn and shelter the steppe border: defensiveness, and attrition for invaders."
 desc_rip_church_gc_blessing:0 "This adjustment no longer exists. It has no effect and is cleared automatically."
