l_german:
 rip_tur_ruina_scorched_earth:0 "Verbrannte Erde am Rechten Ufer"
 rip_tur_ruina_scorched_earth_title:0 "Verbrannte Erde am Rechten Ufer"
 rip_tur_ruina_scorched_earth_desc:0 "Belagerungen, tatarische Streifscharen und Strafbrände haben die Städte Podoliens und des Rechten Ufers entvölkert und in Ödland verwandelt."
 desc_rip_tur_ruina_scorched_earth:0 "Strafzüge und tatarische Hilfstruppen hinterlassen niedergebrannte Orte, unbezahlte Besatzungen und verlassene Fluren zwischen Dnestr und Dnepr."
 rip_tur_captive_galley_revolt:0 "Aufstände der Galeerenruderer"
 rip_tur_captive_galley_revolt_title:0 "Aufstände der Galeerenruderer"
 rip_tur_captive_galley_revolt_desc:0 "Verschleppte Gefangene aus dem Norden und dem Balkan füllen die Ruderbänke der Flotte, bis Verzweiflung in Werftbränden und Meutereien auf See ausbricht."
 desc_rip_tur_captive_galley_revolt:0 "Die Massenverschleppung von Ruderern untergräbt die Kampfmoral der Flotte und macht die Arsenale anfällig für Ausbrüche."
 rip_plc_bloody_pacification:0 "Die Blutige Befriedung"
 rip_plc_bloody_pacification_title:0 "Die Blutige Befriedung"
 rip_plc_bloody_pacification_desc:0 "Privatarmeen der Magnaten, harte Einquartierungen und Standgerichte in ruthenischen Dörfern entfachen verzweifelte Aufstände in den Ostwoiwodschaften."
 desc_rip_plc_bloody_pacification:0 "Die gewaltsame Befriedung der Ostwoiwodschaften zerrüttet die königliche Autorität und treibt ganze Landstriche in den Aufstand."
 rip_rus_abolition_of_hetmanate:0 "Zerschlagung von Hetmanat und Sitsch"
 rip_rus_abolition_of_hetmanate_title:0 "Zerschlagung von Hetmanat und Sitsch"
 rip_rus_abolition_of_hetmanate_desc:0 "Die Aufhebung der Regimentsgerichte, Dragonereinquartierungen und Zwangsaushebungen für nördliche Kanalbauten tilgen die alten ruthenischen Rechte."
 desc_rip_rus_abolition_of_hetmanate:0 "Die kaiserliche Gleichschaltung am Linken Ufer und in Saporoschje verursacht Steuerflucht und Grenzaufruhr."
 rip_cri_yasyr_depopulation_crisis:0 "Verödete Steppe und Gefangenenkrise"
 rip_cri_yasyr_depopulation_crisis_title:0 "Verödete Steppe und Gefangenenkrise"
 rip_cri_yasyr_depopulation_crisis_desc:0 "Jahrelange Raubzüge haben benachbarte Flusstäler entvölkert, Zölle versiegen lassen und in überfüllten Pferchen auf der Krim Seuchen und Gegenschläge genährt."
 desc_rip_cri_yasyr_depopulation_crisis:0 "Die einseitige Ausrichtung auf Gefangenenmärkte ruiniert den Friedenshandel und zieht Gegenangriffe auf sich."
 rip_tur_yasyr_port_tithe_title:0 "Den Hafen-Fünften vom Yasyr eintreiben"
 rip_tur_yasyr_port_tithe_desc:0 "Pentschik-Kommissare in Kaffa und Otschakiw einsetzen, um das Fünftel des Sultans an verschleppten ruthenischen Gefangenen für Schatzkammer und Galeeren einzuziehen."
 rip_tur_podillian_church_seizures_title:0 "Podolische Steinkirchen umwandeln"
 rip_tur_podillian_church_seizures_desc:0 "Befestigte ruthenische Kirchen und Klostergüter in Podolien für Garnisonsmoscheen einziehen oder die örtlichen Dhimma-Schutzbriefe bestätigen."
 rip_tur_devshirme_northern_levy_title:0 "Die strenge Knabenlese ausweiten"
 rip_tur_devshirme_northern_levy_desc:0 "Janitscharen-Werbern befehlen, die Aushebung in christlichen Sprengeln und nördlichen Eyâlets zu verschärfen oder sie in Geld abzulösen."
 rip_tur_surgun_forced_resettlement_title:0 "Zwangsumsiedlungs-Edikte (Sürgün) erlassen"
 rip_tur_surgun_forced_resettlement_desc:0 "Zünfte, Familien und Handwerker eroberter Provinzen nach Konstantinopel und an Grenzfestungen zwangsumsiedeln oder auf freiwillige Privilegien setzen."
 rip_tur_celali_anatolian_reprisals_title:0 "Eiserne Befriedung in Anatolien befehlen"
 rip_tur_celali_anatolian_reprisals_desc:0 "Strafkolonnen entsenden, um aufständische Bezirke in Anatolien während der Celâlî-Unruhen niederzuschlagen, oder eine Amnestie gewähren."
 rip_tur_balkan_tribute_exactions_title:0 "Donau- und Steppenabgaben verdoppeln"
 rip_tur_balkan_tribute_exactions_desc:0 "Außerordentliche Korn-, Schaf- und Silberlieferungen aus Moldau, Walachei und Jedisan für die Feldarmee einfordern."
 rip_plc_second_serfdom_corvee_title:0 "Unbeschränkte Folwark-Frondienste durchsetzen"
 rip_plc_second_serfdom_corvee_desc:0 "Die Magnaten darin bestärken, fünf Tage Wochendienst auf ruthenischen Flussgütern zu fordern, oder eine gesetzliche Obergrenze setzen."
 rip_plc_ordinance_of_1638_title:0 "Die Kronverordnung über die Kosaken erlassen"
 rip_plc_ordinance_of_1638_desc:0 "Gewählte Kosakenobersten abschaffen, Adelskommissare über ein gekürztes Register setzen und Unregistrierte der Grundherrschaft unterwerfen."
 rip_plc_parish_sequestrations_title:0 "Widerspenstige orthodoxe Pfarreien einziehen"
 rip_plc_parish_sequestrations_desc:0 "Kirchen und Klostergüter in ruthenischen Städten versiegeln, die bischöfliche Dekrete verweigern, oder städtischen Konfessionsfrieden verbriefen."
 rip_rus_kyiv_press_censorship_title:0 "Die Druckereien von Kiew und Tschernigow zensieren"
 rip_rus_kyiv_press_censorship_desc:0 "Ruthenische Druckereien, Akademieschriften und Kanzleisprache der Synodenzensur unterstellen oder bestehende Druckprivilegien wahren."
 rip_cri_kaffa_captive_markets_title:0 "Die Gefangenenmärkte von Kaffa und Perekop ausbauen"
 rip_cri_kaffa_captive_markets_desc:0 "Mirzas und Kapitänen Steuererleichterungen für Gefangenenhöfe in Kaffa gewähren oder Beutezüge durch geregelte Tamga-Zölle begrenzen."
 rip_tur_seized_parishes:0 "Eingezogene Kirchengüter"
 desc_rip_tur_seized_parishes:0 "Eingezogene Kirchen und Pfarreistiftungen erbittern die christliche Bürgerschaft und mindern das Steueraufkommen."
 rip_tur_uprooted_quarters:0 "Entwurzelte Handwerkerviertel"
 desc_rip_tur_uprooted_quarters:0 "Zwangsumsiedlungen im Zuge des Sürgün haben Werkstätten verwaist und Marktstände geleert."
 rip_tur_great_flight:0 "Bauernflucht der Wirren"
 desc_rip_tur_great_flight:0 "Strafbrände und Sammelbußen haben die Dorfbewohner in Gebirge und ferne Städte vertrieben."
 rip_plc_folwark_exhaustion:0 "Ausgepowerte Frongüter"
 desc_rip_plc_folwark_exhaustion:0 "Fünf Frondiensttage pro Woche steigern zwar die Kornausfuhr, verursachen aber Bauernflucht und dumpfe Erbitterung."
 rip_plc_closed_parishes:0 "Versiegelte orthodoxe Kirchen"
 desc_rip_plc_closed_parishes:0 "Verschlossene oder verpachtete Gotteshäuser machen jeden Feiertag zu einem Anlass für Unruhen."
 rip_rus_silenced_presses:0 "Versiegelte Kiewer Druckpressen"
 desc_rip_rus_silenced_presses:0 "Unter Synodensiegel gelegte Letternkästen ersticken den gelehrten Austausch und den Buchdruck vor Ort."
 rip_tur_pencik_notoriety:0 "Schwarzmeer-Pentschiksteuer"
 desc_rip_tur_pencik_notoriety:0 "Geregelte Gefangenenversteigerungen in den Reichshäfen füllen die Zollkassen und schrecken christliche Nachbarhöfe auf."
 rip_tur_ransom_brokerage:0 "Geregelte Lösegeldvermittlung"
 desc_rip_tur_ransom_brokerage:0 "Geregelter Loskauf statt Galeerenzwang mindert Grenzspannungen auf Kosten geringerer Hafeneinkünfte."
 rip_tur_coercive_eyalet_rule:0 "Strenge Eyâlet-Herrschaft"
 desc_rip_tur_coercive_eyalet_rule:0 "Die Umwandlung bedeutender Stadtkirchen beschleunigt Übertritte, entfremdet jedoch die nichtmuslimische Bevölkerung."
 rip_tur_podillian_dhimma_charter:0 "Podolischer Dhimma-Schutzbrief"
 desc_rip_tur_podillian_dhimma_charter:0 "Verbriefter Kirchenschutz nach Dhimma-Recht befriedet die Grenzstädte, belässt den Ältesten aber mehr Eigenständigkeit."
 rip_tur_harsh_devshirme:0 "Strenge Knabenaushebung"
 desc_rip_tur_harsh_devshirme:0 "Erhöhte Quoten füllen die Regimenter, säen jedoch tiefen Groll in den christlichen Bezirken."
 rip_tur_devshirme_commutation:0 "Abgelöste Aushebungsrollen"
 desc_rip_tur_devshirme_commutation:0 "Geldablösungen statt Aushebung von Söhnen schonen die Haushalte, verlangsamen aber den Rekrutenersatz."
 rip_tur_surgun_edicts:0 "Kaiserliche Sürgün-Erlasse"
 desc_rip_tur_surgun_edicts:0 "Staatliche Zwangsumsiedlungen formen eroberte Städte um, schaffen aber Unmut im In- und Ausland."
 rip_tur_voluntary_charters:0 "Freiwillige Zunftpatente"
 desc_rip_tur_voluntary_charters:0 "Steuerbefreite Niederlassungsbriefe statt Zwangsumsiedlung erleichtern das Zusammenwachsen der Provinzen."
 rip_tur_iron_pacification:0 "Eiserne Hand in Anatolien"
 desc_rip_tur_iron_pacification:0 "Schnelle Strafgerichte zerschlagen Aufständische, hinterlassen jedoch verwüstete Steuerbezirke."
 rip_tur_anatolian_amnesty:0 "Anatolische Amnestiebriefe"
 desc_rip_tur_anatolian_amnesty:0 "Begnadigungen und Steuernachlässe führen geflohene Bauern zurück, lockern aber die straffe Aufsicht."
 rip_tur_danubian_exactions:0 "Außerordentliche Donau-Abgaben"
 desc_rip_tur_danubian_exactions:0 "Unangekündigte Sonderforderungen pressen Vasallen aus und treiben die Fürsten nach nördlichen Verbündeten."
 rip_tur_fixed_danubian_tribute:0 "Festgeschriebener Tributsatz"
 desc_rip_tur_fixed_danubian_tribute:0 "Feste Tributgrenzen sichern die Gefolgschaft der Donaufürstentümer trotz geringerer Einnahmen."
 rip_plc_second_serfdom:0 "Zweite Leibeigenschaft der Folwarks"
 desc_rip_plc_second_serfdom:0 "Erbuntertänige Bauern liefern reiche Getreideüberschüsse, während Flucht und Erbitterung das Rekrutenaufkommen schmälern."
 rip_plc_capped_corvee:0 "Gesetzliche Frondienstgrenze"
 desc_rip_plc_capped_corvee:0 "Königliche Kommissare begrenzen die Frondienste im Osten und beruhigen die Dörfer trotz adligen Widerspruchs."
 rip_plc_crown_ordinance:0 "Aufhebung der Kosaken-Ämter"
 desc_rip_plc_crown_ordinance:0 "Der Entzug gewählter Kosakenführer stärkt den Adel am Dnepr, lähmt aber die Einsatzbereitschaft der Grenzreiterei."
 rip_plc_regimental_liberties:0 "Verbriefung der Regimentsfreiheiten"
 desc_rip_plc_regimental_liberties:0 "Die Achtung gewählter Ämter und Soldlisten erhält eine schlagkräftige Steppenreiterei auf Kosten königlicher Zentralgewalt."
 rip_plc_confessional_coercion:0 "Konfessionelle Beschlagnahmung"
 desc_rip_plc_confessional_coercion:0 "Die Schließung umstrittener orthodoxer Kirchen treibt Bekehrungen voran, vergiftet jedoch das Verhältnis zu östlichen Höfen."
 rip_plc_municipal_confession_peace:0 "Städtischer Bekenntnisfrieden in Ruthenien"
 desc_rip_plc_municipal_confession_peace:0 "Bruderschaftsschulen und offene Pfarrkirchen beruhigen die Zünfte auf Kosten langsamerer Missionierung."
 rip_rus_imperial_uniformity:0 "Synodale Druck- und Kanzleieinheit"
 desc_rip_rus_imperial_uniformity:0 "Vorgeschriebene Synodenkorrektur verdrängt eigenständige ruthenische Drucke und hemmt die Übernahme neuer Lehren."
 rip_rus_ruthenian_charters_spared:0 "Bewahrte Akademiedruck-Privilegien"
 desc_rip_rus_ruthenian_charters_spared:0 "Offene Druckereien in Kiew und Tschernigow verbreiten Gelehrsamkeit rasch über die Reichseparchien."
 rip_cri_slave_mart_infamy:0 "Verrufene Gefangenenmärkte"
 desc_rip_cri_slave_mart_infamy:0 "Ausgeweitete Beutezüge bereichern die Reiter, machen aber verlässliche Verträge mit christlichen Höfen nahezu unmöglich."
 rip_cri_reformed_tamga:0 "Beeidete Salz- und Karawanen-Tamga"
 desc_rip_cri_reformed_tamga:0 "Begrenzte Gefangenenmärkte zugunsten fester Salz- und Pelzzölle heben das Ansehen auf Kosten der Kriegsbeute."
 rip_tur_reckoning.1.t:0 "Kommissare für den Yasyr-Hafenzoll"
 rip_tur_reckoning.1.d:0 "Gefangenenkolonnen vom Dnepr und aus Podolien ziehen durch Perekop zu den Häfen von Kaffa und Otschakiw. Finanzschreiber verlangen das Fünftel des Sultans für Galeeren und Kasse, während Makler einen geregelten Loskauf vorschlagen."
 rip_tur_reckoning.1.a:0 "Das Fünftel des Sultans für Kasse und Flotte einziehen."
 rip_tur_reckoning.1.result_tt:0 "Ermöglicht Galeerenunruhen; nach 180 Tagen Schwarzmeer-Pentschiksteuer für 15 Jahre sowie Unruhe und Verwüstung in Kaffa und Jedisan."
 rip_tur_reckoning.1.b:0 "Die Hafenabgabe auf Lösegeldvermittlung beschränken."
 rip_tur_reckoning.2.t:0 "Ruderer in den Arsenalen"
 rip_tur_reckoning.2.d:0 "Berichte über überfüllte Gefangenenhöfe und gekettete Ruderer dringen bis an nördliche Höfe und schüren Unruhe in den Hafenstädten."
 rip_tur_reckoning.2.a:0 "Die Werftwachen verdoppeln."
 rip_tur_reckoning.3.t:0 "Kirchen der podolischen Städte"
 rip_tur_reckoning.3.d:0 "Nach dem Einmarsch in Podolien fordern Prediger die Umwandlung der Hauptkirchen in Moscheen. Die Städter berufen sich auf bestehende Dhimma-Schutzbriefe."
 rip_tur_reckoning.3.a:0 "Die Kirchen einziehen und Moscheen übereignen."
 rip_tur_reckoning.3.result_tt:0 "Nach 150 Tagen erleidet eine christliche Provinz in Podolien oder Ruthenien 20 Verwüstung, 6 Unruhe und Eingezogene Kirchengüter sowie für 15 Jahre Strenge Eyâlet-Herrschaft."
 rip_tur_reckoning.3.b:0 "Den Dhimma-Schutz für diese Pfarreien bestätigen."
 rip_tur_reckoning.4.t:0 "Erbitterte Bürger unter neuen Minaretten"
 rip_tur_reckoning.4.d:0 "Glocken wurden eingeschmolzen und Klöster an Spahis vergeben, doch christliche Bürger schließen Läden und entweichen nach Norden."
 rip_tur_reckoning.4.a:0 "Wachen an die Stadttore stellen."
 rip_tur_reckoning.5.t:0 "Verschärfung der Knabenlese"
 rip_tur_reckoning.5.d:0 "Rekrutierungsoffiziere fordern Vollmacht, Ausnahmen und Schutzbriefe für Einzelsöhne zu übergehen, um die Janitscharenkasernen rasch zu füllen. Dorfälteste bitten um Ablösung in Geld."
 rip_tur_reckoning.5.a:0 "Ausnahmen übergehen und die volle Aushebung fordern."
 rip_tur_reckoning.5.result_tt:0 "Nach 180 Tagen verliert eine christliche Provinz 1 Grundrekruten (oder erleidet 20 Verwüstung) und erhält 5 Unruhe, während die Pforte Strenge Knabenaushebung für 15 Jahre bekommt."
 rip_tur_reckoning.5.b:0 "Stattdessen Silberablösung der Dörfer annehmen."
 rip_tur_reckoning.6.t:0 "Leere Höfe nach Abzug der Werber"
 rip_tur_reckoning.6.d:0 "Junge Bauern sind vor den Werbern in Wälder und über Grenzen geflohen; zurück bleiben lückenhafte Steuerregister."
 rip_tur_reckoning.6.a:0 "Die Ausgehobenen den Ausbildungskompanien überstellen."
 rip_tur_reckoning.7.t:0 "Deportationslisten des Sürgün"
 rip_tur_reckoning.7.d:0 "Der Diwan erwägt, ganze Handwerkerviertel von Griechen, Armeniern, Slawen und Juden zwangsweise nach Konstantinopel und in Grenzfestungen umzusiedeln."
 rip_tur_reckoning.7.a:0 "Die Sürgün-Zwangszüge in Marsch setzen."
 rip_tur_reckoning.7.result_tt:0 "Nach 180 Tagen erleiden zwei nichttürkische Provinzen 20 Verwüstung, 5 Unruhe und Entwurzelte Handwerkerviertel für 15 Jahre samt Kaiserlichen Sürgün-Erlassen."
 rip_tur_reckoning.7.b:0 "Stattdessen freiwillige Steuerfreibriefe anbieten."
 rip_tur_reckoning.8.t:0 "Stille Webstühle hinter den Zügen"
 rip_tur_reckoning.8.d:0 "Am Goldenen Horn entstehen neue Werkstätten, doch die Herkunftsstädte der Ausgesiedelten verfallen in dumpfen Groll."
 rip_tur_reckoning.8.a:0 "Die umgesiedelten Zünfte in Konstantinopel eintragen."
 rip_tur_reckoning.9.t:0 "Die Frage der Befriedung Anatoliens"
 rip_tur_reckoning.9.d:0 "Abgedankte Musketiere und Celâlî-Haufen lähmen Anatoliens Straßen. Feldherren fordern gnadenlose Kollektivstrafen, während Kadis vor dauerhaft verödeten Steuertälern warnen."
 rip_tur_reckoning.9.a:0 "Strafkolonnen und Kollektivstrafen verhängen."
 rip_tur_reckoning.9.result_tt:0 "Nach 150 Tagen erleiden zwei anatolische Provinzen 30 Verwüstung und Bauernflucht der Wirren für 15 Jahre samt Eiserner Hand in Anatolien."
 rip_tur_reckoning.9.b:0 "Eine Amnestie verkünden und ländliche Abgaben senken."
 rip_tur_reckoning.10.t:0 "Verschüttete Brunnen und verlassene Dörfer"
 rip_tur_reckoning.10.d:0 "Die Aufständischen sind zerschlagen, doch die große Flucht hat ganze Landstriche Anatoliens entvölkert."
 rip_tur_reckoning.10.a:0 "Den Restbestand in den Steuerbüchern erfassen."
 rip_tur_reckoning.11.t:0 "Sonderabgaben an den Donaugrenzen"
 rip_tur_reckoning.11.d:0 "Kriegskommissare fordern von Moldau, Walachei und Jedisan Kornwagen, Herden und Silber weit über die beschworenen Tributrollen hinaus."
 rip_tur_reckoning.11.a:0 "Die doppelte Lieferung unverzüglich eintreiben."
 rip_tur_reckoning.11.result_tt:0 "Nach 180 Tagen steigt das Freiheitsstreben von Moldau, Walachei und ruthenischen Vasallen um 25, eine Provinz erleidet 25 Verwüstung und 5 Unruhe, und die Pforte erhält Außerordentliche Donau-Abgaben."
 rip_tur_reckoning.11.b:0 "Beim festgeschriebenen Friedenstatut bleiben."
 rip_tur_reckoning.12.t:0 "Groll an den Vasallenhöfen"
 rip_tur_reckoning.12.d:0 "Die Proviantwagen rollen gen Süden, während moldauische Bojaren heimlich Gesandte nach Norden um Schutzbriefe schicken."
 rip_tur_reckoning.12.a:0 "Die Flussübergänge scharf bewachen lassen."
 rip_tur_reckoning.13.t:0 "Verbrannte Städte am Rechten Ufer"
 rip_tur_reckoning.13.d:0 "Unbesoldete Hilfstruppen und Taktik der verbrannten Erde legen Städte in Podolien und am Rechten Ufer in Asche und lösen Aufstände aus."
 rip_tur_reckoning.13.a:0 "Nur die Steinzitadellen halten und das Umland preisgeben."
 rip_tur_reckoning.13.b:0 "Silber auszahlen, um die Plünderer zu zügeln."
 rip_tur_reckoning.14.t:0 "Asche zwischen Dnestr und Dnepr"
 rip_tur_reckoning.14.d:0 "Vor dem Winter haben Besatzungen alle Scheunen geleert und die verbliebenen Bauern in Aufstandsbanden getrieben."
 rip_tur_reckoning.14.a:0 "Pferde und Pulver ohne Rücksicht einziehen."
 rip_tur_reckoning.14.b:0 "Notkorn auf Flusskähnen heranschaffen."
 rip_tur_reckoning.15.t:0 "Grenzordnung wiederhergestellt"
 rip_tur_reckoning.15.d:0 "Die schwersten Verwüstungen am Dnestr und Dnepr klingen ab, doch verfallene Gehöfte zeugen noch lange von den Jahren der Ruina."
 rip_tur_reckoning.15.a:0 "Die befriedeten Bezirke im Register vermerken."
 rip_tur_reckoning.16.t:0 "Meuterei der Ruderer auf den Galeeren"
 rip_tur_reckoning.16.d:0 "Verschleppte ruthenische und Grenzgänger-Ruderer bemächtigen sich auf vertäuten Galeeren der Werkzeuge und setzen Schiffe in Brand."
 rip_tur_reckoning.16.a:0 "Die Ruderdecks mit Musketen räumen lassen."
 rip_tur_reckoning.16.b:0 "Zwangsrekrutierte durch besoldete Ruderer ersetzen."
 rip_tur_reckoning.17.t:0 "Ausbrüche aus den Schwarzmeer-Werften"
 rip_tur_reckoning.17.d:0 "Ganze Rudermannschaften haben auf See ihre Ketten gesprengt oder die Flucht über Fischerboote ergriffen."
 rip_tur_reckoning.17.a:0 "Hafenarbeiter auf die Ruderbänke pressen."
 rip_tur_reckoning.17.b:0 "Prämien für freie Küstenruderer ausloben."
 rip_tur_reckoning.18.t:0 "Ruhe kehrt auf den Galeeren ein"
 rip_tur_reckoning.18.d:0 "Nach schweren Verlusten an Ruderern und Schiffsrümpfen kehrt unter strengerer Wache Ordnung in die Werften zurück."
 rip_tur_reckoning.18.a:0 "Die verbliebenen Schiffe ausbessern."
 rip_plc_reckoning.1.t:0 "Frondienste auf den Flussgütern"
 rip_plc_reckoning.1.d:0 "Große Gutspächter an Bug, Dnestr und Dnepr verlangen fünf Tage wöchentlicher Fron für die Ostseekähne. Kronkommissare melden verlassene Dörfer und Brandstiftung."
 rip_plc_reckoning.1.a:0 "Das Fünf-Tage-Recht der Grundherren bestätigen."
 rip_plc_reckoning.1.result_tt:0 "Erhöht Krisengefahr; nach 180 Tagen erhält eine ruthenische Provinz 6 Unruhe und Ausgepowerte Frongüter für 20 Jahre samt Zweiter Leibeigenschaft."
 rip_plc_reckoning.1.b:0 "Den Gütern eine königliche Obergrenze setzen."
 rip_plc_reckoning.2.t:0 "Nächtliche Brände an den Speichern"
 rip_plc_reckoning.2.d:0 "Die Getreidekähne fahren beladen nach Danzig, doch dahinter fordern Pächter Dragoner zur Jagd auf entflohene Bauern."
 rip_plc_reckoning.2.a:0 "Die Klagen der Gutsherren verzeichnen."
 rip_plc_reckoning.3.t:0 "Abschaffung der Kosakenämter"
 rip_plc_reckoning.3.d:0 "Nach Grenzgefechten fordern Landboten im Sejm, die Kosakenfreiheiten aufzuheben, das Register zu stutzen und Ausgestrichene den Grundherren auszuliefern."
 rip_plc_reckoning.3.a:0 "Die Sejm-Verordnung erlassen und Adlige einsetzen."
 rip_plc_reckoning.3.result_tt:0 "Erhöht Krisengefahr; nach 150 Tagen verlieren Kosaken 25 Loyalität, eine Provinz erleidet 8 Unruhe und 15 Verwüstung samt Aufhebung der Kosaken-Ämter."
 rip_plc_reckoning.3.b:0 "Gewählte Obersten und Soldlisten belassen."
 rip_plc_reckoning.4.t:0 "Geheime Räte unterhalb der Stromschnellen"
 rip_plc_reckoning.4.d:0 "Aus den Registern gestrichene Veteranen reiten mit versteckten Fahnen nach Saporoschje und schwören Rache im Frühjahr."
 rip_plc_reckoning.4.a:0 "Die Flussfestungen verstärken."
 rip_plc_reckoning.5.t:0 "Verschlossene Türen ruthenischer Pfarreien"
 rip_plc_reckoning.5.d:0 "Königliche Vögte stehen vor orthodoxen Kirchen und Bruderschaftsdruckereien bereit, um Güter widerspenstiger Gemeinden einzuziehen."
 rip_plc_reckoning.5.a:0 "Die Beschlagnahmen vollstrecken und Kirchen siegeln."
 rip_plc_reckoning.5.result_tt:0 "Nach 180 Tagen erhält eine orthodoxe ruthenische Provinz 6 Unruhe und Versiegelte orthodoxe Kirchen für 15 Jahre samt Konfessioneller Beschlagnahmung."
 rip_plc_reckoning.5.b:0 "Städtischen Konfessionsfrieden verkünden."
 rip_plc_reckoning.6.t:0 "Menschenmengen vor dem versiegelten Schiff"
 rip_plc_reckoning.6.d:0 "Pfarrkinder verjagen Pächter und richten Bittschriften an orthodoxe Höfe jenseits der Ostgrenze."
 rip_plc_reckoning.6.a:0 "Die Stadtvögte einbestellen."
 rip_plc_reckoning.7.t:0 "Beginn der Blutigen Befriedung"
 rip_plc_reckoning.7.d:0 "Bewaffnete Adlige und Dragoner ziehen durch ruthenische Dörfer, brennen Höfe nieder und treiben Zwangsquartiere ein. Bauern und Städter greifen zu Sensen und Musketen."
 rip_plc_reckoning.7.a:0 "Den Strafkommandos freie Hand lassen."
 rip_plc_reckoning.7.b:0 "Die Truppen stoppen und Stadtgerichte wiederherstellen."
 rip_plc_reckoning.8.t:0 "Privattruppen der Magnaten in den Dörfern"
 rip_plc_reckoning.8.d:0 "Schlossknechte treiben Rückstände mit dem Säbel ein, während königliche Gesandte vor einem allgemeinen Aufstand warnen."
 rip_plc_reckoning.8.a:0 "Die Einziehungen für die Kasse fortsetzen."
 rip_plc_reckoning.8.b:0 "Königliche Richter zu den Dörfern entsenden."
 rip_plc_reckoning.9.t:0 "Waffenruhe in den Ostwoiwodschaften"
 rip_plc_reckoning.9.d:0 "Die Truppen ziehen in die Winterquartiere ab und hinterlassen verbrannte Güter und misstrauische Dörfer."
 rip_plc_reckoning.9.a:0 "Die Ruhe vor dem Sejm bestätigen."
 rip_rus_reckoning.1.t:0 "Zensoren für die Kiewer Druckereien"
 rip_rus_reckoning.1.d:0 "Synodenzensoren klagen, dass Druckereien in Kiew und Tschernigow Fibeln und Bücher in eigener ruthenischer Sprache drucken. Ein Ukas würde jede Presse Petersburg unterstellen."
 rip_rus_reckoning.1.a:0 "Synodenzensur verhängen und Druckstöcke siegeln."
 rip_rus_reckoning.1.result_tt:0 "Beschleunigt die Hetmanat-Krise; nach 180 Tagen erleidet Kiew (oder Tschernigow) 6 Unruhe und Versiegelte Kiewer Druckpressen für 20 Jahre samt Synodaler Druckeinheit."
 rip_rus_reckoning.1.b:0 "Die Druckprivilegien der Akademie unangetastet lassen."
 rip_rus_reckoning.2.t:0 "Die Letternkästen des Höhlenklosters versiegelt"
 rip_rus_reckoning.2.d:0 "Letternkisten und Handschriften wandern in die Kanzlei des Gouverneurs, begleitet vom Unmut der Studenten und Bürger Kiews."
 rip_rus_reckoning.2.a:0 "Das Zensurverzeichnis ablegen."
 rip_rus_reckoning.3.t:0 "Auflösung von Hetmanat und Sitsch"
 rip_rus_reckoning.3.d:0 "Kaiserliche Regimenter besetzen die Regimentsstädte und rücken zu den Dnepr-Stromschnellen vor, um die Sitsch aufzulösen und freie Kosaken in Gouvernementsrollen zu pressen."
 rip_rus_reckoning.3.a:0 "Die Regimentsrechte aufheben und die Sitsch schleifen."
 rip_rus_reckoning.3.b:0 "Den Ukas durch weitgehende Ortsautonomie abmildern."
 rip_rus_reckoning.4.t:0 "Kanalfronen und Flucht der Kosaken"
 rip_rus_reckoning.4.d:0 "Nach Norden zu Kanalarbeiten abkommandierte Kosaken erliegen dem Fieber, während ganze Familien über die Grenze entweichen."
 rip_rus_reckoning.4.a:0 "Die Kanalaushebungen trotz Verlusten fortsetzen."
 rip_rus_reckoning.4.b:0 "Entschädigung zahlen und die Grenzleute entlassen."
 rip_rus_reckoning.5.t:0 "Stille Grenze unter Gouverneursverwaltung"
 rip_rus_reckoning.5.d:0 "Der offene Widerstand am Linken Ufer und in Saporoschje verebbt; alte Kosakenrollen wandern ins Archiv, während Steuerämter öffnen."
 rip_rus_reckoning.5.a:0 "Das Grenzregister schließen."
 rip_cri_reckoning.1.t:0 "Händler von Kaffa und Perekop"
 rip_cri_reckoning.1.d:0 "Aus dem Norden heimkehrende Mirzas fordern Steuererleichterungen für größere Gefangenenhöfe bei Kaffa und Perekop. Karawanen-Beys warnen vor verödeten Nachbartälern und Gegenschlägen."
 rip_cri_reckoning.1.a:0 "Die Marktzölle senken und die Höfe ausbauen."
 rip_cri_reckoning.1.result_tt:0 "Beschleunigt die Entvölkerungskrise; nach 180 Tagen Verrufene Gefangenenmärkte für 15 Jahre, während Kaffa (oder Krim) 4 Unruhe und 15 Verwüstung erleidet."
 rip_cri_reckoning.1.b:0 "Den Gefangenenhandel durch feste Karawanenzölle eindämmen."
 rip_cri_reckoning.2.t:0 "Vergeltung jenseits der Furten"
 rip_cri_reckoning.2.d:0 "Überfüllte Versteigerungen füllen die Taschen der Mirzas, doch Tschaikenflotten und Gesandtschaften prangern das Khanat allerorten an."
 rip_cri_reckoning.2.a:0 "Wachposten entlang der Nehrung aufstellen."
 rip_cri_reckoning.3.t:0 "Leere Weiden und Seuche in den Höfen"
 rip_cri_reckoning.3.d:0 "Benachbarte Bezirke in Podolien und am Dnepr sind für regelmäßige Salzkarawanen zu verödet, während in überfüllten Küstenhöfen Fieber ausbricht."
 rip_cri_reckoning.3.a:0 "Die befallenen Viertel abriegeln und Herden verteilen."
 rip_cri_reckoning.3.b:0 "Die Höfe für diplomatischen Loskauf öffnen."
 rip_cri_reckoning.4.t:0 "Küstenüberfälle und ausgebliebene Karawanen"
 rip_cri_reckoning.4.d:0 "Bewaffnete Boote überfallen im Nebel die Reeden der Krim zur Gefangenenbefreiung, während Salzzölle weiter verfallen."
 rip_cri_reckoning.4.a:0 "Küstenschanzen aus der Schatzkammer erneuern."
 rip_cri_reckoning.4.b:0 "Reiter zur Weidesicherung von den Häfen abziehen."
 rip_cri_reckoning.5.t:0 "Salzkarawanen kehren nach Perekop zurück"
 rip_cri_reckoning.5.d:0 "Nach Abklingen der Seuche und Rückkehr zu geregelten Zöllen wagen sich wieder Kaufleute über den Damm von Perekop."
 rip_cri_reckoning.5.a:0 "Das Zollhaus von Perekop wieder öffnen."
