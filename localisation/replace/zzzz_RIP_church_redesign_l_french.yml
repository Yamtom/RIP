 desc_rip_church_gc_usury:0 "This adjustment no longer exists. It has no effect and is cleared automatically."
 desc_rip_church_icon_building:0 "§YChurch Building§!\nParishes that still have no cathedral: §G-25% construction cost§! there, for every building and not only churches. A temple or cathedral is what a mission node needs.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep."
 desc_rip_church_icon_mercy:0 "§YMercy§!\nThe eastern lands, the Volga, the Urals and Siberia: §G-10% local autonomy§! and §G-1 local unrest§! in your provinces there, whatever their faith.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep."
 desc_rip_church_icon_mission:0 "§YApostolic Mission§!\nSettled provinces of another faith, Orthodox ones excluded: §G+2% local missionary strength§!. It opens the funding of mission nodes, which pay Fervor; closing it closes every node. It needs §Y20 Fervor§! in the pool: 10 to start it and 10 to found the first node.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep."
 desc_rip_church_icon_war:0 "§YMilitary Intercession§!\nSteppe border: your provinces on steppe or grassland, or beside a steppe power, gain §G+20% defensiveness§! and §G+1 attrition§! for invaders.\nAt war with a steppe power: §G+5% discipline§! and §G+10% manpower recovery§!, applied within a month of the war.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep."
 desc_rip_church_icon_war_steppe:0 "The church blesses a war against a steppe power: discipline and manpower recovery rise while it lasts."
 desc_rip_church_node_courtyards:0 "Monasteries trade in this trade node: more trade power here and more preachers, while the node is funded."
 desc_rip_church_preaching:0 "The Mission policy strengthens the missionaries working in this province."
 desc_rip_church_reconciliation_unrest:0 "An adjustment belonging to the current church settlement; its effects end or change when its conditions cease to apply."
 desc_rip_church_rite:0 "Our Greek Catholic government guarantees this community's rite and clergy. The province keeps its faith; it is not converted and does not enter the Union. Binding for at least 10 years.\nGameplay abstraction: not an exact canonical status, and not voluntary Union acceptance. The tax and manpower reductions are a game-design interpretation of the administrative compromise of protecting local arrangements and autonomy, not a penalty for another faith and not a documented historical formula."
 desc_rip_church_rite_ecumenical:0 "The ecumenical settlement deepens the guarantee: -1 unrest instead of -0.5, and the tax and levy penalties of the guarantee shrink by 5 points each. Replaces the protected local tradition."
 desc_rip_church_rite_favoured:0 "The guarantee of community rights also protects local tradition: a further -0.5 unrest. Replaced by the ecumenical accommodation once the ecumenical settlement is concluded; the two never stack."
 desc_rip_church_rite_revoked:0 "The guarantee of community rights was revoked: +3 unrest for ten years."
