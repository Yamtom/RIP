 # DECISIONS
 
 convert_to_russian_orthodox_decision_title:0 "Adopt the Muscovite Church Settlement"
 convert_to_russian_orthodox_decision_desc:0 "Place our church under the Muscovite model of centralized authority. This is an institutional choice, not automatic adherence to a separate dogmatic confession or a universal Third Rome claim."
 
 establish_moscow_patriarchate_decision_title:0 "Establish Moscow Patriarchate"
 establish_moscow_patriarchate_decision_desc:0 "We can establish an independent Patriarchate in Moscow, asserting our religious autonomy."
 
 russification_campaign_decision_title:0 "Launch Russification Campaign"
 russification_campaign_decision_desc:0 "We can systematically Russify non-Russian peoples in our empire."
 
 establish_orthodox_inquisition_decision_title:0 "Establish Orthodox Inquisition"
 establish_orthodox_inquisition_decision_desc:0 "We can create inquisitorial courts to enforce religious conformity."
 
 gathering_russian_lands_decision_title:0 "Gathering of Russian Lands"
 gathering_russian_lands_decision_desc:0 "We can pursue unification of all Russian territories under our rule."
 
 establish_symphonia_decision_title:0 "Establish Symphonia of Powers"
 establish_symphonia_decision_desc:0 "We can create harmonious unity of church and state authority."
 
 proclaim_orthodox_empire_decision_title:0 "Proclaim Orthodox Empire"
 proclaim_orthodox_empire_decision_desc:0 "We can formally proclaim our empire as the Orthodox Empire, leader of true faith."
 
 force_convert_province_decision_title:0 "Protect a Provincial Mission"
 force_convert_province_decision_desc:0 "Spend 50 administrative power to support missionary work in one eligible province. The mission gains local missionary strength but provokes unrest and raises autonomy. It does not convert the province immediately."
 
 russify_province_decision_title:0 "Endow a Settlement Office"
 russify_province_decision_desc:0 "Spend 50 diplomatic power on a settlement office in one eligible province. The office reduces the local cost of ordinary culture conversion for twenty years but causes unrest. The province retains its culture until the normal conversion is completed."
 



 # --- Raskol: where the Old Believers went ---
 russian_orthodox.16.t:0 "The Slobodas of Starodub"
 russian_orthodox.16.d:0 "They come up the roads in families, with their two-fingered cross and their old books, and they ask for waste ground and leave to keep their own rite. Moscow calls them raskolniki and wants them back. They are joiners, smiths and traders, and they pay in coin rather than in labour dues. Whatever we grant them, the settlements will be counted on the far side of the border as our doing."
 russian_orthodox.16.a:0 "Let them break the waste ground"
 russian_orthodox.16.b:0 "Send them back over the border"

 russian_orthodox.17.t:0 "Old Believers at the Sich"
 russian_orthodox.17.d:0 "A party of them has come down to the Kish and asked to be written into the register. They will not cross themselves as the patriarch now orders, and they say plainly that they came here because no one below the rapids asks them to. The Kosh Otaman has heard stranger petitions and granted them. Whether the priests of Kyiv will hear it that way is another matter."
 russian_orthodox.17.a:0 "Write them into a kurin"
 russian_orthodox.17.b:0 "The Host keeps one rite"

 old_believer_slobodas:0 "Old Believer Slobodas"
 desc_old_believer_slobodas:0 "Dissenter families work waste ground here, exempt from labour dues and answering to their own elders rather than to the parish."
 raskolnik_refugees:0 "Raskolnik Refugees"
 desc_raskolnik_refugees:0 "Craftsmen and traders who left Muscovy over the old rite. Their skills are ours; so is Moscow's displeasure."
 surrendered_the_raskolniki:0 "The Dissenters Handed Back"
 desc_surrendered_the_raskolniki:0 "We returned the Old Believers to the Tsar's officers. The border is quieter, and the villages that watched it are not."
 sich_raskolnik_kurin:0 "Raskolnik Kurin"
 desc_sich_raskolnik_kurin:0 "A kurin of Old Believers keeps the old rite below the rapids and answers the muster like any other."
