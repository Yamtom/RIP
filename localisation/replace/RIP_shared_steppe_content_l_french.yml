 south_ukraine_codify_frontier_desc:0 "After consolidating the late southern reforms, issue statutes that standardize patrol duties, settlement rights, and border obligations across the marches."
 south_ukraine_codify_frontier_title:0 "Codify the Steppe Frontier"
 south_ukraine_enable_process_cri_desc:0 "Assume direct khanate oversight over the settlement of the Southern Ukraine steppe across Crimea's marches."
 south_ukraine_enable_process_cri_title:0 "Enable Crimean Southern Process"
 south_ukraine_enable_process_mol_desc:0 "Assume direct sovereign direction over the settlement of the Southern Ukraine steppe along Moldavia's frontier."
 south_ukraine_enable_process_mol_title:0 "Enable Moldavian Southern Process"
 south_ukraine_grain_exchange_desc:0 "Once the maritime route is secured, charter an exchange that unifies grain contracts, convoy insurance, and market prices for the southern ports."
 south_ukraine_grain_exchange_title:0 "Establish a Black Sea Grain Exchange"
 south_ukraine_history.1.a:0 "Build the watchlines"
 south_ukraine_history.1.b:0 "Rely on mobile patrols"
 south_ukraine_history.1.d:0 "Raiders probe the lower Dnieper marches. Veteran scouts urge the construction of watch posts and beacon lines, while others argue for mobile patrols instead of fixed forts."
 south_ukraine_history.1.t:0 "Frontier Watchlines"
 south_ukraine_history.10.a:0 "Charter the port"
 south_ukraine_history.10.b:0 "Strengthen the interior"
 south_ukraine_history.10.d:0 "Surveyors propose a new port on the northern Black Sea coast to channel trade and shipbuilding. The charter would require heavy investment."
 south_ukraine_history.10.t:0 "New Port Foundations"
 south_ukraine_history.11.a:0 "Launch settlement drives"
 south_ukraine_history.11.b:0 "Hold to existing estates"
 south_ukraine_history.11.d:0 "Empty tracts along the steppe invite settlement. Offering charters and supplies could raise new towns and fields, while restraint preserves the old order."
 south_ukraine_history.11.t:0 "Steppe Colonization Drives"
 south_ukraine_history.12.a:0 "Centralize the frontier"
 south_ukraine_history.12.b:0 "Preserve frontier liberties"
 south_ukraine_history.12.d:0 "Administrators argue that the southern marches must be brought under tighter imperial regulation. Others warn that heavy hands could shatter frontier loyalty."
 south_ukraine_history.12.t:0 "Imperial Frontier Reform"
 south_ukraine_history.2.a:0 "Sponsor the caravans"
 south_ukraine_history.2.b:0 "Tax their wagons"
 south_ukraine_history.2.d:0 "Salt and grain caravans drift between the steppe wells and the Black Sea estuaries. Sponsoring the Chumak routes could strengthen southern trade, but taxing them promises fast revenue."
 south_ukraine_history.2.t:0 "Chumak Caravans"
 south_ukraine_history.3.a:0 "Sign a compact"
 south_ukraine_history.3.b:0 "Defy the demands"
 south_ukraine_history.3.d:0 "Steppe intermediaries offer escorts and safe conduct in exchange for tribute and market access. Accepting could steady the border, but at the price of pride and coin."
 south_ukraine_history.3.t:0 "Steppe Protection Compact"
 south_ukraine_history.4.a:0 "Set the registers"
 south_ukraine_history.4.b:0 "Keep the host free"
 south_ukraine_history.4.d:0 "Frontier captains demand that their service be recognized through formal registers. A disciplined host promises reliability, yet free riders claim their autonomy is the lifeblood of the steppe."
 south_ukraine_history.4.t:0 "Cossack Registers"
 south_ukraine_history.5.a:0 "Grant the charters"
 south_ukraine_history.5.b:0 "Refuse their demands"
 south_ukraine_history.5.d:0 "New settlements seek charters that grant tax freedom and self-government in return for clearing the steppe. These charters would anchor our southern colonies."
 south_ukraine_history.5.t:0 "Sloboda Charters"
 south_ukraine_history.6.a:0 "Let the raiders sail"
 south_ukraine_history.6.b:0 "Protect commerce instead"
 south_ukraine_history.6.d:0 "Swift chaiky and light galleys tempt our captains to raid the Black Sea. Raids promise fame, but safe trade could yield steadier profit."
 south_ukraine_history.6.t:0 "Chaiky on the Black Sea"
 south_ukraine_history.7.a:0 "Grant the charter"
 south_ukraine_history.7.b:0 "Centralize the frontier"
 south_ukraine_history.7.d:0 "The Zaporozhian host demands a charter securing its rights and frontier privileges. Granting autonomy may calm the steppe, while centralization promises tighter control."
 south_ukraine_history.7.t:0 "Zaporozhian Autonomy Charter"
 south_ukraine_history.8.a:0 "Fund recovery"
 south_ukraine_history.8.b:0 "Let local lords rebuild"
 south_ukraine_history.8.d:0 "War and turmoil have scarred the southern marches. Officials seek funds to repair stockades and restore markets, but local lords offer to handle matters on their own terms."
 south_ukraine_history.8.t:0 "Frontier Recovery"
 south_ukraine_history.9.a:0 "Invest in the corridor"
 south_ukraine_history.9.b:0 "Focus inland"
 south_ukraine_history.9.d:0 "Merchants press for river depots and convoy escorts to move grain from the steppe to the Black Sea. Building the corridor could strengthen our trade position."
 south_ukraine_history.9.t:0 "Black Sea Grain Corridor"
 south_watchlines:0 "Frontier Watchlines"
 spring_raid_season:0 "Spring Raiding Season"
 steppe_alliance:0 "Steppe Alliance"
 steppe_alliance_desc:0 "We have formed a military alliance with nomadic peoples."
 steppe_border_defense:0 "Border Fortifications"
 STEPPE_PRINCE:0 "Steppe Prince"
 STEPPE_PRINCESS:0 "Steppe Princess"
 STEPPE_PRINCIPALITY:0 "Steppe Principality"
 steppe_raid.1.a:0 "To horse! The steppe calls for plunder!"
 steppe_raid.1.b:0 "Our warriors must remain at home this year."
 steppe_raid.1.d:0 "The tribes grow restless, and our warriors yearn for glory and plunder. Our scouts report that the sedentary kingdoms to the north are ripe for raiding. Their fields are full of grain, their towns hold treasures, and most importantly - their people can be taken as yasyr, captives to be sold in the slave markets of Kaffa and Constantinople.\n\nA successful raid would bring wealth to our people, strengthen the loyalty of our warriors, and remind our neighbors of the power of the steppe. However, organizing such an expedition requires resources and manpower, and there is always risk that our enemies may have prepared defenses."
 steppe_raid.1.t:0 "Organize Raiding Party"
 steppe_raid.10.a:0 "Begin construction of the Great Abatis Line!"
 steppe_raid.10.b:0 "The cost is too great for now."
 steppe_raid.10.d:0 "For generations, our southern borderlands have suffered from devastating raids by the Crimean Tatars and other steppe nomads. Thousands of our people have been taken as yasyr, countless villages burned, and vast areas left desolate.\n\nOur military advisors propose an ambitious solution: the Zasechnaya Cherta, a massive defensive line running hundreds of miles along our southern frontier. This system would consist of fortified towns, wooden palisades, earth ramparts, and most importantly - zaseki, zones of felled trees creating impenetrable barriers to cavalry.\n\nWatchtowers manned year-round would provide early warning of raids, while garrison troops and service-class cavalry could respond quickly to incursions. This would be an enormous undertaking requiring significant investment, but it could finally secure our southern frontier."
 steppe_raid.10.t:0 "Zasechnaya Cherta - The Great Abatis Line"
 steppe_raid.2.a:0 "Mobilize all available forces! Protect our people!"
 steppe_raid.2.b:0 "God help us... we cannot stop them."
 steppe_raid.2.d:0 "Riders bearing grim tidings have arrived from our borderlands. A massive raiding party of [From.GetAdjective] horsemen has been sighted crossing into our territory. The nomads move swiftly, their light cavalry outpacing our defenders.\n\nThey strike at farms and villages, taking livestock, goods, and most horrifyingly - our people as captives, or 'yasyr' as they call them. These unfortunate souls will be dragged to distant slave markets unless we act decisively.\n\nWe can marshal troops to defend the border, though this will cost us precious military resources. Or we may be forced to accept the devastation and work to rebuild afterwards."
 steppe_raid.2.t:0 "Steppe Raiders Approach"
 steppe_raid.3.a:0 "A setback, but we shall return stronger."
 steppe_raid.3.d:0 "Our warriors returned with bitter news. The [From.GetAdjective] forces were prepared for our raid, with troops positioned along their borders and fortifications manned. After several skirmishes, our riders were forced to withdraw with little to show for their efforts.\n\nMany warriors fell in the fighting, and we return empty-handed. The tribes will grumble about this failure, and our enemies will gain confidence from having repelled our raid."
 steppe_raid.3.t:0 "Raid Repelled"
 steppe_raid.4.a:0 "Take the yasyr to the slave markets!"
 steppe_raid.4.b:0 "Offer to return them... for the right price."
 steppe_raid.4.d:0 "Our warriors return in triumph. The raid into [From.GetName] was a resounding success, as our horsemen struck deep into their territory, evading slow-moving levies and looting their richest settlements.\n\nThe plunder is substantial - livestock, goods, gold, and silver. But most valuable are the thousands of captives, the 'yasyr', that we have taken. These unfortunate [From.GetAdjective] peasants, townsfolk, and even some nobles will fetch high prices in the slave markets of Kaffa, Constantinople, and beyond.\n\nShall we sell them all immediately for profit, or hold some for ransom?"
 steppe_raid.4.t:0 "Successful Raid - The Yasyr"
 steppe_raid.5.a:0 "Pay the ransom. We must save our people."
 steppe_raid.5.b:0 "We cannot afford this. Their fate is sealed."
 steppe_raid.5.d:0 "Word has reached us from the [From.GetAdjective] raiders who struck our lands. They hold thousands of our people - men, women, and children - taken as yasyr during their raid. These captives are being held in camps on the steppe, awaiting sale to slave traders.\n\nThe raiders have sent envoys offering to return our people... for a substantial ransom. They demand gold and silver in exchange for releasing the captives. Many noble families are pleading for us to pay, desperate to recover their relatives. But the cost is steep, and some counsel that we cannot afford to reward these brigands.\n\nWhat shall we do?"
 steppe_raid.5.t:0 "Ransom the Captives"
 steppe_raid.6.a:0 "Go with our blessing, Cossacks!"
 steppe_raid.6.b:0 "No. We must not escalate this conflict."
 steppe_raid.6.d:0 "The Cossacks are enraged after [From.GetAdjective] raiders carried off so many of their kinsmen as yasyr, and the free Host refuses to let the affront stand. Their otamans have come before us demanding leave to launch a retaliatory strike.\n\nThey plan to raid deep into [From.GetName], striking back at the nomads with the same tactics used against us. The Cossacks excel at such lightning raids, and success could restore our prestige, though it will worsen our standing with the [From.GetAdjective] khan.\n\nWhat is our response?"
 steppe_raid.6.t:0 "Cossacks Demand Vengeance"
 steppe_raid.7.a:0 "Cossack dogs! This is not over!"
 steppe_raid.7.d:0 "Disaster has struck our borderlands, as [From.GetAdjective] Cossacks rode deep into our territory in a devastating revenge raid. Moving with astonishing speed, they burned settlements, seized livestock, and carried off captives of their own.\n\nShowing no mercy, the Cossacks claimed their blow as vengeance for our earlier raids and withdrew before our banners could intercept them. This humiliation will not be easily forgotten."
 steppe_raid.7.t:0 "Cossack Raiders Strike"
 steppe_raid.8.a:0 "Grant them lands. We welcome the Nogai!"
 steppe_raid.8.b:0 "We cannot accommodate so many refugees."
 steppe_raid.8.d:0 "The Nogai Horde, once a powerful confederation of Tatar clans, has been shattered by their enemies. Thousands of Nogai refugees - warriors, herders, and their families - have arrived at our borders seeking sanctuary.\n\nThe Nogai Tatars are renowned horsemen and warriors. If we grant them lands in our territories along the steppe frontier - in Kuban, Yedisan, or Budjak - they would serve as excellent border guards against future raids. Their cavalry could significantly strengthen our military capabilities.\n\nHowever, settling such a large nomadic population is not without risk. What shall we do?"
 steppe_raid.8.t:0 "Nogai Refugees Seek Shelter"
 steppe_raid.9.a:0 "Accept them as subjects of the Tsar."
 steppe_raid.9.b:0 "Refuse them - prepare for battle!"
 steppe_raid.9.d:0 "Strange tidings arrive from the eastern steppe. The Kalmyks, a Buddhist Oirat Mongol people, have migrated far westward from the pastures of Mongolia, fleeing wars with the Dzungar Khanate to reach our borders near the Caspian Sea and the lower Volga.\n\nBringing tens of thousands of riders and vast herds, they ask leave to settle along the Lower Volga as our subjects in exchange for protection and grazing rights. Their light cavalry would be a formidable addition to our armies, though if we refuse, they may seize the pastures by force."
 steppe_raid.9.t:0 "The Kalmyk Migration"
