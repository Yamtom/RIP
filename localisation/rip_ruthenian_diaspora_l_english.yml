l_english:
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_root_desc:0 "With our rivers and borders secured, our envoys and seafarers look beyond familiar shores. Through royal charters, ocean expeditions and accords with friendly crowns, Ruthenian burghers, Cossacks and parish priests carry our tongue and customs to distant continents, raising new realms across the seas."

 rip_colonize_canada_title:0 "Nova Volyn"
 rip_colonize_canada_desc:0 "Fur trappers, merchants and fishermen from our northern rivers have followed cold western waters into the New World, naming their timbered settlements and trading posts Nova Volyn after their ancestral woodlands."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"

 rip_colonize_canada_settlers_title:0 "Guests in Another's Colony"
 rip_colonize_canada_settlers_desc:0 "Ruthenian craftsmen and trappers have taken passage to Canada aboard friendly foreign vessels, raising farmsteads and wooden chapels within another crown's dominion."

 rip_lysianskyi_circumnavigation_title:0 "A Ruthenian Circumnavigation"
 rip_lysianskyi_circumnavigation_desc:0 "From Black Sea yards and northern ports alike, our captains dare the open ocean. Following charts drawn in our admiralty halls, an expedition shall girdle the earth and carry the banner of Rus' home to our quays."

 rip_diaspora_usa_title:0 "Nova Rus"
 rip_diaspora_usa_desc:0 "Along the wooded bays and river mouths of the western Atlantic, Ruthenian settlers have cleared fields, built stone churches and raised a commonwealth worthy of the name Nova Rus."

 rip_diaspora_usa_settlers_title:0 "Guests Along the Seaboard"
 rip_diaspora_usa_settlers_desc:0 "Bearing royal letters of passage, Ruthenian families have found welcome along the eastern seaboard, carving homesteads and keeping their own tongue among an allied crown's colonists."

 rip_diaspora_south_america_title:0 "Nova Bratslavshchyna and Sribna Zemlia"
 rip_diaspora_south_america_desc:0 "South of the equator, amid sugar coasts and broad estuary plains, Ruthenian colonists have staked out orchards and river ports, christening their new lands Nova Bratslavshchyna and Sribna Zemlia."

 rip_diaspora_south_america_settlers_title:0 "Guests South of the Equator"
 rip_diaspora_south_america_settlers_desc:0 "Across southern waters, Ruthenian artisans and farmers have settled in Brazil and along the River Plate, preserving their parish brotherhoods under a friendly crown's protection."

 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_australia_desc:0 "Beyond the spice straits, sailors, pioneers and hardy steppe exiles have anchored upon the southern continent, naming their sunlit harbors Nova Tavriya in memory of the Pontic shore."

 rip_diaspora_australia_settlers_title:0 "Guests on the Southern Continent"
 rip_diaspora_australia_settlers_desc:0 "Across the distant southern ocean, Ruthenian mariners and settlers have struck roots alongside friendly colonists, building storehouses and tending flocks under another monarch's banner."

 rip_green_wedge_title:0 "The Green Wedge Breaks Away"
 rip_green_wedge_desc:0 "Caravans and river flotillas along the Amur have brought Ruthenian ploughmen, carpenters and Cossack scouts to the easternmost frontier. Settled amid verdant Manchurian valleys, the Green Wedge is ready for a charter of its own."

 rip_green_wedge_settlers_title:0 "Guests Beyond the Amur"
 rip_green_wedge_settlers_desc:0 "Under safe-conducts granted by friendly eastern courts, Ruthenian peasant households have crossed the Amur to till fertile valleys and raise timber churches in the Green Wedge without severing the land from its sovereign."

 rip_grey_wedge_title:0 "The Grey Wedge Breaks Away"
 rip_grey_wedge_desc:0 "On the wind-swept plains beyond the Volga and Ural rivers, sponsored settlements have taken hold along caravansaries and steppe streams. The crown may grant the Grey Wedge its own dependent government."

 rip_grey_wedge_settlers_title:0 "Guests on the Open Steppe"
 rip_grey_wedge_settlers_desc:0 "By accord with a friendly court, Ruthenian settlers have journeyed onto the open steppe of Central Asia, founding farmsteads and fairs without displacing the reigning ruler."

 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_of_rus_desc:0 "From the banks of the Amur to the harbors of the Silver River, Ruthenian speech is heard on distant shores. Some settlements answer to our governors directly, while others abide as kindred communities beneath friendly crowns."

 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"

 rip_diaspora_settlers_cooldown:0 "Settlers Under Way"
 desc_rip_diaspora_settlers_cooldown:0 "We have recently sent settlers abroad. The next household will need time to gather."

 # Settler decisions and their events (decisions/RIP_RuthenianDiaspora.txt,
 # events/RIP_RuthenianDiaspora.txt).
 rip_diaspora_colonial_settlers_title:0 "Offer Settlers to a Colony"
 rip_diaspora_colonial_settlers_desc:0 "Dispatch settlers under royal patronage to an eligible overseas province of a friendly colonial partner, establishing our culture within that holding while leaving ownership untouched. Shares a five-year cooldown with other settlement charters."

 rip_diaspora_colonial_settlers_faith_title:0 "Offer Settlers and the Faith"
 rip_diaspora_colonial_settlers_faith_desc:0 "Send settler households alongside priests and liturgical books to an eligible overseas province of a friendly colonial partner, planting both our culture and faith under its crown. Requires higher diplomatic trust, costs 1 stability and shares the five-year settler cooldown."

 rip_diaspora_mainland_settlers_title:0 "Offer Settlers Across the Border"
 rip_diaspora_mainland_settlers_desc:0 "Dispatch settlers by diplomatic agreement to an eligible province of a friendly partner in the Far East or Central Asia, establishing our culture while leaving ownership untouched. Shares a five-year cooldown with other settlement charters."

 rip_diaspora_mainland_settlers_faith_title:0 "Offer Settlers and the Faith Across the Border"
 rip_diaspora_mainland_settlers_faith_desc:0 "Send settler families and clergy by diplomatic agreement into an eligible province of a friendly partner in the Far East or Central Asia, planting our culture and faith while leaving ownership untouched. Requires higher diplomatic trust, costs 1 stability and shares the five-year cooldown."

 rip_diaspora.10.t:0 "Settlers Arrive"
 rip_diaspora.10.d:0 "After months at sea, our sponsored households have dropped anchor in a welcoming province of our colonial partner. Timber cabins and workshops already mark their quarter along the harbour, carrying Ruthenian speech and craft to a distant shore under friendly rule."
 rip_diaspora.10.a:0 "Let them settle"

 rip_diaspora.11.t:0 "Settlers Arrive With Their Priest"
 rip_diaspora.11.d:0 "Our sponsored households have landed alongside their parish priest, bringing Ruthenian speech and worship into a friendly colonial partner's province. A chapel bell now rings beside the harbour under our ally's banner."
 rip_diaspora.11.a:0 "Let them settle"

 rip_diaspora.12.t:0 "Settlers Cross the Border"
 rip_diaspora.12.d:0 "Carts and families have arrived safely in an allied eastern province along the Far Eastern frontier or the Central Asian steppe. Settlers now clear fields and keep their own custom beneath friendly sovereignty."
 rip_diaspora.12.a:0 "Let them settle"

 rip_diaspora.13.t:0 "Settlers Cross the Border With Their Priest"
 rip_diaspora.13.d:0 "Wagons carrying settler families, parish priests and icons have arrived in an allied eastern province. The settlers raise homesteads and keep both their tongue and their ancestral liturgy under friendly rule."
 rip_diaspora.13.a:0 "Let them settle"

 rip_diaspora.20.t:0 "The Green Wedge Asks for Its Own Governor"
 rip_diaspora.20.d:0 "Our distant settlements across the Amur have grown rich in timber, grain and river trade. Their elders and starshyna now petition the throne for a governor of their own, asking to raise the Green Wedge under our protection."
 rip_diaspora.20.a:0 "Grant the Green Wedge its own crown"

 rip_diaspora.21.t:0 "The Grey Wedge Asks for Its Own Governor"
 rip_diaspora.21.d:0 "Across the Central Asian steppe, our sponsored settlements have grown into thriving frontier towns and caravan posts. Their elders now petition the throne for their own viceroy, seeking to govern the Grey Wedge under our protection."
 rip_diaspora.21.a:0 "Grant the Grey Wedge its own crown"
