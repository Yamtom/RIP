 sloboda_brotherhood_schools:0 "Brotherhood Schools"
 desc_sloboda_brotherhood_schools:0 "Urban schooling networks cultivate literate clergy, clerks, and administrators."
 sloboda_service_chancellery:0 "Service Chancellery Expansion"
