 rip_eparchy.3.t:0 "Bishop Zhabokrytsky of Lutsk"
 rip_eparchy.3.d:0 "Bishop Terlecki had joined the union in the 1590s, but the see went back to Orthodox bishops, and the Orthodox line held Lutsk from 1620 to 1702. King Sobieski had named Zhabokrytsky Orthodox bishop in 1695; he joined the union in 1702, the standard date for this eparchy.\n\nHere Lutsk is represented by Volhynia, which is already Catholic in this game's history, so the faith of the province does not change. Acceptance protects the rite from missionary conversion and grants a diocese (-1 local unrest, +10% local tax) for twenty years. Refusal is alternative history: the province keeps its faith and gains +3 local unrest and +15% local autonomy for ten years. The seat changes its mind; the province keeps its own."
