l_spanish:

 # Traduccion parcial. The mod's source language is English; the entries below are the
 # English text of localisation/rip_border_mechanics_l_english.yml, carried over so nothing
 # renders as a raw key while the translation is outstanding. Written by
 # tools/build_border_mechanics_localisation.py: change the English file, not this one.

 uzh_carpathian_captaincy_reform:0 "Carpathian Captaincy"
 uzh_carpathian_captaincy_reform_desc:0 "Castle captains hold the passes, the customs posts and the salt road of the march, each answering to the prince for his own district. The prince can order the posts manned, the salt pledged or the highlanders enlisted, but what the captains refuse stays undone."
 ability_uzh_carpathian_captaincy_mechanic:0 "The Carpathian Captains"
 uzh_man_the_border_posts:0 "Man the Border Posts"
 uzh_man_the_border_posts_desc:0 "Spend 50 military power to garrison the passes and the customs posts for seven years: enemy armies suffer +1 attrition, garrisons grow by a quarter and land maintenance rises by 5%. All captaincy orders share a ten-year cooldown."
 uzh_pledge_the_salt_chambers:0 "Pledge the Salt Chambers"
 uzh_pledge_the_salt_chambers_desc:0 "Spend 50 administrative power while the realm holds a province that produces salt. The captains advance 40% of a year's income at once and hold the salt revenue in pledge: the national tax modifier falls by 10% for ten years. The debt runs its course even if the reform is lost. All captaincy orders share a ten-year cooldown."
 uzh_enlist_the_opryshky:0 "Enlist the Opryshky"
 uzh_enlist_the_opryshky_desc:0 "Spend 50 diplomatic power to pardon the highland outlaws and swear them into the posts: 2,000 recruits at once and, for seven years, 10% lower land maintenance and 10% faster armies, at the price of +1 unrest and 5 points of noble loyalty. It ends the Opryshky raids and slows the Opryshky Uprising. All captaincy orders share a ten-year cooldown."
 uzh_carpathian_captaincy_session_cd:0 "The Carpathian captains cannot receive another order for §Y10§! years."
 uzh_captaincy_salt_province_tt:0 "Owns a province that produces §YSalt§!"
 uz_captaincy_posts_manned:0 "Border Posts Manned"
 desc_uz_captaincy_posts_manned:0 "The captains and their garrisons hold the passes and the customs posts of the march."
 uz_captaincy_salt_pledged:0 "Salt Chambers Pledged"
 desc_uz_captaincy_salt_pledged:0 "The captains hold the salt revenue in pledge against the advance they made to the prince."
 uz_captaincy_opryshky_enlisted:0 "Opryshky Enlisted"
 desc_uz_captaincy_opryshky_enlisted:0 "Pardoned highland outlaws serve in the border posts: cheap, quick and not wholly tame."
 ability_rip_border_watch_mechanic:0 "The Border Watch"
 rip_post_the_watchtowers:0 "Post the Watchtowers"
 rip_post_the_watchtowers_desc:0 "Spend 50 administrative power to raise a line of watchtowers and beacon posts in every city that borders a steppe power: +20% local defensiveness and +1 local attrition for eight years. A steppe raid takes another target when it can, and does less harm when it cannot. All border watch orders share a ten-year cooldown."
 rip_send_out_the_patrols:0 "Send Out the Patrols"
 rip_send_out_the_patrols_desc:0 "Spend 50 military power to send riders along the line for five years: enemy armies suffer +0.5 attrition, armies move 10% faster and land maintenance rises by 5%. Steppe raids on the realm do less harm while the patrols ride. All border watch orders share a ten-year cooldown."
 rip_settle_the_watch:0 "Settle the Watch"
 rip_settle_the_watch_desc:0 "Spend 50 diplomatic power to grant land to watchmen in one city that borders a steppe power and has no settled watch yet: +25% local manpower and +10% local defensiveness, -15% local tax, for twenty years. All border watch orders share a ten-year cooldown."
 rip_border_watch_order_cd:0 "The Border Watch cannot receive another order for §Y10§! years."
 rip_watch_exposed_province_tt:0 "Owns a city that borders a §Ysteppe power§!"
 rip_watch_unsettled_province_tt:0 "Owns a city that borders a §Ysteppe power§! and has no settled watch"
 rip_post_the_watchtowers_tt:0 "Every city we own that borders a steppe power gains §YWatchtower Line§! for eight years."
 rip_settle_the_watch_tt:0 "One city we own that borders a steppe power and has no settled watch gains §YSettled Watch§! for twenty years."
 rip_watchtower_line:0 "Watchtower Line"
 desc_rip_watchtower_line:0 "Towers and beacon posts watch the steppe from the edge of the city's land."
 rip_settled_watch:0 "Settled Watch"
 desc_rip_settled_watch:0 "Watchmen hold land here in lieu of tax and answer the beacon with their own horses."
 rip_steppe_patrols:0 "Steppe Patrols"
 desc_rip_steppe_patrols:0 "Riders move along the line between the posts and meet the raiders before they reach the villages."
