l_english:

 # --- the ladder of the Grand Duchy
 #
 # grand_duchy_reform itself keeps vanilla's name. Its description is
 # deliberately overridden in localisation/zzz_lit_grand_duchy_override_l_english.yml,
 # because this mod replaces the reform's contents by key.

 lit_pany_rada_reform:0 "Pany-Rada"
 lit_pany_rada_reform_desc:0 "The Grand Duke may not treat with a foreign power, spend the treasury or grant a starostwo without the lords of the council, and the council is drawn from the same eight families it was drawn from under his father. A ruler who quarrels with it finds out how much of the Grand Duchy answers to it directly."

 lit_ruthenian_chancery_reform:0 "Ruthenian Chancery"
 lit_ruthenian_chancery_reform_desc:0 "Charters, court rolls and land grants are written in the language the palatinates actually read, so a scribe from Vilnius is understood in Kyiv without an interpreter. It costs nothing and holds more ground than a garrison does. The Crown's clerks find it provincial."

 lit_confessional_guarantee_reform:0 "Guarantee of the Rites"
 lit_confessional_guarantee_reform_desc:0 "No man in the Grand Duchy loses his land or his office for the rite he was baptised in, and the promise is old enough that breaking it would be a constitutional matter rather than a religious one. Rome reads the clause with distaste. The lords of the council read it as their own insurance."

 lit_boyar_levy_reform:0 "Boyar Levy"
 lit_boyar_levy_reform_desc:0 "Every landholder rides when the Grand Duke calls, brings the horses his acreage owes and goes home when the season closes. It is cheap, it is fast, and it is very good cavalry. It is also not built to stand in front of guns for a whole summer."

 lit_grand_diet_reform:0 "Diet of the Grand Duchy"
 lit_grand_diet_reform_desc:0 "The palatinates send deputies to their own diet at Vilnius, which votes the levy and the tax and hears what the sejmiks send up. It sits apart from the Crown's Sejm and knows exactly why. What it votes, the Grand Duke can afford to collect."

 lit_statute_reform:0 "Lithuanian Statute"
 lit_statute_reform_desc:0 "One code for the whole Grand Duchy - land, inheritance, criminal law and the standing of a nobleman - printed and sold to anyone who can read. Judges cite the book rather than the custom. The clauses it took from Ruthenian law are the ones the palatinates cite most often."

 # --- the two ends of the union quarrel

 lit_union_of_two_nations_reform:0 "Commonwealth of Two Nations"
 lit_union_of_two_nations_reform_desc:0 "One elected monarch, one diet and one foreign policy, over two treasuries, two armies, two codes of law and two sets of offices that will not admit each other's holders. Every crisis is argued through both halves before it is answered. Its defenders point out that neither half has yet overthrown the other."

 lit_separate_crown_reform:0 "Crown of the Grand Duchy"
 lit_separate_crown_reform_desc:0 "Vilnius crowns its own and stops sending deputies to a diet in Lublin. The Grand Duchy keeps its Statute, its levy and its Ruthenian palatinates, and keeps them without help. Krakow's usual answer to this has been to find a candidate of its own for our throne."

