 wr_west_ruthenian_distinctiveness:0 "Eigene Kanzlei- und Pfarreiregister"
 desc_wr_west_ruthenian_distinctiveness:0 "Ortsgerichte, Magdeburger Städte und Schreibstuben führen Urkunden, Testamente und Volkshomilien deutlich getrennt vom Moskauer Prikas-Brauch."
 wr_chancery_prosta_mova_tradition:0 "Privilegierte Volkskanzlei"
 desc_wr_chancery_prosta_mova_tradition:0 "In der Tradition der großfürstlichen Prosta Mova, der Peresopnyzja-Übersetzung und karpatischer Lehrevangelien wahren Schreiber eine eigene Rechts- und Schriftsprache."
 wr_west_ruthenian_commonwealth:0 "Eigene ruthenische Kultursphäre"
 desc_wr_west_ruthenian_commonwealth:0 "Druckereien, Landesstatute und Bruderschaftsakademien verankern Belarussen (Bielaruski), Ruthenen (Ruskyi) und Karpatenrusynen (Rusnacky) in einer eigenen ruthenischen Gruppe abseits Moskaus."
 wr_west_ruthenian_statute_autonomy:0 "Statuts- und Stauropegie-Autonomie"
 desc_wr_west_ruthenian_statute_autonomy:0 "Gestützt auf die Litauischen Statute, die Rechtsgarantien von 1569 für ruthenische Schrift in Wolhynien, Kyiv und Brazlaw sowie karpatisches Walachenrecht verteidigen Stände ihre eigene Rechtssphäre."
 wr_west_slavic_cultural_affinity:0 "Gemeinsamer westslawischer Stadtraum"
 desc_wr_west_slavic_cultural_affinity:0 "Zweisprachige Stadtmagistrate, Universitätsbünde in Kraków und Prag sowie gemeinsames Stadtrecht führen städtische Stände an polnische, tschechische und slowakische Nachbarn heran."
 wr_west_slavic_shared_script_space:0 "Zweischriftlicher Druck- und Rechtskreis"
 desc_wr_west_slavic_shared_script_space:0 "Buchhändler, Seminare und Adelslandtage verbreiten lateinische Glossen, Lacinka-Schriftsätze und Drucke aus Kraków und Trnava über Pfarreigrenzen hinweg."
 wr_west_slavic_synthesis:0 "Westslawische Bürgersynthese"
 desc_wr_west_slavic_synthesis:0 "Ähnlich den Sprachgrenzräumen in der Lausitz, Schlesien und der Ostslowakei vollenden zweisprachige Stadträte einen seltenen Übertritt in die westslawische Sprachfamilie."
 wr_traditionalist_backlash:0 "Protest von Klöstern und Bojaren"
 desc_wr_traditionalist_backlash:0 "Orthodoxe Bruderschaften, Skitenälteste und konservative Magnaten bekämpfen Kanzleineuerungen, die alte kirchenslawische Formen lockern."
 wr_collective_concord:0 "Eintracht der Drei Kreise"
 desc_wr_collective_concord:0 "Abgestimmte Urkunden zwischen Kronen mit Hauptkultur, akzeptierter Kultur und Grenzprovinzen sichern breite diplomatische Unterstützung."
 wr_cultural_ferment:0 "Ungelöste Provinzgärung"
 desc_wr_cultural_ferment:0 "Nachbarhöfe ratifizierten neue Kanzleirechte, während örtliche Obrigkeiten abseits blieben und Kaufleute wie Stände spalteten."
 opinion_wr_west_slavic_kinship:0 "Westslawische Bürgerverwandtschaft"
 opinion_wr_west_ruthenian_separation:0 "Abgrenzung von Moskauer Ansprüchen"
 opinion_wr_collective_accord:0 "Eintracht des Kulturkongresses"
 opinion_wr_collective_discord:0 "Zwietracht des Kulturkongresses"
 wr_tt_byelorussian_s2_index:0 "Von allen Provinzen der Kultur §YBielaruski§! müssen mindestens §Y60%§! die Charta angenommen haben. Derzeitige Zustimmung: §Y[Root.wr_byelorussian_s1_pct.GetValue]%§! (§Y[Root.wr_byelorussian_s1_cnt.GetValue]§! von §Y[Root.wr_byelorussian_total.GetValue]§! Provinzen)."
