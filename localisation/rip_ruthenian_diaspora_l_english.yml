l_english:
 rip_diaspora_root_title:0 "The Ruthenian Diaspora"
 rip_diaspora_root_desc:0 "Merchants, exiles and settlers of Ruthenian speech have long left these shores for others. Let the crown take an interest in where they go."

 rip_colonize_canada_title:0 "Nova Volyn"
 rip_colonize_canada_desc:0 "Fur traders and fishermen from the Ruthenian lands have followed the northern rivers into the New World. Their settlements deserve a Ruthenian name: Nova Volyn."
 rip_colonize_canada_flavor_tt:0 "The colonists in Nova Volyn keep their own customs and their own tongue"

 rip_lysianskyi_circumnavigation_title:0 "Lysiansky's Voyage"
 rip_lysianskyi_circumnavigation_desc:0 "Yuriy Lysiansky, born to a Cossack officer's family in Nizhyn, has commanded a ship around the world. No Ruthenian had done so before him."

 rip_diaspora_usa_title:0 "Nova Rus"
 rip_diaspora_usa_desc:0 "Ruthenian settlers along the eastern seaboard have built farms and churches enough to call their country Nova Rus."

 rip_diaspora_south_america_title:0 "Nova Bratslavshchyna and Sribna Zemlia"
 rip_diaspora_south_america_desc:0 "South of the equator, Ruthenian colonists have taken root in Brazil and along the River Plate, naming their new homes after the lands they left."

 rip_diaspora_australia_title:0 "Nova Tavriya"
 rip_diaspora_australia_desc:0 "A handful of Ruthenian sailors and exiles have settled the southern continent. They have named their landing Nova Tavriya, after the old steppe shore."

 rip_green_wedge_title:0 "The Green Wedge"
 rip_green_wedge_desc:0 "Peasants and Cossacks from the Ruthenian lands have begun to move east into the taiga beyond the Amur, clearing farmland far from any Ruthenian border."

 rip_grey_wedge_title:0 "The Grey Wedge"
 rip_grey_wedge_desc:0 "Ruthenian settlers have taken to the open steppe of Central Asia, tilling ground among peoples who owe the crown nothing."

 rip_diaspora_of_rus_title:0 "The Diaspora of Rus"
 rip_diaspora_of_rus_desc:0 "From the Amur to the River Plate, Ruthenian speech is now heard on every continent but one. The crown records this scattering, without claiming to rule it."

 rip_green_wedge_presence:0 "The Green Wedge"
 rip_grey_wedge_presence:0 "The Grey Wedge"
 rip_diaspora_of_rus_legacy:0 "Diaspora of Rus"
