 uz_crown_of_saint_stephen:0 "Legacy of Saint Stephen"
 uz_crown_of_saint_stephen_desc:0 "Claim stewardship within the Lands of the Holy Crown either by ruling Pest and five Uhro-Rusyn Carpathian provinces as a kingdom, or through the Pressburg Compact backed by Hungarian estate diplomacy and Carpathian courthouses."
 uz_crown_of_saint_stephen_title:0 "Legacy of Saint Stephen"
 uz_cultural_autonomy_desc:0 "Secure cultural privileges for our Rusyn communities."
 uz_cultural_autonomy_title:0 "Cultural Autonomy"
 uz_cultural_renaissance:0 "Rusin Cultural Renaissance"
 uz_danube_consortium:0 "Danubian Consortium"
 uz_danube_exchange:0 "Danube Exchange"
 uz_danube_trade_league:0 "Danube Trade League"
 uz_danube_trade_league_desc:0 "Bind the guilds of Upper Hungary and the Danube entrepôts into a league that funnels caravans and wine convoys through Huszt's markets."
 uz_danube_trade_league_title:0 "Danube Trade League"
 uz_danubian_monarchy_desc:0 "Crown the Danubian settlement either as an imperial hegemony across fifteen Carpathian provinces and Buda-Pressburg, or as a constitutional estate monarchy bound to Hungary's Crown of St. Stephen."
 uz_danubian_monarchy_title:0 "Danubian Ascendancy"
 uz_dual_monarchy_administration:0 "Danubian Dual Administration"
 uz_duchnovych_awakening:0 "Parish School Awakening"
 uz_early_industrialization:0 "Chartered Manufactories"
 uz_establish_cultural_hub_desc:0 "Endow schools, presses, and guild halls in our capital so it stands as the chief seat of Rusyn learning."
 uz_establish_cultural_hub_title:0 "Establish Cultural Hub"
 uz_expand_pannonia_desc:0 "Expand our control into the Pannonian region and establish a foothold in these fertile lands."
 uz_expand_pannonia_title:0 "Expand into Pannonia"
 uz_factory_consortiums:0 "Factory Consortiums"
 uz_federal_structure:0 "Federal Structure"
 uz_federative_statutes_autonomy:0 "Federative Autonomy Timetable"
 uz_federative_statutes_capacity:0 "Federative Census Office"
 uz_frontier_charters:0 "Frontier Charters"
 uz_frontier_expansion:0 "Frontier Expansion"
 uz_granichar_command:0 "Granichar Commandants"
 uz_granichar_loyalty:0 "Granichar Loyalty Oaths"
 uz_great_migration_desc:0 "Guide Tysa valley families to settle the upland meadows and Pannonian market towns under the banner of the march."
 uz_great_migration_title:0 "Great Migration"
 uz_greek_catholic_concord:0 "Greek Catholic Concord"
 uz_guardians_of_rusyn_legacy_desc:0 "As guardians of the [Root.GetUZHIdentityCultureAdjective] legacy, we must protect and preserve our cultural heritage while expanding our influence."
 uz_guardians_of_rusyn_legacy_title:0 "Guardians of the Rusyn Legacy"
 uz_habsburg_border_command:0 "Habsburg Border Command"
 uz_habsburg_resistance:0 "Habsburg Resistance"
 uz_hungarian_protection_desc:0 "Renew the charter of liberties at Palanok with Buda or, if the Hungarian crown falls, with another royal guarantor. Historically, Subcarpathian villages in the fifteenth century held customary Wallachian law (ius Valachicum) under the Hungarian komitats of Bereg, Ung, Ugocsa, and Maramaros; elevating that charter turns local estate privileges into sovereign diplomatic protection."
 uz_hungarian_protection_title:0 "Hungarian Protection"
 uz_huszt_rename_desc:0 "Elevate the frontier march into a realm bearing the name of its seat at Khust (Huszt). This is a change of state title, not a renaming of Uzhhorod or Mukachevo: the three towns remain distinct. Maramaros represents their wider frontier region on the game map."
 uz_huszt_rename_title:0 "Crown the Huszt March"
 uz_identity_branching_1_desc:0 "The lords at Palanok must decide whose protection our lands can trust. Their answer will determine which oaths our envoys take abroad."
 uz_identity_branching_1_title:0 "Pending Allegiance Branch"
 uz_identity_branching_2_desc:0 "We have named our friends. Now we must secure their pledges before the next council meets at Palanok."
 uz_identity_branching_2_title:0 "Pending Allegiance Branch"
 uz_identity_branching_3_desc:0 "Continued fidelity to our chosen path will unveil the final objective of this branch."
 uz_identity_branching_3_title:0 "Pending Allegiance Branch"
 uz_identity_consolidated:0 "Name Settled"
 uz_identity_question_desc:0 "Convene the estates at Palanok to choose the political and cultural orientation of the realm: advancing through Ruthenian alliances, fostering autonomous Carpathian courts and liberties, or negotiating Hungarian estate compacts under the Crown of St. Stephen. Where late eighteenth-century awakenings stirred letters and schools without a sovereign state, Palanok turns that crossroads into a binding charter of rule."
 uz_identity_question_title:0 "Question of Our Name"
 uz_increase_tolerance_of_true_faith:0 "Increases tolerance of the true faith by 1"
 uz_integrate_local_nobility_desc:0 "Integrate the local nobility into our administration to strengthen their loyalty and support."
 uz_integrate_local_nobility_title:0 "Integrate Local Nobility"
 uz_karloca_synod_blessing:0 "Karlovac Synod Benediction"
 uz_komitat_administration:0 "Komitat Administration"
 uz_kuruc_border_raids:0 "Kuruc Border Raids"
 uz_kyivan_heritage_desc:0 "Along the Ruthenian course, invoke the Podolian-Carpathian link forged by Duke Fedir Koriatovych (1396–1414)—and claimed by our surviving 1444 collateral Koriatovych captains—to bridge Huszt and Red Ruthenia either through territorial union or through alliances with East Slavic realms across the Ruthenian plain."
 uz_kyivan_heritage_title:0 "Kyivan Heritage"
 uz_kyivan_legacy:0 "Kyivan Legacy"
 uz_language_decree:0 "Language Decree"
 uz_language_decree_desc:0 "Put the language statutes into daily use. After three years of standardization, equip three Ruthenian or Rusyn provincial centres with courthouses or better judicial offices, then spend 100 Diplomatic Power on translators and printed administrative forms."
 uz_language_decree_title:0 "Language Decree"
 uz_legacy_old_rus_desc:0 "Embrace the legacy of the Old Rus, uniting our lands and securing a prosperous future for our people."
 uz_legacy_old_rus_title:0 "Legacy of the Old Rus"
 uz_linguistic_development:0 "Linguistic Development"
 uz_magyarization_drive:0 "Magyarization Drive"
 uz_mountain_gendarmerie:0 "Mountain Gendarmerie"
 uz_mukachevo_autonomy_desc:0 "Confirm Mukachevo's courts and market tolls around Palanok. Historically, after Fedir Koriatovych's rule (1396–1414) the estate passed to the Brankovic, Hunyadi, and later Rakoczi lords within Hungary and Transylvania; here, a surviving Koriatovych collateral captaincy turns the fortress town into an autonomous judicial seat of our march. Palanok is represented in Maramaros for map purposes; Mukachevo is not Khust or Uzhhorod."
 uz_mukachevo_autonomy_title:0 "Mukachevo Autonomy"
 uz_mukachevo_privileges:0 "Mukachevo Privileges"
 uz_national_revival_desc:0 "Gather brotherhoods, parish schools, and a proposed academy at Mukachevo into a common estate. Historically, Bishop Andrii Bachynsky (1772–1809) reorganized the Mukachevo eparchy and founded the Uzhhorod Theological Seminary in 1778. Our university at Mukachevo is an alternative foundation, not that seminary; Khust remains the march's initial seat, and Maramaros represents this wider region on the map."
 uz_national_revival_title:0 "National Revival"
 uz_old_rite_resilience:0 "Old Rite Resilience"
 uz_old_rus_alliances_desc:0 "Strengthen alliances with countries that share our culture or have strategic interests in Ruthenian lands."
 uz_old_rus_alliances_title:0 "Old Rus Alliances"
 uz_opryshky_pacified:0 "Pacified Mountain Brotherhoods"
 uz_opryshky_raids:0 "Opryshky Raids"
 uz_opryshok_raiders:0 "Opryshok Raiders"
 uz_orthodox_defender:0 "Orthodox Defender"
 uz_orthodox_metropolis:0 "Ruthenian Metropolis"
 uz_orthodox_revival:0 "Ruthenian Rite Revival"
 uz_orthodox_unity_desc:0 "Unify the parishes of our Ruthenian lands under a durable settlement suited to our state rite, backed either by an eight-province diocesan network or by East Slavic allies upholding the same ecclesiastical concord."
 uz_orthodox_unity_title:0 "Ruthenian Rite Settlement"
 uz_palank_border_watch:0 "Palanok Border Watch"
 uz_palank_border_watch_desc:0 "Restore the watch posts and garrison drills that shield Palanok's valleys, keeping reserves ready to ride the Tysa passes at a moment's notice."
 uz_palank_border_watch_title:0 "Guard the Palanok Border"
 uz_palatial_chambers:0 "Palatine Chambers"
 uz_pan_ruthenian_congress_desc:0 "Summon bishops, nobles, and allies to Huszt to frame a Ruthenian confederated charter—achieved either by holding lands from Carpathia to the Dnieper or by uniting East Slavic partners in an equal diplomatic congress."
 uz_pan_ruthenian_congress_title:0 "Pan-Ruthenian Congress"
 uz_pan_ruthenian_union:0 "Pan-Ruthenian Union"
 uz_pannonian_autonomy:0 "Pannonian Autonomy"
 uz_pannonian_blockhouses:0 "Pannonian Blockhouses"
 uz_pannonian_charters:0 "Pannonian Charters"
 uz_pannonian_drive:0 "Pannonian Drive"
 uz_pannonian_league:0 "Pannonian League"
 uz_pannonian_settlement:0 "Pannonian Settlement"
 uz_preserve_orthodox_faith_desc:0 "Confirmed after Svydrygailo's rising, this settlement binds Huszt to guard its Eastern-rite parishes. Historically, Patriarch Anthony IV granted stauropegion status to Hrushevo Monastery in 1391 and Duke Fedir Koriatovych endowed Mukachevo's Chernecha Hora in 1396–1414 before his death in 1414 left Mukachevo to pass into the Brankovic and Hunyadi orbit. In this chronicle, a collateral Koriatovych line held Palanok and the Huszt march past 1414, standing as an independent patron of those parishes rather than yielding oversight to Buda or Transylvania."
 uz_preserve_orthodox_faith_title:0 "Preserve the Carpathian Rite"
 uz_pressburg_compact:0 "Pressburg Compact"
 uz_pressburg_compact_desc:0 "Along the Uhro-Rusyn course, bring Subcarpathian delegates to Pressburg (Pozsony), Hungary's diet capital after 1536, to codify Huszt's liberties either by agreement with Buda or through regional sovereignty."
 uz_pressburg_compact_title:0 "Pressburg Compact"
 uz_private_salt_leases:0 "Private Salt Leases"
 uz_protect_eastern_frontier_1_desc:0 "Our eastern borders must be fortified to protect our lands from foreign invaders. Building strong fortifications in the Eastern Carpathians will secure our realm."
 uz_protect_eastern_frontier_1_title:0 "Protect the Eastern Frontier"
 uz_protect_eastern_frontier_desc:0 "Our eastern borders must be secured against any potential threats. By fortifying the Eastern Carpathians, we can ensure the safety of our realm."
 uz_protect_eastern_frontier_title:0 "Protect the Eastern Frontier"
 uz_protect_rusin_heritage_desc:0 "Revitalize and protect the Rusin culture, ensuring that it thrives and is preserved for future generations."
 uz_protect_rusin_heritage_title:0 "Protect Rusin Heritage"
 uz_protected_frontier:0 "Protected Eastern Frontier"
 uz_rebel_legends:0 "Folk Heroes of the Carpathians"
 uz_recover_lost_rusin_lands_desc:0 "Reclaim the lost lands of Galicia and Volhynia, restoring them to our control."
 uz_recover_lost_rusin_lands_title:0 "Recover Lost Rusin Lands"
 uz_resist_habsburgs_desc:0 "Delegates at Palanok demand to know who will hold the Carpathian passes. From 1660 to 1711, Palanok stood at the center of anti-Habsburg risings—from Ilona Zrinyi's defense (1685–1688) to Rakoczi's war ending at Szatmar in 1711; now a frontier rival, royal guarantee, or fortified garrison can hold the borderlands apart from Vienna."
 uz_resist_habsburgs_title:0 "Palanok Security Congress"
 uz_riverine_granaries:0 "Riverine Granaries"
 uz_rusin_aristocracy:0 "Rusyn Aristocracy"
 uz_rusin_enlightenment:0 "Rusyn Enlightenment"
 uz_rusin_enlightenment_desc:0 "Foster schools, printing houses, and clerical scholarship to awaken a lasting flowering of Rusyn letters."
 uz_rusin_enlightenment_title:0 "Rusyn Enlightenment"
 uz_rusin_language_desc:0 "Compile the statutes, hymns, and salt ledgers of the march into a respected chancery tongue. Historically, Bishop Joseph de Camelis published the first printed Catechism (1698) and Primer (1699) for Subcarpathian parishes; by decree of Khust, that Church Slavonic and vernacular register becomes the realm's official administrative usage."
 uz_rusin_language_title:0 "Rusyn Language"
 uz_rusin_literacy_desc:0 "Historically, fifteenth- and sixteenth-century Carpathian learning centered on monastic scriptoria at Hrushevo and Mukachevo's Chernecha Hora, long before secular colleges arose. Endow parish churches and scholars around Mukachevo and Khust so rural judges and clerks master Ruthenian and Latin charters without waiting for university chairs."
 uz_rusin_literacy_title:0 "Rusyn Literacy"
 uz_rusin_national_awakening:0 "Rusyn National Awakening"
 uz_rusin_settlement:0 "Rusyn Settlement"
 uz_rusin_state_desc:0 "With Huszt's courts, university, and Carpathian estates assembled, the Diet proclaims a sovereign Rusyn polity. Although Carpathian letters and schoolmen only began their wider awakening toward the close of the eighteenth century, our Diet binds those estates into formal statehood here and now."
 uz_rusin_state_title:0 "A Rusyn State"
 uz_rusyn_autonomy:0 "Rusyn Autonomy"
 uz_rusyn_autonomy_desc:0 "Along the autonomous Carpathian course, establish chartered local courts and county privileges grounded in fifteenth-to-eighteenth-century mountain liberties and estate custom."
 uz_rusyn_autonomy_title:0 "Rusyn Autonomy"
 uz_rusyn_cultural_awakening_desc:0 "Our cultural heritage must be preserved and celebrated. Let us establish ourselves as the guardians of [Root.GetUZHIdentityCultureAdjective] culture."
 uz_rusyn_cultural_awakening_title:0 "Rusyn Cultural Awakening"
 uz_rusyn_self_governance:0 "Rusyn Self-Governance"
 uz_ruthenian_awakening:0 "Ruthenian Awakening"
 uz_ruthenian_legacy:0 "Ruthenian Legacy"
 uz_salt_chamber_overwatch:0 "Salt Chamber Overwatch"
 uz_salt_corridor_convoys:0 "Danube Convoy Schedules"
 uz_salt_corridor_depots:0 "Salt Corridor Depots"
 uz_secure_maramures_desc:0 "Fortify the Maramures region to ensure our defenses and provide a stronghold against our enemies."
 uz_secure_maramures_title:0 "Secure the Maramures"
 uz_self_identification_desc:0 "Give the Palanok estates' chosen political course five years to take root. Maintain stability of at least +2 and unite five provinces of the chosen cultural tradition under the state faith before confirming the common charter."
 uz_self_identification_title:0 "Allegiance of the Rusyns"
 uz_serdyuk_guard:0 "Hajduk Guard"
 uz_slavo_rusyn_identity:0 "The Slavo-Rusyn Name"
 uz_solotvyno_chambers:0 "Solotvyno Salt Galleries"
 uz_solotvynska_camera:0 "Solotvynska Camera"
 uz_sovereign_rusin_state:0 "Sovereign Rusyn State"
 uz_statute_codification:0 "Palanok Statutes"
 uz_tisza_customs_convention:0 "Tisza Customs Convention"
 uz_tisza_customs_depot:0 "Tisza Customs Depot"
 uz_trade_prosperity:0 "Trade Prosperity"
 uz_uhro_rusyn_identity:0 "The Uhro-Rusyn Name"
 uz_uhro_rusyn_integration:0 "Uhro-Rusyn Integration"
 uz_uhro_rusyn_integration_desc:0 "Harmonize Rusyn parish privileges with Hungarian komitat law and county courts under the Pressburg Compact, either across three Uhro-Rusyn provinces or through treaty partnership with Hungary."
 uz_uhro_rusyn_integration_title:0 "Uhro-Rusyn Integration"
 uz_uhro_rusyn_synthesis:0 "Uhro-Rusyn Concord"
 uz_ukraino_rusyn_identity:0 "The Kyivan-Rusyn Name"
 uz_union_compromise_plus:0 "Union Compromise Charter"
 uz_union_compromise_plus_desc:0 "Fund theological debates and print new catechisms so both rite defenders and Latin patrons embrace the compact."
 uz_union_compromise_plus_title:0 "Union Compromise Charter"
 uz_union_dilemma_desc:0 "From 1646, settle the relationship between the Eastern clergy and Latin communion. Historically, sixty-three priests concluded the Union of Uzhhorod on 24 April 1646 under the Drugeth lords, preserving Eastern rites while Maramaros parishes held to Orthodoxy into the eighteenth century. Uzhhorod is distinct from Khust and Mukachevo; Maramaros represents the wider region on the map. Our court may support communion or confirm the old rite."
 uz_union_dilemma_title:0 "Union Dilemma"
 uz_unique_host_cooldown:0 "Hosts Reorganising"
 uz_unite_rusin_lands_desc:0 "We must unite all Rusin territories under our rule to preserve our culture and heritage."
 uz_unite_rusin_lands_title:0 "Unite the Rusin Lands"
 uz_zakarpattia_realm_desc:0 "Unite the Ruthenian lands of the Carpathian valleys beneath a common crown. Carpathian Rus' is our regional realm's chosen title; its sovereign crown is an alternative path for lands historically divided among counties of Hungary."
 uz_zakarpattia_realm_title:0 "Realm of Carpathian Rus'"
 UZH:0 "Huszt March"
 uzh.1.a:0 "Our rite is our strength!"
 uzh.1.d:0 "Our ancestors planted the Eastern rite in these Carpathian lands centuries ago. As religious wars rage around us, the court must protect those parishes while holding the march together."
 uzh.1.t:0 "The Carpathian Rite"
 uzh.10.a:0 "Empower the civic councils"
 uzh.10.b:0 "Forge a frontier guard"
 uzh.10.d:0 "The republic is born from the frontier. We must decide whether civic councils and guilds will guide our expansion or whether a disciplined frontier guard will ensure stability across the plains."
 uzh.10.t:0 "Shape the Pannonian Republic"
 uzh.2.a:0 "Welcome the advisers to our chancery."
 uzh.2.b:0 "Reserve appointments for the estates."
 uzh.2.d:0 "Royal envoys bring a draft charter to Palanok. Their court offers experienced advisers to our chancery. The estates would prefer to name their own clerks, even at the cost of a public rebuff to the envoys."
 uzh.2.t:0 "The Palanok Charter"
 uzh.201.a:0 "Proclaim the synod’s benediction"
 uzh.201.b:0 "Fund the cathedral guild college"
 uzh.201.d:0 "Karlóca has long served as the seat of Serbian Orthodox metropolitans—formally recognized after the 1690 migration and settled in 1713—while Uniate parishes across Bácska and Srem historically turned toward the Eparchy of Krizevci erected in 1777. Today, Basilian abbots, state-rite hierarchs, and royal confessors gather at Karlóca to chart a different path, binding these southern dioceses directly to Khust's own hierarchy."
 uzh.201.t:0 "The Karlovac Synod"
 uzh.202.a:0 "Grant charters to our subject marches"
 uzh.202.b:0 "Turn the congress into a border staff"
 uzh.202.d:0 "Delegates from palatinates, marcher towns, and border companies crowd Palanok’s halls to sketch the future of our congress. Merchant envoys plead for broader charters to steady the crowns of our subjects. Generals insist that joint drills and magazines along the southern frontier are the only shield against encroaching empires."
 uzh.202.t:0 "The Carpathian Congress"
 uzh.203.a:0 "Anchor the furnaces with royal foundries"
 uzh.203.b:0 "Lease mineral and export charters to the counting houses"
 uzh.203.d:0 "Maramaros and the Upper Tisza valleys yield iron ore—worked around Kobyletska Polyana, Dovhe, and our mountain streams—alongside timber for charcoal and Solotvyno salt, rather than a local coal basin; any coal must be hauled from neighboring coalfields beyond the passes such as Hunyad, Somogy, or Lviv. Guild syndics and estate investors now petition the crown to back new blast furnaces and ironworks, debating whether to knit our foundries into a single royal network or lease mineral and fuel charters to the counting houses."
 uzh.203.t:0 "Carpathian Ironworks and Mountain Furnaces"
 uzh.230.a:0 "Fortify the march and drill the border guard."
 uzh.230.b:0 "Grant charters to the Danube guilds."
 uzh.230.c:0 "Push deeper into the Banat palisades."
 uzh.230.d:0 "Danubian blockhouses spring up beside market sheds, while colonists beg for guidance. Shall we drill soldiers, reward guilds, or march deeper toward the Maros?"
 uzh.230.t:0 "Axes over the Danube"
 uzh.241.a:0 "Stamp the Solotvynska ledgers."
 uzh.241.d:0 "Mukachevo's clerks cart in new salt ledgers, tallying the brine of Solotvyno against crown quotas. Once sealed, the camera will police every barrel that leaves the valley."
 uzh.241.t:0 "Camera Ledgers Balanced"
 uzh.242.a:0 "Sign the customs articles."
 uzh.242.d:0 "Envoys from Pest, Mukachevo, and the downstream marts of Wien and Kraków agree to treat the Upper Tisza as a single tariff space. Harmonised tariffs could flood our depots with river and trans-Carpathian trade—if we bind every market to the articles."
 uzh.242.t:0 "Convention of the Tisza"
 uzh.3.a:0 "Focus on administrative development"
 uzh.3.b:0 "Promote trade and economic growth"
 uzh.3.d:0 "Mukachevo is becoming the center of our administration. We can grant the city special privileges to foster its development and strengthen our rule in the region."
 uzh.3.t:0 "Mukachevo Autonomy"
 uzh.310.a:0 "Reinforce the Carpathian hearthlands."
 uzh.310.b:0 "Send families into the Alföld."
 uzh.310.c:0 "Raise stockades along the Maros."
 uzh.310.d:0 "Petitions from towns and parishes crowd the chancery. Some beg for support to repopulate Carpathian valleys, others to stake claims in the Alföld or the Banat."
 uzh.310.t:0 "Rusyn Colonization Wave"
 uzh.4.a:0 "Enlightenment is the foundation of our future!"
 uzh.4.b:0 "Let the brotherhoods guide our cultural awakening."
 uzh.4.d:0 "Monastic scriptoria and parish schools across our Carpathian valleys copy Slavonic primers, psalters, and legal statutes, laying the groundwork for wider book culture and later higher schooling."
 uzh.4.t:0 "Rusyn Literacy"
 uzh.410.a:0 "Muster the Hajduk Guard."
 uzh.410.b:0 "Let the opryshky patrol the passes."
 uzh.410.c:0 "Stand down and husband our strength."
 uzh.410.d:0 "Captains urge us to muster a standing border host. Should we drill disciplined Hajduk foot companies, unleash swift mountain opryshky, or stand down and husband our strength?"
 uzh.410.t:0 "Hosts of the March"
 uzh.5.a:0 "Ratify the congress's plan for the passes."
 uzh.5.b:0 "Keep the march's hands free."
 uzh.5.d:0 "The estates have gathered at Palanok to settle who will guard the passes. Foreign pledges may strengthen the frontier, and the captains have brought plans for its defence from our own resources."
 uzh.5.t:0 "The Palanok Security Congress"
 uzh.50.a:0 "Post a captain of the chambers"
 uzh.50.b:0 "Lease the wells to the burghers"
 uzh.50.d:0 "The salt domes near Solotvyno glitter with wealth for anyone who can keep their galleries dry and smugglers in line. Royal commissioners argue that only disciplined state auditors can guard the crown's monopoly, while the burghers claim that leasing the chambers to their counting houses would raise production overnight."
 uzh.50.t:0 "Salt Chambers of Solotvyno"
 uzh.51.a:0 "Give the local union a place in the state synod."
 uzh.51.b:0 "Keep the settlement local and retain the existing order."
 uzh.51.d:0 "The local clergy have already entered communion with Rome while preserving their Eastern rite. Now that the realm stands sovereign, the estates must decide whether to elevate that accord into a standing state synod or leave the settlement as a local charter of the valley."
 uzh.51.t:0 "A State Synod for Uzhhorod"
 uzh.52.a:0 "Arm the kuruc riders and strike from the forests"
 uzh.52.b:0 "Hold the line for the Emperor"
 uzh.52.d:0 "Ferenc Rákóczi has lit the plains with rebellion, and the passes of Ung are alive with kuruc scouts begging for powder. They promise to raid imperial caravans and guard our mountain roads in exchange for shelter. Vienna will surely demand we suppress them or reinforce the garrisons with loyalists."
 uzh.52.t:0 "Kuruc Border Companies"
 uzh.53.a:0 "Endow reading houses for [Root.GetUZHIdentityCultureAdjective] youth"
 uzh.53.b:0 "Channel stipends into Magyar schools"
 uzh.53.d:0 "Clergy and teachers petition for parish schools, primers and reading rooms in the language of our [Root.GetUZHIdentityCultureAdjective] communities. The chancery must choose whether to endow these local initiatives or direct its stipends toward Magyar schools. A network of village classrooms could give the mountain valleys a lasting written voice."
 uzh.53.t:0 "Parish Schools of the Enlightenment"
 uzh.54.a:0 "Raise the Palanok gendarmerie"
 uzh.54.b:0 "Parley with the band chiefs"
 uzh.54.d:0 "From spruce-clad Máramaros to the alleys of Uzhhorod, bands of opryshky rally peasants angered by levies, salt monopolies, and gendarme abuses. Their petitions cite the old valach law; their axes and muskets promise to carve justice instead. We can either flood the passes with loyal soldiers or barter an amnesty that risks emboldening the brotherhoods."
 uzh.54.t:0 "Opryshky Stir the Mountains"
 uzh.55.a:0 "Send kuruc patrols through the forests"
 uzh.55.b:0 "Pay them off with salt silver"
 uzh.55.d:0 "A convoy of Solotvyno salt wagons lies ablaze where the road bends toward Khust. Opryshky captains melt into the forest, leaving a warning knifed into a commissioner’s desk: more tithe collectors will hang unless the crown eases its grip."
 uzh.55.t:0 "Ambush in the Salt Pass"
 uzh.56.a:0 "Institutionalise the mountain gendarmerie"
 uzh.56.b:0 "Celebrate the folk heroes"
 uzh.56.d:0 "The last opryshky bands descend to hear our verdict. Some captains accept commissions in Palanok’s watch, others ask only that songs of freedom be left untouched. How we close this chapter will define Máramaros for a generation."
 uzh.56.t:0 "A Quiet Carpathian Dawn"
 uzh.6.a:0 "Organize planned resettlement"
 uzh.6.b:0 "Support settlers with resources"
 uzh.6.d:0 "Our people are growing in number and need new lands. The great migration beckons—[Root.GetUZHIdentityCulturePlural] stand ready to settle new territories in Pannonia."
 uzh.6.t:0 "The Great Migration"
 uzh.7.a:0 "Glory to the [Root.GetUZHIdentityCultureAdjective] people!"
 uzh.7.d:0 "Across our mountain counties and university halls, [Root.GetUZHIdentityCulturePlural] deepen the cultural and educational awakening begun in late eighteenth-century schools and brotherhoods—turning scholarly letters into an enduring civic charter of the realm."
 uzh.7.t:0 "National Revival"
 uzh.8.a:0 "Long live the Rusyn State!"
 uzh.8.d:0 "The Huszt Diet has gathered courts, schools, and frontier estates into a sovereign Rusyn state, forging the cultural awakening of our valleys into an ordered polity before the eyes of Europe."
 uzh.8.t:0 "The Rusyn State"
 uzh.9.a:0 "Fortify the borderlands"
 uzh.9.b:0 "Grant charters to loyal settlers"
 uzh.9.d:0 "Our soldiers and settlers stand at the edge of the plains. Some urge us to fortify every pass and expand the chain of border forts, while others argue for negotiated charters that bind the frontier towns to our cause."
 uzh.9.t:0 "Guarding the Pannonian Frontier"
 UZH_ADJ:0 "Husztian"
 uzh_agriculture_desc:0 "Reorganize the Tysa starosties to terrace vineyards, restore salt granaries, and endow Carpathian farm estates with crown backing."
 UZH_agriculture_pastures_tt:0 "Control at least §Ytwo§! livestock provinces in the Carpathian region."
 uzh_agriculture_title:0 "Agricultural Development"
 uzh_backa_settlements_desc:0 "From 1751, secure a settlement charter with the holder of Bacs, or issue one if we hold it. Rusyn settlers were present in Backa in the 1740s; the organized settlement contract for Ruski Kerestur dates to 1751, followed by Kucura in 1763. Our charter grants communal liberties without requiring conquest."
 uzh_backa_settlements_title:0 "Backa Settlements"
 uzh_banat_colonization_desc:0 "From 1718, establish our southern settlements in Temes and Torontal. Historically, the Treaty of Passarowitz opened a new period of Habsburg administration and colonization in the Banat. Our own Rusyn settlement programme is an alternative regional policy, not a claim that all imperial colonists were Rusyn."
 uzh_banat_colonization_title:0 "Banat Colonization"
 UZH_bartka:0 "Bartka"
 UZH_bartka_desc:0 "Among the Lemkos, the Bartka is not just a tool, but a symbol of pride and strength. A narrow-nosed axe with a blunt hammer on the reverse and a long handle, it serves both as a weapon and a sign of belonging, echoing across the Carpathian peaks with the sound of the trembita."
 uzh_carpathian_border_commissariat_reform:0 "Carpathian Border Commissariat"
 uzh_carpathian_border_commissariat_reform_desc:0 "Crown officers and local nobles have forged a standing commissariat to watch the passes, muster hajduks, and ration the salt mines. Its drilling statutes turn Uzhhorod into the headquarters of the Carpathian cordon."
 UZH_carpathian_fort:0 "Carpathian Fortifications"
 UZH_carpathian_fort_desc:0 "Our mountain builders know how to anchor timber palisades and stone bastions along narrow Carpathian passes. Strengthening those cities will hold any invader at bay."
 UZH_carthpatia_fort:0 "Carpathian Fortresses"
 UZH_carthpatia_fort_desc:0 "The Carpathian mountains provide natural protection for our people. By building fortresses in strategic mountain passes, we can ensure our nation's security."
 UZH_congress_border_bastion_border_req_tt:0 "Border Bulwark Course: Signed the Pannonian Compact, hold §G60%§! manpower reserves, §Y30§! Army Tradition, §G40%§! Professionalism, and three provinces in §YCarpathia§! with Fort Level §Y3§! or higher."
 UZH_congress_border_bastion_border_tt:0 "§YBorder Bulwark Outcome:§! Permanently gain §YBorder Drill§!, receive §Y8,000§! manpower, §Y150§! Military Power, §G+5%§! Army Professionalism, and §G+15§! Army Tradition."
 uzh_congress_border_bastion_desc:0 "Fuse the congress' border drill into a permanent command that keeps fortresses manned and armies ready for any imperial threat."
 UZH_congress_border_bastion_subject_req_tt:0 "Subject League Course: Sustain §Ytwo§! loyal subjects with Subject Charters active and §G+125§! opinion, each below §G45%§! Liberty Desire."
 UZH_congress_border_bastion_subject_tt:0 "§YPan-Ruthenian Outcome:§! Permanently gain §YPan-Ruthenian Union§!, receive §Y125§! Diplomatic Power, §Y40§! Government Reform Progress, and §G+8§! Republican Tradition, §G+10§! Legitimacy, or §G+10§! Devotion based on our government."
 uzh_congress_border_bastion_title:0 "Carpathian Defensive Shield"
 UZH_congress_subject_hegemony_border_req_tt:0 "Begin industrialization, retain at least §Y55%§! manpower and §Y35%§! army professionalism, and own §Ytwo§! Carpathian forts of level §Y2§! or higher."
 UZH_congress_subject_hegemony_border_tt:0 "§YBorder Drill Outcome:§! Gain §YBorder Drill§! for §Y25§! years, receive §Y8,000§! manpower, §Y150§! Military Power, §G+5%§! Army Professionalism, §G+15§! Army Tradition, improve subject opinion if applicable, and gain §Y35§! Government Reform Progress."
 uzh_congress_subject_hegemony_desc:0 "Convert the congress' temporary charters into a binding union of loyal marches, rewarding obedience with lasting privileges."
 UZH_congress_subject_hegemony_subject_req_tt:0 "Have at least §Yone§! subject. Every subject must have at least §G+100§! opinion of us and Liberty Desire below §Y50%§!."
 UZH_congress_subject_hegemony_subject_tt:0 "§YSubject Charter Outcome:§! Permanently gain §YSubject Charters§!, every subject loses §G10§! Liberty Desire and receives the §YGranted Privileges§! opinion bonus, while we gain §Y150§! Diplomatic Power and §Y50§! Government Reform Progress."
 uzh_congress_subject_hegemony_title:0 "Carpathian Patronal Union"
 UZH_consolidate_rusin_authority_desc:0 "We must strengthen our authority over the [Root.GetUZHIdentityCultureAdjective] lands to ensure our people's future."
 UZH_consolidate_rusin_authority_title:0 "Consolidate Rusyn Authority"
 uzh_constitutional_monarchy_desc:0 "Codify the Huszt Statute—an accord between the diet and the prince—that entrenches parliamentary reform, rewards loyal estates, and directs crown authority through written law."
 uzh_constitutional_monarchy_title:0 "Codify the Huszt Statute"
 UZH_constitutional_monarchy_tt:0 "§YConstitutional Framework:§! Permanently gain §YConstitutional System§!, permanently gain §YStatute Codification§!, gain §G15§! Legitimacy, §Y50§! Government Reform Progress, and if the Nobility or Burghers exist they gain §G+10§! loyalty."
 uzh_control_of_pannonia_desc:0 "By controlling the entire Pannonian region, we can establish our dominance and secure our position among the European powers."
 uzh_control_of_pannonia_title:0 "Control of Pannonia"
 uzh_cultural_revival_desc:0 "We must promote [Root.GetUZHIdentityCultureAdjective] culture and ensure its prosperity throughout our lands."
 uzh_cultural_revival_title:0 "Cultural Revival"
 UZH_CULTURE_ADJECTIVE_HUNGARIAN:0 "Carpathian"
 UZH_CULTURE_ADJECTIVE_RUSYN:0 "Rusyn"
 UZH_CULTURE_ADJECTIVE_RUTHENIAN:0 "Ruthenian"
 UZH_CULTURE_PLURAL_HUNGARIAN:0 "Carpathians"
 UZH_CULTURE_PLURAL_RUSYN:0 "Rusyns"
 UZH_CULTURE_PLURAL_RUTHENIAN:0 "Ruthenians"
 UZH_CULTURE_SINGULAR_HUNGARIAN:0 "Carpathian"
 UZH_CULTURE_SINGULAR_RUSYN:0 "Rusyn"
 UZH_CULTURE_SINGULAR_RUTHENIAN:0 "Ruthenian"
 uzh_danube_trade_league_desc:0 "Link our chartered markets from the Upper Tisza to Pest and Petrovaradin, binding them into a riverine league that dominates toll houses and caravans across the Danube plain."
 uzh_danube_trade_league_title:0 "Forge the Danube Trade League"
 UZH_establish_rusin_metropolis_desc:0 "We shall establish a grand metropolis that will serve as the cultural and political center for all [Root.GetUZHIdentityCulturePlural]."
 UZH_establish_rusin_metropolis_title:0 "Establish Rusyn Metropolis"
 uzh_establish_the_presov_eparchy_desc:0 "The northern Rusyn parishes have outgrown a single chancery's reach. Petition Rome to raise a suffragan see at Presov, and let it answer for the valleys Mukachevo can no longer visit each year."
 uzh_establish_the_presov_eparchy_title:0 "Establish the Presov Eparchy"
 UZH_expand_into_pannonia_desc:0 "The fertile plains of Pannonia are crucial for our nation's growth and prosperity."
 UZH_expand_into_pannonia_title:0 "Expand into Pannonia"
 UZH_federalization_authority_tt:0 "§YFederal Settlement:§! Gain §G+15§! Legitimacy, §G+8§! Republican Tradition, or §G+15§! Devotion, according to our government."
 UZH_federalization_common_tt:0 "§YFederal Mandate:§! Permanently gain §YFederal Structure§!, every subject loses §G10§! Liberty Desire, and we gain §Y75§! Government Reform Progress."
 uzh_federalization_desc:0 "Extend the Pannonian compact into a composite federation across ten Carpathian provinces in states, each holding our primary or an accepted culture and either 10 development or a parliamentary seat, bound by mutual estate charters."
 UZH_federalization_subjects_tt:0 "All subjects must have §YLiberty Desire§! below §Y60§!."
 uzh_federalization_title:0 "Federalization"
 uzh_federative_statutes_desc:0 "Publish federative statutes binding loyal subjects and multilingual chanceries into a chartered Carpathian federation of estates and crownlands."
 UZH_federative_statutes_loyal_subjects_tt:0 "Maintain at least §Ytwo§! subjects with Liberty Desire under §G50%§!."
 UZH_federative_statutes_reward_tt:0 "§YFederative Statutes:§! Monarchies and theocracies gain §G+200§! Governing Capacity, republics enjoy §G-5%§! Autonomy Change Time, each subject loses §G10§! Liberty Desire, and we gain §Y75§! Government Reform Progress."
 uzh_federative_statutes_title:0 "Federative Statutes"
 UZH_free_trade:0 "Unrestricted Trade"
 UZH_free_trade_desc:0 "Chartered mountain fairs and low toll barriers draw merchants across the Carpathian passes into our market towns."
 uzh_granichar_districts_desc:0 "Reform the Carpathian forts into permanent granichar districts, blending Military Frontier drill with Rusyn captaincies to anchor the passes."
 uzh_granichar_districts_title:0 "Granichar Districts"
 UZH_great_migration_culture_tt:0 "§YCarpathian Compact:§! Own §Y8§! Carpathian provinces of your chosen culture, hold §Y4§! federalized Carpathian provinces, or maintain §Y3§! core Carpathian provinces backed by an East Slavic ally or Hungarian pact at §G+100§! opinion."
 UZH_hungarian_protection_charter_tt:0 "The estates will hear the terms of the charter. Accept court advisers and closer ties with the patron, or reserve appointments for the estates."
 UZH_hungarian_protection_option_a_tt:0 "§YHungarian Tutelage Outcome:§! Keeps §YAdvisor Pool§! for §Y15§! years, grants §G50§! Diplomatic Power, and improves the royal patron's opinion at the cost of §R-5§! Legitimacy or §R-3§! Republican Tradition."
 UZH_hungarian_protection_option_b_tt:0 "§YLocal Autonomy Outcome:§! Grants §G100§! Diplomatic Power and §G20§! Government Reform Progress at the cost of §R-10§! Prestige."
 UZH_Huszt_Name:0 "Khust"
 UZH_Huszt_Name_ADJ:0 "Khustian"
 UZH_ideas:0 "Husztian Ideas"
 UZH_ideas_bonus:0 "Husztian Ambitions"
 UZH_ideas_start:0 "Husztian Traditions"
 uzh_identity.1.a:0 "Follow the wider Ruthenian course"
 uzh_identity.1.b:0 "Follow an autonomous Carpathian course"
 uzh_identity.1.c:0 "Follow the Uhro-Rusyn crown course"
 uzh_identity.1.d:0 "Our estates stand before a crossroads of law and allegiance. Although cultural awakenings in our valleys first stirred within late eighteenth-century schools and seminaries rather than sovereign diets, Palanok now decides which charter will govern the realm: align [Root.GetUZHIdentityCulturePlural] with the wider Ruthenian patrimony, cultivate an autonomous Carpathian march, or anchor our liberties within the Hungarian crown."
 uzh_identity.1.t:0 "The Question of Our Name"
 uzh_identity.2.a:0 "Our rite shall unite all [Root.GetUZHIdentityCulturePlural]!"
 uzh_identity.2.d:0 "Having chosen the Ruthenian course, our chancery and clergy cast the march as part of a broader Ruthenian world and organize a metropolitan network in the state rite."
 uzh_identity.2.t:0 "Ruthenian Revival"
 uzh_identity.3.a:0 "Our old liberties are our strength!"
 uzh_identity.3.d:0 "Having chosen the autonomous Carpathian course, our chartered communes expand local courts and county self-rule under the Huszt settlement, entrusting the valleys to estate custom and municipal privilege."
 uzh_identity.3.t:0 "Rusyn Autonomy"
 uzh_identity.4.a:0 "Together with the Hungarians, we are stronger!"
 uzh_identity.4.d:0 "Having chosen the Uhro-Rusyn course, our estates weave Rusyn parish custom into Hungarian komitat law as a loyal constitutional partner of the crown."
 uzh_identity.4.t:0 "Uhro-Rusyn Loyalty"
 UZH_identity_question_culture_tt:0 "§YAllegiance Threshold:§! Control at least §Y5§! provinces of the people you have chosen before convening the congress."
 UZH_industrial_coal_tt:0 "Own at least §Y1§! province producing §YCoal§! (such as neighboring Hunyad, Somogy, or Lviv), or own at least §Y2§! §YCarpathian§! provinces producing §YIron§!, §YCopper§!, §YSalt§!, or §YNaval Supplies§! with a §YManufactory§!."
 uzh_industrial_revolution_desc:0 "Harness our salt galleries, timber mills, and mountain forges into chartered manufactories supplying Huszt's treasuries."
 uzh_industrial_revolution_title:0 "Mountain Manufactories"
 uzh_komitat_captains_party_tt:0 "The captaincy balance stands at least §Y70§! toward the §YCaptains' Party§!, or the chamber scale is inactive."
 uzh_komitat_system_desc:0 "Replace the Palanok captaincy with elected komitat estates, binding nobles to Huszt's statutes while fitting the march into St. Stephen's code."
 uzh_komitat_system_reform:0 "Komitat Estates"
 uzh_komitat_system_reform_desc:0 "The fortress-centred captaincy gives way to elected komitat estates. County deputies supervise taxation and musters, widening representation while binding nobles to the march's statutes."
 uzh_komitat_system_title:0 "Komitat System"
 uzh_launch_colonization_wave_desc:0 "Fund a wave of settlers to reshape the Carpathian or Pannonian marches under Huszt statutes."
 uzh_launch_colonization_wave_title:0 "Launch Rusyn Colonization"
 UZH_laws:0 "Laws of the Upper Tisza"
 UZH_laws_desc:0 "Adapt town law and local custom into a common charter for the Upper Tisza valleys. Khust, Uzhhorod and Mukachevo are distinct towns; our regional institutions draw on all three."
 UZH_mount_faith:0 "Carpathian Mountain Faith"
 UZH_mount_faith_desc:0 "The unique geographic isolation of the Carpathian mountains has fostered religious tolerance among our people."
 UZH_mountain_faith:0 "Mountain Faith"
 UZH_mountain_faith_desc:0 "Amid our forested peaks and highland parishes, ancestral faith endures through liturgy, old hymns, and pious custom handed down from father to son."
 uzh_mukachevo_eparchy_reform:0 "Eparchial See of Mukachevo"
 uzh_mukachevo_eparchy_reform_desc:0 "Freed from Eger's tutelage, the Bishop of Mukachevo now holds the crozier and the seal both, ruling parishes and palanoks from the same chancery. No secular house stands behind the throne to answer for a bad harvest."
 uzh_national_consciousness_desc:0 "By binding our parishes, mountain counties, and chartered towns under common statutes, we quiet factional strife across the valleys."
 uzh_national_consciousness_title:0 "One Rusyn Commonwealth"
 uzh_opryshky_uprising:0 "Opryshky Uprising"
 uzh_opryshky_uprising_desc:0 "Mountain brotherhoods born of valach charters and salt smugglers now hoist banners in Máramaros. If the state squeezes the passes too hard, opryshky chiefs will rouse peasants, deserters, and guildsmen into a revolt that bleeds caravans dry."
 uzh_opryshky_uprising_title:0 "Opryshky Uprising"
 UZH_orthodox_unity_culture_tt:0 "§YRuthenian Rite Network:§! Own §Y8§! provinces of your state religion and chosen culture, or hold §Y3§! such provinces alongside an East Slavic ally."
 uzh_palanok.1.a:0 "Keep the watch on the crests."
 uzh_palanok.1.b:0 "Send the levy home and buy horses."
 uzh_palanok.1.d:0 "The new curtain wall closes the road under Palanok, and with it the Verecke and Uzhok passes. The castle captains ask for a standing watch on the crests. The counties would rather the men came home for the harvest and the crown bought horses instead."
 uzh_palanok.1.t:0 "The Keys to the Passes"
 uzh_palanok.2.a:0 "Set the crown's toll at the water stair."
 uzh_palanok.2.b:0 "Leave the wharf to the town."
 uzh_palanok.2.d:0 "Solotvyno salt comes down the Tisza past Palanok, and ours is now the only lockable roof on the road. The chamber wants a toll gate at the water stair. Mukachevo's council answers that the town built the wharf and should keep what crosses it."
 uzh_palanok.2.t:0 "The Salt Road"
 uzh_palanok.3.a:0 "Seat the diet in the hall."
 uzh_palanok.3.b:0 "Clear it for the arsenal."
 uzh_palanok.3.d:0 "The hall under the new roof is the largest room between the Tisza and the Danube. The counties want their diet seated in it. The captains want it cleared for powder and shot, and say that a room full of speeches has never held a pass."
 uzh_palanok.3.t:0 "The Great Hall"
 uzh_palanok_captaincy_reform:0 "Palanok Captaincy"
 uzh_palanok_captaincy_reform_desc:0 "The Palanok fortress above Mukachevo anchors our frontier. A chartered captaincy shares command between the castle captains and the Sejm of merchants and county elders, and the scale between the two parties decides whose habits the realm keeps. Victories and walls move it toward the captains, tolls and town charters toward the Sejm, and every election lets us lean it either way."
 uzh_palatial_reform_desc:0 "Seat subject envoys in the palatine chambers and standardise parliamentary procedure so debates no longer bankrupt our federated estates."
 UZH_palatial_reform_subject_seats_tt:0 "§YPalatine Chambers:§! Assign at least §Y5§! parliamentary seats to §YCarpathian§! provinces inside the federation."
 UZH_palatial_reform_reward_tt:0 "Immediately enacts the §YTier 10§! palatine government reform for our chosen political course. The §YUgro-Rusyn§! monarchy and republic reforms include §R-10%§! Governing Capacity and §R+5%§! Technology Cost alongside their benefits."
 uzh_palatial_reform_title:0 "Palatine Reform"
 uzh_palatial_rusyn_identity_req_tt:0 "Allegiance not yet chosen: choose the Rusyn civic path."
 uzh_palatial_rusyn_reform:0 "Municipal Palatine Pact"
 uzh_palatial_rusyn_reform_desc:0 "Rusyn burghers codify a municipal palatine pact, setting a steady rhythm for city councils while a shared registry keeps new statutes gliding through the chancery."
 uzh_palatial_ruthenian_identity_req_tt:0 "Allegiance not yet chosen: choose the Ruthenian Congress path."
 uzh_palatial_ruthenian_reform:0 "Ruthenian Palatine Compact"
 uzh_palatial_ruthenian_reform_desc:0 "Ruthenian deputies, marcher nobles, and chartered towns share the palatine chambers, turning this Ruthenian settlement into a federal court with a stronger diplomatic voice."
 uzh_palatial_uhro_identity_req_tt:0 "Allegiance not yet chosen: choose the Ugro-Rusyn crown path."
 uzh_palatial_uhro_reform:0 "Crown Palatine Protectorate"
 uzh_palatial_uhro_reform_desc:0 "Palatines, komitat deputies, and frontier officers codify the laws inherited from the Crown of Saint Stephen, grounding dynastic legitimacy and noble service in the historic liberties of the march."
 uzh_palatial_uhro_republic_reform:0 "Komitat Palatine Commonwealth"
 uzh_palatial_uhro_republic_reform_desc:0 "Komitat deputies and frontier officers codify the laws inherited from the Crown of Saint Stephen as a republican palatine commonwealth, grounding elected magistrates in the historic liberties of the march."
 UZH_pan_congress_carpathia_tt:0 "§YCarpathian Delegations:§! Hold §Y1§! province of your chosen culture in the Carpathia region."
 UZH_pan_congress_poland_tt:0 "§YPolish Delegations:§! Hold §Y1§! province of your chosen culture in the Poland region."
 UZH_pan_congress_ruthenia_tt:0 "§YRuthenian Delegations:§! Hold §Y3§! provinces of your chosen culture in the Ruthenia region."
 UZH_pan_congress_steppe_tt:0 "§YSteppe Delegations:§! Hold §Y1§! province of your chosen culture in the Lower Dniepr or Azov frontier."
 uzh_pannonian_ambitions_desc:0 "The fertile lands of Pannonia have been coveted by many nations throughout history. We must establish our presence in this region to secure our future."
 uzh_pannonian_ambitions_title:0 "Pannonian Ambitions"
 uzh_pannonian_capital_desc:0 "Establishing a grand capital in Pest will solidify our rule over the Pannonian Basin and demonstrate our power to all of Europe."
 uzh_pannonian_capital_title:0 "Pannonian Capital"
 UZH_pannonian_compact_government_tt:0 "Either govern as a republic or eparchial theocracy, or complete the §YCodify the Huszt Statute§! mission to adapt the compact for monarchic rule."
 UZH_pannonian_expansion_culture_tt:0 "§YAt least three§! owned provinces in the §YAlföld§! area must match our chosen Rusyn custom."
 uzh_pannonian_expansion_desc:0 "Consolidate all four Alfold provinces and our foothold in southern Transylvania. Reward the settled Alfold with production development and press claims on the remaining lands of Slavonia."
 uzh_pannonian_expansion_title:0 "Pannonian Expansion"
 uzh_pannonian_frontier_desc:0 "Secure the passes and river fords of northern Transylvania and Slovakia. Our claims extend to the remaining lands of these two areas; expansion into the Pannonian plain follows a later settlement programme."
 uzh_pannonian_frontier_title:0 "Pannonian Frontier"
 uzh_pannonian_republic_desc:0 "Bind frontier communes and komitats into a Pannonian compact through twelve core Carpathian provinces, six federalized lands, or cooperative charters with Hungary or East Slavic allies."
 UZH_pannonian_republic_foundation_tt:0 "§YPannonian Compromise:§! Permanently gain §YPannonian Autonomy§! and §YCarpathian Hegemony§!, receive §YPannonian League§! for §Y25§! years and §YBorder Guard Union§! for §Y15§! years, gain §G6,000§! manpower, and §Y50§! Government Reform Progress."
 UZH_pannonian_republic_reform_choice_tt:0 "§YGovernment Outcome:§!\n- If a republic: gain §G+12§! Republican Tradition and, if the Burghers exist, §G+10§! loyalty.\n- If a monarchy: gain §G+15§! Legitimacy and, if the Nobility exists, §G+10§! loyalty.\n- Otherwise: gain §G+1§! Stability and, if the Clergy exists, §G+10§! loyalty."
 uzh_pannonian_republic_title:0 "Pannonian Compact"
 UZH_protect_rusin_heritage_desc:0 "[Root.GetUZHIdentityCultureAdjective] culture and traditions must be preserved and celebrated across our territories."
 UZH_protect_rusin_heritage_title:0 "Protect [Root.GetUZHIdentityCultureAdjective] Heritage"
 uzh_raise_serdyuk_host_desc:0 "Summon loyal frontier fighters as disciplined Hajduk foot companies or mountain opryshky patrols, expending military command and drill to keep seasoned companies in arms."
 uzh_raise_serdyuk_host_title:0 "Raise the Hajduk Host"
 uzh_republican_komitat_system_reform:0 "Republican Komitat Estates"
 uzh_republican_komitat_system_reform_desc:0 "Elected komitat delegates supervise taxation and musters through a republican land assembly, binding county liberties to the statutes of the march."
 UZH_resist_habsburgs_base_tt:0 "Gain §YBorder Patronage Network§! for §Y25 years§! and §G100§! Diplomatic Power. The estates then meet at Palanok to settle the defence of the frontier."
 UZH_resist_habsburgs_habsburg_tt:0 "§YHabsburg Patron Outcome:§! Gain §G20§! Prestige, §G10§! Legitimacy or §G5§! Republican Tradition, and §G+5§! Army Tradition if we accept Habsburg protection."
 UZH_resist_habsburgs_neighbor_tt:0 "§YDiplomatic partner§! — Our chosen ally, guarantor or friendly neighbour gains the §YBorder Dynasty Guarantees§! opinion modifier toward us. We gain §G10§! Prestige."
 UZH_resist_habsburgs_overlord_tt:0 "§YOverlord Patron Outcome:§! If we side with our overlord, reduce §YLiberty Desire§! by §G15§! and, while we remain a subject, improve their opinion with §YGranted Privileges§!."
 UZH_resist_habsburgs_pressure_tt:0 "As a subject, reach §Y60%§! Liberty Desire. As an independent country, meet any one of these conditions:\n- A neighbouring monarchy with at least §Y150§! development names us as a rival.\n- A country with at least §Y150§! development allies with us or guarantees our independence.\n- Field §Y90%§! of our land force limit, retain §Y50%§! manpower and own a §YCarpathian§! fort of level §Y2§! or higher."
 UZH_revival_core_culture_tt:0 "§YPalanok Statutes:§! Own §Y12§! Carpathian provinces of your chosen culture, maintain §Y6§! federalized Carpathian provinces, or hold §Y4§! core Carpathian provinces backed by an East Slavic partner or Hungarian pact at §G+125§! opinion."
 UZH_revival_komitat_condition_tt:0 "Complete the §YKomitat System§! mission or hold the Komitat Estates reform."
 uzh_road_of_the_eparchy_desc:0 "The Union of Uzhhorod bound our priests to Rome; let it bind the crown to the bishopric as well, so the see at Mukachevo answers to no synod in Eger and no diet needs answer to it either. Every appointment still goes through Rome by petition, not through this chancery's own list."
 uzh_road_of_the_eparchy_title:0 "Raise the Eparchial See"
 UZH_roads:0 "Roads of the Carpathian March"
 UZH_roads_desc:0 "Connect Khust's salt routes, Mukachevo's markets and Uzhhorod's western approaches. Their separate roads form one regional network between the mountain passes and the Danubian plain."
 UZH_rusin_language_culture_tt:0 "§YStandardize the Tongue:§! Own at least §Y5§! provinces of your chosen culture."
 UZH_rusin_nobility_court_tt:0 "§YJudicial Grants:§! Control §Y5§! provinces of your chosen culture that host a Courthouse or its successors."
 uzh_rusin_nobility_desc:0 "Ennoble Rusyn magistrates and border captains, trading court benches and tax farms for loyal service in the Carpathian passes."
 uzh_rusin_nobility_title:0 "Rusyn Nobility"
 uzh_salt_corridors_desc:0 "Standardise salt barns and wine depots from Solotvyno to the Pest quays so every convoy marches under our counters and customs seals."
 UZH_salt_corridors_pest_share_tt:0 "§YDominate the Pest trade:§! We must be the strongest trade power in the Pest node."
 uzh_salt_corridors_title:0 "Salt Corridors"
 uzh_sg_captains_15_tt:0 "The scale of the captaincy moves §Y15§! toward the §YCaptains' Party§!."
 uzh_sg_captains_20_tt:0 "The scale of the captaincy moves §Y20§! toward the §YCaptains' Party§!."
 uzh_sg_sejm_15_tt:0 "The scale of the captaincy moves §Y15§! toward the §YSejm Party§!."
 uzh_sg_sejm_20_tt:0 "The scale of the captaincy moves §Y20§! toward the §YSejm Party§!."
 UZH_smereka:0 "Our Smereka Trees"
 UZH_smereka_desc:0 "Dense Carpathian spruce forests shelter our mountain passes, supplying seasoned timber while hindering invading armies."
 uzh_solotvynska_camera_desc:0 "Two years after launching the agricultural programme, establish a salt chamber at Solotvyno. Equip Maramaros with a workshop and courthouse or their upgrades, raise base production to six, and invest 150 ducats in the chamber's ledgers, scales and salaried clerks."
 UZH_solotvynska_camera_reward_tt:0 "Every owned §Ysalt§! province in the §YCarpathia§! region gains §YSolotvyno Chambers§! for §Y10 years§!."
 UZH_solotvynska_camera_salt_tt:0 "Own §YMaramaros§! (Solotvyno), producing §Ysalt§!, with at least §Y6§! base production, a §Yworkshop§! and a §Ycourthouse§! (or their upgrades)."
 uzh_solotvynska_camera_title:0 "Solotvynska Camera"
 uzh_srem_metropolis_desc:0 "From 1713, establish a metropolitan see of our state rite in Srem. The historical Metropolitanate of Karlovci belonged to the Serbian Orthodox tradition, following the migration of 1690; Greek Catholic communities in Backa later came under Krizevci (1777). Bringing a Srem see under Khust is our alternative political and ecclesiastical settlement."
 uzh_srem_metropolis_title:0 "Srem Metropolis"
 UZH_strengthen_eastern_frontier_desc:0 "Our eastern borders are vulnerable to attacks. We must fortify the Carpathian passes to protect our [Root.GetUZHIdentityCultureAdjective] homeland."
 UZH_strengthen_eastern_frontier_title:0 "Strengthen Eastern Frontier"
 UZH_this_is_a_branching_mission:0 "The council at Palanok must choose one of the three political and cultural courses before this branch can open."
 uzh_tisza_customs_convention_desc:0 "Broker a customs convention along the Upper Tisza so Pest, Mukachevo, and the downstream trade hubs of Wien or Kraków treat our convoys as one tariff space."
 uzh_tisza_customs_convention_title:0 "Tisza Customs Convention"
 UZH_tisza_customs_downstream_tt:0 "§YSecure downstream outlets:§! Be the strongest trade power in either the Wien or Kraków trade node."
 UZH_tisza_customs_pest_tt:0 "§YDominate Pest:§! Be the strongest trade power in the Pest node."
 UZH_tisza_customs_reward_tt:0 "Eligible markets in Carpathia, Alföld, and Slavonia gain §Y“Tisza Customs Depot”§! for §Y10 years§!."
 uzh_trade_routes_desc:0 "Bind the wine roads of the Alföld and Slavonia to Huszt's customs houses, steering merchants so our node commands the Danube tolls."
 uzh_trade_routes_title:0 "Trade Routes"
 uzh_translate_the_episcopal_seat_desc:0 "Mukachevo Castle has housed the bishop since the see first answered for itself. Move the chancery and the bishop's own residence into Uzhhorod, and found a seminary there to train the parish clergy at home rather than abroad."
 uzh_translate_the_episcopal_seat_title:0 "Translate the Episcopal Seat"
 uzh_union_synod_reform:0 "Union Synod of Uzhhorod"
 uzh_union_synod_reform_desc:0 "The synod at Uzhhorod bound our priests to Rome while leaving them the Byzantine rite, and the chancery has since learned to answer to a Latin bishop in Eger and a Slavonic parish in the same week."
 uzh_unity_of_rusin_desc:0 "All [Root.GetUZHIdentityCulturePlural] should be united under our leadership. We shall reclaim our ancestral lands and protect our cultural heritage."
 uzh_unity_of_rusin_title:0 "Unity of Rusin"
 UZH_Zakarpattia_Name:0 "Carpathian Rus'"
 UZH_Zakarpattia_Name_ADJ:0 "Carpathian"
 ZAKARPATTIA_CULTURAL_MOSAIC:0 "Zakarpattian Cultural Mosaic"
 ZAKARPATTIA_FRONTIER_GUARD:0 "Zakarpattian Frontier Guard"
 ZAKARPATTIA_HISTORICAL_OVERVIEW:0 "Carved between the Carpathian ridgelines and the Tysa, Carpathian Rus' bridges crowns and confessions alike. From the Koriatovych princes to the Habsburg frontier captains, its march towns learned to bargain, fortify, and pray in many tongues."
 ZAKARPATTIA_TRADE_NETWORK:0 "Zakarpattian Caravan Network"
