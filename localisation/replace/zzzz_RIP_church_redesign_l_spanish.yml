 rip_church_icon_mission:0 "Muscovite Mission"
 rip_church_icon_mission_action:0 "[Root.GetChurchIconMissionAction]"
 rip_church_icon_mission_action_tt:0 "§YMuscovite Mission§!\nSettled provinces of another faith, Orthodox ones excluded: §G+2% local missionary strength§!. It opens the funding of mission nodes, which pay Fervor; closing it closes every node. It needs §Y20 Fervor§! in the pool: 10 to start it and 10 to found the first node.\nCosts §Y10 Fervor§! to start and §R3 Fervor§! a month to keep. Reactivation only after a year; closing it refunds nothing.\n[Root.GetChurchIconMissionAccess]"
