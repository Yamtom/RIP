 rip_church_ro_network_tt:0 "§WMission nodes§!\nA funded node plants monastic trade courtyards in a trade node: §G+3 Fervor§! a month, and in your parishes there that have a temple or cathedral §G+20% trade power§! and §G+1% missionary strength§!.\nIt costs §Y10 Fervor§! once. One node is allowed; two at 65% Patriarch Authority, regardless of communion. Below 65%, monthly maintenance closes excess nodes. The first node pays for Mission: +3 income minus 3 upkeep, leaving authority income. It needs the Mission policy."
