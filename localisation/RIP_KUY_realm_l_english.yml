l_english:
 KUY:0 "Kuyaba"
 KUY_ADJ:0 "Kuyabian"
 KUY_ideas:0 "Kuyabian Ideas"
 KUY_ideas_start:0 "Kuyabian Traditions"
 KUY_ideas_bonus:0 "Kuyabian Ambitions"
 KUY_magdeburg_guilds_title:0 "Podil Akhi Guilds"
 KUY_magdeburg_guilds_desc:0 "Below Kyiv's upper town, the wharves and workshops of Podil link northern river boats to Pontic caravans. Organizing the riverside crafts into Podil guilds and Akhi merchant brotherhoods settles weights, credit, and caravan lodgings under our own seal rather than German town law."
 KUY_granary_of_steppe_title:0 "Granary of the Steppe"
 KUY_granary_of_steppe_desc:0 "Reconciling sedentary farmers along the Dnieper with steppe caravaneers unlocks vast harvests of chernozem wheat. Storing and shipping this grain turns Kuyaba into a vital supplier across Pontic and Mediterranean markets."
 KUY_dnieper_crossings_title:0 "Across the Dnieper"
 KUY_dnieper_crossings_desc:0 "With the right bank secured beneath Kyiv's citadel, Kuyaba's banners must cross the Dnieper to unite the meadows of Pereiaslav and Poltava and safeguard the northeastern approaches."
 KUY_steppe_caravans_title:0 "Steppe Caravans"
 KUY_steppe_caravans_desc:0 "Rather than abandoning the lower Dnieper to raiding corridors, Kuyaba's amirs and merchant syndics fortify waystations across Yedisan, Zaporozhia, and Crimea so livestock drovers and silk-road caravans move under one peace."
 KUY_restore_kuyaba_title:0 "Restore Kuyaba"
 KUY_restore_kuyaba_desc:0 "Arabic geographers wrote of Kuyaba on the Dnieper long before Kyiv's princes turned away the Volga Bulgar preachers over the cup. Holding the upper town and the river crossings again puts that old chronicle bargain to a new test."
 KUY_crimean_gates_title:0 "Crimean Gates"
 KUY_crimean_gates_desc:0 "Controlling the Crimean peninsula and the Azov mouths gives Kuyaba mastery of the northern Black Sea ports and the river exits of the Don and Dnieper."
 KUY_sultanate_of_rus_title:0 "Khaganate of Rus'"
 KUY_sultanate_of_rus_desc:0 "Metropolitan Ilarion addressed Volodymyr and Yaroslav as kagan, and inscriptions scratched into the plaster of Saint Sophia still ask heaven to spare our kagan. With Kyiv, the steppe roads, and the Pontic ports under one seal, the court revives the title of Khagan of Rus' rather than borrowing a sultanate or tsardom."
 KUY_black_sea_fleet_title:0 "Black Sea Fleet"
 KUY_black_sea_fleet_desc:0 "No sovereign of the lower Dnieper can rest secure without galleys and frigates shielding its estuaries. Launching a war fleet from our Pontic harbors projects Kuyabian sea power toward the Bosporus."
 KUY_bosporus_straits_title:0 "Bosporus Straits"
 KUY_bosporus_straits_desc:0 "Whether through bold conquest of the imperial straits or an enduring commercial entente with the holder of the Queen of Cities, Kuyabian merchants claim direct passage between the Dnieper basin and Mediterranean ports."
 kuy_magdeburg_guilds_modifier:0 "Podil Akhi Guilds"
 desc_kuy_magdeburg_guilds_modifier:0 "Craft guilds and Akhi merchant brotherhoods along Kyiv's Podil wharves regulate workshops, weights, and caravan lodgings across Kuyaba."
 kuy_steppe_granary:0 "Kuyabian Grain Granaries"
 desc_kuy_steppe_granary:0 "Protected black-earth estates feed both Kuyaba's cities and Pontic merchant fleets."
 kuy_steppe_caravans_modifier:0 "Pontic Caravan Peace"
 desc_kuy_steppe_caravans_modifier:0 "Fortified steppe stations keep Dnieper-Crimean caravan roads open and profitable."
 kuy_black_sea_fleet_modifier:0 "Kuyabian Pontic Fleet"
 desc_kuy_black_sea_fleet_modifier:0 "Light galleys and river corsairs guard Kuyaba's estuaries and sea lanes."
 kuy_sultanate_of_rus_modifier:0 "Khaganate of Kuyaba"
 desc_kuy_sultanate_of_rus_modifier:0 "The Khagan's seal binds Kyiv's chancery and the Pontic frontier without borrowing the style of Moscow or the Porte."
 KUY_every_grain_province_tt:0 "Every owned province producing §YGrain§! with a production building receives §YKuyabian Grain Granaries§! for §Y20 years§!."
 kuy_steppe_grain:0 "Kuyabian Steppe Grain"
 kuy_flavor.1.t:0 "The Cup and the Chronicle"
 kuy_flavor.1.d:0 "The chronicle's story of 986 still makes the rounds of Podil: when Volga Bulgar envoys preached Islam to Volodymyr, the prince sent them home saying that drinking was the joy of the Rus' and that they could not live without it. Now the qadis demand that Kyiv's mead-cellars and taverns be sealed under the law, while the Podil elders remind the Khagan that older courts taxed what they could not stamp out."
 kuy_flavor.1.a:0 "Seal the cellars; enforce the law."
 kuy_flavor.1.b:0 "Tax the mead-cellars as before."
 kuy_sober_statutes:0 "Sober Statutes of Kyiv"
 desc_kuy_sober_statutes:0 "The qadis' prohibition is enforced across Kyiv's taverns and mead-cellars, hardening discipline at the cost of grumbling in Podil."
 kuy_mead_excise:0 "Podil Mead Excise"
 desc_kuy_mead_excise:0 "Rather than closing every cellar on the riverfront, the chancery quietly taxes the old mead trade to keep Kyiv's non-Muslim townsmen at peace."
