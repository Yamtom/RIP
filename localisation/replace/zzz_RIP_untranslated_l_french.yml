 chr_western_frontier_chronicle:0 "Western Frontier Chronicle"
 chumak_nobility_reform:0 "Chumak Nobility"
 chumak_nobility_reform_desc:0 "The chumaks are the Ruthenian and Cossack salt traders who have amassed great wealth and power through their caravans. Elevating them into the nobility will flood our courts with new silver, even if old guilds bristle at their privileges."
 chumak_routes:0 "Chumak Routes"
 chumak_salt_extraction:0 "Chumak Salt Extraction"
 chumak_salt_extraction_desc:0 "Intensive salt extraction and trade through chumak caravans."
 chumak_salt_trade:0 "Chumak Salt Trade"
 chumak_salt_trade_desc:0 "Organized caravans of ox-carts transport salt from the southern steppes."
 church_property_conflict:0 "Church Property Conflict"
 church_property_conflict_desc:0 "Confiscations enrich the crown but inflame religious tensions."
 church_property_restored:0 "Church Property Restored"
 church_property_restored_desc:0 "Disputed church lands are restored to calm the Orthodox population, at fiscal cost."
 coastal_raid:0 "Coastal Raid"
 collegia_influence:0 "Russian Collegia Influence"
 collegium_administration:0 "Collegium Administration"
 collegium_administration_desc:0 "The Little Russian Collegium oversees our administration."
 competitive_hetman_elections:0 "Competitive Hetman Elections"
 conquered_khanate:0 "Conquered Khanate"
 conquered_khanate_desc:0 "The recent conquest of this khanate has caused significant unrest among the local population."
 conquest_of_constantinople:0 "Conquest of Constantinople"
 conquest_of_pagan_lands:0 "Conquest of Pagan Lands"
 considerable_bloodline_reform:0 "Unbroken Dynasty"
 considerable_bloodline_reform_desc:0 "Establishing a constant line of succession can near eliminate dynastic struggle and allow us to foster even greater rulers."
 contest_ottoman_dniester_control_desc:0 "The Ottoman Empire's control of the Dniester Estuary denies us access to vital Black Sea trade routes. We must prepare to reclaim this strategic region."
 contest_ottoman_dniester_control_title:0 "Contest Ottoman Control of Dniester"
 convert_to_greek_catholic_decision_desc:0 "We can embrace the Greek Catholic faith, combining Orthodox traditions with Catholic unity under papal authority. This synthesis may appeal to both Orthodox and Catholic populations."
 convert_to_greek_catholic_decision_title:0 "Convert to Greek Catholic Faith"
 convert_to_russian_orthodox_decision_desc:0 "We can embrace the Russian Orthodox faith and Third Rome doctrine, positioning ourselves as leaders of Orthodox world."
 convert_to_russian_orthodox_decision_title:0 "Embrace Third Rome Orthodoxy"
 cos_and_het_reform:0 "Cossack-Hetmanate Union"
 cos_and_het_reform_desc:0 "This reform establishes a dual system of government, where the Cossacks have autonomy over their own affairs and the Hetmanate rules the rest of the country."
 cossack_chaiky_raids:0 "Chaiky Raids"
 cossack_freed_slaves:0 "Freed Captives Join"
 cossack_freed_slaves_desc:0 "Our chaiky raids liberated captives who now bolster our ranks and crews."
 cossack_frontier_settlement:0 "Cossack Frontier Settlement"
 cossack_frontier_settlement_desc:0 "A new Cossack settlement on the frontier."
 cossack_host:0 "The Host of the Cossacks"
 cossack_host_desc:0 "The Cossacks of Zaporozhia founded, managed, and protected the state, relying on these fearless horsemen in every aspect of their existence, giving freely. We don't have to pay our Cossacks in money, but other forms of warfare come at a price, which is exacerbated by our tense relations with neighboring imperialists."
 cossack_host_naming_desc:0 "Cossack military formations were organized as 'Hosts' (Viiska/Voyska), reflecting their nature as permanent armed societies rather than traditional states. Major Hosts included the Zaporozhian, Don, Kuban, and Terek Hosts."
 cossack_host_proclaimed:0 "Cossack Host Proclaimed"
 cossack_mercenary_contract:0 "Cossack Mercenary Contract"
 cossack_military_aid:0 "Cossack Military Aid"
