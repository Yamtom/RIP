 wr_west_ruthenian_distinctiveness:0 "Registros cancillerescos y parroquiales propios"
 desc_wr_west_ruthenian_distinctiveness:0 "Tribunales locales, ciudades de Magdeburgo y escritorios guardan actas, testamentos y homilías vernáculas al margen de los prikazy moscovitas."
 wr_chancery_prosta_mova_tradition:0 "Cancillería vernácula aforada"
 desc_wr_chancery_prosta_mova_tradition:0 "Siguiendo la prosta mova gran ducal, el giro vernáculo de Peresopnytsia y los evangelios didácticos carpáticos, los escribanos protegen su propio registro jurídico y literario."
 wr_west_ruthenian_commonwealth:0 "Esfera cultural rutena separada"
 desc_wr_west_ruthenian_commonwealth:0 "Imprentas, estatutos legales y academias de cofradías anclan a bielorrusos (bielaruski), rutenos (ruskyi) y rusnaks (rusnacky) en un grupo ruteno propio fuera de Moscú."
 wr_west_ruthenian_statute_autonomy:0 "Autonomía estatutaria y estauropégica"
 desc_wr_west_ruthenian_statute_autonomy:0 "Inspirados por los Estatutos gran ducales, las garantías provinciales de 1569 para la escritura rutena en Volhynia, Kyiv y Bratslav, y el ius Valachicum carpático, los estamentos defienden su ámbito legal."
 wr_west_slavic_cultural_affinity:0 "Órbita cívica eslava occidental compartida"
 desc_wr_west_slavic_cultural_affinity:0 "Cabildos bilingües, congregaciones universitarias de Kraków y Praga y cartas urbanas acercan los estamentos urbanos a vecinos polacos, checos y eslovacos."
 wr_west_slavic_shared_script_space:0 "Circuito bilingüe de imprenta y derecho"
 desc_wr_west_slavic_shared_script_space:0 "Libreros, seminarios y dietas nobiliarias difunden glosas latinas, escritos en lacinka y prensas de Kraków y Trnava entre parroquias."
 wr_west_slavic_synthesis:0 "Síntesis cívica eslava occidental"
 desc_wr_west_slavic_synthesis:0 "A semejanza de Lusacia, Silesia y Eslovaquia oriental, concejos bilingües y cancillerías consuman un raro paso hacia la familia eslava occidental."
 wr_traditionalist_backlash:0 "Protesta monástica y boyarda"
 desc_wr_traditionalist_backlash:0 "Cofradías ortodoxas, ancianos de ermitas y magnates conservadores disputan reformas cancillerescas que aflojan el eslavo eclesiástico."
 wr_collective_concord:0 "Concordia de los tres círculos"
 desc_wr_collective_concord:0 "Cartas coordinadas entre coronas con cultura primaria, cortes que la aceptan y gobernadores fronterizos aseguran el respaldo diplomático del congreso."
 wr_cultural_ferment:0 "Fermento provincial sin resolver"
 desc_wr_cultural_ferment:0 "Las cortes vecinas ratificaron nuevas cartas mientras las autoridades locales se negaban, dividiendo a mercaderes y estamentos."
 opinion_wr_west_slavic_kinship:0 "Afinidad cívica eslava occidental"
 opinion_wr_west_ruthenian_separation:0 "Separación de pretensiones moscovitas"
 opinion_wr_collective_accord:0 "Acuerdo del congreso cultural"
 opinion_wr_collective_discord:0 "Discordia del congreso cultural"
 wr_tt_byelorussian_s2_index:0 "Índice global de adopción §Ybielaruski§! de al menos §Y60%§! (actual §Y[Root.wr_byelorussian_s1_pct.GetValue]%§!: §Y[Root.wr_byelorussian_s1_cnt.GetValue]§! de §Y[Root.wr_byelorussian_total.GetValue]§! provincias)."
